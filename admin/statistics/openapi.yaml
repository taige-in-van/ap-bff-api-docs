      summary: 导出 BD 销售排行（xlsx）
      description: |
        按所给筛选（同 `listSalesRankings`）导出，行集合、范围与列与列表一致：排名、销售、所属组织、结算币种、交易净额、退款金额、新增商户数。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesRankingFilter'
            example:
              from: '2026-10-01'
              to: '2026-10-31'
              partnerId: ptn_0031
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /direct-clearing-merchant-exports:
    post:
      tags:
        - direct-clearing-merchant-exports
      operationId: createDirectClearingMerchantExport
      x-required-privilege: stat:direct-clearing-export:create
      summary: 导出直清商户按月成交（xlsx）
      description: |
        所选月份区间（两端必填，月份按各商户自己的日界）内，本人数据范围内的商户每商户 × 月 × 支付方式一行：商户码、商户名、月份、支付方式、结算币种、成功收款笔数、成功收款金额。

        - 只出该商户该支付方式当前签约在直清通道上的组合；当前签约在非直清通道上的支付方式不出行。
        - 直清按当前签约判，过去的月份也按现签约出：改签到直清的，改签前的月份也出；改签离开直清的，此前月份也不出。
        - 笔数与金额是该商户该支付方式当月的全部成功收款；当月没有收款的组合不出行。
        - 区间含本月时，本月含今天的交易。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DirectClearingMerchantExportFilter'
            example:
              fromMonth: 2026-08
              toMonth: 2026-10
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /statistics-filter-options:
    get:
      tags:
        - statistics-filter-options
      operationId: getStatisticsFilterOptions
      x-required-privilege: session
      summary: 报表筛选候选（支付方式与通道）
      description: |
        平台交易报表、财务报表与通道流量的筛选候选，不分页：

        - `paymentMethods`：启用中的支付方式，按目录顺序。
        - `channels`：全部通道（含已停用的，带 `enabled`），带结算币种。

        受理入口的取值是固定枚举，不在本接口。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsFilterOptions'
              example:
                paymentMethods:
                  - paymentMethod: wechat_instore
                    displayName: WeChat Pay
                    paymentMethodFamily: wechat
                channels:
                  - channelId: CH0012
                    channelName: 微信 CAD 服务商
                    settleCurrency: CAD
                    enabled: true
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  parameters:
    Period:
      name: period
      in: query
      required: false
      description: 所选区间：`today` 今天 · `yesterday` 昨天 · `this_month` 本月 · `last_month` 上月 · `month` 选月（带 `month`）· `custom` 自选日期区间（带 `from` / `to`）。不传 = `today`。
      schema:
        $ref: '#/components/schemas/StatPeriod'
    FinancePeriod:
      name: period
      in: query
      required: true
      description: 财务报表的区间：`today` 今天 · `last_7_days` 近 7 天（截至昨天的 7 个完整日）· `this_month` 本月 · `last_month` 上月 · `custom` 自选日期区间（带 `from` / `to`）。
      schema:
        $ref: '#/components/schemas/FinancePeriodType'
    PeriodMonth:
      name: month
      in: query
      required: false
      description: '`period = month` 时必填，其余取值时不得传；缺、多传或格式不对 → `400`。'
      schema:
        $ref: '#/components/schemas/YearMonth'
    PeriodFrom:
      name: from
      in: query
      required: false
      description: 起始日期（含）。`period = custom` 时与 `to` 同为必填，其余取值时不得传；缺一端、多传或 `to` 早于 `from` → `400`。
      schema:
        $ref: '#/components/schemas/LocalDate'
    PeriodTo:
      name: to
      in: query
      required: false
      description: 截止日期（含）。规则同 `from`。
      schema:
        $ref: '#/components/schemas/LocalDate'
    FromDate:
      name: from
      in: query
      required: true
      description: 起始日期（含）。与 `to` 同为必填；`to` 早于 `from` → `400`。
      schema:
        $ref: '#/components/schemas/LocalDate'
    ToDate:
      name: to
      in: query
      required: true
      description: 截止日期（含）。
      schema:
        $ref: '#/components/schemas/LocalDate'
    FromSettlementDate:
      name: from
      in: query
      required: true
      description: 起始清算日（含）。与 `to` 同为必填；`to` 早于 `from` → `400`。
      schema:
        $ref: '#/components/schemas/LocalDate'
    ToSettlementDate:
      name: to
      in: query
      required: true
      description: 截止清算日（含）。
      schema:
        $ref: '#/components/schemas/LocalDate'
    FromMonth:
      name: fromMonth
      in: query
      required: true
      description: 起始月份（含）。与 `toMonth` 同为必填；`toMonth` 早于 `fromMonth` → `400`。
      schema:
        $ref: '#/components/schemas/YearMonth'
    ToMonth:
      name: toMonth
      in: query
      required: true
      description: 截止月份（含）。
      schema:
        $ref: '#/components/schemas/YearMonth'
    MonthRequired:
      name: month
      in: query
      required: true
      description: 所选月份。
      schema:
        $ref: '#/components/schemas/YearMonth'
    PaymentMethodFilter:
      name: paymentMethod
      in: query
      required: false
      description: 只看这个支付方式；候选取 `getStatisticsFilterOptions`。
      schema:
        $ref: '#/components/schemas/PaymentMethod'
    ChannelFilter:
      name: channelId
      in: query
      required: false
      description: 只看这个通道；候选取 `getStatisticsFilterOptions`。
      schema:
        $ref: '#/components/schemas/ChannelId'
    ChannelMultiFilter:
      name: channelId
      in: query
      required: false
      description: 只看这些通道，可多选；不传 = 全部。候选取 `getStatisticsFilterOptions`。
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ChannelId'
    EntryPointFilter:
      name: entryPoint
      in: query
      required: false
      description: 只看这些受理入口，可多选；不传 = 全部。插件订单汇总传 `plugin_shopify`、`plugin_allvalue`、`plugin_allvalue_xhs`。
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/EntryPoint'
    PartnerFilter:
      name: partnerId
      in: query
      required: false
      description: 只看此刻所属机构为该机构的商户；不传 = 不按机构筛。
      schema:
        $ref: '#/components/schemas/PartnerId'
    SalesPartnerFilter:
      name: partnerId
      in: query
      required: false
      description: 只看所属组织为该机构的销售；不传 = 不按机构筛。
      schema:
        $ref: '#/components/schemas/PartnerId'
    MerchantFilter:
      name: merchantId
      in: query
      required: false
      description: 只看这个商户。商户在本人数据范围外时结果为空。
      schema:
        $ref: '#/components/schemas/MerchantId'
    MerchantIdPath:
      name: merchantId
      in: path
      required: true
      description: 商户标识。不存在或不在本人数据范围内 → `404`。
      schema:
        $ref: '#/components/schemas/MerchantId'
    PartnerIdPath:
      name: partnerId
      in: path
      required: true
      description: 机构标识。不存在或不在本人可见范围内 → `404`。
      schema:
        $ref: '#/components/schemas/PartnerId'
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        页面当前的语言（BCP-47 语言标记，可带权重列表，如 `zh-CN,zh;q=0.9,en;q=0.8`）。服务端在本接口支持的语言里取最接近的一种（如 `fr-CA` → `fr`）；按它渲染什么、取不中时退到哪种语言，见所在面的说明。

        响应带 `Content-Language` 的接口，实际用的语言以该头为准。
      schema:
        type: string
        minLength: 2
        maxLength: 256
  schemas:
    StatPeriod:
      type: string
      enum:
        - today
        - yesterday
        - this_month
        - last_month
        - month
        - custom
      default: today
      description: 所选区间类型。
    FinancePeriodType:
      type: string
      enum:
        - today
        - last_7_days
        - this_month
        - last_month
        - custom
      description: 财务报表的区间类型。
    ComparisonBasis:
      type: string
      enum:
        - same_time_yesterday
        - last_month_same_period
        - preceding_period
      description: 对比基准：`same_time_yesterday` 昨日同时段（选今天时）· `last_month_same_period` 上月同期（选本月时）· `preceding_period` 紧邻的等长上期（其余；整自然月区间为前一个自然月）。
    ChannelRef:
      type: object
      additionalProperties: false
      description: 一个通道的标识与名称（报表行上展示「哪个通道」）。
      required:
        - channelId
        - channelName
      properties:
        channelId:
          $ref: '#/components/schemas/ChannelId'
        channelName:
          type: string
          minLength: 1
    TradeTotals:
      type: object
      additionalProperties: false
      description: 一个结算币种在一个区间内的交易总览。
      required:
        - paymentAmount
        - paymentCount
        - refundAmount
        - refundCount
        - netAmount
        - tradingMerchantCount
      properties:
        paymentAmount:
          $ref: '#/components/schemas/Money'
          description: 成功收款金额。
        paymentCount:
          type: integer
          minimum: 0
          description: 成功收款笔数。
        refundAmount:
          $ref: '#/components/schemas/Money'
          description: 退款金额（受理成功的退款减受理后失败的回冲）。
        refundCount:
          type: integer
          description: 退款笔数（受理成功的退款笔数减受理后失败的回冲笔数）。
        netAmount:
          $ref: '#/components/schemas/Money'
          description: 净额 = 成功收款金额减退款金额。
        tradingMerchantCount:
          type: integer
          minimum: 0
          description: 有交易商户数：区间内有成功收款的去重商户（按各商户自己的日界）。
    DashboardTradeOverview:
      type: object
      additionalProperties: false
      required:
        - comparisonBasis
        - items
      properties:
        comparisonBasis:
          $ref: '#/components/schemas/ComparisonBasis'
        items:
          type: array
          description: 每个结算币种一项。
          items:
            type: object
            additionalProperties: false
            required:
              - settleCurrency
              - current
              - previous
            properties:
              settleCurrency:
                $ref: '#/components/schemas/Currency'
              current:
                $ref: '#/components/schemas/TradeTotals'
                description: 本期。
              previous:
                $ref: '#/components/schemas/TradeTotals'
                description: 上期。
    DashboardTradeTrend:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: 每个结算币种一组。
          items:
            type: object
            additionalProperties: false
            required:
              - settleCurrency
              - days
            properties:
              settleCurrency:
                $ref: '#/components/schemas/Currency'
              days:
                type: array
                description: 按日期从先到后，无交易补 0。
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - date
                    - paymentAmount
                    - paymentCount
                  properties:
                    date:
                      $ref: '#/components/schemas/LocalDate'
                    paymentAmount:
                      $ref: '#/components/schemas/Money'
                    paymentCount:
                      type: integer
                      minimum: 0
    DashboardMerchantCounts:
      type: object
      additionalProperties: false
      required:
        - merchantCount
        - activatedMerchantCount
        - newlyActivatedCount
        - newlyQualifiedCount
      properties:
        merchantCount:
          type: integer
          minimum: 0
          description: 商户总数（未关户，含子商户）。
        activatedMerchantCount:
          type: integer
          minimum: 0
          description: 已激活商户数。
        newlyActivatedCount:
          type: integer
          minimum: 0
          description: 所选区间内新激活的商户数，含之后已关户的。
        newlyQualifiedCount:
          type: integer
          minimum: 0
          description: 本月新增达标商户数，含之后已关户的。
    EntryPointDistribution:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          description: 每个结算币种 × 受理入口一项；数据范围不是全部商户时不返回本键。
          items:
            type: object
            additionalProperties: false
            required:
              - settleCurrency
              - entryPoint
              - paymentAmount
            properties:
              settleCurrency:
                $ref: '#/components/schemas/Currency'
              entryPoint:
                $ref: '#/components/schemas/EntryPoint'
              paymentAmount:
                $ref: '#/components/schemas/Money'
    PaymentMethodFamilyDistribution:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: 每个结算币种 × 支付方式族一项。
          items:
            type: object
            additionalProperties: false
            required:
              - settleCurrency
              - paymentMethodFamily
              - paymentAmount
            properties:
              settleCurrency:
                $ref: '#/components/schemas/Currency'
              paymentMethodFamily:
                $ref: '#/components/schemas/PaymentMethodFamily'
              paymentAmount:
                $ref: '#/components/schemas/Money'
    DashboardMerchantRanking:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: 每个结算币种一份排行。
          items:
            type: object
            additionalProperties: false
            required:
              - settleCurrency
              - ranks
            properties:
              settleCurrency:
                $ref: '#/components/schemas/Currency'
              ranks:
                type: array
                description: 按成功收款金额从高到低。
                items:
                  type: object
                  additionalProperties: false
                  required:
                    - merchant
                    - paymentAmount
                    - paymentCount
                  properties:
                    merchant:
                      $ref: '#/components/schemas/MerchantBrief'
                    paymentAmount:
                      $ref: '#/components/schemas/Money'
                    paymentCount:
                      type: integer
                      minimum: 0
    MerchantTradeOverview:
      type: object
      additionalProperties: false
      required:
        - windowDays
        - paymentAmount
        - paymentCount
        - refundAmount
        - maxPaymentAmount
        - dailyAverageAmount
        - trendDays
        - trend
        - familyDistribution
        - unsettledAmount
      properties:
        windowDays:
          type: integer
          minimum: 1
          description: 概览窗口天数（含今天）。
        paymentAmount:
          $ref: '#/components/schemas/Money'
          description: 窗内成功收款金额。
        paymentCount:
          type: integer
          minimum: 0
          description: 窗内成功收款笔数。
        refundAmount:
          $ref: '#/components/schemas/Money'
          description: 窗内退款金额。
        maxPaymentAmount:
          $ref: '#/components/schemas/Money'
          description: 窗内最大单笔收款金额；窗内无收款为 0。
        dailyAverageAmount:
          $ref: '#/components/schemas/Money'
          description: 日均收款金额 = 窗内收款金额 ÷ `windowDays`。
        trendDays:
          type: integer
          minimum: 1
          description: 趋势窗口天数（含今天）。
        trend:
          type: array
          description: 按日期从先到后，无交易补 0。
          items:
            type: object
            additionalProperties: false
            required:
              - date
              - paymentAmount
            properties:
              date:
                $ref: '#/components/schemas/LocalDate'
              paymentAmount:
                $ref: '#/components/schemas/Money'
        familyDistribution:
          type: array
          description: 窗内按支付方式族的成功收款笔数；无收款为空数组。
          items:
            type: object
            additionalProperties: false
            required:
              - paymentMethodFamily
              - paymentCount
            properties:
              paymentMethodFamily:
                $ref: '#/components/schemas/PaymentMethodFamily'
              paymentCount:
                type: integer
                minimum: 0
        firstTradeDate:
          $ref: '#/components/schemas/LocalDate'
          description: 首次交易日期；从未交易不返回。
        lastTradeDate:
          $ref: '#/components/schemas/LocalDate'
          description: 最近交易日期（含今天）；从未交易不返回。
        unsettledAmount:
          $ref: '#/components/schemas/Money'
          description: 未清算金额 = 当前待结算（现值，同商户资金概览的「待结算」）；从未过账为 0。
    PlatformTradeMonthlyReportList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: 每月 × 结算币种一行，按月份从新到旧。
          items:
            $ref: '#/components/schemas/PlatformTradeMonthlyRow'
    PlatformTradeMonthlyRow:
      type: object
      additionalProperties: false
      required:
        - month
        - settleCurrency
        - paymentAmount
        - paymentCount
        - refundAmount
        - refundCount
        - netAmount
      properties:
        month:
          $ref: '#/components/schemas/YearMonth'
        settleCurrency:
          $ref: '#/components/schemas/Currency'
        paymentAmount:
          $ref: '#/components/schemas/Money'
          description: 成功收款金额。
        paymentCount:
          type: integer
          minimum: 0
          description: 成功收款笔数。
        refundAmount:
          $ref: '#/components/schemas/Money'
          description: 退款金额。
        refundCount:
          type: integer
          description: 退款笔数。
        netAmount:
          $ref: '#/components/schemas/Money'
          description: 净额。
        merchantFeeAmount:
          $ref: '#/components/schemas/Money'
          description: 商户手续费（收取减退回）；未算出不返回。
        channelCostAmount:
          $ref: '#/components/schemas/Money'
          description: 通道成本（按费率估算）；未算出不返回。
        platformRetainedAmount:
          $ref: '#/components/schemas/Money'
          description: 平台留存 = 商户手续费减通道成本；二者任一未算出不返回。
        tradingMerchantCount:
          type: integer
          minimum: 0
          description: 有交易商户数；按通道或受理入口筛选时不返回。
    PlatformTradeDailyReportList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          description: 每日 × 结算币种一行，按日期从新到旧。
          items:
            $ref: '#/components/schemas/PlatformTradeDailyRow'
    PlatformTradeDailyRow:
      type: object
      additionalProperties: false
      required:
        - date
        - settleCurrency
        - paymentAmount
        - paymentCount
        - refundAmount
        - refundCount
        - netAmount
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        settleCurrency:
          $ref: '#/components/schemas/Currency'
        paymentAmount:
          $ref: '#/components/schemas/Money'
          description: 成功收款金额。
        paymentCount:
          type: integer
          minimum: 0
          description: 成功收款笔数。
        refundAmount:
          $ref: '#/components/schemas/Money'
          description: 退款金额。
        refundCount:
          type: integer
          description: 退款笔数。
        netAmount:
          $ref: '#/components/schemas/Money'
          description: 净额。
        merchantFeeAmount:
          $ref: '#/components/schemas/Money'
