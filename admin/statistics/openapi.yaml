openapi: 3.1.0
info:
  title: 管理后台 统计分析 — 前端契约面
  version: 2.0.1
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的统计分析契约：运营首页（交易总览与对比、趋势、商户数、支付来源与支付方式族分布、交易排行），商户概览，平台交易报表，财务报表，通道流量，清算统计、逐日序列与按日导出，清算金额趋势与月历，月度清算报表，授信退款商户，机构与 BD 销售排行与导出，直清商户 × 月导出。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。本面全部是读。

    **金额口径**：金额是对应币种最小单位的整数串，带币种，一律是结算币种。不同结算币种分组给出，不跨币种相加、不折算。退款金额 = 受理成功的退款减受理后失败的回冲；净额 = 成功收款金额减退款金额。通道成本是按费率估算的成本，不是通道声明的手续费。

    **「未配置」**：一格所依据的、已生成清结算明细的交易里有一笔商户手续费尚未算出（含未配费率）或缺通道成本（未配成本率），该格不返回；依赖它的平台留存、渠道手续费、平台手续费、清算总额也不返回。页面在这些格显示「未配置」，其余列照常；导出文件里这些格写「未配置」。手续费在成交后很快算出，当天刚成交的交易可能短暂显示「未配置」。清算类统计只含已算好手续费的交易，商户手续费恒有值，只有通道成本可能未配置。直清通道的交易不产生商户手续费与通道成本，计 0、不算未配置。尚未生成清结算明细的交易不计入当期的商户手续费与通道成本（当天的数随之变化），也不算未配置。

    **日期口径**：

    - 日期按字面收发（同基础约定「日期」）。平台交易报表、财务报表、通道流量与全部商户范围下的运营首页按平台的日界；带商户粒度的统计（商户概览、交易排行、有交易商户数、数据范围不是全部商户时的运营首页、机构与 BD 排行、直清商户导出）按各商户自己的日界；清算类统计按清算日。同一笔交易在两种日界下可落不同日期，两边按日对比不相等属正常。
    - 新增商户（按激活时刻）与新增达标商户一律按平台的日界，任何数据范围都一样。
    - 「今天」「昨天」「本月」「上月」「近 7 天」由服务端在每次查询时求出；近 7 天 = 截至昨天的 7 个完整日。按各商户日界的统计里，各商户按各自的今天求，跨商户合计没有单一的「今天」边界。
    - 当天的交易实时计入；已结束的日子为日终汇总。
    - 日期或月份区间两端必填的，缺一端、`to` 早于 `from` → `400`。区间跨度不设上限。

    **可见范围**：平台交易报表、财务报表、通道流量、清算金额趋势与月历、月度清算报表是平台级页面，只看功能权限。运营首页、商户概览、清算统计（含逐日序列与按日导出）、授信退款商户、直清商户导出按本人数据范围求值：范围外商户不计入任何合计、计数与排行，按标识访问一律 `404`。机构销售排行与机构详情只出本人可见的机构（全部商户 → 全部机构；所属机构 → 所属机构及其直接下级；本人名下 → 无机构），BD 销售排行与导出只出本人可见的销售（全部商户 → 全部；所属机构 → 所属组织为所属机构及其直接下级的销售；本人名下 → 本人）；可见机构或销售之下的商户不再按商户过滤，跨范围临时授权不作用于排行。

    **导出**：导出与页面同范围、同口径、同列，同步返回 xlsx 文件流，表头与文案按 `Accept-Language`、实际用的语言经 `Content-Language` 回。按读处理，不挂幂等键；带 `X-CSRF-Token`。

    **操作审计**：查询、详情与导出都不记操作审计。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: dashboard
    x-displayName: 运营首页
    description: 交易总览与对比、交易趋势、商户数、支付来源分布、支付方式族分布、交易排行。
  - name: merchant-trade-overview
    x-displayName: 商户概览
    description: 单个商户近期的交易概览。
  - name: platform-trade-reports
    x-displayName: 平台交易报表
    description: 按月与按日的平台交易报表。
  - name: finance-reports
    x-displayName: 财务报表
    description: 按通道与支付方式的商户手续费收入、通道成本与平台留存。
  - name: channel-traffic
    x-displayName: 通道流量
    description: 按日 × 支付方式 × 通道的成交与占比。
  - name: settlement-statistics
    x-displayName: 清算统计
    description: 结算单的汇总、按商户分组、逐日序列与按日导出。
  - name: settlement-amount-trend
    x-displayName: 清算金额趋势
    description: 按清算日 × 结算周期档位的出款额。
  - name: monthly-settlement-reports
    x-displayName: 月度清算报表
    description: 所选月每个清算日一行。
  - name: credit-refund-merchants
    x-displayName: 授信退款商户
    description: 授信额度大于 0 的商户与其授信使用情况。
  - name: partner-sales-rankings
    x-displayName: 机构销售
    description: 机构销售排行、机构下商户排行与机构详情交易统计。
  - name: sales-rankings
    x-displayName: BD 销售
    description: BD 销售排行与导出。
  - name: direct-clearing-merchant-exports
    x-displayName: 直清商户导出
    description: 当前签约在直清通道上的商户支付方式，按月导出成功收款。
  - name: statistics-filter-options
    x-displayName: 筛选候选
    description: 报表的支付方式与通道筛选候选。
paths:
  /dashboard/trade-overview:
    get:
      tags:
        - dashboard
      operationId: getDashboardTradeOverview
      x-required-privilege: stat:dashboard-trade:view
      summary: 运营首页交易总览与对比
      description: |
        所选区间的交易总览，每个结算币种一项：成功收款金额与笔数、退款金额与笔数、净额、有交易商户数（区间内有成功收款的去重商户，按各商户自己的日界），并给上期同项与对比基准 `comparisonBasis`。

        上期怎么取：

        - `today`：较昨日同时段（昨天从日始到与此刻同一钟点）。
        - `this_month`：较上月同期（上月 1 日到与今天同号的那天，上月没有该号取上月末日）。
        - 其余：较紧邻的等长上期；`last_month`、`month`，以及正好是一个整自然月（某月 1 日到该月末日）的 `custom`，上期是前一个自然月；其余是紧邻其前、天数相同的区间。

        变化率由前端按两值算，上期为 0 时不显示变化率。只在本期或上期出现过的币种也给一项，另一边各值为 0。
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/PeriodMonth'
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTradeOverview'
              example:
                comparisonBasis: same_time_yesterday
                items:
                  - settleCurrency: CAD
                    current:
                      paymentAmount:
                        amount: '1250000'
                        currency: CAD
                      paymentCount: 420
                      refundAmount:
                        amount: '30000'
                        currency: CAD
                      refundCount: 6
                      netAmount:
                        amount: '1220000'
                        currency: CAD
                      tradingMerchantCount: 88
                    previous:
                      paymentAmount:
                        amount: '1100000'
                        currency: CAD
                      paymentCount: 401
                      refundAmount:
                        amount: '12000'
                        currency: CAD
                      refundCount: 3
                      netAmount:
                        amount: '1088000'
                        currency: CAD
                      tradingMerchantCount: 85
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /dashboard/trade-trend:
    get:
      tags:
        - dashboard
      operationId: listDashboardTradeTrend
      x-required-privilege: stat:dashboard-trade:view
      summary: 运营首页交易趋势
      description: |
        截至昨天的近 N 个完整日（N 由平台设定，默认 30）按日的成功收款金额与笔数，每个结算币种一组，按日期从先到后；无交易的日子补 0。今天不在趋势里。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTradeTrend'
              example:
                items:
                  - settleCurrency: CAD
                    days:
                      - date: '2026-11-06'
                        paymentAmount:
                          amount: '1180000'
                          currency: CAD
                        paymentCount: 402
                      - date: '2026-11-07'
                        paymentAmount:
                          amount: '0'
                          currency: CAD
                        paymentCount: 0
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /dashboard/merchant-counts:
    get:
      tags:
        - dashboard
      operationId: getDashboardMerchantCounts
      x-required-privilege: stat:dashboard:view
      summary: 运营首页商户数
      description: |
        可见范围内的商户数。商户总数与已激活商户数按当前状态计、不含已关户商户、不随所选区间回溯；两项新增按发生计，含之后已关户的商户：

        - `merchantCount`：商户总数（未关户，含子商户）。
        - `activatedMerchantCount`：已激活商户数。
        - `newlyActivatedCount`：激活时刻落在所选区间内的商户数（区间按平台的日界）；所选区间只作用于本项。
        - `newlyQualifiedCount`：本月新增达标商户数（达标的清算日落在本月）。

        两项新增都按平台的日界，数据范围不是全部商户时也一样。
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/PeriodMonth'
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMerchantCounts'
              example:
                merchantCount: 3120
                activatedMerchantCount: 2875
                newlyActivatedCount: 4
                newlyQualifiedCount: 17
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /dashboard/entry-point-distribution:
    get:
      tags:
        - dashboard
      operationId: listDashboardEntryPointDistribution
      x-required-privilege: stat:dashboard-trade:view
      summary: 运营首页支付来源分布
      description: |
        所选区间按受理入口的成功收款金额，每个结算币种 × 受理入口一项；各入口之和 = 总览的收款金额。

        只对全部商户范围出：数据范围不是全部商户时不返回 `items`，页面不显示该分布。
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/PeriodMonth'
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryPointDistribution'
              example:
                items:
                  - settleCurrency: CAD
                    entryPoint: pos
                    paymentAmount:
                      amount: '820000'
                      currency: CAD
                  - settleCurrency: CAD
                    entryPoint: plugin_shopify
                    paymentAmount:
                      amount: '430000'
                      currency: CAD
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /dashboard/payment-method-distribution:
    get:
      tags:
        - dashboard
      operationId: listDashboardPaymentMethodDistribution
      x-required-privilege: stat:dashboard-trade:view
      summary: 运营首页支付方式族分布
      description: |
        所选区间按支付方式族的成功收款金额，每个结算币种 × 族一项；各族之和 = 总览的收款金额。已停用的支付方式，其历史交易照常归入所属族。任一数据范围都出。
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/PeriodMonth'
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodFamilyDistribution'
              example:
                items:
                  - settleCurrency: CAD
                    paymentMethodFamily: wechat
                    paymentAmount:
                      amount: '900000'
                      currency: CAD
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /dashboard/merchant-ranking:
    get:
      tags:
        - dashboard
      operationId: listDashboardMerchantRanking
      x-required-privilege: stat:dashboard-trade:view
      summary: 运营首页交易排行
      description: |
        所选区间按成功收款金额降序的前 N 个商户（N 由平台设定，默认 10），每个结算币种各一份排行；有成交的商户不足 N 家时有几家出几家。按各商户自己的日界。点一行进该商户详情。
      parameters:
        - $ref: '#/components/parameters/Period'
        - $ref: '#/components/parameters/PeriodMonth'
        - $ref: '#/components/parameters/PeriodFrom'
        - $ref: '#/components/parameters/PeriodTo'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardMerchantRanking'
              example:
                items:
                  - settleCurrency: CAD
                    ranks:
                      - merchant:
                          merchantId: mch_8801
                          merchantName: Maple Tea House
                        paymentAmount:
                          amount: '260000'
                          currency: CAD
                        paymentCount: 57
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}/trade-overview:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      tags:
        - merchant-trade-overview
      operationId: getMerchantTradeOverview
      x-required-privilege: stat:merchant-overview:view
      summary: 商户概览
      description: |
        单个商户的近期交易概览，按该商户自己的日界、结算币种；窗口截至今天，今天的交易计入。

        - 近 `windowDays` 天（平台设定，默认 30）：成功收款金额与笔数、退款金额、最大单笔收款、日均收款金额（= 窗内收款金额 ÷ `windowDays`，四舍五入到最小币种单位），以及按支付方式族的成功收款笔数分布。
        - 近 `trendDays` 天（平台设定，默认 14）按日的收款金额趋势，无交易的日子补 0，按日期从先到后。
        - 首次与最近交易日期（含今天）；从未交易的不返回这两项，金额与笔数为 0。
        - 结算额待定的收款计入笔数，不计入金额与最大单笔。
        - 未清算金额 `unsettledAmount` = 该商户当前的待结算，与清算结算页商户资金概览的「待结算」同口径、同为现值。

        商户不存在或不在本人数据范围内 → `404`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantTradeOverview'
              example:
                windowDays: 30
                paymentAmount:
                  amount: '300000'
                  currency: CAD
                paymentCount: 120
                refundAmount:
                  amount: '5000'
                  currency: CAD
                maxPaymentAmount:
                  amount: '12800'
                  currency: CAD
                dailyAverageAmount:
                  amount: '10000'
                  currency: CAD
                trendDays: 14
                trend:
                  - date: '2026-11-07'
                    paymentAmount:
                      amount: '9800'
                      currency: CAD
                  - date: '2026-11-08'
                    paymentAmount:
                      amount: '0'
                      currency: CAD
                familyDistribution:
                  - paymentMethodFamily: wechat
                    paymentCount: 30
                  - paymentMethodFamily: alipay
                    paymentCount: 90
                firstTradeDate: '2025-03-02'
                lastTradeDate: '2026-11-07'
                unsettledAmount:
                  amount: '41200'
                  currency: CAD
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /platform-trade-reports/monthly:
    get:
      tags:
        - platform-trade-reports
      operationId: listPlatformTradeMonthlyReports
      x-required-privilege: stat:platform-trade-report:view
      summary: 平台交易报表（按月）
      description: |
        所选月份区间每月 × 结算币种一行，按月份从新到旧；当月行含今天的交易。列：成功收款金额与笔数、退款金额与笔数、净额、商户手续费（收取减退回）、通道成本、平台留存（手续费减通道成本）、有交易商户数。

        - 可按支付方式、通道、受理入口（可多选；插件订单汇总 = 预置插件类入口）筛选。
        - 按通道或受理入口筛选时不返回 `tradingMerchantCount`：有交易商户数按各商户自己的日界计、不分通道与入口；其余列按平台的日界，页面口径说明里声明。
      parameters:
        - $ref: '#/components/parameters/FromMonth'
        - $ref: '#/components/parameters/ToMonth'
        - $ref: '#/components/parameters/PaymentMethodFilter'
        - $ref: '#/components/parameters/ChannelFilter'
        - $ref: '#/components/parameters/EntryPointFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTradeMonthlyReportList'
              example:
                items:
                  - month: 2026-10
                    settleCurrency: CAD
                    paymentAmount:
                      amount: '35200000'
                      currency: CAD
                    paymentCount: 12010
                    refundAmount:
                      amount: '410000'
                      currency: CAD
                    refundCount: 95
                    netAmount:
                      amount: '34790000'
                      currency: CAD
                    merchantFeeAmount:
                      amount: '620000'
                      currency: CAD
                    channelCostAmount:
                      amount: '240000'
                      currency: CAD
                    platformRetainedAmount:
                      amount: '380000'
                      currency: CAD
                    tradingMerchantCount: 910
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /platform-trade-reports/daily:
    get:
      tags:
        - platform-trade-reports
      operationId: listPlatformTradeDailyReports
      x-required-privilege: stat:platform-trade-report:view
      summary: 平台交易报表（月内按日）
      description: |
        所选月内每日 × 结算币种一行（月行展开），按日期从新到旧；无交易的日子不出行。列与筛选同按月报表；金额与笔数类各列的各日之和 = 月行，有交易商户数按日去重、月行是月内去重，不等于各日之和。
      parameters:
        - $ref: '#/components/parameters/MonthRequired'
        - $ref: '#/components/parameters/PaymentMethodFilter'
        - $ref: '#/components/parameters/ChannelFilter'
        - $ref: '#/components/parameters/EntryPointFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformTradeDailyReportList'
              example:
                items:
                  - date: '2026-10-31'
                    settleCurrency: CAD
                    paymentAmount:
                      amount: '1200000'
                      currency: CAD
                    paymentCount: 401
                    refundAmount:
                      amount: '9000'
                      currency: CAD
                    refundCount: 2
                    netAmount:
                      amount: '1191000'
                      currency: CAD
                    merchantFeeAmount:
                      amount: '21000'
                      currency: CAD
                    tradingMerchantCount: 312
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /finance-reports/summary:
    get:
      tags:
        - finance-reports
      operationId: getFinanceReportSummary
      x-required-privilege: stat:finance-report:view
      summary: 财务报表合计与按通道分组
      description: |
