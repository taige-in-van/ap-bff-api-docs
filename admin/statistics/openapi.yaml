        - 清算日、结算币种；
        - 区间内出现过的每个支付方式各一列商户手续费、各一列通道成本（取结算单按支付方式的小计；列按支付方式目录顺序，已停用的排最后）；
        - 销售净额、通道结算到账（该日为通道结算日的通道声明净额，同结算币种；只在本人数据范围为全部商户、且不带机构与商户筛选时出，数据范围不是全部商户或带了机构 / 商户筛选时本列不出）、出款额。

