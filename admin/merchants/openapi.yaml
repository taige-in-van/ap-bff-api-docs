        **全量覆盖**：请求体就是目标本身，`value` 与 `version` 都要传，缺省不代表保持原样。

        **什么时候拒绝**：

        - `308311` `version` 不是读到时的那个（别人已经改过），重读列表再决定是否重改。
        - `value` 的类型或取值不合该参数的值域 → `400`，由 `details` 定位到 `value`。
        - 参数不存在或不允许代配 → `404`。

        **重复提交**：不带幂等键。上一次其实已经成功、响应丢了再提交，会因版本已变得到 `308311`，重读即可看到上次写入的值。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantSettingWrite'
            examples:
              setValue:
                summary: 改值
                value:
                  value:
                    numberValue: 7
                  version: 1
              restoreDefault:
                summary: 恢复默认
                value:
                  value: null
                  version: 2
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308311
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  parameters:
    MerchantIdPath:
      name: merchantId
      in: path
      required: true
      description: 商户标识。商户在本人数据范围外或已关户 → `404`。
      schema:
        $ref: '#/components/schemas/MerchantId'
    MemberUserId:
      name: userId
      in: path
      required: true
      description: 成员的用户标识。不是该商户的在册成员 → `404`。
      schema:
        $ref: '#/components/schemas/UserId'
    KeyAccountFilter:
      name: keyAccount
      in: query
      required: false
      description: '`true` 只列 KA 商户（KA 等级大于 0）/ `false` 只列普通商户；不传 = 不按 KA 筛。'
      schema:
        type: boolean
    MerchantKeyword:
      name: keyword
      in: query
      required: false
      description: 按商户码、别名商户码、经营名、法定名、归属 BD 的显示名包含匹配。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    MerchantSortField:
      name: sortField
      in: query
      required: false
      description: 排序字段。不传 = 不排序；页面默认顺序由前端显式传。按 `activatedAt` 排序时未激活的恒在末尾。
      schema:
        type: string
        enum:
          - createdAt
          - activatedAt
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        页面当前的语言（BCP-47 语言标记，可带权重列表，如 `zh-CN,zh;q=0.9,en;q=0.8`）。服务端在本接口支持的语言里取最接近的一种（如 `fr-CA` → `fr`）；按它渲染什么、取不中时退到哪种语言，见所在面的说明。

        响应带 `Content-Language` 的接口，实际用的语言以该头为准。
      schema:
        type: string
        minLength: 2
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
  schemas:
    MerchantDocumentId:
      type: string
      minLength: 1
      maxLength: 32
      description: 资料标识。
    SettingKey:
      type: string
      minLength: 1
      maxLength: 128
      description: 参数标识，按所属业务分前缀（如 `transaction.cashier-query-days`）。
    MerchantStatus:
      type: string
      enum:
        - PENDING_ACTIVATION
        - ACTIVE
        - FROZEN
      description: 商户状态：`PENDING_ACTIVATION` 待激活（入驻尚未通过审核）/ `ACTIVE` 已激活 / `FROZEN` 已冻结。已关户的商户不出现。
    GovernanceTier:
      type: string
      enum:
        - normal
        - frozen
      description: 治理档位（界面档位名，由商户状态派生）：`normal` 正常（已激活）/ `frozen` 冻结。待激活的商户没有档位。
    SignupSource:
      type: string
      enum:
        - self_service
        - admin_portal
      description: 开户来源：`self_service` 商户自助注册 / `admin_portal` 管理后台代客建档。
    MerchantDocumentType:
      type: string
      enum:
        - void_cheque
        - owner_id
        - incorporation_certificate
        - store_inside
        - store_outside
        - office_photo
        - contract
        - application_form
        - other
      description: 资料类型：`void_cheque` 作废支票 / `owner_id` Owner 证件 / `incorporation_certificate` 营业执照 / `store_inside` 门店内照 / `store_outside` 门店外照 / `office_photo` 办公室照片 / `contract` 合同 / `application_form` 申请表 / `other` 其他。`office_photo` 与 `other` 可多份，其余每个商户一份。
    MerchantListFilter:
      type: object
      additionalProperties: false
      description: 商户列表的筛选，与 `listMerchants` 的同名查询参数同义；不传的项不筛。
      properties:
        status:
          type: array
          items:
            $ref: '#/components/schemas/MerchantStatus'
        keyAccount:
          type: boolean
          description: '`true` 只要 KA 商户 / `false` 只要普通商户。'
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        bdUserId:
          $ref: '#/components/schemas/UserId'
        keyword:
          type: string
          minLength: 1
          maxLength: 128
        sortField:
          type: string
          enum:
            - createdAt
            - activatedAt
        sortOrder:
          type: string
          enum:
            - ascend
            - descend
    MerchantSummary:
      type: object
      x-parent: true
      description: 商户列表的一行。
      required:
        - merchantId
        - merchantCode
        - status
        - keyAccountLevel
        - signupSource
        - createdAt
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
          readOnly: true
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
          readOnly: true
        merchantCodeAlias:
          $ref: '#/components/schemas/MerchantCode'
          description: 别名商户码；没有不返回本键。
        tradeName:
          type: string
          minLength: 1
          description: 对外经营名；还没填过不返回本键。
        legalBusinessName:
          type: string
          minLength: 1
          description: 法定名；还没填过不返回本键。
        status:
          $ref: '#/components/schemas/MerchantStatus'
        governanceTier:
          $ref: '#/components/schemas/GovernanceTier'
          description: 治理档位；待激活的商户不返回本键。
        keyAccountLevel:
          type: integer
          minimum: 0
          description: KA 等级；`0` = 普通。
        partnerId:
          $ref: '#/components/schemas/PartnerId'
          description: 所属机构；不属任何机构不返回本键。
        bdUser:
          $ref: '#/components/schemas/UserRef'
          description: 归属 BD；没有不返回本键。
        signupSource:
          $ref: '#/components/schemas/SignupSource'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          readOnly: true
        activatedAt:
          $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 激活时刻；未激活不返回本键。
    MerchantDetail:
      type: object
      description: 商户详情 = 列表行 + 下列字段。
      allOf:
        - $ref: '#/components/schemas/MerchantSummary'
        - type: object
          required:
            - profile
            - owner
            - documents
            - children
          properties:
            profile:
              $ref: '#/components/schemas/MerchantProfile'
            owner:
              $ref: '#/components/schemas/MerchantOwnerContact'
            settlement:
              $ref: '#/components/schemas/MerchantSettlement'
              description: 当前生效的结算信息；还没有结算账户、或结算由通道方执行的商户不返回本键。
            documents:
              type: array
              description: 资料文件，没有则为空数组。
              items:
                $ref: '#/components/schemas/MerchantDocument'
            parent:
              $ref: '#/components/schemas/RelatedMerchant'
              description: 父商户；主商户不返回本键。
            children:
              type: array
              description: 子商户，没有则为空数组。
              items:
                $ref: '#/components/schemas/RelatedMerchant'
            inactiveMonths:
              type: integer
              minimum: 0
              description: 距最后一笔交易的整月数；从未有过交易不返回本键。
    MerchantProfile:
      type: object
      additionalProperties: false
      description: 商户档案。字段名与取值同商户入驻 Business 步；没有的不返回本键。
      required:
        - homeOffice
        - businessDayCutoffHour
      properties:
        typeOfOwnership:
          $ref: '#/components/schemas/OwnershipType'
        registrationNumber:
          type: string
          minLength: 1
        referredBy:
          type: string
          minLength: 1
        industryCategory:
          type: string
          minLength: 1
          description: 行业大类码，如 `A0`。
        mcc:
          type: string
          minLength: 1
          description: 四位 MCC。
        businessAddress:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        province:
          type: string
          minLength: 1
          description: ISO 3166-2 的地区部分（如 `ON`）。
        postalCode:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
          description: ISO 3166-1 alpha-2。
        businessPhone:
          $ref: '#/components/schemas/Phone'
        websiteUrl:
          $ref: '#/components/schemas/WebsiteUrl'
        typeOfOnlineService:
          $ref: '#/components/schemas/OnlineServiceType'
        homeOffice:
          type: boolean
          description: 是否家庭办公。
        timeZone:
          type: string
          minLength: 1
          description: 商户时区，IANA 标识（如 `America/Toronto`）。
        businessDayCutoffHour:
          type: integer
          minimum: 0
          maximum: 23
          description: 营业日切点，商户当地整点。
        language:
          allOf:
            - $ref: '#/components/schemas/Language'
          description: 商户语言：发给商户的通知按它出。
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: 结算币种。
    MerchantOwnerContact:
      type: object
      additionalProperties: false
      description: 商户 Owner 的联系人资料。
      required:
        - userId
        - email
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        firstName:
          type: string
          minLength: 1
          description: 名；没填过不返回本键。
        lastName:
          type: string
          minLength: 1
          description: 姓；没填过不返回本键。
        email:
          type: string
          format: email
          description: Owner 登录邮箱。
        phone:
          $ref: '#/components/schemas/Phone'
          description: 电话；没填过不返回本键。
    MerchantSettlement:
      type: object
      additionalProperties: false
      description: 当前生效的结算信息；账号只给末 4 位掩码。
      required:
        - accountHolderName
        - bankName
        - bankAccount
      properties:
        accountHolderName:
          type: string
          minLength: 1
          maxLength: 128
          description: 户名。
        bankName:
          type: string
          minLength: 1
        bankAccount:
          allOf:
            - $ref: '#/components/schemas/BankAccountIdentification'
          description: 结算银行账户，账号只给 `accountNumberMasked`。
        settlementCycle:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 结算周期档位 code。
        settlementCycleDisplayName:
          type: string
          minLength: 1
          description: 结算周期的展示名；与 `settlementCycle` 同进退。
        storeId:
          $ref: '#/components/schemas/StoreId'
          description: 店铺编号；没有不返回本键。
    MerchantDocument:
      type: object
      additionalProperties: false
      description: 一份资料文件。
      required:
        - documentId
        - documentType
        - fileId
        - fileName
      properties:
        documentId:
          $ref: '#/components/schemas/MerchantDocumentId'
        documentType:
          $ref: '#/components/schemas/MerchantDocumentType'
        fileId:
          $ref: '#/components/schemas/FileId'
        fileName:
          type: string
          minLength: 1
        expiresAt:
          $ref: '#/components/schemas/LocalDate'
          description: 资料到期日；没填不返回本键。
    RelatedMerchant:
      type: object
      additionalProperties: false
      description: 主子关系里的另一家商户。
      required:
        - merchantId
        - merchantCode
        - relationType
        - status
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        tradeName:
          type: string
          minLength: 1
          description: 对外经营名；没有不返回本键。
        relationType:
          type: string
          enum:
            - BRANCH
            - NEW_LEGAL_ENTITY
          description: 子商户与父商户的关系：`BRANCH` 分店 / `NEW_LEGAL_ENTITY` 新法人主体；建立后不再变动。
        status:
          $ref: '#/components/schemas/MerchantStatus'
    ImpersonationLanding:
      type: object
      additionalProperties: false
      required:
        - landingUrl
        - expiresAt
      properties:
        landingUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 商户后台的一次性进入地址，新开窗口打开；不要持久化、不要分享。
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: 进入地址到期的时刻。
    MerchantProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 改运营资料，只传要改的；能清空的字段传 `null` 即清空。
      properties:
        legalBusinessName:
          type: string
          minLength: 1
          maxLength: 128
        tradeName:
          type: string
          minLength: 1
          maxLength: 128
        typeOfOwnership:
          $ref: '#/components/schemas/OwnershipType'
        registrationNumber:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
        referredBy:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 128
        industryCategory:
          type: string
          minLength: 1
          description: 行业大类码，取 `/config/industries`。
        mcc:
          type: string
          minLength: 1
          description: 四位 MCC，级联所选行业。
        businessAddress:
          type: string
          minLength: 1
          maxLength: 256
        city:
          type: string
          minLength: 1
          maxLength: 64
        province:
          type:
            - string
            - 'null'
          minLength: 1
          description: 取自 `/config/countries` 里商户所在国的 `provinces[].code`；所在国没有省 / 州时传 `null`。
        postalCode:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 16
        businessPhone:
          $ref: '#/components/schemas/Phone'
        websiteUrl:
          oneOf:
            - $ref: '#/components/schemas/WebsiteUrl'
            - type: 'null'
          description: 经营网址；`null` = 清空。
        typeOfOnlineService:
          oneOf:
            - $ref: '#/components/schemas/OnlineServiceType'
            - type: 'null'
          description: 线上服务类型；`null` = 清空。
        homeOffice:
          type: boolean
          description: 是否家庭办公；改为否时商户须已有办公室照片。
        merchantCodeAlias:
          oneOf:
            - $ref: '#/components/schemas/MerchantCode'
            - type: 'null'
          description: 别名商户码；`null` = 清空。
    BankAccountInput:
      description: 写入的结算银行账户：在 `BankAccountIdentification` 之上账号必填（明文 write-only）。
      required:
        - accountNumber
      allOf:
        - $ref: '#/components/schemas/BankAccountIdentification'
    MerchantSettlementAccountInput:
      type: object
      additionalProperties: false
      description: 整组提交的新结算账户。
      required:
        - accountHolderName
        - bankName
        - bankAccount
        - voidChequeFileId
      properties:
        accountHolderName:
          type: string
          minLength: 1
          maxLength: 128
          description: 户名。
        bankName:
          type: string
          minLength: 1
          maxLength: 128
        bankAccount:
          $ref: '#/components/schemas/BankAccountInput'
        storeId:
          $ref: '#/components/schemas/StoreId'
          description: 店铺编号；不传 = 无。
        voidChequeFileId:
          $ref: '#/components/schemas/FileId'
          description: '`uploadMerchantFile`（用途 `void_cheque`）返回的 `fileId`。'
    MerchantSettlementUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 直改结算，只放要改的，至少一项。
      properties:
        account:
          $ref: '#/components/schemas/MerchantSettlementAccountInput'
        settlementCycle:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 新的结算周期档位 code，取自 `/config/settlement` 的 `settlementCycleOptions`。
    MerchantOperatingAttributesUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 改日切时刻或 KA 等级，只传要改的。
      properties:
        businessDayCutoffHour:
          type: integer
          minimum: 0
          maximum: 23
          description: 营业日切点，商户当地整点。
        keyAccountLevel:
          type: integer
          minimum: 0
          description: KA 等级；`0` = 普通。
    MerchantDocumentCreate:
      type: object
      additionalProperties: false
      required:
        - documentType
        - fileId
      properties:
        documentType:
          $ref: '#/components/schemas/MerchantDocumentType'
        fileId:
          $ref: '#/components/schemas/FileId'
          description: '`uploadMerchantFile` 返回的 `fileId`。'
        expiresAt:
          $ref: '#/components/schemas/LocalDate'
          description: 资料到期日；不传 = 无。
    MerchantDocumentUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 替换资料，只传要改的。
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
          description: 换成的新文件，`uploadMerchantFile` 返回的 `fileId`。
        expiresAt:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
          description: 资料到期日；`null` = 清空。
    MemberAccountStatus:
      type: string
      enum:
        - PENDING_VERIFICATION
        - INVITED
        - ACTIVE
        - DISABLED
      description: 成员账号状态：`PENDING_VERIFICATION` 已设密码、登录邮箱待验证（自助注册的 Owner 验证邮箱前）/ `INVITED` 已邀请、尚未设密 / `ACTIVE` 正常 / `DISABLED` 已停用，全平台不能登录。
    MemberRoleRef:
      type: object
      additionalProperties: false
      required:
        - roleId
        - name
      properties:
        roleId:
          $ref: '#/components/schemas/RoleId'
        name:
          type: string
          minLength: 1
          maxLength: 64
    MerchantMember:
      type: object
      additionalProperties: false
      description: 商户的一个在册成员。
      required:
        - userId
        - loginId
        - displayName
        - roles
        - status
        - isOwner
        - mfaEnrolled
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        loginId:
          $ref: '#/components/schemas/LoginId'
          description: 登录名：邮箱或用户名。
        displayName:
          type: string
          minLength: 1
        roles:
          type: array
          description: 在本商户所持的角色。
          items:
            $ref: '#/components/schemas/MemberRoleRef'
        status:
          $ref: '#/components/schemas/MemberAccountStatus'
        isOwner:
          type: boolean
        mfaEnrolled:
          type: boolean
          description: 验证器是否已绑定。
        wechat:
          $ref: '#/components/schemas/WechatBindingSummary'
          description: 该成员的微信登录绑定；未绑定不返回本键。
        lastLoginAt:
          $ref: '#/components/schemas/Timestamp'
          description: 最近一次登录成功的时刻；从未登录不返回本键。
        pendingLoginEmail:
          type: string
          format: email
          description: 已发起、待确认的新登录邮箱；没有在途的改动不返回本键。
    MerchantMemberCreate:
      type: object
      additionalProperties: false
      required:
        - email
        - displayName
        - roleIds
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 登录邮箱，邀请邮件发到这里。
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        roleIds:
          type: array
          minItems: 1
          description: 角色，取 `listMerchantMemberRoleOptions`。
          items:
            $ref: '#/components/schemas/RoleId'
    MerchantMemberCreated:
      type: object
      additionalProperties: false
      required:
        - userId
        - status
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        status:
          $ref: '#/components/schemas/MemberAccountStatus'
    MerchantSetting:
      type: object
      additionalProperties: false
      description: 一个商户级设置。
      required:
        - key
        - displayName
        - valueType
        - version
      properties:
        key:
          $ref: '#/components/schemas/SettingKey'
        displayName:
          type: string
          minLength: 1
          description: 参数的展示名。
        valueType:
          type: string
          enum:
            - string
            - number
            - boolean
            - number_list
          description: 值的类型，决定编辑控件与提交时用哪个槽位。
        valueRangeNote:
          type: string
          minLength: 1
          description: 值域说明；没有值域限制时不返回。
        defaultValue:
          allOf:
            - $ref: '#/components/schemas/ParameterValue'
          description: 默认值；默认为不限（无值）时不返回本键。
        value:
          allOf:
            - $ref: '#/components/schemas/ParameterValue'
          description: 该商户设过的值；没设过时不返回本键，即当前用的是默认值。
        effectiveValue:
          allOf:
            - $ref: '#/components/schemas/ParameterValue'
          description: 当前生效值；默认为不限且没设过时不返回本键。
        version:
          type: integer
          minimum: 0
          description: 写入用的版本，改值时原样带回；该商户从没设过值时为 0。
    MerchantSettingWrite:
      type: object
      additionalProperties: false
      required:
        - value
        - version
      properties:
        value:
          oneOf:
            - $ref: '#/components/schemas/ParameterValue'
            - type: 'null'
          description: 新值；传 `null` = 恢复默认。
        version:
          type: integer
          minimum: 0
          description: 读到时的 `version`。
    PartnerId:
      type: string
      minLength: 1
      maxLength: 32
      description: 机构标识。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    MerchantCode:
      type: string
      minLength: 1
      maxLength: 20
      description: 对外商户码。
    UserRef:
      type: object
      additionalProperties: false
      description: 一个平台用户的标识与显示名（列表与记录上展示「谁」）。
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    OwnershipType:
      type: string
      enum:
        - SOLE_PROPRIETORSHIP
        - PARTNERSHIP
        - CORPORATION
        - NON_PROFIT
      description: 企业类型（入驻 Business 步与 Business Profile 共用），展示名由前端按码 i18n。
    Phone:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      maxLength: 16
      description: 电话号码，**国际格式整串**（`+` + 国家码 + 正文号，如 `+16045550123`）——**一个字段装完，没有独立的区号字段**。 上界 16 = `+` 加最多 15 位数字（国际号码总长上限）；**服务端只校验这一条通用规则 + 区号在白名单内**， **不按区号分别限长**。前端按所选区号收窄输入位数属输入体验、不是契约约束。 渲染「区号下拉 + 号码框」两个控件时，用前端参考数据里的区号表做**最长前缀匹配**拆分本串。
    WebsiteUrl:
      type: string
      maxLength: 256
      pattern: ^https?://\S+$
      description: 商户经营网址（http / https）。
    OnlineServiceType:
      type: string
      enum:
        - WEBSITE
        - APP
        - MINI_PROGRAM
        - OTHER
      description: 线上服务类型（入驻 Business 步与 Service 页共用），展示名由前端按码 i18n。只有 `WEBSITE` 有网址。
    Language:
      type: string
      enum:
        - en
        - fr
        - zh
      description: 平台支持的语言。
    BankAccountScheme:
      type: string
      enum:
        - ca_local
        - us_local
      description: |
        结算银行账户制式：`ca_local` 加拿大 EFT / `us_local` 美国 ACH。

        封闭枚举：新增国家要在契约里加取值与对应字段、前端加表单组件、加出款适配器，不是纯配置。
    BankAccountIdentification:
      type: object
      additionalProperties: false
      description: |
        结算银行账户（按商户 Country 对应的制式）。`type` 定制式、随制式带对应字段，不属该制式的字段不传（传了 → 400）：

        - `ca_local`（加拿大 EFT）—— 须带 `transitNumber` + `institutionNumber`；
        - `us_local`（美国 ACH）—— 须带 `routingNumber` + `accountType`。

        各制式的字段名保留本国叫法、位数为固定契约值、由服务端按 `type` 校验。`type` 由商户 Country 决定，国家 → 制式由所在面的配置接口给出（形状见 `CountryBankAccountType`）。

        账号明文 write-only、读侧走掩码 + 已填标志。本 schema 是基础形；写面与读面各自用 allOf 收紧（写面的齐全 / 必填规则见各写面，读面须带 `accountNumberMasked` + `accountNumberSet`）。
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/BankAccountScheme'
          description: 结算银行账户制式（`ca_local` 加拿大 EFT / `us_local` 美国 ACH）。**封闭 enum**——新增国家 = 契约加取值与对应字段 + 前端加表单组件 + 出款适配器，不是纯配置。
        transitNumber:
          type: string
          pattern: ^[0-9]{5}$
          description: Transit Number，5 位数字（分行）。只属 `type=ca_local`（**此时必填**）。
        institutionNumber:
          type: string
          pattern: ^[0-9]{3}$
          description: Institution Number，3 位数字（银行）。只属 `type=ca_local`（**此时必填**）。
        routingNumber:
          type: string
          pattern: ^[0-9]{9}$
          description: ABA Routing Number，9 位数字。只属 `type=us_local`（**此时必填**）。
        accountType:
          type: string
          enum:
            - checking
            - savings
          description: 账户类型（ACH 必需）。只属 `type=us_local`（**此时必填**）。
        accountNumber:
          type: string
          writeOnly: true
          pattern: ^[0-9]{4,17}$
          description: 银行账号（write-only 输入；read 走 accountNumberMasked，明文不回显）。位数随制式：`ca_local` 6-12 位、`us_local` 4-17 位——schema 只守两制式的并集，精确位数由服务端按 `type` 校验。
        accountNumberMasked:
          type: string
          readOnly: true
          description: 账号末 4 位掩码回显（如 `•••• 5678`）。
        accountNumberSet:
          type: boolean
          readOnly: true
          description: 是否已填 accountNumber（跨设备恢复 / 草稿完整性判定用）。
    SettlementCycleCode:
      type: string
      minLength: 1
      description: 结算周期档位的**稳定取值**（`SettlementCycleOption.code`）。**对客户端不透明**——从候选集里取来原样回传， 不要解析、拼接或据其分支；**不要传展示名**（那是展示文案、不是取值）。 服务端按**提交时点**的候选集校验：不在集内 → 拒绝（错误码见所在面，带 `details` 字段级明细），**不静默回落到候选集第一项**；前端应重取候选集让用户重选。 ⚠️ **你当前选中的取值不会凭空失效**——「打开编辑框却选不中自己现在的档位」「草稿存不回去」这类情形不会发生，无需为此写兜底。
    StoreId:
      type: string
      minLength: 1
      maxLength: 64
      description: 店铺编号，商户自设。
    FileId:
      type: string
      minLength: 1
      maxLength: 32
      description: 文件引用：上传后返回的稳定标识。
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    WebUrl:
      type: string
      pattern: ^https?://\S+$
      description: http 或 https 绝对地址。平台产出的文件 / 图片 / 付款链接地址与渠道给出的跳转地址共用。
    LoginId:
      type: string
      minLength: 1
      maxLength: 254
      description: 登录名：用户名或邮箱。新建或修改登录名时：符合邮箱格式的按邮箱处理；其余为用户名，须为去首尾空白后 1–64 个字符、不含空白与 `@`，比较不区分大小写、按输入的大小写保存。登录时按已保存的登录名匹配，不套这条形状规则（早期账号的用户名可能不满足它）。
    RoleId:
      type: string
      minLength: 1
      maxLength: 32
      description: 角色标识。
    WechatBindingSummary:
      type: object
      additionalProperties: false
      description: 微信登录绑定的摘要。
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          description: 绑定微信的昵称展示快照（绑定时写入；拿不到昵称时为通用展示名，故恒非空）。
    ResendCooldown:
      type: object
      description: 只回重发冷却秒数。
      required:
        - cooldownSeconds
      properties:
        cooldownSeconds:
          type: integer
          minimum: 0
          readOnly: true
          description: 重发冷却秒数（部署可配）；前端从收到响应起本地倒计时。
    FileUploadForm:
      type: object
      additionalProperties: false
      description: |
        上传入参(`multipart/form-data`)。文件经本平台中转存入对象存储;按 `purpose` 校验实际文件的格式与大小,不合规 → 400。

        不要手设 `Content-Type`:直接提交 `FormData`,由客户端带上 `boundary`。
      required:
        - file
        - purpose
      properties:
        file:
          type: string
          format: binary
          description: 文件本体。
        purpose:
          type: string
          description: 文件用途,决定允许的格式、大小上限与取用方式;每个上传入口只接受它所属业务范围内的用途。
    MerchantFilePurpose:
      type: string
      description: |
        文件用途目录——用途决定允许的格式、大小上限与取用方式；每个上传入口只接受它列出的子集，传入其他用途 → 400。

        | 用途 | 允许格式 | 大小上限 | 传上去之后怎么取用 |
        |---|---|---|---|
        | `onboarding_document` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（含身份与银行资料，仅授权主体可取） |
        | `void_cheque` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `store_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `office_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址 |
        | `merchant_logo` | PNG / JPEG | **512KB（固定上限）** | 长效稳定的公开地址（要展示给外部访客） |
        | `payment_page_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `link_banner` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `giftcard_brand_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `product_image` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `channel_application_material` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（渠道报备用的营业执照与网站截图，仅授权主体可取） |

        **短时效地址不要持久化、不要分享**（过期即失效，重新读取所在资源可拿到新的）；长效公开地址可直接放进页面。
      enum:
        - onboarding_document
        - void_cheque
        - store_photo
        - office_photo
        - merchant_logo
        - payment_page_logo
        - link_banner
        - giftcard_brand_logo
        - product_image
        - channel_application_material
    UploadedFile:
      type: object
      additionalProperties: false
      description: |
        已上传的文件。上传成功不等于生效:`fileId` 要随对应的业务写操作提交,文件才归属该业务对象;从未被引用的文件不生效,前端无需处理。
      required:
        - fileId
        - fileName
        - fileSize
        - contentType
        - previewUrl
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
          description: 该文件的稳定引用,业务写操作提交它;不要保存任何物理地址。
          examples:
            - 0f8c2a6e4b1d47f0a9c3e5d7b2148a6f
        fileName:
          type: string
          description: 原始文件名。
        fileSize:
          type: integer
          format: int64
          description: 字节数。
        contentType:
          type: string
          description: 服务端判定的内容类型。
        previewUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 可渲染地址(只出不入),供上传后立即回显。按用途分长效公开地址或短时效地址,短时效的不要持久化。
    FileAccessUrl:
      type: object
      additionalProperties: false
      description: 现签的短时效文件访问地址。
      required:
        - url
        - expiresAt
      properties:
        url:
          $ref: '#/components/schemas/WebUrl'
          description: 访问地址，不要持久化、不要分享。
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: 地址到期的时刻。
    ParameterValue:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: 参数值。按该参数的 `valueType` 恰好给一个槽位：`string` 用 `stringValue`、`number` 用 `numberValue`、`boolean` 用 `booleanValue`、`number_list` 用 `numberListValue`；多给、缺给或槽位与类型不符 → `400`。
      properties:
        stringValue:
          type: string
        numberValue:
          type: number
        booleanValue:
          type: boolean
        numberListValue:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: number
          description: 数值列表，按声明的顺序与个数给。
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    XlsxFile:
      description: Excel 文件（xlsx）
      headers:
        Content-Disposition:
          required: true
          description: '`attachment; filename=...xlsx`（下载；filename 编码 RFC 5987）。'
          schema:
            type: string
        Content-Language:
          required: true
          description: 文件实际用的语言（BCP-47）。
          schema:
            type: string
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
