      description: |
        **全量覆盖**：请求体就是目标状态，缺省不代表保持原样。停用与启用作用于该成员的平台账号，全平台生效：

        - `DISABLED`：在所有商户与管理后台都不能登录，既有会话全部即时失效。
        - `ACTIVE`：解除停用；停用期间未设密的回到邀请中、未验证邮箱的回到待验证，仍不能登录，其余恢复可登录；已失效的会话不恢复，须重新登录。

