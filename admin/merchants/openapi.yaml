openapi: 3.1.0
info:
  title: 管理后台 商户运营管理 — 前端契约面
  version: 2.2.1
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的商户运营契约：商户列表、导出与详情，冻结 / 解冻、关户，代登商户后台，商户成员（新增、停用启用、改角色、删除、解绑微信、解锁、重置 MFA、发重置密码链接）与代改 Owner 登录邮箱，运营资料、资料文件、结算账户与结算周期直改，日切时刻与 KA 等级，商户级设置代配。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 关户、新增成员、新增资料挂 `Idempotency-Key`：同键同请求体重发返回首次结果；同键改请求体 → `409`·`908003`；首次请求仍在处理 → `409`·`908002`，稍后同键同请求体重发。
    - 置值写（改状态、改角色、改资料、改结算、改日切与 KA 等级、改登录邮箱）与删除不挂；带版本的商户级设置以版本防并发覆盖、不挂；代登、发重置密码链接、取用文件按流程语义不挂；上传每次产生新文件，不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。

    **数据可见范围**：同管理后台约定「数据可见范围」：列表与导出只含范围内的商户（含本人生效中的临时授权），按标识访问范围外的商户及其成员、文件、设置一律 `404`。成员接口里的 `userId` 不是该商户的在册成员 → `404`。

    **操作审计**：本面的写操作记入操作审计并带上商户；例外（与现状相同的幂等重放、只发链接或待确认的提交）见各 op。可在该商户详情的操作记录页签查到；列表、详情、导出、文件查看不记。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: merchants
    x-displayName: 商户
    description: 商户列表、导出与详情，冻结 / 解冻、关户、代登，运营资料、结算、日切时刻与 KA 等级。
  - name: members
    x-displayName: 商户成员
    description: 商户成员列表与新增、账号处理、代改 Owner 登录邮箱。
  - name: documents
    x-displayName: 商户资料文件
    description: 资料文件的上传、新增、替换、移除与取用。
  - name: settings
    x-displayName: 商户级设置
    description: 运营代商户配置的商户级参数。
paths:
  /merchants:
    get:
      tags:
        - merchants
      operationId: listMerchants
      x-required-privilege: mops:merchant:view
      summary: 商户列表（筛选、搜索、排序、分页）
      description: |
        本人数据范围内、未关户的商户。每行带治理档位名所需的 `governanceTier`。
      parameters:
        - name: status
          in: query
          required: false
          description: 按商户状态，可多选。
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MerchantStatus'
        - $ref: '#/components/parameters/KeyAccountFilter'
        - name: partnerId
          in: query
          required: false
          description: 按所属机构。
          schema:
            $ref: '#/components/schemas/PartnerId'
        - name: bdUserId
          in: query
          required: false
          description: 按归属 BD。
          schema:
            $ref: '#/components/schemas/UserId'
        - $ref: '#/components/parameters/MerchantKeyword'
        - $ref: '#/components/parameters/MerchantSortField'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantSummary'
              example:
                total: 1
                data:
                  - merchantId: mch_8812
                    merchantCode: C3BM68
                    tradeName: Maple Coffee
                    legalBusinessName: Maple Coffee Inc.
                    status: ACTIVE
                    governanceTier: normal
                    keyAccountLevel: 0
                    partnerId: ptn_0031
                    bdUser:
                      userId: usr_b07
                      displayName: Bob BD
                    signupSource: self_service
                    createdAt: '2026-03-02T10:00:00Z'
                    activatedAt: '2026-03-05T16:00:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchant-exports:
    post:
      tags:
        - merchants
      operationId: createMerchantExport
      x-required-privilege: mops:merchant-export:create
      summary: 导出商户列表（xlsx）
      description: |
        按所给筛选导出命中的全部商户，不只是当前页；筛选字段与 `listMerchants` 相同，只含本人数据范围内的商户。同步返回文件流。表头与枚举文案按 `Accept-Language`，实际用的语言经 `Content-Language` 回。

        按读处理：不记操作审计，不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantListFilter'
            example:
              status:
                - FROZEN
              keyAccount: false
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      tags:
        - merchants
      operationId: getMerchant
      x-required-privilege: mops:merchant:view
      summary: 商户详情
      description: |
        商户的档案、Owner 联系人、结算信息、资料文件、主子关系、机构与 BD、开户来源与激活时间、不活跃月数。资料文件只给类型、文件名与到期日，要看文件调 `createMerchantFileAccessUrl`；结算账号只给末 4 位掩码。成员与商户级设置各有接口；操作记录页签用操作审计接口按商户筛。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantDetail'
              example:
                merchantId: mch_8812
                merchantCode: C3BM68
                tradeName: Maple Coffee
                legalBusinessName: Maple Coffee Inc.
                status: ACTIVE
                governanceTier: normal
                keyAccountLevel: 0
                partnerId: ptn_0031
                bdUser:
                  userId: usr_b07
                  displayName: Bob BD
                signupSource: self_service
                createdAt: '2026-03-02T10:00:00Z'
                activatedAt: '2026-03-05T16:00:00Z'
                profile:
                  typeOfOwnership: CORPORATION
                  registrationNumber: '1234567'
                  industryCategory: A0
                  mcc: '5814'
                  businessAddress: 88 King St W
                  city: Toronto
                  province: 'ON'
                  postalCode: M5H 1A1
                  country: CA
                  businessPhone: '+14165550199'
                  homeOffice: false
                  timeZone: America/Toronto
                  businessDayCutoffHour: 0
                  language: en
                  currency: CAD
                owner:
                  userId: usr_m01
                  firstName: Jane
                  lastName: Merchant
                  email: jane@example.com
                  phone: '+16045550123'
                settlement:
                  accountHolderName: Maple Coffee Inc.
                  bankName: Royal Bank of Canada
                  bankAccount:
                    type: ca_local
                    transitNumber: '00123'
                    institutionNumber: '003'
                    accountNumberMasked: •••• 4567
                    accountNumberSet: true
                  settlementCycle: t2
                  settlementCycleDisplayName: T+2 Business Days
                documents:
                  - documentId: doc_501
                    documentType: owner_id
                    fileId: 9a17be40d5c34f28b6e1027c9df3a85b
                    fileName: owner-id.jpg
                    expiresAt: '2029-05-31'
                  - documentId: doc_502
                    documentType: office_photo
                    fileId: 4c2e9d17a0b84f6e9d3a21b7c5e08f13
                    fileName: office.jpg
                children:
                  - merchantId: mch_8813
                    merchantCode: C3BM69
                    tradeName: Maple Coffee Downtown
                    relationType: BRANCH
                    status: ACTIVE
                inactiveMonths: 0
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}/status:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    put:
      tags:
        - merchants
      operationId: updateMerchantStatus
      x-required-privilege: mops:merchant-status:manage
      summary: 冻结或解冻商户
      description: |
        **全量覆盖**：请求体就是目标状态，缺省不代表保持原样。

        - `FROZEN`：冻结，只对已激活的商户。冻结后的效果由商户状态决定，不逐个改通道开关。
        - `ACTIVE`：解冻，只对已冻结的商户；通道开关不因解冻改变。

        天然幂等的置值写，不挂幂等键：商户已是目标状态时同样返回 `204`、不改动、不记审计，重试不会被拒。

        **什么时候拒绝**：

        - `308301` 商户当前状态既不是目标状态、也不能迁到目标状态（冻结未激活的商户、解冻未激活的商户），重读详情。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  allOf:
                    - $ref: '#/components/schemas/MerchantStatus'
                  enum:
                    - ACTIVE
                    - FROZEN
                  description: 目标状态：`FROZEN` 冻结 / `ACTIVE` 解冻。
            example:
              status: FROZEN
      responses:
        '204':
          description: 已置为目标状态
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308301
  /merchants/{merchantId}/closure:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    post:
      tags:
        - merchants
      operationId: closeMerchant
      x-required-privilege: mops:merchant-closure:create
      summary: 关户
      description: |
        任何状态的商户都可关户，即时生效：商户标为已关户、不再出现在列表，记录不删除；未激活商户的在途申请随之撤回。名下仍有未关户的子商户时不能关户。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308302` 名下仍有未关户的子商户。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已关户
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308302
  /merchants/{merchantId}/impersonations:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    post:
      tags:
        - merchants
      operationId: createMerchantImpersonation
      x-required-privilege: mops:impersonation:create
      summary: 代登商户后台
      description: |
        以该商户 Owner 的身份代登商户后台：返回一个一次性、短时效的进入地址 `landingUrl`，前端新开窗口打开即进入商户后台，当前商户为该商户。地址只能用一次，过期或用过须重新发起。代登会话的规则同管理后台约定「代登会话」。

        只有已激活的商户可代登；已冻结的商户不能代登，其资料在商户详情查看。打开进入地址的浏览器若已登录商户后台，须先登出再回来重新发起。每次发起都签一个新地址，不挂幂等键。

        **什么时候拒绝**：

        - `308303` 商户不是已激活（未激活或已冻结），或该商户 Owner 已停用、在商户后台无访问资格。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: 已签发进入地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImpersonationLanding'
              example:
                landingUrl: https://merchant.example.com/impersonate#code=REDACTED
                expiresAt: '2026-10-16T08:01:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308303
  /merchants/{merchantId}/profile:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    patch:
      tags:
        - merchants
      operationId: updateMerchantProfile
      x-required-privilege: mops:profile:edit
      summary: 改运营资料（含锁定字段、家庭办公、别名商户码）
      description: |
        只提交要改的字段，一次提交全部生效或全部不生效；能清空的字段传 `null` 即清空。含商户自己不能改的锁定字段（法定名、经营名、企业类型、注册号、引荐来源、行业、MCC）。字段规则与商户入驻 Business 步相同。改动前后值记入操作审计。

        - `merchantCodeAlias`：别名商户码，一个商户至多一个、不设到期，与商户码共用同一个命名空间。
        - `homeOffice`：改为否时，商户须已有至少一张办公室照片。

        置值写，不挂幂等键。

        **什么时候拒绝**：

        - `308314` 商户未激活：待激活商户的资料在审核中心的代客建档里代补，或由商户在向导修改。
        - `308309` 别名商户码已被某商户的商户码或别名占用。
        - `308310` 家庭办公改为否、而商户还没有办公室照片：先上传办公室照片。
        - 字段格式或组合不对 → `400`，`details` 定位字段。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantProfileUpdate'
            example:
              legalBusinessName: Maple Coffee Holdings Inc.
              merchantCodeAlias: MAPLE01
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308309
        - 308310
        - 308314
  /merchants/{merchantId}/settlement-info:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    patch:
      tags:
        - merchants
      operationId: updateMerchantSettlementInfo
      x-required-privilege: mops:settlement-account:edit
      summary: 直改结算账户或结算周期
      description: |
        运营直接改已激活商户的结算账户和 / 或结算周期，即时生效，不生成结算变更申请。改动前后值记入操作审计（账号只记末 4 位）。

        - `account`：整组提交新的结算账户，账号重新输入、不能只改其中一个字段；须先上传 Void Cheque（`uploadMerchantFile`，用途 `void_cheque`）并带上 `voidChequeFileId`。
        - `settlementCycle`：取 `/config/settlement` 的候选档位 code。

        至少给一项。置值写，不挂幂等键。

        **什么时候拒绝**：

        - `308314` 商户未激活：待激活商户的结算信息在审核中心的代客建档里改。
        - `308307` 商户有审核中的结算变更申请（先在审核中心处理它），或刚通过的申请新周期尚未同步（在审核中心重发该通过补做同步）。
        - `308206` 作废支票文件不可用（不是本商户上传的，或用途不符），重新上传后再引用。
        - 结算周期不在候选内、账户制式不是该商户 Country 对应的制式、字段格式不对 → `400`，`details` 定位字段。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantSettlementUpdate'
            example:
              settlementCycle: t1
      responses:
        '204':
          description: 已生效
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308206
        - 308307
        - 308314
  /merchants/{merchantId}/operating-attributes:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    patch:
      tags:
        - merchants
      operationId: updateMerchantOperatingAttributes
      x-required-privilege: mops:settings:edit
      summary: 改日切时刻或 KA 等级
      description: |
        只提交要改的字段。改动前后值记入操作审计。

        - `businessDayCutoffHour`：营业日切点（商户当地整点），与商户时区组合校验，自保存起生效，不重算已有的营业日。
        - `keyAccountLevel`：KA 等级，`0` = 普通，大于 0 为 KA；KA 商户在 KA 筛选里出现，且不再受理自助临时授权。

        置值写，不挂幂等键。不合法 → `400`，`details` 定位字段。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantOperatingAttributesUpdate'
            example:
              businessDayCutoffHour: 2
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}/members:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      tags:
        - members
      operationId: listMerchantMembers
      x-required-privilege: mops:merchant:view
      summary: 商户成员列表
      description: 该商户的全部在册成员（含 Owner），不分页。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantMember'
              example:
                items:
                  - userId: usr_m01
                    loginId: jane@example.com
                    displayName: Jane Merchant
                    roles:
                      - roleId: role_owner
                        name: Owner
                    status: ACTIVE
                    isOwner: true
                    mfaEnrolled: true
                    wechat:
                      nickname: Jane
                    lastLoginAt: '2026-10-15T09:12:00Z'
                  - userId: usr_m02
                    loginId: sam@example.com
                    displayName: Sam Clerk
                    roles:
                      - roleId: role_staff
                        name: Operator
                    status: INVITED
                    isOwner: false
                    mfaEnrolled: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - members
      operationId: createMerchantMember
      x-required-privilege: mops:member:manage
      summary: 新增成员（发邀请）
      description: |
        以邮箱为登录名新增成员：向该邮箱发邀请邮件，成员自设密码后激活，此前为 `INVITED`。运营不经手密码；用户名格式的成员只能由 Owner 在商户后台新建。角色取 `listMerchantMemberRoleOptions`。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308314` 商户未激活：审核通过后再加成员。
        - `968001` 登录邮箱已被占用。
        - `304301` 角色不可分配（含 Owner 角色）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantMemberCreate'
            example:
              email: pat@example.com
              displayName: Pat
              roleIds:
                - role_staff
      responses:
        '201':
          description: 已新增，已发邀请邮件；复活的已停用账号返回已停用：收件人照常可凭邀请设密，但启用前不能登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantMemberCreated'
              example:
                userId: usr_m09
                status: INVITED
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304301
        - 308314
        - 968001
  /merchants/{merchantId}/member-role-options:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      tags:
        - members
      operationId: listMerchantMemberRoleOptions
      x-required-privilege: mops:merchant:view
      summary: 成员可分配的角色候选（不含 Owner）
      description: 商户后台可分配给成员的角色，不含 Owner 与已停用的角色；新增成员与改角色只能从中选。顺序即展示顺序。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
