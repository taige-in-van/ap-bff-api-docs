    post:
      tags:
        - members
      operationId: createMerchantMemberPasswordReset
      x-required-privilege: mops:member-credential:manage
      summary: 给成员发重置密码链接
      description: |
        系统向该成员的登录邮箱发一个一次性设密链接，成员凭链接自设密码。运营不经手密码。只对以邮箱登录的成员可用，按成员状态分两种：

        - 已激活：发重置密码链接；设好新密码之前旧密码照常可用，账号状态不变。
        - 代为建档的 Owner 尚未设密（成员列表上为邀请中，如开户设密链接已过期）、且商户已激活：补发开户设密链接，之前的链接失效；设好后账号转为已激活。

        返回冷却秒数；冷却内不能再发。按流程语义不挂幂等键。

        **什么时候拒绝**：

        - `308305` 用户名格式的成员没有登录邮箱，由 Owner 在商户后台为其设密。
        - `308306` 成员状态不允许：邀请中的员工由 Owner 在商户后台重发邀请，已停用的先启用；商户未激活时不给尚未设密的 Owner 发（审核通过时系统自动发开户邮件）。
        - `308313` 该成员同时是后台用户，到后台账号管理处理。
        - `966006` 冷却未过，按 `context.cooldownSeconds` 倒计时。
        - 对象是 Owner 且其名下有不在你可见范围内的商户时按不存在处理（`404`）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已发出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendCooldown'
              example:
                cooldownSeconds: 60
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308305
        - 308306
        - 308313
        - 966006
  /merchants/{merchantId}/owner/login-email:
    parameters:
