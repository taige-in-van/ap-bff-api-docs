            example:
              newLoginEmail: jane.new@example.com
      responses:
        '202':
          description: 已向新邮箱发出确认链接，确认后生效
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308313
        - 966006
        - 968001
