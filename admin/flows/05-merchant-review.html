# 商户入驻审批与合规 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）；审核中心与代客建档按数据可见范围过滤商户，按标识打开范围外商户的申请得到 `404`。

## 本文的页面

| 页面 | 从哪进 | 本文章节 |
|---|---|---|
| 审核中心 | 导航「商户 › 审核中心」 | [页面：审核中心](#页面：审核中心) |
| 申请详情 | 审核中心点一行 | [页面：申请详情 · 入驻审核](#页面：申请详情%20·%20入驻审核)；[页面：申请详情 · 结算变更与开通申请](#页面：申请详情%20·%20结算变更与开通申请) |
| 代客建档 | 审核中心的「代客建档」；代客建档申请的详情 | [流程：代客建档](#流程：代客建档)；[流程：代客建档 · 补料与重签](#流程：代客建档%20·%20补料与重签) |
| 线上平台标识补录待办 | 导航「商户 › 平台标识补录」 | [页面：线上平台标识补录待办](#页面：线上平台标识补录待办) |

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`listApplications`](../applications/index.html#tag/applications/operation/listApplications) | `GET /applications` | 审核队列 |
| 2 | [`getApplication`](../applications/index.html#tag/applications/operation/getApplication) | `GET /applications/{applicationId}` | 申请详情 |
| 3 | [`createApplicationFileAccessUrl`](../applications/index.html#tag/applications/operation/createApplicationFileAccessUrl) | `POST /applications/{applicationId}/files/{fileId}/access-urls` | 取用申请文件 |
| 4 | [`decideApplication`](../applications/index.html#tag/applications/operation/decideApplication) | `POST /applications/{applicationId}/decision` | 通过 / 拒绝 / 要求补料 |
| 6 | [`checkAssistedOnboarding`](../applications/index.html#tag/assisted-onboarding/operation/checkAssistedOnboarding) | `POST /assisted-onboarding-checks` | 建档前检查 |
| 7 | [`createAssistedApplication`](../applications/index.html#tag/assisted-onboarding/operation/createAssistedApplication) | `POST /applications` | 代客建档 |
| 8 | [`updateAssistedApplicationStep`](../applications/index.html#tag/assisted-onboarding/operation/updateAssistedApplicationStep) | `PUT /applications/{applicationId}/steps/{step}` | 保存一步资料 |
| 9 | [`uploadAssistedApplicationFile`](../applications/index.html#tag/assisted-onboarding/operation/uploadAssistedApplicationFile) | `POST /applications/{applicationId}/files` | 上传资料文件 |
| 10 | [`createApplicationSignatureRequest`](../applications/index.html#tag/assisted-onboarding/operation/createApplicationSignatureRequest) | `POST /applications/{applicationId}/signature-requests` | 生成合同、发确认链接 |
| 11 | [`submitAssistedApplication`](../applications/index.html#tag/assisted-onboarding/operation/submitAssistedApplication) | `POST /applications/{applicationId}/submission` | 代提交（已签署的草稿或代补料后） |
| 12 | [`withdrawAssistedApplication`](../applications/index.html#tag/assisted-onboarding/operation/withdrawAssistedApplication) | `POST /applications/{applicationId}/withdrawal` | 撤回代客建档 |
| 13 | [`listMerchantAppIdTodos`](../applications/index.html#tag/applications/operation/listMerchantAppIdTodos) | `GET /merchant-app-id-todos` | 线上平台标识补录待办 |

## 页面：审核中心

四类申请（入驻、受理模式开通、插件入口开通、结算信息变更）同一个列表，默认只列审核中的，按提交时间排序。可按申请类型、状态、开户来源、商户、关键词（商户码 / 经营名 / 法定名）筛选。各列取：申请类型 `applicationType`、商户 `merchant` 与 `merchantCode`、开户来源 `signupSource`、状态 `status`、提交时间 `submittedAt`。纯读页面，只调 #1，点一行进详情。

- 草稿与已撤回的申请不在待审列表；按状态显式筛「草稿」可看到代客建档还没进入审核的申请。
- 没有 `mrev:application:manage` 的只读：详情里不显示决定按钮。

## 页面：申请详情 · 入驻审核

按入驻五步展示资料（`steps`）、合规文件、禁入名单比对结果（`blocklistHits`）与审核历史（`history`）；代客建档的另展示每次确认的记录（`signatureRequests`）。银行账号只显示末 4 位。点文件时现取地址。审核员三选一：通过、拒绝（填说明）、要求补料（勾待补项）。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 点审核队列某行
    S->>A: #35;2 [getApplication]<br/>GET /applications/{applicationId}
    A-->>S: 200 { applicationType, status, steps,<br/>signatureRequests, blocklistHits, history }
    opt 查看文件
        U->>S: 点某个文件
        S->>A: #35;3 [createApplicationFileAccessUrl]<br/>POST /applications/{applicationId}/files/{fileId}/access-urls
        A-->>S: 201 { url, expiresAt }
        S->>U: 新窗口预览
    end
    U->>S: 选决定，填说明或勾待补项，提交
    S->>A: #35;4 [decideApplication]<br/>POST /applications/{applicationId}/decision
    alt 禁入名单命中
        A-->>S: 409 · 308202 · context.blocklistHits
        S->>U: 列出命中项，只能拒绝；误伤的先到风控解除名单项
    else 其余
        A-->>S: 200 { status }
    end
    S->>U: 用新状态刷新详情
```

- 通过即商户激活，同一次完成；通道签约与入口开通由通道进件与产品配置随后处理，不在本页。
- 拒绝说明随拒绝结果发出：自助入驻的发给 Owner，代客建档的只发归属 BD。要求补料不带原因、不给商户发邮件；商户有归属 BD 的，拒绝、补料、通过都发 BD。
- 详情里的 `blocklistHits` 已非空时，页面直接提示命中、不给「通过」。
- 文件地址短时效，不要缓存；过期后再点一次即可。

| 情形 | 响应 | 页面 |
|---|---|---|
| 禁入名单命中 | #4 `409`·`308202` | 列出命中项；只能拒绝，误伤的先到风控的商户禁入名单解除该名单项再通过 |
| 申请已不在审核中（他人先决定、商户删除了未激活商户） | #4 `409`·`308201` | 提示申请状态已变，重读 #2 |
| 结算信息变更通过后同步支付核心失败 | #4 `503` | 提示同步未完成、申请仍显示为审核中，再点一次通过即补做 |
| 受理模式开通申请通过时开通准备失败 | #4 `503` | 提示决定未记录，再点一次通过 |
| 拒绝没填说明、要求补料没勾待补项 | #4 `400` | 对应输入框标红 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 要求补料 | v1 没有独立动作，拒绝即打回 | 拒绝与要求补料分开，补料标出待补项 | 商户与 BD 知道该补什么，拒绝是终态 |
| 通过的前置 | v1 不检查当前状态，任何状态都能「通过」 | 只对审核中的申请，两人同时决定以先到者为准 | 避免重复或越级决定 |
| 通过时的凭据 | v1 重置 Owner 密码与退款密码，明文发到联系邮箱 | 通过不改凭据，通知不带明文凭据 | 凭据只由本人设置 |
| 禁入名单命中 | v1 审核时比对、命中硬拦，比对规则库无界面 | 法定名、邮箱、邮箱域名或商户码命中才拦，误伤在风控解除名单项后再通过 | 名单维护可追溯、口径一致 |

## 页面：申请详情 · 结算变更与开通申请

结算信息变更展示新旧对比（`settlementChange`，账号末 4 位）；受理模式开通展示模式与支付方式，改线上服务类型或网址触发的复审也是这一类，`paymentMethods` 为空、展示线上服务类型与当前网址；插件入口开通展示入口与店铺网址，改店铺网址触发的复审也是这一类。这三类只有通过与拒绝。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 点审核队列某行
    S->>A: #35;2 [getApplication]<br/>GET /applications/{applicationId}
    A-->>S: 200 { applicationType, status, settlementChange,<br/>acceptanceMode, paymentMethods, typeOfOnlineService, websiteUrl,<br/>entryPoint, storeUrl }
    U->>S: 通过，或填说明后拒绝
    S->>A: #35;4 [decideApplication]<br/>POST /applications/{applicationId}/decision
    A-->>S: 200 { status }
    S->>U: 用新状态刷新详情
```

- 结算信息变更通过即新账户生效、新周期随后生效；拒绝保留旧值。
- 结算信息变更已通过但新周期尚未同步时，列表与详情仍显示审核中：再点通过只补做同步；此时点拒绝回 `409`·`308207`，提示重发通过。
- 受理模式开通申请点通过时先建签约与报备，没建成（#4 `503`）则决定未记录、申请仍在审核中，再点一次通过即可。
- 开通申请通过后，入口能否使用由通道进件与产品配置后续置位；复审期间商户的入口照常可用。
- 这三类不显示「要求补料」按钮。

| 情形 | 响应 | 页面 |
|---|---|---|
| 对这三类要求补料 | #4 `400`·`304201` | 正确页面下不会出现；出现就提示该类型不适用 |
| 申请已不在审核中 | #4 `409`·`308201` | 提示申请状态已变，重读 #2 |
| 拒绝已通过待同步的结算变更 | #4 `409`·`308207` | 提示该申请已通过、重发通过即补做 |

## 流程：代客建档

建档运营录 Owner 联系人、归属 BD（候选调 partners 契约的 `listSalesOptions`；商户的所属机构随归属 BD 的所属机构，总部 BD 或不选 BD 则无所属机构）与商户语言，先检查再建档；之后逐步填入驻五步资料与议价条款、上传文件，资料齐全后生成合同并给 Owner 发免登录确认链接。Owner 在确认页签名后，申请自动进入审核中，出现在审核中心；签署前运营可撤回。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 点代客建档，填 Owner 邮箱、法定名、注册号、电话
    S->>A: #35;6 [checkAssistedOnboarding]<br/>POST /assisted-onboarding-checks
    A-->>S: 200 { ownerIdentity, sameNameMerchants, blocklistHits }
    S->>U: 提示同名商户与名单命中，unusable 时不让继续
    U->>S: 补全联系人、归属 BD、语言，建档
    S->>A: #35;7 [createAssistedApplication]<br/>POST /applications（Idempotency-Key）
    A-->>S: 201 { applicationId, merchantId, merchantCode, ownerIdentity }
    loop 每一步
        opt 上传文件
            S->>A: #35;9 [uploadAssistedApplicationFile]<br/>POST /applications/{applicationId}/files
            A-->>S: 201 { fileId, fileName, fileSize }
        end
        S->>A: #35;8 [updateAssistedApplicationStep]<br/>PUT /applications/{applicationId}/steps/{step}
        A-->>S: 200 { signatureInvalidated }
    end
    U->>S: 资料齐全，发起确认
    S->>A: #35;10 [createApplicationSignatureRequest]<br/>POST /applications/{applicationId}/signature-requests（Idempotency-Key）
    A-->>S: 201 { signatureRequestId, expiresAt }
    S->>U: 提示确认链接已发到 Owner 邮箱
    opt Owner 签署前撤回
        U->>S: 点撤回并确认
        S->>A: #35;12 [withdrawAssistedApplication]<br/>POST /applications/{applicationId}/withdrawal
        A-->>S: 200 { status: WITHDRAWN }
    end
```

- 同名存量商户指法定名相同或注册号相同的商户，只给商户码与名称（可能在本人数据范围外），供核对，不拦建档；禁入名单命中只提示，不拦建档。
- Owner 邮箱已属平台用户、且该用户是某家商户的 Owner 或在商户后台没有身份时，新商户挂在该用户名下，已设过密码的凭原密码登录即可在商户切换里看到新商户；邮箱不属任何平台用户时建出没有密码的 Owner 账号，审核通过后 Owner 凭开户邮件设密。
- 确认链接发出后、Owner 签署前，每次 #8 保存（含换绑文件）都使链接失效，#8 返回 `signatureInvalidated = true`；须重新发起确认，合同按改后的资料重新生成。
- 建档与逐步保存不给商户发任何邮件；商户侧只收确认链接（发起确认时）与开户邮件（通过时）。
- Owner 在确认页提异议时，申请留在草稿，发起确认的人收到带异议理由的邮件；改好资料后再发起确认即可。再次发起会使之前未签的链接失效。
- 撤回后商户随之删除、确认链接失效，申请记录留存。
- Owner 签署后开通准备没做成的，申请留在草稿、签名已记，运营在详情页点代提交（#11）补做。
- 逐步保存只校验格式，资料是否齐全在 #10 统一校验。

| 情形 | 响应 | 页面 |
|---|---|---|
| Owner 邮箱的已有账号不能成为 Owner（其他商户的员工、待验证或已停用） | #7 `409`·`308205` | 提示换邮箱或先处理该账号；#6 已给 `unusable` 时不让走到这里 |
| 某步字段格式或长度不对、不在候选内 | #8 `400`·`304202`，`details` 每项带 `field` 字段路径 | 按 `field` 在对应字段旁提示 |
| 结算周期不在当前候选档位内 | #8 `400`·`304204` | 重取结算配置后重选 |
| 文档位引用的文件不可用 | #8 `400`·`308206`，`details` 指到 `documents.<docKey>` | 提示重新上传后再绑定 |
| 条款里的比例费率超过平台上限 | #8 `409`·`308406`（`context.capPercentage` 是上限，小数） | 比例框标红，按上限换成百分数提示 |
| 文件格式或大小不合 | #9 `400`·`304205` | 提示换一个文件再传 |
| 必填项未填或不合规 / 必传文档不全 | #10 `400`·`304202` / `304203`，`details` 逐项指到缺项 | 跳到缺项所在步并标红 |
| 申请已进入审核、已决定或已撤回 | #8 / #9 / #10 / #12 `409`·`308201` | 提示申请状态已变，重读 #2 |
| 撤回已签署的申请（含签署后仍为草稿的） | #12 `409`·`308201` | 提示签署后不可撤回 |
| 不是代客建档的申请 | #8 / #9 / #10 / #11 / #12 `409`·`308204` | 正确页面下不会出现；出现就回详情 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #7 / #10 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 商户确认 | Hub 生成合同、商户电子签或提异议 | 同 Hub：签署后才进审核，异议通知发起确认的人 | 代客建档有议价条款，需商户签字认可 |
| Owner 账号 | v1 通过时建账号并发明文密码 | 建档时建无密码的 Owner 账号，通过后 Owner 凭开户邮件自设密码 | 凭据只由本人设置 |

## 流程：代客建档 · 补料与重签

审核员对代客建档的申请要求补料时，商户侧不收补料通知，由运营代补、代为提交。补料时改了签署关键字段（议价条款、结算账户、法定名、注册号）的，须重新发起确认、Owner 签署后申请才回到审核中。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开待补料的代客建档申请
    S->>A: #35;2 [getApplication]<br/>GET /applications/{applicationId}
    A-->>S: 200 { status: MORE_INFO_REQUIRED, missingFields }
    U->>S: 补待补项，保存
    S->>A: #35;8 [updateAssistedApplicationStep]<br/>PUT /applications/{applicationId}/steps/{step}
    A-->>S: 200 { signatureInvalidated }
    alt 未改签署关键字段
        U->>S: 代提交
        S->>A: #35;11 [submitAssistedApplication]<br/>POST /applications/{applicationId}/submission
        A-->>S: 200 { status: UNDER_REVIEW }
    else 改了签署关键字段
        S->>U: 提示须商户重签
        U->>S: 重新发起确认
        S->>A: #35;10 [createApplicationSignatureRequest]<br/>POST /applications/{applicationId}/signature-requests（Idempotency-Key）
        A-->>S: 201 { signatureRequestId, expiresAt }
        Note over S,A: Owner 签署后申请自动回到审核中，不再调 #35;11<br/>开通准备失败时申请留在原状态、签名已记，运营点代提交补做
    end
```

- `signatureInvalidated = true` 表示本次保存使已有的确认作废，页面据此直接提示重签，不必等 #11 报错。
- 审核通过后不再重签；通过后改费率归通道进件与产品配置。

| 情形 | 响应 | 页面 |
|---|---|---|
| 改过签署关键字段（或从未签署）却直接代提交 | #11 `409`·`308203` | 提示须重新发起确认，给 #10 入口 |
| 资料不满足提交要求（同商户自助提交的完整性校验） | #11 `400`·`304202` / `304203`，`details` 逐项指到缺项 | 跳到缺项所在步并标红 |
| 申请不在草稿 / 待补料 | #11 `409`·`308201` | 提示申请状态已变，重读 #2 |
| 开通准备失败 | #11 `503` | 提示未提交成功，再点一次代提交 |

## 页面：线上平台标识补录待办

列出已激活、线上服务类型为 App、小程序或其他，微信或支付宝签约已有子商户号、而微信与支付宝签约下都还没登记线上平台标识的商户，只含本人数据范围内的商户，按激活时间从新到旧。各列取：商户 `merchant`、线上服务类型 `onlineServiceType`、激活时间 `activatedAt`。纯读页面，只调 #13；点一行进该商户的收单配置 · 通道签约，在「线上平台标识」场景里录入（见 07-merchant-acquiring）。

- 录入成功后该商户从本列表消失；通道拒绝关联时不登记，商户仍在列表里。
- 按商户码或经营名搜索用 `keyword`。

</script>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
document.getElementById('content').innerHTML = marked.parse(document.getElementById('src').textContent);
document.querySelectorAll('#content h1,#content h2,#content h3,#content h4').forEach(h=>{if(!h.id)h.id=h.textContent.trim();});
const jump=()=>{if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}};
const fpEl=document.getElementById('contract-fp');
if(fpEl){const fp=JSON.parse(fpEl.textContent);
fetch('../../ready.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(rd=>{
if(!rd||!rd.ops)return;
const re=/^\.\.\/([\w-]+)\/index\.html#tag\/[^/]+\/operation\/([\w-]+)$/;
document.querySelectorAll('#content table a[href]').forEach(a=>{
const m=a.getAttribute('href').match(re);if(!m)return;
const k=m[1]+'/'+m[2],got=rd.ops[fp.consumer+'/'+k];if(!got)return;
const s=document.createElement('span');s.className='rd';
if(got===fp.ops[k]){s.textContent=' ✅';s.title='已部署到联调环境，可对接调试';}
else{s.textContent=' ⚠️';s.title='契约在实现之后有改动，待后端按新契约重验';}
a.after(s);});
const n=document.getElementById('ready-note'),c=document.createElement('code');c.textContent=rd.environment||'';
n.append('联调就绪（环境 ',c,'，生成于 '+(rd.generatedAt||'')+'）：✅ 已部署、可对接调试 · ⚠️ 契约在实现之后有改动、待后端重验 · 无标识 = 尚未部署到联调环境。清单更新后页面缓存可能延迟几分钟。');
n.hidden=false;}).catch(()=>{});}
document.querySelectorAll('code.language-mermaid').forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.closest('pre').replaceWith(d);});
mermaid.initialize({startOnLoad:false,theme:'neutral',sequence:{useMaxWidth:true}});
mermaid.run({querySelector:'.mermaid'}).then(jump,jump);
</script>
