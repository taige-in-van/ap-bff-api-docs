# 商户入驻审批与合规 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）；审核中心与代客建档按数据可见范围过滤商户，按标识打开范围外商户的申请得到 `404`。

## 页面：审核中心

四类申请（入驻、受理模式开通、插件入口开通、结算信息变更）同一个列表，默认只列审核中的，按提交时间排序。可按申请类型、状态、开户来源、商户、关键词（商户码 / 经营名 / 法定名）筛选。各列取：申请类型 `applicationType`、商户 `merchant` 与 `merchantCode`、开户来源 `signupSource`、状态 `status`、提交时间 `submittedAt`。纯读页面，只调 #1，点一行进详情。

- 草稿与已撤回的申请不在待审列表；按状态显式筛「草稿」可看到代客建档还没签署的申请。
- 没有 `mrev:application:manage` 的只读：详情里不显示决定按钮。

---

## 页面：申请详情 · 入驻审核

按入驻五步展示资料（`steps`）、合规文件、禁入名单比对结果（`blocklistHits`）与审核历史（`history`）；代客建档的另展示每次确认的记录（`signatureRequests`）。银行账号只显示末 4 位。点文件时现取地址。审核员三选一：通过、拒绝（填说明）、要求补料（勾待补项）。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 点审核队列某行
    S->>A: #35;2 [getApplication]<br/>GET /applications/{applicationId}
    A-->>S: 200 { applicationType, status, steps,<br/>signatureRequests, blocklistHits, history }
    opt 查看文件
        U->>S: 点某个文件
        S->>A: #35;3 [createApplicationFileAccessUrl]<br/>POST /applications/{applicationId}/files/{fileId}/access-urls
        A-->>S: 201 { url, expiresAt }
        S->>U: 新窗口预览
    end
    U->>S: 选决定，填说明或勾待补项，提交
    S->>A: #35;4 [decideApplication]<br/>POST /applications/{applicationId}/decision
    alt 禁入名单命中
        A-->>S: 409 · 308202 · context.blocklistHits
        S->>U: 列出命中项，持跳过权限的给「说明理由后通过」
        U->>S: 填跳过理由，确认
        S->>A: #35;5 [approveApplicationOverridingBlocklist]<br/>POST /applications/{applicationId}/blocklist-override-approval
        A-->>S: 200 { status: APPROVED }
    else 其余
        A-->>S: 200 { status }
    end
    S->>U: 用新状态刷新详情
```

- 通过即商户激活，同一次完成；通道签约与入口开通由通道进件与产品配置随后处理，不在本页。
- 拒绝说明随拒绝结果发出：自助入驻的发给 Owner，代客建档的只发归属 BD。要求补料不带原因、不给商户发邮件；商户有归属 BD 的，拒绝、补料、通过都发 BD。
- 详情里的 `blocklistHits` 已非空时，页面可直接把「通过」换成「说明理由后通过」，不必先吃一次 `308202`。
- 文件地址短时效，不要缓存；过期后再点一次即可。

| 情形 | 响应 | 页面 |
|---|---|---|
| 禁入名单命中 | #4 `409`·`308202` | 列出命中项；有 `mrev:blocklist-override:create` 的给跳过入口，没有的只能拒绝 |
| 申请已不在审核中（他人先决定、商户删除了未激活商户） | #4 / #5 `409`·`308201` | 提示申请状态已变，重读 #2 |
| 拒绝没填说明、要求补料没勾待补项、跳过没填理由 | #4 / #5 `400` | 对应输入框标红 |
| 跳过通过时当前比对已无命中 | #5 `400` | 提示改走普通通过 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 要求补料 | v1 没有独立动作，拒绝即打回 | 拒绝与要求补料分开，补料标出待补项 | 商户与 BD 知道该补什么，拒绝是终态 |
| 通过的前置 | v1 不检查当前状态，任何状态都能「通过」 | 只对审核中的申请，两人同时决定以先到者为准 | 避免重复或越级决定 |
| 通过时的凭据 | v1 重置 Owner 密码与退款密码，明文发到联系邮箱 | 通过不改凭据，通知不带明文凭据 | 凭据只由本人设置 |
| 禁入名单跳过 | v1 审核请求可带跳过名单比对的开关 | 持单独权限、填理由，理由与命中项进操作审计 | 跳过可追溯 |

## 页面：申请详情 · 结算变更与开通申请

结算信息变更展示新旧对比（`settlementChange`，账号末 4 位）；受理模式开通展示模式与支付方式；插件入口开通展示入口与店铺网址，改店铺网址触发的复审也是这一类。这三类只有通过与拒绝。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 点审核队列某行
    S->>A: #35;2 [getApplication]<br/>GET /applications/{applicationId}
    A-->>S: 200 { applicationType, status, settlementChange,<br/>acceptanceMode, paymentMethods, entryPoint, storeUrl }
    U->>S: 通过，或填说明后拒绝
    S->>A: #35;4 [decideApplication]<br/>POST /applications/{applicationId}/decision
    A-->>S: 200 { status }
    S->>U: 用新状态刷新详情
```

- 结算信息变更通过即新账户生效、新周期随后生效；拒绝保留旧值。
- 开通申请通过后，入口能否使用由通道进件与产品配置后续置位；复审期间商户的入口照常可用。
- 这三类不显示「要求补料」按钮。

| 情形 | 响应 | 页面 |
|---|---|---|
| 对这三类要求补料 | #4 `400`·`304201` | 正确页面下不会出现；出现就提示该类型不适用 |
| 申请已不在审核中 | #4 `409`·`308201` | 提示申请状态已变，重读 #2 |

## 流程：代客建档

建档运营录 Owner 联系人、所属机构、归属 BD 与商户语言，先检查再建档；之后逐步填入驻五步资料与议价条款、上传文件，资料齐全后生成合同并给 Owner 发免登录确认链接。Owner 在确认页签名后，申请自动进入审核中，出现在审核中心；签署前运营可撤回。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 点代客建档，填 Owner 邮箱、法定名、注册号、电话
    S->>A: #35;6 [checkAssistedOnboarding]<br/>POST /assisted-onboarding-checks
    A-->>S: 200 { ownerIdentity, sameNameMerchants, blocklistHits }
    S->>U: 提示同名商户与名单命中，unusable 时不让继续
    U->>S: 补全联系人、机构、BD、语言，建档
    S->>A: #35;7 [createAssistedApplication]<br/>POST /applications（Idempotency-Key）
    A-->>S: 201 { applicationId, merchantId, merchantCode, ownerIdentity }
    loop 每一步
        opt 上传文件
            S->>A: #35;9 [uploadAssistedApplicationFile]<br/>POST /applications/{applicationId}/files
            A-->>S: 201 { fileId, fileName, fileSize }
        end
        S->>A: #35;8 [updateAssistedApplicationStep]<br/>PUT /applications/{applicationId}/steps/{step}
        A-->>S: 200 { signatureInvalidated }
    end
    U->>S: 资料齐全，发起确认
    S->>A: #35;10 [createApplicationSignatureRequest]<br/>POST /applications/{applicationId}/signature-requests（Idempotency-Key）
    A-->>S: 201 { signatureRequestId, expiresAt }
    S->>U: 提示确认链接已发到 Owner 邮箱
    opt Owner 签署前撤回
        U->>S: 点撤回并确认
        S->>A: #35;12 [withdrawAssistedApplication]<br/>POST /applications/{applicationId}/withdrawal
        A-->>S: 200 { status: WITHDRAWN }
    end
```

- 同名存量商户指法定名相同或注册号相同的商户，只给商户码与名称（可能在本人数据范围外），供核对，不拦建档；禁入名单命中只提示，不拦建档。
- Owner 邮箱已属平台用户、且该用户是某家商户的 Owner 或在商户后台没有身份时，新商户挂在该用户名下，已设过密码的凭原密码登录即可在商户切换里看到新商户；邮箱不属任何平台用户时建出没有密码的 Owner 账号，审核通过后 Owner 凭开户邮件设密。
- 确认链接发出后、Owner 签署前，每次 #8 保存（含换绑文件）都使链接失效，#8 返回 `signatureInvalidated = true`；须重新发起确认，合同按改后的资料重新生成。
- 建档与逐步保存不给商户发任何邮件；商户侧只收确认链接（发起确认时）与开户邮件（通过时）。
- Owner 在确认页提异议时，申请留在草稿，发起确认的人收到带异议理由的邮件；改好资料后再发起确认即可。再次发起会使之前未签的链接失效。
- 撤回后商户随之删除、确认链接失效，申请记录留存。
- 逐步保存只校验格式，资料是否齐全在 #10 统一校验。

| 情形 | 响应 | 页面 |
|---|---|---|
| Owner 邮箱的已有账号不能成为 Owner（其他商户的员工、待验证或已停用） | #7 `409`·`308205` | 提示换邮箱或先处理该账号；#6 已给 `unusable` 时不让走到这里 |
| 某步字段格式或长度不对、不在候选内 | #8 `400`·`304202`，`details` 每项带 `field` 字段路径 | 按 `field` 在对应字段旁提示 |
| 结算周期不在当前候选档位内 | #8 `400`·`304204` | 重取结算配置后重选 |
| 文档位引用的文件不可用 | #8 `400`·`308206`，`details` 指到 `documents.<docKey>` | 提示重新上传后再绑定 |
| 条款里的比例费率超过平台上限 | #8 `409`·`308406`（`context.capPercentage` 是上限，小数） | 比例框标红，按上限换成百分数提示 |
| 文件格式或大小不合 | #9 `400`·`304205` | 提示换一个文件再传 |
| 必填项未填或不合规 / 必传文档不全 | #10 `400`·`304202` / `304203`，`details` 逐项指到缺项 | 跳到缺项所在步并标红 |
| 申请已签署进入审核、已决定或已撤回 | #8 / #9 / #10 / #12 `409`·`308201` | 提示申请状态已变，重读 #2 |
| 不是代客建档的申请 | #8 / #9 / #10 / #11 / #12 `409`·`308204` | 正确页面下不会出现；出现就回详情 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 商户确认 | Hub 生成合同、商户电子签或提异议 | 同 Hub：签署后才进审核，异议通知发起确认的人 | 代客建档有议价条款，需商户签字认可 |

## 流程：代客建档 · 补料与重签

审核员对代客建档的申请要求补料时，商户侧不收补料通知，由运营代补、代为提交。补料时改了签署关键字段（议价条款、结算账户、法定名、注册号）的，须重新发起确认、Owner 签署后申请才回到审核中。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开待补料的代客建档申请
    S->>A: #35;2 [getApplication]<br/>GET /applications/{applicationId}
    A-->>S: 200 { status: MORE_INFO_REQUIRED, missingFields }
    U->>S: 补待补项，保存
    S->>A: #35;8 [updateAssistedApplicationStep]<br/>PUT /applications/{applicationId}/steps/{step}
    A-->>S: 200 { signatureInvalidated }
    alt 未改签署关键字段
        U->>S: 代提交
        S->>A: #35;11 [submitAssistedApplication]<br/>POST /applications/{applicationId}/submission
        A-->>S: 200 { status: UNDER_REVIEW }
    else 改了签署关键字段
        S->>U: 提示须商户重签
        U->>S: 重新发起确认
        S->>A: #35;10 [createApplicationSignatureRequest]<br/>POST /applications/{applicationId}/signature-requests（Idempotency-Key）
        A-->>S: 201 { signatureRequestId, expiresAt }
        Note over S,A: Owner 签署后申请自动回到审核中，不再调 #35;11
    end
```

- `signatureInvalidated = true` 表示本次保存使已有的确认作废，页面据此直接提示重签，不必等 #11 报错。
- 审核通过后不再重签；通过后改费率归通道进件与产品配置。

| 情形 | 响应 | 页面 |
|---|---|---|
| 改过签署关键字段（或从未签署）却直接代提交 | #11 `409`·`308203` | 提示须重新发起确认，给 #10 入口 |
| 资料不满足提交要求（同商户自助提交的完整性校验） | #11 `400`·`304202` / `304203`，`details` 逐项指到缺项 | 跳到缺项所在步并标红 |
| 申请不在待补料 | #11 `409`·`308201` | 提示申请状态已变，重读 #2 |
