# 风控管理 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）。风控参数、付款人黑名单、商户禁入名单与礼卡客户白名单是平台级页面，只看功能权限；被拒订单按商户求数据可见范围，按标识打开范围外商户的被拒订单得到 `404`。本文的金额一律是对应币种最小单位的整数串，页面展示时由前端按币种换算；单笔上限与参与比较的金额是结算币种。

## 本文的页面

| 页面 | 从哪进 | 本文章节 |
|---|---|---|
| 风控参数 | 导航「平台设置 › 风控参数」 | [页面：风控参数](#页面：风控参数) |
| 付款人黑名单 | 导航「风控 › 付款人黑名单」 | [页面：付款人黑名单](#页面：付款人黑名单) |
| 被拒订单 | 导航「风控 › 被拒订单」 | [页面：被拒订单](#页面：被拒订单) |
| 商户禁入名单 | 导航「风控 › 商户禁入名单」 | [页面：商户禁入名单](#页面：商户禁入名单) |
| 礼卡客户白名单 | 导航「风控 › 礼卡客户白名单」 | [页面：礼卡客户白名单](#页面：礼卡客户白名单) |

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`listRiskPlatformParameters`](../settings/index.html#tag/risk-parameters/operation/listRiskPlatformParameters) | `GET /settings/risk-parameters` | 平台层单笔上限 |
| 2 | [`updateRiskPlatformParameter`](../settings/index.html#tag/risk-parameters/operation/updateRiskPlatformParameter) | `PUT /settings/risk-parameters/{key}` | 改值 / 恢复未设 |
| 3 | [`listRiskPaymentMethodParameters`](../settings/index.html#tag/risk-payment-method-parameters/operation/listRiskPaymentMethodParameters) | `GET /settings/risk-payment-method-parameters` | 各支付方式的单笔上限 |
| 4 | [`updateRiskPaymentMethodParameter`](../settings/index.html#tag/risk-payment-method-parameters/operation/updateRiskPaymentMethodParameter) | `PUT /settings/risk-payment-method-parameters/{paymentMethod}/{key}` | 改某支付方式的值 / 恢复未设 |
| 5 | [`listPayerBlocklistEntries`](../risk/index.html#tag/payer-blocklist/operation/listPayerBlocklistEntries) | `GET /payer-blocklist-entries` | 付款人黑名单列表 |
| 6 | [`createPayerBlocklistEntry`](../risk/index.html#tag/payer-blocklist/operation/createPayerBlocklistEntry) | `POST /payer-blocklist-entries` | 加入（含恢复已移除的原项） |
| 7 | [`removePayerBlocklistEntry`](../risk/index.html#tag/payer-blocklist/operation/removePayerBlocklistEntry) | `POST /payer-blocklist-entries/{entryId}/removal` | 移除 |
| 8 | [`listRejectedOrders`](../risk/index.html#tag/rejected-orders/operation/listRejectedOrders) | `GET /rejected-orders` | 被拒订单列表 |
| 9 | [`getRejectedOrder`](../risk/index.html#tag/rejected-orders/operation/getRejectedOrder) | `GET /rejected-orders/{orderId}` | 被拒订单详情 |
| 10 | [`listRejectedOrderDailyCounts`](../risk/index.html#tag/rejected-orders/operation/listRejectedOrderDailyCounts) | `GET /rejected-order-daily-counts` | 按日 × 拒绝原因计数 |
| 11 | [`listMerchantBlocklistEntries`](../risk/index.html#tag/merchant-blocklist/operation/listMerchantBlocklistEntries) | `GET /merchant-blocklist-entries` | 禁入名单列表 |
| 12 | [`createMerchantBlocklistEntry`](../risk/index.html#tag/merchant-blocklist/operation/createMerchantBlocklistEntry) | `POST /merchant-blocklist-entries` | 新增 |
| 13 | [`getMerchantBlocklistEntry`](../risk/index.html#tag/merchant-blocklist/operation/getMerchantBlocklistEntry) | `GET /merchant-blocklist-entries/{entryId}` | 详情 |
| 14 | [`updateMerchantBlocklistEntry`](../risk/index.html#tag/merchant-blocklist/operation/updateMerchantBlocklistEntry) | `PUT /merchant-blocklist-entries/{entryId}` | 编辑 |

## 页面：风控参数

平台层一项（调 #1）与各支付方式一项（调 #3，按支付方式目录顺序）的单笔上限。每项显示展示名、值域说明与当前值；没有 `value` 即这一层未设、不限制。改值或恢复未设分别调 #2 / #4，带读到的 `version`。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开风控参数
    S->>A: #35;1 [listRiskPlatformParameters]<br/>GET /settings/risk-parameters
    A-->>S: 200 { items: [ { key, value, version } ] }
    S->>A: #35;3 [listRiskPaymentMethodParameters]<br/>GET /settings/risk-payment-method-parameters
    A-->>S: 200 { items: [ { paymentMethod, paymentMethodName, key, value, version } ] }
    alt 改平台层
        U->>S: 填新值或点「恢复未设」
        S->>A: #35;2 [updateRiskPlatformParameter]<br/>PUT /settings/risk-parameters/{key}<br/>{ value 或 null, version }
        A-->>S: 200 { key, value, version }
    else 改某支付方式
        U->>S: 在某支付方式那一行填新值或点「恢复未设」
        S->>A: #35;4 [updateRiskPaymentMethodParameter]<br/>PUT /settings/risk-payment-method-parameters/{paymentMethod}/{key}<br/>{ value 或 null, version }
        A-->>S: 200 { paymentMethod, value, version }
    end
```

- 值是正整数，以结算币种的最小单位计，按各商户的结算币种解释；平台层、支付方式层与商户层（商户详情的商户级设置，见 06-merchant-ops）各自独立，建单时取最严。
- 改动对此后的受理即时生效，已被拒的订单不改判；建单时没定支付方式的订单不受支付方式层约束。
- 这两个写不带幂等键：上一次其实已成功、响应丢了再提交，会因版本已变得到 `308103`，重读即可看到。

| 情形 | 响应 | 页面 |
|---|---|---|
| 他人先改过 | #2 / #4 `409`·`308103` | 提示已被他人修改，重拉 #1 / #3 |
| 值不是正整数 | #2 / #4 `400`，`details` 定位到 `value` | 输入框标红 |
| 支付方式已不在启用中的目录，或参数不在本页 | #2 / #4 `404` | 提示找不到，重拉列表 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 风控配置页 | v1 整表回写 17 个阈值，只有平台与微信两个单笔限额生效，操作人记为系统、登录即可改、旧值不留 | 只留单笔上限，平台层一项加每个支付方式一项，逐项改、带版本，前后值与操作人进操作审计 | 只留生效的规则，改动可追溯 |

## 页面：付款人黑名单

列表调 #5，默认只列在用项，可切「已移除」或「全部」；按标识类型与值检索（精确匹配，邮箱不分大小写）。各列取：类型 `identifierType`、范围 `identifierScope`（商户客户号另显示 `scopeMerchant` 的商户码与经营名称）、值 `identifierValue`、拉黑原因 `blockReason`、状态 `status`、加入时间与加入人 `createdAt` / `createdBy`、移除时间与移除人 `removedAt` / `removedBy`。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开付款人黑名单
    S->>A: #35;5 [listPayerBlocklistEntries]<br/>GET /payer-blocklist-entries?status=ACTIVE
    A-->>S: 200 { total, data: [ { entryId, identifierType, identifierValue, status } ] }
    alt 加入
        U->>S: 选类型、填范围与值、填拉黑原因，提交
        S->>A: #35;6 [createPayerBlocklistEntry]<br/>POST /payer-blocklist-entries（Idempotency-Key）<br/>{ identifierType, identifierScope, identifierValue, blockReason }
        A-->>S: 200 { entry, restored }
    else 移除
        U->>S: 在某行点「移除」并确认
        S->>A: #35;7 [removePayerBlocklistEntry]<br/>POST /payer-blocklist-entries/{entryId}/removal
        A-->>S: 204
    end
    S->>A: #35;5 [listPayerBlocklistEntries]<br/>GET /payer-blocklist-entries
    A-->>S: 200 { total, data }
```

- 类型与范围：微信、支付宝填该标识所属的应用（appid）；商户客户号选所属商户，提交 `identifierScope` = 该商户的 `merchantId`；邮箱不填范围。
- `restored = true` 时提示「已恢复原名单项」：同一类型、范围与值曾被移除，这次恢复为在用、拉黑原因改为本次所填，仍是同一名单项。
- 加入与移除对此后的判定即时生效，已被拒的订单不改判；移除只标记、记录留存，已移除的再移除同样 `204`。
- 加入的一次操作沿用同一个 `Idempotency-Key`，重复提交返回首次结果。

| 情形 | 响应 | 页面 |
|---|---|---|
| 同一类型、范围与值已有在用项 | #6 `409`·`308801`，`context.existingEntryId` | 提示已在名单，按 `existingEntryId` 在列表里定位并高亮既有项 |
| 商户客户号所选商户不存在或已删除 | #6 `409`·`308802` | 商户选择框标红，重选 |
| 邮箱格式不对、缺范围、原因为空白或超长 | #6 `400`，`details` 定位字段 | 对应输入框标红 |
| 名单项不存在 | #7 `404` | 提示找不到，重拉 #5 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 维护方式 | v1 在通用参数页按逗号串整串编辑，500 字符封顶，只记新值 | 一行一项，加入、移除、列表分开；重复加入报错并指出既有项；移除只标记，再加入恢复原项 | 名单可查可追溯，不静默覆盖 |

## 页面：商户禁入名单

列表调 #11：只列生效项，按名称或标识值搜索（包含即命中、不分大小写）、按原因类别多选筛。各列取：商户码 `merchantCode`、主体名称 `subjectName`、原因类别 `reasonCategory`、录入人与时间 `createdBy` / `createdAt`。点一行调 #13 看详情；新增调 #12，编辑调 #14，解除调 #15。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开商户禁入名单
    S->>A: #35;11 [listMerchantBlocklistEntries]<br/>GET /merchant-blocklist-entries?keyword=&reasonCategory=
    A-->>S: 200 { total, data: [ { entryId, merchantCode, subjectName, reasonCategory } ] }
    alt 新增
        U->>S: 填名称、原因、备注与标识，提交
        S->>A: #35;12 [createMerchantBlocklistEntry]<br/>POST /merchant-blocklist-entries（Idempotency-Key）<br/>{ subjectName, reasonCategory, note, identifiers }
        A-->>S: 201 { entryId, identifiers, status: ACTIVE }
    else 查看与编辑
        U->>S: 点一行
        S->>A: #35;13 [getMerchantBlocklistEntry]<br/>GET /merchant-blocklist-entries/{entryId}
        A-->>S: 200 { subjectName, reasonCategory, source, sourceMerchant, identifiers, status }
        U->>S: 改名称、原因、备注或标识，保存
        S->>A: #35;14 [updateMerchantBlocklistEntry]<br/>PUT /merchant-blocklist-entries/{entryId}<br/>{ subjectName, reasonCategory, note, identifiers }
        A-->>S: 200 { identifiers, status }
    else 解除
        U->>S: 在详情点「解除」，填原因
        S->>A: #35;15 [liftMerchantBlocklistEntry]<br/>POST /merchant-blocklist-entries/{entryId}/lifting<br/>{ liftReason }
        A-->>S: 200 { status: LIFTED, liftedAt, liftReason }
    end
```

- 标识类别：法定名（公司名称按法定名录入）、注册号、联系人姓名、电话、邮箱、邮箱域名、商户码；至少一条、至多 30 条。同一名单项内同类别归一后相同的只留一条，不同名单项可含相同标识。
- 入驻审核时，法定名、邮箱、邮箱域名或商户码命中才算命中；注册号、联系人姓名与电话只在同一名单项另有命中时一并列出（审核侧见 05-merchant-review）。
- 编辑是整组替换，被移出的标识不再参与比对、记录留存；来源与来源商户不可改。
- 解除须填原因；解除后不再参与比对、不出现在列表，按标识打开仍可看到解除人、时间与原因；不能恢复，需要时重新新增。入驻申请因误伤被拦时，解除该名单项后审核即可走普通通过。
- 来源为「商户冻结或设为高风险时生成」的名单项，由商户详情冻结或设为高风险时勾选「同时加入禁入名单」生成（#16，见 06-merchant-ops、09-clearing-settlement）；详情里的来源商户可点进商户详情。

| 情形 | 响应 | 页面 |
|---|---|---|
| 名单项已解除（他人先解除了） | #14 / #15 `409`·`308803` | 提示已解除，重拉 #13 |
| 名称缺失、没有标识或超过 30 条、某标识格式不对或归一后为空 | #12 / #14 `400`，`details` 定位到 `identifiers[i].value` 等 | 对应输入框标红 |
| 解除原因为空白或超长 | #15 `400` | 原因输入框标红 |
| 名单项不存在 | #13 / #14 / #15 `404` | 提示找不到，回到列表 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 维护入口 | v1 商户进件比对名单无界面、可匿名调用、不留痕 | 名单页维护，受权限点控制，新增、编辑、解除进操作审计 | 名单可维护、可追溯 |
| 比对口径 | v1 公司名包含匹配，其余精确不归一 | 法定名、邮箱、邮箱域名、商户码归一后精确相等才算命中，其余类别只作佐证 | 减少同名误伤，口径一致 |
| 解除 | Hub 只有超级管理员能解除 | 持名单维护权限即可，须填原因 | 权限由权限点表达 |

## 页面：礼卡客户白名单

```mermaid
