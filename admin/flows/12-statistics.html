# 统计分析 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）。本文的页面都是只读：每个页面（或页面上的一块）调一个接口，没有跨接口的先后，不画时序图。金额一律是对应币种最小单位的整数串，页面展示时由前端按币种换算；不同结算币种分组展示，不跨币种相加。

## 页面：运营首页

顶部选区间：今天 / 昨天 / 本月 / 上月 / 选月 / 自选日期区间，默认今天；选好后 #1、#3、#4、#5、#6 带同一组 `period`（选月带 `month`，自选带 `from` / `to`）一起重调。#2 不随区间变。

- **交易块**（要 `stat:dashboard-trade:view`）：
  - 总览调 #1，每个结算币种一行：成功收款金额与笔数、退款金额与笔数、净额、有交易商户数；每项旁显示上期值与变化率。变化率由前端按 `current` 与 `previous` 算，上期为 0 时不显示。对比文案按 `comparisonBasis`：`same_time_yesterday`「较昨日同时段」、`last_month_same_period`「较上月同期」、`preceding_period`「较上期」。
  - 趋势调 #2：近 30 天（截至昨天）每天的收款金额与笔数，每个币种一条线。
  - 支付来源分布调 #4：没有 `items` 时整块不显示（数据范围不是全部商户）。
  - 支付方式族分布调 #5。
  - 交易排行调 #6：每个币种一份前 N 名，点一行进该商户详情（见 06-merchant-ops）。
- **商户数块**（要 `stat:dashboard:view`）调 #3：商户总数、已激活商户数、所选区间新增、本月新增达标商户。所选区间只作用于「新增」。
- 页面口径说明写明：数据范围不是全部商户时，交易类数字按各商户自己的日界计，「今天」按各商户各自的今天，不显示支付来源分布；商户数块的两项新增仍按平台的日界。
- 退款笔数已扣除受理后失败的回冲。

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|

| 交易块谁能看 | Hub 总部非超管、非销售的账号隐藏 | 按权限点 | 权限由角色配置，不按身份写死 |

| 商户控制台 | v1 机构 / 销售另有一页 | 并入运营首页，按查看者范围算 | 同一批数字只有一个页面 |
