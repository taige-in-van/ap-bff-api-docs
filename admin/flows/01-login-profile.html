# 登录与个人设置 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。登录、忘记密码与两个邮件链接落地页在登录前：调的是公开端点（`security: []`），不带会话、不带 `X-CSRF-Token`。管理后台没有「当前商户」。

## 本文的页面

| 页面 | 从哪进 | 本文章节 |
|---|---|---|
| 登录 | 未登录时打开管理后台；会话失效（`401`）后 | [页面：登录](#页面：登录) |
| 忘记密码 | 登录页的「忘记密码」 | [页面：忘记密码](#页面：忘记密码) |
| 设置密码 | 邀请邮件里的设置密码链接 | [页面：设置密码](#页面：设置密码) |
| 确认新登录邮箱 | 管理员改了登录邮箱后，新邮箱收到的确认链接 | [页面：确认新登录邮箱](#页面：确认新登录邮箱) |
| 个人设置 | 顶栏头像菜单「个人设置」 | [页面：个人设置 · 资料](#页面：个人设置%20·%20资料)；[页面：个人设置 · 安全](#页面：个人设置%20·%20安全)；[页面：个人设置 · 企业微信](#页面：个人设置%20·%20企业微信)；[页面：个人设置 · 登录 IP 白名单](#页面：个人设置%20·%20登录%20IP%20白名单) |
| 登出 | 顶栏头像菜单「退出登录」 | [流程：登出](#流程：登出) |

## 页面流转

```mermaid
stateDiagram-v2
    direction TB
    state "设置密码" as SP
    state "登录" as L
    state "动态码步 / 绑定验证器" as M
    state "管理后台首页" as H
    state "忘记密码" as F

    [*] --> SP: 点邀请邮件里的链接
    SP --> L: 设密成功
    [*] --> L: 打开管理后台
    L --> F: 忘记密码
    F --> L: 重置成功
    L --> M: 密码或扫码通过
    L --> H: 受信浏览器
    M --> H: 动态码通过
```

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`login`](../auth/index.html#tag/sessions/operation/login) | `POST /auth/sessions` | 密码登录（受信浏览器直接建会话，否则进动态码步或先绑定验证器） |
| 2 | [`completeMfaChallenge`](../auth/index.html#tag/sessions/operation/completeMfaChallenge) | `POST /auth/sessions/mfa` | 动态码步（含首次绑定、信任本浏览器），通过即建会话 |
| 3 | [`initiateWechatLogin`](../auth/index.html#tag/sessions/operation/initiateWechatLogin) | `POST /auth/sessions/wechat` | 企业微信扫码登录发起 |
| 4 | [`pollWechatLogin`](../auth/index.html#tag/sessions/operation/pollWechatLogin) | `GET /auth/sessions/wechat/{qrTicket}` | 扫码登录轮询（确认后进动态码步） |
| 5 | [`getCurrentSession`](../auth/index.html#tag/sessions/operation/getCurrentSession) | `GET /auth/sessions/current` | 当前会话：身份摘要与可见权限点 |
| 6 | [`logout`](../auth/index.html#tag/sessions/operation/logout) | `DELETE /auth/sessions/current` | 登出 |
| 7 | [`requestPasswordReset`](../auth/index.html#tag/password-resets/operation/requestPasswordReset) | `POST /auth/password-resets` | 找回密码发起（恒 202） |
| 8 | [`confirmPasswordReset`](../auth/index.html#tag/password-resets/operation/confirmPasswordReset) | `POST /auth/password-resets/{challengeId}/confirmation` | 验证码 + 新密码一次提交 |
| 9 | [`acceptInvitation`](../auth/index.html#tag/invitation/operation/acceptInvitation) | `POST /auth/invitation` | 受邀设密（不建会话） |
| 10 | [`confirmLoginEmailChange`](../auth/index.html#tag/email-confirmation/operation/confirmLoginEmailChange) | `POST /auth/email-confirmation` | 确认新登录邮箱（不建会话） |
| 11 | [`getMyProfile`](../auth/index.html#tag/me/operation/getMyProfile) | `GET /me` | 本人资料、绑定状态、白名单与当前 IP |
| 12 | [`updateMyProfile`](../auth/index.html#tag/me/operation/updateMyProfile) | `PUT /me` | 改本人资料 |
| 13 | [`updateMyLoginIpAllowlist`](../auth/index.html#tag/me/operation/updateMyLoginIpAllowlist) | `PUT /me/login-ip-allowlist` | 保存本人登录 IP 白名单（整组置换） |
| 14 | [`changeMyPassword`](../auth/index.html#tag/security/operation/changeMyPassword) | `PUT /me/security/password` | 改密 |
| 15 | [`enrollMfa`](../auth/index.html#tag/security/operation/enrollMfa) | `POST /me/security/mfa` | 重绑验证器第 1 步：当前密码换新密钥 |
| 16 | [`confirmMfa`](../auth/index.html#tag/security/operation/confirmMfa) | `POST /me/security/mfa/confirmation` | 重绑验证器第 2 步：新验证器上的动态码 |
| 17 | [`initiateMyWechatBinding`](../auth/index.html#tag/wechat/operation/initiateMyWechatBinding) | `POST /me/wechat` | 绑定企业微信发起 |
| 18 | [`pollMyWechatBinding`](../auth/index.html#tag/wechat/operation/pollMyWechatBinding) | `GET /me/wechat/{qrTicket}` | 绑定企业微信轮询 |
| 19 | [`deleteMyWechatBinding`](../auth/index.html#tag/wechat/operation/deleteMyWechatBinding) | `DELETE /me/wechat` | 解绑企业微信 |

## 页面：登录

一张卡片两种模式：账号密码（默认）和企业微信扫码。账号密码模式提交前先过人机校验组件，把它给出的结果随登录一起提交。两种模式都要过动态码步；本浏览器在受信有效期内时免动态码。进入页面不调接口。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF
    participant W as 企业微信

    Note over U,A: 模式一：账号密码
    U->>S: 输登录名、密码，完成人机校验
    S->>A: #35;1 [login]<br/>POST /auth/sessions
    alt 受信浏览器
        A-->>S: 200 { status: ESTABLISHED } + Set-Cookie
    else 已绑定验证器
        A-->>S: 200 { status: MFA_REQUIRED, mfaChallenge }
    else 尚未绑定验证器
        A-->>S: 200 { status: MFA_ENROLLMENT_REQUIRED, mfaChallenge, mfaEnrollment }
        S->>U: 显示二维码与手输密钥，提示先在验证器里添加
    end

    Note over U,W: 模式二：企业微信扫码
    S->>A: #35;3 [initiateWechatLogin]<br/>POST /auth/sessions/wechat
    A-->>S: 200 { qrTicket, qrContent, expiresAt }
    par 用户在手机上
        U->>W: 企业微信扫码，在企业微信里确认
    and 页面轮询
        loop 直到不是 WAITING / SCANNED
            S->>A: #35;4 [pollWechatLogin]<br/>GET /auth/sessions/wechat/{qrTicket}
            A-->>S: 200 { status, mfaChallenge, mfaEnrollment }
        end
    end
    Note over S,A: SCANNED：显示「扫码成功，请在手机上确认」，继续轮询<br/>EXPIRED：重新调 #35;3<br/>REJECTED：提示登录失败，重新调 #35;3<br/>ESTABLISHED：已 Set-Cookie<br/>MFA_REQUIRED / MFA_ENROLLMENT_REQUIRED：同模式一

    Note over U,A: 动态码步（两种模式共用）
    U->>S: 输验证器上的 6 位码，勾不勾「信任本浏览器」
    S->>A: #35;2 [completeMfaChallenge]<br/>POST /auth/sessions/mfa
    A-->>S: 200 { status: ESTABLISHED } + Set-Cookie

    Note over S,A: 登录成功后
    S->>A: #35;5 [getCurrentSession]<br/>GET /auth/sessions/current
    A-->>S: 200 { userId, displayName, privileges }
    S->>U: 进入管理后台首页，导航按 privileges 渲染
```

- 动态码步与首次绑定是同一个输入框：`MFA_ENROLLMENT_REQUIRED` 时在输入框上方多显示 `mfaEnrollment` 的二维码（据 `otpauthUri` 渲染）与手输密钥 `secret`。
- 扫码轮询串行发：上一次 #4 的响应回来后再发下一次，不用定时器并发发；重叠的轮询可能让刚建立的登录失效。
- 「信任本浏览器」的有效期由平台设定，页面不显示具体天数。受信状态存在浏览器的 HttpOnly cookie 里，页面不读不写。
- 登录后一律进管理后台首页，不按角色选落地页。会话期间任何接口返回 `401`，回登录页。
- 页面上的权限判断一律查 `privileges`，不按角色名。

| 情形 | 响应 | 页面 |
|---|---|---|
| 登录名不存在、密码错、账号停用、无访问资格（不区分） | #1 `400`·`306001` | 留在表单，提示「登录失败，请检查登录名与密码」 |
| 密码对了但来源 IP 不在本人白名单 | #1 `400`·`306010` | 回第一步，提示「当前网络不允许登录」 |
| 人机校验没过 | #1 `400`·`304002` | 重置人机校验组件，让用户重做 |
| 动态码错 | #2 `400`·`306001` | 留在动态码步重输，不回第一步 |
| 动态码步挑战过期或已用 | #2 `410`·`306002` | 回账号密码步重新登录 |
| 账号因连续失败被锁 | #1 / #2 `423`·`966001` | 提示已锁定，稍后再试或联系管理员解锁 |
| 扫码后被拒（确认后已无访问资格） | #4 `200 { status: REJECTED }` | 提示与 `306001` 相同的文案，换新二维码 |
| 限流 | `429` | 退避 |

- 失败计数不回前端，页面不显示剩余次数。
- 扫码人的账号不能登录（未绑定、已停用）或发起扫码的网络不在其白名单时，原因只在扫码人的企业微信里说明（白名单不放行明说当前网络不允许登录），不出确认按钮，页面一直显示已扫码到二维码过期。

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 企业微信扫码 | v1 有一条不过白名单与动态码就签发会话的路径 | 扫码后先过白名单，确认后过动态码步 | 不留绕过路径 |
| 未绑定验证器的账号 | v1 密码步后强制先绑定 | 同，绑定在登录内完成，绑定前不建会话 | 管理后台账号必须启用验证器 |
| 白名单拒绝 | v1 计入失败锁定 | 记登录日志，不计入锁定 | 白名单不放行不是猜密码 |
| 受信浏览器 | v1 命中即滑动续期；只在本人改密、管理员重置密码时撤销 | 有效期自签发起算、不续期；被重置验证器时同样撤销 | 凭据变动后旧浏览器不再免动态码 |

## 页面：忘记密码

两步：输登录名 → 一屏填完验证码和新密码 → 成功回登录页。邮箱格式的登录名收邮件验证码；用户名登录名用验证器上的 6 位码。进入页面不调接口。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF
    participant E as 邮箱 / 验证器

    U->>S: 输登录名，点发送验证码
    S->>A: #35;7 [requestPasswordReset]<br/>POST /auth/password-resets
    A-->>S: 202 { challengeId, cooldownSeconds }
    opt 邮箱账号且账号存在
        A->>E: 发 6 位验证码
    end
    U->>E: 取验证码
    U->>S: 输验证码、新密码
    S->>A: #35;8 [confirmPasswordReset]<br/>POST /auth/password-resets/{challengeId}/confirmation
    A-->>S: 204
    S->>U: 提示已重置，回登录页
```

- #7 恒 `202`，不暴露账号是否存在；重发 = 冷却结束后再调 #7，拿新的 `challengeId`。
- 重置后该账号全部会话失效、受信浏览器失效，新密码登录仍要过动态码步。

| 情形 | 响应 | 页面 |
|---|---|---|
| 验证码错、次数未用完 | #8 `400`·`304001` | 原处重输，显示 `context.attemptsRemaining`；新密码不必重填 |
| 错码超限 | #8 `423`·`306003` | 回第一步重新发起 |
| 挑战过期或已用 | #8 `410`·`306002` | 回第一步重新发起 |
| 新密码不满足规则 | #8 `400` | 在新密码框下提示 |
| 限流 | #7 `429` | 退避 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 自助找回 | v1 管理后台没有自助找回 | 与商户后台同一流程 | 少依赖管理员 |

## 页面：设置密码

受邀的人点邀请邮件里的链接进来（链接带 `token` 与被邀请的邮箱），邮箱只读显示，设置登录密码后回登录页。打开页面不调接口、不消费链接。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开邀请链接，输新密码
    S->>A: #35;9 [acceptInvitation]<br/>POST /auth/invitation
    A-->>S: 204
    S->>U: 提示已激活，去登录页（首次登录要绑定验证器）
```

| 情形 | 响应 | 页面 |
|---|---|---|
| 链接无效、过期或已被重发作废 | #9 `410`·`306005` | 提示联系管理员重发邀请 |
| 链接已用过、账号已激活 | #9 `410`·`306006` | 提示已激活，给「去登录」 |
| 新密码不满足规则 | #9 `400` | 在新密码框下提示 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 建号 | v1 管理员直接设初始密码 | 邀请邮件、本人设密 | 管理员不经手他人密码 |

## 页面：确认新登录邮箱

管理员改了已激活账号的登录邮箱后，新邮箱收到确认链接（带 `token`）。页面显示说明与「确认」按钮，点了才提交；确认前旧邮箱仍可登录。打开页面不调接口、不消费链接。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开确认链接，点确认
    S->>A: #35;10 [confirmLoginEmailChange]<br/>POST /auth/email-confirmation
    A-->>S: 204
    S->>U: 提示已切换，之后用新邮箱登录
```

| 情形 | 响应 | 页面 |
|---|---|---|
| 链接无效、过期或已被新的改动顶掉 | #10 `410`·`306002` | 提示链接已失效，联系管理员 |
| 新邮箱在确认前已被别的账号使用 | #10 `409`·`968001` | 提示该邮箱已被使用，联系管理员换一个 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 改登录邮箱 | Hub 超管在员工编辑里直接改，即生效 | 新邮箱确认后才生效 | 防止填错邮箱把人锁在外面 |

## 页面：个人设置 · 资料

个人设置一页四块：资料、安全、企业微信、登录 IP 白名单，进入时一次读取。资料块可改显示名、姓名、电话、职务；登录邮箱、角色只读（登录邮箱由管理员改）。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入个人设置
    S->>A: #35;11 [getMyProfile]<br/>GET /me
    A-->>S: 200 { loginId, displayName, roleNames, mfaEnrolled,<br/>wechat, loginIpAllowlist, currentIp }

    Note over U,A: 资料
    U->>S: 改资料，保存
    S->>A: #35;12 [updateMyProfile]<br/>PUT /me
    A-->>S: 204
```

- 只提交改过的字段；要清空姓名、电话或职务时传 `null`。
- 编辑态有未保存的修改时离开，按公共约定先确认。

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 本人资料保存 | v1 不过滤请求字段，可顺带改角色、状态 | 只认资料字段，其他字段忽略 | 本人不能给自己提权 |

---

## 页面：个人设置 · 安全

两个操作：改密；重绑验证器（换手机或验证器丢失时，先输当前密码换发新密钥，再输新验证器上的码）。没有关闭验证器的入口。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF
    participant V as 验证器

    Note over U,A: 改密
    U->>S: 输当前密码、新密码
    S->>A: #35;14 [changeMyPassword]<br/>PUT /me/security/password（Idempotency-Key）
    A-->>S: 204

    Note over U,V: 重绑验证器
    U->>S: 点重绑，输当前密码
    S->>A: #35;15 [enrollMfa]<br/>POST /me/security/mfa
    A-->>S: 200 { otpauthUri, secret }
    U->>V: 扫二维码或手输密钥
    U->>S: 输新验证器上的 6 位码
    S->>A: #35;16 [confirmMfa]<br/>POST /me/security/mfa/confirmation
    A-->>S: 204
    S->>A: #35;11 [getMyProfile]<br/>GET /me
```

- 改密后本人其他会话失效、当前会话保留，本人的受信浏览器全部失效。
- 重绑第 1 步成功即作废原验证器、撤销受信浏览器；第 2 步完成前关掉弹窗，账号处于未绑定验证器状态，下次登录会在登录内要求绑定。弹窗关闭前提示这一点。

| 情形 | 响应 | 页面 |
|---|---|---|
| 当前密码错 | #14 / #15 `403`·`306004` | 留在弹窗重输，不跳登录页 |
| 新验证器上的码错 | #16 `403`·`306004` | 原处重输 |
| 没有待确认的密钥 | #16 `410`·`306002` | 从第 1 步重新开始 |
| 新密码不满足规则或与当前相同 | #14 `400` | 在新密码框下提示 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #14 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 换验证器 | v1 本人没有入口，只能改库 | 本人凭当前密码重绑 | 少依赖管理员与改库 |

---

## 页面：个人设置 · 企业微信

显示已绑定的企业微信昵称，或「未绑定」。绑定只能绑到当前登录的本人；解绑后不能扫码登录，已有会话不受影响。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF
    participant W as 企业微信

    Note over U,W: 绑定
    S->>A: #35;17 [initiateMyWechatBinding]<br/>POST /me/wechat
    A-->>S: 200 { qrTicket, qrContent, expiresAt }
    par 用户在手机上
        U->>W: 企业微信扫码并确认
    and 页面轮询
        loop 直到不是 WAITING
            S->>A: #35;18 [pollMyWechatBinding]<br/>GET /me/wechat/{qrTicket}
            A-->>S: 200 { status: WAITING / BOUND / EXPIRED }
        end
    end
    S->>A: #35;11 [getMyProfile]<br/>GET /me

    Note over U,A: 解绑
    U->>S: 点解绑并确认
    S->>A: #35;19 [deleteMyWechatBinding]<br/>DELETE /me/wechat
    A-->>S: 204
```

| 情形 | 响应 | 页面 |
|---|---|---|
| 已绑定，又发起绑定 | #17 `409`·`968003` | 提示先解绑 |
| 二维码过期 | #18 `200 { status: EXPIRED }` | 换新二维码 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 绑定对象 | v1 绑定目标取自无签名 cookie | 只能绑到当前登录的本人 | 不能把企业微信绑到别人的账号上 |

---

## 页面：个人设置 · 登录 IP 白名单

一行一个 IPv4 地址或 CIDR，空 = 不限。页面显示「当前 IP」（取 `currentIp`）并提供「加入当前 IP」；保存是整组置换。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 编辑白名单，保存
    S->>A: #35;13 [updateMyLoginIpAllowlist]<br/>PUT /me/login-ip-allowlist { entries }
    A-->>S: 204
```

| 情形 | 响应 | 页面 |
|---|---|---|
| 非空却不含当前 IP | #13 `400`·`304003` | 提示须包含当前 IP，给「加入当前 IP」 |
| 某项格式不对 | #13 `400`，`details` 定位到该项 | 在该行提示 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 非法条目 | v1 保存时不校验、登录时跳过 | 保存即校验，非法则整组不存 | 存下来的就是会生效的 |

## 流程：登出

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 点退出登录
    S->>A: #35;6 [logout]<br/>DELETE /auth/sessions/current
    A-->>S: 204（cookie 已清除）
    S->>U: 回登录页
```

- 只结束当前会话；本浏览器的受信状态保留，下次在本浏览器登录仍免动态码（有效期内）。

document.querySelectorAll('#content h1,#content h2,#content h3,#content h4').forEach(h=>{if(!h.id)h.id=h.textContent.trim();});
const jump=()=>{if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}};
const fpEl=document.getElementById('contract-fp');

fetch('../../ready.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(rd=>{
if(!rd||!rd.ops)return;
const re=/^\.\.\/([\w-]+)\/index\.html#tag\/[^/]+\/operation\/([\w-]+)$/;
document.querySelectorAll('#content table a[href]').forEach(a=>{
const m=a.getAttribute('href').match(re);if(!m)return;
const k=m[1]+'/'+m[2],got=rd.ops[fp.consumer+'/'+k];if(!got)return;

else{s.textContent=' ⚠️';s.title='契约在实现之后有改动，待后端按新契约重验';}

n.hidden=false;}).catch(()=>{});}
document.querySelectorAll('code.language-mermaid').forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.closest('pre').replaceWith(d);});
mermaid.initialize({startOnLoad:false,theme:'neutral',sequence:{useMaxWidth:true}});
mermaid.run({querySelector:'.mermaid'}).then(jump,jump);
