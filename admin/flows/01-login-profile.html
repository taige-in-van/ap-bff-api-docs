# 登录与个人设置 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。登录、忘记密码与两个邮件链接落地页在登录前：调的是公开端点（`security: []`），不带会话、不带 `X-CSRF-Token`。管理后台没有「当前商户」。

## 本文的页面

| 页面 | 从哪进 | 本文章节 |
|---|---|---|
| 登录 | 未登录时打开管理后台；会话失效（`401`）后 | [页面：登录](#页面：登录) |
| 忘记密码 | 登录页的「忘记密码」 | [页面：忘记密码](#页面：忘记密码) |
| 设置密码 | 邀请邮件里的设置密码链接 | [页面：设置密码](#页面：设置密码) |
| 确认新登录邮箱 | 管理员改了登录邮箱后，新邮箱收到的确认链接 | [页面：确认新登录邮箱](#页面：确认新登录邮箱) |
| 个人设置 | 顶栏头像菜单「个人设置」 | [页面：个人设置 · 资料](#页面：个人设置%20·%20资料)；[页面：个人设置 · 安全](#页面：个人设置%20·%20安全)；[页面：个人设置 · 企业微信](#页面：个人设置%20·%20企业微信)；[页面：个人设置 · 登录 IP 白名单](#页面：个人设置%20·%20登录%20IP%20白名单) |
| 登出 | 顶栏头像菜单「退出登录」 | [流程：登出](#流程：登出) |

## 页面流转

```mermaid
stateDiagram-v2
    direction TB
    state "设置密码" as SP
    state "登录" as L
    state "动态码步 / 绑定验证器" as M
    state "管理后台首页" as H
    state "忘记密码" as F

    [*] --> SP: 点邀请邮件里的链接
    SP --> L: 设密成功
    [*] --> L: 打开管理后台
    L --> F: 忘记密码
    F --> L: 重置成功
    L --> M: 密码或扫码通过
    L --> H: 受信浏览器
    M --> H: 动态码通过
```

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`login`](../auth/index.html#tag/sessions/operation/login) | `POST /auth/sessions` | 密码登录（受信浏览器直接建会话，否则进动态码步或先绑定验证器） |
| 2 | [`completeMfaChallenge`](../auth/index.html#tag/sessions/operation/completeMfaChallenge) | `POST /auth/sessions/mfa` | 动态码步（含首次绑定、信任本浏览器），通过即建会话 |
| 3 | [`initiateWecomLogin`](../auth/index.html#tag/sessions/operation/initiateWecomLogin) | `POST /auth/sessions/wecom` | 企业微信扫码登录发起（官方扫码组件的参数） |
| 4 | [`completeWecomLogin`](../auth/index.html#tag/sessions/operation/completeWecomLogin) | `POST /auth/sessions/wecom/completion` | 扫码回跳后提交（转动态码步，受信浏览器直接建会话） |
| 5 | [`getCurrentSession`](../auth/index.html#tag/sessions/operation/getCurrentSession) | `GET /auth/sessions/current` | 当前会话：身份摘要与可见权限点 |
| 6 | [`logout`](../auth/index.html#tag/sessions/operation/logout) | `DELETE /auth/sessions/current` | 登出 |
| 7 | [`requestPasswordReset`](../auth/index.html#tag/password-resets/operation/requestPasswordReset) | `POST /auth/password-resets` | 找回密码发起（恒 202） |
| 8 | [`confirmPasswordReset`](../auth/index.html#tag/password-resets/operation/confirmPasswordReset) | `POST /auth/password-resets/{challengeId}/confirmation` | 验证码 + 新密码一次提交 |
| 9 | [`acceptInvitation`](../auth/index.html#tag/invitation/operation/acceptInvitation) | `POST /auth/invitation` | 受邀设密（不建会话） |
| 10 | [`confirmLoginEmailChange`](../auth/index.html#tag/email-confirmation/operation/confirmLoginEmailChange) | `POST /auth/email-confirmation` | 确认新登录邮箱（不建会话） |
| 11 | [`getMyProfile`](../auth/index.html#tag/me/operation/getMyProfile) | `GET /me` | 本人资料、绑定状态、白名单与当前 IP |
| 12 | [`updateMyProfile`](../auth/index.html#tag/me/operation/updateMyProfile) | `PUT /me` | 改本人资料 |

## 页面：登录

一张卡片两种模式：账号密码（默认）和企业微信扫码。两种模式都要过动态码步；本浏览器在受信有效期内时免动态码。进入页面不调接口。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF
    participant W as 企业微信

    Note over U,A: 模式一：账号密码
    U->>S: 输登录名、密码
    S->>A: #35;1 [login]<br/>POST /auth/sessions
    alt 受信浏览器
        A-->>S: 200 { status: ESTABLISHED } + Set-Cookie
    else 已绑定验证器
        A-->>S: 200 { status: MFA_REQUIRED, mfaChallenge }
    else 尚未绑定验证器
        A-->>S: 200 { status: MFA_ENROLLMENT_REQUIRED, mfaChallenge, mfaEnrollment }
        S->>U: 显示二维码与手输密钥，提示先在验证器里添加
    end

    Note over U,W: 模式二：企业微信扫码
    S->>A: #35;3 [initiateWecomLogin]<br/>POST /auth/sessions/wecom
    A-->>S: 200 { appId, agentId, redirectUri, state, expiresAt }
    S->>W: 官方扫码组件 ww.createWWLoginPanel（login_type = CorpApp）内嵌二维码
    U->>W: 企业微信 App 扫码并确认
    W-->>S: 浏览器回到 redirectUri（登录回跳落地页），地址带 code、state
    S->>A: #35;4 [completeWecomLogin]<br/>POST /auth/sessions/wecom/completion<br/>code，state
    alt 受信浏览器
        A-->>S: 200 { status: ESTABLISHED } + Set-Cookie
    else 已绑定验证器 / 尚未绑定验证器
        A-->>S: 200 { status: MFA_REQUIRED 或 MFA_ENROLLMENT_REQUIRED, mfaChallenge, mfaEnrollment }
    end

    Note over U,A: 动态码步（两种模式共用）
    U->>S: 输验证器上的 6 位码，勾不勾「信任本浏览器」
    S->>A: #35;2 [completeMfaChallenge]<br/>POST /auth/sessions/mfa
    A-->>S: 200 { status: ESTABLISHED } + Set-Cookie

    Note over S,A: 登录成功后
    S->>A: #35;5 [getCurrentSession]<br/>GET /auth/sessions/current
    A-->>S: 200 { userId, displayName, privileges }
    S->>U: 进入管理后台首页，导航按 privileges 渲染
```

- 动态码步与首次绑定是同一个输入框：`MFA_ENROLLMENT_REQUIRED` 时在输入框上方多显示 `mfaEnrollment` 的二维码（据 `otpauthUri` 渲染）与手输密钥 `secret`。
- 二维码由企业微信官方组件展示、刷新与过期重取，页面不轮询、不做「重新扫码」；到 #3 的 `expiresAt` 还没扫完时，重新调 #3 并重建组件。#3 会给本浏览器建一个未登录会话 cookie，回跳后的 #4 靠它认出是同一个浏览器。
- 回跳落地页拿到地址上的 `code`、`state` 即调 #4，`state` 只能用一次。
- 「信任本浏览器」的有效期由平台设定，页面不显示具体天数。受信状态存在浏览器的 HttpOnly cookie 里，页面不读不写。
- 登录后一律进管理后台首页，不按角色选落地页。会话期间任何接口返回 `401`，回登录页。
- 页面上的权限判断一律查 `privileges`，不按角色名。

| 情形 | 响应 | 页面 |
|---|---|---|
| 登录名不存在、密码错、账号停用、无访问资格（不区分） | #1 `400`·`306001` | 留在表单，提示「登录失败，请检查登录名与密码」 |
| 密码对了（或扫码回跳核过账号）但来源 IP 不在本人白名单 | #1 / #4 `400`·`306010` | 回第一步，提示「当前网络不允许登录」 |
| 扫码的企业微信未绑定、账号停用或被锁定、没有管理后台身份（不区分） | #4 `400`·`306011` | 回登录页，提示「无法使用该企业微信账号登录」，可重新扫码或改用密码 |
| 回跳的这次扫码已用过、已过期，或不是本浏览器发起的 | #4 `410`·`306002` | 回登录页重新扫码 |
| 动态码错 | #2 `400`·`306001` | 留在动态码步重输，不回第一步 |
| 动态码步挑战过期或已用 | #2 `410`·`306002` | 回账号密码步重新登录 |
| 账号因连续失败被锁 | #1 / #2 `423`·`966001` | 提示已锁定，稍后再试或联系管理员解锁 |
| 限流 | `429` | 退避 |

- 失败计数不回前端，页面不显示剩余次数。

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 企业微信扫码 | v1 有一条不过白名单与动态码就签发会话的路径；回跳不校验 `state` | 扫码回到管理后台后先过访问资格与白名单，再过动态码步；`state` 只对发起的浏览器有效、只能用一次 | 不留绕过路径 |
| 未绑定验证器的账号 | v1 密码步后强制先绑定 | 同，绑定在登录内完成，绑定前不建会话 | 管理后台账号必须启用验证器 |
| 白名单拒绝 | v1 计入失败锁定 | 记登录日志，不计入锁定 | 白名单不放行不是猜密码 |
| 受信浏览器 | v1 命中即滑动续期；只在本人改密、管理员重置密码时撤销 | 有效期自签发起算、不续期；被重置验证器时同样撤销 | 凭据变动后旧浏览器不再免动态码 |

## 页面：忘记密码

两步：输登录名 → 一屏填完验证码和新密码 → 成功回登录页。邮箱格式的登录名收邮件验证码；用户名登录名用验证器上的 6 位码。进入页面不调接口。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF
    participant E as 邮箱 / 验证器

    U->>S: 输登录名，点发送验证码
    S->>A: #35;7 [requestPasswordReset]<br/>POST /auth/password-resets
    A-->>S: 202 { challengeId, cooldownSeconds }
    opt 邮箱账号且账号存在
        A->>E: 发 6 位验证码
    end
    U->>E: 取验证码
    U->>S: 输验证码、新密码
    S->>A: #35;8 [confirmPasswordReset]<br/>POST /auth/password-resets/{challengeId}/confirmation
    A-->>S: 204
    S->>U: 提示已重置，回登录页
```

- #7 恒 `202`，不暴露账号是否存在；重发 = 冷却结束后再调 #7，拿新的 `challengeId`。
- 重置后该账号全部会话失效、受信浏览器失效，新密码登录仍要过动态码步。

| 情形 | 响应 | 页面 |
|---|---|---|
| 验证码错、次数未用完 | #8 `400`·`304001` | 原处重输，显示 `context.attemptsRemaining`；新密码不必重填 |
| 错码超限 | #8 `423`·`306003` | 回第一步重新发起 |
| 挑战过期或已用 | #8 `410`·`306002` | 回第一步重新发起 |
| 新密码不满足规则 | #8 `400` | 在新密码框下提示 |
| 限流 | #7 `429` | 退避 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 自助找回 | v1 管理后台没有自助找回 | 与商户后台同一流程 | 少依赖管理员 |

## 页面：个人设置 · 资料

个人设置一页四块：资料、安全、企业微信、登录 IP 白名单，进入时一次读取。资料块可改显示名、姓名、电话、职务；登录邮箱、角色只读（登录邮箱由管理员改）。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入个人设置
    S->>A: #35;11 [getMyProfile]<br/>GET /me
    A-->>S: 200 { loginId, displayName, roleNames, mfaEnrolled,<br/>wecom, loginIpAllowlist, currentIp }

    Note over U,A: 资料
    U->>S: 改资料，保存
    S->>A: #35;12 [updateMyProfile]<br/>PUT /me

## 页面：个人设置 · 安全

两个操作：改密；重绑验证器（换手机或验证器丢失时，先输当前密码换发新密钥，再输新验证器上的码）。没有关闭验证器的入口。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF
    participant V as 验证器

    Note over U,A: 改密
    U->>S: 输当前密码、新密码
    S->>A: #35;14 [changeMyPassword]<br/>PUT /me/security/password（Idempotency-Key）
    A-->>S: 204

    Note over U,V: 重绑验证器
    U->>S: 点重绑，输当前密码
    S->>A: #35;15 [enrollMfa]<br/>POST /me/security/mfa
    A-->>S: 200 { otpauthUri, secret }
    U->>V: 扫二维码或手输密钥
    U->>S: 输新验证器上的 6 位码
    S->>A: #35;16 [confirmMfa]<br/>POST /me/security/mfa/confirmation
    A-->>S: 204
    S->>A: #35;11 [getMyProfile]<br/>GET /me
```

- 改密后本人其他会话失效、当前会话保留，本人的受信浏览器全部失效。
- 重绑第 1 步成功即作废原验证器、撤销受信浏览器；第 2 步完成前关掉弹窗，账号处于未绑定验证器状态，下次登录会在登录内要求绑定。弹窗关闭前提示这一点。

| 情形 | 响应 | 页面 |
|---|---|---|
| 当前密码错 | #14 / #15 `403`·`306004` | 留在弹窗重输，不跳登录页 |
| 新验证器上的码错 | #16 `403`·`306004` | 原处重输 |
| 没有待确认的密钥 | #16 `410`·`306002` | 从第 1 步重新开始 |
| 新密码不满足规则或与当前相同 | #14 `400` | 在新密码框下提示 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #14 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 换验证器 | v1 本人没有入口，只能改库 | 本人凭当前密码重绑 | 少依赖管理员与改库 |

显示已绑定的企业微信名称，或「未绑定」。绑定经企业微信官方扫码，只能绑到当前登录的本人；解绑后不能扫码登录，已有会话不受影响。

    W-->>S: 浏览器回到 redirectUri（绑定回跳落地页），地址带 code、state

```mermaid

    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF
