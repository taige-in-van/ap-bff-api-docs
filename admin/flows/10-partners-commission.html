# 机构与分润 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）。机构、提成矩阵与提成规则是平台级页面，只看功能权限；改派按商户（单户）或源机构（整机构）求数据可见范围；提成报表按主体收口（本人名下商户的只看本人的 BD 报表，所属机构的只看本机构与直接下级机构的机构报表，全部商户的看全部），员工提成按员工收口（本人名下商户的只看本人，所属机构的只看本机构与直接下级机构的员工，全部商户的看全部）；他人推荐码按账号的所属机构收口。按标识打开范围外的对象得到 `404`。本文的金额一律是对应币种最小单位的整数串，页面展示时由前端按币种换算；不同结算币种的金额分别显示，不相加。

## 本文的页面

| 页面 | 从哪进 | 本文章节 |
|---|---|---|
| 机构列表与详情 | 导航「机构与分润 › 机构」 | [页面：机构列表与详情](#页面：机构列表与详情) |
| 新建机构 | 机构列表的「新建机构」 | [页面：新建机构](#页面：新建机构) |
| 编辑与启停机构 | 机构详情的「编辑」「停用」「启用」 | [页面：编辑与启停机构](#页面：编辑与启停机构) |
| 机构分润方案 | 机构详情的「分润方案」区块 | [页面：机构分润方案](#页面：机构分润方案) |
| 提成矩阵与提成规则 | 导航「机构与分润 › 提成矩阵与提成规则」 | [页面：提成矩阵与提成规则](#页面：提成矩阵与提成规则) |
| 改派归属销售 | 商户详情「机构与 BD」处的「改派」 | [页面：改派归属销售](#页面：改派归属销售) |
| 商户划转 | 机构详情的「商户划转」 | [页面：商户划转](#页面：商户划转) |

| 员工提成 | 导航「机构与分润 › 员工提成」 | [页面：员工提成](#页面：员工提成) |
| 推荐码 | 本人设置的「我的推荐码」；导航「后台账号 › 推荐码管理」 | [页面：推荐码](#页面：推荐码) |

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`listPartners`](../partners/index.html#tag/partners/operation/listPartners) | `GET /partners` | 机构列表 |
| 2 | [`createPartner`](../partners/index.html#tag/partners/operation/createPartner) | `POST /partners` | 新建机构 |
| 3 | [`getPartner`](../partners/index.html#tag/partners/operation/getPartner) | `GET /partners/{partnerId}` | 机构详情 |
| 4 | [`updatePartner`](../partners/index.html#tag/partners/operation/updatePartner) | `PUT /partners/{partnerId}` | 编辑机构 |
| 5 | [`updatePartnerEnablement`](../partners/index.html#tag/partners/operation/updatePartnerEnablement) | `PUT /partners/{partnerId}/enablement` | 停用 / 启用机构 |
| 6 | [`listPartnerCommissionPlans`](../partners/index.html#tag/commission-plans/operation/listPartnerCommissionPlans) | `GET /partners/{partnerId}/commission-plans` | 机构的分润方案时段 |
| 7 | [`createPartnerCommissionPlan`](../partners/index.html#tag/commission-plans/operation/createPartnerCommissionPlan) | `POST /partners/{partnerId}/commission-plans` | 设分润方案 |

## 页面：改派归属销售

商户详情「机构与 BD」处点「改派」：先选机构或「Platform 总部」（候选调 #8），再选销售（候选调 #26 带所选 `partnerId`，总部不带），填生效日（默认当日；可选未来，可倒签到上一个月 1 日）与改派原因，提交调 #12；成功后用响应更新该处的机构与 BD，并提示「已同时改派 N 家子商户」（`affectedMerchantCount` 减 1，为 0 不提示）。子商户详情不给「改派」按钮，显示「随主商户」。

- 生效日在未来时，生效日之前该处仍显示原归属，并逐笔显示待生效的改派（每笔的生效日与新归属，取自商户详情的 `pendingSalesAssignments`，按生效日从早到晚，见 06-merchant-ops）。要改待生效的改派就重新提交；要撤回就选回原销售、按同一生效日再提交一次（生效日晚于待生效那笔就不是撤回）。
- 从生效日 0 点起建单的订单归新销售；倒签的部分在次日重算的提成报表里体现。
- 尚无归属的商户同样从「改派」首次指定归属销售，生效日最早可选上一个月 1 日。
- 数据范围为所属机构的用户：机构候选只给本人所属机构及其直接下级机构（选别的机构或总部时 #26 回空列表），生效日另不早于该商户当前归属的生效日，早于时 #12 回 `308705` 并带回该日。

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 整机构迁移 | v1 机构「继承」无审计；Hub 逐户循环、报前 5 个失败商户 | 一次改完、全成或全不变，带生效日与原因，每家商户进审计 | 不留半迁移状态，改派可追查 |

## 页面：提成报表

列表调 #14 与 #15，两者用同一组筛选：交易月区间 `fromMonth` / `toMonth` 两端必填（默认上月；月份候选只含已结束的月份），可按主体类型 `subjectType`、主体 `subjectId`（机构候选调 #8；BD 用账号搜索）、币种 `settleCurrency` 筛选；按币种的合计取 #15。各列取：主体类型与名称、交易月、币种、流水、手续费、机构成本（差价方案才有）、提成、有效商户数、计算时刻 `computedAt`。点一行调 #16 取该报表的行（带该行的 `subjectType` / `subjectId` / `reportMonth` / `settleCurrency`，分页）。

- 报表在月份结束后由系统计算，之后交易明细、归属或分润配置有变动时重算；页面只读、没有状态；付款在线下完成，页面不记付款。
- 「导出」调 #18 带当前筛选；行页面「导出行」调 #19、「导出逐笔明细」调 #20，带报表四键、可选一家商户。
- 逐笔明细按导出时的归属与配置取交易，入口与报表行同一口径（专用入口照记，其余入口记为默认），按商户 × 支付方式 × 入口 × 归属销售汇总后等于这四项都相同的报表行之和；报表计算之后若有改派、配置变更或交易明细变动，下一次计算之前两者可能对不上，下一次计算之后一致。

### 场景：查看报表并导出

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开提成报表，选交易月
    S->>A: #35;14 [listCommissionReports]<br/>GET /commission-reports?fromMonth=&toMonth=
    A-->>S: 200 { total, data }
    S->>A: #35;15 [getCommissionReportSummary]<br/>GET /commission-reports/summary?fromMonth=&toMonth=
    A-->>S: 200 { items }
    U->>S: 点一行
    S->>A: #35;16 [listCommissionReportLines]<br/>GET /commission-report-lines?subjectType=&subjectId=&reportMonth=&settleCurrency=
    A-->>S: 200 { total, data }
    U->>S: 点「导出逐笔明细」，可选一家商户
    S->>A: #35;20 [createCommissionReportTransactionExport]<br/>POST /commission-report-transaction-exports<br/>{ subjectType, subjectId, reportMonth, settleCurrency, merchantId }
    A-->>S: 200 xlsx 文件流
```

| 情形 | 响应 | 页面 |
|---|---|---|
| 交易月区间缺一端、倒置或超过最大查询窗口 | #14 / #15 / #18 `400` | 在月份选择器下提示 |
| 导出行数超过上限 | #18 / #19 / #20 `409`·`308503`（`context.maxRows`） | 提示「超过 N 行」，缩小筛选或按商户导出 |
| 报表不存在或不在本人可见范围 | #16 / #19 / #20 `404` | 提示找不到，回到列表 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 提成结果 | v1 按月列表与明细，无状态、无付款记录；Hub 为演示页 | 报表在月份结束后计算、有变动时重算，无状态，付款线下 | 配置或归属更正后报表随之重算，导出即当时的数 |
| 补算 | v1 端点无权限控制 | 重算只经批运维面板 | 重算受控、可追查 |
| BD 看提成 | v1 BD 只看自己的提成 | 按主体收口，机构账号看本机构与直接下级机构的机构报表 | 报表可见范围与主体一致 |

## 页面：员工提成

调 #17：选一个交易月（默认上月；月份候选只含已结束的月份），可按币种 `settleCurrency`、所属机构 `partnerId`（候选调 #8）筛选，分页。各列取：员工 `staff`、所属组织 `partner`（Platform 员工不返回，显示「Platform」）、币种、流水、提成、有交易商户数、成交笔数。「导出」调 #21 带当前筛选。

- 机构员工的提成只作展示：是所属机构的机构分润中归于其名下交易的部分，机构分润照常按机构计、不另计付。
- 月内改派使一个商户同月分属两名员工时，两人各计各的交易，有交易商户数都含该商户。

### 场景：查看员工提成并导出

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开员工提成，选交易月
    S->>A: #35;17 [listStaffCommissions]<br/>GET /staff-commissions?reportMonth=
    A-->>S: 200 { total, data: [ { staff, partner, settleCurrency, commissionAmount } ] }
    U->>S: 点「导出」
    S->>A: #35;21 [createStaffCommissionExport]<br/>POST /staff-commission-exports<br/>{ reportMonth, settleCurrency, partnerId }
    A-->>S: 200 xlsx 文件流
```

| 情形 | 响应 | 页面 |
|---|---|---|
| 交易月缺失或格式不对 | #17 / #21 `400` | 月份选择框标红 |
| 导出行数超过上限 | #21 `409`·`308503`（`context.maxRows`） | 提示「超过 N 行」，按机构缩小后重试 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 员工提成 | Hub 演示页按归属人现算 | 同一份提成报表按归属销售汇总，机构员工只展示 | 员工提成与机构、BD 报表同一口径，合计对得上 |

## 页面：推荐码

「我的推荐码」调 #22：生效码显示推荐链接 `referralLink`、二维码（前端由链接生成）、复制按钮与打开次数 `openCount`；下方列历史码（含已停用）。生效码给「停用」，历史码给「重新启用」，都调 #23，成功后用响应刷新。

「推荐码管理」调 #24：按码主人、码主人所属机构（候选调 #8）、状态筛选，分页；各行带码主人 `owner`。「停用」「重新启用」调 #25。

- 停用生效码后立即出现一枚新的生效码，旧链接随即无效；重新启用一枚历史码时原生效码同时停用。确认框里写明。
- 码主人被停用或移除期间链接无效，码本身状态不变。

### 场景：停用本人的生效码

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开我的推荐码
    S->>A: #35;22 [listMyReferralCodes]<br/>GET /me/referral-codes
    A-->>S: 200 { items: [ { referralCode, status = ACTIVE, referralLink, openCount } ] }
    U->>S: 点「停用」并确认
    S->>A: #35;23 [updateMyReferralCodeStatus]<br/>PUT /me/referral-codes/{referralCode}/status<br/>{ status = STOPPED }
    A-->>S: 200 { items: [ 新生效码, 已停用的旧码 ] }
```

| 情形 | 响应 | 页面 |
|---|---|---|
| 码不是本人的 | #23 `404` | 提示找不到，重调 #22 |
| 码主人不在本人可管范围 | #25 `404` | 提示找不到，重调 #24 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 推荐码 | v1 无；Hub 推荐码与短链接 | 每个在册账号恰有一枚生效码，链接是商户后台注册页带推荐码，不用短链接；停用即补发 | 经链接注册的商户自动归到码主人名下，链接不会悬空 |
| 管理他人推荐码 | Hub 机构管理员管本机构 | 按账号的所属机构收口，停用与重新启用进审计 | 谁停了谁的码可追查 |

<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
document.getElementById('content').innerHTML = marked.parse(document.getElementById('src').textContent);
document.querySelectorAll('#content h1,#content h2,#content h3,#content h4').forEach(h=>{if(!h.id)h.id=h.textContent.trim();});
const jump=()=>{if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}};
const fpEl=document.getElementById('contract-fp');
if(fpEl){const fp=JSON.parse(fpEl.textContent);
fetch('../../ready.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(rd=>{
if(!rd||!rd.ops)return;
const re=/^\.\.\/([\w-]+)\/index\.html#tag\/[^/]+\/operation\/([\w-]+)$/;
document.querySelectorAll('#content table a[href]').forEach(a=>{
const m=a.getAttribute('href').match(re);if(!m)return;
const k=m[1]+'/'+m[2],got=rd.ops[fp.consumer+'/'+k];if(!got)return;
const s=document.createElement('span');s.className='rd';
if(got===fp.ops[k]){s.textContent=' ✅';s.title='已部署到联调环境，可对接调试';}
else{s.textContent=' ⚠️';s.title='契约在实现之后有改动，待后端按新契约重验';}
a.after(s);});
const n=document.getElementById('ready-note'),c=document.createElement('code');c.textContent=rd.environment||'';
n.append('联调就绪（环境 ',c,'，生成于 '+(rd.generatedAt||'')+'）：✅ 已部署、可对接调试 · ⚠️ 契约在实现之后有改动、待后端重验 · 无标识 = 尚未部署到联调环境。清单更新后页面缓存可能延迟几分钟。');
n.hidden=false;}).catch(()=>{});}
document.querySelectorAll('code.language-mermaid').forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.closest('pre').replaceWith(d);});
mermaid.initialize({startOnLoad:false,theme:'neutral',sequence:{useMaxWidth:true}});
mermaid.run({querySelector:'.mermaid'}).then(jump,jump);
</script>
