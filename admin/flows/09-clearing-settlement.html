# 清算结算 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）。按商户组织的页面（待人工确认退款、清算日汇总、清算记录、结算单详情、商户详情 · 结算、清算报告）按数据可见范围过滤商户，按标识打开范围外商户的数据得到 `404`；通道侧的页面（对账与差异、出款文件、通道结算单、渠道方汇回、T&T 对账文件）是平台级，不按数据可见范围过滤。商户详情的结算页签挂在商户详情下（商户详情见 06-merchant-ops）。本文的金额一律是对应币种最小单位的整数串，页面展示时由前端按币种换算；不同结算币种的金额分别显示，不相加。

## 页面：对账与差异

上半区是通道账单与对账结果，调 #1；下半区是差异列表，调 #4。两者都按账单日区间筛选（`from` / `to` 两端必填，默认最近 30 天、含今天），可按通道 `channelId` 筛选（通道候选调 #47）；账单区另按账单状态 `billStatus`，差异区另按分类 `discrepancyClass`、对象类型 `objectType`（支付〔含撤销〕/ 退款）、状态 `status`。

- 账单各列取：通道 `channel`（名称与收单主体号）、账单日 `billDate`、类型 `billType`、状态 `billStatus` 与失败原因 `failureReason`、通道声明的收款与退款笔数和金额、结果档 `resultLevel`（全部一致 / 有金额差异 / 有漏单）、各分类差异计数 `discrepancyCounts`。`hasOriginal` 为真时给「下载原件」，调 #2 拿短时地址后直接下载；`hasOriginal` 为假的行没有下载动作。
- 账单行给「重新对账」，调 #3，带该行的 `channelId` 与 `billDate`，受理后提示「已开始重新对账，稍后刷新查看」；完成后重调 #1 / #4 看到新结果，旧的一份账单不再出现。
- 差异各列取：通道、账单日、对象类型 `objectType`、分类 `discrepancyClass`、配对键 `matchKey`、通道金额 `channelAmount` 与平台金额 `platformAmount`、不符字段 `fieldDifferences`、状态 `status`、处置方向 `disposition`、说明 `note`、处理人 `resolvedBy` 与处理时刻 `resolvedAt`、平台订单号 `orderId` 与商户 `merchant`（平台没有这一笔时空着）、计入平台资损的原因归属 `lossCause` 与追回情况 `lossRecovery`（追回额与调账单号，未计入 / 未追回时空着）。点一行进差异详情。
- 「取整差批量核销」：选账单日区间（两端必填）、可选通道（候选调 #47）、填说明，调 #9，返回核销条数后提示「已核销 N 条」并重拉 #4。只作用于退款取整差汇总。

### 场景：重新对账

```mermaid
sequenceDiagram

    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开对账与差异
    S->>A: #35;1 [listChannelBills]<br/>GET /channel-bills?from=…&to=…
    A-->>S: 200 { total, data: [ { billId, channel, billDate, billStatus,<br/>resultLevel, discrepancyCounts } ] }
    U->>S: 某行点「重新对账」并确认
    S->>A: #35;3 [createReconciliationRerun]<br/>POST /channel-bill-reruns<br/>{ channelId, billDate }
    A-->>S: 202
    U->>S: 稍后刷新
    S->>A: #35;1 [listChannelBills]<br/>GET /channel-bills?from=…&to=…
    A-->>S: 200 { total, data }
```

## 页面：差异详情

单条差异，调 #5：列表行的字段，加所在账单 `billId` 与通道账单行号 `billLineNo`。按状态与分类给动作：

- 待处理、不是退款取整差汇总、`disposition` 为空、为 `pursue` 或为 `refund_back`：「提交处置」（四选一 + 说明必填）调 #6。
- 待处理、`disposition` 为空（没提交过处置时说明必填）、为 `pursue`、为 `refund_back` 或 `dispositionAppliedAt` 有值：「确认已处理」调 #7。
- 待处理、是长款 / 短款 / 退款取整差汇总、`disposition` 为空或为 `pursue`：「核销」（说明必填）调 #8。状态不符的不给核销；已提交补记 / 字段更正 / 原路退回的不给核销，只给「确认已处理」。退款行短款对应的退款已确认在通道受理后失败、已结回商户的，也只能确认已处理；对应的退款仍在通道处理中（已受理）的，等该退款有结论后再处置；这两种核销回 `308605`。
- 收款短款、退款长款的「核销」里给可选的「计入平台资损」，选了要选原因归属 `lossCause`（平台系统差错 / 通道差错 / 运营差错）一并带给 #8；其余差异带了原因归属回 `308605`。
- 已核销、有 `lossCause`、没有 `lossRecovery`：「向商户追回」（追回额与原因必填）调 #48，带 `Idempotency-Key`，成功后重调 #5。
- 已处理、已核销：只读，显示处理人、时刻与说明，计入平台资损的另显示原因归属与追回情况。

### 场景：差异处置

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 点一条差异
    S->>A: #35;5 [getReconDiscrepancy]<br/>GET /recon-discrepancies/{discrepancyId}
    A-->>S: 200 { discrepancyId, discrepancyClass, status, fieldDifferences }
    U->>S: 选处置方向并填说明
    S->>A: #35;6 [submitDiscrepancyDisposition]<br/>POST /recon-discrepancies/{discrepancyId}/disposition<br/>{ disposition, note }
    alt 补记 / 字段更正执行成功，或原路退回 / 向通道追款
        A-->>S: 200 { status = pending, disposition, dispositionAppliedAt }
        U->>S: 核实后点「确认已处理」
        S->>A: #35;7 [resolveReconDiscrepancy]<br/>POST /recon-discrepancies/{discrepancyId}/resolution
        A-->>S: 204
    else 执行方拒绝
        A-->>S: 409 308604 { context.reasonCode }
        Note over S: 显示被拒原因，差异仍为待处理
    end
    S->>A: #35;5 [getReconDiscrepancy]<br/>GET /recon-discrepancies/{discrepancyId}
    A-->>S: 200 { status, disposition, resolvedBy, resolvedAt }
```

- 原路退回、向通道追款由运营在通道端自行处理，提交后差异仍为待处理：原路退回核实退成后点「确认已处理」（不能核销）；追回后点「确认已处理」，追不回的点「核销」（长款 / 短款）。已提交原路退回或追款的可以改提其他处置。
- 执行方拒绝的原因只在 #6 的这次失败响应里（`context.reasonCode`，按码取展示文案，取不到时显示码），详情里不保留。
- 处置与确认都是具备权限的用户单人确认，没有审批单。

| 情形 | 响应 | 页面 |
|---|---|---|
| 差异已不在待处理（他人先处理了，或自己上一次已成功） | #6 / #7 / #8 `409`·`308603` | 提示「该差异已被处理」，重调 #5 |
| 执行方拒绝该处置 | #6 `409`·`308604`（`context.reasonCode`） | 显示被拒原因，处置方向不记 |
| 处置不适用（取整差汇总只能核销、状态不符不能核销、已提交补记 / 字段更正 / 原路退回的不能核销、退款行短款的退款已确认受理后失败或仍在通道处理中的不能核销、已提交补记 / 字段更正后不能改提、选了原因归属但差异不能计入平台资损） | #6 / #7 / #8 `409`·`308605` | 提示该处置不适用，重调 #5 |
| 不能追回（未计入平台资损、已追回过、追回额超过资损额、找不到对应商户） | #48 `409`·`308618` | 提示不能追回，重调 #5 |
| 商户可扣不足（可结算余额加剩余授信额度不够追回额） | #48 `409`·`308619` | 提示商户可扣不足，可改小追回额 |
| 说明没填或超长 | #6 / #7 / #8 `400` | 说明框标红 |
| 追回额币种不对、原因没填或超长 | #48 `400` | 对应输入框标红 |
| 差异不存在 | #5 / #6 / #7 / #8 / #48 `404` | 提示找不到，回到对账与差异并刷新 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 差异处置 | v1 一列覆盖写的「已处理」备注，无人无时 | 待处理 / 已处理 / 已核销三态 + 处置方向 + 说明 + 处理人与时刻 | 每条差异有人负责、有结论，可追查 |
| 处置执行 | v1 对账时直接改写交易原行 | 处置交执行方执行，执行成功才记下 | 对账不越权改订单与退款 |

## 页面：待人工确认退款

结果长期未明、已转人工确认的退款，按 `confirmationState` 分「待确认」（`PENDING`，默认）与「已确认」（`CONFIRMED`）两个页签，调 #10。筛选：商户 `merchantId`、关键词 `keyword`（平台订单号、平台退款号、通道退款号）；「已确认」另按确认日期区间 `from` / `to`，两端必填、默认最近 30 天；「待确认」不按日期。

- 各列取：商户 `merchant` 与商户码、平台订单号 `orderId`、平台退款号 `refundId`、退款金额 `amount`、结算币种退款额 `settleAmount`、受理时刻 `acceptedAt`、转人工时刻 `escalatedAt`、通道退款号 `channelRefundNo`、通道错误 `channelError`（码与文字原样）。「已确认」另列结果（`status = SUCCESS` 显示「通道已退」，`FAILED` 显示「通道未退」）、确认人 `confirmedBy`、确认时刻 `confirmedAt`、确认说明 `confirmationNote`。
- 导航上「待人工确认退款」的红点 = `confirmationState = PENDING` 时 #10 的 `total`；页面加载时与每次确认后刷新。

单张结算单：汇总与全部出款尝试调 #16，逐笔明细（分页）调 #17。

- 汇总同清算记录的列。出款尝试按序号列出：出款文件 `payoutFileId`（点进出款文件详情）、出款额、打入账户、失败类别 `failureKind`（受理时被剔除或所在文件整份被拒 / 退票 / 所在文件提交前作废）、原因码与原因（整份被拒时为文件的拒绝原因）、退票日期 `failedOn`。
- 明细各列取：类型 `lineType`、来源单据 `sourceId`、订单号 `orderId`、支付方式 `paymentMethodFamily`、结算金额 `settleAmount`、手续费 `feeAmount`、调账原因 `adjustmentReason`、结算锁 `holdActive`、归属日 `businessDate`。
- `status = FAILED` 时给「重新出款」，调 #27。

### 场景：重新出款

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开结算单详情
    S->>A: #35;16 [getSettlementBatch]<br/>GET /settlement-batches/{batchId}
    A-->>S: 200 { batchId, status = FAILED, payoutAttempts }
    U->>S: 点「重新出款」并确认
    S->>A: #35;27 [retrySettlementBatchPayout]<br/>POST /settlement-batches/{batchId}/payout-retry<br/>Idempotency-Key
    A-->>S: 204
    S->>A: #35;16 [getSettlementBatch]<br/>GET /settlement-batches/{batchId}
    A-->>S: 200 { status = PENDING, payoutAttempts }
```

- 重新出款后结算单回到待出款，下次生成出款文件时装入，详情里多一次出款尝试。该商户结算暂停或已冻结的照常受理、结算单保持待出款，恢复或解冻后才装入出款文件。
- 每次点击生成一个新的 `Idempotency-Key`，同一次点击因超时重试时沿用同一个键。

## 页面：出款文件详情

单份出款文件，调 #21：列表行的字段，加文件内全部出款行（行号、结算单 `batchId` 与其状态 `batchStatus`、商户、出款额、失败类别与原因）。「下载原件」调 #22。按文件状态给动作：

| 文件状态 | 动作 |
|---|---|
| 已生成（平台出款） | 「登记已提交」#23、「作废」#25 |
| 已生成（渠道方执行） | 只读（系统已发送，发送失败到通知投递记录人工重投） |
| 已提交 | 「登记受理结果」#24 |
| 已受理 | 未失败的行给「登记退票」#26 |
| 被拒、已作废 | 只读 |

### 场景：出款登记

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开出款文件详情
    S->>A: #35;21 [getPayoutFile]<br/>GET /payout-files/{payoutFileId}
    A-->>S: 200 { payoutFileId, status = GENERATED, lines }
    U->>S: 下载原件交给银行
    S->>A: #35;22 [getPayoutFileOriginal]<br/>GET /payout-files/{payoutFileId}/original
    A-->>S: 200 { url, expiresAt }
    U->>S: 点「登记已提交」，可填受理凭据
    S->>A: #35;23 [submitPayoutFile]<br/>POST /payout-files/{payoutFileId}/submission<br/>{ bankReference }
    A-->>S: 204
    U->>S: 银行回结果后点「登记受理结果」，选受理并勾要剔除的行与原因，或选被拒并填原因
    S->>A: #35;24 [acknowledgePayoutFile]<br/>POST /payout-files/{payoutFileId}/acknowledgement<br/>Idempotency-Key，{ result, bankReference, rejectedLines, rejectionReason }
    A-->>S: 204
    S->>A: #35;21 [getPayoutFile]<br/>GET /payout-files/{payoutFileId}
    A-->>S: 200 { status = ACCEPTED, lines }
```

- 整份受理时被剔除的行所属结算单转出款失败（到清算记录重新出款），其余行所属结算单转已结算；整份被拒时全部行记为被拒（钱未出），其所属结算单转出款失败。
- 作废只对还没提交的平台出款文件：文件里的行都记为作废（钱未出，结算单详情里那次出款尝试照列、失败类别为作废，打入账户不取这一次），所涉结算单回到待出款，下次生成出款文件时重新装入。渠道方执行的文件不能作废；它发送失败时保持已生成，到通知投递记录人工重投，重投发送成功即转已提交。
- 登记受理结果是资金登记：每次点击生成一个新的 `Idempotency-Key`，同一次点击因超时重试时沿用同一个键。

### 场景：退票后暂停

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 在已受理文件的一行点「登记退票」，填原因与退票日期
    S->>A: #35;26 [returnPayoutLine]<br/>POST /payout-file-lines/{payoutLineId}/return<br/>Idempotency-Key，{ failureCode, failureReason, failedOn }
    A-->>S: 200 { payoutLineId, batchId, merchant }
    Note over S: 提示「已登记退票，可暂停该商户结算」
    U->>S: 点提示里的「去暂停」
    S->>A: #35;43 [updateMerchantSettlementControls]<br/>PATCH /merchants/{merchantId}/settlement-controls<br/>{ settlementPaused = true }
    A-->>S: 204
```

- 登记退票不会暂停该商户结算；暂停是另一次独立操作（#43，要 `clr:settlement-terms:edit`），不点就不暂停。
- 退票后所属结算单为已退票，退回的款回到该商户的待结算池、随后续结算单再出款。

| 情形 | 响应 | 页面 |
|---|---|---|
| 文件状态不受理该登记（已被他人登记，或自己上一次已成功） | #23 / #24 / #25 `409`·`308606` | 提示「文件状态已变化」，重调 #21 |
| 剔除的行不属于该文件 | #24 `409`·`308607`（`details` 指到行） | 标出那几行，重调 #21 |
| 不能登记退票（文件未受理、该行已被剔除或已退票） | #26 `409`·`308608` | 提示后重调 #21 |
| 被拒没填原因、受理与被拒字段混填、原因超长 | #24 / #26 `400` | 对应输入框标红 |
| 同一个键首次请求还在处理 | #24 / #26 `409`·`908002` | 稍后用同一个键重试 |
| 文件或出款行不存在 | #21 ~ #26 `404` | 提示找不到，回到出款文件并刷新 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 出款文件 | v1 只按清算日现场生成下载，不落提交、受理、退票状态 | 文件落库，提交、受理、被拒、作废、退票、重新出款全流程登记 | 每笔出款都有结果、不双付 |

## 页面：通道结算单

通道结算单列表调 #28，按通道小计调 #29，两者带同一组筛选：结算日区间 `from` / `to`（两端必填，默认最近 30 天）、通道 `channelId`（候选调 #47）、核对结果 `verifyStatus`（一致 / 不一致 / 未核对）、是否已确认到账 `receiptConfirmed`。

- 各列取：通道 `channel`、结算日 `settleDate`、通道批次号 `channelBatchNo`、覆盖区间、通道声明的收款 / 退款 / 净手续费 / 净额 / 未结算额、核对结果 `verifyStatus`、到账确认金额 / 人 / 时刻 / 备注、差异说明 / 人 / 时刻。小计每通道一行：声明净额合计、已确认笔数与确认金额合计、未确认笔数。
- 未确认的行给「确认到账」：弹框默认带 `netAmount` 作确认金额、可改，备注可填，调 #30。已确认的行给「撤销确认」，调 #31。`awaitingDiscrepancyNote` 为真的行给「差异说明」，调 #32。每次成功后重调 #28 与 #29。
- 确认与撤销只是记录，不改账务。撤销回到确认前，已填的差异说明一并清空；重新确认后仍有待说明差异的，照常再填说明。

### 场景：到账确认

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开通道结算单
    S->>A: #35;28 [listChannelSettlements]<br/>GET /channel-settlements?from=…&to=…&receiptConfirmed=false
    A-->>S: 200 { total, data: [ { channelSettlementId, netAmount, verifyStatus } ] }
    S->>A: #35;29 [getChannelSettlementSummary]<br/>GET /channel-settlements/summary?from=…&to=…&receiptConfirmed=false
    A-->>S: 200 { items }
    U->>S: 核对银行流水后点「确认到账」，改确认金额
    S->>A: #35;30 [confirmChannelSettlementReceipt]<br/>POST /channel-settlements/{channelSettlementId}/receipt-confirmation<br/>{ confirmedAmount, note }
    A-->>S: 204
    S->>A: #35;28 [listChannelSettlements]<br/>GET /channel-settlements?from=…&to=…
    A-->>S: 200 { data: [ { receiptConfirmedAmount, awaitingDiscrepancyNote = true } ] }
    U->>S: 确认金额与声明净额不一致，点「差异说明」
    S->>A: #35;32 [resolveChannelSettlementDiscrepancy]<br/>POST /channel-settlements/{channelSettlementId}/discrepancy-resolution<br/>{ note }

- 各列取：商户 `merchant` 与商户码、清算日、当天结算单张数 `batchCount`、出款额合计 `payoutAmount`。
- 每行给「查看投递」：跳到运维与审计的通知投递记录（#46），带该商户 `merchantId` 与 `scene = settlement_report.issued`，日期范围取该清算日起；要另持 `opscon:notification:view`。投递记录在那里看，本页不显示。
- 每行给「补发」，调 #38；补发是再发一封、可重复，提交后到返回前禁用按钮。

### 场景：清算报告补发

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 选清算日
    S->>A: #35;37 [listSettlementReports]<br/>GET /settlement-reports?settlementDate=…
    A-->>S: 200 { total, data: [ { merchant, settlementDate, batchCount, payoutAmount } ] }
    U->>S: 某商户点「查看投递」
    S->>A: #35;46 [listNotificationDeliveries]<br/>GET /notification-deliveries?merchantId=…&scene=settlement_report.issued&from=…&to=…
    A-->>S: 200 { total, data: [ { deliveryId, status, recipientAddress } ] }
    U->>S: 投递失败，回清算报告点「补发」
    S->>A: #35;38 [redeliverSettlementReport]<br/>POST /merchants/{merchantId}/settlement-reports/{settlementDate}/redeliveries
    A-->>S: 202
```

| 情形 | 响应 | 页面 |
|---|---|---|
| 该商户属 T&T 商户组 | #38 `409`·`308616` | 提示「该商户不发清算报告」 |
| 该商户该清算日没有结算单，或不在数据范围内 | #38 `404` | 提示找不到，重拉 #37 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 补发 | v1 只要登录即可补发、看不到发送结果 | 按权限点补发、进操作审计；投递结果在通知投递记录查看 | 谁补发的可追查，送没送达有记录 |
| 合并发送 | v1 同一联系邮箱的多家门店合并成一封 | 一商户一封 | 每封对应一个商户，补发与追查按商户 |

## 页面：T&T 对账文件

T&T 对账文件列表，调 #39。筛选：生成日期区间 `from` / `to`（两端必填，默认最近 30 天）。

- 各列取：种类 `fileKind`（线下 / 线上）、覆盖区间 `periodFrom` ~ `periodTo`、生成时刻 `createdAt`、推送状态 `deliveryStatus`、推送次数 `deliveryAttempts`、最近推送时刻与失败原因、送达时刻 `deliveredAt`。
- 「下载原件」调 #40。推送状态不是推送中的行给「重发」，调 #41；重发是同一文件再推一次，不重新生成内容，受理后稍后刷新 #39 看结果。

### 场景：T&T 对账文件重发

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开 T&T 对账文件
    S->>A: #35;39 [listMerchantReconFiles]<br/>GET /merchant-recon-files?from=…&to=…
    A-->>S: 200 { total, data: [ { reconFileId, deliveryStatus = FAILED, lastFailureReason } ] }
    U->>S: 点「重发」
    S->>A: #35;41 [redeliverMerchantReconFile]<br/>POST /merchant-recon-files/{reconFileId}/redeliveries
    A-->>S: 202
    U->>S: 稍后刷新
    S->>A: #35;39 [listMerchantReconFiles]<br/>GET /merchant-recon-files?from=…&to=…
    A-->>S: 200 { data: [ { deliveryStatus = DELIVERED, deliveryAttempts, deliveredAt } ] }
```

| 情形 | 响应 | 页面 |
|---|---|---|
| 文件正在推送 | #41 `409`·`308614` | 提示「正在推送，请稍后再试」 |
| 文件不存在 | #40 / #41 `404` | 提示找不到，重拉 #39 |

---

## 页面：清结算异常概览

调 #19，一组计数卡片，每张可跳到对应列表：

| 卡片 | 字段 | 跳到 |
|---|---|---|
| 出款失败待重新出款 | `failedBatchCount` | 清算记录，`status = FAILED` |
| 已提交未登记受理（显示最早提交时刻） | `submittedPayoutFileCount`、`earliestSubmittedAt` | 出款文件，`status = SUBMITTED` |
| 账单拉取 / 导入失败 | `failedBillCount` | 对账与差异，`billStatus` 选两种失败 |
| 待处理差异（显示最早账单日） | `pendingDiscrepancyCount`、`earliestPendingBillDate` | 对账与差异的差异列表，`status = pending`，日期从最早账单日起 |
| 待人工确认退款 | `pendingRefundConfirmationCount` | 待人工确认退款 |

- 待人工确认退款只计本人数据范围内的商户，其余是平台级计数。计数为 0 时不显示最早时刻 / 最早账单日。

## 页面：平台清结算参数

清结算相关的平台级参数：各结算币种的默认平台出款格式、出款文件头各项、T&T 商户组（T&T 主商户号）、T&T 线上商户清单、NihaoPay 出款文件收件人、T&T 对账文件收件人。形态与平台参数页相同（见 03-settings），调 #44 列出、#45 改值或恢复默认（`value` 传 `null`）。

- 这些参数没有默认值，没录入的显示为空（列表项不带 `value` 与 `effectiveValue`）；恢复默认后该参数无值。
- 收件人是邮箱地址列表，以英文逗号分隔，不分抄送；系统向每个地址各发一份。
- 改动对此后生成的文件与发出的邮件生效。

| 情形 | 响应 | 页面 |
|---|---|---|
| 版本已过期 | #45 `409`·`308103` | 提示他人已改过，重拉 #44 |
| 值的类型或取值不合值域（如收件人里有不合法的邮箱） | #45 `400`，`details` 定位到 `value` | 输入框标红 |
| 参数已不存在 | #45 `404` | 重拉 #44 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 出款文件头 | v1 发起方号、批号、退回账户等写死在程序里，改要发版 | 平台参数，运营可改、不发版，改动进操作审计 | 银行号随业务变化，不必等发版 |

</script>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
document.getElementById('content').innerHTML = marked.parse(document.getElementById('src').textContent);
document.querySelectorAll('#content h1,#content h2,#content h3,#content h4').forEach(h=>{if(!h.id)h.id=h.textContent.trim();});
const jump=()=>{if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}};
const fpEl=document.getElementById('contract-fp');
if(fpEl){const fp=JSON.parse(fpEl.textContent);
fetch('../../ready.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(rd=>{
if(!rd||!rd.ops)return;
const re=/^\.\.\/([\w-]+)\/index\.html#tag\/[^/]+\/operation\/([\w-]+)$/;
document.querySelectorAll('#content table a[href]').forEach(a=>{
const m=a.getAttribute('href').match(re);if(!m)return;
const k=m[1]+'/'+m[2],got=rd.ops[fp.consumer+'/'+k];if(!got)return;
const s=document.createElement('span');s.className='rd';
if(got===fp.ops[k]){s.textContent=' ✅';s.title='已部署到联调环境，可对接调试';}
else{s.textContent=' ⚠️';s.title='契约在实现之后有改动，待后端按新契约重验';}
a.after(s);});
const n=document.getElementById('ready-note'),c=document.createElement('code');c.textContent=rd.environment||'';
n.append('联调就绪（环境 ',c,'，生成于 '+(rd.generatedAt||'')+'）：✅ 已部署、可对接调试 · ⚠️ 契约在实现之后有改动、待后端重验 · 无标识 = 尚未部署到联调环境。清单更新后页面缓存可能延迟几分钟。');
n.hidden=false;}).catch(()=>{});}
document.querySelectorAll('code.language-mermaid').forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.closest('pre').replaceWith(d);});
mermaid.initialize({startOnLoad:false,theme:'neutral',sequence:{useMaxWidth:true}});
mermaid.run({querySelector:'.mermaid'}).then(jump,jump);
</script>
