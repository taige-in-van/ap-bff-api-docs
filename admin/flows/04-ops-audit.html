# 运维与审计 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。

本文各页只查询、只发命令：操作记录、通知投递记录、对外投递任务、批任务执行都由各自所属的服务产生和推进，页面看到的状态以重新读取的结果为准。按商户组织的结果只含本人数据可见范围内的商户，由服务端裁决，前端不另过滤。

## 页面：操作审计

全平台的操作记录，只读。筛选：发生日期范围、商户、操作人、操作对象（类型 + 标识）、动作、结果。列表各列取：时间 `occurredAt`、操作人 `actor`（代登产生的记录另显示代登人 `impersonator`）、商户 `merchant`、动作 `action`、对象 `targetType` + `targetRef`、结果 `result`、前后状态 `stateBefore` → `stateAfter`、来源 IP `clientIp`。点一行看改动内容。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入操作审计，选日期范围与其他筛选
    S->>A: #35;1 [listAuditEvents]<br/>GET /audit-events?from=…&to=…&merchantId=…&actorUserId=…
    A-->>S: 200 { total, data: [ { eventId, occurredAt, actor, impersonator,<br/>merchant, action, targetType, targetRef, result } ] }

    U->>S: 点一行
    S->>A: #35;2 [getAuditEvent]<br/>GET /audit-events/{eventId}
    A-->>S: 200 { …列表行字段, changes }
```

- 列表固定按发生时间从新到旧，没有排序参数。
- 日期范围两端必填，默认最近 30 天；按字面传，前端只管选日期，服务端怎么换成时刻见[管理后台约定](../conventions.html)「列表的日期范围」。
- 操作人、商户筛选的候选由前端用对应页面的搜索取（后台用户、商户），提交的是 `actorUserId`、`merchantId`；对象筛选 `targetType` 与 `targetRef` 一起传。
- 动作、对象类型的展示名按码从前端多语言资源取，查不到就显示码。
- 改动内容 `changes` 的键随动作而定，按键值逐项展示。
- 页面没有删除、清空入口。
- 按一个不在本人数据可见范围内的商户筛选，结果为空，不报错。

| 情形 | 响应 | 页面 |
|---|---|---|
| 日期范围 `to` 早于 `from` | #1 `400` | 在日期选择器下提示 |
| 记录不在本人数据可见范围内 | #2 `404` | 提示「记录不存在」 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 记了哪些操作 | v1 只记打了标记的接口，平台参数写入、各运维接口不记 | 人经界面做的敏感操作都记 | 操作审计要覆盖全部人的敏感操作 |
| 被拒的尝试 | Hub 越权请求记一条「拒绝」 | 权限检查被拒的不记 | 没有发生操作 |
| 每条显示什么 | Hub 显示上游接口、耗时、部分写入标记 | 操作人、代登人、商户、动作、对象、结果、前后状态、来源 IP、改动内容 | 只记业务上发生了什么 |
| 谁能横查 | Hub 只有超管 | 有权限点即可，结果按数据可见范围 | 按权限点授权 |
| 删除与清空 | v1 有删除权限的可逐条删除、一键清空 | 没有 | 操作记录只按保留期到期清理 |

## 页面：商户详情 · 本商户操作记录 页签

商户详情里的一个页签，列出与该商户相关的操作记录：该商户用户的操作、代登期间的操作、后台用户对该商户的操作。数据与「页面：操作审计」同源，只是固定了商户。可再按日期范围、操作人、动作筛选；点一行看改动内容。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 在商户详情点「本商户操作记录」
    S->>A: #35;1 [listAuditEvents]<br/>GET /audit-events?merchantId={merchantId}&from=…&to=…
    A-->>S: 200 { total, data }

    U->>S: 点一行
    S->>A: #35;2 [getAuditEvent]<br/>GET /audit-events/{eventId}
    A-->>S: 200 { …列表行字段, changes }
```

- 每次请求都带当前商户的 `merchantId`；日期范围同样两端必填、默认最近 30 天；其余筛选与「页面：操作审计」相同。
- 页签按 `opscon:audit:view` 显示，没有这个权限点的不显示页签、不调 #1。
- 看不到的商户本来进不了它的详情，页签无需另判。

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 单商户入口 | v1 没有；Hub 商户详情「日志」页签，默认 50 条、最多 500 条 | 有，分页、条数不封顶，与全局横查同源 | 处理单个商户的事务时不必离开商户详情 |

## 页面：通知投递

邮件与微信模板消息的投递记录。筛选：建立日期范围、商户、通道、通知场景、状态；查发送失败的选状态「发送失败」。列表各列取：时间 `createdAt`、场景 `scene`、通道 `channel`、收件人类型与地址 `recipientType` / `recipientAddress`、商户 `merchant`、状态 `status`、尝试次数 `attempts`、失败原因 `failureReason`。`redeliverable` 为真的行可重投；也可按当前筛选批量重投。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入通知投递，选日期范围与状态「发送失败」
    S->>A: #35;3 [listNotificationDeliveries]<br/>GET /notification-deliveries?from=…&to=…&status=FAILED
    A-->>S: 200 { total, data: [ { deliveryId, scene, channel, recipientAddress,<br/>merchant, status, failureReason, redeliveredTo, redeliverable } ] }

    Note over U,A: 单条重投
    U->>S: 在某行点重投
    S->>A: #35;4 [redeliverNotification]<br/>POST /notification-deliveries/{deliveryId}/redeliveries
    A-->>S: 201 { deliveryId（新记录）, status: QUEUED }
    S->>A: #35;3 [listNotificationDeliveries]<br/>GET /notification-deliveries?…（刷新）
    A-->>S: 200 { total, data }

    Note over U,A: 批量重投
    U->>S: 点「重投筛选结果」，确认条数
    S->>A: #35;5 [redeliverFailedNotifications]<br/>POST /notification-deliveries/redeliveries { from, to, merchantId, channel, scene }
    A-->>S: 200 { redeliveredCount }
    S->>A: #35;3 [listNotificationDeliveries]<br/>GET /notification-deliveries?…（刷新）
    A-->>S: 200 { total, data }
```

- 重投按钮只在 `redeliverable` 为真的行出现，页面不自己按状态或场景判断；含验证码或一次性链接的邮件 `redeliverable` 恒为假，由用户自己重新发起。有 `redeliveredTo` 的行显示「已重投」，可跳到那条新记录。
- 日期范围两端必填，默认最近 30 天；列表与批量重投同此，换算见[管理后台约定](../conventions.html)「列表的日期范围」。
- 新记录随后由系统发送，结果要重新读取才看得到；新记录仍可能发送失败（如模板还没修好），原因见它的 `failureReason`，修好后对新记录再重投。
- 批量重投的请求体用页面当前的筛选条件；确认框里的条数取当前列表在状态「发送失败」下的 `total`，实际重投的条数以响应的 `redeliveredCount` 为准（已重投过的跳过）。
- #4、#5 都带 `Idempotency-Key`，点一次生成一个键；网络失败重试沿用同一个键。
- 重投按钮按 `opscon:notification:create` 显示。
- 场景的展示名按码从前端多语言资源取，查不到就显示码。

| 情形 | 响应 | 页面 |
|---|---|---|
| 这条已被别人重投，或已不是发送失败 | #4 `409`·`308105` | 提示后刷新列表 |
| 记录不在本人数据可见范围内 | #4 `404` | 提示后刷新列表 |
| 日期范围 `to` 早于 `from` | #3 / #5 `400` | 在日期选择器下提示 |
| 同一个幂等键改了请求体 | #5 `409`·`908003` | 改过筛选就换新键 |

通知投递失败的查询与重投是新增的页面，v1 / Hub 都没有对应页面。

## 页面：对外投递

商户异步通知（Webhook）与电商平台回写的投递任务。商户反映没收到支付结果时在这里查。筛选：商户、建立日期范围、状态。列表各列取：时间 `createdAt`、商户 `merchant`、事件 `eventType`、业务单号 `sourceId`、报文形态 `wireProfile`、目标地址 `targetUrl`、状态 `status`、尝试次数 `attemptCount`。点一行打开任务详情。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入对外投递，选商户与日期范围
    S->>A: #35;6 [listOutboundDeliveries]<br/>GET /outbound-deliveries?merchantId=…&from=…&to=…
    A-->>S: 200 { total, data: [ { deliveryId, merchant, eventType, sourceId,<br/>wireProfile, targetUrl, status, attemptCount } ] }

    U->>S: 点一行
    Note over U,A: 见「页面：对外投递 · 任务详情 抽屉」
```

- 列表固定按建立时间从新到旧。
- 日期范围两端必填，默认最近 30 天；换算见[管理后台约定](../conventions.html)「列表的日期范围」。
- 事件的展示名按码从前端多语言资源取，查不到就显示码；报文形态按枚举显示（1.0 回调、2.0 回调、AllValue、Shopify）。

| 情形 | 响应 | 页面 |
|---|---|---|
| 日期范围 `to` 早于 `from` | #6 `400` | 在日期选择器下提示 |

商户回调的死信查询与人工重投是新增的页面，v1 / Hub 都没有对应页面。

## 页面：对外投递 · 任务详情 抽屉

一个任务的字段，以及全部尝试（按次序从先到后）：第几次 `attemptNo`、时间 `attemptedAt`、触发方式 `trigger`（自动 / 人工）、对方应答码 `httpStatus`、失败类别 `failureClass`、耗时 `durationMs`、应答摘要 `responseExcerpt`。死信任务可人工重投。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    S->>A: #35;7 [getOutboundDelivery]<br/>GET /outbound-deliveries/{deliveryId}
    A-->>S: 200 { …任务字段, attempts: [ { attemptNo, trigger, attemptedAt,<br/>httpStatus, failureClass } ] }

    Note over U,A: 人工重投（死信任务）
    U->>S: 点重投并确认
    S->>A: #35;8 [redeliverOutboundDelivery]<br/>POST /outbound-deliveries/{deliveryId}/redeliveries
    A-->>S: 202 { status: DELIVERING, … }
    U->>S: 稍后点刷新
    S->>A: #35;7 [getOutboundDelivery]<br/>GET /outbound-deliveries/{deliveryId}
    A-->>S: 200 { status: DELIVERED 或 DEAD_LETTER, attempts（多一条 manual） }
```

- 重投按钮只在 `status` 为 `DEAD_LETTER` 时出现，按 `opscon:delivery:create` 显示。
- 人工重投在原任务上新增一次尝试，不另建任务；报文与签名与自动尝试相同，商户按事件身份去重。
- 这次尝试的结果要重新读取才看得到：成功则任务变为 `DELIVERED`，失败则回到 `DEAD_LETTER`、可再重投。目标地址命中拒投规则的不发出请求，这次尝试记为 `target_blocked`。
- #8 带 `Idempotency-Key`，点一次生成一个键；网络失败重试沿用同一个键。
- 失败类别按枚举从前端多语言资源取展示名。

| 情形 | 响应 | 页面 |
|---|---|---|
| 任务已不在死信（已送达、自动重试中、别人刚发起了重投） | #8 `409`·`308106` | 提示后重调 #7 |
| 任务不在本人数据可见范围内 | #7 / #8 `404` | 提示「任务不存在」，关抽屉 |

## 页面：批任务

各服务登记的批任务（含从没执行过的），每个带最近一次执行：状态、开始与结束时间、失败信息。可看某任务的执行历史，触发一次执行，对可重启（`restartable`）的执行重启，对进行中的执行取消。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入批任务
    S->>A: #35;9 [listBatchJobs]<br/>GET /batch-jobs
    A-->>S: 200 { items: [ { jobKey, displayName, latestExecution } ] }

    U->>S: 点某任务的执行历史
    S->>A: #35;10 [listBatchJobExecutions]<br/>GET /batch-jobs/{jobKey}/executions
    A-->>S: 200 { total, data: [ { executionId, status, restartable, startedAt,<br/>endedAt, failureReason } ] }

    Note over U,A: 触发
    U->>S: 点触发并确认
    S->>A: #35;11 [createBatchJobExecution]<br/>POST /batch-jobs/{jobKey}/executions
    A-->>S: 202 { executionId, status: STARTING }

    Note over U,A: 重启（`restartable` 为真的执行）
    U->>S: 点重启并确认
    S->>A: #35;12 [restartBatchJobExecution]<br/>POST /batch-jobs/{jobKey}/executions/{executionId}/restarts
    A-->>S: 202 { executionId（续跑产生的新执行）, status: STARTING }

    Note over U,A: 取消（进行中的执行）
    U->>S: 点取消并确认
    S->>A: #35;13 [cancelBatchJobExecution]<br/>POST /batch-jobs/{jobKey}/executions/{executionId}/cancellation
    A-->>S: 202 { executionId, status: STOPPING }

    U->>S: 点刷新
    S->>A: #35;9 [listBatchJobs]<br/>GET /batch-jobs
    A-->>S: 200 { items }
```

- 命令受理后返回的是受理那一刻的状态；执行进度以所属服务为准，页面不自己推断，要看最新就重调 #9 或 #10。
- 按钮按状态出现：触发在任务没有进行中的执行时出现；重启在 `restartable` 为真的执行上出现；取消在 `STARTING`、`RUNNING`、`STOPPING` 的执行上出现。按钮都按 `opscon:batch:manage` 显示。
- #11 – #13 带 `Idempotency-Key`，点一次生成一个键；网络失败重试沿用同一个键。对停止中的执行再点取消照常受理、什么都不变。
- 重启不改原执行：受理后返回续跑产生的新执行，原执行保持失败或已停止、`restartable` 变为假；执行历史里两条都在。
- 执行历史固定按开始时间从新到旧，分页。

| 情形 | 响应 | 页面 |
|---|---|---|
| 该任务已有一次执行在进行 | #11 `409`·`308108` | 提示「任务正在执行」，重调 #9 |
| 执行状态已变，所属服务不受理重启或取消 | #12 / #13 `409`·`308107` | 提示后重调 #9 或 #10，按最新状态显示按钮 |
| 批任务或执行已不存在 | #10 – #13 `404` | 提示后重调 #9 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 批任务入口 | v1 宽表同步、统计生成、清算报告补发等散在各处的接口，多数不用登录 | 统一的批任务页面，每个操作要登录、要权限点、留下操作记录 | 运维动作受控、可追查 |

<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
document.getElementById('content').innerHTML = marked.parse(document.getElementById('src').textContent);
document.querySelectorAll('#content h1,#content h2,#content h3,#content h4').forEach(h=>{if(!h.id)h.id=h.textContent.trim();});
const jump=()=>{if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}};
const fpEl=document.getElementById('contract-fp');
if(fpEl){const fp=JSON.parse(fpEl.textContent);
fetch('../../ready.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(rd=>{
if(!rd||!rd.ops)return;
const re=/^\.\.\/([\w-]+)\/index\.html#tag\/[^/]+\/operation\/([\w-]+)$/;
document.querySelectorAll('#content table a[href]').forEach(a=>{
const m=a.getAttribute('href').match(re);if(!m)return;
const k=m[1]+'/'+m[2],got=rd.ops[fp.consumer+'/'+k];if(!got)return;
const s=document.createElement('span');s.className='rd';
if(got===fp.ops[k]){s.textContent=' ✅';s.title='已部署到联调环境，可对接调试';}
else{s.textContent=' ⚠️';s.title='契约在实现之后有改动，待后端按新契约重验';}
a.after(s);});
const n=document.getElementById('ready-note'),c=document.createElement('code');c.textContent=rd.environment||'';
n.append('联调就绪（环境 ',c,'，生成于 '+(rd.generatedAt||'')+'）：✅ 已部署、可对接调试 · ⚠️ 契约在实现之后有改动、待后端重验 · 无标识 = 尚未部署到联调环境。清单更新后页面缓存可能延迟几分钟。');
n.hidden=false;}).catch(()=>{});}
document.querySelectorAll('code.language-mermaid').forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.closest('pre').replaceWith(d);});
mermaid.initialize({startOnLoad:false,theme:'neutral',sequence:{useMaxWidth:true}});
mermaid.run({querySelector:'.mermaid'}).then(jump,jump);
</script>
