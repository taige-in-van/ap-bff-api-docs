# 平台设置与公告 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。

## 本文的页面

| 页面 | 从哪进 | 本文章节 |
|---|---|---|
| 平台参数 | 导航「平台设置 › 平台参数」 | [页面：平台参数](#页面：平台参数) |
| 公告管理 | 导航「公告」 | [页面：公告管理](#页面：公告管理)；[页面：公告管理 · 新建 / 编辑草稿弹窗](#页面：公告管理%20·%20新建%20/%20编辑草稿弹窗) |
| 公告详情 | 公告管理列表点一行 | [页面：公告详情](#页面：公告详情) |

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`listPlatformParameters`](../settings/index.html#tag/parameters/operation/listPlatformParameters) | `GET /settings/parameters` | 平台参数：展示名、生效值、默认值、写入用的版本 |
| 2 | [`updatePlatformParameter`](../settings/index.html#tag/parameters/operation/updatePlatformParameter) | `PUT /settings/parameters/{key}` | 改一个参数的值，或恢复默认（`value` 传 `null`） |
| 3 | [`listAnnouncements`](../settings/index.html#tag/announcements/operation/listAnnouncements) | `GET /announcements` | 公告列表：搜索、按状态筛选、排序、分页 |
| 4 | [`createAnnouncement`](../settings/index.html#tag/announcements/operation/createAnnouncement) | `POST /announcements` | 新建草稿 |
| 5 | [`getAnnouncement`](../settings/index.html#tag/announcements/operation/getAnnouncement) | `GET /announcements/{announcementId}` | 公告详情：标题、正文、发布与撤回信息 |
| 6 | [`updateAnnouncement`](../settings/index.html#tag/announcements/operation/updateAnnouncement) | `PUT /announcements/{announcementId}` | 编辑草稿（改哪项传哪项） |
| 7 | [`deleteAnnouncement`](../settings/index.html#tag/announcements/operation/deleteAnnouncement) | `DELETE /announcements/{announcementId}` | 弃用草稿 |
| 8 | [`publishAnnouncement`](../settings/index.html#tag/announcements/operation/publishAnnouncement) | `POST /announcements/{announcementId}/publication` | 发布 |
| 9 | [`withdrawAnnouncement`](../settings/index.html#tag/announcements/operation/withdrawAnnouncement) | `POST /announcements/{announcementId}/withdrawal` | 撤回 |

## 页面：平台参数

平台级运营参数里没有专属业务页面的那些，按分组列出；每个参数一行：展示名、当前生效值、默认值、是否为默认、值域说明，行内可改值、可恢复默认。订单有效期平台兜底值（商户没设、下单也没指定有效期时用的分钟数）是其中一行。各行各自保存，没有整页的保存按钮。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入平台参数
    S->>A: #35;1 [listPlatformParameters]<br/>GET /settings/parameters
    A-->>S: 200 { items: [ { key, groupName, displayName, valueType,<br/>defaultValue, value, effectiveValue, version } ] }

    Note over U,A: 改值
    U->>S: 点某行的 Edit，填新值后 Save
    S->>A: #35;2 [updatePlatformParameter]<br/>PUT /settings/parameters/{key} { value, version }
    A-->>S: 200 { effectiveValue, value, version }

    Note over U,A: 恢复默认
    U->>S: 点某行的恢复默认并确认
    S->>A: #35;2 [updatePlatformParameter]<br/>PUT /settings/parameters/{key} { value: null, version }
    A-->>S: 200 { effectiveValue, version }（不带 value）
```

- 分组按 `groupName`，组内与组间顺序照 `items` 的顺序。
- 「是否为默认」看有没有 `value`：没有 `value` 就是在用默认值，此时不给恢复默认。
- 值的类型看 `valueType`，提交时把值放进对应的槽位（`number` → `numberValue`、`boolean` → `booleanValue`、`string` → `stringValue`、`number_list` → `numberListValue`）。值域说明取 `valueRangeNote`，前端不另做范围校验，以服务端的 `400` 为准。
- 提交时 `version` 原样带上读到的值；保存成功用响应里的整行刷新该行（含新的 `version`），不必重调 #1。
- 编辑态有未保存的修改时离开页面或关编辑态，按公共约定先确认。
- 页面只显示有 `syscfg:parameter:view` 的用户；没有 `syscfg:parameter:edit` 的只读显示，不给 Edit 与恢复默认。

| 情形 | 响应 | 页面 |
|---|---|---|
| 别人先改过这个参数（版本已变） | #2 `409`·`308103` | 提示「该参数已被修改」，重调 #1 刷新后让用户决定是否重改 |
| 值的类型或范围不对 | #2 `400`，`details` 指向 `value` | 在该行输入框下提示，留在编辑态 |
| 参数已不存在 | #2 `404` | 重调 #1 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 谁能看、谁能改 | v1 登录即可读写全部参数 | 看与改各要权限点 | 平台参数直接改变平台行为 |
| 本页有哪些参数 | v1 风控配置页一页放全部参数；Hub 系统设置按页签放 | 只放没有专属业务页面的参数；费率、退款审核、风控限额等在各自的业务页面改 | 参数跟着它所属的业务维护 |
| 同时修改 | 后保存的覆盖先保存的 | 版本已变时拒绝，提示刷新 | 不静默覆盖他人的修改 |
| 改值留痕 | v1 不记修改人、不进操作日志 | 每次改值与恢复默认都留下操作记录 | 可追查谁在何时改了什么 |
| 任意键值的参数页 | v1 另有一页可增删任意键值 | 没有 | 只能改已声明的参数 |

## 页面：公告管理

发给全体商户的公告列表：按标题搜索，按状态（草稿、已发布、已撤回）筛选，可新建公告。列表各列取：标题 `title`、状态 `status`、发布人与发布时间 `publishedBy` / `publishedAt`、撤回人与撤回时间 `withdrawnBy` / `withdrawnAt`、创建时间 `createdAt`；点一行进公告详情，草稿行另有编辑。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入公告管理
    S->>A: #35;3 [listAnnouncements]<br/>GET /announcements?sortField=createdAt&sortOrder=descend
    A-->>S: 200 { total, data: [ { announcementId, title, status,<br/>publishedAt, publishedBy, withdrawnAt, withdrawnBy, createdAt } ] }

    U->>S: 输入关键字或选状态
    S->>A: #35;3 [listAnnouncements]<br/>GET /announcements?keyword=…&status=…
    A-->>S: 200 { total, data }

    Note over U,A: 新建与编辑草稿见「页面：公告管理 · 新建 / 编辑草稿弹窗」
```

- 默认按创建时间从新到旧，由前端显式传；表头点「发布时间」排序时传 `publishedAt`，未发布的恒在末尾。
- 发布人、撤回人显示 `displayName`；没有的列留空。
- 已弃用的草稿不在列表里。
- 新建与编辑入口按 `syscfg:announcement:manage` 显示；只有 `syscfg:announcement:view` 的只能看列表与详情。

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 状态 | v1 启用 / 停用，商户端不看它；Hub 另有「发送中」 | 草稿 / 已发布 / 已撤回 | 发布即对商户可见，撤回即不可见 |
| 发送情况列 | Hub 显示渠道、受众数、邮件已发与失败数 | 没有 | 公告只发站内信、面向全体商户，不记逐家送达 |

## 页面：公告管理 · 新建 / 编辑草稿弹窗

两栏：标题、正文（富文本，只有排版，没有插图）。保存只存草稿，不在弹窗里发布。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    Note over U,A: 新建
    U->>S: 点新建公告，填标题与正文后保存
    S->>A: #35;4 [createAnnouncement]<br/>POST /announcements { title, body }
    A-->>S: 201 { announcementId, status: DRAFT, … }
    S->>S: 关弹窗，重调 #35;3 刷新列表

    Note over U,A: 编辑草稿
    U->>S: 在草稿行点编辑
    S->>A: #35;5 [getAnnouncement]<br/>GET /announcements/{announcementId}
    A-->>S: 200 { title, body, status: DRAFT, … }
    U->>S: 改标题或正文后保存
    S->>A: #35;6 [updateAnnouncement]<br/>PUT /announcements/{announcementId} { title } 或 { body } 或两者
    A-->>S: 200 { title, body, status: DRAFT, … }
```

- #4 带 `Idempotency-Key`，点一次保存生成一个键；网络失败重试沿用同一个键。
- #6 只传改了的字段。
- 弹窗有未保存的修改时关弹窗，按公共约定先确认。

| 情形 | 响应 | 页面 |
|---|---|---|
| 标题或正文为空 | #4 / #6 `400` | 在对应输入框下提示 |
| 编辑时公告已被他人发布或撤回 | #6 `409`·`308104` | 提示「公告已发布，不能再改」，关弹窗、刷新列表 |
| 编辑时草稿已被他人弃用 | #5 / #6 `404` | 提示后关弹窗、刷新列表 |
| 同一个幂等键改了请求体 | #4 `409`·`908003` | 改过内容就换新键 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 正文插图 | v1 富文本可上传图片 | 正文只有排版，不能插图 | 正文是受限富文本 |
| 发送渠道、不发送的商户 | Hub 可勾邮件 / App / PC 渠道、选排除商户、看预估受众 | 没有 | 公告只发站内信、面向全体商户 |

## 页面：公告详情

标题、状态、正文，以及发布人与发布时间、撤回人与撤回时间。按状态给操作：草稿有编辑、发布、弃用；已发布有撤回；已撤回没有操作。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开详情
    S->>A: #35;5 [getAnnouncement]<br/>GET /announcements/{announcementId}
    A-->>S: 200 { title, body, status, publishedAt, publishedBy,<br/>withdrawnAt, withdrawnBy }

    Note over U,A: 发布（草稿）
    U->>S: 点发布，确认「将发给全体商户」
    S->>A: #35;8 [publishAnnouncement]<br/>POST /announcements/{announcementId}/publication
    A-->>S: 200 { status: PUBLISHED, publishedAt, publishedBy, … }

    Note over U,A: 撤回（已发布）
    U->>S: 点撤回，确认「撤回后不能再发布」
    S->>A: #35;9 [withdrawAnnouncement]<br/>POST /announcements/{announcementId}/withdrawal
    A-->>S: 200 { status: WITHDRAWN, withdrawnAt, withdrawnBy, … }

    Note over U,A: 弃用（草稿）
    U->>S: 点弃用并确认
    S->>A: #35;7 [deleteAnnouncement]<br/>DELETE /announcements/{announcementId}
    A-->>S: 204
    S->>S: 回公告管理并刷新列表
```

- 正文按受限 HTML 渲染；商户端看到的是同一份正文经过清理后的样子。
- 发布与撤回成功后用响应里的整条刷新页面，不必重调 #5。
- 编辑走「页面：公告管理 · 新建 / 编辑草稿弹窗」的编辑草稿那一段。
- 发布、撤回、弃用都要二次确认：发布后商户站内信立即出现、不能再改正文；撤回后不能再发布，要重新告知须新建一条。
- 操作按钮按 `syscfg:announcement:manage` 显示。

| 情形 | 响应 | 页面 |
|---|---|---|
| 状态已被他人改变（如已被发布、已被撤回） | #7 / #8 / #9 `409`·`308104` | 提示后重调 #5，按最新状态显示操作 |
| 草稿已被他人弃用 | #5 / #7 / #8 `404` | 提示后回公告管理并刷新列表 |
| 发布或撤回的响应丢了、重试得到 `308104` | #8 / #9 `409`·`308104` | 同上，重调 #5 即可看到上一次已经生效 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 已发布公告改正文 | v1 可编辑 | 不能改；要改须撤回后新建 | 商户已经看到的内容不被悄悄改掉 |
| 发布后的收件明细与邮件预览 | Hub 有逐家收件明细、邮件状态与邮件预览 | 没有 | 只发站内信，不记逐家送达 |

</script>
<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
document.getElementById('content').innerHTML = marked.parse(document.getElementById('src').textContent);
document.querySelectorAll('#content h1,#content h2,#content h3,#content h4').forEach(h=>{if(!h.id)h.id=h.textContent.trim();});
const jump=()=>{if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}};
const fpEl=document.getElementById('contract-fp');
if(fpEl){const fp=JSON.parse(fpEl.textContent);
fetch('../../ready.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(rd=>{
if(!rd||!rd.ops)return;
const re=/^\.\.\/([\w-]+)\/index\.html#tag\/[^/]+\/operation\/([\w-]+)$/;
document.querySelectorAll('#content table a[href]').forEach(a=>{
const m=a.getAttribute('href').match(re);if(!m)return;
const k=m[1]+'/'+m[2],got=rd.ops[fp.consumer+'/'+k];if(!got)return;
const s=document.createElement('span');s.className='rd';
if(got===fp.ops[k]){s.textContent=' ✅';s.title='已部署到联调环境，可对接调试';}
else{s.textContent=' ⚠️';s.title='契约在实现之后有改动，待后端按新契约重验';}
a.after(s);});
const n=document.getElementById('ready-note'),c=document.createElement('code');c.textContent=rd.environment||'';
n.append('联调就绪（环境 ',c,'，生成于 '+(rd.generatedAt||'')+'）：✅ 已部署、可对接调试 · ⚠️ 契约在实现之后有改动、待后端重验 · 无标识 = 尚未部署到联调环境。清单更新后页面缓存可能延迟几分钟。');
n.hidden=false;}).catch(()=>{});}
document.querySelectorAll('code.language-mermaid').forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.closest('pre').replaceWith(d);});
mermaid.initialize({startOnLoad:false,theme:'neutral',sequence:{useMaxWidth:true}});
mermaid.run({querySelector:'.mermaid'}).then(jump,jump);
</script>
