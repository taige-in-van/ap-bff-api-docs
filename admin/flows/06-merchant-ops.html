# 商户运营管理 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）；商户列表、详情与其下各操作按数据可见范围过滤商户，按标识打开范围外商户得到 `404`。临时授权的申请与指定见 02-staff-roles「流程：临时授权」，本文只画范围外商户的查找；商户详情的操作记录页签见 04-ops-audit。

## 页面：商户列表

按状态、是否 KA、所属机构、归属 BD 筛选，按商户码 / 别名 / 经营名 / 法定名 / BD 搜索，按创建或激活时间排序。各列取：商户码 `merchantCode`（别名 `merchantCodeAlias`）、经营名 `tradeName`、法定名 `legalBusinessName`、治理档位 `governanceTier`、KA 等级 `keyAccountLevel`、BD `bdUser`、开户来源 `signupSource`、激活时间 `activatedAt`。点一行进详情。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入商户列表，筛选或翻页
    S->>A: #35;1 [listMerchants]<br/>GET /merchants?status=&keyAccount=&partnerId=&bdUserId=&keyword=
    A-->>S: 200 { total, data: [ { merchantId, merchantCode, tradeName,<br/>status, governanceTier, keyAccountLevel, bdUser } ] }
    opt 导出
        U->>S: 点导出
        S->>A: #35;2 [createMerchantExport]<br/>POST /merchant-exports
        A-->>S: 200 xlsx 文件流
        S->>U: 浏览器下载
    end
```

- 治理档位显示名：`normal` 正常、`frozen` 冻结；待激活的商户没有档位，显示其状态。
- 导出带当前筛选，只含本人数据范围内的商户；每次导出记一条操作审计。
- 机构筛选的候选取自机构管理的接口（随机构管理建）；当前列表只回 `partnerId`。

## 流程：查找范围外商户

范围外的商户不在列表里。持自助临时授权权限的，在列表上方的「查找其他商户」里按商户码或名称查找，找到后自助申请临时授权，授权生效后该商户出现在列表。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 输入商户码或名称
    S->>A: #35;28 [listAccessGrantCandidates]<br/>GET /access-grant-candidates?keyword=
    A-->>S: 200 { items: [ { merchantId, merchantCode, tradeName, requestable } ] }
    U->>S: 对某个 requestable 的商户点申请
    S->>A: #35;29 [createAccessGrant]<br/>POST /access-grants（Idempotency-Key）
    A-->>S: 201 { grantId, merchant, status: ACTIVE, expiresAt }
    S->>U: 刷新列表 #35;1
```

- 结果只含范围外、非 KA、未关户的商户，最多 20 条；`requestable = false` 表示本人已持该商户生效中的授权。
- KA 商户不出现，须由有指定权限的同事指定（见 02-staff-roles）。
- 自助申请不另发通知，操作审计记一条。

## 页面：商户详情 · 冻结、解冻与关户

详情顶部按商户状态给操作按钮：已激活给冻结，已冻结给解冻；关户任何状态都可，须二次确认。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 点列表某行
    S->>A: #35;3 [getMerchant]<br/>GET /merchants/{merchantId}
    A-->>S: 200 { status, governanceTier, profile, owner,<br/>settlement, documents, parent, children, inactiveMonths }
    alt 冻结或解冻
        U->>S: 点冻结 / 解冻并确认
        S->>A: #35;5 [updateMerchantStatus]<br/>PUT /merchants/{merchantId}/status
        A-->>S: 204
        S->>A: #35;3 [getMerchant]<br/>GET /merchants/{merchantId}
        A-->>S: 200 { status, governanceTier }
    else 关户
        U->>S: 点关户并二次确认
        S->>A: #35;6 [closeMerchant]<br/>POST /merchants/{merchantId}/closure（Idempotency-Key）
        A-->>S: 204
        S->>U: 回商户列表
    end
```

- 冻结的效果由商户状态决定，不逐个改通道开关；解冻不改通道开关。
- 冻结已冻结的商户、解冻已激活的商户同样回 `204`，状态不变、不记操作审计（如两人同时点了冻结）。
- 关户即时生效，商户不再出现在列表，记录留存；未激活商户的在途申请随之撤回。
- 子商户关系只读：详情列出父商户与子商户，本后台不做挂接或解绑。
- 文件只给类型、文件名与到期日；点开时调 #4 现取地址。

| 情形 | 响应 | 页面 |
|---|---|---|
| 冻结或解冻未激活的商户 | #5 `409`·`308301` | 提示状态已变，重读 #3 |
| 名下仍有未关户的子商户 | #6 `409`·`308302` | 提示先处理子商户 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #6 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 治理档位 | v1 五档运营标签，各档顺手改通道与退款开关 | 两态（已激活 / 已冻结）加结算暂停，界面按派生出的档位名显示 | 效果由状态派生，不逐个开关 |
| 解冻 | v1 切回正常时不恢复被关掉的通道与退款开关，且不保存原审核态 | 解冻只改状态，冻结本来就不改开关 | 不留需要人工逐个恢复的开关 |
| 关户 | v1 停用与删除是同一个动作，无前置校验 | 关户前置名下无未关户的子商户，记录不删 | 不留下悬空的子商户 |

## 流程：代登商户后台

从商户详情发起，以该商户 Owner 的身份进入商户后台处理问题。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 在商户详情点代登
    S->>A: #35;7 [createMerchantImpersonation]<br/>POST /merchants/{merchantId}/impersonations
    A-->>S: 201 { landingUrl, expiresAt }
    S->>U: 新开窗口打开 landingUrl，进入商户后台
```

- `landingUrl` 一次性、短时效，拿到即打开，不要缓存；过期或用过须重新发起。
- 只有已激活的商户可代登；已冻结商户的资料在商户详情查看。代登会话出现在在线会话里，可强制下线；规则见管理后台约定「代登会话」。
- 打开 `landingUrl` 的浏览器须没有登录中的商户后台会话；已登录时商户后台不处理这次代登（交接码不消费），提示先在该浏览器登出商户后台，再回本页重新发起。

| 情形 | 响应 | 页面 |
|---|---|---|
| 商户未激活或已冻结，或 Owner 已停用、在商户后台无访问资格 | #7 `409`·`308303` | 提示不能代登 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 发起权限 | v1 任何已登录的后台用户都能代登任意商户 | 单独权限点，目标商户须在本人数据范围内 | 收窄能代登的人与商户 |
| 代登身份 | v1 用一个虚拟的商户管理员身份 | 以该商户 Owner 的身份 | 操作记录能落到真实账号 |

## 页面：商户详情 · 成员

列出该商户的在册成员：登录名 `loginId`、显示名 `displayName`、角色 `roles`、账号状态 `status`、是否 Owner `isOwner`、MFA `mfaEnrolled`、微信 `wechat`、最近登录 `lastLoginAt`；Owner 行有待确认的新登录邮箱时显示 `pendingLoginEmail`。每行按状态给操作。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开成员页签
    par 成员
        S->>A: #35;8 [listMerchantMembers]<br/>GET /merchants/{merchantId}/members
        A-->>S: 200 { items: [ { userId, loginId, roles, status, isOwner, mfaEnrolled } ] }
    and 角色候选
        S->>A: #35;9 [listMerchantMemberRoleOptions]<br/>GET /merchants/{merchantId}/member-role-options
        A-->>S: 200 { items: [ { roleId, name } ] }
    end
    alt 新增成员
        S->>A: #35;10 [createMerchantMember]<br/>POST /merchants/{merchantId}/members（Idempotency-Key）
        A-->>S: 201 { userId, status: INVITED }
    else 停用 / 启用
        S->>A: #35;11 [updateMerchantMemberStatus]<br/>PUT /merchants/{merchantId}/members/{userId}/status
        A-->>S: 204
    else 改角色
        S->>A: #35;12 [updateMerchantMemberRoles]<br/>PUT /merchants/{merchantId}/members/{userId}/roles
        A-->>S: 204
    else 删除
        S->>A: #35;13 [deleteMerchantMember]<br/>DELETE /merchants/{merchantId}/members/{userId}
        A-->>S: 204
    else 解绑微信
        S->>A: #35;14 [deleteMerchantMemberWechatBinding]<br/>DELETE /merchants/{merchantId}/members/{userId}/wechat-binding
        A-->>S: 204
    else 解除登录锁定
        S->>A: #35;15 [deleteMerchantMemberLoginLock]<br/>DELETE /merchants/{merchantId}/members/{userId}/login-lock
        A-->>S: 204
    else 重置 MFA
        S->>A: #35;16 [deleteMerchantMemberMfa]<br/>DELETE /merchants/{merchantId}/members/{userId}/mfa
        A-->>S: 204
    else 发重置密码链接
        S->>A: #35;17 [createMerchantMemberPasswordReset]<br/>POST /merchants/{merchantId}/members/{userId}/password-reset-invitations
        A-->>S: 202 { cooldownSeconds }
    end
    S->>A: #35;8 [listMerchantMembers]<br/>GET /merchants/{merchantId}/members
    A-->>S: 200 { items }
```

- 新增成员只收邮箱：发邀请邮件，成员自设密码后激活。用户名格式的成员只能由 Owner 在商户后台新建。
- 停用作用于成员的平台账号：在所有商户与管理后台都不能登录，会话即时失效；启用不恢复旧会话。
- 成员同时是后台用户时，停用 / 启用、解锁、重置 MFA、发重置密码链接、删除、解绑微信、代改 Owner 登录邮箱在这里不可用，到后台账号管理处理；改角色照常。
- 发重置密码链接后，成员凭链接自设新密码，设好前旧密码照常可用，账号状态不变；运营不经手密码。按 `cooldownSeconds` 倒计时，冷却内按钮置灰。
- 代为建档、尚未设密的 Owner 行（邀请中）在商户已激活后也给发重置密码链接：补发开户设密链接，之前的链接失效；商户未激活时不给，邀请中的员工行不给。
- 重置 MFA 后成员回到未启用 MFA：下次登录不要求验证器码，可自行在商户后台重新绑定。
- 改角色后成员的权限最多一个在线复核间隔后按新角色生效。
- Owner 行不给停用、改角色、删除；Owner 换登录邮箱走「代改 Owner 登录邮箱」。
- 每个操作都记入操作审计并带上商户，在该商户详情的操作记录页签可查。

| 情形 | 响应 | 页面 |
|---|---|---|
| 登录邮箱已被占用 | #10 `409`·`968001` | 邮箱框标红 |
| 角色不可分配（含 Owner 角色） | #10 / #12 `400`·`304301` | 提示后重拉 #9 |
| 对 Owner 停用、改角色或删除 | #11 / #12 / #13 `409`·`308304` | 正确页面下不会出现；出现就提示不能对 Owner 操作 |
| 成员同时是后台用户 | #11 / #13 / #14 / #15 / #16 / #17 / #18 `409`·`308313` | 提示到后台账号管理处理 |
| 用户名格式的成员发重置密码链接 | #17 `409`·`308305` | 提示由 Owner 在商户后台为其设密 |
| 成员状态不允许（邀请中的员工、已停用，或商户未激活时的邀请中 Owner） | #17 `409`·`308306` | 提示状态已变，重拉 #8 |
| 冷却未过 | #17 `429`·`966006` | 按 `context.cooldownSeconds` 倒计时 |
| 成员已不在该商户在册，或对象是 Owner 且其名下有范围外商户 | 任一成员操作 `404` | 提示后重拉 #8 |
| 商户未激活 | #10 `409`·`308314` | 提示审核通过后再加成员 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 停用 | v1 翻转语义，不踢线，下一次请求才登出 | 定值语义，停用即时失效全部会话 | 停用立即生效 |
| 重置密码 | v1 后台人员手输新密码 | 发重置密码链接，成员自设 | 运营不经手他人密码 |
| 新增成员 | v1 后台当场设密码 | 只收邮箱、走邀请 | 同上 |
| 作用范围 | v1 只按账号标识定位，不校验是否属于该商户，不保护 Owner | 只能作用于本商户成员，不能对 Owner 停用、改角色、删除 | 堵住跨商户越权 |
| 解锁 | v1 没有为商户账号解锁的入口 | 可解除登录锁定 | 减少等锁过期的工单 |

## 流程：代改 Owner 登录邮箱

只用于 Owner 找回账号：运营线下核验身份后，替 Owner 发起改登录邮箱。新邮箱收确认链接，确认后才生效。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 在成员页签 Owner 行点改登录邮箱，填新邮箱
    S->>A: #35;18 [updateMerchantOwnerLoginEmail]<br/>PUT /merchants/{merchantId}/owner/login-email
    A-->>S: 202
    S->>A: #35;8 [listMerchantMembers]<br/>GET /merchants/{merchantId}/members
    A-->>S: 200 { items: [ { isOwner: true, pendingLoginEmail } ] }
    Note over S,A: Owner 在商户后台确认后切换，确认前仍用旧邮箱登录
```

- 再提交会顶掉上一笔未确认的；前后邮箱记入操作审计。
- Owner 易主不在本后台办理。

| 情形 | 响应 | 页面 |
|---|---|---|
| 新邮箱已被占用 | #18 `409`·`968001` | 邮箱框标红 |
| Owner 同时是后台用户 | #18 `409`·`308313` | 提示到后台账号管理处理 |

## 页面：商户详情 · 资料与设置

运营维护档案（含商户自己不能改的锁定字段）、家庭办公标记、别名商户码、资料文件与到期日、结算账户与结算周期、日切时刻与 KA 等级、商户级设置。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    alt 改档案、家庭办公、别名
        S->>A: #35;19 [updateMerchantProfile]<br/>PATCH /merchants/{merchantId}/profile
        A-->>S: 204
    else 新增或替换资料
        S->>A: #35;20 [uploadMerchantFile]<br/>POST /merchants/{merchantId}/files
        A-->>S: 201 { fileId }
        S->>A: #35;21 [createMerchantDocument]<br/>POST /merchants/{merchantId}/documents（Idempotency-Key）
        A-->>S: 201 { documentId }
        Note over S,A: 替换或改到期日用 #35;22 PATCH，移除用 #35;23 DELETE
    else 直改结算
        opt 换结算账户
            S->>A: #35;20 [uploadMerchantFile]<br/>POST /merchants/{merchantId}/files
            A-->>S: 201 { fileId }
        end
        S->>A: #35;24 [updateMerchantSettlementInfo]<br/>PATCH /merchants/{merchantId}/settlement-info
        A-->>S: 204
    else 改日切时刻或 KA 等级
        S->>A: #35;25 [updateMerchantOperatingAttributes]<br/>PATCH /merchants/{merchantId}/operating-attributes
        A-->>S: 204
    else 商户级设置
        S->>A: #35;26 [listMerchantSettings]<br/>GET /merchants/{merchantId}/settings
        A-->>S: 200 { items: [ { key, value, effectiveValue, version } ] }
        S->>A: #35;27 [updateMerchantSetting]<br/>PUT /merchants/{merchantId}/settings/{key}
        A-->>S: 204
    end
    S->>A: #35;3 [getMerchant]<br/>GET /merchants/{merchantId}
    A-->>S: 200 { profile, settlement, documents }
```

- 改动前后值都记入操作审计（结算账号只记末 4 位）。
- 待激活商户的资料在审核中心改，本页只读。
- 别名商户码一个商户至多一个、不设到期，与商户码共用同一个命名空间。
- 家庭办公改为否前，须先有至少一张办公室照片；必传证件只能替换，不能移除。代客建档签署后的合同也在资料里，只能替换，替换不影响申请上留存的签署件。资料到期日只展示，不做到期提醒。
- 直改结算即时生效，不生成结算变更申请；换账户须整组重填并带 Void Cheque。
- 日切时刻自保存起生效；KA 等级大于 0 的商户在 KA 筛选里出现，且不再受理自助临时授权。
- 商户级设置当前只有收银员可查询的交易天数：不设即不限；`value` 传 `null` 恢复默认。

| 情形 | 响应 | 页面 |
|---|---|---|
| 商户未激活 | #19 / #21 / #22 / #23 / #24 `409`·`308314` | 提示到审核中心代客建档里代补 |
| 别名商户码已被占用 | #19 `409`·`308309` | 别名框标红 |
| 家庭办公改为否而没有办公室照片、移除后必传资料缺失 | #19 / #23 `409`·`308310` | 提示先上传办公室照片，或只能替换不能移除 |
| 有审核中的结算变更申请，或刚通过的申请新周期还没生效 | #24 `409`·`308307` | 审核中的提示先到审核中心处理该申请，刚通过的提示稍后再试 |
| 设置的版本已过期 | #27 `409`·`308311` | 提示他人已改过，重拉 #26 |
| 文件格式或大小不合 | #20 `400`·`304205` | 提示换一个文件再传 |
| 引用的文件不可用 | #21 / #22 / #24 `400`·`308206` | 提示重新上传后再引用 |
| 该类型每商户一份且已有在册的 | #21 `409`·`308312` | 提示改用替换，重拉 #3 |
| 字段格式或组合不对、结算周期不在候选内 | #19 / #24 / #25 / #27 `400`，`details` 定位字段 | 对应字段标红 |

<script src="https://cdn.jsdelivr.net/npm/marked@15/marked.min.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
document.getElementById('content').innerHTML = marked.parse(document.getElementById('src').textContent);
document.querySelectorAll('#content h1,#content h2,#content h3,#content h4').forEach(h=>{if(!h.id)h.id=h.textContent.trim();});
const jump=()=>{if(location.hash){const t=document.getElementById(decodeURIComponent(location.hash.slice(1)));if(t)t.scrollIntoView();}};
const fpEl=document.getElementById('contract-fp');
if(fpEl){const fp=JSON.parse(fpEl.textContent);
fetch('../../ready.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(rd=>{
if(!rd||!rd.ops)return;
const re=/^\.\.\/([\w-]+)\/index\.html#tag\/[^/]+\/operation\/([\w-]+)$/;
document.querySelectorAll('#content table a[href]').forEach(a=>{
const m=a.getAttribute('href').match(re);if(!m)return;
const k=m[1]+'/'+m[2],got=rd.ops[fp.consumer+'/'+k];if(!got)return;
const s=document.createElement('span');s.className='rd';
if(got===fp.ops[k]){s.textContent=' ✅';s.title='已部署到联调环境，可对接调试';}
else{s.textContent=' ⚠️';s.title='契约在实现之后有改动，待后端按新契约重验';}
a.after(s);});
const n=document.getElementById('ready-note'),c=document.createElement('code');c.textContent=rd.environment||'';
n.append('联调就绪（环境 ',c,'，生成于 '+(rd.generatedAt||'')+'）：✅ 已部署、可对接调试 · ⚠️ 契约在实现之后有改动、待后端重验 · 无标识 = 尚未部署到联调环境。清单更新后页面缓存可能延迟几分钟。');
n.hidden=false;}).catch(()=>{});}
document.querySelectorAll('code.language-mermaid').forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.closest('pre').replaceWith(d);});
mermaid.initialize({startOnLoad:false,theme:'neutral',sequence:{useMaxWidth:true}});
mermaid.run({querySelector:'.mermaid'}).then(jump,jump);
</script>
