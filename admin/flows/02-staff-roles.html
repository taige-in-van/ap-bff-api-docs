# 后台账号与角色权限 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）；后台账号、角色、资源目录是平台级页面，不受数据可见范围限制，在线会话与临时授权按数据可见范围过滤商户。

## 本文的页面

| 页面 | 从哪进 | 本文章节 |
|---|---|---|
| 后台账号 | 导航「账号与权限 › 后台账号」 | [页面：后台账号](#页面：后台账号)；[页面：后台账号 · 邀请弹窗](#页面：后台账号%20·%20邀请弹窗) |
| 后台账号详情 | 后台账号列表点一行 | [页面：后台账号详情](#页面：后台账号详情)；[页面：后台账号详情 · 编辑弹窗](#页面：后台账号详情%20·%20编辑弹窗)；[页面：后台账号详情 · 账号状态与凭据](#页面：后台账号详情%20·%20账号状态与凭据) |
| 在线会话 | 导航「账号与权限 › 在线会话」 | [页面：在线会话](#页面：在线会话) |
| 登录日志 | 导航「账号与权限 › 登录日志」 | [页面：登录日志](#页面：登录日志) |
| 角色管理 | 导航「账号与权限 › 角色」 | [页面：角色管理](#页面：角色管理) |
| 资源目录 | 导航「账号与权限 › 资源目录」 | [页面：资源目录](#页面：资源目录) |
| 预设角色 | 导航「账号与权限 › 商户后台与终端预设角色」 | [页面：预设角色](#页面：预设角色) |
| 临时授权 | 商户列表的「申请查看」；商户详情的授权用户区块 | [流程：临时授权](#流程：临时授权) |

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`listStaff`](../staff/index.html#tag/staff/operation/listStaff) | `GET /staff` | 后台账号列表 |
| 2 | [`listStaffRoleOptions`](../staff/index.html#tag/staff/operation/listStaffRoleOptions) | `GET /role-options` | 角色候选（筛选用全部，表单只选 `assignable`） |
| 3 | [`createStaff`](../staff/index.html#tag/staff/operation/createStaff) | `POST /staff` | 邀请建号 |
| 4 | [`getStaff`](../staff/index.html#tag/staff/operation/getStaff) | `GET /staff/{userId}` | 账号详情 |
| 5 | [`updateStaff`](../staff/index.html#tag/staff/operation/updateStaff) | `PUT /staff/{userId}` | 编辑（资料、角色、数据范围、白名单、登录邮箱） |
| 6 | [`updateStaffStatus`](../staff/index.html#tag/staff/operation/updateStaffStatus) | `PUT /staff/{userId}/status` | 停用 / 启用 |
| 7 | [`deleteStaff`](../staff/index.html#tag/staff/operation/deleteStaff) | `DELETE /staff/{userId}` | 移除管理后台身份 |
| 8 | [`restoreStaff`](../staff/index.html#tag/staff/operation/restoreStaff) | `POST /staff/{userId}/restoration` | 加回（重新指定角色与数据范围） |
| 9 | [`resendStaffInvitation`](../staff/index.html#tag/staff/operation/resendStaffInvitation) | `POST /staff/{userId}/invitation` | 重发邀请 |
| 10 | [`updateStaffPassword`](../staff/index.html#tag/staff/operation/updateStaffPassword) | `PUT /staff/{userId}/password` | 为他人重置密码 |
| 11 | [`deleteStaffMfa`](../staff/index.html#tag/staff/operation/deleteStaffMfa) | `DELETE /staff/{userId}/mfa` | 为他人重置验证器 |
| 12 | [`deleteStaffLoginLock`](../staff/index.html#tag/staff/operation/deleteStaffLoginLock) | `DELETE /staff/{userId}/login-lock` | 为他人解除登录锁定 |
| 13 | [`listSessions`](../staff/index.html#tag/sessions/operation/listSessions) | `GET /sessions` | 在线会话（含商户后台与代登会话） |
| 14 | [`deleteSession`](../staff/index.html#tag/sessions/operation/deleteSession) | `DELETE /sessions/{sessionId}` | 强制下线 |

## 页面：后台账号详情 · 账号状态与凭据

详情页顶部的操作：停用 / 启用、移除（已移除的显示「加回」）、重发邀请（仅尚未设密）、重置密码、重置验证器、解除锁定。都先弹确认框。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    alt 停用 / 启用
        S->>A: #35;6 [updateStaffStatus]<br/>PUT /staff/{userId}/status { status }
        A-->>S: 204
    else 移除
        S->>A: #35;7 [deleteStaff]<br/>DELETE /staff/{userId}
        A-->>S: 204
    else 加回（弹窗重新选角色与数据范围）
        S->>A: #35;8 [restoreStaff]<br/>POST /staff/{userId}/restoration（Idempotency-Key）
        A-->>S: 200 { ...加回后的详情 }
    else 重发邀请
        S->>A: #35;9 [resendStaffInvitation]<br/>POST /staff/{userId}/invitation
        A-->>S: 202 { cooldownSeconds }
    else 重置密码（弹窗输新密码）
        S->>A: #35;10 [updateStaffPassword]<br/>PUT /staff/{userId}/password（Idempotency-Key）
        A-->>S: 204
    else 重置验证器
        S->>A: #35;11 [deleteStaffMfa]<br/>DELETE /staff/{userId}/mfa
        A-->>S: 204
    else 解除锁定
        S->>A: #35;12 [deleteStaffLoginLock]<br/>DELETE /staff/{userId}/login-lock
        A-->>S: 204
    end
    S->>A: #35;4 [getStaff]<br/>GET /staff/{userId}
```

- 停用：对方在管理后台与商户后台都不能登录，已有会话全部即时失效；启用后须重新登录。
- 移除：只收回管理后台访问，对方的商户后台身份不受影响。
- 重置密码、重置验证器：对方全平台会话失效、受信浏览器失效；重置验证器后对方下次登录在登录内重新绑定。重置密码不解锁，被锁的另点解除锁定。
- 重发邀请后按 `cooldownSeconds` 倒计时，倒计时内按钮置灰。
- 重置密码、重置验证器、解除锁定要 `opacc:credential:manage`，其余要 `opacc:user:manage`。

| 情形 | 响应 | 页面 |
|---|---|---|
| 对自己停用、移除、重置密码或重置验证器 | #6 / #7 / #10 / #11 `403`·`308001` | 提示不能对自己操作 |
| 停用或移除后会没有能管理账号、角色与凭据的在用账号 | #6 / #7 `409`·`308002` | 提示须保留至少一个这样的账号 |
| 对方现有角色超出操作者权限 | #6–#12 `403`·`306007` | 提示无权操作该账号 |
| 账号状态已变（不在邀请中、未被移除、邀请中不能重置密码等） | #6 / #8–#12 `409`·`308004` | 重拉 #4 |
| 加回时数据范围宽于操作者 | #8 `403`·`306009` | 提示不能分配比自己宽的范围 |
| 加回时沿用的所属机构已停用 | #8 `409`·`308701` | 提示先启用该机构 |
| 加回时账号没有所属机构却选所属机构范围 | #8 `400` | 范围字段标红 |
| 重发冷却未过 | #9 `429`·`966006` | 按 `context.cooldownSeconds` 倒计时 |
| 新密码不满足规则 | #10 `400` | 在新密码框下提示 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #8 / #10 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 停用 / 删除 | v1 只改库，不踢会话 | 已有会话即时失效 | 离职收口要立刻生效 |
| 重置密码 | v1 不解锁、踢不到真实会话 | 全部会话失效；解锁另有按钮 | 两件事分开、都要生效 |
| 重置验证器 | v1 没有入口，只能改库 | 管理员可重置 | 丢手机的同事能尽快回来 |
| 至少保留一个管理员 | v1 只禁止删自己；Hub 至少保留一个在职超管 | 至少保留一个能管理账号、角色与凭据的在用账号 | 不会把所有人锁在外面 |

## 页面：在线会话

当前有效的会话，管理后台与商户后台都在内，代登会话显示为商户后台会话并标出代登人与被代商户。来源必选、一次只看一种（管理后台 / 商户后台，默认先看管理后台），可按账号筛选。各列取：账号 `user` 与 `loginId`、来源 `client`、登录时间 `loginAt`、代登人 `impersonator`、被代商户 `impersonatedMerchant`。每行有「强制下线」。商户后台来源下查看者可见商户为空时列表直接为空。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入在线会话（默认来源 = 管理后台）
    S->>A: #35;13 [listSessions]<br/>GET /sessions?client=admin&keyword=
    A-->>S: 200 { total, data: [ { sessionId, client, user, loginId,<br/>loginAt } ] }
    U->>S: 切到来源「商户后台」
    S->>A: #35;13 [listSessions]<br/>GET /sessions?client=merchant&keyword=
    A-->>S: 200 { total, data: [ { sessionId, client, user, loginId,<br/>loginAt, impersonator, impersonatedMerchant } ] }

    U->>S: 某行点强制下线并确认
    S->>A: #35;14 [deleteSession]<br/>DELETE /sessions/{sessionId}
    A-->>S: 204
    S->>A: #35;13 [listSessions]<br/>GET /sessions?client=当前来源
```

- 按账号筛选匹配登录名（用户名或邮箱），不匹配显示名。
- 两种来源不混在一页：切换来源重新查、页码回到第一页。
- 会话归账号、不归商户：商户后台普通会话只列在本人数据可见范围内任一商户有成员身份的账号的，不标商户；代登会话按被代商户是否在范围内列出，范围外的不出现。
- 强制下线只结束这一个会话，同一账号的其他独立会话不受影响；下线的是管理后台会话时，由它发起的代登会话一并结束。
- 没有 `opacc:session:manage` 的不显示强制下线按钮。

| 情形 | 响应 | 页面 |
|---|---|---|
| 会话已结束或不存在 | #14 `204` | 照常刷新 |
| 会话不在可见范围内 | #14 `404` | 刷新列表 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 代登会话 | v1 代登不校权限与数据范围，会话与后台同长 | 标出代登人，按数据可见范围过滤；代登会话短时不续期 | 看得出谁在代登、只代登看得到的商户 |

    A-->>S: 204
```

- 权限点树按 `parentResourceId` 组树、同级按 `sortOrder` 排；只有操作点能勾，目录只作分组；已停用的节点显示为不可勾。
- 操作者自己不持有的点显示为不可勾也不可取消（取 `getCurrentSession` 的 `privileges` 判）。
- `version` 原样带读到的值；保存成功用响应刷新该角色。
- 编辑态有未保存的修改时切换角色或离开，按公共约定先确认。
- 没有 `rbac:role:manage` 的只读。

| 情形 | 响应 | 页面 |
|---|---|---|
| 别人先改过（版本已变） | #18 `409`·`968018` | 提示角色已被修改，重拉 #16 后在最新内容上重做 |
| 勾了已停用或未登记的点 | #18 `409`·`968016` | 重拉 #20 后重选 |
| 勾上或取消了自己不持有的点，或启用了点集宽于自己的角色 | #18 `403`·`306008` | 提示只能勾选 / 启用自己持有的权限点 |
| 停用角色或去掉某点后会没有能管理账号、角色与凭据的在用账号 | #18 `409`·`308002` | 提示须保留至少一个这样的账号 |
| 仍有账号持有该角色 | #19 `409`·`968017` | 提示先从账号上移除或改为停用 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #17 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 超级管理员 | v1 按写死的账号、角色键、角色编号放行 | 持全部权限点的普通角色，鉴权路径一样 | 没有绕过鉴权的特殊账号 |
| 授权粒度 | Hub 矩阵到模块 | 到操作点 | 能按功能精确授权 |
| 同时编辑 | v1 后保存的覆盖先保存的 | 版本已变时拒绝 | 不静默覆盖他人的修改 |
| 改了何时生效 | v1 等对方重新登录 | 持有者下一次请求即生效 | 收权限要立刻生效 |

## 页面：资源目录

两个页签：管理后台、商户后台，各一棵目录树（目录 / 操作点），只读。目录随版本发布：节点、命名、分类与停用都随版本走，页面上不能新建、改名、移动或停用节点。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    alt 管理后台页签
        S->>A: #35;20 [listResources]<br/>GET /resources
        A-->>S: 200 { items }
    else 商户后台页签
        S->>A: #35;23 [listMerchantResources]<br/>GET /merchant-resources
        A-->>S: 200 { items }
    end
    S-->>U: 按目录组织的树，已停用的节点标出
```

- 管理后台页签要 `rbac:role:view` 才能看，商户后台页签要 `rbac:merchant-role:view`。
- 已停用的操作点不可勾给角色；持有含它的角色的人调用对应功能即被拒。

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 菜单与路由 | v1 后端下发菜单与路由地址 | 目录只供授权界面组织与命名，不存路由、不下发给前端；前端只按权限点集合渲染导航 | 导航由前端自持 |
| 节点来源 | v1 菜单可手工新建任意权限串 | 操作点只来自功能上线时登记的权限点 | 建不出前端不认识的点 |

## 页面：预设角色

商户后台预设角色（管理员、员工、开发者、Owner）与终端预设角色（店长、收银员）的点集，按商户后台资源目录树勾选。预设角色不能新建、改名或删除。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 进入预设角色
    par 预设角色
        S->>A: #35;26 [listMerchantRoles]<br/>GET /merchant-roles
        A-->>S: 200 { items: [ { roleId, name, version, privileges } ] }
    and 权限点树
        S->>A: #35;23 [listMerchantResources]<br/>GET /merchant-resources
        A-->>S: 200 { items }
    end
    U->>S: 选一个预设角色，勾选后保存
    S->>A: #35;27 [updateMerchantRole]<br/>PUT /merchant-roles/{roleId} { version, privileges }
    A-->>S: 200 { ...新版本 }
```

- 提交的 `privileges` 是该角色的完整点集。改动对全部商户持有该角色的成员即时生效；保存前提示这一点。
- 没有 `rbac:merchant-role:manage` 的只读。

| 情形 | 响应 | 页面 |
|---|---|---|
| 别人先改过（版本已变） | #27 `409`·`968018` | 重拉 #26 后重做 |
| 勾了已停用或未登记的点 | #27 `409`·`968016` | 重拉 #23 后重选 |

## 流程：临时授权

两个入口都在商户运营页面：商户列表对数据范围外的商户给「申请查看」（自助申请，授权给本人）；商户详情的授权用户区块列出该商户的临时授权，可为某个后台用户指定、可撤销。商户列表与详情本身的接口随商户运营建。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    Note over U,A: 自助申请（商户列表「申请查看」）
    U->>S: 对某个范围外商户点申请查看并确认
    S->>A: #35;28 [createAccessGrant]<br/>POST /access-grants { merchantId }（Idempotency-Key）
    A-->>S: 201 { grantId, merchant, status: ACTIVE, expiresAt }
    S->>U: 提示已授权与到期时间，进入该商户详情

    Note over U,A: 商户详情 · 授权用户区块
    S->>A: #35;29 [listAccessGrants]<br/>GET /access-grants?merchantId=&status=ACTIVE
    A-->>S: 200 { total, data: [ { grantId, user, status, grantedAt, expiresAt, grantedBy } ] }
    U->>S: 指定授权用户（从后台账号里选人）
    S->>A: #35;30 [createStaffAccessGrant]<br/>POST /staff/{userId}/access-grants { merchantId }（Idempotency-Key）
    A-->>S: 201 { grantId, status: ACTIVE, expiresAt }
    U->>S: 某行点撤销并确认
    S->>A: #35;31 [deleteAccessGrant]<br/>DELETE /access-grants/{grantId}
    A-->>S: 204
    S->>A: #35;29 [listAccessGrants]<br/>GET /access-grants?merchantId=
```

- 授权时长由平台设定，页面只显示 `expiresAt`；到期自动失效，再次申请产生新授权、不延长旧的。
- 选人用 #1 `listStaff`（见「页面：后台账号」）。
- 自助申请要 `rbac:access-grant:create`；授权用户区块与指定、撤销要 `rbac:access-grant:manage`。

| 情形 | 响应 | 页面 |
|---|---|---|
| 商户已在本人范围内 | #28 `409`·`308005` | 提示无需申请，直接进商户详情 |
| 指定的授权用户是自己 | #30 `403`·`308001` | 提示改用自助申请 |
| 商户是 KA 商户 | #28 `403`·`308006` | 提示须由有指定权限的同事指定 |
| 商户或账号不存在 | #28 / #30 `404` | 刷新 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #28 / #30 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 谁能临时查看 | v1 名单写在系统参数里 | 按权限点；授权有时限、可撤销、可查 | 临时访问可控可追溯 |

n.hidden=false;}).catch(()=>{});}
