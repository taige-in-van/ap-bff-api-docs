# 通道进件与产品配置 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）；收单配置的各页签挂在商户详情下（商户详情见 06-merchant-ops），按数据可见范围过滤商户，按标识打开范围外商户得到 `404`。费率问题清单与平台收单参数是跨商户 / 平台级的页面。本文的比例费率一律是小数字符串（`"0.022"` = 2.2%），固定单笔费是结算币种的最小单位整数串；页面展示时由前端换成百分数与金额。

## 页面：收单配置 · 通道签约

按支付方式一行：通道 `channel`（通道名与通道商户号）、子商户号 `subMerchantId`、MCC `mcc`、运营启停 `enabled`、商户自助开关 `merchantEnabled`、是否要报备才有子商户号 `applicationRequired`、银联 Express `expressPayEnabled`（只银联在线）、线上平台标识 `subApps`、各类报备的最近结果 `applications`（状态、提交时间、通道给的原因）。下方列出可以加的支付方式 `availableMethods`。入驻申请提交后由系统建立的签约与报备同样在这里。

### 场景：加支付方式

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开通道签约
    S->>A: #35;1 [listMerchantChannelContracts]<br/>GET /merchants/{merchantId}/channel-contracts
    A-->>S: 200 { items: [ { contractId, paymentMethod, channel, enabled,<br/>applications, updatedAt } ], availableMethods }
    U->>S: 选一个可加的方式与通道，可选填子商户号、MCC、费率
    S->>A: #35;2 [createMerchantChannelContract]<br/>POST /merchants/{merchantId}/channel-contracts（Idempotency-Key）
    A-->>S: 201 { contractId, enabled }
    S->>A: #35;1 [listMerchantChannelContracts]<br/>GET /merchants/{merchantId}/channel-contracts
    A-->>S: 200 { items }
```

- 通道只能选 `availableMethods` 里该方式的 `channels`；子商户号只有需要报备的通道（该通道的 `applicationRequired` 为是）可填。
- 填了费率就按它写一条新费率，从当天起生效，该方式的当前费率在新费率的生效首日截断（与录入费率同规则）；不填时该方式已有当前费率的沿用、不另写，没有的取标准费率（`standardRate`）。
- 子商户号就位即启用：不需要子商户号、或子商户号按规则生成的通道，新建即启用；需要报备的通道，填了子商户号视为已就位、新建即启用且不自动报备，没填的新建为未启用，由系统自动发起报备，首次报备成功、子商户号回写时启用。#2 响应的 `enabled` 即建成后的启停。
- 费率问题清单里「待签约」且有可选通道的支付方式，就是在这里选一个通道加上。

### 场景：启停与子商户号

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 改某行的启停、子商户号、MCC 或 Express
    S->>A: #35;3 [updateMerchantChannelContract]<br/>PATCH /merchants/{merchantId}/channel-contracts/{contractId}
    A-->>S: 204

    A-->>S: 200 { items }
```

- 请求带上该行读到的 `updatedAt`，含微秒原样带回；他人先改过即被拒，重读后再改。
- 启停不改费率，停用只影响此后的受理。需要报备的通道（`applicationRequired` 为是）在子商户号就位前不能启用。
- 子商户号只有需要报备的通道（`applicationRequired` 为是）上的签约可录入、修改或清空。同一通道商户号下该商户的其他签约共用子商户号，录入时一并写入。子商户号由空录入为有值，这些签约随之启用（本次同时带了 `enabled: false` 的除外）；已有子商户号再改值不改启停；清空则随之停用。
- Express 只银联在线有；签约未启用时开关值保留但不生效。

## 页面：收单配置 · 费率与计费

上半部分是各支付方式（含插件入口专用行）的费率，按生效窗列出当前与历史，`current` 标出今天生效的那一行，旁边只读带出标准费率 `standardRates`；下半部分是计费条款：手续费结算模式 `billingModel`、退款手续费退回 `refundFeeReturnable`、客户服务费开关 `customerServiceFeeEnabled` 与适用范围 `csfCoverage`、APP 订阅开关 `appSubscriptionEnabled`、电商托管结算锁释放期 `escrowReleaseClearingDays`。

### 场景：调整费率

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开费率与计费
    S->>A: #35;10 [listMerchantFeeRates]<br/>GET /merchants/{merchantId}/fee-rates
    A-->>S: 200 { items: [ { feeRateId, paymentMethod, percentageRate,<br/>fixedFee, effectiveFrom, effectiveTo, current } ], standardRates }
    U->>S: 对某方式填新比例、固定费、免收截止日与生效首日
    S->>A: #35;11 [createMerchantFeeRate]<br/>POST /merchants/{merchantId}/fee-rates（Idempotency-Key）
    A-->>S: 201 { feeRateId }
    S->>A: #35;10 [listMerchantFeeRates]<br/>GET /merchants/{merchantId}/fee-rates
    A-->>S: 200 { items }
```

- 新费率从所选的生效首日起生效，当前费率在那一天截断，历史不覆盖、不删除。`effectiveTo` 是失效日，页面显示的最后生效日取它的前一天。
- 比例须大于 0、不超过平台上限，至多 4 位小数（折成百分数至多两位小数）；录入或调整费率不改变签约的启停。
- 小红书专用行（`entryPoint` 为 `plugin_allvalue_xhs`）不按平台上限校验。

| 情形 | 响应 | 页面 |
|---|---|---|
| 比例费率超过平台上限 | #11 `409`·`308406`（`context.capPercentage` 是上限，小数） | 比例框标红，按上限换成百分数提示 |
| 生效首日早于当前费率，或与已排定的未来费率重叠 | #11 `409`·`308407` | 生效首日标红，重拉 #10 |
| 比例不大于 0 或小数超过 4 位、固定费格式不对 | #11 `400`，`details` 定位字段 | 对应字段标红 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #11 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

### 场景：改计费条款与适用范围

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    S->>A: #35;13 [getMerchantSettlementTerms]<br/>GET /merchants/{merchantId}/settlement-terms
    A-->>S: 200 { billingModel, refundFeeReturnable, customerServiceFeeEnabled,<br/>csfCoverage, appSubscriptionEnabled, escrowReleaseClearingDays }
    alt 改条款
        S->>A: #35;14 [updateMerchantSettlementTerms]<br/>PATCH /merchants/{merchantId}/settlement-terms
        A-->>S: 204
    else 改客户服务费适用范围

    end

```

- 结算模式改后，此后成交的手续费按新模式；改前未结算的仍按其发生时的模式。商户后台不显示结算模式。

## 页面：费率问题清单

跨商户列出待处理的问题，只含本人数据范围内的商户。各列取：商户 `merchant`、支付方式 `paymentMethod`（插件入口专用行另带 `entryPoint`）、问题类型 `issueType`、失效日 `effectiveTo`（只即将到期有）、原因 `pendingReason`（只待签约有）。纯读页面，只调 #12。

- 问题类型：`no_effective_rate` 已启用签约今天没有生效费率；`expiring` 当前费率将在 `warningDays` 天内到期；`pending_setup` 商户在入驻申请提交后（被拒或已撤回的申请不算）、或受理模式开通申请通过后，申请里所选的支付方式该商户当前没有签约（已解绑的不算），全部列出（卡类支付方式商户自助接入，不列），`pendingReason` 按当前可签的通道数给出（`no_candidate_channel` 没有可签的通道、`single_candidate_channel` 恰有一个、`multiple_candidate_channels` 有多个可选通道）。
- `warningDays` 是平台设定的到期预警天数，在平台收单参数里改。
- 点「无生效费率」或「即将到期」的行进该商户的费率与计费；点「待签约」的行进该商户的通道签约，有可选通道的用「加支付方式」选一个补上。

        S->>A: #35;29 [updateGiftcardAlipayPassTemplate]<br/>PUT /merchants/{merchantId}/product-links/{productLinkId}/alipay-pass-template
        A-->>S: 204
        S->>A: #35;28 [listMerchantProductLinks]<br/>GET /merchants/{merchantId}/product-links
        A-->>S: 200 { data }
    end
```

- 卡包模板编号只对礼卡链接；清空即该礼卡不再提供存入支付宝卡包。

| 情形 | 响应 | 页面 |
|---|---|---|
| 店铺码对该商户未开通或已停用 | #26 `409`·`308413` | 店铺码区显示未开通 |
| 对非礼卡链接填编号 | #29 `400` | 不给填写入口 |
| 链接在读取后已被商户删除 | #29 `409`·`308414` | 提示链接已删除，重拉 #28 |

## 页面：收单配置 · 设备

列出该商户名下的设备，含已解绑的；可按状态与关键词筛选。各列取：设备号 `deviceId`、型号 `deviceModel`、来源 `deviceSource`、序列号 `serialNumber`、门店 `storeName`、状态 `status`、App 版本 `appVersion`、最近活跃 `lastActiveAt`、最近登录的操作员 `lastLoginOperator`。点一行看日志。

### 场景：停用 / 启用

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    S->>A: #35;30 [listMerchantDevices]<br/>GET /merchants/{merchantId}/devices?status=&keyword=
    A-->>S: 200 { total, data: [ { deviceId, deviceModel, status, lastActiveAt } ] }
    opt 查看日志
        U->>S: 点某台设备
        S->>A: #35;31 [listMerchantDeviceLogs]<br/>GET /merchants/{merchantId}/devices/{deviceId}/logs?from=&to=
        A-->>S: 200 { total, data: [ { logType, severity, eventName, createdAt } ] }
    end
    U->>S: 对某台设备点停用 / 启用
    S->>A: #35;32 [updateMerchantDeviceEnablement]<br/>PUT /merchants/{merchantId}/devices/{deviceId}/enablement
    A-->>S: 204
    S->>A: #35;30 [listMerchantDevices]<br/>GET /merchants/{merchantId}/devices
    A-->>S: 200 { data }
```

- 规则同商户自助：停用即不可受理、凭据保留，启用后恢复。待激活的设备不能停用或启用。
- 已解绑设备的日志照样可查；日志的日期范围两端必填，默认最近 30 天。

| 情形 | 响应 | 页面 |
|---|---|---|
| 待激活的设备 | #32 `409`·`308409` | 提示待激活不能停用或启用，重拉 #30 |
| 已解绑的设备 | #32 `404` | 不给停用 / 启用入口；出现就重拉 #30 |

### 场景：释放与跨商户转移

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 对某台设备点释放并确认
    S->>A: #35;33 [releaseMerchantDevice]<br/>DELETE /merchants/{merchantId}/devices/{deviceId}
    A-->>S: 204
    S->>A: #35;30 [listMerchantDevices]<br/>GET /merchants/{merchantId}/devices
    A-->>S: 200 { data: [ { deviceId, status: RELEASED } ] }
```

- 待激活的即取消激活，已接入的即解绑：设备移出该商户、凭据作废，记录留存、显示为已解绑。
- 跨商户转移：先在原商户这里释放，新商户的终端首次登录即接入。
- 已解绑的设备只可查看，不再有任何处置。

| 情形 | 响应 | 页面 |
|---|---|---|
| 设备已解绑 | #33 `404` | 不给释放入口；出现就重拉 #30 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 已释放的设备 | 可清理掉 | 记录留存、只可查看 | 设备与历史交易可追溯 |

## 页面：收单配置 · 开发接入

显示对接用商户号 `merchantCode`、开放 API 入口开关态 `openApiEnabled` 与 API 凭证末 4 位 `credentialLast4`。开放 API 的开关在受理入口页改。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    S->>A: #35;34 [getMerchantDeveloperAccess]<br/>GET /merchants/{merchantId}/developer
    A-->>S: 200 { merchantCode, openApiEnabled, credentialLast4 }
    U->>S: 点重置 API 凭证
    S->>U: 二次确认：旧凭证将在宽限期后失效
    U->>S: 确认
    S->>A: #35;35 [reissueMerchantApiCredential]<br/>POST /merchants/{merchantId}/developer/credential-reissuance（Idempotency-Key）
    A-->>S: 204
    S->>A: #35;34 [getMerchantDeveloperAccess]<br/>GET /merchants/{merchantId}/developer
    A-->>S: 200 { credentialLast4 }
```

- 运营看不到凭证全文；商户在商户后台的开发者页查看新凭证。
- 旧凭证在宽限期内仍可用，之后失效。
- 商户还没有签发过凭证（未激活）时不给重置按钮。

| 情形 | 响应 | 页面 |
|---|---|---|
| 商户还没有凭证 | #35 `404` | 提示商户激活后才有凭证 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #35 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 重置凭证后的旧凭证 | 立即失效 | 宽限期内仍可用，之后失效 | 商户来得及换上新凭证，不中断接入 |

## 页面：平台收单参数

收单相关的平台级参数：APP 订阅的首月分界日、单台月费与合约期数，小费默认三档，AllValue 小红书默认上浮，商户费率上限，费率到期预警天数。形态与平台参数页相同（见 03-settings）。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开平台收单参数
    S->>A: #35;36 [listAcquiringPlatformParameters]<br/>GET /settings/acquiring-parameters
    A-->>S: 200 { items: [ { key, groupName, value, effectiveValue, version } ] }
    U->>S: 改某项的值，或恢复默认
    S->>A: #35;37 [updateAcquiringPlatformParameter]<br/>PUT /settings/acquiring-parameters/{key}
    A-->>S: 200 { key, value, effectiveValue, version }
```

- `value` 传 `null` 恢复默认。对此后的判定生效，改前已经发生的不受影响（如改费率上限不影响已录入的费率）。
- 单台月费按商户的结算币种解释。
- AllValue 小红书默认上浮与商户费率上限用比例小数字符串（`stringValue`，如 `"0.05"` = 5%，至多 4 位小数），与费率同形，换算为百分数只在页面展示。

| 情形 | 响应 | 页面 |
|---|---|---|
| 版本已过期 | #37 `409`·`308103` | 提示他人已改过，重拉 #36 |
| 值的类型或取值不合值域 | #37 `400`，`details` 定位到 `value` | 输入框标红 |

n.hidden=false;}).catch(()=>{});}
document.querySelectorAll('code.language-mermaid').forEach(c=>{const d=document.createElement('div');d.className='mermaid';d.textContent=c.textContent;c.closest('pre').replaceWith(d);});
mermaid.initialize({startOnLoad:false,theme:'neutral',sequence:{useMaxWidth:true}});
mermaid.run({querySelector:'.mermaid'}).then(jump,jump);
