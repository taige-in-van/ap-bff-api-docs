# 通道进件与产品配置 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）；收单配置的各页签挂在商户详情下（商户详情见 06-merchant-ops），按数据可见范围过滤商户，按标识打开范围外商户得到 `404`。费率问题清单与平台收单参数是跨商户 / 平台级的页面。本文的比例费率一律是小数字符串（`"0.022"` = 2.2%），固定单笔费是结算币种的最小单位整数串；页面展示时由前端换成百分数与金额。

|---|---|---|

| 收单配置 · 受理入口 | 收单配置页签内 | [页面：收单配置 · 受理入口](#页面：收单配置%20·%20受理入口) |

| 费率问题清单 | 导航「收单配置 › 费率问题」 | [页面：费率问题清单](#页面：费率问题清单) |

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`listMerchantChannelContracts`](../acquiring/index.html#tag/channels/operation/listMerchantChannelContracts) | `GET /merchants/{merchantId}/channel-contracts` | 通道签约总览 |
| 2 | [`createMerchantChannelContract`](../acquiring/index.html#tag/channels/operation/createMerchantChannelContract) | `POST /merchants/{merchantId}/channel-contracts` | 加支付方式 |
| 3 | [`updateMerchantChannelContract`](../acquiring/index.html#tag/channels/operation/updateMerchantChannelContract) | `PATCH /merchants/{merchantId}/channel-contracts/{contractId}` | 改签约（启停、子商户号、MCC、Express） |
| 4 | [`createMerchantChannelApplication`](../acquiring/index.html#tag/channels/operation/createMerchantChannelApplication) | `POST /merchants/{merchantId}/channel-contracts/{contractId}/applications` | 提交 / 重提报备 |
| 5 | [`syncMerchantChannelApplication`](../acquiring/index.html#tag/channels/operation/syncMerchantChannelApplication) | `POST /merchants/{merchantId}/channel-contracts/{contractId}/applications/{channelApplicationId}/synchronization` | 刷新报备状态 |
| 6 | [`registerMerchantChannelSubApp`](../acquiring/index.html#tag/channels/operation/registerMerchantChannelSubApp) | `PUT /merchants/{merchantId}/channel-contracts/{contractId}/sub-apps/{appId}` | 录入线上平台标识 |
| 7 | [`listMerchantEntryPoints`](../acquiring/index.html#tag/entry-points/operation/listMerchantEntryPoints) | `GET /merchants/{merchantId}/entry-points` | 受理入口 |

## 页面：收单配置 · 通道签约

按支付方式一行：通道 `channel`（通道名与通道商户号）、子商户号 `subMerchantId`、MCC `mcc`、运营启停 `enabled`、商户自助开关 `merchantEnabled`、是否要报备才有子商户号 `applicationRequired`、银联 Express `expressPayEnabled`（只银联在线）、线上平台标识 `subApps`、各类报备的最近结果 `applications`（状态、提交时间、通道给的原因）、系统自动发起而还没有报备记录的报备状态 `autoApplications`；共用子商户号的签约显示同一组的报备。下方列出可以加的支付方式 `availableMethods`。入驻申请提交后由系统建立的签约与报备同样在这里。

- 某类报备在 `autoApplications` 里有一条（比该类最近的报备记录新、还没形成报备记录的那一轮自动报备）就显示它，否则显示 `applications` 里的那条；显示自动报备时，`IN_PROGRESS` 显示「自动报备中」，`FAILED` 显示「自动报备失败」及原因 `failureMessage` 与时间 `concludedAt`，并提供提交报备。
- `failureCategory` 为 `outcome_unknown` 时另提示：先到渠道服务商平台核实，已建出的录入子商户号，没有的再重提；同时显示 `merchantRemark` 供在平台上核对。

### 场景：加支付方式

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开通道签约
    S->>A: #35;1 [listMerchantChannelContracts]<br/>GET /merchants/{merchantId}/channel-contracts
    A-->>S: 200 { items: [ { contractId, paymentMethod, channel, enabled,<br/>applications, autoApplications, updatedAt } ], availableMethods }
    U->>S: 选一个可加的方式与通道，可选填子商户号、MCC、费率
    S->>A: #35;2 [createMerchantChannelContract]<br/>POST /merchants/{merchantId}/channel-contracts（Idempotency-Key）
    A-->>S: 201 { contractId, enabled }
    S->>A: #35;1 [listMerchantChannelContracts]<br/>GET /merchants/{merchantId}/channel-contracts
    A-->>S: 200 { items }
```

- 通道只能选 `availableMethods` 里该方式的 `channels`；子商户号只有需要报备的通道（该通道的 `applicationRequired` 为是）可填。
- 填了费率就按它写一条新费率，从当天起生效，该方式的当前费率在新费率的生效首日截断（与录入费率同规则）；不填时该方式已有当前费率的沿用、不另写，没有的取标准费率（`standardRate`）。
- 子商户号就位即启用：不需要子商户号、或子商户号按规则生成的通道，新建即启用；需要报备的通道，填了子商户号视为已就位、新建即启用且不自动报备，没填的新建为未启用，由系统自动发起报备，首次报备成功、子商户号回写时启用。#2 响应的 `enabled` 即建成后的启停。
- 同一通道商户号下该商户的其他签约共用子商户号：填了子商户号时，这些签约已有子商户号的须与所填相同；都还没有的，所填的号一并写入，这些签约随之启用。
- 费率问题清单里「待签约」且有可选通道的支付方式，就是在这里选一个通道加上。

| 情形 | 响应 | 页面 |
|---|---|---|
| 该方式已有生效签约 | #2 `409`·`308403` | 提示已签约，重拉 #1 |
| 所选通道不能签给该商户 | #2 `409`·`308410` | 提示改选通道，重拉 #1 |
| 填的比例费率超过平台上限 | #2 `409`·`308406`（`context.capPercentage` 是上限，小数） | 费率框标红，按上限换成百分数提示 |
| 当天起写入的新费率与该方式已排定的未来费率重叠 | #2 `409`·`308407` | 提示该方式已有排定的未来费率，到费率与计费核对后再加 |
| 填的子商户号与同一通道商户号下其他签约已有的子商户号不同 | #2 `409`·`308419` | 子商户号框标红，提示要换号到该组签约上改子商户号 |
| 字段格式不对、给不需要报备的通道填了子商户号 | #2 `400`，`details` 定位字段 | 对应字段标红 |
| 同一幂等键用于不同内容 / 首次请求处理中 | #2 `409`·`908003` / `908002` | 换新键重提 / 稍后同键重发 |

### 场景：启停与子商户号

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 改某行的启停、子商户号、MCC 或 Express
    S->>A: #35;3 [updateMerchantChannelContract]<br/>PATCH /merchants/{merchantId}/channel-contracts/{contractId}
    A-->>S: 204
    S->>A: #35;1 [listMerchantChannelContracts]<br/>GET /merchants/{merchantId}/channel-contracts
    A-->>S: 200 { items }
```

- 请求带上该行读到的 `updatedAt`，含微秒原样带回；他人先改过即被拒，重读后再改。
- 启停不改费率，停用只影响此后的受理。需要报备的通道（`applicationRequired` 为是）在子商户号就位前不能启用。
- 子商户号只有需要报备的通道（`applicationRequired` 为是）上的签约可录入、修改或清空。同一通道商户号下该商户的其他签约共用子商户号，录入时一并写入。子商户号由空录入为有值，这些签约随之启用（本次同时带了 `enabled: false` 的除外）；已有子商户号再改值不改启停；清空则随之停用。
- Express 只银联在线有；签约未启用时开关值保留但不生效。

| 情形 | 响应 | 页面 |
|---|---|---|
| 签约在读取后已被他人改过 | #3 `409`·`308401` | 提示他人已改过，重拉 #1 |
| 子商户号未就位却要启用 | #3 `409`·`308402` | 提示待报备成功或先录入子商户号 |
| 要启用，而出款方式与该商户其他已启用签约不一致 | #3 `409`·`308410` | 提示不能启用，重拉 #1 |
| 字段格式不对、非银联在线带了 Express、不需要报备的通道上的签约带了子商户号 | #3 `400`，`details` 定位字段 | 对应字段标红 |

### 场景：报备提交、重提与刷新

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    alt 提交或重提
        U->>S: 对某行的某类报备点提交 / 重提
        S->>A: #35;4 [createMerchantChannelApplication]<br/>POST /merchants/{merchantId}/channel-contracts/{contractId}/applications（Idempotency-Key）
        A-->>S: 201 { channelApplicationId, status: UNDER_REVIEW }
    else 刷新状态
        U->>S: 对审核中的报备点刷新
        S->>A: #35;5 [syncMerchantChannelApplication]<br/>POST /merchants/{merchantId}/channel-contracts/{contractId}/applications/{channelApplicationId}/synchronization
        A-->>S: 200 { status, rejectReason, decidedAt }
    end
    S->>A: #35;1 [listMerchantChannelContracts]<br/>GET /merchants/{merchantId}/channel-contracts
    A-->>S: 200 { items }
```

- 报备内容取商户当前资料；被驳回的同类报备再提即为重提。
- 微信 H5 支付权限申请另带限额档 `limitType`（未上线网站限额 / 普通限额 / 无限额，与通道一一对应）与网站状态 `websiteState`，可带业务说明 `businessDescription`、营业执照 `businessLicenseFileId`、网站首页截图 `websiteHomepageScreenshotFileIds` 与业务页截图 `websiteBusinessPageScreenshotFileIds`，表单不按档位强制必填；选无限额而不传营业执照时取商户入驻证照中的图片件。档位与材料不合的由通道当场拒绝（`308405`），显示通道原因。另传的执照与截图先经 `uploadMerchantFile`（用途 `channel_application_material`）上传再带 `fileId`。
- 系统自动发起的 H5 申请是普通限额、已上线、不带材料；被驳回后运营在此补改材料重提，仍是同一条报备。重提表单用该报备记录回读的上次提交内容（`limitType` / `websiteState` / `businessDescription` / 材料 `fileId`）预填，提交时整份改写、服务端不与上次合并。
- 审核结果由系统定时同步，刷新只是按需提前查一次，不进操作审计。
- 首次子商户进件成功时，系统回写子商户号并启用签约，刷新查到成功时同样如此。

| 情形 | 响应 | 页面 |
|---|---|---|
| 带的执照或截图 `fileId` 不可用（不存在、不是本商户上传的或用途不符） | #4 `400`·`308416`（`details` 指到该字段） | 提示重新上传 |
| 该签约或共用子商户号的另一条签约上同类报备还在审 | #4 `409`·`308404` | 提示先刷新状态 |
| 商户资料不合这类报备的要求，缺必填项或微信 H5 网址超出渠道长度上限（如支付宝线上缺经营网址） | #4 `409`·`308417`（`details` 逐项指到缺的或不合要求的资料项） | 列出缺的或不合要求的资料，提示到商户资料改好后再提 |
| 通道当场拒绝 | #4 `409`·`308405`（通道给了原因时带 `context.channelErrorCode` / `channelErrorMessage`） | 显示通道原因，提示改资料后重提 |
| 已发给通道、结果未明 | #4 `409`·`308418` | 提示先到渠道服务商平台核实这次报备是否已生效：子商户进件已建成的录入子商户号，没生效的再重提，不要直接重提 |
| 该通道不适用这类报备 | #4 `400` | 提示不适用 |

## 页面：收单配置 · 费率与计费

上半部分是各支付方式（含插件入口专用行）的费率，按生效窗列出当前与历史，`current` 标出今天生效的那一行，旁边只读带出标准费率 `standardRates`；下半部分是计费条款：手续费结算模式 `billingModel`、退款手续费退回 `refundFeeReturnable`、客户服务费开关 `customerServiceFeeEnabled` 与适用范围 `csfCoverage`、APP 订阅开关 `appSubscriptionEnabled`、电商托管结算锁释放期 `escrowReleaseClearingDays`。

### 场景：调整费率

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开费率与计费
    S->>A: #35;10 [listMerchantFeeRates]<br/>GET /merchants/{merchantId}/fee-rates
    A-->>S: 200 { items: [ { feeRateId, paymentMethod, percentageRate,<br/>fixedFee, effectiveFrom, effectiveTo, current } ], standardRates }
    U->>S: 对某方式填新比例、固定费、免收截止日与生效首日
    S->>A: #35;11 [createMerchantFeeRate]<br/>POST /merchants/{merchantId}/fee-rates（Idempotency-Key）
    A-->>S: 201 { feeRateId }
    S->>A: #35;10 [listMerchantFeeRates]<br/>GET /merchants/{merchantId}/fee-rates
    A-->>S: 200 { items }
```

- 新费率从所选的生效首日起生效，当前费率在那一天截断，历史不覆盖、不删除。`effectiveTo` 是失效日，页面显示的最后生效日取它的前一天。

## 页面：费率问题清单

跨商户列出待处理的问题，只含本人数据范围内的商户。各列取：商户 `merchant`、支付方式 `paymentMethod`（插件入口专用行另带 `entryPoint`）、问题类型 `issueType`、失效日 `effectiveTo`（只即将到期有）、原因 `pendingReason`（只待签约有）。纯读页面，只调 #12。

- 问题类型：`no_effective_rate` 已启用签约今天没有生效费率；`expiring` 当前费率将在 `warningDays` 天内到期；`pending_setup` 商户在入驻申请提交后（被拒或已撤回的申请不算）、或受理模式开通申请通过后，申请里所选的支付方式该商户当前没有签约（已解绑的不算），全部列出（卡类支付方式商户自助接入，不列），`pendingReason` 按当前可签的通道数给出（`no_candidate_channel` 没有可签的通道、`single_candidate_channel` 恰有一个、`multiple_candidate_channels` 有多个可选通道）。
- `warningDays` 是平台设定的到期预警天数，在平台收单参数里改。
- 点「无生效费率」或「即将到期」的行进该商户的费率与计费；点「待签约」的行进该商户的通道签约，有可选通道的用「加支付方式」选一个补上。
