# 交易管理 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」；管理后台与商户后台不同的约定见 [管理后台约定](../conventions.html)。本文各页面的入口与按钮按会话的 `privileges` 显隐（`getCurrentSession`，见 01-login-profile）；交易、退款单、退款审核与代扣协议按数据可见范围过滤商户（按订单所属商户），按标识打开范围外商户的单据得到 `404`。商户详情的订单页签挂在商户详情下（商户详情见 06-merchant-ops）。本文的金额一律是对应币种最小单位的整数串，页面展示时由前端按币种换算。

## 本文的页面

| 商户详情 · 订单 | 商户详情的「订单」页签 | [页面：商户详情 · 订单](#页面：商户详情%20·%20订单) |

| 退款审核 | 导航「交易 › 退款审核」；运营企业微信群消息里的链接 | [页面：退款审核](#页面：退款审核) |

## 页面：交易查询

跨商户的支付订单。筛选：日期范围（按订单创建日期）、商户 `merchantId`、关键词 `keyword`、状态 `status`、支付方式 `paymentMethodFamily`、来源 `source`、是否预授权订单 `preauthOrder`、结算锁生效中 `settlementHoldActive`。列表调 #1，合计调 #2，两者带同一组筛选。

- 日期范围两端必填，默认最近 30 天（含今天）；换算见[管理后台约定](../conventions.html)「列表的日期范围」。状态默认选收到钱的四种（`PAID` / `PARTIALLY_REFUNDED` / `REFUNDED` / `PREAUTH_HOLDING`），用户可改。不传排序时按创建时间从新到旧，可改按金额排序（`sortField = amount`）。
- 插件订单与账单码订单不另设页面：来源筛选里给「插件订单」（`shopify`、`allvalue`）与「账单码订单」（`invoice`）两个预置项。
- 各列取：商户 `merchant` 与商户码 `merchantCode`、机构 `partnerId`、平台订单号 `orderId`、商户订单号 `merchantOrderNo`、金额 `amount`、已退金额 `refundedAmount`、汇率 `fxRate`、状态 `status`、已结算 `settled`、加收客户服务费 `customerServiceFeeCharged`、支付方式 `paymentMethodFamily`、来源 `source`、创建时间 `createdAt`。行上标记：`hasReviewingRefund` 为真标「有待审退款」，`preauthOrder` 为真标「预授权」，`settlementHoldActive` 为真另标「结算锁生效中」。
- `amount` 已成交的是结算币种的成交金额，没成交的（`FAILED` / `REJECTED`）是标价金额，按各行自带的币种显示。
- 合计常显，按结算币种每个币种一行（笔数、成交额、已退额、净额）；只涉及一个结算币种时只有一行，没有计入的订单时显示为空。合计只算收到钱的四种状态，所以笔数可能小于列表行数。筛选变化时 #1 与 #2 一起重调。
- 「导出」调 #4，请求体带当前的全部筛选与排序，同步下载 xlsx。
- 点一行进订单详情。

| 情形 | 响应 | 页面 |
|---|---|---|
| 日期范围缺一端或 `to` 早于 `from` | #1 / #2 / #4 `400` | 在日期选择器下提示 |
| 日期区间跨度超过允许的最大查询窗口 | #1 / #2 / #4 `400` | 在日期选择器下提示缩小范围 |
| 导出命中行数超过上限 | #4 `409`·`308503`（`context.maxRows` 是上限） | 提示「超过 N 行，请缩小范围后再导出」，N 取 `maxRows` |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 交易列表 | v1 两套交易列表并存，列与筛选不一 | 一套交易查询 | 同一批订单只有一个口径 |
| 全局交易导出 | Hub 只在商户详情的订单页签能导出 | 跨商户的交易查询也能按筛选导出 | 运营按条件导出不必逐个商户进 |
| 账单码交易与插件订单 | v1 各有单独页面 | 交易查询的来源预置筛选 | 是同一批订单按来源看 |
| 导出方式 | Hub 超过一定条数转下载中心 | 一律同步出文件，超过上限提示缩小范围 | 不建异步导出中心 |

## 页面：订单详情

单张订单，调 #3。分块展示：

- 订单：平台订单号 `orderId`、商户订单号 `merchantOrderNo`、商户 `merchant` 与商户码、机构 `partnerId`、订单描述 `orderDescription`、订单明细 `orderDetail`、采集项 `collectedFields`、买家与收件人填写项 `buyerFields` / `recipientFields`。
- 金额：标价 `orderAmount`、小费 `tipAmount`、订单总额 `totalAmount`、客户服务费 `customerServiceFee`、应付 `customerPaymentAmount`、成交额 `paidSettleAmount`、已退 `refundedAmount` / `refundedSettleAmount`、可退 `refundableAmount`、人民币实扣 `cnyAmount` 与汇率 `fxRate`。
- 支付：支付方式 `paymentMethod`、通道 `channelId`、通道交易类型 `channelTradeType`、产品形态 `product`、来源 `source`、受理模式 `acceptanceMode`、创建 / 确认 / 通道成功时间（`createdAt` / `confirmedAt` / `channelSuccessAt`）、通道交易号 `channelTxnNo`、通道错误 `channelError`、付款人通道侧标识 `payerChannelUserId`（完整显示）与 IP `customerIp`、回调地址 `notifyUrl`、发起设备 `device`。
- 结算锁：`preauthOrder` 为真时显示「预授权订单」，并按 `settlementHoldActive` 显示锁生效中或已释放。只展示，没有释放按钮。
- 关联退款：`refunds` 每行带类型、状态、金额与时间，`type = system_auto` 的标「系统自动退款」；点一行进退款详情。
- 回调投递：`callbackDeliveries` 每行带事件 `eventType`、状态 `status`、尝试次数 `attemptCount`、最近一次的应答码 `lastHttpStatus` 与失败类别 `lastFailureClass`。`status = DEAD_LETTER` 的行给「去重投」，跳到运维与审计的对外投递任务详情（`getOutboundDelivery`，要 `opscon:delivery:view`；重投在那里做，见 04-ops-audit「页面：对外投递 · 任务详情 抽屉」）。

| 情形 | 响应 | 页面 |
|---|---|---|
| 订单不存在或不在数据范围内 | #3 `404` | 提示找不到，回到来源列表并刷新 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 重发支付通知 | v1 订单详情可补发从未成功的支付通知 | 只看该单回调的投递状态，死信到运维与审计重投 | 重投都落在同一份对外投递记录上，可追查每次尝试 |

## 页面：商户详情 · 订单

商户详情下的订单页签：就是交易查询固定了 `merchantId`，筛选、列、合计、详情与导出同[页面：交易查询](#页面：交易查询)，调 #1 / #2 / #4 时都带该商户的 `merchantId`。

- 日期范围默认最近 30 天（含今天）。
- 合计常显，一个商户只有一个结算币种，所以是一行。
- 导出只含该商户的订单。

---

## 页面：退款单

跨商户的退款单，调 #5。筛选：日期范围（按退款单创建日期）、商户 `merchantId`、关键词 `keyword`、状态 `status`、失败原因 `failureReason`、支付方式 `paymentMethodFamily`、原订单来源 `source`。

- 日期范围两端必填，默认最近 30 天（含今天）。列表固定按创建时间从新到旧。
- 各列取：商户 `merchant` 与商户码 `merchantCode`（跨主子代退另显示发起方商户 `initiatorMerchant`）、平台订单号 `orderId` 与商户订单号 `merchantOrderNo`、平台退款号 `refundId` 与商户退款单号 `merchantRefundNo`、退款金额 `amount`、结算币种退款额 `settleAmount`、创建时间 `createdAt`、状态 `status`（失败的带原因 `failureReason`）、支付方式 `paymentMethodFamily`、原订单来源 `source`、发起入口 `entryPoint`、类型 `type`（`system_auto` 标「系统自动退款」）。
- 「导出」调 #7，请求体带当前的全部筛选，同步下载 xlsx。
- 点一行进退款详情。

| 情形 | 响应 | 页面 |
|---|---|---|
| 日期范围缺一端或 `to` 早于 `from` | #5 / #7 `400` | 在日期选择器下提示 |
| 日期区间跨度超过允许的最大查询窗口 | #5 / #7 `400` | 在日期选择器下提示缩小范围 |
| 导出命中行数超过上限 | #7 `409`·`308503`（`context.maxRows` 是上限） | 提示「超过 N 行，请缩小范围后再导出」，N 取 `maxRows` |

## 页面：退款详情

单笔退款，调 #6；要看原订单时另调 #3。列表行的字段，加通道退款号 `channelRefundNo`、发起操作员 `operator` 与发起设备 `device`、退款备注 `note`、通知地址 `notifyUrl`、受理时间 `acceptedAt`、完成时间 `completedAt`、审核时间 `reviewedAt`、审核人 `reviewer` 与审批说明 `reviewNote`、退回商户的手续费 `feeRefunded`。

- 失败的退款显示失败原因 `failureReason`（四类）与通道原文 `channelError`（码与文字原样）。本页没有任何处置按钮：重新发起只能由商户在商户后台做，失败与结果未明的核对在清算结算处理。
- 回调投递 `callbackDeliveries` 同订单详情：死信行给「去重投」，跳运维与审计的对外投递任务详情。

| 情形 | 响应 | 页面 |
|---|---|---|
| 退款不存在或不在数据范围内 | #6 `404` | 提示找不到，回到来源列表并刷新 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 重发退款通知 | v1 退款详情可对任意状态的退款再推一次通知 | 只看该退款回调的投递状态，死信到运维与审计重投 | 只补投没送达的，不另造一次通知 |

## 页面：退款审核

走过审核的退款，按 `reviewState` 分「待审」（`PENDING`，默认）、「已通过」（`APPROVED`）、「已拒绝」（`REJECTED`）三个页签；筛选：商户 `merchantId`、关键词 `keyword`（商户码、商户名、退款备注、平台订单号）；「已通过」「已拒绝」两个页签另按审核日期区间 `from` / `to` 筛选，两端必填、默认最近 30 天（含今天），换算见[管理后台约定](../conventions.html)「列表的日期范围」；「待审」不按日期。

各列取：商户 `merchant` 与商户码、商户订单号 `merchantOrderNo` 与平台订单号 `orderId`、退款金额 `amount`、申请人（发起入口 `entryPoint` 与操作员 `operator`）、申请时间 `createdAt`、申请原因 `note`、状态 `status`、审核人 `reviewer`、审批说明 `reviewNote`、审核时间 `reviewedAt`。

### 场景：通过或拒绝

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 管理后台 SPA
    participant A as BFF

    U->>S: 打开退款审核
    S->>A: #35;8 [listRefundReviews]<br/>GET /refund-reviews?reviewState=PENDING
    A-->>S: 200 { total, data: [ { refundId, merchant, orderId, amount,<br/>entryPoint, operator, createdAt, note } ] }
    U->>S: 点一行的「详情」
    S->>A: #35;6 [getRefund]<br/>GET /refunds/{refundId}
    A-->>S: 200 { refundId, amount, status, operator, device, note }
    S->>A: #35;3 [getPayment]<br/>GET /payments/{orderId}
    A-->>S: 200 { orderId, amount, status, refunds }
    U->>S: 选通过或拒绝，可填审批说明
    S->>A: #35;9 [decideRefundReview]<br/>POST /refund-reviews/{refundId}/decision
    A-->>S: 200 { refundId, status }
    S->>A: #35;8 [listRefundReviews]<br/>GET /refund-reviews?reviewState=PENDING
    A-->>S: 200 { total, data }
```

- 导航上「退款审核」的红点 = `reviewState = PENDING` 时 #8 的 `total`；页面加载时与每次下完结论后刷新。
- 审核只在登录后的管理后台里进行。运营企业微信群消息里的链接打开时先登录，登录后落到这条退款的审核页（按退款号调 #6、#3 取内容）；没有审核权限的用户没有审核动作、提交审核决定被拒。
- 审核人取当前登录的用户，页面不填。审批说明可不填，至多 256 字。
- 打开详情要另持 `txadm:refund:view` 与 `txadm:payment:view`；配置审核角色时一并勾上。
- 通过后响应的 `status` 一般是 `CHANNEL_PROCESSING`（已送往通道），行从「待审」移到「已通过」；拒绝后为 `REJECTED`，行移到「已拒绝」。
- 没有「撤回待审」：审核中的退款只能由发起的商户撤销。

| 情形 | 响应 | 页面 |
|---|---|---|
| 退款已不在审核中（他人先下了结论，或商户已撤销，或自己上一次已成功〔提交后超时重点〕） | #9 `409`·`308501` | 提示「该退款已被处理（可能是你上一次提交已生效）」，重拉 #8 |
| 跨主子代退的授权在审核期间被撤 | #9 `409`·`308502` | 提示授权已撤、不能通过，建议改为拒绝 |
| 已通过 / 已拒绝页签的日期区间缺一端、`to` 早于 `from` 或跨度超过允许的最大查询窗口 | #8 `400` | 在日期选择器下提示 |
| 审批说明超长 | #9 `400` | 说明框标红 |
| 退款不存在或不在数据范围内 | #9 `404` | 提示找不到，重拉 #8 |

**相对 v1 / Hub 的改动**

| 位置 | v1 / Hub | 改后 | 为什么 |
|---|---|---|---|
| 审核入口 | v1 企业微信群消息里的链接免登录即可查看并审批 | 链接只定位，打开先登录，按权限审核 | 审批是资金动作，须在已认证的会话里做 |
| 已通过 / 已拒绝页签 | v1 审核页不按日期筛选 | 按审核日期区间筛选，两端必填、默认最近 30 天 | 历史结论按时间窗查，不整表扫 |
| 拒绝说明 | v1 经链接页拒绝时填的原因不落库 | 拒绝可填说明，在退款详情与已拒绝页签可见 | 可追查为什么被拒 |
| 审核人 | v1 记法不一（链接页的拒绝记为系统） | 一律取当前登录用户，进操作审计 | 可追查谁审的 |
| 退款审核页 | Hub 没有 | 有 | 承接 v1 的审核能力 |

## 页面：代扣协议

按商户只读查看委托代扣协议，调 #10。先选商户（必填），可按状态 `status` 筛选（可多选）。

- 各列取：平台协议号 `mandateId`、商户协议号 `merchantMandateNo`、通道协议号 `channelMandateNo`、支付方式 `paymentMethod`、状态 `status`、生效时间 `activatedAt`、有效期至 `validUntil`、解约时间 `terminatedAt`、创建时间 `createdAt`。

|---|---|---|
| 没选商户 | #10 `400` | 选商户后再查 |

代扣协议的只读查看是新增的页面，Hub 没有对应页面。

## 页面：平台退款参数

退款相关的平台级参数：退款审核总开关、退款审核金额阈值、最大退款期限。形态与平台参数页相同（见 03-settings），调 #11 列出、#12 改值或恢复默认（`value` 传 `null`）。

- 总开关打开后，金额达到阈值的退款要经审核才送往通道；对此后发起的退款生效，已送往通道的不受影响。
- 阈值是结算币种的最小单位整数，按各商户的结算币种解释，不带币种；页面按「金额」展示时提示这一点。
- 最大退款期限是天数，订单成交超过这个天数的不能再发起退款。

| 情形 | 响应 | 页面 |
|---|---|---|
| 版本已过期 | #12 `409`·`308103` | 提示他人已改过，重拉 #11 |
| 值的类型或取值不合值域 | #12 `400`，`details` 定位到 `value` | 输入框标红 |
| 参数已不存在 | #12 `404` | 重拉 #11 |

n.hidden=false;}).catch(()=>{});}
