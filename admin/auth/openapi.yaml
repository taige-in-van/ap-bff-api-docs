openapi: 3.1.0
info:
  title: 管理后台 登录与个人设置 — 前端契约面
  version: 2.2.2
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的登录与个人设置契约：登录与会话（密码 + 人机校验 + 动态码、首次登录内绑定验证器、受信浏览器、企业微信扫码、当前会话、登出）、忘记密码、邮件链接落地页（受邀设密、确认新登录邮箱），以及本人资料、改密、重绑验证器、企业微信绑定与本人登录 IP 白名单。
    浏览器持 httpOnly 会话 cookie（登录后 set-cookie），字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 认证类（登录、动态码、扫码、登出）与多步挑战类（找回密码、邮件链接、重绑验证器）按流程语义不挂 `Idempotency-Key`；改密挂；天然幂等的改资料、改白名单、解绑不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`；公开端点（`security: []`）无会话、不带。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: sessions
    x-displayName: 登录与会话
    description: 登录与会话：密码登录、动态码步（含首次绑定验证器）、企业微信扫码登录、当前会话、登出。
  - name: password-resets
    x-displayName: 忘记密码
    description: 忘记密码自助重置：邮箱登录名收邮件验证码、用户名登录名用验证器码；重置不改验证器绑定。
  - name: invitation
    x-displayName: 受邀设密
    description: 受邀的后台用户在邀请链接落地页设置登录密码；不建会话。
  - name: email-confirmation
    x-displayName: 确认新登录邮箱
    description: 管理员改了后台账号的登录邮箱后，当事人在新邮箱收到的确认链接落地页；不建会话。
  - name: me
    x-displayName: 本人资料
    description: 本人资料与本人登录 IP 白名单。
  - name: security
    x-displayName: 账户安全
    description: 改密与重绑验证器。管理后台账号必须启用验证器，没有关闭入口。
  - name: wechat
    x-displayName: 企业微信绑定
    description: 本人企业微信的绑定与解绑；绑定后可扫码登录。
paths:
  /auth/sessions:
    post:
      tags:
        - sessions
      operationId: login
      summary: 密码登录（登录名 + 密码 + 人机校验；转动态码步，受信浏览器直接建会话）
      description: |
        登录名 + 密码，人机校验开启时另带人机校验结果。管理后台账号每次登录都要过动态码步，结果按 `status` 分：

        - `ESTABLISHED`：本浏览器在受信有效期内，免动态码，已 set-cookie 建会话。
        - `MFA_REQUIRED`：去动态码步，把 `mfaChallenge` 与验证器上的 6 位码提交到 `completeMfaChallenge`。
        - `MFA_ENROLLMENT_REQUIRED`：账号还没绑定验证器（新账号或验证器被重置），先用 `mfaEnrollment` 在验证器里添加，再把 `mfaChallenge` 与验证器上的码提交到 `completeMfaChallenge`；绑定完成前不建会话，也不能使用其他功能。

        受信浏览器凭据由服务端存在 HttpOnly cookie 里，前端不读不写；凭据已失效（过期、被撤销）时本接口照常返回 `MFA_REQUIRED`，前端不必区分。

        **什么时候拒绝**：

        - `304002` 人机校验开启而没带结果，或校验未通过；不校验密码。
        - `306001` 登录失败：登录名不存在、密码错、账号停用、没有管理后台访问资格，一律此码、不区分。
        - `306010` 密码对了但来源 IP 不在本人登录 IP 白名单：明确提示当前网络不允许登录，回第一步；不进动态码步。
        - `966001` 账号因连续登录失败被锁，等冷却。

        不挂幂等键（认证类）。各情形的页面处理见 flows。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              loginId: alice@example.com
              password: Str0ng!Pass
              captcha:
                ticket: t03Xk9aZ
                randstr: '@Ab1'
      responses:
        '200':
          description: '`ESTABLISHED` 已 set-cookie；另两种状态待动态码步、未建会话'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              examples:
                mfaRequired:
                  summary: 去动态码步
                  value:
                    status: MFA_REQUIRED
                    mfaChallenge: chl_9f2a4c7e1b
                enrollmentRequired:
                  summary: 先绑定验证器
                  value:
                    status: MFA_ENROLLMENT_REQUIRED
                    mfaChallenge: chl_51c0d2e8aa
                    mfaEnrollment:
                      otpauthUri: otpauth://totp/Platform:alice@example.com?secret=KRUGKIDROVUWG2ZAMJZG653OEBTG66BA&issuer=Platform
                      secret: KRUGKIDROVUWG2ZAMJZG653OEBTG66BA
                trusted:
                  summary: 受信浏览器，已建会话
                  value:
                    status: ESTABLISHED
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304002
        - 306001
        - 306010
        - 966001
  /auth/sessions/mfa:
    post:
      tags:
        - sessions
      operationId: completeMfaChallenge
      summary: 动态码步（含首次绑定验证器；通过即建会话）
      description: |
        提交 `login` 或 `pollWechatLogin` 给出的 `mfaChallenge` 与验证器上的 6 位码，通过即建会话，`status` 恒为 `ESTABLISHED`。挑战是首次绑定时，码对即完成绑定。

        勾选 `trustBrowser` 时本浏览器同时成为受信浏览器：有效期内在本浏览器登录免动态码，其余校验照常。本人改密、被重置密码、被重置验证器时，该账号的受信浏览器全部失效。

        **什么时候拒绝**：

        - `306001` 动态码错，留在动态码步重输（同一 `mfaChallenge` 仍可用）。
        - `306002` 挑战已过期、已用或已作废，回登录页第一步重新登录。
        - `966001` 账号因连续登录失败被锁。

        不挂幂等键（认证类）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaStepRequest'
            example:
              mfaChallenge: chl_9f2a4c7e1b
              code: '123456'
              trustBrowser: true
      responses:
        '200':
          description: 校验通过，已 set-cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                status: ESTABLISHED
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306001
        - 306002
        - 966001
  /auth/sessions/wechat:
    post:
      tags:
        - sessions
      operationId: initiateWechatLogin
      summary: 企业微信扫码登录 — 发起（返回二维码内容与轮询票据）
      description: 发起企业微信扫码登录，返回二维码内容与轮询票据。只认已绑定企业微信的后台用户。
      security: []
      responses:
        '200':
          description: 二维码票据（用 `qrTicket` 轮询 `pollWechatLogin`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatQrChallenge'
              example:
                qrTicket: wxq_3f8a1c0d92b47e5f1a
                qrContent: https://wechat.example.com/identity/wechat/v1/wechat/challenges/8f3Kd0pQzR2vLxA7nB1cYw
                expiresAt: '2026-10-16T14:10:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /auth/sessions/wechat/{qrTicket}:
    get:
      tags:
        - sessions
      operationId: pollWechatLogin
      summary: 企业微信扫码登录 — 轮询（确认后进动态码步）
      description: |
        轮询扫码登录结果，恒返回 `200`。扫码后先检查能否登录，不通过的在企业微信里直接告知扫码人原因、不出确认按钮；确认后再过动态码步（受信浏览器免动态码）：

        - `WAITING`：二维码还没被扫，继续轮询。扫码人那边临时出错、提示稍后再试时也回到它，同一张二维码可以直接重扫。
        - `SCANNED`：已扫码、等用户在手机上确认，继续轮询；页面显示「扫码成功，请在手机上确认」。扫码后检查未通过也表现为它，不返回原因，直到二维码过期。
        - `EXPIRED`：终态，重新发起。含二维码过期、票据非法、扫码人在企业微信里取消。
        - `REJECTED`：终态，登录失败（确认后访问资格已失效）；提示与密码登录失败相同的文案，重新发起。
        - `MFA_REQUIRED` / `MFA_ENROLLMENT_REQUIRED`：确认成功，去动态码步，形状与处理同 `login` 的同名状态；动态码步完成前再轮询，返回同一个 `mfaChallenge`。
        - `ESTABLISHED`：本浏览器受信，免动态码，已 set-cookie。

        未知值按 `WAITING` 处理。
      security: []
      parameters:
        - name: qrTicket
          in: path
          required: true
          description: '`initiateWechatLogin` 返回的票据。'
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 轮询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatLoginPollResult'
              examples:
                waiting:
                  summary: 等待扫码
                  value:
                    status: WAITING
                scanned:
                  summary: 已扫码，等手机上确认
                  value:
                    status: SCANNED
                mfaRequired:
                  summary: 已确认，去动态码步
                  value:
                    status: MFA_REQUIRED
                    mfaChallenge: chl_77a0e3b9c1
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /auth/sessions/current:
    get:
      tags:
        - sessions
      operationId: getCurrentSession
      x-required-privilege: session
      summary: 当前会话（身份摘要 + 可见权限点）
      description: |
        受保护页面的会话校验入口，返回身份摘要与可见权限点集合；会话无效返回 `401`。

        权限点集合每次按最新的角色求值：角色、角色点集或资源目录被改后，下一次调用即反映。导航、入口、按钮与只读态一律按 `privileges` 判，不要按角色名判。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              example:
                userId: usr_a91
                loginId: alice@example.com
                displayName: Alice Ops
                privileges:
                  - opacc:user:view
                  - opacc:user:manage
                  - rbac:role:view
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    delete:
      tags:
        - sessions
      operationId: logout
      x-required-privilege: session
      summary: 登出（结束当前会话）
      description: 只结束当前会话（cookie 已清除）；同一账号的其他会话与本浏览器的受信状态不受影响。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已登出（cookie 已清除）
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /auth/password-resets:
    post:
      tags:
        - password-resets
      operationId: requestPasswordReset
      summary: 找回密码 — 发起（恒 202，不暴露账号是否存在）
      description: |
        按 `loginId` 的形态选验证方式：

        - 是合法邮箱格式的按邮箱账号：账号存在则往该邮箱发 6 位验证码。
        - 否则按用户名账号：用验证器里的 6 位码，不发邮件。

        恒返 `202`，账号存在与否响应一致。重发 = 冷却结束后再调本接口，得到新 `challengeId`，旧码作废。`429` 为端点 / IP 级限流。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - loginId
              properties:
                loginId:
                  $ref: '#/components/schemas/LoginId'
                  description: 邮箱或用户名
            example:
              loginId: alice@example.com
      responses:
        '202':
          description: 已受理（账号存在与否响应一致）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetChallenge'
              example:
                challengeId: pwr_4e1a8c9b2d
                cooldownSeconds: 60
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /auth/password-resets/{challengeId}/confirmation:
    post:
      tags:
        - password-resets
      operationId: confirmPasswordReset
      summary: 找回密码 — 验证码 + 新密码一次提交
      description: |
        验证码与新密码一次提交：码正确才改密，该账号全平台会话失效、受信浏览器全部失效，本人登录邮箱收到密码已修改通知（用户名账号不发）。只改密码、不改验证器绑定，下次登录仍要过动态码步。

        不挂幂等键（挑战类）。挑战已被消费后再提交返回 `306002`。

        **什么时候拒绝**：

        - `304001` 验证码错，次数未超限，可重输（新密码无需重填）。
        - `306002` 挑战已过期、已作废或已被消费，须重新发起。
        - `306003` 错码次数超限，挑战作废，须重新发起。
        - 新密码不满足密码规则 → `400`。
      security: []
      parameters:
        - name: challengeId
          in: path
          required: true
          description: '`requestPasswordReset` 返回的挑战 id'
          schema:
            $ref: '#/components/schemas/ChallengeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
                - newPassword
              properties:
                code:
                  $ref: '#/components/schemas/OtpCode'
                newPassword:
                  $ref: '#/components/schemas/NewPassword'
            example:
              code: '123456'
              newPassword: N3w!Str0ngPass
      responses:
        '204':
          description: 已重置；该账号全部会话失效
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304001
        - 306002
        - 306003
  /auth/invitation:
    post:
      tags:
        - invitation
      operationId: acceptInvitation
      summary: 受邀设密（邀请链接落地页提交；不建会话）
      description: |
        校验邀请链接里的一次性令牌，写入登录密码并激活账号，登录邮箱同时标为已验证。不建会话：设密成功后回登录页，用新密码登录，首次登录内绑定验证器。

        邀请链接形如 `/invite/set-password#token=…&email=…`：页面从地址的 fragment 取令牌和被邀请的邮箱，邮箱只供页面展示，提交以令牌为准。令牌只在设密成功时消费，之前失败的可用同一令牌重试。

        **什么时候拒绝**：

        - `306005` 令牌无效或已过期（含被重发作废），请管理员重发邀请。
        - `306006` 令牌已用过、账号已激活，去登录页登录；本次提交的新密码未生效。
        - 新密码不满足密码规则 → `400`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  minLength: 1
                  description: 邀请链接里的一次性令牌
                newPassword:
                  $ref: '#/components/schemas/NewPassword'
            example:
              token: itok_5d4e1f2a3b
              newPassword: Str0ng!Pass
      responses:
        '204':
          description: 已激活，不建会话
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306005
        - 306006
  /auth/email-confirmation:
    post:
      tags:
        - email-confirmation
      operationId: confirmLoginEmailChange
      summary: 确认新登录邮箱（邮件链接落地页提交；不建会话）
      description: |
        管理员改了已激活账号的登录邮箱后，新邮箱收到确认链接；当事人在落地页主动提交后才切换为新邮箱，确认前旧邮箱仍可登录、新邮箱不可登录。令牌一次性，打开页面不消费。切换不影响已有会话。

        链接形如 `/confirm-login-email#token=…`：页面从地址的 fragment 取令牌，提交时放请求体。

        **什么时候拒绝**：

        - `306002` 链接无效、已过期或已被新的一次改动顶掉。
        - `968001` 确认前新邮箱已被别的账号使用，这次改动作废，请管理员换一个邮箱重改。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - token
              properties:
                token:
                  type: string
                  minLength: 1
                  description: 邮件链接里的一次性令牌
            example:
              token: etok_7c2d9e4f1a
      responses:
        '204':
          description: 登录邮箱已切换为新邮箱
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306002
        - 968001
  /me:
    get:
      tags:
        - me
      operationId: getMyProfile
      x-required-privilege: session
      summary: 读本人资料与安全设置
      description: |
        个人设置页的全部读数：资料、所持角色、验证器与企业微信绑定状态、本人登录 IP 白名单，以及本次请求的来源 IP（保存白名单时须包含它）。

        响应里没有密码与验证器密钥，任何接口都不返回这两项。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyProfile'
              example:
                userId: usr_a91
                loginId: alice@example.com
                displayName: Alice Ops
                firstName: Alice
                lastName: Wong
                phone: '+16045550123'
                jobTitle: 运营主管
                roleNames:
                  - 运营
                mfaEnrolled: true
                wechat:
                  nickname: Alice
                loginIpAllowlist:
                  - 203.0.113.0/24
                currentIp: 203.0.113.10
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - me
      operationId: updateMyProfile
      x-required-privilege: session
      summary: 改本人资料（显示名、姓名、电话、职务）
      description: |
        只提交要改的，直接生效。只认资料字段：请求体里的其他字段（角色、数据范围、账号状态、登录邮箱等）一律忽略，不生效、不报错。

        幂等基准：天然幂等，不挂 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MyProfileUpdate'
            example:
              displayName: Alice W.
              jobTitle: 运营经理
      responses:
        '204':
          description: 已更新
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /me/login-ip-allowlist:
    put:
      tags:
        - me
      operationId: updateMyLoginIpAllowlist
      x-required-privilege: session
      summary: 保存本人登录 IP 白名单（整组置换）
      description: |
        **全量覆盖**：请求体就是白名单本身，缺省不代表保持原样；传空数组 = 不限来源 IP。从下一次登录起生效，密码与企业微信两种登录都判，当前会话不受影响。

        非空时必须包含本次请求的来源 IP（`getMyProfile` 的 `currentIp`），否则保存后会把自己挡在登录之外。

        **什么时候拒绝**：

        - `304003` 白名单非空却不含本次来源 IP；白名单不变。
        - 某项不是 IPv4 地址或 CIDR、掩码越界、总长超限 → `400`，`details` 定位到该项；白名单不变。

        幂等基准：置值写，天然幂等，不挂 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginIpAllowlistWrite'
            example:
              entries:
                - 203.0.113.0/24
                - 198.51.100.7
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304003
  /me/security/password:
    put:
      tags:
        - security
      operationId: changeMyPassword
      x-required-privilege: session
      summary: 改密（用当前密码校验；其他会话失效、当前保留）
      description: |
        用当前密码校验后改为新密码，新旧不能相同。改密后本人其他会话失效、当前会话保留，本人的受信浏览器全部失效，本人登录邮箱收到密码已修改通知。

        幂等基准：`Idempotency-Key`。同键同请求体重发返回 `204`；同键改请求体返回 `409`·`908003`；首次请求仍在处理 → `409`·`908002`，稍后同键同请求体重发。

        **什么时候拒绝**：

        - `306004` 当前密码错（会话仍有效，不计入登录锁定）。
        - 新密码不满足密码规则，或与当前密码相同 → `400`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                  minLength: 1
                newPassword:
                  $ref: '#/components/schemas/NewPassword'
            example:
              currentPassword: Str0ng!Pass
              newPassword: N3w!Str0ngPass
      responses:
        '204':
          description: 改密成功（其他会话已失效，当前会话保留）
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306004
  /me/security/mfa:
    post:
      tags:
        - security
      operationId: enrollMfa
      x-required-privilege: session
      summary: 重绑验证器第 1 步（输当前密码，换发新密钥）
      description: |
        校验当前密码后作废原验证器绑定，生成新密钥，返回二维码内容与手输密钥；再调 `confirmMfa` 提交新验证器上的一次动态码完成重绑。

        原绑定在本步即失效，本人的受信浏览器全部失效：完成第 2 步之前，本人的新登录会在登录内被要求绑定验证器；当前会话不受影响。重新调用会换发新密钥、覆盖上一份未确认的。

        不挂幂等键（响应含密钥，重试即重新生成）。

        **什么时候拒绝**：

        - `306004` 当前密码错，原绑定不变。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - currentPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                  minLength: 1
            example:
              currentPassword: Str0ng!Pass
      responses:
        '200':
          description: 新验证器的密钥，待确认
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaEnrollment'
              example:
                otpauthUri: otpauth://totp/Platform:alice@example.com?secret=KRUGKIDROVUWG2ZAMJZG653OEBTG66BA&issuer=Platform
                secret: KRUGKIDROVUWG2ZAMJZG653OEBTG66BA
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306004
  /me/security/mfa/confirmation:
    post:
      tags:
        - security
      operationId: confirmMfa
      x-required-privilege: session
      summary: 重绑验证器第 2 步（输新验证器上的动态码，生效）
      description: |
        提交新验证器上的一次 6 位动态码，码对即完成重绑，下次登录起用新验证器。

        **什么时候拒绝**：

        - `306004` 动态码错，原处重输。
        - `306002` 没有待确认的密钥（未做第 1 步或已确认过），从第 1 步重新开始。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpCodeSubmission'
            example:
              code: '123456'
      responses:
        '204':
          description: 已完成重绑
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306002
        - 306004
  /me/wechat:
    post:
      tags:
        - wechat
      operationId: initiateMyWechatBinding
      x-required-privilege: session
      summary: 绑定企业微信 — 发起（返回二维码）
      description: |
        为当前登录的本人发起企业微信绑定，返回二维码内容与轮询票据；用企业微信扫码并确认后即绑定到本人，此后可扫码登录。绑定对象只能是本人。

        **什么时候拒绝**：

        - `968003` 本人已绑定企业微信，先解绑再绑定。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 二维码票据（用 `qrTicket` 轮询 `pollMyWechatBinding`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatQrChallenge'
              example:
                qrTicket: wxb_6c1e0a9d72f4
                qrContent: https://wechat.example.com/identity/wechat/v1/wechat/challenges/Zq8Lw3nR0pXa1cVb7yTe
                expiresAt: '2026-10-16T14:10:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 968003
    delete:
      tags:
        - wechat
      operationId: deleteMyWechatBinding
      x-required-privilege: session
      summary: 解绑企业微信
      description: 解除本人的企业微信绑定，此后不能扫码登录；已有会话不受影响。本无绑定同样返回 `204`。天然幂等，不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已解绑
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /me/wechat/{qrTicket}:
    get:
      tags:
        - wechat
      operationId: pollMyWechatBinding
      x-required-privilege: session
      summary: 绑定企业微信 — 轮询结果
      description: 轮询绑定结果，恒返回 `200`：`WAITING` 继续轮询，`BOUND` 已绑定（重读 `getMyProfile` 刷新），`EXPIRED` 重新发起。该企业微信已绑定其他账号时，原因只在扫码人的企业微信里说明，本接口一直 `WAITING` 到过期。
      parameters:
        - name: qrTicket
          in: path
          required: true
          description: '`initiateMyWechatBinding` 返回的票据。'
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 轮询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatBindingPollResult'
              example:
                status: BOUND
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  schemas:
    NewPassword:
      type: string
      format: password
      minLength: 8
      description: 新密码。密码规则：≥ 8 字符，含大写、小写、数字、特殊字符；下限 8 = 其中的长度那条，其余四条由前端校验并提示具体未满足项，服务端兜底拒绝（`400`）。
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - loginId
        - password
      properties:
        loginId:
          $ref: '#/components/schemas/LoginId'
          description: 登录名（邮箱或用户名，单个输入框；不分大小写）
        password:
          type: string
          format: password
          minLength: 1
        captcha:
          $ref: '#/components/schemas/CaptchaResult'
          description: 人机校验结果。人机校验开启时必带，没带或未通过 → `304002`；登录页始终展示人机校验并带上结果即可。
    CaptchaResult:
      type: object
      additionalProperties: false
      description: 登录页人机校验组件通过后给出的结果，原样提交。
      required:
        - ticket
        - randstr
      properties:
        ticket:
          type: string
          minLength: 1
          maxLength: 2048
          description: 校验通过的票据
        randstr:
          type: string
          minLength: 1
          maxLength: 128
          description: 与票据配对的随机串
    MfaStepRequest:
      type: object
      additionalProperties: false
      description: 动态码步：挑战句柄 + 验证器上的 6 位码，可选信任本浏览器。
      required:
        - mfaChallenge
        - code
      properties:
        mfaChallenge:
          type: string
          minLength: 1
          description: '`login` 或 `pollWechatLogin` 给出的挑战句柄。'
        code:
          $ref: '#/components/schemas/OtpCode'
        trustBrowser:
          type: boolean
          default: false
          description: 勾选「信任本浏览器」：有效期内在本浏览器登录免动态码。有效期由平台设定。
    LoginResult:
      type: object
      additionalProperties: false
      description: |
        登录结果：

        - `ESTABLISHED`：已 set-cookie 建会话。
        - `MFA_REQUIRED`：去动态码步，带 `mfaChallenge`。
        - `MFA_ENROLLMENT_REQUIRED`：先绑定验证器，带 `mfaChallenge` 与 `mfaEnrollment`。

        `completeMfaChallenge` 的响应恒为 `ESTABLISHED`。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ESTABLISHED
            - MFA_REQUIRED
            - MFA_ENROLLMENT_REQUIRED
          readOnly: true
        mfaChallenge:
          type: string
          minLength: 1
          readOnly: true
          description: 仅 `MFA_REQUIRED` / `MFA_ENROLLMENT_REQUIRED` 时返回：一次性挑战句柄，提交到 `completeMfaChallenge`。
        mfaEnrollment:
          $ref: '#/components/schemas/MfaEnrollment'
          readOnly: true
          description: 仅 `MFA_ENROLLMENT_REQUIRED` 时返回：待绑定的验证器密钥，据 `otpauthUri` 渲染二维码，或让用户手输 `secret`。
    WechatLoginPollResult:
      type: object
      additionalProperties: false
      description: 企业微信扫码登录的轮询结果；各状态含义见 `pollWechatLogin`。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - WAITING
            - SCANNED
            - EXPIRED
            - REJECTED
            - MFA_REQUIRED
            - MFA_ENROLLMENT_REQUIRED
            - ESTABLISHED
          readOnly: true
          description: 未列出的取值按 `WAITING` 处理，继续轮询。
        mfaChallenge:
          type: string
          minLength: 1
          readOnly: true
          description: 仅 `MFA_REQUIRED` / `MFA_ENROLLMENT_REQUIRED` 时返回，提交到 `completeMfaChallenge`。
        mfaEnrollment:
          $ref: '#/components/schemas/MfaEnrollment'
          readOnly: true
          description: 仅 `MFA_ENROLLMENT_REQUIRED` 时返回：待绑定的验证器密钥。
    PasswordResetChallenge:
      type: object
      additionalProperties: false
      required:
        - challengeId
        - cooldownSeconds
      properties:
        challengeId:
          $ref: '#/components/schemas/ChallengeId'
          description: 挑战 id；提交到 `confirmPasswordReset`。账号不存在时同样返回（不暴露存在性）。
        cooldownSeconds:
          type: integer
          minimum: 0
          description: 重发验证码的冷却秒数（部署可配）；从收到响应时刻本地倒计时。账号存在与否都返同一值。
    AdminSession:
      type: object
      additionalProperties: false
      description: 当前会话：身份摘要 + 可见权限点集合。
      required:
        - userId
        - loginId
        - displayName
        - privileges
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
          readOnly: true
        loginId:
          $ref: '#/components/schemas/LoginId'
          readOnly: true
          description: 登录名：有邮箱时返回邮箱，否则返回用户名。
        displayName:
          type: string
          minLength: 1
          readOnly: true
        privileges:
          type: array
          readOnly: true
          description: |
            当前登录者的可见权限点集合，已按其全部角色求值、取并集，没权限的点不在里面。

            页面级与操作级共用本集合：有某个点，就既能看见对应的页面或入口，也能调对应的接口。
          items:
            type: string
            description: 权限点 `模块:资源:动作`。取值集合随角色配置而定，不要写死成 enum；未识别的点忽略。
            examples:
              - opacc:user:view
    MyProfile:
      type: object
      additionalProperties: false
      description: 本人资料与安全设置。
      required:
        - userId
        - loginId
        - displayName
        - roleNames
        - mfaEnrolled
        - loginIpAllowlist
        - currentIp
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
          readOnly: true
        loginId:
          $ref: '#/components/schemas/LoginId'
          readOnly: true
          description: 登录名，本人只读；登录邮箱由管理员在后台账号里改。
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        firstName:
          type: string
          minLength: 1
          maxLength: 128
          description: 名；没填过不返回本键。
        lastName:
          type: string
          minLength: 1
          maxLength: 128
          description: 姓；没填过不返回本键。
        phone:
          $ref: '#/components/schemas/Phone'
          description: 电话；没填过不返回本键。
        jobTitle:
          type: string
          minLength: 1
          maxLength: 64
          description: 职务；没填过不返回本键。
        roleNames:
          type: array
          readOnly: true
          description: 本人所持角色的展示名（只读，角色由管理员分配）。
          items:
            type: string
            minLength: 1
        mfaEnrolled:
          type: boolean
          readOnly: true
          description: 验证器是否已绑定。重绑第 1 步之后、第 2 步之前为 `false`。
        wechat:
          $ref: '#/components/schemas/WechatBindingSummary'
          readOnly: true
          description: 已绑定的企业微信；未绑定不返回本键。
        loginIpAllowlist:
          $ref: '#/components/schemas/LoginIpAllowlist'
          readOnly: true
          description: 本人登录 IP 白名单；空数组 = 不限。改走 `updateMyLoginIpAllowlist`。
        currentIp:
          type: string
          minLength: 1
          maxLength: 45
          readOnly: true
          description: 本次请求的来源 IP，供白名单编辑时提示「当前 IP」。
    MyProfileUpdate:
      type: object
      minProperties: 1
      description: 本人可改的资料，只传要改的；能清空的字段传 `null` 即清空。资料以外的字段忽略。
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        firstName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 128
        lastName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 128
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        jobTitle:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
    LoginIpAllowlistWrite:
      type: object
      additionalProperties: false
      required:
        - entries
      properties:
        entries:
          $ref: '#/components/schemas/LoginIpAllowlist'
    LoginId:
      type: string
      minLength: 1
      maxLength: 254
      description: 登录名：用户名或邮箱。新建或修改登录名时：符合邮箱格式的按邮箱处理；其余为用户名，须为去首尾空白后 1–64 个字符、不含空白与 `@`，比较不区分大小写、按输入的大小写保存。登录时按已保存的登录名匹配，不套这条形状规则（早期账号的用户名可能不满足它）。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    MfaEnrollment:
      type: object
      required:
        - otpauthUri
        - secret
      description: 待激活的 MFA 密钥：provisioning URI 与手工录入密钥两种表示，二者同值。
      properties:
        otpauthUri:
          type: string
          pattern: ^otpauth://totp/
          description: TOTP provisioning URI（Key Uri Format），据此渲染二维码供 Authenticator 扫描；其 `secret` 参数即下方 `secret` 字段。
        secret:
          type: string
          pattern: ^[A-Z2-7]{32}$
          description: 手工录入用的密钥（Authenticator 里的 setup key）。固定 160 bit，Base32 大写、不带补位与分组空格，恒为 32 字符；展示时要不要分组由消费面定；与 `otpauthUri` 的 `secret` 参数同值，消费面不要解析那串 URI 取值。
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
    WechatQrContent:
      type: string
      description: |
        微信二维码的**待编码内容**（短时、不透明串）——前端据此**自行渲染二维码图片**。 **不是图片 URL**，不要当 `<img src>` 用；内容对前端不透明，不要解析、拼接或复用。 各扫码入口（扫码登录与各类扫码绑定）共用同一形状与渲染方式。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    WechatQrChallenge:
      type: object
      additionalProperties: false
      description: |
        微信扫码类入口「发起」的统一响应：客户端用 `qrContent` 渲染二维码，再拿 `qrTicket` 轮询该入口的结果端点。

        各入口的轮询状态用同一套词，见 `WechatPollStatus`。
      required:
        - qrTicket
        - qrContent
        - expiresAt
      properties:
        qrTicket:
          type: string
          description: 本次扫码的短时票据，只用于轮询结果，可重复轮询；过期后重新发起得到新票据。与 `qrContent` 不可互推
        qrContent:
          $ref: '#/components/schemas/WechatQrContent'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            二维码有效期截止。**到期只表示这张二维码不能再扫**，**不必然**表示本次交互已有定论—— 到期后结果是否还可能变化，**各入口不同、由各入口的轮询状态说明，不由本字段推断**。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    ChallengeId:
      type: string
      minLength: 1
      maxLength: 32
      description: 一次性验证挑战的标识。
    Phone:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      maxLength: 16
      description: 电话号码，**国际格式整串**（`+` + 国家码 + 正文号，如 `+16045550123`）——**一个字段装完，没有独立的区号字段**。 上界 16 = `+` 加最多 15 位数字（国际号码总长上限）；**服务端只校验这一条通用规则 + 区号在白名单内**， **不按区号分别限长**。前端按所选区号收窄输入位数属输入体验、不是契约约束。 渲染「区号下拉 + 号码框」两个控件时，用前端参考数据里的区号表做**最长前缀匹配**拆分本串。
    WechatBindingSummary:
      type: object
      additionalProperties: false
      description: 微信登录绑定的摘要。
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          description: 绑定微信的昵称展示快照（拿不到昵称时为通用展示名，故恒非空；微信用户授权微信资料后会更新）。
    LoginIpAllowlist:
      type: array
      maxItems: 64
      description: |
        登录 IP 白名单：每项是一个 IPv4 地址或 CIDR（如 `10.0.0.8`、`10.0.0.0/24`）；空数组 = 不限来源 IP。

        各项以英文逗号连接后总长不超过 512 字符（超出 → `400`）。条数上限 64 = 512 字符按最短一项 `1.1.1.1` 加分隔逗号 8 字符推得。顺序即展示顺序；重复项保存时合并。
      items:
        type: string
        pattern: ^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}(/(3[0-2]|[12]?[0-9]))?$
        examples:
          - 10.0.0.0/24
    OtpCodeSubmission:
      type: object
      additionalProperties: false
      description: 只提交一个一次性验证码。
      required:
        - code
      properties:
        code:
          $ref: '#/components/schemas/OtpCode'
          description: 6 位验证码；收哪一种码（邮箱码、验证器码）见各接口。
    WechatPollStatus:
      type: string
      description: |
        微信扫码轮询（扫码登录与各类扫码绑定）共用的状态词：`WAITING` 继续轮询、`EXPIRED` 终态需重新发起、各入口一个成功态（登录 `ESTABLISHED` / 绑定 `BOUND`）。各入口实际取值见各自 `enum`。

        未列出的取值按仍在进行中处理，继续轮询。

        状态查询恒返回 `200` + 状态：票据不存在 / 非法 / 已过期一律归为 `EXPIRED`，不用 `4xx` 表达；
        `4xx` 只表示调用方自身问题（未登录 / 无权限 / 请求过频 / 会话上下文已变 / 本浏览器已登录（登录轮询））。
    WechatBindingPollResult:
      type: object
      description: 微信扫码绑定类入口轮询的统一响应。
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/WechatPollStatus'
          enum:
            - WAITING
            - BOUND
            - EXPIRED
          readOnly: true
          description: '`WAITING` = 继续轮询；`BOUND` = 用户已在微信内确认、绑定已生效（绑定生效后在哪里呈现见各入口）；`EXPIRED` 是终态，需重新发起（含二维码过期、票据非法）。未知值按 `WAITING` 继续轮询。'
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
