      x-required-privilege: risk:merchant-blocklist:manage
      summary: 把商户加入禁入名单（冻结或设为高风险之后）
      description: |
        页面在冻结（`updateMerchantStatus`）或治理档位设「高风险」（`updateMerchantSettlementControls`）成功之后、确认框勾选了「同时加入禁入名单」时调用。本接口失败不影响已改的商户状态，页面提示「已冻结（或已设为高风险），但加入禁入名单失败」，可重试或到名单页手工新增。没有本接口的权限时，确认框不显示该勾选项。

        以该商户此刻的资料生成一个生效名单项：名称取经营名称，没有则取法定名；原因 = 请求所给（冻结 / 高风险）；来源记为商户冻结或设为高风险时生成、来源商户为该商户；标识取商户码（含别名商户码）、法定名、经营名称、注册号、Owner 姓名、Owner 邮箱、Owner 电话、营业电话里有值的项（经营名称按法定名类），不生成邮箱域名。

        该商户已有来源于它的生效名单项时不重复生成，返回既有项（`200`，`created = false`）。

        幂等基准：`Idempotency-Key`。同键重复提交返回首次结果；换键重试也因上一条返回既有项。

        **什么时候拒绝**：

        - 商户不存在或在本人数据范围外 → `404`。
        - `reasonCategory` 不是 `FROZEN` / `HIGH_RISK` → `400`。

