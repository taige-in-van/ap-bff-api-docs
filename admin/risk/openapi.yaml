components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  parameters:
    PayerBlocklistEntryIdPath:
      name: entryId
      in: path
      required: true
      description: 付款人黑名单项标识。名单项不存在 → `404`。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    MerchantBlocklistEntryIdPath:
      name: entryId
      in: path
      required: true
      description: 禁入名单项标识。名单项不存在 → `404`。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    FromDate:
      name: from
      in: query
      required: true
      description: 起始日期（含当日），按建单日期。与 `to` 同为必填；跨度超过允许的最大查询窗口 → `400`。
      schema:
        $ref: '#/components/schemas/LocalDate'
    ToDate:
      name: to
      in: query
      required: true
      description: 截止日期（含当日；与 `from` 成对必填）。
      schema:
        $ref: '#/components/schemas/LocalDate'
    RejectedOrderIdFilter:
      name: orderId
      in: query
      required: false
      description: 按被拒订单的平台订单号精确匹配。
      schema:
        $ref: '#/components/schemas/OrderId'
    MerchantFilter:
      name: merchantId
      in: query
      required: false
      description: 只看这个商户。商户在本人数据范围外时结果为空。
      schema:
        $ref: '#/components/schemas/MerchantId'
    RejectionReasonFilter:
      name: rejectionReason
      in: query
      required: false
      description: 按拒绝原因。
      schema:
        $ref: '#/components/schemas/RejectionReason'
    PayerIdentifierFilter:
      name: payerIdentifier
      in: query
      required: false
      description: 按付款人标识精确匹配：订单上的付款人通道侧标识，或被命中名单项的值（被命中的是邮箱类名单项时不分大小写）。
      schema:
        type: string
        minLength: 1
        maxLength: 256
    BuyerEmailFilter:
      name: buyerEmail
      in: query
      required: false
      description: 按买家邮箱精确匹配、不分大小写：只对被命中的邮箱类名单项。
      schema:
        type: string
        format: email
        minLength: 3
        maxLength: 254
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
  schemas:
    RiskMerchantRef:
      type: object
      additionalProperties: false
      description: 一个商户的标识、商户码与经营名称。
      required:
        - merchantId
        - merchantCode
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        tradeName:
          type: string
          minLength: 1
          description: 经营名称；商户没有经营名称时不返回本键。
    PayerBlocklistIdentifierType:
      type: string
      enum:
        - WECHAT
        - ALIPAY
        - EMAIL
        - MERCHANT_CUSTOMER
      description: 付款人标识类型：`WECHAT` 微信 openid / `ALIPAY` 支付宝付款人标识 / `EMAIL` 买家邮箱 / `MERCHANT_CUSTOMER` 商户客户号。
    PayerBlocklistEntryStatus:
      type: string
      enum:
        - ACTIVE
        - REMOVED
      description: '`ACTIVE` 在用 / `REMOVED` 已移除（不再命中，记录留存）。'
    PayerBlocklistEntryCreate:
      type: object
      additionalProperties: false
      required:
        - identifierType
        - identifierValue
        - blockReason
      properties:
        identifierType:
          $ref: '#/components/schemas/PayerBlocklistIdentifierType'
        identifierScope:
          type: string
          minLength: 1
          maxLength: 64
          description: 标识的范围：`WECHAT` / `ALIPAY` 必填，为该标识所属的 appid；`MERCHANT_CUSTOMER` 必填，为所选商户的 `merchantId`；`EMAIL` 不得带。
        identifierValue:
          type: string
          minLength: 1
          maxLength: 254
          description: 标识值：邮箱 1–254 且须为邮箱格式（去首尾空白、转小写后存），微信与支付宝 1–128，商户客户号 1–100，按类型校验。
        blockReason:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^.*\S.*$
          description: 拉黑原因，不能为空白。
    PayerBlocklistEntry:
      type: object
      additionalProperties: false
      description: 一个付款人黑名单项。
      required:
        - entryId
        - identifierType
        - identifierValue
        - status
        - createdAt
      properties:
        entryId:
          type: string
          minLength: 1
          description: 名单项标识。
        identifierType:
          $ref: '#/components/schemas/PayerBlocklistIdentifierType'
        identifierScope:
          type: string
          minLength: 1
          description: 标识的范围：appid，或商户客户号所属商户的 `merchantId`；邮箱不返回本键。
        scopeMerchant:
          allOf:
            - $ref: '#/components/schemas/RiskMerchantRef'
          description: 商户客户号所属的商户；不是商户客户号或该商户已删除时不返回本键。
        identifierValue:
          type: string
          minLength: 1
          description: 标识值（邮箱已转小写）。
        blockReason:
          type: string
          minLength: 1
          description: 拉黑原因；早期迁入的项可能没有，此时不返回本键。
        status:
          $ref: '#/components/schemas/PayerBlocklistEntryStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: 最初加入的时刻（恢复不改）。
        createdBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 加入人；迁入的项没有时不返回本键。
        removedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 移除时刻；在用时不返回本键。
        removedBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 移除人；在用时不返回本键。
    PayerBlocklistEntryCreated:
      type: object
      additionalProperties: false
      required:
        - entry
        - restored
      properties:
        entry:
          $ref: '#/components/schemas/PayerBlocklistEntry'
        restored:
          type: boolean
          description: '`true` = 恢复了已移除的原项（仍是同一名单项）；`false` = 新建。'
    RejectionReason:
      type: string
      enum:
        - ORDER_AMOUNT_CEILING
        - PAYER_BLOCKED
      description: 拒绝原因：`ORDER_AMOUNT_CEILING` 超单笔上限 / `PAYER_BLOCKED` 付款人在黑名单。
    CeilingScopeType:
      type: string
      enum:
        - PLATFORM
        - PAYMENT_METHOD
        - MERCHANT
      description: 被突破的单笔上限所在层：`PLATFORM` 平台层 / `PAYMENT_METHOD` 支付方式层 / `MERCHANT` 商户层。
    RejectedOrderCeiling:
      type: object
      additionalProperties: false
      description: 超单笔上限时被突破的层、该层被拒当时的上限与当时参与比较的金额（都是结算币种）。
      required:
        - scopeType
        - ceilingAmount
        - comparedAmount
      properties:
        scopeType:
          $ref: '#/components/schemas/CeilingScopeType'
        ceilingAmount:
          $ref: '#/components/schemas/Money'
        comparedAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 付款人应付总额折到结算币种后的值。
    MatchedPayerBlocklistEntry:
      type: object
      additionalProperties: false
      description: 付款人在黑名单时被命中的名单项；`status` 是该项当前的状态。
      required:
        - entryId
        - identifierType
        - identifierValue
        - status
      properties:
        entryId:
          type: string
          minLength: 1
          description: 名单项标识。
        identifierType:
          $ref: '#/components/schemas/PayerBlocklistIdentifierType'
        identifierScope:
          type: string
          minLength: 1
          description: 标识的范围；邮箱不返回本键。
        identifierValue:
          type: string
          minLength: 1
        blockReason:
          type: string
          minLength: 1
          description: 拉黑原因；没有时不返回本键。
        status:
          $ref: '#/components/schemas/PayerBlocklistEntryStatus'
    RejectedOrderCore:
      type: object
      x-parent: true
      description: 被拒订单的列表字段。
      required:
        - orderId
        - merchant
        - customerPaymentAmount
        - rejectionReason
        - createdAt
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        merchant:
          $ref: '#/components/schemas/RiskMerchantRef'
        customerPaymentAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 付款人应付总额，标价币种。
        rejectionReason:
          $ref: '#/components/schemas/RejectionReason'
        ceiling:
          allOf:
            - $ref: '#/components/schemas/RejectedOrderCeiling'
          description: 超单笔上限时返回；付款人在黑名单时不返回本键。
        matchedPayerBlocklistEntry:
          allOf:
            - $ref: '#/components/schemas/MatchedPayerBlocklistEntry'
          description: 付款人在黑名单时返回；超单笔上限时不返回本键。
        bdUser:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 商户当前的归属销售；无归属时不返回本键。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: 建单（被拒）时刻。
    RejectedOrder:
      description: 被拒订单列表的一行。
      allOf:
        - $ref: '#/components/schemas/RejectedOrderCore'
      unevaluatedProperties: false
    RejectedOrderDetail:
      description: 被拒订单详情：列表行的字段，加受理与付款人信息。
      allOf:
        - $ref: '#/components/schemas/RejectedOrderCore'
        - type: object
          required:
            - product
            - entryPoint
          properties:
            merchantOrderNo:
              $ref: '#/components/schemas/MerchantOrderNo'
              description: 商户自己的订单号；建单时没传就不返回本键。
            product:
              $ref: '#/components/schemas/PaymentProduct'
            entryPoint:
              $ref: '#/components/schemas/EntryPoint'
            pinnedPaymentMethod:
              $ref: '#/components/schemas/PaymentMethod'
              description: 建单时指定的支付方式；建单时没指定的不返回本键。
            payerChannelUserId:
              type: string
              minLength: 1
              description: 付款人在通道侧的标识（如微信 openid、支付宝 buyer_id）；没有时不返回本键。
            payerAppId:
              type: string
              minLength: 1
              description: 付款人标识所属的应用（微信 / 支付宝 appid）；没有时不返回本键。
            customerIp:
              type: string
              minLength: 1
              description: 付款人 IP；没有时不返回本键。
      unevaluatedProperties: false
    RejectedOrderDailyCount:
      type: object
      additionalProperties: false
      required:
        - date
        - rejectionReason
        - count
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
          description: 建单日期。
        rejectionReason:
          $ref: '#/components/schemas/RejectionReason'
        count:
          type: integer
          minimum: 0
    MerchantBlocklistReason:
      type: string
      enum:
        - HIGH_RISK
        - FROZEN
        - PROHIBITED_RECORD
        - FRAUD
        - OTHER
      description: 禁入原因类别：`HIGH_RISK` 高风险 / `FROZEN` 冻结 / `PROHIBITED_RECORD` 违禁记录 / `FRAUD` 欺诈 / `OTHER` 其他。
    MerchantBlocklistSource:
      type: string
      enum:
        - MANUAL
        - MERCHANT_STATUS
        - MIGRATION
      description: 来源：`MANUAL` 手工录入 / `MERCHANT_STATUS` 商户冻结或设为高风险时生成 / `MIGRATION` 上线初始数据。
    MerchantBlocklistEntryStatus:
      type: string
      enum:
        - ACTIVE
        - LIFTED
      description: '`ACTIVE` 生效 / `LIFTED` 已解除（不再参与比对，记录留存，不能恢复）。'
    MerchantBlocklistIdentifier:
      type: object
      additionalProperties: false
      description: 名单项上的一个标识。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          maxLength: 300
          description: 录入的原值。
    MerchantBlocklistEntryWrite:
      type: object
      additionalProperties: false
      required:
        - subjectName
        - reasonCategory
        - identifiers
      properties:
        subjectName:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^.*\S.*$
          description: 主体名称，不能为空白。
        reasonCategory:
          $ref: '#/components/schemas/MerchantBlocklistReason'
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: 备注；不给即没有备注。
        identifiers:
          type: array
          minItems: 1
          maxItems: 30
          description: 标识，至少一条、至多 30 条；每条按类别检查格式并归一，同类别归一后相同的只留一条。
          items:
            $ref: '#/components/schemas/MerchantBlocklistIdentifier'
    MerchantBlocklistEntrySummary:
      type: object
      additionalProperties: false
      description: 禁入名单列表的一行（只列生效项）。
      required:
        - entryId
        - subjectName
        - reasonCategory
        - createdAt
      properties:
        entryId:
          type: string
          minLength: 1
          description: 名单项标识。
        merchantCode:
          type: string
          minLength: 1
          description: 该项标识里的商户码，没有再取来源商户的商户码；都没有时不返回本键。
        subjectName:
          type: string
          minLength: 1
        reasonCategory:
          $ref: '#/components/schemas/MerchantBlocklistReason'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: 录入时刻。
        createdBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 录入人；上线初始数据没有，此时不返回本键。
    MerchantBlocklistEntry:
      type: object
      additionalProperties: false
      description: 一个禁入名单项。
      required:
        - entryId
        - subjectName
        - reasonCategory
        - source
        - identifiers
        - status
        - createdAt
        - updatedAt
      properties:
        entryId:
          type: string
          minLength: 1
          description: 名单项标识。
        subjectName:
          type: string
          minLength: 1
        reasonCategory:
          $ref: '#/components/schemas/MerchantBlocklistReason'
        note:
          type: string
          minLength: 1
          description: 备注；没有时不返回本键。
        source:
          $ref: '#/components/schemas/MerchantBlocklistSource'
        sourceMerchant:
          allOf:
            - $ref: '#/components/schemas/RiskMerchantRef'
          description: 生成本项的商户；手工录入的，或该商户已删除时不返回本键。
        identifiers:
          type: array
          minItems: 1
          description: 在册标识（被编辑移出的不列）。
          items:
            $ref: '#/components/schemas/MerchantBlocklistIdentifier'
        status:
          $ref: '#/components/schemas/MerchantBlocklistEntryStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: 录入时刻。
        createdBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 录入人；上线初始数据没有，此时不返回本键。
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 最近改动时刻。
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 最近改动人；上线初始数据从未改过时不返回本键。
        liftedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 解除时刻；生效时不返回本键。
        liftedBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 解除人；生效时不返回本键。
        liftReason:
          type: string
          minLength: 1
          description: 解除原因；生效时不返回本键。
    MerchantBlocklistLifting:
      type: object
      additionalProperties: false
      required:
        - liftReason
      properties:
        liftReason:
          type: string
          minLength: 1
          maxLength: 500
          pattern: ^.*\S.*$
          description: 解除原因，不能为空白。
    MerchantBlocklistFromMerchant:
      type: object
      additionalProperties: false
      required:
        - reasonCategory
      properties:
        reasonCategory:
          type: string
          enum:
            - FROZEN
            - HIGH_RISK
          description: 冻结后调用传 `FROZEN`，设为高风险后调用传 `HIGH_RISK`。
    MerchantBlocklistFromMerchantResult:
      type: object
      additionalProperties: false
      required:
        - entry
        - created
      properties:
        entry:
          $ref: '#/components/schemas/MerchantBlocklistEntry'
        created:
          type: boolean
          description: '`true` = 本次新生成；`false` = 该商户已有来源于它的生效名单项，返回的是既有项。'
    PayerId:
      type: string
      minLength: 1
      maxLength: 32
      description: 付款人标识。
    GiftcardCustomerIdentityType:
      type: string
      enum:
        - WECHAT
        - ALIPAY
        - EMAIL
      description: 付款人身份类型：`WECHAT` 微信 / `ALIPAY` 支付宝 / `EMAIL` 邮箱。
    GiftcardCustomerIdentity:
      type: object
      additionalProperties: false
      required:
        - identityType
        - identityValue
      properties:
        identityType:
          $ref: '#/components/schemas/GiftcardCustomerIdentityType'
        appId:
          type: string
          minLength: 1
          description: 身份所属的应用（微信 / 支付宝 appid）；邮箱不返回本键。
        identityValue:
          type: string
          minLength: 1
          description: 身份值：微信 openid、支付宝付款人标识或邮箱（已转小写）。
        nickname:
          type: string
          minLength: 1
          description: 授权时返回的昵称；没有时不返回本键。
    GiftcardCustomerRiskLevel:
      type: string
      enum:
        - NORMAL
        - MEDIUM
        - HIGH
      description: 礼卡客户风险等级：`NORMAL` 正常 / `MEDIUM` 中 / `HIGH` 高。
    GiftcardCustomer:
      type: object
      additionalProperties: false
      description: 一位付款人的礼卡风险资料与白名单标记。
      required:
        - payerId
        - identities
        - riskLevel
        - riskScore
        - whitelisted
      properties:
        payerId:
          $ref: '#/components/schemas/PayerId'
        identities:
          type: array
          minItems: 1
          description: 该付款人的全部身份。
          items:
            $ref: '#/components/schemas/GiftcardCustomerIdentity'
        riskLevel:
          $ref: '#/components/schemas/GiftcardCustomerRiskLevel'
        riskScore:
          type: integer
          minimum: 0
          description: 累计风险分。
        whitelisted:
          type: boolean
          description: 是否在礼卡客户白名单。
        remark:
          type: string
          minLength: 1
          description: 处置备注；没有时不返回本键。
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 最近处置时刻；从未处置、也没有风险资料时不返回本键。
        updatedBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 最近处置人；没有人工处置过时不返回本键。
    GiftcardCustomerWhitelistWrite:
      type: object
      additionalProperties: false
      required:
        - whitelisted
      properties:
        whitelisted:
          type: boolean
          description: 是否设为白名单。
        remark:
          type: string
          minLength: 1
          maxLength: 256
          pattern: \S
          description: 备注，不能全为空白；不给即清空备注。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            maxAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额超过平台规定的上限时，本次命令适用的单笔金额上限的**取值与币种**（上限可由运营调整，前端不写死，按本键提示「不能超过 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            orderAmountCeiling:
              $ref: '#/components/schemas/Money'
              description: 发起支付时总应付超过单笔上限时，生效的单笔上限（各层取最严后的值），币种是商户结算币种，可能与页面标价币种不同（页面按本键把数额说出来；拼进 `detail` 前端取不出来）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            existingEntryId:
              type: string
              minLength: 1
              description: 加入名单时已有在用项被拒时，既有名单项的标识（页面据此定位既有项）。
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
            earliestAllowedMonth:
              type: string
              pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
              description: 生效月不被允许时最早可用的生效月（`YYYY-MM`）。
            earliestAllowedDate:
              type: string
              format: date
              description: 生效日不被允许时最早可选的生效日（`YYYY-MM-DD`）。
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    MerchantCode:
      type: string
      minLength: 1
      maxLength: 20
      description: 对外商户码。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    UserRef:
      type: object
      additionalProperties: false
      description: 一个平台用户的标识与显示名（列表与记录上展示「谁」）。
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    MerchantOrderNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户单号，同一商户内不可重复。
    PaymentProduct:
      type: string
      description: 订单的产品形态：店铺码、动态码、原生码（商户自行展示的钱包二维码）、付款码、账单、商品、票务、礼卡、PC 网页、移动网页、JSAPI、原生 JSAPI（商户自有应用内调起）、小程序、App SDK、委托代扣。
      enum:
        - store_qr
        - dynamic_qr
        - native_qrcode
        - barcode
        - invoice
        - product_code
        - ticket
        - giftcard
        - web_pc
        - web_mobile
        - jsapi
        - native_jsapi
        - mini_program
        - app_sdk
        - auto_debit
    EntryPoint:
      type: string
      description: 入口：`pos` 终端 · `merchant_app` 商户 App · `merchant_portal` 商户后台 · `open_api` 开放 API · `checkout` 收银台页面（店铺码、账单、Product Link） · `channel_inbound` 通道直接推来的订单 · `plugin_shopify` Shopify 插件 · `plugin_allvalue` AllValue 插件 · `plugin_allvalue_xhs` AllValue 小红书 · `system` 系统发起。
      enum:
        - pos
        - merchant_app
        - merchant_portal
        - open_api
        - checkout
        - channel_inbound
        - plugin_shopify
        - plugin_allvalue
        - plugin_allvalue_xhs
        - system
    PaymentMethod:
      type: string
      minLength: 1
      maxLength: 64
      description: 支付方式目录标识（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，调用方从候选集取来原样回传，按未知值安全处理。
      examples:
        - wechat_instore
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
