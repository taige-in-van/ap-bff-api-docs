openapi: 3.1.0
info:
  title: 管理后台 风控管理 — 前端契约面
  version: 2.0.1
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的风控管理契约：付款人黑名单的加入、移除与列表，被拒订单的检索、详情与按日计数，商户禁入名单的新增、编辑、解除、列表与详情（含冻结或设为高风险后把商户加入），礼卡客户风险资料的查看与白名单的设与取消。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **金额口径**：金额是对应币种最小单位的整数串，带币种。单笔上限与参与比较的金额是结算币种。

    **幂等 / CSRF 口径**：

    - 加入付款人黑名单、新增禁入名单项、冻结或设为高风险后加入禁入名单带 `Idempotency-Key`：同一次操作的重试沿用同一个键，重复提交返回首次结果、不会重复执行。
    - 其余写操作按目标值写或带状态前置，不挂幂等键。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。

    **可见范围**：付款人黑名单、商户禁入名单与礼卡客户是平台级页面，只看功能权限。被拒订单按商户求数据可见范围：范围外商户的被拒订单不出现在列表与计数里，按标识访问一律 `404`。冻结或设为高风险后加入禁入名单按该商户求数据可见范围。

    **操作审计**：本面的写操作记入操作审计（带操作人、对象、前后状态或前后值）；查询、详情、计数不记。操作人恒为当前登录的后台用户，请求体里没有操作人字段。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: payer-blocklist
    x-displayName: 付款人黑名单
    description: 付款人标识的加入（含恢复已移除的原项）、移除与列表。
  - name: rejected-orders
    x-displayName: 被拒订单
    description: 被准入拒绝的订单：检索、详情与按日 × 拒绝原因计数。
  - name: merchant-blocklist
    x-displayName: 商户禁入名单
    description: 禁止入驻的主体与其标识：新增、编辑、解除、列表与详情，冻结或设为高风险后加入。
  - name: giftcard-customers
    x-displayName: 礼卡客户白名单
    description: 按付款人身份查看礼卡风险资料，设或取消白名单。
paths:
  /payer-blocklist-entries:
    get:
      tags:
        - payer-blocklist
      operationId: listPayerBlocklistEntries
      x-required-privilege: risk:payer-blocklist:view
      summary: 付款人黑名单列表
      description: |
        列出付款人黑名单项，分页，按加入时间从新到旧。默认只列在用项，`status` 可改为只列已移除或全部。

        按标识值检索为精确匹配，邮箱不分大小写。商户客户号类的项另带范围商户的商户码与经营名称；范围商户已删除的只带 `identifierScope`。
      parameters:
        - name: identifierType
          in: query
          required: false
          description: 按标识类型。
          schema:
            $ref: '#/components/schemas/PayerBlocklistIdentifierType'
        - name: identifierValue
          in: query
          required: false
          description: 按标识值精确匹配；邮箱不分大小写。
          schema:
            type: string
            minLength: 1
            maxLength: 254
        - name: status
          in: query
          required: false
          description: '`ACTIVE` 只列在用（默认）/ `REMOVED` 只列已移除 / `ALL` 全部。'
          schema:
            type: string
            enum:
              - ACTIVE
              - REMOVED
              - ALL
            default: ACTIVE
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PayerBlocklistEntry'
              example:
                total: 2
                data:
                  - entryId: PB0000000007
                    identifierType: WECHAT
                    identifierScope: wx3f2a9c0d1e5b7a44
                    identifierValue: oAbC1dEfG2hIjK3lMnO4pQr5sTu6
                    blockReason: 多次恶意拒付
                    status: ACTIVE
                    createdAt: '2026-06-02T08:40:00Z'
                    createdBy:
                      userId: usr_a91
                      displayName: Alice Risk
                  - entryId: PB0000000003
                    identifierType: MERCHANT_CUSTOMER
                    identifierScope: mch_8812
                    scopeMerchant:
                      merchantId: mch_8812
                      merchantCode: C3BM68
                      tradeName: Maple Coffee
                    identifierValue: CUST-00912
                    blockReason: 商户报告盗刷
                    status: REMOVED
                    createdAt: '2026-05-11T02:10:00Z'
                    createdBy:
                      userId: usr_a91
                      displayName: Alice Risk
                    removedAt: '2026-07-01T09:00:00Z'
                    removedBy:
                      userId: usr_b07
                      displayName: Bob Risk
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - payer-blocklist
      operationId: createPayerBlocklistEntry
      x-required-privilege: risk:payer-blocklist:manage
      summary: 加入付款人黑名单
      description: |
        把一个付款人标识加入黑名单，对此后的判定即时生效。同一「类型 + 范围 + 值」只有一项：

        - 没有这一项 → 新建，`restored = false`。
        - 有、但已移除 → 恢复原项为在用，拉黑原因改为本次所填，仍是同一名单项，`restored = true`。
        - 有、且在用 → 拒绝（见下），名单不变。

        标识的范围：`WECHAT` / `ALIPAY` 必填 `identifierScope` = 该标识所属的应用（appid）；`MERCHANT_CUSTOMER` 必填 `identifierScope` = 所选商户的 `merchantId`（商户客户号只在该商户内有意义，同一客户号在不同商户下是不同的项）；`EMAIL` 不带范围。邮箱去首尾空白、转小写后存。

        标识值长度：邮箱 1–254（须为邮箱格式）、微信与支付宝 1–128、商户客户号 1–100。拉黑原因必填、不能为空白。

        幂等基准：`Idempotency-Key`。同键重复提交返回首次结果、不再新建或恢复。

        **什么时候拒绝**（名单不变）：

        - `308801` 同一类型、范围与值已有在用项；`context.existingEntryId` 带既有项，页面据此定位。
        - `308802` 以商户客户号加入时所选商户不存在或已删除。
        - 类型不在枚举、缺范围或邮箱带了范围、邮箱格式不对、值或原因超长、原因为空白 → `400`，由 `details` 定位。

        记入操作审计（新建带全部字段；恢复带改前原因与前后状态）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayerBlocklistEntryCreate'
            examples:
              wechat:
                summary: 微信付款人
                value:
                  identifierType: WECHAT
                  identifierScope: wx3f2a9c0d1e5b7a44
                  identifierValue: oAbC1dEfG2hIjK3lMnO4pQr5sTu6
                  blockReason: 多次恶意拒付
              email:
                summary: 礼卡买家邮箱
                value:
                  identifierType: EMAIL
                  identifierValue: buyer@example.com
                  blockReason: 盗卡购买礼卡
              merchantCustomer:
                summary: 商户客户号
                value:
                  identifierType: MERCHANT_CUSTOMER
                  identifierScope: mch_8812
                  identifierValue: CUST-00912
                  blockReason: 商户报告盗刷
      responses:
        '200':
          description: 已加入（新建或恢复原项）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayerBlocklistEntryCreated'
              example:
                restored: false
                entry:
                  entryId: PB0000000012
                  identifierType: EMAIL
                  identifierValue: buyer@example.com
                  blockReason: 盗卡购买礼卡
                  status: ACTIVE
                  createdAt: '2026-11-08T03:12:45Z'
                  createdBy:
                    userId: usr_a91
                    displayName: Alice Risk
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308801
        - 308802
  /payer-blocklist-entries/{entryId}/removal:
    parameters:
      - $ref: '#/components/parameters/PayerBlocklistEntryIdPath'
    post:
      tags:
        - payer-blocklist
      operationId: removePayerBlocklistEntry
      x-required-privilege: risk:payer-blocklist:manage
      summary: 移除付款人黑名单项
      description: |
        移除一个名单项：只标记为已移除、不删除，对此后的判定即时生效；已被它拒掉的订单仍为被拒。之后同一标识再加入时恢复这一项。

        已移除的再移除同样返回 `204`、不改动、不记审计，重试不会被拒。按目标状态写，不挂幂等键。

        **什么时候拒绝**：名单项不存在 → `404`。

        移除在用项时记入操作审计（带前后状态与拉黑原因）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已移除
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /rejected-orders:
    get:
      tags:
        - rejected-orders
      operationId: listRejectedOrders
      x-required-privilege: risk:rejected-order:view
      summary: 被拒订单列表
      description: |
        本人数据可见范围内商户的被拒订单，分页，按建单时间从新到旧。日期范围按建单日期，两端必填。

        每行带拒绝原因：超单笔上限的带被突破的层、该层当时的上限与当时参与比较的金额（都是结算币种）；付款人在黑名单的带被命中名单项的类型、范围、值、拉黑原因与该项当前状态。归属销售是商户当前的归属销售。

        检索都是精确匹配，邮箱不分大小写：付款人标识对订单上的付款人通道侧标识或被命中名单项的值；买家邮箱只对被命中的邮箱类名单项，超单笔上限的被拒订单没有买家邮箱、按买家邮箱检不到。

        **什么时候拒绝**：日期范围缺一端、`to` 早于 `from`、跨度超过允许的最大查询窗口、字段格式不对 → `400`。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/RejectedOrderIdFilter'
        - $ref: '#/components/parameters/MerchantFilter'
        - $ref: '#/components/parameters/RejectionReasonFilter'
        - $ref: '#/components/parameters/PayerIdentifierFilter'
        - $ref: '#/components/parameters/BuyerEmailFilter'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RejectedOrder'
              example:
                total: 2
                data:
                  - orderId: P100250031
                    merchant:
                      merchantId: mch_8812
                      merchantCode: C3BM68
                      tradeName: Maple Coffee
                    customerPaymentAmount:
                      amount: '6200000'
                      currency: CNY
                    rejectionReason: ORDER_AMOUNT_CEILING
                    ceiling:
                      scopeType: PLATFORM
                      ceilingAmount:
                        amount: '1000000'
                        currency: CAD
                      comparedAmount:
                        amount: '1180000'
                        currency: CAD
                    bdUser:
                      userId: usr_c12
                      displayName: Carol BD
                    createdAt: '2026-11-07T02:11:03Z'
                  - orderId: P100250027
                    merchant:
                      merchantId: mch_8812
                      merchantCode: C3BM68
                      tradeName: Maple Coffee
                    customerPaymentAmount:
                      amount: '5000'
                      currency: CAD
                    rejectionReason: PAYER_BLOCKED
                    matchedPayerBlocklistEntry:
                      entryId: PB0000000007
                      identifierType: WECHAT
                      identifierScope: wx3f2a9c0d1e5b7a44
                      identifierValue: oAbC1dEfG2hIjK3lMnO4pQr5sTu6
                      blockReason: 多次恶意拒付
                      status: ACTIVE
                    bdUser:
                      userId: usr_c12
                      displayName: Carol BD
                    createdAt: '2026-11-06T22:40:18Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /rejected-orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        description: 平台订单号。订单不存在、不是被拒订单或所属商户在本人数据范围外 → `404`。
        schema:
          $ref: '#/components/schemas/OrderId'
    get:
      tags:
        - rejected-orders
      operationId: getRejectedOrder
      x-required-privilege: risk:rejected-order:view
      summary: 被拒订单详情
      description: |
        列表行的字段，加受理入口、产品形态、建单时指定的支付方式、商户订单号、付款人通道侧标识与所属应用、付款人 IP。被突破的上限与比较金额是被拒当时的值，之后调整上限不影响；被命中的名单项之后移除了，`status` 为 `REMOVED`。

        订单与商户的完整详情分别在交易管理的订单详情与商户详情，按当前用户的权限显示入口。

        **什么时候拒绝**：订单不存在、不是被拒订单或所属商户在本人数据范围外 → `404`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectedOrderDetail'
              example:
                orderId: P100250027
                merchant:
                  merchantId: mch_8812
                  merchantCode: C3BM68
                  tradeName: Maple Coffee
                customerPaymentAmount:
                  amount: '5000'
                  currency: CAD
                rejectionReason: PAYER_BLOCKED
                matchedPayerBlocklistEntry:
                  entryId: PB0000000007
                  identifierType: WECHAT
                  identifierScope: wx3f2a9c0d1e5b7a44
                  identifierValue: oAbC1dEfG2hIjK3lMnO4pQr5sTu6
                  blockReason: 多次恶意拒付
                  status: REMOVED
                bdUser:
                  userId: usr_c12
                  displayName: Carol BD
                createdAt: '2026-11-06T22:40:18Z'
                merchantOrderNo: SO-20261106-0098
                product: jsapi
                entryPoint: checkout
                pinnedPaymentMethod: wechat_online
                payerChannelUserId: oAbC1dEfG2hIjK3lMnO4pQr5sTu6
                payerAppId: wx3f2a9c0d1e5b7a44
                customerIp: 203.0.113.7
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /rejected-order-daily-counts:
    get:
      tags:
        - rejected-orders
      operationId: listRejectedOrderDailyCounts
      x-required-privilege: risk:rejected-order:view
      summary: 被拒订单按日 × 拒绝原因计数
      description: |
        与被拒订单列表同一组筛选、同一数据范围，按建单日期 × 拒绝原因计数，不分页。日期范围内每一天两种原因各一项，当天没有被拒订单的计为 0；按日期从早到晚。

        **什么时候拒绝**：同 `listRejectedOrders`。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/RejectedOrderIdFilter'
        - $ref: '#/components/parameters/MerchantFilter'
        - $ref: '#/components/parameters/RejectionReasonFilter'
        - $ref: '#/components/parameters/PayerIdentifierFilter'
        - $ref: '#/components/parameters/BuyerEmailFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/RejectedOrderDailyCount'
              example:
                items:
                  - date: '2026-11-06'
                    rejectionReason: ORDER_AMOUNT_CEILING
                    count: 2
                  - date: '2026-11-06'
                    rejectionReason: PAYER_BLOCKED
                    count: 1
                  - date: '2026-11-07'
                    rejectionReason: ORDER_AMOUNT_CEILING
                    count: 1
                  - date: '2026-11-07'
                    rejectionReason: PAYER_BLOCKED
                    count: 0
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchant-blocklist-entries:
    get:
      tags:
        - merchant-blocklist
      operationId: listMerchantBlocklistEntries
      x-required-privilege: risk:merchant-blocklist:view
      summary: 商户禁入名单列表
      description: |
        只列生效项，分页，按录入时间从新到旧。可按名称或标识值搜索（包含即命中、不分大小写），按原因类别多选筛。

        每行的商户码取该项标识里的商户码，没有再取来源商户的商户码，都没有不返回。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 按主体名称或任一在册标识的值搜索，包含即命中、不分大小写。
          schema:
            type: string
            minLength: 1
            maxLength: 300
        - name: reasonCategory
          in: query
          required: false
          description: 按原因类别，可多选。
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MerchantBlocklistReason'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantBlocklistEntrySummary'
              example:
                total: 1
                data:
                  - entryId: MB0000000021
                    merchantCode: C3BM70
                    subjectName: Northline Trading
                    reasonCategory: FROZEN
                    createdAt: '2026-11-02T06:30:00Z'
                    createdBy:
                      userId: usr_b07
                      displayName: Bob Ops
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - merchant-blocklist
      operationId: createMerchantBlocklistEntry
      x-required-privilege: risk:merchant-blocklist:manage
      summary: 新增禁入名单项
      description: |
        新增一个禁止入驻的主体：名称、原因类别、备注与至少一个标识。新增即时参与入驻审核的比对；来源记为手工录入。

        每个标识按类别检查格式并归一（法定名不计大小写、标点、空白与常见公司后缀；联系人姓名不计大小写与标点；邮箱不计首尾空白与大小写；邮箱域名不计大小写与前导 `@`；电话只看数字、北美号码不计国家码 1；注册号与商户码不计大小写与非字母数字字符）。同一主体内同类别归一后相同的只留一条（留先出现的那条原值）；不同主体可含相同标识。公司名称按法定名录入。

        幂等基准：`Idempotency-Key`。同键重复提交返回首次结果、不重复建。

        **什么时候拒绝**（不建）：名称缺失、一个标识都没有或超过 30 条、某标识格式不对或归一后为空（如邮箱格式不对、电话不足 7 位数字）、字段超长 → `400`，由 `details` 定位到 `identifiers[i].value` 等字段。

        记入操作审计（带全部内容与标识集）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantBlocklistEntryWrite'
            example:
              subjectName: Acme Trading
              reasonCategory: FRAUD
              note: 多家合作方报告盗刷
              identifiers:
                - category: legal_name
                  value: Acme Trading Inc.
                - category: email
                  value: owner@acme-trading.example
                - category: phone
                  value: +1 604 555 0123
      responses:
        '201':
          description: 已新增
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantBlocklistEntry'
              example:
                entryId: MB0000000022
                subjectName: Acme Trading
                reasonCategory: FRAUD
                note: 多家合作方报告盗刷
                source: MANUAL
                identifiers:
