      summary: 为他人解除登录锁定
      description: |
        清除该账号因连续登录失败而处的锁定，对方可立即用正确凭据登录。未锁定同样返回 `204`。天然幂等，不挂幂等键。

        **什么时候拒绝**：

        - `308004` 账号已移除。
        - `306007` 该账号现有的角色里有超出操作者权限边界的。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已解除
