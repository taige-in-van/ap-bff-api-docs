      x-error-codes:
        - 306007
        - 308004
  /staff/{userId}/access-grants:
    parameters:
      - $ref: '#/components/parameters/StaffUserId'
    post:
      tags:
        - access-grants
      operationId: createStaffAccessGrant
      x-required-privilege: rbac:access-grant:manage
      summary: 为他人指定临时授权（单个商户）
      description: |
        为另一个后台用户指定对一个商户的临时授权，可指定任一商户（含 KA 商户、含已在对方范围内的商户）；不能指定给自己。授权即时生效，期间对方对该商户的读写按其功能权限放开；时长由平台设定，到期自动失效。再次指定产生新授权、不延长旧的。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308001` 路径里的账号是操作者自己，不产生授权；本人对范围外商户走自助申请（`createAccessGrant`）。
        - 账号或商户不存在 → `404`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessGrantRequest'
            example:
              merchantId: mch_8812
      responses:
        '201':
          description: 已授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
              example:
                grantId: grt_5a1
                user:
                  userId: usr_c12
                  displayName: Carol
                merchant:
                  merchantId: mch_8812
                  merchantName: Maple Coffee
                status: ACTIVE
                grantedAt: '2026-10-16T08:00:00Z'
                expiresAt: '2026-10-17T08:00:00Z'
                grantedBy:
                  userId: usr_a91
                  displayName: Alice Ops
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308001
  /sessions:
    get:
      tags:
        - sessions
      operationId: listSessions
      x-required-privilege: opacc:session:view
      summary: 在线会话列表（管理后台与商户后台，含代登会话）
      description: |
        当前有效的会话，按登录时刻从新到旧，一次登录一行。一次只列一种来源（`client` 必填），两种来源不混合分页。代登会话归商户后台来源，带代登人与被代商户。

        **看得到哪些**：会话归账号，不归商户。管理后台会话全部可见；商户后台普通会话只返回在本人数据可见范围内任一商户有成员身份的账号的，不标商户；代登会话按被代商户是否在本人可见范围内决定是否返回。
      parameters:
        - name: client
          in: query
          required: true
          description: 来源：一次只列一种来源，前端默认先看管理后台。
          schema:
            $ref: '#/components/schemas/SessionClient'
        - name: keyword
          in: query
          required: false
          description: 按账号：登录名（用户名或邮箱）包含匹配，不区分大小写。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OnlineSession'
              example:
                total: 2
                data:
                  - sessionId: az_7f3c
                    client: merchant
                    user:
                      userId: usr_m33
                      displayName: Jane Merchant
                    loginId: jane@example.com
                    loginAt: '2026-10-16T07:50:00Z'
                    impersonator:
                      userId: usr_b07
                      displayName: Bob BD
                    impersonatedMerchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                  - sessionId: az_19e0
                    client: merchant
                    user:
                      userId: usr_m41
                      displayName: Tom Cashier
                    loginId: tom@example.com
                    loginAt: '2026-10-16T06:00:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /sessions/{sessionId}:
    delete:
      tags:
        - sessions
      operationId: deleteSession
      x-required-privilege: opacc:session:manage
      summary: 强制下线一个会话
      description: |
        只结束选中的这一个会话：被下线的会话下一次请求即被拒，同一账号的其他独立会话与受信浏览器不受影响；下线的是管理后台会话时，由它发起的代登会话一并结束。会话已结束或不存在同样返回 `204`；不在本人可见范围内（可见性同在线会话列表）→ `404`。天然幂等，不挂幂等键。
      parameters:
        - name: sessionId
          in: path
          required: true
          description: 列表里的 `sessionId`。
          schema:
            $ref: '#/components/schemas/AuthorizationId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已下线
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /login-logs:
    get:
      tags:
        - login-logs
      operationId: listLoginLogs
      x-required-privilege: opacc:login-log:view
      summary: 管理后台登录日志（筛选、分页，发生时间从新到旧）
      description: |
        管理后台的每次登录尝试（成功、失败、触发锁定）与登出，固定按发生时间从新到旧。只读，没有删除或清空接口。保留期由平台设定，超出保留期的不再返回。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 按账号：登录名（用户名或邮箱）包含匹配，不区分大小写。登录名不存在的失败尝试没有账号，按账号筛不到。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: result
          in: query
          required: false
          explode: true
          description: 按结果，可多选：只列结果在所选这一组里的行；不传不按结果筛。
          schema:
            type: array
            minItems: 1
            items:
              $ref: '#/components/schemas/LoginLogResult'
        - name: from
          in: query
          required: true
          description: 发生日期范围起（含当日）；与 `to` 都要给。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: true
          description: 发生日期范围止（含当日）。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LoginLogEntry'
              example:
                total: 2
                data:
                  - logId: 90012
                    occurredAt: '2026-10-16T07:41:00Z'
                    user:
                      userId: usr_b07
                      displayName: Bob BD
                    result: IP_NOT_ALLOWED
                    loginMethod: password
                    loginIp: 198.51.100.20
                  - logId: 90011
                    occurredAt: '2026-10-16T06:00:00Z'
                    user:
                      userId: usr_a91
                      displayName: Alice Ops
                    result: SUCCESS
                    loginMethod: password
                    loginIp: 203.0.113.10
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
