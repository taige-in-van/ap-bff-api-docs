        schema:
          $ref: '#/components/schemas/RoleId'
    put:
      tags:
        - roles
      operationId: updateRole
      x-required-privilege: rbac:role:manage
      summary: 改管理后台角色（改名、启停、勾选权限点）
      description: |
        `version` 必带（读到的版本），其余只传要改的。`privileges` 整组置换角色的点集，只能取管理后台资源目录里已启用的操作点。改动对持有该角色的在线账号即时生效。

        **两人同时编辑**：后提交者因版本已变被拒（`968018`），重读 `listRoles` 后在最新内容上重做。带版本防覆盖，不挂幂等键；上一次其实已成功、响应丢了再提交，同样得到 `968018`，重读即可看到。

        **什么时候拒绝**：

        - `968018` 版本已变。
        - `968016` 勾了未登记、已停用或目录节点；刷新资源目录后重选。
        - `306008` 勾上或取消了操作者自己不持有的权限点，或启用的角色点集不是操作者有效权限点的子集；角色不变。
        - `308002` 停用该角色或去掉某个点后，不再有能管理账号、角色与凭据的在用账号。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
            examples:
              privileges:
                summary: 勾选权限点
                value:
                  version: 4
                  privileges:
                    - opacc:user:view
                    - opscon:audit:view
                    - opscon:notification:view
              disable:
                summary: 停用
                value:
                  version: 5
                  enabled: false
      responses:
        '200':
          description: 改后的角色（含新版本）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
              example:
                roleId: role_ops
                name: 运营
                enabled: true
                version: 5
                privileges:
                  - opacc:user:view
                  - opscon:audit:view
                  - opscon:notification:view
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306008
        - 308002
        - 968018
        - 968016
    delete:
      tags:
        - roles
      operationId: deleteRole
      x-required-privilege: rbac:role:manage
      summary: 删除管理后台角色
      description: |
        只有没有账号持有的角色能删除。不存在 → `404`。

        **什么时候拒绝**：`968017` 仍有账号持有该角色，先从账号上移除或改为停用。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已删除
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 968017
