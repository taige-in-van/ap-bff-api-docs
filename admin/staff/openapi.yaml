openapi: 3.1.0
info:
  title: 管理后台 后台账号与角色权限 — 前端契约面
  version: 2.3.0
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的后台账号与角色权限契约：后台账号（邀请建号、编辑、改登录邮箱、停用启用、移除加回、为他人重置密码 / 重置验证器 / 解锁）、在线会话与强制下线、登录日志、管理后台角色、两棵资源目录（只读，随版本发布）、商户后台与终端预设角色、跨范围临时授权。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 建号、编辑账号、加回、为他人重置密码、建角色、建临时授权挂 `Idempotency-Key`：同键同请求体重发返回首次结果；同键改请求体 → `409`·`908003`；首次请求仍在处理 → `409`·`908002`，稍后同键同请求体重发。
    - 带版本的写（改角色、改预设角色）以版本防并发覆盖、不挂幂等键；天然幂等的置值与删除（改账号状态、移除、重置验证器、解锁、强制下线、撤销授权）不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。

    **权限边界**（服务端校验）：

    - 后台账号管理是平台级页面，不受数据可见范围限制。
    - 逐个角色判，每个角色的点集都必须是操作者有效权限点集合的子集（可以相同）。用在三处：建号给的每个角色、编辑改成的每个角色、被操作账号现有的每个角色——不能对权限比自己宽的账号做编辑、改登录邮箱、停用启用、移除加回、重置密码、重置验证器、解锁、重发邀请。不满足 → `403`·`306007`。
    - 给他人设的数据范围不得宽于操作者自己的范围 → 否则 `403`·`306009`。
    - 不能对自己做停用、移除、改角色、改数据范围、改登录邮箱、重置密码、重置验证器 → `403`·`308001`。
    - 停用、移除、改角色、停用角色、改角色点集，若会使系统不再有同时持 `opacc:user:manage`、`rbac:role:manage`、`opacc:credential:manage` 的正常在册账号 → `409`·`308002`。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: staff
    x-displayName: 后台账号
    description: 后台账号：列表与详情、邀请建号、编辑、停用启用、移除加回、为他人重置密码 / 验证器 / 解锁、为他人指定临时授权。
  - name: sessions
    x-displayName: 在线会话
    description: 在线会话（管理后台与商户后台，含代登会话）与强制下线。
  - name: login-logs
    x-displayName: 登录日志
    description: 管理后台的登录尝试与登出记录，只读。
  - name: roles
    x-displayName: 管理后台角色
    description: 管理后台角色的增删改启停与权限点勾选。
  - name: resources
    x-displayName: 管理后台资源目录
    description: 管理后台的资源目录树（目录 / 操作点），只读。
  - name: merchant-resources
    x-displayName: 商户后台资源目录
    description: 商户后台的资源目录树（目录 / 操作点），只读。
  - name: merchant-roles
    x-displayName: 商户后台与终端预设角色
    description: 商户后台预设角色（管理员、员工、开发者、Owner）与终端预设角色（店长、收银员）的点集。
  - name: access-grants
    x-displayName: 临时授权
    description: 跨数据范围的单商户临时授权：自助申请、查看、撤销。
paths:
  /staff:
    get:
      tags:
        - staff
      operationId: listStaff
      x-required-privilege: opacc:user:view
      summary: 后台账号列表（搜索、筛选、排序、分页）
      description: |
        后台账号列表。不传 `status` 时不含已移除的账号；按 `status=REMOVED` 可查到已移除的账号并加回。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 按显示名、姓名、登录邮箱包含匹配。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: roleId
          in: query
          required: false
          description: 只列持有该角色的账号（可同时持有别的角色）；取值取 `listStaffRoleOptions`。
          schema:
            $ref: '#/components/schemas/RoleId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/StaffStatus'
        - name: partnerId
          in: query
          required: false
          description: 按所属机构。
          schema:
            $ref: '#/components/schemas/PartnerId'
        - name: sortField
          in: query
          required: false
          description: 排序字段。不传 = 不排序；页面默认顺序由前端显式传。按 `lastLoginAt` 排序时从未登录的恒在末尾。
          schema:
            type: string
            enum:
              - createdAt
              - lastLoginAt
              - displayName
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffSummary'
              example:
                total: 1
                data:
                  - userId: usr_b07
                    loginId: bob@example.com
                    displayName: Bob BD
                    roles:
                      - roleId: role_bd
                        name: BD
                    status: ACTIVE
                    dataScopeType: own_merchants
                    lastLoginAt: '2026-10-15T09:12:00Z'
                    createdAt: '2026-03-02T10:00:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - staff
      operationId: createStaff
      x-required-privilege: opacc:user:manage
      summary: 邀请新建后台账号（发邀请邮件，对方设密后激活）
      description: |
        录入登录邮箱、显示名、角色与数据范围，系统向该邮箱发邀请邮件；对方在邀请链接落地页设密后账号才可登录，此前状态为 `INVITED`。邀请链接的有效期由平台设定。BD 与机构账号走同一入口，差别只在角色与数据范围。

        登录邮箱属于已激活、邮箱已验证、未停用且尚无管理后台身份的已有用户时，不新建用户，而是为该用户加上管理后台身份，同样返回 `201`：不发邀请邮件、不改其密码（对方已有密码），授予所给角色与数据范围后即可登录管理后台，状态为 `ACTIVE`；还没绑定验证器的，登录时先绑定。之后停用对两边同时生效；移除、加回只作用于管理后台身份。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `968001` 登录邮箱已被在册的后台账号使用。
        - `308003` 登录邮箱属于已移除的后台账号，改为在列表里找到它加回（`restoreStaff`）。
        - `308007` 登录邮箱属于邀请中、待验证或已停用的已有用户，不能直接授予后台身份；先完成激活 / 验证或由运营启用。不发邀请，该用户状态不变。
        - `306007` 所给角色里有超出操作者权限边界的；`306009` 数据范围宽于操作者自己的。
        - 数据范围为 `partner` 却没给 `partnerId`、或给了 `partnerId` 而范围不是 `partner`、白名单格式不对 → `400`，不建账号。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffCreate'
            example:
              loginEmail: carol@example.com
              displayName: Carol
              roleIds:
                - role_partner_ops
              dataScopeType: partner
              partnerId: ptn_0031
      responses:
        '201':
          description: 已建账号（邀请中），邀请邮件已发出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
              example:
                userId: usr_c12
                loginId: carol@example.com
                displayName: Carol
                roles:
                  - roleId: role_partner_ops
                    name: 机构运营
                status: INVITED
                dataScopeType: partner
                partner:
                  partnerId: ptn_0031
                  partnerName: Maple Partners
                createdAt: '2026-10-16T08:00:00Z'
                mfaEnrolled: false
                loginIpAllowlist: []
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306007
        - 306009
        - 308003
        - 308007
        - 968001
  /role-options:
    get:
      tags:
        - staff
      operationId: listStaffRoleOptions
      x-required-privilege: opacc:user:view
      summary: 账号表单与列表筛选用的角色候选
      description: |
        全部管理后台角色（含停用的），每项标出操作者能不能把它分配给别人（`assignable`）：角色点集是操作者有效权限点的子集、且角色启用时为 `true`。列表的角色筛选用全部项，账号表单只让选 `assignable` 的。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffRoleOption'
              example:
                items:
                  - roleId: role_ops
                    name: 运营
                    enabled: true
                    assignable: true
                  - roleId: role_admin
                    name: 系统管理员
                    enabled: true
                    assignable: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /staff/{userId}:
    parameters:
      - $ref: '#/components/parameters/StaffUserId'
    get:
      tags:
        - staff
      operationId: getStaff
      x-required-privilege: opacc:user:view
      summary: 后台账号详情
      description: 账号资料、角色、数据范围与机构、验证器与企业微信是否已绑定、登录 IP 白名单、最近登录时间。不含密码与验证器密钥。已移除的账号同样可读。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
              example:
                userId: usr_b07
                loginId: bob@example.com
                displayName: Bob BD
                firstName: Bob
                lastName: Lee
                jobTitle: BD
                roles:
                  - roleId: role_bd
                    name: BD
                status: ACTIVE
                dataScopeType: own_merchants
                lastLoginAt: '2026-10-15T09:12:00Z'
                createdAt: '2026-03-02T10:00:00Z'
                mfaEnrolled: true
                wechat:
                  nickname: Bob
                loginIpAllowlist:
                  - 203.0.113.0/24
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - staff
      operationId: updateStaff
      x-required-privilege: opacc:user:manage
      summary: 编辑后台账号（资料、角色、数据范围与机构、登录 IP 白名单、登录邮箱）
      description: |
        只提交要改的字段，一次提交全部生效或全部不生效。各字段的效果：

        - `roleIds`：整组换成所给的这组；角色与数据范围的改动对该账号已有会话的下一次请求即时生效。
        - `dataScopeType` / `partnerId`：范围改为 `partner` 时须同时给 `partnerId`；改为其他范围时机构随之清空。
        - `loginIpAllowlist`：整组置换；为他人保存不要求包含操作者当前 IP。
        - `loginEmail`：已激活账号不直接生效，向新邮箱发确认链接，当事人确认后才切换，确认前旧邮箱照常可登录、新邮箱不占用；再改会顶掉上一笔未确认的；该账号冷却内 → `966006`（`context.cooldownSeconds`）、不发链接、在途一笔不顶掉。邀请中的账号改邮箱 = 向新邮箱重发邀请、旧链接作废，受邀请重发冷却 → `966006`。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308001` 对自己改角色、数据范围或登录邮箱。
        - `308002` 改角色会让系统不再有能管理账号、角色与凭据的在用账号。
        - `306007` 改成的角色、或该账号现有的角色里有超出操作者权限边界的；`306009` 数据范围宽于操作者自己的。
        - `308004` 账号已移除（先加回）。
        - `968001` 新登录邮箱已被别的账号使用。
        - `966006` 改登录邮箱发确认链接或重发邀请时冷却未过，按 `context.cooldownSeconds` 倒计时。
        - 范围与机构不配、白名单格式不对 → `400`，不改动。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffUpdate'
            examples:
              roles:
                summary: 改角色与数据范围
                value:
                  roleIds:
                    - role_ops
                    - role_finance
                  dataScopeType: all
              email:
                summary: 改登录邮箱
                value:
                  loginEmail: bob.lee@example.com
      responses:
        '200':
          description: 更新后的账号（改已激活账号的登录邮箱时，`pendingLoginEmail` 为待确认的新邮箱）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
              example:
                userId: usr_b07
                loginId: bob@example.com
                pendingLoginEmail: bob.lee@example.com
                displayName: Bob BD
                roles:
                  - roleId: role_ops
                    name: 运营
                  - roleId: role_finance
                    name: 财务
                status: ACTIVE
                dataScopeType: all
                createdAt: '2026-03-02T10:00:00Z'
                mfaEnrolled: true
                loginIpAllowlist: []
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306007
        - 306009
        - 308001
        - 308002
        - 308004
        - 966006
        - 968001
    delete:
      tags:
        - staff
      operationId: deleteStaff
      x-required-privilege: opacc:user:manage
      summary: 移除后台账号（收回管理后台访问）
      description: |
        收回该账号的管理后台身份：它的管理后台会话即时失效，商户后台身份不受影响。之后不在默认列表里，按状态 `REMOVED` 可查到，可加回（`restoreStaff`）。已移除的再移除同样返回 `204`。

        **什么时候拒绝**：

        - `308001` 移除自己；`308002` 移除后不再有能管理账号、角色与凭据的在用账号。
        - `306007` 该账号现有的角色里有超出操作者权限边界的。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已移除
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306007
        - 308001
        - 308002
  /staff/{userId}/restoration:
    parameters:
      - $ref: '#/components/parameters/StaffUserId'
    post:
      tags:
        - staff
      operationId: restoreStaff
      x-required-privilege: opacc:user:manage
      summary: 加回已移除的后台账号（重新指定角色与数据范围）
      description: |
        恢复已移除账号的管理后台身份，须重新指定角色与数据范围；登录密码与验证器绑定沿用。账号此前被停用的，加回后仍是停用。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308004` 账号未被移除。
        - `306007` 所给角色里有超出操作者权限边界的；`306009` 数据范围宽于操作者自己的。
        - 范围与机构不配 → `400`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffRestoration'
            example:
              roleIds:
                - role_bd
              dataScopeType: own_merchants
      responses:
        '200':
          description: 加回后的账号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffDetail'
              example:
                userId: usr_d44
                loginId: dave@example.com
                displayName: Dave
                roles:
                  - roleId: role_bd
                    name: BD
                status: ACTIVE
                dataScopeType: own_merchants
                createdAt: '2026-01-05T10:00:00Z'
                mfaEnrolled: true
                loginIpAllowlist: []
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306007
        - 306009
        - 308004
  /staff/{userId}/status:
    parameters:
      - $ref: '#/components/parameters/StaffUserId'
    put:
      tags:
        - staff
      operationId: updateStaffStatus
      x-required-privilege: opacc:user:manage
      summary: 停用或启用后台账号
      description: |
        **全量覆盖**：请求体就是目标状态，缺省不代表保持原样。

        - `DISABLED`：该账号在全平台拒绝登录（若他也是商户操作员，商户后台同样登录不了），既有会话全部即时失效。
        - `ACTIVE`：恢复可登录；已失效的会话不恢复，须重新登录。

        与现状相同同样返回 `204`。天然幂等，不挂幂等键。

        **什么时候拒绝**：

        - `308001` 停用自己；`308002` 停用后不再有能管理账号、角色与凭据的在用账号。
        - `306007` 该账号现有的角色里有超出操作者权限边界的。
        - `308004` 账号已移除，或还在邀请中。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - status
              properties:
                status:
                  allOf:
                    - $ref: '#/components/schemas/StaffStatus'
                  enum:
                    - ACTIVE
                    - DISABLED
                  description: 目标状态，取 `StaffStatus` 里的 `ACTIVE`（启用）或 `DISABLED`（停用）。
            example:
              status: DISABLED
      responses:
        '204':
          description: 已置为目标状态
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306007
        - 308001
        - 308002
        - 308004
  /staff/{userId}/invitation:
    parameters:
      - $ref: '#/components/parameters/StaffUserId'
    post:
      tags:
        - staff
      operationId: resendStaffInvitation
      x-required-privilege: opacc:user:manage
      summary: 重发邀请邮件
      description: |
        向尚未设密账号（含停用前未设密的）的登录邮箱重发邀请，新链接生效、旧链接作废，返回冷却秒数。按流程语义不挂幂等键。

        **什么时候拒绝**：

        - `308004` 账号已设过密码。
        - `966006` 重发冷却未过，按 `context.cooldownSeconds` 倒计时。
        - `306007` 该账号现有的角色里有超出操作者权限边界的。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已重发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendCooldown'
              example:
                cooldownSeconds: 60
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306007
        - 308004
        - 966006
  /staff/{userId}/password:
    parameters:
      - $ref: '#/components/parameters/StaffUserId'
    put:
      tags:
        - staff
      operationId: updateStaffPassword
      x-required-privilege: opacc:credential:manage
      summary: 为他人重置密码
      description: |
        把该账号的登录密码设为所给的新密码：其全平台会话失效、受信浏览器全部失效，其登录邮箱收到密码已修改通知。不改验证器绑定、不解除登录锁定（解锁另调 `deleteStaffLoginLock`）。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308001` 对自己的账号（本人改密走 `changeMyPassword`）。
        - `308004` 账号还在邀请中（没有密码可重置，改为重发邀请）或已移除。
        - `306007` 该账号现有的角色里有超出操作者权限边界的。
        - 新密码不满足密码规则 → `400`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - newPassword
              properties:
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: 新密码。密码规则：≥ 8 字符，含大写、小写、数字、特殊字符；下限 8 = 其中的长度那条，其余四条由前端校验并提示，服务端兜底拒绝（`400`）。
            example:
              newPassword: Tmp!Pass2026
      responses:
        '204':
          description: 已重置；该账号全部会话失效
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306007
        - 308001
        - 308004
  /staff/{userId}/mfa:
    parameters:
      - $ref: '#/components/parameters/StaffUserId'
    delete:
      tags:
        - staff
      operationId: deleteStaffMfa
      x-required-privilege: opacc:credential:manage
      summary: 为他人重置验证器
      description: |
        清除该账号的验证器绑定：其全平台会话失效、受信浏览器全部失效；下次登录密码通过后先在登录内重新绑定，绑定前不能使用其他功能。本无绑定同样返回 `204`。天然幂等，不挂幂等键。

        **什么时候拒绝**：

        - `308001` 对自己的账号。
        - `308004` 账号已移除。
        - `306007` 该账号现有的角色里有超出操作者权限边界的。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已重置
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306007
        - 308001
        - 308004
  /staff/{userId}/login-lock:
    parameters:
