        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 968018
        - 968016
  /access-grants:
    get:
      tags:
        - access-grants
      operationId: listAccessGrants
      x-required-privilege: rbac:access-grant:manage
      summary: 临时授权列表（按商户或账号筛选）
      description: 临时授权记录，按授权时刻从新到旧。商户详情的授权用户区块带 `merchantId`。
      parameters:
        - name: merchantId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MerchantId'
        - name: userId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/UserId'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AccessGrantStatus'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AccessGrant'
              example:
                total: 1
                data:
                  - grantId: grt_5a1
                    user:
                      userId: usr_c12
                      displayName: Carol
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    status: ACTIVE
                    grantedAt: '2026-10-16T08:00:00Z'
                    expiresAt: '2026-10-17T08:00:00Z'
                    grantedBy:
                      userId: usr_c12
                      displayName: Carol
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - access-grants
      operationId: createAccessGrant
      x-required-privilege: rbac:access-grant:create
      summary: 自助申请临时授权（本人、单个范围外商户）
      description: |
        为本人申请对一个数据范围外商户的临时授权：非 KA 商户即时生效、不经审批，期间对该商户的读写按本人功能权限放开；时长由平台设定，到期自动失效。再次申请产生新授权、不延长旧的。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308005` 商户已在本人数据范围内，无需申请。
        - `308006` 商户是 KA 商户，须由有指定权限的同事为你指定。
        - 商户不存在 → `404`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccessGrantRequest'
            example:
              merchantId: mch_8812
      responses:
        '201':
          description: 已授权
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessGrant'
              example:
                grantId: grt_5a2
                user:
                  userId: usr_c12
                  displayName: Carol
                merchant:
                  merchantId: mch_8812
                  merchantName: Maple Coffee
                status: ACTIVE
                grantedAt: '2026-10-16T08:00:00Z'
                expiresAt: '2026-10-17T08:00:00Z'
                grantedBy:
                  userId: usr_c12
                  displayName: Carol
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308005
        - 308006
  /access-grants/{grantId}:
    delete:
      tags:
        - access-grants
      operationId: deleteAccessGrant
      x-required-privilege: rbac:access-grant:manage
      summary: 撤销临时授权
      description: 提前撤销一条临时授权，即时失效。已撤销或已到期的再撤销同样返回 `204`；不存在 → `404`。天然幂等，不挂幂等键。
      parameters:
        - name: grantId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AccessGrantId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已撤销
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /access-grant-candidates:
    get:
      tags:
        - access-grants
      operationId: listAccessGrantCandidates
      x-required-privilege: rbac:access-grant:create
      summary: 查找可自助申请临时授权的范围外商户
      description: |
        按商户码或名称查找本人数据范围外的商户，供自助申请临时授权（`createAccessGrant`）。只回商户码、名称与能否申请，不回其他资料。

        - 只含范围外、非 KA、未关户的商户；范围内的与 KA 商户不返回。
        - `requestable = false` 表示本人已持该商户生效中的临时授权，无需再申请。
        - 最多返回 20 条，不分页；命中更多时请输入更完整的商户码或名称。
      parameters:
        - name: keyword
          in: query
          required: true
          description: 商户码（精确匹配）或经营名 / 法定名（包含匹配）。
          schema:
            type: string
            minLength: 2
            maxLength: 128
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    maxItems: 20
                    items:
                      $ref: '#/components/schemas/AccessGrantCandidate'
              example:
                items:
                  - merchantId: mch_8812
                    merchantCode: C3BM68
                    tradeName: Maple Coffee
                    requestable: true
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  parameters:
    StaffUserId:
      name: userId
      in: path
      required: true
      description: 后台账号的用户标识。
      schema:
        $ref: '#/components/schemas/UserId'
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
  schemas:
    AccessGrantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 临时授权标识。
    ResourceId:
      type: string
      minLength: 1
      maxLength: 128
      description: 资源节点标识；操作点即权限点 `模块:资源:动作`，目录节点为分组标识。
    PrivilegeId:
      type: string
      minLength: 1
      maxLength: 128
      description: 权限点 `模块:资源:动作`。
    RoleName:
      type: string
      minLength: 1
      maxLength: 64
      description: 角色名。
    StaffStatus:
      type: string
      enum:
        - INVITED
        - ACTIVE
        - DISABLED
        - REMOVED
      description: |
        账号状态：

        - `INVITED`：已邀请、尚未设密，不能登录。
        - `ACTIVE`：正常。
        - `DISABLED`：已停用，全平台不能登录。
        - `REMOVED`：已移除管理后台身份，可加回。
    DataScopeType:
      type: string
      enum:
        - all
        - own_merchants
        - partner
      description: |
        数据可见范围（按商户组织的页面里看得到哪些商户）：

        - `all`：全部商户。
        - `own_merchants`：本人是其 BD 的商户。
        - `partner`：所属机构及其直接下级机构的商户；须有所属机构。

        范围宽窄：`all` 最宽；`own_merchants` 与 `partner` 都窄于 `all`、彼此不可比。
    PartnerRef:
      type: object
      additionalProperties: false
      required:
        - partnerId
        - partnerName
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        partnerName:
          type: string
          minLength: 1
    RoleRef:
      type: object
      additionalProperties: false
      required:
        - roleId
        - name
      properties:
        roleId:
          $ref: '#/components/schemas/RoleId'
        name:
          $ref: '#/components/schemas/RoleName'
    StaffSummary:
      type: object
      x-parent: true
      description: 后台账号列表的一行。
      required:
        - userId
        - loginId
        - displayName
        - roles
        - status
        - dataScopeType
        - createdAt
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
          readOnly: true
        loginId:
          $ref: '#/components/schemas/LoginId'
          readOnly: true
          description: 登录名（登录邮箱）。
        pendingLoginEmail:
          type: string
          format: email
          readOnly: true
          description: 已发起、待当事人确认的新登录邮箱；没有在途的改动不返回本键。
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        firstName:
          type: string
          minLength: 1
          maxLength: 128
          description: 名；没填过不返回本键。
        lastName:
          type: string
          minLength: 1
          maxLength: 128
          description: 姓；没填过不返回本键。
        roles:
          type: array
          readOnly: true
          description: 所持的管理后台角色；已移除的账号为空数组。
          items:
            $ref: '#/components/schemas/RoleRef'
        status:
          $ref: '#/components/schemas/StaffStatus'
        dataScopeType:
          $ref: '#/components/schemas/DataScopeType'
        partner:
          $ref: '#/components/schemas/PartnerRef'
          description: 所属机构；仅 `dataScopeType = partner` 时返回。
        lastLoginAt:
          $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 最近一次登录成功的时刻；从未登录不返回本键。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          readOnly: true
    StaffDetail:
      type: object
      description: 后台账号详情 = 列表行 + 下列字段。不含密码与验证器密钥。
      allOf:
        - $ref: '#/components/schemas/StaffSummary'
        - type: object
          required:
            - mfaEnrolled
            - loginIpAllowlist
          properties:
            phone:
              $ref: '#/components/schemas/Phone'
              description: 电话；没填过不返回本键。
            jobTitle:
              type: string
              minLength: 1
              maxLength: 64
              description: 职务；没填过不返回本键。
            mfaEnrolled:
              type: boolean
              readOnly: true
              description: 验证器是否已绑定。
            wechat:
              $ref: '#/components/schemas/WechatBindingSummary'
              readOnly: true
              description: 已绑定的企业微信；未绑定不返回本键。
            loginIpAllowlist:
              $ref: '#/components/schemas/LoginIpAllowlist'
              description: 登录 IP 白名单；空数组 = 不限。
    StaffCreate:
      type: object
      additionalProperties: false
      description: 邀请建号。
      required:
        - loginEmail
        - displayName
        - roleIds
        - dataScopeType
      properties:
        loginEmail:
          type: string
          format: email
          maxLength: 254
          description: 登录邮箱，邀请邮件发到这里。
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        firstName:
          type: string
          minLength: 1
          maxLength: 128
        lastName:
          type: string
          minLength: 1
          maxLength: 128
        phone:
          $ref: '#/components/schemas/Phone'
        jobTitle:
          type: string
          minLength: 1
          maxLength: 64
        roleIds:
          type: array
          minItems: 1
          description: 管理后台角色，取 `listStaffRoleOptions` 里 `assignable` 的。
          items:
            $ref: '#/components/schemas/RoleId'
        dataScopeType:
          $ref: '#/components/schemas/DataScopeType'
        partnerId:
          $ref: '#/components/schemas/PartnerId'
          description: 所属机构：`dataScopeType = partner` 时必填，其余范围不传。候选取自机构管理。
        loginIpAllowlist:
          $ref: '#/components/schemas/LoginIpAllowlist'
          description: 登录 IP 白名单；不传 = 不限。
    StaffUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 编辑账号，只传要改的；能清空的字段传 `null` 即清空。
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        firstName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 128
        lastName:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 128
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
        jobTitle:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
        loginEmail:
          type: string
          format: email
          maxLength: 254
          description: 新登录邮箱；已激活账号待当事人确认后生效。
        roleIds:
          type: array
          minItems: 1
          description: 整组换成这组管理后台角色。
          items:
            $ref: '#/components/schemas/RoleId'
        dataScopeType:
          $ref: '#/components/schemas/DataScopeType'
        partnerId:
          $ref: '#/components/schemas/PartnerId'
          description: 所属机构：范围（改后）为 `partner` 时必有；范围改为其他时不传，机构随之清空。
        loginIpAllowlist:
          $ref: '#/components/schemas/LoginIpAllowlist'
          description: 整组置换；空数组 = 不限。
    StaffRestoration:
      type: object
      additionalProperties: false
      description: 加回时重新指定的角色与数据范围。
      required:
        - roleIds
        - dataScopeType
      properties:
        roleIds:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoleId'
        dataScopeType:
          $ref: '#/components/schemas/DataScopeType'
        partnerId:
          $ref: '#/components/schemas/PartnerId'
          description: 所属机构：`dataScopeType = partner` 时必填，其余范围不传。
    StaffRoleOption:
      type: object
      additionalProperties: false
      required:
        - roleId
        - name
        - enabled
        - assignable
      properties:
        roleId:
          $ref: '#/components/schemas/RoleId'
        name:
          $ref: '#/components/schemas/RoleName'
        enabled:
          type: boolean
        assignable:
          type: boolean
          description: 操作者能否把它分配给别人：角色启用、且点集是操作者有效权限点的子集。
    SessionClient:
      type: string
      enum:
        - admin
        - merchant
      description: 会话来源：`admin` 管理后台 / `merchant` 商户后台（代登会话也是 `merchant`）。
    OnlineSession:
      type: object
      additionalProperties: false
      description: 一个在线会话。
      required:
        - sessionId
        - client
        - user
        - loginId
        - loginAt
      properties:
        sessionId:
          $ref: '#/components/schemas/AuthorizationId'
          readOnly: true
        client:
          $ref: '#/components/schemas/SessionClient'
        user:
          $ref: '#/components/schemas/UserRef'
          description: 会话所属账号；代登会话为被代的商户用户。
        loginId:
          $ref: '#/components/schemas/LoginId'
        loginAt:
          $ref: '#/components/schemas/Timestamp'
        impersonator:
          $ref: '#/components/schemas/UserRef'
          description: 代登人；仅代登会话返回。
        impersonatedMerchant:
          $ref: '#/components/schemas/MerchantBrief'
          description: 被代商户；仅代登会话返回。商户后台普通会话不标商户。
    LoginLogResult:
      type: string
      enum:
        - SUCCESS
        - BAD_CREDENTIAL
        - BAD_OTP
        - LOCKED
        - DISABLED
        - NOT_ADMITTED
        - IP_NOT_ALLOWED
        - EMAIL_NOT_VERIFIED
        - NO_ACCESS
        - THROTTLED
        - LOGOUT
      description: |
        登录结果：

        - `SUCCESS`：登录成功。
        - `BAD_CREDENTIAL`：密码错，含登录名不存在的那次（此时没有账号）。
        - `BAD_OTP`：动态码错。
        - `LOCKED`：触发锁定的那次失败，及锁定期内的后续尝试。
        - `DISABLED`：账号已停用。
        - `NOT_ADMITTED`：发起 client 的登录准入回调判不准入。
        - `IP_NOT_ALLOWED`：来源 IP 不在该账号的登录 IP 白名单。
        - `EMAIL_NOT_VERIFIED`：密码正确但登录邮箱尚未验证。
        - `NO_ACCESS`：账号没有管理后台角色。
        - `THROTTLED`：登录名不存在、且同一登录名短时间内失败过多被拒（此时没有账号）。
        - `LOGOUT`：主动登出。
    LoginLogEntry:
      type: object
      additionalProperties: false
      description: 一行登录日志。
      required:
        - logId
        - occurredAt
        - result
        - loginMethod
      properties:
        logId:
          type: integer
          minimum: 1
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        user:
          $ref: '#/components/schemas/UserRef'
          description: 尝试登录的账号；登录名不存在时不返回本键。
        result:
          $ref: '#/components/schemas/LoginLogResult'
        loginMethod:
          type: string
          enum:
            - password
            - wecom
          description: '`password` 密码登录 / `wecom` 企业微信扫码登录。'
        loginIp:
          type: string
          minLength: 1
          maxLength: 45
          description: 来源 IP；扫码登录与登出行不返回本键。
        userAgent:
          type: string
          minLength: 1
          maxLength: 512
          description: 浏览器 UA；扫码登录与登出行不返回本键。
    Role:
      type: object
      additionalProperties: false
      description: 一个管理后台角色。
      required:
        - roleId
        - name
        - enabled
        - version
        - privileges
      properties:
        roleId:
          $ref: '#/components/schemas/RoleId'
          readOnly: true
        name:
          $ref: '#/components/schemas/RoleName'
        enabled:
          type: boolean
          description: 停用的角色不给持有者带来任何权限点。
        version:
          type: integer
          minimum: 0
          readOnly: true
          description: 写入用的版本；`updateRole` 带上它。
        privileges:
          type: array
          description: 角色的点集。
          items:
            $ref: '#/components/schemas/PrivilegeId'
    RoleUpdate:
      type: object
      additionalProperties: false
      required:
        - version
      minProperties: 2
      description: '`version` 必带，其余只传要改的。'
      properties:
        version:
          type: integer
          minimum: 0
          description: 读到的版本。
        name:
          $ref: '#/components/schemas/RoleName'
        enabled:
          type: boolean
        privileges:
          type: array
          description: 整组置换的点集；空数组 = 清空。
          items:
            $ref: '#/components/schemas/PrivilegeId'
    MerchantRole:
      type: object
      additionalProperties: false
      description: 一个商户后台或终端预设角色。
      required:
        - roleId
        - name
        - version
        - privileges
      properties:
        roleId:
          $ref: '#/components/schemas/RoleId'
          readOnly: true
        name:
          $ref: '#/components/schemas/RoleName'
        version:
          type: integer
          minimum: 0
          readOnly: true
          description: 写入用的版本；`updateMerchantRole` 带上它。
        privileges:
          type: array
          description: 角色的点集。
          items:
            $ref: '#/components/schemas/PrivilegeId'
    ResourceNode:
      type: object
      additionalProperties: false
      description: 资源目录的一个节点。
      required:
        - resourceId
        - resourceType
        - name
        - sortOrder
        - enabled
      properties:
        resourceId:
          $ref: '#/components/schemas/ResourceId'
          readOnly: true
        resourceType:
          type: string
          enum:
            - directory
            - action
          readOnly: true
          description: '`directory` 目录（只作分组）/ `action` 操作点；只有操作点可勾给角色。'
        parentResourceId:
          $ref: '#/components/schemas/ResourceId'
          description: 上级节点；顶层节点不返回本键。
        name:
          type: string
          minLength: 1
          maxLength: 128
          description: 菜单与功能名，只供授权界面展示。
        sortOrder:
          type: integer
          description: 同级排序。
        enabled:
          type: boolean
          description: 停用的操作点不可勾给角色。
    ResourceList:
      type: object
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceNode'
    AccessGrantStatus:
      type: string
      enum:
        - ACTIVE
        - EXPIRED
        - REVOKED
      description: '`ACTIVE` 生效中 / `EXPIRED` 已到期 / `REVOKED` 已撤销。'
    AccessGrantRequest:
      type: object
      additionalProperties: false
      required:
        - merchantId
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
    AccessGrantCandidate:
      type: object
      additionalProperties: false
      description: 一个可自助申请临时授权的范围外商户。
      required:
        - merchantId
        - merchantCode
        - requestable
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        tradeName:
          type: string
          minLength: 1
          description: 对外经营名；还没填过时不返回本键。
        requestable:
          type: boolean
          description: 能否申请；`false` = 本人已持该商户生效中的临时授权。
    AccessGrant:
      type: object
      additionalProperties: false
      description: 一条跨范围临时授权。
      required:
        - grantId
        - user
        - merchant
        - status
        - grantedAt
        - expiresAt
        - grantedBy
      properties:
        grantId:
          $ref: '#/components/schemas/AccessGrantId'
          readOnly: true
        user:
          $ref: '#/components/schemas/UserRef'
          description: 被授权的后台用户。
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        status:
          $ref: '#/components/schemas/AccessGrantStatus'
        grantedAt:
          $ref: '#/components/schemas/Timestamp'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        grantedBy:
          $ref: '#/components/schemas/UserRef'
          description: 授权人；自助申请为本人。
        revokedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 仅 `REVOKED` 时返回。
        revokedBy:
          $ref: '#/components/schemas/UserRef'
          description: 仅 `REVOKED` 时返回。
    RoleId:
      type: string
      minLength: 1
      maxLength: 32
      description: 角色标识。
    PartnerId:
      type: string
      minLength: 1
      maxLength: 32
      description: 机构标识。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    LoginId:
      type: string
      minLength: 1
      maxLength: 254
      description: 登录名：用户名或邮箱。新建或修改登录名时：符合邮箱格式的按邮箱处理；其余为用户名，须为去首尾空白后 1–64 个字符、不含空白与 `@`，比较不区分大小写、按输入的大小写保存。登录时按已保存的登录名匹配，不套这条形状规则（早期账号的用户名可能不满足它）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    Phone:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      maxLength: 16
      description: 电话号码，**国际格式整串**（`+` + 国家码 + 正文号，如 `+16045550123`）——**一个字段装完，没有独立的区号字段**。 上界 16 = `+` 加最多 15 位数字（国际号码总长上限）；**服务端只校验这一条通用规则 + 区号在白名单内**， **不按区号分别限长**。前端按所选区号收窄输入位数属输入体验、不是契约约束。 渲染「区号下拉 + 号码框」两个控件时，用前端参考数据里的区号表做**最长前缀匹配**拆分本串。
    LoginIpAllowlist:
      type: array
      maxItems: 64
      description: |
        登录 IP 白名单：每项是一个 IPv4 地址或 CIDR（如 `10.0.0.8`、`10.0.0.0/24`）；空数组 = 不限来源 IP。

        各项以英文逗号连接后总长不超过 512 字符（超出 → `400`）。条数上限 64 = 512 字符按最短一项 `1.1.1.1` 加分隔逗号 8 字符推得。顺序即展示顺序；重复项保存时合并。
      items:
        type: string
        pattern: ^(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])(\.(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])){3}(/(3[0-2]|[12]?[0-9]))?$
        examples:
          - 10.0.0.0/24
    WechatBindingSummary:
      type: object
      additionalProperties: false
      description: 微信登录绑定的摘要。
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          description: 绑定微信的昵称展示快照（绑定时写入；拿不到昵称时为通用展示名，故恒非空）。
    ResendCooldown:
      type: object
      description: 只回重发冷却秒数。
      required:
        - cooldownSeconds
      properties:
        cooldownSeconds:
          type: integer
          minimum: 0
          readOnly: true
          description: 重发冷却秒数（部署可配）；前端从收到响应起本地倒计时。
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    UserRef:
      type: object
      additionalProperties: false
      description: 一个平台用户的标识与显示名（列表与记录上展示「谁」）。
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
    MerchantBrief:
      type: object
      additionalProperties: false
      description: 一个商户的标识与名称（列表与记录上展示「哪个商户」）。
      required:
        - merchantId
        - merchantName
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantName:
          type: string
          minLength: 1
    AuthorizationId:
      type: string
      minLength: 1
      maxLength: 100
      description: 授权会话标识。
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    MerchantCode:
      type: string
      minLength: 1
      maxLength: 20
      description: 对外商户码。
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
