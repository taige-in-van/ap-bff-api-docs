      summary: 收窄一个入口可用的支付方式族
      description: |
        `paymentMethodFamilies` 是该入口要用的支付方式族的完整集合，没列的族在该入口停用；空数组 = 全部停用。只做收窄，商户未签约的族列进来也不会因此可用。不改入口是否开通。

        置值写，不挂幂等键。
      parameters:
