      description: |
        **全量覆盖**：请求体就是目标开关态。规则同商户自助：停用即不可受理、凭据保留，启用后恢复。与现状相同同样返回 `204`。天然幂等，不挂幂等键。

        **什么时候拒绝**：

        - `308409` 待激活的设备不能停用或启用。
