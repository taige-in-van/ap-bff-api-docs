  /merchants/{merchantId}/acquiring-parameters/{key}:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
      - name: key
        in: path
        required: true
        description: 参数标识，取列表里的 `key`。
        schema:
          $ref: '#/components/schemas/AcquiringParameterKey'
    put:
      tags:
        - settings
      operationId: updateMerchantAcquiringParameter
      x-required-privilege: chcfg:setting:edit
      summary: 改一个商户级收单参数的值，或恢复默认
      description: |
        把这个参数在该商户上的值设为 `value`；`value` 传 `null` 即恢复默认。对此后的判定生效。

        **全量覆盖**：请求体就是目标本身，`value` 与 `version` 都要传，缺省不代表保持原样。`version` 原样带回列表里读到的值；部分参数后写覆盖先写、`version` 恒为 0，不做比对。

        **什么时候拒绝**：

        - `308408` `version` 不是读到时的那个（别人已经改过），重读列表再决定是否重改。
        - `value` 的类型或取值不合该参数的值域 → `400`，由 `details` 定位到 `value`。
        - 参数不存在或不允许代配 → `404`。

        **重复提交**：不带幂等键。上一次其实已经成功、响应丢了再提交，可能因版本已变得到 `308408`，重读即可看到上次写入的值。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcquiringParameterWrite'
            examples:
              setValue:
                summary: 改值
                value:
                  value:
                    booleanValue: true
                  version: 0
              restoreDefault:
                summary: 恢复默认
                value:
                  value: null
                  version: 3
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308408
