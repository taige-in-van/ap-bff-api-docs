      description: |
        店铺码收款页的付款人采集项、收款页说明与收款页支付方式，规则同商户在商户后台的收款页设置。`checkoutOptionCandidates` 是可选的支付方式候选，`opened` 为否的未开通、不能新加。Logo 由商户自己维护，本面只读。

        商户还没保存过时，采集项按当时的系统目录给出。小费另见 `getMerchantTipSettings`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPageSettings'
              example:
                logoUrl: https://cdn.example.com/core/payment-page-logo/2026/08/4e7a2c18b93d40f5a06c8b1e57d29f43.png
                payerInputs:
                  - key: sys:name
                    label: 姓名
                    system: true
                    mandatory: false
                  - key: sys:notes
                    label: 备注
                    system: true
                    mandatory: false
                  - key: 桌号
                    label: 桌号
                    system: false
                    mandatory: false
                inputLimit: 10
                description: 欢迎光临
                checkoutOptions:
                  - wechat
                  - alipay
                checkoutOptionCandidates:
                  - checkoutOption: wechat
                    displayName: WeChat Pay
                    opened: true
                  - checkoutOption: alipay
                    displayName: Alipay
                    opened: true
                  - checkoutOption: card
                    displayName: Credit Card
                    opened: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - settings
      operationId: updateMerchantPaymentPageSettings
      x-required-privilege: chcfg:setting:edit
      summary: 代配店铺码收款页
      description: |
        **全量覆盖**：三项都要传。

        - `payerInputKeys`：保留下来的采集项，按 `key` 给全；读回来的项要留的放它的 `key`，新加的自撰项放它的标题。系统项的文案与必填性以服务端为准，这里只表达留不留。合计不超过 `inputLimit` 项，自撰标题不超过 10 字符。顺序即付款人页面的展示顺序。
        - `checkoutOptions`：至少 1 项，整组置换。新加的项须是候选里 `opened` 为是的；已选着、后来停用的项可以原样带回。

        置值写，同样的请求体重发结果不变，不挂幂等键。

        **什么时候拒绝**：

        - `308411` 新加的支付方式在该商户下未开通。
        - `308412` 采集项缺了必填项，或自撰标题以 `sys:` 开头、重复。
        - 项数或标题长度超限、`checkoutOptions` 为空 → `400`，`details` 定位字段。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPageSettingsWrite'
            example:
              payerInputKeys:
                - sys:name
                - sys:notes
                - 桌号
              description: 欢迎光临
              checkoutOptions:
                - wechat
                - alipay
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308411
        - 308412
