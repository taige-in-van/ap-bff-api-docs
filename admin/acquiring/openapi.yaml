  /merchants/{merchantId}/developer/credential-reissuance:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    post:
      tags:
        - developer
      operationId: reissueMerchantApiCredential
      x-required-privilege: chcfg:credential:create
      summary: 重置商户 API 凭证
      description: |
        为该商户签发新的 API 凭证。旧凭证在宽限期内仍可用，之后失效；商户在商户后台开发者页查看新凭证，运营看不到全文。前端须先弹二次确认，提示「旧凭证将在宽限期后失效」，确认后再调。

        商户还没有签发过凭证（未激活）→ `404`。幂等基准：`Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: 已签发新凭证
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  parameters:
    MerchantIdPath:
      name: merchantId
      in: path
      required: true
      description: 商户标识。商户在本人数据范围外或已关户 → `404`。
      schema:
        $ref: '#/components/schemas/MerchantId'
    ContractIdPath:
      name: contractId
      in: path
      required: true
      description: 签约标识，取总览里的 `contractId`。不是该商户的生效签约 → `404`。
      schema:
        $ref: '#/components/schemas/ContractId'
    EntryPointPath:
      name: entryPoint
      in: path
      required: true
      description: 受理入口，取列表里的 `entryPoint`。
      schema:
        $ref: '#/components/schemas/AcquiringEntryPoint'
    DeviceIdPath:
      name: deviceId
      in: path
      required: true
      description: 设备号。不属该商户 → `404`。
      schema:
        $ref: '#/components/schemas/DeviceId'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  schemas:
    ContractId:
      type: string
      minLength: 1
      maxLength: 32
      description: 签约标识。
    ChannelId:
      type: string
      minLength: 1
      maxLength: 32
      description: 通道标识。
    ChannelApplicationId:
      type: string
      minLength: 1
      maxLength: 32
      description: 报备标识。
    SubAppId:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户自有应用的标识（appid）。
    Mcc:
      type: string
      pattern: ^[0-9]{4}$
      description: 四位 MCC。
    PercentageRate:
      type: string
      pattern: ^[0-9]+(\.[0-9]{1,6})?$
      description: 比例费率，小数（`"0.022"` = 2.2%）。
      examples:
        - '0.022'
    FixedFee:
      type: string
      pattern: ^[0-9]+$
      description: 固定单笔费，商户结算币种的最小单位整数串（`"30"` = 0.30），不带币种；没有固定费为 `"0"`。
      examples:
        - '30'
    ChannelBrief:
      type: object
      additionalProperties: false
      description: 一个通道的标识与展示信息。
      required:
        - channelId
        - channelName
        - channelMerchantId
      properties:
        channelId:
          $ref: '#/components/schemas/ChannelId'
        channelName:
          type: string
          minLength: 1
          description: 通道名。
        channelMerchantId:
          type: string
          minLength: 1
          description: 通道商户号（服务商号）。
    SignableChannel:
      type: object
      additionalProperties: false
      description: 加支付方式时可选的一个通道。
      required:
        - channelId
        - channelName
        - channelMerchantId
        - applicationRequired
      properties:
        channelId:
          $ref: '#/components/schemas/ChannelId'
        channelName:
          type: string
          minLength: 1
          description: 通道名。
        channelMerchantId:
          type: string
          minLength: 1
          description: 通道商户号（服务商号）。
        applicationRequired:
          type: boolean
          description: 该通道是否要报备才能拿到子商户号；为是的才可填子商户号，为否的（子商户号按规则生成或不需要）不能填。
    StandardFeeRate:
      type: object
      additionalProperties: false
      description: 标准费率：该支付方式在商户结算币种下给新签约商户的默认价。
      required:
        - percentageRate
        - fixedFee
      properties:
        percentageRate:
          $ref: '#/components/schemas/PercentageRate'
        fixedFee:
          $ref: '#/components/schemas/FixedFee'
    ChannelApplicationType:
      type: string
      enum:
        - maintain
        - h5_authorization
      description: 报备类型：`maintain` 子商户进件 / 资料修改（含支付宝二级商户报备、Alipay+ 报备）/ `h5_authorization` 微信 H5 支付权限。
    ChannelApplicationStatus:
      type: string
      enum:
        - UNDER_REVIEW
        - APPROVED
        - REJECTED
      description: 报备结果：`UNDER_REVIEW` 审核中 / `APPROVED` 成功 / `REJECTED` 失败。
    ChannelApplication:
      type: object
      additionalProperties: false
      description: 一类报备的最近一次记录。
      required:
        - channelApplicationId
        - applicationType
        - status
        - channelStatus
        - submittedAt
      properties:
        channelApplicationId:
          $ref: '#/components/schemas/ChannelApplicationId'
        applicationType:
          $ref: '#/components/schemas/ChannelApplicationType'
        status:
          $ref: '#/components/schemas/ChannelApplicationStatus'
        channelStatus:
          type: string
          minLength: 1
          description: 通道给的状态原值，供排查。
        rejectReason:
          type: string
          minLength: 1
          description: 通道给的拒绝原因；没有不返回本键。
        submittedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 提交时刻。
        decidedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 通道给出结果的时刻；审核中不返回本键。
        authorizationState:
          type: string
          minLength: 1
          description: 通道给的授权状态原值；只微信 H5 支付权限有，其余不返回本键。
        limitType:
          type: string
          enum:
            - normal
            - unlimited
          description: 上次提交的限额档；只我方提交过的微信 H5 支付权限记录有，其余不返回本键。重提时据此预填。
        websiteState:
          type: string
          enum:
            - launched
            - not_launched
          description: 上次提交时的网站状态；返回条件同 `limitType`。
        businessDescription:
          type: string
          minLength: 1
          description: 上次提交的业务说明；没提交过不返回本键。
        businessLicenseFileId:
          $ref: '#/components/schemas/FileId'
          description: 上次提交另传的营业执照；取的是入驻证照时不返回本键。
        websiteHomepageScreenshotFileIds:
          type: array
          minItems: 1
          description: 上次提交的网站首页截图；没提交过不返回本键。
          items:
            $ref: '#/components/schemas/FileId'
        websiteBusinessPageScreenshotFileIds:
          type: array
          minItems: 1
          description: 上次提交的网站业务页截图；没提交过不返回本键。
          items:
            $ref: '#/components/schemas/FileId'
    SubAppType:
      type: string
      enum:
        - official_account
        - mini_program
        - mobile_app
      description: 商户自有应用类型：`official_account` 公众号 / `mini_program` 小程序 / `mobile_app` 移动应用。
    SubApp:
      type: object
      additionalProperties: false
      description: 一个已登记的线上平台标识。
      required:
        - appId
        - appType
      properties:
        appId:
          $ref: '#/components/schemas/SubAppId'
        appType:
          $ref: '#/components/schemas/SubAppType'
    MerchantChannelContract:
      type: object
      additionalProperties: false
      description: 一个支付方式的生效签约。
      required:
        - contractId
        - paymentMethod
        - channel
        - enabled
        - merchantEnabled
        - applicationRequired
        - subApps
        - applications
        - updatedAt
      properties:
        contractId:
          $ref: '#/components/schemas/ContractId'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        channel:
          $ref: '#/components/schemas/ChannelBrief'
        subMerchantId:
          type: string
          minLength: 1
          maxLength: 64
          description: 子商户号；尚未就位不返回本键。
        mcc:
          $ref: '#/components/schemas/Mcc'
          description: MCC；没设不返回本键。
        enabled:
          type: boolean
          description: 运营启停。
        merchantEnabled:
          type: boolean
          description: 商户在商户后台对该支付方式的开关。
        applicationRequired:
          type: boolean
          description: 该签约的通道是否要报备才能拿到子商户号；为是且没有子商户号时，待报备成功或录入子商户号后才能启用。
        expressPayEnabled:
          type: boolean
          description: 银联 Express 开关；只银联在线签约返回本键。
        subApps:
          type: array
          description: 已登记的线上平台标识；没有为空数组。
          items:
            $ref: '#/components/schemas/SubApp'
        applications:
          type: array
          description: 各类报备的最近一次记录，每类至多一条；从未报备为空数组。
          items:
            $ref: '#/components/schemas/ChannelApplication'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 签约最近一次修改的时刻，精确到微秒（如 `2026-10-16T08:00:00.123456Z`）；改签约时原样带回，不要截断或重新格式化，否则会被当作他人已改过。
    SignableMethod:
      type: object
      additionalProperties: false
      description: 一个尚未签约、可以加的支付方式。
      required:
        - paymentMethod
        - channels
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        channels:
          type: array
          minItems: 1
          description: 可选的通道。
          items:
            $ref: '#/components/schemas/SignableChannel'
        standardRate:
          $ref: '#/components/schemas/StandardFeeRate'
          description: 该方式的标准费率；没有不返回本键。
    MerchantChannelContractList:
      type: object
      additionalProperties: false
      required:
        - items
        - availableMethods
      properties:
        items:
          type: array
          description: 生效签约，按支付方式目录顺序。
          items:
            $ref: '#/components/schemas/MerchantChannelContract'
        availableMethods:
          type: array
          description: 可以加的支付方式；没有为空数组。
          items:
            $ref: '#/components/schemas/SignableMethod'
    MerchantChannelContractCreate:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - channelId
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        channelId:
          $ref: '#/components/schemas/ChannelId'
          description: 取 `availableMethods` 里该方式的 `channels`。
        subMerchantId:
          type: string
          minLength: 1
          maxLength: 64
          description: 子商户号；只有需要报备的通道可传，不传 = 待报备回写。
        mcc:
          $ref: '#/components/schemas/Mcc'
          description: MCC；不传 = 不设。
        feeRate:
          $ref: '#/components/schemas/FeeRateWrite'
          description: 该支付方式的费率；传了即按它写新费率并截断当前费率，不传时已有当前费率的沿用、没有的取标准费率。
    MerchantChannelContractCreated:
      type: object
      additionalProperties: false
      required:
        - contractId
        - enabled
      properties:
        contractId:
          $ref: '#/components/schemas/ContractId'
        enabled:
          type: boolean
          description: 建成后是否已启用：子商户号已就位即为是，待报备的为否。
    MerchantChannelContractUpdate:
      type: object
      additionalProperties: false
      required:
        - updatedAt
      minProperties: 2
      description: 改签约，只传要改的，并带读到的 `updatedAt`。
      properties:
        enabled:
          type: boolean
          description: 运营启停。
        subMerchantId:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 64
          description: 子商户号；只有需要报备的通道上的签约可传，`null` = 清空，签约随之停用。
        mcc:
          oneOf:
            - $ref: '#/components/schemas/Mcc'
            - type: 'null'
          description: MCC；`null` = 清空。
        expressPayEnabled:
          type: boolean
          description: 银联 Express 开关；只银联在线签约可带。
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 读到的 `updatedAt`，原样带回（含微秒）。
    AcquiringEntryPoint:
      allOf:
        - $ref: '#/components/schemas/EntryPoint'
      enum:
        - checkout
        - open_api
        - pos
        - merchant_app
        - plugin_shopify
        - plugin_allvalue
        - plugin_allvalue_xhs
      description: 可开关的受理入口：`checkout` 店铺码与收银台页面 / `open_api` 开放 API / `pos` 终端 / `merchant_app` 商户 App / `plugin_shopify` Shopify / `plugin_allvalue` AllValue / `plugin_allvalue_xhs` AllValue 小红书。
    MerchantEntryPoint:
      type: object
      additionalProperties: false
      required:
        - entryPoint
        - enabled
      properties:
        entryPoint:
          $ref: '#/components/schemas/AcquiringEntryPoint'
        enabled:
          type: boolean
          description: 是否开通。
        paymentMethodFamilies:
          type: array
          description: 收窄后该入口可用的支付方式族；未收窄不返回本键。
          items:
            $ref: '#/components/schemas/PaymentMethodFamily'
    FeeRateId:
      type: string
      minLength: 1
      maxLength: 32
      description: 费率行标识。
    MerchantFeeRate:
      type: object
      additionalProperties: false
      description: 一条费率（一个生效窗）。
      required:
        - feeRateId
        - paymentMethod
        - percentageRate
        - fixedFee
        - effectiveFrom
        - current
      properties:
        feeRateId:
          $ref: '#/components/schemas/FeeRateId'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        entryPoint:
          $ref: '#/components/schemas/FeeRateEntryPoint'
          description: 插件入口专用行的入口；通用行不返回本键。
        percentageRate:
          $ref: '#/components/schemas/PercentageRate'
        fixedFee:
          $ref: '#/components/schemas/FixedFee'
        fixedFeeWaivedUntil:
          $ref: '#/components/schemas/LocalDate'
          description: 固定费免收截止日（含当日）；不免不返回本键。
        effectiveFrom:
          $ref: '#/components/schemas/LocalDate'
          description: 生效首日。
        effectiveTo:
          $ref: '#/components/schemas/LocalDate'
          description: 失效日：这一天起不再生效，最后生效日是它的前一天；没有止期不返回本键。
        current:
          type: boolean
          description: 是否今天生效的那一行。
    StandardFeeRateItem:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - percentageRate
        - fixedFee
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        percentageRate:
          $ref: '#/components/schemas/PercentageRate'
        fixedFee:
          $ref: '#/components/schemas/FixedFee'
    MerchantFeeRateList:
      type: object
      additionalProperties: false
      required:
        - items
        - standardRates
      properties:
        items:
          type: array
          description: 按支付方式、入口、生效首日排列。
          items:
            $ref: '#/components/schemas/MerchantFeeRate'
        standardRates:
          type: array
          description: 该商户结算币种下的标准费率，只读。
          items:
            $ref: '#/components/schemas/StandardFeeRateItem'
    MerchantFeeRateCreate:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - rate
        - effectiveFrom
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        entryPoint:
          $ref: '#/components/schemas/FeeRateEntryPoint'
          description: 写插件入口专用行时给；不传 = 通用行。
        rate:
          $ref: '#/components/schemas/FeeRateWrite'
        effectiveFrom:
          $ref: '#/components/schemas/LocalDate'
          description: 生效首日。
    FeeRateIssueType:
      type: string
      enum:
        - no_effective_rate
        - expiring
        - pending_setup
      description: 问题类型：`no_effective_rate` 无生效费率 / `expiring` 即将到期 / `pending_setup` 申请开通的支付方式待签约。
    PendingSetupReason:
      type: string
      enum:
        - no_candidate_channel
        - single_candidate_channel
        - multiple_candidate_channels
      description: 待签约的原因：`no_candidate_channel` 商户结算币种下没有可签的通道 / `single_candidate_channel` 恰有一个可签的通道，可直接加上 / `multiple_candidate_channels` 有多个可选通道、系统不自动选。
    FeeRateIssue:
      type: object
      additionalProperties: false
      description: 清单的一行。
      required:
        - merchant
        - paymentMethod
        - issueType
      properties:
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        entryPoint:
          $ref: '#/components/schemas/FeeRateEntryPoint'
          description: 插件入口专用行的入口；通用行不返回本键。
        issueType:
          $ref: '#/components/schemas/FeeRateIssueType'
        effectiveTo:
          $ref: '#/components/schemas/LocalDate'
          description: 当前费率的失效日；只 `expiring` 返回本键。
        pendingReason:
          $ref: '#/components/schemas/PendingSetupReason'
          description: 待签约的原因；只 `pending_setup` 返回本键。
    CsfScene:
      type: string
      enum:
        - pos
        - merchant_app
        - store_qr_page
        - invoice_page
        - payment_link
        - retail_api
        - online_api
      description: 客户服务费的收款场景：`pos` 终端 / `merchant_app` 商户 App / `store_qr_page` 店铺码 / `invoice_page` 账单 / `payment_link` 链接 / `retail_api` 线下开放 API / `online_api` 线上开放 API。
    CsfCoverage:
      type: object
      additionalProperties: false
      description: 客户服务费不加收的范围；没列的照加。
      required:
        - excludedScenes
        - excludedPaymentMethods
      properties:
        excludedScenes:
          type: array
          uniqueItems: true
          description: 不加收的场景。
          items:
            $ref: '#/components/schemas/CsfScene'
        excludedPaymentMethods:
          type: array
          uniqueItems: true
          description: 不加收的支付方式。
          items:
            $ref: '#/components/schemas/PaymentMethod'
    EscrowReleaseClearingDays:
      type: integer
      minimum: 2
      maximum: 10
      description: 电商托管结算锁释放期，清算日数。
    MerchantSettlementTerms:
      type: object
      additionalProperties: false
      required:
        - billingModel
        - refundFeeReturnable
        - customerServiceFeeEnabled
        - csfCoverage
        - appSubscriptionEnabled
      properties:
        billingModel:
          $ref: '#/components/schemas/BillingModel'
        refundFeeReturnable:
          type: boolean
          description: 退款时是否退还原支付手续费。
        customerServiceFeeEnabled:
          type: boolean
          description: 客户服务费总开关。
        csfCoverage:
          $ref: '#/components/schemas/CsfCoverage'
        appSubscriptionEnabled:
          type: boolean
          description: APP 订阅开关。
        escrowReleaseClearingDays:
          $ref: '#/components/schemas/EscrowReleaseClearingDays'
          description: 该商户设的释放期；没设不返回本键，即用平台默认。
    MerchantSettlementTermsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 改计费条款，只传要改的。
      properties:
        billingModel:
          $ref: '#/components/schemas/BillingModel'
        refundFeeReturnable:
          type: boolean
        customerServiceFeeEnabled:
          type: boolean
        appSubscriptionEnabled:
          type: boolean
        escrowReleaseClearingDays:
          oneOf:
            - $ref: '#/components/schemas/EscrowReleaseClearingDays'
            - type: 'null'
          description: 释放期；`null` = 用平台默认。
    AcquiringParameterKey:
      type: string
      minLength: 1
      maxLength: 128
      description: 参数标识，按所属业务分前缀（如 `refund.enabled`）。
    MerchantAcquiringParameter:
      type: object
      additionalProperties: false
      description: 一个商户级收单参数。
      required:
        - key
        - displayName
        - valueType
        - version
      properties:
        key:
          $ref: '#/components/schemas/AcquiringParameterKey'
        displayName:
          type: string
          minLength: 1
          description: 参数的展示名。
        valueType:
          type: string
          enum:
            - string
            - number
            - boolean
            - number_list
          description: 值的类型，决定编辑控件与提交时用哪个槽位。
        valueRangeNote:
          type: string
          minLength: 1
          description: 值域说明；没有值域限制时不返回。
        defaultValue:
          allOf:
            - $ref: '#/components/schemas/ParameterValue'
          description: 默认值；默认为不设（无值）时不返回本键。
        value:
          allOf:
            - $ref: '#/components/schemas/ParameterValue'
          description: 该商户设过的值；没设过时不返回本键，即当前用的是默认值。
        effectiveValue:
          allOf:
            - $ref: '#/components/schemas/ParameterValue'
          description: 当前生效值；默认为不设且没设过时不返回本键。
        version:
          type: integer
          minimum: 0
          description: 写入用的版本，改值时原样带回；该商户从没设过值、或该参数不做版本比对时为 0。
    AcquiringParameterWrite:
      type: object
      additionalProperties: false
      required:
        - value
        - version
      properties:
        value:
          oneOf:
            - $ref: '#/components/schemas/ParameterValue'
            - type: 'null'
          description: 新值；传 `null` = 恢复默认。
        version:
          type: integer
          minimum: 0
          description: 读到时的 `version`。
    CrossRefundPolicyWrite:
      type: object
      additionalProperties: false
      required:
        - parentRefundChildEnabled
        - siblingRefundEnabled
      properties:
        parentRefundChildEnabled:
          type: boolean
          description: 父商户可退子商户的订单。
        siblingRefundEnabled:
          type: boolean
          description: 子商户之间可互退订单。
    CrossRefundPolicy:
      type: object
      additionalProperties: false
      description: 跨主子退款两开关，另带是否父商户。
      required:
        - parentRefundChildEnabled
        - siblingRefundEnabled
        - isParent
      properties:
        parentRefundChildEnabled:
          type: boolean
          description: 父商户可退子商户的订单。
        siblingRefundEnabled:
          type: boolean
          description: 子商户之间可互退订单。
        isParent:
          type: boolean
          description: 名下是否有子商户。
    ReceiptLines:
      type: array
      description: 一段文本行，顺序即打印顺序；所有行合计不超过 200 字符。空数组 = 不打该段。
      items:
        type: string
        minLength: 1
        maxLength: 200
    ReceiptSettings:
      type: object
      additionalProperties: false
      required:
        - headerLines
        - footerLines
        - orderCodeType
      properties:
        headerLines:
          $ref: '#/components/schemas/ReceiptLines'
        footerLines:
          $ref: '#/components/schemas/ReceiptLines'
        orderCodeType:
          type: string
          enum:
            - qr_code
            - bar_code
          description: 小票上订单号的码制：`qr_code` 二维码 / `bar_code` 条形码（装不下长订单号时终端回退二维码）。
    PayerInputKey:
      type: string
      minLength: 1
      maxLength: 64
      description: 采集项的数据键：系统项是带 `sys:` 前缀的稳定值，商户自撰项就是其标题（不超过 10 字符、不能以 `sys:` 开头）。
    PayerInputEntry:
      type: object
      additionalProperties: false
      description: 收款页的一个采集项。`system` 管文案能不能改，`mandatory` 管能不能删，两者互不推导。
      required:
        - key
        - label
        - system
        - mandatory
      properties:
        key:
          $ref: '#/components/schemas/PayerInputKey'
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: 展示标题。
        system:
          type: boolean
          description: 是否系统给出的项（文案不可改）。
        mandatory:
          type: boolean
          description: 是否必填；必填即不可删。
    CheckoutOptionCandidate:
      type: object
      additionalProperties: false
      required:
        - checkoutOption
        - displayName
        - opened
      properties:
        checkoutOption:
          $ref: '#/components/schemas/CheckoutOption'
        displayName:
          type: string
          minLength: 1
        opened:
          type: boolean
          description: 该商户是否已开通（该项下至少一个支付方式已开通）。
    PaymentPageSettings:
      type: object
      additionalProperties: false
      description: 店铺码收款页设置（各个码共用一份）。
      required:
        - payerInputs
        - inputLimit
        - checkoutOptions
        - checkoutOptionCandidates
      properties:
        logoUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 付款人看到的 Logo；没有不返回本键。
        payerInputs:
          type: array
          description: 向付款人收的采集项；空数组 = 不采集。
          items:
            $ref: '#/components/schemas/PayerInputEntry'
        inputLimit:
          type: integer
          minimum: 1
          description: 采集项最多几项，系统项与自撰项合计。
        description:
          type: string
          maxLength: 300
          description: 收款页附加说明；没有不返回本键。
        checkoutOptions:
          type: array
          description: 已选的支付方式，可能含后来停用的项（付款人看不到，重新开通后恢复）。
          items:
            $ref: '#/components/schemas/CheckoutOption'
        checkoutOptionCandidates:
          type: array
          description: 支付方式候选，顺序即展示顺序。
          items:
            $ref: '#/components/schemas/CheckoutOptionCandidate'
    PaymentPageSettingsWrite:
      type: object
      additionalProperties: false
      required:
        - payerInputKeys
        - description
        - checkoutOptions
      properties:
        payerInputKeys:
          type: array
          description: 保留下来的采集项的键，顺序即展示顺序；空数组 = 不采集。
          items:
            $ref: '#/components/schemas/PayerInputKey'
        description:
          type:
            - string
            - 'null'
          maxLength: 300
          description: 收款页附加说明；`null` = 不设。
        checkoutOptions:
          type: array
          minItems: 1
          description: 选用的支付方式，整组置换。
          items:
            $ref: '#/components/schemas/CheckoutOption'
    TipSettings:
      type: object
      additionalProperties: false
      required:
        - enabled
        - presets
      properties:
        enabled:
          type: boolean
          description: 是否开启小费。
        presets:
          type: array
          minItems: 3
          maxItems: 3
          description: 三档预设小费，整数百分比、每档 0–30。
          items:
            type: integer
            minimum: 0
            maximum: 30
    StoreQrcode:
      type: object
      additionalProperties: false
      description: 店铺码的一个码（只读）。
      required:
        - currency
        - qrType
        - qrContent
        - methods
      properties:
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: 标价币种。
        qrType:
          $ref: '#/components/schemas/StoreQrType'
        qrContent:
          type: string
          minLength: 1
          description: 码的内容，物料按它生成。
        methods:
          type: array
          description: 该码可受理的支付方式；银联码等不经收银台的码为空数组。
          items:
            $ref: '#/components/schemas/PaymentMethod'
    InvoiceStatus:
      type: string
      enum:
        - UNPAID
        - PAID
        - OVERDUE
      description: '`UNPAID` 未付 / `PAID` 已付 / `OVERDUE` 逾期（未付且已过到期日）。'
    MerchantInvoice:
      type: object
      additionalProperties: false
      required:
        - invoiceNo
        - amount
        - status
        - createdAt
        - paymentUrl
      properties:
        invoiceNo:
          $ref: '#/components/schemas/InvoiceNo'
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        dueDate:
          $ref: '#/components/schemas/LocalDate'
          description: 到期日；没有不返回本键。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        paymentUrl:
          $ref: '#/components/schemas/WebUrl'
    MerchantProductLink:
      type: object
      additionalProperties: false
      required:
        - productLinkId
        - productLinkType
        - productLinkName
        - currency
        - enabled
        - paymentUrl
      properties:
        productLinkId:
          $ref: '#/components/schemas/LinkId'
        productLinkType:
          $ref: '#/components/schemas/ProductLinkType'
        productLinkName:
          type: string
          minLength: 1
          description: 链接名；票务即活动名、礼卡即礼卡名。
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: 标价币种。
        enabled:
          type: boolean
          description: 是否启用。
        paymentUrl:
          $ref: '#/components/schemas/WebUrl'
        alipayPassTemplateId:
          type: string
          minLength: 1
          maxLength: 64
          description: 支付宝卡包模板编号；只礼卡链接可能有，没填不返回本键。
    MerchantDeviceStatus:
      type: string
      enum:
        - PENDING_ACTIVATION
        - ACTIVE
        - DISABLED
        - RELEASED
      description: 设备状态：`PENDING_ACTIVATION` 已绑定、设备还没登录过 / `ACTIVE` 已接入 / `DISABLED` 已停用 / `RELEASED` 已解绑（只可查看）。
    MerchantDevice:
      type: object
      additionalProperties: false
      required:
        - deviceId
        - deviceSource
        - status
        - createdAt
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        clientType:
          type: string
          minLength: 1
          description: 收款端家族（如 `clover`、`sunmi`、`iphone`），取值由后端给出、按未知值安全处理；预登记期不返回本键。
        deviceSource:
          $ref: '#/components/schemas/DeviceSource'
        deviceModel:
          type: string
          minLength: 1
          description: 型号；没有不返回本键。
        serialNumber:
          type: string
          minLength: 1
          description: 硬件 POS 的序列号，或收银 App 的终端标识；没有不返回本键。
        storeName:
          type: string
          minLength: 1
          description: 门店；没有不返回本键。
        deviceName:
          type: string
          minLength: 1
          description: 商户给设备起的名字；没有不返回本键。
        status:
          $ref: '#/components/schemas/MerchantDeviceStatus'
        appVersion:
          type: string
          minLength: 1
          description: 设备端 App 版本；没报过不返回本键。
        firmwareVersion:
          type: string
          minLength: 1
          description: 固件或 OS 版本；没报过不返回本键。
        activatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 首次激活时刻；尚未激活或首次激活时刻未知（如迁入设备）时不返回本键。
        lastActiveAt:
          $ref: '#/components/schemas/Timestamp'
          description: 最近活跃时刻；从未活跃不返回本键。
        lastLoginOperator:
          $ref: '#/components/schemas/UserRef'
          description: 最近一次登录的操作员；从没登录过不返回本键。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: 入册时刻。
    DeviceLogType:
      type: string
      enum:
        - transaction
        - connection
        - auth
      description: 日志类型：`transaction` 收款与退款 / `connection` 设备上线与操作员登出或被迫下线 / `auth` 操作员登录与激活。
    DeviceLogEvent:
      type: string
      enum:
        - payment_succeeded
        - payment_failed
        - refund_succeeded
        - refund_failed
        - device_online
        - operator_signed_out
        - operator_signed_in
      description: 日志事件：`payment_succeeded` 收款成功 / `payment_failed` 收款失败 / `refund_succeeded` 退款成功 / `refund_failed` 退款失败（以上属 `transaction`）/ `device_online` 设备上线 / `operator_signed_out` 操作员登出或被迫下线（以上属 `connection`）/ `operator_signed_in` 操作员登录，含首次登录激活（属 `auth`）。展示名由前端按码取。
    MerchantDeviceLog:
      type: object
      additionalProperties: false
      required:
        - logType
        - severity
        - event
        - createdAt
      properties:
        logType:
          $ref: '#/components/schemas/DeviceLogType'
        severity:
          type: string
          enum:
            - info
            - warning
            - error
          description: 级别。
        event:
          $ref: '#/components/schemas/DeviceLogEvent'
        paymentMethodFamily:
          $ref: '#/components/schemas/PaymentMethodFamily'
          description: 支付方式族；只有 `transaction` 类日志有，其余不返回本键。
        remark:
          type: string
          minLength: 1
          description: 事件说明：单号、金额与币种码等事实，不随语言变化；没有不返回本键。
        actor:
          type: string
          minLength: 1
          description: 触发事件的操作员；系统产生的不返回本键。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          description: 事件时刻。
    MerchantDeveloperAccess:
      type: object
      additionalProperties: false
      required:
        - merchantCode
        - openApiEnabled
      properties:
        merchantCode:
          allOf:
            - $ref: '#/components/schemas/MerchantCode'
          description: 对接用商户号。
        openApiEnabled:
          type: boolean
          description: 开放 API 入口是否开通。
        credentialLast4:
          type: string
          minLength: 4
          maxLength: 4
          description: 当前 API 凭证的末 4 位；还没签发不返回本键。
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    PaymentMethod:
      type: string
      minLength: 1
      maxLength: 64
      description: 支付方式目录标识（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，调用方从候选集取来原样回传，按未知值安全处理。
      examples:
        - wechat_instore
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    FileId:
      type: string
      minLength: 1
      maxLength: 32
      description: 文件引用：上传后返回的稳定标识。
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    FeeRateWrite:
      type: object
      additionalProperties: false
      description: 写入商户费率时给出的费率：比例费率、固定单笔费与固定费免收截止日。
      required:
        - percentageRate
        - fixedFee
      properties:
        percentageRate:
          type: string
          pattern: ^0(\.[0-9]{1,4})?$
          description: 比例费率，小数、最多四位小数（即百分数两位，`0.0225` = 2.25%）；须大于 0，为 0 → 通用 `400`。
          examples:
            - '0.022'
        fixedFee:
          type: string
          pattern: ^[0-9]+$
          description: 固定单笔费，商户结算币种最小单位整数串；没有为 `0`。
          examples:
            - '30'
        fixedFeeWaivedUntil:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 固定单笔费免收截止日（含）；不带 = 不免。
    EntryPoint:
      type: string
      description: 入口：`pos` 终端 · `merchant_app` 商户 App · `merchant_portal` 商户后台 · `open_api` 开放 API · `checkout` 收银台页面（店铺码、账单、Product Link） · `channel_inbound` 通道直接推来的订单 · `plugin_shopify` Shopify 插件 · `plugin_allvalue` AllValue 插件 · `plugin_allvalue_xhs` AllValue 小红书 · `system` 系统发起。
      enum:
        - pos
        - merchant_app
        - merchant_portal
        - open_api
        - checkout
        - channel_inbound
        - plugin_shopify
        - plugin_allvalue
        - plugin_allvalue_xhs
        - system
    PaymentMethodFamily:
      type: string
      description: 支付方式族（品牌）。
      enum:
        - wechat
        - alipay
        - unionpay
        - credit_card
    FeeRateEntryPoint:
      type: string
      enum:
        - plugin_shopify
        - plugin_allvalue
        - plugin_allvalue_xhs
      description: 费率专用行所属的插件入口。
    MerchantBrief:
      type: object
      additionalProperties: false
      description: 一个商户的标识与名称（列表与记录上展示「哪个商户」）。
      required:
        - merchantId
        - merchantName
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantName:
          type: string
          minLength: 1
    BillingModel:
      type: string
      enum:
        - standard
        - postpaid
      description: 手续费结算模式：`standard` 轧差（从结算款里扣）、`postpaid` 月结。
    ParameterValue:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: 参数值。按该参数的 `valueType` 恰好给一个槽位：`string` 用 `stringValue`、`number` 用 `numberValue`、`boolean` 用 `booleanValue`、`number_list` 用 `numberListValue`；多给、缺给或槽位与类型不符 → `400`。
      properties:
        stringValue:
          type: string
        numberValue:
          type: number
        booleanValue:
          type: boolean
        numberListValue:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: number
          description: 数值列表，按声明的顺序与个数给。
    WebUrl:
      type: string
      pattern: ^https?://\S+$
      description: http 或 https 绝对地址。平台产出的文件 / 图片 / 付款链接地址与渠道给出的跳转地址共用。
    CheckoutOption:
      type: string
      minLength: 1
      description: 收银台上的支付方式选项：同一品牌、同一付款流程的支付方式归为一项（如 `wechat` 含线下、线上两个支付方式）。取值由后端目录决定，前端从所在面给出的候选集取来原样回传。
      examples:
        - wechat
    StoreQrType:
      type: string
      enum:
        - standard
        - pre_auth
        - unionpay_qrc
      description: 店铺码的种类：`standard` 标准码 / `pre_auth` 预授权码 / `unionpay_qrc` 银联码（云闪付扫，不经收银台）。
    InvoiceNo:
      type: integer
      format: int32
      minimum: 10001
      description: 系统账单号，商户内递增、从 10001 起；与商户一起唯一定位一张账单。
    ProductLinkType:
      type: string
      enum:
        - product
        - ticket
        - giftcard
      description: '`product` 商品 / `ticket` 票务 / `giftcard` 礼卡。'
    LinkId:
      type: string
      minLength: 1
      maxLength: 32
      description: 销售链接标识。
    DeviceId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台设备号。
    DeviceSource:
      type: string
      description: 设备来源（机器谁供的）：`platform` 平台自有、`moneris`、`clover`；`unknown` 是没经绑定、设备自己登录入册的，绑定时不能选。
      enum:
        - platform
        - moneris
        - clover
        - unknown
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    UserRef:
      type: object
      additionalProperties: false
      description: 一个平台用户的标识与显示名（列表与记录上展示「谁」）。
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
    MerchantCode:
      type: string
      minLength: 1
      maxLength: 20
      description: 对外商户码。
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
