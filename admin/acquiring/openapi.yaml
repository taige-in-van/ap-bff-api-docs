      x-required-privilege: chcfg:terms:edit
      summary: 设客户服务费适用范围
      description: |
        **全量覆盖**：请求体就是要排除的完整集合；列入的场景或支付方式不加收客户服务费，其余照加。空数组 = 全部加收。只在客户服务费开着时起作用。

        置值写，不挂幂等键。场景或支付方式不在目录内 → `400`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
