      - $ref: '#/components/parameters/EntryPointPath'
    put:
      tags:
        - entry-points
      operationId: updateMerchantEntryPointEnablement
      x-required-privilege: chcfg:channel:manage
      summary: 开通或关闭一个受理入口
      description: |
        **全量覆盖**：请求体就是目标开关态。关闭后该入口的受理被拒，已成功的支付不受影响。

        - POS 与商户 App 分别开关，没有合并开关。
        - 插件入口在接入申请通过后由运营在这里开通。AllValue 首次开通时，小红书入口随之开通，并写出小红书费率：比例 = 该商户 AllValue 费率（没有 AllValue 专用费率的取通用费率）的比例加平台默认上浮，不受商户费率上限约束，之后可在费率录入里调整；小红书入口可单独关闭，不影响 AllValue。

        与现状相同同样返回 `204`。天然幂等，不挂幂等键。
      parameters:
