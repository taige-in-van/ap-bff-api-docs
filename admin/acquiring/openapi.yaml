openapi: 3.1.0
info:
  title: 管理后台 通道进件与产品配置 — 前端契约面
  version: 2.2.0
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的单商户收单配置契约：通道签约与渠道报备、线上平台标识、受理入口与入口级收窄，商户费率与费率问题清单、计费条款与客户服务费适用范围，商户级收单参数、跨主子退款开关、小票、收款页与小费，店铺码 / 账单 / 链接只读与礼卡卡包模板编号，商户设备与日志、停用启用与释放，开发接入与重置 API 凭证。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **费率口径**：本面的比例费率一律是小数字符串，`"0.022"` 即 2.2%；固定单笔费是商户结算币种的最小单位整数串（`"30"` = 0.30），不带币种。录入时比例须大于 0、不超过平台上限，折成百分数至多两位小数（即小数至多 4 位）。

    **幂等 / CSRF 口径**：

    - 加支付方式、提交报备、录入费率、重置 API 凭证挂 `Idempotency-Key`：同键同请求体重发返回首次结果；同键改请求体 → `409`·`908003`；首次请求仍在处理 → `409`·`908002`，稍后同键同请求体重发。
    - 置值写（改签约、开关入口、收窄、改条款与参数、小票、收款页、小费、卡包模板编号、设备停用启用）与释放设备不挂；带版本或带读到时刻的写以它防并发覆盖、不挂；刷新报备状态按流程语义不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。

    **数据可见范围**：同管理后台约定「数据可见范围」：按标识访问范围外的商户及其签约、费率、设备等一律 `404`；费率问题清单只含范围内的商户。

    **操作审计**：本面的写操作记入操作审计并带上商户与前后值，可在该商户详情的操作记录页签查到；读、刷新报备状态、费率问题清单不记。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: channels
    x-displayName: 通道签约
    description: 按支付方式的通道签约、子商户号与 MCC、银联 Express、渠道报备与线上平台标识。
  - name: entry-points
    x-displayName: 受理入口
    description: 受理入口的开关与入口级支付方式收窄。
  - name: fees
    x-displayName: 费率与计费
    description: 商户费率、费率问题清单、计费条款与客户服务费适用范围。
  - name: settings
    x-displayName: 商户级参数
    description: 退款、订单有效期与终端参数，跨主子退款开关，小票、收款页与小费。
  - name: products
    x-displayName: 收款码与链接
    description: 店铺码、账单与链接只读，礼卡卡包模板编号。
  - name: devices
    x-displayName: 设备
    description: 商户设备（含已解绑）与日志，停用 / 启用与释放。
  - name: developer
    x-displayName: 开发接入
    description: 对接用商户号、开放 API 入口开关态与重置 API 凭证。
paths:
  /merchants/{merchantId}/channel-contracts:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      tags:
        - channels
      operationId: listMerchantChannelContracts
      x-required-privilege: chcfg:config:view
      summary: 通道签约总览（含报备进度与可加的支付方式）
      description: |
        按支付方式列出该商户的签约：所签通道、子商户号、MCC、运营启停与商户自助开关、是否要报备才能拿到子商户号（`applicationRequired`）、银联 Express（只银联在线有）、已登记的线上平台标识、各类报备的最近一次结果与通道给的拒绝原因。入驻申请提交后由系统建立的签约与报备同样在这里。

        `availableMethods` 列出该商户结算币种下尚未签约、可以加的支付方式，各带可选的通道（每个通道带 `applicationRequired`，为是的才可填子商户号）与标准费率（没有标准费率的不带）；加支付方式用 `createMerchantChannelContract`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantChannelContractList'
              example:
                items:
                  - contractId: mc_1201
                    paymentMethod: wechat_instore
                    channel:
                      channelId: ch_wx_01
                      channelName: WeChat Pay CA
                      channelMerchantId: '1900012345'
                    subMerchantId: '1612345678'
                    mcc: '5814'
                    enabled: true
                    merchantEnabled: true
                    applicationRequired: true
                    subApps: []
                    applications:
                      - channelApplicationId: mca_3301
                        applicationType: maintain
                        status: APPROVED
                        channelStatus: AUDIT_PASS
                        submittedAt: '2026-03-03T10:00:00Z'
                        decidedAt: '2026-03-04T08:00:00Z'
                    updatedAt: '2026-03-04T08:00:01.284105Z'
                  - contractId: mc_1202
                    paymentMethod: alipay_online
                    channel:
                      channelId: ch_ali_02
                      channelName: Alipay Online CA
                      channelMerchantId: '2088000000000001'
                    enabled: false
                    merchantEnabled: true
                    applicationRequired: true
                    subApps: []
                    applications:
                      - channelApplicationId: mca_3302
                        applicationType: maintain
                        status: REJECTED
                        channelStatus: FAIL
                        rejectReason: 营业执照照片不清晰
                        submittedAt: '2026-10-16T08:10:00Z'
                        decidedAt: '2026-10-16T09:00:00Z'
                    updatedAt: '2026-10-16T08:00:00.123456Z'
                availableMethods:
                  - paymentMethod: unionpay_online
                    channels:
                      - channelId: ch_up_01
                        channelName: UnionPay Online CA
                        channelMerchantId: '898000000000001'
                        applicationRequired: false
                    standardRate:
                      percentageRate: '0.025'
                      fixedFee: '0'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - channels
      operationId: createMerchantChannelContract
      x-required-privilege: chcfg:channel:manage
      summary: 加支付方式（新建签约）
      description: |
        为商户新增一个尚未签约的支付方式。通道只能选 `availableMethods` 里给出的；MCC 可选填；子商户号只有需要报备的通道（候选通道的 `applicationRequired` 为是）可选填，子商户号按规则生成或不需要子商户号的通道不接受。

        费率：填了 `feeRate` 就按它写一条新费率，从当天起生效，该支付方式的当前费率在新费率的生效首日截断（与录入费率同规则）；不填时，该支付方式已有当前费率的沿用、不另写，没有的取该支付方式在商户结算币种下的标准费率。

        子商户号就位即启用：不需要子商户号、或子商户号按规则生成的通道，新建即启用；需要报备的通道，填了子商户号视为已就位、新建即启用且不自动报备，没填的新建为未启用，由系统自动发起报备，首次报备成功、子商户号回写时启用。响应的 `enabled` 即建成后的启停。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308403` 该支付方式已有生效签约。
        - `308410` 所选通道不能签给该商户（结算币种不符、与已有签约的出款方式不一致，或通道未就绪），重读总览后改选。
        - `308406` 填的比例费率超过平台上限，`context.capPercentage` 是当时的上限（小数）。
        - `308407` 该支付方式已排定了未来生效的费率，当天起写入的新费率（所填的或取标准费率的）与之重叠；签约不建，重读费率后再定。
        - 字段格式不对、比例不大于 0 或小数超过 4 位，或给子商户号按规则生成、不需要子商户号的通道填了子商户号 → `400`，`details` 定位字段。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantChannelContractCreate'
            example:
              paymentMethod: unionpay_online
              channelId: ch_up_01
      responses:
        '201':
          description: 已新建签约
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantChannelContractCreated'
              example:
                contractId: mc_1203
                enabled: true
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308403
        - 308406
        - 308407
        - 308410
  /merchants/{merchantId}/channel-contracts/{contractId}:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
      - $ref: '#/components/parameters/ContractIdPath'
    patch:
      tags:
        - channels
      operationId: updateMerchantChannelContract
      x-required-privilege: chcfg:channel:manage
      summary: 改签约（启停、子商户号、MCC、银联 Express）
      description: |
        只提交要改的字段，并带上读到的 `updatedAt`；一次提交全部生效或全部不生效。启停不改费率，停用只影响此后的受理。

        - `enabled`：需要报备的通道在子商户号就位前不能启用；运营录入的子商户号视为就位。
        - `subMerchantId`：只有需要报备的通道（`applicationRequired` 为是）上的签约可带；同一通道商户号下该商户的其他签约共用子商户号，录入或修改时一并写入。由空录入为有值即就位，这些签约随之启用（本次同时带了 `enabled: false` 的除外）；已有子商户号再改值不改启停。`null` = 清空，这些签约随之停用。
        - `mcc`：四位 MCC，此后该通道的下单按新值；`null` = 清空。
        - `expressPayEnabled`：只银联在线签约可带；签约未启用时开关值保留但不生效。

        置值写，不挂幂等键。

        **什么时候拒绝**：

        - `308401` 签约在你读取后已被他人改过，签约不变；重读总览再改。
        - `308402` 该签约的通道需要报备、子商户号尚未就位，不能启用；待报备成功或先录入子商户号。
        - `308410` 要启用，而该签约的出款方式与该商户其他已启用签约不一致。
        - 非银联在线签约带了 `expressPayEnabled`、不需要报备的通道上的签约带了 `subMerchantId`、字段格式不对 → `400`，`details` 定位字段。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantChannelContractUpdate'
            examples:
              enable:
                summary: 启用
                value:
                  enabled: true
                  updatedAt: '2026-10-16T08:00:00.123456Z'
              subMerchantId:
                summary: 录入子商户号与 MCC
                value:
                  subMerchantId: '1612345679'
                  mcc: '5812'
                  updatedAt: '2026-10-16T08:00:00.123456Z'
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308401
        - 308402
        - 308410
  /merchants/{merchantId}/channel-contracts/{contractId}/applications:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
      - $ref: '#/components/parameters/ContractIdPath'
    post:
      tags:
        - channels
      operationId: createMerchantChannelApplication
      x-required-privilege: chcfg:channel:manage
      summary: 提交或重提一条渠道报备
      description: |
        对该签约向通道提交报备，内容取商户当前资料。上一次被驳回的同类报备即为重提。通道当场受理即返回，审核结果此后由系统同步，也可用 `syncMerchantChannelApplication` 按需刷新；首次子商户进件成功时系统回写子商户号并启用签约。

        **微信 H5 支付权限**（`applicationType = h5_authorization`）另收以下字段，其他报备类型带了 → `400`：

        - `limitType` 限额档，不传按 `normal`；选 `unlimited` 时 `businessDescription` 必填，且须有营业执照。
        - `websiteState` 网站状态，不传按 `launched`；选 `not_launched` 时 `websiteHomepageScreenshotFileIds` 与 `websiteBusinessPageScreenshotFileIds` 都必填。
        - 不传 `businessLicenseFileId` 时取商户入驻证照中的图片件（PNG / JPEG）。
        - 另传的营业执照与网站截图先经 `uploadMerchantFile` 上传（用途 `channel_application_material`），再带上传得到的 `fileId`。

        系统自动发起的 H5 申请是普通限额、已上线、不带材料；被驳回后在这里补改材料重提，仍是同一条报备。重提时档位与材料以本次请求为准整体改写、不与上次合并：先用 `ChannelApplication` 回读的上次提交内容预填，改好要改的再整份提交。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308415` H5 申请的档位与材料不齐：选了无限额而缺营业执照或业务说明（没传营业执照时先取商户入驻证照中的图片件，仍无才拒），或选了未上线而缺网站首页或业务页截图。`details` 指到缺的字段，不向通道提交。
        - `308416` 带的 `fileId` 不可用于这里（不存在、不是本商户上传的，或用途不是 `channel_application_material`）。`details` 指到该字段，重新上传后再带。
        - `308404` 同签约同类报备还在审，不能再提；刷新状态后再定。
        - `308405` 通道当场拒绝，`context.channelErrorCode` / `context.channelErrorMessage` 是通道给的原因（通道给了才带）；改资料后重提。
        - 该签约的通道不适用这类报备 → `400`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - applicationType
              properties:
                applicationType:
                  $ref: '#/components/schemas/ChannelApplicationType'
                limitType:
                  type: string
                  enum:
                    - normal
                    - unlimited
                  default: normal
                  description: H5 申请的限额档：`normal` 普通限额 / `unlimited` 无限额。只收 `h5_authorization`。
                websiteState:
                  type: string
                  enum:
                    - launched
                    - not_launched
                  default: launched
                  description: H5 申请时商户网站的状态：`launched` 已上线 / `not_launched` 未上线。只收 `h5_authorization`。
                businessDescription:
                  type: string
                  minLength: 1
                  description: 业务说明；`limitType = unlimited` 时必填。只收 `h5_authorization`。
                businessLicenseFileId:
                  allOf:
                    - $ref: '#/components/schemas/FileId'
                  description: 另传的营业执照（`uploadMerchantFile` 用途 `channel_application_material`，只收 PNG / JPEG）；不传取商户入驻证照中的图片件。只收 `h5_authorization`。
                websiteHomepageScreenshotFileIds:
                  type: array
                  minItems: 1
                  description: 网站首页截图（`uploadMerchantFile` 用途 `channel_application_material`）；`websiteState = not_launched` 时必填。只收 `h5_authorization`。
                  items:
                    $ref: '#/components/schemas/FileId'
                websiteBusinessPageScreenshotFileIds:
                  type: array
                  minItems: 1
                  description: 网站业务页截图（`uploadMerchantFile` 用途 `channel_application_material`）；`websiteState = not_launched` 时必填。只收 `h5_authorization`。
                  items:
                    $ref: '#/components/schemas/FileId'
            examples:
              maintain:
                summary: 子商户进件 / 资料修改
                value:
                  applicationType: maintain
              h5Unlimited:
                summary: H5 支付权限，无限额
                value:
                  applicationType: h5_authorization
                  limitType: unlimited
                  websiteState: launched
                  businessDescription: Online store selling apparel to overseas customers.
      responses:
        '201':
          description: 通道已受理
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - channelApplicationId
                  - status
                properties:
                  channelApplicationId:
                    $ref: '#/components/schemas/ChannelApplicationId'
                  status:
                    $ref: '#/components/schemas/ChannelApplicationStatus'
              example:
                channelApplicationId: mca_3305
                status: UNDER_REVIEW
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308404
        - 308405
        - 308415
        - 308416
  /merchants/{merchantId}/channel-contracts/{contractId}/applications/{channelApplicationId}/synchronization:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
      - $ref: '#/components/parameters/ContractIdPath'
      - name: channelApplicationId
        in: path
        required: true
        description: 报备标识，取总览里 `applications` 的 `channelApplicationId`。
        schema:
          $ref: '#/components/schemas/ChannelApplicationId'
    post:
      tags:
        - channels
      operationId: syncMerchantChannelApplication
      x-required-privilege: chcfg:config:view
      summary: 刷新一条报备的状态
      description: |
        向通道查询这条报备的当前状态并返回。首次子商户进件因此查到成功时，系统同样回写子商户号并启用签约。刷新不进操作审计；按流程语义不挂幂等键，重复刷新无副作用。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 刷新后的报备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelApplication'
              example:
                channelApplicationId: mca_3305
                applicationType: maintain
                status: APPROVED
                channelStatus: AUDIT_PASS
                submittedAt: '2026-10-17T02:00:00Z'
                decidedAt: '2026-10-18T01:30:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}/channel-contracts/{contractId}/sub-apps/{appId}:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
      - $ref: '#/components/parameters/ContractIdPath'
      - name: appId
        in: path
        required: true
        description: 商户自有应用的标识（公众号、小程序或移动应用的 appid）。
        schema:
          $ref: '#/components/schemas/SubAppId'
    put:
      tags:
        - channels
      operationId: registerMerchantChannelSubApp
      x-required-privilege: chcfg:channel:manage
      summary: 录入线上平台标识
      description: |
        为微信或支付宝签约登记商户自有应用，录入即本地登记，不向通道发起关联；通道侧绑定由运营在渠道服务商平台完成。登记后该商户从线上平台标识补录待办里消失。

        **全量覆盖**：请求体就是目标本身。同一标识已登记时同样返回 `204`。置值写，不挂幂等键。

        **什么时候拒绝**：

        - 签约不是微信或支付宝、或签约还没有子商户号 → `400`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - appType
              properties:
                appType:
                  $ref: '#/components/schemas/SubAppType'
            example:
              appType: mini_program
      responses:
        '204':
          description: 已登记
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}/entry-points:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      tags:
        - entry-points
      operationId: listMerchantEntryPoints
      x-required-privilege: chcfg:config:view
      summary: 受理入口（开关态与入口级收窄）
      description: |
        全部受理入口各一项，含默认开通、从未改过的入口。`paymentMethodFamilies` 是该入口收窄后可用的支付方式族，不返回本键即未收窄。

        顺序即展示顺序。
      responses:
