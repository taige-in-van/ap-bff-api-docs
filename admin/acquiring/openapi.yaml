      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - paymentMethodFamilies
              properties:
                paymentMethodFamilies:
                  type: array
                  uniqueItems: true
                  description: 该入口要用的支付方式族，整组置换。
                  items:
                    $ref: '#/components/schemas/PaymentMethodFamily'
            example:
              paymentMethodFamilies:
                - wechat
                - alipay
      responses:
        '204':
          description: 已生效
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
