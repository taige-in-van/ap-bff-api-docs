  /merchants/{merchantId}/fee-rates:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      tags:
        - fees
      operationId: listMerchantFeeRates
      x-required-privilege: chcfg:config:view
      summary: 商户费率（当前与历史）
      description: |
        该商户各支付方式（含插件入口专用行）的费率，当前与历史按生效窗一并列出；`current` 标出今天生效的那一行。`standardRates` 是该商户结算币种下各支付方式的标准费率，只读带出。
      parameters:
        - name: paymentMethod
          in: query
          required: false
          description: 按支付方式。
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: entryPoint
          in: query
          required: false
          description: 按插件入口专用行；不传 = 通用行与专用行都列。
          schema:
            $ref: '#/components/schemas/FeeRateEntryPoint'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantFeeRateList'
              example:
                items:
                  - feeRateId: mfr_8801
                    paymentMethod: wechat_instore
                    percentageRate: '0.025'
                    fixedFee: '0'
                    effectiveFrom: '2026-03-05'
                    effectiveTo: '2026-10-19'
                    current: true
                  - feeRateId: mfr_8807
                    paymentMethod: wechat_instore
                    percentageRate: '0.022'
                    fixedFee: '30'
                    fixedFeeWaivedUntil: '2026-12-31'
                    effectiveFrom: '2026-10-19'
                    current: false
                standardRates:
                  - paymentMethod: wechat_instore
                    percentageRate: '0.025'
                    fixedFee: '0'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - fees
      operationId: createMerchantFeeRate
      x-required-privilege: chcfg:fee:create
      summary: 录入或调整一个支付方式的费率
      description: |
        写一条新费率：当前费率在新费率的生效首日截断，历史不覆盖、不删除。该支付方式还没有费率时直接生效，生效首日可早于今天。录入或调整费率不改变签约的启停。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308406` 比例费率超过平台上限，`context.capPercentage` 是当时的上限（小数）；小红书专用行（`entryPoint` 为 `plugin_allvalue_xhs`）不按上限校验。
        - `308407` 生效首日早于当前费率的生效首日，或与已排定的未来费率重叠。
        - 比例不大于 0 或小数超过 4 位、固定费格式不对 → `400`，`details` 定位字段。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantFeeRateCreate'
            example:
              paymentMethod: wechat_instore
              rate:
                percentageRate: '0.022'
                fixedFee: '30'
                fixedFeeWaivedUntil: '2026-12-31'
              effectiveFrom: '2026-10-19'
      responses:
        '201':
          description: 已录入
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - feeRateId
                properties:
                  feeRateId:
                    $ref: '#/components/schemas/FeeRateId'
              example:
                feeRateId: mfr_8807
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308406
        - 308407
  /fee-rate-issues:
    get:
      tags:
        - fees
      operationId: listFeeRateIssues
      x-required-privilege: chcfg:config:view
      summary: 费率问题清单（跨商户）
      description: |
        跨商户列出待处理的问题，只含本人数据范围内的商户：

        - `no_effective_rate`：已启用签约的支付方式今天没有生效费率；刚建、未启用的签约不算。
        - `expiring`：当前生效费率将在 `warningDays` 天内到期，`effectiveTo` 是失效日。
        - `pending_setup`：商户在入驻申请提交后（被拒或已撤回的申请不算）、或受理模式开通申请通过后，申请里所选的支付方式该商户当前没有签约（已解绑的不算），全部列出；卡类支付方式由商户自助接入，不列。`pendingReason` 按该商户结算币种下当前可签的通道数给出；有可选通道的，到该商户的通道签约页用加支付方式选一个补上。

        `warningDays` 是平台设定的到期预警天数。
      parameters:
        - name: issueType
          in: query
          required: false
          description: 按问题类型，可多选；不传 = 全部。
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/FeeRateIssueType'
        - name: merchantId
          in: query
          required: false
          description: 按商户。
          schema:
            $ref: '#/components/schemas/MerchantId'
        - name: keyword
          in: query
          required: false
          description: 按商户码、经营名包含匹配。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                  - warningDays
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FeeRateIssue'
                  warningDays:
                    type: integer
                    minimum: 1
                    description: 到期预警天数。
              example:
                total: 5
                warningDays: 7
                data:
                  - merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    paymentMethod: wechat_online
                    issueType: no_effective_rate
                  - merchant:
                      merchantId: mch_8830
                      merchantName: Pine Tea
                    paymentMethod: alipay_instore
                    issueType: expiring
                    effectiveTo: '2026-10-23'
                  - merchant:
                      merchantId: mch_8841
                      merchantName: Cedar Books
                    paymentMethod: alipay_online
                    issueType: pending_setup
                    pendingReason: multiple_candidate_channels
                  - merchant:
                      merchantId: mch_8842
                      merchantName: Birch Bakery
                    paymentMethod: unionpay_online
                    issueType: pending_setup
                    pendingReason: no_candidate_channel
                  - merchant:
                      merchantId: mch_8843
                      merchantName: Aspen Florist
                    paymentMethod: wechat_online
                    issueType: pending_setup
                    pendingReason: single_candidate_channel
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}/settlement-terms:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      tags:
        - fees
      operationId: getMerchantSettlementTerms
      x-required-privilege: chcfg:config:view
      summary: 计费条款
      description: 手续费结算模式、退款手续费退回、客户服务费开关与适用范围、APP 订阅开关、电商托管结算锁释放期。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSettlementTerms'
              example:
                billingModel: standard
                refundFeeReturnable: true
                customerServiceFeeEnabled: true
                csfCoverage:
                  excludedScenes:
                    - store_qr_page
                  excludedPaymentMethods: []
                appSubscriptionEnabled: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    patch:
      tags:
        - fees
      operationId: updateMerchantSettlementTerms
      x-required-privilege: chcfg:terms:edit
      summary: 改计费条款
      description: |
        只提交要改的字段。

        - `billingModel`：此后成交的手续费按新模式；改前未结算的仍按其发生时的模式。
        - `refundFeeReturnable`：关闭后，此后的退款不退还原支付手续费。
        - `customerServiceFeeEnabled`：代商户开关客户服务费；适用范围用 `updateMerchantCsfCoverage`。
        - `appSubscriptionEnabled`：由关转开时，为该商户名下未解绑的 POS 设备补建收费计划。
        - `escrowReleaseClearingDays`：电商托管结算锁释放期（清算日数），改值对已加锁的托管明细同样生效；`null` = 用平台默认。

        置值写，不挂幂等键。字段格式或取值不对 → `400`，`details` 定位字段。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantSettlementTermsUpdate'
            example:
              billingModel: postpaid
              escrowReleaseClearingDays: 3
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}/csf-coverage:
    parameters:
