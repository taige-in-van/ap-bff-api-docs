                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantEntryPoint'
              example:
                items:
                  - entryPoint: checkout
                    enabled: true
                  - entryPoint: open_api
                    enabled: true
                  - entryPoint: pos
                    enabled: false
                  - entryPoint: merchant_app
                    enabled: true
                  - entryPoint: plugin_shopify
                    enabled: true
                    paymentMethodFamilies:
                      - wechat
                      - alipay
                  - entryPoint: plugin_allvalue
                    enabled: false
                  - entryPoint: plugin_allvalue_xhs
                    enabled: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
