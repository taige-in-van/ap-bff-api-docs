              $ref: '#/components/schemas/CsfCoverage'
            example:
              excludedScenes:
                - store_qr_page
              excludedPaymentMethods: []
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}/acquiring-parameters:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    get:
      tags:
        - settings
      operationId: listMerchantAcquiringParameters
      x-required-privilege: chcfg:config:view
      summary: 商户级收单参数（含生效值、默认值与写入用的版本）
      description: |
        允许运营代该商户配置的收单参数：退款能力开关、退款免审开关、退款周期（天）、订单有效期（分钟）、终端仅查看模式。每项带展示名、值的类型、默认值、当前生效值与写入用的版本；该商户设过值的另带 `value`，没有 `value` 即当前用的是默认值。

        顺序即展示顺序。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantAcquiringParameter'
              example:
                items:
                  - key: refund.enabled
                    displayName: 退款能力
                    valueType: boolean
                    defaultValue:
                      booleanValue: true
                    effectiveValue:
                      booleanValue: true
                    version: 0
                  - key: refund.review.period-days
                    displayName: 退款周期（天）
                    valueType: number
                    valueRangeNote: 正整数天；超期退款转人工审核
                    defaultValue:
                      numberValue: 180
                    value:
                      numberValue: 30
                    effectiveValue:
                      numberValue: 30
                    version: 0
                  - key: terminal.view-only
                    displayName: 终端仅查看
                    valueType: boolean
                    defaultValue:
                      booleanValue: false
                    value:
                      booleanValue: true
                    effectiveValue:
                      booleanValue: true
                    version: 3
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
