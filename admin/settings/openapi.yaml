openapi: 3.1.0
info:
  title: 管理后台 平台设置与公告 — 前端契约面
  version: 2.0.0
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的平台设置契约：平台参数（`/settings/parameters`）、平台级收单参数（`/settings/acquiring-parameters`）、平台退款参数（`/settings/refund-parameters`）与发给全体商户的公告（`/announcements`）。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 每个接口要的权限点见 `x-required-privilege`。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: parameters
    x-displayName: 平台参数
    description: 平台级运营参数：按声明列出，可改值、可恢复默认。
  - name: acquiring-parameters
    x-displayName: 平台收单参数
    description: 收单相关的平台级参数（APP 订阅、小费默认档位、小红书默认上浮、费率上限与到期预警天数）：可改值、可恢复默认。
  - name: refund-parameters
    x-displayName: 平台退款参数
    description: 退款相关的平台级参数（退款审核总开关、审核金额阈值、最大退款期限）：可改值、可恢复默认。
  - name: announcements
    x-displayName: 公告
    description: 发给全体商户的公告：草稿、发布、撤回。
paths:
  /settings/parameters:
    get:
      tags:
        - parameters
      operationId: listPlatformParameters
      x-required-privilege: syscfg:parameter:view
      summary: 平台参数列表（含生效值、默认值与写入用的版本）
      description: |
        平台参数页上的全部参数，按分组给出。每项带展示名、当前生效值、默认值与写入用的版本；平台设过值的另带 `value`，没有 `value` 即当前用的是默认值。收单相关的平台参数在平台收单参数页（`listAcquiringPlatformParameters`）；退款审核开关、审核金额阈值与最大退款期限在平台退款参数页（`listRefundPlatformParameters`），都不在本列表。

        顺序即展示顺序。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformParameter'
              example:
                items:
                  - key: order.expiry.minutes
                    groupName: 订单
                    displayName: 订单有效期平台兜底值（分钟）
                    valueType: number
                    valueRangeNote: 正整数分钟
                    defaultValue:
                      numberValue: 5
                    value:
                      numberValue: 30
                    effectiveValue:
                      numberValue: 30
                    version: 3
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /settings/parameters/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: 参数标识，取列表里的 `key`。
        schema:
          $ref: '#/components/schemas/ParameterKey'
    put:
      tags:
        - parameters
      operationId: updatePlatformParameter
      x-required-privilege: syscfg:parameter:edit
      summary: 改一个平台参数的值，或恢复默认
      description: |
        把这个参数在平台上的值设为 `value`；`value` 传 `null` 即恢复默认（清掉平台设过的值，生效值回到默认值）。对此后的判定生效，改前已经发生的不受影响。成功返回写入后的参数，每次成功都留下一条操作记录。

        **全量覆盖**：请求体就是目标本身，`value` 与 `version` 都要传，缺省不代表保持原样。

        **什么时候拒绝**：

        - `version` 不是读到时的那个（别人已经改过）→ `409`·`308103`。重新调 `listPlatformParameters` 读最新值，再决定是否重改。
        - `value` 的类型或取值不合该参数的值域 → `400`，由 `details` 定位到 `value`；参数不变。
        - 参数不存在 → `404`。

        **重复提交**：不带幂等键。上一次其实已经成功、响应丢了再提交，会因版本已变得到 `308103`，重读即可看到上次写入的值。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformParameterWrite'
            examples:
              setValue:
                summary: 改值
                value:
                  value:
                    numberValue: 30
                  version: 2
              restoreDefault:
                summary: 恢复默认
                value:
                  value: null
                  version: 3
      responses:
        '200':
          description: 写入后的参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformParameter'
              example:
                key: order.expiry.minutes
                groupName: 订单
                displayName: 订单有效期平台兜底值（分钟）
                valueType: number
                valueRangeNote: 正整数分钟
                defaultValue:
                  numberValue: 5
                value:
                  numberValue: 30
                effectiveValue:
                  numberValue: 30
                version: 3
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308103
  /settings/acquiring-parameters:
    get:
      tags:
        - acquiring-parameters
      operationId: listAcquiringPlatformParameters
      x-required-privilege: chcfg:parameter:view
      summary: 平台收单参数列表（含生效值、默认值与写入用的版本）
      description: |
        收单相关的平台级参数：APP 订阅的首月分界日、单台月费与合约期数，小费默认三档，AllValue 小红书默认上浮，商户费率上限，费率到期预警天数。形态与平台参数相同：每项带展示名、当前生效值、默认值与写入用的版本；平台设过值的另带 `value`。

        单台月费按商户的结算币种解释，不带币种。AllValue 小红书默认上浮与商户费率上限是比例小数字符串（`stringValue`，如 `"0.05"` = 5%，至多 4 位小数），与费率同形，换算为百分数只在页面展示。顺序即展示顺序。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformParameter'
              example:
                items:
                  - key: app-subscription.unit-price
                    groupName: APP 订阅
                    displayName: 单台月费
                    valueType: number
                    valueRangeNote: 非负金额，按商户结算币种解释
                    defaultValue:
                      numberValue: 10
                    effectiveValue:
                      numberValue: 10
                    version: 0
                  - key: fee.allvalue-xhs.default-uplift
                    groupName: 费率
                    displayName: AllValue 小红书默认上浮
                    valueType: string
                    valueRangeNote: 大于 0 的比例小数字符串，至多 4 位小数（"0.05" = 5 个百分点）
                    defaultValue:
                      stringValue: '0.05'
                    effectiveValue:
                      stringValue: '0.05'
                    version: 0
                  - key: fee.merchant-rate.max-percentage
                    groupName: 费率
                    displayName: 商户费率上限
                    valueType: string
                    valueRangeNote: 大于 0 的比例小数字符串，至多 4 位小数（"0.05" = 5%）
                    defaultValue:
                      stringValue: '0.05'
                    value:
                      stringValue: '0.04'
                    effectiveValue:
                      stringValue: '0.04'
                    version: 2
                  - key: tip.default-presets
                    groupName: 小费
                    displayName: 小费默认三档（%）
                    valueType: number_list
                    valueRangeNote: 三个 0–30 的整数
                    defaultValue:
                      numberListValue:
                        - 10
                        - 15
                        - 20
                    effectiveValue:
                      numberListValue:
                        - 10
                        - 15
                        - 20
                    version: 0
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /settings/acquiring-parameters/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: 参数标识，取列表里的 `key`。
        schema:
          $ref: '#/components/schemas/ParameterKey'
    put:
      tags:
        - acquiring-parameters
      operationId: updateAcquiringPlatformParameter
      x-required-privilege: chcfg:parameter:edit
      summary: 改一个平台收单参数的值，或恢复默认
      description: |
        把这个参数在平台上的值设为 `value`；`value` 传 `null` 即恢复默认。对此后的判定生效，改前已经发生的不受影响（如改费率上限不影响已录入的费率）。成功返回写入后的参数，每次成功都留下一条操作记录。

        **全量覆盖**：请求体就是目标本身，`value` 与 `version` 都要传，缺省不代表保持原样。

        **什么时候拒绝**：

        - `version` 不是读到时的那个（别人已经改过）→ `409`·`308103`。重新调 `listAcquiringPlatformParameters` 读最新值，再决定是否重改。
        - `value` 的类型或取值不合该参数的值域 → `400`，由 `details` 定位到 `value`；参数不变。
        - 参数不存在或不在本页 → `404`。

        **重复提交**：不带幂等键。上一次其实已经成功、响应丢了再提交，会因版本已变得到 `308103`，重读即可看到上次写入的值。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformParameterWrite'
            examples:
              setValue:
                summary: 改值
                value:
                  value:
                    stringValue: '0.04'
                  version: 1
              restoreDefault:
                summary: 恢复默认
                value:
                  value: null
                  version: 2
      responses:
        '200':
          description: 写入后的参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformParameter'
              example:
                key: fee.merchant-rate.max-percentage
                groupName: 费率
                displayName: 商户费率上限
                valueType: string
                valueRangeNote: 大于 0 的比例小数字符串，至多 4 位小数（"0.05" = 5%）
                defaultValue:
                  stringValue: '0.05'
                value:
                  stringValue: '0.04'
                effectiveValue:
                  stringValue: '0.04'
                version: 2
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308103
  /settings/refund-parameters:
    get:
      tags:
        - refund-parameters
      operationId: listRefundPlatformParameters
      x-required-privilege: txadm:parameter:view
      summary: 平台退款参数列表（含生效值、默认值与写入用的版本）
      description: |
        退款相关的平台级参数：退款审核总开关、退款审核金额阈值、最大退款期限。形态与平台参数相同：每项带展示名、当前生效值、默认值与写入用的版本；平台设过值的另带 `value`。

        总开关打开后，金额达到阈值的退款要经后台审核才送往通道；阈值是结算币种的最小单位整数，按各商户的结算币种解释，不带币种。最大退款期限是天数，订单成交超过这个天数的不能再发起退款。顺序即展示顺序。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PlatformParameter'
              example:
                items:
                  - key: refund.review.amount-rule-enabled
                    groupName: 退款
                    displayName: 退款审核总开关
                    valueType: boolean
                    defaultValue:
                      booleanValue: false
                    value:
                      booleanValue: true
                    effectiveValue:
                      booleanValue: true
                    version: 1
                  - key: refund.review.amount-threshold
                    groupName: 退款
                    displayName: 退款审核金额阈值
                    valueType: number
                    valueRangeNote: 非负整数，结算币种的最小单位，按商户结算币种解释
                    defaultValue:
                      numberValue: 500000
                    effectiveValue:
                      numberValue: 500000
                    version: 0
                  - key: refund.max-age-days
                    groupName: 退款
                    displayName: 最大退款期限（天）
                    valueType: number
                    valueRangeNote: 正整数天
                    defaultValue:
                      numberValue: 365
                    effectiveValue:
                      numberValue: 365
                    version: 0
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /settings/refund-parameters/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: 参数标识，取列表里的 `key`。
        schema:
          $ref: '#/components/schemas/ParameterKey'
    put:
      tags:
        - refund-parameters
      operationId: updateRefundPlatformParameter
      x-required-privilege: txadm:parameter:edit
      summary: 改一个平台退款参数的值，或恢复默认
      description: |
        把这个参数在平台上的值设为 `value`；`value` 传 `null` 即恢复默认。对此后的判定生效，改前已经发生的不受影响（如打开审核总开关不影响已送往通道的退款）。成功返回写入后的参数，每次成功都留下一条操作记录。

        **全量覆盖**：请求体就是目标本身，`value` 与 `version` 都要传，缺省不代表保持原样。

        **什么时候拒绝**：

        - `version` 不是读到时的那个（别人已经改过）→ `409`·`308103`。重新调 `listRefundPlatformParameters` 读最新值，再决定是否重改。
        - `value` 的类型或取值不合该参数的值域 → `400`，由 `details` 定位到 `value`；参数不变。
        - 参数不存在或不在本页 → `404`。

        **重复提交**：不带幂等键。上一次其实已经成功、响应丢了再提交，会因版本已变得到 `308103`，重读即可看到上次写入的值。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformParameterWrite'
            examples:
              setValue:
                summary: 改值
                value:
                  value:
                    numberValue: 300000
                  version: 0
              restoreDefault:
                summary: 恢复默认
                value:
                  value: null
                  version: 1
      responses:
        '200':
          description: 写入后的参数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformParameter'
              example:
                key: refund.review.amount-threshold
                groupName: 退款
                displayName: 退款审核金额阈值
                valueType: number
                valueRangeNote: 非负整数，结算币种的最小单位，按商户结算币种解释
                defaultValue:
                  numberValue: 500000
                value:
                  numberValue: 300000
                effectiveValue:
                  numberValue: 300000
                version: 1
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308103
  /announcements:
    get:
      tags:
        - announcements
      operationId: listAnnouncements
      x-required-privilege: syscfg:announcement:view
      summary: 公告列表（搜索、按状态筛选、排序、分页）
      description: 全部公告，不含已弃用的草稿。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 按标题模糊匹配。
          schema:
            type: string
            maxLength: 128
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AnnouncementStatus'
        - name: sortField
          in: query
          required: false
          description: 排序字段。不传 = 不排序；页面默认顺序由前端显式传。按 `publishedAt` 排序时未发布的恒在末尾。
          schema:
            type: string
            enum:
              - createdAt
              - publishedAt
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AnnouncementSummary'
              example:
                total: 2
                data:
                  - announcementId: ann_02h7
                    title: 系统维护通知
                    status: PUBLISHED
                    createdAt: '2026-10-12T08:00:00Z'
                    publishedAt: '2026-10-12T09:30:00Z'
                    publishedBy:
                      userId: usr_a91
                      displayName: Alice Ops
                  - announcementId: ann_02h9
                    title: 结算时间调整
                    status: DRAFT
                    createdAt: '2026-10-15T03:10:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - announcements
      operationId: createAnnouncement
      x-required-privilege: syscfg:announcement:manage
      summary: 新建公告草稿
      description: |
        新建一条草稿。草稿对商户不可见，发布用 `publishAnnouncement`。

        - 标题或正文为空 → `400`。

        **幂等**：`Idempotency-Key`。同键同请求体重发返回首次建的那条；同键改请求体 → `409`·`908003`；首次请求还在处理 → `409`·`908002`，稍后同键同请求体重发。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementCreate'
            example:
              title: 结算时间调整
              body: <p>自 11 月起，结算到账时间调整为 T+2。</p>
      responses:
        '201':
          description: 已建草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
              example:
                announcementId: ann_02h9
                title: 结算时间调整
                status: DRAFT
                createdAt: '2026-10-15T03:10:00Z'
                body: <p>自 11 月起，结算到账时间调整为 T+2。</p>
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /announcements/{announcementId}:
    parameters:
      - name: announcementId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AnnouncementId'
    get:
      tags:
        - announcements
      operationId: getAnnouncement
      x-required-privilege: syscfg:announcement:view
      summary: 公告详情
      description: 标题、正文与发布 / 撤回信息。已弃用的草稿 → `404`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
              example:
                announcementId: ann_02h7
                title: 系统维护通知
                status: WITHDRAWN
                createdAt: '2026-10-12T08:00:00Z'
                publishedAt: '2026-10-12T09:30:00Z'
                publishedBy:
                  userId: usr_a91
                  displayName: Alice Ops
                withdrawnAt: '2026-10-13T02:00:00Z'
                withdrawnBy:
                  userId: usr_b07
                  displayName: Bob Ops
                body: <p>10 月 14 日 02:00–04:00 系统维护，期间暂停收款。</p>
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - announcements
      operationId: updateAnnouncement
      x-required-privilege: syscfg:announcement:manage
      summary: 编辑公告草稿
      description: |
        改草稿的标题或正文，改哪项传哪项；状态仍是草稿。

        - 公告已经发布或撤回 → `409`·`308104`，内容不变。已发布的公告不能改正文，要改须先撤回再另建一条。
        - 标题或正文传了空串 → `400`。
        - 公告不存在或已弃用 → `404`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnouncementUpdate'
            example:
              body: <p>自 11 月 3 日起，结算到账时间调整为 T+2。</p>
      responses:
        '200':
          description: 改后的草稿
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
              example:
                announcementId: ann_02h9
                title: 结算时间调整
                status: DRAFT
                createdAt: '2026-10-15T03:10:00Z'
                body: <p>自 11 月 3 日起，结算到账时间调整为 T+2。</p>
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308104
    delete:
      tags:
        - announcements
      operationId: deleteAnnouncement
      x-required-privilege: syscfg:announcement:manage
      summary: 弃用公告草稿
      description: |
        弃用一条草稿：它不再出现在列表里，也不能再发布。

        - 公告已经发布或撤回 → `409`·`308104`。
        - 公告不存在或已弃用 → `404`；重复提交拿到 `404` 说明上一次已经弃用成功。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已弃用
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308104
  /announcements/{announcementId}/publication:
    parameters:
      - name: announcementId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AnnouncementId'
    post:
      tags:
        - announcements
      operationId: publishAnnouncement
      x-required-privilege: syscfg:announcement:manage
      summary: 发布公告
      description: |
        把草稿发给全体商户：发布那一刻状态正常的商户各自的站内信里出现这条公告，之后才开通的商户收不到。记发布人与发布时间，留下一条操作记录。站内信随后陆续生成，不随本次响应返回。

        - 公告不是草稿（已发布、已撤回）→ `409`·`308104`，商户站内信不新增。
        - 公告不存在或已弃用 → `404`。

        **重复提交**：不带幂等键。上一次其实已经成功、响应丢了再提交，得到 `308104`；重读详情即可看到已发布。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
              example:
                announcementId: ann_02h9
                title: 结算时间调整
                status: PUBLISHED
                createdAt: '2026-10-15T03:10:00Z'
                publishedAt: '2026-10-15T06:00:00Z'
                publishedBy:
                  userId: usr_a91
                  displayName: Alice Ops
                body: <p>自 11 月 3 日起，结算到账时间调整为 T+2。</p>
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308104
  /announcements/{announcementId}/withdrawal:
    parameters:
      - name: announcementId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/AnnouncementId'
    post:
      tags:
        - announcements
      operationId: withdrawAnnouncement
      x-required-privilege: syscfg:announcement:manage
      summary: 撤回公告
      description: |
        撤回一条已发布的公告：各商户的站内信里不再出现它。记撤回人与撤回时间，留下一条操作记录。撤回后不能再发布，要重新告知须另建一条。

        - 公告不是已发布（草稿、已撤回）→ `409`·`308104`，状态不变。
        - 公告不存在或已弃用 → `404`。

        **重复提交**：不带幂等键。上一次其实已经成功、响应丢了再提交，得到 `308104`；重读详情即可看到已撤回。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已撤回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Announcement'
              example:
                announcementId: ann_02h7
                title: 系统维护通知
                status: WITHDRAWN
                createdAt: '2026-10-12T08:00:00Z'
                publishedAt: '2026-10-12T09:30:00Z'
                publishedBy:
                  userId: usr_a91
                  displayName: Alice Ops
                withdrawnAt: '2026-10-13T02:00:00Z'
                withdrawnBy:
                  userId: usr_b07
                  displayName: Bob Ops
                body: <p>10 月 14 日 02:00–04:00 系统维护，期间暂停收款。</p>
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308104
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  schemas:
    ParameterKey:
      type: string
      minLength: 1
      maxLength: 128
      description: 参数标识，按所属业务分前缀（如 `order.expiry.minutes`）。
    PlatformParameter:
      type: object
      additionalProperties: false
      required:
        - key
        - groupName
        - displayName
        - valueType
        - defaultValue
        - effectiveValue
        - version
      properties:
        key:
          $ref: '#/components/schemas/ParameterKey'
        groupName:
          type: string
          minLength: 1
          description: 所属分组的展示名，列表按它分组。
        displayName:
          type: string
          minLength: 1
          description: 参数的展示名。
        valueType:
          type: string
          enum:
            - string
            - number
            - boolean
            - number_list
          description: 值的类型，决定编辑控件与提交时用哪个槽位。
        valueRangeNote:
          type: string
          description: 值域说明（如「正整数分钟」）。没有值域限制时不返回。
        defaultValue:
          allOf:
            - $ref: '#/components/schemas/ParameterValue'
          description: 默认值。
        value:
          allOf:
            - $ref: '#/components/schemas/ParameterValue'
          description: 平台设过的值。没设过时不返回本键，即当前用的是默认值。
        effectiveValue:
          allOf:
            - $ref: '#/components/schemas/ParameterValue'
          description: 当前生效值：设过且仍合法时取 `value`，否则取默认值。
        version:
          type: integer
          minimum: 0
          description: 写入用的版本，改值时原样带回；平台从没设过值时为 0。
    PlatformParameterWrite:
      type: object
      additionalProperties: false
      required:
        - value
        - version
      properties:
        value:
          oneOf:
            - $ref: '#/components/schemas/ParameterValue'
            - type: 'null'
          description: 新值；传 `null` = 恢复默认。
        version:
          type: integer
          minimum: 0
          description: 读到时的 `version`。
    AnnouncementId:
      type: string
      minLength: 1
      maxLength: 32
      description: 公告标识。
    AnnouncementStatus:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - WITHDRAWN
      description: '`DRAFT` 草稿（商户不可见）/ `PUBLISHED` 已发布 / `WITHDRAWN` 已撤回（不能再发布）。'
    AnnouncementTitle:
      type: string
      minLength: 1
      maxLength: 256
      pattern: ^.*\S.*$
      description: 标题，不能为空白。
    AnnouncementBody:
      type: string
      minLength: 1
      description: 正文，受限 HTML（排版标签，不含图片）；商户端展示前会清掉不允许的标签与属性。
    AnnouncementUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          $ref: '#/components/schemas/AnnouncementTitle'
        body:
          $ref: '#/components/schemas/AnnouncementBody'
    AnnouncementCreate:
      required:
        - title
        - body
      allOf:
        - $ref: '#/components/schemas/AnnouncementUpdate'
    AnnouncementSummary:
      type: object
      x-parent: true
      required:
        - announcementId
        - title
        - status
        - createdAt
      properties:
        announcementId:
          $ref: '#/components/schemas/AnnouncementId'
        title:
          $ref: '#/components/schemas/AnnouncementTitle'
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        publishedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 发布时刻。未发布时不返回。
        publishedBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 发布人。未发布时不返回。
        withdrawnAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 撤回时刻。未撤回时不返回。
        withdrawnBy:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 撤回人。未撤回时不返回。
    Announcement:
      description: 列表行的字段加正文。
      allOf:
        - $ref: '#/components/schemas/AnnouncementSummary'
        - type: object
          required:
            - body
          properties:
            body:
              $ref: '#/components/schemas/AnnouncementBody'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            orderAmountCeiling:
              $ref: '#/components/schemas/Money'
              description: 发起支付时总应付超过单笔上限时，生效的单笔上限（各层取最严后的值），币种是商户结算币种，可能与页面标价币种不同（页面按本键把数额说出来；拼进 `detail` 前端取不出来）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    ParameterValue:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      description: 参数值。按该参数的 `valueType` 恰好给一个槽位：`string` 用 `stringValue`、`number` 用 `numberValue`、`boolean` 用 `booleanValue`、`number_list` 用 `numberListValue`；多给、缺给或槽位与类型不符 → `400`。
      properties:
        stringValue:
          type: string
        numberValue:
          type: number
        booleanValue:
          type: boolean
        numberListValue:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: number
          description: 数值列表，按声明的顺序与个数给。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    UserRef:
      type: object
      additionalProperties: false
      description: 一个平台用户的标识与显示名（列表与记录上展示「谁」）。
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
