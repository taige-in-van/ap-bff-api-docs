openapi: 3.1.0
info:
  title: 管理后台 商户入驻审批与合规 — 前端契约面
  version: 2.2.1
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的审核中心与代客建档契约：四类申请（入驻、受理模式开通、插件入口开通、结算信息变更）的审核队列、详情、文件取用与决定，通过入驻申请前的禁入名单比对与持权限跳过；代客建档的检查、建档、逐步填资料（含议价条款）、上传、生成合同并发确认链接、代补料后代提交、撤回；线上平台标识补录待办。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 代客建档、发起确认挂 `Idempotency-Key`：同键同请求体重发返回首次结果；同键改请求体 → `409`·`908003`；首次请求仍在处理 → `409`·`908002`，稍后同键同请求体重发。
    - 决定、跳过通过、代提交、撤回带状态前置，同一申请重复提交时后到者按状态不符拒绝，不挂幂等键；逐步保存是置值写，不挂；上传每次产生新文件，不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。

    **数据可见范围**：按商户组织，同管理后台约定「数据可见范围」：列表只含范围内商户的申请，按标识访问范围外商户的申请返回 `404`。

    **文件**：申请详情不带文件地址；要看某个文件时调 `createApplicationFileAccessUrl` 现签一个短时效地址，过期后再签。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: applications
    x-displayName: 审核中心
    description: 四类申请的审核队列、详情、文件取用、决定与跳过禁入名单通过。
  - name: assisted-onboarding
    x-displayName: 代客建档
    description: 代客建档：检查、建档、逐步填资料、上传、发起确认、代提交、撤回（按使用顺序排列）。
paths:
  /applications:
    get:
      tags:
        - applications
      operationId: listApplications
      x-required-privilege: mrev:application:view
      summary: 审核队列（筛选、排序、分页）
      description: |
        四类申请同一个列表，每行带申请类型。不传 `status` 时只列审核中的申请；草稿与已撤回的申请不进待审列表，要看须显式按状态筛。
      parameters:
        - name: applicationType
          in: query
          required: false
          description: 按申请类型，可多选。
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ApplicationType'
        - name: status
          in: query
          required: false
          description: 按申请状态，可多选；不传 = 只列 `UNDER_REVIEW`。
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ApplicationStatus'
        - name: signupSource
          in: query
          required: false
          description: 按开户来源。
          schema:
            $ref: '#/components/schemas/SignupSource'
        - name: merchantId
          in: query
          required: false
          description: 按商户；范围外的商户结果为空。
          schema:
            $ref: '#/components/schemas/MerchantId'
        - name: keyword
          in: query
          required: false
          description: 按商户码、经营名、法定名包含匹配。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: sortField
          in: query
          required: false
          description: 排序字段。不传 = 不排序；页面默认顺序由前端显式传。
          schema:
            type: string
            enum:
              - submittedAt
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApplicationSummary'
              example:
                total: 2
                data:
                  - applicationId: app_7101
                    applicationType: onboarding
                    status: UNDER_REVIEW
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    merchantCode: C3BM68
                    signupSource: self_service
                    submittedAt: '2026-10-16T08:00:00Z'
                  - applicationId: app_7102
                    applicationType: settlement_change
                    status: UNDER_REVIEW
                    merchant:
                      merchantId: mch_8790
                      merchantName: Maple Vet Clinic
                    merchantCode: A7KQ21
                    signupSource: admin_portal
                    submittedAt: '2026-10-16T09:30:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - assisted-onboarding
      operationId: createAssistedApplication
      x-required-privilege: mrev:assisted-onboarding:manage
      summary: 代客建档（建出待激活商户与草稿申请）
      description: |
        录入 Owner 联系人、所属机构、归属 BD 与商户语言，建出一个待激活的商户与一张入驻申请草稿（`DRAFT`），开户来源为管理后台。之后逐步填资料（`updateAssistedApplicationStep`）、上传文件、发起确认。

        - Owner 邮箱不属任何平台用户：同时建出该 Owner 的账号，此时还没有密码；审核通过后 Owner 凭开户邮件设密。
        - Owner 邮箱已属平台用户，且该用户是某家商户的 Owner、或在商户后台没有身份：新商户挂在该用户名下，不另建账号、不动其密码，响应 `ownerIdentity = existing`。
        - 建档不给商户发任何邮件。
        - 同名存量商户与禁入名单不拦建档，建档前用 `checkAssistedOnboarding` 提示。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308205` Owner 邮箱的已有账号不能成为 Owner：是其他商户的员工，或待验证、已停用；不建任何记录。
        - 机构或 BD 不存在、字段格式不对 → `400`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistedApplicationCreate'
            example:
              owner:
                email: jane@example.com
                firstName: Jane
                lastName: Merchant
                phone: '+16045550123'
                jobTitle: Manager
              partnerId: ptn_0031
              bdUserId: usr_b07
              language: en
      responses:
        '201':
          description: 已建档（商户待激活，申请为草稿）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistedApplicationCreated'
              example:
                applicationId: app_7140
                merchantId: mch_8840
                merchantCode: D9PL03
                ownerIdentity: new
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308205
  /applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    get:
      tags:
        - applications
      operationId: getApplication
      x-required-privilege: mrev:application:view
      summary: 申请详情
      description: |
        一张申请的全部审核资料，按申请类型返回对应部分：

        - 入驻申请：`steps`（入驻五步的资料，文档位只给文件引用、不给访问地址）；代客建档的另带议价条款 `steps.terms` 与 `signatureRequests`（每次发起确认的记录）。
        - 结算信息变更：`settlementChange`（新旧对比，账号只给末 4 位掩码）。
        - 受理模式开通：`acceptanceMode` 与 `paymentMethods`。
        - 插件入口开通：`entryPoint` 与 `storeUrl`；改店铺网址触发的复审也是这一类。

        `blocklistHits` 是本次读取时与禁入名单比对的命中项（仅入驻申请比对，无命中为空数组）；`history` 按时间列出每次提交、决定与代客建档的操作。查看不进操作审计。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationDetail'
              example:
                applicationId: app_7101
                applicationType: onboarding
                status: UNDER_REVIEW
                merchant:
                  merchantId: mch_8812
                  merchantName: Maple Coffee
                merchantCode: C3BM68
                signupSource: self_service
                submittedAt: '2026-10-16T08:00:00Z'
                missingFields: []
                steps:
                  contact:
                    email: jane@example.com
                    firstName: Jane
                    lastName: Merchant
                    businessTitle: Manager
                    phone: '+16045550123'
                  services:
                    selectedPaymentMethods:
                      - wechat_instore
                  business:
                    currency: CAD
                    country: CA
                    legalBusinessName: Maple Coffee Inc.
                    tradeName: Maple Coffee
                    typeOfOwnership: CORPORATION
                    registrationNumber: '1234567'
                    businessAddress: 88 King St W
                    city: Toronto
                    province: 'ON'
                    postalCode: M5H 1A1
                    timeZone: America/Toronto
                    language: en
                    businessPhone: '+14165550199'
                    industryCategory: A0
                    mcc: '5814'
                  settlement:
                    bankName: Royal Bank of Canada
                    bankAccount:
                      type: ca_local
                      transitNumber: '00123'
                      institutionNumber: '003'
                      accountNumberMasked: •••• 4567
                      accountNumberSet: true
                    settlementCycle: t2
                    settlementCycleDisplayName: T+2 Business Days
                  documents:
                    docIncorporation:
                      fileId: a04d78e2915c4b36bf8e2107d63a95f1
                      fileName: incorporation.pdf
                      fileSize: 524288
                      uploadedAt: '2026-10-15T14:07:00Z'
                    docOwnerId:
                      fileId: 9a17be40d5c34f28b6e1027c9df3a85b
                      fileName: owner-id.jpg
                      fileSize: 880640
                      uploadedAt: '2026-10-15T14:08:00Z'
                blocklistHits: []
                history:
                  - at: '2026-10-16T08:00:00Z'
                    action: submitted
                    actor:
                      userId: usr_m01
                      displayName: Jane Merchant
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /merchant-app-id-todos:
    get:
      tags:
        - applications
      operationId: listMerchantAppIdTodos
      x-required-privilege: mrev:application:view
      summary: 线上平台标识补录待办
      description: |
        已激活、线上服务类型为 App、小程序或其他，微信或支付宝签约已有子商户号、而微信与支付宝签约下都还没登记任何线上平台标识的商户，只含本人数据范围内的商户；签约还没有子商户号的商户录不了，待报备成功后才出现在这里。录入在该商户的收单配置里做（`registerMerchantChannelSubApp`），录入成功后该商户从本列表消失。按激活时间从新到旧。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 按商户码、经营名包含匹配。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantAppIdTodo'
              example:
                total: 1
                data:
                  - merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    onlineServiceType: MINI_PROGRAM
                    activatedAt: '2026-10-16T09:00:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /applications/{applicationId}/files/{fileId}/access-urls:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
      - name: fileId
        in: path
        required: true
        description: 申请详情里文件引用的 `fileId`。
        schema:
          $ref: '#/components/schemas/FileId'
    post:
      tags:
        - applications
      operationId: createApplicationFileAccessUrl
      x-required-privilege: mrev:application:view
      summary: 取用申请文件（现签短时效地址）
      description: |
        为该申请上的一个文件现签一个短时效访问地址，用于预览或下载。地址不要持久化、不要分享，过期后再调一次拿新的。每次调用签一个新地址，不挂幂等键。文件不属该申请 → `404`。取用不进操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: 已签发
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAccessUrl'
              example:
                url: https://files.example.com/o/9a17be40?exp=1755331200&sig=REDACTED&disp=inline
                expiresAt: '2026-10-16T08:05:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /applications/{applicationId}/decision:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      tags:
        - applications
      operationId: decideApplication
      x-required-privilege: mrev:application:manage
      summary: 决定申请（通过、拒绝或要求补料）
      description: |
        对审核中的申请下决定：

        - `APPROVED`：通过。入驻申请通过即商户激活，同一次完成；结算信息变更通过即新账户生效、新周期随后生效；开通申请通过后，入口能否使用由通道进件与产品配置后续置位决定。入驻申请通过前与禁入名单比对，命中即拒绝。
        - `REJECTED`：拒绝，`remark` 必填，作为拒绝说明。结算信息变更被拒，旧值保留。
        - `MORE_INFO_REQUIRED`：要求补料，只用于入驻申请；`missingFields` 至少一项，不带原因、不给商户发邮件。

        通过不改 Owner 的凭据，任何通知都不带明文凭据。两人同时决定以先到者为准。带状态前置，不挂幂等键。通过时同步支付核心暂时失败（可稍后重试的失败）返回 `503`，按申请类型分两种：

        - 受理模式开通申请：签约与报备没建成，决定未记录、申请仍在审核中；再点一次「通过」即可。
        - 结算信息变更：决定已记录、新周期尚未同步，详情与列表仍显示审核中（显示的是对外状态）；再点一次「通过」即补做同步、返回成功；此时点「拒绝」→ `409`·`308207`。

        **什么时候拒绝**：

        - `308201` 申请已不在审核中（他人先决定过，或已撤回），重读详情；已通过但新周期尚未同步的结算信息变更再次「通过」不算，见上。
        - `308207` 结算信息变更申请已通过、新周期尚未同步，不能拒绝；重发「通过」即补做同步。
        - `308202` 入驻申请禁入名单命中，`context.blocklistHits` 列出命中项；持跳过权限的改走 `approveApplicationOverridingBlocklist`。
        - `304201` 对非入驻申请要求补料。
        - 拒绝没填说明、要求补料没给待补项 → `400`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationDecision'
            examples:
              approve:
                summary: 通过
                value:
                  decision: APPROVED
              reject:
                summary: 拒绝
                value:
                  decision: REJECTED
                  remark: Business registration could not be verified.
              moreInfo:
                summary: 要求补料
                value:
                  decision: MORE_INFO_REQUIRED
                  missingFields:
                    - documents.docOwnerId
                    - documents.docStoreInside
      responses:
        '200':
          description: 已决定，返回申请的新状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResult'
              example:
                status: APPROVED
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304201
        - 308201
        - 308202
        - 308207
  /applications/{applicationId}/blocklist-override-approval:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      tags:
        - applications
      operationId: approveApplicationOverridingBlocklist
      x-required-privilege: mrev:blocklist-override:create
      summary: 跳过禁入名单通过入驻申请
      description: |
        禁入名单命中时，填写跳过理由后通过入驻申请：效果与 `decideApplication` 的通过相同，只是比对命中也照常通过。除跳过禁入名单的权限外，另须持通过申请的权限。跳过理由与命中项记入操作审计。带状态前置，不挂幂等键。

        **什么时候拒绝**：

        - `308201` 申请已不在审核中，重读详情。
        - `304201` 不是入驻申请。
        - 没填理由 → `400`。
        - 当前比对没有命中 → `400`，改走普通通过（`decideApplication`）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlocklistOverrideApproval'
            example:
              remark: Name match is a different entity; verified registration number.
      responses:
        '200':
          description: 已通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResult'
              example:
                status: APPROVED
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304201
        - 308201
  /assisted-onboarding-checks:
    post:
      tags:
        - assisted-onboarding
      operationId: checkAssistedOnboarding
      x-required-privilege: mrev:assisted-onboarding:manage
      summary: 建档前检查（Owner 账号、同名商户、禁入名单）
      description: |
        建档前的只读检查，不建任何记录、不进操作审计。用 POST 承载是为了不把邮箱放进地址。

        - `ownerIdentity`：`new` 该邮箱不属任何平台用户，建档会同时建出 Owner 账号；`existing` 已属平台用户，且该用户是某家商户的 Owner、或在商户后台没有身份，新商户会挂在该用户名下；`unusable` 已属其他商户的员工，或待验证、已停用的账号，不能建档。
        - `sameNameMerchants`：法定名相同或注册号相同的存量商户（只给商户码与名称，可能在本人数据范围外），供核对，不拦建档。
        - `blocklistHits`：与禁入名单比对的命中项，只提示，不拦建档。

        不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistedOnboardingCheckRequest'
            example:
              ownerEmail: jane@example.com
              legalName: Maple Coffee Inc.
              registrationNumber: '1234567'
              ownerPhone: '+16045550123'
      responses:
        '200':
          description: 检查结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistedOnboardingCheckResult'
              example:
                ownerIdentity: new
                sameNameMerchants:
                  - merchantCode: C3BM68
                    legalName: Maple Coffee Inc.
                    tradeName: Maple Coffee
                blocklistHits: []
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /applications/{applicationId}/steps/{step}:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
      - name: step
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/StepName'
    put:
      tags:
        - assisted-onboarding
      operationId: updateAssistedApplicationStep
      x-required-privilege: mrev:assisted-onboarding:manage
      summary: 代客建档：保存一步资料
      description: |
        保存代客建档申请的一步资料，申请须为草稿或待补料。请求体恰含一个步骤键，且须与路径的 `{step}` 一致；各步字段规则同商户自己填入驻向导时的那一步。保存只校验已填字段的格式、不要求本步填齐，资料是否齐全在发起确认与代提交时统一校验。

        - `business`：改了 `country`，且已存结算银行账户的制式与新国家的制式不同（含新国家无条目）时，该账户整组视为未填：读申请不再返回 `bankAccount` / `bankName` / `storeId`，`settlement` 步要重填。
        - `documents`：按文档位绑定上传得到的 `fileId`，未传的文档位保持原绑定，传 `null` 移除。
        - `terms`：议价条款，只代客建档的入驻申请有。按支付方式（含插件入口专用行）的比例费率、固定单笔费与固定费免收截止日，外加手续费结算模式；整组置换。比例费率是小数字符串（`"0.022"` = 2.2%），须大于 0、不超过平台上限，至多 4 位小数（折成百分数至多两位小数）；固定单笔费是结算币种的最小单位整数串。条款随申请进合同，商户签署、申请提交后按它建立该商户的费率与结算模式。
        - 有未签的确认请求时，任何改动都使它作废（链接失效），须重新发起确认、按改后资料重新生成合同；已签的确认只在改到签署关键字段（议价条款、结算账户、法定名、注册号）时作废，须重新发起确认、Owner 重签。作废时响应 `signatureInvalidated = true`。

        置值写，不挂幂等键。

        **什么时候拒绝**：

        - `308201` 申请不在草稿或待补料（已提交审核、已决定或已撤回），重读详情。
        - `308204` 不是代客建档的申请。
        - `304202` 字段格式或长度不对、不在候选内；`details` 每项的 `field` 是字段路径（如 `settlement.bankAccount.accountNumber`），前端在对应字段旁提示。
        - `304204` 结算周期不在当前候选档位内，重取结算配置后重选。
        - `308206` 文档位引用的文件不可用，`details` 指到 `documents.<docKey>`，重新上传后再绑定。
        - `308406` 条款里的比例费率超过平台上限，`context.capPercentage` 是当时的上限（小数）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistedStepSaveRequest'
            examples:
              business:
                summary: Business
                value:
                  business:
                    currency: CAD
                    country: CA
                    legalBusinessName: Maple Coffee Inc.
                    tradeName: Maple Coffee
                    typeOfOwnership: CORPORATION
                    registrationNumber: '1234567'
              documents:
                summary: Documents（绑定已上传的 fileId）
                value:
                  documents:
                    docIncorporation:
                      fileId: a04d78e2915c4b36bf8e2107d63a95f1
              terms:
                summary: 议价条款
                value:
                  terms:
                    feeTerms:
                      - paymentMethod: wechat_instore
                        rate:
                          percentageRate: '0.022'
                          fixedFee: '30'
                          fixedFeeWaivedUntil: '2026-12-31'
                    billingModel: postpaid
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistedStepSaveResult'
              example:
                signatureInvalidated: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304202
        - 304204
        - 308201
        - 308204
        - 308206
        - 308406
  /applications/{applicationId}/files:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      tags:
        - assisted-onboarding
      operationId: uploadAssistedApplicationFile
      x-required-privilege: mrev:assisted-onboarding:manage
      summary: 代客建档：上传资料文件（随 documents 步保存时绑定）
      description: |
        返回的 `fileId` 在保存 documents 步时绑定到具体文档位。用途只有 `onboarding_document`，允许的格式与大小上限见 `MerchantFilePurpose` 用途表，前端照表先拦。申请须为草稿或待补料。每次上传产生新 `fileId`，不挂幂等键。

        **什么时候拒绝**：

        - `304205` 文件格式或大小不合（以服务端判定为准），换一个文件再传。
        - `308201` 申请不在草稿或待补料。
        - `308204` 不是代客建档的申请。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadForm'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - onboarding_document
      responses:
        '201':
          description: 已上传（尚未绑定）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
              example:
                fileId: 9a17be40d5c34f28b6e1027c9df3a85b
                fileName: owner-id.jpg
                fileSize: 880640
                contentType: image/jpeg
                previewUrl: https://files.example.com/o/9a17be40?exp=1755331200&sig=REDACTED&disp=inline
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304205
        - 308201
        - 308204
  /applications/{applicationId}/signature-requests:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      tags:
        - assisted-onboarding
      operationId: createApplicationSignatureRequest
      x-required-privilege: mrev:assisted-onboarding:manage
      summary: 代客建档：生成合同并给 Owner 发确认链接
      description: |
        资料齐全后发起确认：按申请资料与议价条款生成合同，向 Owner 邮箱发一个免登录的确认链接，返回链接到期时刻。链接有效期由平台设定。Owner 在确认页看资料与合同，签名确认后申请进入审核中；提异议则申请留在原状态，发起确认的人收到带异议理由的邮件。

        再次发起会使之前未签的链接失效。申请须为草稿或待补料。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**：

        - `308201` 申请不在草稿或待补料。
        - `308204` 不是代客建档的申请。
        - `304202` 有必填项未填或不合规的字段；`304203` 必传文档不全。两者的 `details` 都逐项指到缺项（字段路径同 `updateAssistedApplicationStep`），前端跳到缺项所在步标出。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: 已生成合同并发出确认链接
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignatureRequestCreated'
              example:
                signatureRequestId: sig_3301
                expiresAt: '2026-10-23T08:00:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304202
        - 304203
        - 308201
        - 308204
  /applications/{applicationId}/submission:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      tags:
        - assisted-onboarding
      operationId: submitAssistedApplication
      x-required-privilege: mrev:assisted-onboarding:manage
      summary: 代客建档：代提交
      description: |
        由运营代为提交，申请从草稿或待补料进入审核中，待补项清空，商户侧不收补料通知。用于审核员要求补料后由运营代补并代提交，以及 Owner 已签署、但提交时开通准备（签约、费率与报备）没做成、申请仍留在原状态时补做。须最近一次确认已由 Owner 签署、且签署后没改过签署关键字段；改过的须重新发起确认，Owner 签署后申请自动回到审核中，不必再调本接口。带状态前置，不挂幂等键。开通准备暂时没做成（可稍后重试的失败）时返回 `503`，申请未提交、状态不变；再调一次即可。

        **什么时候拒绝**：

        - `308201` 申请不在草稿或待补料（含已在审核中）。
        - `308203` 从未签署，或签署后改过签署关键字段，须重新发起确认（`createApplicationSignatureRequest`）。
        - `308204` 不是代客建档的申请。
        - `304202` 有必填项未填或不合规的字段；`304203` 必传文档不全。两者的 `details` 都逐项指到缺项（字段路径同 `updateAssistedApplicationStep`），前端跳到缺项所在步标出。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已提交，申请回到审核中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResult'
              example:
                status: UNDER_REVIEW
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304202
        - 304203
        - 308201
        - 308203
        - 308204
  /applications/{applicationId}/withdrawal:
    parameters:
      - $ref: '#/components/parameters/ApplicationIdPath'
    post:
      tags:
        - assisted-onboarding
      operationId: withdrawAssistedApplication
      x-required-privilege: mrev:assisted-onboarding:manage
      summary: 代客建档：撤回
      description: |
        Owner 签署前撤回代客建档：申请为已撤回、未签的确认链接失效、商户随之删除，不再出现在任何列表，记录留存。只对草稿且 Owner 未签署的申请可用；签署后不能撤回，即使申请仍是草稿。带状态前置，不挂幂等键。

        **什么时候拒绝**：

        - `308201` 申请不是草稿，或 Owner 已签署（含已签署进入审核、已决定或已撤回）。
        - `308204` 不是代客建档的申请。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 已撤回
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationStatusResult'
              example:
                status: WITHDRAWN
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308201
        - 308204
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  parameters:
    ApplicationIdPath:
      name: applicationId
      in: path
      required: true
      description: 申请标识。所属商户在本人数据范围外 → `404`。
      schema:
        $ref: '#/components/schemas/ApplicationId'
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
  schemas:
    ApplicationId:
      type: string
      minLength: 1
      maxLength: 32
      description: 申请标识。
    ApplicationType:
      type: string
      enum:
        - onboarding
        - acceptance_mode
        - entry_point
        - settlement_change
      description: 申请类型：`onboarding` 入驻 / `acceptance_mode` 受理模式开通 / `entry_point` 插件入口开通（含改店铺网址的复审）/ `settlement_change` 结算信息变更。
    SignupSource:
      type: string
      enum:
        - self_service
        - admin_portal
      description: 开户来源：`self_service` 商户自助注册 / `admin_portal` 管理后台代客建档。
    StepName:
      type: string
      enum:
        - contact
        - business
        - services
        - settlement
        - documents
        - terms
      description: 入驻资料的步骤标识，按向导顺序排列；`terms` 议价条款只代客建档有，排在最后。
    OwnerIdentityStatus:
      type: string
      enum:
        - new
        - existing
        - unusable
      description: Owner 邮箱对应的账号：`new` 不属任何平台用户，建档时新建 / `existing` 已属平台用户（某家商户的 Owner，或在商户后台没有身份），新商户挂在其名下 / `unusable` 已属其他商户的员工，或待验证、已停用，不能建档。
    ApplicationSummary:
      type: object
      x-parent: true
      description: 审核队列的一行。
      required:
        - applicationId
        - applicationType
        - status
        - merchant
        - merchantCode
        - signupSource
      properties:
        applicationId:
          $ref: '#/components/schemas/ApplicationId'
          readOnly: true
        applicationType:
          $ref: '#/components/schemas/ApplicationType'
        status:
          $ref: '#/components/schemas/ApplicationStatus'
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        signupSource:
          $ref: '#/components/schemas/SignupSource'
        submittedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 最近一次提交的时刻；从未提交过（草稿）不返回本键。
        decidedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 最近一次决定的时刻；还没决定过不返回本键。
    ApplicationDetail:
      type: object
      description: 申请详情 = 队列行 + 下列字段。按申请类型只返回对应部分，其余键不返回。
      allOf:
        - $ref: '#/components/schemas/ApplicationSummary'
        - type: object
          required:
            - missingFields
            - blocklistHits
            - history
          properties:
            decidedBy:
              $ref: '#/components/schemas/UserRef'
              description: 最近一次决定的人；还没决定过不返回本键。
            decisionRemark:
              type: string
              minLength: 1
              maxLength: 512
              description: 拒绝说明；仅已拒绝时返回。
            missingFields:
              type: array
              description: 审核标记的待补项，写作 `<step>.<field>`（文档为 `documents.<docKey>`）；仅待补料时非空。
              items:
                type: string
                minLength: 1
            steps:
              $ref: '#/components/schemas/ApplicationReviewSteps'
              description: 入驻五步的资料；仅入驻申请返回。
            settlementChange:
              $ref: '#/components/schemas/SettlementChange'
              description: 结算信息的新旧对比；仅结算信息变更返回。
            acceptanceMode:
              $ref: '#/components/schemas/AcceptanceMode'
              description: 申请开通的受理模式；仅受理模式开通返回。
            paymentMethods:
              type: array
              description: 申请开通的支付方式；仅受理模式开通返回。
              items:
                $ref: '#/components/schemas/ApplicationPaymentMethod'
            entryPoint:
              allOf:
                - $ref: '#/components/schemas/EntryPoint'
              enum:
                - plugin_shopify
                - plugin_allvalue
              description: 申请接入的插件入口；仅插件入口开通返回。
            storeUrl:
              $ref: '#/components/schemas/WebsiteUrl'
              description: 店铺网址；仅插件入口开通返回。
            signatureRequests:
              type: array
              description: 每次发起确认的记录，从新到旧；仅代客建档的入驻申请返回。
              items:
                $ref: '#/components/schemas/SignatureRequest'
            blocklistHits:
              type: array
              description: 与禁入名单比对的命中项；仅入驻申请比对，其余类型与无命中均为空数组。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            history:
              type: array
              description: 按时间从早到晚列出的提交、决定与代客建档操作。
              items:
                $ref: '#/components/schemas/ApplicationHistoryEntry'
    ApplicationReviewSteps:
      type: object
      additionalProperties: false
      description: 审核读的入驻五步资料：字段同商户入驻向导的读侧形态，结算步不含退款密码，文档位只给文件引用，不给访问地址（要看文件调 `createApplicationFileAccessUrl`）。代客建档的另带议价条款 `terms`。未填的不返回本键。
      properties:
        contact:
          $ref: '#/components/schemas/ContactStep'
        services:
          $ref: '#/components/schemas/ServicesStep'
        business:
          $ref: '#/components/schemas/BusinessStepRead'
        settlement:
          $ref: '#/components/schemas/ApplicationSettlementRead'
        documents:
          $ref: '#/components/schemas/ApplicationDocumentsRead'
        terms:
          $ref: '#/components/schemas/ApplicationTermsStep'
          description: 议价条款（`feeTerms` 与 `billingModel`）；只代客建档的入驻申请有，还没录入不返回本键。
    ApplicationDocumentsRead:
      type: object
      additionalProperties: false
      description: 审核读的文档位：已绑定的给文件引用与元数据（不含 `previewUrl`），未上传的不返回本键。
      properties:
        docStoreInside:
          $ref: '#/components/schemas/DocumentRef'
        docStoreOutside:
          $ref: '#/components/schemas/DocumentRef'
        docIncorporation:
          $ref: '#/components/schemas/DocumentRef'
        docOwnerId:
          $ref: '#/components/schemas/DocumentRef'
        docVoidCheque:
          $ref: '#/components/schemas/DocumentRef'
        docOther1:
          $ref: '#/components/schemas/DocumentRef'
        docOther2:
          $ref: '#/components/schemas/DocumentRef'
    SettlementSnapshot:
      type: object
      additionalProperties: false
      description: 某一时点的结算信息；账号只给末 4 位掩码。
      properties:
        bankName:
          type: string
          minLength: 1
          description: 银行名；结算由通道方执行的商户不返回本键。
        bankAccount:
          allOf:
            - $ref: '#/components/schemas/BankAccountIdentification'
          description: 结算银行账户，账号只给 `accountNumberMasked`；结算由通道方执行的商户不返回本键。
        settlementCycle:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 结算周期档位 code；展示名取同项的 `settlementCycleDisplayName`。
        settlementCycleDisplayName:
          type: string
          minLength: 1
          description: 结算周期的展示名；与 `settlementCycle` 同进退。
    ApplicationSettlementRead:
      type: object
      additionalProperties: false
      description: 审核读的结算步：账号只给掩码与已填标志；不含退款密码（由商户激活后自己设）。未填的不返回本键。
      properties:
        bankName:
          type: string
          minLength: 1
        bankAccount:
          allOf:
            - $ref: '#/components/schemas/BankAccountIdentification'
          description: 结算银行账户，账号只给 `accountNumberMasked` 与 `accountNumberSet`。
        settlementCycle:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 结算周期档位 code；展示名取同项的 `settlementCycleDisplayName`。
        settlementCycleDisplayName:
          type: string
          minLength: 1
          description: 结算周期的展示名；与 `settlementCycle` 同进退。
        storeId:
          $ref: '#/components/schemas/StoreId'
          description: 指定的门店；未指定时不返回本键。
    AssistedSettlementStep:
      type: object
      additionalProperties: false
      description: 代客建档的结算步：字段同商户入驻向导的结算步，但不含退款密码——退款密码由商户激活后在商户后台自己设，运营不经手。
      properties:
        bankName:
          type: string
          minLength: 1
        bankAccount:
          allOf:
            - $ref: '#/components/schemas/BankAccountIdentification'
          description: 结算银行账户；账号明文只写不回显。制式须等于该商户 Country 对应的制式。银行账户组（银行名、制式与该制式全部字段含账号）齐全才保存，缺任一项整组不保存；账号已保存且本次未传时沿用已存值。
        settlementCycle:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 结算周期档位 code，须在平台的结算周期候选内。
        storeId:
          oneOf:
            - $ref: '#/components/schemas/StoreId'
            - type: 'null'
          description: 可选；传 `null` 清空。
    SettlementChange:
      type: object
      additionalProperties: false
      description: 结算信息变更的新旧对比。`after` 只含申请要改的项，没改的项不返回。
      required:
        - before
        - after
      properties:
        before:
          $ref: '#/components/schemas/SettlementSnapshot'
        after:
          $ref: '#/components/schemas/SettlementSnapshot'
    ApplicationPaymentMethod:
      type: object
      additionalProperties: false
      required:
        - acceptanceMode
        - paymentMethodFamily
      properties:
        acceptanceMode:
          $ref: '#/components/schemas/AcceptanceMode'
        paymentMethodFamily:
          $ref: '#/components/schemas/PaymentMethodFamily'
    SignatureRequestStatus:
      type: string
      enum:
        - PENDING
        - SIGNED
        - DISPUTED
        - SUPERSEDED
      description: 确认请求的状态：`PENDING` 已发链接、Owner 还没处理 / `SIGNED` Owner 已签署 / `DISPUTED` Owner 提了异议 / `SUPERSEDED` 已作废（再次发起确认、改了签署关键字段或撤回）。
    SignatureRequest:
      type: object
      additionalProperties: false
      description: 一次发起确认的记录。
      required:
        - signatureRequestId
        - status
        - sentAt
        - expiresAt
      properties:
        signatureRequestId:
          type: string
          minLength: 1
          maxLength: 32
          readOnly: true
        status:
          $ref: '#/components/schemas/SignatureRequestStatus'
        sentAt:
          $ref: '#/components/schemas/Timestamp'
          description: 发出确认链接的时刻。
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: 确认链接到期的时刻。
        signedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 签署时刻；仅 `SIGNED` 返回。
        signerName:
          type: string
          minLength: 1
          maxLength: 128
          description: 签署人姓名；仅 `SIGNED` 返回。
        disputeReason:
          type: string
          minLength: 1
          maxLength: 300
          description: 异议理由；仅 `DISPUTED` 返回。
        disputedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 提异议的时刻；仅 `DISPUTED` 返回。
    ApplicationHistoryAction:
      type: string
      enum:
        - created
        - updated
        - submitted
        - resubmitted
        - approved
        - rejected
        - more_info_required
        - signature_requested
        - signed
        - disputed
        - withdrawn
      description: 申请历史的动作：`created` 代客建档 / `updated` 代客建档改资料 / `submitted` 提交 / `resubmitted` 补料后重提 / `approved` 通过 / `rejected` 拒绝 / `more_info_required` 要求补料 / `signature_requested` 发起确认 / `signed` Owner 签署 / `disputed` Owner 提异议 / `withdrawn` 撤回。
    ApplicationHistoryEntry:
      type: object
      additionalProperties: false
      description: 申请历史的一条。
      required:
        - at
        - action
        - actor
      properties:
        at:
          $ref: '#/components/schemas/Timestamp'
        action:
          $ref: '#/components/schemas/ApplicationHistoryAction'
        actor:
          $ref: '#/components/schemas/UserRef'
          description: 做这一步的人：商户 Owner 或后台用户。
        remark:
          type: string
          minLength: 1
          maxLength: 512
          description: 拒绝说明、跳过禁入名单的理由或 Owner 的异议理由；没有时不返回本键。
    ApplicationDecision:
      type: object
      additionalProperties: false
      description: 对审核中的申请下决定。`decision = REJECTED` 时 `remark` 必填；`decision = MORE_INFO_REQUIRED` 时 `missingFields` 必填，其余决定不传这两项。
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - APPROVED
            - REJECTED
            - MORE_INFO_REQUIRED
          description: '`APPROVED` 通过 / `REJECTED` 拒绝 / `MORE_INFO_REQUIRED` 要求补料（只用于入驻申请）。'
        remark:
          type: string
          minLength: 1
          maxLength: 512
          description: 拒绝说明，随拒绝结果给到商户或归属 BD。
        missingFields:
          type: array
          minItems: 1
          description: 待补项，写作 `<step>.<field>`（文档为 `documents.<docKey>`）。
          items:
            type: string
            minLength: 1
    BlocklistOverrideApproval:
      type: object
      additionalProperties: false
      required:
        - remark
      properties:
        remark:
          type: string
          minLength: 1
          maxLength: 512
          pattern: ^.*\S.*$
          description: 跳过禁入名单的理由，不能为空白。
    ApplicationStatusResult:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatus'
    AssistedOnboardingCheckRequest:
      type: object
      additionalProperties: false
      required:
        - ownerEmail
      properties:
        ownerEmail:
          type: string
          format: email
          maxLength: 254
          description: Owner 邮箱。
        legalName:
          type: string
          minLength: 1
          maxLength: 128
          description: 法定名，用于同名商户提示与禁入名单比对。
        registrationNumber:
          type: string
          minLength: 1
          maxLength: 64
          description: 注册号，用于同名商户提示与禁入名单比对。
        ownerPhone:
          $ref: '#/components/schemas/Phone'
    SameNameMerchant:
      type: object
      additionalProperties: false
      description: 法定名相同或注册号相同的一家存量商户（只给商户码与名称）。
      required:
        - merchantCode
        - legalName
      properties:
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        legalName:
          type: string
          minLength: 1
        tradeName:
          type: string
          minLength: 1
          description: 对外经营名；没有时不返回本键。
    AssistedOnboardingCheckResult:
      type: object
      additionalProperties: false
      required:
        - ownerIdentity
        - sameNameMerchants
        - blocklistHits
      properties:
        ownerIdentity:
          $ref: '#/components/schemas/OwnerIdentityStatus'
        sameNameMerchants:
          type: array
          description: 法定名相同或注册号相同的存量商户；`legalName` 与 `registrationNumber` 都没传或都无相同时为空数组。
          items:
            $ref: '#/components/schemas/SameNameMerchant'
        blocklistHits:
          type: array
          description: 禁入名单命中项；无命中为空数组。
          items:
            $ref: '#/components/schemas/BlocklistHit'
    AssistedOwnerContact:
      type: object
      additionalProperties: false
      description: 代客建档的 Owner 联系人。邮箱已属平台用户时，以该用户已有的姓名电话为准，本处所给只用于新建账号。
      required:
        - email
        - firstName
        - lastName
        - phone
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Owner 登录邮箱；确认链接与开户邮件发到这里。
        firstName:
          type: string
          minLength: 1
          maxLength: 128
        lastName:
          type: string
          minLength: 1
          maxLength: 128
        phone:
          $ref: '#/components/schemas/Phone'
        jobTitle:
          type: string
          minLength: 1
          maxLength: 64
    AssistedApplicationCreate:
      type: object
      additionalProperties: false
      description: 代客建档。
      required:
        - owner
        - language
      properties:
        owner:
          $ref: '#/components/schemas/AssistedOwnerContact'
        partnerId:
          $ref: '#/components/schemas/PartnerId'
          description: 所属机构；不属任何机构不传。候选取自机构管理。
        bdUserId:
          $ref: '#/components/schemas/UserId'
          description: 归属 BD（后台用户）；不传 = 暂无归属 BD。
        language:
          allOf:
            - $ref: '#/components/schemas/Language'
          description: 商户语言：确认链接、开户邮件等发给商户的通知按它出。
    AssistedApplicationCreated:
      type: object
      additionalProperties: false
      required:
        - applicationId
        - merchantId
        - merchantCode
        - ownerIdentity
      properties:
        applicationId:
          $ref: '#/components/schemas/ApplicationId'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        ownerIdentity:
          allOf:
            - $ref: '#/components/schemas/OwnerIdentityStatus'
          enum:
            - new
            - existing
          description: '`new` 新建了 Owner 账号 / `existing` 挂在已有用户名下。'
    AssistedStepSaveRequest:
      type: object
      description: 逐步保存请求体；恰含一个步骤键、且须与路径的 `{step}` 一致（服务端校验，不一致 → 400）。
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        contact:
          $ref: '#/components/schemas/ContactStep'
        services:
          $ref: '#/components/schemas/ServicesStep'
        business:
          $ref: '#/components/schemas/BusinessStep'
        settlement:
          $ref: '#/components/schemas/AssistedSettlementStep'
        documents:
          $ref: '#/components/schemas/DocumentsStep'
        terms:
          $ref: '#/components/schemas/ApplicationTermsStep'
    AssistedStepSaveResult:
      type: object
      additionalProperties: false
      required:
        - signatureInvalidated
      properties:
        signatureInvalidated:
          type: boolean
          description: 本次保存是否使未签或已签的确认请求作废；`true` 时须重新发起确认。
    SignatureRequestCreated:
      type: object
      additionalProperties: false
      required:
        - signatureRequestId
        - expiresAt
      properties:
        signatureRequestId:
          type: string
          minLength: 1
          maxLength: 32
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: 确认链接到期的时刻。
    MerchantAppIdTodo:
      type: object
      additionalProperties: false
      description: 补录待办的一行。
      required:
        - merchant
        - onlineServiceType
        - activatedAt
      properties:
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        onlineServiceType:
          allOf:
            - $ref: '#/components/schemas/OnlineServiceType'
          enum:
            - APP
            - MINI_PROGRAM
            - OTHER
          description: 商户填的线上服务类型。
        activatedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 激活时刻。
    ApplicationStatus:
      type: string
      enum:
        - DRAFT
        - UNDER_REVIEW
        - MORE_INFO_REQUIRED
        - APPROVED
        - REJECTED
        - WITHDRAWN
      description: 申请状态：`DRAFT` 草稿 / `UNDER_REVIEW` 审核中 / `MORE_INFO_REQUIRED` 待补料 / `APPROVED` 已通过 / `REJECTED` 已拒绝 / `WITHDRAWN` 已撤回。
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    MerchantBrief:
      type: object
      additionalProperties: false
      description: 一个商户的标识与名称（列表与记录上展示「哪个商户」）。
      required:
        - merchantId
        - merchantName
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantName:
          type: string
          minLength: 1
    MerchantCode:
      type: string
      minLength: 1
      maxLength: 20
      description: 对外商户码。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    Phone:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      maxLength: 16
      description: 电话号码，**国际格式整串**（`+` + 国家码 + 正文号，如 `+16045550123`）——**一个字段装完，没有独立的区号字段**。 上界 16 = `+` 加最多 15 位数字（国际号码总长上限）；**服务端只校验这一条通用规则 + 区号在白名单内**， **不按区号分别限长**。前端按所选区号收窄输入位数属输入体验、不是契约约束。 渲染「区号下拉 + 号码框」两个控件时，用前端参考数据里的区号表做**最长前缀匹配**拆分本串。
    PartnerId:
      type: string
      minLength: 1
      maxLength: 32
      description: 机构标识。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    Language:
      type: string
      enum:
        - en
        - fr
        - zh
      description: 平台支持的语言。
    UserRef:
      type: object
      additionalProperties: false
      description: 一个平台用户的标识与显示名（列表与记录上展示「谁」）。
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
    ContactStep:
      type: object
      description: Step 1 Contact。姓名、职务、电话是 Owner 的账号资料：本步回显当前值、可修改，保存即写回账号资料；哪些字段只读看申请的 `readonlyFields`。referredBy = Moneris（大小写不敏感）时 monerisMid + monerisManagerName 必填。
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          readOnly: true
          description: Owner 登录邮箱，只读、不提交。
        firstName:
          type: string
          maxLength: 128
        lastName:
          type: string
          maxLength: 128
        businessTitle:
          type: string
          maxLength: 64
          description: 职务文本。预设 Business Owner / Manager / Employee 可直选；选 Other 时提交用户填写的自定义文本，不提交字面 "Other"。
        phone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 联系人电话。区号候选取自前端参考数据，服务端校验区号在白名单内。
        referredBy:
          type: string
          maxLength: 128
          description: 来源；注册链接带来则只读，否则可填；填 Moneris 触发条件字段。
        monerisMid:
          type: string
          maxLength: 64
          description: 条件必填：referredBy = Moneris 时。
        monerisManagerName:
          type: string
          maxLength: 128
          description: 条件必填：referredBy = Moneris 时。
    PaymentMethod:
      type: string
      minLength: 1
      maxLength: 64
      description: 支付方式目录标识（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，调用方从候选集取来原样回传，按未知值安全处理。
      examples:
        - wechat_instore
    ServicesStep:
      type: object
      description: Services 步（向导第 3 步）；至少选 1 个支付方式——该 ≥1 是提交完整性、不是本形状的约束：由服务端在 `mode=next` 校验，草稿态可为空。
      additionalProperties: false
      properties:
        selectedPaymentMethods:
          type: array
          description: 选中的支付方式目录码，须在 Business 步所选结算币种的候选内。数组整组置换，草稿态允许 `[]`。
          items:
            $ref: '#/components/schemas/PaymentMethod'
    OwnershipType:
      type: string
      enum:
        - SOLE_PROPRIETORSHIP
        - PARTNERSHIP
        - CORPORATION
        - NON_PROFIT
      description: 企业类型（入驻 Business 步与 Business Profile 共用），展示名由前端按码 i18n。
    OnlineServiceType:
      type: string
      enum:
        - WEBSITE
        - APP
        - MINI_PROGRAM
        - OTHER
      description: 线上服务类型（入驻 Business 步与 Service 页共用），展示名由前端按码 i18n。只有 `WEBSITE` 有网址。
    WebsiteUrl:
      type: string
      maxLength: 256
      pattern: ^https?://\S+$
      description: 商户经营网址（http / https）。
    BusinessStepRead:
      type: object
      description: '`BusinessStep` 的读侧形态：条件字段与备注**不适用 / 未填时不返回本键、不返** `null`。'
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        country:
          type: string
          description: ISO-3166 国家码（有效 Currency × Country 组合以后端配置为准）。
        legalBusinessName:
          type: string
          description: 身份字段（激活后不可改）。
        tradeName:
          type: string
        typeOfOwnership:
          allOf:
            - $ref: '#/components/schemas/OwnershipType'
          description: 身份字段（激活后不可改）。
        registrationNumber:
          type: string
        businessAddress:
          type: string
        city:
          type: string
        province:
          type: string
          description: 取自 `/config/countries` 里所选 country 那一组的 `provinces[].code`（ISO 3166-2 地区部分），展示名取同项的 `label`；改 country 后须重选。所选国家有省 / 州候选时必填，否则不传。
        postalCode:
          type: string
          description: 邮编，按所选国家的格式校验（前端参考数据预校，服务端重校）；所选国家有邮编制度时必填。
        timeZone:
          type: string
          description: 商户 IANA 时区（如 `America/Toronto`，不用 PT / ET 缩写）。候选随所选省 / 州、无省 / 州的国家按国家，取 `/config/countries` 下发的 `timeZones`，服务端按同一候选校验。
        language:
          allOf:
            - $ref: '#/components/schemas/Language'
          description: 商户语言：发给商户的通知（邮件、微信、站内信）与月对账单 PDF 按它出；界面语言、收据与导出文件、发给某个人本人的邮件不看它，按用户自己的语言。
        businessPhone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 商户营业电话。区号候选取自前端参考数据，服务端校验区号在白名单内。
        industryCategory:
          type: string
          description: 行业大类码（`/config/industries` 的 `items[].code`，如 `A0`），不是展示名，展示名取同项的 `label`。身份字段（激活后不可改）。
        mcc:
          type: string
          description: 四位 MCC，级联 Industry（取自所选大类的 `mccOptions[].code`，展示名取同项的 `label`）；身份字段（激活后不可改）。
        typeOfOnlineService:
          $ref: '#/components/schemas/OnlineServiceType'
          description: 线上服务类型。本步选填、无默认值；Services 步选了任一线上支付方式时必填。
        websiteUrl:
          $ref: '#/components/schemas/WebsiteUrl'
          description: 经营网址（http / https）。typeOfOnlineService = WEBSITE 且选了线上支付方式时必填。
        note:
          type: string
    BankAccountScheme:
      type: string
      enum:
        - ca_local
        - us_local
      description: |
        结算银行账户制式：`ca_local` 加拿大 EFT / `us_local` 美国 ACH。

        封闭枚举：新增国家要在契约里加取值与对应字段、前端加表单组件、加出款适配器，不是纯配置。
    BankAccountIdentification:
      type: object
      additionalProperties: false
      description: |
        结算银行账户（按商户 Country 对应的制式）。`type` 定制式、随制式带对应字段，不属该制式的字段不传（传了 → 400）：

        - `ca_local`（加拿大 EFT）—— 须带 `transitNumber` + `institutionNumber`；
        - `us_local`（美国 ACH）—— 须带 `routingNumber` + `accountType`。

        各制式的字段名保留本国叫法、位数为固定契约值、由服务端按 `type` 校验。`type` 由商户 Country 决定，国家 → 制式由所在面的配置接口给出（形状见 `CountryBankAccountType`）。

        账号明文 write-only、读侧走掩码 + 已填标志。本 schema 是基础形；写面与读面各自用 allOf 收紧（写面的齐全 / 必填规则见各写面，读面须带 `accountNumberMasked` + `accountNumberSet`）。
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/BankAccountScheme'
          description: 结算银行账户制式（`ca_local` 加拿大 EFT / `us_local` 美国 ACH）。**封闭 enum**——新增国家 = 契约加取值与对应字段 + 前端加表单组件 + 出款适配器，不是纯配置。
        transitNumber:
          type: string
          pattern: ^[0-9]{5}$
          description: Transit Number，5 位数字（分行）。只属 `type=ca_local`（**此时必填**）。
        institutionNumber:
          type: string
          pattern: ^[0-9]{3}$
          description: Institution Number，3 位数字（银行）。只属 `type=ca_local`（**此时必填**）。
        routingNumber:
          type: string
          pattern: ^[0-9]{9}$
          description: ABA Routing Number，9 位数字。只属 `type=us_local`（**此时必填**）。
        accountType:
          type: string
          enum:
            - checking
            - savings
          description: 账户类型（ACH 必需）。只属 `type=us_local`（**此时必填**）。
        accountNumber:
          type: string
          writeOnly: true
          pattern: ^[0-9]{4,17}$
          description: 银行账号（write-only 输入；read 走 accountNumberMasked，明文不回显）。位数随制式：`ca_local` 6-12 位、`us_local` 4-17 位——schema 只守两制式的并集，精确位数由服务端按 `type` 校验。
        accountNumberMasked:
          type: string
          readOnly: true
          description: 账号末 4 位掩码回显（如 `•••• 5678`）。
        accountNumberSet:
          type: boolean
          readOnly: true
          description: 是否已填 accountNumber（跨设备恢复 / 草稿完整性判定用）。
    SettlementCycleCode:
      type: string
      minLength: 1
      description: 结算周期档位的**稳定取值**（`SettlementCycleOption.code`）。**对客户端不透明**——从候选集里取来原样回传， 不要解析、拼接或据其分支；**不要传展示名**（那是展示文案、不是取值）。 服务端按**提交时点**的候选集校验：不在集内 → 拒绝（错误码见所在面，带 `details` 字段级明细），**不静默回落到候选集第一项**；前端应重取候选集让用户重选。 ⚠️ **你当前选中的取值不会凭空失效**——「打开编辑框却选不中自己现在的档位」「草稿存不回去」这类情形不会发生，无需为此写兜底。
    StoreId:
      type: string
      minLength: 1
      maxLength: 64
      description: 店铺编号，商户自设。
    FileId:
      type: string
      minLength: 1
      maxLength: 32
      description: 文件引用：上传后返回的稳定标识。
    WebUrl:
      type: string
      pattern: ^https?://\S+$
      description: http 或 https 绝对地址。平台产出的文件 / 图片 / 付款链接地址与渠道给出的跳转地址共用。
    DocumentRef:
      type: object
      description: Documents step 保存时绑定的文档引用（按 fileId 关联已上传的文件）。
      additionalProperties: false
      required:
        - fileId
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
          description: 上传接口返回的 fileId，提交本 step 时用它完成绑定。
        fileName:
          type: string
          readOnly: true
          description: 原始文件名（文档卡片据此显示名称）；提交时不必传。
        fileSize:
          type: integer
          format: int64
          readOnly: true
          description: 字节数；提交时不必传。
        uploadedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 上传时刻；提交时不必传。
        previewUrl:
          $ref: '#/components/schemas/WebUrl'
          readOnly: true
          description: 该文档的**内联展示地址**（**只出不入**），供卡片缩略图 / 预览。**短时效**，过期后重新加载本申请取新值； **不要持久化、不要分享**——入驻文档含身份与银行资料。哪些面必返本键，见各面自己的读形态。
    FeeRateEntryPoint:
      type: string
      enum:
        - plugin_shopify
        - plugin_allvalue
        - plugin_allvalue_xhs
      description: 费率专用行所属的插件入口。
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    FeeRateWrite:
      type: object
      additionalProperties: false
      description: 写入商户费率时给出的费率：比例费率、固定单笔费与固定费免收截止日。
      required:
        - percentageRate
        - fixedFee
      properties:
        percentageRate:
          type: string
          pattern: ^0(\.[0-9]{1,4})?$
          description: 比例费率，小数、最多四位小数（即百分数两位，`0.0225` = 2.25%）；须大于 0，为 0 → 通用 `400`。
          examples:
            - '0.022'
        fixedFee:
          type: string
          pattern: ^[0-9]+$
          description: 固定单笔费，商户结算币种最小单位整数串；没有为 `0`。
          examples:
            - '30'
        fixedFeeWaivedUntil:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 固定单笔费免收截止日（含）；不带 = 不免。
    ApplicationFeeTerm:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - rate
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        entryPoint:
          allOf:
            - $ref: '#/components/schemas/FeeRateEntryPoint'
          description: 专用行所属的插件入口；不带即通用行。
        rate:
          $ref: '#/components/schemas/FeeRateWrite'
    BillingModel:
      type: string
      enum:
        - standard
        - postpaid
      description: 手续费结算模式：`standard` 轧差（从结算款里扣）、`postpaid` 月结。
    ApplicationTermsStep:
      type: object
      description: |
        议价条款步，只用于代客建档的入驻申请。

        - `feeTerms` 整组置换：每个支付方式至多一行通用行（不带 `entryPoint`），另可为插件入口各加一行专用行；支付方式须在 Services 步所选的范围内。可为空数组，没有条款行的支付方式按标准费率开通。
        - 比例费率另须不超过保存时的平台上限；超了整步不保存，错误带当时的上限（`capPercentage`）。
        - `billingModel` 不传即轧差。
      additionalProperties: false
      properties:
        feeTerms:
          type: array
          description: 约定费率，一行一个支付方式（或其插件入口专用行）。
          items:
            $ref: '#/components/schemas/ApplicationFeeTerm'
        billingModel:
          allOf:
            - $ref: '#/components/schemas/BillingModel'
          description: 手续费结算模式；不传即轧差。
    AcceptanceMode:
      type: string
      enum:
        - in_store
        - online
      description: 受理模式：`in_store` 线下 / `online` 线上。
    PaymentMethodFamily:
      type: string
      description: 支付方式族（品牌）。
      enum:
        - wechat
        - alipay
        - unionpay
        - credit_card
    EntryPoint:
      type: string
      description: 入口：`pos` 终端 · `merchant_app` 商户 App · `merchant_portal` 商户后台 · `open_api` 开放 API · `checkout` 收银台页面（店铺码、账单、Product Link） · `channel_inbound` 通道直接推来的订单 · `plugin_shopify` Shopify 插件 · `plugin_allvalue` AllValue 插件 · `plugin_allvalue_xhs` AllValue 小红书 · `system` 系统发起。
      enum:
        - pos
        - merchant_app
        - merchant_portal
        - open_api
        - checkout
        - channel_inbound
        - plugin_shopify
        - plugin_allvalue
        - plugin_allvalue_xhs
        - system
    FileAccessUrl:
      type: object
      additionalProperties: false
      description: 现签的短时效文件访问地址。
      required:
        - url
        - expiresAt
      properties:
        url:
          $ref: '#/components/schemas/WebUrl'
          description: 访问地址，不要持久化、不要分享。
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: 地址到期的时刻。
    BusinessStep:
      type: object
      description: Business 步（向导第 2 步）。Currency × Country 有效组合以后端配置为准；Services 步选了任一线上支付方式时 typeOfOnlineService 必填、为 WEBSITE 时 websiteUrl 必填（在 Services 步保存与提交时校验）。
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        country:
          type: string
          maxLength: 2
          description: ISO-3166 国家码（有效 Currency × Country 组合以后端配置为准）。
        legalBusinessName:
          type: string
          maxLength: 128
          description: 身份字段（激活后不可改）。
        tradeName:
          type: string
          maxLength: 128
        typeOfOwnership:
          allOf:
            - $ref: '#/components/schemas/OwnershipType'
          description: 身份字段（激活后不可改）。
        registrationNumber:
          type: string
          maxLength: 64
        businessAddress:
          type: string
          maxLength: 256
        city:
          type: string
          maxLength: 64
        province:
          type:
            - string
            - 'null'
          maxLength: 64
          description: 取自 `/config/countries` 里所选 country 那一组的 `provinces[].code`（ISO 3166-2 地区部分），展示名取同项的 `label`；改 country 后须重选。所选国家有省 / 州候选时必填；没有的国家不设值：新填不传，已存的旧值传 `null` 清掉。
        postalCode:
          type:
            - string
            - 'null'
          maxLength: 16
          description: 邮编，按所选国家的格式校验（前端参考数据预校，服务端重校）。所选国家有邮编制度时必填；没有的国家不设值：新填不传，改 country 后已存的旧值传 `null` 清掉。
        timeZone:
          type:
            - string
            - 'null'
          maxLength: 64
          description: 商户 IANA 时区（如 `America/Toronto`，不用 PT / ET 缩写）。候选随所选省 / 州、无省 / 州的国家按国家，取 `/config/countries` 下发的 `timeZones`，服务端按同一候选校验。改 country 后须重选，还没选定时传 `null` 清掉旧值。
        language:
          allOf:
            - $ref: '#/components/schemas/Language'
          description: 商户语言：发给商户的通知（邮件、微信、站内信）与月对账单 PDF 按它出；界面语言、收据与导出文件、发给某个人本人的邮件不看它，按用户自己的语言。
        businessPhone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 商户营业电话。区号候选取自前端参考数据，服务端校验区号在白名单内。
        industryCategory:
          type: string
          maxLength: 64
          description: 行业大类码（`/config/industries` 的 `items[].code`，如 `A0`），不是展示名，展示名取同项的 `label`。身份字段（激活后不可改）。
        mcc:
          type: string
          maxLength: 4
          description: 四位 MCC，级联 Industry（取自所选大类的 `mccOptions[].code`，展示名取同项的 `label`）；身份字段（激活后不可改）。
        typeOfOnlineService:
          oneOf:
            - $ref: '#/components/schemas/OnlineServiceType'
            - type: 'null'
          description: 线上服务类型。本步选填、无默认值；Services 步选了任一线上支付方式时必填。`null` = 清空。
        websiteUrl:
          oneOf:
            - $ref: '#/components/schemas/WebsiteUrl'
            - type: 'null'
          description: 经营网址（http / https）。typeOfOnlineService = WEBSITE 且选了线上支付方式时必填。`null` = 清空。
        note:
          type:
            - string
            - 'null'
          maxLength: 300
    DocumentsStep:
      type: object
      description: Step 5 Documents。docIncorporation / docOwnerId / docVoidCheque 必传；docStoreInside / docStoreOutside 在 Services 步选了线下支付方式时必传；docOther1 / docOther2 可选。绑定按 fileId。
      additionalProperties: false
      properties:
        docStoreInside:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docStoreOutside:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docIncorporation:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docOwnerId:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docVoidCheque:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docOther1:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docOther2:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
    FileUploadForm:
      type: object
      additionalProperties: false
      description: |
        上传入参(`multipart/form-data`)。文件经本平台中转存入对象存储;按 `purpose` 校验实际文件的格式与大小,不合规 → 400。

        不要手设 `Content-Type`:直接提交 `FormData`,由客户端带上 `boundary`。
      required:
        - file
        - purpose
      properties:
        file:
          type: string
          format: binary
          description: 文件本体。
        purpose:
          type: string
          description: 文件用途,决定允许的格式、大小上限与取用方式;每个上传入口只接受它所属业务范围内的用途。
    MerchantFilePurpose:
      type: string
      description: |
        文件用途目录——用途决定允许的格式、大小上限与取用方式；每个上传入口只接受它列出的子集，传入其他用途 → 400。

        | 用途 | 允许格式 | 大小上限 | 传上去之后怎么取用 |
        |---|---|---|---|
        | `onboarding_document` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（含身份与银行资料，仅授权主体可取） |
        | `void_cheque` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `store_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `office_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址 |
        | `merchant_logo` | PNG / JPEG | **512KB（固定上限）** | 长效稳定的公开地址（要展示给外部访客） |
        | `payment_page_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `link_banner` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `giftcard_brand_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `product_image` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `channel_application_material` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（渠道报备用的营业执照与网站截图，仅授权主体可取） |

        **短时效地址不要持久化、不要分享**（过期即失效，重新读取所在资源可拿到新的）；长效公开地址可直接放进页面。
      enum:
        - onboarding_document
        - void_cheque
        - store_photo
        - office_photo
        - merchant_logo
        - payment_page_logo
        - link_banner
        - giftcard_brand_logo
        - product_image
        - channel_application_material
    UploadedFile:
      type: object
      additionalProperties: false
      description: |
        已上传的文件。上传成功不等于生效:`fileId` 要随对应的业务写操作提交,文件才归属该业务对象;从未被引用的文件不生效,前端无需处理。
      required:
        - fileId
        - fileName
        - fileSize
        - contentType
        - previewUrl
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
          description: 该文件的稳定引用,业务写操作提交它;不要保存任何物理地址。
          examples:
            - 0f8c2a6e4b1d47f0a9c3e5d7b2148a6f
        fileName:
          type: string
          description: 原始文件名。
        fileSize:
          type: integer
          format: int64
          description: 字节数。
        contentType:
          type: string
          description: 服务端判定的内容类型。
        previewUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 可渲染地址(只出不入),供上传后立即回显。按用途分长效公开地址或短时效地址,短时效的不要持久化。
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
