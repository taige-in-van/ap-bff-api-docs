      summary: 推荐码管理
      description: |
        本人可管范围内后台账号的推荐码，分页，按码主人、生效码在前。范围按账号的所属机构收口：数据范围为全部商户的看全部账号；为所属机构的只看所属机构为本人所属机构或其直接下级机构的账号；为本人名下商户的只看本人。停用 / 重新启用他人的码用同一范围。可按码主人、码主人的所属机构、状态筛选。
      parameters:
        - name: ownerUserId
