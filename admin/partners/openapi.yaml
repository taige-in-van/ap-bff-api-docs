openapi: 3.1.0
info:
  title: 管理后台 机构与分润 — 前端契约面
  version: 2.0.1
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的机构与分润契约：机构与两层上下级、启停，机构分润方案与成本率，平台提成矩阵与提成规则，按生效日改派商户的归属销售与整机构改派，提成报表与员工提成的查看与导出，后台账号的推荐码。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **金额与比例口径**：金额是对应币种最小单位的整数串，带币种；不同结算币种的金额分别合计，不跨币种相加。比例是小数串，最多六位小数（`0.006` = 0.6%）。交易月与生效月是 `YYYY-MM`，按字面值收发。

    **幂等 / CSRF 口径**：

    - 新建机构、整机构改派带 `Idempotency-Key`：同一次操作的重试沿用同一个键，重复提交不会重复执行。
    - 其余写操作按目标值写，同值重提不改动，不挂幂等键。
    - 导出按读处理，不挂幂等键。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。

    **可见范围**：机构、分润方案、提成矩阵与提成规则是平台级页面，只看功能权限。改派按商户（单户）或源机构（整机构）求数据可见范围。提成报表按主体收口：数据范围为本人名下商户的只看主体为本人的 BD 报表；为所属机构的只看主体为所属机构及其直接下级机构的机构报表；全部商户的看全部。员工提成按员工收口：本人名下商户只看本人；所属机构只看所属组织为所属机构及其直接下级机构的员工；全部商户看全部。跨范围临时授权不作用于两者。他人推荐码按账号的所属机构收口。范围外的对象不出现在列表、合计与导出里，按标识访问一律 `404`。

    **操作审计**：本面的写操作记入操作审计（带操作人、对象、前后状态或前后值）；查询、详情、导出不记。操作人恒为当前登录的后台用户，请求体里没有操作人字段。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: partners
    x-displayName: 机构
    description: 机构列表与详情、新建、编辑、停用与启用。
  - name: commission-plans
    x-displayName: 机构分润方案
    description: 机构的分润方案时段与成本率，设新方案。
  - name: commission-rate-matrix
    x-displayName: 提成矩阵
    description: 平台提成矩阵：按月查看、整组提交新版、导出。
  - name: merchant-assignments
    x-displayName: 商户归属
    description: 按生效日改派单个商户的归属销售、整机构改派。
  - name: commission-reports
    x-displayName: 提成报表
    description: 提成报表列表、合计与行，员工提成，导出。
  - name: referral-codes
    x-displayName: 推荐码
    description: 本人推荐码与推荐链接，他人推荐码的查看与停用 / 重新启用。
  - name: options
    x-displayName: 候选
    description: 机构候选与销售候选。
paths:
  /partners:
    get:
      tags:
        - partners
      operationId: listPartners
      x-required-privilege: orgbd:partner:view
      summary: 机构列表
      description: |
        列出机构，分页，按创建时间从新到旧。可按名称或联系人关键字、启用状态、上级机构筛选。

        每行带当月生效的分润方案的基数类型 `currentBasisType`；当月没有生效方案的不返回本键。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 按机构名称或联系人模糊匹配。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - name: enabled
          in: query
          required: false
          description: '`true` 只看启用中 / `false` 只看已停用；不传不筛。'
          schema:
            type: boolean
        - name: parentPartnerId
          in: query
          required: false
          description: 按上级机构，只列它的直接下级机构。
          schema:
            $ref: '#/components/schemas/PartnerId'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerSummary'
              example:
                total: 1
                data:
                  - partnerId: ptn_0032
                    partnerName: Maple Partners East
                    parent:
                      partnerId: ptn_0031
                      partnerName: Maple Partners
                    contactName: Linda Wu
                    contactPhone: '+16045550188'
                    contactEmail: linda@maplepartners.example
                    commissionEnabled: true
                    enabled: true
                    currentBasisType: SPREAD
                    createdAt: '2026-03-02T10:00:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - partners
      operationId: createPartner
      x-required-privilege: orgbd:partner:manage
      summary: 新建机构
      description: |
        新建一个机构。只有机构名称必填；不传 `commissionEnabled` = 计算分润。新机构为启用中。机构名称不要求唯一。

        建成后可随即邀请该机构的首个机构账号：另调 staff 契约的 `createStaff`（数据范围 `partner`、`partnerId` 为新机构）。两次调用互相独立，邀请失败时机构保留，之后在后台账号处以该机构为所属机构再邀请；邀请另需建号权限，没有时只建机构。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**（不建）：

        - `308754` 所选上级机构不可选：不存在、已停用，或本身已有上级（只两层）。
        - 名称缺失、字段超长、邮箱格式不对 → `400`。

        记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreate'
            example:
              partnerName: Maple Partners East
              parentPartnerId: ptn_0031
              contactName: Linda Wu
              contactPhone: '+16045550188'
              contactEmail: linda@maplepartners.example
      responses:
        '201':
          description: 已建机构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCreated'
              example:
                partnerId: ptn_0032
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308754
  /partners/{partnerId}:
    parameters:
      - $ref: '#/components/parameters/PartnerIdPath'
    get:
      tags:
        - partners
      operationId: getPartner
      x-required-privilege: orgbd:partner:view
      summary: 机构详情
      description: |
        一个机构的全部资料、上级与直接下级机构。不含分润方案与成本率：详情页的分润方案区块另调 `listPartnerCommissionPlans`（需看分润配置的权限），无该权限不显示该区块。

        详情页的「名下商户」「机构账号」「提成报表」分别以 `partnerId` 筛选商户列表（merchants 契约 `listMerchants`）、后台账号列表（staff 契约 `listStaff`）与提成报表列表（`listCommissionReports`）。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerDetail'
              example:
                partnerId: ptn_0031
                partnerName: Maple Partners
                contactName: Linda Wu
                commissionEnabled: true
                enabled: true
                officeAddress: 100 King St W, Toronto
                children:
                  - partnerId: ptn_0032
                    partnerName: Maple Partners East
                    enabled: true
                createdAt: '2026-03-02T10:00:00Z'
                updatedAt: '2026-09-20T08:00:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - partners
      operationId: updatePartner
      x-required-privilege: orgbd:partner:manage
      summary: 编辑机构
      description: |
        整体替换机构资料、上级机构与是否计算分润，字段规则同 `createPartner`；不传的选填字段 = 清空，不传 `parentPartnerId` = 清空上级（成为一级机构）。

        - 改「是否计算分润」自改值当月起生效，之前的月份（含之后被重算的）仍按当时的值；同一个月内多次改值以最后一次为准；改值本身不触发重算。
        - 改上级即改上级机构的机构账号看得到的商户范围。

        **什么时候拒绝**（机构不变）：

        - `308754` 上级机构不可选：不存在、已停用、本身已有上级、就是本机构，或本机构已有下级机构（只两层）。只在新设或更换上级时判；`parentPartnerId` 与现值相同时不判，上级已停用的机构照常可改其他资料。
        - 名称缺失、`commissionEnabled` 缺失、字段超长、邮箱格式不对 → `400`。

        按目标值写，不挂幂等键。有改动时记入操作审计（带改动字段的前后值）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUpdate'
            example:
              partnerName: Maple Partners
              commissionEnabled: false
              contactName: Linda Wu
      responses:
        '200':
          description: 改后的机构详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerDetail'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308754
  /partners/{partnerId}/enablement:
    parameters:
      - $ref: '#/components/parameters/PartnerIdPath'
    put:
      tags:
        - partners
      operationId: updatePartnerEnablement
      x-required-privilege: orgbd:partner:manage
      summary: 停用 / 启用机构
      description: |
        `enabled = false` 停用、`true` 启用。已处于目标状态的照常成功、状态不变。停用后不能再被选为上级机构、后台账号的所属机构或改派目标；已有报表与下级机构不受影响。启用不判前置。

        **什么时候拒绝**（停用时，状态不变）：

        - `308703` 有当前或尚未生效的归属落在该机构的未删除商户（含子商户）；先改派名下商户。
        - `308704` 还有所属机构为它的在册后台账号；先移除这些账号。

        按目标值写，不挂幂等键。状态有变化时记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerEnablement'
            example:
              enabled: false
      responses:
        '200':
          description: 当前启停状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerEnablement'
              example:
                enabled: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308703
        - 308704
  /partner-options:
    get:
      tags:
        - options
      operationId: listPartnerOptions
      x-required-privilege: session
      summary: 机构候选
      description: |
        全部机构的标识与名称，不分页，按名称排序。后台账号表单的所属机构、商户 / 账号 / 报表的机构筛选、改派与划转的目标机构共用。默认只列启用中的；`includeDisabled = true` 时含已停用的（筛选用）。
      parameters:
        - name: includeDisabled
          in: query
          required: false
          description: '`true` 含已停用的机构；不传 = 只列启用中的。'
          schema:
            type: boolean
            default: false
        - name: keyword
          in: query
          required: false
          description: 按机构名称模糊匹配。
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerOption'
              example:
                items:
                  - partnerId: ptn_0031
                    partnerName: Maple Partners
                    enabled: true
                  - partnerId: ptn_0032
                    partnerName: Maple Partners East
                    parentPartnerId: ptn_0031
                    enabled: true
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /partners/{partnerId}/commission-plans:
    parameters:
      - $ref: '#/components/parameters/PartnerIdPath'
    get:
      tags:
        - commission-plans
      operationId: listPartnerCommissionPlans
      x-required-privilege: orgbd:commission-config:view
      summary: 机构的分润方案时段
      description: |
        该机构的全部方案时段，按起始月从新到旧：起止月、基数类型、保留比例、成本率、设置人与时刻。被同月重设替换、从未生效的方案不列。

        机构详情的分润方案区块也取本接口：当月生效的那一段 = 起始月不晚于当月、且没有截止月或截止月不早于当月。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommissionPlan'
              example:
                items:
                  - planId: cpl_0107
                    basisType: SPREAD
                    commissionPct: '0.8'
                    effectiveFromMonth: 2026-10
                    costRates:
                      - paymentMethod: wechat_instore
                        costRate: '0.006'
                      - paymentMethod: alipay_online
                        entryPoint: plugin_shopify
                        costRate: '0.007'
                    createdBy:
                      userId: usr_0031
                      displayName: Alice Chen
                    createdAt: '2026-09-20T08:00:00Z'
                  - planId: cpl_0088
                    basisType: MATRIX
                    effectiveFromMonth: 2026-04
                    effectiveToMonth: 2026-09
                    costRates: []
                    createdBy:
                      userId: usr_0031
                      displayName: Alice Chen
                    createdAt: '2026-03-28T08:00:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - commission-plans
      operationId: createPartnerCommissionPlan
      x-required-privilege: orgbd:commission-config:manage
      summary: 设机构分润方案
      description: |
        从 `effectiveFromMonth` 的月初起生效一份新方案，截止当前最新方案。与最新方案同月即替换它。

        - 差价方案（`SPREAD`）必带保留比例 `commissionPct`（大于 0、不大于 1），可带按支付方式 × 入口的成本率（不小于 0、小于 1，同一支付方式 × 入口只一条；未配的支付方式不计提）。
        - 提成矩阵（`MATRIX`）与上浮（`UPLIFT`）方案不带保留比例与成本率。
        - 支付方式与入口只能取平台目录里的值。

        **什么时候拒绝**（不生效）：

        - `308755` 生效月不被允许：早于提交时所在月的上一个月，或早于当前最新方案的起始月。`context.earliestAllowedMonth` 带最早可用的生效月，页面据此回填。
        - `308756` 成本率的支付方式不在平台目录里。
        - 差价方案缺保留比例、非差价方案带了保留比例或成本率、比例越界、成本率重复、入口不是可选值 → `400`。

        同月重提 = 替换、结果相同，不挂幂等键。记入操作审计（带新方案与被截止方案的内容）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionPlanCreate'
            example:
              basisType: SPREAD
              commissionPct: '0.8'
              costRates:
                - paymentMethod: wechat_instore
                  costRate: '0.006'
              effectiveFromMonth: 2026-12
      responses:
        '201':
          description: 已设方案
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommissionPlanCreated'
              example:
                planId: cpl_0121
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308755
        - 308756
  /commission-rate-matrix:
    get:
      tags:
        - commission-rate-matrix
      operationId: listCommissionRateMatrix
      x-required-privilege: orgbd:commission-rule:view
      summary: 某月生效的提成矩阵
      description: |
        所选月份生效的矩阵行（不传 `month` = 当月），按支付方式 × 入口分组、组内按费率区间与流水档排序，每行带起止月。可按支付方式、入口缩小。提成规则页的计算说明是页面静态文案，不在本接口。
      parameters:
        - name: month
          in: query
          required: false
          description: 看哪个月生效的版本；不传 = 当月。
          schema:
            $ref: '#/components/schemas/YearMonth'
        - name: paymentMethod
          in: query
          required: false
          description: 按支付方式。
          schema:
            $ref: '#/components/schemas/PaymentMethod'
        - name: entryPoint
          in: query
          required: false
          description: 按专用入口；不传不筛（含默认入口的组）。
          schema:
            $ref: '#/components/schemas/FeeRateEntryPoint'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CommissionRateMatrixRow'
              example:
                items:
                  - matrixId: crm_0301
                    paymentMethod: wechat_instore
                    merchantRateFrom: '0'
                    merchantRateTo: '0.02'
                    monthlyVolumeFrom: '0'
                    monthlyVolumeTo: '10000000'
                    commissionRate: '0.1'
                    effectiveFromMonth: 2026-10
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /commission-rate-matrix-versions:
    post:
      tags:
        - commission-rate-matrix
      operationId: createCommissionRateMatrixVersion
      x-required-privilege: orgbd:commission-config:manage
      summary: 提交提成矩阵新版
      description: |
        按一个支付方式 × 入口（不带入口 = 默认）整组提交从 `effectiveFromMonth` 的月初起生效的新一版，截止该组当前最新版本。与最新版本同月即替换它。

        - 每行 = 商户签约比例费率区间（起含、止不含，止不传 = 无上限）× 商户当月流水档（起含、止不含，止不传 = 无上限，按商户结算币种最小单位）× 提成比例（不小于 0、小于 1）。
        - 同组各行的区间 × 档位不得重叠，可以有空档（空档不计提）。
        - 至少一行；要让该组自该月起不再计提，提交一行覆盖全部区间与档位（起 0、止不传）、提成比例为 0。
        - 落档按商户当月净流水；净流水不大于 0（退款多于收款）时按 0 落档，0 落在空档则不计提。

        **什么时候拒绝**（不生效）：

        - `308755` 生效月不被允许：早于提交时所在月的上一个月，或早于该组当前最新版本的起始月。`context.earliestAllowedMonth` 带最早可用的生效月。
        - `308756` 支付方式不在平台目录里。
        - 没有行、行重叠、区间或档位止不大于起、比例越界、入口不是可选值 → `400`。

        同月重提 = 替换、结果相同，不挂幂等键。记入操作审计（带改前与改后的行）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionRateMatrixVersionCreate'
            example:
              paymentMethod: wechat_instore
              effectiveFromMonth: 2026-12
              rows:
                - merchantRateFrom: '0'
