      description: |
        一份报表（主体 × 交易月 × 币种）按商户的行，分页，按商户、归属销售、支付方式、入口排序。报表可见即其行可见，不再按行里商户的数据范围过滤（商户已改派到别的机构、已关户的行照常显示）。

        - 每行带商户、归属销售、支付方式、入口、成交笔数、流水净额、手续费净额、机构成本（差价方案才有）、计提基数、所用比例与提成金额。
        - 一个商户同月因改派分属两名销售、或因费率区间 / 方案版本不同，分成多行；流水档按商户该月全部流水落档，不因月内改派拆开。
