      x-required-privilege: orgbd:commission-export:create
      summary: 导出提成报表的逐笔明细（xlsx）
      description: |
        导出一份报表的行背后的每笔收款、退款与退款回冲：商户（商户码、经营名）、归属销售、类型、订单号 / 退款号、日期、支付方式、入口、结算金额、手续费；可按 `merchantId` 缩小到一家商户。入口与报表行同一口径：专用入口照记，其余入口记为默认，不写实际受理入口。只含按计提判据计入某一行的交易，落在空档等未计提的交易不列出。

        逐笔明细按导出时的归属与配置取交易：按商户 × 支付方式 × 入口 × 归属销售汇总后的流水与手续费，等于这四项都相同的报表行之和（同一组可因费率区间或方案版本不同分成多行）。报表计算之后若有改派、配置变更或交易明细变动，下一次计算之前两者可能对不上，下一次计算之后一致；报表的计算时刻见 `computedAt`。

        从现有管理后台迁入的历史月份只有报表行、没有逐笔明细。同步返回文件流。表头与枚举文案按 `Accept-Language`，实际用的语言经 `Content-Language` 回。按读处理，不挂幂等键，不记操作审计。

