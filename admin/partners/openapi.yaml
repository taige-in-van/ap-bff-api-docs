      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  parameters:
    PartnerIdPath:
      name: partnerId
      in: path
      required: true
      description: 机构标识。
      schema:
        $ref: '#/components/schemas/PartnerId'
    ReferralCodePath:
      name: referralCode
      in: path
      required: true
      description: 推荐码。
      schema:
        $ref: '#/components/schemas/ReferralCode'
    FromMonth:
      name: fromMonth
      in: query
      required: true
      description: 起始交易月（含）。与 `toMonth` 同为必填，`toMonth` 早于 `fromMonth` → `400`。
      schema:
        $ref: '#/components/schemas/YearMonth'
    ToMonth:
      name: toMonth
      in: query
      required: true
      description: 截止交易月（含；与 `fromMonth` 成对必填）。
      schema:
        $ref: '#/components/schemas/YearMonth'
    SubjectTypeFilter:
      name: subjectType
      in: query
      required: false
      description: 按主体类型。
      schema:
        $ref: '#/components/schemas/CommissionSubjectType'
    SubjectIdFilter:
      name: subjectId
      in: query
      required: false
      description: 按主体：机构标识或后台用户标识；与 `subjectType` 同用。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    SettleCurrencyFilter:
      name: settleCurrency
      in: query
      required: false
      description: 按结算币种。
      schema:
        $ref: '#/components/schemas/Currency'
    ReportSubjectType:
      name: subjectType
      in: query
      required: true
      description: 报表的主体类型。
      schema:
        $ref: '#/components/schemas/CommissionSubjectType'
    ReportSubjectId:
      name: subjectId
      in: query
      required: true
      description: 报表的主体：机构标识或后台用户标识。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    ReportMonth:
      name: reportMonth
      in: query
      required: true
      description: 交易月。
      schema:
        $ref: '#/components/schemas/YearMonth'
    ReportSettleCurrency:
      name: settleCurrency
      in: query
      required: true
      description: 报表的结算币种。
      schema:
        $ref: '#/components/schemas/Currency'
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        页面当前的语言（BCP-47 语言标记，可带权重列表，如 `zh-CN,zh;q=0.9,en;q=0.8`）。服务端在本接口支持的语言里取最接近的一种（如 `fr-CA` → `fr`）；按它渲染什么、取不中时退到哪种语言，见所在面的说明。

        响应带 `Content-Language` 的接口，实际用的语言以该头为准。
      schema:
        type: string
        minLength: 2
        maxLength: 256
    MerchantId:
      name: merchantId
      in: path
      required: true
      description: 商户标识。
      schema:
        $ref: '#/components/schemas/MerchantId'
  schemas:
    Ratio:
      type: string
      pattern: ^0(\.[0-9]{1,6})?$
      description: 比例，小数、最多六位小数，不小于 0、小于 1（`0.006` = 0.6%）。
      examples:
        - '0.006'
    CommissionPct:
      type: string
      pattern: ^(0\.[0-9]{1,6}|1(\.0{1,6})?)$
      description: 差价方案的保留比例，小数、最多六位小数，大于 0、不大于 1（`1` = 价差全额归机构）；为 0 → `400`。
      examples:
        - '0.8'
    VolumeAmount:
      type: string
      pattern: ^[0-9]+$
      description: 商户月流水档的金额，不带币种，按商户结算币种最小单位的非负整数串。
      examples:
        - '10000000'
    CommissionEntryPoint:
      description: 专用入口；不返回 / 不传 = 默认（未单列的入口都算默认）。
      allOf:
        - $ref: '#/components/schemas/FeeRateEntryPoint'
    PartnerCore:
      type: object
      x-parent: true
      description: 机构的列表字段。
      required:
        - partnerId
        - partnerName
        - commissionEnabled
        - enabled
        - createdAt
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        partnerName:
          type: string
          minLength: 1
          maxLength: 128
          description: 机构名称。
        parent:
          $ref: '#/components/schemas/PartnerRef'
          description: 上级机构；一级机构不返回本键。
        contactName:
          type: string
          maxLength: 64
          description: 联系人；没填不返回本键。
        contactPhone:
          type: string
          maxLength: 40
          description: 联系电话；没填不返回本键。
        contactEmail:
          type: string
          maxLength: 128
          description: 联系邮箱；没填不返回本键。
        commissionEnabled:
          type: boolean
          description: 当月是否计算分润。
        enabled:
          type: boolean
          description: 是否启用。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PartnerSummary:
      description: 机构列表的一行。
      allOf:
        - $ref: '#/components/schemas/PartnerCore'
        - type: object
          properties:
            currentBasisType:
              $ref: '#/components/schemas/CommissionBasisType'
              description: 当月生效的分润方案的基数类型；当月没有生效方案不返回本键。
      unevaluatedProperties: false
    PartnerDetail:
      description: 机构详情。
      allOf:
        - $ref: '#/components/schemas/PartnerCore'
        - type: object
          required:
            - children
            - updatedAt
          properties:
            officeAddress:
              type: string
              maxLength: 256
              description: 机构地址；没填不返回本键。
            note:
              type: string
              maxLength: 512
              description: 备注；没填不返回本键。
            children:
              type: array
              description: 直接下级机构；没有为空数组。
              items:
                $ref: '#/components/schemas/PartnerChild'
            updatedAt:
              $ref: '#/components/schemas/Timestamp'
      unevaluatedProperties: false
    PartnerChild:
      type: object
      additionalProperties: false
      required:
        - partnerId
        - partnerName
        - enabled
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        partnerName:
          type: string
          minLength: 1
        enabled:
          type: boolean
    PartnerCreate:
      type: object
      additionalProperties: false
      description: 新建机构。不传 `commissionEnabled` = 计算分润。
      required:
        - partnerName
      properties:
        partnerName:
          type: string
          minLength: 1
          maxLength: 128
          description: 机构名称，必填，不要求唯一。
        parentPartnerId:
          $ref: '#/components/schemas/PartnerId'
          description: 上级机构，新设或更换时须是启用中的一级机构，与现值相同时不判；不传 = 一级机构。候选取自 `listPartnerOptions`。
        commissionEnabled:
          type: boolean
          description: 是否计算分润；新建时所填值自建立当月的上一个月起生效，改值自改值当月起生效，之前的月份按当时的值；不计算分润的月份，分润计算不为该机构计提、不出它的报表行。
        contactName:
          type: string
          minLength: 1
          maxLength: 64
          description: 联系人。
        contactPhone:
          type: string
          minLength: 1
          maxLength: 40
          description: 联系电话。
        contactEmail:
          type: string
          format: email
          minLength: 3
          maxLength: 128
          description: 联系邮箱。
        officeAddress:
          type: string
          minLength: 1
          maxLength: 256
          description: 机构地址。
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 备注。
    PartnerUpdate:
      description: 编辑机构：整体替换，不传的选填字段 = 清空。
      allOf:
        - $ref: '#/components/schemas/PartnerCreate'
      required:
        - partnerName
        - commissionEnabled
      unevaluatedProperties: false
    PartnerCreated:
      type: object
      additionalProperties: false
      required:
        - partnerId
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
    PartnerEnablement:
      type: object
      additionalProperties: false
      required:
        - enabled
      properties:
        enabled:
          type: boolean
          description: '`true` 启用中 / `false` 已停用。'
    PartnerOption:
      type: object
      additionalProperties: false
      required:
        - partnerId
        - partnerName
        - enabled
      properties:
        partnerId:
          $ref: '#/components/schemas/PartnerId'
        partnerName:
          type: string
          minLength: 1
        parentPartnerId:
          $ref: '#/components/schemas/PartnerId'
