                    referralLink: https://merchant.example.com/register?referralCode=K7MR2XTA
                    openCount: 3
                    issuedPartner:
                      partnerId: ptn_0031
                      partnerName: Maple Partners
                    createdAt: '2026-10-05T08:00:00Z'
                    owner:
                      userId: usr_b07
                      displayName: Bob BD
        default:
