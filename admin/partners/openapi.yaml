        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommissionReportTransactionExportFilter'
            example:
              subjectType: partner
              subjectId: ptn_0031
              reportMonth: 2026-10
              settleCurrency: CAD
              merchantId: mch_8812
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308503
