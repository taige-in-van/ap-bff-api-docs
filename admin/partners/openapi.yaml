          required:
            - matrixId
            - paymentMethod
            - effectiveFromMonth
          properties:
            matrixId:
              type: string
              minLength: 1
              maxLength: 32
            paymentMethod:
              $ref: '#/components/schemas/PaymentMethod'
            entryPoint:
              $ref: '#/components/schemas/CommissionEntryPoint'
            effectiveFromMonth:
              $ref: '#/components/schemas/YearMonth'
              description: 该行所在版本的起始月（含）。
            effectiveToMonth:
              $ref: '#/components/schemas/YearMonth'
              description: 截止月（含）；长期有效不返回本键。
      unevaluatedProperties: false
    CommissionRateMatrixVersionCreate:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - effectiveFromMonth
        - rows
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        entryPoint:
          $ref: '#/components/schemas/CommissionEntryPoint'
        effectiveFromMonth:
          $ref: '#/components/schemas/YearMonth'
          description: 从这个月的月初起生效。
        rows:
          type: array
          minItems: 1
          maxItems: 200
          description: 新版的全部行，至少一行。
          items:
            $ref: '#/components/schemas/CommissionRateMatrixRowInput'
    CommissionRateMatrixVersionCreated:
      type: object
      additionalProperties: false
      required:
        - effectiveFromMonth
        - rowCount
      properties:
        effectiveFromMonth:
          $ref: '#/components/schemas/YearMonth'
        rowCount:
          type: integer
          minimum: 1
          description: 新版的行数。
    CommissionRateMatrixExportFilter:
      type: object
      additionalProperties: false
      properties:
        month:
          $ref: '#/components/schemas/YearMonth'
          description: 导出哪个月生效的版本；不传 = 当月。
    SalesAssignmentUpdate:
      type: object
      additionalProperties: false
      required:
        - salesUserId
        - effectiveDate
        - changeReason
      properties:
        salesUserId:
          $ref: '#/components/schemas/UserId'
          description: 新的归属销售；候选取自 `listSalesOptions`。
        effectiveDate:
          $ref: '#/components/schemas/LocalDate'
          description: 生效日（系统运营日）：可选未来；可倒签，但不早于当月的上一个月 1 日，也不早于该商户最早一段归属的生效日。
        changeReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 改派原因。
    SalesAssignmentResult:
      type: object
      additionalProperties: false
      required:
        - merchantId
        - salesUser
        - affectedMerchantCount
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        salesUser:
          $ref: '#/components/schemas/UserRef'
          description: 改派后的归属销售。
        partner:
          $ref: '#/components/schemas/PartnerRef'
          description: 改派后的所属机构；Platform 总部销售不返回本键。
        affectedMerchantCount:
          type: integer
          minimum: 0
          description: 归属实际有变化的商户数（含子商户）。
    PartnerMerchantTransferCreate:
      type: object
      additionalProperties: false
      required:
        - targetSalesUserId
        - effectiveDate
        - changeReason
      properties:
        targetPartnerId:
          $ref: '#/components/schemas/PartnerId'
          description: 目标机构；不传 = Platform 总部（无所属机构）。
        targetSalesUserId:
          $ref: '#/components/schemas/UserId'
          description: 目标销售，所属组织须为目标组织；候选取自 `listSalesOptions`。
        effectiveDate:
          $ref: '#/components/schemas/LocalDate'
          description: 生效日（系统运营日）：可选未来；可倒签，但不早于当月的上一个月 1 日。
        changeReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 改派原因。
    PartnerMerchantTransferResult:
      type: object
      additionalProperties: false
      required:
        - transferredMerchantCount
      properties:
        transferredMerchantCount:
          type: integer
          minimum: 0
          description: 改写了归属的商户数（含子商户）。
    SalesOption:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          description: 登录邮箱；没有不返回本键。
    CommissionSubjectType:
      type: string
      enum:
        - partner
        - bd_user
      description: 提成报表主体类型：`partner` 机构 / `bd_user` BD（后台用户）。
    CommissionSubject:
      type: object
      additionalProperties: false
      required:
        - subjectId
        - subjectName
      properties:
        subjectId:
          type: string
          minLength: 1
          maxLength: 32
          description: 机构标识或后台用户标识。
        subjectName:
          type: string
          minLength: 1
          description: 机构名称或后台用户显示名。
    CommissionReportSummary:
      type: object
      additionalProperties: false
      description: 提成报表列表的一行：一个主体一个交易月一个币种。
      required:
        - subjectType
        - subject
        - reportMonth
        - settleCurrency
        - volumeAmount
        - feeAmount
        - commissionAmount
        - activeMerchantCount
        - computedAt
      properties:
        subjectType:
          $ref: '#/components/schemas/CommissionSubjectType'
        subject:
          $ref: '#/components/schemas/CommissionSubject'
        reportMonth:
          $ref: '#/components/schemas/YearMonth'
          description: 交易月。
        settleCurrency:
          $ref: '#/components/schemas/Currency'
        volumeAmount:
          $ref: '#/components/schemas/Money'
          description: 流水净额合计。
        feeAmount:
          $ref: '#/components/schemas/Money'
          description: 手续费净额合计。
        costAmount:
          $ref: '#/components/schemas/Money'
          description: 机构成本合计；只有差价方案的机构报表返回本键。
        commissionAmount:
          $ref: '#/components/schemas/Money'
          description: 提成合计，可负（退款冲回了已按流水计的提成）；合计为负的月份不付款、不结转到下月。
        activeMerchantCount:
          type: integer
          minimum: 0
          description: 有交易商户数：当月有成交的去重商户数。
        computedAt:
          $ref: '#/components/schemas/Timestamp'
          description: 最近一次计算的时刻。
    CommissionReportCurrencyTotal:
      type: object
      additionalProperties: false
      required:
        - settleCurrency
        - reportCount
        - volumeAmount
        - feeAmount
        - commissionAmount
      properties:
        settleCurrency:
          $ref: '#/components/schemas/Currency'
        reportCount:
          type: integer
          minimum: 0
          description: 报表数（主体 × 交易月）。
        volumeAmount:
          $ref: '#/components/schemas/Money'
        feeAmount:
          $ref: '#/components/schemas/Money'
        commissionAmount:
          $ref: '#/components/schemas/Money'
    CommissionReportLine:
      type: object
      additionalProperties: false
      description: 提成报表按商户的一行：商户 × 归属销售 × 支付方式 × 入口按同一比例的提成。从现有管理后台迁入的历史月份按原记录粒度展示，可能没有商户、归属销售、支付方式与所用比例。
      required:
        - txnCount
        - volumeAmount
        - feeAmount
        - baseAmount
        - commissionAmount
      properties:
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
          description: 商户；迁入的无商户粒度记录不返回本键。
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
          description: 商户码；不返回 `merchant` 时也不返回本键。
        salesUser:
          $ref: '#/components/schemas/UserRef'
          description: 归属销售（交易建单时刻生效的归属）；迁入且无从确定的不返回本键。
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
          description: 支付方式；迁入的无支付方式粒度记录不返回本键。
        entryPoint:
          $ref: '#/components/schemas/CommissionEntryPoint'
        txnCount:
          type: integer
          minimum: 0
          description: 成交笔数（退款不计）。
        volumeAmount:
          $ref: '#/components/schemas/Money'
          description: 流水净额。
        feeAmount:
          $ref: '#/components/schemas/Money'
          description: 手续费净额。
        costAmount:
          $ref: '#/components/schemas/Money'
          description: 机构成本；差价方案的行才返回。
        baseAmount:
          $ref: '#/components/schemas/Money'
          description: 计提基数：差价方案为行价差，提成矩阵型与 BD 为行净流水，上浮型为行净流水；可负。
        appliedRate:
          type: string
          pattern: ^(0|1)(\.[0-9]{1,6})?$
          description: 所用比例（保留比例、提成比例或上浮费率差），小数串；上浮费率差不小于 0，入口费率不高于基础费率时为 0；迁入且原记录无此值的不返回本键。
        commissionAmount:
          $ref: '#/components/schemas/Money'
          description: 提成金额，可负；差价方案所在组（机构 × 支付方式 × 入口）汇总价差小于 0 时为 0。
    StaffCommission:
      type: object
      additionalProperties: false
      description: 员工提成的一行：一名后台账号（归属销售）一个交易月一个币种。
      required:
        - staff
        - settleCurrency
        - volumeAmount
        - commissionAmount
        - activeMerchantCount
        - txnCount
      properties:
        staff:
          $ref: '#/components/schemas/UserRef'
          description: 员工（归属销售）。
        partner:
          $ref: '#/components/schemas/PartnerRef'
          description: 所属机构；Platform 员工不返回本键。
        settleCurrency:
          $ref: '#/components/schemas/Currency'
        volumeAmount:
          $ref: '#/components/schemas/Money'
          description: 名下交易的流水净额合计。
        commissionAmount:
          $ref: '#/components/schemas/Money'
          description: 提成金额：Platform 员工 = 其 BD 提成；机构员工 = 机构分润中归于其名下交易的部分（只作展示）。
        activeMerchantCount:
          type: integer
          minimum: 0
          description: 有交易商户数：名下当月有成交的去重商户数。
        txnCount:
          type: integer
          minimum: 0
          description: 名下成交笔数合计。
    CommissionReportListFilter:
      type: object
      additionalProperties: false
      description: 提成报表列表的筛选，与 `listCommissionReports` 的同名查询参数同义；不传的项不筛。
      required:
        - fromMonth
        - toMonth
      properties:
        fromMonth:
          $ref: '#/components/schemas/YearMonth'
        toMonth:
          $ref: '#/components/schemas/YearMonth'
        subjectType:
          $ref: '#/components/schemas/CommissionSubjectType'
        subjectId:
          type: string
          minLength: 1
          maxLength: 32
        settleCurrency:
          $ref: '#/components/schemas/Currency'
    CommissionReportKey:
      type: object
      additionalProperties: false
      description: 一份提成报表：主体 × 交易月 × 币种。
      required:
        - subjectType
        - subjectId
        - reportMonth
        - settleCurrency
      properties:
        subjectType:
          $ref: '#/components/schemas/CommissionSubjectType'
        subjectId:
          type: string
          minLength: 1
          maxLength: 32
          description: 主体：机构标识或后台用户标识。
        reportMonth:
          $ref: '#/components/schemas/YearMonth'
          description: 交易月。
        settleCurrency:
          $ref: '#/components/schemas/Currency'
    CommissionReportTransactionExportFilter:
      type: object
      additionalProperties: false
      description: 逐笔明细导出：一份报表的四个键，可按商户缩小。
      required:
        - subjectType
        - subjectId
        - reportMonth
        - settleCurrency
      properties:
        subjectType:
          $ref: '#/components/schemas/CommissionSubjectType'
        subjectId:
          type: string
          minLength: 1
          maxLength: 32
          description: 主体：机构标识或后台用户标识。
        reportMonth:
          $ref: '#/components/schemas/YearMonth'
          description: 交易月。
        settleCurrency:
          $ref: '#/components/schemas/Currency'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
          description: 只导这家商户的明细；不传 = 全部。
    StaffCommissionFilter:
      type: object
      additionalProperties: false
      description: 员工提成的筛选，与 `listStaffCommissions` 的同名查询参数同义；不传的项不筛。
      required:
        - reportMonth
      properties:
        reportMonth:
          $ref: '#/components/schemas/YearMonth'
          description: 交易月。
        settleCurrency:
          $ref: '#/components/schemas/Currency'
        partnerId:
          $ref: '#/components/schemas/PartnerId'
    ReferralCode:
      type: string
      minLength: 8
      maxLength: 16
      pattern: ^[A-Z0-9]+$
      description: 推荐码。
      examples:
        - K7MR2XTA
    ReferralCodeStatus:
      type: string
      enum:
        - ACTIVE
        - STOPPED
      description: 推荐码状态：`ACTIVE` 生效 / `STOPPED` 已停用。
    ReferralCodeItem:
      type: object
