    CostRate:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - costRate
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        entryPoint:
          $ref: '#/components/schemas/CommissionEntryPoint'
        costRate:
          $ref: '#/components/schemas/Ratio'
          description: 机构成本率。
    CommissionPlan:
      type: object
      additionalProperties: false
      description: 一段分润方案。
      required:
        - planId
        - basisType
        - effectiveFromMonth
        - costRates
        - createdAt
      properties:
        planId:
          type: string
          minLength: 1
          maxLength: 32
        basisType:
          $ref: '#/components/schemas/CommissionBasisType'
        commissionPct:
          $ref: '#/components/schemas/CommissionPct'
          description: 保留比例；差价方案才返回。
        effectiveFromMonth:
          $ref: '#/components/schemas/YearMonth'
          description: 起始月（含）。
        effectiveToMonth:
          $ref: '#/components/schemas/YearMonth'
          description: 截止月（含）；长期有效不返回本键。
        costRates:
          type: array
          description: 机构成本率；非差价方案为空数组。
          items:
            $ref: '#/components/schemas/CostRate'
        createdBy:
          $ref: '#/components/schemas/UserRef'
          description: 设置人；迁移来的方案不返回本键。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    CommissionPlanCreate:
      type: object
      additionalProperties: false
      required:
        - basisType
        - effectiveFromMonth
      properties:
        basisType:
          $ref: '#/components/schemas/CommissionBasisType'
        commissionPct:
          $ref: '#/components/schemas/CommissionPct'
          description: 保留比例；差价方案必带，其他方案不带。
        costRates:
          type: array
          maxItems: 200
          description: 机构成本率；只差价方案可带，同一支付方式 × 入口只一条。
          items:
            $ref: '#/components/schemas/CostRate'
        effectiveFromMonth:
          $ref: '#/components/schemas/YearMonth'
          description: 从这个月的月初起生效。
    CommissionPlanCreated:
      type: object
      additionalProperties: false
      required:
        - planId
      properties:
        planId:
          type: string
          minLength: 1
          maxLength: 32
    CommissionRateMatrixRowFields:
      type: object
      x-parent: true
      description: 矩阵一行的区间、档位与比例。
      required:
        - merchantRateFrom
        - monthlyVolumeFrom
        - commissionRate
      properties:
        merchantRateFrom:
          $ref: '#/components/schemas/Ratio'
          description: 商户签约比例费率区间起（含）。
        merchantRateTo:
          $ref: '#/components/schemas/Ratio'
          description: 区间止（不含），须大于起；不传 = 无上限。
        monthlyVolumeFrom:
          $ref: '#/components/schemas/VolumeAmount'
          description: 商户当月流水档起（含）。
        monthlyVolumeTo:
          $ref: '#/components/schemas/VolumeAmount'
          description: 流水档止（不含），须大于起；不传 = 无上限。
        commissionRate:
          $ref: '#/components/schemas/Ratio'
          description: 提成比例。
    CommissionRateMatrixRowInput:
      description: 矩阵新版的一行。
      allOf:
        - $ref: '#/components/schemas/CommissionRateMatrixRowFields'
      unevaluatedProperties: false
    CommissionRateMatrixRow:
      description: 某月生效的一行矩阵。
      allOf:
        - $ref: '#/components/schemas/CommissionRateMatrixRowFields'
