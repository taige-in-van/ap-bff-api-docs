  /merchants/{merchantId}/sales-assignment:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    put:
      tags:
        - merchant-assignments
      operationId: updateMerchantSalesAssignment
      x-required-privilege: orgbd:merchant-assignment:manage
      summary: 改派单个商户的归属销售
      description: |
        自所选生效日起，把一个主商户的归属销售改为所选账号，所属组织随之为该账号的所属组织（Platform 总部销售 → 直营、无所属机构）；该主商户的全部子商户随之。页面先选组织（某机构或 Platform 总部）再选销售，候选取自 `listSalesOptions`。不提供清空归属销售。

        - 尚无归属的商户首次指定归属销售也用本接口。
        - 提交生效日（系统运营日）与改派原因。生效日可选未来；可倒签，但不早于当月的上一个月 1 日，也不早于该商户最早一段归属的生效日（尚无归属的只看前一条），否则 `308705`（`context.earliestAllowedDate` 带最早可选日）。
        - 数据范围为所属机构的操作者：只能改派给本人所属机构或其直接下级机构的销售，且生效日另不早于该商户当前归属的生效日；数据范围为全部商户的不受这两条限。
        - 生效日当天及之后开始的归属（已生效或尚未生效）都被本次取代；与某段归属同一生效日即替换它，尚未生效的改派被本次取代；要撤回待生效的改派，以原销售按同一生效日再提交。
        - 从生效日 0 点起建单的订单归新销售，之前建单的仍归原销售，退款随原订单；倒签部分在次日重算的报表里体现。生效日之前负责与可见仍按原归属。
        - `affectedMerchantCount` = 归属实际有变化的商户数（含子商户），可为 0。

        **什么时候拒绝**（不改）：

        - `308757` 商户是子商户；归属只能在主商户上改，子商户随主商户。
        - `308702` 所选销售不可选：不在册、已停用，或（所属机构档操作者）其所属组织不在本人范围内；重取销售候选再选。
        - `308701` 所选销售的所属机构已停用。
        - `308705` 生效日早于最早可选日（含所属机构档操作者早于该商户当前归属的生效日）。
        - 商户不存在或在本人数据范围外 → `404`。
        - 未填生效日或原因、原因超长 → `400`。

        按目标值写，不挂幂等键。主商户与每个子商户各记一条操作审计（带前后归属、生效日与原因），未变化的不记。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalesAssignmentUpdate'
            example:
              salesUserId: usr_b07
              effectiveDate: '2026-11-01'
              changeReason: 原销售离职交接
      responses:
        '200':
          description: 改派后的归属
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesAssignmentResult'
              example:
                merchantId: mch_8812
                salesUser:
                  userId: usr_b07
                  displayName: Bob BD
                partner:
                  partnerId: ptn_0031
                  partnerName: Maple Partners
                affectedMerchantCount: 3
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308701
        - 308702
        - 308705
        - 308757
  /partners/{partnerId}/merchant-transfers:
    parameters:
      - $ref: '#/components/parameters/PartnerIdPath'
    post:
      tags:
        - merchant-assignments
      operationId: createPartnerMerchantTransfer
      x-required-privilege: orgbd:merchant-assignment:manage
      summary: 整机构改派（商户划转）
      description: |
        自同一生效日起，把路径机构名下的全部归属改为目标销售与目标组织（不传 `targetPartnerId` = Platform 总部、无所属机构），全部成功或全部不变，返回改写的户数（含子商户）；没有涉及的商户时照常成功、户数 0。改派对订单与报表的影响同 `updateMerchantSalesAssignment`。

        - 涉及的商户 = 未删除的主商户中，自生效日起有任一段归属属于路径机构的（含当前不归它、但已排了改派到它的），子商户随主商户；不按操作者对商户的当前可见范围过滤。
        - 自生效日起凡属于路径机构的时段一律改为目标归属，改派原因取本次填写的原因；跨生效日的时段在生效日处截断，生效日之前不动；属于其他机构或总部的时段（含待生效的改派）原样保留；改写后相邻且归属销售相同的时段合为一段。成功后自生效日起路径机构名下没有任何归属。
        - 生效日（系统运营日）可选未来；可倒签，但不早于当月的上一个月 1 日。

        源机构的可见范围：数据范围为全部商户的可选任意机构；为所属机构的只能选本机构或其直接下级机构，目标组织也只能是本人所属机构或其直接下级机构；其余 → `404`。

        幂等基准：`Idempotency-Key`。

        **什么时候拒绝**（无商户变动）：

        - `304701` 目标机构就是源机构。
        - `308701` 目标机构不存在或已停用。
        - `308702` 目标销售不可选：不在册、已停用，其所属组织不是所选目标组织，或（所属机构档操作者）目标组织不在本人范围内；重取销售候选再选。
        - `308705` 生效日早于当月的上一个月 1 日；`context.earliestAllowedDate` 带该日。
        - 源机构不存在或在本人可见范围外 → `404`。
        - 未填生效日或原因、原因超长 → `400`。

        每家商户（含子商户）按被改写的每一段时段各记一条操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerMerchantTransferCreate'
            example:
              targetPartnerId: ptn_0040
              targetSalesUserId: usr_b19
              effectiveDate: '2026-11-01'
              changeReason: 机构合并
      responses:
        '200':
          description: 已改派
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerMerchantTransferResult'
              example:
                transferredMerchantCount: 7
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 304701
        - 308701
        - 308702
        - 308705
