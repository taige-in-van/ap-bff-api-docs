openapi: 3.1.0
info:
  title: 管理后台 清算结算 — 前端契约面
  version: 2.4.2
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的清算结算契约：通道对账结果与差异处置、待人工确认退款、清算日历、清算日汇总与清算记录、结算单详情与导出、清结算异常概览、出款文件与出款登记（提交、受理结果、作废、退票、重新出款）、通道结算单与到账确认、渠道方汇回、清算报告与补发、T&T 对账文件与重发、商户暂停结算与起结门槛、商户资金概览、扣款与补偿、授信额度、月度对账单与税行汇总、服务费收款与退回、返利活动与商户开通、营销账户记录。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **金额口径**：金额是对应币种最小单位的整数串，带币种；同一页上不同结算币种的金额分别合计，不跨币种相加。

    **幂等 / CSRF 口径**：

    - 登记受理结果、登记退票、重新出款、登记汇回单、冲销汇回单、从差异向商户追回、扣款与补偿、登记服务费收款、登记收款退回是资金登记，带 `Idempotency-Key`：同一次操作的重试沿用同一个键，重复提交不会重复登记。
    - 其余写操作带状态前置（只对处于某一状态的对象生效，两人同时操作以先到者为准）、按目标值写或靠唯一键防重，不挂幂等键。
    - 导出按读处理，不挂幂等键。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。

    **本人动态码确认**：扣款与补偿、设置授信额度的请求体带 `totpCode`（操作人本人验证器上的当前 6 位动态码）。码错 → `403`·`306004`，动作不执行，原处重输；会话仍有效，不影响登录。重试沿用同一幂等键时也要带当前有效的动态码。其余写操作不带。

    **数据可见范围**：同管理后台约定「数据可见范围」。按商户组织的接口（待人工确认退款、清算日汇总、清算记录、结算单与明细、导出、清算报告与补发、暂停结算与起结门槛、资金概览、扣款与补偿、授信额度、月度对账单与其导出、服务费收款与其导出、返利参加、营销账户记录）按商户求值：范围外商户的数据不出现在列表、合计与导出里，按标识访问一律 `404`。通道侧与平台级的接口（通道对账与差异、出款文件、通道结算单、渠道方汇回、T&T 对账文件、税行汇总、返利活动）不按数据可见范围过滤。

    **操作审计**：本面的写操作记入操作审计（带操作人、对象、前后状态或前后值与说明）；查询、详情、导出、原件下载不记。操作人恒为当前登录的后台用户，请求体里没有操作人字段。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: channel-bills
    x-displayName: 通道对账
    description: 按账单日的通道账单与对账结果、原件下载、重新对账。
  - name: recon-discrepancies
    x-displayName: 对账差异
    description: 对账差异列表与详情，提交处置、确认已处理、核销与取整差批量核销，从计入平台资损的差异向商户追回。
  - name: refund-confirmations
    x-displayName: 待人工确认退款
    description: 结果长期未明、已转人工的退款，与确认结果。
  - name: settlement-calendar
    x-displayName: 清算日历
    description: 普通 / KA 两轨的清算日，按月查看与整月设置。
  - name: settlement-batches
    x-displayName: 结算单
    description: 清算日汇总、清算记录、结算单详情与明细、导出、重新出款。
  - name: clearing-overview
    x-displayName: 异常概览
    description: 清结算各类待办的计数。
  - name: clearing-channel-options
    x-displayName: 通道候选
    description: 各页通道筛选与登记汇回单通道选择共用的通道候选。
  - name: payout-files
    x-displayName: 出款文件
    description: 出款文件与文件内出款行、原件下载，登记提交、受理结果、作废与退票。
  - name: channel-settlements
    x-displayName: 通道结算单
    description: 通道结算单与按通道小计，到账确认、撤销与差异说明。
  - name: channel-remittances
    x-displayName: 渠道方汇回
    description: 渠道方汇回单的登记、核对结果、冲销与差异说明。
  - name: settlement-reports
    x-displayName: 清算报告
    description: 清算报告的投递结果与按商户补发。
  - name: merchant-recon-files
    x-displayName: T&T 对账文件
    description: T&T 对账文件与推送结果、原件下载、重发。
  - name: settlement-controls
    x-displayName: 暂停结算与起结门槛
    description: 单个商户的暂停结算与起结门槛。
  - name: merchant-funds
    x-displayName: 商户资金
    description: 单个商户的资金概览、扣款与补偿、授信额度。
  - name: statements
    x-displayName: 月度对账单
    description: 商户月度对账单列表、详情与文件下载，税行汇总，及两者的导出。
  - name: fee-collections
    x-displayName: 服务费收款
    description: 服务费收款记录、登记收款、登记退回与导出。
  - name: promotions
    x-displayName: 返利
    description: 返利活动的建立与终止、商户开通与终止参加、营销账户记录。
paths:
  /channel-bills:
    get:
      tags:
        - channel-bills
      operationId: listChannelBills
      x-required-privilege: clr:reconciliation:view
      summary: 通道账单与对账结果
      description: |
        按账单日区间列出各通道的账单与对账结果，分页，按账单日从新到旧。日期范围按账单日（通道日），两端必填。同一通道同一账单日同一类账单只给当前生效的一份：重新对账后，旧的一份不再出现。

        每行带通道声明的汇总与各分类差异的待处理 / 已处理 / 已核销计数；`resultLevel` 是这份账单的结果档，见字段说明。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/ChannelFilter'
        - name: billStatus
          in: query
          required: false
          description: 按账单状态，可多选。
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ChannelBillStatus'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelBill'
              example:
                total: 2
                data:
                  - billId: CB261101000012
                    channel:
                      channelId: CH0012
                      channelName: 微信 CAD 服务商
                      channelMerchantId: '1900012345'
                    billDate: '2026-11-01'
                    billType: TRANSACTION
                    billStatus: RECONCILED
                    declaredPaymentCount: 1284
                    declaredPaymentAmount:
                      amount: '15320800'
                      currency: CAD
                    declaredRefundCount: 12
                    declaredRefundAmount:
                      amount: '86000'
                      currency: CAD
                    hasOriginal: true
                    reconciledAt: '2026-11-02T03:10:00Z'
                    resultLevel: MISSING_ENTRIES
                    discrepancyCounts:
                      - discrepancyClass: surplus
                        pending: 1
                        resolved: 0
                        writtenOff: 0
                  - billId: CB261101000013
                    channel:
                      channelId: CH0020
                      channelName: 支付宝 CAD
                      channelMerchantId: '2088123456789012'
                    billDate: '2026-11-01'
                    billType: TRANSACTION
                    billStatus: FETCH_FAILED
                    failureReason: 通道账单接口超时
                    hasOriginal: false
                    discrepancyCounts: []
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /channel-bills/{billId}/original:
    parameters:
      - $ref: '#/components/parameters/BillIdPath'
    get:
      tags:
        - channel-bills
      operationId: getChannelBillOriginal
      x-required-privilege: clr:reconciliation:view
      summary: 通道账单原件的下载地址
      description: |
        返回这份账单通道原件的短时下载地址，到 `expiresAt` 失效；失效后重调取新地址，文件不变。不记操作审计。

        账单不存在，或没有原件（拉取失败、或该通道只给接口不给文件）→ `404`。列表行 `hasOriginal = false` 时不给下载动作。
      responses:
        '200':
          description: 短时下载地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAccessUrl'
              example:
                url: https://storage.example.com/private/channel-bill/2026/11/5a7c9e1b.csv?X-Amz-Expires=300&X-Amz-Signature=...
                expiresAt: '2026-11-02T15:35:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /channel-bill-reruns:
    post:
      tags:
        - channel-bills
      operationId: createReconciliationRerun
      x-required-privilege: clr:reconciliation-rerun:create
      summary: 重新对账某通道某账单日
      description: |
        对某通道某账单日重新导入通道账单并从头比对：该日尚未处理的差异清掉后按新导入的账单重新生成；差异转已处理不会因重新对账自动发生。提交即受理、异步执行，结果重读 `listChannelBills` 查看。

        **什么时候拒绝**（不启动）：

        - `308601` 该通道该账单日已有处理过的差异（已核销、已转已处理、已填处置方向或说明），这一天的对账结果冻结。
        - `308602` 该通道该账单日的对账正在执行（定时对账或上一次重新对账还没完）；结束后再提交。
        - 通道不存在，或该通道不做对账 → 通用 `404`。

        带状态前置，不挂幂等键；重复提交在对账执行期间会得到 `308602`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconciliationRerunRequest'
            example:
              channelId: CH0012
              billDate: '2026-11-01'
      responses:
        '202':
          description: 已受理，进度重读通道账单查看
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308601
        - 308602
  /recon-discrepancies:
    get:
      tags:
        - recon-discrepancies
      operationId: listReconDiscrepancies
      x-required-privilege: clr:reconciliation:view
      summary: 对账差异列表
      description: |
        按账单日区间列出对账差异，分页，按账单日从新到旧。日期范围按账单日，两端必填；跨度超过允许的最大查询窗口 → `400`。

        平台订单号与商户只在平台有这一笔时给出；通道单边的差异没有平台订单号。核销时计入平台资损的差异带原因归属，向商户追回过的另带追回额与调账单号。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/ChannelFilter'
        - name: discrepancyClass
          in: query
          required: false
          description: 按分类，可多选。
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DiscrepancyClass'
        - name: objectType
          in: query
          required: false
          description: 按差异对象类型：`PAYMENT` 支付（含撤销）/ `REFUND` 退款；不传不筛。退款取整差汇总没有对象类型，选了对象类型就不出它。
          schema:
            type: string
            enum:
              - PAYMENT
              - REFUND
        - name: status
          in: query
          required: false
          description: 按差异状态，可多选。
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/DiscrepancyStatus'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconDiscrepancy'
              example:
                total: 1
                data:
                  - discrepancyId: RD261102000045
                    channel:
                      channelId: CH0012
                      channelName: 微信 CAD 服务商
                      channelMerchantId: '1900012345'
                    billDate: '2026-11-01'
                    objectType: PAYMENT
                    discrepancyClass: mismatch
                    matchKey: P100240002
                    channelAmount:
                      amount: '3836'
                      currency: CAD
                    platformAmount:
                      amount: '3836'
                      currency: CAD
                    fieldDifferences:
                      - field: STATUS
                        channelValue: SUCCESS
                        platformValue: FAILED
                    status: pending
                    orderId: P100240002
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /recon-discrepancies/{discrepancyId}:
    parameters:
      - $ref: '#/components/parameters/DiscrepancyIdPath'
    get:
      tags:
        - recon-discrepancies
      operationId: getReconDiscrepancy
      x-required-privilege: clr:reconciliation:view
      summary: 对账差异详情
      description: |
        单条差异：列表行的字段，加所在账单与通道账单行号。差异不存在 → `404`。

        执行方拒绝某次处置的原因只在那次 `submitDiscrepancyDisposition` 的失败响应里返回，不在详情里。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconDiscrepancyDetail'
              example:
                discrepancyId: RD261102000046
                channel:
                  channelId: CH0012
                  channelName: 微信 CAD 服务商
                  channelMerchantId: '1900012345'
                billDate: '2026-11-01'
                objectType: PAYMENT
                discrepancyClass: shortage
                matchKey: P100240019
                channelAmount:
                  amount: '0'
                  currency: CAD
                platformAmount:
                  amount: '1200'
                  currency: CAD
                status: written_off
                note: 平台重复入账，按平台资损核销
                resolvedBy:
                  userId: usr_a102
                  displayName: Grace Lin
                resolvedAt: '2026-11-03T08:20:00Z'
                orderId: P100240019
                merchant:
                  merchantId: mch_8812
                  merchantName: Maple Coffee
                lossCause: PLATFORM_ERROR
                lossRecovery:
                  adjustmentId: SA261103000007
                  amount:
                    amount: '1200'
                    currency: CAD
                billId: CB261101000012
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /recon-discrepancies/{discrepancyId}/disposition:
    parameters:
      - $ref: '#/components/parameters/DiscrepancyIdPath'
    post:
      tags:
        - recon-discrepancies
      operationId: submitDiscrepancyDisposition
      x-required-privilege: clr:discrepancy:manage
      summary: 提交差异处置
      description: |
        对一条待处理差异提交处置方向与说明（说明必填）：

        - 补记（`correct_post`）/ 字段更正（`align_correction`）：当场交执行方执行；处置成功即已执行，处置方向、说明与执行时刻同时记下，差异仍为待处理，等确认已处理（`resolveReconDiscrepancy`）；失败不留任何改动。可执行的只有三种：
          - 收款长款提补记：平台有这笔交易且尚未成功（已关闭、处理中或待发起），且该账单里没有同一笔的撤销行 → 按通道账单补记为成功（订单待付或已过期则成交；订单已有成交或已关闭则不重开、原路自动退回）。
          - 撤销状态不符提字段更正：平台交易的撤销尚未定论（处理中或待发起）→ 关闭该交易。
          - 退款长款提补记：平台退款仍在通道处理中且尚未被通道受理 → 补做受理后转成功。

          其余补记 / 字段更正（含平台无对应交易的单边长款，以及金额、汇率、手续费的更正）一律被拒；已成功的交易或退款被通道账单推翻的，同样不改其状态，按差异分类追款、核销或确认已处理（可核销的收款短款、退款长款可选原因归属计入平台资损并向商户追回）。
        - 原路退回（`refund_back`）：由运营在通道端自行退款，系统只记下处置方向与说明，执行时刻为空；差异仍为待处理，核实退成后确认已处理，不能核销。已提交原路退回的可改提其他处置。
        - 向通道追款（`pursue`）：同样由运营在通道端自行追款，系统只记下处置方向与说明，差异仍为待处理；追回后确认已处理，或转核销（`writeOffReconDiscrepancy`）。已提交追款的可改提其他处置。

        **什么时候拒绝**（差异不变）：

        - `308604` 执行方拒绝或未能执行该处置，不记处置方向；`context.reasonCode` 取 `CORRECTION_NOT_SUPPORTED`（这类差异没有可执行的补记 / 字段更正）或 `TXN_STATE_CONFLICT`（在可执行范围内，但对应交易或退款当前状态不受理，如已失败、已成功），页面按码取展示文案，取不到时显示码。
        - `308603` 差异已不在待处理（他人先处理了），重读差异。
        - `308605` 该差异不适用这种处置：退款取整差汇总只能核销；已提交补记、字段更正后不能再改提交（原路退回、追款可改提）。
        - `disposition` 不在取值内、`note` 缺或超长 → `400`。
        - 差异不存在 → `404`。

        带状态前置，不挂幂等键。成功的处置记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscrepancyDispositionRequest'
            examples:
              alignCorrection:
                summary: 字段更正
                value:
                  disposition: align_correction
                  note: 通道账单显示该笔已撤销，按通道关闭交易
              pursue:
                summary: 向通道追款
                value:
                  disposition: pursue
                  note: 已发邮件向通道追索
      responses:
        '200':
          description: 已记下处置，返回差异此时的状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscrepancyDispositionResult'
              example:
                discrepancyId: RD261102000045
                status: pending
                disposition: align_correction
                dispositionAppliedAt: '2026-11-02T10:12:30Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308603
        - 308604
        - 308605
  /recon-discrepancies/{discrepancyId}/resolution:
    parameters:
      - $ref: '#/components/parameters/DiscrepancyIdPath'
    post:
      tags:
        - recon-discrepancies
      operationId: resolveReconDiscrepancy
      x-required-privilege: clr:discrepancy:manage
      summary: 确认差异已处理
      description: |
        把一条待处理差异确认为已处理，记处理人与时刻：已提交的补记 / 字段更正已执行、原路退回已在通道端退成、追款已追回，或确认无需处理。没提交过处置的（无需处理）`note` 必填；带了 `note` 覆盖原说明。

        **什么时候拒绝**（差异不变）：

        - `308603` 差异已不在待处理（他人先处理了，或自己上一次已成功〔提交后超时重点〕），重读差异。
        - `308605` 该差异是退款取整差汇总，只能核销。
        - 没提交过处置又没填 `note`、`note` 超长 → `400`。
        - 差异不存在 → `404`。

        带状态前置，不挂幂等键。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscrepancyNoteOptional'
            example:
              note: 通道已补发账单行，金额一致
      responses:
        '204':
          description: 已确认
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308603
        - 308605
  /recon-discrepancies/{discrepancyId}/write-off:
    parameters:
      - $ref: '#/components/parameters/DiscrepancyIdPath'
    post:
      tags:
        - recon-discrepancies
      operationId: writeOffReconDiscrepancy
      x-required-privilege: clr:discrepancy:manage
      summary: 核销差异
      description: |
        核销一条待处理的长款、短款或退款取整差汇总差异，说明必填：差异转已核销，记处理人、时刻与说明，差额按通道清算差异核销入账。

        核销收款短款或退款长款时，系统差错造成、由平台承担的可选原因归属 `lossCause`，选了即把该核销额计入平台资损、不进通道清算差异，之后可向商户追回（`createReconLossRecovery`）；能否核销、核销额照常。

        **什么时候拒绝**（差异不变）：

        - `308603` 差异已不在待处理，重读差异。
        - `308605` 收款长款、退款短款或退款取整差汇总选了原因归属。
        - `308605` 差异是状态不符，不核销，改走字段更正；或差异已提交补记、字段更正（已执行）或原路退回，只能确认已处理；或差异是退款行短款且该退款已确认在通道受理后失败、已结回商户，只能确认已处理；或差异是退款行短款且该退款已被通道受理、仍在通道处理中，等该退款有结论后再处置（除此之外只提交了向通道追款的仍可核销）。
        - `note` 缺或超长、`lossCause` 不在取值内 → `400`。
        - 差异不存在 → `404`。

        带状态前置，不挂幂等键。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscrepancyWriteOffRequest'
            examples:
              writeOff:
                summary: 核销
                value:
                  note: 通道确认无法追回，按坏账核销
              platformLoss:
                summary: 计入平台资损
                value:
                  note: 平台重复入账、通道无此笔，按平台资损核销
                  lossCause: PLATFORM_ERROR
      responses:
        '204':
          description: 已核销
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308603
        - 308605
  /recon-discrepancies/{discrepancyId}/loss-recovery:
    parameters:
      - $ref: '#/components/parameters/DiscrepancyIdPath'
    post:
      tags:
        - recon-discrepancies
      operationId: createReconLossRecovery
      x-required-privilege: clr:discrepancy:manage
      summary: 从计入平台资损的差异向商户追回
      description: |
        对一条核销时已计入平台资损的差异，向对应商户追回，原因必填、商户可见：对该商户建一笔调账扣款（商户侧明细与其他调账扣款同一类型，带填写的原因），商户可结算余额扣至 0、不足部分记应收商户款且不超授信额度。成功后差异的追回额与调账单号在列表与详情里显示。

        - 每条差异至多追回一次；追回额不小于 1 个最小单位、不大于该差异计入平台资损的金额，部分追回后剩余部分由平台承担。
        - 对象商户：差异对应交易或退款所属的商户；平台没有该退款记录的单边退款差异，按通道交易号找到的原收款交易所属商户。
        - `amount` 币种须是该差异的结算币种。

        **什么时候拒绝**（不建调账）：

        - `308618` 该差异核销时未计入平台资损、已追回过、追回额超过资损额，或找不到对应商户。
        - `308619` 商户可结算余额加剩余授信额度不足追回额。
        - `amount` 币种不是该差异的结算币种、`reason` 缺或超长 → `400`。
        - 差异不存在 → `404`。

        资金登记，带 `Idempotency-Key`：同键同请求回放首次结果；同键不同请求 → `409`·`908003`；首次请求还在处理 → `409`·`908002`。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconLossRecoveryRequest'
            example:
              amount:
                amount: '1200'
                currency: CAD
              reason: 11-01 交易被平台重复入账，追回该笔款项
      responses:
        '201':
          description: 已追回，返回调账单号与追回额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconLossRecoveryResult'
              example:
                discrepancyId: RD261102000046
                adjustmentId: SA261103000007
                amount:
                  amount: '1200'
                  currency: CAD
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308618
        - 308619
  /recon-discrepancies/rounding-write-offs:
    post:
      tags:
        - recon-discrepancies
      operationId: createRoundingWriteOffs
      x-required-privilege: clr:discrepancy:manage
      summary: 按账单日区间批量核销退款取整差
      description: |
        把账单日区间内（可限定一个通道）全部待处理的退款取整差汇总差异一次核销，每条同单条核销、各记一条操作审计；返回核销条数。区间内没有待处理的取整差汇总时返回 `0`。只作用于退款取整差汇总，其余分类不受影响。

        `from` / `to` 两端必填，`to` 早于 `from` → `400`；`note` 必填。

        重复提交时，上一次已核销的不再是待处理，本次返回 `0`，不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoundingWriteOffRequest'
            example:
              from: '2026-10-01'
              to: '2026-10-31'
              channelId: CH0012
              note: 10 月退款取整差核销
      responses:
        '200':
          description: 已核销
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoundingWriteOffResult'
              example:
                writtenOffCount: 23
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /refund-confirmations:
    get:
      tags:
        - refund-confirmations
      operationId: listRefundConfirmations
      x-required-privilege: clr:refund-confirmation:view
      summary: 待人工确认退款（待确认 / 已确认）
      description: |
        本人数据范围内商户的、已转人工确认的退款，按 `confirmationState` 分两档：

        - `PENDING` 待确认（默认）：处于通道处理中且已转人工的退款，不按日期，按转人工时刻从新到旧。此时的 `total` 就是导航上的待确认数。
        - `CONFIRMED` 已确认：已由人工确认结果的退款，按确认日期区间筛选（`from` / `to` 两端必填，跨度超过允许的最大查询窗口 → `400`），按确认时刻从新到旧。

        `PENDING` 时传了 `from` / `to` 不生效。已确认的行 `status` 是确认后的终态：`SUCCESS` = 确认通道已退，`FAILED`（`failureReason = UNCONFIRMED`）= 确认通道未退。
      parameters:
        - name: confirmationState
          in: query
          required: false
          description: '`PENDING` 待确认 / `CONFIRMED` 已确认；不传 = `PENDING`。'
          schema:
            type: string
            enum:
              - PENDING
              - CONFIRMED
            default: PENDING
        - name: from
          in: query
          required: false
          description: 确认起始日期（含当日）。`confirmationState = CONFIRMED` 时与 `to` 同为必填；`PENDING` 时不生效。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: false
          description: 确认截止日期（含当日；与 `from` 成对）。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - $ref: '#/components/parameters/MerchantFilter'
        - name: keyword
          in: query
          required: false
          description: 平台订单号、平台退款号、通道退款号模糊匹配。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RefundConfirmationItem'
              example:
                total: 1
                data:
                  - refundId: R100240002-2
                    orderId: P100240002
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    merchantCode: C3BM68
                    amount:
                      amount: '5000'
                      currency: CNY
                    settleAmount:
                      amount: '959'
                      currency: CAD
                    status: CHANNEL_PROCESSING
                    acceptedAt: '2026-10-20T09:12:05Z'
                    escalatedAt: '2026-10-23T09:12:05Z'
                    channelRefundNo: '50300000012026102000001'
                    channelError:
                      code: SYSTEMERROR
                      message: 系统繁忙，请稍后再查询
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /refund-confirmations/{refundId}/decision:
    parameters:
      - $ref: '#/components/parameters/RefundIdPath'
    post:
      tags:
        - refund-confirmations
      operationId: decideRefundConfirmation
      x-required-privilege: clr:refund-confirmation:manage
      summary: 确认退款结果（通道未退或通道已退）
      description: |
        对待确认的退款确认通道侧结果，确认人是当前登录的后台用户，`note`（确认说明）必填：

        - `CHANNEL_NOT_REFUNDED`：通道未退。退款转失败、失败原因为结果未确认；已受理的，退款金额回到商户余额；尚未受理的，释放占用、可退额度放回订单。
        - `CHANNEL_REFUNDED`：通道已退。退款转成功；尚未受理的同时补受理入账。

        响应的 `status` 是退款确认后的状态。重新发起退款只能由商户在商户后台做。

        **什么时候拒绝**（退款不变）：

        - `308615` 退款已不是待确认（他人先确认了、它已自行得出结果，或自己上一次已成功〔提交后超时重点〕），重读队列。
        - `outcome` 不在取值内、`note` 没填或超长 → `400`。
        - 退款不存在，或订单所属商户在本人数据范围外 → `404`。

        带状态前置，两人同时确认以先到者为准，不挂幂等键。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundConfirmationDecision'
            examples:
              notRefunded:
                summary: 确认通道未退
                value:
                  outcome: CHANNEL_NOT_REFUNDED
                  note: 通道后台查无此退款
              refunded:
                summary: 确认通道已退
                value:
                  outcome: CHANNEL_REFUNDED
                  note: 通道后台显示已退
      responses:
        '200':
          description: 已确认，返回退款此时的状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundConfirmationResult'
              examples:
                failed:
                  summary: 确认通道未退
                  value:
                    refundId: R100240002-2
                    status: FAILED
                    failureReason: UNCONFIRMED
                succeeded:
                  summary: 确认通道已退
                  value:
                    refundId: R100240002-2
                    status: SUCCESS
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308615
  /settlement-calendar/{month}:
    parameters:
      - $ref: '#/components/parameters/MonthPath'
    get:
      tags:
        - settlement-calendar
      operationId: getSettlementCalendarMonth
      x-required-privilege: clr:calendar:view
      summary: 某月清算日历
      description: |
        该月每一天在普通轨与 KA 轨上是否清算，按日期从先到后。日历的「日」按平台运营时区划分。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementCalendarMonth'
              example:
                month: 2026-11
                days:
                  - date: '2026-11-01'
                    clearingDay: false
                    kaClearingDay: false
                  - date: '2026-11-02'
                    clearingDay: true
                    kaClearingDay: true
                  - date: '2026-11-03'
                    clearingDay: true
                    kaClearingDay: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - settlement-calendar
      operationId: replaceSettlementCalendarMonth
      x-required-privilege: clr:calendar:edit
      summary: 整月设置清算日历
      description: |
        按月整体设置两轨的清算日：`clearingDates` 列出的日期为普通商户清算日，`kaClearingDates` 列出的为 KA 商户清算日，该月其余日期为非清算日。只作用于此后的归集，已建的结算单不动。临时改非清算日（如突发关市）也走本接口。

        尚未建批的日期改为非清算日后，当天不建结算单，当天的明细顺延到下一个清算日归集；没有另外的补清算动作。

        **什么时候拒绝**（日历不变）：

        - `308617` 某日已有未失败的结算单，而本次提交把该商户当前所在的那一轨改为非清算日；整次被拒，重读日历后改提。
        - 列出的日期不在路径月份内 → `400`。

        同一轨重复列出的日期按一次计。

        **全量覆盖**：两个集合都要传，空数组表示该轨整月都不清算。带状态前置，不挂幂等键；重复提交同一份日历结果不变。前后值记入操作审计（只记实际变化的日期）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementCalendarMonthWrite'
            example:
              clearingDates:
                - '2026-11-02'
                - '2026-11-03'
                - '2026-11-04'
              kaClearingDates:
                - '2026-11-02'
                - '2026-11-04'
      responses:
        '204':
          description: 已生效
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308617
