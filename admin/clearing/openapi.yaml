      summary: 汇回单差异说明并确认
      description: |
        对核对不一致（`verifyStatus = DISCREPANT`）且未冲销的汇回单填说明并确认，记说明人与时刻。不记账：差额仍留在对渠道方的应收里，不自动核销。

        **什么时候拒绝**：

        - `308613` 汇回单已冲销。
        - `308611` 核对结果不是不一致，或已说明过，重读汇回单。
        - `note` 缺或超长 → `400`。
