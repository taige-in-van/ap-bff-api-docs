      operationId: submitPayoutFile
      x-required-privilege: clr:payout:manage
      summary: 登记出款文件已提交
      description: |
        把平台出款文件交给银行后登记已提交：文件转已提交，记提交人与提交时刻；`bankReference`（银行给的受理凭据）可当时填，也可在登记受理结果时补。渠道方执行的文件由系统发送给渠道方、发送成功即已提交，不经本接口。

        **什么时候拒绝**：

        - `308606` 文件不是已生成状态，或是渠道方执行的文件，重读文件。
        - `bankReference` 超长 → `400`。
        - 出款文件不存在 → `404`。

        带状态前置，不挂幂等键。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
