          $ref: '#/components/schemas/FeeCollectionMethod'
        receivedOn:
          description: 到账日期。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        bankReference:
          type: string
          minLength: 1
          maxLength: 64
          description: 银行到账参考号；没填时不返回本键。
        statementId:
          description: 对应的对账单；没填时不返回本键。
          allOf:
            - $ref: '#/components/schemas/StatementId'
        statementNo:
          type: string
          minLength: 1
          maxLength: 32
          description: 对应对账单的单号；没填对账单时不返回本键。
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 备注；没填时不返回本键。
        createdBy:
          description: 登记人；没有记录时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        createdAt:
          description: 登记时刻。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        returnedOn:
          description: 退回日期；未退回时不返回本键。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        returnReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 退回原因；未退回时不返回本键。
        returnedBy:
          description: 登记退回的人；未退回时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
    FeeCollectionCreate:
      type: object
      additionalProperties: false
      required:
        - merchantId
        - amount
        - collectionMethod
        - receivedOn
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        amount:
          description: 收款金额，币种须是该商户的结算币种。
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
        collectionMethod:
          $ref: '#/components/schemas/FeeCollectionMethod'
        receivedOn:
          description: 到账日期，不晚于今天。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        bankReference:
          type: string
          minLength: 1
          maxLength: 64
          description: 银行到账参考号，可不填。
        statementId:
          description: 对应的对账单，可不填；填了须是该商户已出具的对账单。
          allOf:
            - $ref: '#/components/schemas/StatementId'
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 备注，可不填。
    FeeCollectionCreated:
      type: object
      additionalProperties: false
      required:
        - collectionId
      properties:
        collectionId:
          type: string
          minLength: 1
          maxLength: 32
          description: 收款登记号。
    FeeCollectionReturn:
      type: object
      additionalProperties: false
      required:
        - returnedOn
        - returnReason
      properties:
        returnedOn:
          description: 退回日期，不早于该收款的到账日、不晚于今天。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        returnReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 退回原因。
    FeeCollectionListFilter:
      type: object
      additionalProperties: false
      description: 服务费收款导出的筛选，与 `listFeeCollections` 的同名查询参数同义；`from` / `to`（到账日）必填，其余不传的项不筛。
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/LocalDate'
        to:
          $ref: '#/components/schemas/LocalDate'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        collectionMethod:
          $ref: '#/components/schemas/FeeCollectionMethod'
        returned:
          type: boolean
          description: '`true` 只导已退回 / `false` 只导未退回。'
    ProgramId:
      type: string
      minLength: 1
      maxLength: 32
      description: 返利活动标识。
