      operationId: resolveChannelSettlementDiscrepancy
      x-required-privilege: clr:channel-settlement:manage
      summary: 通道结算单差异说明并确认
      description: |
        对有待说明差异的通道结算单（`awaitingDiscrepancyNote` 为真）填说明并确认，记说明人与时刻。只填说明、不另设核销，不改账务：核对结果不一致的，差额能对上逐笔对账差异的随该差异处理，对不上的只作说明、差额留在通道在途；到账确认金额与声明净额不一致的，到账过账仍按通道声明净额，确认与撤销都不过账。

        **什么时候拒绝**：

        - `308611` 没有待说明的差异（核对一致且到账确认金额与声明净额一致或尚未确认），或已说明过，重读通道结算单。
        - `note` 缺或超长 → `400`。
        - 通道结算单不存在 → `404`。

        带状态前置，不挂幂等键。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscrepancyNote'
            example:
              note: 通道少划付 12.30，已转对账差异跟进
      responses:
        '204':
          description: 已说明
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308611
