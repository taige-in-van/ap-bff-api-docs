                      amount: '10012'
                      currency: CAD
                    programCode: VOL-REBATE-2027
                    basisAmount:
                      amount: '10012000'
                      currency: CAD
                    reason: VOL-REBATE-2027 返利（2026-12-03 至 2027-06-14 累计达标）
                    occurredAt: '2027-06-15T07:00:12Z'
                    createdAt: '2027-06-15T07:00:12Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  parameters:
    FromDate:
      name: from
      in: query
      required: true
      description: 起始日期（含当日），按哪个日期见各接口说明。与 `to` 同为必填，`to` 早于 `from` → `400`。
      schema:
        $ref: '#/components/schemas/LocalDate'
    ToDate:
      name: to
      in: query
      required: true
      description: 截止日期（含当日；与 `from` 成对必填）。
      schema:
        $ref: '#/components/schemas/LocalDate'
    MerchantFilter:
      name: merchantId
      in: query
      required: false
      description: 只看这个商户。商户在本人数据范围外时结果为空。
      schema:
        $ref: '#/components/schemas/MerchantId'
    ChannelFilter:
      name: channelId
      in: query
      required: false
      description: 只看这个通道。
      schema:
        $ref: '#/components/schemas/ChannelId'
    SettlementBatchStatusFilter:
      name: status
      in: query
      required: false
      description: 按结算单状态，可多选。
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/SettlementBatchStatus'
    VerifyStatusFilter:
      name: verifyStatus
      in: query
      required: false
      description: 按核对结果，可多选；`UNVERIFIED` 是尚未核对。
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          enum:
            - MATCHED
            - DISCREPANT
            - UNVERIFIED
    ReceiptConfirmedFilter:
      name: receiptConfirmed
      in: query
      required: false
      description: '`true` 只看已确认到账 / `false` 只看未确认到账；不传不筛。'
      schema:
        type: boolean
    BillIdPath:
      name: billId
      in: path
      required: true
      description: 通道账单。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    DiscrepancyIdPath:
      name: discrepancyId
      in: path
      required: true
      description: 对账差异。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    RefundIdPath:
      name: refundId
      in: path
      required: true
      description: 平台退款号。退款不存在或订单所属商户在本人数据范围外 → `404`。
      schema:
        $ref: '#/components/schemas/RefundId'
    MonthPath:
      name: month
      in: path
      required: true
      description: 月份 `YYYY-MM`。
      schema:
        type: string
        pattern: ^\d{4}-(0[1-9]|1[0-2])$
    SettlementDatePath:
      name: settlementDate
      in: path
      required: true
      description: 清算日。
      schema:
        $ref: '#/components/schemas/LocalDate'
    BatchIdPath:
      name: batchId
      in: path
      required: true
      description: 结算单号。结算单不存在或所属商户在本人数据范围外 → `404`。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    PayoutFileIdPath:
      name: payoutFileId
      in: path
      required: true
      description: 出款文件。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    PayoutLineIdPath:
      name: payoutLineId
      in: path
      required: true
      description: 出款行。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    ChannelSettlementIdPath:
      name: channelSettlementId
      in: path
      required: true
      description: 通道结算单。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    RemittanceIdPath:
      name: remittanceId
      in: path
      required: true
      description: 汇回单号。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    ReconFileIdPath:
      name: reconFileId
      in: path
      required: true
      description: T&T 对账文件。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    MerchantIdPath:
      name: merchantId
      in: path
      required: true
      description: 商户标识。商户不存在或在本人数据范围外 → `404`。
      schema:
        $ref: '#/components/schemas/MerchantId'
    FromMonth:
      name: fromMonth
      in: query
      required: true
      description: 起始交易月（含）。与 `toMonth` 同为必填，`toMonth` 早于 `fromMonth` → `400`。
      schema:
        $ref: '#/components/schemas/StatementMonth'
    ToMonth:
      name: toMonth
      in: query
      required: true
      description: 截止交易月（含；与 `fromMonth` 成对必填）。
      schema:
        $ref: '#/components/schemas/StatementMonth'
    StatementIdPath:
      name: statementId
      in: path
      required: true
      description: 对账单。对账单不存在、尚未出具完成或所属商户在本人数据范围外 → `404`。
      schema:
        $ref: '#/components/schemas/StatementId'
    CollectionIdPath:
      name: collectionId
      in: path
      required: true
      description: 收款登记号。
      schema:
        type: string
        minLength: 1
        maxLength: 32
    ProgramIdPath:
      name: programId
      in: path
      required: true
      description: 返利活动。活动不存在 → `404`。
      schema:
        $ref: '#/components/schemas/ProgramId'
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        页面当前的语言（BCP-47 语言标记，可带权重列表，如 `zh-CN,zh;q=0.9,en;q=0.8`）。服务端在本接口支持的语言里取最接近的一种（如 `fr-CA` → `fr`）；按它渲染什么、取不中时退到哪种语言，见所在面的说明。

        响应带 `Content-Language` 的接口，实际用的语言以该头为准。
      schema:
        type: string
        minLength: 2
        maxLength: 256
  schemas:
    ChannelId:
      type: string
      minLength: 1
      maxLength: 32
      description: 通道标识。
    ChannelBrief:
      type: object
      additionalProperties: false
      description: 一个通道的标识、名称与收单主体号（列表与记录上展示「哪个通道」）。
      required:
        - channelId
        - channelName
        - channelMerchantId
      properties:
        channelId:
          $ref: '#/components/schemas/ChannelId'
        channelName:
          type: string
          minLength: 1
          description: 通道名称。
        channelMerchantId:
          type: string
          minLength: 1
          description: 通道侧的收单主体号（如服务商商户号）。
    PayoutExecutionMode:
      type: string
      enum:
        - PLATFORM
        - CHANNEL
      description: 出款执行方式：`PLATFORM` 平台出款 · `CHANNEL` 渠道方执行。
    ClearingChannelOption:
      type: object
      additionalProperties: false
      description: 通道候选的一项：通道标识、名称与收单主体号，加结算币种、清算归属、出款执行方式与是否启用。
      required:
        - channelId
        - channelName
        - channelMerchantId
        - settleCurrency
        - clearingAttribution
        - enabled
      properties:
        channelId:
          $ref: '#/components/schemas/ChannelId'
        channelName:
          type: string
          minLength: 1
          description: 通道名称。
        channelMerchantId:
          type: string
          minLength: 1
          description: 通道侧的收单主体号（如服务商商户号）。
        settleCurrency:
          $ref: '#/components/schemas/Currency'
        clearingAttribution:
          type: string
          enum:
            - PLATFORM
            - CHANNEL_DIRECT
          description: 清算归属：`PLATFORM` 平台清算 · `CHANNEL_DIRECT` 渠道方直清。
        payoutExecutionMode:
          description: 出款执行方式；渠道方直清的通道不返回本键。
          allOf:
            - $ref: '#/components/schemas/PayoutExecutionMode'
        enabled:
          type: boolean
          description: 通道是否启用。
    PayoutAccount:
      type: object
      additionalProperties: false
      description: 出款打入的商户结算账户；账号只给末 4 位。
      required:
        - bankName
        - accountNumberLast4
      properties:
        bankName:
          type: string
          minLength: 1
          description: 银行名。
        accountNumberLast4:
          type: string
          minLength: 1
          maxLength: 4
          description: 账号末 4 位。
    ChannelBillStatus:
      type: string
      enum:
        - FETCH_FAILED
        - IMPORT_FAILED
        - IMPORTED
        - RECONCILED
      description: 账单状态：`FETCH_FAILED` 拉取失败 · `IMPORT_FAILED` 导入失败 · `IMPORTED` 已导入、待比对 · `RECONCILED` 已比对。
    DiscrepancyClass:
      type: string
      enum:
        - surplus
        - shortage
        - mismatch
        - refund_rounding
      description: 差异分类：`surplus` 长款（通道有、平台无，或通道金额大）· `shortage` 短款（平台有、通道无，或平台金额大）· `mismatch` 状态不符（金额一致、其他字段不符）· `refund_rounding` 退款取整差汇总（某通道某账单日在容差内的退款取整差合为一条）。
    DiscrepancyObjectType:
      type: string
      enum:
        - PAYMENT
        - REFUND
        - REVOKED
      description: 差异对象类型：`PAYMENT` 支付 · `REFUND` 退款 · `REVOKED` 撤销。
    DiscrepancyStatus:
      type: string
      enum:
        - pending
        - resolved
        - written_off
      description: 差异状态：`pending` 待处理 · `resolved` 已处理 · `written_off` 已核销。
    Disposition:
      type: string
      enum:
        - correct_post
        - refund_back
        - pursue
        - align_correction
      description: 处置方向：`correct_post` 补记 · `refund_back` 原路退回 · `pursue` 向通道追款 · `align_correction` 字段更正。
    LossCause:
      type: string
      enum:
        - PLATFORM_ERROR
        - CHANNEL_ERROR
        - OPERATOR_ERROR
      description: 计入平台资损的原因归属：`PLATFORM_ERROR` 平台系统差错 · `CHANNEL_ERROR` 通道差错 · `OPERATOR_ERROR` 运营差错。
    SettlementBatchStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - SETTLED
        - FAILED
        - RETURNED
      description: 结算单状态：`PENDING` 待出款 · `PROCESSING` 出款处理中 · `SETTLED` 已结算 · `FAILED` 出款失败（可重新出款）· `RETURNED` 已退票。
    PayoutFileFormat:
      type: string
      enum:
        - RBC_ACH
        - CIBC_EFT_1464
        - POCKYT_XLSX
        - NIHAOPAY_XLSX
      description: 出款文件格式：`RBC_ACH` RBC · `CIBC_EFT_1464` CIBC EFT 1464 · `POCKYT_XLSX` Pockyt · `NIHAOPAY_XLSX` NihaoPay。
    PayoutFileStatus:
      type: string
      enum:
        - GENERATED
        - SUBMITTED
        - ACCEPTED
        - REJECTED
        - VOIDED
      description: 出款文件状态：`GENERATED` 已生成 · `SUBMITTED` 已提交 · `ACCEPTED` 已受理 · `REJECTED` 被拒 · `VOIDED` 已作废。
    PayoutFailureKind:
      type: string
      enum:
        - REJECTED
        - RETURNED
        - VOIDED
      description: 出款行失败类别：`REJECTED` 受理时被剔除或所在出款文件整份被拒 · `RETURNED` 已付出后退回（退票） · `VOIDED` 所在出款文件提交前作废、钱未出。
    VerifyStatus:
      type: string
      enum:
        - MATCHED
        - DISCREPANT
      description: 核对结果：`MATCHED` 一致 · `DISCREPANT` 不一致。
    DiscrepancyCount:
      type: object
      additionalProperties: false
      description: 一份账单某一分类差异的各状态计数。
      required:
        - discrepancyClass
        - pending
        - resolved
        - writtenOff
      properties:
        discrepancyClass:
          $ref: '#/components/schemas/DiscrepancyClass'
        pending:
          type: integer
          minimum: 0
          description: 待处理条数。
        resolved:
          type: integer
          minimum: 0
          description: 已处理条数。
        writtenOff:
          type: integer
          minimum: 0
          description: 已核销条数。
    ChannelBill:
      type: object
      additionalProperties: false
      description: 某通道某账单日的一份账单与对账结果。
      required:
        - billId
        - channel
        - billDate
        - billType
        - billStatus
        - hasOriginal
        - discrepancyCounts
      properties:
        billId:
          type: string
          minLength: 1
          maxLength: 32
          description: 通道账单。
        channel:
          $ref: '#/components/schemas/ChannelBrief'
        billDate:
          description: 账单日（通道日）。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        billType:
          type: string
          enum:
            - TRANSACTION
            - SETTLEMENT
          description: 账单类型：`TRANSACTION` 交易账单 · `SETTLEMENT` 结算账单。
        billStatus:
          $ref: '#/components/schemas/ChannelBillStatus'
        failureReason:
          type: string
          minLength: 1
          description: 拉取或导入失败的原因；没失败时不返回本键。
        declaredPaymentCount:
          type: integer
          minimum: 0
          description: 通道声明的收款笔数；账单没导入时不返回本键。
        declaredPaymentAmount:
          description: 通道声明的收款金额；账单没导入时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        declaredRefundCount:
          type: integer
          minimum: 0
          description: 通道声明的退款笔数；账单没导入时不返回本键。
        declaredRefundAmount:
          description: 通道声明的退款金额；账单没导入时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        hasOriginal:
          type: boolean
          description: 是否有通道原件可下载（`getChannelBillOriginal`）。
        reconciledAt:
          description: 最近一次比对完成的时刻；还没比对时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        resultLevel:
          type: string
          enum:
            - ALL_MATCHED
            - AMOUNT_DISCREPANCY
            - MISSING_ENTRIES
          description: 结果档：`MISSING_ENTRIES` 有漏单（有一边有、另一边没有的差异）· `AMOUNT_DISCREPANCY` 有金额差异（没有漏单、但有其他差异）· `ALL_MATCHED` 全部一致。只看本账单日的差异，不论状态；还没比对时不返回本键。
        discrepancyCounts:
          type: array
          description: 各分类差异的计数，只列有差异的分类；没有差异时为空数组。
          items:
            $ref: '#/components/schemas/DiscrepancyCount'
    ReconciliationRerunRequest:
      type: object
      additionalProperties: false
      required:
        - channelId
        - billDate
      properties:
        channelId:
          $ref: '#/components/schemas/ChannelId'
        billDate:
          description: 要重新对账的账单日。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
    FieldDifference:
      type: object
      additionalProperties: false
      description: 一个不符字段与两侧的值，原样给出。
      required:
        - field
      properties:
        field:
          type: string
          enum:
            - STATUS
            - SETTLE_AMOUNT
            - FX_RATE
            - FEE_AMOUNT
          description: 不符的字段：`STATUS` 交易状态 · `SETTLE_AMOUNT` 结算金额 · `FX_RATE` 汇率 · `FEE_AMOUNT` 手续费。
        channelValue:
          type: string
          description: 通道侧的值；通道侧没有时不返回本键。
        platformValue:
          type: string
          description: 平台侧的值；平台侧没有时不返回本键。
    ReconDiscrepancy:
      type: object
      x-parent: true
      description: 对账差异列表的一行；详情在它上面加字段。
      required:
        - discrepancyId
        - channel
        - billDate
        - discrepancyClass
        - matchKey
        - status
      properties:
        discrepancyId:
          type: string
          minLength: 1
          maxLength: 32
          description: 对账差异。
        channel:
          $ref: '#/components/schemas/ChannelBrief'
        billDate:
          description: 最近一次更新该差异的账单的账单日。还没填处置方向或说明的待处理差异，在后续账单里再次出现时随之更新；已填处置方向或说明、已处理或已核销的不再更新。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        objectType:
          description: 差异对象类型；退款取整差汇总不返回本键。
          allOf:
            - $ref: '#/components/schemas/DiscrepancyObjectType'
        discrepancyClass:
          $ref: '#/components/schemas/DiscrepancyClass'
        matchKey:
          type: string
          minLength: 1
          maxLength: 128
          description: 配对键：平台的请求号，通道没回显时是通道交易号；退款取整差汇总是账单日。
        channelAmount:
          description: 发现时通道侧的结算金额；通道侧没有这一笔时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        platformAmount:
          description: 发现时平台侧的结算金额；平台侧没有这一笔时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        fieldDifferences:
          type: array
          description: 不符字段与两侧值；有不符字段就返回（含长款、短款上的次要不符字段），没有不符字段时不返回本键。
          items:
            $ref: '#/components/schemas/FieldDifference'
        status:
          $ref: '#/components/schemas/DiscrepancyStatus'
        disposition:
          description: 记下的处置方向；没提交过处置时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Disposition'
        dispositionAppliedAt:
          description: 执行方执行该处置的时刻；向通道追款、原路退回或没提交过处置时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 处理说明；没有时不返回本键。
        resolvedBy:
          description: 确认已处理或核销的人；还在待处理时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        resolvedAt:
          description: 确认已处理或核销的时刻；还在待处理时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        orderId:
          description: 平台侧这一笔所属的订单号（退款类差异是原订单）；平台侧没有这一笔、或是退款取整差汇总时不返回本键。
          allOf:
            - $ref: '#/components/schemas/OrderId'
        merchant:
          description: 平台侧这一笔所属的商户；平台侧没有这一笔时不返回本键。
          allOf:
            - $ref: '#/components/schemas/MerchantBrief'
        lossCause:
          description: 核销时计入平台资损的原因归属；未计入时不返回本键。
          allOf:
            - $ref: '#/components/schemas/LossCause'
        lossRecovery:
          description: 向商户追回的结果；未追回时不返回本键。
          allOf:
            - $ref: '#/components/schemas/LossRecovery'
    LossRecovery:
      type: object
      additionalProperties: false
      required:
        - adjustmentId
        - amount
      properties:
        adjustmentId:
          type: string
          minLength: 1
          maxLength: 32
          description: 追回建的调账单号。
        amount:
          description: 追回额。
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
    ReconDiscrepancyDetail:
      description: 对账差异详情：列表行的字段加下面这些。
      allOf:
        - $ref: '#/components/schemas/ReconDiscrepancy'
        - type: object
          required:
            - billId
          properties:
            billId:
              type: string
              minLength: 1
              maxLength: 32
              description: 最近一次更新该差异的通道账单，更新规则同 `billDate`。
            billLineNo:
              type: integer
              minimum: 1
              description: 通道账单原件里的行号；通道侧没有这一笔、或是退款取整差汇总时不返回本键。
    DiscrepancyDispositionRequest:
      type: object
      additionalProperties: false
      required:
        - disposition
        - note
      properties:
        disposition:
          $ref: '#/components/schemas/Disposition'
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 处理说明。
    DiscrepancyDispositionResult:
      type: object
      additionalProperties: false
      required:
        - discrepancyId
        - status
        - disposition
      properties:
        discrepancyId:
          type: string
          minLength: 1
          maxLength: 32
          description: 对账差异。
        status:
          description: 差异此时的状态；提交处置后仍为 `pending`。
          allOf:
            - $ref: '#/components/schemas/DiscrepancyStatus'
        disposition:
          $ref: '#/components/schemas/Disposition'
        dispositionAppliedAt:
          description: 执行方执行该处置的时刻；向通道追款与原路退回时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    DiscrepancyNote:
      type: object
      additionalProperties: false
      required:
        - note
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 说明。
    DiscrepancyNoteOptional:
      type: object
      additionalProperties: false
      description: 没提交过处置的（无需处理）`note` 必填。
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 处理说明。
    DiscrepancyWriteOffRequest:
      type: object
      additionalProperties: false
      required:
        - note
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 核销说明。
        lossCause:
          description: 计入平台资损的原因归属；不选 = 按通道清算差异核销。
          allOf:
            - $ref: '#/components/schemas/LossCause'
    ReconLossRecoveryRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - reason
      properties:
        amount:
          description: 追回额，币种须是该差异的结算币种，不大于该差异计入平台资损的金额。
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
        reason:
          type: string
          minLength: 1
          maxLength: 300
          description: 追回原因，作为调账原因，商户可见。
    ReconLossRecoveryResult:
      type: object
      additionalProperties: false
      required:
        - discrepancyId
        - adjustmentId
        - amount
      properties:
        discrepancyId:
          type: string
          minLength: 1
          maxLength: 32
          description: 对账差异。
        adjustmentId:
          type: string
          minLength: 1
          maxLength: 32
          description: 追回建的调账单号。
        amount:
          description: 追回额。
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
    RoundingWriteOffRequest:
      type: object
      additionalProperties: false
      required:
        - from
        - to
        - note
      properties:
        from:
          description: 账单日区间起（含当日）。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        to:
          description: 账单日区间止（含当日）。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        channelId:
          description: 只核销这个通道的；不带 = 全部通道。
          allOf:
            - $ref: '#/components/schemas/ChannelId'
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 核销说明，逐条记到被核销的差异上。
    RoundingWriteOffResult:
      type: object
      additionalProperties: false
      required:
        - writtenOffCount
      properties:
        writtenOffCount:
          type: integer
          minimum: 0
          description: 本次核销的条数。
    RefundConfirmationItem:
      type: object
      additionalProperties: false
      description: 待人工确认退款队列的一行。
      required:
        - refundId
        - orderId
        - merchant
        - merchantCode
        - amount
        - status
        - escalatedAt
      properties:
        refundId:
          $ref: '#/components/schemas/RefundId'
        orderId:
          description: 原订单的平台订单号。
          allOf:
            - $ref: '#/components/schemas/OrderId'
        merchant:
          description: 订单所属商户。
          allOf:
            - $ref: '#/components/schemas/MerchantBrief'
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        amount:
          description: 退款金额，原订单的标价币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        settleAmount:
          description: 退款金额折合的结算币种金额；通道还没受理时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        status:
          description: 退款此时的状态：待确认档恒为 `CHANNEL_PROCESSING`；已确认档为 `SUCCESS`（确认通道已退）或 `FAILED`（确认通道未退）。
          allOf:
            - $ref: '#/components/schemas/RefundStatus'
        failureReason:
          description: 失败原因；`status = FAILED` 时返回，人工确认通道未退的为 `UNCONFIRMED`。
          allOf:
            - $ref: '#/components/schemas/RefundFailureReason'
        acceptedAt:
          description: 通道受理成功的时刻；还没受理时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        escalatedAt:
          description: 转人工确认的时刻。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        channelRefundNo:
          type: string
          minLength: 1
          description: 通道返回的退款号；没送到通道或通道还没返回时不返回本键。
        channelError:
          description: 通道的原始错误，码与文字原样给出；通道没回错误时不返回本键。
          allOf:
            - $ref: '#/components/schemas/ChannelError'
        confirmedBy:
          description: 人工确认人；待确认档不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        confirmedAt:
          description: 人工确认时刻；待确认档不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        confirmationNote:
          type: string
          minLength: 1
          maxLength: 256
          description: 确认说明；没填时不返回本键。
    ChannelError:
      type: object
      additionalProperties: false
      description: 通道返回的原始错误，各通道的码与文字不统一、不翻译，原样给出。
      properties:
        code:
          type: string
          description: 通道错误码；通道没给时不返回本键。
        message:
          type: string
          description: 通道错误描述；通道没给时不返回本键。
    RefundConfirmationDecision:
      type: object
      additionalProperties: false
      required:
        - outcome
        - note
      properties:
        outcome:
          type: string
          enum:
            - CHANNEL_NOT_REFUNDED
            - CHANNEL_REFUNDED
          description: 确认结果：`CHANNEL_NOT_REFUNDED` 通道未退（退款失败）· `CHANNEL_REFUNDED` 通道已退（退款成功）。
        note:
          type: string
          minLength: 1
          maxLength: 256
          description: 确认说明，必填。
    RefundConfirmationResult:
      type: object
      additionalProperties: false
      required:
        - refundId
        - status
      properties:
        refundId:
          $ref: '#/components/schemas/RefundId'
        status:
          description: 退款确认后的状态：`SUCCESS` 或 `FAILED`。
          allOf:
            - $ref: '#/components/schemas/RefundStatus'
        failureReason:
          description: 失败原因；`status = FAILED` 时返回 `UNCONFIRMED`。
          allOf:
            - $ref: '#/components/schemas/RefundFailureReason'
    SettlementCalendarDay:
      type: object
      additionalProperties: false
      required:
        - date
        - clearingDay
        - kaClearingDay
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        clearingDay:
          type: boolean
          description: 普通商户当天是否清算。
        kaClearingDay:
          type: boolean
          description: KA 商户当天是否清算。
    SettlementCalendarMonth:
      type: object
      additionalProperties: false
      required:
        - month
        - days
      properties:
        month:
          type: string
          pattern: ^\d{4}-(0[1-9]|1[0-2])$
          description: 月份 `YYYY-MM`。
        days:
          type: array
          description: 该月每一天一项，按日期从先到后。
          items:
            $ref: '#/components/schemas/SettlementCalendarDay'
    SettlementCalendarMonthWrite:
      type: object
      additionalProperties: false
      description: 整月两轨的清算日集合，没列出的日期为非清算日。
      required:
        - clearingDates
        - kaClearingDates
      properties:
        clearingDates:
          type: array
          maxItems: 31
          description: 普通商户的清算日，都在路径月份内。
          items:
            $ref: '#/components/schemas/LocalDate'
        kaClearingDates:
          type: array
          maxItems: 31
          description: KA 商户的清算日，都在路径月份内。
          items:
            $ref: '#/components/schemas/LocalDate'
    SettlementAmounts:
      type: object
      x-parent: true
      description: 一组结算单的合计，各项金额都是同一个结算币种。
      required:
        - batchCount
        - payoutAmount
        - netSalesAmount
        - feeAmount
      properties:
        batchCount:
          type: integer
          minimum: 0
          description: 结算单张数。
        payoutAmount:
          description: 出款额合计。
          allOf:
            - $ref: '#/components/schemas/Money'
        netSalesAmount:
          description: 销售净额合计（收款减退款）。
          allOf:
            - $ref: '#/components/schemas/Money'
        feeAmount:
          description: 商户手续费合计。
          allOf:
            - $ref: '#/components/schemas/Money'
    SettlementScheduleSubtotal:
      description: 一个结算周期档位的合计。
      allOf:
        - $ref: '#/components/schemas/SettlementAmounts'
        - type: object
          required:
            - settlementCycle
            - settlementCycleDisplayName
          properties:
            settlementCycle:
              allOf:
                - $ref: '#/components/schemas/SettlementCycleCode'
              description: 结算周期档位 code。
            settlementCycleDisplayName:
              type: string
              minLength: 1
              description: 结算周期的展示名；前端有自己的多语言资源时按 `settlementCycle` 取用，本字段作兜底。
    PaymentMethodFamilySubtotal:
      type: object
      additionalProperties: false
      description: 一种支付方式（品牌）的明细合计；不带 `paymentMethodFamily` 的一项是「其他」。
      required:
        - settleAmount
        - feeAmount
      properties:
        paymentMethodFamily:
          description: 支付方式（品牌）；「其他」一项不返回本键。
          allOf:
            - $ref: '#/components/schemas/PaymentMethodFamily'
        settleAmount:
          description: 该类明细的结算金额合计（收款减退款）。
          allOf:
            - $ref: '#/components/schemas/Money'
        feeAmount:
          description: 该类明细的商户手续费合计。
          allOf:
            - $ref: '#/components/schemas/Money'
    SettlementCurrencyTotals:
      description: 一个结算币种的合计与细分。
      allOf:
        - $ref: '#/components/schemas/SettlementAmounts'
        - type: object
          required:
            - bySchedule
            - byPaymentMethodFamily
          properties:
            bySchedule:
              type: array
              description: 按结算周期档位细分。
              items:
                $ref: '#/components/schemas/SettlementScheduleSubtotal'
            byPaymentMethodFamily:
              type: array
              description: 按支付方式（品牌）细分，「其他」排最后。
              items:
                $ref: '#/components/schemas/PaymentMethodFamilySubtotal'
    SettlementDaySummary:
      type: object
      additionalProperties: false
      required:
        - settlementDate
        - items
      properties:
        settlementDate:
          $ref: '#/components/schemas/LocalDate'
        items:
          type: array
          description: 每个结算币种一组，按币种码排序。
          items:
            $ref: '#/components/schemas/SettlementCurrencyTotals'
    SettlementBatchListFilter:
      type: object
      additionalProperties: false
      description: 清算明细导出的筛选，与 `listSettlementBatches` 的同名查询参数同义；`from` / `to` 必填，其余不传的项不筛。
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/LocalDate'
        to:
          $ref: '#/components/schemas/LocalDate'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        status:
          type: array
          items:
            $ref: '#/components/schemas/SettlementBatchStatus'
    SettlementBatch:
      type: object
      x-parent: true
      description: 清算记录的一行（一张结算单 = 商户某清算日的一次出款）；详情在它上面加字段。
      required:
        - batchId
        - merchant
        - merchantCode
        - settlementDate
        - netSalesAmount
        - feeAmount
        - payoutAmount
        - status
      properties:
        batchId:
          type: string
          minLength: 1
          maxLength: 32
          description: 结算单号。
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        settlementDate:
          description: 清算日。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        periodFrom:
          description: 交易期间起：本单交易类明细最早的归属日；没有交易类明细时不返回本键。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        periodTo:
          description: 交易期间止：本单交易类明细最晚的归属日；没有交易类明细时不返回本键。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        netSalesAmount:
          description: 销售净额（收款减退款），结算币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        feeAmount:
          description: 商户手续费净额，结算币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        payoutAmount:
          description: 出款额，结算币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/SettlementBatchStatus'
        finalizedAt:
          description: 最近一次得出出款结果（已结算、出款失败或已退票）的时刻；还没有结果时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        payoutAccount:
          description: 最近一次有效出款尝试打入的账户（作废文件里的那次不算）；还没有有效出款尝试时不返回本键。
          allOf:
            - $ref: '#/components/schemas/PayoutAccount'
    PayoutAttempt:
      type: object
      additionalProperties: false
      description: 结算单的一次出款尝试。
      required:
        - attemptNo
        - payoutFileId
        - payoutLineId
        - payoutAmount
        - payoutAccount
      properties:
        attemptNo:
          type: integer
          minimum: 1
          description: 第几次出款尝试，从 1 起。
        payoutFileId:
          type: string
          minLength: 1
          maxLength: 32
          description: 所在出款文件。
        payoutLineId:
          type: string
          minLength: 1
          maxLength: 32
          description: 出款行。
        payoutAmount:
          description: 本次出款额，结算币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        payoutAccount:
          $ref: '#/components/schemas/PayoutAccount'
        failureKind:
          description: 失败类别；所在出款文件整份被拒时为 `REJECTED`；本次没有失败时不返回本键。
          allOf:
            - $ref: '#/components/schemas/PayoutFailureKind'
        failureCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 银行 / 渠道方的原因码原文；没有时不返回本键。
        failureReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 失败原因；所在出款文件整份被拒时取文件的拒绝原因；本次没有失败时不返回本键。
        failedOn:
          description: 银行 / 渠道方标注的退票日期；只有退票返回。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
    SettlementBatchDetail:
      description: 结算单详情：列表行的字段加全部出款尝试。
      allOf:
        - $ref: '#/components/schemas/SettlementBatch'
        - type: object
          required:
            - payoutAttempts
          properties:
            payoutAttempts:
              type: array
              description: 全部出款尝试，按序号从先到后；还没装进出款文件时为空数组。
              items:
                $ref: '#/components/schemas/PayoutAttempt'
    SettlementLine:
      type: object
      additionalProperties: false
      description: 结算单里的一条明细。金额是量，进出方向看 `lineType`。
      required:
        - lineId
        - lineType
        - sourceId
        - settleAmount
        - businessDate
        - occurredAt
        - holdActive
      properties:
        lineId:
          type: string
          minLength: 1
          maxLength: 32
          description: 明细行标识。
        lineType:
          type: string
          enum:
            - PAYMENT
            - REFUND
            - RESERVE_DRAWDOWN
            - REFUND_REVERSAL
            - TOP_UP
            - AUTO_REPLENISH
            - WITHDRAW
            - PENALTY
            - COMPENSATION
            - PROMOTION_WITHDRAWAL
            - PAYOUT_RETURN
          description: 明细类型：`PAYMENT` 收款 · `REFUND` 退款 · `RESERVE_DRAWDOWN` 准备金垫付退款 · `REFUND_REVERSAL` 退款失败回冲 · `TOP_UP` 准备金充值 · `AUTO_REPLENISH` 准备金自动补足 · `WITHDRAW` 准备金提取 · `PENALTY` 扣款 · `COMPENSATION` 补偿 · `PROMOTION_WITHDRAWAL` 营销账户提现 · `PAYOUT_RETURN` 出款退回。
        sourceId:
          type: string
          minLength: 1
          maxLength: 32
          description: 来源单据：收款是订单号，退款与回冲是退款号，其余是各自记录的标识。
        orderId:
          description: 关联订单；非交易类明细不返回本键。
          allOf:
            - $ref: '#/components/schemas/OrderId'
        paymentMethodFamily:
          description: 支付方式（品牌）；非交易类明细不返回本键。
          allOf:
            - $ref: '#/components/schemas/PaymentMethodFamily'
        settleAmount:
          description: 结算金额，结算币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        feeAmount:
          description: 商户手续费（退款行是退回商户的手续费）；不计费的明细不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        adjustmentReason:
          type: string
          minLength: 1
          maxLength: 300
          description: 调账原因；只有扣款与补偿返回。
        businessDate:
          description: 该笔明细的归属日（按商户的日切时刻划分）。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        occurredAt:
          description: 业务发生时刻（成交、受理或落定）。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        holdActive:
          type: boolean
          description: 这笔的结算锁是否生效中。
    ClearingOverview:
      type: object
      additionalProperties: false
      required:
        - failedBatchCount
        - submittedPayoutFileCount
        - failedBillCount
        - pendingDiscrepancyCount
      properties:
        failedBatchCount:
          type: integer
          minimum: 0
          description: 出款失败、还没重新出款的结算单数。
        submittedPayoutFileCount:
          type: integer
          minimum: 0
          description: 已提交、还没登记受理结果的出款文件数。
        earliestSubmittedAt:
          description: 上述出款文件中最早的提交时刻；计数为 0 时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        failedBillCount:
          type: integer
          minimum: 0
          description: 拉取或导入失败的通道账单数（只算当前生效的一份）。
        pendingDiscrepancyCount:
          type: integer
          minimum: 0
          description: 待处理的对账差异数。
        earliestPendingBillDate:
          description: 待处理差异中最早的账单日；计数为 0 时不返回本键。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        pendingRefundConfirmationCount:
          type: integer
          minimum: 0
          description: 本人数据范围内待人工确认的退款数；无查看待确认退款的权限时不返回本键。
    PayoutFile:
      type: object
      x-parent: true
      description: 出款文件列表的一行；详情在它上面加文件内出款行。
      required:
        - payoutFileId
        - fileFormat
        - executionMode
        - settleCurrency
        - entryCount
        - totalAmount
        - status
        - createdAt
      properties:
        payoutFileId:
          type: string
          minLength: 1
          maxLength: 32
          description: 出款文件。
        fileFormat:
          $ref: '#/components/schemas/PayoutFileFormat'
        fileSequenceNo:
          type: integer
          minimum: 1
          description: 格式要求的文件序号（CIBC EFT 1464）；其余格式不返回本键。
        executionMode:
          description: 出款执行方式：`PLATFORM` 平台出款（运营交给银行、登记结果）· `CHANNEL` 渠道方执行（系统发给渠道方，发送成功即已提交）。
          allOf:
            - $ref: '#/components/schemas/PayoutExecutionMode'
        channel:
          description: 代付的渠道方通道；平台出款不返回本键。
          allOf:
            - $ref: '#/components/schemas/ChannelBrief'
        settleCurrency:
          $ref: '#/components/schemas/Currency'
        entryCount:
          type: integer
          minimum: 0
          description: 文件内出款行数。
        totalAmount:
          description: 文件内出款额合计。
          allOf:
            - $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PayoutFileStatus'
        bankReference:
          type: string
          minLength: 1
          maxLength: 64
          description: 银行 / 渠道方的受理凭据；没填时不返回本键。
        submittedBy:
          description: 登记提交的后台用户；还没提交、或渠道方执行由系统发送时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        submittedAt:
          description: 提交时刻；还没提交时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        acknowledgedAt:
          description: 登记受理或被拒的时刻；还没登记结果时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 整份被拒的原因；只有被拒返回。
        createdAt:
          description: 生成时刻。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    PayoutFileLine:
      type: object
      additionalProperties: false
      description: 出款文件里的一行（一张结算单的一次出款）。
      required:
        - payoutLineId
        - lineNo
        - batchId
        - batchStatus
        - merchant
        - merchantCode
        - payoutAmount
      properties:
        payoutLineId:
          type: string
          minLength: 1
          maxLength: 32
          description: 出款行。
        lineNo:
          type: integer
          minimum: 1
          description: 文件内行号。
        batchId:
          type: string
          minLength: 1
          maxLength: 32
          description: 所属结算单。
        batchStatus:
          description: 所属结算单此时的状态。
          allOf:
            - $ref: '#/components/schemas/SettlementBatchStatus'
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        payoutAmount:
          description: 本行出款额。
          allOf:
            - $ref: '#/components/schemas/Money'
        failureKind:
          description: 失败类别；本行没有失败时不返回本键。
          allOf:
            - $ref: '#/components/schemas/PayoutFailureKind'
        failureCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 银行 / 渠道方的原因码原文；没有时不返回本键。
        failureReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 失败原因；本行没有失败时不返回本键。
        failedOn:
          description: 银行 / 渠道方标注的退票日期；只有退票返回。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
    PayoutFileDetail:
      description: 出款文件详情：列表行的字段加文件内全部出款行。
      allOf:
        - $ref: '#/components/schemas/PayoutFile'
        - type: object
          required:
            - lines
          properties:
            lines:
              type: array
              description: 文件内全部出款行，按行号从先到后。
              items:
                $ref: '#/components/schemas/PayoutFileLine'
    PayoutFileSubmission:
      type: object
      additionalProperties: false
      properties:
        bankReference:
          type: string
          minLength: 1
          maxLength: 64
          description: 银行的受理凭据，可不填、在登记受理结果时补。
    PayoutFileAcknowledgement:
      type: object
      additionalProperties: false
      description: '`rejectionReason` 只在 `REJECTED` 时带且必带；`rejectedLines` 只在 `ACCEPTED` 时可带。'
      required:
        - result
      properties:
        result:
          type: string
          enum:
            - ACCEPTED
            - REJECTED
          description: 受理结果：`ACCEPTED` 整份受理（可剔除若干行）· `REJECTED` 整份被拒。
        bankReference:
          type: string
          minLength: 1
          maxLength: 64
          description: 银行 / 渠道方的受理凭据；提交时已填的可不再填，填了覆盖。
        rejectionReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 整份被拒的原因。
        rejectedLines:
          type: array
          minItems: 1
          description: 受理时被剔除的行。
          items:
            type: object
            additionalProperties: false
            required:
              - payoutLineId
              - failureReason
            properties:
              payoutLineId:
                type: string
                minLength: 1
                maxLength: 32
                description: 被剔除的出款行。
              failureCode:
                type: string
                minLength: 1
                maxLength: 32
                description: 银行 / 渠道方的原因码原文，可不填。
              failureReason:
                type: string
                minLength: 1
                maxLength: 256
                description: 剔除原因。
    PayoutLineReturn:
      type: object
      additionalProperties: false
      required:
        - failureReason
        - failedOn
      properties:
        failureCode:
          type: string
          minLength: 1
          maxLength: 32
          description: 银行 / 渠道方的退票原因码原文，可不填。
        failureReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 退票原因。
        failedOn:
          description: 银行 / 渠道方标注的退票日期。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
    PayoutLineReturned:
      type: object
      additionalProperties: false
      required:
        - payoutLineId
        - batchId
        - merchant
      properties:
        payoutLineId:
          type: string
          minLength: 1
          maxLength: 32
          description: 出款行。
        batchId:
          type: string
          minLength: 1
          maxLength: 32
          description: 出款行所属结算单，此时已退票。
        merchant:
          description: 结算单所属商户；暂停其结算调 `updateMerchantSettlementControls`。
          allOf:
            - $ref: '#/components/schemas/MerchantBrief'
    ChannelSettlement:
      type: object
      additionalProperties: false
      description: 一张通道结算单：通道某个结算批次向平台结算的声明值、核对结果、到账确认与差异说明。各金额都是这张单的结算币种。
      required:
        - channelSettlementId
        - channel
        - settleDate
        - periodStartDate
        - periodEndDate
        - paymentAmount
        - refundAmount
        - feeAmount
        - netAmount
        - awaitingDiscrepancyNote
      properties:
        channelSettlementId:
          type: string
          minLength: 1
          maxLength: 32
          description: 通道结算单。
        channel:
          $ref: '#/components/schemas/ChannelBrief'
        settleDate:
          description: 通道结算日。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        channelBatchNo:
          type: string
          minLength: 1
          maxLength: 64
          description: 通道结算批次号；通道不给批次号时不返回本键。
        periodStartDate:
          description: 覆盖的通道日区间起。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        periodEndDate:
          description: 覆盖的通道日区间止（含）。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        paymentAmount:
          description: 通道声明的收款金额。
          allOf:
            - $ref: '#/components/schemas/Money'
        refundAmount:
          description: 通道声明的退款金额。
          allOf:
            - $ref: '#/components/schemas/Money'
        feeAmount:
          description: 通道声明的净手续费（收取减退回）。
          allOf:
            - $ref: '#/components/schemas/Money'
        netAmount:
          description: 通道声明的本批实际划付净额。
          allOf:
            - $ref: '#/components/schemas/Money'
        unsettledAmount:
          description: 通道声明的未结算金额；通道不提供时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        verifyStatus:
          description: 核对结果；还没核对时不返回本键。
          allOf:
            - $ref: '#/components/schemas/VerifyStatus'
        verifiedAt:
          description: 最近一次核对时刻；还没核对时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        receiptConfirmedAmount:
          description: 确认的到账金额；未确认时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        receiptConfirmedBy:
          description: 确认到账的人；未确认时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        receiptConfirmedAt:
          description: 确认到账的时刻；未确认时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        receiptNote:
          type: string
          minLength: 1
          maxLength: 512
          description: 到账确认备注；没填时不返回本键。
        awaitingDiscrepancyNote:
          type: boolean
          description: 是否有待说明的差异：核对结果不一致，或确认金额与 `netAmount` 不一致，且尚未说明。
        discrepancyNote:
          type: string
          minLength: 1
          maxLength: 512
          description: 差异说明；没说明过时不返回本键。
        discrepancyResolvedBy:
          description: 填差异说明的人；没说明过时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        discrepancyResolvedAt:
          description: 填差异说明的时刻；没说明过时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    ChannelSettlementSubtotal:
      type: object
      additionalProperties: false
      description: 一个通道的小计，金额都是该通道的结算币种。
      required:
        - channel
        - netAmountTotal
        - confirmedCount
        - confirmedAmountTotal
        - unconfirmedCount
      properties:
        channel:
          $ref: '#/components/schemas/ChannelBrief'
        netAmountTotal:
          description: 通道声明净额合计。
          allOf:
            - $ref: '#/components/schemas/Money'
        confirmedCount:
          type: integer
          minimum: 0
          description: 已确认到账的张数。
        confirmedAmountTotal:
          description: 已确认到账的确认金额合计。
          allOf:
            - $ref: '#/components/schemas/Money'
        unconfirmedCount:
          type: integer
          minimum: 0
          description: 未确认到账的张数。
    ChannelSettlementReceiptConfirmation:
      type: object
      additionalProperties: false
      required:
        - confirmedAmount
      properties:
        confirmedAmount:
          description: 确认的到账金额，不为负，币种是这张单的结算币种。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 备注，可不填。
    ChannelRemittance:
      type: object
      additionalProperties: false
      description: 一张渠道方汇回单：渠道方一次汇回的声明、到账、核对结果、冲销与差异说明。各金额同一币种，即该通道的结算币种。
      required:
        - remittanceId
        - channel
        - periodStartDate
        - periodEndDate
        - declaredFeeRetained
        - declaredCostDeducted
        - declaredOtherDeducted
        - netRemittedAmount
        - receivedOn
        - verifyStatus
        - createdAt
      properties:
        remittanceId:
          type: string
          minLength: 1
          maxLength: 32
          description: 汇回单号。
        channel:
          $ref: '#/components/schemas/ChannelBrief'
        periodStartDate:
          description: 覆盖的清算日区间起。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        periodEndDate:
          description: 覆盖的清算日区间止（含）。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        declaredFeeRetained:
          description: 渠道方声明的期内留存平台手续费。
          allOf:
            - $ref: '#/components/schemas/Money'
        declaredCostDeducted:
          description: 渠道方声明扣减的交易成本。
          allOf:
            - $ref: '#/components/schemas/Money'
        declaredOtherDeducted:
          description: 渠道方声明的其他扣减（如按笔出款费）。
          allOf:
            - $ref: '#/components/schemas/Money'
        netRemittedAmount:
          description: 实汇净额；负数表示平台反向付渠道方。
          allOf:
            - $ref: '#/components/schemas/Money'
        receivedOn:
          description: 到账日期。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        bankReference:
          type: string
          minLength: 1
          maxLength: 64
          description: 银行到账参考号；没填时不返回本键。
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 备注；没填时不返回本键。
        verifyStatus:
          description: 核对结果，登记时算定、之后不重算；冲销后的单保留登记时的结果。
          allOf:
            - $ref: '#/components/schemas/VerifyStatus'
        discrepancyNote:
          type: string
          minLength: 1
          maxLength: 512
          description: 差异说明；没说明过时不返回本键。
        discrepancyResolvedBy:
          description: 填差异说明的人；没说明过时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        discrepancyResolvedAt:
          description: 填差异说明的时刻；没说明过时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        reversedBy:
          description: 冲销人；没冲销时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        reversedAt:
          description: 冲销时刻；没冲销时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        createdBy:
          description: 登记人。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        createdAt:
          description: 登记时刻。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    ChannelRemittanceCreate:
      type: object
      additionalProperties: false
      description: 四个金额同一币种，即该通道的结算币种；等式「留存手续费 = 扣减成本 + 其他扣减 + 实汇净额」须成立。
      required:
        - channelId
        - periodStartDate
        - periodEndDate
        - declaredFeeRetained
        - declaredCostDeducted
        - netRemittedAmount
        - receivedOn
      properties:
        channelId:
          description: 渠道方执行出款的通道。
          allOf:
            - $ref: '#/components/schemas/ChannelId'
        periodStartDate:
          description: 覆盖的清算日区间起。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        periodEndDate:
          description: 覆盖的清算日区间止（含）。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        declaredFeeRetained:
          description: 渠道方声明的期内留存平台手续费，不为负。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
        declaredCostDeducted:
          description: 渠道方声明扣减的交易成本，不为负。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
        declaredOtherDeducted:
          description: 渠道方声明的其他扣减，不为负；不传按 0。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
        netRemittedAmount:
          description: 实汇净额；负数表示平台反向付渠道方。
          allOf:
            - $ref: '#/components/schemas/Money'
        receivedOn:
          description: 到账日期。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        bankReference:
          type: string
          minLength: 1
          maxLength: 64
          description: 银行到账参考号，可不填。
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 备注，可不填。
    SettlementReportItem:
      type: object
      additionalProperties: false
      description: 某清算日一个应发清算报告的商户。
      required:
        - merchant
        - merchantCode
        - settlementDate
        - batchCount
        - payoutAmount
      properties:
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        settlementDate:
          $ref: '#/components/schemas/LocalDate'
        batchCount:
          type: integer
          minimum: 1
          description: 该商户当天的结算单张数。
        payoutAmount:
          description: 该商户当天的出款额合计，结算币种。
          allOf:
            - $ref: '#/components/schemas/Money'
    MerchantReconFile:
      type: object
      additionalProperties: false
      description: 一份 T&T 对账文件与推送结果。
      required:
        - reconFileId
        - merchant
        - fileKind
        - periodFrom
        - periodTo
        - deliveryStatus
        - deliveryAttempts
        - createdAt
      properties:
        reconFileId:
          type: string
          minLength: 1
          maxLength: 32
          description: 对账文件。
        merchant:
          description: T&T 主商户。
          allOf:
            - $ref: '#/components/schemas/MerchantBrief'
        fileKind:
          type: string
          enum:
            - IN_STORE
            - ONLINE
          description: 文件种类：`IN_STORE` 线下 · `ONLINE` 线上。
        periodFrom:
          description: 覆盖区间起（含，上一 KA 清算日）。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        periodTo:
          description: 覆盖区间止（含，生成当日的前一日）；下一份从生成当日起。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        deliveryStatus:
          type: string
          enum:
            - PENDING
            - DELIVERING
            - DELIVERED
            - FAILED
          description: 推送状态：`PENDING` 待推送 · `DELIVERING` 推送中 · `DELIVERED` 已送达 · `FAILED` 推送失败（可重发）。
        deliveryAttempts:
          type: integer
          minimum: 0
          description: 已推送次数（含重发）。
        lastAttemptAt:
          description: 最近一次推送时刻；还没推送过时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        lastFailureReason:
          type: string
          minLength: 1
          maxLength: 256
          description: 最近一次推送失败的原因；没失败过时不返回本键。
        deliveredAt:
          description: 最近一次送达时刻；还没送达时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        createdAt:
          description: 生成时刻。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    MerchantSettlementControls:
      type: object
      additionalProperties: false
      required:
        - merchantId
        - settlementPaused
        - minSettleAmount
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        settlementPaused:
          type: boolean
          description: 是否暂停结算。
        minSettleAmount:
          description: 起结门槛，该商户的结算币种。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
    MerchantSettlementControlsUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 只带要改的字段，至少一项。
      properties:
        settlementPaused:
          type: boolean
          description: '`true` 暂停结算 · `false` 恢复结算。'
        minSettleAmount:
          description: 起结门槛，不小于 0，币种是该商户的结算币种。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
    MerchantFundOverview:
      type: object
      additionalProperties: false
      description: 一个商户的资金概览，均为该商户的结算币种；某项从未发生过账时为 0。
      required:
        - merchantId
        - toSettle
        - refundReserve
        - merchantReceivable
        - creditLimit
        - creditAvailable
        - deductibleAmount
        - feeReceivable
        - promotionBalance
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        toSettle:
          description: 待结算：可结算余额减去在途占用，再减去应收商户款；可为负。
          allOf:
            - $ref: '#/components/schemas/Money'
        refundReserve:
          description: 退款准备金余额。
          allOf:
            - $ref: '#/components/schemas/Money'
        merchantReceivable:
          description: 应收商户款（商户欠平台的款项）。
          allOf:
            - $ref: '#/components/schemas/Money'
        creditLimit:
          description: 授信额度；0 = 不授信。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
        creditAvailable:
          description: 剩余授信：授信额度减去已用，不小于 0。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
        deductibleAmount:
          description: 当前可扣额：可结算余额减去其上的在途占用（不小于 0），再加剩余授信；仅作展示，扣款能否足额以提交时为准。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
        feeReceivable:
          description: 应收服务费款（月对账单应收、尚未收到的部分）；多收时为负。
          allOf:
            - $ref: '#/components/schemas/Money'
        promotionBalance:
          description: 营销账户余额。
          allOf:
            - $ref: '#/components/schemas/Money'
    MerchantFundAdjustmentType:
      type: string
      enum:
        - PENALTY
        - COMPENSATION
      description: 调账类型：`PENALTY` 扣款 · `COMPENSATION` 补偿。
