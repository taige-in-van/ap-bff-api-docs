        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantCreditLimitWrite'
            example:
              creditLimit:
                amount: '500000'
                currency: CAD
              totpCode: '123456'
      responses:
        '204':
          description: 已生效
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306004
        - 308651
