    PromotionOperationStatus:
      type: string
      enum:
        - POSTED
        - REJECTED
      description: 结果：`POSTED` 成功 · `REJECTED` 被拒。
    PromotionAccountOperation:
      type: object
      additionalProperties: false
      description: 营销账户的一次返利入账或取现。金额为该商户的结算币种，币种列取 `amount.currency`。
      required:
        - operationId
        - merchant
        - operationType
        - operationStatus
        - amount
        - reason
        - createdAt
      properties:
        operationId:
          type: string
          minLength: 1
          maxLength: 32
          description: 操作标识。
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        operationType:
          $ref: '#/components/schemas/PromotionOperationType'
        operationStatus:
          $ref: '#/components/schemas/PromotionOperationStatus'
        amount:
          description: 入账或取现额。
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
        programCode:
          type: string
          minLength: 1
          maxLength: 64
          description: 返利所属活动码；只对返利入账返回。
        basisAmount:
          description: 返利基数（达标时的累计已清算净额）；只对返利入账返回。
