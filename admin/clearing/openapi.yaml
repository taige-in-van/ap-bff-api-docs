  /merchants/{merchantId}/settlement-reports/{settlementDate}/redeliveries:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
      - $ref: '#/components/parameters/SettlementDatePath'
    post:
      tags:
        - settlement-reports
      operationId: redeliverSettlementReport
      x-required-privilege: clr:report:create
      summary: 补发清算报告
      description: |
        对某商户某清算日再发一封清算报告（含该商户当天全部结算单），可重复；每次补发是一次新的投递，投递结果到运维与审计的通知投递记录查看（`listNotificationDeliveries`，按商户与 `scene = settlement_report.issued`）。

