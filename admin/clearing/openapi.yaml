        - amount
      properties:
        adjustmentId:
          type: string
          minLength: 1
          maxLength: 32
          description: 调账单号。
        adjustmentType:
          $ref: '#/components/schemas/MerchantFundAdjustmentType'
        amount:
          description: 调账额。
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
    MerchantCreditLimitWrite:
      type: object
