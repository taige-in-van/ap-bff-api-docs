    post:
      tags:
        - channel-remittances
      operationId: createChannelRemittance
      x-required-privilege: clr:remittance:manage
      summary: 登记渠道方汇回单
      description: |
        按渠道方的声明登记一次汇回：期内留存的平台手续费 = 扣减的交易成本 + 其他扣减 + 实汇净额（实汇净额为负表示平台反向付渠道方）。登记即记账，并当场给出核对结果，核对只在登记时算一次、之后不重算：

        - 留存手续费比期内该通道渠道方出款结算单已入账的手续费合计，不比结算单上显示的手续费（手续费月结的商户两者不同）。期内按结算单的清算日算，只计已出款或已退回的结算单，处理中的不计。
        - 扣减成本比期内该通道的收款成本减退款成本合计。期内按通道日算；期内有成本为空的通道明细时，这一项判不一致。
        - 两项都一致为 `MATCHED`，否则 `DISCREPANT`。两项用的日期不是同一根轴。同一通道的期间允许重叠，各单各自核对。
        - 不一致的另填差异说明（`resolveChannelRemittanceDiscrepancy`）。

        **什么时候拒绝**（不登记）：

        - `308612` 所选通道不是渠道方执行出款的通道，或币种不是该通道的结算币种。
        - 等式不成立、四个金额的币种不一致、四个金额全为 0、`periodStartDate` 晚于 `periodEndDate`、字段缺或超长 → `400`。
        - 通道不存在 → `404`。

        资金登记，带 `Idempotency-Key`：同键同请求回放首次结果；同键不同请求 → `409`·`908003`；首次请求还在处理 → `409`·`908002`。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelRemittanceCreate'
            example:
              channelId: nihaopay_usd
              periodStartDate: '2026-09-01'
              periodEndDate: '2026-09-30'
              declaredFeeRetained:
                amount: '150000'
                currency: USD
              declaredCostDeducted:
                amount: '60000'
                currency: USD
              declaredOtherDeducted:
                amount: '5000'
                currency: USD
              netRemittedAmount:
                amount: '85000'
                currency: USD
              receivedOn: '2026-10-08'
              bankReference: WIRE20261008001
      responses:
        '201':
          description: 已登记，返回汇回单与核对结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelRemittance'
              example:
                remittanceId: CRM2610081000001
                channel:
                  channelId: nihaopay_usd
                  channelName: NihaoPay USD
                  channelMerchantId: NP10023
                periodStartDate: '2026-09-01'
                periodEndDate: '2026-09-30'
                declaredFeeRetained:
                  amount: '150000'
                  currency: USD
                declaredCostDeducted:
                  amount: '60000'
                  currency: USD
                declaredOtherDeducted:
                  amount: '5000'
                  currency: USD
                netRemittedAmount:
                  amount: '85000'
                  currency: USD
                receivedOn: '2026-10-08'
                bankReference: WIRE20261008001
                verifyStatus: DISCREPANT
                createdBy:
                  userId: usr_a102
                  displayName: Grace Lin
                createdAt: '2026-10-08T17:00:02Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308612
