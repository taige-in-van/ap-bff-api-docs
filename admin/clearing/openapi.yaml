          description: 发生时刻；被拒时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        createdAt:
          description: 创建时刻。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            maxAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额超过平台规定的上限时，本次命令适用的单笔金额上限的**取值与币种**（上限可由运营调整，前端不写死，按本键提示「不能超过 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            orderAmountCeiling:
              $ref: '#/components/schemas/Money'
              description: 发起支付时总应付超过单笔上限时，生效的单笔上限（各层取最严后的值），币种是商户结算币种，可能与页面标价币种不同（页面按本键把数额说出来；拼进 `detail` 前端取不出来）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    WebUrl:
      type: string
      pattern: ^https?://\S+$
      description: http 或 https 绝对地址。平台产出的文件 / 图片 / 付款链接地址与渠道给出的跳转地址共用。
    FileAccessUrl:
      type: object
      additionalProperties: false
      description: 现签的短时效文件访问地址。
      required:
        - url
        - expiresAt
      properties:
        url:
          $ref: '#/components/schemas/WebUrl'
          description: 访问地址，不要持久化、不要分享。
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: 地址到期的时刻。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    UserRef:
      type: object
      additionalProperties: false
      description: 一个平台用户的标识与显示名（列表与记录上展示「谁」）。
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    MerchantBrief:
      type: object
      additionalProperties: false
      description: 一个商户的标识与名称（列表与记录上展示「哪个商户」）。
      required:
        - merchantId
        - merchantName
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantName:
          type: string
          minLength: 1
    PositiveMoney:
      description: 正额金额（amount = 最小币种单位正非零整数字符串、currency 同 Money）；schema 化收口「> 0」。用于「划多少」类输入（资金划转额 / 阈值 / 退款额等），金额方向由具体业务操作表达、不用正负号表示；区别于 Money（可正可负，用于余额 / 分录 / 结算净额 / 回冲等账面值）。
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amount:
              type: string
              pattern: ^[1-9][0-9]*$
    RefundId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台退款号。
    MerchantCode:
      type: string
      minLength: 1
      maxLength: 20
      description: 对外商户码。
    RefundStatus:
      type: string
      enum:
        - REVIEWING
        - CHANNEL_PROCESSING
        - SUCCESS
        - FAILED
        - REJECTED
        - CANCELLED
      description: |
        退款状态：`REVIEWING` 平台审核中 · `CHANNEL_PROCESSING` 已送通道、处理中 · `SUCCESS` 成功 · `FAILED` 失败 · `REJECTED` 审核被拒 · `CANCELLED` 已撤销。

        后四种是终态，只有 `REVIEWING` 能撤销。
    RefundFailureReason:
      type: string
      enum:
        - INSUFFICIENT_FUNDS
        - CHANNEL_REJECTED
        - CHANNEL_UNREACHABLE
        - UNCONFIRMED
      description: |
        退款失败的原因。

        | 取值 | 含义 |
        |---|---|
        | `INSUFFICIENT_FUNDS` | 账户资金不足，退款没有送到通道 |
        | `CHANNEL_REJECTED` | 通道明确拒绝 |
        | `CHANNEL_UNREACHABLE` | 退款请求没能送到通道（连接未建立、请求未发出），重提已用尽 |
        | `UNCONFIRMED` | 通道一直没有明确结果，经运营人工核对确认没有退成 |

        请求已发出而超时、应答丢失、查单查无此单都不算失败，退款留在 `CHANNEL_PROCESSING`，由平台查单与对账收敛。
    SettlementCycleCode:
      type: string
      minLength: 1
      description: 结算周期档位的**稳定取值**（`SettlementCycleOption.code`）。**对客户端不透明**——从候选集里取来原样回传， 不要解析、拼接或据其分支；**不要传展示名**（那是展示文案、不是取值）。 服务端按**提交时点**的候选集校验：不在集内 → 拒绝（错误码见所在面，带 `details` 字段级明细），**不静默回落到候选集第一项**；前端应重取候选集让用户重选。 ⚠️ **你当前选中的取值不会凭空失效**——「打开编辑框却选不中自己现在的档位」「草稿存不回去」这类情形不会发生，无需为此写兜底。
    PaymentMethodFamily:
      type: string
      description: 支付方式族（品牌）。
      enum:
        - wechat
        - alipay
        - unionpay
        - credit_card
    NonNegativeMoney:
      description: 不为负的金额（amount = 最小币种单位非负整数字符串、可为 0，currency 同 Money）；schema 化收口「≥ 0」，区别于 PositiveMoney（> 0）与 Money（可正可负）。
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amount:
              type: string
              pattern: ^[0-9]+$
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
    StatementId:
      type: string
      minLength: 1
      maxLength: 32
      description: 月对账单标识。
    PaymentMethod:
      type: string
      minLength: 1
      maxLength: 64
      description: 支付方式目录标识（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，调用方从候选集取来原样回传，按未知值安全处理。
      examples:
        - wechat_instore
    EntryPoint:
      type: string
      description: 入口：`pos` 终端 · `merchant_app` 商户 App · `merchant_portal` 商户后台 · `open_api` 开放 API · `checkout` 收银台页面（店铺码、账单、Product Link） · `channel_inbound` 通道直接推来的订单 · `plugin_shopify` Shopify 插件 · `plugin_allvalue` AllValue 插件 · `plugin_allvalue_xhs` AllValue 小红书 · `system` 系统发起。
      enum:
        - pos
        - merchant_app
        - merchant_portal
        - open_api
        - checkout
        - channel_inbound
        - plugin_shopify
        - plugin_allvalue
        - plugin_allvalue_xhs
        - system
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    XlsxFile:
      description: Excel 文件（xlsx）
      headers:
        Content-Disposition:
          required: true
          description: '`attachment; filename=...xlsx`（下载；filename 编码 RFC 5987）。'
          schema:
            type: string
        Content-Language:
          required: true
          description: 文件实际用的语言（BCP-47）。
          schema:
            type: string
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
