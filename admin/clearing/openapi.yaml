      required:
        - statementId
        - statementNo
        - merchant
        - statementMonth
        - transactionCount
        - grossAmount
        - refundAmount
        - feeAmount
        - settlementAmount
        - receivableAmount
        - issuedAt
      properties:
        statementId:
          $ref: '#/components/schemas/StatementId'
        statementNo:
          type: string
          minLength: 1
          maxLength: 32
          description: 对账单号。
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        statementMonth:
          $ref: '#/components/schemas/StatementMonth'
        transactionCount:
          type: integer
          minimum: 0
          description: 成交笔数。
        grossAmount:
          description: 销售净额（收款减退款，扣手续费前）。
          allOf:
            - $ref: '#/components/schemas/Money'
        refundAmount:
          description: 退款额。
          allOf:
            - $ref: '#/components/schemas/Money'
        feeAmount:
          description: 手续费（收取减退回）。
          allOf:
            - $ref: '#/components/schemas/Money'
        settlementAmount:
          description: 应结净额。
          allOf:
            - $ref: '#/components/schemas/Money'
        receivableAmount:
          description: 本单应收（另行收取的手续费、额外收费与税）；0 = 本单无应收。
          allOf:
            - $ref: '#/components/schemas/Money'
        issuedAt:
          description: 出具时刻。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    StatementFeeLine:
      type: object
      additionalProperties: false
      description: 手续费明细的一行：一个支付方式 × 受理入口 × 费率的月合计。
      required:
        - paymentMethod
        - acceptanceMode
        - entryPoint
        - feeRate
        - fixedFee
        - transactionCount
        - grossAmount
        - refundAmount
        - feeAmount
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        acceptanceMode:
          type: string
          enum:
            - in_store
            - online
          description: 受理模式：`in_store` 线下 · `online` 线上。
        entryPoint:
          $ref: '#/components/schemas/EntryPoint'
        feeRate:
          type: string
          pattern: ^0\.[0-9]{1,6}$
          description: 比例费率，小数（`0.025000` = 2.5%）。
        fixedFee:
          description: 固定单笔费。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
        transactionCount:
          type: integer
          minimum: 0
          description: 成交笔数。
        grossAmount:
          description: 销售净额。
          allOf:
            - $ref: '#/components/schemas/Money'
        refundAmount:
          description: 退款额。
          allOf:
            - $ref: '#/components/schemas/Money'
        feeAmount:
          description: 手续费。
          allOf:
            - $ref: '#/components/schemas/Money'
    StatementChargeLine:
      type: object
      additionalProperties: false
      description: 额外收费的一行。
      required:
        - chargeType
        - quantity
        - amount
      properties:
        chargeType:
          type: string
          enum:
            - APP_SUBSCRIPTION
          description: 收费类型：`APP_SUBSCRIPTION` 终端 APP 订阅费。
        quantity:
          type: integer
          minimum: 0
          description: 计费数量（APP 订阅费为设备月数）。
        amount:
          description: 收费额。
          allOf:
            - $ref: '#/components/schemas/Money'
    StatementTaxLine:
      type: object
      additionalProperties: false
      description: 税的一行：一个被税组件 × 税种。计税省、税种与税率是出具时记下的值。
      required:
        - taxedComponent
        - taxProvince
        - taxType
        - taxRate
        - taxableAmount
        - taxAmount
      properties:
        taxedComponent:
          type: string
          enum:
            - APP_SUBSCRIPTION
            - FEE
          description: 被税组件：`APP_SUBSCRIPTION` APP 订阅费 · `FEE` 手续费。
        taxProvince:
          type: string
          minLength: 1
          maxLength: 64
          description: 计税省 / 州代码。
        taxType:
          $ref: '#/components/schemas/StatementTaxType'
        taxRate:
          type: string
          pattern: ^0\.[0-9]{1,6}$
          description: 税率，小数（`0.130000` = 13%）。
        taxableAmount:
          description: 税基。
          allOf:
            - $ref: '#/components/schemas/Money'
        taxAmount:
          description: 税额。
          allOf:
            - $ref: '#/components/schemas/Money'
    StatementTaxType:
      type: string
      enum:
        - GST
        - HST
        - PST
        - QST
        - RST
      description: 税种。
    MerchantStatementDetail:
      description: 月度对账单详情：列表行的字段加手续费明细、额外收费与税。
      allOf:
        - $ref: '#/components/schemas/MerchantStatement'
        - type: object
          required:
            - feeLines
            - chargeLines
            - taxLines
          properties:
            feeLines:
              type: array
              description: 手续费明细；本单没有时为空数组。
              items:
                $ref: '#/components/schemas/StatementFeeLine'
            chargeLines:
              type: array
              description: 额外收费；本单没有时为空数组。
              items:
                $ref: '#/components/schemas/StatementChargeLine'
            taxLines:
              type: array
              description: 税；本单没有时为空数组。
              items:
                $ref: '#/components/schemas/StatementTaxLine'
    StatementTaxSummaryItem:
      type: object
      additionalProperties: false
      description: 税行汇总的一行：交易月 × 税种 × 计税省 × 结算币种。
      required:
        - statementMonth
        - taxType
        - taxProvince
        - taxableAmount
        - taxAmount
        - statementCount
      properties:
        statementMonth:
          $ref: '#/components/schemas/StatementMonth'
        taxType:
          $ref: '#/components/schemas/StatementTaxType'
        taxProvince:
          type: string
          minLength: 1
          maxLength: 64
          description: 计税省 / 州代码（出具时记下的值）。
        taxableAmount:
          description: 税基合计；币种即本行的结算币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        taxAmount:
          description: 税额合计。
          allOf:
            - $ref: '#/components/schemas/Money'
        statementCount:
          type: integer
          minimum: 1
          description: 涉及的对账单数。
    StatementListFilter:
      type: object
      additionalProperties: false
      description: 月度对账单导出的筛选，与 `listMerchantStatements` 的同名查询参数同义；`fromMonth` / `toMonth` 必填。
      required:
        - fromMonth
        - toMonth
      properties:
        fromMonth:
          $ref: '#/components/schemas/StatementMonth'
        toMonth:
          $ref: '#/components/schemas/StatementMonth'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
    StatementTaxSummaryFilter:
      type: object
      additionalProperties: false
      description: 税行汇总导出的交易月区间，与 `getStatementTaxSummary` 的同名查询参数同义。
      required:
        - fromMonth
        - toMonth
      properties:
        fromMonth:
          $ref: '#/components/schemas/StatementMonth'
        toMonth:
          $ref: '#/components/schemas/StatementMonth'
    FeeCollectionMethod:
      type: string
      enum:
        - PAD
        - BANK_TRANSFER
        - OTHER
      description: 收款方式：`PAD` 预授权借记 · `BANK_TRANSFER` 商户转账 · `OTHER` 其他。
    FeeCollectionItem:
      type: object
