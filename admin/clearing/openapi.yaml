  /payout-files/{payoutFileId}/acknowledgement:
    parameters:
      - $ref: '#/components/parameters/PayoutFileIdPath'
    post:
      tags:
        - payout-files
      operationId: acknowledgePayoutFile
      x-required-privilege: clr:payout:manage
      summary: 登记出款文件受理结果
      description: |
        对已提交的出款文件登记银行或渠道方的结果，一次登记一个结果：

        - `ACCEPTED` 整份受理：`rejectedLines` 列出受理时被剔除的行（原因必填、原因码可填），这些行所属结算单转出款失败、明细不退回待结算池；其余行所属结算单转已结算。
        - `REJECTED` 整份被拒：`rejectionReason` 必填；全部行记为被拒（钱未出），其所属结算单转出款失败。

        **什么时候拒绝**（文件不变）：

        - `308606` 文件不是已提交状态（未提交，或已登记过结果），重读文件。
        - `308607` `rejectedLines` 里有不属于该文件的行，`details` 指到行。
        - `REJECTED` 缺 `rejectionReason`、`REJECTED` 带了 `rejectedLines`、同一行重复列出、字段超长 → `400`。
        - 出款文件不存在 → `404`。

        资金登记，带 `Idempotency-Key`：同键同请求回放首次结果；同键不同请求 → `409`·`908003`；首次请求还在处理 → `409`·`908002`。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayoutFileAcknowledgement'
            examples:
              acceptedWithRejections:
                summary: 受理并剔除一行
                value:
                  result: ACCEPTED
                  bankReference: RBC-20261102-0001
                  rejectedLines:
                    - payoutLineId: PL261102000017
                      failureCode: '905'
                      failureReason: 账户已关闭
              rejected:
                summary: 整份被拒
                value:
                  result: REJECTED
                  rejectionReason: 文件头发起方号不符
      responses:
        '204':
          description: 已登记
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308606
        - 308607
