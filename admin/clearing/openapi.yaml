  /merchants/{merchantId}/fund-adjustments:
    parameters:
      - $ref: '#/components/parameters/MerchantIdPath'
    post:
      tags:
        - merchant-funds
      operationId: createMerchantFundAdjustment
      x-required-privilege: clr:fund-adjustment:create
      summary: 对商户扣款或补偿
      description: |
        对该商户提交一笔调账，原因必填、商户可见（商户在结算单明细里看到该笔调账与原因）；成功返回调账单号。单人确认、不建审批单；已冻结的商户照常可调账，已关户的商户按不存在处理。不碰退款准备金。

        - **扣款**（`PENALTY`）：可结算余额扣至 0，不足部分记应收商户款，应收不超过授信额度。
        - **补偿**（`COMPENSATION`）：先冲减应收商户款，余下入可结算余额。
        - `amount` 不小于 1 个最小单位、不超过平台设定的单笔调账上限（扣款与补偿共用），币种须是该商户的结算币种。
        - `totpCode` 必带，见总说明「本人动态码确认」。

        **什么时候拒绝**（不建调账）：

        - `306004` 动态码错，原处重输。
        - `308650` 扣款额超出商户可扣范围（可结算余额加剩余授信额度不足）。
        - `308651` 金额超过单笔调账上限，`context.maxAmount` 带当时的上限。
        - `adjustmentType` 不是两种之一、`amount` 币种不是该商户的结算币种、`reason` 缺或超长 → `400`。
        - 商户不存在、已关户或在本人数据范围外 → `404`。

        资金登记，带 `Idempotency-Key`：同键同请求回放首次结果；同键不同请求 → `409`·`908003`；首次请求还在处理 → `409`·`908002`。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantFundAdjustmentCreate'
            examples:
              penalty:
                summary: 扣款
                value:
                  adjustmentType: PENALTY
                  amount:
                    amount: '25000'
                    currency: CAD
                  reason: 10 月违规交易罚款
                  totpCode: '123456'
              compensation:
                summary: 补偿
                value:
                  adjustmentType: COMPENSATION
                  amount:
                    amount: '3000'
                    currency: CAD
                  reason: 10-12 通道故障导致重复扣费，补偿差额
                  totpCode: '123456'
      responses:
        '201':
          description: 已调账，返回调账单号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantFundAdjustment'
              example:
                adjustmentId: SA261107000012
                adjustmentType: PENALTY
                amount:
                  amount: '25000'
                  currency: CAD
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 306004
        - 308650
        - 308651
  /merchants/{merchantId}/credit-limit:
    parameters:
