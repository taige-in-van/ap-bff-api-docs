      type: string
      enum:
        - SCHEDULED
        - ACTIVE
        - ENDED
        - TERMINATED
      description: 活动状态：`SCHEDULED` 未开始 · `ACTIVE` 进行中 · `ENDED` 已结束（过了计划结束日）· `TERMINATED` 已终止（提前终止）。
    PromotionProgram:
      type: object
      additionalProperties: false
      description: 一个返利活动的条款、状态与发放计数。
      required:
        - programId
        - programCode
        - threshold
        - rebateRate
        - windowDays
        - effectiveFrom
        - status
        - enrollmentCount
        - rebateCount
        - rebateAmount
        - createdAt
      properties:
        programId:
          $ref: '#/components/schemas/ProgramId'
        programCode:
          type: string
          minLength: 1
          maxLength: 64
          description: 活动码。
        threshold:
          description: 达标门槛：窗口内累计已清算净额；币种即活动币种。
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
        rebateRate:
          $ref: '#/components/schemas/RebateRate'
        windowDays:
          type: integer
          minimum: 1
          maximum: 3660
          description: 累计窗口天数，自参加的累计起算日起算。
        effectiveFrom:
          description: 活动开始日。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        effectiveTo:
          description: 计划结束日（含）；没设时不返回本键。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        status:
          $ref: '#/components/schemas/PromotionProgramStatus'
        terminatedBy:
          description: 终止人；未终止时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        terminatedAt:
          description: 终止时刻；未终止时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        description:
          type: string
          minLength: 1
          maxLength: 300
          description: 活动说明；没填时不返回本键。
        enrollmentCount:
          type: integer
          minimum: 0
          description: 参加商户数（含已终止的参加）。
        rebateCount:
          type: integer
          minimum: 0
          description: 已发放笔数。
        rebateAmount:
          description: 已发放金额合计，活动币种。
          allOf:
            - $ref: '#/components/schemas/NonNegativeMoney'
        createdAt:
          description: 建立时刻。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    PromotionProgramCreate:
      type: object
      additionalProperties: false
      required:
        - programCode
        - threshold
        - rebateRate
        - windowDays
        - effectiveFrom
      properties:
        programCode:
          type: string
          minLength: 1
          maxLength: 64
          description: 活动码，全平台唯一。
        threshold:
          description: 达标门槛；其币种即活动币种，只有结算币种相同的商户能参加。
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
        rebateRate:
          $ref: '#/components/schemas/RebateRate'
        windowDays:
          type: integer
          minimum: 1
          maximum: 3660
          description: 累计窗口天数。
        effectiveFrom:
          description: 活动开始日，不早于今天。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        effectiveTo:
          description: 计划结束日（含），可不填；填了不早于开始日。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        description:
          type: string
          minLength: 1
          maxLength: 300
          description: 活动说明，可不填。
    PromotionProgramCreated:
      type: object
      additionalProperties: false
      required:
        - programId
      properties:
        programId:
          $ref: '#/components/schemas/ProgramId'
    PromotionEnrollment:
      type: object
      additionalProperties: false
      description: 一个商户对一个返利活动的参加。
      required:
        - programId
        - programCode
        - merchant
        - windowFrom
        - enrolledAt
        - rebated
      properties:
        programId:
          $ref: '#/components/schemas/ProgramId'
        programCode:
          type: string
          minLength: 1
          maxLength: 64
          description: 活动码。
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        windowFrom:
          description: 累计起算日。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        enrolledBy:
          description: 开通人；没有记录时不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        enrolledAt:
          description: 开通时刻。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        terminatedBy:
          description: 终止该商户参加的人；未终止时不返回本键。整个活动被终止不反映在这里，看活动状态。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        terminatedAt:
          description: 终止该商户参加的时刻；未终止时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        rebated:
          type: boolean
          description: 是否已发放。
        rebateAmount:
          description: 发放额；未发放时不返回本键。
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
    PromotionEnrollmentCreate:
      type: object
      additionalProperties: false
      required:
        - merchantId
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        windowFrom:
          description: 累计起算日；不传 = 开通当天。不早于活动开始日、不晚于今天。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
    PromotionEnrollmentCreated:
      type: object
      additionalProperties: false
      required:
        - programId
        - merchantId
        - windowFrom
      properties:
        programId:
          $ref: '#/components/schemas/ProgramId'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        windowFrom:
          description: 累计起算日（不传时即开通当天）。
          allOf:
            - $ref: '#/components/schemas/LocalDate'
    PromotionOperationType:
      type: string
