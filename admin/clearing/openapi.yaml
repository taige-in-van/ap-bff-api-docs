              merchantId: mch_8812
              amount:
                amount: '11300'
                currency: CAD
              collectionMethod: PAD
              receivedOn: '2026-11-05'
              bankReference: PAD20261105017
              statementId: ST2610000123
      responses:
        '201':
          description: 已登记，返回收款登记号
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeeCollectionCreated'
              example:
                collectionId: FC261107000003
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308652
