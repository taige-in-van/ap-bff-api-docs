      x-required-privilege: clr:payout:manage
      summary: 作废出款文件
      description: |
        作废尚未提交的平台出款文件：文件转已作废，所含行所属结算单回到待出款、下次生成出款文件时重新装入。已提交及之后的文件不能作废；渠道方执行的文件不能作废，发送失败时到通知投递记录人工重投，重投发送成功即转已提交。

        **什么时候拒绝**：

        - `308606` 文件不是已生成的平台出款文件（已提交及之后，或渠道方执行的文件），重读文件。
        - 出款文件不存在 → `404`。

        带状态前置，不挂幂等键。记入操作审计。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已作废
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308606
