              threshold:
                amount: '10000000'
                currency: CAD
              rebateRate: '0.001'
              windowDays: 365
              effectiveFrom: '2026-12-01'
              effectiveTo: '2027-11-30'
              description: 2027 年度交易量返利
      responses:
        '201':
          description: 已建立，返回活动标识
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromotionProgramCreated'
              example:
                programId: PP261107000001
        default:
