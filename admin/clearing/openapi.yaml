    patch:
      tags:
        - settlement-controls
      operationId: updateMerchantSettlementControls
      x-required-privilege: clr:settlement-terms:edit
      summary: 暂停 / 恢复结算、改起结门槛
      description: |
        只提交要改的字段，没带的保持原样，至少带一项。即时生效：

        - `settlementPaused`：`true` 暂停该商户结算，此后清算日不出款、明细留在待结算池，不影响入账与余额；`false` 恢复，下一次出款照常。商户详情的治理档位设「高风险」/ 回「正常」也调本接口（分别带 `true` / `false`）。
        - `minSettleAmount`：起结门槛，不小于 0、币种是该商户的结算币种；此后清算日本批结算金额大于 0 但低于它的不出款，明细留池累积。

