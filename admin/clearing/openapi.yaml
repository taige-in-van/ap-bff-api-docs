        冻结商户停出款（归集与建批照常）由商户状态决定，不反映在 `settlementPaused` 上。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSettlementControls'
              example:
                merchantId: mch_8812
                settlementPaused: false
