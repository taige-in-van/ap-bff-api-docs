openapi: 3.1.0
info:
  title: 管理后台 运维与审计 — 前端契约面
  version: 2.1.0
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的运维与审计契约：操作审计查询（`/audit-events`）、通知投递失败查询与重投（`/notification-deliveries`）、商户回调与平台回写的投递查询与重投（`/outbound-deliveries`）、批任务面板（`/batch-jobs`）。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 每个接口要的权限点见 `x-required-privilege`。
    - 本面只有查询与命令，没有删除或清空操作记录的接口。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: audit-events
    x-displayName: 操作审计
    description: 全平台人的敏感操作记录，只读。
  - name: notification-deliveries
    x-displayName: 通知投递
    description: 邮件、微信模板消息的投递记录；发送失败的可人工重投。
  - name: outbound-deliveries
    x-displayName: 对外投递
    description: 商户异步通知（Webhook）与电商平台回写的投递任务及每次尝试；进了死信的可人工重投。
  - name: batch-jobs
    x-displayName: 批任务
    description: 各服务登记的批任务及其执行；可触发、重启、取消。
paths:
  /audit-events:
    get:
      tags:
        - audit-events
      operationId: listAuditEvents
      x-required-privilege: opscon:audit:view
      summary: 操作审计列表（筛选、分页，发生时间从新到旧）
      description: |
        全平台的操作记录，固定按发生时间从新到旧，可叠加下列筛选。全局横查与商户详情的「本商户操作记录」页签都用本接口，页签固定带 `merchantId`，同条件下两处结果相同。

        **记了什么**：人在各端界面上做的敏感操作。权限检查被拒的尝试没有发生操作，不在其中；后台程序自己的动作也不在其中。

        **看得到哪些**：与商户相关的记录（该商户用户的操作、代登期间的操作、后台用户对该商户的操作）只返回本人数据可见范围内的商户；不涉及商户的记录（平台参数、公告、后台账号等）有本权限点即可看到。按一个不在范围内的商户筛选，结果为空。
      parameters:
        - name: from
          in: query
          required: true
          description: 发生日期范围起（含当日）；与 `to` 都要给。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: true
          description: 发生日期范围止（含当日）。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: merchantId
          in: query
          required: false
          description: 按商户：返回该商户用户的操作、代登期间的操作、后台用户对该商户的操作。
          schema:
            $ref: '#/components/schemas/MerchantId'
        - name: actorUserId
          in: query
          required: false
          description: 按操作人：只返回该用户本人做的操作（代登期间的操作按被代的商户用户算）。
          schema:
            $ref: '#/components/schemas/UserId'
        - name: targetType
          in: query
          required: false
          description: 按操作对象的类型，取行里的 `targetType`。
          schema:
            $ref: '#/components/schemas/AuditTargetType'
        - name: targetRef
          in: query
          required: false
          description: 按操作对象的标识，整串相等；与 `targetType` 一起传。
          schema:
            $ref: '#/components/schemas/AuditTargetRef'
        - name: action
          in: query
          required: false
          description: 按动作码，取行里的 `action`。
          schema:
            $ref: '#/components/schemas/AuditAction'
        - name: result
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AuditResult'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEventSummary'
              example:
                total: 2
                data:
                  - eventId: 6f1c2a9e-3b7d-4e21-9a0c-5d8e7f6a1b2c
                    occurredAt: '2026-10-15T06:00:00Z'
                    actorType: admin_user
                    actor:
                      userId: usr_a91
                      displayName: Alice Ops
                    action: published
                    targetType: announcement
                    targetRef: ann_02h9
                    result: SUCCEEDED
                    stateBefore: DRAFT
                    stateAfter: PUBLISHED
                    clientIp: 203.0.113.10
                  - eventId: 0b9d8c7e-1a2b-4c3d-8e9f-a0b1c2d3e4f5
                    occurredAt: '2026-10-14T21:12:00Z'
                    actorType: merchant_user
                    actor:
                      userId: usr_m33
                      displayName: Jane Merchant
                    impersonator:
                      userId: usr_b07
                      displayName: Bob Ops
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    action: created
                    targetType: operator
                    targetRef: usr_m48
                    result: SUCCEEDED
                    clientIp: 198.51.100.4
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /audit-events/{eventId}:
    get:
      tags:
        - audit-events
      operationId: getAuditEvent
      x-required-privilege: opscon:audit:view
      summary: 一条操作记录的详情（含改动内容）
      description: |
        列表行的字段加改动内容（`changes`）。看得到哪些同 `listAuditEvents`：不在本人数据可见范围内的商户的记录 → `404`。
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AuditEventId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEvent'
              example:
                eventId: 3c4d5e6f-7a8b-4c9d-8e0f-1a2b3c4d5e6f
                occurredAt: '2026-10-15T05:40:00Z'
                actorType: admin_user
                actor:
                  userId: usr_a91
                  displayName: Alice Ops
                action: configuration_updated
                targetType: configuration
                targetRef: order.expiry.minutes
                result: SUCCEEDED
                clientIp: 203.0.113.10
                changes:
                  before:
                    numberValue: 5
                  after:
                    numberValue: 30
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /notification-deliveries:
    get:
      tags:
        - notification-deliveries
      operationId: listNotificationDeliveries
      x-required-privilege: opscon:notification:view
      summary: 通知投递记录列表（筛选、分页，建立时间从新到旧）
      description: |
        邮件与微信模板消息的投递记录，固定按建立时间从新到旧。查发送失败的，按 `status=FAILED` 筛选。

        带商户的记录只返回本人数据可见范围内的商户；不带商户的（发给付款人的、入驻申请人的、后台用户本人的、运营内部地址的）有本权限点即可看到。

        每行的 `redeliverable` 表示此刻能否对它重投，页面据此决定是否给出重投入口。
      parameters:
        - name: from
          in: query
          required: true
          description: 建立日期范围起（含当日）；与 `to` 都要给。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: true
          description: 建立日期范围止（含当日）。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: merchantId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MerchantId'
        - name: channel
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationChannel'
        - name: scene
          in: query
          required: false
          description: 按通知场景码，取行里的 `scene`。
          schema:
            $ref: '#/components/schemas/NotificationScene'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/NotificationDeliveryStatus'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationDelivery'
              example:
                total: 1
                data:
                  - deliveryId: ntd_7c21
                    createdAt: '2026-10-15T01:20:00Z'
                    scene: statement.issued
                    channel: email
                    recipientType: merchant
                    recipientAddress: finance@maplecoffee.example
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    status: FAILED
                    attempts: 5
                    failureReason: 550 mailbox unavailable
                    redeliverable: true
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /notification-deliveries/{deliveryId}/redeliveries:
    post:
      tags:
        - notification-deliveries
      operationId: redeliverNotification
      x-required-privilege: opscon:notification:create
      summary: 重投一条发送失败的通知
      description: |
        对一条发送失败的记录重投：产生一条新的投递记录并返回它，新记录的 `redeliveryOfId` 指回原记录；原记录保持发送失败不变，此后带上 `redeliveredTo` 指向新记录。每次重投留下一条操作记录。

        重投产生的记录连成一条链，只有链上最新一条能重投：新记录再发送失败，就对新记录重投，次数不限。

        新记录发出前按当前的模板与接收方重新校验；仍不满足的（如模板还没修好），新记录同样落发送失败、不外发，原因见它的 `failureReason`。发送结果随后更新，重新读取列表可见。

        **什么时候拒绝**：

        - 这条记录不是发送失败、已经被重投过（不是链上最新一条，含他人同时发起的），或承载一次性凭据（验证码、一次性链接：随通知事件投递、不供人工重投，由用户重新发起）→ `409`·`308105`，不产生新记录。重读列表；要再重投，对链上最新一条操作。
        - 记录不存在，或不在本人数据可见范围内 → `404`。

        **幂等**：`Idempotency-Key`，作用域 = 键 + 路径里的记录。同键重发返回首次产生的新记录；同键用于另一条记录 → `409`·`908003`；首次请求还在处理 → `409`·`908002`，稍后同键重发。
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/NotificationDeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: 重投产生的新投递记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationDelivery'
              example:
                deliveryId: ntd_9a40
                createdAt: '2026-10-15T08:02:00Z'
                scene: statement.issued
                channel: email
                recipientType: merchant
                recipientAddress: finance@maplecoffee.example
                merchant:
                  merchantId: mch_8812
                  merchantName: Maple Coffee
                status: QUEUED
                attempts: 0
                redeliveryOfId: ntd_7c21
                redeliverable: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308105
  /notification-deliveries/redeliveries:
    post:
      tags:
        - notification-deliveries
      operationId: redeliverFailedNotifications
      x-required-privilege: opscon:notification:create
      summary: 按筛选条件批量重投发送失败的通知
      description: |
        对命中筛选条件、发送失败且是链上最新一条的记录逐条重投，每条各产生一条新的投递记录，规则同 `redeliverNotification`；命中集合里不能重投的记录跳过、不受影响。返回本次产生的新记录条数。整批留下一条操作记录。

        筛选条件与 `listNotificationDeliveries` 相同、状态固定为发送失败；日期范围同列表，两端都要给。数据范围同列表。

        **幂等**：`Idempotency-Key`。同键同请求体重发返回首次结果、不再重投；同键改请求体 → `409`·`908003`；首次请求还在处理 → `409`·`908002`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRedeliveryFilter'
            example:
              from: '2026-10-14'
              to: '2026-10-15'
              merchantId: mch_8812
              channel: email
      responses:
        '200':
          description: 本次产生的新投递记录条数
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - redeliveredCount
                properties:
                  redeliveredCount:
                    type: integer
                    minimum: 0
              example:
                redeliveredCount: 12
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /outbound-deliveries:
    get:
      tags:
        - outbound-deliveries
      operationId: listOutboundDeliveries
      x-required-privilege: opscon:delivery:view
      summary: 对外投递任务列表（筛选、分页，建立时间从新到旧）
      description: |
        商户异步通知与电商平台回写的投递任务，固定按建立时间从新到旧。只返回本人数据可见范围内的商户的任务。
      parameters:
        - name: merchantId
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MerchantId'
        - name: from
          in: query
          required: true
          description: 建立日期范围起（含当日）；与 `to` 都要给。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: true
          description: 建立日期范围止（含当日）。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/OutboundDeliveryStatus'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OutboundDeliverySummary'
              example:
                total: 1
                data:
                  - deliveryId: obd_51f0
                    createdAt: '2026-10-13T17:45:00Z'
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    eventType: order.paid
                    sourceId: ord_20261013_1188
                    wireProfile: open_api_v2_payment
                    targetUrl: https://shop.maplecoffee.example/notify
                    status: DEAD_LETTER
                    attemptCount: 9
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /outbound-deliveries/{deliveryId}:
    get:
      tags:
        - outbound-deliveries
      operationId: getOutboundDelivery
      x-required-privilege: opscon:delivery:view
      summary: 对外投递任务详情（含每次尝试）
      description: 任务字段加全部尝试，尝试按次序从先到后。任务不存在或不在本人数据可见范围内 → `404`。
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OutboundDeliveryId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundDelivery'
              example:
                deliveryId: obd_51f0
                createdAt: '2026-10-13T17:45:00Z'
                merchant:
                  merchantId: mch_8812
                  merchantName: Maple Coffee
                eventType: order.paid
                sourceId: ord_20261013_1188
                wireProfile: open_api_v2_payment
                targetUrl: https://shop.maplecoffee.example/notify
                status: DEAD_LETTER
                attemptCount: 2
                attempts:
                  - attemptNo: 1
                    trigger: scheduled
                    attemptedAt: '2026-10-13T17:45:01Z'
                    durationMs: 10000
                    failureClass: timeout
                  - attemptNo: 2
                    trigger: scheduled
                    attemptedAt: '2026-10-13T17:50:01Z'
                    httpStatus: 500
                    durationMs: 230
                    failureClass: http_error
                    responseExcerpt: Internal Server Error
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /outbound-deliveries/{deliveryId}/redeliveries:
    post:
      tags:
        - outbound-deliveries
      operationId: redeliverOutboundDelivery
      x-required-privilege: opscon:delivery:create
      summary: 对死信任务人工重投一次
      description: |
        在原任务上发起一次新的尝试，标为人工触发，不另建任务。报文内容与签名方式与自动尝试相同，商户按事件身份去重。目标地址按与自动尝试相同的规则判定，命中拒投规则的不发出请求，这次尝试记为失败。每次人工重投留下一条操作记录。

        受理后返回任务当前状态；尝试结果随后更新，重新读取详情可见。这次尝试成功则任务变为已送达，失败则回到死信。

        **什么时候拒绝**：

        - 任务不在死信（已送达、仍在自动重试中，或人工重投正在进行）→ `409`·`308106`，不新增尝试。
        - 任务不存在，或不在本人数据可见范围内 → `404`。

        **幂等**：`Idempotency-Key`，作用域 = 键 + 路径里的任务。同键重发返回首次受理的结果；同键用于另一个任务 → `409`·`908003`；首次请求还在处理 → `409`·`908002`。
      parameters:
        - name: deliveryId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OutboundDeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已受理，返回任务当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboundDeliverySummary'
              example:
                deliveryId: obd_51f0
                createdAt: '2026-10-13T17:45:00Z'
                merchant:
                  merchantId: mch_8812
                  merchantName: Maple Coffee
                eventType: order.paid
                sourceId: ord_20261013_1188
                wireProfile: open_api_v2_payment
                targetUrl: https://shop.maplecoffee.example/notify
                status: DELIVERING
                attemptCount: 9
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308106
  /batch-jobs:
    get:
      tags:
        - batch-jobs
      operationId: listBatchJobs
      x-required-privilege: opscon:batch:view
      summary: 批任务列表（各带最近一次执行）
      description: |
        各服务登记的全部批任务，每个带最近一次执行；从没执行过的不带 `latestExecution`。执行状态以所属服务为准，重新读取即为最新。

        批任务的集合、展示名与所属服务取自管理后台在代码里声明的任务目录，从没执行过的任务也在列；最近一次执行取自所属服务。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    description: 顺序即展示顺序。
                    items:
                      $ref: '#/components/schemas/BatchJob'
              example:
                items:
                  - jobKey: core.settlement.daily
                    displayName: 日终清算
                    latestExecution:
                      executionId: '40213'
                      status: FAILED
                      restartable: true
                      startedAt: '2026-10-15T07:00:00Z'
                      endedAt: '2026-10-15T07:12:40Z'
                      failureReason: Step settle-batch failed at chunk 37
                  - jobKey: admin.stats.refresh
                    displayName: 统计刷新
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /batch-jobs/{jobKey}/executions:
    parameters:
      - name: jobKey
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BatchJobKey'
    get:
      tags:
        - batch-jobs
      operationId: listBatchJobExecutions
      x-required-privilege: opscon:batch:view
      summary: 某批任务的执行历史（分页，开始时间从新到旧）
      description: 固定按开始时间从新到旧。批任务不存在 → `404`。
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BatchExecution'
              example:
                total: 2
                data:
                  - executionId: '40213'
                    status: FAILED
                    restartable: true
                    startedAt: '2026-10-15T07:00:00Z'
                    endedAt: '2026-10-15T07:12:40Z'
                    failureReason: Step settle-batch failed at chunk 37
                  - executionId: '40188'
                    status: COMPLETED
                    restartable: false
                    startedAt: '2026-10-14T07:00:00Z'
                    endedAt: '2026-10-14T07:20:05Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - batch-jobs
      operationId: createBatchJobExecution
      x-required-privilege: opscon:batch:manage
      summary: 触发一次执行
      description: |
        让所属服务立即执行一次该批任务。受理后返回这次执行（通常是启动中）；执行进度以所属服务为准，重新读取可见。每次触发留下一条操作记录。

        **什么时候拒绝**：

        - 该任务已有一次执行在进行，所属服务不再启动新的 → `409`·`308108`。
        - 批任务不存在 → `404`。

        **幂等**：`Idempotency-Key`，作用域 = 键 + 路径里的批任务。同键重发返回首次受理的执行、不再触发；同键用于另一个批任务 → `409`·`908003`；首次请求还在处理 → `409`·`908002`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已受理，返回这次执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExecution'
              example:
                executionId: '40230'
                status: STARTING
                restartable: false
                startedAt: '2026-10-15T08:30:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308108
  /batch-jobs/{jobKey}/executions/{executionId}/restarts:
    parameters:
      - name: jobKey
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BatchJobKey'
      - name: executionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BatchExecutionId'
    post:
      tags:
        - batch-jobs
      operationId: restartBatchJobExecution
      x-required-privilege: opscon:batch:manage
      summary: 重启一次失败或已停止的执行
      description: |
        让所属服务从这次执行上次停下的地方继续跑，产生一次新的执行。受理后返回这次新执行（通常启动中）；原执行保持原状态；执行进度以所属服务为准，重新读取可见。每次重启留下一条操作记录。

        **什么时候拒绝**：

        - 这次执行不是失败或已停止（如已成功、仍在执行），或已有更晚的执行在续跑它，或它的失败是由所属服务的已放弃 / 状态不明归并来的（见 `BatchExecutionStatus`），所属服务不受理 → `409`·`308107`，状态不变。
        - 批任务或执行不存在 → `404`。

        **幂等**：`Idempotency-Key`，作用域 = 键 + 路径里的执行。同键重发返回首次受理的结果；同键用于另一次执行 → `409`·`908003`；首次请求还在处理 → `409`·`908002`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已受理，返回续跑产生的新执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExecution'
              example:
                executionId: '40231'
                status: STARTING
                restartable: false
                startedAt: '2026-10-15T08:35:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308107
  /batch-jobs/{jobKey}/executions/{executionId}/cancellation:
    parameters:
      - name: jobKey
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BatchJobKey'
      - name: executionId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/BatchExecutionId'
    post:
      tags:
        - batch-jobs
      operationId: cancelBatchJobExecution
      x-required-privilege: opscon:batch:manage
      summary: 取消一次进行中的执行
      description: |
        让所属服务停下这次执行。受理后返回这次执行（停止中）；停下后为已停止，重新读取可见。每次取消留下一条操作记录。

        **什么时候拒绝**：

        - 这次执行不在启动中、执行中或停止中，所属服务不受理 → `409`·`308107`，状态不变。
        - 批任务或执行不存在 → `404`。

        对停止中的执行再提交照常受理、什么都不变。

        **幂等**：`Idempotency-Key`，作用域 = 键 + 路径里的执行。同键重发返回首次受理的结果；同键用于另一次执行 → `409`·`908003`；首次请求还在处理 → `409`·`908002`。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已受理，返回这次执行
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchExecution'
              example:
                executionId: '40230'
                status: STOPPING
                restartable: false
                startedAt: '2026-10-15T08:30:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308107
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  schemas:
    AuditEventId:
      type: string
      minLength: 36
      maxLength: 36
      description: 操作记录标识（UUID）。
    AuditTargetType:
      type: string
      minLength: 1
      maxLength: 64
      description: 操作对象类型码（如 `announcement`、`refund`、`configuration`），开放集合；展示名由前端按码取，查不到时显示码。
    AuditTargetRef:
      type: string
      minLength: 1
      maxLength: 128
      description: 操作对象的标识（业务单号、参数标识等）。
    AuditAction:
      type: string
      minLength: 1
      maxLength: 128
      description: 动作码：取产生该记录的操作所声明的码（如 `created`、`configuration_updated`），对象是什么看同一行的 `targetType`，同一动作码可出现在不同对象类型上。开放集合；展示名由前端按码取，查不到时显示码。
    AuditResult:
      type: string
      enum:
        - SUCCEEDED
        - REJECTED
        - FAILED
      description: '`SUCCEEDED` 成功 / `REJECTED` 被业务规则拒绝 / `FAILED` 执行失败。'
    AuditEventSummary:
      type: object
      x-parent: true
      required:
        - eventId
        - occurredAt
        - actorType
        - actor
        - action
        - targetType
        - targetRef
        - result
      properties:
        eventId:
          $ref: '#/components/schemas/AuditEventId'
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        actorType:
          type: string
          enum:
            - merchant_user
            - admin_user
          description: 操作主体：`merchant_user` 商户用户 / `admin_user` 后台用户。
        actor:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 操作人；代登期间的操作为被代的商户用户。
        impersonator:
          allOf:
            - $ref: '#/components/schemas/UserRef'
          description: 发起代登的后台用户。只有代登期间的操作返回。
        merchant:
          allOf:
            - $ref: '#/components/schemas/MerchantBrief'
          description: 相关商户：商户用户的操作为其所在商户，后台用户对商户的操作为被操作的商户。不涉及商户时不返回。
        action:
          $ref: '#/components/schemas/AuditAction'
        targetType:
          $ref: '#/components/schemas/AuditTargetType'
        targetRef:
          $ref: '#/components/schemas/AuditTargetRef'
        result:
          $ref: '#/components/schemas/AuditResult'
        stateBefore:
          type: string
          maxLength: 64
          description: 状态迁移前的状态。不是状态迁移时不返回。
        stateAfter:
          type: string
          maxLength: 64
          description: 状态迁移后的状态。不是状态迁移时不返回。
        clientIp:
          type: string
          maxLength: 45
          description: 发起端来源 IP。取不到时不返回。
    AuditEvent:
      description: 列表行的字段加改动内容。
      allOf:
        - $ref: '#/components/schemas/AuditEventSummary'
        - type: object
          required:
            - changes
          properties:
            changes:
              type: object
              additionalProperties: true
              description: 改动内容（改前改后的值、决定备注等），键随动作而定，页面按键值展示。不含密码、密钥等秘密。
    NotificationDeliveryId:
      type: string
      minLength: 1
      maxLength: 32
      description: 通知投递记录标识。
    NotificationChannel:
      type: string
      enum:
        - email
        - wechat
        - wecom
      description: '`email` 邮件 / `wechat` 微信模板消息 / `wecom` 企业微信群机器人（运营内部通知）。'
    NotificationScene:
      type: string
      minLength: 1
      maxLength: 128
      description: 通知场景码（如 `statement.issued`），开放集合；展示名由前端按码取，查不到时显示码。
    NotificationDeliveryStatus:
      type: string
      enum:
        - QUEUED
        - SENT
        - FAILED
        - SUPPRESSED
      description: '`QUEUED` 待发送（含自动重试中）/ `SENT` 已发送 / `FAILED` 发送失败（自动重试已用尽，可人工重投）/ `SUPPRESSED` 按规则不发（如商户关了该通道）。'
    NotificationDelivery:
      type: object
      additionalProperties: false
      required:
        - deliveryId
        - createdAt
        - scene
        - channel
        - recipientType
        - recipientAddress
        - status
        - attempts
        - redeliverable
      properties:
        deliveryId:
          $ref: '#/components/schemas/NotificationDeliveryId'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        scene:
          $ref: '#/components/schemas/NotificationScene'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        recipientType:
          type: string
          enum:
            - merchant
            - merchant_user
            - admin_user
            - applicant
            - payer
            - email_address
            - internal
          description: 收件人类型：`merchant` 商户接收方 / `merchant_user` 商户用户本人 / `admin_user` 后台用户本人 / `applicant` 入驻申请人 / `payer` 付款人 / `email_address` 仅凭待验证邮箱地址投递 / `internal` 运营内部地址。
        recipientAddress:
          type: string
          minLength: 1
          maxLength: 256
          description: 收件地址：邮箱、微信接收方标识，或企业微信群机器人地址。
        merchant:
          allOf:
            - $ref: '#/components/schemas/MerchantBrief'
          description: 归属商户。没有商户上下文时不返回。
        status:
          $ref: '#/components/schemas/NotificationDeliveryStatus'
        attempts:
          type: integer
          minimum: 0
          description: 已尝试发送的次数。
        failureReason:
          type: string
          description: 最近一次失败或不发的原因，服务商返回的原文、不本地化。没有时不返回。
        sentAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 发送成功的时刻。未发送成功时不返回。
        redeliveryOfId:
          allOf:
            - $ref: '#/components/schemas/NotificationDeliveryId'
          description: 本记录由重投产生时返回，指向被重投的原记录。
        redeliveredTo:
          allOf:
            - $ref: '#/components/schemas/NotificationDeliveryId'
          description: 这条发送失败的记录已被重投时返回，指向重投产生的新记录；有它就不是链上最新一条，不能再对本条重投。
        redeliverable:
          type: boolean
          description: 此刻能否对本条重投：链上最新一条、发送失败、且不承载一次性凭据（验证码、一次性链接）时为 `true`。为 `false` 时 `redeliverNotification` 会被拒。
    NotificationRedeliveryFilter:
      type: object
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 建立日期范围起（含当日）；与 `to` 都要给。
        to:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 建立日期范围止（含当日）；`to < from` → `400`。
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        channel:
          $ref: '#/components/schemas/NotificationChannel'
        scene:
          $ref: '#/components/schemas/NotificationScene'
    OutboundDeliveryId:
      type: string
      minLength: 1
      maxLength: 32
      description: 对外投递任务标识。
    OutboundDeliveryStatus:
      type: string
      enum:
        - PENDING
        - DELIVERING
        - RETRYING
        - DELIVERED
        - DEAD_LETTER
      description: '`PENDING` 待投递 / `DELIVERING` 投递中 / `RETRYING` 自动重试中 / `DELIVERED` 已送达 / `DEAD_LETTER` 死信（自动重试已结束，可人工重投）。'
    OutboundDeliverySummary:
      type: object
      x-parent: true
      required:
        - deliveryId
        - createdAt
        - merchant
        - eventType
        - sourceId
        - wireProfile
        - targetUrl
        - status
        - attemptCount
      properties:
        deliveryId:
          $ref: '#/components/schemas/OutboundDeliveryId'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
        eventType:
          type: string
          minLength: 1
          maxLength: 128
          description: 来源事件码（如 `order.paid`、`refund.posted`），开放集合；展示名由前端按码取，查不到时显示码。
        sourceId:
          type: string
          minLength: 1
          maxLength: 64
          description: 来源业务单号：订单号、退款单号、协议号或电商平台退款会话号。
        wireProfile:
          type: string
          enum:
            - gateway_v1_payment
            - gateway_v1_refund
            - gateway_v1_mandate
            - open_api_v2_payment
            - open_api_v2_refund
            - allvalue_payment
            - allvalue_refund
            - shopify_payment_session
            - shopify_refund_session
          description: 报文形态：1.0 网关回调、2.0 开放接口回调、AllValue 回写、Shopify 回写，各分支付 / 退款（1.0 另有委托代扣协议）。
        targetUrl:
          type: string
          maxLength: 512
          pattern: ^https?://\S+$
          description: 投递目标地址（建任务时的快照）。
        status:
          $ref: '#/components/schemas/OutboundDeliveryStatus'
        attemptCount:
          type: integer
          minimum: 0
          description: 已尝试次数（自动与人工合计）。
        nextAttemptAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 下次自动尝试的时刻。不再自动尝试时不返回。
        deliveredAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 送达时刻。未送达时不返回。
    OutboundDeliveryAttempt:
      type: object
      additionalProperties: false
      required:
        - attemptNo
        - trigger
        - attemptedAt
      properties:
        attemptNo:
          type: integer
          minimum: 1
          description: 第几次尝试。
        trigger:
          type: string
          enum:
            - scheduled
            - manual
          description: '`scheduled` 自动 / `manual` 人工重投。'
        attemptedAt:
          $ref: '#/components/schemas/Timestamp'
        httpStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: 对方应答的 HTTP 状态码。没收到应答时不返回。
        durationMs:
          type: integer
          minimum: 0
          description: 请求耗时（毫秒）。没发出请求时不返回。
        failureClass:
          type: string
          enum:
            - target_blocked
            - target_rejected
            - connect_failed
            - timeout
            - tls_failed
            - http_error
            - ack_mismatch
            - signing_unavailable
          description: |
            失败类别，成功的尝试不返回：

            - `target_blocked` 目标地址命中拒投规则，未发出
            - `target_rejected` 目标地址不合规，未发出
            - `connect_failed` 连不上
            - `timeout` 超时
            - `tls_failed` TLS 握手失败
            - `http_error` 对方回了非成功状态
            - `ack_mismatch` 对方应答不是约定的成功应答
            - `signing_unavailable` 签名密钥不可用，未发出
        responseExcerpt:
          type: string
          maxLength: 1024
          description: 对方应答体的开头一段。没有时不返回。
    OutboundDelivery:
      description: 任务字段加全部尝试。
      allOf:
        - $ref: '#/components/schemas/OutboundDeliverySummary'
        - type: object
          required:
            - attempts
          properties:
            attempts:
              type: array
              description: 全部尝试，按次序从先到后。
              items:
                $ref: '#/components/schemas/OutboundDeliveryAttempt'
    BatchJobKey:
      type: string
      minLength: 1
      maxLength: 128
      description: 批任务标识（所属服务登记的码）。
    BatchExecutionId:
      type: string
      minLength: 1
      maxLength: 64
      description: 执行标识（同一批任务内唯一）。
    BatchExecutionStatus:
      type: string
      enum:
        - STARTING
        - RUNNING
        - STOPPING
        - STOPPED
        - COMPLETED
        - FAILED
      description: |
        执行状态：

        - `STARTING` 启动中
        - `RUNNING` 执行中
        - `STOPPING` 停止中
        - `STOPPED` 已停止（被取消）
        - `COMPLETED` 已成功
        - `FAILED` 失败

        由所属服务的执行状态归并而来：所属服务的执行中（`STARTED`）记为 `RUNNING`；已放弃（`ABANDONED`）与状态不明（`UNKNOWN`）都记为 `FAILED`；其余同名照搬。
    BatchExecution:
      type: object
      additionalProperties: false
      required:
        - executionId
        - status
        - restartable
      properties:
        executionId:
          $ref: '#/components/schemas/BatchExecutionId'
        status:
          $ref: '#/components/schemas/BatchExecutionStatus'
        restartable:
          type: boolean
          description: 能否重启：所属服务的执行状态为失败或已停止、且还没被续跑过时为真；已被续跑过的为假，由已放弃、状态不明归并成 `FAILED` 的为假，其余状态都为假。
        startedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 开始时刻。还没开始时不返回。
        endedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 结束时刻。未结束时不返回。
        failureReason:
          type: string
          description: 失败信息，所属服务给出的原文、不本地化。没有时不返回。
    BatchJob:
      type: object
      additionalProperties: false
      required:
        - jobKey
        - displayName
      properties:
        jobKey:
          $ref: '#/components/schemas/BatchJobKey'
        displayName:
          type: string
          minLength: 1
          description: 任务目录里的展示名。
        latestExecution:
          allOf:
            - $ref: '#/components/schemas/BatchExecution'
          description: 最近一次执行。从没执行过时不返回。
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    UserRef:
      type: object
      additionalProperties: false
      description: 一个平台用户的标识与显示名（列表与记录上展示「谁」）。
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
    MerchantBrief:
      type: object
      additionalProperties: false
      description: 一个商户的标识与名称（列表与记录上展示「哪个商户」）。
      required:
        - merchantId
        - merchantName
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantName:
          type: string
          minLength: 1
  parameters:
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
