openapi: 3.1.0
info:
  title: 管理后台 交易与退款 — 前端契约面
  version: 2.0.0
  contact:
    name: 管理后台 BFF
  description: |
    管理后台 React SPA 消费的交易与退款契约：跨商户的交易查询、即时合计、订单详情与导出（商户详情的订单页签用同一组接口、固定商户），跨商户的退款单查询、详情与导出，退款待审队列与审核决定，按商户只读查看代扣协议。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **金额口径**：金额是对应币种最小单位的整数串，带币种。交易列表行上的金额与商户后台交易列表同口径：已成交的订单是结算币种的成交金额，没成交的是标价金额；退款金额是原订单的标价币种。

    **幂等 / CSRF 口径**：

    - 审核决定带状态前置（只对审核中的退款生效，两人同时下以先到者为准），不挂幂等键。
    - 两个导出按读处理，不挂幂等键。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。

    **数据可见范围**：同管理后台约定「数据可见范围」，按订单所属商户求值：范围外商户的订单、退款与代扣协议不出现在列表、合计与导出里，按标识访问一律 `404`。

    **操作审计**：审核通过与拒绝记入操作审计（带审核人、退款单、商户、结论与审批说明），可在该商户详情的操作记录页签查到；查询、详情、导出不记。
servers:
  - url: /api/admin/v1
    description: 管理后台 BFF（浏览器经边缘网关 admin.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: payments
    x-displayName: 交易
    description: 跨商户的支付订单：列表、即时合计、详情与导出。
  - name: refunds
    x-displayName: 退款单
    description: 跨商户的退款单：列表、详情与导出。
  - name: refund-reviews
    x-displayName: 退款审核
    description: 退款待审队列与待审数，审核通过或拒绝。
  - name: mandates
    x-displayName: 代扣协议
    description: 按商户只读查看委托代扣协议。
paths:
  /payments:
    get:
      tags:
        - payments
      operationId: listPayments
      x-required-privilege: txadm:payment:view
      summary: 交易列表（筛选、搜索、排序、分页）
      description: |
        本人数据范围内商户的支付订单，分页。日期范围按订单创建日期，两端必填。商户详情的订单页签用本接口并固定 `merchantId`。

        列表含 `FAILED` 与 `REJECTED` 两种没收到钱的行；收款过程中的中间状态不进列表。即时合计另取 `getPaymentSummary`。

        不传 `sortField` 时按创建时间从新到旧。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/MerchantFilter'
        - $ref: '#/components/parameters/PaymentKeyword'
        - $ref: '#/components/parameters/PaymentStatusFilter'
        - $ref: '#/components/parameters/PaymentMethodFamilyFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - $ref: '#/components/parameters/PreauthOrderFilter'
        - $ref: '#/components/parameters/SettlementHoldActiveFilter'
        - $ref: '#/components/parameters/PaymentSortField'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentSummary'
              example:
                total: 2
                data:
                  - orderId: P100240002
                    merchantOrderNo: SHOP-INV-8842
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    merchantCode: C3BM68
                    partnerId: ptn_0031
                    amount:
                      amount: '3836'
                      currency: CAD
                    refundedAmount:
                      amount: '5000'
                      currency: CNY
                    fxRate: '5.2137'
                    status: PARTIALLY_REFUNDED
                    settled: true
                    customerServiceFeeCharged: false
                    paymentMethodFamily: alipay
                    source: invoice
                    createdAt: '2026-07-19T02:40:00Z'
                    hasReviewingRefund: true
                    preauthOrder: false
                    settlementHoldActive: false
                  - orderId: P100240003
                    merchant:
                      merchantId: mch_9020
                      merchantName: Lotus Tea House
                    merchantCode: D7KQ21
                    amount:
                      amount: '9900'
                      currency: CAD
                    status: REJECTED
                    settled: false
                    customerServiceFeeCharged: false
                    source: product_link
                    createdAt: '2026-07-19T01:05:00Z'
                    hasReviewingRefund: false
                    preauthOrder: false
                    settlementHoldActive: false
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /payments/summary:
    get:
      tags:
        - payments
      operationId: getPaymentSummary
      x-required-privilege: txadm:payment:view
      summary: 交易列表即时合计（按结算币种分组）
      description: |
        与 `listPayments` 用同一组筛选参数、基于同一批订单的合计；不要求指定商户。按结算币种分组，每个币种一组，金额都是该结算币种（每笔按实际结算金额相加）；只涉及一个结算币种时（如商户详情的订单页签）就只有一组。没有计入的订单时 `items` 为空数组。

        只算收到钱的四种状态：`PAID` / `PARTIALLY_REFUNDED` / `REFUNDED` / `PREAUTH_HOLDING`。列表还会列出 `FAILED` / `REJECTED`，所以笔数合计可能小于列表行数。`grossSales` 就是这四种状态的行金额之和。

        `refundAmount` 是这批订单至今已退的金额（随订单计入，不按退款发生日），`netSales` = `grossSales` − `refundAmount`。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/MerchantFilter'
        - $ref: '#/components/parameters/PaymentKeyword'
        - $ref: '#/components/parameters/PaymentStatusFilter'
        - $ref: '#/components/parameters/PaymentMethodFamilyFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - $ref: '#/components/parameters/PreauthOrderFilter'
        - $ref: '#/components/parameters/SettlementHoldActiveFilter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    description: 每个结算币种一组，按币种码排序。
                    items:
                      $ref: '#/components/schemas/PaymentTotals'
              example:
                items:
                  - transactions: 42
                    grossSales:
                      amount: '700000'
                      currency: CAD
                    refundAmount:
                      amount: '12000'
                      currency: CAD
                    netSales:
                      amount: '688000'
                      currency: CAD
                  - transactions: 5
                    grossSales:
                      amount: '86000'
                      currency: USD
                    refundAmount:
                      amount: '0'
                      currency: USD
                    netSales:
                      amount: '86000'
                      currency: USD
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /payments/{orderId}:
    get:
      tags:
        - payments
      operationId: getPayment
      x-required-privilege: txadm:payment:view
      summary: 订单详情（含同单退款与回调投递）
      description: |
        单张订单：列表行的字段，加金额明细、支付方式与通道、产品形态与受理模式、各时刻、通道交易号与通道错误、付款人通道侧标识与 IP、回调地址、发起设备、订单描述与采集项、同单的全部退款，以及该单向商户回调的投递任务。订单不存在或所属商户在本人数据范围外 → `404`。

        结算锁只展示，本面没有释放结算锁的操作。关联退款里 `type = system_auto` 的是平台自动退回的多付款项，不计入 `refundedAmount`。

        `callbackDeliveries` 里进了死信的任务，到运维与审计的对外投递详情（`getOutboundDelivery`）人工重投，本面不重投。

        `status = REJECTED` 的订单从未发生支付，没有支付方式、通道与付款人信息。
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
              example:
                orderId: P100240002
                merchantOrderNo: SHOP-INV-8842
                merchant:
                  merchantId: mch_8812
                  merchantName: Maple Coffee
                merchantCode: C3BM68
                partnerId: ptn_0031
                amount:
                  amount: '3836'
                  currency: CAD
                refundedAmount:
                  amount: '5000'
                  currency: CNY
                fxRate: '5.2137'
                status: PARTIALLY_REFUNDED
                settled: true
                customerServiceFeeCharged: false
                paymentMethodFamily: alipay
                source: invoice
                createdAt: '2026-07-19T02:40:00Z'
                hasReviewingRefund: true
                preauthOrder: false
                settlementHoldActive: false
                orderAmount:
                  amount: '20000'
                  currency: CNY
                tipAmount:
                  amount: '0'
                  currency: CNY
                totalAmount:
                  amount: '20000'
                  currency: CNY
                customerServiceFee:
                  amount: '0'
                  currency: CNY
                customerPaymentAmount:
                  amount: '20000'
                  currency: CNY
                paidSettleAmount:
                  amount: '3836'
                  currency: CAD
                refundedSettleAmount:
                  amount: '959'
                  currency: CAD
                refundableAmount:
                  amount: '10000'
                  currency: CNY
                cnyAmount:
                  amount: '20000'
                  currency: CNY
                paymentMethod: alipay_online
                channelId: ch_ali_02
                channelTradeType: WEB
                product: invoice
                acceptanceMode: online
                confirmedAt: '2026-07-19T02:40:05Z'
                channelSuccessAt: '2026-07-19T02:40:04Z'
                channelTxnNo: '2026071922001412345678901234'
                payerChannelUserId: '2088102177846553'
                customerIp: 203.0.113.7
                notifyUrl: https://shop.maplecoffee.example/notify
                orderDescription: 门店订单
                collectedFields:
                  - label: Table No.
                    value: '12'
                refunds:
                  - refundId: R100240002-1
                    type: merchant
                    status: SUCCESS
                    amount:
                      amount: '5000'
                      currency: CNY
                    createdAt: '2026-07-19T02:50:00Z'
                  - refundId: R100240002-2
                    type: merchant
                    status: REVIEWING
                    amount:
                      amount: '5000'
                      currency: CNY
                    createdAt: '2026-07-20T09:12:00Z'
                callbackDeliveries:
                  - deliveryId: obd_51f0
                    eventType: order.paid
                    status: DEAD_LETTER
                    attemptCount: 9
                    lastHttpStatus: 500
                    lastFailureClass: http_error
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /payment-exports:
    post:
      tags:
        - payments
      operationId: createPaymentExport
      x-required-privilege: txadm:payment-export:create
      summary: 导出交易（xlsx）
      description: |
        按所给筛选导出命中的全部订单，不只是当前页；筛选字段与 `listPayments` 相同，只含本人数据范围内商户的订单，商户详情的订单页签导出时固定 `merchantId`。列是列表行的字段，加人民币实扣金额与付款人通道侧标识。同步返回文件流。表头与枚举文案按 `Accept-Language`，实际用的语言经 `Content-Language` 回。按读处理，不挂幂等键。

        **什么时候拒绝**：

        - 命中行数超过导出上限 → `409`·`308503`，不出文件；`context.maxRows` 带当时的上限，缩小筛选后重试。
        - 日期范围缺一端、`to` 早于 `from`、跨度超过允许的最大查询窗口、字段格式不对 → `400`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentListFilter'
            example:
              from: '2026-07-01'
              to: '2026-07-19'
              merchantId: mch_8812
              status:
                - PAID
                - PARTIALLY_REFUNDED
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308503
  /refunds:
    get:
      tags:
        - refunds
      operationId: listRefunds
      x-required-privilege: txadm:refund:view
      summary: 退款单列表（筛选、搜索、分页）
      description: |
        本人数据范围内商户的退款单，分页。日期范围按退款单创建日期，两端必填。固定按创建时间从新到旧。

        含平台自动退回的多付款项（`type = system_auto`）。商户是订单所属商户；跨主子代退的另带发起方商户 `initiatorMerchant`。支付方式是被退那笔支付的，来源是原订单的。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/MerchantFilter'
        - $ref: '#/components/parameters/RefundKeyword'
        - $ref: '#/components/parameters/RefundStatusFilter'
        - $ref: '#/components/parameters/RefundFailureReasonFilter'
        - $ref: '#/components/parameters/PaymentMethodFamilyFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RefundSummary'
              example:
                total: 2
                data:
                  - refundId: R100240002-1
                    orderId: P100240002
                    merchantOrderNo: SHOP-INV-8842
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    merchantCode: C3BM68
                    type: merchant
                    amount:
                      amount: '5000'
                      currency: CNY
                    settleAmount:
                      amount: '959'
                      currency: CAD
                    status: SUCCESS
                    paymentMethodFamily: alipay
                    source: invoice
                    entryPoint: merchant_portal
                    createdAt: '2026-07-19T02:50:00Z'
                  - refundId: R100240005-1
                    merchantRefundNo: SHOP-RF-0091
                    orderId: P100240005
                    merchant:
                      merchantId: mch_9031
                      merchantName: Maple Coffee Downtown
                    merchantCode: C3BM70
                    initiatorMerchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    type: merchant
                    amount:
                      amount: '3000'
                      currency: CAD
                    status: FAILED
                    failureReason: CHANNEL_REJECTED
                    paymentMethodFamily: wechat
                    source: online_api
                    entryPoint: open_api
                    createdAt: '2026-07-19T04:10:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /refunds/{refundId}:
    get:
      tags:
        - refunds
      operationId: getRefund
      x-required-privilege: txadm:refund:view
      summary: 退款单详情
      description: |
        单笔退款：列表行的字段，加通道退款号、发起操作员与发起设备、退款备注、通知地址、通道的原始错误，受理、完成与审核的时刻，审核人与审批说明，退回商户的手续费，以及该退款向商户回调的投递任务。退款不存在或订单所属商户在本人数据范围外 → `404`。

        本面对退款没有任何处置操作：失败的退款只展示失败原因与通道原文，重新发起由商户在商户后台做；回调死信到运维与审计的对外投递详情重投。
      parameters:
        - $ref: '#/components/parameters/RefundIdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundDetail'
              examples:
                rejected:
                  summary: 终端发起、审核被拒
                  value:
                    refundId: R100240007-1
                    orderId: P100240007
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    merchantCode: C3BM68
                    type: merchant
                    amount:
                      amount: '60000'
                      currency: CAD
                    status: REJECTED
                    paymentMethodFamily: wechat
                    source: terminal
                    entryPoint: pos
                    createdAt: '2026-07-20T09:12:00Z'
                    operator:
                      userId: usr_7a1c9
                      displayName: Alice Wong
                    device:
                      deviceId: dev_3301
                      deviceName: Front Counter
                      deviceModel: A920
                    note: 顾客取消
                    completedAt: '2026-07-20T10:02:00Z'
                    reviewedAt: '2026-07-20T10:02:00Z'
                    reviewer:
                      userId: usr_a102
                      displayName: Grace Lin
                    reviewNote: 金额与订单不符，请核对后重新发起
                    callbackDeliveries: []
                failed:
                  summary: 开放 API 发起，被通道拒绝
                  value:
                    refundId: R100240005-1
                    merchantRefundNo: SHOP-RF-0091
                    orderId: P100240005
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    merchantCode: C3BM68
                    type: merchant
                    amount:
                      amount: '3000'
                      currency: CAD
                    status: FAILED
                    failureReason: CHANNEL_REJECTED
                    paymentMethodFamily: wechat
                    source: online_api
                    entryPoint: open_api
                    createdAt: '2026-07-19T04:10:00Z'
                    notifyUrl: https://shop.maplecoffee.example/refund-notify
                    channelError:
                      code: NOTENOUGH
                      message: 基本账户余额不足，请充值后重新发起
                    completedAt: '2026-07-19T04:10:03Z'
                    callbackDeliveries: []
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /refund-exports:
    post:
      tags:
        - refunds
      operationId: createRefundExport
      x-required-privilege: txadm:refund-export:create
      summary: 导出退款单（xlsx）
      description: |
        按所给筛选导出命中的全部退款单，不只是当前页；筛选字段与 `listRefunds` 相同，只含本人数据范围内商户的退款单。列是列表行的字段，加退回商户的手续费、发起操作员与退款备注。同步返回文件流。表头与枚举文案按 `Accept-Language`，实际用的语言经 `Content-Language` 回。按读处理，不挂幂等键。

        **什么时候拒绝**：

        - 命中行数超过导出上限 → `409`·`308503`，不出文件；`context.maxRows` 带当时的上限，缩小筛选后重试。
        - 日期范围缺一端、`to` 早于 `from`、跨度超过允许的最大查询窗口、字段格式不对 → `400`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundListFilter'
            example:
              from: '2026-07-01'
              to: '2026-07-19'
              status:
                - FAILED
              failureReason:
                - CHANNEL_REJECTED
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308503
  /refund-reviews:
    get:
      tags:
        - refund-reviews
      operationId: listRefundReviews
      x-required-privilege: txadm:refund-review:view
      summary: 退款待审队列（待审 / 已通过 / 已拒绝）
      description: |
        本人数据范围内商户的、走过审核的退款，按 `reviewState` 分三档：`PENDING` 审核中（默认）、`APPROVED` 已通过、`REJECTED` 已拒绝。`APPROVED` / `REJECTED` 按审核日期区间筛选（`from` / `to` 两端必填）；`PENDING` 不按日期，传了 `from` / `to` 不生效。

        `reviewState = PENDING` 时的 `total` 就是导航上的待审数。待审按申请时间从新到旧；已通过与已拒绝按审核时间从新到旧。

        已通过的行 `status` 是退款此时的状态（处理中、成功或失败）。
      parameters:
        - name: reviewState
          in: query
          required: false
          description: '`PENDING` 审核中 / `APPROVED` 已通过 / `REJECTED` 已拒绝；不传 = `PENDING`。'
          schema:
            type: string
            enum:
              - PENDING
              - APPROVED
              - REJECTED
            default: PENDING
        - name: from
          in: query
          required: false
          description: 审核起始日期（含当日）。`reviewState` 为 `APPROVED` / `REJECTED` 时与 `to` 同为必填，缺一端、`to` 早于 `from` 或跨度超过允许的最大查询窗口 → `400`；`PENDING` 时不生效。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: false
          description: 审核截止日期（含当日；与 `from` 成对）。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - $ref: '#/components/parameters/MerchantFilter'
        - name: keyword
          in: query
          required: false
          description: 商户码、商户名、退款备注、平台订单号模糊匹配。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RefundReviewItem'
              example:
                total: 1
                data:
                  - refundId: R100240002-2
                    merchant:
                      merchantId: mch_8812
                      merchantName: Maple Coffee
                    merchantCode: C3BM68
                    orderId: P100240002
                    merchantOrderNo: SHOP-INV-8842
                    amount:
                      amount: '5000'
                      currency: CNY
                    entryPoint: merchant_portal
                    operator:
                      userId: usr_7a1c9
                      displayName: Alice Wong
                    createdAt: '2026-07-20T09:12:00Z'
                    note: 客户退货
                    status: REVIEWING
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
  /refund-reviews/{refundId}/decision:
    parameters:
      - $ref: '#/components/parameters/RefundIdPath'
    post:
      tags:
        - refund-reviews
      operationId: decideRefundReview
      x-required-privilege: txadm:refund-review:manage
      summary: 审核退款（通过或拒绝）
      description: |
        对审核中的退款下结论，审核人是当前登录的后台用户：

        - `APPROVED`：通过。跨主子代退的退款先复检发起方的代退授权，授权已撤即拒绝；其余受理时的条件不再重判。通过后退款送往通道，响应的 `status` 是退款此时的状态。
        - `REJECTED`：拒绝，`reviewNote` 可填，作为审批说明在退款详情展示。退款转为已拒绝，占用的可退额度放回订单。

        两人同时下结论以先到者为准。带状态前置，不挂幂等键。审核通过与拒绝都记入操作审计。

        **什么时候拒绝**：

        - `308501` 退款已不在审核中（他人先下了结论，或商户已撤销，或自己上一次已成功〔提交后超时重点〕），重读队列。
        - `308502` 跨主子代退的退款在审核期间失去了代退授权，不能通过；可改为拒绝。退款不变。
        - `reviewNote` 超长、`decision` 不在取值内 → `400`。
        - 退款不存在，或订单所属商户在本人数据范围外 → `404`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundReviewDecision'
            examples:
              approve:
                summary: 通过
                value:
                  decision: APPROVED
              reject:
                summary: 拒绝并填说明
                value:
                  decision: REJECTED
                  reviewNote: 金额与订单不符，请核对后重新发起
      responses:
        '200':
          description: 已下结论，返回退款此时的状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundReviewResult'
              examples:
                approved:
                  summary: 通过后已送往通道
                  value:
                    refundId: R100240002-2
                    status: CHANNEL_PROCESSING
                rejected:
                  summary: 拒绝
                  value:
                    refundId: R100240002-2
                    status: REJECTED
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes:
        - 308501
        - 308502
  /mandates:
    get:
      tags:
        - mandates
      operationId: listMandates
      x-required-privilege: txadm:payment:view
      summary: 商户代扣协议列表（只读）
      description: |
        一个商户的委托代扣协议，固定按建立时间从新到旧。须指定商户；商户在本人数据范围外时结果为空。只读，本面没有解约等操作。
      parameters:
        - name: merchantId
          in: query
          required: true
          description: 商户标识。
          schema:
            $ref: '#/components/schemas/MerchantId'
        - name: status
          in: query
          required: false
          description: 按协议状态，可多选。
          style: form
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/MandateStatus'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    minimum: 0
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Mandate'
              example:
                total: 2
                data:
                  - mandateId: mdt_4410
                    merchantMandateNo: SUB-2026-0007
                    channelMandateNo: '202607190001'
                    paymentMethod: wechat_online
                    status: ACTIVE
                    activatedAt: '2026-07-19T05:00:00Z'
                    validUntil: '2027-07-19T05:00:00Z'
                    createdAt: '2026-07-19T04:58:00Z'
                  - mandateId: mdt_4102
                    merchantMandateNo: SUB-2026-0003
                    channelMandateNo: '202606020011'
                    paymentMethod: wechat_online
                    status: TERMINATED
                    activatedAt: '2026-06-02T08:00:00Z'
                    terminatedAt: '2026-07-01T10:00:00Z'
                    createdAt: '2026-06-02T07:59:00Z'
        default:
          $ref: '#/components/responses/AdminBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-asession
      description: |
        管理后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决操作者身份、权限点与数据可见范围。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读可读伴生 cookie `__Host-acsrf`、原样放进 `X-CSRF-Token`（详见管理后台约定）；
        - 受信浏览器凭据在另一个 HttpOnly cookie 里，由服务端读写，前端不读、不写、不转发。
  parameters:
    OrderIdPath:
      name: orderId
      in: path
      required: true
      description: 平台订单号。订单不存在或所属商户在本人数据范围外 → `404`。
      schema:
        $ref: '#/components/schemas/OrderId'
    RefundIdPath:
      name: refundId
      in: path
      required: true
      description: 平台退款号。退款不存在或订单所属商户在本人数据范围外 → `404`。
      schema:
        $ref: '#/components/schemas/RefundId'
    FromDate:
      name: from
      in: query
      required: true
      description: 起始日期（含当日）：交易接口按订单创建日期，退款单接口按退款单创建日期。与 `to` 同为必填；跨度超过允许的最大查询窗口 → `400`。
      schema:
        $ref: '#/components/schemas/LocalDate'
    ToDate:
      name: to
      in: query
      required: true
      description: 截止日期（含当日；与 `from` 成对必填）。
      schema:
        $ref: '#/components/schemas/LocalDate'
    MerchantFilter:
      name: merchantId
      in: query
      required: false
      description: 只看这个商户（订单所属商户）。商户在本人数据范围外时结果为空。
      schema:
        $ref: '#/components/schemas/MerchantId'
    PaymentKeyword:
      name: keyword
      in: query
      required: false
      description: 平台订单号、商户订单号、通道交易号、订单描述与备注、商户码、商户名模糊匹配；是个金额（按界面显示的单位写，可带小数点，如 `126.50`）时另按行上的 `amount` 精确匹配，不分币种。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    RefundKeyword:
      name: keyword
      in: query
      required: false
      description: 平台退款号、商户退款单号、平台订单号、商户订单号、通道退款号模糊匹配；是个金额（按界面显示的单位写，可带小数点，如 `126.50`）时另按行上的 `amount` 精确匹配，不分币种。
      schema:
        type: string
        minLength: 1
        maxLength: 128
    PaymentStatusFilter:
      name: status
      in: query
      required: false
      description: 按订单状态，可多选。
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PaymentStatus'
    PaymentMethodFamilyFilter:
      name: paymentMethodFamily
      in: query
      required: false
      description: 按支付方式（品牌），可多选。退款单接口上指被退那笔支付的支付方式。
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PaymentMethodFamily'
    PaymentSourceFilter:
      name: source
      in: query
      required: false
      description: 按来源，可多选；插件订单即 `shopify` / `allvalue`，账单码订单即 `invoice`。退款单接口上指原订单的来源。
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/PaymentSource'
    PreauthOrderFilter:
      name: preauthOrder
      in: query
      required: false
      description: '`true` 只看预授权订单 / `false` 只看非预授权订单；不传不筛。'
      schema:
        type: boolean
    SettlementHoldActiveFilter:
      name: settlementHoldActive
      in: query
      required: false
      description: '`true` 只看结算锁生效中的订单 / `false` 只看没有生效结算锁的订单；不传不筛。'
      schema:
        type: boolean
    PaymentSortField:
      name: sortField
      in: query
      required: false
      description: 排序字段。不传 = 按创建时间从新到旧。`amount` 按行上的 `amount` 数值比较、不分币种。
      schema:
        type: string
        enum:
          - createdAt
          - amount
    RefundStatusFilter:
      name: status
      in: query
      required: false
      description: 按退款状态，可多选。
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RefundStatus'
    RefundFailureReasonFilter:
      name: failureReason
      in: query
      required: false
      description: 按失败原因，可多选；只命中失败的退款。
      style: form
      explode: true
      schema:
        type: array
        items:
          $ref: '#/components/schemas/RefundFailureReason'
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        页面当前的语言（BCP-47 语言标记，可带权重列表，如 `zh-CN,zh;q=0.9,en;q=0.8`）。服务端在本接口支持的语言里取最接近的一种（如 `fr-CA` → `fr`）；按它渲染什么、取不中时退到哪种语言，见所在面的说明。

        响应带 `Content-Language` 的接口，实际用的语言以该头为准。
      schema:
        type: string
        minLength: 2
        maxLength: 256
  schemas:
    PaymentStatus:
      type: string
      description: |
        支付订单的商户可见状态：`PAID` 已收款 · `PARTIALLY_REFUNDED` 部分退款 · `REFUNDED` 全额退款 · `FAILED` 付款失败 · `REJECTED` 平台未受理 · `PREAUTH_HOLDING` 预授权挂起。

        前三种都是已收款，按已退金额区分；退款受理后又失败的会回退，所以订单可能从 `PARTIALLY_REFUNDED` 回到 `PAID`。`REJECTED` 是建单时被平台拒掉、支付从未发生，与 `FAILED`（付了但失败）不同。收款过程中的中间状态不进列表。

        计入汇总的是 `PAID` / `PARTIALLY_REFUNDED` / `REFUNDED` / `PREAUTH_HOLDING` 四种。
      enum:
        - PAID
        - PARTIALLY_REFUNDED
        - REFUNDED
        - FAILED
        - REJECTED
        - PREAUTH_HOLDING
    PaymentSource:
      type: string
      description: |
        订单来源：这笔钱从哪个入口收进来的。

        | 取值 | 含义 |
        |---|---|
        | `terminal` | POS 终端 |
        | `app` | 商户 App |
        | `store_qr` | 店铺码 |
        | `invoice` | 账单 |
        | `product_link` | Product Link 的商品 |
        | `ticket` | Product Link 的票务 |
        | `giftcard` | Product Link 的礼卡 |
        | `retail_api` | 开放 API，线下 |
        | `online_api` | 开放 API，线上 |
        | `auto_debit` | 委托代扣 |
        | `shopify` | Shopify 插件 |
        | `allvalue` | AllValue 插件 |
      enum:
        - terminal
        - app
        - store_qr
        - invoice
        - product_link
        - ticket
        - giftcard
        - retail_api
        - online_api
        - auto_debit
        - shopify
        - allvalue
    PaymentProduct:
      type: string
      description: 订单的产品形态：店铺码、动态码、原生码（商户自行展示的钱包二维码）、付款码、账单、商品、票务、礼卡、PC 网页、移动网页、JSAPI、原生 JSAPI（商户自有应用内调起）、小程序、App SDK、委托代扣。
      enum:
        - store_qr
        - dynamic_qr
        - native_qrcode
        - barcode
        - invoice
        - product_code
        - ticket
        - giftcard
        - web_pc
        - web_mobile
        - jsapi
        - native_jsapi
        - mini_program
        - app_sdk
        - auto_debit
    RefundType:
      type: string
      description: 退款类型：`merchant` 退已生效订单的退款，从商户账上出钱；`system_auto` 平台自动退回的多付款项（重复支付、关单后才到的成功支付），不动商户的账，不计入订单的已退金额。
      enum:
        - merchant
        - system_auto
    ChannelTradeType:
      type: string
      description: 通道交易类型：`MICROPAY` 付款码 · `JSAPI` 公众号 / 服务窗内支付 · `MWEB` 手机网页 · `WEB` 电脑网页 · `APP` App 支付 · `NATIVE` 扫码 · `CARD` 银行卡 · `AUTO_DEBIT` 委托代扣。
      enum:
        - MICROPAY
        - JSAPI
        - MWEB
        - WEB
        - APP
        - NATIVE
        - CARD
        - AUTO_DEBIT
    MandateStatus:
      type: string
      description: 代扣协议状态：`PENDING` 待付款人授权 · `ACTIVE` 生效、可扣款 · `TERMINATED` 已解约 · `FAILED` 签约失败 · `EXPIRED` 已过期。
      enum:
        - PENDING
        - ACTIVE
        - TERMINATED
        - FAILED
        - EXPIRED
    CallbackDeliveryStatus:
      type: string
      enum:
        - PENDING
        - DELIVERING
        - RETRYING
        - DELIVERED
        - DEAD_LETTER
      description: '`PENDING` 待投递 / `DELIVERING` 投递中 / `RETRYING` 自动重试中 / `DELIVERED` 已送达 / `DEAD_LETTER` 死信（自动重试已结束，可在运维与审计人工重投）。'
    DeviceBrief:
      type: object
      additionalProperties: false
      description: 发起这笔的设备。设备已解绑也照常给出。
      required:
        - deviceId
      properties:
        deviceId:
          $ref: '#/components/schemas/DeviceId'
        deviceName:
          type: string
          minLength: 1
          description: 商户给设备起的名字；没起不返回本键。
        deviceModel:
          type: string
          minLength: 1
          description: 设备型号；未上报不返回本键。
    ChannelError:
      type: object
      additionalProperties: false
      description: 通道返回的原始错误，各通道的码与文字不统一、不翻译，原样给出。
      properties:
        code:
          type: string
          description: 通道错误码；通道没给时不返回本键。
        message:
          type: string
          description: 通道错误描述；通道没给时不返回本键。
    CollectedField:
      type: object
      additionalProperties: false
      description: 下单时向付款人采集的一项，按收款页上的顺序。
      required:
        - label
        - value
      properties:
        label:
          type: string
          minLength: 1
          description: 采集项标题。
        value:
          type: string
          description: 付款人填的值。
    CallbackDelivery:
      type: object
      additionalProperties: false
      description: 向商户回调的一个投递任务（同一单可能有多个，如支付成功与退款结果各一个）；要看每次尝试或人工重投，到运维与审计的对外投递详情。
      required:
        - deliveryId
        - eventType
        - status
        - attemptCount
      properties:
        deliveryId:
          type: string
          minLength: 1
          maxLength: 32
          description: 对外投递任务标识，即运维与审计 `getOutboundDelivery` 的 `deliveryId`。
        eventType:
          type: string
          minLength: 1
          maxLength: 128
          description: 来源事件码（如 `order.paid`、`refund.posted`），开放集合；展示名由前端按码取，查不到时显示码。
        status:
          $ref: '#/components/schemas/CallbackDeliveryStatus'
        attemptCount:
          type: integer
          minimum: 0
          description: 已尝试次数（自动与人工合计）。
        lastHttpStatus:
          type: integer
          minimum: 100
          maximum: 599
          description: 最近一次尝试对方应答的 HTTP 状态码；没收到应答或还没尝试时不返回。
        lastFailureClass:
          type: string
          enum:
            - target_blocked
            - target_rejected
            - connect_failed
            - timeout
            - tls_failed
            - http_error
            - ack_mismatch
            - signing_unavailable
          description: 最近一次尝试的失败类别（取值同运维与审计的对外投递尝试）；最近一次成功或还没尝试时不返回。
        deliveredAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 送达时刻。未送达时不返回。
    PaymentListFilter:
      type: object
      additionalProperties: false
      description: 交易导出的筛选，与 `listPayments` 的同名查询参数同义；`from` / `to` 必填，其余不传的项不筛。
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/LocalDate'
        to:
          $ref: '#/components/schemas/LocalDate'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        keyword:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: array
          items:
            $ref: '#/components/schemas/PaymentStatus'
        paymentMethodFamily:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodFamily'
        source:
          type: array
          items:
            $ref: '#/components/schemas/PaymentSource'
        preauthOrder:
          type: boolean
        settlementHoldActive:
          type: boolean
        sortField:
          type: string
          enum:
            - createdAt
            - amount
        sortOrder:
          type: string
          enum:
            - ascend
            - descend
    PaymentSummary:
      type: object
      x-parent: true
      description: 交易列表的一行；详情在它上面加字段。
      required:
        - orderId
        - merchant
        - merchantCode
        - amount
        - status
        - settled
        - customerServiceFeeCharged
        - source
        - createdAt
        - hasReviewingRefund
        - preauthOrder
        - settlementHoldActive
      properties:
        orderId:
          $ref: '#/components/schemas/OrderId'
        merchantOrderNo:
          $ref: '#/components/schemas/MerchantOrderNo'
          description: 商户自己的订单号；建单时没传就不返回本键。
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
          description: 订单所属商户。
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        partnerId:
          $ref: '#/components/schemas/PartnerId'
          description: 商户所属机构；不属任何机构不返回本键。
        amount:
          description: 订单金额。已成交的订单是结算币种的成交金额；没成交的（`FAILED` / `REJECTED`）是标价金额。
          allOf:
            - $ref: '#/components/schemas/Money'
        refundedAmount:
          description: 已退金额，标价币种（通道已受理的退款累计；受理后又失败的会退回）。没退过时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        fxRate:
          type: string
          minLength: 1
          description: 通道回报的汇率，十进制字符串：1 单位结算币种 = `fxRate` 人民币。只用于展示，不要拿它反算金额；通道没回报时不返回本键。
        status:
          $ref: '#/components/schemas/PaymentStatus'
        settled:
          type: boolean
          description: 这笔是否已进入商户的结算批次。
        customerServiceFeeCharged:
          type: boolean
          description: 这笔是否向付款人加收了客户服务费。
        paymentMethodFamily:
          description: 支付方式（品牌）。`status = REJECTED` 时不返回本键。
          allOf:
            - $ref: '#/components/schemas/PaymentMethodFamily'
        source:
          $ref: '#/components/schemas/PaymentSource'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        hasReviewingRefund:
          type: boolean
          description: 这张订单是否有审核中的退款。
        preauthOrder:
          type: boolean
          description: 是否预授权订单；结算锁释放后仍为真。
        settlementHoldActive:
          type: boolean
          description: 结算锁是否生效中（未释放）。
    PaymentTotals:
      type: object
      additionalProperties: false
      description: 一个结算币种的合计，四项金额都是这个币种。口径见 `getPaymentSummary`。
      required:
        - transactions
        - grossSales
        - refundAmount
        - netSales
      properties:
        transactions:
          type: integer
          minimum: 0
          description: 计入合计的订单数（只算收到钱的四种状态）。
        grossSales:
          description: 计入订单的成交金额合计。
          allOf:
            - $ref: '#/components/schemas/Money'
        refundAmount:
          description: 这批订单至今已退的金额。
          allOf:
            - $ref: '#/components/schemas/Money'
        netSales:
          description: '`grossSales` − `refundAmount`。'
          allOf:
            - $ref: '#/components/schemas/Money'
    RefundRef:
      type: object
      additionalProperties: false
      description: 订单详情里的一笔关联退款。
      required:
        - refundId
        - type
        - status
        - amount
        - createdAt
      properties:
        refundId:
          $ref: '#/components/schemas/RefundId'
        type:
          $ref: '#/components/schemas/RefundType'
        status:
          $ref: '#/components/schemas/RefundStatus'
        amount:
          description: 退款金额，标价币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PaymentDetail:
      description: 订单详情：列表行的字段加下面这些。
      allOf:
        - $ref: '#/components/schemas/PaymentSummary'
        - type: object
          required:
            - orderAmount
            - tipAmount
            - totalAmount
            - customerServiceFee
            - customerPaymentAmount
            - product
            - acceptanceMode
            - refunds
            - callbackDeliveries
          properties:
            orderAmount:
              description: 标价金额，标价币种。
              allOf:
                - $ref: '#/components/schemas/Money'
            tipAmount:
              description: 小费，标价币种；没有小费为 0。
              allOf:
                - $ref: '#/components/schemas/Money'
            totalAmount:
              description: 订单总额 = 标价金额 + 小费，标价币种。
              allOf:
                - $ref: '#/components/schemas/Money'
            customerServiceFee:
              description: 向付款人加收的客户服务费，标价币种；不加收为 0。
              allOf:
                - $ref: '#/components/schemas/Money'
            customerPaymentAmount:
              description: 付款人应付总额，标价币种。
              allOf:
                - $ref: '#/components/schemas/Money'
            paidSettleAmount:
              description: 成交金额，结算币种；没成交时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Money'
            refundedSettleAmount:
              description: 已退金额折合的结算币种金额，与 `refundedAmount` 同有同无。
              allOf:
                - $ref: '#/components/schemas/Money'
            refundableAmount:
              description: 还可以退的金额，标价币种：应付总额减已退、减在途的退款。只有已收款且有余额时返回，否则不返回本键。
              allOf:
                - $ref: '#/components/schemas/Money'
            cnyAmount:
              description: 通道回报的付款人人民币实扣金额，只用于展示；通道没回报时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Money'
            paymentMethod:
              description: 支付方式；没发起过支付（如 `status = REJECTED`）时不返回本键。
              allOf:
                - $ref: '#/components/schemas/PaymentMethod'
            channelId:
              type: string
              minLength: 1
              maxLength: 32
              description: 承载这笔支付的通道标识；没发起过支付时不返回本键。
            channelTradeType:
              description: 通道交易类型；没发起过支付时不返回本键。
              allOf:
                - $ref: '#/components/schemas/ChannelTradeType'
            product:
              $ref: '#/components/schemas/PaymentProduct'
            acceptanceMode:
              $ref: '#/components/schemas/AcceptanceMode'
            confirmedAt:
              description: 确认时间；还没到终态时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Timestamp'
            channelSuccessAt:
              description: 通道回报的支付成功时间；通道没回报时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Timestamp'
            channelTxnNo:
              type: string
              description: 通道返回的交易号，付款人账单上显示的那个；没发起过支付或通道还没返回时不返回本键。
            channelError:
              description: 通道的原始错误；付款失败且通道回了错误时才有。
              allOf:
                - $ref: '#/components/schemas/ChannelError'
            payerChannelUserId:
              type: string
              description: 付款人在通道侧的标识（如微信 openid、支付宝 buyer_id），完整给出；通道没给时不返回本键。
            customerIp:
              type: string
              description: 付款人 IP；没有时不返回本键。
            notifyUrl:
              type: string
              description: 商户的异步通知地址；建单时没给不返回本键。
            device:
              description: 发起设备；不是设备发起的不返回本键。
              allOf:
                - $ref: '#/components/schemas/DeviceBrief'
            orderDescription:
              type: string
              description: 订单描述；没有不返回本键。
            orderDetail:
              type: string
              description: 订单明细或商户备注；没有不返回本键。
            collectedFields:
              type: array
              description: 下单时向付款人采集的各项；没有采集时不返回本键。
              items:
                $ref: '#/components/schemas/CollectedField'
            buyerFields:
              type: array
              description: 商品、票务、礼卡订单的买家填写项；其他订单不返回本键。
              items:
                $ref: '#/components/schemas/CollectedField'
            recipientFields:
              type: array
              description: 礼卡送礼时的收件人填写项；没有不返回本键。
              items:
                $ref: '#/components/schemas/CollectedField'
            refunds:
              type: array
              description: 这张订单的全部退款，含平台自动退款（按 `type` 区分），按创建时间从先到后；没有时为空数组。
              items:
                $ref: '#/components/schemas/RefundRef'
            callbackDeliveries:
              type: array
              description: 这张订单向商户回调的投递任务，按建立时间从先到后；没有回调地址或投递记录已过保留期时为空数组。
              items:
                $ref: '#/components/schemas/CallbackDelivery'
    RefundListFilter:
      type: object
      additionalProperties: false
      description: 退款单导出的筛选，与 `listRefunds` 的同名查询参数同义；`from` / `to` 必填，其余不传的项不筛。
      required:
        - from
        - to
      properties:
        from:
          $ref: '#/components/schemas/LocalDate'
        to:
          $ref: '#/components/schemas/LocalDate'
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        keyword:
          type: string
          minLength: 1
          maxLength: 128
        status:
          type: array
          items:
            $ref: '#/components/schemas/RefundStatus'
        failureReason:
          type: array
          items:
            $ref: '#/components/schemas/RefundFailureReason'
        paymentMethodFamily:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodFamily'
        source:
          type: array
          items:
            $ref: '#/components/schemas/PaymentSource'
    RefundSummary:
      type: object
      x-parent: true
      description: 退款单列表的一行；详情在它上面加字段。
      required:
        - refundId
        - orderId
        - merchant
        - merchantCode
        - type
        - amount
        - status
        - paymentMethodFamily
        - source
        - entryPoint
        - createdAt
      properties:
        refundId:
          $ref: '#/components/schemas/RefundId'
        merchantRefundNo:
          $ref: '#/components/schemas/MerchantRefundNo'
          description: 商户自己的退款单号；发起时没传就不返回本键。
        orderId:
          $ref: '#/components/schemas/OrderId'
          description: 原订单的平台订单号。
        merchantOrderNo:
          $ref: '#/components/schemas/MerchantOrderNo'
          description: 原订单的商户订单号；建单时没传就不返回本键。
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
          description: 订单所属商户（出资方）。
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        initiatorMerchant:
          $ref: '#/components/schemas/MerchantBrief'
          description: 跨主子代退的发起方商户；不是跨主子代退的不返回本键。
        type:
          $ref: '#/components/schemas/RefundType'
        amount:
          description: 退款金额，原订单的标价币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        settleAmount:
          description: 退款金额折合的结算币种金额。通道受理后才有；审核中、被拒、已撤销和没送到通道就失败的不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/RefundStatus'
        failureReason:
          description: 失败原因；`status = FAILED` 时必返，其余状态不返回本键。
          allOf:
            - $ref: '#/components/schemas/RefundFailureReason'
        paymentMethodFamily:
          description: 被退那笔支付的支付方式（品牌）。
          allOf:
            - $ref: '#/components/schemas/PaymentMethodFamily'
        source:
          description: 原订单的来源。
          allOf:
            - $ref: '#/components/schemas/PaymentSource'
        entryPoint:
          description: 退款从哪个入口发起；`type = system_auto` 时恒为 `system`。
          allOf:
            - $ref: '#/components/schemas/EntryPoint'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    RefundDetail:
      description: 退款单详情：列表行的字段加下面这些。
      allOf:
        - $ref: '#/components/schemas/RefundSummary'
        - type: object
          required:
            - callbackDeliveries
          properties:
            channelRefundNo:
              type: string
              description: 通道返回的退款号；没送到通道或通道还没返回时不返回本键。
            operator:
              description: 发起退款的商户成员；开放 API、插件、系统发起的没有操作员，不返回本键。
              allOf:
                - $ref: '#/components/schemas/UserRef'
            device:
              description: 发起设备；不是设备发起的不返回本键。
              allOf:
                - $ref: '#/components/schemas/DeviceBrief'
            note:
              type: string
              description: 退款备注（申请原因）；没有时不返回本键。
            notifyUrl:
              type: string
              description: 退款结果的通知地址；发起时没给不返回本键。
            channelError:
              description: 通道的原始错误；失败且通道回了错误时才有。
              allOf:
                - $ref: '#/components/schemas/ChannelError'
            acceptedAt:
              description: 通道受理成功的时刻；还没受理时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Timestamp'
            completedAt:
              description: 到终态的时刻（成功、失败、被拒、已撤销）；还没到终态时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Timestamp'
            reviewedAt:
              description: 审核下结论的时刻；没走审核或还在审核中不返回本键。
              allOf:
                - $ref: '#/components/schemas/Timestamp'
            reviewer:
              description: 下结论的后台用户，与 `reviewedAt` 同有同无。
              allOf:
                - $ref: '#/components/schemas/UserRef'
            reviewNote:
              type: string
              description: 审批说明；没填不返回本键。
            feeRefunded:
              description: 这笔退款退回商户的手续费，结算币种；还没进结算或不退手续费时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Money'
            callbackDeliveries:
              type: array
              description: 这笔退款向商户回调的投递任务，按建立时间从先到后；没有通知地址或投递记录已过保留期时为空数组。
              items:
                $ref: '#/components/schemas/CallbackDelivery'
    RefundReviewItem:
      type: object
      additionalProperties: false
      description: 退款待审队列的一行。
      required:
        - refundId
        - merchant
        - merchantCode
        - orderId
        - amount
        - entryPoint
        - createdAt
        - status
      properties:
        refundId:
          $ref: '#/components/schemas/RefundId'
        merchant:
          $ref: '#/components/schemas/MerchantBrief'
          description: 订单所属商户。
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
        orderId:
          $ref: '#/components/schemas/OrderId'
          description: 原订单的平台订单号。
        merchantOrderNo:
          $ref: '#/components/schemas/MerchantOrderNo'
          description: 原订单的商户订单号；建单时没传就不返回本键。
        amount:
          description: 退款金额，原订单的标价币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        entryPoint:
          description: 申请从哪个入口发起。
          allOf:
            - $ref: '#/components/schemas/EntryPoint'
        operator:
          description: 申请的商户成员；开放 API、插件发起的没有，不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        createdAt:
          description: 申请时间（退款单创建时刻）。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        note:
          type: string
          description: 退款备注（申请原因）；没有时不返回本键。
        status:
          description: 退款此时的状态：待审为 `REVIEWING`，已拒绝为 `REJECTED`，已通过的是此后的状态。
          allOf:
            - $ref: '#/components/schemas/RefundStatus'
        reviewer:
          description: 下结论的后台用户；待审的不返回本键。
          allOf:
            - $ref: '#/components/schemas/UserRef'
        reviewNote:
          type: string
          description: 审批说明；没填不返回本键。
        reviewedAt:
          description: 下结论的时刻，与 `reviewer` 同有同无。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
    RefundReviewDecision:
      type: object
      additionalProperties: false
      description: 对审核中的退款下结论。审核人取当前登录的后台用户，不在请求里传。
      required:
        - decision
      properties:
        decision:
          type: string
          enum:
            - APPROVED
            - REJECTED
          description: '`APPROVED` 通过 / `REJECTED` 拒绝。'
        reviewNote:
          type: string
          minLength: 1
          maxLength: 256
          description: 审批说明，在退款详情与待审队列展示；可不填。
    RefundReviewResult:
      type: object
      additionalProperties: false
      required:
        - refundId
        - status
      properties:
        refundId:
          $ref: '#/components/schemas/RefundId'
        status:
          description: 退款此时的状态：拒绝为 `REJECTED`；通过后一般为 `CHANNEL_PROCESSING`，通道已给出结果的为 `SUCCESS` 或 `FAILED`。
          allOf:
            - $ref: '#/components/schemas/RefundStatus'
    Mandate:
      type: object
      additionalProperties: false
      description: 一份委托代扣协议。
      required:
        - mandateId
        - merchantMandateNo
        - paymentMethod
        - status
        - createdAt
      properties:
        mandateId:
          type: string
          minLength: 1
          maxLength: 32
          description: 平台协议号。
        merchantMandateNo:
          $ref: '#/components/schemas/MerchantMandateNo'
        channelMandateNo:
          type: string
          minLength: 1
          maxLength: 64
          description: 通道侧协议号；生效后才有，之前不返回本键。
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/MandateStatus'
        activatedAt:
          description: 生效时刻；没生效过不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        validUntil:
          description: 协议有效期截止；无限期或没生效过不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        terminatedAt:
          description: 解约时刻；没解约不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    PaymentMethodFamily:
      type: string
      description: 支付方式族（品牌）。
      enum:
        - wechat
        - alipay
        - unionpay
        - credit_card
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    MerchantOrderNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户单号，同一商户内不可重复。
    MerchantBrief:
      type: object
      additionalProperties: false
      description: 一个商户的标识与名称（列表与记录上展示「哪个商户」）。
      required:
        - merchantId
        - merchantName
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
        merchantName:
          type: string
          minLength: 1
    MerchantCode:
      type: string
      minLength: 1
      maxLength: 20
      description: 对外商户码。
    PartnerId:
      type: string
      minLength: 1
      maxLength: 32
      description: 机构标识。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    PaymentMethod:
      type: string
      minLength: 1
      maxLength: 64
      description: 支付方式目录标识（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，调用方从候选集取来原样回传，按未知值安全处理。
      examples:
        - wechat_instore
    AcceptanceMode:
      type: string
      enum:
        - in_store
        - online
      description: 受理模式：`in_store` 线下 / `online` 线上。
    DeviceId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台设备号。
    RefundId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台退款号。
    RefundStatus:
      type: string
      enum:
        - REVIEWING
        - CHANNEL_PROCESSING
        - SUCCESS
        - FAILED
        - REJECTED
        - CANCELLED
      description: |
        退款状态：`REVIEWING` 平台审核中 · `CHANNEL_PROCESSING` 已送通道、处理中 · `SUCCESS` 成功 · `FAILED` 失败 · `REJECTED` 审核被拒 · `CANCELLED` 已撤销。

        后四种是终态，只有 `REVIEWING` 能撤销。
    RefundFailureReason:
      type: string
      enum:
        - INSUFFICIENT_FUNDS
        - CHANNEL_REJECTED
        - CHANNEL_UNREACHABLE
        - UNCONFIRMED
      description: |
        退款失败的原因。

        | 取值 | 含义 |
        |---|---|
        | `INSUFFICIENT_FUNDS` | 账户资金不足，退款没有送到通道 |
        | `CHANNEL_REJECTED` | 通道明确拒绝 |
        | `CHANNEL_UNREACHABLE` | 退款请求没能送到通道（连接未建立、请求未发出），重提已用尽 |
        | `UNCONFIRMED` | 通道一直没有明确结果，经对账或人工核对确认没有退成 |

        请求已发出而超时、应答丢失、查单查无此单都不算失败，退款留在 `CHANNEL_PROCESSING`，由平台查单与对账收敛。
    MerchantRefundNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户退款号，在订单所属商户内唯一。
    EntryPoint:
      type: string
      description: 入口：`pos` 终端 · `merchant_app` 商户 App · `merchant_portal` 商户后台 · `open_api` 开放 API · `checkout` 收银台页面（店铺码、账单、Product Link） · `channel_inbound` 通道直接推来的订单 · `plugin_shopify` Shopify 插件 · `plugin_allvalue` AllValue 插件 · `plugin_allvalue_xhs` AllValue 小红书 · `system` 系统发起。
      enum:
        - pos
        - merchant_app
        - merchant_portal
        - open_api
        - checkout
        - channel_inbound
        - plugin_shopify
        - plugin_allvalue
        - plugin_allvalue_xhs
        - system
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    UserRef:
      type: object
      additionalProperties: false
      description: 一个平台用户的标识与显示名（列表与记录上展示「谁」）。
      required:
        - userId
        - displayName
      properties:
        userId:
          $ref: '#/components/schemas/UserId'
        displayName:
          type: string
          minLength: 1
  responses:
    AdminBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见管理后台约定与 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    XlsxFile:
      description: Excel 文件（xlsx）
      headers:
        Content-Disposition:
          required: true
          description: '`attachment; filename=...xlsx`（下载；filename 编码 RFC 5987）。'
          schema:
            type: string
        Content-Language:
          required: true
          description: 文件实际用的语言（BCP-47）。
          schema:
            type: string
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
