# 店铺码 —— 调用时序

> 本文是付款人从扫码或点链接到付款结果的完整一条，共用环节见 [00-shared.flows.md](00-shared.html)；接口都在 `/api/checkout/v1` 下。

## 本文的页面

| 页面 | 从哪进 | 本文章节 |
|---|---|---|
| 店铺码收款页 | 扫店铺码；入口接口返回 `productCode = STORE_QR` 且 `state = PAYABLE`、`paymentStarted` 为 false | [页面：店铺码收款页](#页面：店铺码收款页) |
| 支付结果页 | 发起支付之后；刷新或付完回来 | [页面：支付结果 · 收据](#页面：支付结果%20·%20收据)；共用部分见 [00-shared 页面：支付结果](00-shared.html#页面：支付结果) |

图里开头「打开入口地址 → 进入收银台」一段是简图，完整过程见 00-shared 的 [流程：打开入口地址](00-shared.html#流程：打开入口地址) 与 [流程：进入收银台](00-shared.html#流程：进入收银台)。店铺码没有「已付」「已过期」：入口的 `state` 只有 `PAYABLE` 与 `INACTIVE`（码已停用，或商户当前不能用店铺码收款）；码已删除时入口返回 `404`。

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`openQrcodeCheckout`](../checkout/index.html#tag/sessions/operation/openQrcodeCheckout) | `POST /sessions/qrcode/{qrcodeId}` | 入口：建立或认回会话，返回收款页要显示的内容（商户名、Logo、币种、小费档位、采集项、附加说明） |
| 2 | [`listCheckoutPaymentMethods`](../checkout/index.html#tag/order/operation/listCheckoutPaymentMethods) | `GET /order/payment-methods` | 可用支付方式；带上当前金额与小费时每项返回总应付 |
| 3 | [`createCheckoutPayment`](../checkout/index.html#tag/order/operation/createCheckoutPayment) | `POST /order/payments` | 发起支付：店铺码首次发起时随请求带 `storeQr` 块（金额、小费与采集内容），连订单一起建 |
| 4 | [`getCheckoutOrder`](../checkout/index.html#tag/order/operation/getCheckoutOrder) | `GET /order` | 本会话订单的当前状态（结果页、收据） |

---

## 页面：店铺码收款页

一个页面，内容有：商户名与 Logo、金额、小费（商户开了才有）、采集项（商户配了才有）、支付方式、附加说明（商户写了才有）、付款按钮。页面内容一次由入口接口给齐，之后只有两种调用：金额或小费变了重取方式列表，点付款时发起支付。采集项填的内容在点付款之前只在页面里，点付款时随发起支付一起提交。

- **金额**：付款人输入，币种取 `storeQr.currency`，小数位随币种。金额必须大于 0。
- **小费**：`storeQr.tips.enabled` 为 true 时显示。`presets` 是百分比档位，付款人也可以自己填一个金额，或不给。选百分比档时页面按「金额 × 百分比」算出小费金额（四舍五入到币种最小单位），提交的始终是金额；算出来是 0 就不带 `storeQr.tip`。
- **采集项**：按 `storeQr.payerInputs` 的顺序渲染，每项给标题、控件类型、是否必填、是否要再输一遍确认。提交的 `storeQr.collectedFields` 以各项的 `key` 为键、值为字符串（不超过 200 字）。后端校验必填项都有、没有列表外的键，格式只校验后端认识的系统项，自撰项不校验格式。
- **总应付**：页面不自己算。金额或小费变了就带着它们重取方式列表，每项的 `payable` 即选该方式的总应付，`customerServiceFee` 是其中加收的客户服务费（没有加收时不返回）。
- **一次进入只付一笔**：发起支付后金额、小费、采集内容就定在订单上。在这笔订单上再付只有两种：卡被拒或没付完时留在卡表单换卡或重新填卡再付（金额、小费、采集项不能再改）；拉起之后「继续付款」照原来的动作再执行一次。要改金额、小费或换方式，点「重新付款」：页面丢掉本标签页的会话令牌、重新打开入口地址，按一次新的进入处理，回到录入态，下一次付款开一笔新订单；原订单不取消、留到过期。
- **订单从哪一刻算有**：发起支付返回 `200` / `201`（拿到 `CheckoutOrder`）起本会话就有订单了；返回 `400`、`409` 时本会话还没有订单，付款人还可以改金额、小费和采集项再点。

```mermaid
sequenceDiagram
    actor P as 付款人
    participant S as 收款页(SPA)
    participant C as 收银台后端
    participant W as 微信 / 支付宝授权

    Note over P,W: 打开入口地址 → 进入收银台（详见 00-shared）
    P->>C: 扫码打开入口地址<br/>GET /q/{qrcodeId}
    alt 在微信或支付宝里
        C-->>W: 302 渠道静默授权
        W-->>S: 302 页面地址，带 code 与 state
    else 其余环境
        C-->>S: 302 页面地址 /pay/<类型>/<编号>
    end
    S->>C: #35;1 [openQrcodeCheckout]<br/>POST /sessions/qrcode/{qrcodeId}<br/>有授权码就带上
    C-->>S: { state: PAYABLE, productCode: STORE_QR, paymentStarted: false,<br/>presentation: { merchantDisplayName, logoUrl? },<br/>storeQr: { currency, tips, payerInputs, description? } }
    S->>C: #35;2 [listCheckoutPaymentMethods]<br/>GET /order/payment-methods
    C-->>S: { items: [{ checkoutOption, displayName, logoUrl? }] }
    S->>P: 收款页：金额为空，方式已列出，没有总应付

    Note over P,C: 录入
    P->>S: 输入金额、选小费
    S->>C: #35;2 [listCheckoutPaymentMethods]<br/>GET /order/payment-methods?amount=&tip=
    C-->>S: { items: [{ checkoutOption, payable, customerServiceFee? }] }
    S->>P: 按选中的方式显示总应付
    P->>S: 填采集项、改选方式
    S->>P: 换成该方式的总应付，不调接口

    Note over P,C: 付款
    P->>S: 点付款
    S->>S: 本地校验：金额大于 0、必填采集项已填
    S->>C: #35;3 [createCheckoutPayment]<br/>POST /order/payments { checkoutOption, expectedPayable,<br/>storeQr: { amount, tip?, collectedFields? } }
    C-->>S: 201 CheckoutOrder { status, nextAction? }
    S->>P: 按 nextAction 拉起，之后进支付结果页（见 00-shared）

    Note over P,C: 结果页上未成功（UNPAID、EXPIRED、CLOSED）
    S->>P: 给「重新付款」
    P->>S: 点「重新付款」
    S->>S: 丢掉会话令牌，重新打开入口地址
    Note over S: 回到录入态，下一次付款开一笔新订单
```

| 情形 | 接口返回 | 页面动作 |
|---|---|---|
| 金额不大于 0、商户没开小费却带了小费、漏了必填采集项、带了列表外的采集键、系统项格式不对 | `400` 参数校验，`details` 指到字段 | 在对应栏提示；正常情况下本地校验已拦住 |
| 带金额取方式列表，金额不合法 | `400` 参数校验 | 不显示总应付，在金额栏提示 |
| 页面显示的总应付与后端此刻算的不一致 | `409`·`108103`，`context.payable` | 重取方式列表、显示新数，付款人再点一次 |
| 所选方式刚被停用 | `409`·`108102` | 重取方式列表 |
| 合计超过单笔上限 | `409`·`108111`，`context.orderAmountCeiling` 带上限 | 留在收款页，在金额处提示「合计超过单笔上限 {金额}」，改金额或小费再点；刷新后入口的 `paymentStarted` 仍是 false，回录入态 |
| 会话已有订单，请求里又带了 `storeQr` 块 | 不采信，按订单上的金额发起 | — |
| 付款期间码被停用 | 已建的订单照常付完；重新进入时入口返回 `INACTIVE` | 链接状态页 |
| 停留期间商户变为不能用店铺码收款（含已有订单后再发起） | `409`·`108200`，不建订单、不发起 | 提示「商户暂停收款」，不给重试 |

**相对 demo 的改动**

| 位置 | demo | 改后 | 为什么 |
|---|---|---|---|
| 金额 | 输入框在页面上限制最多 99999.99 | 页面不设上限；合计超过单笔上限时发起支付被拒，留在收款页提示上限 | 单笔上限由服务端判，入口不下发，超限时错误里带上限 |
| 成功页 | 有一张推广横幅（下次到店优惠） | 没有 | 商户侧没有这项配置 |
| 收据 | 带「到柜台核销」二维码（内容是订单号） | 没有核销码 | 店铺码付款不产生凭证 |
| 「下载收据」 | 点了下载一个 HTML 文件 | 点了在页面内整页显示收据，保存由付款人自己决定 | 微信内置浏览器很可能下载不了页面生成的文件 |

## 页面：支付结果 · 收据

用 `getCheckoutOrder` 的数据：`amount`（付款人输入的金额）、`tip`、`customerServiceFee`、`payable`，以及付款人填的备注 `payerNote`（填了才返回）。其余采集项不在付款人的结果页和收据上显示，商户在后台订单详情里看。
