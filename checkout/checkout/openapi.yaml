  /sessions/order/{linkToken}:
    post:
      tags:
        - sessions
      operationId: openOrderCheckout
      summary: 用订单链接进入收银台（建立或认回会话）
      description: |
        已有订单的入口（动态码、开放 API 托管页、电商插件订单）：按顶部「会话」一节建立或认回会话，新会话仍是同一笔订单；返回这笔订单的展示内容。

        `state` 按订单当前情况给出：已付或已授权为 `PAID`；已过 `order.expiresAt` 为 `EXPIRED`；已关闭、失败、已取消或被拒为 `INACTIVE`；其余为 `PAYABLE`。

        链接令牌无效或订单不存在，返回 `404`。

        不需要幂等键：重复调用不会产生重复的业务后果。
      security:
        - {}
        - checkoutSessionAuth: []
      x-error-codes: []
      parameters:
        - name: linkToken
          in: path
          required: true
          description: 订单链接令牌，取自入口地址，原样传入（不透明值，不要解析或改写）。
          schema:
            type: string
            minLength: 1
            maxLength: 128
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutEntryRequest'
            examples:
              authorization:
                summary: 渠道静默授权回来
                value:
                  authorizationCode: 081Kf3Ga1yQm2R0zXc3Ga9Bt7t2Kf3Gd
                  state: st_2Km5xZ8cVn4Wq9Ht
              afterPayment:
                summary: 付款后回来
                value:
                  resumeCode: rc_4Tn7Wq2Lx9Hb6Kd3
      responses:
        '200':
          description: 认回同一会话，或没有签发会话
          headers:
            Content-Language:
              $ref: '#/components/headers/ContentLanguage'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderCheckoutEntry'
              example:
                state: PAYABLE
                productCode: JSAPI
                presentation:
                  merchantDisplayName: Example Shop
                  merchantLegalName: Example Shop Inc.
                  supportedLocales:
                    - en
                    - zh-CN
                acceptanceEnv: wechat_internal
                reauthorizeUrl: https://open.example-channel.com/authorize?appid=...&redirect_uri=...&state=st_2Km5xZ8cVn4Wq9Ht
                order:
                  amount:
                    amount: '12800'
                    currency: CAD
                  description: 'Order #42'
                  expiresAt: '2026-09-01T12:30:00Z'
                  merchantOrderNo: SO-20260901-0042
                  cancelUrl: https://shop.example.com/orders/42
        '201':
