  /order:
    get:
      tags:
        - order
      operationId: getCheckoutOrder
      summary: 读当前会话订单的当前状态
      description: |
        本会话那笔订单此刻的状态、金额构成与所用方式，可反复调用。`nextAction` 只返回本会话发起的那次支付的拉起动作，与发起支付时给的是同一个，可重复取。订单已过到期时刻而状态尚未更新时按 `EXPIRED` 返回。

        商品、票务的凭证与礼卡的发放状态、凭证在 `sales` 里，返回条件见各字段。

        本会话还没有订单（店铺码、账单、商品、票务与礼卡会话在发起支付之前）→ `404`。
      x-error-codes: []
      responses:
        '200':
          description: 本会话订单的当前状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOrder'
              examples:
                succeeded:
                  summary: 付款成功
                  value:
                    status: SUCCEEDED
                    orderId: '202608280915001001'
                    amount:
                      amount: '4200'
                      currency: CAD
                    tip:
                      amount: '630'
                      currency: CAD
                    payable:
                      amount: '4830'
                      currency: CAD
                    checkoutOption: card
                    checkoutOptionDisplayName: Credit Card
                    paidAt: '2026-08-28T09:16:42Z'
