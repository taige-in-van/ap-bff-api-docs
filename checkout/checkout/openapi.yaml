  /giftcard/email/otp-challenges:
    post:
      tags:
        - giftcard
      operationId: requestGiftcardEmailOtp
      summary: 给买家邮箱发验证码
      description: |
        给一个邮箱发验证码，返回 `challengeId`；码在 `verifyGiftcardEmailOtp` 提交。只在礼卡会话可用（`state` 为 `PAYABLE`、`INACTIVE`、`EXPIRED` 都行），其余会话 `404`。

        礼卡链接已删除时，只有已有订单的会话可用（还没有订单的会话 `404`），且 `email` 只能是这笔订单的买家邮箱，不是它走通用 `400`。

        - 重发 = 冷却结束后再调一次，拿到新的 `challengeId`，旧码作废；冷却中再调 → `429`·`108324`，剩余秒数在 `context.cooldownSeconds`。
        - 验证码的有效期与重发冷却随返回的 `expiresAt` 与 `cooldownSeconds` 给出。同一邮箱与同一会话的发送次数有上限，超出时返回通用 `429`。
        - 邮箱格式不对走通用 `400`。

        按挑战流程语义不带幂等键。
      x-error-codes:
        - 108324
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutEmailOtpRequest'
            example:
              email: xiaoming.wang@example.com
      responses:
        '202':
          description: 已发码（`deliveredTo` 为脱敏后的那个邮箱）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutOtpChallenge'
              example:
                challengeId: chl_7d3e1a
                deliveredTo: x***@e***.com
                cooldownSeconds: 60
                expiresAt: '2026-12-10T10:41:20Z'
        default:
          $ref: '#/components/responses/DefaultError'
  /giftcard/email/otp-challenges/{challengeId}/verification:
    post:
      tags:
        - giftcard
      operationId: verifyGiftcardEmailOtp
      summary: 提交验证码验证买家邮箱
      description: |
        提交邮件里收到的验证码，`challengeId` 取自 `requestGiftcardEmailOtp` 的返回。只在礼卡会话可用（`state` 为 `PAYABLE`、`INACTIVE`、`EXPIRED` 都行），其余会话 `404`；礼卡链接已删除时只有已有订单的会话可用（发码时已限定为这笔订单的买家邮箱）。

        验证通过后：

        - 这个邮箱记到本会话付款人名下；会话此前认不出付款人的，从此认得出（就是这个邮箱对应的付款人）；
        - 这条礼卡链接下买家邮箱是它、还没有付款人的订单归到本付款人名下，之后出现在「我的订单」里；
        - 本付款人名下因为这个邮箱没验证而没发放的礼卡订单随即继续，发放状态在 `getCheckoutOrder` 或「我的订单」里查；别的付款人名下的订单不受影响。

        验证码：

        - 不对、还有尝试次数 → `400`·`104303`，剩余次数在 `context.attemptsRemaining`，留在原处重输；
        - 这个挑战已过期、已用过或不存在 → `410`·`106300`，重新发码，重输无用；
        - 错的次数用完、这个挑战作废 → `423`·`106301`，重新发码。

        验证通过后挑战即用掉，再提交同一个 `challengeId` 返回 `410`·`106300`。按挑战流程语义不带幂等键。
      x-error-codes:
        - 104303
        - 106300
        - 106301
      parameters:
        - name: challengeId
          in: path
          required: true
          description: 挑战 id，取自 `requestGiftcardEmailOtp` 返回的 `challengeId`。
          schema:
            type: string
            minLength: 1
            maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutEmailOtpVerificationRequest'
            example:
              code: '482915'
      responses:
        '204':
          description: 验证通过
        default:
          $ref: '#/components/responses/DefaultError'
  /giftcard/orders:
    get:
      tags:
        - giftcard
      operationId: listGiftcardOrders
      summary: 我的订单：付款人在这条礼卡链接下已付款的订单
      description: |
        列出本会话付款人在这条礼卡链接下已付款的订单，按付款时刻从新到旧，不带卡号与 PIN。只在礼卡会话可用（`state` 为 `PAYABLE`、`INACTIVE`、`EXPIRED` 都行），其余会话 `404`；礼卡链接已删除时也是 `404`，已有订单而被认回的会话同样如此。

        带 `statusGroup` 时只列发放状态属于这一组的订单，`total` 是筛选后的条数；不带时列全部。

        会话认不出付款人：`409`·`108309`，先验证邮箱再取。
      x-error-codes:
        - 108309
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: statusGroup
          in: query
          required: false
          description: |
            按发放状态分组筛，只给一组；不带时列全部。每组包含的发放状态（取值同列表行的 `fulfillmentStatus`）：

            - `completed` 已完成：`SENT`、`REDEEMED`；
            - `processing` 处理中：`VERIFICATION_REQUIRED`、`PROCESSING`、`ON_HOLD`；
            - `refunded` 已退款：`REFUNDED`。

            `VOIDED`（已作废）不属于任何一组，只在不带本参数时列出。
          schema:
            type: string
            enum:
              - completed
              - processing
              - refunded
      responses:
        '200':
          description: 当页订单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftcardOrderListPage'
              example:
                total: 2
                data:
                  - orderId: '202612101030003008'
                    paidAt: '2026-12-10T10:31:12Z'
                    name: Holiday Gift Card
                    cardValue:
                      amount: '5000'
                      currency: CAD
                    amount:
                      amount: '4500'
                      currency: CAD
                    purchaseMode: self
                    fulfillmentStatus: SENT
                  - orderId: '202611281412003002'
                    paidAt: '2026-11-28T14:13:05Z'
                    name: Holiday Gift Card
                    cardValue:
                      amount: '10000'
                      currency: CAD
                    amount:
                      amount: '9000'
                      currency: CAD
                    purchaseMode: gift
                    fulfillmentStatus: REDEEMED
        default:
          $ref: '#/components/responses/DefaultError'
  /giftcard/orders/{orderId}:
    get:
      tags:
        - giftcard
      operationId: getGiftcardOrder
      summary: 我的订单：一笔订单的详情
      description: |
        「我的订单」里一笔订单的详情；`sales.giftcard` 与 `getCheckoutOrder` 的同名块相同，凭证的返回条件也相同。只在礼卡会话可用（`state` 为 `PAYABLE`、`INACTIVE`、`EXPIRED` 都行），其余会话 `404`；礼卡链接已删除时也是 `404`，已有订单而被认回的会话同样如此。

        不是本会话付款人在这条礼卡链接下的已付款订单（含会话认不出付款人）：`404`。
      x-error-codes: []
      parameters:
        - name: orderId
          in: path
          required: true
          description: 订单号，取自列表某一行的 `orderId`。
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftcardOrderDetail'
              example:
                orderId: '202612101030003008'
                paidAt: '2026-12-10T10:31:12Z'
                amount:
                  amount: '4500'
                  currency: CAD
                payable:
                  amount: '4500'
                  currency: CAD
                checkoutOption: alipay
                checkoutOptionDisplayName: Alipay
                sales:
                  lines:
                    - name: Holiday Gift Card
                      unitPrice:
                        amount: '4500'
                        currency: CAD
                      quantity: 1
                      lineTotal:
                        amount: '4500'
                        currency: CAD
                  giftcard:
                    purchaseMode: self
                    cardValue:
                      amount: '5000'
                      currency: CAD
                    listPrice:
                      amount: '5000'
                      currency: CAD
                    discountAmount:
                      amount: '500'
                      currency: CAD
                    buyerEmail: xiaoming.wang@example.com
                    fulfillmentStatus: SENT
                    alipayPassAvailable: true
                    vouchers:
                      - kind: main
                        voucherNo: '730194826501'
                        pin: '58210437'
                        faceAmount:
                          amount: '5000'
                          currency: CAD
                        qrContent: '{"voucherNo":"730194826501","pin":"58210437"}'
        default:
          $ref: '#/components/responses/DefaultError'
  /giftcard/orders/{orderId}/alipay-pass:
    post:
      tags:
        - giftcard
      operationId: createGiftcardAlipayPass
      summary: 把一笔礼卡订单的凭证存入支付宝卡包
      description: |
        返回一个存入支付宝卡包的地址 `redirectUrl`，每次调用一个新地址。只在礼卡会话可用，`state` 为 `PAYABLE`、`INACTIVE`、`EXPIRED` 都行；其余会话 `404`。不按受理环境拒绝。

        可操作的订单：本会话的订单（会话认不出付款人时也可以），或本会话付款人在这条礼卡链接下的已付款订单（认订单的规则同 `getGiftcardOrder`）；其余 `404`。礼卡链接已删除时只有本会话的订单可用。

        订单此刻不能存入返回 `409`·`108326`：不是自购、凭证还没发放或不向付款人出示、有退款在处理、已作废、已退款，或这张礼卡没有开通支付宝卡包。能存入的订单在 `sales.giftcard.alipayPassAvailable` 为 `true`。

        不需要幂等键：不改订单与凭证。
      x-error-codes:
        - 108326
      parameters:
        - name: orderId
          in: path
          required: true
          description: 订单号，取自订单视图或「我的订单」的 `orderId`。
          schema:
            type: string
            minLength: 1
            maxLength: 32
      responses:
        '200':
          description: 存入支付宝卡包的地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GiftcardAlipayPass'
              example:
                redirectUrl: https://pass.example-alipay.com/add?ticket=9f2c7b1e4a6d8035
        default:
          $ref: '#/components/responses/DefaultError'
components:
  securitySchemes:
    checkoutSessionAuth:
      type: apiKey
      in: header
      name: X-Checkout-Session
      description: |
        收银台会话令牌，由入口接口（`openQrcodeCheckout` / `openOrderCheckout`）在 `grant` 里给出，此后每个请求都在本请求头里带上。
        入口接口上本头可选：带着有效且属于该入口的令牌即认回同一会话。

        令牌只放请求头、不放 URL；入口路径里的是入口编号（静态码编号或订单链接令牌），不是会话令牌。
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |-
        希望用哪种语言渲染**由商户配置的多语内容**（页面说明与条款等）。服务端按本头挑一份，
        挑不中就退到该入口的默认语言；实际给的是哪一种见响应的 `Content-Language`。

        **商户录入的单语文本不随本头变化**（商品名、票档名、活动名这些本来就只有一份）。

        取 BCP-47 语言标记，可带权重列表（如 `zh-CN,zh;q=0.9,en;q=0.8`）。
      schema:
        type: string
        minLength: 2
        maxLength: 256
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  headers:
    ContentLanguage:
      description: 本次返回的多语内容用的是哪种语言（BCP-47）。**必返**——直接据它渲染，不必回退去看自己发的请求头。
      required: true
      schema:
        type: string
        minLength: 2
        maxLength: 64
  schemas:
    CheckoutEntryRequest:
      type: object
      description: |
        回到收银台时地址上带回的值，原样交上来：渠道静默授权回来时带授权码与 `state`，两者同时带或都不带；付款后回来时带 `resumeCode`。不是这两种回来时不带请求体。
      properties:
        authorizationCode:
          type: string
          minLength: 1
          maxLength: 512
          description: 渠道给的一次性授权码，取自回跳地址上的查询参数：微信是 `code`，支付宝是 `auth_code`。 **原样提交**，不要截断、解码或改写。
        state:
          type: string
          minLength: 1
          maxLength: 128
          description: 回跳地址上的 `state`，原样提交。
        resumeCode:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            付款后回到收银台时地址上带回的一次性码，取自页面地址上的 `resume` 参数，原样交上来；只能用一次，只对签发它的那个入口有效。
    CheckoutEntryCommon:
      type: object
      description: 两个入口接口共有的返回字段。
      required:
        - state
        - presentation
        - acceptanceEnv
      properties:
        state:
          type: string
          enum:
            - PAYABLE
            - PAID
            - EXPIRED
            - INACTIVE
          description: |
            这个入口当前能不能付：

            - `PAYABLE` 可付；
            - `PAID` 已付过；
            - `EXPIRED` 已过截止时刻；
            - `INACTIVE` 已停止收款（码停用、链接下架、商户当前不能收这一产品，或订单已关闭、失败、已取消、被拒）。

            遇到未列出的值按不可付处理。
        presentation:
          $ref: '#/components/schemas/CheckoutPresentation'
        acceptanceEnv:
          type: string
          enum:
            - wechat_internal
            - alipay_internal
            - mobile_h5
            - pc
          description: 服务端按本次请求判定的受理环境：`wechat_internal` 微信内 · `alipay_internal` 支付宝内 · `mobile_h5` 手机普通浏览器 · `pc` 电脑浏览器。遇到未列出的值按 `mobile_h5` 处理。
        grant:
          allOf:
            - $ref: '#/components/schemas/CheckoutSessionGrant'
          description: 签发新会话（`201`）或凭 `resumeCode` 认回（`200`）时返回，规则见顶部「会话」一节。
        reauthorizeUrl:
          type: string
          format: uri
          description: 需要付款人标识但没拿到时返回（没带授权码、授权码失效或已用过、会话重建后标识没了）； 此时不签发会话、不返回 `grant`。地址已带好回跳信息，原样使用、不要改写。
        paymentStarted:
          type: boolean
          description: 本会话是否已经发起过支付；本会话的订单已是终态（含被拒绝受理 `REJECTED`）时也为 true。签发或认回会话时都返回；没有签发会话时不返回。
    QrcodeCheckoutEntry:
      description: 静态码入口的返回。
      allOf:
        - $ref: '#/components/schemas/CheckoutEntryCommon'
      type: object
      required:
        - productCode
      properties:
        productCode:
          type: string
          enum:
            - STORE_QR
            - INVOICE
            - PRODUCT_CODE
            - TICKET
            - GIFTCARD
          description: |
            这个入口是哪种产品：`STORE_QR` 店铺码 · `INVOICE` 账单 · `PRODUCT_CODE` 商品 · `TICKET` 票务 · `GIFTCARD` 礼卡。遇到未列出的值按不可付处理。
        storeQr:
          allOf:
            - $ref: '#/components/schemas/StoreQrEntryContent'
          description: '`productCode` 为 `STORE_QR` 时返回。'
        invoice:
          allOf:
            - $ref: '#/components/schemas/InvoiceEntryContent'
          description: '`productCode` 为 `INVOICE` 时返回。'
        product:
          allOf:
            - $ref: '#/components/schemas/ProductEntryContent'
          description: '`productCode` 为 `PRODUCT_CODE` 时返回。'
        ticket:
          allOf:
            - $ref: '#/components/schemas/TicketEntryContent'
          description: '`productCode` 为 `TICKET` 时返回。'
        giftcard:
          allOf:
            - $ref: '#/components/schemas/GiftcardEntryContent'
          description: '`productCode` 为 `GIFTCARD` 时返回。'
    OrderCheckoutEntry:
      description: 订单入口的返回。
      allOf:
        - $ref: '#/components/schemas/CheckoutEntryCommon'
      type: object
      required:
        - productCode
        - order
      properties:
        productCode:
          type: string
          enum:
            - DYNAMIC_QR
            - WEB_PC
            - WEB_MOBILE
            - JSAPI
          description: |
            这笔订单是哪种产品：`DYNAMIC_QR` 动态码 · `WEB_PC` 电脑网页支付 · `WEB_MOBILE` 手机网页支付 · `JSAPI` 渠道内支付。

            电商插件订单不另设取值：Shopify 订单为 `DYNAMIC_QR`；AllValue 订单为网页集成类取值之一（`WEB_PC` / `WEB_MOBILE` / `JSAPI`）。遇到未列出的值按不可付处理。
        order:
          $ref: '#/components/schemas/OrderEntryContent'
    StoreQrEntryContent:
      type: object
      description: 店铺码收款页的内容。
      required:
        - currency
        - tips
        - payerInputs
      properties:
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: 标价币种。付款人输入的金额与小费都是这个币种。
        tips:
          $ref: '#/components/schemas/TipOptions'
        payerInputs:
          type: array
          description: |
            收款页要向付款人收的内容，按展示顺序，前端照单渲染；系统项与商户自撰项对渲染没有区别。空数组表示不收。

            `key` 在本列表内唯一，发起支付时 `storeQr.collectedFields` 以它为键。
          items:
            $ref: '#/components/schemas/PayerInputEntry'
        description:
          type: string
          maxLength: 300
          description: 收款页附加说明；商户没写时不返回本键。
    InvoiceEntryContent:
      type: object
      description: 账单内容。金额固定、付款人不可改。
      required:
        - invoiceNo
        - amount
        - payerInputs
      properties:
        invoiceNo:
          type: integer
          minimum: 10001
          description: 商户与付款人都能看到的账单号。
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 账单标价，不含客户服务费。
        description:
          type: string
          maxLength: 300
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 账单的付款截止时刻（到期日当天在商户所在时区结束的那一刻），过了这一刻不能再发起支付。账单没有期限时不返回本键。
        payerInputs:
          type: array
          description: |
            要向付款人收的内容，按展示顺序，前端照单渲染；空数组表示不收。

            `key` 在本列表内唯一，发起支付时 `invoice.collectedFields` 以它为键。
          items:
            $ref: '#/components/schemas/PayerInputEntry'
    ProductEntryContent:
      type: object
      description: 商品页的内容。
      required:
        - title
        - currency
        - items
        - payerInputs
      properties:
        title:
          type: string
          minLength: 1
        bannerUrl:
          type: string
          format: uri
          description: 页面头图的长效公开地址；商户没设时不返回本键。
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: 标价币种，各可售项的售价都是这个币种。
        items:
          type: array
          maxItems: 10
          description: 商品，按商户创建的顺序给出；商户下架的商品不在列表里。
          items:
            $ref: '#/components/schemas/SalesEntryItem'
        payerInputs:
          type: array
          description: |
            要向付款人收的内容，按展示顺序，前端照单渲染；空数组表示不收。

            `key` 在本列表内唯一，发起支付时 `product.collectedFields` 以它为键。
          items:
            $ref: '#/components/schemas/PayerInputEntry'
        policies:
          type: array
          description: 商户为这个页面写的说明与条款，按请求语言给出；一项都没有时不返回本键。
          items:
            $ref: '#/components/schemas/SalesPolicyEntry'
    TicketEntryContent:
      type: object
      description: 票务页的内容。
      required:
        - eventName
        - eventDate
        - venue
        - currency
        - items
        - payerInputs
      properties:
        eventName:
          type: string
          minLength: 1
        eventDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 活动日期，按字面值显示、不要做时区换算，也不要拿它判断还能不能买票——能不能买看各票档的 `saleStatus`。
        eventTime:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: 开演时刻 `HH:mm`，商户所填的当地时间，按字面值显示；整日活动不返回本键。
        venue:
          type: string
          minLength: 1
        bannerUrl:
          type: string
          format: uri
          description: 页面头图的长效公开地址；商户没设时不返回本键。
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: 标价币种，各票档的售价都是这个币种。
        items:
          type: array
          maxItems: 10
          description: 票档，按商户创建的顺序给出；商户下架的票档不在列表里。票档不返回 `description`、`imageUrl`、`originalPrice`。
          items:
            $ref: '#/components/schemas/SalesEntryItem'
        payerInputs:
          type: array
          description: |
            要向付款人收的内容，按展示顺序，前端照单渲染；空数组表示不收。

            `key` 在本列表内唯一，发起支付时 `ticket.collectedFields` 以它为键。
          items:
            $ref: '#/components/schemas/PayerInputEntry'
        policies:
          type: array
          description: 商户为这个页面写的说明与条款，按请求语言给出；一项都没有时不返回本键。
          items:
            $ref: '#/components/schemas/SalesPolicyEntry'
    GiftcardEntryContent:
      type: object
      description: 礼卡页的内容。
      required:
        - name
        - brandName
        - currency
        - promotionType
        - items
        - payerInputs
        - recipientInputs
      properties:
        name:
          type: string
          minLength: 1
          description: 礼卡名。
        brandName:
          type: string
          minLength: 1
        brandLogoUrl:
          type: string
          format: uri
          description: 品牌 Logo 的长效公开地址；商户没设时不返回本键。
        slogan:
          type: string
          maxLength: 80
          description: 商户没写时不返回本键。
        bannerUrl:
          type: string
          format: uri
          description: 页面头图的长效公开地址；商户没设时不返回本键。
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: 标价币种，各面值档的金额都是这个币种。
        promotionType:
          type: string
          enum:
            - discount
            - bonus_card
          description: '`discount` 折扣 · `bonus_card` 买赠（另送一张赠卡）。决定面值档给的是 `listPrice` 与 `discountAmount`，还是 `bonusAmount`。遇到未列出的值按没有促销处理，只显示 `price`。'
        items:
          type: array
          maxItems: 10
          description: 面值档，按商户创建的顺序给出。
          items:
            $ref: '#/components/schemas/GiftcardEntryItem'
        payerInputs:
          type: array
          description: |
            要向买家收的内容，按展示顺序，前端照单渲染。

            `key` 在本列表内唯一，发起支付时 `giftcard.collectedFields` 以它为键。
          items:
            $ref: '#/components/schemas/PayerInputEntry'
        recipientInputs:
          type: array
          description: |
            送礼时要向收件人收的内容，按展示顺序；自购时不展示。

            `key` 在本列表内唯一，发起支付时 `giftcard.recipientFields` 以它为键；与 `payerInputs` 是两组，同名的 `key` 指的是不同的项。
          items:
            $ref: '#/components/schemas/PayerInputEntry'
        policies:
          type: array
          description: 商户为这个页面写的说明与条款，按请求语言给出；一项都没有时不返回本键。
          items:
            $ref: '#/components/schemas/SalesPolicyEntry'
    SalesEntryItem:
      type: object
      description: |
        商品页的一个商品，或票务页的一个票档。

        `saleStatus` 与 `availableQuantity` 是此刻的值，会随其他付款人的购买而变化，不构成保留；发起支付时会再判。
      required:
        - itemId
        - name
        - price
        - saleStatus
      properties:
        itemId:
          type: string
          minLength: 1
          description: 发起支付时作为 `product.items[].itemId` 或 `ticket.items[].itemId` 原样回传。
        name:
          type: string
          minLength: 1
        description:
          type: string
          minLength: 1
          description: 商品描述；商户没写时不返回本键。
        imageUrl:
          type: string
          format: uri
          description: 商品图的长效公开地址；商户没设时不返回本键。
        price:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 售价，不含客户服务费。
        originalPrice:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 划线价，显示在售价旁；商户没设时不返回本键。
        saleStatus:
          type: string
          enum:
            - ON_SALE
            - SOLD_OUT
            - NOT_STARTED
            - ENDED
          description: |
            这一项此刻能不能买：

            - `ON_SALE` 在售；
            - `SOLD_OUT` 已售罄；
            - `NOT_STARTED` 还没到销售期；
            - `ENDED` 销售期已过。

            先看销售期（`ENDED`、`NOT_STARTED`），在销售期内再看余量（`SOLD_OUT`）。遇到未列出的值按不能买处理。
        availableQuantity:
          type: integer
          minimum: 0
          description: 还能买多少，只作提示；不限量时不返回本键。
    GiftcardEntryItem:
      type: object
      description: |
        礼卡页的一个面值档。

        `saleStatus` 是此刻的值，会随其他付款人的购买而变化，不构成保留；发起支付时会再判。
      required:
        - itemId
        - cardValue
        - price
        - saleStatus
      properties:
        itemId:
          type: string
          minLength: 1
          description: 发起支付时作为 `giftcard.itemId` 原样回传。
        cardValue:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 礼卡面值。
        price:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 实付价，不含客户服务费；取方式列表时作 `amount` 传。前端不要自己拿面值减折扣。
        listPrice:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 折扣前的价格，显示为划线价；只在折扣活动且这一档有折扣时返回。
        discountAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 折扣金额；只在折扣活动且这一档有折扣时返回。
        bonusAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 另送的赠卡面值；只在买赠活动返回。
        bonusNotes:
          type: string
          minLength: 1
          maxLength: 512
          description: 赠卡的使用范围、有效期与限制说明；只在商户另写了赠卡说明时返回。
        saleStatus:
          type: string
          enum:
            - ON_SALE
            - SOLD_OUT
          description: |
            这一档此刻能不能买：

            - `ON_SALE` 在售；
            - `SOLD_OUT` 已售罄。

            遇到未列出的值按不能买处理。
    OrderEntryContent:
      type: object
      description: 这笔订单里付款人需要看到的内容，**都是只读的**。
      required:
        - amount
        - expiresAt
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 下单（出码）时定下的金额，**付款人不可改**，不含客户服务费。
        description:
          type: string
          maxLength: 256
          description: 商户给这笔订单写的说明，**不含逐项明细**。不给则不返回本键。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 订单的付款截止时刻，过了这一刻不能再发起支付。
        merchantOrderNo:
          type: string
          maxLength: 64
          description: 商户单号，供付款人对照。不给则不返回本键。
        cancelUrl:
          type: string
          format: uri
          maxLength: 512
          description: |
            尚未付款或没付成时把付款人导回商户系统的地址：发起支付之前、等待付款结果期间、付款未成功、订单已失效或已关闭时都适用。只用于导航，不代表付款结果。这笔订单没有这个地址时不返回本键。

            付款成功后的跳回用 `CheckoutOrder.returnUrl`，与本键可以是同一个地址，也可以不同。
    CheckoutOption:
      type: string
      minLength: 1
      description: |
        收银台上的支付方式选项（同一品牌、同一付款流程的支付方式归为一项）。取值由服务端给出，前端从 `listCheckoutPaymentMethods` 取来原样回传。

        其中 `unionpay_card` 是银联卡号支付：付款人在本页填卡号、经银联付款，与跳到银联页面付款的 `unionpay_online` 是两项。
      examples:
        - wechat
    CheckoutOptionItem:
      type: object
      description: 收银台上的一个支付方式选项。
      required:
        - checkoutOption
        - displayName
      properties:
        checkoutOption:
          $ref: '#/components/schemas/CheckoutOption'
        displayName:
          type: string
          minLength: 1
          description: 展示名（品牌名）。
        logoUrl:
          type: string
          format: uri
          description: 图标的长效公开地址；没有图标时不返回本键。
        payable:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 选这一项时的总应付（含客户服务费，若有）。会话还没有金额（店铺码、商品、票务、礼卡会话还没有订单、也没传 `amount`）时不返回。
        customerServiceFee:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 选这一项时加收的客户服务费，已含在 `payable` 里。不加收或不返回 `payable` 时不返回本键。
        cardForm:
          allOf:
            - $ref: '#/components/schemas/CheckoutCardForm'
          description: 要在本页填卡的方式（信用卡、银联卡号支付）才返回；其余方式不返回本键。
        savedCards:
          type: array
          description: |
            付款人在这一方式下存过的卡。仅当这一方式支持记住卡、且本会话有可识别的付款人时返回，可以是空数组。

            不返回本键表示这一方式下既不能用已存卡，也不能记住新卡。
          items:
            $ref: '#/components/schemas/CheckoutSavedCard'
    CheckoutCardForm:
      type: object
      description: |
        在本页填卡所需的参数。付款人填的卡信息按 `CardInput` 组成 JSON 对象，用 `encryptionKey` 加密成 JWE 紧凑串，作为发起支付的 `card.methodCredential`（格式见该字段）。
      required:
        - encryptionKey
        - holderNameRequired
        - emailRequired
      properties:
        encryptionKey:
          $ref: '#/components/schemas/CardEncryptionKey'
        holderNameRequired:
          type: boolean
          description: 为 `true` 时发起支付必带 `card.holderName`，用新卡、用已存卡都一样。
        emailRequired:
          type: boolean
          description: 为 `true` 时发起支付必带 `card.payerEmail`，用新卡、用已存卡都一样。
    CardEncryptionKey:
      type: object
      description: |
        加密卡信息用的公钥，RSA 公钥的 JWK（RFC 7517）。整个对象原样交给 JWE 库导入，不要改写。

        公钥会更换，用最近一次方式列表给的这一把即可。
      required:
        - kty
        - kid
        - alg
        - use
        - 'n'
        - e
      properties:
        kty:
          type: string
          enum:
            - RSA
          description: 密钥类型。
        kid:
          type: string
          minLength: 1
          maxLength: 128
          description: 公钥编号，加密时写进 JWE 头的 `kid`。
        alg:
          type: string
          enum:
            - RSA-OAEP-256
          description: 这把公钥用于的密钥加密算法。
        use:
          type: string
          enum:
            - enc
          description: 用途：加密。
        'n':
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: 模数，base64url 编码。
        e:
          type: string
          pattern: ^[A-Za-z0-9_-]+$
          description: 公钥指数，base64url 编码。
    CheckoutSavedCard:
      type: object
      description: 付款人存过的一张卡，只给掩码信息。
      required:
        - savedCardId
        - cardLast4
        - expiryMonth
        - expiryYear
      properties:
        savedCardId:
          type: string
          minLength: 1
          maxLength: 32
          description: 已存卡编号。用这张卡付款时作为发起支付的 `card.savedCardId`，删除时放进路径。
        cardBrand:
          type: string
          enum:
            - VISA
            - MASTERCARD
            - AMEX
            - DISCOVER
            - INTERAC
            - UNIONPAY
            - JCB
            - OTHER
          description: 卡组织。没有记录时不返回本键；遇到未列出的值按 `OTHER` 处理。
        cardLast4:
          type: string
          pattern: ^[0-9]{4}$
          description: 卡号末 4 位。
        expiryMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: 有效期月份。
        expiryYear:
          type: integer
          minimum: 1000
          maximum: 9999
          description: 有效期年份，四位。
    CardInput:
      type: object
      description: |
        卡信息加密前的内容：按本结构组成 JSON 对象，作为 `methodCredential` 那个 JWE 的明文。

        本结构只出现在 `methodCredential` 的密文里，不作为任何请求或响应体直接出现。
      required:
        - number
        - expiryMonth
        - expiryYear
        - securityCode
      properties:
        number:
          type: string
          pattern: ^[0-9]{12,19}$
          description: 卡号，只含数字，不带空格或分隔符。
        expiryMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: 有效期月份，如 `3`。
        expiryYear:
          type: integer
          minimum: 1000
          maximum: 9999
          description: 有效期年份，四位，如 `2029`。
        securityCode:
          type: string
          pattern: ^[0-9]{3,4}$
          description: 安全码，3 或 4 位数字。
    CheckoutPaymentRequest:
      type: object
      description: |
        `checkoutOption` 与 `expectedPayable` 每次都带。

        会话还没有订单时带本产品那一块（块名同入口返回的内容块），订单的金额、选购与采集内容取自这一块，账单的金额取账单；账单没有要填的内容时可以不带，订单入口的会话没有产品块。该带的产品块没带 → `400`。会话已有订单后不带，带了不采信；别的产品的块一律不采信。

        所选方式带 `cardForm` 时带 `card` 块，没带 → `400`；其余方式不带，带了不采信。
      required:
        - checkoutOption
        - expectedPayable
      properties:
        checkoutOption:
          allOf:
            - $ref: '#/components/schemas/CheckoutOption'
          description: 所选方式，取自 `listCheckoutPaymentMethods` 的某一项。
        expectedPayable:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 页面上显示的、所选方式下的总应付，只用于比对：与服务端此刻重算的不一致时返回 `108103`。
        card:
          $ref: '#/components/schemas/CardPaymentInput'
        storeQr:
          $ref: '#/components/schemas/StoreQrPaymentInput'
        invoice:
          $ref: '#/components/schemas/InvoicePaymentInput'
        product:
          allOf:
            - $ref: '#/components/schemas/SalesPaymentInput'
          description: 商品会话所选的商品与采集内容；采集内容的键取 `product.payerInputs[].key`。
        ticket:
          allOf:
            - $ref: '#/components/schemas/SalesPaymentInput'
          description: 票务会话所选的票档与采集内容；采集内容的键取 `ticket.payerInputs[].key`。
        giftcard:
          $ref: '#/components/schemas/GiftcardPaymentInput'
    CollectedFields:
      type: object
      description: |
        付款人填的采集内容。键原样取入口返回的对应 `key`，不要用 `label`；没填的项不带（值不能是空串），确认框的值不带。

        必填项没填、带了列表外的键，或系统项的值格式不对 → `400`；商户自撰项不校验格式。
      additionalProperties:
        type: string
        minLength: 1
        maxLength: 200
    StoreQrPaymentInput:
      type: object
      description: 店铺码会话付款人输入的金额、小费与采集内容。
      required:
        - amount
      properties:
        amount:
          type: string
          pattern: ^[1-9][0-9]*$
          description: 付款人输入的金额，最小币种单位的整数字符串，币种即入口返回的 `storeQr.currency`。
        tip:
          type: string
          pattern: ^[1-9][0-9]*$
          description: 小费金额，格式同 `amount`；没有小费时不带。商户没开小费却带了 → `400`。
        collectedFields:
          allOf:
            - $ref: '#/components/schemas/CollectedFields'
          description: 键取 `storeQr.payerInputs[].key`。
    InvoicePaymentInput:
      type: object
      description: 账单会话付款人填的采集内容。
      properties:
        collectedFields:
          allOf:
            - $ref: '#/components/schemas/CollectedFields'
          description: 键取 `invoice.payerInputs[].key`。
    SalesPaymentInput:
      type: object
      description: 商品、票务会话付款人所选的各项与采集内容。订单金额按所选各项此刻的售价算。
      required:
        - items
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          description: 所选的商品或票档与数量。同一 `itemId` 只出现一次（要买两份就把 `quantity` 写成 2），`itemId` 须是这个页面上的可售项。
          items:
            $ref: '#/components/schemas/SalesSelectionLine'
        collectedFields:
          $ref: '#/components/schemas/CollectedFields'
    GiftcardPaymentInput:
      type: object
      description: 礼卡会话付款人所选的面值档、购买方式与采集内容。订单金额取所选面值档此刻的 `price`。
      required:
        - itemId
        - purchaseMode
        - collectedFields
      properties:
        itemId:
          type: string
          minLength: 1
          description: 所选面值档，取入口返回的 `giftcard.items[].itemId`。一笔订单只买一张。
        purchaseMode:
          type: string
          enum:
            - self
            - gift
          description: '`self` 自购，凭证发给买家 · `gift` 送礼，凭证发给收件人。'
        collectedFields:
          allOf:
            - $ref: '#/components/schemas/CollectedFields'
          description: 买家填的内容，键取 `giftcard.payerInputs[].key`。
        recipientFields:
          allOf:
            - $ref: '#/components/schemas/CollectedFields'
          description: 收件人的内容，键取 `giftcard.recipientInputs[].key`。`purchaseMode` 为 `gift` 时必带；为 `self` 时不带，带了不采信。
    CardPaymentInput:
      type: object
      description: |
        在本页填卡的方式（带 `cardForm`）所需的卡信息。用新卡带 `methodCredential`，用已存卡带 `savedCardId`，两者二选一。

        两者都没带或都带了、`methodCredential` 解不开或解开后内容不完整或格式不对、所选方式要求的 `holderName` 或 `payerEmail` 没带、`browserInfo` 没带 → `400`。
      properties:
        methodCredential:
          type: string
          pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
          contentMediaType: application/jose
          contentSchema:
            $ref: '#/components/schemas/CardInput'
          description: |
            付款人在本页填的卡信息加密后的密文。用新卡付时带，与 `savedCardId` 二选一。

            - 格式：JWE 紧凑串，`alg` 为 `RSA-OAEP-256`，`enc` 为 `A256GCM`，头里的 `kid` 取 `cardForm.encryptionKey.kid`；
            - 明文：按 `CardInput` 组成的 JSON 对象。
        savedCardId:
          type: string
          minLength: 1
          maxLength: 32
          description: 用已存卡付时带，取所选那一项 `savedCards[].savedCardId`。与 `methodCredential` 二选一。所选方式不带 `savedCards` 时不采信。
        rememberCard:
          type: boolean
          description: 用新卡付时是否记住这张卡，不带按不记住处理。所选方式不带 `savedCards` 时不采信。
        holderName:
          type: string
          minLength: 1
          maxLength: 64
          description: 持卡人姓名，按卡面填写。所选方式的 `cardForm.holderNameRequired` 为 `true` 时必带。
        payerEmail:
          type: string
          format: email
          maxLength: 254
          description: 付款人的邮箱，持卡人验证要用，不做邮箱验证。所选方式的 `cardForm.emailRequired` 为 `true` 时必带。
        browserInfo:
          type: object
          description: |
            付款人浏览器的屏幕尺寸，持卡人验证要用。用新卡、用已存卡都带。
          required:
            - screenWidth
            - screenHeight
          properties:
            screenWidth:
              type: integer
              minimum: 1
              description: 屏幕宽度，像素（`screen.width`）。
            screenHeight:
              type: integer
              minimum: 1
              description: 屏幕高度，像素（`screen.height`）。
    CheckoutOrder:
      type: object
      description: 当前会话那笔订单此刻的状态、金额构成与所用方式。
      required:
        - status
        - orderId
        - amount
        - payable
      properties:
        status:
          type: string
          enum:
            - PENDING
            - UNPAID
            - SUCCEEDED
            - EXPIRED
            - CLOSED
            - REJECTED
          description: |
            付款人视角的订单状态：

            - `PENDING` 已发起支付，正在等付款人完成或等支付结果；
            - `UNPAID` 还没付，可以发起或再次发起支付（还没发起过，或最近一次发起没有成功）；
            - `SUCCEEDED` 付款成功；
            - `EXPIRED` 已过付款时限，不能再付；
            - `CLOSED` 订单已关闭，不能再付；
            - `REJECTED` 这笔付款暂时无法完成，不能再付（不给原因）。

            已授权的订单为 `SUCCEEDED`；失败、已取消的订单为 `CLOSED`。遇到未列出的值按「不能再付」处理。
        orderId:
          type: string
          minLength: 1
          description: 订单号，付款人可见。
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 标价金额（不含小费与客户服务费）。
        tip:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 小费；没有小费时不返回。
        customerServiceFee:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 加收的客户服务费，按 `checkoutOption` 那个方式算；不加收时不返回。
        payable:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 总应付 = 标价金额 + 小费 + 客户服务费。
        checkoutOption:
          allOf:
            - $ref: '#/components/schemas/CheckoutOption'
          description: '`status` 为 `SUCCEEDED` 时是付款成功所用的方式；其余状态下是最近一次发起支付所用的方式。还没发起过时不返回。'
        checkoutOptionDisplayName:
          type: string
          minLength: 1
          description: 该方式的展示名，与 `checkoutOption` 同时返回。
        paidAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 付款成功的时刻（预授权订单是授权完成的时刻）；仅 `status` 为 `SUCCEEDED` 时返回。
        returnUrl:
          type: string
          format: uri
          maxLength: 512
          description: |
            付款成功后把付款人带回商户系统的地址；仅 `status` 为 `SUCCEEDED` 且这笔订单有回跳地址时返回（已授权的订单同样返回）。只有经 `openOrderCheckout` 进入的会话可能返回；入口没返回 `order.cancelUrl` 的订单不会有本键。

            有的订单要到付款成功之后才确定回跳地址：`status` 变为 `SUCCEEDED` 时可能还不带本键，稍后才带上。

            原样跳转、不加参数；跳回只是导航，不代表付款结果。
        payerNote:
          type: string
          minLength: 1
          description: 付款人在备注项（`sys:notes`）里填的内容；没填时不返回本键。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 订单的付款截止时刻；仅 `status` 为 `PENDING` 或 `UNPAID` 时返回。
        autoRefunded:
          type: boolean
          description: 为 `true` 表示这笔订单的付款已扣款但没有生效，将原路退回给付款人。只在为 `true` 时返回。
        invoice:
          allOf:
            - $ref: '#/components/schemas/InvoiceOrderBlock'
          description: 这笔订单付的是哪张账单、账单此刻的状态；仅账单会话返回。
        sales:
          allOf:
            - $ref: '#/components/schemas/SalesOrderBlock'
          description: 这笔订单买了什么，以及付款成功后的凭证；仅商品、票务、礼卡会话返回。
        nextAction:
          $ref: '#/components/schemas/CheckoutNextAction'
        lastAttemptFailure:
          type: string
          enum:
            - DECLINED
            - INCOMPLETE
          description: |
            最近一次发起为什么没有成功；仅 `status` 为 `UNPAID` 且发起过支付时返回：

            - `DECLINED` 付款被拒（含持卡人验证没有通过）；
            - `INCOMPLETE` 付款没有完成（付款人没有付完，或这次发起已被关闭）。

            不透传渠道的原始错误文案。遇到未列出的值按 `INCOMPLETE` 处理。
    InvoiceOrderBlock:
      type: object
      description: 账单会话的订单所付的账单。
      required:
        - invoiceNo
        - status
      properties:
        invoiceNo:
          type: integer
          minimum: 10001
          description: 账单号，同入口返回的 `invoice.invoiceNo`。
        status:
          type: string
          enum:
            - UNPAID
            - PAID
            - OVERDUE
            - DELETED
          description: |
            账单此刻的状态：

            - `UNPAID` 还没付清，也没过付款截止时刻；
            - `PAID` 已付清（可能是本笔，也可能是别人付的那笔）；
            - `OVERDUE` 没付清，已过付款截止时刻；
            - `DELETED` 商户已删除这张账单。

            遇到未列出的值按不可付处理。
    SalesOrderBlock:
      type: object
      description: 商品、票务、礼卡会话的订单所买的内容。`lines`、`event` 与 `giftcard` 里的价格是下单时的快照，商户之后改链接不影响。
      required:
        - lines
      properties:
        lines:
          type: array
          minItems: 1
          description: 所选各项；礼卡恒为一行。
          items:
            $ref: '#/components/schemas/SalesOrderLine'
        event:
          type: object
          description: 活动信息；仅票务返回。
          required:
            - eventName
            - eventDate
            - venue
          properties:
            eventName:
              type: string
              minLength: 1
            eventDate:
              allOf:
                - $ref: '#/components/schemas/LocalDate'
              description: 活动日期，按字面值显示、不要做时区换算。
            eventTime:
              type: string
              pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
              description: 开演时刻 `HH:mm`，按字面值显示；整日活动不返回本键。
            venue:
              type: string
              minLength: 1
        voucher:
          allOf:
            - $ref: '#/components/schemas/SalesVoucher'
          description: 商品、票务付款成功且凭证已生成时返回；礼卡不返回。凭证还没生成，或此刻不能向本会话出示时不返回，两者不区分、不给原因；前者稍后再查即可。
        giftcard:
          allOf:
            - $ref: '#/components/schemas/GiftcardOrderBlock'
          description: 礼卡的购买方式、发放状态与凭证；仅礼卡返回。
    GiftcardOrderBlock:
      type: object
      description: 礼卡订单的购买方式、发放状态与凭证。
      required:
        - purchaseMode
        - cardValue
        - buyerEmail
      properties:
        purchaseMode:
          type: string
          enum:
            - self
            - gift
          description: '`self` 自购 · `gift` 送礼。'
        cardValue:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 所买礼卡的面值。
        listPrice:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 折扣前的价格，含义同入口面值档的 `listPrice`，取下单时的值；只在折扣活动且这一档有折扣时返回。
        discountAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 折扣金额，含义同入口面值档的 `discountAmount`，取下单时的值；只在折扣活动且这一档有折扣时返回。
        bonusAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 另送的赠卡面值，含义同入口面值档的 `bonusAmount`，取下单时的值；只在买赠活动返回。
        buyerEmail:
          type: string
          format: email
          description: 买家邮箱。
        recipientEmail:
          type: string
          format: email
          description: 收件人邮箱；仅送礼返回。
        fulfillmentStatus:
          type: string
          enum:
            - VERIFICATION_REQUIRED
            - PROCESSING
            - ON_HOLD
            - SENT
            - REDEEMED
            - VOIDED
            - REFUNDED
          description: |
            发放状态；付款成功后才返回：

            - `VERIFICATION_REQUIRED` 待验证买家邮箱，验证通过后继续发放；
            - `PROCESSING` 正在处理发放；
            - `ON_HOLD` 需人工处理；
            - `SENT` 已发出，未使用；
            - `REDEEMED` 已使用；
            - `VOIDED` 已作废；
            - `REFUNDED` 已退款。

            遇到未列出的值按 `PROCESSING` 显示。
        vouchers:
          type: array
          minItems: 1
          description: 礼卡凭证。只在自购且 `fulfillmentStatus` 为 `SENT` 或 `REDEEMED` 时返回；送礼不返回。此刻不能向本会话出示时也不返回。
          items:
            $ref: '#/components/schemas/GiftcardVoucher'
        alipayPassAvailable:
          type: boolean
          description: 为 `true` 表示这笔订单可以存入支付宝卡包（`createGiftcardAlipayPass`）：自购、`fulfillmentStatus` 为 `SENT` 或 `REDEEMED` 且返回了 `vouchers`、没有退款在处理、这张礼卡开通了支付宝卡包。只在为 `true` 时返回；不含受理环境的判断。
    GiftcardVoucher:
      type: object
      description: |
        一张礼卡凭证。

        `pin` 与 `qrContent` 是使用凭据，只对本会话展示，不要写入日志。
      required:
        - kind
        - voucherNo
        - pin
        - faceAmount
      properties:
        kind:
          type: string
          enum:
            - main
            - bonus
          description: '`main` 主卡 · `bonus` 赠卡。遇到未列出的值照常显示凭证，不报错。'
        voucherNo:
          type: string
          minLength: 1
          description: 卡号或券号，文字显示。没有 `qrContent` 时，页面用本字段生成 Code 128 条码。
        pin:
          type: string
          minLength: 1
          description: PIN，文字显示。
        faceAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 面值。
        bonusAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 同一张凭证一并承载的赠卡面值；只在一张凭证同时承载主卡与赠卡时返回。
        qrContent:
          type: string
          minLength: 1
          description: 二维码内容，含券号与 PIN；只有兑换券有。前端原样生成二维码图，不要解析、拼接或改写。
    SalesOrderLine:
      type: object
      description: 订单里的一项。
      required:
        - name
        - unitPrice
        - quantity
        - lineTotal
      properties:
        name:
          type: string
          minLength: 1
          description: 商品名、票档名，或礼卡名。
        unitPrice:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 单价，不含客户服务费。
        quantity:
          type: integer
          minimum: 1
        lineTotal:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 本项小计 = `unitPrice` × `quantity`。
    SalesVoucher:
      type: object
      description: |
        商品、票务的履约凭证，一笔订单一张，到柜台取货或到现场入场时出示。

        `pin` 与 `qrContent` 是核销凭据，只对本会话展示，不要写入日志。
      required:
        - kind
        - voucherNo
        - pin
        - qrContent
        - status
      properties:
        kind:
          type: string
          enum:
            - counter_pickup
            - admission
          description: '`counter_pickup` 到柜台出示取货（商品）· `admission` 到现场出示入场（票务）。遇到未列出的值照常显示凭证，不报错。'
        voucherNo:
          type: string
          minLength: 1
          description: 券号，文字显示，与 `pin` 一起供手输核销。
        pin:
          type: string
          minLength: 1
          description: 凭证 PIN，文字显示。
        qrContent:
          type: string
          minLength: 1
          description: 二维码内容，含券号与 PIN。前端原样生成二维码图，不要解析、拼接或改写。
        status:
          type: string
          enum:
            - ISSUED
            - REDEEMED
            - CANCELED
          description: |
            凭证此刻的状态：

            - `ISSUED` 可用；
            - `REDEEMED` 已使用；
            - `CANCELED` 已失效。

            遇到未列出的值按不可用处理。
    CheckoutNextAction:
      type: object
      description: |
        拉起支付的动作，由服务端按所选方式与受理环境决定；照 `kind` 取对应字段。
        仅 `status` 为 `PENDING` 且在等付款人完成时返回；没有拉起动作时不返回。
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - jsapi
            - qr
            - app_launch
            - open_in_browser
            - redirect
            - hidden_form
          description: |
            - `jsapi` 在微信 / 支付宝内调起支付窗，带 `sdkParams`；
            - `qr` 显示二维码让付款人用手机扫，带 `qrContent`；
            - `app_launch` 唤起钱包 App，带 `launchUrl`，可能带 `fallbackUrl`；
            - `open_in_browser` 当前环境唤不起所选钱包、需在手机浏览器里打开，带 `launchUrl`，可能带 `fallbackUrl`；
            - `redirect` 整页离开收银台，带 `redirectUrl` 与 `redirectMethod`：`GET` 时直接跳到 `redirectUrl`，`POST` 时把 `redirectForm` 作为表单整页提交到 `redirectUrl`；
            - `hidden_form` 付款人留在本页，在一个看不见的框里把 `redirectForm` 作为表单以 POST 提交到 `redirectUrl`，带这两个字段；提交本身不给页面结果，结果以 `getCheckoutOrder` 为准。

            遇到未列出的值按没有可执行的拉起动作处理，结果以 `getCheckoutOrder` 为准。
        sdkParams:
          type: object
          additionalProperties: true
          description: 渠道要求的调起参数，原样透传，字段由渠道定。仅 `kind` 为 `jsapi` 时返回。
        qrContent:
          type: string
          minLength: 1
          description: 二维码原文，出图由前端本地渲染。仅 `kind` 为 `qr` 时返回。
        launchUrl:
          type: string
          minLength: 1
          description: 唤起钱包的地址。仅 `kind` 为 `app_launch` 或 `open_in_browser` 时返回。
        fallbackUrl:
          type: string
          format: uri
          description: 唤不起钱包时的备用地址。仅 `kind` 为 `app_launch` 或 `open_in_browser` 时可能返回。
        redirectUrl:
          type: string
          format: uri
          description: 跳转或表单提交的目标地址，原样使用；跳转本身不决定结果。仅 `kind` 为 `redirect` 或 `hidden_form` 时返回。
        redirectMethod:
          type: string
          enum:
            - GET
            - POST
          description: 整页跳转的方式。仅 `kind` 为 `redirect` 时返回。
        redirectForm:
          type: object
          additionalProperties:
            type: string
          description: 要作为表单提交的键值，键与值原样使用，不要改写或增减。仅 `kind` 为 `hidden_form`，或 `kind` 为 `redirect` 且 `redirectMethod` 为 `POST` 时返回。
    CheckoutSessionGrant:
      type: object
      description: |
        会话令牌与有效期。每枚令牌只在给出的那一次返回，不能再取回。
      required:
        - sessionToken
        - expiresAt
      properties:
        sessionToken:
          type: string
          minLength: 1
          description: 放在 `X-Checkout-Session` 请求头里，每个请求都带上。
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
    CheckoutPresentation:
      type: object
      description: 各类收银台页面通用的展示内容；产品特有的内容不在这里。
      required:
        - merchantDisplayName
        - merchantLegalName
        - supportedLocales
      properties:
        merchantDisplayName:
          type: string
          minLength: 1
        merchantLegalName:
          type: string
          minLength: 1
          description: 商户法定名称。
        logoUrl:
          type: string
          format: uri
          description: 本入口的 Logo 地址，可直接用于 `<img>`：店铺码是收款页设的 Logo，没设时是商户 Logo；其余入口是商户 Logo。都没有时不返回本键。
        supportedLocales:
          type: array
          minItems: 1
          uniqueItems: true
          description: 该收银台可用语言。
          items:
            type: string
            examples:
              - en
              - zh-CN
              - fr
    TipOptions:
      type: object
      description: 商户的小费设置。`enabled` 为 `false` 时付款人不能给小费，发起支付带了小费会被拒。
      required:
        - enabled
        - presets
      properties:
        enabled:
          type: boolean
        presets:
          type: array
          description: 预设小费档，百分比整数。
          items:
            type: integer
            minimum: 0
    PayerInputEntry:
      type: object
      description: |
        收款页上要向付款人收的**一项内容**。各产品按自己的分组给出若干项，形状一致。

        **`key` 是数据键、`label` 只是文案**：提交填写内容时以 `key` 为键回传，不要用 `label`。
        商户自撰的项，其 `key` 恰好等于商户写的标题（商户改标题就是换了一项）；
        系统固定的项，`key` 是稳定值（一律以 `sys:` 为前缀）、`label` 是给人看的文案，两者不要混用。
        `label` **按拿到的原样渲染**——它是单串，不随语言变。

        **`type` / `needConfirm` 只给前端用**：一个用于选控件与输入限制，一个决定要不要多渲染一个
        「再输入一次」的确认框。**确认框的值不要回传**，前端自己比对即可。
        `type` 是开放取值、会随前端需要增加，**遇到不认识的取值按普通文本框渲染**，不要报错；
        服务端不据 `type` 做校验。

        服务端只校验系统项的值格式，商户自撰项不校验：

        - 邮箱（`sys:email`）须符合通用邮箱格式；
        - 电话（`sys:phone`）只能由数字与常见分隔符（空格、`-`、`+`、括号）组成，长度在合理范围内。

        **`mandatory` 两侧都管**：前端据它做必填校验，服务端在提交时也会再查一遍，缺了就整单拒收。
      required:
        - key
        - label
        - mandatory
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: 提交时的数据键。同一分组内唯一。
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: 展示给付款人的标题。
        type:
          type: string
          minLength: 1
          maxLength: 32
          description: 控件与输入限制提示（如单行文本、邮箱、电话、多行文本）。不给按普通文本框处理。
        mandatory:
          type: boolean
          description: 是否必填。**恒返本键**——它决定这一格能不能空着提交，缺省成非必填会让页面放过一个后端要拒的提交。 服务端在提交时也会查。
        needConfirm:
          type: boolean
          description: 是否要在这一项下面再渲染一个确认输入框并本地比对。不给按不需要处理。
    SalesPolicyEntry:
      type: object
      description: 商户为这个页面写的一条说明或条款，按请求语言返回。
      required:
        - key
        - content
      properties:
        key:
          type: string
          enum:
            - faq
            - customerService
            - privacyPolicy
            - termsOfUse
            - terms
          description: '`faq` 常见问题 · `customerService` 客户服务 · `privacyPolicy` 隐私政策 · `termsOfUse` 使用说明 · `terms` 条款全文。遇到未列出的值不显示这一条。'
        content:
          type: string
          description: 受限 HTML 内容（保存侧已按白名单消毒）。**前端按同一白名单渲染**，白名单外的标签 / 属性不渲染，不要直接注入。
    SalesSelectionLine:
      type: object
      description: 付款人挑的一项及其数量。
      required:
        - itemId
        - quantity
      properties:
        itemId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
          maximum: 9999
          description: 数量，正整数。上界 9999 是防止数值溢出的技术上界，不是限购。
    CheckoutEmailOtpRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: 要验证的邮箱。
    CheckoutOtpChallenge:
      type: object
      description: 发码的返回：本次挑战的 id 与验证码投递信息。
      required:
        - challengeId
        - deliveredTo
        - cooldownSeconds
        - expiresAt
      properties:
        challengeId:
          type: string
          minLength: 1
          maxLength: 64
          description: 挑战 id，提交验证码时放进路径。
        deliveredTo:
          type: string
          minLength: 1
          description: 脱敏后的投递邮箱（如 `x***@e***.com`）。
        cooldownSeconds:
          type: integer
          minimum: 0
          description: 重发冷却秒数；冷却中再发返回 `429`·`108324`。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 这个验证码的过期时刻。
    CheckoutEmailOtpVerificationRequest:
      type: object
      required:
        - code
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/OtpCode'
          description: 邮件里收到的验证码。
    GiftcardOrderListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/GiftcardOrderListItem'
    GiftcardOrderListItem:
      type: object
      description: 「我的订单」列表的一行。
      required:
        - orderId
        - paidAt
        - name
        - cardValue
        - amount
        - purchaseMode
        - fulfillmentStatus
      properties:
        orderId:
          type: string
          minLength: 1
          description: 订单号，取详情时放进路径。
        paidAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 付款成功的时刻。
        name:
          type: string
          minLength: 1
          description: 礼卡名。
        cardValue:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 礼卡面值。
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 这笔订单的标价金额，不含客户服务费。
        purchaseMode:
          type: string
          enum:
            - self
            - gift
          description: '`self` 自购 · `gift` 送礼。'
        fulfillmentStatus:
          type: string
          enum:
            - VERIFICATION_REQUIRED
            - PROCESSING
            - ON_HOLD
            - SENT
            - REDEEMED
            - VOIDED
            - REFUNDED
          description: 发放状态，取值与含义同 `GiftcardOrderBlock.fulfillmentStatus`。
    GiftcardOrderDetail:
      type: object
      description: 「我的订单」里一笔订单的详情。
      required:
        - orderId
        - paidAt
        - amount
        - payable
        - sales
      properties:
        orderId:
          type: string
          minLength: 1
        paidAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 付款成功的时刻。
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 这笔订单的标价金额，不含客户服务费。
        payable:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 付款人实际付的总额，含客户服务费。
        checkoutOption:
          allOf:
            - $ref: '#/components/schemas/CheckoutOption'
          description: 付款成功所用的方式；没有记录时不返回。
        checkoutOptionDisplayName:
          type: string
          minLength: 1
          description: 该方式的展示名，与 `checkoutOption` 同时返回。
        sales:
          allOf:
            - $ref: '#/components/schemas/SalesOrderBlock'
          description: 买了什么与礼卡的发放状态、凭证，同 `getCheckoutOrder` 的 `sales`。
    GiftcardAlipayPass:
      type: object
      description: 存入支付宝卡包的跳转地址。
      required:
        - redirectUrl
      properties:
        redirectUrl:
          type: string
          format: uri
          description: 存入支付宝卡包的地址，由支付宝完成存入；原样使用、不要改写。每次调用给的地址不同。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            paymentId:
              type: string
              description: 失败发生时**订单已建立**的场景下带出的平台侧支付单标识（如被扫同步扣款在通道应答阶段失败）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            merchantMandateNo:
              type: string
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    PositiveMoney:
      description: 正额金额（amount = 最小币种单位正非零整数字符串、currency 同 Money）；schema 化收口「> 0」。用于「划多少」类输入（资金划转额 / 阈值 / 退款额等），金额方向由具体业务操作表达、不用正负号表示；区别于 Money（可正可负，用于余额 / 分录 / 结算净额 / 回冲等账面值）。
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amount:
              type: string
              pattern: ^[1-9][0-9]*$
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
  responses:
    DefaultError:
      description: |
        非 2xx 统一错误响应 —— 覆盖所有未在本 op 显式列出的状态码。

        HTTP status 只表达大类;**具体子因看响应体的整数 `code`**:该 op 承诺的业务码见其 `x-error-codes`,
        每个码的含义 / 调用方动作 / 可重试性见所属能力域的错误码表;码的构成(能力域段 · 责任方位 · 域内末段)
        见 00-骨干/07-API契约规范「错误码空间分配」。

        部分码另带 `context` 结构化上下文;**哪些码必带哪些字段,以码表的 `requiredContextFields` 为准**、不要按状态码猜。

        **仅当某状态码的响应体形状真正偏离本信封时**,该 op 才另行显式声明该状态码;「某个码必带某个 `context` 字段」**不属于**形状偏离。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
