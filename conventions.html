# API 基础约定（先读）

> 所有 BFF / 前端面 API 共用的基础约定 —— 进任何模块 spec 前先读这一份。各模块 `openapi.yaml` 的字段类型以该 spec 为准；本文讲的是**跨模块一致的公约**（错误体 / 分页 / 幂等 / CSRF / 状态码 / 时间金额）。
>
> ⚠️ **design / review 阶段**约定 —— 实现前可能调整，可据此并行开发，勿当冻结契约。本约定、各份 spec 与 flows 都处在这个阶段。

## flows 怎么读

接口本身（收什么、返回什么、什么时候拒绝）看各份 spec；每个页面先调谁、后调谁、各种结果页面怎么处理，看 flows。spec 按资源分文件，flows 按页面分文件，两者不一一对应：一份 flows 会用到几份 spec 的接口。

- **视角**：图里只画浏览器（SPA）与 BFF，BFF 内部怎么实现不画。外部参与方（邮箱、微信、验证器、收款设备）只在用户真要去那边操作时出现。审核、通道处理、设备首次登录这类由系统推动的状态变化，前端靠重新读取看到。
- **开头两张表**：先是本文覆盖的页面（页面、从哪进、对应哪几节），再是本文用到的接口（`op#`、`operationId`、方法与路径、用途）。页面之间前后连着走的（如登录注册、入驻），两张表之间另有一节「页面流转」，用一张图画出从哪一页、点什么、去哪一页。
- **`op#`** 是本份 flows 内的接口编号，同一个接口在本份所有图里用同一个号；图里写成 `#n [operationId]`，正文里写 `#n`。不同 flows 的编号互不相干。
- **`operationId`** 就是生成客户端的方法名（见「接口命名」）。接口表与正文里的可以点，直达该接口所在 spec 的文档；图里的受 Mermaid 限制不能点，点表里同名的那个即可。
- **章节标题**：`页面：<页面名>`，或 `页面：<页面名> · <页面里的哪一块> <弹窗 / 页签 / 区块>`，名字照界面上显示的写；不是页面的写成 `流程：…`。
- **失败情形**列在图下的表里；「相对 demo 的改动」只列产品行为与 demo 不同的地方。
- 本文其余各节（会话、CSRF、当前商户、错误体、分页、幂等等）对每份 flows 都成立，flows 里不重复；某份 flows 有自己特有的前提时，在它开头写明。

## 编码与内容类型

- 字符集 **UTF-8**；请求 / 响应体默认 `application/json`；请求头带 `Accept: application/json`。
- 浏览器直接打开 `openapi.yaml` 若中文显示乱码（`å•†æˆ·`…），是浏览器把 UTF-8 内容按 Latin-1 猜了 charset，**文件本身没问题**——用 ReDoc 页面看、或下载后用 UTF-8 编辑器 / 直接喂 codegen 即正常。

## 鉴权与 CSRF

- **会话**：登录成功后 BFF 下发 httpOnly opaque 会话 cookie（`__Host-msession`，`Secure` + `SameSite=Lax`）；**浏览器不持 token**（服务端持后端 token），前端拿不到也不需要。
- **CSRF**：以 cookie 承载会话的面，非安全方法（POST / PUT / **PATCH** / DELETE）一律带 `X-CSRF-Token`（double-submit）；缺失 / 不匹配 → `403` fail-closed。
  - **取值**：建会话时 BFF 同时下发**可读**伴生 cookie `__Host-mcsrf`（非 httpOnly、与会话同生命周期、同 path）。每次发非安全方法请求时从该 cookie 读出、**原样**放进 `X-CSRF-Token`。
  - **不要缓存该值**：会话轮换时（登录 / 改密后重建会话）两个 cookie 一起换，每次从 cookie 现读。
- 公开端点（注册 / 登录 / 找回等 `security: []`）无会话、故无 CSRF。

## 应用启动链路（bootstrap，登录 / 扫码后必走）

登录 / 微信扫码成功 → BFF 建立会话（set-cookie，httpOnly opaque `__Host-msession`）。会话建立后 FE 按**固定链路**初始化，**不要依赖登录响应直接携带 merchantId 或路由**：

1. `getCurrentSession`（`GET /auth/sessions/current`）→ 取 `merchantId`（当前商户内部 id，必返）、`privileges`（可见权限点集合，导航 / 入口 / 按钮 / 只读态一律查它）。每个接口要哪个点看它的 `x-required-privilege`：是权限点就查集合里有没有；`session` 任何已登录者都能调；`owner` 只有当前商户的 Owner 能调（`isOwner`），不在集合里。不要按 `roleNames` 写判断：角色随部署配置而变，写死角色名的判断换了配置会静默失效。返回 `403`·`208028` 时会话已被服务端结束，回登录页显示提示。
2. `listMerchants`（`GET /merchants`）→ 当前商户**在列表里**就按它的 `status` 分流：`ACTIVE` 进商户后台，`DRAFT` / `MORE_INFO_REQUIRED` 进入驻向导，`UNDER_REVIEW` 进审核状态页；**不在列表里**（被拒的商户不进列表）调 `getOnboardingApplication`（`GET /merchants/{merchantId}/application`），`REJECTED` 进拒绝结果页——申请接口按「登录者名下的商户、未删除」授权，比列表宽，被拒、已冻结的商户也能读。
3. 进商户后台时落 Dashboard；按 `privileges` / `visibleModules` 看不到 Dashboard 时，落侧边栏里第一个能看到的页面（前端自行决定，服务端不下发落地页）。

> 当前商户在会话期间被冻结或删除时，由服务端在下一次 `getCurrentSession` 换一个，或在一个都取不到时结束会话（`208028`），前端不做判断。
>
> 邮箱激活不建会话：激活成功后用户回登录页用密码登录，再从第 1 步起步。

## 当前商户

商户后台**单会话单当前商户**；会话当前商户 = merchant scope **唯一权威**（服务端不信请求体里的 merchantId），请求不另带商户标识。以商户本身为操作对象的接口（入驻申请 `/merchants/{merchantId}/application`、删除商户 `DELETE /merchants/{merchantId}`）在路径里带 `merchantId`，那是操作对象、不是上下文，不改变也不依赖当前商户。

- **当前商户只会是已激活的商户，或首次入驻中 / 被拒的主商户**：`switchCurrentMerchant` 只切到 `ACTIVE` 商户；切换器里未激活的关联商户不切换，带它的 `merchantId` 进入驻向导或审核状态页。这两个页面的出口按当前商户判：当前商户 `ACTIVE`（从切换器进来）给「回首页」，否则（首次入驻）给「回登录页」。

- **当前商户不可访问**时，依赖当前商户的接口返回 `409`·`208022`（`MERCHANT_NOT_ACCESSIBLE`），处置同「商户可访问性」一节：**重跑启动链路、重新分流**。
- **取不到当前商户**时（登录时，或重跑启动链路时），返回 `403`·`208028`（`NO_USABLE_MERCHANT`）：回登录页显示「商户状态异常，请联系客服」。
- **多标签页**：切换商户（`switchCurrentMerchant`）后，用浏览器的跨标签页广播（如 `BroadcastChannel`）通知其他标签页刷新到新的当前商户。
- **新建类操作的结果页回显商户名**，让用户看得到这条记录建在了哪个商户下。

## HTTP 状态语义

用 HTTP status 表达请求结果，**语义即 RFC 原义**（本文不复述）；非 `2xx` 时响应体只返 `ErrorEnvelope`（见下）。下表列两类内容：本平台**做了收窄或借用**的口径，以及该状态下的**通用失败码**（90 段，不带业务专属文案的兜底码）。同一状态还会承载各接口自己的业务码（如 `403` 另有登录态重输因子错、无可用商户等），表里不穷举——**分流一律按 `code`**（见下「怎么读 `code`」）。

| status | 本平台口径 / 通用失败码 |
|---|---|
| `400` | 登录 / 二次校验的**凭据输错**走这里，**不走 `401`**（见下「凭据错 ≠ 会话失效」）。通用失败码：字段校验不合法 `904001`（逐字段错误在 `details[]`）、请求体无法解析、Content-Type 不支持、方法不被允许、Accept 无法满足或缺必填的 `Idempotency-Key` `904002`（415 / 405 / 406 不单独返回） |
| `401` | **只表会话失效**（`906001`）→ 跳登录页。凭据输错不占 `401` |
| `403` | 通用失败码：CSRF token 缺失或不匹配 `906002`（见「鉴权与 CSRF」）、缺权限点 / 非 Owner `906003` |
| `404` | 通用失败码：资源不存在 `908001`（跨 scope 同此，见下） |
| `409` | 除资源状态冲突外，**幂等键 payload 冲突**（`908003`）与同键首次请求还在处理（`908002`）也走这里（见下「幂等」） |
| `410` | **一次性凭据失效**：OTP / 验证链接 过期或已用 → 回第一步重新发起 |
| `423` | **账号临时锁定**（连续失败防爆破）→ 等冷却 |
| `429` | 通用失败码：限流 `906004` → 稍后重试 |
| `5xx` | 通用失败码：未预期异常 `500`·`905001`、依赖不可用 / 维护中 `503`·`905002`（可稍后重试） |

**跨 scope 的资源一律 `404`**（不区分「这东西不存在」与「它不属于你」）——反枚举。所以拿到 `404` 时**不要**据此推断资源是否真的存在、更不要提示用户「无权访问该资源」；按「找不到」处理即可。

**列表 / 详情类读接口不做部分成功**——不会返回半截列表或缺列的详情，失败即整份响应失败。所以 FE 按整块降级（如展示「暂不可用」+ 重试入口），不必去判断"这批数据是不是只回来一半"。

**例外：响应体内显式声明分块状态的端点**（如各区块带 `status: available | unavailable`、或带 `degraded` 标志）——这类端点**单块失败仍返 `200`**、其余块照常渲染，FE 须**逐块判别**。哪些端点如此、各块怎么判，以该端点自身的契约为准。

## 错误响应体 `ErrorEnvelope`

非 `2xx` 统一返回：

| 字段 | 类型 | 说明 |
|---|---|---|
| `code` | integer | 结构化整数错误码，**与 HTTP 状态正交**——**分流一律按 `code`**，HTTP status 只作大类（见下「怎么读 `code`」）|
| `detail` | string | **诊断描述**——给排查用（日志 / 客服 / 配合 `traceId`），**不做本地化、不要直接展示给用户**。用户可见文案：按 `code` 查码表取 `name` 当 i18n key，从你自己的多语言资源渲染 |
| `links` | object（可选） | 错误说明 / 后续恢复操作链接 |
| `traceId` | string（可选） | 串联日志 / 分布式 trace，出错可直连诊断 |
| `details` | array（可选） | 字段级校验错误 `[{ field, issue }]`，把错误定位到具体字段 |
| `context` | object（可选） | 该错误专属的结构化上下文（如验证码输错、还能重输时回显 `attemptsRemaining`、冷却回显 `cooldownSeconds`）。**哪些码必带哪些字段，见码表的 `requiredContextFields`**——不要按状态码猜 |

必填仅 `code` + `detail`。

### 怎么读 `code`

**随包发了一份错误码表 `error-codes.json`**（在 payload 根目录，与 `conventions.html` 同级）。它给的是**码的固有属性**——不随调用点变的那部分：

| 字段 | 拿它做什么 |
|---|---|
| `name` | 符号名，**直接当 i18n key**：用户看到的文案由你从自己的多语言资源渲染，不要显示服务端返回的 `detail` |
| `httpStatus` | 该码对应的 HTTP 状态。每个 op 只声明 `responses.default`，status ↔ code 的映射只能在这里查 |
| `retryable` | 原样重发同一个请求（同参数、同幂等键）有没有可能成功，即是否属瞬时故障；据此决定要不要自动重试。改了输入再提交（如验证码输错后重输）不算重试，怎么处置看返回该码的接口说明 |
| `requiredContextFields` | 该码必带哪些 `context` 字段 |

**「这个码什么时候出现、你该怎么处理」不在码表里，看返回它的那个接口的说明**——同一个码在不同接口下的成因与正确处置可以不同（例：状态冲突类的码，在删除类接口上是「重拉最新状态再试」，在创建类接口上是「把冲突字段标红、别重试」）。所以码表只回答「这个码是什么」，接口文档回答「在这儿它意味着什么、你该做什么」。

每个接口的 `x-error-codes` 列的是**该接口特定的业务码**；通用失败（未认证 / 无权 / 限流 / 上游不可用等）不逐个列，按下面的责任方策略兜底即可。

**码表里查不到的码**（新增码、或本次未随包的域）按结构解析——码 = `XX`（能力域段）+ `Y`（责任方位）+ `ZZZ`（域内末段）：

| `Y` | 责任方 | 含义 | 前端策略 |
|---|---|---|---|
| `4` | 客户端·参数校验 | 报文 / 参数 / 格式 / 正则不合法（不含业务冲突） | 提示输入错误，结合 `details` 定位字段 |
| `5` | 服务端·内部 | 内部异常 / 基础设施不可用 / 资源耗尽 | 提示系统繁忙，允许重试 |
| `6` | 客户端·权限安全 | 令牌失效 / 签名失败 / 无权操作 | 跳登录或提示无权访问 |
| `7` | 第三方·外部服务 | 微信 / 支付宝 / 银联等超时或返回失败 | 提示渠道繁忙或透传渠道错误 |
| `8` | 业务·资源 | 请求合法但业务状态不满足 / 资源不存在 | 展示业务错误文案 |

**一次性挑战（OTP / 验证链接 / TOTP）的失败码**，各入口用同一套：

| 情形 | 码 | 你该做什么 |
|---|---|---|
| 挑战过期 / 已消费 / 无效 | `410`·`206006` | 回第一步重新发起，**重输验证码无用** |
| 该挑战错误尝试超限、已作废 | `423`·`206007` | 回第一步重新发起，或按提示等冷却 |
| 凭据 / 因子输错，会话仍有效，且这次校验**没有尝试预算** | `403`·`206011` | **留在当前弹窗提示重输，不要跳登录页**；没有剩余次数可显示 |
| 验证码 / 因子输错，且这次校验**有尝试预算、尚未用完** | `400`·`204010` | 留在原处重输；剩余次数见 `context.attemptsRemaining`，用完则转 `423`·`206007` |
| 重发过于频繁 | `429`·`208013` | 按冷却秒数倒计时后才允许再发 |

⚠️ **有没有尝试预算是那个接口的事，不是因子类型的事**——**一律以该 op 的 `x-error-codes` 是否登记 `204010` 为准**，没登记就不会有剩余次数可显示，别做一个恒为空的计数 UI。共用的 OTP 输入组件请把「剩余次数」做成可选呈现。

**凭据错 ≠ 会话失效**——**`401` 只有一个含义：会话本身失效 → 跳登录页**，统一 interceptor 照此处理即可。「输错了」一律不是 401：

| 什么时候 | 码 | 你该做什么 |
|---|---|---|
| **登录 / 登录二次校验**输错（密码 / TOTP） | `400`·`206012` | 留在当前输入框重输，**不跳登录页、不跳回第一步、不清空已填状态** |
| **登录态**重输当前密码 / TOTP（改密、启停 MFA 等 step-up） | `403`·`206011` | 留在当前弹窗重输，不跳登录页 |

例：`208002` → `XX=20`、`Y=8`（业务·资源）、`ZZZ=002`；`204010` → `Y=4`（参数校验）。

**兜底次序**：先查码表 → 查不到就按 `Y` 位落默认策略 → 都不行才退到 HTTP status 大类。**不要把 `detail` 当分支依据**（它是诊断串、措辞随时会变）。

## 商户可访问性（区域分流）

**当前商户能不能进某个区域，由启动链路裁决**（见上「应用启动链路」）：商户不是 `ACTIVE` 时，会按入驻申请状态被送去入驻向导 / 审核状态页 / 拒绝页，**根本走不到**商户后台内的业务页面。所以：

- **不要从业务端点的错误响应去推断「商户是不是激活了」**，也不要在各页面各自判一遍——启动链路已经裁决过。
- **兜底路径**：深链直接进某个业务页、或切商户后状态变了，仍可能在非可访问态调到业务端点。此时服务端返 **`409` · `208022`**（`MERCHANT_NOT_ACCESSIBLE`），**你的动作固定是重跑启动链路、重新分流**，不要跳登录（会话是好的）、也不要提示「无权访问」。

## locale 与本地化

**谁渲染，谁负责本地化**：

- **前端渲染的一切**（页面文案、按钮、状态徽章、错误提示）用你自己的多语言资源；契约里写死的封闭枚举（状态、类型等）只给码，展示名由前端按码从这里取。
- **所有请求统一带 `Accept-Language`**（BCP-47，页面当前的语言），由统一请求层加，不必逐个接口考虑。它只在三处起作用：
  - **后端产出的文件**（PDF / Excel 导出）——你拿不到渲染现场，所以这类端点按它渲染（取最接近的语言，如 `fr-CA` → `fr`；没有匹配的依次回退到账号的界面语言、商户语言），并在响应回 `Content-Language` 告诉你实际用了哪种语言（**以响应头为准，不要回退去猜请求头**）。哪些端点如此，见各端点参数说明。
  - **账号第一次确定界面语言**——注册、邀请设密、登录时账号还没有语言偏好，就用它记下；之后不再看它。
  - **给还没有语言偏好的账号本人发的邮件**（如找回密码验证码）——用它的语言发；账号有语言偏好时不看它。
- **界面语言是账号的偏好**：登录后按会话返回的 `locale` 显示（换设备也跟着账号走），顶栏切换语言时调 `updateMyProfile` 存回去。登录前的页面按浏览器本地的选择。
- **邮件 / 通知**由后端渲染：发给某个人本人的按这个人的 `locale`（还没有时见上），发给商户的按商户语言。
- **商户自己录入的多语言内容**（如 Payment Link 的 FAQ / Policy）是**数据**不是 locale 问题——字段本身按语言分组返回，按当前语言取用即可。
- **平台配置里的候选**（`/config/*`：省州、行业、MCC 等）带 `label: { en, zh, fr }`，按当前语言取，缺该语言回落 `en`。资料、申请等业务数据里这些字段只给码，展示名拿码到对应 `/config/*` 里查。`/config/*` 需要时就调，前端不必缓存。省州项（无省州的国家项）另带 `timeZones`：IANA 标识、不带 label，是时区候选。
- **格式类规则**（区号、邮编、上传格式与大小）用前端参考数据先拦一道，服务端按同一规则校验、以服务端为准。

## 接口命名（operationId）

`operationId` 就是生成客户端的方法名，看动词就知道返回什么形状：

- `list…`：集合，返回 `{ items }` 或 `{ total, data }`（见「分页」）。
- `get…`：单个对象或单例；`get…Counts` 是 chip 计数，`get…Summary` 是汇总。
- `create…` / `update…` / `delete…`：新建、修改、删除。
- `upload…File`：上传文件，返回 `fileId`，交给对应的写接口生效（见「文件上传」）。
- CRUD 表达不了的用业务动词：`login`、`submit`、`resend`、`verify`、`confirm`、`change`（改密码、PIN）、`disable` 等；扫码是 `initiate…` 发起 + `poll…` 轮询；发验证码或确认邮件的第一步是 `request…`。

## 未保存的修改

表单有未保存的修改时，用户要离开就先确认，不静默丢弃：

- 切 tab、点侧边栏或返回、关弹窗或编辑卡（X、遮罩、Cancel）时，弹站内确认框「放弃未保存的修改？」，按钮「放弃修改」/「继续编辑」。不用浏览器原生确认框。
- 刷新页面、关闭浏览器标签页时，用 `beforeunload` 兜底，那一步只能是浏览器自带的提示。
- 「有未保存的修改」= 当前表单值与上次从服务端读到（或新建时的初始值）不同；只打开编辑态、没改任何东西不算。
- 已上传、尚未随保存提交的文件不用前端清理：放弃后它不被引用、不生效（见「文件上传」）。

各页在 flows 里注明哪些操作会触发确认。

## 更新语义（PUT）

- 更新已有资源一律 **PUT + 部分更新**：请求体里**未出现的字段保持原值**。所以「只改一个字段」就**只传那一个字段**，不必先读全量再原样回传。
- 要**清空**某个字段就**显式传 `null`**。哪些字段能清空看 schema 即知——能清的类型是 `[T, "null"]`，不能清的不接受 `null`。
- **数组整组置换**：传空数组 = 清空该集，不传 = 保持原集；**不做逐元素合并**（想「加一项」要把完整的新集合传上来）。
- **嵌套对象递归合并**（本节规则逐层适用）；要把整段清空则该段传 `null`。
- ⚠️ 有些 PUT 的请求体**就是目标本身**——置一个开关、换一把密钥、整体置换一套规则。那种没有「其余字段」可言，本节不适用，按该端点的 schema 提交即可。**怎么认：只看该端点自己的说明**——这类 op 会在 description 里明写「全量覆盖、缺省不代表保持原样」之类。**别从端点名或 schema 形状去推**：名字（`set*` / `update*` …）和「是不是全字段必填」都会判错，本节默认（部分更新）只在端点没有相反声明时成立。

## `null` 只出现在请求里

**响应里不会有 `null`。**「这个字段没有值」一律表达为**键不存在**——不要写 `if (x === null)`，判 `x === undefined` 或 `!('x' in obj)`。

- 所以**看到 `[T, "null"]` 就知道那是给你填的**：它是「这个字段可以被清空」的标记，只在请求体里有意义（上一节）。
- 反过来，**响应 schema 里字段不在 `required` 里 ≠ 它多半是空的**。`required` 是校验约束，不是出现频率的提示；某个字段实际上几乎总有值、只是存在一种它不适用的情形，这在契约里同样表现为「不必填」。什么时候不返回，看该字段的 description。
- 少数字段的「没有值」本身**带含义**（例如一行汇总数据代表的是「全部」而非某个具体状态）。这类不会靠 `null` 传达，而是用**独立的字段或不同的响应形状**表达，读 schema 即知。

## 分页

列表查询统一：

- 请求：`pageNum`（默认 **1**，从 1 计）、`pageSize`（默认 **20**；上限可配置）
- 响应：`{ total, data[] }`（`total` 总记录数，`data` 当页记录数组）
- 排序：`sortField` + `sortOrder`，规则见下。

不分页的集合（商户列表、角色候选、店铺码、`/config/*` 候选集等）一律返回 `{ items: [...] }`。所以看键名就知道形状：`data` = 分页、带 `total`；`items` = 全量、不分页。

## 排序

分页列表统一两个参数（对应表格排序控件的 `{ field, order }`）：

- `sortField`：可排字段，每个端点自己列封闭 enum，取值 = 该列表行的字段名。
- `sortOrder`：`ascend` / `descend`。

- 不传 `sortField` → 不排序（顺序不承诺）。**页面的默认顺序由前端显式传**（如成员列表默认最新创建在前，就传 `sortField=createdAt&sortOrder=descend`），后端没有「默认排序」。
- 传了 `sortField` 未传 `sortOrder` → 升序。
- `sortField` 不在 enum 内 → 静默当作没传，不报错。
- 空值恒排末尾，升降序都一样（如「从未登录」的成员按最近登录排序时总在最后）。
- 同值行顺序稳定，翻页不重不漏。
- 金额按数值比较、不分币种。
- 固定顺序的列表（如账户流水固定按过账时间倒序）没有这两个参数。

## 列表页顶部的快捷筛选（chip）

**所有带 chip 的列表形状一致，前端只需写一个 helper。** 列表本身只返 `{ total, data }`，chip 的项与数字另取一个 `…/counts` 端点，返回 `{ items: [ { value, label, count } ] }`（spec 里的共享 schema `QuickFilterCounts`）。

**照着 `items` 渲染，不要自己枚举取值。** 项集、顺序、展示名、数字全部由服务端给出——状态、类型这类固定枚举与角色这类由配置决定的，走的是同一个契约，前端一视同仁。某项当期为 `0` 也会返回（那一格不该因为没数据就消失），所以不用自己补空位。只有不分页的列表（如月对账单的年份）才由前端在全量数据上自己算 chip。

**chip 就是列表的一个筛选参数**，没有特殊机制：

- 选中某项 → 把该项的 `value` **原样**放进对应列表端点的那个筛选参数（`value` 对你不透明，别解析、别拼接、别据其分支）。
- **选 `All` = 不带这个参数**。`All` 不是一个取值。
- **`All` 那一项由你自己补**，数字 = 其余各项之和。服务端保证 `items` 覆盖该列表不带本维筛选时的全部命中，所以这个和恒等于此时列表的 `total`。例外：一行可落进多项的集合（如成员的角色），计数接口另给总数，`All` 取它、不用各项相加。

**`label` 是兜底**：有自己的多语言资源就按 `value` 取用，没有（角色名这类）就直接显示它。

**两个别踩的**：

- ⚠️ **counts 端点不收被计维度那个参数**，其余筛选要与列表**传同一组**。切筛选时列表和 counts 一起重发；只重发列表，chip 上的数字就跟列表对不上了。
- ⚠️ **翻页不必重取 counts**——它按整个命中集算，与 `pageNum` / `pageSize` 无关。

**一页有几个带数字的筛选控件时**（如销售单的状态、核销状态、风险等级），counts 端点一次返回几个数组，键名 = 列表的筛选参数名，每个数组里的项还是 `{ value, label, count }`。这种端点**收齐和列表相同的全部参数**（含被计的那几个维度）；服务端算某一维度时忽略该维度自己的筛选、其余照算，所以每个数字都等于「只把这一项换成选中」之后列表的 `total`。切任一筛选，列表和 counts 一起重发。

## 幂等

- **创建类 / 非天然幂等的写**（如改密〔失效其他会话〕、有副作用的写）：带 `Idempotency-Key`（header）去重。**声明了该参数的端点一律必填**——缺键 → `400`（`904002`；可选就等于「客户端不发即无幂等」，故不设可选）。
- **天然幂等的 PUT / DELETE**：不声明本参数、也不必带（按业务单号或目标状态天然去重）。
- **认证类（登录 / 登出 / MFA / 扫码）与多步 OTP 挑战类（改邮箱 / 找回）、注册（按注册邮箱去重）与凭链接令牌的写（邮箱激活、邀请设密、新登录邮箱确认）**：按流程语义**不带**幂等键（每次都应重新认证 / 校验）。
- **命中语义**：同键 + **同请求体**重发 → 返回首次结果、不重复副作用（**异步受理类**例外：返回当前进度、完成后收敛终态——如某写操作先返 `202` 处理中、同键重发直到返终态）；同键 + **请求体不同** → `409`（`908003`）、不新建。**改了请求体就必须换新键**——哪怕只改了备注这类非关键字段。无请求体的端点，作用域 = 键 + 路径资源（同键用于不同资源 → `409`·`908003`），见该端点说明。同键的首次请求还在处理 → `409`（`908002`），稍后以同键、同请求体重发即拿到首次结果。
- **怎么生成**：**一次逻辑操作生成一个键**（如用户点一次「提交」），值取任意不重复字符串（UUID 即可）；**网络失败 / 超时重试时复用同一个键**，这正是幂等键的用途。不要每次请求都新生成（那样重试会变成重复下单），也不要跨不同操作复用。
- 另有**防重提交**短窗（防双击 / 误触，窗口可配置），独立于业务幂等。

## 文件上传

**所有上传入口形状一致，前端只需写一个 helper。** 文件经本平台中转存入对象存储。

**两步**：

1. **上传** —— `POST <业务前缀>/files`，`multipart/form-data`，字段 `file`（文件本体）+ `purpose`（用途）。返回 `201 { fileId, fileName, fileSize, contentType, previewUrl }`。用途决定允许的格式与大小上限（见 `MerchantFilePurpose` 用途表），前端照表写成常量、选文件时先拦一道（格式放进 `<input accept>`）；最终以服务端为准，不合规 → `400`·`204015`，换一个文件再传。

   ```js
   const fd = new FormData()
   fd.append('purpose', purpose)
   fd.append('file', file)
   const r = await api.post(`${prefix}/files`, fd)   // 走统一 client：带会话 cookie 与 X-CSRF-Token
   ```

   ⚠️ **不要手设 `Content-Type`**：`multipart/form-data` 的 `boundary` 由浏览器生成并写进 header，手写后浏览器不再补、服务端解析不出表单。**全局 axios 实例若默认 `application/json`，这个请求要把该 header 删掉**（不是覆盖成 multipart）。
2. **把 `fileId` 交给业务写操作** —— 上传成功**不等于生效**；`fileId` 随对应的业务写操作提交（保存草稿 / 设置 Logo / 提交结算变更 / 保存设置 / 创建或编辑链接），在那一步文件才归属该业务对象。上传后要立即回显，用响应里的 `previewUrl`。

上传非幂等：每次上传产生新 `fileId`，重试即重新上传。上传后从未被引用的文件不生效，前端不用管。

**读回来时**：具体字段以各端点 schema 为准，命名有两类——`*Ref` / `*FileId` 是**引用**（可写，提交时用），`*Url` / `*previewUrl` 是**可渲染地址**（`readOnly`，只出不入，不要提交、不要持久化）。**响应同时给出两者时**：不换文件就**不传该引用**（未出现的字段保持原值，见「更新语义」），换文件传新 `fileId`，移除传 `null`；只给地址的响应直接渲染即可。地址分两类：**长效稳定的公开地址**可直接放进页面；**短时效地址**过期即失效，重新读取所在资源即可拿到新的。哪个用途属于哪类，见该入口 `purpose` 的说明。

## 验证码、微信扫码、文件下载

这三种交互在多个页面出现，各处入口分开、形状相同，各写一个 helper 即可。形状在各 spec 里引的是同几个共享 schema：发码 `OtpChallenge`（挑战 id 已由所在资源给出的入口用 `OtpDelivery`）、码凭证 `OtpProof`、扫码发起 `WechatQrChallenge`、绑定轮询 `WechatBindingPollResult`、下载 `XlsxFile` / `PdfFile` 配 `Accept-Language`。

**验证码**

- 发码接口返回 `{ challengeId, deliveredTo, cooldownSeconds, expiresAt }`。重发 = 冷却结束后再调一次发码接口，拿到新的 `challengeId`，旧码作废。
- 发码与提交是两个接口、码随业务内容一起提交的，请求体里都是 `otp: { challengeId, code }`。
- `challengeId` 在路径里的（找回密码、忘记退款 PIN、改登录邮箱），请求体里码的键是 `code`。
- 不暴露账号是否存在的入口（找回密码、注册、重发验证邮件）不返回 `deliveredTo` 与 `expiresAt`，冷却秒数同样叫 `cooldownSeconds`。
- 失败码见「怎么读 `code`」里一次性挑战那张表。

**微信扫码**

- 发起返回 `{ qrTicket, qrContent, expiresAt }`：用 `qrContent` 自己渲染二维码，拿 `qrTicket` 轮询该入口的结果接口。
- 轮询恒返回 `200 { status }`：`WAITING` 继续轮询，`EXPIRED` 重新发起；成功态登录是 `ESTABLISHED`，绑定是 `BOUND`。没见过的取值按 `WAITING` 处理。

**文件下载（xlsx / PDF）**

- 导出接口的筛选、搜索、排序参数与对应的列表接口相同，导出的是命中的全部行，不只是当前页。
- 文件语言按 `Accept-Language`，实际用的语言在响应头 `Content-Language`；文件名在 `Content-Disposition`。
- 文件由服务端生成、拿不到浏览器时区：文件里的**时刻列**按商户当前配置的 IANA 时区换算后写出，并在表头（PDF 收据为时间旁）标明所用时区；**日期列**照字面写，不换算。

## 时间 / 金额 / 币种

- **时间戳**（spec 内的 `Timestamp`）：**响应**一律 UTC `Z`（如 `2026-05-19T14:30:00Z`）；**请求 / query 入参**接受任意合法 offset、服务端归一 UTC。**显示时按浏览器时区换算**（就是通常那样 `new Date(...)` 后本地化；后端产出的文件见上文文件下载）。
- **日期**（spec 内的 `LocalDate`）：`YYYY-MM-DD`、**不带时区**，**按字面收发** —— 直接当字符串显示，**别塞进 `Date`**（负偏移时区会显示成前一天）。
  日期区间一律 `from` / `to`（**闭区间、含当日**），`to < from` → `400`；是否必填、有无跨度上限看该端点。
- ⚠️ **时刻按浏览器时区显示（后端产出的文件见上文文件下载），日期按字面显示，两者不要互相换算**。按日期筛出来的行，时刻列显示的日子可能差一天，不是 bug。
- **金额**：**字符串**类型（避免 JSON Number 精度丢失）；默认最小货币单位的整数字符串（如「分」），scale 由币种 ISO 精度解释（CAD / USD 2 位、JPY 0 位）；接口若用十进制金额字符串（如 `"10.00"`）会在该接口契约显式声明。
- **币种**：ISO 4217 三字母码（`CAD` / `CNY` / `USD`…）。

## 版本化

- API 版本走 URL path（如 `/api/merchant/v1`）；破坏性变更通过新版本路径并行，兼容期可配置。
