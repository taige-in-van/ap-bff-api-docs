                    status: INCOMPLETE
                    relationType: branch
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - merchants
      operationId: addMerchant
      summary: 添加关联商户（branch / new_legal_entity；创建 INCOMPLETE + 交入驻流程；2 层上限）
      description: |
        **原子创建关联商户**：一次创建一个 `INCOMPLETE` 关联商户（branch / new_legal_entity）+ 对应的入驻申请草稿（`DRAFT`），返回 merchantId。 **仅创建、不切会话**：前端拿到 merchantId 后**显式调 switchCurrentMerchant 切上下文**（幂等），再 GET /onboarding/application **加载**已建 DRAFT 续走向导。 字段预填及 5 步规则由入驻向导接口返回。 2 层上限：当前商户已是二级关联商户 → `409`·208023（不创建；层级是结构事实、刷新不变，应提示「已达最大层级」而非引导重试）;Country × Currency 组合非法 → 400。 幂等：必带 `Idempotency-Key`。同键 + 同请求体重发返首次结果、**不会重复建商户**（防重复点击 / 网络重试）；改了请求体就必须换新键，沿用旧键改内容 → `409`·208005。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
