openapi: 3.1.0
info:
  title: 商户后台 个人账号 — 前端契约面
  version: 2.0.0
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的个人账号契约：登录者本人的资料（昵称、界面语言）、改自己的登录邮箱、账户安全（改密、开启与关闭 MFA）。读「我」走认证契约的 `getCurrentSession`。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 改密挂 `Idempotency-Key`；改登录邮箱与开关 MFA 的多步挑战按流程语义不挂；天然幂等的改资料不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: me
    x-displayName: 本人资料
    description: 本人资料：改昵称与界面语言。读「我」走 `getCurrentSession`。
  - name: email
    x-displayName: 登录邮箱
    description: 改自己的登录邮箱：身份校验 → 提交新邮箱 → 新邮箱收到的码确认。
  - name: security
    x-displayName: 账户安全
    description: 账户安全：改密、开启与关闭 MFA（验证器）。退款 PIN 在商户资料契约。
paths:
  /me:
    put:
      tags:
        - me
      operationId: updateMyProfile
      x-required-privilege: session
      summary: 改自己的资料（昵称、界面语言）
      description: |
        改当前登录者自己的资料，只提交要改的，直接生效。

        幂等基准：天然幂等，不挂 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                displayName:
                  type: string
                  minLength: 1
                locale:
                  $ref: '#/components/schemas/UserLocale'
            examples:
              displayName:
                summary: 改昵称
                value:
                  displayName: Jane M.
              locale:
                summary: 切换界面语言
                value:
                  locale: fr
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /me/email/changes:
    post:
      tags:
        - email
      operationId: requestLoginEmailChange
      x-required-privilege: session
      summary: 改登录邮箱 — 发起（返回身份校验方式）
      description: |
        邮箱账号发起改登录邮箱，返回 `challengeId` 串起后续步骤。身份校验方式：已启 MFA 用验证器码；未启用旧邮箱的码，本步即发出。

        My Profile 和 Business Profile（Owner 本人改 Primary Email）都调本组接口。同一个人的登录邮箱同时只有一笔改动在途，含 Owner 在成员管理里给员工发起的：新发起顶掉上一笔，上一笔再提交返回 `206006`。用户名账号不能自助改，返回 `403`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: 改邮箱变更请求已创建
          content:
            application/json:
              schema:
                type: object
                required:
                  - challengeId
                  - identityVerification
                properties:
                  challengeId:
                    type: string
                  identityVerification:
                    type: string
                    enum:
                      - MFA_TOTP
                      - OLD_EMAIL_OTP
                    description: 本次要用哪个身份因子。`OLD_EMAIL_OTP` = **旧邮箱的码已随本步发出**（见 `otpDelivery`）；`MFA_TOTP` = 无码可发，用户打开 Authenticator 取。
                  otpDelivery:
                    allOf:
                      - $ref: '#/components/schemas/OtpDelivery'
                    description: '**仅 `identityVerification = OLD_EMAIL_OTP` 时返回本键**——旧邮箱码已发出（投递目标与重发冷却）。`MFA_TOTP` 时不返回。重发走 `resendLoginEmailChangeCode`。'
              example:
                challengeId: chg_6b1d3f8a90
                identityVerification: MFA_TOTP
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /me/email/changes/{challengeId}/code:
    post:
      tags:
        - email
      operationId: resendLoginEmailChangeCode
      x-required-privilege: session
      summary: 改登录邮箱 — 重发当前这一步的码
      description: |
        重发这笔改邮箱当前停在的那一步的码：待身份校验时重发旧邮箱的码，待确认时重发新邮箱的码。身份校验用验证器码时没有码可重发。

        错误码：

        - `208013` 冷却未到。
        - `206005` 不是发起者本人。
        - `206006` 这笔改邮箱已完成、已过期或已被顶掉，须重新发起。
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: 改登录邮箱的 challengeId（发起时返回）
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已重发
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - otpDelivery
                properties:
                  otpDelivery:
                    $ref: '#/components/schemas/OtpDelivery'
              example:
                otpDelivery:
                  deliveredTo: j***@example.com
                  cooldownSeconds: 60
                  expiresAt: '2026-09-02T10:04:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206005
        - 206006
        - 208013
  /me/email/changes/{challengeId}/identity:
    post:
      tags:
        - email
      operationId: verifyLoginEmailChangeIdentity
      x-required-privilege: session
      summary: 改登录邮箱 — 第 1 步身份校验（验证器码或旧邮箱的码）
      description: |-
        提交身份校验码：发起时返回 `MFA_TOTP` 的填验证器码，返回 `OLD_EMAIL_OTP` 的填旧邮箱收到的码。

        错误码：

        - `206011` 验证器码错（不计次）。
        - `204010` 旧邮箱的码错、还有次数；剩余次数见 `context.attemptsRemaining`。
        - `206007` 旧邮箱的码错到上限，这笔改邮箱作废。
        - `206006` 这笔改邮箱已过期、已完成或已被顶掉。
        - `206005` 不是发起者本人。
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: 改登录邮箱的 challengeId（发起时返回）
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  $ref: '#/components/schemas/OtpCode'
            example:
              code: '123456'
      responses:
        '204':
          description: 身份已校验，可提交新邮箱
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 206005
        - 206006
        - 206007
        - 206011
  /me/email/changes/{challengeId}/address:
    post:
      tags:
        - email
      operationId: submitNewLoginEmail
      x-required-privilege: session
      summary: 改登录邮箱 — 第 2 步提交新邮箱（发新邮箱的码）
      description: |-
        提交新邮箱，校验格式、与当前不同、未被别人使用，通过后向新邮箱发码。新邮箱在确认前不占用。

        错误码：

        - `968001` 新邮箱已被别人使用。
        - `206006` 这笔改邮箱已过期、已完成或已被顶掉。
        - `206005` 不是发起者本人。
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: 改登录邮箱的 challengeId（发起时返回）
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newEmail
              properties:
                newEmail:
                  type: string
                  format: email
            example:
              newEmail: jane.new@example.com
      responses:
        '202':
          description: 新邮箱的码已发出
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - otpDelivery
                properties:
                  otpDelivery:
                    allOf:
                      - $ref: '#/components/schemas/OtpDelivery'
                    description: 新邮箱的码已发出（投递目标与重发冷却）。重发走 `resendLoginEmailChangeCode`。
              example:
                otpDelivery:
                  deliveredTo: j***@example.com
                  cooldownSeconds: 60
                  expiresAt: '2026-09-02T10:04:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206005
        - 206006
        - 968001
  /me/email/changes/{challengeId}/confirmation:
    post:
      tags:
        - email
      operationId: confirmLoginEmailChange
      x-required-privilege: session
      summary: 改登录邮箱 — 第 3 步确认（新邮箱的码）
      description: |-
        凭新邮箱收到的码完成替换，旧邮箱收到安全通知，会话不受影响。一次性码，非幂等。

        错误码：

        - `204010` 码错、还有次数；剩余次数见 `context.attemptsRemaining`。
        - `206007` 码错到上限，这笔改邮箱作废。
        - `968001` 确认前新邮箱已被别人抢先使用。
        - `206006` 这笔改邮箱已过期、已完成或已被顶掉。
        - `206005` 不是发起者本人。
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: 改登录邮箱的 challengeId（发起时返回）
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  allOf:
                    - $ref: '#/components/schemas/OtpCode'
                  description: 新邮箱 OTP
            example:
              code: '654321'
      responses:
        '204':
          description: 登录邮箱已更新（旧邮箱已收安全通知）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 206005
        - 206006
        - 206007
        - 968001
  /me/security/password:
    put:
      tags:
        - security
      operationId: changeMyPassword
      x-required-privilege: session
      summary: 登录态改密（用当前密码校验；其他会话失效、当前保留）
      description: |
        用当前密码校验后改为新密码，不接受验证器码或邮箱码代替。改密后该用户其他会话失效，当前会话保留；给本人登录邮箱发密码已修改通知（用户名账号没有邮箱，不发）。

        幂等基准：`Idempotency-Key`。同键同请求体重发返回 `204`；同键改请求体返回 `409`·`208005`。

        错误码：

        - `206011` 当前密码错（会话仍有效，不计入登录锁定）。
        - `208005` 同一幂等键被用于不同的请求体。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: 新版 5 规则（≥ 8 字符 / 大写 / 小写 / 数字 / 特殊字符）;下限 8 = 其中的长度那条，其余四条由前端校验并提示具体未满足项、服务端兜底拒绝。不可与旧密码相同
            example:
              currentPassword: Str0ng!Pass
              newPassword: N3w!Str0ngPass
      responses:
        '204':
          description: 改密成功（其他会话已失效，当前会话保留）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206011
        - 208005
  /me/security:
    get:
      tags:
        - security
      operationId: getMySecurity
      x-required-privilege: session
      summary: 读自己的账户安全状态（安全等级 + MFA 是否开启 + 上次改密时刻）
      description: |
        读当前登录者的安全等级、MFA 状态与上次改密时刻。

        `securityLevel` 由服务端判定：密码不满足现行规则为 `LOW`；满足且已开启 MFA 为 `STRONG`；满足但未开启为 `MEDIUM`。开启 MFA 后扫码未确认的，按未开启处理。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - securityLevel
                  - mfaEnabled
                properties:
                  securityLevel:
                    type: string
                    enum:
                      - LOW
                      - MEDIUM
                      - STRONG
                    description: 安全等级，仅供展示，不决定权限
                  mfaEnabled:
                    type: boolean
                  mfaEnabledAt:
                    allOf:
                      - $ref: '#/components/schemas/Timestamp'
                    description: 开启时刻；`mfaEnabled = true` 时必返，否则不返回本键。
                  passwordUpdatedAt:
                    allOf:
                      - $ref: '#/components/schemas/Timestamp'
                    description: 上次设置或修改密码的时刻；从未设过密码不返回本键。
              example:
                securityLevel: STRONG
                mfaEnabled: true
                mfaEnabledAt: '2026-09-10T08:12:00Z'
                passwordUpdatedAt: '2026-07-02T14:30:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /me/security/mfa:
    post:
      tags:
        - security
      operationId: enrollMfa
      x-required-privilege: session
      summary: 开启 MFA 第 1 步（输当前密码，返回二维码内容）
      description: |
        校验当前密码后生成验证器密钥，返回二维码内容与手输密钥；尚未生效，须再调 `confirmMfa`。重新调用会覆盖上一次未确认的密钥。

        错误码：

        - `206011` 当前密码错（会话仍有效，不计入登录锁定）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
              properties:
                currentPassword:
                  type: string
                  format: password
            example:
              currentPassword: Str0ng!Pass
      responses:
        '200':
          description: provisioning（otpauth URI），待 activation
          content:
            application/json:
              schema:
                type: object
                required:
                  - otpauthUri
                  - secret
                properties:
                  otpauthUri:
                    type: string
                    pattern: ^otpauth://totp/
                    description: TOTP provisioning URI（Key Uri Format）—— 前端据此渲染二维码供 Authenticator 扫描；其 `secret` 参数即下方 `secret` 字段
                  secret:
                    type: string
                    minLength: 26
                    description: 手动输入密钥（Authenticator 里的 setup key），供扫不了码的用户手工录入。Base32、**不带分组空格**（展示时要不要分组由前端定）。本字段与 `otpauthUri` 的 `secret` 参数同值，**前端不必解析那串 URI**。下限 26 字符 = RFC 4226 的 128 bit 硬下限按 Base32 每字符 5 bit 换算；实际长度取服务端配置（RFC 推荐 160 bit，即 32 字符）
              example:
                otpauthUri: otpauth://totp/MerchantPortal:jane@example.com?secret=KRUGKIDROVUWG2ZAMJZG653OEBTG66BA&issuer=MerchantPortal
                secret: KRUGKIDROVUWG2ZAMJZG653OEBTG66BA
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206011
  /me/security/mfa/confirmation:
    post:
      tags:
        - security
      operationId: confirmMfa
      x-required-privilege: session
      summary: 开启 MFA 第 2 步（输验证器码，生效）
      description: |
        扫码后输一次验证器码完成开启，下次登录起要输验证器码。

        错误码：

        - `206011` 验证器码错。
        - `206006` 第 1 步生成的密钥已失效（太久没确认），须重新开启。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  $ref: '#/components/schemas/OtpCode'
            example:
              code: '123456'
      responses:
        '204':
          description: 已开启
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206006
        - 206011
  /me/security/mfa/deactivation:
    post:
      tags:
        - security
      operationId: disableMfa
      x-required-privilege: session
      summary: 关闭 MFA（输验证器码）
      description: |
        输当前验证器码后关闭 MFA，删除密钥。

        错误码：

        - `206011` 验证器码错，MFA 保持开启。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  $ref: '#/components/schemas/OtpCode'
            example:
              code: '123456'
      responses:
        '204':
          description: 已关闭
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206011
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在会话没有当前商户时返回 `409`·`208022`（见公共约定「当前商户」）。
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
  schemas:
    UserLocale:
      type: string
      enum:
        - en
        - fr
        - zh
      description: 账号的界面语言偏好。登录后页面按它显示；发给这个人本人的邮件（验证码、改密码、改邮箱等）也用它。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              type: string
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              type: string
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    OtpDelivery:
      type: object
      additionalProperties: false
      description: 「一次性验证码已发出」的三件事（各发码入口共用同一形状）：发到哪里、多久能重发、多久失效。 FE 用 `cooldownSeconds` 启动重发倒计时、用 `expiresAt` 判断码是否仍有效；**两个都是部署可配、前端不要 hardcode**。 码过期 / 已用后再提交 → `410`（须重新发起，不是重输）；冷却中重发 → `429`。 ⚠️ **反枚举入口不用本形状**——若「投递目标存不存在」本身是要隐藏的事实（如找回密码）， 那里只回冷却秒数、不回 `deliveredTo`，见各自端点说明。
      required:
        - deliveredTo
        - cooldownSeconds
        - expiresAt
      properties:
        deliveredTo:
          type: string
          minLength: 1
          readOnly: true
          description: 脱敏投递目标（如 `o***@e***.com`）——供 FE 提示「码发到哪里」。
        cooldownSeconds:
          type: integer
          readOnly: true
          minimum: 0
          description: 重发冷却秒数（部署可配）。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 该码的失效时间（部署可配）。
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
