openapi: 3.1.0
info:
  title: 商户后台 商户实体 — 前端契约面
  version: 0.23.2
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的商户主体资料 / 结算 / Refund PIN / 多商户 / Service Page / 集成 契约。 覆盖 Merchant 主体资料 + BusinessProfile + Refund PIN 凭据 + 结算事前审批 + Service Page 2 层模型（AcceptanceMode / PaymentMethod）。 字段类型以本 spec 为准。 幂等/CSRF 口径:① **创建类 + 非天然幂等写**（Add Merchant / Connect AcceptanceMode / Connect Ecommerce / 创建结算变更请求 / 改 Refund PIN / Forgot PIN 重置 / 改 URL 触发重审）挂 Idempotency-Key——无自然业务单号，或重放不自洽（当前 PIN 已消费、撞待审核请求 → 409），retry 用同键返**首次结果**;
      **天然幂等的纯 PUT/DELETE**（改 Business Information / 切当前商户 / 启停 PaymentMethod / Terminal 连接·停用 / Logo）可不挂幂等键;
      **OTP 多步挑战**按流程语义每次重新校验。
    ② 非安全方法一律挂 X-CSRF-Token（double-submit，fail-closed）。 ③ **当前商户上下文守卫（读写统一）**：会话当前商户 = 数据可见范围**唯一权威**、不信请求体（`switchCurrentMerchant` 切换更新会话）；目标商户不在可访问集 → 404 反枚举。**所有当前商户相关读 + 写**携带页面预期 `X-Merchant-Context`（`MerchantContextGuard` header param；expected 商户 ID，**仅与会话当前商户比对、非选择器**）——一致才执行；**≠ 会话当前商户 → `409`**（读不返回错商户、写不执行）：会话**有**当前商户、只是与 expected 不同 → `208001`（`MERCHANT_CONTEXT_CHANGED`，`context.currentMerchantId` 回显）；会话**没有**当前商户 → `208022`（`MERCHANT_NOT_ACCESSIBLE`，无可回显者、前端重跑启动链路）。前端统一 interceptor 发送 + 处理 409（提示 + 刷新当前商户）。**豁免** listMerchants / switchCurrentMerchant / withdrawOnboardingApplication（按 path 选目标、target≠current）/ 全局接口。 ④ **Idempotency-Key 语义**：retry 用同一 key 返回**首次结果**（retry-safe），区别于 OTP token 的一次性消费（消费后不可重取首次结果）。 ⑤ **OTP 错误分类**（OTP verify 端点 verifySettlementOtp）：错误但可重试 → 400 `204010`（剩余尝试数走 **`context.attemptsRemaining`** 整数类型——该码必带，见错误码表 `requiredContextFields`；`details` 只做请求字段校验红框、不承载剩余次数）;尝试超限锁定 → 423;过期 / 已消费 → 410;Resend 冷却 → 429。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（经边缘网关；浏览器 ↔ BFF 用会话 cookie）
security:
  - cookieAuth: []
tags:
  - name: profile
    description: BusinessProfile 概览与编辑：Profile 聚合（Header card + 4 section + 资金只读 + Locked 标识）、Business Information 7 可编辑字段直接生效、Logo 上传/移除。Locked 字段服务端强制（绕过 → 403）。
  - name: settlement
    description: 结算字段事前审批：当前结算（account_number 掩码 + PENDING_REVIEW 标识）、Void cheque 上传、Owner email OTP（发/校验）、创建变更请求（创建 PENDING_REVIEW、旧值生效、单 Merchant 至多 1 个并发护栏）。
  - name: refund-pin
    description: Refund PIN 凭据：登录态改 PIN（current + new + confirm，不需 OTP）、Forgot PIN 自助重置（OTP 邮件单步）。OTP 一次性（过期/已用 → 410），Resend 冷却（→ 429）。
  - name: merchants
    description: 多商户 lifecycle 与切换：switcher 列表（仅 ACTIVE/INCOMPLETE/PENDING_REVIEW）、Add 关联商户（branch / new_legal_entity，2 层上限）、撤回未激活商户在途入驻、切换当前上下文。
  - name: service-page
    description: Service Page 浏览与管理：AcceptanceMode/PaymentMethod 2 层 + Integrations 摘要（凭据掩码）、PaymentMethod 启停、AcceptanceMode 自助申请（Connect）、online website URL 改（触发重审）。
  - name: integrations
    description: 第三方集成：TerminalIntegration（Moneris/Clover 互斥，即时生效 + 自助停用）、EcommerceIntegration（Shopify/Allvalue review-gated，URL 改重审 / 方式配置改不重审）。凭据掩码摘要。
  - name: documents
    description: Documents 只读展示：入驻上传的文档（5 必传 + 2 可选）；未上传必传项显示缺失占位；无自助上传/替换/删除入口。
paths:
  /account/profile:
    get:
      tags:
        - profile
      operationId: getAccountProfile
      summary: 查看 Profile 概览（Header card + 4 section；聚合 BusinessProfile + Merchant + Contact + 资金）
      description: |
        聚合当前选中 ACTIVE 商户的 Profile 概览：Header card（Logo / Trade Name (DBA) / Legal Business Name / Industry • MCC / Merchant ID） + 4 section（Business Information / Settlement / Contact Information / Documents 摘要）。Locked 字段附 `locked: true` 标识; account_number 掩码仅末 4 位（`•••• 5678`）;资金字段（Account Balance / Refund Reserved）为只读展示（无修改入口）; Contact Information 为只读聚合展示、编辑走 owner-contact 端点。 404 仅表示资源不存在 / 不可见，不承载商户状态前置失败。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: OK（5 展示区块聚合）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
              example:
                merchantId: '1000023'
                status: ACTIVE
                header:
                  merchantCode: C3BM68
                  logoUrl: https://cdn.example.com/logo/m10023.png
                  tradeName: Jane's Coffee
                  legalBusinessName: Jane Coffee Inc.
                  industryCategoryDisplayName: Food & Beverage
                  mcc: '5812'
                businessInformation:
                  legalBusinessName:
                    value: Jane Coffee Inc.
                    locked: true
                  tradeName:
                    value: Jane's Coffee
                    locked: true
                  ownershipType:
                    value: Corporation
                    locked: true
                  registrationNumber:
                    value: BC1234567
                    locked: true
                  referredBy:
                    value: Moneris
                    locked: true
                  industryCategory:
                    value: Food & Beverage
                    locked: true
                  mcc:
                    value: '5812'
                    locked: true
                  address: 123 Main St
                  city: Vancouver
                  province: BC
                  postalCode: V6B1A1
                  country: CA
                  timeZone: America/Vancouver
                  businessPhone: '6045550123'
                settlement:
                  legalBusinessName: Jane Coffee Inc.
                  bankName: RBC
                  transitNumber: '12345'
                  institutionNumber: '003'
                  accountNumberMasked: •••• 5678
                  settlementSchedule: t2
                  storeId: STORE-01
                  pendingReview: false
                contactInformation:
                  contactName: Jane Merchant
                  contactTitle: Manager
                  phone: '6045550123'
                  email: jane@example.com
                funds:
                  available: true
                  accountBalance:
                    amount: '1250000'
                    currency: CAD
                  refundReserved:
                    amount: '50000'
                    currency: CAD
                documentsSummary:
                  total: 5
                  missing: 0
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208003
  /account/profile/business-information:
    put:
      tags:
        - profile
      operationId: updateBusinessInformation
      summary: 编辑 Business Information（7 可编辑字段直接生效；Locked 字段 enforce 403）
      description: |
        编辑 ACTIVE 商户 Business Information section 的 7 项可编辑字段（Address / City / Province / Postal Code / Country / Time Zone / Business Phone）， 保存直接生效（无审核）。**任何 7 项 Locked 字段 （Legal Business Name / Trade Name (DBA) / Ownership Type / Registration Number / Referred By / Industry Category / MCC） 出现在请求体即服务端拒绝（403），不持久化、不依赖前端隐藏**。 幂等：纯 PUT、天然幂等（同字段集重复提交结果一致），不挂 Idempotency-Key。 **改 `timeZone` 可能被拒**：与已出账的历史数据冲突时 → `409 208016`， 且**整个请求不持久化**（含同请求内其他 6 个可编辑字段，需整体重提）； 系统暂时判不出时也返同一个码，按「当前不能改、稍后再试」处理。 未改 `timeZone` 的请求不会触发这条。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessInformationUpdate'
            example:
              address: 456 Market St
              city: Vancouver
              province: BC
              postalCode: V6B1A1
              country: CA
              timeZone: America/Toronto
              businessPhone: '6045550199'
      responses:
        '204':
          description: 已保存（新值直接生效）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208003
        - 208016
  /account/profile/business-information/options:
    get:
      tags:
        - profile
      operationId: getBusinessInformationOptions
      summary: Business Information 可选值域（表单候选集）
      description: |
        下发 Business Information section 中**取值域由后端动态配置**的字段候选集，供前端渲染选项。 当前仅 `timeZone`（IANA tz 白名单，与商户 country 联动）——**契约不写死候选集**， 运营 / 部署可调整；该 section 后续若有其他动态值域，同址扩展。 只读、无副作用；不含任何商户可编辑值本身（当前值取 `getAccountProfile`）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 当前商户可选的 Business Information 值域
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessInformationOptions'
              example:
                timeZoneOptions:
                  - America/Vancouver
                  - America/Edmonton
                  - America/Winnipeg
                  - America/Toronto
                  - America/Halifax
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /account/profile/settlement/options:
    get:
      tags:
        - settlement
      operationId: getSettlementOptions
      summary: Settlement section 可选值域（表单候选集）
      description: |
        下发 Settlement section 中**取值域由后端动态配置**的字段候选集，供前端渲染选项。 当前仅 `settlementCycleOptions`——**契约不写死候选集**，运营 / 部署可调整； 该 section 后续若有其他动态值域，同址扩展。 只读、无副作用；不含任何商户当前值（当前值取 `getAccountProfile`）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 当前商户可选的 Settlement 值域
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementOptions'
              example:
                settlementCycleOptions:
                  - code: t2
                    displayName: T+2 Business Days
                  - code: t3
                    displayName: T+3 Business Days
                  - code: weekly
                    displayName: Weekly
                  - code: monthly
                    displayName: Monthly
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /account/profile/files/upload-targets:
    post:
      tags:
        - profile
      operationId: createLogoUploadTarget
      summary: 取得 Logo 直传目标（浏览器据此直传，文件不经本接口）
      description: |
        更换 Logo 分两步。**第一步**调本接口，用**声明值**（内容类型 / 大小）换一个直传目标； **第二步**由浏览器把文件连同目标中的 `fields` 一起提交到 `action`，**文件字节不经过本接口**； 提交成功后调 POST /account/profile/logo 使其生效。 允许的格式与大小上限见 `purpose` 的用途表；声明值不合规 → `400 FILE_DECLARATION_REJECTED (204015)` 且**不签发目标**——**换一个合规的文件**再申请，同一文件重试无用。 **非幂等**：每次调用产生新 fileId、重试不复用；不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadTargetRequest'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - merchant_logo
                    contentType:
                      enum:
                        - image/png
                        - image/jpeg
            example:
              purpose: merchant_logo
              fileName: storefront-logo.png
              contentType: image/png
              fileSize: 204800
      responses:
        '201':
          description: 已签发直传目标；浏览器据此提交文件
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTarget'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
        - 208001
  /account/profile/logo:
    post:
      tags:
        - profile
      operationId: applyLogo
      summary: 使已直传的 Logo 生效（即时生效，无审核）
      description: |
        浏览器把 Logo 直传到目标（见 /account/profile/files/upload-targets）成功后调本接口使其生效： 校验文件已就位后替换当前 Logo。 文件**确定未就位**（直传未完成 / 被存储端拒收）→ `400 FILE_NOT_IN_PLACE (204014)`，当前 Logo 不变。 **204014 是终态、不可原样重试**：须**重新申请直传目标**（得到**新 `fileId`**）并重新直传，再以新引用调用——**不要向原目标补传**（直传目标是一次性的，提交失败即作废）。 文件是否就位**暂时无法判定**（上游不可达 / 超时）→ `502` / `504`：**不必重传**，原样重试本请求。 幂等：同一 `fileId` 重复调用为覆盖同一结果、天然幂等，不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - fileId
              properties:
                fileId:
                  type: string
                  description: 签发直传目标时返回的文件引用
            example:
              fileId: 2b6e0a94c73f41d5891ae4f0c62d7b18
      responses:
        '200':
          description: 已生效（返回新 Logo 引用）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoRef'
              example:
                logoUrl: https://cdn.example.com/logo/m10023.png
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204014
        - 208001
    delete:
      tags:
        - profile
      operationId: removeLogo
      summary: 移除 Logo（回退默认首字母标识；即时生效）
      description: 移除 BusinessProfile Logo，Profile 回退展示默认首字母标识。幂等：DELETE 天然幂等（已无 Logo 时仍 204）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已移除（回退默认首字母标识）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /account/settlement:
    get:
      tags:
        - settlement
      operationId: getSettlement
      summary: 查看当前结算字段（account_number 掩码 + PENDING_REVIEW 标识）
      description: |
        返回当前生效结算字段；account_number 仅末 4 位掩码（`•••• 5678`，明文不返回）。 `pendingReview: true` 时表示存在 PENDING_REVIEW 变更请求 → 前端隐藏 Edit 入口、展示审核中提示（同 Merchant 至多 1 个 PENDING_REVIEW）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: OK（当前生效结算字段）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementView'
              example:
                legalBusinessName: Jane Coffee Inc.
                bankName: RBC
                transitNumber: '12345'
                institutionNumber: '003'
                accountNumberMasked: •••• 5678
                settlementSchedule: t2
                storeId: STORE-01
                pendingReview: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /account/settlement/files/upload-targets:
    post:
      tags:
        - settlement
      operationId: createSettlementVoidChequeUploadTarget
      summary: 取得 Void cheque 直传目标（bank-related 变更第 1 步前置）
      description: |
        bank-related 结算字段变更的 Step 1 前置。**第一步**调本接口，用**声明值**（内容类型 / 大小）换一个直传目标； **第二步**由浏览器把文件连同目标中的 `fields` 一起提交到 `action`，**文件字节不经过本接口**。 允许的格式与大小上限见 `purpose` 的用途表；声明值不合规 → `400 FILE_DECLARATION_REJECTED (204015)` 且**不签发目标**（不进入 Step 2 OTP）——**换一个合规的文件**再申请，同一文件重试无用。 返回的 `fileId` 即后续创建变更请求所用的 `voidChequeRef`——**无需再调其他接口**，该文件在创建变更请求时才正式归属该请求。 幂等：每次调用返回独立 fileId，按流程语义不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadTargetRequest'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - settlement_void_cheque
                    contentType:
                      enum:
                        - image/png
                        - image/jpeg
                        - application/pdf
            example:
              purpose: settlement_void_cheque
              fileName: void-cheque.pdf
              contentType: application/pdf
              fileSize: 1048576
      responses:
        '201':
          description: 已签发直传目标；其 fileId 即后续引用的 voidChequeRef
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTarget'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
        - 208001
  /account/settlement/change-requests/otp-challenges:
    post:
      tags:
        - settlement
      operationId: requestSettlementOtp
      summary: 发送结算变更 OTP 到 Owner email（bank 第 2 步 / 非 bank 唯一前置；绑定变更意图）
      description: |
        发送 OTP 到 Owner 的登录邮箱作结算变更身份验证， **并把本次变更内容（changes）+ voidChequeRef 绑定到该 OTP 挑战**—— verifySettlementOtp 签发的 otpToken 锚定这次变更意图，createSettlementChangeRequest 提交的 changes 须与之一致（防"用普通变更 OTP 授权银行账户变更"）。 bank-related 变更为 Step 2（Void cheque 之后）、非 bank-related 变更为唯一前置。Resend 冷却中 → 429。 按多步挑战流程语义不挂幂等键（每次发新 OTP，旧 OTP 失效并重新绑定）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - changes
              description: OTP 绑定的变更意图：服务端把 changes 锚定到本次挑战
              properties:
                changes:
                  $ref: '#/components/schemas/SettlementChanges'
                voidChequeRef:
                  type: string
                  description: bank-related 变更：绑定的 Void cheque 引用（须与最终 create 一致）
            example:
              changes:
                bankName: TD
                transitNumber: '54321'
                institutionNumber: '004'
                accountNumber: '12345678'
              voidChequeRef: 7d41b9c05e2a48f3ab6c1d802f5e9a37
      responses:
        '202':
          description: OTP 已发送（展示脱敏 Owner email）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                challengeId: stl_4e1a8c9b2d
                deliveredTo: o***@e***.com
                cooldownSeconds: 60
                expiresAt: '2026-06-22T15:05:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204017
        - 208001
        - 208013
  /account/settlement/change-requests/otp-challenges/{challengeId}/verification:
    post:
      tags:
        - settlement
      operationId: verifySettlementOtp
      summary: 校验结算变更 OTP（通过则签发锚定变更意图的单次凭据）
      description: |
        校验 Owner email OTP（匹配 + 未过期 + 未消费 + 未超尝试上限）;通过则返回 `otpToken`——**锚定 requestSettlementOtp 绑定的变更内容 + voidChequeRef**。 OTP 错误分类：**错误但可重试 → 400 `204010`（剩余尝试数 `context.attemptsRemaining`、整数类型）;尝试超限锁定 → 423;过期 / 已消费 → 410**（均不签发 otpToken）。OTP 一次性消费。
      parameters:
        - name: challengeId
          in: path
          required: true
