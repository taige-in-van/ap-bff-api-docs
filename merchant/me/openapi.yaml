                  currentMerchantId:
                    type: string
                    description: 会话当前商户；**无当前商户则不返回本键**（如撤回当前商户后无可访问 parent，前端须重选）。每次解析时服务端校验该商户仍 ∈ 可访问集且非 WITHDRAWN，无效则同样不返回
                  data:
