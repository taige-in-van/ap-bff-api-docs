      summary: 申请新增 AcceptanceMode（Connect；in_store storePhoto / online type+url → PENDING_REVIEW）
      description: |
        自助申请未开通的 AcceptanceMode，附凭证（in_store: store photo fileId;online: 线上服务类型 + Website 类型 URL）， 校验通过创建 `AcceptanceEnrollment{PENDING_REVIEW}` + 触发审核（审核结果异步生效，前端后续经 getServicePage 读取最新状态）。 同 mode 已有 PENDING_REVIEW → `409`·208002（提示「申请审核中，请等待结果」）;同 mode **已 ACTIVE** → `409`·208026（这件事已经成了——提示已开通并引导去配置支付方式，不是「有待审核请求」也不是「状态变了」）;凭证缺失 / 格式非法 → 400（不创建）。 **`storePhotoFileId` 指向的文件确定未就位**（直传未完成 / 被存储端拒收）→ `400 FILE_NOT_IN_PLACE (204014)`，本次不创建。 **204014 是终态、不可原样重试**：须**重新申请直传目标**（得到**新 `fileId`**）并重新直传，再以新引用提交——**不要向原目标补传**（直传目标是一次性的，提交失败即作废）。 ⚠️ **换了 `fileId` 就是换了请求体，必须同时换一个新的 `Idempotency-Key`**；沿用旧键提交新内容 → `409`·208005。 文件是否就位**暂时无法判定**（上游不可达 / 超时）→ `502` / `504`：**不必重传**，请求内容未变，用**原键原样重试**。 幂等：必带 `Idempotency-Key`。同键 + 同请求体重发返首次结果、**不会重复开通**（防重复点击 / 网络重试）；改了请求体就必须换新键，沿用旧键改内容 → `409`·208005。 支付方式配置源读不到内容时**不创建**开通申请 → `500`（fail-closed）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAcceptanceModeRequest'
            examples:
              inStore:
                summary: in_store（store photo fileId）
                value:
                  mode: in_store
                  storePhotoFileId: e903c15b7a2d4e6fb81c30947da5f2e6
              online:
                summary: online（Website 类型 + URL）
                value:
                  mode: online
                  onlineServiceType: Website
                  websiteUrl: https://shop.example.com
      responses:
        '201':
          description: 已创建 AcceptanceEnrollment{PENDING_REVIEW}（待审核）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - enrollmentId
                  - mode
                  - status
                properties:
                  enrollmentId:
                    type: string
                  mode:
                    $ref: '#/components/schemas/AcceptanceModeType'
                  status:
                    type: string
                    enum:
                      - PENDING_REVIEW
              example:
                enrollmentId: aenr_5b2f9c10
                mode: online
                status: PENDING_REVIEW
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204014
        - 208001
        - 208002
        - 208005
        - 208026
  /service-page/acceptance-modes/{mode}/website-url:
    put:
      tags:
        - service-page
      operationId: changeAcceptanceModeWebsiteUrl
      summary: online AcceptanceMode 改 website URL（触发重审；原 URL 继续生效）
      description: |
        ACTIVE online AcceptanceMode 改 website URL → 创建**独立 URL 变更请求**（PENDING_REVIEW），主状态仍 ACTIVE、原 URL 继续生效; 审核通过后新 URL 生效、拒绝则归档（审核结果异步生效，不在本 BFF）。 已有待审核 URL 变更 → 409（不允许再次提交）;mode 非 online ACTIVE → 409。 幂等：必带 `Idempotency-Key`。直接重发会撞「已有待审核 URL 变更」→ `409`·208002，所以**网络重试务必复用同一个键**——同键 + 同请求体重发返**首次**的 changeRequestId；想改成另一个 URL 就必须换新键，沿用旧键改 URL → `409`·208005。
      parameters:
        - name: mode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AcceptanceModeType'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - websiteUrl
              properties:
                websiteUrl:
                  type: string
                  format: uri
                  description: 新 website URL（https，合法 host）
            example:
              websiteUrl: https://newshop.example.com
      responses:
        '200':
          description: 已受理待审核 URL 变更（主状态仍 ACTIVE、原 URL 继续生效；审核结果异步生效）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - changeRequestId
                  - mode
                  - status
                  - pendingUrlChange
                properties:
                  changeRequestId:
                    type: string
                    readOnly: true
                    description: URL 重审变更请求 ID（独立审批对象；主 AcceptanceMode 仍 ACTIVE）
                  mode:
                    $ref: '#/components/schemas/AcceptanceModeType'
                  status:
                    type: string
                    enum:
                      - ACTIVE
                    description: 主状态仍 ACTIVE（待审核变更不改主状态）
                  pendingUrlChange:
                    type: boolean
                    description: true = 有待审核 URL 变更（原 URL 继续生效）
              example:
                changeRequestId: aucr_5f1a2b
                mode: online
                status: ACTIVE
                pendingUrlChange: true
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208002
        - 208003
        - 208005
  /service-page/files/upload-targets:
    post:
      tags:
        - service-page
      operationId: createStorePhotoUploadTarget
      summary: 取得店铺照直传目标（in_store Connect 凭证前置）
      description: |
        in_store AcceptanceMode Connect 的凭证前置。**第一步**调本接口，用**声明值**（内容类型 / 大小）换一个直传目标； **第二步**由浏览器把文件连同目标中的 `fields` 一起提交到 `action`，**文件字节不经过本接口**。 允许的格式与大小上限见 `purpose` 的用途表；声明值不合规 → `400 FILE_DECLARATION_REJECTED (204015)` 且**不签发目标**——**换一个合规的文件**再申请，同一文件重试无用。 返回的 `fileId` 即 `connectAcceptanceMode`（in_store）所用的 `storePhotoFileId`——**无需再调其他接口**，该文件在 Connect 时才正式归属该受理开通。 幂等：每次调用返回独立 fileId，按流程语义不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadTargetRequest'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - store_photo
                    contentType:
                      enum:
                        - image/png
                        - image/jpeg
            example:
              purpose: store_photo
              fileName: store-front.jpg
              contentType: image/jpeg
              fileSize: 1572864
      responses:
        '201':
          description: 已签发直传目标；其 fileId 即 Connect 时引用的 storePhotoFileId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTarget'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
        - 208001
  /integrations/terminal:
    put:
      tags:
        - integrations
      operationId: connectTerminalIntegration
      summary: 连接 / 切换 TerminalIntegration（Moneris / Clover 互斥；即时生效）
      description: |
        连接或切换 POS provider（Moneris / Clover），即时生效无审核;互斥 —— 同 Merchant 至多 1 个 active provider，切换时旧 provider 凭据保留但不生效。 3DS 开关（用于线上交易 3DS 验证）**每次必传**——本端点全量覆盖，缺省不代表保持原样；表单初始值**按目标 provider 是不是当前生效者分两支取**：目标 = 读面的 `activeProvider`（即**更新在用凭据**）→ 取 `terminal.threedsEnabled`（当前生效值）;目标 ≠ 当前生效者（切换 / 停用后重连）→ 取 `retained` 里同 provider 那项（`retained` **按定义只含非生效 provider**,更新在用凭据时那里查不到它,**别据此当成未配置**）;两处都没有才关闭。凭据保存后仅掩码回显、明文不二次回显;凭据校验失败 → 400。 幂等：纯 PUT 覆盖当前生效 provider、天然幂等（重放同 provider+凭据结果一致），不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalIntegrationInput'
            examples:
              moneris:
                summary: Moneris（Store ID + API Token）
                value:
                  provider: moneris
                  storeId: monstore01
                  apiToken: mtok_secret_xxxxxxxx
                  threedsEnabled: false
              clover:
                summary: Clover（Public + Private Token）
                value:
                  provider: clover
                  publicToken: clpub_xxxxxxxx
                  privateToken: clpriv_secret_xxxxxxxx
                  threedsEnabled: true
      responses:
        '200':
          description: 已连接（返回掩码凭据摘要 + 当前生效 provider）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalIntegrationView'
              example:
                connected: true
                activeProvider: moneris
                threedsEnabled: false
                credentialSummary: Store ID ••• 4321
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
    delete:
      tags:
        - integrations
      operationId: disableTerminalIntegration
      summary: 停用 TerminalIntegration（清当前生效 provider；凭据保留以便再连）
      description: |
        商户后台自助停用：清除当前生效 TerminalIntegration（activeProvider 置空）+ **凭据与 3DS 开关一并保留**以便再次连接（保留内容见读面 `getServicePage` 的 `terminal.retained`）;即时生效无审核。 停用后该 Merchant 无生效 provider（彻底清除已存凭据走客服 / 运营）。幂等：DELETE 天然幂等（已无 active 时仍 204）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已停用（无生效 provider，凭据保留）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /integrations/ecommerce:
    post:
      tags:
        - integrations
      operationId: connectEcommerceIntegration
      summary: 连接 EcommerceIntegration（Shopify / Allvalue review-gated；不互斥 → PENDING_REVIEW）
      description: |
        连接电商平台（Shopify / Allvalue），提交 website URL + 关联 PaymentMethod 配置，创建 `EcommerceIntegration{PENDING_REVIEW}`（不互斥，可各自 ACTIVE）; 审核结果异步生效（不在本 BFF）。同平台审核中重复提交 → 409;URL / 配置校验失败 → 400。 Integration 连接不要求对应 online AcceptanceMode 已 ACTIVE、也不自动开通 mode。 幂等：必带 `Idempotency-Key`。同键 + 同请求体重发返首次结果、**不会重复接入**（防重复点击 / 网络重试）；改了请求体就必须换新键，沿用旧键改内容 → `409`·208005。 支付方式配置源读不到内容时**不创建**连接 → `500`（fail-closed）。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EcommerceIntegrationInput'
            example:
              provider: shopify
              websiteUrl: https://shop.example.com
              paymentMethodConfig:
                - online-wechat
                - online-alipay
      responses:
        '201':
          description: 已创建 EcommerceIntegration{PENDING_REVIEW}（待审核）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - integrationId
                  - provider
                  - status
                properties:
                  integrationId:
                    type: string
                  provider:
                    $ref: '#/components/schemas/EcommerceProvider'
                  status:
                    type: string
                    enum:
                      - PENDING_REVIEW
              example:
                integrationId: eint_7c3a91f0
                provider: shopify
                status: PENDING_REVIEW
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208002
        - 208005
  /integrations/ecommerce/{integrationId}:
    put:
      tags:
        - integrations
      operationId: manageEcommerceIntegration
      summary: 管理 EcommerceIntegration（改 URL 触发重审 / 仅改方式配置不重审）
      description: |
        管理 ACTIVE EcommerceIntegration：**仅改 PaymentMethod 配置（URL 未变）→ 保存生效、status 仍 ACTIVE、不重审**; **改 URL → 创建待审核变更、原 URL/原配置继续生效、status 仍 ACTIVE**（审核结果异步生效）。 已有待审核 URL 变更时再改 URL → 409（不允许再次提交）;校验失败 → 400。不提供 Ecommerce 自助断开入口（走客服 / 运营）。 幂等：必带 `Idempotency-Key`。只改支付方式配置时重发无副作用；**改 URL 时直接重发会撞「已有待审核 URL 变更」→ `409`·208002**，所以网络重试务必复用同一个键——同键 + 同请求体重发返**首次**结果；想换成另一份配置 / 另一个 URL 就必须换新键，沿用旧键改内容 → `409`·208005。
      parameters:
        - name: integrationId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EcommerceIntegrationManage'
            examples:
              methodConfigOnly:
                summary: 仅改方式配置（不重审）
                value:
                  paymentMethodConfig:
                    - online-wechat
              urlChange:
                summary: 改 URL（触发重审）
                value:
                  websiteUrl: https://newshop.example.com
      responses:
        '200':
          description: 已处理（仅改方式 = 立即生效;改 URL = 待审核变更受理、原配置生效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EcommerceIntegrationView'
              example:
                integrationId: ec_1
                provider: shopify
                status: ACTIVE
                websiteUrl: https://shop.example.com
                pendingUrlChange: true
                urlChangeRequestId: eurc_9f2a
                paymentMethodConfig:
                  - online-wechat
                  - online-alipay
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208002
        - 208005
  /account/documents:
    get:
      tags:
        - documents
      operationId: getDocuments
      summary: Documents 只读展示（5 必传 + 2 可选；未上传必传项显示缺失占位）
      description: |
        只读返回入驻上传的文档：5 必传（Void Cheque / Owner ID / Certificate of Incorporation / Store Inside / Store Outside） + 2 可选 Other（仅已上传时返回）。已上传项含**内联展示**与**下载**两个短时效引用 + 文件类型；未上传必传项 `present: false`（缺失占位）。 两个引用指向同一份文件、只是交付方式不同；**均短时效且不可持久化**（这类文档含身份与银行资料）。 无自助上传 / 替换 / 删除入口（续期 / 替换走客服 / 管理后台）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: OK（只读文档列表）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentsView'
              example:
                required:
                  - docType: VOID_CHEQUE
