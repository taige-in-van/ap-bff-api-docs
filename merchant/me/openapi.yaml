  /account/settlement/change-requests:
    post:
      tags:
        - settlement
      operationId: createSettlementChangeRequest
      summary: 创建结算变更请求（前置全通过 → PENDING_REVIEW；旧值生效；409 若已有 PENDING_REVIEW；403 若意图不符）
      description: |
        前置步骤（bank-related: Void cheque + OTP / 非 bank: OTP）全通过后创建 `SettlementChangeRequest{PENDING_REVIEW}`（含本次变更 + bank-related 时 voidChequeRef）+ 发送结算变更审核中通知 + 旧值仍生效（结算字段不立即变更）。 资损红线：同 Merchant 至多 1 个 PENDING_REVIEW → 已存在则 409（不创建新请求）; **提交 changes ≠ otpToken 绑定的变更内容 → 403**（意图不符，OTP 防串改）; 直接提交绕过前置（缺有效 otpToken / bank 缺 voidChequeRef）→ 400； **`voidChequeRef` 指向的文件确定未就位**（直传未完成 / 被存储端拒收）→ `400`·204014，本次不创建、`otpToken` **未被消费**。 **204014 是终态、不可原样重试**：须**重新申请直传目标**（得到**新 `fileId`**）并重新直传——**不要向原目标补传**（直传目标是一次性的，提交失败即作废）。 因 `otpToken` 只授权它绑定的那个 `voidChequeRef`、对新 ref 无效，故**必须重走 request/verify OTP** 拿新 token，再用**新 token + 新 `Idempotency-Key`** 提交（OTP 绑定变更意图的必然结果，不设绕过路径）。 文件是否就位**暂时无法判定**（上游不可达 / 超时）→ `502` / `504`：**不必重传**，请求内容未变，用**原键原样重试**。 审核 approve/reject 结果异步更新（不在本 BFF）。 幂等：必带 `Idempotency-Key`。验证码只能用一次，**网络重试务必复用同一个键**——同键 + 同请求体重发返回**首次创建的那条变更请求**（不重复建、也不要求重走验证）；改了请求内容就必须换新键，沿用旧键改内容 → `409`·208005。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementChangeRequestInput'
            examples:
              bankRelated:
                summary: bank-related 变更（含 voidChequeRef）
                value:
                  otpToken: otk_9b3f7a21c8
                  voidChequeRef: 7d41b9c05e2a48f3ab6c1d802f5e9a37
                  changes:
                    bankName: TD
                    transitNumber: '54321'
                    institutionNumber: '004'
                    accountNumber: '12345678'
              nonBank:
                summary: 非 bank-related 变更（仅 storeId / schedule）
                value:
                  otpToken: otk_9b3f7a21c8
                  changes:
                    storeId: STORE-02
                    settlementSchedule: t3
      responses:
        '201':
          description: 已创建 PENDING_REVIEW（旧值仍生效，Edit 入口隐藏）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementChangeRequestCreated'
              example:
                changeRequestId: scr_7a1c9
                status: PENDING_REVIEW
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204014
        - 204017
        - 206005
        - 208001
        - 208002
        - 208005
  /account/refund-pin:
    put:
      tags:
        - refund-pin
      operationId: setRefundPin
      summary: 设置 Refund PIN（oneOf 授权：旧 PIN 改 / Forgot PIN reset-challenge OTP）
      description: |
        两种授权方式设新 PIN（oneOf 二选一），共同：new == confirm + 记录审计 + 触发 PIN-changed 通知邮件 + 旧 PIN 失效。 ① **改（currentPin 授权）**：校验 current PIN → 写 new PIN（new ≠ current）。current 不匹配 / new == current / 格式非法 → 400。成功后未完成的 Forgot PIN reset challenge 失效。 ② **Forgot 重置（reset-challenge OTP 授权）**：先 POST /account/refund-pin/reset-challenges 发 Owner email OTP，再凭 challengeId + code 授权 → 写 new PIN。OTP 错误可重试 400 / 超限锁定 423 / 过期已消费 410（均不持久化）。本 op 为 PIN 设置端点、OTP 校验内联，400 是通用校验失败、**不声明 `204010`**（即不承诺结构化剩余次数——区别于纯 OTP verify 端点）。OTP 一次性消费。 幂等：必带 `Idempotency-Key`。授权凭据校验一次即失效，**网络重试务必复用同一个键**——同键 + 同请求体重发返首次结果（`204`），不会因「凭据已用过」而假失败；改了请求体就必须换新键，沿用旧键改内容 → `409`·208005。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: ChangeByCurrentPin
                  type: object
                  additionalProperties: false
                  required:
                    - currentPin
                    - newPin
                    - confirmPin
                  properties:
                    currentPin:
                      allOf:
                        - $ref: '#/components/schemas/RefundPin'
                      description: 当前 Refund PIN（须匹配）
                    newPin:
                      allOf:
                        - $ref: '#/components/schemas/RefundPin'
                      description: 新 PIN；不可与 `currentPin` 相同
                    confirmPin:
                      allOf:
                        - $ref: '#/components/schemas/RefundPin'
                      description: 须与 `newPin` 一致
                - title: ResetByChallenge
                  type: object
                  additionalProperties: false
                  required:
                    - challengeId
                    - code
                    - newPin
                    - confirmPin
                  properties:
                    challengeId:
                      type: string
                      description: reset-challenge 实例 id
                    code:
                      allOf:
                        - $ref: '#/components/schemas/OtpCode'
                      description: Owner email 重置 OTP
                    newPin:
                      allOf:
                        - $ref: '#/components/schemas/RefundPin'
                      description: 新 PIN
                    confirmPin:
                      allOf:
                        - $ref: '#/components/schemas/RefundPin'
                      description: 须与 `newPin` 一致
            examples:
              change:
                summary: 旧 PIN 授权改
                value:
                  currentPin: '123456'
                  newPin: '654321'
                  confirmPin: '654321'
              reset:
                summary: Forgot PIN reset-challenge OTP 授权
                value:
                  challengeId: rpr_8c4e1d
                  code: '112233'
                  newPin: '654321'
                  confirmPin: '654321'
      responses:
        '204':
          description: 已设置（旧 PIN 失效；currentPin 授权改成功后未完成 reset challenge 失效）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206006
        - 206007
        - 208001
        - 208005
  /account/refund-pin/reset-challenges:
    post:
      tags:
        - refund-pin
      operationId: requestRefundPinResetOtp
      summary: Forgot PIN — 发送重置 OTP 到 Owner email（展示脱敏邮箱 + 启动冷却）
      description: |
        生成 OTP（6 位数字）发到 Owner 的登录邮箱 + 启动 Resend 冷却（默认 60s 可配）+ 返回脱敏邮箱。 Resend 冷却中 → 429（不发新 OTP）。Forgot PIN 不需 current PIN。按多步挑战流程语义不挂幂等键（每次发新 OTP，旧 OTP 失效）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 重置 OTP 已发送（展示脱敏 Owner email + 冷却启动）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                challengeId: rpr_8c4e1d
                deliveredTo: o***@e***.com
                cooldownSeconds: 60
                expiresAt: '2026-06-24T09:30:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208013
  /merchants:
    get:
