            integrationId:
              type: string
              readOnly: true
            provider:
              $ref: '#/components/schemas/EcommerceProvider'
            status:
              type: string
              enum:
                - PENDING_REVIEW
                - ACTIVE
                - REJECTED
              description: review-gated 态机
            websiteUrl:
              type: string
              format: uri
              description: 当前生效 URL；**无生效 URL 则不返回本键**
            pendingUrlChange:
              type: boolean
              const: true
            urlChangeRequestId:
              type: string
              description: 待审核 URL 变更请求 ID
            paymentMethodConfig:
              type: array
              description: 当前已关联的支付方式（methodId 集）。`manageEcommerceIntegration` 的方式配置分支是**覆盖式**提交，编辑弹窗用本字段预填当前值——漏传即等于取消关联。
              items:
                type: string
        - title: EcommerceIntegrationWithoutPendingUrlChange
          type: object
          additionalProperties: false
          required:
            - integrationId
            - provider
            - status
            - pendingUrlChange
            - paymentMethodConfig
          properties:
            integrationId:
              type: string
              readOnly: true
            provider:
              $ref: '#/components/schemas/EcommerceProvider'
            status:
              type: string
              enum:
                - PENDING_REVIEW
                - ACTIVE
                - REJECTED
              description: review-gated 态机
            websiteUrl:
              type: string
              format: uri
              description: 当前生效 URL；**无生效 URL 则不返回本键**
            pendingUrlChange:
              type: boolean
              const: false
            paymentMethodConfig:
              type: array
              description: 当前已关联的支付方式（methodId 集）。`manageEcommerceIntegration` 的方式配置分支是**覆盖式**提交，编辑弹窗用本字段预填当前值——漏传即等于取消关联。
              items:
                type: string
    IntegrationsView:
      type: object
      additionalProperties: false
      description: Integrations 段（Terminal 互斥 + Ecommerce 列表）
      required:
        - terminal
        - ecommerce
      properties:
        terminal:
          $ref: '#/components/schemas/TerminalIntegrationView'
        ecommerce:
          type: array
          items:
            $ref: '#/components/schemas/EcommerceIntegrationView'
    ServicePage:
      type: object
      additionalProperties: false
      description: Service Page 聚合（Service Capabilities 2 层 + Integrations 旁支）
      required:
        - acceptanceModes
        - integrations
      properties:
        acceptanceModes:
          type: array
          items:
            $ref: '#/components/schemas/AcceptanceModeView'
        integrations:
          $ref: '#/components/schemas/IntegrationsView'
    ConnectAcceptanceModeRequest:
      description: |
        Connect AcceptanceMode 申请（多态）：in_store→InStoreConnect；online+Website→WebsiteOnlineConnect（websiteUrl **必填**）；online+非Website→NonWebsiteOnlineConnect。 凭证缺失 / 格式非法 → 400;同 mode 已 PENDING_REVIEW 或 ACTIVE → 409。
      oneOf:
        - $ref: '#/components/schemas/InStoreConnect'
        - $ref: '#/components/schemas/WebsiteOnlineConnect'
        - $ref: '#/components/schemas/NonWebsiteOnlineConnect'
    InStoreConnect:
      type: object
      additionalProperties: false
      required:
        - mode
        - storePhotoFileId
      properties:
        mode:
          type: string
          enum:
            - in_store
        storePhotoFileId:
          type: string
          description: in_store 必填：store photo 文件 id（createStorePhotoUploadTarget 返回；PNG / JPEG，默认 ≤ 2MB 可配置）。Connect 时该文件才正式归属本次受理开通——文件未就位则拒绝 Connect
    WebsiteOnlineConnect:
      type: object
      additionalProperties: false
      required:
        - mode
        - onlineServiceType
        - websiteUrl
      description: online + Website：websiteUrl 必填
      properties:
        mode:
          type: string
          enum:
            - online
        onlineServiceType:
          type: string
          enum:
            - Website
        websiteUrl:
          type: string
          format: uri
          description: https，合法 host
    NonWebsiteOnlineConnect:
      type: object
      additionalProperties: false
      required:
        - mode
        - onlineServiceType
      description: online + App / MiniProgram / Other：不采集 websiteUrl（平台标识激活后人工补）
      properties:
        mode:
          type: string
          enum:
            - online
        onlineServiceType:
          type: string
          enum:
            - App
            - MiniProgram
            - Other
    TerminalIntegrationInput:
      type: object
      description: |
        连接 / 切换 Terminal provider（多态，按 provider 判别）。凭据保存后仅掩码回显，明文不二次回显。 `threedsEnabled` **每次必传**（两个变体均 required）；表单初始值取法见 `connectTerminalIntegration` 说明（按目标 provider 是不是当前生效者分两支，**不要一律从 `retained` 取**），两支都取不到才为 `false`。
      oneOf:
        - $ref: '#/components/schemas/MonerisTerminalInput'
        - $ref: '#/components/schemas/CloverTerminalInput'
      discriminator:
        propertyName: provider
        mapping:
          moneris: '#/components/schemas/MonerisTerminalInput'
          clover: '#/components/schemas/CloverTerminalInput'
    MonerisTerminalInput:
      type: object
      additionalProperties: false
      required:
        - provider
        - storeId
        - apiToken
        - threedsEnabled
      properties:
        provider:
          type: string
          enum:
            - moneris
        storeId:
          type: string
        apiToken:
          type: string
          description: 明文输入（保存后掩码回显）
        threedsEnabled:
          type: boolean
          description: 3DS 开关（线上交易 3DS 验证）。**必填**——本端点是全量覆盖 PUT，缺省不代表「保持原样」；前端提交时须回传当前表单值,否则会把已开启的 3DS 静默关掉。**表单初始值按目标 provider 是不是当前生效者分两支取**：目标 = 读面 `activeProvider`（更新在用凭据）→ 取 `terminal.threedsEnabled`;目标 ≠ 当前生效者（切换 / 停用后重连）→ 取 `retained` 里同 provider 那项（`retained` **按定义只含非生效 provider**,更新在用凭据时那里查不到它,**别据此当成未配置**）;两支都取不到才 `false`
    CloverTerminalInput:
      type: object
      additionalProperties: false
      required:
        - provider
        - publicToken
        - privateToken
        - threedsEnabled
      properties:
        provider:
          type: string
          enum:
            - clover
        publicToken:
          type: string
        privateToken:
          type: string
          description: 明文输入（保存后掩码回显）
        threedsEnabled:
          type: boolean
          description: 3DS 开关（线上交易 3DS 验证）。**必填**——本端点是全量覆盖 PUT，缺省不代表「保持原样」；前端提交时须回传当前表单值,否则会把已开启的 3DS 静默关掉。**表单初始值按目标 provider 是不是当前生效者分两支取**：目标 = 读面 `activeProvider`（更新在用凭据）→ 取 `terminal.threedsEnabled`;目标 ≠ 当前生效者（切换 / 停用后重连）→ 取 `retained` 里同 provider 那项（`retained` **按定义只含非生效 provider**,更新在用凭据时那里查不到它,**别据此当成未配置**）;两支都取不到才 `false`
    EcommerceIntegrationInput:
      type: object
      additionalProperties: false
      description: 连接 Ecommerce（review-gated）：website URL + 关联 PaymentMethod 配置（≥ 1 个 online 方式）
      required:
        - provider
        - websiteUrl
        - paymentMethodConfig
      properties:
        provider:
          $ref: '#/components/schemas/EcommerceProvider'
        websiteUrl:
          type: string
          format: uri
          description: https，合法 host
        paymentMethodConfig:
          type: array
          minItems: 1
          description: 关联 online PaymentMethod id（取自 `getServicePage` 的 online mode `paymentMethods[].methodId`，前端不写死）
          items:
            type: string
    EcommerceIntegrationManage:
      description: |
        管理 ACTIVE Ecommerce（多态，互斥二选一）：UrlChange（websiteUrl 必填 → 触发重审、原 URL / 原配置继续生效） 或 MethodConfigChange（paymentMethodConfig 必填 → 不重审、立即生效）。空 body / 同时传两者 → 400;已有待审核 URL 变更时再改 URL → 409。
      oneOf:
        - $ref: '#/components/schemas/EcommerceUrlChange'
        - $ref: '#/components/schemas/EcommerceMethodConfigChange'
    EcommerceUrlChange:
      type: object
      additionalProperties: false
      required:
        - websiteUrl
      properties:
        websiteUrl:
          type: string
          format: uri
          description: 改 URL → 触发重审（原 URL / 原配置继续生效）
    EcommerceMethodConfigChange:
      type: object
      additionalProperties: false
      required:
        - paymentMethodConfig
      properties:
        paymentMethodConfig:
          type: array
          minItems: 1
          description: 仅改方式配置 → 不重审、立即生效
          items:
            type: string
    DocumentItem:
      description: 文档项（只读；未上传必传项 present=false 缺失占位）
      oneOf:
        - title: PresentDocument
          type: object
          additionalProperties: false
          required:
            - docType
            - present
            - fileName
            - fileType
            - previewUrl
            - downloadUrl
          properties:
            docType:
              type: string
              enum:
                - VOID_CHEQUE
                - OWNER_ID
                - CERTIFICATE_OF_INCORPORATION
                - STORE_INSIDE
                - STORE_OUTSIDE
                - OTHER
            present:
              type: boolean
              const: true
            fileName:
              type: string
              description: 文件名
            fileType:
              type: string
              description: MIME 类型（如 application/pdf、image/jpeg）
            previewUrl:
              type: string
              format: uri
              readOnly: true
              description: '**内联展示**用引用（浏览器直接渲染，如放进 `<img>` 或内嵌查看器）。 **短时效**、过期后重新调本接口取新值；**不要持久化、不要分享**——这类文档含身份与银行资料，地址泄露即资料泄露。'
            downloadUrl:
              type: string
              format: uri
              readOnly: true
              description: '**下载**用引用（浏览器另存为文件）。与 `previewUrl` 指向同一份文件、只是交付方式不同。 **短时效**、过期后重新调本接口取新值；**不要持久化、不要分享**。'
        - title: MissingDocument
          type: object
          additionalProperties: false
          required:
            - docType
            - present
          properties:
            docType:
              type: string
              enum:
                - VOID_CHEQUE
                - OWNER_ID
                - CERTIFICATE_OF_INCORPORATION
                - STORE_INSIDE
                - STORE_OUTSIDE
                - OTHER
            present:
              type: boolean
              const: false
              description: 缺失占位
    DocumentsView:
      type: object
      additionalProperties: false
      description: 只读文档列表（required 5 项必返回含缺失占位；optional 仅已上传时返回）
      required:
        - required
        - optional
      properties:
        required:
          type: array
          description: 5 必传文档项（未上传 present=false）
          items:
            $ref: '#/components/schemas/DocumentItem'
        optional:
          type: array
          description: 2 可选 Other（仅已上传时返回，未上传不占位）
          items:
            $ref: '#/components/schemas/DocumentItem'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            currentMerchantId:
              type: string
              description: 服务端会话当前商户（≠ 请求携带的 expected `X-Merchant-Context`），供前端 re-sync；**无当前商户则不返回本键**（前端须重选）。
            maskedEmail:
              type: string
              description: 已遮蔽的邮箱（形如 `j***@example.com`），**只作展示、不可回填表单**。
    SettlementCycleCode:
      type: string
      minLength: 1
      description: 结算周期档位的**稳定取值**（`SettlementCycleOption.code`）。**对客户端不透明**——从候选集里取来原样回传， 不要解析、拼接或据其分支；**不要传展示名**（那是展示文案、不是取值）。 服务端按**提交时点**的候选集校验：不在集内 → 拒绝（`400`·`204017` + `details` 字段级明细），**不静默回落到候选集第一项**；前端应重取候选集让用户重选。 ⚠️ **你当前选中的取值不会凭空失效**——「打开编辑框却选不中自己现在的档位」「草稿存不回去」这类情形不会发生，无需为此写兜底。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    SettlementCycleOption:
      type: object
      description: 结算周期档位的一个候选项（入驻向导与商户资料的 Settlement 编辑面共用同一形状）。
      additionalProperties: false
      required:
        - code
        - displayName
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 本档位的稳定取值；候选集与取值域由后端配置决定，契约不写死。
        displayName:
          type: string
          minLength: 1
          description: canonical 展示名（**非本地化**、不随 locale 变）。前端有自己的多语言资源时按 `code` 取用，本字段作 unknown-safe 兜底。
    FileUploadTargetRequest:
      type: object
      additionalProperties: false
      description: '**申请直传目标的入参**。所有上传入口形状一致 —— 用**声明值**换一个直传目标,文件字节不经本平台 API。 校验按声明值做:`purpose` 决定允许的格式与大小上限,不合规 → 400 且**不签发目标**; 两项同时写入目标的提交条件,实际超限的文件在提交时即被存储端拒收。 **内容类型按声明判定,不做内容识别。**'
      required:
        - purpose
        - fileName
        - contentType
        - fileSize
      properties:
        purpose:
          type: string
          description: 文件用途 —— 决定允许的格式、大小上限与取用方式。取值集合由各消费面自行定义; **每个上传入口只接受它所属业务范围内的用途**,传入范围外的用途 → 400。
        fileName:
          type: string
          description: 原始文件名(保留作展示;直传后服务端无从取得,须在此声明)。
        contentType:
          type: string
          description: 声明的内容类型;不在该 `purpose` 的白名单内 → 400。
        fileSize:
          type: integer
          format: int64
          description: 声明的字节数;超该 `purpose` 的上限 → 400。上限同时写入提交条件。
    MerchantFilePurpose:
      type: string
      description: |
        商户后台可上传的**文件用途**总表 —— 用途决定允许的格式、大小上限与取用方式。
        每个上传入口只接受它所属业务范围内的用途（各入口在自己的请求体里列出），传入范围外的用途 → 400。

        | 用途 | 允许格式 | 大小上限 | 传上去之后怎么取用 |
        |---|---|---|---|
        | `onboarding_document` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（含身份与银行资料，仅授权主体可取） |
        | `settlement_void_cheque` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `store_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `merchant_logo` | PNG / JPEG | 默认 512KB（可配置） | 长效稳定的公开地址（要展示给外部访客） |
        | `payment_page_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `payment_link_banner` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `payment_link_brand_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |

        **短时效地址不要持久化、不要分享**（过期即失效，重新读取所在资源可拿到新的）；长效公开地址可直接放进页面。
      enum:
        - onboarding_document
        - settlement_void_cheque
        - store_photo
        - merchant_logo
        - payment_page_logo
        - payment_link_banner
        - payment_link_brand_logo
    Timestamp:
      type: string
      format: date-time
      description: '**瞬时时刻**(RFC 3339 date-time)。in/out 非对称:**响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z); **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset, 「出参 Z」是约定、非 schema 可强制)。展示可按商户 IANA 时区换算(单独字段,offset ≠ timezone)。 **只表示「什么时候发生」,不表示「算哪一天」** —— 需要「哪一天」的地方各有自己的**日期字段**(`YYYY-MM-DD`), **别拿本类型自己推**：两者在跨日边界附近会分属两天。'
    FileUploadTarget:
      type: object
      description: '**文件直传目标**。上传分两步:先向业务接口取得本对象,再由客户端把文件连同 `fields` 一起提交到 `action`; 提交成功后回到业务接口完成绑定 —— **未完成绑定的文件不可用**(取不到、无法预览或下载)。 提交方式**固定**:`POST` + `multipart/form-data`,先把 `fields` 逐项追加,**最后**追加名为 `file` 的文件本体 (存储端要求文件是最后一个字段,其后的字段会被忽略)。**不要手设 `Content-Type`** —— 直接提交 `FormData` 让客户端自己带上 `boundary`,手设会丢 `boundary`、导致存储端解析不出表单。 `fields` **必须原样全部提交、不得增删或改写**:签名与签发时的条件(允许的内容类型、大小上限、有效期)绑定,改动会被存储端拒绝。 **成功判据 = HTTP 2xx**(具体码由存储端决定,不要判具体值);失败时返回的是**存储端自己的格式、不是本平台错误体**。 本对象**限时有效、一次性**,且**只能用于其中的那个 `fileId`**——不能拿它上传别的文件。 **提交失败后不要向原目标重试**:重新申请一个目标,会得到**新的 `fileId`**,后续业务提交须改用新引用;过期同理。'
      required:
        - fileId
        - action
        - fields
        - expiresAt
      properties:
        fileId:
          type: string
          description: 该文件的稳定引用。业务侧后续一律用它指代此文件(绑定 / 取用 / 展示均凭此); **不要保存 `action` 或任何物理地址** —— 存储位置会变更,而 `fileId` 不变。
          examples:
            - 0f8c2a6e4b1d47f0a9c3e5d7b2148a6f
        action:
          type: string
          format: uri
          description: 表单提交目标(对象存储端点,非本平台 API)。
        fields:
          type: object
          additionalProperties:
            type: string
          description: 必须随文件一起提交的表单字段(含签名)。原样提交、键值不改; **文件本体在这些字段全部追加完之后、以 `file` 为字段名追加**(必须是最后一个字段)。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 本目标的失效时刻。**过了这个点提交会被存储端拒绝**,须重新申请一个目标。 用户选好文件后放置较久、或准备提交大文件时,可据此提前判断要不要先换一个新目标, 不必等提交失败再回退。
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
    RefundPin:
      type: string
      writeOnly: true
      pattern: ^[0-9]{6}$
      description: 商户级 Refund PIN——**6 位纯数字**。 **write-only**：仅作入参采集，**绝不出现在任何响应**（含错误响应）；读面走掩码 / 已填标志。
  parameters:
    MerchantContextGuard:
      name: X-Merchant-Context
      in: header
      required: true
      description: |
        stale-tab 一致性守卫（读写统一）：页面预期的当前商户 ID。与会话当前商户比对，一致才执行；不一致时**读不返回错商户数据、写不执行**，并按下面两种情形二分： **① 会话有当前商户、只是与 expected 不同 → `409` · `208001`（`MERCHANT_CONTEXT_CHANGED`）**，响应 `context.currentMerchantId` 回显服务端当前商户供前端直接 re-sync； **② 会话没有当前商户（无可回显者）→ `409` · `208022`（`MERCHANT_NOT_ACCESSIBLE`）**，前端重跑启动链路按 `routeTo` 分流（见 API 基础约定「merchant scope + stale-tab 守卫」）。 挂在所有依赖当前商户的读 + 写接口；前端统一 interceptor 发送 + 处理 409（提示并刷新当前商户）。 **豁免**：不依赖「当前商户」的接口——当前商户的 re-sync / 切换入口本身，以及目标由 path 直接指定、与当前商户无关的接口。 某个接口挂没挂本 header，**看该接口的 `parameters` 即可**（挂了就是必带）。
      schema:
        type: string
        minLength: 1
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: \S
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: \S
  responses:
    MerchantBffDefaultError:
      description: |
        非 2xx 统一错误响应——覆盖所有未在本 op 显式列出的状态码。 HTTP status 只表达大类，**具体子因看响应体的整数 `code`**：该 op 承诺的业务码见其 `x-error-codes`， 码的**固有属性**（`name` / `httpStatus` / `retryable` / 必带 context 字段）见**随包错误码表**； **该码在本接口下意味着什么、你该怎么处理，见本接口自己的说明**（怎么读见 API 基础约定「错误响应体」）。 部分码另带 `context` 结构化上下文（如 stale-tab 守卫 `208001` 必携 `context.currentMerchantId` 供前端 re-sync 当前商户）—— 哪些码必携哪些字段，以码表的 `requiredContextFields` 为准，**不要按状态码猜**。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
