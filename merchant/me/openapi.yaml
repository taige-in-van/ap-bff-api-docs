                    fileName: void-cheque.pdf
                    fileType: application/pdf
                    previewUrl: https://files.example.com/o/8f1c2a6e?exp=1755331200&sig=REDACTED&disp=inline
                    downloadUrl: https://files.example.com/o/8f1c2a6e?exp=1755331200&sig=REDACTED&disp=attachment
                  - docType: OWNER_ID
                    present: false
                  - docType: CERTIFICATE_OF_INCORPORATION
                    present: true
                    fileName: coi.pdf
                    fileType: application/pdf
                    previewUrl: https://files.example.com/o/3b7d90a4?exp=1755331200&sig=REDACTED&disp=inline
                    downloadUrl: https://files.example.com/o/3b7d90a4?exp=1755331200&sig=REDACTED&disp=attachment
                  - docType: STORE_INSIDE
                    present: true
                    fileName: inside.jpg
                    fileType: image/jpeg
                    previewUrl: https://files.example.com/o/c41e6b28?exp=1755331200&sig=REDACTED&disp=inline
                    downloadUrl: https://files.example.com/o/c41e6b28?exp=1755331200&sig=REDACTED&disp=attachment
                  - docType: STORE_OUTSIDE
                    present: true
                    fileName: outside.jpg
                    fileType: image/jpeg
                    previewUrl: https://files.example.com/o/5a92f0d7?exp=1755331200&sig=REDACTED&disp=inline
                    downloadUrl: https://files.example.com/o/5a92f0d7?exp=1755331200&sig=REDACTED&disp=attachment
                optional: []
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。 浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）； 商户级读写另挂 MerchantContextGuard 守卫（见下方 parameters）。
  schemas:
    RelationType:
      type: string
      enum:
        - branch
        - new_legal_entity
      description: 关联商户关系类型（创建即定，不再变动）
    AcceptanceModeType:
      type: string
      enum:
        - in_store
        - online
      description: 商户业务模式（in_store / online）。**封闭 enum**（取值集固定、可穷举分支）；前端仍须 unknown-safe（遇未识别值保守处理、不静默丢弃）。
    AcceptanceModeStatus:
      type: string
      enum:
        - NOT_ENROLLED
        - PENDING_REVIEW
        - ACTIVE
        - REJECTED
      description: |
        AcceptanceEnrollment 开通态（状态流转见 flows）。 **NOT_ENROLLED** = 该 mode 可开通但尚未发起 Connect（Service Page 据此区分「未开通」与「开通中 / 已开通」），无 enrollment 行。
    TerminalProvider:
      type: string
      enum:
        - moneris
        - clover
      description: POS 终端 provider（互斥）
    EcommerceProvider:
      type: string
      enum:
        - shopify
        - allvalue
      description: 电商平台 provider（不互斥）
    SettlementOptions:
      type: object
      additionalProperties: false
      required:
        - settlementCycleOptions
      description: |
        Settlement section 的**动态值域**。示例值仅为当前实例的一种可能取值， **不构成契约承诺**——实际候选集由后端配置决定。
      properties:
        settlementCycleOptions:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SettlementCycleOption'
          description: 可选结算周期档位。**顺序即展示顺序**——前端不要自己排序。⚠️ **编辑面的初始选中 = 该商户当前的 `settlementSchedule`**（取自 `getAccountProfile`），**不是本数组的第一项**；本数组只用于渲染下拉与校验提交值。提交时回传选中项的 `code`。
    BusinessInformationOptions:
      type: object
      additionalProperties: false
      required:
        - timeZoneOptions
      description: |
        Business Information section 的**动态值域**。示例值仅为当前实例的一种可能取值， **不构成契约承诺**——实际候选集由后端配置决定（与商户 country 联动）。
      properties:
        timeZoneOptions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/TimeZone'
          description: 当前商户可选的 IANA 时区白名单（顺序即建议展示顺序）。
    TimeZone:
      type: string
      minLength: 1
      description: |
        商户时区，取 **IANA tz database 标识**（如 `America/Toronto`）；**不用 PT/ET 等缩写**（缩写无法表达夏令时 DST）。 **取值域 = 后端动态配置的白名单**（与 country 联动、随部署 / 运营调整），**契约不写死候选集**—— 候选集由 `GET /account/profile/business-information/options` 下发，前端据此渲染选项。 本字段**从设计起即为可扩展取值**，消费方须 **unknown-safe** （遇未知 tz 原样透传 / 展示，不得因不在本地枚举而报错或丢值）。 商户的时区。**「今日 / 本月」这类相对日期由服务端认定,前端不要拿本字段自己推。**
      examples:
        - America/Toronto
    LockedField:
      type: object
      additionalProperties: false
      description: Locked 字段展示项：值 + locked 标识（服务端强制，展示 + 救济提示在前端）
      required:
        - locked
      properties:
        value:
          type: string
          description: 字段当前值；**底层无值则不返回本键**，该字段仍按 Locked 展示
        locked:
          type: boolean
          description: 恒 true（Business Information 内 7 项 Locked 字段）
    IndustryCategoryDisplayName:
      type: string
      minLength: 1
      description: 行业的**展示名**（如 `Food & Beverage`），由服务端从入驻时的同一份行业配置解析后给出。 入驻提交与持久化用的是**稳定行业标识**（见入驻契约 `OnboardingConfig.industries[].code`，形如 `FOOD_BEVERAGE`）， 本域**不回传该标识**——商户资料侧没有行业配置读取面，拿到标识也无从解析成人读文案。 本字段**只读、只供展示**（Industry 属 Locked 字段、不可自助修改），前端不要解析它、也不要拿它做分支或回传。
      examples:
        - Food & Beverage
    BusinessInformationView:
      type: object
      additionalProperties: false
      description: Business Information section 展示（7 Locked 字段含 locked 标识 + 7 可编辑字段当前值）
      properties:
        legalBusinessName:
          $ref: '#/components/schemas/LockedField'
        tradeName:
          $ref: '#/components/schemas/LockedField'
        ownershipType:
          $ref: '#/components/schemas/LockedField'
        registrationNumber:
          $ref: '#/components/schemas/LockedField'
        referredBy:
          $ref: '#/components/schemas/LockedField'
        industryCategory:
          allOf:
            - $ref: '#/components/schemas/LockedField'
          description: Locked 展示项；其 `value` 是行业**展示名**（口径见 `IndustryCategoryDisplayName`），**与 Header card 的 `industryCategoryDisplayName` 同源同值**——两处是同一份数据的两个呈现位，不是两项数据。本键沿用字段名（与其余 6 项 Locked 字段并列），展示名装在 `value` 里
        mcc:
          $ref: '#/components/schemas/LockedField'
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        country:
          type: string
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        businessPhone:
          type: string
    ProfileHeader:
      type: object
      additionalProperties: false
      description: Header card（identity 概览；不是第五 section）
      required:
        - merchantCode
        - tradeName
        - legalBusinessName
      properties:
        merchantCode:
          type: string
          readOnly: true
          description: Merchant ID（创建时分配、对外展示；Header card 展示项）
        logoUrl:
          type: string
          format: uri
          description: Logo URL；**无 Logo 则不返回本键**（前端回退默认首字母标识）
        tradeName:
          type: string
        legalBusinessName:
          type: string
        industryCategoryDisplayName:
          $ref: '#/components/schemas/IndustryCategoryDisplayName'
        mcc:
          type: string
    ContactInformationView:
      type: object
      additionalProperties: false
      description: Contact Information section 展示（只读聚合；编辑走 owner-contact 端点）
      properties:
        contactName:
          type: string
          description: contactFirstName + contactLastName 组合展示
        contactTitle:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
          description: '= Owner Primary Email = 登录邮箱（三合一）'
    ProfileFunds:
      description: |
        资金字段（只读展示，无修改入口）。Profile 固定展示区块。 **降级**：资金数据不可用时 `available=false` + 金额省略（区块仍在、标注暂不可用），不阻断 Profile 其余区块。
      oneOf:
        - title: FundsAvailable
          type: object
          additionalProperties: false
          required:
            - available
            - accountBalance
            - refundReserved
          properties:
            available:
              type: boolean
              const: true
              description: 资金数据可用
            accountBalance:
              $ref: '#/components/schemas/Money'
            refundReserved:
              $ref: '#/components/schemas/Money'
        - title: FundsUnavailable
          type: object
          additionalProperties: false
          required:
            - available
          properties:
            available:
              type: boolean
              const: false
              description: 资金数据不可用；金额省略
    DocumentsSummary:
      type: object
      additionalProperties: false
      description: Documents section 摘要（明细见 GET /account/documents）
      properties:
        total:
          type: integer
          description: 已上传文档数
        missing:
          type: integer
          description: 缺失必传文档数
    AccountProfile:
      type: object
      additionalProperties: false
      description: Profile 概览聚合（Header card + 4 section + 资金只读）
      required:
        - merchantId
        - status
        - header
        - businessInformation
        - settlement
        - contactInformation
        - funds
        - documentsSummary
      properties:
        merchantId:
          type: string
          readOnly: true
        status:
          type: string
          const: ACTIVE
          readOnly: true
          description: 恒为 `ACTIVE`——本响应只在商户已激活时产生，故该字段无其他取值
        header:
          $ref: '#/components/schemas/ProfileHeader'
        businessInformation:
          $ref: '#/components/schemas/BusinessInformationView'
        settlement:
          $ref: '#/components/schemas/SettlementView'
        contactInformation:
          $ref: '#/components/schemas/ContactInformationView'
        funds:
          $ref: '#/components/schemas/ProfileFunds'
        documentsSummary:
          $ref: '#/components/schemas/DocumentsSummary'
    BusinessInformationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        编辑请求：7 项可编辑字段 + 7 项 Locked 字段（Locked 字段为合法槽位以便服务端兑现 403）。 Locked 字段是合法属性（不作未知属性打成 400）；任一 Locked 字段出现在请求体 → 服务端拒绝 → **403 + 审计**； 真正未知属性 → 400；空提交（no-op）→ 400。 校验：postalCode 按国家格式、phone 按区号白名单与对应长度规则（部署可配；`+1` / 10 位只是空白表单初始值、编辑时回显当前值）、Province × Country 联动（可选项后端配置驱动）。
      properties:
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2（CA / US）；展示名可本地化
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        businessPhone:
          type: string
        legalBusinessName:
          type: string
          description: Locked：出现即 403 + 审计
        tradeName:
          type: string
          description: Locked：出现即 403 + 审计
        ownershipType:
          type: string
          description: Locked：出现即 403 + 审计
        registrationNumber:
          type: string
          description: Locked：出现即 403 + 审计
        referredBy:
          type: string
          description: Locked：出现即 403 + 审计
        industryCategory:
          type: string
          description: Locked：出现即 403 + 审计
        mcc:
          type: string
          description: Locked：出现即 403 + 审计
    LogoRef:
      type: object
      additionalProperties: false
      required:
        - logoUrl
      properties:
        logoUrl:
          type: string
          format: uri
          readOnly: true
          description: 生效后 Logo 的**可渲染地址**（只出不入；长效稳定的公开地址，可直接放进页面）。本响应不回引用——引用即刚提交的那个 `fileId`
    SettlementView:
      type: object
      additionalProperties: false
      description: 结算字段展示（account_number 掩码仅末 4 位；Legal Business Name 只读同步 Locked）
      required:
        - accountNumberMasked
        - settlementSchedule
        - pendingReview
      properties:
        legalBusinessName:
          type: string
          readOnly: true
          description: 本 section 只读展示，同步 Locked
        bankName:
          type: string
        transitNumber:
          type: string
          description: 5 位数字
        institutionNumber:
          type: string
          description: 3 位数字
        accountNumberMasked:
          type: string
          readOnly: true
          description: account_number 仅末 4 位（`•••• 5678`；明文不返回）
        settlementSchedule:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 该商户当前的结算周期档位 code；**编辑面以本值作初始选中**，展示名按 `getSettlementOptions` 的同 code 项取（或前端自有 i18n 资源）
        storeId:
          type: string
          description: 可选；**未指定则不返回本键**
        pendingReview:
          type: boolean
          readOnly: true
          description: 存在 PENDING_REVIEW 变更请求 → true（前端隐 Edit 入口 + 审核中提示）
    OtpChallenge:
      type: object
      additionalProperties: false
      description: Owner email OTP 挑战句柄（结算变更 / Forgot PIN；一次性凭据，过期 / 已用 → 410、冷却中 → 429）。FE 用 cooldownSeconds 启动重发倒计时、用 expiresAt 判断挑战是否仍有效。
      required:
        - challengeId
        - deliveredTo
        - cooldownSeconds
        - expiresAt
      properties:
        challengeId:
          type: string
          readOnly: true
        deliveredTo:
          type: string
          readOnly: true
          description: 脱敏投递目标（Owner email，如 o***@e***.com）。
        cooldownSeconds:
          type: integer
          readOnly: true
          description: 重发冷却秒数（业务参数）。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
    SettlementChangeRequestInput:
      description: |
        创建结算变更（多态二选一）：NonBank（仅 storeId / settlementSchedule、无 voidChequeRef）或 Bank（含 bank 字段 → voidChequeRef **必填**）。 otpToken 绑定本次变更内容 + voidChequeRef；提交 changes ≠ 绑定内容 → 403（意图不符）。**含 bank 字段但缺 voidChequeRef → 400**。
      oneOf:
        - $ref: '#/components/schemas/NonBankSettlementChange'
        - $ref: '#/components/schemas/BankSettlementChange'
    NonBankSettlementChange:
      type: object
      additionalProperties: false
      required:
        - otpToken
        - changes
      properties:
        otpToken:
          type: string
          description: verifySettlementOtp 签发的单次 token
        changes:
          $ref: '#/components/schemas/NonBankSettlementChanges'
    BankSettlementChange:
      type: object
      additionalProperties: false
      required:
        - otpToken
        - voidChequeRef
        - changes
      properties:
        otpToken:
          type: string
          description: verifySettlementOtp 签发的单次 token
        voidChequeRef:
          type: string
          description: bank-related 变更必带（createSettlementVoidChequeUploadTarget 返回的 fileId）；须与 otpToken 绑定值一致。创建本请求时该文件才正式归属它——文件未就位则拒绝创建
        changes:
          $ref: '#/components/schemas/BankSettlementChanges'
    NonBankSettlementChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 非 bank 变更：仅 storeId / settlementSchedule（不含 bank 字段、不需 voidChequeRef）
      properties:
        storeId:
          type: string
        settlementSchedule:
          $ref: '#/components/schemas/SettlementCycleCode'
    BankSettlementChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      description: bank 变更：含 bank 字段（可同时改 storeId / schedule）；触发 voidChequeRef 必填
      properties:
        bankName:
          type: string
        transitNumber:
          type: string
          pattern: ^[0-9]{5}$
          description: 5 位数字
        institutionNumber:
          type: string
          pattern: ^[0-9]{3}$
          description: 3 位数字
        accountNumber:
          type: string
          pattern: ^[0-9]{6,12}$
          description: 6-12 位数字（明文输入，read 视图掩码）
        storeId:
          type: string
        settlementSchedule:
          $ref: '#/components/schemas/SettlementCycleCode'
    SettlementChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 本次变更的 Settlement 字段（仅含改动字段；`minProperties:1` 拒空变更 no-op）
      properties:
        storeId:
          type: string
          description: 非 bank-related
        settlementSchedule:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 非 bank-related
        bankName:
          type: string
          description: bank-related
        transitNumber:
          type: string
          pattern: ^[0-9]{5}$
          description: bank-related；5 位数字
        institutionNumber:
          type: string
          pattern: ^[0-9]{3}$
          description: bank-related；3 位数字
        accountNumber:
          type: string
          pattern: ^[0-9]{6,12}$
          description: bank-related；6-12 位数字（明文输入，read 视图掩码）
    SettlementChangeRequestCreated:
      type: object
      additionalProperties: false
      required:
        - changeRequestId
        - status
      properties:
        changeRequestId:
          type: string
          readOnly: true
        status:
          type: string
          enum:
            - PENDING_REVIEW
          readOnly: true
    MerchantListItem:
      type: object
      additionalProperties: false
      description: switcher 列表行（仅 ACTIVE / INCOMPLETE / PENDING_REVIEW）
      required:
        - merchantId
        - merchantCode
        - tradeName
        - status
      properties:
        merchantId:
          type: string
          readOnly: true
        merchantCode:
          type: string
          readOnly: true
          description: Merchant ID（对外展示）
        tradeName:
          type: string
        status:
          type: string
          enum:
            - INCOMPLETE
            - PENDING_REVIEW
            - ACTIVE
          description: switcher 仅 INCOMPLETE / PENDING_REVIEW / ACTIVE（REJECTED 不在 switcher）
        relationType:
          allOf:
            - $ref: '#/components/schemas/RelationType'
          description: 关联关系；**root 商户不返回本键**
    AddMerchantRequest:
      type: object
      additionalProperties: false
      description: Add 关联商户（创建 INCOMPLETE 关联商户 + 关系；字段预填及 5 步规则由入驻向导接口返回）
      required:
        - tradeName
        - country
        - currency
        - relationType
      properties:
        tradeName:
          type: string
          description: 允许与现有商户同名（靠 Merchant ID 区分）
        country:
          type: string
          description: ISO 3166-1 alpha-2（CA / US）;Country × Currency 须有效组合（CAD→CA / USD→CA·US）
        currency:
          $ref: '#/components/schemas/Currency'
        relationType:
          $ref: '#/components/schemas/RelationType'
    PaymentMethodState:
      type: object
      additionalProperties: false
      description: '该 mode 下**一个可选支付方式**的呈现与启用态。⚠️ **本数组是候选全集、不是已启用子集**—— 未启用的方式也在里面（`enabled: false`），「管理支付方式」弹窗直接拿它渲染可勾选项，不需要另调接口取候选。'
      required:
        - methodId
        - displayName
        - enabled
      properties:
        methodId:
          type: string
          minLength: 1
          description: 按 mode 区分的 method id（如 `instore-wechat` / `online-alipay`）；提交 `updateAcceptanceModePaymentMethods` 时用它
          examples:
            - instore-wechat
            - online-alipay
        displayName:
          type: string
          description: 展示名（品牌名，如 WeChat Pay）——必返，直接渲染
        iconUrl:
          type: string
          format: uri
          description: 展示图标 URL；无图标则**不返回本键**，前端按自身资产兜底
        enabled:
          type: boolean
          description: 该方式当前是否已在本 mode 启用
    AcceptanceModeView:
      description: AcceptanceMode 分组（开通/审核状态 + 该 mode 支付方式候选全集〔含未启用项〕 + online 当前 URL）
      oneOf:
        - title: AcceptanceModeWithPendingUrlChange
          type: object
          additionalProperties: false
          required:
            - mode
            - status
            - pendingUrlChange
            - urlChangeRequestId
            - paymentMethods
          properties:
            mode:
              $ref: '#/components/schemas/AcceptanceModeType'
            status:
              $ref: '#/components/schemas/AcceptanceModeStatus'
            websiteUrl:
              type: string
              format: uri
              description: online 当前生效 URL（原 URL 继续生效）；**无生效 URL 则不返回本键**
            pendingUrlChange:
              type: boolean
              const: true
            urlChangeRequestId:
              type: string
              description: 待审核 URL 变更请求 ID
            paymentMethods:
              type: array
              items:
                $ref: '#/components/schemas/PaymentMethodState'
        - title: AcceptanceModeWithoutPendingUrlChange
          type: object
          additionalProperties: false
          required:
            - mode
            - status
            - pendingUrlChange
            - paymentMethods
          properties:
            mode:
              $ref: '#/components/schemas/AcceptanceModeType'
            status:
              $ref: '#/components/schemas/AcceptanceModeStatus'
            websiteUrl:
              type: string
              format: uri
              description: online 当前生效 URL；**in_store 无 URL，不返回本键**
            pendingUrlChange:
              type: boolean
              const: false
            paymentMethods:
              type: array
              items:
                $ref: '#/components/schemas/PaymentMethodState'
    TerminalIntegrationView:
      description: TerminalIntegration 摘要（凭据掩码）。按 `connected` 判别：已连接分支带生效 provider，未连接分支不带。
      oneOf:
        - title: ActiveTerminalIntegration
          type: object
          additionalProperties: false
          required:
            - connected
            - activeProvider
            - threedsEnabled
            - credentialSummary
          properties:
            connected:
              type: boolean
              const: true
            activeProvider:
              $ref: '#/components/schemas/TerminalProvider'
            threedsEnabled:
              type: boolean
              description: 生效 provider 的 3DS 开关
            credentialSummary:
              type: string
              readOnly: true
              description: 凭据掩码摘要（明文 token / secret 不返回）
            retained:
              type: array
              uniqueItems: true
              description: '**另一个** provider 的保留配置（切换走的那个；没有则不返回本键）。用于「切回去」时预填，语义同未连接分支的 `retained`'
              items:
                $ref: '#/components/schemas/RetainedTerminalConfig'
        - title: InactiveTerminalIntegration
          type: object
          additionalProperties: false
          required:
            - connected
          properties:
            connected:
              type: boolean
              const: false
              description: 当前无生效 provider——本分支不返回 `activeProvider`
            retained:
              type: array
              uniqueItems: true
              description: 已保留凭据的 provider 配置；**从未连接过任何 provider 时不返回本键**。两个 provider 都有保留配置时本数组两项，各自归属由项内 `provider` 指明
              items:
                $ref: '#/components/schemas/RetainedTerminalConfig'
    RetainedTerminalConfig:
      type: object
      additionalProperties: false
      description: 某个**当前不生效**的 POS provider 的保留配置——切换走或停用时凭据与 3DS 一并保留，供再次连接时预填。
      required:
        - provider
        - threedsEnabled
      properties:
        provider:
          $ref: '#/components/schemas/TerminalProvider'
        threedsEnabled:
          type: boolean
          description: 该 provider 上次生效时的 3DS 开关；再次连接时以它作为表单初始值
        credentialSummary:
          type: string
          readOnly: true
          description: 该 provider 保留凭据的掩码摘要（明文不返回）
    EcommerceIntegrationView:
      description: EcommerceIntegration 摘要（不互斥）
      oneOf:
        - title: EcommerceIntegrationWithPendingUrlChange
          type: object
          additionalProperties: false
          required:
            - integrationId
            - provider
            - status
            - pendingUrlChange
            - urlChangeRequestId
            - paymentMethodConfig
