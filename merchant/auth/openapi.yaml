openapi: 3.1.0
info:
  title: 商户后台 注册登录与认证 — 前端契约面
  version: 0.22.0
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的注册 / 登录 / 会话 / 账户安全 / 团队成员 契约。 浏览器持 httpOnly 会话 cookie（登录后 set-cookie），字段类型与校验规则以本 spec 各字段为准。 幂等/CSRF 口径:① **创建类**(注册/建成员)与**非天然幂等 / 有副作用的写**(如改密〔失效会话〕、改成员)挂 Idempotency-Key;**真正天然幂等的纯 PUT/DELETE 可不挂**;**认证类(登录/登出/MFA/扫码)与多步 OTP 挑战类(改邮箱/找回)按流程语义不挂幂等键**(每次都应重新认证/校验);**例外**:找回流程的 `factor-verification` 步骤挂 Idempotency-Key(该步幂等、重放同键返回同一 resetToken,杜绝网络重试因 OTP 已消费假失败)。 ② cookieAuth 的非安全方法一律挂 X-CSRF-Token(double-submit,fail-closed);公开端点(security:[])无会话故无 CSRF。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（经边缘网关；浏览器 ↔ BFF 用会话 cookie）
security:
  - cookieAuth: []
tags:
  - name: registration
    description: 自助注册与邮箱激活：提交注册建 PENDING_VERIFICATION 账号并发验证邮件，确认页主动点击激活；含重发验证邮件。
  - name: session
    description: 登录与会话生命周期：密码登录（MFA 联动）、WeChat 扫码登录、会话校验 / 身份摘要 / 可见菜单、登出。浏览器持 httpOnly 会话 cookie，非安全方法带 X-CSRF-Token。
  - name: account-security
    description: 账户安全自助：启用 / 禁用 MFA（TOTP）、登录态改密。
  - name: my-profile
    description: 个人账号自助（全员）：昵称、改**自己**登录邮箱（身份校验 → 新邮箱 OTP；Owner 改自己同步商户主邮箱）。
  - name: owner-contact
    description: Owner business profile 写面：联系人 First/Last/Title/Phone（GET=Profile 读权限 / PUT=编辑权限默认 Owner）+ Primary Email 严格两步（该 Owner 因子 + 新邮箱 OTP）。商户实体契约的 Profile 页只聚合读展示、无修改入口。
  - name: password-reset
    description: 忘记密码自助重置：按已绑因子（TOTP / 邮箱 OTP）校验后重置，恒态反枚举，重置不绕过 MFA。
  - name: team
    description: 团队成员管理：成员新增 / 编辑 / 启停 / 删除、邮箱邀请设密与重发、登录邮箱确认、WeChat 绑定。
paths:
  /registrations:
    post:
      tags:
        - registration
      operationId: registerOwner
      summary: Owner 自助注册（创建 PENDING_VERIFICATION 账号 + 发验证邮件）
      description: |
        提交注册：创建 PENDING_VERIFICATION 账号，并发起 Verify Email 邮件的异步发送（邮件投递失败不阻塞注册、账号仍建成）。 **邮箱已被占用分两种、结果完全不同**： **① 该邮箱已有一个尚未验证的账号** → **`200`**（不是错误）+ 与 `201` 同一个响应体：**不新建账号**， 前端**回到「等待 Email 验证」页**、用响应里的 `maskedEmail` 与 `resendCooldownSeconds` 渲染提示与 Resend 按钮（别提示「换个邮箱」——那正是用户自己的邮箱）。 **② 该邮箱已是一个可登录账号**（已验证 / 已激活）→ `409`·968001，此时才提示换邮箱或去登录。 用 HTTP 状态区分即可，`200` / `201` 对前端是同一段渲染逻辑（要区分「新建了还是本来就有」看 `201` vs `200`）。 幂等：必带 `Idempotency-Key`。同键 + 同请求体重发返回同一受理结果、不会重复注册——网络重试请复用同一个键；改了请求体就必须换新键，沿用旧键改内容 → `409`·208005。
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              email: jane@example.com
              password: Str0ng!Pass
              agreeTerms: true
              firstName: Jane
              lastName: Merchant
              phone: '6045550123'
              businessTitle: Manager
      responses:
        '200':
          description: 该邮箱已有一个**尚未验证**的账号——未新建账号；前端回「等待 Email 验证」页 + Resend
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
              example:
                status: PENDING_VERIFICATION
                maskedEmail: j***@example.com
                resendCooldownSeconds: 60
        '201':
          description: 已受理；账号 PENDING_VERIFICATION，验证邮件发送已发起（投递失败不阻塞注册）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAccepted'
              example:
                status: PENDING_VERIFICATION
                maskedEmail: j***@example.com
                resendCooldownSeconds: 60
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208005
        - 968001
  /registrations/verification:
    post:
      tags:
        - registration
      operationId: verifyRegistrationEmail
      summary: 邮箱激活（确认页主动点击触发的 POST；防扫描器 prefetch）
      description: |
        校验一次性验证 token（**仅在激活成功时消费;之前失败不消费、可用同 token 重试**,避免卡在待验证但 token 已失效）→ 激活账号 → ACTIVE。 **token 单次有效、消费后绝不再签发会话**（防旧验证链接泄露后被换取会话）。**已使用 token 重试 → `410`,按 `ErrorEnvelope.code` 细分**:已激活 → `AUTH_REGISTRATION_ALREADY_ACTIVATED`（FE 跳登录页、用户仍须**密码登录**）/ token 无效·过期 → `AUTH_VERIFICATION_TOKEN_INVALID_OR_EXPIRED`（FE 引导重发或重新注册）。**两种 410 都不换会话**。验证链接的 GET 确认页是前端路由、不激活账号，故不在本 API。 **激活成立后按会话建立结果分流**：**`sessionEstablished=true` → 已 set-cookie、前端走应用启动链路**（merchantId / 落地页 / 入驻路由经 getCurrentSession + getOnboardingStatus 取，**不在本响应返回**）；**`sessionEstablished=false` → 激活已成立但本次未建会话、前端跳登录页首次密码登录**。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: 一次性邮箱验证 token（单次消费，anti-prefetch）
            example:
              token: vtok_a1b2c3d4e5
      responses:
        '200':
          description: 激活成功（**仅首次消费 token 时**）；账号 ACTIVE。`sessionEstablished=true` → 已 set-cookie、走启动链路（getCurrentSession → getOnboardingStatus.routeTo）分流；`sessionEstablished=false` → 激活已成立、跳登录页首次密码登录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivationResult'
              example:
                status: ACTIVE
                sessionEstablished: true
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206001
        - 206002
  /registrations/verification-email:
    post:
      tags:
        - registration
      operationId: resendVerificationEmail
      summary: 重发验证邮件（恒 202 反枚举；新链接生效旧链接失效）
      description: '**恒返 202、存在 / 不存在账号同一外观、不回显账号存在性**（反枚举，对齐密码重置）。**账号级冷却（默认 60s 可配）/ 账号不存在均服务端静默、响应恒 202**（不以账号级信号暴露「账号存在且在冷却」）；**冷却剩余秒数由前端本地计时**、非 API 回显。**端点级 / IP 级防刷限流 → `429`（仅按调用频率、不区分账号存在性,enum-safe；FE 据此退避、防邮件轰炸）**。Resend 仅刷新链接，不重置 24h 清理计时器（计时从注册时刻起算）。'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
            example:
              email: jane@example.com
      responses:
        '202':
          description: 已受理（恒 202；账号存在且冷却外才实际发新邮件，否则静默——不回显账号存在性）
          content:
            application/json:
              schema:
                type: object
                required:
                  - resendCooldownSeconds
                properties:
                  resendCooldownSeconds:
                    type: integer
                    description: 重发验证邮件的账号级冷却秒数（默认 60、部署可配）；FE 据此从收到响应时刻本地倒计时。反枚举：恒返同一默认值、不泄露账号存在性
              example:
                resendCooldownSeconds: 60
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /invitations/password:
    post:
      tags:
        - team
      operationId: acceptInvitationSetPassword
      summary: 邮箱邀请员工设密激活（确认页主动提交;INVITED→ACTIVE,邮箱即验证为安全凭据）
      description: |
        员工点邀请链接 → 确认页设密提交：校验邀请 token + 密码规则通过 → 账号 `INVITED→ACTIVE`（邮箱同时验证为安全凭据）→ 204，前端跳登录页。 幂等：失败 / 响应丢失时 token 未消费,可用同 token 重试。 **两种 410 分开处置**：token 已消费、该员工已激活 → `206010`，**跳登录页用密码登录**（非卡死）； token 无效 / 已过期 / 无对应待激活员工 → `206009`，**提示联系 Owner 重发邀请**。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
                - confirmPassword
              properties:
                token:
                  type: string
                  description: 一次性邀请 token(anti-prefetch)
                newPassword:
                  type: string
                  format: password
                  description: 新版 5 规则
                confirmPassword:
                  type: string
                  format: password
            example:
              token: itok_5d4e1f2a3b
              newPassword: Str0ng!Pass
              confirmPassword: Str0ng!Pass
      responses:
        '204':
          description: 已激活;账号 ACTIVE,前端跳登录页
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206009
        - 206010
  /team/login-email-confirmations:
    post:
      tags:
        - team
      operationId: confirmMemberLoginEmail
      summary: 员工确认 Owner 改的新登录邮箱（点新邮箱确认链接 → 切换生效）
      description: Owner 改 ACTIVE 邮箱格式员工登录邮箱后,新邮箱收确认链接;员工主动确认 → 切换新邮箱 + 旧邮箱收安全通知;确认前旧邮箱有效。token 单次,anti-prefetch。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: 一次性新邮箱确认 token(anti-prefetch)
            example:
              token: etok_7c2d9e4f1a
      responses:
        '204':
          description: 登录邮箱已切换为新邮箱
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 966002
  /sessions:
    post:
      tags:
        - session
      operationId: login
      summary: 密码登录（邮箱或用户名 + 密码；MFA 联动；签发 BFF 会话）
      description: |
        邮箱 / 用户名 + 密码认证（clientId 由服务端注入、前端不传）。未启 MFA → 建 BFF 会话（set-cookie）。已启 MFA → 返回 MFA_REQUIRED + 短时 mfaChallenge（不建会话）。 **`200` 只有这两支**;**凭据正确但不签发会话的三种情形一律是 `403` + 各自的码**，三条文案都不同、按码分流： 邮箱未验证（自助注册待验）→ `208029`（跳「等待 Email 验证」页 + Resend 入口;`context.maskedEmail` **只用于页面展示**, 调 `resendVerificationEmail` 要的明文邮箱**用本次登录表单里的 `loginId`**——走到这一支说明它就是该账号的注册邮箱）; 账号被禁用 → `208027`;商户被停用 → `208028`。账号锁定 → `423`·`966001`。 ⚠️ **受邀待设密的员工不在这几支里**——该账号还没有密码，任何专属提示都等于用任意密码就能探出它的状态,故**与凭据错同一外观**走 `400`·`206012`; 他手上的邀请邮件本身就是恢复路径（另可请 Owner Resend）。 **凭据错**（密码错 / 账号不存在，**两者同一码不区分、防枚举**）→ `400`·`206012`：留在登录表单提示「登录凭据错误」、**不要据此推断账号是否存在**; 失败计数与节流由后端控制、**不回前端**（没有剩余次数可显示）——你只按响应处理：被锁定 → `423`·`966001`（等冷却）;被限流 → `429`。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              loginId: jane@example.com
              password: Str0ng!Pass
              rememberMe: false
      responses:
        '200':
          description: 登录已推进：`ESTABLISHED` 已 set-cookie;`MFA_REQUIRED` 待二次校验（未建会话）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              examples:
                established:
                  summary: 成功（无 MFA，已 set-cookie）
                  value:
                    status: ESTABLISHED
                mfaRequired:
                  summary: 需 MFA（返回挑战句柄，未建会话）
                  value:
                    status: MFA_REQUIRED
                    mfaChallenge: chl_9f2a4c7e1b
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206012
        - 208027
        - 208028
        - 208029
        - 966001
  /sessions/mfa:
    post:
      tags:
        - session
      operationId: completeMfaChallenge
      summary: 登录二次校验（提交 TOTP，通过则签发 BFF 会话）
      description: 登录第二步：提交 TOTP，通过则签发会话。**失败按 `code` 分流**—— TOTP 错 → `400`·`206012`（**留在 TOTP 输入框重输**、**不跳回登录第一步**、不要清空已填状态; 失败计数与节流由后端执行、**不回前端**，故**没有剩余次数可显示**——别做计数 UI）; 账号因连续登录失败被锁 → `423`·`966001`（等冷却，文案按该码取）; 挑战句柄**过期 / 已消费 / 无效** → `410`·`966002`（回登录第一步重新认证，重输 TOTP 无用）。 **签发资格在本步重新裁决、不沿用第一步的结论**——账号 / 商户可能在你输 TOTP 这段时间里被停： 账号被禁用 → `403`·`208027`;商户被停用 → `403`·`208028`（与第一步同码同处置）。 故 TOTP 正确 ≠ 一定建会话;拿到 `403` 就按码提示、回登录页，别当成「验证码错」重输。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - mfaChallenge
                - code
              properties:
                mfaChallenge:
                  type: string
                  description: login 返回的短时挑战句柄（绑定待认证 identity）
                code:
                  $ref: '#/components/schemas/OtpCode'
            example:
              mfaChallenge: chl_9f2a4c7e1b
              code: '123456'
      responses:
        '200':
          description: 校验通过，已 set-cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstablishedSession'
              example:
                status: ESTABLISHED
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206012
        - 208027
        - 208028
        - 966001
        - 966002
  /sessions/wechat:
    post:
      tags:
        - session
      operationId: initiateWechatLogin
      summary: WeChat 扫码登录 — 发起（返回二维码票据；轮询见 GET）
      description: 二维码默认 5 分钟有效（可配置），超时前端轮询拿到过期态后自动刷新继续等待。
      security: []
      responses:
        '200':
          description: 二维码票据
          content:
            application/json:
              schema:
                type: object
                required:
                  - qrTicket
                  - qrContent
                  - expiresAt
                properties:
                  qrTicket:
                    type: string
                    description: |
                      本次扫码登录的**短时**票据（**可重复轮询、非单次消费**），仅用于轮询本次结果；二维码过期后重新发起会得到新票据。 与 `qrContent` **分离**（同一次挑战派生的两样东西，各司其职）、不可互推——不要用其一推导或替代另一个。
                  qrContent:
                    $ref: '#/components/schemas/WechatQrContent'
                  expiresAt:
                    $ref: '#/components/schemas/WechatQrExpiresAt'
              example:
                qrTicket: wxq_3f8a1c0d92b47e5f1a
                qrContent: 8f3Kd0pQzR2vLxA7nB1cYw
                expiresAt: '2026-06-22T14:10:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /sessions/wechat/{qrTicket}:
    get:
      tags:
        - session
      operationId: pollWechatLogin
      summary: WeChat 扫码登录 — 轮询（确认成功则签发 BFF 会话）
      description: |
        被动等待「已绑定用户在微信内确认」。未绑定 / 未扫 / 未确认对前端表现一致（WAITING）。 ESTABLISHED 时已 set-cookie（会话有效期按未勾 Remember Me）；账号禁用 / 商户 suspended → REJECTED + reason。扫码登录不追加 MFA。 非法 / 过期票据归一为 EXPIRED，与「未扫」WAITING 反枚举一致（轮询恒 200 的通用口径见 `status` 字段说明）。 **本入口的 EXPIRED 是真终态**——登录结果须交付给发起它的这个页面才算数，二维码过期即本次什么都没发生，重新发起即可。 （对比：通知接收方绑定入口的 `QR_EXPIRED` **不是**终态。）
      security: []
      parameters:
        - name: qrTicket
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 轮询结果
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    allOf:
                      - $ref: '#/components/schemas/WechatPollStatus'
                    enum:
                      - WAITING
                      - EXPIRED
                      - ESTABLISHED
                      - REJECTED
                      - CANCELLED
                    readOnly: true
                    description: 扫码登录裁决态。`ESTABLISHED` = 已登录（cookie 已下发）；`EXPIRED` / `REJECTED` / `CANCELLED` 均为**终态**，需重新发起。未知值按 WAITING 继续轮询。
                  reason:
                    type: string
                    readOnly: true
                    enum:
                      - ACCOUNT_DISABLED
                      - MERCHANT_SUSPENDED
                    description: '`REJECTED` 时的业务原因。**取值本身即 i18n key**——前端按它取本地化文案（与密码登录的 `208027` / `208028` 是同一对业务条件、同两句文案）。 本处是 `200` 轮询体、不是失败响应,故用枚举不用错误码。**后续增补取值不视为破坏性变更**——请留兜底分支,遇未识别值展示通用「无法登录，请联系客服」。'
              example:
                status: WAITING
