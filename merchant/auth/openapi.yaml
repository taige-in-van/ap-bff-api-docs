  /team/members/{operatorId}/wechat-binding:
    post:
      tags:
        - team
      operationId: initiateMemberWechatBinding
      summary: Owner 给成员（含自己）绑 WeChat — 发起（返回二维码，被绑定本人扫码）
      description: 为该成员发起 WeChat 登录绑定（返回二维码，被绑定本人扫码确认）。**该成员已绑定 → `409`·968003**：提示「请先解绑当前 WeChat」再重新发起——刷新看到的还是已绑定，这不是「状态变了」。占用冲突与目标失效在**扫码后、渲染确认按钮之前**判定，具体原因当场在扫码本人微信内展示；发起方在此期间**持续 PENDING 直到二维码过期**（详见 `pollMemberWechatBinding`）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 绑定二维码
          content:
            application/json:
              schema:
                type: object
                required:
                  - qrTicket
                  - qrContent
                  - expiresAt
                properties:
                  qrTicket:
                    type: string
                    description: |
                      本次绑定的**短时**票据（**可重复轮询、非单次消费**），仅用于轮询本次结果；二维码过期后重新发起会得到新票据。 与 `qrContent` **分离**（同一次挑战派生的两样东西，各司其职）、不可互推——不要用其一推导或替代另一个。
                  qrContent:
                    $ref: '#/components/schemas/WechatQrContent'
                  expiresAt:
                    $ref: '#/components/schemas/WechatQrExpiresAt'
              example:
                qrTicket: wxb_2a7f9c1e04d63b8a52
                qrContent: Qm7Yt4sV9eN3hJ0aZx5Wgu
                expiresAt: '2026-06-22T14:10:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 968003
    delete:
      tags:
        - team
      operationId: unbindMemberWechat
      summary: Owner 给成员解绑 WeChat（不影响其当前会话）
      description: 只停用该成员的商户后台 WeChat 登录绑定；不影响其平台级 WeChat 账号、不影响其他登录方式。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已解绑
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /team/members/{operatorId}/wechat-binding/{qrTicket}:
    get:
      tags:
        - team
      operationId: pollMemberWechatBinding
      summary: WeChat 绑定 — 结果轮询（闭环结果腿；对称 pollWechatLogin）
      description: |
        被绑定本人在微信内确认后回告发起端（异设备:Owner 发起 / 成员扫码,无此腿则 Owner 零回告）。

        未扫 / 未确认 / 预检未过统一 PENDING。占用冲突与目标失效在**渲染确认按钮之前**判定并在扫码本人微信内展示，**此时本面持续 PENDING 直到二维码过期**（`EXPIRED`）——不即时收敛成失败是反枚举要求。`FAILED` 只出现在**确认之后**的写入阶段（并发抢绑落败 / 预检后目标才失效，见 `reason`）。终态在短时保留期内幂等可查。

        非法 / 过期票据归一为 EXPIRED（轮询恒 200 的通用口径见 `status` 字段说明）。

        **本入口的 EXPIRED 是真终态**——被绑定本人在微信内确认的那一刻绑定就已写入，确认过就会直接读到 BOUND，不存在「已确认但仍显示过期」。
        （对比：通知接收方绑定入口的 `QR_EXPIRED` **不是**终态。）
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - name: qrTicket
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 轮询结果
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    allOf:
                      - $ref: '#/components/schemas/WechatPollStatus'
                    enum:
                      - PENDING
                      - BOUND
                      - FAILED
                      - CANCELLED
                      - EXPIRED
                    readOnly: true
                    description: 成员登录绑定裁决态。`BOUND` = 绑定已生效；`FAILED` / `CANCELLED` / `EXPIRED` 均为**终态**，需重新发起。未知值按 PENDING 继续轮询。
                  reason:
                    type: string
                    minLength: 1
                    readOnly: true
                    examples:
                      - TARGET_GONE
                    description: |
                      `FAILED` 时的业务原因，**当前只有一个取值**：`TARGET_GONE` = 要绑的那个成员在预检通过之后、写入之前被删或被禁。

                      **「该微信已被别的账号占用」不会出现在本面**（自助绑定也不例外）。那是**扫码者本人微信账号**的事实，由平台在扫码后、渲染确认按钮之前判定并当场在他的微信里告知；这一路径下本面不返 `FAILED`，而是持续 `PENDING` 到 `EXPIRED`。写入阶段的并发抢绑落败同样只给不带原因的 `FAILED`。

                      取值本身即 i18n key。缺本键或遇未识别值，按通用「绑定失败，请重新发起」处理。
              example:
                status: PENDING
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 商户级读写另挂 MerchantContextGuard 守卫（见下方 parameters）。
  schemas:
    WechatPollStatus:
      type: string
      description: |
        两个扫码轮询（扫码登录 / 成员登录绑定）的状态口径。两者取值不同、含义不同，**不要互相复用判断逻辑**；
        具体取值与终态说明见各自 `enum` 描述。

        **消费方按 unknown-safe 处理**：遇到未列出的取值一律视同"仍在进行中"并继续轮询，不报错、不中断。

        **状态查询恒返回 `200` + 状态**——票据不存在 / 非法 / 已过期一律归一为过期态、不用 `4xx` 表达；
        前端轮询循环因此**只需按状态分支、不必为「票据本身有问题」另开一路**。
        `4xx` 表示调用方自身问题（未登录 / 无权限 / 请求过频 / 商户上下文已变），按基础约定的通用策略处理。

        **两个入口的访问控制各不相同**（一个是无鉴权公开面、一个要有效会话 + 商户上下文），
        以各 op 的 `security` 与参数为准——本 schema 只统一「票据态怎么表达」，不表达「谁能查」。
    AccountStatus:
      type: string
      enum:
        - PENDING_VERIFICATION
        - INVITED
        - ACTIVE
        - DISABLED
        - DELETED
      description: |
        商户后台账号态（5 态视图）：`PENDING_VERIFICATION` 自助注册待验证邮箱 / `INVITED` 邮箱邀请待设密 / `ACTIVE` 可登录 / `DISABLED` 已禁用 / `DELETED` 已删除。

        各端点实际会返回哪些值见该端点的字段说明；消费方按 unknown-safe 处理。
    RegistrationRequest:
      type: object
      description: 注册字段（各字段校验见 schema）
      additionalProperties: false
      required:
        - email
        - password
        - agreeTerms
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: 新版 5 规则（≥ 8 字符 / 大写 / 小写 / 数字 / 特殊字符）;下限 8 = 其中的长度那条，其余四条由前端校验并提示具体未满足项、服务端兜底拒绝
        agreeTerms:
          type: boolean
          description: Services Agreement + Privacy Policy 必勾选——**必须传 true**（传 `false` 即 400，服务端拒绝）
        firstName:
          type: string
        lastName:
          type: string
        phone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 区号候选见 `getRegistrationOptions`（白名单部署可配）；`+1` / **10 位只是空白表单的初始值**，已有值时回显其自身取值
        businessTitle:
          type: string
          minLength: 1
          description: 职务文本；仅信息收集。预设 Business Owner / Manager / Employee 可直选；界面选 Other 时提交的是**用户填写的自定义文本**，不要提交字面 "Other"（它只是界面分支标记、不是职务）。回显按「不在预设集内 = 自定义」判定。
        referredBy:
          type: string
          description: 推荐来源。**无 token 时**客户端自由填；**带 registrationContextToken（有来源注册）时服务端以 token 内 referredBy 为准、覆盖此字段**（有来源则禁改）
        registrationContextToken:
          type: string
          description: 有来源注册（Welcome 邮件链接）携带的签名 token；服务端解析出可信 referredBy 等注册上下文。无来源注册可空
    RegistrationAccepted:
      type: object
      required:
        - status
        - resendCooldownSeconds
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/AccountStatus'
          readOnly: true
          description: 账号态；本端点恒为 `PENDING_VERIFICATION`（新建或已存在的待验证账号）
        maskedEmail:
          type: string
          readOnly: true
          description: 脱敏邮箱，供「等待验证」页展示
        resendCooldownSeconds:
          type: integer
          readOnly: true
          description: 重发验证邮件的账号级冷却秒数（默认 60、部署可配）；FE 据此从收到响应时刻本地倒计时、冷却内不重复请求
    ActivationResult:
      type: object
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/AccountStatus'
          readOnly: true
          description: 账号态；本端点恒为 `ACTIVE`（账号已激活）。本响应已 set-cookie，前端走启动链路（getCurrentSession → getOnboardingStatus）。
    LoginRequest:
      type: object
      required:
        - loginId
        - password
      properties:
        loginId:
          type: string
          description: Email or Username（单 input；含 @ 按 email、否则 username）
        password:
          type: string
          format: password
        rememberMe:
          type: boolean
          default: false
          description: 勾选 → 会话不受关浏览器 / idle / absolute 自然过期影响（仍受系统侧失效）
    LoginResult:
      type: object
      description: 登录结果。`status` **只有两个取值**：`ESTABLISHED` 已 set-cookie 建会话;`MFA_REQUIRED` 已签发一次性挑战（`mfaChallenge`）、去二次校验。 凭据正确但不签发会话的三种情形（邮箱未验证 / 账号禁用 / 商户停用）走 `403` + 各自的码，**不在本体内**。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ESTABLISHED
            - MFA_REQUIRED
          readOnly: true
        mfaChallenge:
          type: string
          description: 仅 `MFA_REQUIRED` 时返回：一次性挑战句柄，提交到 /sessions/mfa
    PasswordResetChallenge:
      type: object
      required:
        - challengeId
        - resendCooldownSeconds
      properties:
        challengeId:
          type: string
          description: 反枚举 opaque challenge；后续提交到 /password-resets/{challengeId}/factor-verification
        resendCooldownSeconds:
          type: integer
          description: 重发 OTP 的账号级冷却秒数（默认 60、部署可配）；FE 据此从收到响应时刻本地倒计时。反枚举：存在 / 不存在账号均返同一默认值、不泄露存在性
    PasswordResetFactorVerified:
      type: object
      required:
        - resetToken
      properties:
        resetToken:
          type: string
          description: 高熵单次 token；提交到 /password-resets/{challengeId}/confirmation
    SessionContext:
      type: object
      description: 会话上下文：身份摘要 + 可见权限点集合 + 落地页 + 展示字段
      required:
        - operatorId
        - privileges
        - roles
        - roleName
      properties:
        operatorId:
          type: string
          readOnly: true
        displayName:
          type: string
          readOnly: true
        isOwner:
          type: boolean
          readOnly: true
        merchantId:
          type: string
          readOnly: true
          description: 当前商户内部 id；**无当前商户时不返回本键**（撤回 / 无可访问商户，FE 走 listMerchants 选择或进入无可用商户态）；有本键时据此初始化 X-Merchant-Context（见启动链路）
        roles:
          type: array
          readOnly: true
          description: 当前登录者自身持有的角色标识（`roleId`，与 `TeamMember.roleId` 同一取值域）。**能看什么、能做什么一律看 privileges**，不要按角色写判断；要显示角色名用 `roleName`，本键一般不直接渲染。
          items:
            type: string
        roleName:
          type: string
          readOnly: true
          description: 当前登录者主角色的展示名，供头像下拉 / 角色徽标直接渲染。**服务端已解析**——Owner 同样给出，前端不需要（也无法）回 `listAssignableRoles` 查：那个集合按定义就排除了 Owner 所持角色。与 `TeamMember.roleName` 同源同口径，**不要在前端按 `roleId` 拼展示名**。
        landingPage:
          type: string
          readOnly: true
          description: 角色主项决定的默认落地页——给的是**权限点标识**（同 `privileges` 的取值域）、**不是路由地址**，前端按自己的路由表映射。未配置时用 Dashboard；**无当前商户时不返回本键**；**仅 routeTo=MERCHANT_HOME 时采用**——入驻 / 审核 / 拒绝区域由 getOnboardingStatus.routeTo 决定
        privileges:
          type: array
          readOnly: true
          description: |
            **当前登录者的可见权限点集合**——扁平、已按其角色求值过滤，没权限的点不在里面。

            **导航项、页面入口、页面内的按钮、以及「可编辑还是只读」，一律查这个集合**：菜单和路由结构在前端自己的路由表里，每处声明它需要哪个权限点，命中才渲染 / 才可编辑。
            页面级与操作级共用本集合——「能看见这个页面」与「能调这个接口」是同一件事，所以不会出现「菜单看得见但接口 403」。

            **不要按 `roles` 或 `isOwner` 写权限判断**：角色随部署配置而变，写死角色名的判断在换配置时会静默失效。
          items:
            type: string
            description: 权限点标识 `模块:资源:动作`（如 `orders:refund:create`）。取值集合随部署配置而定、**不要 hardcode 成 enum**；未识别的点忽略即可（unknown-safe）。
            examples:
              - orders:refund:create
        visibleModules:
          allOf:
            - $ref: '#/components/schemas/VisibleModules'
          readOnly: true
          description: '**当前登录者自己的**模块可见性偏好（由 Owner 在成员管理里设定）。渲染导航时在 `privileges` 之上再按它过滤一道：本键缺席或为空 = 不收窄。⚠️ 仅此一道**界面**过滤——**不要据它拦请求或改写权限判断**，被收窄掉的模块其接口仍会正常受理。'
    OwnerContactView:
      type: object
      description: Owner 联系人 GET 视图（Owner 全局单一、名下多商户共享）；含只读 primaryEmail。语义对齐 Sign Up
      required:
        - firstName
        - lastName
        - primaryEmail
      properties:
        firstName:
          type: string
        lastName:
          type: string
        businessTitle:
          type: string
          description: 职务文本原样回显（预设项或自定义文本，不会是字面 "Other"）；前端按「不在预设集内 = 自定义」判定。
        phone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 区号候选见商户实体契约的 `getBusinessInformationOptions`（本编辑面与 Business Information 同在 Profile 页、共用那一份候选）；`+1` / **10 位只是空白表单的初始值**，已有值时回显其自身取值
        primaryEmail:
          type: string
          format: email
          description: 当前 Primary Email（= Owner 登录邮箱 = Contact email；只读展示，编辑面读此 authoritative 值；变更走 /owner-contact/primary-email/change-requests/*）
    UpdateOwnerContactRequest:
      type: object
      description: Owner 联系人 PUT 请求体（仅联系人字段；Primary Email 改走 change-requests、本请求体**结构上不接受**）。First / Last Name 提交时须非空、**不可清空**；Business Title / Phone 为可选项、可清空。
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        businessTitle:
          type:
            - string
            - 'null'
          description: 职务文本；选 Other 时提交自定义文本、不提交字面 "Other"。`null` = 清空。
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
          description: 区号候选见商户实体契约的 `getBusinessInformationOptions`（本编辑面与 Business Information 同在 Profile 页、共用那一份候选）；`+1` / **10 位只是空白表单的初始值**，已有值时回显其自身取值。传 `null` 清空本字段
    TeamMember:
      type: object
      description: 团队成员列表行
      required:
        - operatorId
        - displayName
        - loginId
        - roleId
        - roleName
        - status
        - isOwner
      properties:
        operatorId:
          type: string
          readOnly: true
        displayName:
          type: string
          description: Nick Name（本地 Operator）
        loginId:
          type: string
          description: 登录 ID / 邮箱
        roleId:
          type: string
          description: 角色稳定标识（编辑该成员时回传此值；按角色筛选也用它）
        roleName:
          type: string
          readOnly: true
          description: 角色展示名（服务端已解析，直接渲染即可；Owner 行同样给出，不需回 `listAssignableRoles` 查）
        visibleModules:
          allOf:
            - $ref: '#/components/schemas/VisibleModules'
          readOnly: true
          description: 该成员当前的模块可见性偏好，供编辑弹窗回显。**未收窄时不返回本键**（等价于空数组）；Owner 行不返回（不适用）。
        status:
          type: string
          enum:
            - INVITED
            - ACTIVE
            - DISABLED
          readOnly: true
          description: 账号态:INVITED(邮箱邀请待设密,附 Resend);ACTIVE / DISABLED;removed 不呈现
        pendingLoginEmail:
          type: string
          format: email
          description: ACTIVE 邮箱员工被 Owner 改邮箱、待新邮箱确认时的 pending 新邮箱（确认前旧邮箱仍有效）;**无待确认邮箱则不返回本键**
        isOwner:
          type: boolean
        wechatBound:
          type: boolean
          description: 该成员的商户后台 WeChat 登录是否已绑定；不代表其平台级 WeChat 账号是否存在
        wechatNickname:
          type: string
          minLength: 1
          description: 绑定的微信昵称展示快照（绑定时写入、每次微信登录刷新；平台未拿到昵称时为兜底通用展示名，故恒非空）。wechatBound 为 **true 时必返**，未绑定不返回本键。只用于 Owner 辨认该成员绑的是哪个微信，不代表其平台级微信账号身份。
        lastLoginAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 最近登录；**从未登录则不返回本键**，前端显示「从未登录」
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          readOnly: true
    VisibleModules:
      type: array
      description: |
        **模块可见性偏好**——该用户登录后界面呈现哪些模块。元素是**模块标识**，即权限点串 `模块:资源:动作` 的**第一段**（如 `orders`）。

        **在所选角色已覆盖的模块里挑**：可选项 = `listAssignableRoles` 里该 `roleId` 的 `modules`（换角色即换一组，据此重渲染勾选框）。**只能减不能增**——本集合应是那组的子集；**不传或空数组 = 不收窄**（该角色覆盖的模块全部呈现）。

        ⚠️ **这不是权限、不是安全边界**。它只影响界面呈现哪些模块，**不改变任何权限判定、不拦截接口**——被收窄掉的模块，其接口照常受理。真正的边界是 `privileges`；本项在它之上做纯界面收窄，Owner 不适用（恒全部可见）。
      items:
        type: string
        minLength: 1
        examples:
          - orders
    CreateTeamMemberRequest:
      type: object
      additionalProperties: false
      description: |
        新建成员。**同一个请求体**，按 `loginId` 的格式决定建号方式：

        - **邮箱形式**（含 `@`）= 邀请制：**不带** `password`，建 `INVITED` 成员 + 发邀请链接邮件，员工自设密码后激活；
        - **用户名形式**（不含 `@`）= 用户名制：`password` **必填**（Owner 设初始密码），直接建 `ACTIVE` 成员。

        用户名形式缺 `password`、邮箱形式带了 `password` → `400`（服务端校验）。
      required:
        - loginId
        - nickName
        - roleId
      properties:
        loginId:
          type: string
          minLength: 1
          description: 登录 ID。含 `@` = 邮箱形式（邀请制，须为合法邮箱）；不含 `@` = 用户名形式（用户名制）
        nickName:
          type: string
          minLength: 1
        roleId:
          type: string
          minLength: 1
          description: 管理后台预定义可分配角色的 `roleId`（取自 listAssignableRoles；不可选 Owner）
        visibleModules:
          $ref: '#/components/schemas/VisibleModules'
        password:
          type: string
          format: password
          minLength: 8
          description: '**用户名形式必填、邮箱形式不带**。Owner 设置的初始密码（新版 5 规则）。下限 8 = 5 规则里的长度那条（≥ 8 字符 / 大写 / 小写 / 数字 / 特殊字符）;其余四条由前端校验并提示具体未满足项，服务端兜底拒绝'
    UpdateTeamMemberRequest:
      type: object
      description: 编辑员工;一次原子更新 Role / 用户名 loginId / password / Nick Name(见 updateTeamMember 描述)。loginId 改用户名直接生效;改 ACTIVE 邮箱员工登录邮箱 → 新邮箱确认链接流程(独立、不经本端点)。**只提交本次要改的字段**——某字段不出现即保持原值(部分更新);本请求体的字段**都不接受空串**,界面上「留空」对应的是**不传该字段**、不是传 `""`
      additionalProperties: false
      minProperties: 1
      properties:
        loginId:
          type: string
          minLength: 1
          description: 改登录 ID;用户名直接生效,ACTIVE 邮箱员工改邮箱走确认链接
        nickName:
          type: string
          minLength: 1
        roleId:
          type: string
          minLength: 1
          description: 改角色;取自 listAssignableRoles 的 `roleId`（不可选 Owner）
        visibleModules:
          allOf:
            - $ref: '#/components/schemas/VisibleModules'
          description: 改该员工的模块可见性偏好（**全量覆盖本项**：传什么就是什么，传空数组 = 取消收窄）。**不传本键即保持原值**（部分更新）。改 `roleId` 时本项不会被服务端自动重置——界面若要按新角色重置勾选，自行在提交里带上新值。
        newPassword:
          type: string
          format: password
          minLength: 8
          description: 传值即重置该员工密码 + 失效其全部会话;**不传本字段即保持原密码**（界面上密码框留空 = 不传，**不要提交空串**）。下限 8 = 新版 5 规则的长度那条（≥ 8 字符 / 大写 / 小写 / 数字 / 特殊字符）;其余四条由前端校验并提示具体未满足项，服务端兜底拒绝。INVITED 员工不可由 Owner 直接设密
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            currentMerchantId:
              type: string
              description: 服务端会话当前商户（≠ 请求携带的 expected `X-Merchant-Context`），供前端 re-sync；**无当前商户则不返回本键**（前端须重选）。
            paymentId:
              type: string
              description: 失败发生时**订单已建立**的场景下带出的平台侧支付单标识（如被扫同步扣款在通道应答阶段失败）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            merchantMandateNo:
              type: string
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            maskedEmail:
              type: string
              description: 已遮蔽的邮箱（形如 `j***@example.com`），**只作展示、不可回填表单**。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
    PhoneCountryCode:
      type: object
      additionalProperties: false
      description: 电话区号候选项（注册面 / 入驻向导 / 商户资料三处共用同一形状）。同一 `dialCode` 可对应多个国家（如 `+1` = CA·US），故 `code` 与 `dialCode` 都给。`code` 是 ISO 3166 标准码，国家展示名由客户端按它解析（浏览器内置 `Intl.DisplayNames` 即可）。
      required:
        - code
        - dialCode
      properties:
        code:
          type: string
          description: ISO 3166-1 alpha-2 国家码
          examples:
            - CA
        dialCode:
          type: string
          description: 国际拨号前缀（含 `+`）
          examples:
            - '+1'
    Phone:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      maxLength: 16
      description: 电话号码，**国际格式整串**（`+` + 国家码 + 正文号，如 `+16045550123`）——**一个字段装完，没有独立的区号字段**。 上界 16 = `+` 加最多 15 位数字（国际号码总长上限）；**服务端只校验这一条通用规则 + 区号在白名单内**， **不按区号分别限长**。前端按所选区号收窄输入位数属输入体验、不是契约约束。 渲染「区号下拉 + 号码框」两个控件时，用区号候选集（`PhoneCountryCode.dialCode`）做**最长前缀匹配**拆分本串。
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
    WechatQrContent:
      type: string
      description: |
        微信二维码的**待编码内容**（短时、一次性、不透明串）——前端据此**自行渲染二维码图片**。 **不是图片 URL**，不要当 `<img src>` 用；内容对前端不透明，不要解析、拼接或复用。 三处扫码入口（扫码登录 / 成员登录绑定 / 通知接收方绑定）共用同一形状与渲染方式。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按**本地时区**换算(浏览器端即浏览器时区);商户配置的 IANA 时区是**服务端固化日期字段**时用的,不用于展示换算。

        **只表示「什么时候发生」,不表示「算哪一天」** —— 需要「哪一天」的地方各有自己的**日期字段**(`YYYY-MM-DD`),
        **别拿本类型自己推**：两者在跨日边界附近会分属两天。
    WechatQrExpiresAt:
      allOf:
        - $ref: '#/components/schemas/Timestamp'
      description: |
        二维码有效期截止。**到期只表示这张二维码不能再扫**，**不必然**表示本次交互已有定论—— 到期后结果是否还可能变化，**各入口不同、由各入口的轮询状态说明，不由本字段推断**。
    OtpDelivery:
      type: object
      additionalProperties: false
      description: 「一次性验证码已发出」的三件事（本 BFF 内所有发码入口共用同一形状）：发到哪里、多久能重发、多久失效。 FE 用 `cooldownSeconds` 启动重发倒计时、用 `expiresAt` 判断码是否仍有效；**两个都是部署可配、前端不要 hardcode**。 码过期 / 已用后再提交 → `410`（须重新发起，不是重输）；冷却中重发 → `429`。 ⚠️ **反枚举入口不用本形状**——若「投递目标存不存在」本身是要隐藏的事实（如找回密码）， 那里只回冷却秒数、不回 `deliveredTo`，见各自端点说明。
      required:
        - deliveredTo
        - cooldownSeconds
        - expiresAt
      properties:
        deliveredTo:
          type: string
          readOnly: true
          description: 脱敏投递目标（如 `o***@e***.com`）——供 FE 提示「码发到哪里」。
        cooldownSeconds:
          type: integer
          readOnly: true
          minimum: 0
          description: 重发冷却秒数（部署可配）。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 该码的失效时间（部署可配）。
    QuickFilterItem:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
          description: 该项对应的筛选值 —— **对客户端不透明**:选中本项就把它**原样**回传给对应列表端点的那个筛选参数, 不要解析、拼接或据其分支。
          examples:
            - PAID
        label:
          type: string
          description: 后端给的默认展示名。**客户端有自己的多语言资源时按 `value` 取用、本字段作兜底**; 没有资源(取值由配置或数据决定,如角色名、年份)时直接展示本字段。
          examples:
            - Paid
        count:
          type: integer
          minimum: 0
          description: 该项当前的命中数(口径见 `QuickFilterCounts` 说明)。
    QuickFilterCounts:
      type: object
      additionalProperties: false
      description: |
        **列表页顶部快捷筛选的各项与计数**。快捷筛选就是该列表的一个筛选维度,没有特殊机制:选中某项 = 给列表带上该维度的筛选参数(值 = 该项 `value`),**选 All = 不带这个参数**。

        **照着 `items` 渲染即可** —— 项集、顺序、展示名、数字全部由服务端给出,客户端不枚举取值、不 hardcode 项集;某项当期为 `0` 时**仍会返回**(那一格不该因为没数据就消失)。

        **`All` 不在 `items` 里,由客户端自己补一项**,数字 = 其余各项之和 —— 服务端保证 `items` 覆盖该列表在不带本维度筛选时的全部命中(每行恰好落进一项),故这个和恒等于此时列表的 `total`。

        **本端点不接受被计维度自身的参数**;其余筛选条件与对应列表端点一致、传什么算什么。因此:点某项后列表 `total` = 该项 `count`;点 All 后列表 `total` = 各项 `count` 之和。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuickFilterItem'
  responses:
    MerchantBffDefaultError:
      description: |
        非 2xx 统一错误响应——覆盖所有未在本 op 显式列出的状态码。

        HTTP status 只表达大类，**具体子因看响应体的整数** `code`：

        - 该 op 承诺的业务码见其 `x-error-codes`，
        - 码的**固有属性**（`name` / `httpStatus` / `retryable` / 必带 context 字段）见**随包错误码表**；
        - **该码在本接口下意味着什么、你该怎么处理，见本接口自己的说明**（怎么读见 API 基础约定「错误响应体」）。

        部分码另带 `context` 结构化上下文（如 stale-tab 守卫 `208001` 必携 `context.currentMerchantId` 供前端 re-sync 当前商户）——哪些码必携哪些字段，以码表的 `requiredContextFields` 为准，**不要按状态码猜**。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: \S
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: \S
    MerchantContextGuard:
      name: X-Merchant-Context
      in: header
      required: true
      description: |
        stale-tab 一致性守卫（读写统一）：页面预期的当前商户 ID。与会话当前商户比对，一致才执行；不一致时**读不返回错商户数据、写不执行**，并按下面两种情形二分：

        - **① 会话有当前商户、只是与 expected 不同 → `409` · `208001`（`MERCHANT_CONTEXT_CHANGED`）**，响应 `context.currentMerchantId` 回显服务端当前商户供前端直接 re-sync；
        - **② 会话没有当前商户（无可回显者）→ `409` · `208022`（`MERCHANT_NOT_ACCESSIBLE`）**，前端重跑启动链路按 `routeTo` 分流（见 API 基础约定「merchant scope + stale-tab 守卫」）。

        挂在所有依赖当前商户的读 + 写接口；前端统一 interceptor 发送 + 处理 409（提示并刷新当前商户）。

        **豁免**：不依赖「当前商户」的接口——当前商户的 re-sync / 切换入口本身，以及目标由 path 直接指定、与当前商户无关的接口。

        某个接口挂没挂本 header，**看该接口的 `parameters` 即可**（挂了就是必带）。
      schema:
        type: string
        minLength: 1
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
