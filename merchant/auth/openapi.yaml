      description: 先校验请求来自同一商户 / 同一会话 / 同一发起者，再验该 Owner 因子。**失败按 `code` 分流**： **因子不同码不同**：TOTP 验错 → `403`·`206011`（无剩余次数可显示;会话仍有效，留在弹窗重输、**不跳登录页**）;旧邮箱 OTP 输错但**尚有尝试次数** → `400`·`204010`（剩余次数见 `context.attemptsRemaining`）,**错到超限** → `423`·`966003`（挑战作废,回第一步重新发起）;挑战过期 / 已消费 → `410`·`206006`（回第一步重新发起）; 换会话 / 异发起者 → `403`·`206005`（重走一次挑战）;切商户 → `409`·`208001`。
