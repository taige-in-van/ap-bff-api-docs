      operationId: disableMfa
      summary: 禁用 MFA（输 TOTP 验证，状态 → DISABLED）
      description: 输 TOTP 校验后禁用 MFA（关 MFA = 降级，须 step-up 校验当前 TOTP）；**TOTP 错 → `403`·`206011`**，保持 ENABLED、留在弹窗重输、**不要跳登录页**（不计入登录锁定）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  $ref: '#/components/schemas/OtpCode'
            example:
              code: '123456'
      responses:
        '204':
          description: 已禁用（ENABLED → DISABLED）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206011
  /me/security/password:
    put:
      tags:
        - account-security
      operationId: changeOwnPassword
      summary: 登录态改密（Owner + 员工统一用旧密码；其他会话失效、当前保留）
      description: '**统一用旧密码校验,不接受 TOTP / 邮箱 OTP 替代**;**旧密码错 → `403`·`206011`**——会话仍有效,留在当前弹窗提示重输、**不要跳登录页**(不计入登录锁定);忘记旧密码 → 前端「Forgot your password?」走自助重置。幂等：必带 `Idempotency-Key`;同键 + 同请求体重发 → 一致返 `204`(网络重试请复用同一个键);改了请求体就必须换新键,沿用旧键改内容 → `409`·208005。'
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
                - confirmPassword
              properties:
                currentPassword:
                  type: string
                  format: password
                newPassword:
                  type: string
                  format: password
                confirmPassword:
                  type: string
                  format: password
            example:
              currentPassword: Str0ng!Pass
              newPassword: N3w!Str0ngPass
              confirmPassword: N3w!Str0ngPass
      responses:
        '204':
          description: 改密成功（其他会话已失效，当前会话保留）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206011
        - 208005
  /me/login-email/change-requests:
    post:
      tags:
        - my-profile
      operationId: initiateLoginEmailChange
      summary: 自助改登录邮箱 — 发起变更请求（返回身份校验方式：MFA→TOTP / 无 MFA→旧邮箱 OTP）
      description: |
        邮箱格式账号自助改登录邮箱。严格两步验证:MFA 已启 → TOTP;未启 → 旧邮箱 OTP;通过后再发新邮箱 OTP。 **Owner**(同步商户主联系邮箱),**员工**(仅个人登录邮箱、不同步);用户名格式 → 403。返回 challengeId（change-request 实例 id）串起后续步骤。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: 改邮箱变更请求已创建
          content:
            application/json:
              schema:
                type: object
                required:
                  - challengeId
                  - identityVerification
                properties:
                  challengeId:
                    type: string
                  identityVerification:
                    type: string
                    enum:
                      - MFA_TOTP
                      - OLD_EMAIL_OTP
              example:
                challengeId: chg_6b1d3f8a90
                identityVerification: MFA_TOTP
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /me/login-email/change-requests/{challengeId}/identity-verification:
    post:
      tags:
        - my-profile
      operationId: verifyLoginEmailChangeIdentity
      summary: 改登录邮箱 — 第 1 步身份校验（MFA TOTP 或旧邮箱 OTP）
      description: '**失败按 `code` 分流，且因子不同码不同**：走 **TOTP** 时验错 → `403`·`206011`（**本步不为 TOTP 计次**,没有剩余次数可显示;会话仍有效，留在弹窗重输、**不跳登录页**）; 走**旧邮箱 OTP** 时输错但**尚有尝试次数** → `400`·`204010`（同样留在弹窗重输;剩余次数见 `context.attemptsRemaining`）,**错到超限** → `423`·`966003`（该挑战已作废，回第一步重新发起改邮箱）; 该挑战**过期 / 已消费** → `410`·`206006`（重输无用，回第一步重新发起改邮箱）; **不是发起该挑战的那个会话 / 发起者** → `403`·`206005`（须重走一次挑战，不是重输因子）。'
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: login-email change-request 实例 id
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  $ref: '#/components/schemas/OtpCode'
            example:
              code: '123456'
      responses:
        '204':
          description: 身份已校验，可提交新邮箱
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 206005
        - 206006
        - 206011
        - 966003
  /me/login-email/change-requests/{challengeId}/new-address:
    post:
      tags:
        - my-profile
      operationId: submitNewLoginEmail
      summary: 改登录邮箱 — 第 2 步提交新邮箱（校验格式/唯一/不同 + 发新邮箱 OTP）
      description: |
        改登录邮箱三步里的第 2 步：提交新邮箱 → 校验格式 / 全平台唯一 / 与当前不同 → 向**新邮箱**发 OTP。 **两个 409 分开处置**：`968001` = **这个新邮箱被别人占了**，提示换一个、焦点留在邮箱输入框； `968010` = **你自己已有一笔改邮箱在途**，换任何新邮箱都会被拒，须先完成那笔（去新邮箱点确认）或等它自然过期——首期没有主动取消入口，所以这里不要引导用户改输入。
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: login-email change-request 实例 id
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - newEmail
              properties:
                newEmail:
                  type: string
                  format: email
            example:
              newEmail: jane.new@example.com
      responses:
        '202':
          description: 新邮箱 OTP 已发（新邮箱含 pending 占用登录域唯一性）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206005
        - 206006
        - 968001
        - 968010
  /me/login-email/change-requests/{challengeId}/confirmation:
    post:
      tags:
        - my-profile
      operationId: confirmLoginEmailChange
      summary: 改登录邮箱 — 确认（新邮箱 OTP → 替换登录邮箱 + 旧邮箱安全通知）
      description: 凭 change-request 的新邮箱 OTP 完成替换（一次性 OTP、非幂等）。更新不影响会话。Owner 变更同步商户主联系邮箱、旧邮箱通知无 Reset password CTA;员工仅个人安全通知。 **失败按 `code` 分流**：新邮箱 OTP 是服务端签发的一次性验证码,**计次**——输错但尚有次数 → `400`·`204010`（留在弹窗重输,剩余次数见 `context.attemptsRemaining`）; **错到超限** → `423`·`966003`（该挑战作废,回第一步重新发起改邮箱）;该 OTP / change-request **过期或已消费** → `410`·`206006`（重输无用,同样回第一步）; **不是发起该变更的那个会话 / 发起者** → `403`·`206005`（须重走一次流程）。
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: login-email change-request 实例 id
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  allOf:
                    - $ref: '#/components/schemas/OtpCode'
                  description: 新邮箱 OTP
            example:
              code: '654321'
      responses:
        '204':
          description: 登录邮箱已更新（旧邮箱已收安全通知）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 206005
        - 206006
        - 966003
