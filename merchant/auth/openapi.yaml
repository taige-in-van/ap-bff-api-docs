  /team/members/{operatorId}:
    put:
      tags:
        - team
      operationId: updateTeamMember
      summary: 编辑员工（Nick Name / Role / 用户名直接改 / 填 newPassword 重置 / ACTIVE 邮箱改走确认链接）
      description: |
        一次提交更新成员字段（Role + 用户名 loginId〔不含 @〕+ newPassword + Nick Name）。**同步字段（Role / loginId / newPassword）原子生效**:要么全成功、要么全失败（无部分成功、无字段级结果体）;**Nick Name 可能后台补齐**（见下 `202`），不阻塞同步字段生效。副作用逐字段:`newPassword`→失效该员工全会话 / `loginId`(用户名)→登录域内唯一、直接生效 / `Role`→重算该商户权限。**启停走独立端点**（setMemberEnablement、非本端点）。同步字段生效后若显示名(Nick Name)仍在后台补齐 → `202`(处理中、status=PROCESSING),**同 `Idempotency-Key` 重试返当前结果、完成后收敛 `204`**——不返回整体失败。 **ACTIVE 邮箱格式员工改登录邮箱**:Owner 无需额外自证,但**不直接生效**——校验新邮箱格式/唯一(含 pending 占用)后向**新邮箱发确认链接**,确认前旧邮箱仍有效、pending 新邮箱不可登录/不可 Forgot;员工经 `/team/login-email-confirmations` 确认后切换。`INVITED` 员工改邮箱 → 重发邀请。 Owner row：仅 Nick Name 可改、Role 不可改、不经此重置 Owner 密码(改密走 changeOwnPassword、改邮箱走 owner-contact primary-email)。改 loginId/Role 不失效会话；填 newPassword → 该员工全会话失效。 **幂等**：必带 `Idempotency-Key`；**同键 + 同请求体重发不会重复施加任何副作用**（不重复失效会话、不重复改权限）， 但**返回的是当前进度而非首次快照**——显示名仍在后台补齐时返 `202` + `status=PROCESSING`，补齐后同一个键再发即返 `204`。 **轮询方式就是拿同一个键重发本请求**（本域不另设查询端点）。同键但请求体不同（改了字段值）→ `409`·208005，此时应换新键提交。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamMemberRequest'
            example:
              nickName: Sam Clerk
              roleId: role_staff
      responses:
        '202':
          description: 受理为处理中——同步字段已原子生效,显示名(Nick Name)后台补齐;同 `Idempotency-Key` 重试返当前结果、完成后收敛 204
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateTeamMemberProcessing'
        '204':
          description: 已更新（同步字段全部生效；ACTIVE 邮箱改邮箱为受理:确认链接已发新邮箱,待员工确认）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208005
        - 968001
        - 968010
    delete:
      tags:
        - team
      operationId: deleteTeamMember
      summary: 删除员工（软删——删后不在成员列表呈现 + 全会话失效；Owner 不可删 → 403；INVITED/ACTIVE/DISABLED 均经此删成员本体）
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已软删
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /team/members/{operatorId}/invitation:
    post:
      tags:
        - team
      operationId: resendInvitation
      summary: 对 INVITED 员工 Resend 邀请链接（冷却默认 60s 可配;旧链接失效）
      description: |
        对 `INVITED` 员工重发邀请链接——**每次重发都让旧链接立即失效**，员工手上的旧邮件点开会拿到 `206009`。 **冷却**：账号级重发冷却窗口内再点 → `429`·208013，`context.cooldownSeconds` 给剩余秒数（**权威值**，覆盖刷新与跨标签页，据此本地倒计时禁用按钮，不要 hardcode 60）。 `208001` = 页面预期商户 ≠ 会话当前商户，按公约 re-sync 后重发。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已重发（新链接生效、旧链接失效）;员工保持 INVITED
          content:
            application/json:
              schema:
                type: object
                required:
                  - resendCooldownSeconds
                properties:
                  resendCooldownSeconds:
                    type: integer
                    minimum: 0
                    description: 下次可 Resend 前的冷却秒数（业务参数、部署可配）——**据此禁用按钮并本地倒计时，不要 hardcode 60**（同 `registerOwner` / `resendVerificationEmail` / `requestPasswordReset` 的口径）
              example:
                resendCooldownSeconds: 60
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208013
  /team/members/{operatorId}/enablement:
    put:
      tags:
        - team
      operationId: setMemberEnablement
      summary: 启用 / 禁用员工（禁用 → 全会话失效；Owner 不可禁用 → 403）
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
            example:
              enabled: false
      responses:
        '204':
          description: 已切换（ACTIVE ↔ DISABLED）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /team/members/{operatorId}/wechat-binding:
    post:
      tags:
        - team
      operationId: initiateMemberWechatBinding
      summary: Owner 给成员（含自己）绑 WeChat — 发起（返回二维码，被绑定本人扫码）
      description: 为该成员发起 WeChat 登录绑定（返回二维码，被绑定本人扫码确认）。**该成员已绑定 → `409`·968003**：提示「请先解绑当前 WeChat」再重新发起——刷新看到的还是已绑定，这不是「状态变了」。占用冲突只能扫码确认后判定，扫码本人微信内可见具体原因，发起方轮询只返回粗粒度 FAILED。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 绑定二维码
          content:
            application/json:
              schema:
                type: object
                required:
                  - qrTicket
                  - qrContent
                  - expiresAt
                properties:
                  qrTicket:
                    type: string
                    description: |
                      本次绑定的**短时**票据（**可重复轮询、非单次消费**），仅用于轮询本次结果；二维码过期后重新发起会得到新票据。 与 `qrContent` **分离**（同一次挑战派生的两样东西，各司其职）、不可互推——不要用其一推导或替代另一个。
                  qrContent:
                    $ref: '#/components/schemas/WechatQrContent'
                  expiresAt:
                    $ref: '#/components/schemas/WechatQrExpiresAt'
              example:
                qrTicket: wxb_2a7f9c1e04d63b8a52
                qrContent: Qm7Yt4sV9eN3hJ0aZx5Wgu
                expiresAt: '2026-06-22T14:10:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 968003
    delete:
      tags:
        - team
      operationId: unbindMemberWechat
      summary: Owner 给成员解绑 WeChat（不影响其当前会话）
      description: 只停用该成员的商户后台 WeChat 登录绑定；不影响其平台级 WeChat 账号、不影响其他登录方式。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已解绑
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /team/members/{operatorId}/wechat-binding/{qrTicket}:
    get:
      tags:
        - team
      operationId: pollMemberWechatBinding
      summary: WeChat 绑定 — 结果轮询（闭环结果腿；对称 pollWechatLogin）
      description: |
        被绑定本人在微信内确认后回告发起端（异设备:Owner 发起 / 成员扫码,无此腿则 Owner 零回告）。 未扫 / 未确认统一 PENDING；占用冲突只能扫码确认后判定，扫码本人微信内可见具体原因，发起方只获得粗粒度 FAILED；二维码过期 → EXPIRED。终态在短时保留期内幂等可查。 非法 / 过期票据归一为 EXPIRED（轮询恒 200 的通用口径见 `status` 字段说明）。 **本入口的 EXPIRED 是真终态**——被绑定本人在微信内确认的那一刻绑定就已写入，确认过就会直接读到 BOUND，不存在「已确认但仍显示过期」。 （对比：通知接收方绑定入口的 `QR_EXPIRED` **不是**终态。）
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: operatorId
          in: path
          required: true
          schema:
            type: string
        - name: qrTicket
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 轮询结果
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    allOf:
                      - $ref: '#/components/schemas/WechatPollStatus'
                    enum:
                      - PENDING
                      - BOUND
                      - FAILED
                      - CANCELLED
                      - EXPIRED
                    readOnly: true
                    description: 成员登录绑定裁决态。`BOUND` = 绑定已生效；`FAILED` / `CANCELLED` / `EXPIRED` 均为**终态**，需重新发起。未知值按 PENDING 继续轮询。
                  reason:
                    type: string
                    enum:
                      - TARGET_GONE
                    readOnly: true
                    description: FAILED 时的业务原因；占用冲突不向 Owner/BFF 暴露具体原因。
              example:
                status: PENDING
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。 浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）； 商户级读写另挂 MerchantContextGuard 守卫（见下方 parameters）。
  schemas:
    WechatPollStatus:
      type: string
      description: |
        两个扫码轮询（扫码登录 / 成员登录绑定）的状态口径。两者取值不同、含义不同，**不要互相复用判断逻辑**； 具体取值与终态说明见各自 `enum` 描述。 **消费方按 unknown-safe 处理**：遇到未列出的取值一律视同"仍在进行中"并继续轮询，不报错、不中断。 **状态查询恒返回 `200` + 状态**——票据不存在 / 非法 / 已过期一律归一为过期态、不用 `4xx` 表达； 前端轮询循环因此**只需按状态分支、不必为「票据本身有问题」另开一路**。 `4xx` 表示调用方自身问题（未登录 / 无权限 / 请求过频 / 商户上下文已变），按基础约定的通用策略处理。 **两个入口的访问控制各不相同**（一个是无鉴权公开面、一个要有效会话 + 商户上下文）， 以各 op 的 `security` 与参数为准——本 schema 只统一「票据态怎么表达」，不表达「谁能查」。
    RegistrationRequest:
      type: object
      description: 注册字段（各字段校验见 schema）
      additionalProperties: false
      required:
        - email
        - password
        - agreeTerms
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: 新版 5 规则（≥8 / 大写 / 小写 / 数字 / 特殊字符）
        agreeTerms:
          type: boolean
          const: true
          description: Services Agreement + Privacy Policy 必勾选（const true — 未勾选即 400）
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          description: 区号 / 号码位数的白名单与长度规则部署可配；**`+1` / 10 位只是空白表单的初始值**，已有值时回显其自身取值
        businessTitle:
          type: string
          description: Business Owner / Manager / Employee / Other（Other 可自定义）；仅信息收集
        referredBy:
          type: string
          description: 推荐来源。**无 token 时**客户端自由填；**带 registrationContextToken（有来源注册）时服务端以 token 内 referredBy 为准、覆盖此字段**（有来源则禁改）
        registrationContextToken:
          type: string
          description: 有来源注册（Welcome 邮件链接）携带的签名 token；服务端解析出可信 referredBy 等注册上下文。无来源注册可空
    RegistrationAccepted:
      type: object
      required:
        - status
        - resendCooldownSeconds
      properties:
        status:
          type: string
          enum:
            - PENDING_VERIFICATION
          readOnly: true
        maskedEmail:
          type: string
          readOnly: true
          description: 脱敏邮箱，供「等待验证」页展示
        resendCooldownSeconds:
          type: integer
          readOnly: true
          description: 重发验证邮件的账号级冷却秒数（默认 60、部署可配）；FE 据此从收到响应时刻本地倒计时、冷却内不重复请求
    ActivationResult:
      type: object
      required:
        - status
        - sessionEstablished
      properties:
        status:
          type: string
          enum:
            - ACTIVE
          readOnly: true
        sessionEstablished:
          type: boolean
          readOnly: true
          description: 是否已建会话：**true → 已 set-cookie、前端走启动链路**（getCurrentSession → getOnboardingStatus）；**false → 激活已成立但本次未建会话、前端跳登录页首次密码登录**。两种情况**账号均已激活成立**。
    LoginRequest:
      type: object
      required:
        - loginId
        - password
      properties:
        loginId:
          type: string
          description: Email or Username（单 input；含 @ 按 email、否则 username）
        password:
          type: string
          format: password
        rememberMe:
          type: boolean
          default: false
          description: 勾选 → 会话不受关浏览器 / idle / absolute 自然过期影响（仍受系统侧失效）
    LoginResult:
      description: 登录结果多态;按 `status` 判别（discriminator）。**只有两支**：`ESTABLISHED` 已 set-cookie 建会话;`MFA_REQUIRED` 已签发一次性挑战、去二次校验。 凭据正确但不签发会话的三种情形（邮箱未验证 / 账号禁用 / 商户停用）走 `403` + 各自的码，**不在本体内**。
      oneOf:
        - $ref: '#/components/schemas/EstablishedSession'
        - $ref: '#/components/schemas/MfaRequiredChallenge'
      discriminator:
        propertyName: status
        mapping:
          ESTABLISHED: '#/components/schemas/EstablishedSession'
          MFA_REQUIRED: '#/components/schemas/MfaRequiredChallenge'
    EstablishedSession:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ESTABLISHED
    MfaRequiredChallenge:
      type: object
      required:
        - status
        - mfaChallenge
      properties:
        status:
          type: string
          enum:
            - MFA_REQUIRED
        mfaChallenge:
          type: string
          description: 提交到 /sessions/mfa
    PasswordResetChallenge:
      type: object
      required:
        - challengeId
        - resendCooldownSeconds
      properties:
        challengeId:
          type: string
          description: 反枚举 opaque challenge；后续提交到 /password-resets/{challengeId}/factor-verification
        resendCooldownSeconds:
          type: integer
          description: 重发 OTP 的账号级冷却秒数（默认 60、部署可配）；FE 据此从收到响应时刻本地倒计时。反枚举：存在 / 不存在账号均返同一默认值、不泄露存在性
    PasswordResetFactorVerified:
      type: object
      required:
        - resetToken
      properties:
        resetToken:
          type: string
          description: 高熵单次 token；提交到 /password-resets/{challengeId}/confirmation
    SessionContext:
      type: object
      description: 会话上下文：身份摘要 + 可见菜单树 + 落地页 + 展示字段
      required:
        - operatorId
        - menus
      properties:
        operatorId:
          type: string
          readOnly: true
        displayName:
          type: string
          readOnly: true
        isOwner:
          type: boolean
          readOnly: true
        merchantId:
          type: string
          readOnly: true
          description: 当前商户内部 id；**无当前商户时不返回本键**（撤回 / 无可访问商户，FE 走 listMerchants 选择或进入无可用商户态）；有本键时据此初始化 X-Merchant-Context（见启动链路）
        roles:
          type: array
          readOnly: true
          description: 当前登录者自身持有的角色标识（`roleId`，与 `TeamMember.roleId` 同一取值域）。前端一般不直接渲染它——菜单可见性看 `menus`、身份判定看 `isOwner`。
          items:
            type: string
        landingPage:
          type: string
          readOnly: true
          description: 角色主项决定的默认落地页（未配置默认 Dashboard）；**无当前商户时不返回本键**；**仅 routeTo=MERCHANT_HOME 时采用**——入驻 / 审核 / 拒绝区域由 getOnboardingStatus.routeTo 决定
        menus:
          type: array
          readOnly: true
          description: 过滤后的可见菜单树（前端只渲染所返回项；已按角色权限过滤）
          items:
            $ref: '#/components/schemas/MenuNode'
    MenuNode:
      type: object
      required:
        - resourceId
        - type
      properties:
        resourceId:
          type: string
        type:
          type: string
          enum:
            - menu
            - button
        label:
          type: string
        path:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/MenuNode'
    OwnerContactView:
      type: object
      description: Owner 联系人 GET 视图（Owner 全局单一、名下多商户共享）；含只读 primaryEmail。语义对齐 Sign Up
      required:
        - firstName
        - lastName
        - primaryEmail
      properties:
        firstName:
          type: string
        lastName:
          type: string
        businessTitle:
          type: string
        phone:
          type: string
          description: 区号 / 号码位数的白名单与长度规则部署可配；**`+1` / 10 位只是空白表单的初始值**，已有值时回显其自身取值
        primaryEmail:
          type: string
          format: email
          description: 当前 Primary Email（= Owner 登录邮箱 = Contact email；只读展示，编辑面读此 authoritative 值；变更走 /owner-contact/primary-email/change-requests/*）
    UpdateOwnerContactRequest:
      type: object
      description: Owner 联系人 PUT 请求体（仅联系人字段；Primary Email 改走 change-requests、本请求体**结构上不接受**）。First / Last Name 提交时须非空、**不可清空**；Business Title / Phone 为可选项、可清空。
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        businessTitle:
          type:
            - string
            - 'null'
        phone:
          type:
            - string
            - 'null'
          description: 区号 / 号码位数的白名单与长度规则部署可配；**`+1` / 10 位只是空白表单的初始值**，已有值时回显其自身取值
    TeamMember:
      type: object
      description: 团队成员列表行
      required:
        - operatorId
        - displayName
        - loginId
        - roleId
        - roleName
        - status
        - isOwner
      properties:
        operatorId:
          type: string
          readOnly: true
        displayName:
          type: string
          description: Nick Name（本地 Operator）
        loginId:
          type: string
          description: 登录 ID / 邮箱
        roleId:
          type: string
          description: 角色稳定标识（编辑该成员时回传此值；按角色筛选也用它）
        roleName:
          type: string
          readOnly: true
          description: 角色展示名（服务端已解析，直接渲染即可；Owner 行同样给出，不需回 `listAssignableRoles` 查）
        status:
          type: string
          enum:
            - INVITED
            - ACTIVE
            - DISABLED
          readOnly: true
          description: 账号态:INVITED(邮箱邀请待设密,附 Resend);ACTIVE / DISABLED;removed 不呈现
        pendingLoginEmail:
          type: string
          format: email
          description: ACTIVE 邮箱员工被 Owner 改邮箱、待新邮箱确认时的 pending 新邮箱（确认前旧邮箱仍有效）;**无待确认邮箱则不返回本键**
        isOwner:
          type: boolean
        wechatBound:
          type: boolean
          description: 该成员的商户后台 WeChat 登录是否已绑定；不代表其平台级 WeChat 账号是否存在
        lastLoginAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 最近登录；**从未登录则不返回本键**，前端显示「从未登录」
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          readOnly: true
    CreateTeamMemberRequest:
      description: 按 loginId 格式分支：邮箱格式发邀请设密并进入 INVITED；用户名格式由 Owner 设初始密码并进入 ACTIVE。
      oneOf:
        - title: InviteEmailMember
          type: object
          additionalProperties: false
          required:
            - loginId
            - nickName
            - roleId
          properties:
            loginId:
              type: string
              pattern: '@'
              description: 邮箱格式登录 ID（含 @）；发邀请链接，由员工自设密码
            nickName:
              type: string
            roleId:
              type: string
              description: 管理后台预定义可分配角色的 `roleId`（取自 listAssignableRoles；不可选 Owner）
        - title: CreateUsernameMember
          type: object
          additionalProperties: false
          required:
            - loginId
            - nickName
            - password
            - roleId
          properties:
            loginId:
              type: string
              pattern: ^[^@]+$
              description: 用户名格式登录 ID（不含 @）
            nickName:
              type: string
            password:
              type: string
              format: password
              description: Owner 设置的初始密码（新版 5 规则）
            roleId:
              type: string
              description: 管理后台预定义可分配角色的 `roleId`（取自 listAssignableRoles；不可选 Owner）
    UpdateTeamMemberRequest:
      type: object
      description: 编辑员工;一次原子更新 Role / 用户名 loginId / password / Nick Name(见 updateTeamMember 描述)。loginId 改用户名直接生效;改 ACTIVE 邮箱员工登录邮箱 → 新邮箱确认链接流程(独立、不经本端点)。Password 留空保持、填值即重置
      additionalProperties: false
      minProperties: 1
      properties:
        loginId:
          type: string
          description: 改登录 ID;用户名直接生效,ACTIVE 邮箱员工改邮箱走确认链接
        nickName:
          type: string
        roleId:
          type: string
          description: 改角色;取自 listAssignableRoles 的 `roleId`（不可选 Owner）
        newPassword:
          type: string
          format: password
          description: 填写即重置该员工密码 + 失效其全部会话；留空保持原密码（INVITED 员工不可由 Owner 直接设密）
    UpdateTeamMemberProcessing:
      type: object
      description: 编辑受理为处理中——同步字段已生效、展示字段（Nick Name）后台补齐；收敛靠同 Idempotency-Key 重试返当前结果、完成后 204
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - PROCESSING
          description: 处理中——展示字段最终一致后收敛为成功（同 Idempotency-Key 重试查进度）
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            currentMerchantId:
              type: string
              description: 服务端会话当前商户（≠ 请求携带的 expected `X-Merchant-Context`），供前端 re-sync；**无当前商户则不返回本键**（前端须重选）。
            maskedEmail:
              type: string
              description: 已遮蔽的邮箱（形如 `j***@example.com`），**只作展示、不可回填表单**。
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
    WechatQrContent:
      type: string
      description: |
        微信二维码的**待编码内容**（短时、一次性、不透明串）——前端据此**自行渲染二维码图片**。 **不是图片 URL**，不要当 `<img src>` 用；内容对前端不透明，不要解析、拼接或复用。 三处扫码入口（扫码登录 / 成员登录绑定 / 通知接收方绑定）共用同一形状与渲染方式。
    Timestamp:
      type: string
      format: date-time
      description: '**瞬时时刻**(RFC 3339 date-time)。in/out 非对称:**响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z); **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset, 「出参 Z」是约定、非 schema 可强制)。展示可按商户 IANA 时区换算(单独字段,offset ≠ timezone)。 **只表示「什么时候发生」,不表示「算哪一天」** —— 需要「哪一天」的地方各有自己的**日期字段**(`YYYY-MM-DD`), **别拿本类型自己推**：两者在跨日边界附近会分属两天。'
    WechatQrExpiresAt:
      allOf:
        - $ref: '#/components/schemas/Timestamp'
      description: |
        二维码有效期截止。**到期只表示这张二维码不能再扫**，**不必然**表示本次交互已有定论—— 到期后结果是否还可能变化，**各入口不同、由各入口的轮询状态说明，不由本字段推断**。
    QuickFilterItem:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
          description: 该项对应的筛选值 —— **对客户端不透明**:选中本项就把它**原样**回传给对应列表端点的那个筛选参数, 不要解析、拼接或据其分支。
          examples:
            - PAID
        label:
          type: string
          description: 后端给的默认展示名。**客户端有自己的多语言资源时按 `value` 取用、本字段作兜底**; 没有资源(取值由配置或数据决定,如角色名、年份)时直接展示本字段。
          examples:
            - Paid
        count:
          type: integer
          minimum: 0
          description: 该项当前的命中数(口径见 `QuickFilterCounts` 说明)。
    QuickFilterCounts:
      type: object
      additionalProperties: false
      description: |
        **列表页顶部快捷筛选的各项与计数**。快捷筛选就是该列表的一个筛选维度,没有特殊机制:选中某项 = 给列表带上该维度的筛选参数(值 = 该项 `value`),**选 All = 不带这个参数**。

        **照着 `items` 渲染即可** —— 项集、顺序、展示名、数字全部由服务端给出,客户端不枚举取值、不 hardcode 项集;某项当期为 `0` 时**仍会返回**(那一格不该因为没数据就消失)。

        **`All` 不在 `items` 里,由客户端自己补一项**,数字 = 其余各项之和 —— 服务端保证 `items` 覆盖该列表在不带本维度筛选时的全部命中(每行恰好落进一项),故这个和恒等于此时列表的 `total`。

        **本端点不接受被计维度自身的参数**;其余筛选条件与对应列表端点一致、传什么算什么。因此:点某项后列表 `total` = 该项 `count`;点 All 后列表 `total` = 各项 `count` 之和。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuickFilterItem'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: \S
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: \S
    MerchantContextGuard:
      name: X-Merchant-Context
      in: header
      required: true
      description: |
        stale-tab 一致性守卫（读写统一）：页面预期的当前商户 ID。与会话当前商户比对，一致才执行；不一致时**读不返回错商户数据、写不执行**，并按下面两种情形二分： **① 会话有当前商户、只是与 expected 不同 → `409` · `208001`（`MERCHANT_CONTEXT_CHANGED`）**，响应 `context.currentMerchantId` 回显服务端当前商户供前端直接 re-sync； **② 会话没有当前商户（无可回显者）→ `409` · `208022`（`MERCHANT_NOT_ACCESSIBLE`）**，前端重跑启动链路按 `routeTo` 分流（见 API 基础约定「merchant scope + stale-tab 守卫」）。 挂在所有依赖当前商户的读 + 写接口；前端统一 interceptor 发送 + 处理 409（提示并刷新当前商户）。 **豁免**：不依赖「当前商户」的接口——当前商户的 re-sync / 切换入口本身，以及目标由 path 直接指定、与当前商户无关的接口。 某个接口挂没挂本 header，**看该接口的 `parameters` 即可**（挂了就是必带）。
      schema:
        type: string
        minLength: 1
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  responses:
    MerchantBffDefaultError:
      description: |
        非 2xx 统一错误响应——覆盖所有未在本 op 显式列出的状态码。 HTTP status 只表达大类，**具体子因看响应体的整数 `code`**：该 op 承诺的业务码见其 `x-error-codes`， 码的**固有属性**（`name` / `httpStatus` / `retryable` / 必带 context 字段）见**随包错误码表**； **该码在本接口下意味着什么、你该怎么处理，见本接口自己的说明**（怎么读见 API 基础约定「错误响应体」）。 部分码另带 `context` 结构化上下文（如 stale-tab 守卫 `208001` 必携 `context.currentMerchantId` 供前端 re-sync 当前商户）—— 哪些码必携哪些字段，以码表的 `requiredContextFields` 为准，**不要按状态码猜**。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
