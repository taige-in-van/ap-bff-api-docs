      description: 输当前密码换取 TOTP provisioning（otpauth URI），待 activation 激活；**当前密码错 → `403`·`206011`**——会话仍有效，留在当前弹窗提示重输、**不要跳登录页**（不计入登录锁定）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
              properties:
                currentPassword:
                  type: string
                  format: password
            example:
              currentPassword: Str0ng!Pass
      responses:
        '200':
          description: provisioning（otpauth URI），待 activation
          content:
            application/json:
              schema:
                type: object
                properties:
                  otpauthUri:
                    type: string
              example:
                otpauthUri: otpauth://totp/MerchantPortal:jane@example.com?secret=JBSWY3DPEHPK3PXP&issuer=MerchantPortal
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206011
  /me/security/mfa/activation:
    post:
      tags:
        - account-security
      operationId: activateMfa
      summary: 启用 MFA — 确认（输 TOTP 激活，状态 → ENABLED）
      description: 用 `enrollMfa` 拿到的 provisioning 扫码后，输一次 TOTP 完成激活。 **TOTP 错 → `403`·`206011`**（会话仍有效，留在当前弹窗重输、**不要跳登录页**；不计入登录锁定）; **enrollment 已失效**（`MFA_PENDING` 超时未确认 / 已被取消）→ `410`·`966002`——重输无用， 须**回第一步重新 `enrollMfa`** 取新的 provisioning 再扫码。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  $ref: '#/components/schemas/OtpCode'
            example:
              code: '123456'
      responses:
        '204':
          description: 已激活（MFA_PENDING → ENABLED）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206011
        - 966002
  /me/security/mfa/deactivation:
