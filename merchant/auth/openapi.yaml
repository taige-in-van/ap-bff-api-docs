                  type: string
                  format: email
            example:
              newEmail: jane.new@example.com
      responses:
        '202':
          description: 新邮箱 OTP 已发（pending 占**全平台**登录域唯一性）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206005
        - 206006
        - 208001
        - 968001
        - 968010
  /owner-contact/primary-email/change-requests/{challengeId}/confirmation:
    post:
      tags:
        - owner-contact
      operationId: confirmOwnerPrimaryEmailChange
      summary: 改 Primary Email — 确认（新邮箱 OTP → 替换 Primary Email + 旧邮箱变更通知）
      description: 凭 change-request 新邮箱 OTP 完成替换（一次性 OTP、非幂等）。Primary Email = 登录邮箱 = Contact email 三合一同步更新；旧邮箱收 Registration Email Changed 通知（无 Reset password CTA、非本人救济经 Contact us）。不影响会话。 **失败按 `code` 分流**：新邮箱 OTP 是服务端签发的一次性验证码,**计次**——输错但尚有次数 → `400`·`204010`（留在弹窗重输,剩余次数见 `context.attemptsRemaining`）; **错到超限** → `423`·`966003`（该挑战作废,回第一步重新发起）;该 OTP / change-request **过期或已消费** → `410`·`206006`（重输无用,同样回第一步）; **不是发起该变更的那个会话 / 发起者** → `403`·`206005`;**切了商户上下文** → `409`·`208001`。
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: primary-email change-request 实例 id（已绑 merchant/target/initiator/session）
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  allOf:
                    - $ref: '#/components/schemas/OtpCode'
                  description: 新邮箱 OTP
            example:
              code: '654321'
      responses:
        '204':
          description: Primary Email 已更新（旧邮箱已收变更通知）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 206005
        - 206006
        - 208001
        - 966003
  /password-resets:
    post:
      tags:
        - password-reset
      operationId: requestPasswordReset
      summary: 商户用户自助重置 — 发起（**恒 202 反枚举**;因子由服务端判定,不在响应泄露）
      description: |
        前端只传 loginId。**恒返 202、不在响应体暴露因子/账号存在性**。服务端按可用因子处理:已绑 MFA → 后续要 TOTP(不发邮箱 OTP,闭合 MFA 降级);未绑 MFA 的邮箱格式 → 发邮箱 OTP;用户名格式+无 TOTP → 不发(联系 Owner)。**重发 = 重复调用本端点**:冷却后重复调用产生**新 challenge + 新 OTP**、**同一账号的旧 challenge / 旧 OTP 立即失效**(单一在途、避免多 OTP 并存)。 可从无会话(登录页)或登录态(My Profile)发起;用户名格式「联系 Owner」提示由前端按 loginId 格式通用展示(不依赖账号存在性)。**`429` = 端点级 / IP 级防刷限流(仅按调用频率、不区分账号存在性,enum-safe;FE 据此退避);账号级冷却服务端静默、响应恒 202、剩余秒数前端本地计时(绝不以账号级 429 暴露存在性)**。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginId
              properties:
                loginId:
                  type: string
            example:
              loginId: jane@example.com
      responses:
        '202':
          description: 已受理(反枚举,不暴露账号是否存在 / 因子)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetChallenge'
              example:
                challengeId: pwr_4e1a8c9b2d
                resendCooldownSeconds: 60
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /password-resets/{challengeId}/factor-verification:
    post:
      tags:
        - password-reset
      operationId: verifyPasswordResetFactor
      summary: 自助重置 — 因子验证（邮箱 OTP / TOTP → resetToken）
      description: |
        因子验证（**该步强制挂 Idempotency-Key**：重放同键返回同一 resetToken——杜绝网络重试因 OTP 已消费而假失败）。challengeId 不泄露账号存在性；因子错误 / 过期 → `410`、锁定 → `423`、限流 → `429`（共享错误模型）。`400` = 入参校验失败（如缺字段）。验证成功才签发单次 resetToken,供 confirmation 步骤设置新密码。 **幂等**：必带 `Idempotency-Key`。因子只能被消费一次，**网络重试务必复用同一个键**——同键 + 同请求体重发返回**同一个 resetToken**（不会因「因子已用过」而假失败）；换新键重发会按已消费处理 → `410`。同键但请求体不同 → `409`·208005。
      security: []
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: password-reset challenge 实例 id
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
                  description: 邮箱 OTP 或 TOTP code
            example:
              code: '123456'
      responses:
        '200':
          description: 因子验证通过，返回单次 resetToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetFactorVerified'
              example:
                resetToken: rst_8f3c1a9e6b2d4f7a0c5e
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208005
        - 966001
        - 966002
  /password-resets/{challengeId}/confirmation:
    post:
      tags:
        - password-reset
      operationId: confirmPasswordReset
      summary: 自助重置 — 确认（因子 + 新密码 → 全会话失效;**MFA 绑定不变、不绕过 MFA**;不签发新会话）
      description: '**重置只改密码、不改 MFA 绑定**——下次登录仍强制 TOTP(闭合 MFA 降级)。'
      security: []
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: password-reset challenge 实例 id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resetToken
                - newPassword
              properties:
                resetToken:
                  type: string
                  minLength: 20
                  description: 邮箱 OTP / TOTP 因子验证后的高熵单次 token
                newPassword:
                  type: string
                  format: password
            example:
              resetToken: rst_8f3c1a9e6b2d4f7a0c5e
              newPassword: N3w!Str0ngPass
      responses:
        '204':
          description: 重置成功（该用户全平台会话已失效;MFA 绑定不变;前端回登录页）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 966002
