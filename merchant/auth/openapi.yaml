                merchantId: '1000023'
                roles:
                  - role_owner
                landingPage: /dashboard
                menus:
                  - resourceId: dashboard
                    type: menu
                    label: Dashboard
                    path: /dashboard
                  - resourceId: settings
                    type: menu
                    label: Settings
                    path: /settings
                    children:
                      - resourceId: settings.users
                        type: menu
