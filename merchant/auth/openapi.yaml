      description: |
        Contact email 编辑（= Owner Primary Email = 登录邮箱，三合一同一字段）。写 = 联系人编辑权限、默认 Owner。
        凭据强度靠**该 Owner 身份因子**（MFA→TOTP / 无 MFA→旧邮箱 OTP）+ 新邮箱 OTP。

        **后续每步须来自同一商户 / 同一会话 / 同一发起者、且针对同一 Owner**——

        - 切商户 → `409`·`208001`（stale-tab 守卫）;
        - **换会话 / 异发起者 →** `403`·`206005`（须重走一次挑战，不是重输因子）。

        具备权限的授权者亦可代该 Owner 完成（校验目标 Owner 因子 + 替换其登录邮箱）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: 变更请求已创建（challenge 已绑 merchant/target/initiator/session）
          content:
            application/json:
              schema:
                type: object
                required:
                  - challengeId
                  - identityVerification
                properties:
                  challengeId:
                    type: string
                  identityVerification:
                    type: string
                    enum:
                      - MFA_TOTP
                      - OLD_EMAIL_OTP
                    description: 本次要用哪个身份因子。`OLD_EMAIL_OTP` = **旧邮箱的码已随本步发出**（见 `otpDelivery`）；`MFA_TOTP` = 无码可发，用户打开 Authenticator 取。
                  otpDelivery:
                    allOf:
                      - $ref: '#/components/schemas/OtpDelivery'
                    description: '**仅 `identityVerification = OLD_EMAIL_OTP` 时返回本键**——旧邮箱码已发出，据此渲染「发到 x***@y.com」与重发倒计时。`MFA_TOTP` 时不返回。重发走 `…/verification-code`。'
              example:
                challengeId: pec_6b1d3f8a90
                identityVerification: MFA_TOTP
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /owner-contact/primary-email/change-requests/{challengeId}/verification-code:
    post:
