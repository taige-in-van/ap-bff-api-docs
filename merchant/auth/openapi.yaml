openapi: 3.1.0
info:
  title: 商户后台 认证 — 前端契约面
  version: 2.2.0
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的认证契约：登录与会话（密码、MFA、微信扫码、代登落地、当前会话、切换当前商户、登出）、忘记密码、注册与邮件链接落地页（邮箱激活、设密链接、确认新登录邮箱、代客建档确认页）。
    浏览器持 httpOnly 会话 cookie（登录后 set-cookie），字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 认证类（登录、登出、MFA、扫码）与多步挑战类（找回密码、激活链接、确认新邮箱）按流程语义不挂 `Idempotency-Key`；注册按注册邮箱去重、不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`；公开端点（`security: []`）不要求会话、不带。
    - 代客建档确认页三个接口不要求会话，凭请求头 `X-Confirmation-Token` 里的确认令牌（`onboardingConfirmationToken`），不带 cookie 凭据、不要求 CSRF；签署与提异议以确认令牌去重，不挂 `Idempotency-Key`。

    **登录类公开端点读会话 cookie**：`login`、`completeMfaChallenge`、`initiateWechatLogin`、`pollWechatLogin`、`establishImpersonationSession` 是公开端点、不要求会话，但会读请求带的会话 cookie 做已登录检查——本浏览器会话仍有效时不处理这次提交、回 `409`·`208042`。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: sessions
    x-displayName: 登录与会话
    description: 登录与会话：密码登录（已启 MFA 转二次校验）、微信扫码登录、当前会话、切换当前商户、登出。
  - name: password-resets
    x-displayName: 忘记密码
    description: 忘记密码自助重置：邮箱登录名收邮件验证码、用户名登录名用验证器码；重置不改 MFA。
  - name: registrations
    x-displayName: 账号开通
    description: 账号开通（公开、无会话）：自助注册与邮箱激活（提交注册建待验证账号并发验证邮件，邮件链接落地页输注册密码后激活，含重发验证邮件）；受邀员工在邀请链接落地页设密激活；员工在确认链接落地页确认 Owner 改的新登录邮箱。都不建会话。
  - name: onboarding-confirmation
    x-displayName: 代客建档确认页
    description: 工作人员代为建档后，Owner 凭确认邮件里的链接免登录核对资料与合同，签署提交或提异议。不建会话。
paths:
  /auth/sessions:
    post:
      tags:
        - sessions
      operationId: login
      summary: 密码登录（邮箱或用户名 + 密码；已启 MFA 则转二次校验）
      description: |
        邮箱或用户名 + 密码认证（client 由服务端注入、前端不传）。未启 MFA 直接建会话（set-cookie）；
        已启 MFA 返回 `MFA_REQUIRED` 和一次性挑战句柄 `mfaChallenge`（未建会话），再调 `completeMfaChallenge`。

        错误码：

        - `206012` 凭据错：密码错、账号不存在、该账号不能登录商户后台（没有商户后台的角色）都返回此码、不区分；受邀但未设密的员工也返回此码。
        - `208029` 邮箱未验证。
        - `208027` 账号被禁用。
        - `208028` 取不到当前商户（规则见下「建会话时的当前商户」），不建会话。
        - `966001` 账号因连续登录失败被锁。
        - `409`·`208042` 本浏览器已登录：请求带的会话仍有效时不处理这次提交（不校验凭据、不建新会话、原会话原样保留、不计失败次数、不记登录流水，本次的 `rememberMe` 不生效），前端进入登录后页面；换号须先登出。
        - 同一登录名（解析不到账号）短时间内失败过多 → `429`·`906004`，稍后再试；默认 15 分钟内 5 次（可配置），与 POS、商户 App 登录共用计数。

        各情形的页面处理见 flows。

        建会话时的当前商户：在该用户能进入的商户（未删除、未冻结）里，取第一个已激活的（主商户在前，关联商户按创建时间）；没有已激活的就取主商户（首次入驻中或已被拒，被拒的虽不在商户列表里也照取）；都取不到（如主商户已冻结、只剩入驻中的关联商户）→ `208028`。不记上次用的商户。二次校验、扫码登录建会话同此规则。

        界面语言：建会话时这个账号还没有 `locale`，就把本次请求 `Accept-Language` 对应的语言记为它的 `locale`；已有的不动。二次校验、扫码登录建会话同此规则。
      security: []
      parameters:
        - $ref: '#/components/parameters/PreLoginAcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              loginId: jane@example.com
              password: Str0ng!Pass
              rememberMe: false
      responses:
        '200':
          description: '`ESTABLISHED` 已 set-cookie；`MFA_REQUIRED` 待二次校验（未建会话）'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              examples:
                established:
                  summary: 成功（无 MFA，已 set-cookie）
                  value:
                    status: ESTABLISHED
                mfaRequired:
                  summary: 需 MFA（返回挑战句柄，未建会话）
                  value:
                    status: MFA_REQUIRED
                    mfaChallenge: chl_9f2a4c7e1b
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206012
        - 208027
        - 208028
        - 208029
        - 208042
        - 966001
  /auth/sessions/mfa:
    post:
      tags:
        - sessions
      operationId: completeMfaChallenge
      summary: 登录二次校验（提交验证器码，通过则建会话）
      description: |
        登录第二步：提交验证器（TOTP）6 位码，通过则建会话，`status` 恒为 `ESTABLISHED`。账号与商户状态在本步重新判定。

        错误码：

        - `206012` 验证码错，或本步重判时该账号已不能登录商户后台。
        - `206006` 挑战句柄过期或已用。
        - `966001` 账号因连续登录失败被锁。
        - `208027` / `208028` 同 `login`。
        - `409`·`208042` 本浏览器已登录（如第一步之后另一标签页已登录）：不校验验证码，挑战任其过期，前端进入登录后页面；其余同 `login`。
      security: []
      requestBody:
        required: true
        description: '`mfaChallenge` 是 `login` 返回的一次性挑战句柄；`rememberMe` 照 `login` 时的勾选再交一次。'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginMfaRequest'
            example:
              mfaChallenge: chl_9f2a4c7e1b
              code: '123456'
              rememberMe: false
      responses:
        '200':
          description: 校验通过，已 set-cookie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResult'
              example:
                status: ESTABLISHED
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206006
        - 206012
        - 208027
        - 208028
        - 208042
        - 966001
  /auth/sessions/wechat:
    post:
      tags:
        - sessions
      operationId: initiateWechatLogin
      summary: 微信扫码登录 — 发起（返回二维码票据）
      description: |
        发起扫码登录，返回二维码内容与轮询票据；二维码默认 5 分钟有效（可配置）。

        错误码：

        - `409`·`208042` 本浏览器已登录：请求带的会话仍有效时不出码、不发起，原会话原样保留，前端进入登录后页面；换号须先登出。
      security: []
      responses:
        '200':
          description: 二维码票据（用 `qrTicket` 轮询 `pollWechatLogin`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatQrChallenge'
              example:
                qrTicket: wxq_3f8a1c0d92b47e5f1a
                qrContent: 8f3Kd0pQzR2vLxA7nB1cYw
                expiresAt: '2026-06-22T14:10:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208042
  /auth/sessions/wechat/{qrTicket}:
    get:
      tags:
        - sessions
      operationId: pollWechatLogin
      summary: 微信扫码登录 — 轮询（确认成功则建会话）
      description: |
        轮询扫码登录结果，除本浏览器已登录外恒返回 `200`。`ESTABLISHED` 时已 set-cookie（会话按未勾 Keep me signed in 处理）；扫码登录不追加 MFA。

        未绑定、账号禁用、能进的商户全部不可用等拒绝，只在微信里告诉扫码本人，本接口不返回原因、维持 `WAITING` 直至过期。

        错误码：

        - `409`·`208042` 本浏览器已登录：请求带的会话仍有效时不处理这次轮询，原会话原样保留，前端进入登录后页面。检查排在按 `qrTicket` 查找之前，票据存在与否都回此码。轮询期间另一标签页已登录的，下一次轮询即回此码，用户在微信里已确认的这次扫码不建会话、任其过期。
      security: []
      parameters:
        - name: qrTicket
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 轮询结果
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    allOf:
                      - $ref: '#/components/schemas/WechatPollStatus'
                    enum:
                      - WAITING
                      - EXPIRED
                      - ESTABLISHED
                    readOnly: true
                    description: |
                      扫码登录状态：

                      - `WAITING`：继续轮询（未扫、未确认、已被拒都表现为它，直到二维码过期）。
                      - `EXPIRED`：终态，重新发起。包括二维码过期、票据非法、用户在微信里取消。
                      - `ESTABLISHED`：已登录，cookie 已下发。

                      未知值按 `WAITING` 处理。
              example:
                status: WAITING
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208042
  /auth/sessions/impersonation:
    post:
      tags:
        - sessions
      operationId: establishImpersonationSession
      summary: 凭代登交接码建代登会话（代登落地页提交）
      description: |
        运营从管理后台代登商户时，管理后台新开窗口打开的落地页地址的 fragment 里带一次性交接码（`#code=…`）；落地页从 fragment 取出交接码调本接口，成功即建会话（set-cookie），返回同 `getCurrentSession` 的会话上下文，随后进商户后台首页。

        代登会话的规则：

        - 当前商户固定为被代的商户，权限按该商户 Owner 算；会话能进入的商户只有它，切到其他商户按不在商户列表处理（`404`），页面不显示商户切换。
        - 会话不续期：到期即结束，须回管理后台重新发起。
        - 在线复核、登出与被强制下线同普通会话。

        交接码只能用一次，用过即失效；刷新落地页不能重进，须回管理后台重新发起。

        错误码：

        - `206019` 交接码无效、已用过或已过期。
        - `409`·`208042` 本浏览器已登录商户后台：请求带的会话仍有效时不处理这次提交（不消费交接码、不建会话、原会话原样保留）；须先登出该浏览器的商户后台会话，再回管理后台重新发起。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - handoffCode
              properties:
                handoffCode:
                  type: string
                  minLength: 1
                  maxLength: 128
                  description: 落地页地址里的交接码。
            example:
              handoffCode: hcode_4b7e2a91f0
      responses:
        '200':
          description: 已建会话（已 set-cookie）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
              example:
                operatorId: op_7a1c9
                loginId: jane@example.com
                displayName: Jane Merchant
                locale: en
                isOwner: true
                merchantId: '1000023'
                roleNames:
                  - Owner
                privileges:
                  - dashboard:overview:view
                  - orders:payment:view
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206019
        - 208042
  /auth/sessions/current:
    get:
      tags:
        - sessions
      operationId: getCurrentSession
      x-required-privilege: session
      summary: 当前会话（身份摘要 + 可见权限点）
      description: |
        受保护页面的会话校验入口，返回身份摘要、当前商户与可见权限点集合；会话无效返回 `401`。

        每次都重新确认当前商户：原来的当前商户已被删除或冻结时，按 `login` 的「建会话时的当前商户」规则换一个（权限点按新商户算）；一个都取不到就结束会话，返回 `403`·`208028`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
              example:
                operatorId: op_7a1c9
                loginId: jane@example.com
                displayName: Jane Merchant
                locale: en
                isOwner: true
                merchantId: '1000023'
                roleNames:
                  - Owner
                privileges:
                  - dashboard:overview:view
                  - orders:payment:view
                  - orders:refund:create
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208028
    put:
      tags:
        - sessions
      operationId: switchCurrentMerchant
      x-required-privilege: session
      summary: 切换当前商户
      description: |
        把会话的当前商户切到目标商户，返回切换后的会话（`privileges` / `visibleModules` / `isOwner` 按新商户算；员工切到关联商户仍用自己在主商户的角色）。

        - 目标须是 `listMerchants` 里 `ACTIVE` 的商户；在列表里但还没激活 → `409`·208003。
        - 目标不在 `listMerchants` 里（不存在、不在册、已删除、已冻结、入驻被拒）→ 404。

        重复切到同一商户结果相同，不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantRef'
            example:
              merchantId: '1000024'
      responses:
        '200':
          description: 切换后的会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionContext'
              example:
                operatorId: op_7a1c9
                loginId: jane@example.com
                displayName: Jane Merchant
                locale: en
                isOwner: true
                merchantId: '1000024'
                roleNames:
                  - Owner
                privileges:
                  - dashboard:overview:view
                  - orders:payment:view
                  - orders:refund:create
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208003
    delete:
      tags:
        - sessions
      operationId: logout
      x-required-privilege: session
      summary: 登出（撤销当前会话）
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已登出（cookie 已清除）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /auth/password-resets:
    post:
      tags:
        - password-resets
      operationId: requestPasswordReset
      summary: 找回密码 — 发起（恒 202，不暴露账号是否存在）
      description: |
        按 `loginId` 的形态选验证方式：

        - 是合法邮箱格式的按邮箱账号：账号存在则往该邮箱发 6 位验证码。
        - 否则按用户名账号：用验证器（TOTP）里的 6 位码，不发邮件；没开验证器的用户名账号无法自助重置，由 Owner 在成员管理里重设。

        恒返 `202`，账号存在与否响应一致。重发 = 冷却结束后再调本接口，得到新 `challengeId`，旧码作废。`429`·`906004` 为端点 / IP 级限流。

        验证码邮件按该账号的界面语言发；账号还没有语言偏好时，用本次请求 `Accept-Language` 对应的语言。
      security: []
      parameters:
        - $ref: '#/components/parameters/PreLoginAcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - loginId
              properties:
                loginId:
                  $ref: '#/components/schemas/LoginId'
                  description: 邮箱或用户名
            example:
              loginId: jane@example.com
      responses:
        '202':
          description: 已受理（账号存在与否响应一致）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetChallenge'
              example:
                challengeId: pwr_4e1a8c9b2d
                cooldownSeconds: 60
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /auth/password-resets/{challengeId}/confirmation:
    post:
      tags:
        - password-resets
      operationId: confirmPasswordReset
      summary: 找回密码 — 验证码 + 新密码一次提交
      description: |
        验证码与新密码一次提交，这是找回流程里唯一的核码点：码正确才消费挑战并改密，该用户所有会话失效，并给本人登录邮箱发密码已修改通知（用户名账号不发）。
        只改密码、不改 MFA，开了验证器的账号下次登录仍要验证器码。

        不挂幂等键（挑战类）。挑战已被消费后再提交返回 `206006`。

        错误码：

        - `204010` 验证码错，次数未超限，可重输（新密码无需重填）。
        - `206006` 挑战已过期、已作废或已被消费，须重新发起。
        - `206007` 错码次数超限，挑战作废，须重新发起。
      security: []
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/ChallengeId'
          description: '`requestPasswordReset` 返回的挑战 id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - newPassword
              properties:
                code:
                  $ref: '#/components/schemas/OtpCode'
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: 新版 5 规则（≥ 8 字符 / 大写 / 小写 / 数字 / 特殊字符）;下限 8 = 其中的长度那条，其余四条由前端校验并提示具体未满足项、服务端兜底拒绝
            example:
              code: '123456'
              newPassword: N3w!Str0ngPass
      responses:
        '204':
          description: 已重置；该用户所有会话失效
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 206006
        - 206007
  /auth/registrations:
    post:
      tags:
        - registrations
      operationId: registerOwner
      summary: Owner 自助注册（建待验证账号并发验证邮件）
      description: |
        提交注册：建待验证账号（邮箱验证前不能登录）并发验证邮件，邮件投递失败不阻塞注册。

        该邮箱已有待验证账号时，用本次提交覆盖上次的密码和资料；不在重发冷却内则作废旧验证链接、发新链接。响应与新建相同。
        幂等基准：注册邮箱，不挂 `Idempotency-Key`。同内容重发即再覆盖一次，结果相同。

        限流按来源 IP 与按注册邮箱两个维度，任一命中都返回 `429`·`906004`。

        本次请求 `Accept-Language` 对应的语言记为新账号的 `locale`，验证邮件也用它。

        错误码：

        - `968001` 该邮箱已被其他账号使用（含邀请中、已停用的账号；别人改登录邮箱时尚未确认的新邮箱不算占用）。
      security: []
      parameters:
        - $ref: '#/components/parameters/PreLoginAcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
            example:
              email: jane@example.com
              password: Str0ng!Pass
              agreeTerms: true
              firstName: Jane
              lastName: Merchant
              phone: '+16045550123'
              businessTitle: Manager
              referredBy: MONERIS
      responses:
        '201':
          description: 已受理：待验证账号已建（或已覆盖），验证邮件已发起
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendCooldown'
              example:
                cooldownSeconds: 60
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 968001
  /auth/registrations/verification-email:
    post:
      tags:
        - registrations
      operationId: resendVerificationEmail
      summary: 重发验证邮件（恒 202）
      description: |
        待验证账号存在且不在冷却内时发新验证邮件，旧链接作废；账号不存在或在冷却内时静默不发。恒返 `202`，响应不暴露账号是否存在。

        重发冷却按账号计、部署参数（默认 60 秒），剩余秒数由前端按 `cooldownSeconds` 本地计时。按来源 IP 或按注册邮箱的限流命中返回 `429`·`906004`，不区分账号是否存在。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSubmission'
            example:
              email: jane@example.com
      responses:
        '202':
          description: 已受理。`cooldownSeconds` 恒返同一值，不随账号是否存在变化。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendCooldown'
              example:
                cooldownSeconds: 60
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /auth/registrations/verification:
    post:
      tags:
        - registrations
      operationId: verifyRegistrationEmail
      summary: 邮箱激活（落地页输注册密码后提交；不建会话）
      description: |
        同时核对邮件链接里的一次性令牌和当前待验证账号的注册密码，两者都对才把账号邮箱标为已验证。不建会话、不下发 cookie。

        令牌只在激活成功时消费；密码不对或其他失败都不消费，可用同一令牌重试。已消费的令牌再提交（账号已激活）同样返回 `204`，不再核对密码。

        错误码：

        - `206001` 令牌无效、已过期或已被重发作废。
        - `206012` 注册密码不对。
        - `206007` 密码错误次数达上限，该链接已锁定。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - password
              properties:
                token:
                  type: string
                  description: 邮件链接里的一次性令牌
                password:
                  type: string
                  format: password
                  description: 注册时设的密码（同一邮箱多次注册的，以最后一次为准）
            example:
              token: vtok_a1b2c3d4e5
              password: Str0ng!Pass
      responses:
        '204':
          description: 邮箱已验证（含此前已激活）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206001
        - 206007
        - 206012
  /auth/registrations/invitation:
    post:
      tags:
        - registrations
      operationId: acceptInvitation
      summary: 凭邮件里的设密链接设密（落地页提交；不建会话）
      description: |
        校验链接里的一次性令牌并写入新密码。不建会话，成功后回登录页用新密码登录。三种链接共用本接口：

        - 员工邀请链接、代客建档 Owner 的开户设密链接：账号由邀请中激活为 `ACTIVE`，邮箱同时标为已验证。
        - 运营发出的重置密码链接：账号本就是 `ACTIVE`，状态不变；设密成功即旧密码失效、该账号所有已登录会话失效。设密前旧密码照常可用。

        链接带令牌和该账号的邮箱（`?token=…&email=…`），邮箱只供页面展示，提交以令牌为准。令牌只在设密成功时消费，之前失败的可用同一令牌重试。

        本次请求 `Accept-Language` 对应的语言记为该账号的 `locale`（已设过语言的不改）。

        错误码：

        - `206009` 令牌无效或已过期（含被重发作废）。
        - `206010` 令牌已用过（账号已激活，或这次重置已完成）；本次提交的新密码未生效。
      security: []
      parameters:
        - $ref: '#/components/parameters/PreLoginAcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  description: 邀请链接里的一次性令牌
                newPassword:
                  type: string
                  format: password
                  minLength: 8
                  description: 新版 5 规则（≥ 8 字符 / 大写 / 小写 / 数字 / 特殊字符）;下限 8 = 其中的长度那条，其余四条由前端校验并提示具体未满足项、服务端兜底拒绝
            example:
              token: itok_5d4e1f2a3b
              newPassword: Str0ng!Pass
      responses:
        '204':
          description: 已设密;账号 ACTIVE，不建会话
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206009
        - 206010
  /auth/registrations/email-confirmation:
    post:
      tags:
        - registrations
      operationId: confirmMemberLoginEmail
      summary: 员工确认 Owner 改的新登录邮箱（邮件链接落地页提交；不建会话）
      description: |
        Owner 改了已激活员工的登录邮箱后，新邮箱收到确认链接；员工在落地页主动提交后才切换为新邮箱，旧邮箱收安全通知。确认前旧邮箱仍有效。令牌一次性，打开页面不消费。

        错误码：

        - `206006` 链接无效、已过期或已被 Owner 的新改动顶掉。
        - `968001` 确认前新邮箱已被别人使用，这次改动作废，请 Owner 换一个邮箱重改。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: 邮件链接里的一次性令牌
            example:
              token: etok_7c2d9e4f1a
      responses:
        '204':
          description: 登录邮箱已切换为新邮箱
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206006
        - 968001
  /auth/onboarding-confirmation:
    get:
      tags:
        - onboarding-confirmation
      operationId: getOnboardingConfirmation
      summary: 取代客建档确认页内容（申请资料与合同）
      description: |
        确认页从页面地址的 fragment（`#token=…`）取确认令牌，放在请求头 `X-Confirmation-Token` 里调用本页三个接口。本接口返回运营代填的申请资料与待签合同，供 Owner 核对。打开页面、刷新与重复读取都不消费令牌。

        资料文件只给文件名、不给访问地址；合同用 `contractUrl` 预览或下载，地址短时有效，过期后重新读取本接口拿新的。

        错误码：

        - `206018` 链接无效：令牌不存在、已过期、已被新的确认邮件顶掉、已签署或已提异议，或这份申请已撤回。各情形同一外观、不返回任何申请资料；页面提示联系为其建档的工作人员。
      security:
        - onboardingConfirmationToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingConfirmation'
              example:
                tradeName: Maple Vet Clinic
                legalName: Maple Veterinary Inc.
                ownerName: Jane Doe
                ownerEmail: owner@maplevet.example.com
                steps:
                  business:
                    currency: CAD
                    country: CA
                    legalBusinessName: Maple Veterinary Inc.
                    tradeName: Maple Vet Clinic
                  documents:
                    docIncorporation:
                      fileName: incorporation.pdf
                    docOwnerId:
                      fileName: owner-id.jpg
                contractUrl: https://files.example.com/o/c71e04ab?exp=1755331200&sig=REDACTED&disp=inline
                expiresAt: '2026-10-24T15:00:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206018
  /auth/onboarding-confirmation/signature:
    post:
      tags:
        - onboarding-confirmation
      operationId: signOnboardingConfirmation
      summary: 签署合同并提交入驻申请
      description: |
        Owner 核对无误后签署：手写签名（`drawn`，带签名图）或键入姓名（`typed`）。签署成功即令牌失效，申请提交审核；页面展示已提交，之后再打开链接按无效处理。签署时的姓名、方式、时间与来源网络随签署记录保存。

        确认令牌就是这次提交的去重依据：令牌一经签署即失效，重复提交得到 `206018`，不会签两次。

        错误码：

        - `206018` 链接无效（情形同 `getOnboardingConfirmation`）。
        - `drawn` 没带 `signatureImage`、`typed` 带了 `signatureImage`、签名图不是 PNG → `400`，`details` 定位字段。
      security:
        - onboardingConfirmationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingSignatureRequest'
            examples:
              typed:
                summary: 键入姓名
                value:
                  signerName: Jane Doe
                  signatureMethod: typed
              drawn:
                summary: 手写签名
                value:
                  signerName: Jane Doe
                  signatureMethod: drawn
                  signatureImage: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNkYPhfDwAChwGA60e6kgAAAABJRU5ErkJggg==
      responses:
        '204':
          description: 已签署，申请已提交审核
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206018
  /auth/onboarding-confirmation/dispute:
    post:
      tags:
        - onboarding-confirmation
      operationId: disputeOnboardingConfirmation
      summary: 对代填资料提异议（不签署）
      description: |
        Owner 认为资料有误、不签署时提交异议原因。提交成功即令牌失效，申请不提交、留在待签署；为其建档的工作人员收到通知后改资料并重新发确认邮件。页面展示已提交异议。

        确认令牌就是这次提交的去重依据：令牌一经提异议即失效，重复提交得到 `206018`。

        错误码：

        - `206018` 链接无效（情形同 `getOnboardingConfirmation`）。
      security:
        - onboardingConfirmationToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 300
                  description: 异议原因。
            example:
              reason: 结算账户不是我们的公司账户
      responses:
        '204':
          description: 已提交异议
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206018
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在当前商户不可访问时返回 `409`·`208022`（见公共约定「当前商户」）。
    onboardingConfirmationToken:
      type: apiKey
      in: header
      name: X-Confirmation-Token
      description: 确认页从页面地址 fragment 取到的确认令牌；一次性用于签署或提异议，有效期内可多次读取页面内容。不放进 URL 或 query。
  parameters:
    PreLoginAcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 页面当前的语言（BCP-47，如 `zh-Hans` / `fr-CA`），服务端归到 `en` / `fr` / `zh` 之一，认不出按 `en`。
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
  schemas:
    OnboardingConfirmation:
      type: object
      additionalProperties: false
      required:
        - tradeName
        - legalName
        - ownerName
        - ownerEmail
        - steps
        - contractUrl
        - expiresAt
      properties:
        tradeName:
          type: string
          minLength: 1
          description: 经营名。
        legalName:
          type: string
          minLength: 1
          description: 法定名。
        ownerName:
          type: string
          minLength: 1
          description: Owner 姓名。
        ownerEmail:
          type: string
          format: email
          description: Owner 邮箱。
        steps:
          $ref: '#/components/schemas/OnboardingConfirmationSteps'
        contractUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 待签合同的短时效访问地址，不要持久化、不要分享。
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: 链接过期时刻。
    OnboardingConfirmationSteps:
      type: object
      additionalProperties: false
      description: 运营代填的入驻资料，按入驻五步聚合；字段同入驻向导的读侧形态，未填字段不返回本键。资料文件只给文件名。
      properties:
        contact:
          $ref: '#/components/schemas/ContactStep'
        services:
          $ref: '#/components/schemas/ServicesStep'
        business:
          $ref: '#/components/schemas/BusinessStepRead'
        settlement:
          $ref: '#/components/schemas/SettlementStepRead'
        documents:
          type: object
          additionalProperties: false
          description: 已上传的资料，按文档位给文件名；未上传的文档位不返回本键。
          properties:
            docStoreInside:
              $ref: '#/components/schemas/ConfirmationDocumentName'
            docStoreOutside:
              $ref: '#/components/schemas/ConfirmationDocumentName'
            docIncorporation:
              $ref: '#/components/schemas/ConfirmationDocumentName'
            docOwnerId:
              $ref: '#/components/schemas/ConfirmationDocumentName'
            docVoidCheque:
              $ref: '#/components/schemas/ConfirmationDocumentName'
            docOther1:
              $ref: '#/components/schemas/ConfirmationDocumentName'
            docOther2:
              $ref: '#/components/schemas/ConfirmationDocumentName'
    ConfirmationDocumentName:
      type: object
      additionalProperties: false
      required:
        - fileName
      properties:
        fileName:
          type: string
          minLength: 1
          maxLength: 255
          description: 上传时的文件名。
    OnboardingSignatureRequest:
      type: object
      additionalProperties: false
      required:
        - signerName
        - signatureMethod
      properties:
        signerName:
          type: string
          minLength: 1
          maxLength: 128
          description: 签署人姓名。
        signatureMethod:
          type: string
          enum:
            - drawn
            - typed
          description: 签署方式：`drawn` 手写签名 / `typed` 键入姓名。
        signatureImage:
          type: string
          contentEncoding: base64
          contentMediaType: image/png
          minLength: 1
          maxLength: 1398104
          description: 手写签名图，PNG 的 base64（不带 `data:` 前缀，解码后不超过 1MB）；`drawn` 时必带，`typed` 时不带。
    RegistrationRequest:
      type: object
      description: 注册字段（各字段校验见 schema）
      additionalProperties: false
      required:
        - email
        - password
        - agreeTerms
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          description: 新版 5 规则（≥ 8 字符 / 大写 / 小写 / 数字 / 特殊字符）;下限 8 = 其中的长度那条，其余四条由前端校验并提示具体未满足项、服务端兜底拒绝
        agreeTerms:
          type: boolean
          description: Services Agreement + Privacy Policy 必勾选——**必须传 true**（传 `false` 即 400，服务端拒绝）
        firstName:
          type: string
          maxLength: 128
        lastName:
          type: string
          maxLength: 128
        phone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 区号候选取自前端参考数据，服务端校验区号在白名单内；`+1` / 10 位只是空白表单的初始值
        businessTitle:
          type: string
          minLength: 1
          maxLength: 64
          description: 职务文本；仅信息收集。预设 Business Owner / Manager / Employee 可直选；界面选 Other 时提交的是**用户填写的自定义文本**，不要提交字面 "Other"（它只是界面分支标记、不是职务）。回显按「不在预设集内 = 自定义」判定。
        referredBy:
          type: string
          description: 推荐来源，自由文本。注册链接带来源参数（如 `?ref=MONERIS`）时前端预填并锁定，服务端不区分来源方式
    LoginRequest:
      type: object
      required:
        - loginId
        - password
      properties:
        loginId:
          $ref: '#/components/schemas/LoginId'
          description: Email or Username（单 input；先按用户名精确匹配，匹配不到再按邮箱，不分大小写）
        password:
          type: string
          format: password
        rememberMe:
          type: boolean
          default: false
          description: 勾选 → 关掉浏览器后会话仍保留；不勾 → 会话随浏览器关闭结束。两种情况都受同一个最长有效期约束（从登录时刻起算，由平台设定，默认 69 天），到期须重新登录；请求不会延长它，也没有闲置过期。
    LoginMfaRequest:
      type: object
      required:
        - mfaChallenge
        - code
      properties:
        mfaChallenge:
          type: string
          minLength: 1
          description: '`login` 返回的一次性挑战句柄'
        code:
          $ref: '#/components/schemas/OtpCode'
        rememberMe:
          type: boolean
          default: false
          description: 与 `login` 提交时的勾选一致；本步建会话时按它决定会话是否在关掉浏览器后保留
    LoginResult:
      type: object
      description: 登录结果。`status` **只有两个取值**：`ESTABLISHED` 已 set-cookie 建会话;`MFA_REQUIRED` 已签发一次性挑战（`mfaChallenge`）、去二次校验。 凭据正确但不签发会话的三种情形（邮箱未验证 / 账号禁用 / 取不到当前商户）走 `403` + 各自的码，**不在本体内**。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ESTABLISHED
            - MFA_REQUIRED
          readOnly: true
        mfaChallenge:
          type: string
          description: 仅 `MFA_REQUIRED` 时返回：一次性挑战句柄，提交到 /auth/sessions/mfa
    PasswordResetChallenge:
      type: object
      required:
        - challengeId
        - cooldownSeconds
      properties:
        challengeId:
          $ref: '#/components/schemas/ChallengeId'
          description: 挑战 id；后续提交到 /auth/password-resets/{challengeId}/confirmation。账号不存在时同样返回（不暴露存在性）
        cooldownSeconds:
          type: integer
          description: 重发验证码的冷却秒数（默认 60、部署可配）；FE 据此从收到响应时刻本地倒计时。存在 / 不存在账号均返同一默认值
    SessionContext:
      type: object
      description: 会话上下文：身份摘要 + 可见权限点集合 + 展示字段
      required:
        - operatorId
        - loginId
        - locale
        - isOwner
        - merchantId
        - privileges
        - roleNames
      properties:
        operatorId:
          $ref: '#/components/schemas/UserId'
          readOnly: true
        loginId:
          $ref: '#/components/schemas/LoginId'
          readOnly: true
          description: 登录名：账号有邮箱时返回邮箱（同时有用户名的也返回邮箱），没有邮箱时返回用户名。是邮箱格式即有邮箱，可自助改登录邮箱；否则为用户名账号，由 Owner 管理、本人只读
        displayName:
          type: string
          readOnly: true
          description: 昵称（Nick Name），改走 `updateMyProfile`
        locale:
          allOf:
            - $ref: '#/components/schemas/Language'
          readOnly: true
          description: 账号的界面语言偏好：登录后页面按它显示，发给这个人本人的邮件（验证码、改密码、改邮箱等）也用它。必返（建会话时没有就已经补上），改走 `updateMyProfile`。
        isOwner:
          type: boolean
          readOnly: true
          description: 登录者是不是当前商户的 Owner，按商户的 Owner 归属算、不按角色名；标 `owner` 的接口只有它为 true 时能调，对应入口按它显示。切换商户后重算。
        merchantId:
          $ref: '#/components/schemas/MerchantId'
          readOnly: true
          description: 当前商户内部 id
        roleNames:
          type: array
          minItems: 1
          readOnly: true
          description: 当前登录者所持全部角色的展示名，一个或多个，服务端已解析，Owner 同样给出。与 `TeamMember.roleNames` 同源同口径。
          items:
            type: string
            minLength: 1
        privileges:
          type: array
          readOnly: true
          description: |
            **当前登录者的可见权限点集合**——扁平、已按其角色求值过滤，没权限的点不在里面。

            页面级与操作级共用本集合：集合里有某个点，就既能看见对应的页面或入口，也能调对应的接口。
          items:
            type: string
            description: 权限点标识 `模块:资源:动作`（如 `orders:refund:create`）。取值集合随部署配置而定、**不要 hardcode 成 enum**；未识别的点忽略即可（unknown-safe）。
            examples:
              - orders:refund:create
        visibleModules:
          allOf:
            - $ref: '#/components/schemas/VisibleModules'
          readOnly: true
          description: '**当前登录者自己的**模块可见性偏好（由 Owner 在成员管理里设定）。渲染导航时在 `privileges` 之上再按它过滤一道：本键缺席或为空 = 不收窄。⚠️ 仅此一道**界面**过滤——**不要据它拦请求或改写权限判断**，被收窄掉的模块其接口仍会正常受理。'
    LoginId:
      type: string
      minLength: 1
      maxLength: 254
      description: 登录名：用户名或邮箱。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
    WechatQrContent:
      type: string
      description: |
        微信二维码的**待编码内容**（短时、一次性、不透明串）——前端据此**自行渲染二维码图片**。 **不是图片 URL**，不要当 `<img src>` 用；内容对前端不透明，不要解析、拼接或复用。 各扫码入口（扫码登录与各类扫码绑定）共用同一形状与渲染方式。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    WechatQrChallenge:
      type: object
      additionalProperties: false
      description: |
        微信扫码类入口「发起」的统一响应：客户端用 `qrContent` 渲染二维码，再拿 `qrTicket` 轮询该入口的结果端点。

        各入口的轮询状态用同一套词，见 `WechatPollStatus`。
      required:
        - qrTicket
        - qrContent
        - expiresAt
      properties:
        qrTicket:
          type: string
          description: 本次扫码的短时票据，只用于轮询结果，可重复轮询；过期后重新发起得到新票据。与 `qrContent` 不可互推
        qrContent:
          $ref: '#/components/schemas/WechatQrContent'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            二维码有效期截止。**到期只表示这张二维码不能再扫**，**不必然**表示本次交互已有定论—— 到期后结果是否还可能变化，**各入口不同、由各入口的轮询状态说明，不由本字段推断**。
    WechatPollStatus:
      type: string
      description: |
        微信扫码轮询（扫码登录与各类扫码绑定）共用的状态词：`WAITING` 继续轮询、`EXPIRED` 终态需重新发起、各入口一个成功态（登录 `ESTABLISHED` / 绑定 `BOUND`）。各入口实际取值见各自 `enum`。

        未列出的取值按仍在进行中处理，继续轮询。

        状态查询恒返回 `200` + 状态：票据不存在 / 非法 / 已过期一律归为 `EXPIRED`，不用 `4xx` 表达；
        `4xx` 只表示调用方自身问题（未登录 / 无权限 / 请求过频 / 会话上下文已变 / 本浏览器已登录（登录轮询））。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    Language:
      type: string
      enum:
        - en
        - fr
        - zh
      description: 平台支持的语言。
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    VisibleModules:
      type: array
      description: |
        **模块可见性偏好**——该用户登录后界面呈现哪些模块。元素是**模块标识**，即权限点串 `模块:资源:动作` 的**第一段**，取值 = 侧边栏的五个分区 `dashboard` / `orders` / `products` / `account` / `settings`（登记在 `privileges.yaml`；`terminal` 不是侧边栏分区、不在内）。

        **在所选角色已覆盖的模块里挑**：可选项 = `listAssignableRoles` 里所选各角色 `modules` 的并集（换角色即换一组）。**只能减不能增**——本集合应是那组的子集；**不传或空数组 = 不收窄**（该角色覆盖的模块全部呈现）。

        ⚠️ **这不是权限、不是安全边界**。它只影响界面呈现哪些模块，**不改变任何权限判定、不拦截接口**——被收窄掉的模块，其接口照常受理。真正的边界是 `privileges`；本项在它之上做纯界面收窄，Owner 不适用（恒全部可见）。
      items:
        type: string
        minLength: 1
        examples:
          - orders
    MerchantRef:
      type: object
      additionalProperties: false
      required:
        - merchantId
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
    ChallengeId:
      type: string
      minLength: 1
      maxLength: 32
      description: 一次性验证挑战的标识。
    Phone:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      maxLength: 16
      description: 电话号码，**国际格式整串**（`+` + 国家码 + 正文号，如 `+16045550123`）——**一个字段装完，没有独立的区号字段**。 上界 16 = `+` 加最多 15 位数字（国际号码总长上限）；**服务端只校验这一条通用规则 + 区号在白名单内**， **不按区号分别限长**。前端按所选区号收窄输入位数属输入体验、不是契约约束。 渲染「区号下拉 + 号码框」两个控件时，用前端参考数据里的区号表做**最长前缀匹配**拆分本串。
    ResendCooldown:
      type: object
      description: 只回重发冷却秒数。
      required:
        - cooldownSeconds
      properties:
        cooldownSeconds:
          type: integer
          minimum: 0
          readOnly: true
          description: 重发冷却秒数（部署可配）；前端从收到响应起本地倒计时。
    EmailSubmission:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ContactStep:
      type: object
      description: Step 1 Contact。姓名、职务、电话是 Owner 的账号资料：注册时已填的只读，没填的在本步补填并写回账号资料。referredBy = Moneris（大小写不敏感）时 monerisMid + monerisManagerName 必填。
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          readOnly: true
          description: Owner 登录邮箱，只读、不提交。
        firstName:
          type: string
          maxLength: 128
        lastName:
          type: string
          maxLength: 128
        businessTitle:
          type: string
          maxLength: 64
          description: 职务文本。预设 Business Owner / Manager / Employee 可直选；选 Other 时提交用户填写的自定义文本，不提交字面 "Other"。
        phone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 联系人电话。区号候选取自前端参考数据，服务端校验区号在白名单内。
        referredBy:
          type: string
          description: 来源；注册链接带来则只读，否则可填；填 Moneris 触发条件字段。
        monerisMid:
          type: string
          description: 条件必填：referredBy = Moneris 时。
        monerisManagerName:
          type: string
          description: 条件必填：referredBy = Moneris 时。
    PaymentMethod:
      type: string
      minLength: 1
      maxLength: 64
      description: 支付方式目录标识（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，调用方从候选集取来原样回传，按未知值安全处理。
      examples:
        - wechat_instore
    ServicesStep:
      type: object
      description: Services 步（向导第 3 步）；至少选 1 个支付方式——该 ≥1 是提交完整性、不是本形状的约束：由服务端在 `mode=next` 校验，草稿态可为空。
      additionalProperties: false
      properties:
        selectedPaymentMethods:
          type: array
          description: 选中的支付方式目录码，须在 Business 步所选结算币种的候选内。数组整组置换，草稿态允许 `[]`。
          items:
            $ref: '#/components/schemas/PaymentMethod'
    OwnershipType:
      type: string
      enum:
        - SOLE_PROPRIETORSHIP
        - PARTNERSHIP
        - CORPORATION
        - NON_PROFIT
      description: 企业类型（入驻 Business 步与 Business Profile 共用），展示名由前端按码 i18n。
    OnlineServiceType:
      type: string
      enum:
        - WEBSITE
        - APP
        - MINI_PROGRAM
        - OTHER
      description: 线上服务类型（入驻 Business 步与 Service 页共用），展示名由前端按码 i18n。只有 `WEBSITE` 有网址。
    WebsiteUrl:
      type: string
      maxLength: 256
      pattern: ^https?://\S+$
      description: 商户经营网址（http / https）。
    BusinessStepRead:
      type: object
      description: '`BusinessStep` 的读侧形态：条件字段与备注**不适用 / 未填时不返回本键、不返** `null`。'
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        country:
          type: string
          description: ISO-3166 国家码（有效 Currency × Country 组合以后端配置为准）。
        legalBusinessName:
          type: string
          description: 身份字段（激活后不可改）。
        tradeName:
          type: string
        typeOfOwnership:
          allOf:
            - $ref: '#/components/schemas/OwnershipType'
          description: 身份字段（激活后不可改）。
        registrationNumber:
          type: string
        businessAddress:
          type: string
        city:
          type: string
        province:
          type: string
          description: 取自 `/config/countries` 里所选 country 那一组的 `provinces[].code`（ISO 3166-2 地区部分），展示名取同项的 `label`；改 country 后须重选。所选国家有省 / 州候选时必填，否则不传。
        postalCode:
          type: string
          description: 邮编，按所选国家的格式校验（前端参考数据预校，服务端重校）；所选国家有邮编制度时必填。
        timeZone:
          type: string
          description: 商户 IANA 时区（如 `America/Toronto`，不用 PT / ET 缩写）。候选随所选省 / 州、无省 / 州的国家按国家，取前端参考数据，服务端按同一映射校验。
        language:
          allOf:
            - $ref: '#/components/schemas/Language'
          description: 商户语言：发给商户的通知（邮件、微信、站内信）与月对账单 PDF 按它出；界面语言、收据与导出文件、发给某个人本人的邮件不看它，按用户自己的语言。
        businessPhone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 商户营业电话。区号候选取自前端参考数据，服务端校验区号在白名单内。
        industryCategory:
          type: string
          description: 行业大类码（`/config/industries` 的 `items[].code`，如 `A0`），不是展示名，展示名取同项的 `label`。身份字段（激活后不可改）。
        mcc:
          type: string
          description: 四位 MCC，级联 Industry（取自所选大类的 `mccOptions[].code`，展示名取同项的 `label`）；身份字段（激活后不可改）。
        typeOfOnlineService:
          $ref: '#/components/schemas/OnlineServiceType'
          description: 线上服务类型。本步选填、无默认值；Services 步选了任一线上支付方式时必填。
        websiteUrl:
          $ref: '#/components/schemas/WebsiteUrl'
          description: 经营网址（http / https）。typeOfOnlineService = WEBSITE 且选了线上支付方式时必填。
        note:
          type: string
    BankAccountScheme:
      type: string
      enum:
        - ca_local
        - us_local
      description: |
        结算银行账户制式：`ca_local` 加拿大 EFT / `us_local` 美国 ACH。

        封闭枚举：新增国家要在契约里加取值与对应字段、前端加表单组件、加出款适配器，不是纯配置。
    BankAccountIdentification:
      type: object
      additionalProperties: false
      description: |
        结算银行账户（按收款银行所在国的本地制式）。`type` 定制式、随制式带对应字段，不属该制式的字段不传（传了 → 400）：

        - `ca_local`（加拿大 EFT）—— 须带 `transitNumber` + `institutionNumber`；
        - `us_local`（美国 ACH）—— 须带 `routingNumber` + `accountType`。

        各制式的字段名保留本国叫法、位数为固定契约值、由服务端按 `type` 校验。允许哪些 `type` 按结算币种由所在面的配置接口给出（形状见 `CurrencyBankAccountTypes`）。

        账号明文 write-only、读侧走掩码 + 已填标志。本 schema 是**草稿宽松形**（账号可缺）；写面与读面各自用 allOf 收紧必填（写面须带 `accountNumber`，读面须带 `accountNumberMasked` + `accountNumberSet`）。
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/BankAccountScheme'
          description: 结算银行账户制式（`ca_local` 加拿大 EFT / `us_local` 美国 ACH）。**封闭 enum**——新增国家 = 契约加取值与对应字段 + 前端加表单组件 + 出款适配器，不是纯配置。
        transitNumber:
          type: string
          pattern: ^[0-9]{5}$
          description: Transit Number，5 位数字（分行）。只属 `type=ca_local`（**此时必填**）。
        institutionNumber:
          type: string
          pattern: ^[0-9]{3}$
          description: Institution Number，3 位数字（银行）。只属 `type=ca_local`（**此时必填**）。
        routingNumber:
          type: string
          pattern: ^[0-9]{9}$
          description: ABA Routing Number，9 位数字。只属 `type=us_local`（**此时必填**）。
        accountType:
          type: string
          enum:
            - checking
            - savings
          description: 账户类型（ACH 必需）。只属 `type=us_local`（**此时必填**）。
        accountNumber:
          type: string
          writeOnly: true
          pattern: ^[0-9]{4,17}$
          description: 银行账号（write-only 输入；read 走 accountNumberMasked，明文不回显）。位数随制式：`ca_local` 6-12 位、`us_local` 4-17 位——schema 只守两制式的并集，精确位数由服务端按 `type` 校验。
        accountNumberMasked:
          type: string
          readOnly: true
          description: 账号末 4 位掩码回显（如 `•••• 5678`）。
        accountNumberSet:
          type: boolean
          readOnly: true
          description: 是否已填 accountNumber（跨设备恢复 / 草稿完整性判定用）。
    SettlementCycleCode:
      type: string
      minLength: 1
      description: 结算周期档位的**稳定取值**（`SettlementCycleOption.code`）。**对客户端不透明**——从候选集里取来原样回传， 不要解析、拼接或据其分支；**不要传展示名**（那是展示文案、不是取值）。 服务端按**提交时点**的候选集校验：不在集内 → 拒绝（错误码见所在面，带 `details` 字段级明细），**不静默回落到候选集第一项**；前端应重取候选集让用户重选。 ⚠️ **你当前选中的取值不会凭空失效**——「打开编辑框却选不中自己现在的档位」「草稿存不回去」这类情形不会发生，无需为此写兜底。
    StoreId:
      type: string
      minLength: 1
      maxLength: 64
      description: 店铺编号，商户自设。
    RefundPin:
      type: string
      writeOnly: true
      pattern: ^[0-9]{6}$
      description: 商户级 Refund PIN——**6 位纯数字**。 **write-only**：仅作入参采集，**绝不出现在任何响应**（含错误响应）；读面走掩码 / 已填标志。
    SettlementStepRead:
      type: object
      description: '`SettlementStep` 的读侧形态：未指定门店时不返回 `storeId` 键。'
      additionalProperties: false
      properties:
        bankName:
          type: string
        bankAccount:
          allOf:
            - $ref: '#/components/schemas/BankAccountIdentification'
          description: 结算银行账户（制式按收款银行所在国、须 ∈ `/config/settlement` 的 `bankAccountTypes` 中 Business 步所选结算币种允许的 `types`；与营业地址 Country 无关）。草稿可先缺账号；`mode=next` 的完整性按 `accountNumberSet` 判。
        settlementCycle:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 结算周期——传**候选项的** `code`（取自 `/config/settlement` 的 `settlementCycleOptions`）。初始选中口径见该数组的说明，本字段不重述。
        settlementCycleDisplayName:
          type: string
          minLength: 1
          readOnly: true
          description: '`settlementCycle` 的展示名（如 `T+2 Business Days`）。**与 `settlementCycle` 同进退**： 有 `settlementCycle` 就一定有本键；草稿还没选结算周期时**两者都没有**。 **能读到候选集的消费方可忽略本键**、按 `code` 取自己的展示文案；拿不到候选集时直接展示本键即可。 ⚠️ 极少数情况下本键可能就等于 `code` 本身（服务端解析不出时的兜底），FE 直接展示、不必特判。'
        storeId:
          $ref: '#/components/schemas/StoreId'
          description: 可选；后续可改。
        refundPin:
          allOf:
            - $ref: '#/components/schemas/RefundPin'
          description: 入驻时初设的 Refund PIN。
        confirmRefundPin:
          allOf:
            - $ref: '#/components/schemas/RefundPin'
          description: 再次输入 Refund PIN；须与 `refundPin` 一致，不一致 → 400。
        refundPinSet:
          type: boolean
          readOnly: true
          description: 是否已设 Refund PIN（write-only PIN 不回显，前端据此判断 Step 4 PIN 是否完成；跨设备恢复）。
    WebUrl:
      type: string
      pattern: ^https?://\S+$
      description: http 或 https 绝对地址。平台产出的文件 / 图片 / 付款链接地址与渠道给出的跳转地址共用。
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
