      summary: 改 Primary Email — 提交新邮箱（校验格式 / 全平台唯一 / 不同 + 发新邮箱 OTP）
      description: |
        改 Owner Primary Email 流程里的提交新邮箱步：校验格式 / 全平台唯一 / 与当前不同 → 向**新邮箱**发 OTP。 **三个错误分开处置**：`968001` = **新邮箱被别人占了**，换一个； `968010` = **该 Owner 已有一笔改邮箱在途**，换任何邮箱都拒，须先完成或等其过期（无取消入口）； `208001` = 页面预期商户 ≠ 会话当前商户，按公约统一 re-sync 后重发。
      parameters:
