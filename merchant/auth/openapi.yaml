      operationId: resendOwnerPrimaryEmailChangeCode
      summary: 改 Primary Email — 重发当前这一步的验证码
      description: |
        重发**该变更请求当前停在哪一步**的那段码：待身份校验 → 重发旧邮箱码；已过身份校验、待新邮箱确认 → 重发新邮箱码。前端只需一个 Resend 按钮。

        **身份因子是 TOTP 时不存在重发**——那一步的码由 Authenticator 生成、系统从未发出，`initiate` 返回的 `identityVerification = MFA_TOTP` 即是判据，界面在该步就不该给出重发入口。

        冷却未到 → `429` · `208013`；变更请求已完成 / 已过期 / 被同目标的新挑战顶掉 → `410` · `206006`（须重新发起，不是重发）。本步同样须来自同一商户 / 同一会话 / 同一发起者。

        **不要用重打 `submitOwnerNewPrimaryEmail` 来达到重发** —— 那会撞 `968010`「已有一笔改邮箱在途」。
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: primary-email change-request 实例 id
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已重发
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - otpDelivery
                properties:
                  otpDelivery:
                    $ref: '#/components/schemas/OtpDelivery'
              example:
                otpDelivery:
                  deliveredTo: j***@example.com
                  cooldownSeconds: 60
                  expiresAt: '2026-09-02T10:04:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206005
        - 206006
        - 208001
        - 208013
  /owner-contact/primary-email/change-requests/{challengeId}/identity-verification:
    post:
      tags:
        - owner-contact
