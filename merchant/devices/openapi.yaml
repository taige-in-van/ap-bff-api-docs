openapi: 3.1.0
info:
  title: 商户后台 设备 — 前端契约面
  version: 2.0.0
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的设备契约：设备列表与状态计数、绑定（预登记，设备首次登录后激活）、停用 / 启用、解绑，以及每台设备的日志（三类，可导出）。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 绑定设备挂 `Idempotency-Key`，同一次提交的网络重试用同键返回首次结果；天然幂等的纯 PUT / DELETE 不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 当前商户以会话为准、不看请求体；当前商户不可访问时返回 `409`·`208022`。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: devices
    x-displayName: 设备
    description: 设备：列表与状态计数、绑定、停用 / 启用、解绑，以及每台设备的日志。
paths:
  /devices:
    get:
      tags:
        - devices
      operationId: listDevices
      x-required-privilege: products:device:view
      summary: 设备列表
      description: |
        商户在册的设备（已解绑的不在内），分页。顶部状态 chip 的各项与计数另取 `getDeviceCounts`；Filters 面板的门店候选取 `listDeviceStores`，来源与状态是固定枚举。
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: source
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DeviceSource'
        - name: status
          in: query
          required: false
          description: 按状态过滤；顶部 chip 与 Filters 面板用的是同一个参数。
          schema:
            $ref: '#/components/schemas/DeviceStatus'
        - name: store
          in: query
          required: false
          description: 按门店过滤，整串相等；候选取 `listDeviceStores`。
          schema:
            type: string
            maxLength: 128
        - name: keyword
          in: query
          required: false
          description: 设备名、设备 ID、序列号、型号、门店模糊匹配。
          schema:
            type: string
            maxLength: 128
        - name: from
          in: query
          required: false
          description: 创建日期范围起（含当日）；与 `to` 可只传一端。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: false
          description: 创建日期范围止（含当日）。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: sortField
          in: query
          required: false
          description: 排序字段。不传 = 不排序。按 `lastActiveAt` / `activatedAt` 排序时没有值的设备恒在末尾，升降序都一样。
          schema:
            type: string
            enum:
              - lastActiveAt
              - createdAt
              - activatedAt
              - model
              - serialNumber
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: 设备列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListPage'
              examples:
                mixed:
                  summary: 待激活 / 在线 / 离线 / 已停用四种行
                  value:
                    total: 4
                    data:
                      - deviceId: dev_1000024_0001
                        model: Sunmi V2 Pro
                        source: platform
                        serialNumber: SN-2026-0001
                        storeName: downtown-store
                        status: PENDING_ACTIVATION
                        createdAt: '2026-08-10T09:00:00Z'
                      - deviceId: dev_1000024_0002
                        model: Clover Flex
                        source: clover
                        serialNumber: C032UQ52640073
                        storeName: downtown-store
                        deviceName: Front counter
                        operatorEmail: cashier01@merchant.com
                        firmwareVersion: Android 11 / 1.4.2
                        appVersion: 3.8.0
                        status: ONLINE
                        lastActiveAt: '2026-08-17T09:52:00Z'
                        createdAt: '2026-06-02T11:20:00Z'
                      - deviceId: dev_1000024_0003
                        model: 收银 App（softPOS）
                        source: unknown
                        serialNumber: APP-9F3C21A8
                        operatorEmail: cashier02@merchant.com
                        appVersion: 2.1.4
                        status: OFFLINE
                        lastActiveAt: '2026-08-16T20:11:00Z'
                        createdAt: '2026-07-01T08:00:00Z'
                      - deviceId: dev_1000024_0004
                        model: PAX A920
                        source: moneris
                        serialNumber: SN-2025-8813
                        storeName: uptown-store
                        status: DISABLED
                        lastActiveAt: '2026-05-30T18:02:00Z'
                        createdAt: '2026-03-14T13:45:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - devices
      operationId: createDevice
      x-required-privilege: products:device:manage
      summary: 绑定新设备
      description: |
        预登记一台硬件 POS：来源、型号、序列号、门店四项。建成后状态是 `PENDING_ACTIVATION`，不签发凭据、没有激活码；这台设备首次登录时按序列号对上本条记录即激活。

        本商户名下已有同一序列号的在册设备 → `409`·208021。判重只在本商户名下做：别的商户登记过同一串不在这里拦，等设备真正登录时才判。

        幂等：带 `Idempotency-Key`，重放同键返首次结果、payload 冲突 → `409`·208005。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
            example:
              source: platform
              model: Sunmi V2 Pro
              serialNumber: SN-2026-0001
              storeName: downtown-store
      responses:
        '201':
          description: 已预登记
          content:
            application/json:
              schema:
                type: object
                required:
                  - deviceId
                properties:
                  deviceId:
                    type: string
                    readOnly: true
              example:
                deviceId: dev_1000024_0001
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208005
        - 208021
  /devices/counts:
    get:
      tags:
        - devices
      operationId: getDeviceCounts
      x-required-privilege: products:device:view
      summary: 设备状态快捷筛选的各项与计数
      description: |
        形状与用法见 `QuickFilterCounts`。`value` 原样回传给 `listDevices` 的 `status`；本端点不收 `status`，其余筛选与列表传同一组。
      parameters:
        - name: source
          in: query
          required: false
          description: 同 `listDevices`。
          schema:
            $ref: '#/components/schemas/DeviceSource'
        - name: store
          in: query
          required: false
          description: 同 `listDevices`。
          schema:
            type: string
            maxLength: 128
        - name: keyword
          in: query
          required: false
          description: 同 `listDevices`。
          schema:
            type: string
            maxLength: 128
        - name: from
          in: query
          required: false
          description: 同 `listDevices`。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: false
          description: 同 `listDevices`。
          schema:
            $ref: '#/components/schemas/LocalDate'
      responses:
        '200':
          description: 各项与计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickFilterCounts'
              example:
                items:
                  - value: PENDING_ACTIVATION
                    label: Pending activation
                    count: 1
                  - value: ONLINE
                    label: Online
                    count: 3
                  - value: OFFLINE
                    label: Offline
                    count: 2
                  - value: DISABLED
                    label: Disabled
                    count: 0
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /devices/stores:
    get:
      tags:
        - devices
      operationId: listDeviceStores
      x-required-privilege: products:device:view
      summary: 门店筛选的候选
      description: |
        商户在册设备上出现过的门店名，去重、按名称排序。门店是绑定时自填的文本，只有服务端算得全；打开 Filters 面板时取一次。
      responses:
        '200':
          description: 门店名
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    readOnly: true
                    description: 没有一台设备填过门店时为空数组。
                    items:
                      type: string
                      minLength: 1
                      maxLength: 128
              example:
                items:
                  - downtown-store
                  - uptown-store
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /devices/{deviceId}:
    get:
      tags:
        - devices
      operationId: getDevice
      x-required-privilege: products:device:view
      summary: 单台设备
      description: 字段同列表的一行；设备日志页的页头用。已解绑的 `404`。
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 设备
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                deviceId: dev_1000024_0002
                model: Clover Flex
                source: clover
                serialNumber: C032UQ52640073
                storeName: downtown-store
                operatorEmail: cashier01@merchant.com
                firmwareVersion: Android 11 / 1.4.2
                appVersion: 3.8.0
                status: ONLINE
                lastActiveAt: '2026-08-17T09:52:00Z'
                createdAt: '2026-06-02T11:20:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - devices
      operationId: updateDevice
      x-required-privilege: products:device:manage
      summary: 停用或启用设备
      description: |
        `enabled: false` 停用，设备立即不能收款；`enabled: true` 恢复。目标态与当前一致时照样 `204`。

        启用后 `status` 是 `ONLINE` 还是 `OFFLINE`，看有没有操作员在这台设备上登录使用；平台不主动探测。

        还没激活的设备不能停用或启用 → `409`·208003。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
            example:
              enabled: false
      responses:
        '204':
          description: 已更新
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208003
    delete:
      tags:
        - devices
      operationId: deleteDevice
      x-required-privilege: products:device:manage
      summary: 解绑设备
      description: |
        任何在册状态都可以解绑（待激活的就是取消激活）。解绑后设备从列表消失、凭据作废，要再用得重新绑定；已成交的订单与结算不受影响。已解绑的再解绑 `404`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: 已解绑
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /devices/{deviceId}/logs:
    get:
      tags:
        - devices
      operationId: listDeviceLogs
      x-required-privilege: products:device:view
      summary: 设备日志
      description: |
        某台设备的日志，按时间倒序分页。类型 chip 的各项与计数另取 `getDeviceLogCounts`；导出走 `exportDeviceLogs`。设备已解绑 `404`。
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DeviceLogType'
        - name: keyword
          in: query
          required: false
          description: 事件、备注、操作人模糊匹配。
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: 日志列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLogListPage'
              example:
                total: 3
                data:
                  - type: transaction
                    severity: info
                    event: Payment captured
                    notes: Order P100240021 · CA$48.50 · WeChat Pay
                    actor: cashier01@merchant.com
                    timestamp: '2026-08-17T09:52:00Z'
                  - type: connection
                    severity: warning
                    event: Device offline
                    timestamp: '2026-08-17T08:30:00Z'
                  - type: auth
                    severity: info
                    event: Operator signed in
                    actor: cashier01@merchant.com
                    timestamp: '2026-08-17T08:29:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /devices/{deviceId}/logs/counts:
    get:
      tags:
        - devices
      operationId: getDeviceLogCounts
      x-required-privilege: products:device:view
      summary: 设备日志类型快捷筛选的各项与计数
      description: |
        形状与用法见 `QuickFilterCounts`。`value` 原样回传给 `listDeviceLogs` 的 `type`；本端点不收 `type`，`keyword` 与列表传同一个。
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: keyword
          in: query
          required: false
          description: 同 `listDeviceLogs`。
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          description: 各项与计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickFilterCounts'
              example:
                items:
                  - value: transaction
                    label: Transaction
                    count: 12
                  - value: connection
                    label: Connection
                    count: 4
                  - value: auth
                    label: Auth
                    count: 2
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /devices/{deviceId}/logs/export:
    get:
      tags:
        - devices
      operationId: exportDeviceLogs
      x-required-privilege: products:device:view
      summary: 导出设备日志（xlsx）
      description: |
        按当前类型与关键词命中的全部日志导出 Excel，不只是当前页；同步返回文件流。表头语言按 `Accept-Language`，实际用的语言经 `Content-Language` 回。设备已解绑 `404`。
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          required: false
          description: 同 `listDeviceLogs`。
          schema:
            $ref: '#/components/schemas/DeviceLogType'
        - name: keyword
          in: query
          required: false
          description: 同 `listDeviceLogs`。
          schema:
            type: string
            maxLength: 128
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在会话没有当前商户时返回 `409`·`208022`（见公共约定「当前商户」）。
  schemas:
    DeviceSource:
      type: string
      description: 设备来源（机器谁供的）：`platform` 平台自有、`moneris`、`clover`；`unknown` 是没经绑定、设备自己登录入册的，绑定时不能选。
      enum:
        - platform
        - moneris
        - clover
        - unknown
    DeviceStatus:
      type: string
      description: 设备状态：`PENDING_ACTIVATION` 已绑定、设备还没登录过；`ONLINE` / `OFFLINE` 已激活，按有没有操作员在设备上使用区分；`DISABLED` 已停用。已解绑的不出现在任何响应里。
      enum:
        - PENDING_ACTIVATION
        - ONLINE
        - OFFLINE
        - DISABLED
    Device:
      type: object
      required:
        - deviceId
        - model
        - source
        - serialNumber
        - status
        - createdAt
      properties:
        deviceId:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
          description: 型号。绑定时填的，或设备自报的。
        source:
          $ref: '#/components/schemas/DeviceSource'
        serialNumber:
          type: string
          readOnly: true
          description: 硬件 POS 是厂商序列号；收银 App 没有序列号，这里是平台按安装标识给它的终端标识。两类都有值。
        storeName:
          type: string
          readOnly: true
          description: 门店；设备自己登录入册的没有，不返回本键。
        deviceName:
          type: string
          readOnly: true
          description: 商户给这台设备起的名字；没起名时不返回本键。
        operatorEmail:
          type: string
          readOnly: true
          description: 最近一次登录这台设备的操作员邮箱；从没登录过的不返回本键。
        firmwareVersion:
          type: string
          readOnly: true
          description: 固件或 OS 版本，设备登录时上报；没报过的不返回本键。
        appVersion:
          type: string
          readOnly: true
          description: 设备端 App 版本，上报口径同 `firmwareVersion`。
        status:
          $ref: '#/components/schemas/DeviceStatus'
        lastActiveAt:
          readOnly: true
          description: 最近活跃时间；从未活跃的不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    DeviceListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    DeviceCreateRequest:
      type: object
      required:
        - source
        - model
        - serialNumber
        - storeName
      properties:
        source:
          type: string
          description: 来源；`unknown` 不可选。
          enum:
            - platform
            - moneris
            - clover
        model:
          type: string
          minLength: 1
          maxLength: 64
          description: 型号，自由文本，不做取值校验。
        serialNumber:
          type: string
          minLength: 1
          maxLength: 64
          description: 从设备上抄的厂商序列号。设备首次登录时据它认领这条记录；本商户名下已有同一串 → `409`·208021。
        storeName:
          type: string
          minLength: 1
          maxLength: 128
          description: 门店，自填文本。
    DeviceLogType:
      type: string
      description: 日志类型：`transaction` 收款与退款、`connection` 上线与离线、`auth` 操作员登录登出与激活。
      enum:
        - transaction
        - connection
        - auth
    DeviceLogItem:
      type: object
      required:
        - type
        - severity
        - event
        - timestamp
      properties:
        type:
          $ref: '#/components/schemas/DeviceLogType'
        severity:
          type: string
          enum:
            - info
            - warning
            - error
          description: 级别，与 `type` 正交；类型徽标按它着色。
        event:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
          description: 事件说明；没有时不返回本键。
        actor:
          type: string
          readOnly: true
          description: 触发事件的操作员邮箱；系统产生的事件不返回本键。
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    DeviceLogListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceLogItem'
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            paymentId:
              type: string
              description: 失败发生时**订单已建立**的场景下带出的平台侧支付单标识（如被扫同步扣款在通道应答阶段失败）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            merchantMandateNo:
              type: string
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    QuickFilterItem:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
          description: 该项对应的筛选值 —— **对客户端不透明**:选中本项就把它**原样**回传给对应列表端点的那个筛选参数, 不要解析、拼接或据其分支。
          examples:
            - PAID
        label:
          type: string
          description: 后端给的默认展示名。**客户端有自己的多语言资源时按 `value` 取用、本字段作兜底**; 没有资源(取值由配置或数据决定,如角色名、年份)时直接展示本字段。
          examples:
            - Paid
        count:
          type: integer
          minimum: 0
          description: 该项当前的命中数(口径见 `QuickFilterCounts` 说明)。
    QuickFilterCounts:
      type: object
      additionalProperties: false
      description: |
        **列表页顶部快捷筛选的各项与计数**。快捷筛选就是该列表的一个筛选维度,没有特殊机制:选中某项 = 给列表带上该维度的筛选参数(值 = 该项 `value`),**选 All = 不带这个参数**。

        **照着 `items` 渲染即可** —— 项集、顺序、展示名、数字全部由服务端给出,客户端不枚举取值、不 hardcode 项集;某项当期为 `0` 时**仍会返回**(那一格不该因为没数据就消失)。

        **`All` 不在 `items` 里,由客户端自己补一项**,数字 = 其余各项之和 —— 服务端保证 `items` 覆盖该列表在不带本维度筛选时的全部命中(每行恰好落进一项),故这个和恒等于此时列表的 `total`。

        例外:某些集合一行可落进多项(如成员的角色),这类接口另给总数,All 取那个总数、不用各项相加。

        **本端点不接受被计维度自身的参数**;其余筛选条件与对应列表端点一致、传什么算什么。因此:点某项后列表 `total` = 该项 `count`;点 All 后列表 `total` = 各项 `count` 之和。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuickFilterItem'
  parameters:
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: \S
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: \S
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 页面当前的语言（BCP-47，如 `zh-Hans` / `fr-CA`）。服务端生成文件（xlsx / PDF）时按它取最接近的语言（如 `fr-CA` → `fr`），没有匹配的依次回退到账号的界面语言、商户语言。实际用的语言经 `Content-Language` 回。
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    XlsxFile:
      description: Excel 文件（xlsx）
      headers:
        Content-Disposition:
          required: true
          description: '`attachment; filename=...xlsx`（下载；filename 编码 RFC 5987）。'
          schema:
            type: string
        Content-Language:
          required: true
          description: 文件实际用的语言（BCP-47）。
          schema:
            type: string
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
