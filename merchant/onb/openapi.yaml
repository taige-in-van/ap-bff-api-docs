                    storeId: STORE-001
                  documents:
                    docStoreInside:
                      fileId: c58f2d901b4e47a6bd39e0f7a812c46d
                      fileName: store-inside.jpg
                      fileSize: 1572864
                      uploadedAt: '2026-06-22T14:05:00Z'
