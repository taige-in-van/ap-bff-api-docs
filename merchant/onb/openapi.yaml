openapi: 3.1.0
info:
  title: 商户后台 商户入驻 — 前端契约面
  version: 0.15.3
  contact:
    name: 商户后台 BFF
  description: |
    商户后台前端消费的 5 步入驻向导 / 草稿持久化 / Documents 上传 / 提交审核 / 审核状态分流 契约。

    入驻申请单（Application：Step 1-5 字段 + Documents 引用 + missingFields + 状态机
    DRAFT/UNDER_REVIEW/MORE_INFO_REQUIRED/APPROVED/REJECTED/WITHDRAWN）在注册邮箱激活成功时已备为 DRAFT，本面从 DRAFT 加载续走、不重建。

    Refund PIN（Step 4 采集）为 write-only，绝不在任何响应回显。
    字段类型以本契约为准。

    **幂等/CSRF 口径：**

    ① 草稿分步保存（PUT，`mode=next|draft` 两语义）/ Submit（重放命中目标态返一致）天然幂等，故不挂 Idempotency-Key；
    **Documents 上传非幂等**（每次产生新 fileId；未绑定的 fileId **不可用**，绑定在 step 保存时按 docKey 覆盖）。

    ② cookieAuth 的非安全方法一律挂 X-CSRF-Token（double-submit）。

    ③ Add Merchant 创建端点不在本面（由商户实体能力承载）；创建后前端切当前商户，本面经 GET /onboarding/application 加载已建草稿续走向导。

    ④ 向导渲染所需的**全部**动态配置（各步的候选集 / 费率 / 有效组合 / 前端拦截参数）见 GET /onboarding/config —— 键清单以该接口自身说明为准。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（经边缘网关；浏览器 ↔ BFF 用会话 cookie）
security:
  - cookieAuth: []
tags:
  - name: onboarding-wizard
    description: 5 步入驻向导：加载当前入驻申请草稿 + 字段 + missingFields + 状态（GET）；分步保存草稿 + 返回 validationErrors（PUT）；Review 页 Submit 提交审核（POST，DRAFT/MORE_INFO_REQUIRED → UNDER_REVIEW）。
  - name: documents
    description: Documents 上传：Step 5 的 5 必传 + 2 可选 Other 文档。**文件由浏览器直传对象存储、不经本面**——本面只签发直传目标（upload-targets）；提交成功后前端暂存 fileId，**绑定到申请单发生在 step 保存**（PUT steps/documents）。
  - name: onboarding-status
    description: 审核状态 + 登录后页面分流数据 + 拒绝结果（粗分类；申诉入口由前端统一客服配置提供）；按当前选中商户的申请状态返回。只读。
  - name: onboarding-config
    description: 向导动态配置：各步的候选集 / 费率 / 有效组合 / 前端拦截参数，一处给全（键清单见该接口说明）。只读、驱动前端渲染。
paths:
  /onboarding/application:
    get:
      tags:
        - onboarding-wizard
      operationId: getOnboardingApplication
      summary: 加载当前 Application 草稿（状态 + 各 step 字段 + missingFields + 绑定文档）
      description: |
        加载当前选中商户的入驻申请草稿（注册邮箱激活时已备为 DRAFT，或 Add Merchant 时已备新 DRAFT）。
        本接口只加载、不创建：Step 1 Contact 预填注册时已有字段（已预填字段只读）+ Merchant ID。
        merchant 上下文从会话当前选中商户取、不信请求体；多份申请按当前选中商户独立返回。

        **文档预览保证**：`documents` 里返回的每份文档**必带** `previewUrl`（短时效内联展示地址），跨会话续填与补料回流时据此回显缩略图；
        本次会话刚直传、尚未随 step 保存的文件不在本结果里，其预览由前端用本地文件出。

        missingFields 仅在 MORE_INFO_REQUIRED 时非空（由审核动作写入；只承载字段 key + 所属 step，不携带审核原因）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 当前 Application 草稿（含状态 / 各 step 字段 / missingFields / 已绑定文档引用）
