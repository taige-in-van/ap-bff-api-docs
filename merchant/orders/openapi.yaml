openapi: 3.1.0
info:
  title: 商户后台 订单与退款 — 前端契约面
  version: 2.0.0
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的订单与退款契约：支付订单与退款的列表、详情、收据 PDF、导出，发起退款、撤销审核中的退款、预授权完成，以及按日期范围的收款统计。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **金额**：最小币种单位整数加币种。订单列表行、订单汇总与统计是结算币种；发起退款与退款金额是订单的标价币种。各字段是哪个币种见字段说明。

    **幂等 / CSRF 口径**：

    - 三个命令（发起退款、撤销退款、预授权完成）必带 `Idempotency-Key`，缺了 → `400`。同键同请求体重发返回首次结果，网络重试用同一个键；改了请求体要换新键，沿用旧键 → `409`·`208005`。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 当前商户以会话为准、不看请求体；当前商户不可访问时返回 `409`·`208022`。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: payments
    x-displayName: 支付订单
    description: 支付订单：列表、汇总与状态计数、导出、详情、收据 PDF，以及发起退款、预授权完成。
  - name: refunds
    x-displayName: 退款
    description: 退款：列表与状态计数、导出、详情、收据 PDF，以及撤销审核中的退款。发起退款在 payments 组。
  - name: statistics
    x-displayName: 收款统计
    description: 按日期范围的收款统计：汇总与支付方式占比、本月 / 上月逐日趋势。收款按订单成交的日期计，退款按退款受理的日期计，两者各算各的日子，不按原订单配对；与 `getPaymentSummary` 不是同一个口径（那边按所筛订单算），两边不要互相核对。
paths:
  /orders/payments:
    get:
      tags:
        - payments
      operationId: listPayments
      x-required-privilege: orders:payment:view
      summary: 支付订单列表
      description: |
        当前商户的支付订单，分页。日期范围必填，服务端不设默认。已成交的行金额是结算币种的成交金额，没成交的是标价金额。

        列表含 `FAILED` 与 `REJECTED` 两种没收到钱的行；汇总卡不算它们，见 `getPaymentSummary`。状态 chip 的各项与计数另取 `getPaymentCounts`。

        登录成员不是 Owner、也不持 Admin 或店长角色，且运营给商户设了可查天数 N 时，起始日早于「当前营业日往前 N 天」的按这一天起算；没设时不限。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/PaymentMethodFamilyFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/PaymentKeyword'
        - $ref: '#/components/parameters/PaymentSortField'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 支付订单分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
              examples:
                page:
                  summary: 三行：店铺码已收款；CNY 标价的账单已部分退款（金额是结算币种 CAD，可退余额是标价币种 CNY）；被平台拒掉的
                  value:
                    total: 3
                    data:
                      - orderId: P100240001
                        paymentMethodFamily: wechat
                        source: store_qr
                        amount:
                          amount: '10500'
                          currency: CAD
                        status: PAID
                        createdAt: '2026-07-19T03:12:00Z'
                        refundable: true
                        remainingRefundable:
                          amount: '10500'
                          currency: CAD
                      - orderId: P100240002
                        paymentMethodFamily: alipay
                        source: invoice
                        amount:
                          amount: '3836'
                          currency: CAD
                        status: PARTIALLY_REFUNDED
                        createdAt: '2026-07-19T02:40:00Z'
                        note: 门店订单
                        refundable: true
                        remainingRefundable:
                          amount: '15000'
                          currency: CNY
                      - orderId: P100240003
                        source: product_link
                        amount:
                          amount: '9900'
                          currency: CAD
                        status: REJECTED
                        createdAt: '2026-07-19T01:05:00Z'
                        refundable: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /orders/payments/summary:
    get:
      tags:
        - payments
      operationId: getPaymentSummary
      x-required-privilege: orders:payment:view
      summary: Payments 页头汇总卡
      description: |
        与 `listPayments` 用同一组筛选参数、基于同一批订单的合计，金额是商户结算币种（每笔按实际结算金额相加）。

        只算收到钱的四种状态：`PAID` / `PARTIALLY_REFUNDED` / `REFUNDED` / `PREAUTH_HOLDING`。列表还会列出 `FAILED` / `REJECTED`，所以 `transactions` 可能小于列表行数。`grossSales` 就是这四种状态的行金额之和。

        `refundAmount` 是这批订单至今已退的金额（随订单计入，不按退款发生日），`netSales` = `grossSales` − `refundAmount`。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/PaymentMethodFamilyFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/PaymentKeyword'
      responses:
        '200':
          description: 汇总卡
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSummary'
              examples:
                summary:
                  summary: 结算币种 CAD 的四项
                  value:
                    transactions: 42
                    grossSales:
                      amount: '700000'
                      currency: CAD
                    refundAmount:
                      amount: '12000'
                      currency: CAD
                    netSales:
                      amount: '688000'
                      currency: CAD
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /orders/payments/recent:
    get:
      tags:
        - payments
      operationId: listRecentPayments
      x-required-privilege: dashboard:overview:view
      summary: 最近收到钱的几笔订单
      description: |
        当前商户最近的支付订单，按创建时间倒序，不限日期。只含收到钱的订单（与 `getPaymentSummary` 计入汇总的范围相同），`FAILED` 与 `REJECTED` 不返回。

        行与 `listPayments` 的行相同。不分页，只返回 `items`；一笔都没有时为空数组。
      parameters:
        - name: limit
          in: query
          required: false
          description: 要几笔，不传为 5。
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 5
      responses:
        '200':
          description: 最近订单摘要
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Payment'
              example:
                items:
                  - orderId: P100240001
                    paymentMethodFamily: wechat
                    source: store_qr
                    amount:
                      amount: '10500'
                      currency: CAD
                    status: PAID
                    createdAt: '2026-07-19T03:12:00Z'
                    refundable: true
                    remainingRefundable:
                      amount: '10500'
                      currency: CAD
                  - orderId: P100240000
                    paymentMethodFamily: alipay
                    source: product_link
                    amount:
                      amount: '9900'
                      currency: CAD
                    status: REFUNDED
                    createdAt: '2026-07-19T01:05:00Z'
                    refundable: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /orders/payments/counts:
    get:
      tags:
        - payments
      operationId: getPaymentCounts
      x-required-privilege: orders:payment:view
      summary: 订单状态快捷筛选的各项与计数
      description: |
        形状与用法见 `QuickFilterCounts`。`value` 原样回传给 `listPayments` 的 `status`；本端点不收 `status`，其余筛选与列表传同一组。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/PaymentMethodFamilyFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - $ref: '#/components/parameters/PaymentKeyword'
      responses:
        '200':
          description: 各项与计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickFilterCounts'
              example:
                items:
                  - value: PAID
                    label: Paid
                    count: 1
                  - value: PARTIALLY_REFUNDED
                    label: Partially refunded
                    count: 1
                  - value: REFUNDED
                    label: Refunded
                    count: 0
                  - value: FAILED
                    label: Failed
                    count: 0
                  - value: REJECTED
                    label: Rejected
                    count: 1
                  - value: PREAUTH_HOLDING
                    label: Pre-auth holding
                    count: 0
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /orders/payments/export:
    get:
      tags:
        - payments
      operationId: exportPayments
      x-required-privilege: orders:payment:view
      summary: 导出支付订单（xlsx）
      description: |
        按当前筛选、搜索与排序命中的全部订单导出 Excel，不只是当前页；同步返回文件流，不设行数上限。表头与枚举文案按 `Accept-Language`，实际用的语言经 `Content-Language` 回。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/PaymentMethodFamilyFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/PaymentKeyword'
        - $ref: '#/components/parameters/PaymentSortField'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/AcceptLanguage'
          description: |
            页面当前的语言（BCP-47 语言标记，可带权重列表，如 `zh-CN,zh;q=0.9,en;q=0.8`）。服务端在本接口支持的语言里取最接近的一种（如 `fr-CA` → `fr`）；按它渲染什么、取不中时退到哪种语言，见所在面的说明。

            响应带 `Content-Language` 的接口，实际用的语言以该头为准。

            取不中时依次退到账号界面语言、商户语言；实际用的语言经 `Content-Language` 回。
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /orders/payments/{orderId}:
    get:
      tags:
        - payments
      operationId: getPayment
      x-required-privilege: orders:payment:view
      summary: 支付订单详情
      description: |
        单张订单：列表行的字段，加已退金额、产品形态与关联单据号、客户与付款账户、关联退款、回调信息、换汇信息。不存在或不属于当前商户 `404`。

        关联退款里 `type = system_auto` 的是平台自动退回的多付款项（重复支付、关单后才到的成功支付），没动商户的账，不计入 `refundedAmount`。

        `status = REJECTED` 的订单从未发生支付，没有支付方式、通道交易号与付款账户。
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
              examples:
                invoicePartiallyRefunded:
                  summary: 账单订单，CNY 标价、CAD 结算、已部分退款
                  value:
                    orderId: P100240002
                    paymentMethodFamily: alipay
                    source: invoice
                    amount:
                      amount: '3836'
                      currency: CAD
                    status: PARTIALLY_REFUNDED
                    createdAt: '2026-07-19T02:40:00Z'
                    note: 门店订单
                    refundable: true
                    remainingRefundable:
                      amount: '15000'
                      currency: CNY
                    pricedAmount:
                      amount: '20000'
                      currency: CNY
                    refundedAmount:
                      amount: '5000'
                      currency: CNY
                    refundedSettleAmount:
                      amount: '959'
                      currency: CAD
                    confirmedAt: '2026-07-19T02:40:05Z'
                    product: invoice
                    invoiceNo: 10024
                    customerName: Jane Doe
                    customerEmail: jane@example.com
                    payerAccountMasked: •••• 6789
                    merchantOrderNo: SHOP-INV-8842
                    channelTxnNo: '2026071922001412345678901234'
                    refunds:
                      - refundId: R100240002-1
                        type: merchant
                        status: SUCCESS
                        amount:
                          amount: '5000'
                          currency: CNY
                        createdAt: '2026-07-19T02:50:00Z'
                    customerIp: 203.0.113.7
                    callback:
                      url: https://merchant.example/cb
                      httpStatus: 200
                      sentAt: '2026-07-19T02:40:06Z'
                      latencyMs: 120
                    fx:
                      rate: '5.2137'
                      cnyAmount:
                        amount: '20000'
                        currency: CNY
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /orders/payments/{orderId}/receipt:
    get:
      tags:
        - payments
      operationId: getPaymentReceipt
      x-required-privilege: orders:payment:view
      summary: 支付收据（PDF）
      description: |
        已收款订单（`PAID` / `PARTIALLY_REFUNDED` / `REFUNDED`）的收据 PDF。内容：商户简称与地址、订单号、商户订单号、支付方式、时间（付款成功时刻）、金额明细（订单金额、小费、顾客承担手续费、Total 即顾客实付总额）；不含退款行、净额与状态。文案按 `Accept-Language`，实际用的语言经 `Content-Language` 回。

        其余状态没有收据 → `404`。
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/AcceptLanguage'
          description: |
            页面当前的语言（BCP-47 语言标记，可带权重列表，如 `zh-CN,zh;q=0.9,en;q=0.8`）。服务端在本接口支持的语言里取最接近的一种（如 `fr-CA` → `fr`）；按它渲染什么、取不中时退到哪种语言，见所在面的说明。

            响应带 `Content-Language` 的接口，实际用的语言以该头为准。

            取不中时依次退到账号界面语言、商户语言；实际用的语言经 `Content-Language` 回。
      responses:
        '200':
          $ref: '#/components/responses/PdfFile'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /orders/payments/{orderId}/refunds:
    post:
      tags:
        - payments
      operationId: createRefund
      x-required-privilege: orders:refund:create
      summary: 发起退款（全额或部分，凭 Refund PIN）
      description: |
        对 `refundable` 为真的订单发起退款。金额的币种是订单标价币种，须大于 0 且不超过 `remainingRefundable`。上一笔退款没结束时可以再发起，各占各的额度。

        能不能退、还能退多少，以受理时重新校验的结果为准。超过可退余额、订单已不可退、商户退款能力关闭、商品已核销或作废、该订单上一笔退款还在等通道受理结论 → `400`·204008，不建退款单。短时间内对同一订单重复提交退款（第二次用的是新键）→ `409`·208003，不建第二笔，重拉订单最新状态再决定是否重提。

        Refund PIN：

        - 不对 → `403`·206003；
        - 连续输错被锁 → `423`·206004。

        `201` 只表示退款单已建，结果看 `status`：

        - `REVIEWING`：等平台审核；
        - `CHANNEL_PROCESSING`：已送通道、结果待定（含通道暂未应答）；
        - `SUCCESS`：通道当场退成；
        - `FAILED`：没有退成，`failureReason` 为 `INSUFFICIENT_FUNDS`（账户资金不足，没有送到通道）或 `CHANNEL_REJECTED`（通道当场拒绝）。占用的可退额度已放回，可以重新发起。

        幂等：带 `Idempotency-Key`。同键同请求体重发返回首次结果，不会建两笔；同键改了请求体 → `409`·208005；同键的上一次提交还在处理 → `409`·208011。PIN 不参与幂等比对。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
            examples:
              partial:
                summary: 部分退款 + Refund PIN（CNY 成交币种）
                value:
                  amount:
                    amount: '5000'
                    currency: CNY
                  note: 客户退货
                  refundPin: '482913'
      responses:
        '201':
          description: 退款单已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRefundResult'
              examples:
                accepted:
                  summary: 受理（进审核）
                  value:
                    refundId: R100240002-2
                    status: REVIEWING
                insufficientFunds:
                  summary: 已建单，但账户资金不足
                  value:
                    refundId: R100240002-4
                    status: FAILED
                    failureReason: INSUFFICIENT_FUNDS
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204008
        - 206003
        - 206004
        - 208003
        - 208005
        - 208011
  /orders/payments/{orderId}/preauth-completion:
    post:
      tags:
        - payments
      operationId: releasePreAuth
      x-required-privilege: orders:preauth:create
      summary: 预授权完成（Release）
      description: |
        对挂起中的预授权单（`status = PREAUTH_HOLDING`）执行完成：订单解除挂起、进入下一批清结算。完成后的状态按已退情况是 `PAID` / `PARTIALLY_REFUNDED` / `REFUNDED`，重取详情读到。

        订单已不是挂起状态 → `409`·208010。

        幂等：带 `Idempotency-Key`。本接口没有请求体，同键重发同一订单返回首次结果；同键用到别的订单 → `409`·208005；同键的上一次提交还在处理 → `409`·208011。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '204':
          description: 已完成
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208005
        - 208010
        - 208011
  /orders/refunds:
    get:
      tags:
        - refunds
      operationId: listRefunds
      x-required-privilege: orders:refund:view
      summary: 退款列表
      description: |
        当前商户的退款，分页。日期范围必填，按退款的创建日，服务端不设默认。

        只含 `type = merchant` 的退款（后台、App、终端、开放 API、插件、平台代操作发起的）；平台自动退回的多付款项（`type = system_auto`）不在列表、计数与导出里，只出现在原订单详情的关联退款中。

        支付方式与来源是原订单的。状态 chip 的各项与计数另取 `getRefundCounts`。
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/PaymentMethodFamilyFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - $ref: '#/components/parameters/DeviceFilter'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RefundStatus'
        - $ref: '#/components/parameters/RefundKeyword'
        - $ref: '#/components/parameters/RefundSortField'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 退款分页列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundList'
              examples:
                page:
