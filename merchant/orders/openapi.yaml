components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在会话没有当前商户时返回 `409`·`208022`（见公共约定「当前商户」）。
  parameters:
    FromDate:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LocalDate'
      description: 起始日期（含当日）：订单接口按订单创建日，退款接口按退款创建日。与 `to` 同为必填，服务端不设默认范围。 列表、汇总、计数、导出用同一组参数。
    ToDate:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LocalDate'
      description: 截止日期（含当日；与 `from` 成对必填）。
    PaymentMethodFamilyFilter:
      name: paymentMethodFamily
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PaymentMethodFamily'
      description: 按支付方式（品牌）过滤。退款列表上指原订单的支付方式。
    PaymentSourceFilter:
      name: source
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/PaymentSource'
      description: 按来源过滤。退款列表上指原订单的来源。
    DeviceFilter:
      name: deviceId
      in: query
      required: false
      schema:
        type: string
        minLength: 1
      description: 只看这台设备发起的订单，取值是 `listDevices` 的 `deviceId`。退款列表上指原订单的发起设备。
    PaymentKeyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
      description: 订单号、商户订单号、通道交易号、备注模糊匹配；是个金额（按界面显示的单位写，可带小数点，如 `126.50`）时另按行上的 `amount` 精确匹配，不分币种。
    RefundKeyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
      description: 退款号、商户退款单号、通道退款号、原订单号、原订单的商户订单号、备注模糊匹配；是个金额（按界面显示的单位写，可带小数点，如 `126.50`）时另按行上的 `amount` 精确匹配，不分币种。
    PaymentSortField:
      name: sortField
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - amount
      description: 排序字段。不传 = 不排序。`amount` 按行上的 `amount` 数值比较、不分币种。
    RefundSortField:
      name: sortField
      in: query
      required: false
      schema:
        type: string
        enum:
          - createdAt
          - amount
      description: 排序字段。不传 = 不排序。`amount` 按行上的 `amount` 数值比较、不分币种。
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        页面当前的语言（BCP-47 语言标记，可带权重列表，如 `zh-CN,zh;q=0.9,en;q=0.8`）。服务端在本接口支持的语言里取最接近的一种（如 `fr-CA` → `fr`）；按它渲染什么、取不中时退到哪种语言，见所在面的说明。

        响应带 `Content-Language` 的接口，实际用的语言以该头为准。
      schema:
        type: string
        minLength: 2
        maxLength: 256
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
  schemas:
    PaymentStatus:
      type: string
      description: |
        支付订单的商户可见状态：`PAID` 已收款 · `PARTIALLY_REFUNDED` 部分退款 · `REFUNDED` 全额退款 · `FAILED` 付款失败 · `REJECTED` 平台未受理 · `PREAUTH_HOLDING` 预授权挂起。

        前三种都是已收款，按已退金额区分；退款受理后又失败的会回退，所以订单可能从 `PARTIALLY_REFUNDED` 回到 `PAID`。`REJECTED` 是建单时被平台拒掉、支付从未发生，与 `FAILED`（付了但失败）不同。收款过程中的中间状态不进列表。

        计入汇总的是 `PAID` / `PARTIALLY_REFUNDED` / `REFUNDED` / `PREAUTH_HOLDING` 四种。
      enum:
        - PAID
        - PARTIALLY_REFUNDED
        - REFUNDED
        - FAILED
        - REJECTED
        - PREAUTH_HOLDING
    PaymentSource:
      type: string
      description: |
        订单来源：这笔钱从哪个入口收进来的。

        | 取值 | 含义 |
        |---|---|
        | `terminal` | POS 终端 |
        | `app` | 商户 App |
        | `store_qr` | 店铺码 |
        | `invoice` | 账单 |
        | `product_link` | Product Link 的商品 |
        | `ticket` | Product Link 的票务 |
        | `giftcard` | Product Link 的礼卡 |
        | `retail_api` | 开放 API，线下 |
        | `online_api` | 开放 API，线上 |
        | `auto_debit` | 委托代扣 |
        | `shopify` | Shopify 插件 |
        | `allvalue` | AllValue 插件 |
      enum:
        - terminal
        - app
        - store_qr
        - invoice
        - product_link
        - ticket
        - giftcard
        - retail_api
        - online_api
        - auto_debit
        - shopify
        - allvalue
    PaymentProduct:
      type: string
      description: 订单的产品形态：店铺码、动态码、原生码（商户自行展示的钱包二维码）、付款码、账单、商品、票务、礼卡、PC 网页、移动网页、JSAPI、原生 JSAPI（商户自有应用内调起）、小程序、App SDK、委托代扣。
      enum:
        - store_qr
        - dynamic_qr
        - native_qrcode
        - barcode
        - invoice
        - product_code
        - ticket
        - giftcard
        - web_pc
        - web_mobile
        - jsapi
        - native_jsapi
        - mini_program
        - app_sdk
        - auto_debit
    RefundStatus:
      type: string
      description: |
        退款状态：`REVIEWING` 平台审核中 · `CHANNEL_PROCESSING` 已送通道、处理中 · `SUCCESS` 成功 · `FAILED` 失败 · `REJECTED` 审核被拒 · `CANCELLED` 已撤销。

        后四种是终态。只有 `REVIEWING` 能撤销，只有 `CHANNEL_PROCESSING` 与 `SUCCESS` 有收据。
      enum:
        - REVIEWING
        - CHANNEL_PROCESSING
        - SUCCESS
        - FAILED
        - REJECTED
        - CANCELLED
    RefundType:
      type: string
      description: 退款类型：`merchant` 退已生效订单的退款，从商户账上出钱；`system_auto` 平台自动退回的多付款项（重复支付、关单后才到的成功支付），不动商户的账，不计入订单的已退金额。
      enum:
        - merchant
        - system_auto
    RefundFailureReason:
      type: string
      description: |
        退款失败的原因，`status = FAILED` 时有。

        | 取值 | 含义 |
        |---|---|
        | `INSUFFICIENT_FUNDS` | 账户资金不足，退款没有送到通道 |
        | `CHANNEL_REJECTED` | 通道明确拒绝 |
        | `CHANNEL_UNREACHABLE` | 退款请求没能送到通道 |
        | `UNCONFIRMED` | 通道一直没有明确结果，经对账或人工核对确认没有退成 |
      enum:
        - INSUFFICIENT_FUNDS
        - CHANNEL_REJECTED
        - CHANNEL_UNREACHABLE
        - UNCONFIRMED
    RefundEntryPoint:
      $ref: '#/components/schemas/EntryPoint'
    FxInfo:
      type: object
      description: 通道回报的换汇信息，只用于展示，不要拿汇率反算金额。通道没回报时详情不返回 `fx`。
      properties:
        rate:
          type: string
          minLength: 1
          description: 汇率，十进制字符串：1 单位结算币种 = `rate` 人民币（如结算 CAD 时形如 `5.1020`）。通道没给就不返回本键。
        cnyAmount:
          description: 付款人实付的人民币金额。通道没给就不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
    Payment:
      type: object
      description: 支付订单列表的一行；详情在它上面加字段。
      required:
        - orderId
        - source
        - amount
        - status
        - createdAt
        - refundable
      properties:
        orderId:
          type: string
          minLength: 1
          description: 平台订单号。
        paymentMethodFamily:
          description: 支付方式（品牌）。`status = REJECTED` 时不返回本键。
          allOf:
            - $ref: '#/components/schemas/PaymentMethodFamily'
        source:
          $ref: '#/components/schemas/PaymentSource'
        amount:
          description: 订单金额。已成交的订单是结算币种的成交金额；没成交的（`FAILED` / `REJECTED`）是标价金额。
          allOf:
            - $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        note:
          type: string
          description: 备注：商户填的订单备注与收款页向付款人采集的内容，已拼成一段展示文本，格式不保证稳定。没有时不返回本键。
        refundable:
          type: boolean
          description: 能否发起退款，服务端的判定结果。
        remainingRefundable:
          description: 还可以退的金额，**标价币种**（退款按标价币种发起）：成交额减已退、减在途的退款。`refundable` 为真时必返，否则不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
    PaymentList:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
    PaymentSummary:
      type: object
      description: Payments 页头汇总卡，金额都是商户结算币种。口径见 `getPaymentSummary`。
      required:
        - transactions
        - grossSales
        - refundAmount
        - netSales
      properties:
        transactions:
          type: integer
          minimum: 0
          description: 计入汇总的订单数（只算收到钱的四种状态）。
        grossSales:
          $ref: '#/components/schemas/Money'
        refundAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 这批订单至今已退的金额。
        netSales:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: '`grossSales` − `refundAmount`。'
    RefundRef:
      type: object
      description: 订单详情里的一笔关联退款。
      required:
        - refundId
        - type
        - status
        - amount
        - createdAt
      properties:
        refundId:
          type: string
          minLength: 1
        type:
          $ref: '#/components/schemas/RefundType'
        status:
          $ref: '#/components/schemas/RefundStatus'
        amount:
          description: 退款金额，标价币种。
          allOf:
            - $ref: '#/components/schemas/Money'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PaymentCallback:
      type: object
      description: 向商户回调地址发通知的情况：地址取自订单，其余三项是最近一次投递。投递记录过了保留期后只剩 `url`。
      required:
        - url
      properties:
        url:
          type: string
        httpStatus:
          type: integer
          description: 对方返回的 HTTP 状态码；还没发过、没收到响应或记录已清理时不返回本键。
        sentAt:
          description: 最近一次投递的时刻；没有投递记录时不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        latencyMs:
          type: integer
          minimum: 0
          description: 最近一次投递的请求耗时（毫秒）；没有时不返回本键。
    PaymentDetail:
      description: 支付订单详情：列表行的字段加下面这些。
      allOf:
        - $ref: '#/components/schemas/Payment'
        - type: object
          required:
            - pricedAmount
            - product
            - refunds
          properties:
            pricedAmount:
              description: 标价币种的订单金额（付款人应付总额，含小费）。标价币种就是结算币种时与 `amount` 相同。
              allOf:
                - $ref: '#/components/schemas/Money'
            tipAmount:
              description: 其中的小费，标价币种；没有小费时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Money'
            refundedAmount:
              description: 已退金额，标价币种（通道已受理的退款累计；受理后又失败的会退回）。没退过时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Money'
            refundedSettleAmount:
              description: 已退金额折合的结算币种金额，与 `refundedAmount` 同有同无。
              allOf:
                - $ref: '#/components/schemas/Money'
            confirmedAt:
              description: 确认时间；还没到终态时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Timestamp'
            product:
              $ref: '#/components/schemas/PaymentProduct'
            invoiceNo:
              type: integer
              minimum: 10001
              description: 账单号，与收款产品契约的账单号同一个数；仅 `product = invoice`。
            linkId:
              type: string
              description: Product Link 的 ID；仅 `product` 为 `product_code` / `ticket` / `giftcard`。
            salesOrderId:
              type: string
              description: 销售单 ID，与 `linkId` 同有同无。
            customerName:
              type: string
              description: 客户姓名，取自关联的账单或销售单；没有时不返回本键。
            customerEmail:
              type: string
              description: 客户邮箱，来源同上。
            payerAccountMasked:
              type: string
              description: 付款账户（脱敏）；通道没给时不返回本键。
            merchantOrderNo:
              type: string
              description: 商户自己的订单号；建单时没传就不返回本键。
            channelTxnNo:
              type: string
              description: 通道（微信、支付宝等）返回的交易号，付款人账单上显示的那个；没发起过支付或通道还没返回时不返回本键。
            refunds:
              type: array
              description: 这张订单的全部退款，含平台自动退款（按 `type` 区分）；没有时为空数组。
              items:
                $ref: '#/components/schemas/RefundRef'
            customerIp:
              type: string
              description: 付款人 IP；没有时不返回本键。
            callback:
              description: 回调信息；订单没有回调地址时不返回本键。
              allOf:
                - $ref: '#/components/schemas/PaymentCallback'
            fx:
              description: 换汇信息；通道没回报时不返回本键。
              allOf:
                - $ref: '#/components/schemas/FxInfo'
    Refund:
      type: object
      description: 退款列表的一行；详情在它上面加字段。
      required:
        - refundId
        - orderId
        - paymentMethodFamily
        - source
        - amount
        - orderAmount
        - status
        - createdAt
      properties:
        refundId:
          type: string
          minLength: 1
          description: 平台退款号。
        orderId:
          type: string
          minLength: 1
          description: 原订单的平台订单号。
        paymentMethodFamily:
          description: 被退的那笔支付的支付方式（品牌），也就是钱退回去的渠道。商户退款退的是订单成交的那笔，与原订单的支付方式相同；平台自动退回重复支付时，是多付那一笔的支付方式，可能与订单的不同。
          allOf:
            - $ref: '#/components/schemas/PaymentMethodFamily'
        source:
          description: 原订单的来源。
          allOf:
            - $ref: '#/components/schemas/PaymentSource'
        amount:
          description: 退款金额，原订单的标价币种，即发起时填的金额。
          allOf:
            - $ref: '#/components/schemas/Money'
        settleAmount:
          description: 退款金额折合的结算币种金额。通道受理后才有；审核中、被拒、已撤销和没送到通道就失败的不返回本键。
          allOf:
            - $ref: '#/components/schemas/Money'
        orderAmount:
          description: 原订单的标价金额（同订单详情的 `pricedAmount`）。`amount` 小于它即部分退款。
          allOf:
            - $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/RefundStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        note:
          type: string
          description: 退款备注；没有时不返回本键。
    RefundList:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/Refund'
    RefundChannelError:
      type: object
      description: 通道返回的原始错误，各通道的码与文字不统一、不翻译，原样给出。
      properties:
        code:
          type: string
          description: 通道错误码；通道没给时不返回本键。
        message:
          type: string
          description: 通道错误描述；通道没给时不返回本键。
    RefundDetail:
      description: 退款详情：列表行的字段加下面这些。
      allOf:
        - $ref: '#/components/schemas/Refund'
        - type: object
          required:
            - type
            - entryPoint
          properties:
            type:
              $ref: '#/components/schemas/RefundType'
            completedAt:
              description: 到终态的时刻（成功、失败、被拒、已撤销）；还没到终态时不返回本键。
              allOf:
                - $ref: '#/components/schemas/Timestamp'
            entryPoint:
              description: 退款从哪个入口发起。`system` = 平台自动退款；`type = system_auto` 时恒为 `system`。
              allOf:
                - $ref: '#/components/schemas/EntryPoint'
            operatorId:
              type: string
              description: 发起退款的商户成员（同 Users 页的 `operatorId`）。开放 API、插件、平台代操作、系统发起的没有操作员，不返回本键。
            operatorName:
              type: string
              description: 该成员的姓名，与 `operatorId` 同有同无。
            customerName:
              type: string
              description: 客户姓名，取自原订单关联的账单或销售单；没有时不返回本键。
            customerEmail:
              type: string
              description: 客户邮箱，来源同上。
            merchantRefundNo:
              type: string
              description: 商户自己的退款单号；发起时没传就不返回本键。
            channelRefundNo:
              type: string
              description: 通道返回的退款号；没送到通道或通道还没返回时不返回本键。
            failureReason:
              description: 失败原因；`status = FAILED` 时必返，其余状态不返回本键。
              allOf:
                - $ref: '#/components/schemas/RefundFailureReason'
            channelError:
              description: 通道的原始错误；失败且通道回了错误时才有。
              allOf:
                - $ref: '#/components/schemas/RefundChannelError'
    CreateRefundRequest:
      type: object
      description: 发起退款的请求。不接受其他字段。
      additionalProperties: false
      required:
        - amount
        - refundPin
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 退款金额，币种须是订单的标价币种，大于 0 且不超过 `remainingRefundable`。
        note:
          type:
            - string
            - 'null'
          maxLength: 300
        refundPin:
          allOf:
            - $ref: '#/components/schemas/RefundPin'
          description: 商户的 Refund PIN。不参与幂等比对。
    CreateRefundResult:
      type: object
      required:
        - refundId
        - status
      properties:
        refundId:
          type: string
          minLength: 1
        status:
          allOf:
            - $ref: '#/components/schemas/RefundStatus'
          description: 首次受理是 `REVIEWING`、`CHANNEL_PROCESSING`、`SUCCESS` 或 `FAILED`。同键重发返回的是首次受理时记下的结果，不是当前的实时状态。
        failureReason:
          description: '`status = FAILED` 时必返，此处只会是 `INSUFFICIENT_FUNDS` 或 `CHANNEL_REJECTED`；其余状态不返回本键。'
          allOf:
            - $ref: '#/components/schemas/RefundFailureReason'
    StatisticsSummary:
      type: object
      additionalProperties: false
      required:
        - grossSales
        - refundAmount
        - netSales
        - distribution
      properties:
        grossSales:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 收款额合计，是付款人实付的金额，含小费与向付款人加收的服务费。
        refundAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 退款额合计（已减去回冲），可能为负。
        netSales:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: '`grossSales` − `refundAmount`，可能为负。'
        distribution:
          type: array
          description: 各支付方式品牌的收款额，只列有收款的品牌，金额从大到小。
          items:
            $ref: '#/components/schemas/DistributionSlice'
    DistributionSlice:
      type: object
      additionalProperties: false
      required:
        - paymentMethodFamily
        - amount
      properties:
        paymentMethodFamily:
          $ref: '#/components/schemas/PaymentMethodFamily'
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 该品牌的收款额。
    StatisticsTrend:
      type: object
      additionalProperties: false
      required:
        - month
        - points
      properties:
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          description: 这份数据是哪个月，`YYYY-MM`。
          examples:
            - 2026-07
        points:
          type: array
          items:
            $ref: '#/components/schemas/TrendPoint'
    TrendPoint:
      type: object
      additionalProperties: false
      required:
        - date
        - volume
        - orders
      properties:
        date:
          $ref: '#/components/schemas/LocalDate'
        volume:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 当日收款额。
        orders:
          type: integer
          minimum: 0
          description: 当日成交笔数。
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    PaymentMethodFamily:
      type: string
      description: 支付方式族（品牌）。
      enum:
        - wechat
        - alipay
        - unionpay
        - credit_card
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              type: string
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              type: string
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    QuickFilterItem:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
          description: 该项对应的筛选值 —— **对客户端不透明**:选中本项就把它**原样**回传给对应列表端点的那个筛选参数, 不要解析、拼接或据其分支。
          examples:
            - PAID
        label:
          type: string
          description: 后端给的默认展示名。**客户端有自己的多语言资源时按 `value` 取用、本字段作兜底**; 没有资源(取值由配置或数据决定,如角色名、年份)时直接展示本字段。
          examples:
            - Paid
        count:
          type: integer
          minimum: 0
          description: 该项当前的命中数(口径见 `QuickFilterCounts` 说明)。
    QuickFilterCounts:
      type: object
      additionalProperties: false
      description: |
        **列表页顶部快捷筛选的各项与计数**。快捷筛选就是该列表的一个筛选维度,没有特殊机制:选中某项 = 给列表带上该维度的筛选参数(值 = 该项 `value`),**选 All = 不带这个参数**。

        **照着 `items` 渲染即可** —— 项集、顺序、展示名、数字全部由服务端给出,客户端不枚举取值、不 hardcode 项集;某项当期为 `0` 时**仍会返回**(那一格不该因为没数据就消失)。

        **`All` 不在 `items` 里,由客户端自己补一项**,数字 = 其余各项之和 —— 服务端保证 `items` 覆盖该列表在不带本维度筛选时的全部命中(每行恰好落进一项),故这个和恒等于此时列表的 `total`。

        例外:某些集合一行可落进多项(如成员的角色),这类接口另给总数,All 取那个总数、不用各项相加。

        **本端点不接受被计维度自身的参数**;其余筛选条件与对应列表端点一致、传什么算什么。因此:点某项后列表 `total` = 该项 `count`;点 All 后列表 `total` = 各项 `count` 之和。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuickFilterItem'
    PositiveMoney:
      description: 正额金额（amount = 最小币种单位正非零整数字符串、currency 同 Money）；schema 化收口「> 0」。用于「划多少」类输入（资金划转额 / 阈值 / 退款额等），金额方向由具体业务操作表达、不用正负号表示；区别于 Money（可正可负，用于余额 / 分录 / 结算净额 / 回冲等账面值）。
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amount:
              type: string
              pattern: ^[1-9][0-9]*$
    RefundPin:
      type: string
      writeOnly: true
      pattern: ^[0-9]{6}$
      description: 商户级 Refund PIN——**6 位纯数字**。 **write-only**：仅作入参采集，**绝不出现在任何响应**（含错误响应）；读面走掩码 / 已填标志。
    EntryPoint:
      type: string
      description: 入口：`pos` 终端 · `merchant_app` 商户 App · `merchant_portal` 商户后台 · `open_api` 开放 API · `checkout` 收银台页面（店铺码、账单、Product Link） · `channel_inbound` 通道直接推来的订单 · `plugin_shopify` Shopify 插件 · `plugin_allvalue` AllValue 插件 · `plugin_allvalue_xhs` AllValue 小红书 · `admin_portal` 平台运营代操作 · `system` 系统发起。
      enum:
        - pos
        - merchant_app
        - merchant_portal
        - open_api
        - checkout
        - channel_inbound
        - plugin_shopify
        - plugin_allvalue
        - plugin_allvalue_xhs
        - admin_portal
        - system
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    XlsxFile:
      description: Excel 文件（xlsx）
      headers:
        Content-Disposition:
          required: true
          description: '`attachment; filename=...xlsx`（下载；filename 编码 RFC 5987）。'
          schema:
            type: string
        Content-Language:
          required: true
          description: 文件实际用的语言（BCP-47）。
          schema:
            type: string
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
    PdfFile:
      description: PDF 文件
      headers:
        Content-Disposition:
          required: true
          description: '`inline; filename=...pdf`（浏览器打印 / 另存；filename 编码 RFC 5987）。'
          schema:
            type: string
        Content-Language:
          required: true
          description: 文件实际用的语言（BCP-47）。
          schema:
            type: string
      content:
        application/pdf:
          schema:
            type: string
            format: binary
