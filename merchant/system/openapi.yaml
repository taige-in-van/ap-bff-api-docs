openapi: 3.1.0
info:
  title: 商户后台 系统 — 前端契约面
  version: 2.2.1
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的系统契约：平台参考数据（`/config/*`）、站内信（`/notices`）、开发者接入（`/developer`）。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 参考数据与当前商户无关；站内信与开发者接入以会话的当前商户为准、不看请求体，当前商户不可访问时返回 `409`·`208022`。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: config
    x-displayName: 平台参考数据
    description: 平台参考数据（与当前商户无关）：币种国家组合、国家与省州、行业与 MCC、支付方式与标准费率、结算周期与账户制式。
  - name: notices
    x-displayName: 站内信
    description: 站内信：整个商户共用的收件箱，只收发给商户整体的通知，已读也是全商户共用一份。
  - name: developer
    x-displayName: 开发者接入
    description: 开发者接入：接入凭据（商户号、Gateway Credential）、网关地址、商户自己的签名公钥、平台公钥。
paths:
  /config/currencies:
    get:
      tags:
        - config
      operationId: listCurrencyOptions
      x-required-privilege: session
      summary: 结算币种及各币种可选的国家
      description: |
        有效的结算币种 × 国家组合，平台配置、和当前商户无关。用在 Add Merchant 弹窗与入驻向导 Business 步：先选币种或国家，另一项按组合联动；提交的组合不在这里 → 400。

        需要时就调，前端不必缓存。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    minItems: 1
                    items:
                      $ref: '#/components/schemas/CurrencyCountry'
              example:
                items:
                  - currency: CAD
                    countries:
                      - CA
                  - currency: USD
                    countries:
                      - CA
                      - US
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /config/countries:
    get:
      tags:
        - config
      operationId: listCountryOptions
      x-required-privilege: session
      summary: 国家及其省州（省州带三语展示名）（含时区候选）
      description: |
        可选国家及其省 / 州，平台配置、和当前商户无关。用在入驻向导 Business 步、Business Profile 显示省州名与编辑地址。国家展示名由前端按 ISO 码解析，省州展示名取 `label`；邮编格式取前端参考数据预校、服务端重校；时区候选随省 / 州项下发（无省 / 州的国家在国家项上）。没有省 / 州的国家 `provinces` 为空数组。

        需要时就调，前端不必缓存。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    minItems: 1
                    description: 顺序即展示顺序；覆盖 `/config/currencies` 里出现的每个国家。
                    items:
                      $ref: '#/components/schemas/CountryOption'
              example:
                items:
                  - code: CA
                    provinces:
                      - code: BC
                        label:
                          en: British Columbia
                          zh: 不列颠哥伦比亚省
                          fr: Colombie-Britannique
                        timeZones:
                          - America/Vancouver
                      - code: 'ON'
                        label:
                          en: Ontario
                          zh: 安大略省
                          fr: Ontario
                        timeZones:
                          - America/Toronto
                  - code: US
                    provinces:
                      - code: WA
                        label:
                          en: Washington
                          zh: 华盛顿州
                          fr: Washington
                        timeZones:
                          - America/Los_Angeles
                      - code: NY
                        label:
                          en: New York
                          zh: 纽约州
                          fr: New York
                        timeZones:
                          - America/New_York
                  - code: HK
                    provinces: []
                    timeZones:
                      - Asia/Hong_Kong
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /config/industries:
    get:
      tags:
        - config
      operationId: listIndustryOptions
      x-required-privilege: session
      summary: 行业大类及其 MCC（带三语展示名）
      description: |
        行业大类 → MCC 两级候选，平台配置、和当前商户无关。用在入驻向导 Business 步（选择）与 Business Profile（按码显示行业与 MCC 的名称）。

        需要时就调，前端不必缓存。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    description: 顺序即展示顺序。
                    items:
                      $ref: '#/components/schemas/ConfigIndustry'
              example:
                items:
                  - code: A0
                    label:
                      en: Agricultural Services (0700-0999)
                      zh: 农业服务 (0700-0999)
                      fr: Services agricoles (0700-0999)
                    mccOptions:
                      - code: '0742'
                        label:
                          en: Veterinary Services
                          zh: 兽医服务
                          fr: Services vétérinaires
                      - code: '0780'
                        label:
                          en: Landscaping and Horticultural Services
                          zh: 园林绿化与园艺服务
                          fr: Services d'aménagement paysager et d'horticulture
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /config/payment-methods/{currency}:
    get:
      tags:
        - config
      operationId: listPaymentMethodOptions
      x-required-privilege: session
      summary: 某结算币种可选的支付方式与标准费率
      description: |
        该结算币种下的支付方式候选、标准费率与推荐标记，平台配置、和当前商户无关。用在入驻向导 Services 步与 Service 页。

        不含信用卡：卡不按支付方式申请开通，由 Service 页的卡终端连接管。

        本部署不支持的币种 → `404`。需要时就调，前端不必缓存。
      parameters:
        - name: currency
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/Currency'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    minItems: 1
                    description: 顺序即展示顺序。
                    items:
                      $ref: '#/components/schemas/ConfigPaymentMethod'
              example:
                items:
                  - paymentMethod: wechat_instore
                    acceptanceMode: in_store
                    displayName: WeChat Pay
                    standardRate:
                      percentageRate: '0.015'
                      fixedFee: '10'
                    recommended: true
                  - paymentMethod: alipay_online
                    acceptanceMode: online
                    displayName: Alipay
                    standardRate:
                      percentageRate: '0.015'
                      fixedFee: '10'
                    recommended: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /config/settlement:
    get:
      tags:
        - config
      operationId: getSettlementConfig
      x-required-privilege: session
      summary: 结算周期与各国结算银行账户制式
      description: |
        填结算信息用的两组候选，平台配置、和当前商户无关。用在入驻向导 Settlement 步与 Business Profile 编辑 Settlement。

        需要时就调，前端不必缓存。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementConfig'
              example:
                settlementCycleOptions:
                  - code: t2
                    displayName: T+2 Business Days
                  - code: t3
                    displayName: T+3 Business Days
                  - code: weekly
                    displayName: Weekly
                  - code: monthly
                    displayName: Monthly
                bankAccountTypes:
                  - country: CA
                    type: ca_local
                  - country: US
                    type: us_local
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /notices:
    get:
      tags:
        - notices
      operationId: listNotices
      x-required-privilege: session
      summary: 站内信列表（分页，时间从新到旧）
      description: 当前商户的站内信，已读未读都在，按时间从新到旧；不含已撤回的公告。
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeListPage'
              example:
                total: 2
                data:
                  - noticeId: ntc_88a1
                    title: Refund Reserve Auto-Replenished
                    style: success
                    read: false
                    createdAt: '2026-07-22T09:00:00Z'
                  - noticeId: ntc_87f0
                    title: Settlement Account Change Approved
                    style: default
                    read: true
                    createdAt: '2026-07-21T18:00:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - notices
      operationId: markAllNoticesRead
      x-required-privilege: session
      summary: 全部标已读
      description: 把当前商户所有未读的站内信标为已读，对全商户生效。没有未读时什么都不变。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeReadUpdate'
            example:
              read: true
      responses:
        '204':
          description: 已标
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /notices/summary:
    get:
      tags:
        - notices
      operationId: getNoticeSummary
      x-required-privilege: session
      summary: 未读数
      description: 当前商户未读站内信的条数，全商户共用一份。可以定时调用。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - unreadCount
                properties:
                  unreadCount:
                    type: integer
                    minimum: 0
              example:
                unreadCount: 3
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /notices/{noticeId}:
    get:
      tags:
        - notices
      operationId: getNotice
      x-required-privilege: session
      summary: 站内信详情
      description: 只读，不会把这条标成已读；标已读用 `markNoticeRead`。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/NoticeId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoticeDetail'
              example:
                noticeId: ntc_88a1
                title: Refund Reserve Auto-Replenished
                style: success
                read: false
                createdAt: '2026-07-22T09:00:00Z'
                body: <p>Your refund reserve was topped up to the target amount.</p>
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - notices
      operationId: markNoticeRead
      x-required-privilege: session
      summary: 标一条已读
      description: 把这条站内信标为已读，对全商户生效。已读的再标一次什么都不变。
      parameters:
        - name: noticeId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/NoticeId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoticeReadUpdate'
            example:
              read: true
      responses:
        '204':
          description: 已标
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /developer:
    get:
      tags:
        - developer
      operationId: getDeveloperSettings
      x-required-privilege: settings:developer:view
      summary: 读开发者页（商户号、凭据末 4 位、网关地址、商户公钥、平台公钥）
      description: 当前商户的接入信息。Gateway Credential 只给末 4 位，完整值取 `revealGatewayCredential`；商户号与各公钥不是秘密，直接给全文。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperSettings'
              example:
                merchantCode: C3BM68
                credentialLast4: '4821'
                credentialIssuedAt: '2026-04-16T18:02:11Z'
                gatewayUrl: https://gateway.example.com/api
                signingKey:
                  publicKeyPem: |-
                    -----BEGIN PUBLIC KEY-----
                    MIIBIjANBg...
                    -----END PUBLIC KEY-----
                  createdAt: '2026-05-02T09:30:00Z'
                platformPublicKeys:
                  - keyVersion: 1
                    publicKeyPem: |-
                      -----BEGIN PUBLIC KEY-----
                      MFwwDQYJ...
                      -----END PUBLIC KEY-----
                    activatedAt: '2026-01-10T00:00:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /developer/credential/disclosures:
    post:
      tags:
        - developer
      operationId: revealGatewayCredential
      x-required-privilege: settings:developer:edit
      summary: 取 Gateway Credential 完整值
      description: |
        返回当前商户正在用的 Gateway Credential 完整值，每次调用记一条查看记录。

        还没签发凭据 → `404`。响应不可缓存。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: OK
          headers:
            Cache-Control:
              description: '`no-store`。'
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - credential
                properties:
                  credential:
                    type: string
                    minLength: 1
              example:
                credential: EXAMPLE-CREDENTIAL-VALUE
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /developer/signing-key:
    put:
      tags:
        - developer
      operationId: replaceSigningKey
      x-required-privilege: settings:developer:edit
      summary: 登记或替换商户签名公钥
      description: |
        登记当前商户的 RSA 公钥，平台用它验商户请求的签名。还没登记时是首次登记，已登记时是替换。

        - 公钥为空、不是 PEM、不是 RSA 公钥，或密钥长度不在 2048–4096 位 → `400`·`204011`，不产生任何变更。
        - 替换后新公钥立即可用，被换下的那把在宽限期内仍然有效（默认 24 小时，由平台设定）。宽限期内再次替换，最早的那把立即失效。
        - 提交的公钥与当前这把相同：什么都不变，照常返回当前这把。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SigningKeyUpsertRequest'
            example:
              publicKeyPem: |-
                -----BEGIN PUBLIC KEY-----
                MIIBIjANBg...
                -----END PUBLIC KEY-----
      responses:
        '200':
          description: 当前这把公钥
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SigningKey'
              example:
                publicKeyPem: |-
                  -----BEGIN PUBLIC KEY-----
                  MIIBIjANBg...
                  -----END PUBLIC KEY-----
                createdAt: '2026-10-01T16:20:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204011
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在当前商户不可访问时返回 `409`·`208022`（见公共约定「当前商户」）。
  schemas:
    SettlementConfig:
      type: object
      additionalProperties: false
      required:
        - settlementCycleOptions
        - bankAccountTypes
      description: 填结算信息用的两组候选；实际候选由部署配置决定。
      properties:
        settlementCycleOptions:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SettlementCycleOption'
          description: 结算周期档位，顺序即展示顺序，提交选中项的 `code`。初始选中：读申请返回的 `settlementCycle` 有值即为选中项，无值不预选。
        bankAccountTypes:
          type: array
          minItems: 1
          description: 平台出款的国家 → 该国结算银行账户制式；商户 Country 无条目 = 平台不对其出款，Settlement 步只采 Refund PIN。
          items:
            $ref: '#/components/schemas/CountryBankAccountType'
    ConfigPaymentMethod:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - acceptanceMode
        - displayName
        - standardRate
        - recommended
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        acceptanceMode:
          $ref: '#/components/schemas/AcceptanceMode'
        displayName:
          type: string
          minLength: 1
          description: 支付方式展示名（非本地化）。
        standardRate:
          allOf:
            - $ref: '#/components/schemas/FeeRate'
          description: 标准费率：未另议价的商户审核通过后按此签约。
        recommended:
          type: boolean
    ConfigIndustry:
      type: object
      additionalProperties: false
      description: 一个行业大类及其 MCC。
      required:
        - code
        - label
        - mccOptions
      properties:
        code:
          type: string
          minLength: 1
          description: 行业大类码，即资料与入驻申请里的 `industryCategory`。
          examples:
            - A0
        label:
          $ref: '#/components/schemas/LocalizedLabel'
        mccOptions:
          type: array
          description: 该大类下可选的 MCC，顺序即展示顺序；无可选项时为空数组。候选项的 `code` 是四位 MCC（如 `0742`），即资料与入驻申请里的 `mcc`；展示名随项下发（MCC 没有标准名表）。
          items:
            $ref: '#/components/schemas/CodeLabelOption'
    NoticeReadUpdate:
      type: object
      additionalProperties: false
      required:
        - read
      properties:
        read:
          type: boolean
          description: 只接受 `true`：已读不能改回未读，传 `false` → `400`。
    NoticeListItem:
      type: object
      additionalProperties: false
      required:
        - noticeId
        - title
        - style
        - read
        - createdAt
      properties:
        noticeId:
          $ref: '#/components/schemas/NoticeId'
        title:
          type: string
        style:
          $ref: '#/components/schemas/NoticeStyle'
        read:
          type: boolean
          description: 商户里任何一个人打开过即为已读。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    NoticeListPage:
      type: object
      additionalProperties: false
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/NoticeListItem'
    NoticeDetail:
      type: object
      additionalProperties: false
      description: 列表行的字段加正文。
      required:
        - noticeId
        - title
        - style
        - read
        - createdAt
        - body
      properties:
        noticeId:
          $ref: '#/components/schemas/NoticeId'
        title:
          type: string
        style:
          $ref: '#/components/schemas/NoticeStyle'
        read:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        body:
          type: string
          description: 正文，服务端处理过的 HTML；标题与正文在生成时已按商户语言写好。
    DeveloperSettings:
      type: object
      additionalProperties: false
      required:
        - merchantCode
        - gatewayUrl
        - platformPublicKeys
      properties:
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
          description: 商户号，接入时的公开标识。
        credentialLast4:
          type: string
          minLength: 4
          maxLength: 4
          description: Gateway Credential 的末 4 位。还没签发凭据时不返回本键。
        credentialIssuedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 当前这版凭据的签发时刻；平台重置凭据后会变。还没签发凭据时不返回本键。
        gatewayUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 开放接口的网关地址。
        signingKey:
          allOf:
            - $ref: '#/components/schemas/SigningKey'
          description: 商户当前的签名公钥。还没登记时不返回本键。
        platformPublicKeys:
          type: array
          minItems: 1
          description: 平台公钥，商户用它验平台的响应与 Webhook 签名。通常一把；平台换钥前会提前公布新的一把，这段时间是两把。
          items:
            $ref: '#/components/schemas/PlatformPublicKey'
    SigningKey:
      type: object
      additionalProperties: false
      required:
        - publicKeyPem
        - createdAt
      properties:
        publicKeyPem:
          type: string
          minLength: 1
        createdAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 这把公钥的登记时刻。
    PlatformPublicKey:
      type: object
      additionalProperties: false
      required:
        - keyVersion
        - publicKeyPem
      properties:
        keyVersion:
          type: integer
          minimum: 1
          description: 版本号。平台的响应与 Webhook 的 `Signature` 头里带着签名所用公钥的版本号，两把并存时按它选。
        publicKeyPem:
          type: string
          minLength: 1
        activatedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 开始用于签名的时刻。已公布、还没开始用的那一把不返回本键。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    CurrencyCountry:
      type: object
      additionalProperties: false
      description: 一条**有效 Currency × Country 组合**（各前端面选币种与国家时共用同一形状）。组合集**由后端配置决定、契约不写死**：客户端一律从所在面的配置接口取候选集渲染、按组合联动，不自行拼组合。`currency` 与 `countries` 都是 ISO 标准码（4217 / 3166），币种与国家的展示名由客户端按它们解析（浏览器内置 `Intl.DisplayNames` 即可）。
      required:
        - currency
        - countries
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        countries:
          type: array
          minItems: 1
          description: 该币种下可选的国家（ISO 3166-1 alpha-2）。
          items:
            type: string
            minLength: 1
    LocalizedLabel:
      type: object
      additionalProperties: false
      description: 按语言分组的展示名（是数据，不做 locale 协商）。前端按当前界面语言取用、显示与本地搜索；缺该语言时回落 `en`。
      required:
        - en
      properties:
        en:
          type: string
          minLength: 1
        zh:
          type: string
          minLength: 1
        fr:
          type: string
          minLength: 1
    CountryProvinceOption:
      type: object
      additionalProperties: false
      description: 一个省 / 州候选：稳定码 + 按语言分组的展示名 + 该省 / 州可选的时区。
      required:
        - code
        - label
        - timeZones
      properties:
        code:
          type: string
          minLength: 1
        label:
          $ref: '#/components/schemas/LocalizedLabel'
        timeZones:
          type: array
          minItems: 1
          description: 可选的 IANA 时区标识，顺序即展示顺序。
          items:
            type: string
            minLength: 1
    CountryOption:
      type: object
      additionalProperties: false
      description: 一个可选国家及其省 / 州候选（各前端面录入或编辑国家与省 / 州时共用）。`code` 是 ISO 3166 标准码，国家展示名由客户端按它解析（浏览器内置 `Intl.DisplayNames` 即可）。邮编格式按国家取前端参考数据预校、服务端重校（没有邮编制度的国家不填）；时区候选随本条下发：省 / 州项各带 `timeZones`，无省 / 州的国家在国家项上带；改国家后省 / 州与时区须重选。
      required:
        - code
        - provinces
      properties:
        code:
          type: string
          minLength: 1
          examples:
            - CA
        provinces:
          type: array
          description: 该国的省 / 州候选（顺序即展示顺序）；没有省 / 州的国家（如香港）为空数组，此时省 / 州不填、时区候选按国家给。候选项的 `code` 是 ISO 3166-2 的地区部分（如 `BC`）；展示名随项下发——浏览器的本地化能力不解析行政区划。
          items:
            $ref: '#/components/schemas/CountryProvinceOption'
        timeZones:
          type: array
          minItems: 1
          description: 可选的 IANA 时区标识，顺序即展示顺序。仅没有省 / 州的国家带本键。
          items:
            type: string
            minLength: 1
    CodeLabelOption:
      type: object
      additionalProperties: false
      description: 一个候选项：稳定码 + 按语言分组的展示名。
      required:
        - code
        - label
      properties:
        code:
          type: string
          minLength: 1
        label:
          $ref: '#/components/schemas/LocalizedLabel'
    PaymentMethod:
      type: string
      minLength: 1
      maxLength: 64
      description: 支付方式目录标识（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，调用方从候选集取来原样回传，按未知值安全处理。
      examples:
        - wechat_instore
    AcceptanceMode:
      type: string
      enum:
        - in_store
        - online
      description: 受理模式：`in_store` 线下 / `online` 线上。
    FeeRate:
      type: object
      additionalProperties: false
      description: 比例费率与固定单笔费两项合起来是一个费率，比较两个费率是否相同要两项都比。
      required:
        - percentageRate
        - fixedFee
      properties:
        percentageRate:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
          description: 比例费率，小数（`0.015` = 1.5%）。
          examples:
            - '0.015'
        fixedFee:
          type: string
          pattern: ^[0-9]+$
          description: 固定单笔费，结算币种的最小单位整数串（`10` = 0.10）；没有固定费或在免收期内为 `0`。不带币种，按该商户的结算币种解释（收费币种与结算币种一致、不跨币种换算）。
          examples:
            - '10'
    SettlementCycleCode:
      type: string
      minLength: 1
      description: 结算周期档位的**稳定取值**（`SettlementCycleOption.code`）。**对客户端不透明**——从候选集里取来原样回传， 不要解析、拼接或据其分支；**不要传展示名**（那是展示文案、不是取值）。 服务端按**提交时点**的候选集校验：不在集内 → 拒绝（错误码见所在面，带 `details` 字段级明细），**不静默回落到候选集第一项**；前端应重取候选集让用户重选。 ⚠️ **你当前选中的取值不会凭空失效**——「打开编辑框却选不中自己现在的档位」「草稿存不回去」这类情形不会发生，无需为此写兜底。
    SettlementCycleOption:
      type: object
      description: 结算周期档位的一个候选项（入驻向导与商户资料的 Settlement 编辑面共用同一形状）。
      additionalProperties: false
      required:
        - code
        - displayName
      properties:
        code:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 本档位的稳定取值；候选集与取值域由后端配置决定，契约不写死。
        displayName:
          type: string
          minLength: 1
          description: canonical 展示名（**非本地化**、不随 locale 变）。前端有自己的多语言资源时按 `code` 取用，本字段作 unknown-safe 兜底。
    BankAccountScheme:
      type: string
      enum:
        - ca_local
        - us_local
      description: |
        结算银行账户制式：`ca_local` 加拿大 EFT / `us_local` 美国 ACH。

        封闭枚举：新增国家要在契约里加取值与对应字段、前端加表单组件、加出款适配器，不是纯配置。
    CountryBankAccountType:
      type: object
      additionalProperties: false
      description: |
        平台出款的国家及其结算银行账户制式（部署配置驱动，随出款执行方接入扩展）。制式由商户 Business 步所填 Country 决定、一国一制式；前端按商户 `country` 查表渲染对应制式的表单，**不按 currency / country 写 if / else**；写侧提交的 `bankAccount.type` 须等于该国的 `type`，否则 400。

        商户 Country 在 `bankAccountTypes` 里没有条目 = 平台不对该国商户出款（渠道方清算），入驻与商户资料面不采集结算银行账户与结算周期。
      required:
        - country
        - type
      properties:
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2，取自 `/config/countries` 的 `items[].code`。
        type:
          $ref: '#/components/schemas/BankAccountScheme'
    NoticeId:
      type: string
      minLength: 1
      maxLength: 32
      description: 站内信标识。
    NoticeStyle:
      type: string
      enum:
        - success
        - failure
        - warning
        - default
      description: 站内信样式（仅视觉语义；来源未提供 → default）。封闭枚举（取值集固定、可穷举分支）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    MerchantCode:
      type: string
      minLength: 1
      maxLength: 20
      description: 对外商户码。
    WebUrl:
      type: string
      pattern: ^https?://\S+$
      description: http 或 https 绝对地址。平台产出的文件 / 图片 / 付款链接地址与渠道给出的跳转地址共用。
    SigningKeyUpsertRequest:
      type: object
      additionalProperties: false
      required:
        - publicKeyPem
      properties:
        publicKeyPem:
          type: string
          description: 商户的 RSA 公钥，PEM 格式（X.509 SubjectPublicKeyInfo，`-----BEGIN PUBLIC KEY-----` 头尾齐全），密钥长度 2048–4096 位。
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
