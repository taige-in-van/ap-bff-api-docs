# 登录与注册 —— 调用时序

> 怎么读本文、各份 flows 共用的约定，见 [API 基础约定](../../conventions.html)「flows 怎么读」。本文的页面都在登录前：除登录页进入时读当前会话（#12，带浏览器已有的会话 cookie）外，调的都是公开端点（`security: []`），不要求会话、不带 `X-CSRF-Token`，也没有当前商户；登录提交（含二次校验、扫码发起与轮询）时本浏览器的会话若仍有效，后端不处理这次提交、回 `409`·`208042`，页面处理见「页面：Login」失败处理表。

## 本文的页面

| 页面 | 从哪进 | 本文章节 |
|---|---|---|
| Login | 未登录时打开商户后台；其他页面的「回登录页」 | [页面：Login](#页面：Login) |
| Forgot Password | Login 页的 Forgot password | [页面：Forgot Password](#页面：Forgot%20Password) |
| Sign Up | Login 页的 Sign up；带来源参数的注册链接 | [页面：Sign Up](#页面：Sign%20Up) |
| Verify your email | 注册提交成功后；登录遇 `208029` | [页面：Verify your email](#页面：Verify%20your%20email) |
| 邮箱激活 | 验证邮件里的链接 | [页面：邮箱激活](#页面：邮箱激活) |
| Set your password | 员工邀请邮件、代客建档的开户设密邮件、运营发出的重置密码邮件里的设密链接 | [页面：Set your password](#页面：Set%20your%20password) |
| 确认新登录邮箱 | Owner 改了员工的登录邮箱后，新邮箱收到的确认链接 | [页面：确认新登录邮箱](#页面：确认新登录邮箱) |
| 代登落地页 | 运营在管理后台代登商户时新开的窗口 | [流程：代登进入商户后台](#流程：代登进入商户后台) |

## 页面流转

## 接口

| op# | operationId | method + path | 用途 |
|---|---|---|---|
| 1 | [`login`](../auth/index.html#tag/sessions/operation/login) | `POST /auth/sessions` | 密码登录(200 返回 ESTABLISHED / MFA_REQUIRED；不签发会话的情形走 403 + 码) |
| 2 | [`completeMfaChallenge`](../auth/index.html#tag/sessions/operation/completeMfaChallenge) | `POST /auth/sessions/mfa` | 登录二次校验(提交 TOTP) |
| 3 | [`initiateWechatLogin`](../auth/index.html#tag/sessions/operation/initiateWechatLogin) | `POST /auth/sessions/wechat` | 扫码登录发起(拿二维码票据) |
| 4 | [`pollWechatLogin`](../auth/index.html#tag/sessions/operation/pollWechatLogin) | `GET /auth/sessions/wechat/{qrTicket}` | 扫码登录轮询 |
| 5 | [`requestPasswordReset`](../auth/index.html#tag/password-resets/operation/requestPasswordReset) | `POST /auth/password-resets` | 找回密码发起(恒 202 反枚举) |
| 6 | [`confirmPasswordReset`](../auth/index.html#tag/password-resets/operation/confirmPasswordReset) | `POST /auth/password-resets/{challengeId}/confirmation` | 验证码 + 新密码一次提交(唯一核码点;不改 MFA) |
| 7 | [`registerOwner`](../auth/index.html#tag/registrations/operation/registerOwner) | `POST /auth/registrations` | 自助注册 |
| 8 | [`resendVerificationEmail`](../auth/index.html#tag/registrations/operation/resendVerificationEmail) | `POST /auth/registrations/verification-email` | 重发验证邮件 |
| 9 | [`verifyRegistrationEmail`](../auth/index.html#tag/registrations/operation/verifyRegistrationEmail) | `POST /auth/registrations/verification` | 邮箱激活(核对注册密码，不建会话，回登录页) |
| 10 | [`acceptInvitation`](../auth/index.html#tag/registrations/operation/acceptInvitation) | `POST /auth/registrations/invitation` | 受邀员工设密激活(不建会话，回登录页) |
| 11 | [`confirmMemberLoginEmail`](../auth/index.html#tag/registrations/operation/confirmMemberLoginEmail) | `POST /auth/registrations/email-confirmation` | 员工确认 Owner 改的新登录邮箱(邮件链接落地页) |
| 12 | [`getCurrentSession`](../auth/index.html#tag/sessions/operation/getCurrentSession) | `GET /auth/sessions/current` | 进入登录页时读当前会话(已登录则不展示表单) |
| 13 | [`establishImpersonationSession`](../auth/index.html#tag/sessions/operation/establishImpersonationSession) | `POST /auth/sessions/impersonation` | 代登落地页凭交接码建代登会话 |

## 页面：Login

一张卡片两种模式：账号密码（默认）和扫码（右上角切换）。页面上的「Keep me signed in」对应 `rememberMe`：勾了关掉浏览器后仍保持登录，不勾则随浏览器关闭结束；两种情况都有同一个最长有效期，到期要重新登录。「Forgot password」进忘记密码页，「Sign up」进注册页。进入页面先调 #12 读当前会话：会话有效直接进登录后页面、不展示表单；无有效会话（`401`）或取不到当前商户（`403`·`208028`）才展示表单。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 登录页(SPA)
    participant A as 商户后台 BFF
    participant W as 微信

    U->>S: 打开登录页
    S->>A: #35;12 [getCurrentSession]<br/>GET /auth/sessions/current
    alt 200 会话有效
        A-->>S: 200 { 当前会话 }
        Note over S,A: 不展示表单，直接走登录后的启动链路
    else 401 无有效会话
        A-->>S: 401
        S->>U: 展示登录卡片
    else 403·208028 取不到当前商户
        A-->>S: 403·208028
        S->>U: 展示登录卡片
    end

    Note over U,A: 模式一：账号密码
    U->>S: 输登录名（邮箱或用户名）+ 密码，勾不勾 Keep me signed in
    S->>A: #35;1 [login]<br/>POST /auth/sessions
    alt 未启 MFA
        A-->>S: 200 { status: ESTABLISHED } + Set-Cookie
    else 已启 MFA
        A-->>S: 200 { status: MFA_REQUIRED, mfaChallenge }（未建会话）
        S->>U: 同一卡片切到「输入验证器 6 位码」
        U->>S: 输 6 位码
        S->>A: #35;2 [completeMfaChallenge]<br/>POST /auth/sessions/mfa { mfaChallenge, code, rememberMe }
        A-->>S: 200 { status: ESTABLISHED } + Set-Cookie
    end

    Note over U,W: 模式二：扫码（不追加 MFA）
    S->>A: #35;3 [initiateWechatLogin]<br/>POST /auth/sessions/wechat
    A-->>S: 200 { qrTicket, qrContent, expiresAt }
    S->>S: 用 qrContent 渲染二维码
    par 用户在手机上
        U->>W: 微信扫码，在微信里确认登录
    and 页面轮询
        loop 直到不是 WAITING
            S->>A: #35;4 [pollWechatLogin]<br/>GET /auth/sessions/wechat/{qrTicket}
            A-->>S: 200 { status: WAITING / EXPIRED / ESTABLISHED }
        end
    end
    Note over S,A: EXPIRED：重新调 #35;3 换码继续等<br/>ESTABLISHED：已 Set-Cookie

    Note over S,A: 两种模式登录成功后都走登录后的启动链路决定下一页<br/>（见 flows 03-shell-dashboard「流程：登录后的启动链路」）
```

失败怎么处理（按错误码分流，三条 `403` 文案各不相同）：

| 情形 | 响应 | 页面动作 |
|---|---|---|
| 密码错 / 账号不存在 / 不能登录商户后台（不区分） | `400`·`206012` | 留在表单提示「登录凭据错误」 |
| 验证器码错 | `400`·`206012` | 留在输码框重输，不回第一步 |
| MFA 挑战过期 | `410`·`206006` | 回账号密码步重新登录 |
| 账号被锁（连续失败） | `423`·`966001` | 提示等冷却 |
| 邮箱未验证（自助注册待验） | `403`·`208029` | 跳「Verify your email」页，可重发（明文邮箱用表单里的 `loginId`） |
| 账号被禁用 | `403`·`208027` | 提示「账号已禁用，请联系 Owner 或客服」 |
| 取不到当前商户（如商户全被冻结或删除） | `403`·`208028` | 提示「商户状态异常，请联系客服」 |
| 本浏览器已登录（如另一标签页已登录；#1 / #2 / #3 / #4 都可能回） | `409`·`208042` | 进入登录后的启动链路（同已登录访问登录页） |
| 限流 | `429` | 退避 |

- 失败计数与节流在后端，不回前端，页面不显示剩余次数。
- 登录提交时本浏览器会话仍有效（如另一标签页已登录）→ 后端不处理这次提交：不校验凭据、不建新会话，本浏览器原会话原样保留，回 `409`·`208042`；登录名、密码换成别的用户也一样，想换号须先登出，这次勾的 Keep me signed in 不生效。二次校验时另一标签页已登录，同样回此码，挑战任其过期；扫码发起时已登录不出码；轮询期间另一标签页已登录，下一次轮询即回此码，用户随后在微信里确认也不会建会话，这次扫码任其过期。其他设备 / 浏览器的会话不受影响。
- 受邀但还没设密的员工登录拿到 `206012`，恢复路径是邀请邮件和 Owner 重发。
- 扫码被拒（含能进的商户全部不可用）时页面一直显示等待直到过期，拒绝原因只在扫码本人的微信里说明：二维码可能被转发，看页面的未必是本人。

## 页面：Forgot Password

两步：输登录名 → 一屏填完验证码和新密码 → 成功。验证方式按登录名形态定，前端从输入内容就知道该提示哪种码：是邮箱格式的是邮箱账号，验证码发到该邮箱；否则是用户名账号，用验证器里的 6 位码（没开验证器的用户名账号不能自助重置，提示找 Owner）。进入页面不调接口。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 忘记密码页(SPA)
    participant A as 商户后台 BFF
    participant E as 邮箱 / 验证器

    Note over U,A: 第 1 步：输登录名
    U->>S: 输邮箱或用户名，点 Send Code
    S->>A: #35;5 [requestPasswordReset]<br/>POST /auth/password-resets
    A-->>S: 202 { challengeId, cooldownSeconds }（恒 202，不暴露账号是否存在）
    opt 邮箱账号且账号存在
        A->>E: 发 6 位验证码到该邮箱
    end

    Note over U,A: 第 2 步：验证码 + 新密码一屏提交
    S->>U: 提示：邮箱账号「已发 6 位码到 x***@y.com」/ 用户名账号「输入验证器里的 6 位码」
    U->>S: 输新密码 + 确认密码（前端校验 5 条规则和两次一致）
    E-->>U: 邮件里的码 / 验证器里的码
    U->>S: 最后输 6 位码，点 Reset Password
    S->>A: #35;6 [confirmPasswordReset]<br/>POST /auth/password-resets/{challengeId}/confirmation
    A-->>S: 204（码正确才消费，密码已改，该用户所有会话失效）
    opt 邮箱账号
        A->>E: 密码已修改通知
    end
    Note over U,S: Resend：冷却结束后重新调 #35;5，得到新 challengeId，旧码作废

    S->>U: 第 3 步：Password Reset!，点 Back to Login 回登录页
```

- 找回流程只在 `#6` 核一次码，没有单独的核码步：验证器码只在约 30 秒的窗口内有效，且同一个码只能成功验证一次，所以码放在这一屏最后输、输完即提交。
- 码错 `400`·`204010`（只在码的输入框重输，新密码不用重填）；挑战过期或已作废 `410`·`206006`（回第 1 步）；错码次数超限 `423`·`206007`（回第 1 步）；限流 `429`。
- `#6` 的响应丢了、重试拿到 `410`·`206006`：密码可能已经改好，提示用户用新密码登录，登录不上再重新发起。
- 重置后，开了验证器的账号下次登录仍要输验证器码。
- My Profile 里的「忘记密码」用同样两个接口：登录态下用当前登录名调 `#5`，再在弹窗里一次提交码和新密码调 `#6`。

## 页面：Sign Up

从登录页「Sign up」进入，或从带来源参数的注册链接进入（如 Moneris 引导邮件里的 `?ref=MONERIS`，前端把来源预填进 Referred By 并锁定；没有来源参数时 Referred By 可手填）。表单：First / Last Name、Phone（区号 + 号码）、Email（作登录 ID）、Password、Business Title（下拉 Business Owner / Manager / Employee / Other，选 Other 改为自填）、Referred By（可选）、协议勾选。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 注册页(SPA)
    participant A as 商户后台 BFF
    participant E as 邮箱

    U->>S: 打开注册页（不调接口，区号候选取自前端参考数据）
    U->>S: 填表、勾协议，点 Create Account（前端校验邮箱格式、密码 5 条规则、协议已勾）
    S->>A: #35;7 [registerOwner]<br/>POST /auth/registrations
    alt 新邮箱，或该邮箱已有待验证账号
        A-->>S: 201 { cooldownSeconds }
        A->>E: 发验证邮件（异步，投递失败不阻塞注册）
        S->>S: 进「验证邮箱页」，带上表单里的 email
    else 该邮箱已被其他账号使用（含邀请中、已停用）
        A-->>S: 409·968001
        S->>U: 提示换邮箱，或去登录页
    end
```

- 注册一次建齐：待验证账号（邮箱未验证、不能登录）、申请中的商户、入驻申请草稿。First / Last Name、Phone、Business Title 记在账号上，Referred By 写进商户资料，入驻向导 Step 1 预填。
- 该邮箱已有待验证账号时再注册按覆盖处理（见 `registerOwner`），页面与新建一样进验证邮箱页；在重发冷却内不发新邮件，旧链接仍有效。
- 覆盖只改密码和资料，不会让别人掌握激活后的账号：激活时要输入注册密码，以最后一次注册的为准（见「页面：邮箱激活」）。
- 区号不在服务端白名单内、或其他字段校验不过 `400`，按错误体逐项提示；限流 `429`。

## 页面：Verify your email

注册提交成功后进入，或登录时遇 `208029`（邮箱未验证）进入。页面显示「已发验证邮件到 {email}」、Resend 和回登录页的按钮，`email` 用上一页表单里的值。进入页面不调接口。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 验证邮箱页(SPA)
    participant A as 商户后台 BFF
    participant E as 邮箱

    U->>S: 从注册页或登录页进入（不调接口）
    S->>S: 从注册页来：按 cooldownSeconds 倒计时，结束前 Resend 置灰<br/>从登录页来：Resend 直接可点
    U->>S: 点 Resend
    S->>A: #35;8 [resendVerificationEmail]<br/>POST /auth/registrations/verification-email
    A-->>S: 202 { cooldownSeconds }（恒 202，不暴露账号是否存在）
    opt 账号存在、待验证、不在冷却内
        A->>E: 发新验证邮件，旧链接作废
    end
    S->>S: 重新倒计时
    Note over U,E: 用户去邮箱点链接，打开「邮箱激活页」
```

- 重发不延长清理期限：待验证账号从注册时刻起，默认 24 小时（部署参数）未验证即清理，账号和申请中的商户一并标删除，同一邮箱可重新注册。
- 限流 `429`：退避。

## 页面：邮箱激活

邮件里的链接打开这一页，链接带一次性令牌。打开页面只展示、不调接口，这样邮件客户端预取链接不会误激活。页面上有一个「注册密码」输入框，用户输入注册时设的密码后点 Verify Email 才提交。

```mermaid
sequenceDiagram
    actor U as 用户
    participant S as 邮箱激活页(SPA)
    participant A as 商户后台 BFF
    participant E as 邮箱

    U->>S: 点邮件里的链接打开本页（不调接口）
    U->>S: 输入注册密码，点 Verify Email
    S->>A: #35;9 [verifyRegistrationEmail]<br/>POST /auth/registrations/verification { token }
    alt 令牌有效且密码正确，或令牌已用过（账号已激活）
        opt 首次激活
            A->>E: 发 Email Verified 通知
        end
        A-->>S: 204
        S->>U: Email verified，点 Log in 回登录页
    else 密码不对
        A-->>S: 400·206012（令牌不消费）
        S->>U: 留在本页，清空密码框重输
    else 令牌无效、过期或已被重发作废
        A-->>S: 410·206001
        S->>U: 提示链接已失效，引导去登录页（登录会被带到验证邮箱页重发）或重新注册
    end
    Note over U,A: 用户在登录页用邮箱 + 密码登录，走登录后的启动链路，新商户落到入驻向导
```

- 激活后回登录页用密码登录；同一链接点第二次仍返回 `204`，页面照常引导去登录。商户和入驻申请草稿在注册时已建好。
- 密码错误次数达上限 `423`·`206007`：该链接锁定，冷却结束后在验证邮箱页 Resend（从登录页进入）或重新注册拿新链接。忘了密码就重新注册，用新密码确认。

**相对 demo 的改动**

| demo | 本契约 | 原因 |
|---|---|---|
| 无此页 | 激活时要输注册密码 | 同一邮箱待验证时允许重复注册覆盖密码，只凭链接激活的话，别人在 Jane 注册后用她的邮箱再注册一次，Jane 点自己的链接就会激活一个对方知道密码的账号 |

## 页面：Set your password

Owner 在 Users 页用邮箱新建员工时发出邀请邮件（`createTeamMember`），员工点邮件里的「Set your password」链接打开这一页。链接带一次性令牌和被邀请的邮箱，页面显示「为 {email} 设置密码」。打开页面只展示、不调接口。

同一页还承接两种设密链接，调用与失败处理相同：工作人员代为建档的商户审核通过后，Owner 收到的开户设密链接（设密后账号激活）；运营在管理后台为已激活成员发出的重置密码链接（账号本就可用，设密成功即旧密码失效、已登录的会话全部失效，设密前旧密码照常可用）。

```mermaid
sequenceDiagram
    actor U as 员工
    participant S as 邀请设密页(SPA)
    participant A as 商户后台 BFF

    U->>S: 点邀请邮件里的链接打开本页（不调接口，邮箱取自链接参数）
    U->>S: 输新密码 + 确认密码（前端校验 5 条规则和两次一致），点 Set password
    S->>A: #35;10 [acceptInvitation]<br/>POST /auth/registrations/invitation { token }
    alt 令牌有效
        A-->>S: 204（账号已激活）
        S->>U: You're all set，点 Go to Login 回登录页
    else 令牌已用过（该员工已激活）
        A-->>S: 410·206010
        S->>U: 提示已设置过密码，去登录页
    else 令牌无效或过期
        A-->>S: 410·206009
        S->>U: 提示链接已失效，请联系 Owner 重发邀请
    end
```

- 设密成功后员工回登录页自己登录。邮箱随之标为已验证，因为链接只发到这个邮箱。
- 用过的链接再提交返回 `206010` 而不是 `204`：这次提交带着新密码，返回成功会让员工以为新密码生效了。
- 开户设密链接与重置密码链接失效（`206009`）时，提示联系为其开户或发出链接的工作人员，而不是联系 Owner。

## 页面：确认新登录邮箱

Owner 在 Users 页改了已激活员工的登录邮箱后，新邮箱收到确认链接，员工点开这一页。打开页面只展示、不调接口；员工点 Confirm 才提交。

```mermaid
sequenceDiagram
    actor U as 员工
    participant S as 确认页(SPA)
    participant A as 商户后台 BFF
    participant EO as 员工旧邮箱

    U->>S: 点新邮箱里的链接打开本页（不调接口）
    U->>S: 点 Confirm
    S->>A: #35;11 [confirmMemberLoginEmail]<br/>POST /auth/registrations/email-confirmation { token }
    alt 令牌有效
        A->>EO: 安全通知：登录邮箱已改
        A-->>S: 204（已切换为新邮箱）
        S->>U: 回登录页，用新邮箱登录
    else 链接无效、过期或已被 Owner 的新改动顶掉
        A-->>S: 410·206006
        S->>U: 提示链接已失效，请联系 Owner
    else 确认前新邮箱已被别人使用
        A-->>S: 409·968001
        S->>U: 提示这次改动已作废，请联系 Owner 换一个邮箱
    end
```

- 新邮箱确认前不能用来登录或找回密码。
- 确认后员工回登录页自己登录。

## 流程：代登进入商户后台

运营在管理后台商户详情点代登，管理后台新开窗口打开商户后台的代登落地页，地址的 fragment 带一次性交接码（`…/impersonate#code=…`）。落地页从 fragment 取出交接码建会话，之后与普通登录后一样进商户后台。

```mermaid
sequenceDiagram
    actor U as 运营
    participant S as 代登落地页(SPA)
    participant A as 商户后台 BFF

    U->>S: 新开窗口打开落地地址
    S->>A: #35;13 [establishImpersonationSession]<br/>POST /auth/sessions/impersonation
    alt 交接码有效
        A-->>S: 200 { merchantId, isOwner, privileges }（已 set-cookie）
        S->>A: #35;12 [getCurrentSession]<br/>GET /auth/sessions/current
        A-->>S: 200
        S->>U: 进商户后台首页（不显示商户切换）
    else 本浏览器已登录商户后台
        A-->>S: 409·208042
        S->>U: 提示先登出该浏览器的商户后台，再回管理后台重新发起代登
    else 交接码无效、已用过或已过期
        A-->>S: 410·206019
        S->>U: 提示回管理后台重新发起代登
    end
```

- 交接码只能用一次、短时有效：用过后刷新落地页进不来，须回管理后台重新发起。
- 本浏览器已有有效的商户后台会话时，后端不处理这次代登：不消费交接码、不建会话，原会话原样保留。
- 代登会话只能停在被代的商户，权限按该商户 Owner 算；会话到期即结束、不续期，回管理后台重新发起。
- 进入后的启动链路同普通登录（见 [flows 03-shell-dashboard「流程：登录后的启动链路」](03-shell-dashboard.html#流程：登录后的启动链路)）。

| 情形 | 响应 | 页面 |
|---|---|---|
| 本浏览器已登录商户后台 | `409`·`208042` | 提示先登出该浏览器的商户后台，再回管理后台重新发起代登 |
| 交接码无效、已用过或已过期 | `410`·`206019` | 提示回管理后台重新发起代登 |
