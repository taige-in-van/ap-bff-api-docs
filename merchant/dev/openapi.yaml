openapi: 3.1.0
info:
  title: 商户后台 开发者 — 前端契约面
  version: 0.6.6
  contact:
    name: 商户后台 BFF
  description: |
    开发者前端契约：API 凭据区（Merchant Code 明文 + Gateway Credential 默认脱敏 / 按需授权 reveal 完整值 / 复制）+
    集成参数区（Gateway URL + Verification Type=RSA2 只读）+ 签名密钥区（商户 RSA2 公钥登记 / 替换 / 查看 / 复制 + 平台公钥查看 / 复制）。

    merchant scope 从会话取、不信请求体；全部 op merchant-current-scoped，均挂 MerchantContextGuard（stale-tab 守卫，无豁免）。

    **接入文档外链无端点**：开发者页的文档入口由前端按当前 locale 选址、缺失回退默认地址，**本契约不提供取址接口**——⚠️ 前端不要假设已有接口。

    字段类型以本 spec 为准。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: credentials
    description: API 凭据：Merchant Code + Gateway Credential（默认脱敏 / 授权 reveal 完整值）+ 集成参数（Gateway URL + Verification Type）。
  - name: signing-keys
    description: 签名密钥：商户 RSA2 公钥登记 / 替换（触发轮换宽限期）+ 平台公钥（只读）。
paths:
  /developer/overview:
    get:
      tags:
        - credentials
      operationId: getDeveloperOverview
      summary: 读开发者页聚合（凭据 + 集成参数 + 签名密钥态 + 平台公钥）
      description: |
        返回当前商户开发者页聚合：

        - Merchant Code（明文公开标识）、
        - Gateway Credential **默认脱敏**（末 4 位；展示**不触发**访问审计；未签发 / 已吊销 → status=unavailable）、
        - Gateway URL + Verification Type=RSA2（只读集成参数）、
        - 商户签名公钥态（registered 携公钥 PEM + keyVersion，或 unset）、
        - 平台公钥（current PEM + keyVersion；未发布则不返回该键）。

        **完整 Gateway Credential 不在本聚合返回**——按需走 revealGatewayCredential（受审计）。

        Merchant Code / 平台公钥 / 已登记的商户公钥均非秘密、直接明文返回供 Copy。

        **聚合任一来源加载失败 → 整体 500、绝不返回部分凭据**（前端据此走占位 / 错误态）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 开发者页聚合
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeveloperOverview'
              example:
                merchantCode: C3BM68
                gatewayCredential:
                  status: available
                  masked: ••••4821
                gatewayUrl: https://gateway.example.com/api
                verificationType: RSA2
                merchantSigningKey:
                  status: registered
                  keyVersion: 2
                  publicKeyPem: |-
                    -----BEGIN PUBLIC KEY-----
                    MIIBIjANBg...
                    -----END PUBLIC KEY-----
                  rotationGrace: false
                platformPublicKey:
                  keyVersion: 1
                  publicKeyPem: |-
                    -----BEGIN PUBLIC KEY-----
                    MFwwDQYJ...
                    -----END PUBLIC KEY-----
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /developer/gateway-credential/disclosures:
    post:
      tags:
        - credentials
      operationId: revealGatewayCredential
      summary: 授权披露 Gateway Credential 完整值（reveal / copy；受审计）
      description: |
        按需返回当前商户 Gateway Credential **完整明文**（仅当前有效值；历史 / 上一版本值不返回）——**受审计**。

        **每次披露均记录访问审计**（accessType=reveal|copy）——**copy 亦经本端点**（避免「已显示明文后再在客户端 copy」的审计盲区）。
        每次披露都受审计；**审计未能落地时不披露 → 500**（可重试，重试成功即正常返回完整值）。

        响应 `Cache-Control: no-store`；完整值全链路禁记录（不进日志 / trace / 缓存）。

        - credential 未签发 / 已吊销 → 409 208014（无明文；overview 已标 unavailable，此为竞态兜底）；
        - 凭据服务暂不可用 → 502/504（fail-closed，不返回部分值）。

        非幂等（每次披露刻意各自留痕），不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - accessType
              properties:
                accessType:
                  type: string
                  enum:
                    - reveal
                    - copy
                  description: 访问意图（查看完整值 / 复制完整值）——仅供审计区分，二者均返回完整明文
            example:
              accessType: reveal
      responses:
        '200':
          description: 完整 Gateway Credential（已审计；no-store）
          headers:
            Cache-Control:
              description: 恒 no-store（秘密不缓存）
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayCredentialDisclosure'
              example:
                gatewayCredential: EXAMPLE-CREDENTIAL-VALUE
                accessType: reveal
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208014
  /developer/signing-key:
    put:
      tags:
        - signing-keys
      operationId: replaceMerchantSigningKey
      summary: 登记 / 替换商户签名公钥（RSA2 PEM；替换即触发轮换宽限期）
      description: |
        登记或替换当前商户的 RSA2 签名公钥（PEM）——供开放 API 验证商户**入站**请求签名。**登记 = 替换**（覆盖当前唯一一把公钥）。

        **请求体即目标本身**：`publicKeyPem` 全量覆盖、缺省不代表「保持原样」;`expectedKeyVersion` 是前置校验、不是目标的一部分（两个字段均必传）。

        **上游不可用（`502` / `504`）时「是否已写入」不确定**——`504` 尤其可能发生在写提交之后,**不要向用户断言「未写入」**;正确动作是重载最新公钥态确认后再决定要不要重发（同一 PEM 重提交是幂等 no-op,见下）。

        **并发 / 幂等（判定顺序）**：

        ① 提交的公钥**与当前公钥相同** → **幂等 no-op 成功**（不新 `keyVersion` / 不重启轮换宽限期 / 不重复审计，与 `expectedKeyVersion` 无关）；

        ② **与当前公钥不同** → 按 `expectedKeyVersion` 版本校验：与当前版本一致才替换（落新 `keyVersion`；公钥由商户提交，平台不生成密钥），不一致（旧页 / 他人已改）→ **409 208004**、前端重载重试。

        **相同公钥重复提交在效果上幂等；不同公钥替换对提交顺序敏感。**

        服务端先校验可解析为 RSA2 公钥（空 / 非 PEM / 非 RSA2 → 400 204011，直接拒绝、不产生任何变更）；合法 → 替换生效并 **触发轮换宽限期**（新旧公钥并验、宽限期后仅新钥），并留密钥变更审计。

        **活跃轮换宽限期内不接受再次替换**（上次替换的旧钥仍在宽限期内 → **409 208015**、须待宽限结束；当前公钥与宽限期不受影响；应急强制轮换由平台侧处理、不在本端点）。

        **判定顺序**：与当前公钥相同 → no-op；不同 → 先版本校验（不一致 → 208004）→ 通过后再判活跃宽限期（活跃 → 208015，否则替换）。

        本端点只管商户自有公钥（非秘密、可回显）；不提供清除 / 解绑。

        **不挂幂等键、客户端不应盲目自动重试**：对较旧的不同公钥盲目重试会覆盖较新公钥，由 `expectedKeyVersion` 版本前置校验拦截（不一致 → **409 208004**），失败应由用户重新发起。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - publicKeyPem
                - expectedKeyVersion
              properties:
                publicKeyPem:
                  type: string
                  minLength: 1
                  description: 商户 RSA2 公钥（PEM；服务端校验可解析）
                expectedKeyVersion:
                  type:
                    - integer
                    - 'null'
                  minimum: 1
                  description: |
                    提交时所依据的基线版本（防旧页 / 多操作员互相覆盖）：**null = 首次登记（期望当前未登记）**、 **N = 替换（期望当前 keyVersion = N）**。⚠️ 这里的 `null` 是**前置条件取值**、**不是公共约定里「要清空某个字段就显式传 `null`」那个** `null`—— 已登记状态下传 `null` 会被判为基线不符而拒绝,不是「跳过版本校验」。与当前公钥版本不符（已被他人登记 / 替换）→ 409 208004、 前端重载最新公钥态后再试。
            example:
              publicKeyPem: |-
                -----BEGIN PUBLIC KEY-----
                MIIBIjANBg...
                -----END PUBLIC KEY-----
              expectedKeyVersion: 2
      responses:
        '200':
          description: 已登记 / 替换（返回当前公钥态）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantSigningKeyRegistered'
              example:
                status: registered
                keyVersion: 3
                publicKeyPem: |-
                  -----BEGIN PUBLIC KEY-----
                  MIIBIjANBg...
                  -----END PUBLIC KEY-----
                rotationGrace: true
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204011
        - 208001
        - 208004
        - 208015
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 商户级读写另挂 MerchantContextGuard 守卫（见下方 parameters）。
  schemas:
    DeveloperOverview:
      type: object
      additionalProperties: false
      required:
        - merchantCode
        - gatewayCredential
        - verificationType
        - merchantSigningKey
      properties:
        merchantCode:
          type: string
          minLength: 1
          description: 商户公开身份标识（Merchant Code；明文、可 Copy）
        gatewayCredential:
          $ref: '#/components/schemas/GatewayCredentialMasked'
        gatewayUrl:
          type: string
          format: uri
          description: 适用当前商户接入环境的网关基址（平台配置、只读）；**未配置则不返回本键**，前端走占位态
        verificationType:
          type: string
          const: RSA2
          description: 签名验证类型（只读；封闭常量，取值固定）
        merchantSigningKey:
          $ref: '#/components/schemas/MerchantSigningKeyState'
        platformPublicKey:
          description: 平台公钥（current；供商户验出站回调 / 响应签名）；**未发布则不返回本键**
          allOf:
            - $ref: '#/components/schemas/PlatformPublicKey'
        platformPublicKeyGrace:
          description: 平台密钥轮换宽限期内的旧版本公钥（含 keyVersion；商户据响应 / Webhook `Signature` 头 `keyVersion` 选对应公钥验签）。**无活跃宽限期则不返回本键**。
          allOf:
            - $ref: '#/components/schemas/PlatformPublicKey'
    GatewayCredentialMasked:
      description: |
        Gateway Credential 脱敏态（默认展示；完整值走 revealGatewayCredential）。按 status 判别机器约束： **available 必携 masked、unavailable 无 masked**（封闭枚举，取值集固定、可穷举分支）。
      oneOf:
        - $ref: '#/components/schemas/GatewayCredentialAvailable'
        - $ref: '#/components/schemas/GatewayCredentialUnavailable'
      discriminator:
        propertyName: status
        mapping:
          available: '#/components/schemas/GatewayCredentialAvailable'
          unavailable: '#/components/schemas/GatewayCredentialUnavailable'
    GatewayCredentialAvailable:
      type: object
      additionalProperties: false
      required:
        - status
        - masked
      properties:
        status:
          type: string
          const: available
        masked:
          type: string
          minLength: 1
          description: 脱敏串（如 `••••4821`、末 4 位）——非秘密显示提示、展示不触发审计（available 必非空）
    GatewayCredentialUnavailable:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: unavailable
          description: 未签发 / 已吊销（无脱敏值、reveal 不可用）
    GatewayCredentialDisclosure:
      type: object
      additionalProperties: false
      required:
        - gatewayCredential
        - accessType
      properties:
        gatewayCredential:
          type: string
          minLength: 1
          description: Gateway Credential 完整明文（current；受审计返回、no-store、全链路禁记录）
        accessType:
          type: string
          enum:
            - reveal
            - copy
          description: 本次披露意图（回显请求值）
    MerchantSigningKeyState:
      description: 商户签名公钥态（registered 携公钥 PEM + keyVersion；unset 未登记）。
      oneOf:
        - $ref: '#/components/schemas/MerchantSigningKeyRegistered'
        - $ref: '#/components/schemas/MerchantSigningKeyUnset'
      discriminator:
        propertyName: status
        mapping:
          registered: '#/components/schemas/MerchantSigningKeyRegistered'
          unset: '#/components/schemas/MerchantSigningKeyUnset'
    MerchantSigningKeyRegistered:
      type: object
      additionalProperties: false
      required:
        - status
        - keyVersion
        - publicKeyPem
        - rotationGrace
      properties:
        status:
          type: string
          const: registered
        keyVersion:
          type: integer
          minimum: 1
          description: 当前公钥版本（每次替换递增；轮换宽限期语义见 replaceMerchantSigningKey）
        publicKeyPem:
          type: string
          minLength: 1
          description: 商户当前 RSA2 公钥 PEM（非秘密、可查看 / 复制）
        rotationGrace:
          type: boolean
          description: '**当前是否处于轮换宽限期**（新旧公钥并验）。**字段恒在**。 为 `true` 时**再次替换会被拒**——前端据此预先禁用替换入口，而不是让用户提交后才撞 `409 208015`。 宽限期何时结束不在本接口给出。'
    MerchantSigningKeyUnset:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: unset
          description: 未登记（引导登记；无回到未登记的转换——不提供清除 / 解绑）
    PlatformPublicKey:
      type: object
      additionalProperties: false
      required:
        - keyVersion
        - publicKeyPem
      properties:
        keyVersion:
          type: integer
          minimum: 1
          description: 该平台公钥的版本号（商户据响应 / Webhook `Signature` 头 `keyVersion` 选用对应公钥）
        publicKeyPem:
          type: string
          minLength: 1
          description: 平台公钥 PEM（只读、可复制）
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            currentMerchantId:
              type: string
              description: 服务端会话当前商户（≠ 请求携带的 expected `X-Merchant-Context`），供前端 re-sync；**无当前商户则不返回本键**（前端须重选）。
            maskedEmail:
              type: string
              description: 已遮蔽的邮箱（形如 `j***@example.com`），**只作展示、不可回填表单**。
  parameters:
    MerchantContextGuard:
      name: X-Merchant-Context
      in: header
      required: true
      description: |
        stale-tab 一致性守卫（读写统一）：页面预期的当前商户 ID。与会话当前商户比对，一致才执行；不一致时**读不返回错商户数据、写不执行**，并按下面两种情形二分：

        - **① 会话有当前商户、只是与 expected 不同 → `409` · `208001`（`MERCHANT_CONTEXT_CHANGED`）**，响应 `context.currentMerchantId` 回显服务端当前商户供前端直接 re-sync；
        - **② 会话没有当前商户（无可回显者）→ `409` · `208022`（`MERCHANT_NOT_ACCESSIBLE`）**，前端重跑启动链路按 `routeTo` 分流（见 API 基础约定「merchant scope + stale-tab 守卫」）。

        挂在所有依赖当前商户的读 + 写接口；前端统一 interceptor 发送 + 处理 409（提示并刷新当前商户）。

        **豁免**：不依赖「当前商户」的接口——当前商户的 re-sync / 切换入口本身，以及目标由 path 直接指定、与当前商户无关的接口。

        某个接口挂没挂本 header，**看该接口的 `parameters` 即可**（挂了就是必带）。
      schema:
        type: string
        minLength: 1
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: \S
  responses:
    MerchantBffDefaultError:
      description: |
        非 2xx 统一错误响应——覆盖所有未在本 op 显式列出的状态码。

        HTTP status 只表达大类，**具体子因看响应体的整数** `code`：

        - 该 op 承诺的业务码见其 `x-error-codes`，
        - 码的**固有属性**（`name` / `httpStatus` / `retryable` / 必带 context 字段）见**随包错误码表**；
        - **该码在本接口下意味着什么、你该怎么处理，见本接口自己的说明**（怎么读见 API 基础约定「错误响应体」）。

        部分码另带 `context` 结构化上下文（如 stale-tab 守卫 `208001` 必携 `context.currentMerchantId` 供前端 re-sync 当前商户）——哪些码必携哪些字段，以码表的 `requiredContextFields` 为准，**不要按状态码猜**。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
