      properties:
        name:
          type: string
          minLength: 1
          maxLength: 256
        currency:
          $ref: '#/components/schemas/Currency'
        checkoutOptions:
          type: array
          minItems: 1
          description: 整组置换。新加的项规则同创建；已选着、后来停用的项可以原样带回。
          items:
            $ref: '#/components/schemas/CheckoutOption'
        buyerInputKeys:
          type: array
          description: 同创建，以详情的 `buyerInputs` 为起点。顺序即付款人页面的展示顺序。
          items:
            $ref: '#/components/schemas/InfoFieldKey'
        recipientInputKeys:
          type: array
          description: 同创建，只有礼卡可带。顺序即付款人页面的展示顺序。
          items:
            $ref: '#/components/schemas/InfoFieldKey'
        remark:
          type:
            - string
            - 'null'
          maxLength: 512
          description: '`null` 清空。'
        bannerFileId:
          oneOf:
            - $ref: '#/components/schemas/FileId'
            - type: 'null'
          description: 换 Banner 传新的 `fileId`；`null` = 移除。
        enabled:
          type: boolean
          description: 启停。停用后付款人打开链接看到活动已结束；礼卡切换会让限购计数重新开始。
        giftcard:
          allOf:
            - $ref: '#/components/schemas/GiftcardContent'
          description: 礼卡内容，只有礼卡链接可带。
        product:
          allOf:
            - $ref: '#/components/schemas/ProductContent'
          description: 商品内容，只有商品链接可带。
        ticket:
          allOf:
            - $ref: '#/components/schemas/TicketContent'
          description: 票务内容，只有票务链接可带。
    ProductLinkListItem:
      type: object
      additionalProperties: false
      required:
        - linkId
        - type
        - name
        - currency
        - itemPrices
        - enabled
        - createdAt
      properties:
        linkId:
          $ref: '#/components/schemas/LinkId'
        type:
          $ref: '#/components/schemas/ProductLinkType'
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        itemPrices:
          type: array
          description: 在售各项的售价，按创建顺序：商品 = 各商品单价，票务 = 各票档票价，礼卡 = 各面值档标价。
          items:
            $ref: '#/components/schemas/Money'
        cardValues:
          type: array
          description: 在售各面值档的面值，顺序同 `itemPrices`；仅礼卡返回。
          items:
            $ref: '#/components/schemas/Money'
        eventDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 活动日，仅票务返回。
        venue:
          type: string
          description: 场馆，仅票务返回。
        enabled:
          type: boolean
          description: false = 已停用。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    ProductLinkListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductLinkListItem'
    ProductLinkDefaults:
      type: object
      additionalProperties: false
      description: 新建链接时的初始值。
      required:
        - buyerInputs
        - recipientInputs
        - inputLimit
      properties:
        buyerInputs:
          type: array
          description: 买家采集项的默认集。
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
        recipientInputs:
          type: array
          description: 收件人采集项的默认集；只有礼卡非空，其他类型恒为空数组。
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
        inputLimit:
          $ref: '#/components/schemas/InputLimit'
    ProductLinkDetail:
      type: object
      additionalProperties: false
      description: 链接详情。共有字段在顶层，只返回 `type` 对应的内容段；`recipientInputs` 只有礼卡返回。
      required:
        - linkId
        - type
        - name
        - currency
        - enabled
        - createdAt
        - paymentUrl
        - checkoutOptions
        - buyerInputs
        - inputLimit
      properties:
        linkId:
          $ref: '#/components/schemas/LinkId'
        type:
          $ref: '#/components/schemas/ProductLinkType'
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        enabled:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        paymentUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 付款链接，也是二维码的内容。
        checkoutOptions:
          type: array
          description: 已选的支付方式，可能含后来停用的项（付款人看不到，重新开通后恢复）。展示时按 `listCheckoutOptions` 的顺序逐项显示、只显示在本列表里的；图标取自那里，名字按 `checkoutOption` 从前端多语言资源取，取不到显示那里的 `displayName`。
          items:
            $ref: '#/components/schemas/CheckoutOption'
        buyerInputs:
          type: array
          description: 这条链接当前保留的买家采集项，系统项与自撰项在同一个列表里。修改时以它为起点。
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
        recipientInputs:
          type: array
          description: 收件人采集项，只有礼卡返回。
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
        inputLimit:
          $ref: '#/components/schemas/InputLimit'
        remark:
          type: string
          description: 商户备注；没有不返回本键。
        bannerUrl:
          $ref: '#/components/schemas/WebUrl'
          description: Banner 的长效公开地址；没有不返回本键。
        policies:
          allOf:
            - $ref: '#/components/schemas/PoliciesAndSupportRead'
          description: 收款页政策条款；一项都没有时不返回本键。
        giftcard:
          allOf:
            - $ref: '#/components/schemas/GiftcardContentCompleteRead'
          description: 礼卡内容，仅礼卡返回。
        product:
          allOf:
            - $ref: '#/components/schemas/ProductContentCompleteRead'
          description: 商品内容，仅商品返回。
        ticket:
          allOf:
            - $ref: '#/components/schemas/TicketContentCompleteRead'
          description: 票务内容，仅票务返回。
    PartyRef:
      type: object
      additionalProperties: false
      description: 买家或收件人，取采集项里的姓名与邮箱；没填的键不返回。
      properties:
        name:
          type: string
        email:
          type: string
    ProductLinkOrderListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProductLinkOrderRow'
    ProductLinkOrderCounts:
      type: object
      additionalProperties: false
      description: 销售单列表三个筛选维度的项与计数；每个数组的项与单维度的 `QuickFilterCounts` 同形状（每项当期为 0 也返回，All 由前端补、数字 = 各项之和）。
      required:
        - status
      properties:
        status:
          type: array
          items:
            $ref: '#/components/schemas/QuickFilterItem'
        redemptionStatus:
          type: array
          description: 有平台核销的链接才返回。
          items:
            $ref: '#/components/schemas/QuickFilterItem'
        riskLevel:
          type: array
          description: 仅礼卡链接返回。
          items:
            $ref: '#/components/schemas/QuickFilterItem'
    ProductLinkOrderRow:
      type: object
      description: 销售单列表行。礼卡链接的行多返回 `campaignName` / `cardValue` / `recipient` / `credentialMasked` / `riskLevel`。
      required:
        - salesOrderId
        - orderId
        - amount
        - status
        - redemptionStatus
        - createdAt
      properties:
        salesOrderId:
          $ref: '#/components/schemas/SalesOrderId'
        orderId:
          $ref: '#/components/schemas/OrderId'
          description: 支付订单号，订单与退款契约 `getPayment` 的键。
        buyer:
          $ref: '#/components/schemas/PartyRef'
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 付款人应付总额，含客户服务费；标价币种。
        refundedAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 已退金额，大于 0 才返回。
        status:
          $ref: '#/components/schemas/SalesOrderStatus'
        redemptionStatus:
          $ref: '#/components/schemas/RedemptionStatus'
        redeemedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 核销完成时刻；已核销才返回。
        paidAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        campaignName:
          type: string
          description: 礼卡活动名，仅礼卡。
        cardValue:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 主卡面值，仅礼卡。
        recipient:
          allOf:
            - $ref: '#/components/schemas/PartyRef'
          description: 收件人，仅礼卡。
        credentialMasked:
          type: string
          description: 卡号或券号掩码，仅礼卡；未发放不返回本键。
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
    CollectedInput:
      type: object
      additionalProperties: false
      required:
        - key
        - label
        - value
      properties:
        key:
          type: string
        label:
          type: string
          description: 付款人下单时语言下的采集项标题。
        value:
          type: string
    ProductLinkOrderLine:
      type: object
      additionalProperties: false
      required:
        - itemId
        - itemName
        - unitPrice
        - quantity
        - lineAmount
      properties:
        itemId:
          $ref: '#/components/schemas/SalesItemId'
        itemName:
          type: string
          description: 下单时的名称快照。
        imageUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 下单时的图片快照；没有不返回本键。
        unitPrice:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          minimum: 1
        lineAmount:
          $ref: '#/components/schemas/Money'
    ProductLinkOrderVoucher:
      type: object
      additionalProperties: false
      description: 履约凭证。商品与票务整单一张；礼卡实体卡模式主卡、赠卡各一张，兑换券模式一张承载主卡与赠卡。
      required:
        - voucherNo
        - pin
        - kind
        - status
      properties:
        voucherNo:
          $ref: '#/components/schemas/VoucherNo'
          description: 券号；实体卡模式为卡号。
        pin:
          type: string
          description: PIN 明文。
        kind:
          allOf:
            - $ref: '#/components/schemas/SalesVoucherKind'
          description: '`MAIN` 主卡 / `BONUS` 赠卡（只出现在礼卡实体卡模式）。商品与票务恒为 `MAIN`。'
        faceAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 面额，只有礼卡返回；兑换券模式为主卡金额。
        bonusAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 同一张券承载的赠卡额；只在礼卡兑换券模式且有赠卡时返回。
        status:
          allOf:
            - $ref: '#/components/schemas/SalesVoucherStatus'
          description: '`ISSUED` 未核销 / `REDEEMED` 已核销 / `VOID` 已作废 / `CANCELLED` 退款后失效。'
        redeemedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 核销时刻；已核销才返回。
        operator:
          type: string
          description: 核销操作员显示名；未核销不返回本键。
        remark:
          type: string
          description: 核销备注；没有不返回本键。
    ProductLinkOrderLogEntry:
      type: object
      additionalProperties: false
      required:
        - time
        - type
      properties:
        time:
          $ref: '#/components/schemas/Timestamp'
        type:
          type: string
          enum:
            - ORDER_CREATED
            - PAYMENT_STARTED
            - PAID
            - REFUNDING
            - REFUNDED
            - RECEIPT_SENT
            - RECEIPT_RESENT
            - REDEEMED
            - VOIDED
            - RISK_LEVEL_CHANGED
            - CUSTOMER_BLACKLISTED
            - CUSTOMER_UNBLACKLISTED
            - RISK_AUDIT_PASSED
            - RISK_AUDIT_REJECTED
        actor:
          type: string
          description: 操作主体的显示名；系统动作不返回本键。
        remark:
          type: string
        notifyRecipient:
          type: string
          description: 凭证或收据的投递收件人，仅 `RECEIPT_SENT` / `RECEIPT_RESENT`。
    GiftcardOrderSegment:
      type: object
      additionalProperties: false
      description: 销售单详情的礼卡段。
      required:
        - brandName
        - campaignName
        - promotionType
        - purchaseType
        - cardValue
        - issuanceStatus
        - riskHits
        - actions
      properties:
        brandName:
          type: string
        campaignName:
          type: string
        promotionType:
          $ref: '#/components/schemas/GiftcardPromotionType'
        purchaseType:
          type: string
          enum:
            - SELF
            - GIFT
          description: '`SELF` 自购 / `GIFT` 送礼。'
        cardValue:
          $ref: '#/components/schemas/Money'
        discountAmount:
          $ref: '#/components/schemas/Money'
        bonusAmount:
          $ref: '#/components/schemas/Money'
        bonusNotes:
          type: string
        deliveryEmail:
          type: string
          description: 当前投递邮箱；重发改过就是改后的。
        issuanceStatus:
          type: string
          enum:
            - PENDING
            - ISSUED
            - SUSPENDED
            - CANCELLED
          description: '`PENDING` 待发放 / `ISSUED` 已发放 / `SUSPENDED` 发放失败待处理（等重试或人工补发；退款处理中不改这个值） / `CANCELLED` 已取消。'
        riskLevel:
          $ref: '#/components/schemas/RiskLevel'
        riskScore:
          type: integer
          minimum: 0
        riskHits:
          type: array
          description: 风控命中明细；没开风控审核或未命中为空数组。
          items:
            type: object
            additionalProperties: false
            required:
              - label
              - score
              - counted
            properties:
              label:
                type: string
              score:
                type: integer
              counted:
                type: boolean
                description: 是否计入订单分。
              matchedCategory:
                type: string
              matchedContent:
                type: string
        riskReleasedAt:
          $ref: '#/components/schemas/Timestamp'
        voidedAt:
          $ref: '#/components/schemas/Timestamp'
        actions:
          type: object
          additionalProperties: false
          description: 当前可做的动作，服务端的判定结果。
          required:
            - canVoid
            - canResendEmail
            - riskDispositions
          properties:
            canVoid:
              type: boolean
            canResendEmail:
              type: boolean
            riskDispositions:
              type: array
              items:
                $ref: '#/components/schemas/RiskDisposition'
    ProductLinkOrderDetail:
      description: 销售单详情：列表行的全部字段，加付款人填写值、订单行、凭证、礼卡段、动作日志。
      allOf:
        - $ref: '#/components/schemas/ProductLinkOrderRow'
        - type: object
          required:
            - refundable
            - buyerInputs
            - lines
            - vouchers
            - log
          properties:
            paymentMethodFamily:
              description: 支付方式（品牌）；已付才有。
              allOf:
                - $ref: '#/components/schemas/PaymentMethodFamily'
            customerId:
              type: string
              description: 付款人在平台的标识（Customer ID）；付款人还没识别出来时不返回本键。
            payerLanguage:
              type: string
              description: 付款人下单页语言；凭证与收据邮件按它发，礼卡送礼给收件人也用它。
            refundable:
              type: boolean
              description: 能否发起退款，服务端的判定结果，与支付订单的 `refundable` 同一判定：已核销、已作废或结算额待定的订单为 false。
            buyerInputs:
              type: array
              items:
                $ref: '#/components/schemas/CollectedInput'
            recipientInputs:
              type: array
              description: 送礼才有。
              items:
                $ref: '#/components/schemas/CollectedInput'
            lines:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/ProductLinkOrderLine'
            ticket:
              type: object
              additionalProperties: false
              description: 票务活动信息的下单时快照，仅票务。
              required:
                - eventDate
                - venue
              properties:
                eventDate:
                  $ref: '#/components/schemas/LocalDate'
                eventTime:
                  type: string
                venue:
                  type: string
            giftcard:
              $ref: '#/components/schemas/GiftcardOrderSegment'
            vouchers:
              type: array
              description: 尚未发放时为空数组。
              items:
                $ref: '#/components/schemas/ProductLinkOrderVoucher'
            log:
              type: array
              description: 按时间正序。
              items:
                $ref: '#/components/schemas/ProductLinkOrderLogEntry'
    CheckoutSettings:
      type: object
      additionalProperties: false
      required:
        - orderExpiryMinutes
        - customerServiceFeeEnabled
      properties:
        orderExpiryMinutes:
          allOf:
            - $ref: '#/components/schemas/OrderExpiryMinutes'
          description: 当前生效的订单有效期：商户设过就是商户的值，没设过是平台默认值。
        customerServiceFeeEnabled:
          type: boolean
          description: 是否把商户的手续费转给付款人承担。打开后付款人实付 = 能让商户扣完手续费后净得标价与小费的金额；费率就是商户各支付方式自己的费率（见 `getAccountService`），没有另外的加收费率。
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            orderAmountCeiling:
              $ref: '#/components/schemas/Money'
              description: 发起支付时总应付超过单笔上限时，生效的单笔上限（各层取最严后的值），币种是商户结算币种，可能与页面标价币种不同（页面按本键把数额说出来；拼进 `detail` 前端取不出来）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    StoreQrType:
      type: string
      enum:
        - standard
        - pre_auth
        - unionpay_qrc
      description: 店铺码的种类：`standard` 标准码 / `pre_auth` 预授权码 / `unionpay_qrc` 银联码（云闪付扫，不经收银台）。
    CheckoutOption:
      type: string
      minLength: 1
      description: 收银台上的支付方式选项：同一品牌、同一付款流程的支付方式归为一项（如 `wechat` 含线下、线上两个支付方式；支付宝线下、线上分 `alipay`、`alipay_online` 两项）。取值由后端目录决定，前端从所在面给出的候选集取来原样回传。
      examples:
        - wechat
    WebUrl:
      type: string
      pattern: ^https?://\S+$
      description: http 或 https 绝对地址。平台产出的文件 / 图片 / 付款链接地址与渠道给出的跳转地址共用。
    FileId:
      type: string
      minLength: 1
      maxLength: 32
      description: 文件引用：上传后返回的稳定标识。
    ProductLinkType:
      type: string
      enum:
        - product
        - ticket
        - giftcard
      description: '`product` 商品 / `ticket` 票务 / `giftcard` 礼卡。'
    FileUploadForm:
      type: object
      additionalProperties: false
      description: |
        上传入参(`multipart/form-data`)。文件经本平台中转存入对象存储;按 `purpose` 校验实际文件的格式与大小,不合规 → 400。

        不要手设 `Content-Type`:直接提交 `FormData`,由客户端带上 `boundary`。
      required:
        - file
        - purpose
      properties:
        file:
          type: string
          format: binary
          description: 文件本体。
        purpose:
          type: string
          description: 文件用途,决定允许的格式、大小上限与取用方式;每个上传入口只接受它所属业务范围内的用途。
    MerchantFilePurpose:
      type: string
      description: |
        文件用途目录——用途决定允许的格式、大小上限与取用方式；每个上传入口只接受它列出的子集，传入其他用途 → 400。

        | 用途 | 允许格式 | 大小上限 | 传上去之后怎么取用 |
        |---|---|---|---|
        | `onboarding_document` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（含身份与银行资料，仅授权主体可取） |
        | `void_cheque` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `store_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `office_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址 |
        | `merchant_logo` | PNG / JPEG | **512KB（固定上限）** | 长效稳定的公开地址（要展示给外部访客） |
        | `payment_page_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `link_banner` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `giftcard_brand_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `product_image` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `channel_application_material` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（渠道报备用的营业执照与网站截图，仅授权主体可取） |

        **短时效地址不要持久化、不要分享**（过期即失效，重新读取所在资源可拿到新的）；长效公开地址可直接放进页面。
      enum:
        - onboarding_document
        - void_cheque
        - store_photo
        - office_photo
        - merchant_logo
        - payment_page_logo
        - link_banner
        - giftcard_brand_logo
        - product_image
        - channel_application_material
    UploadedFile:
      type: object
      additionalProperties: false
      description: |
        已上传的文件。上传成功不等于生效:`fileId` 要随对应的业务写操作提交,文件才归属该业务对象;从未被引用的文件不生效,前端无需处理。
      required:
        - fileId
        - fileName
        - fileSize
        - contentType
        - previewUrl
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
          description: 该文件的稳定引用,业务写操作提交它;不要保存任何物理地址。
          examples:
            - 0f8c2a6e4b1d47f0a9c3e5d7b2148a6f
        fileName:
          type: string
          description: 原始文件名。
        fileSize:
          type: integer
          format: int64
          description: 字节数。
        contentType:
          type: string
          description: 服务端判定的内容类型。
        previewUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 可渲染地址(只出不入),供上传后立即回显。按用途分长效公开地址或短时效地址,短时效的不要持久化。
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    InvoiceNo:
      type: integer
      format: int32
      minimum: 10001
      description: 系统账单号，商户内递增、从 10001 起；与商户一起唯一定位一张账单。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    PositiveMoney:
      description: 正额金额（amount = 最小币种单位正非零整数字符串、currency 同 Money）；schema 化收口「> 0」。用于「划多少」类输入（资金划转额 / 阈值 / 退款额等），金额方向由具体业务操作表达、不用正负号表示；区别于 Money（可正可负，用于余额 / 分录 / 结算净额 / 回冲等账面值）。
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amount:
              type: string
              pattern: ^[1-9][0-9]*$
    QuickFilterItem:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
          description: 该项对应的筛选值 —— **对客户端不透明**:选中本项就把它**原样**回传给对应列表端点的那个筛选参数, 不要解析、拼接或据其分支。
          examples:
            - PAID
        label:
          type: string
          description: 后端给的默认展示名。**客户端有自己的多语言资源时按 `value` 取用、本字段作兜底**; 没有资源(取值由配置或数据决定,如角色名、年份)时直接展示本字段。
          examples:
            - Paid
        count:
          type: integer
          minimum: 0
          description: 该项当前的命中数(口径见 `QuickFilterCounts` 说明)。
    QuickFilterCounts:
      type: object
      additionalProperties: false
      description: |
        **列表页顶部快捷筛选的各项与计数**。快捷筛选就是该列表的一个筛选维度,没有特殊机制:选中某项 = 给列表带上该维度的筛选参数(值 = 该项 `value`),**选 All = 不带这个参数**。

        **照着 `items` 渲染即可** —— 项集、顺序、展示名、数字全部由服务端给出,客户端不枚举取值、不 hardcode 项集;某项当期为 `0` 时**仍会返回**(那一格不该因为没数据就消失)。

        **`All` 不在 `items` 里,由客户端自己补一项**,数字 = 其余各项之和 —— 服务端保证 `items` 覆盖该列表在不带本维度筛选时的全部命中(每行恰好落进一项),故这个和恒等于此时列表的 `total`。

        例外:某些集合一行可落进多项(如成员的角色),这类接口另给总数,All 取那个总数、不用各项相加。

        **本端点不接受被计维度自身的参数**;其余筛选条件与对应列表端点一致、传什么算什么。因此:点某项后列表 `total` = 该项 `count`;点 All 后列表 `total` = 各项 `count` 之和。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuickFilterItem'
    LinkId:
      type: string
      minLength: 1
      maxLength: 32
      description: 销售链接标识。
    GiftcardPromotionType:
      type: string
      enum:
        - discount
        - bonus_card
      description: 礼卡的促销方式：`discount` 折扣 / `bonus_card` 买赠，另送一张赠卡。
    GiftcardPurchaseLimitCycle:
      type: string
      enum:
        - daily
        - weekly
        - biweekly
        - monthly
      description: 限购的滚动周期：`daily` 一天 / `weekly` 一周 / `biweekly` 两周 / `monthly` 一个月。
    SalesItemId:
      type: string
      minLength: 1
      maxLength: 32
      description: 销售链接条目（商品 / 票档 / 面值档）的标识，服务端签发。
    GiftcardBonusTerms:
      type: string
      enum:
        - same_as_main
        - custom
      description: 赠卡条款：`same_as_main` 使用范围与有效期同主卡 / `custom` 独立规则，另附赠卡说明。
    GiftcardFulfillmentMode:
      type: string
      enum:
        - inventory
        - voucher
      description: 履约模式：`inventory` 发预先导入的实体卡、无平台核销；`voucher` 发系统生成的兑换券、门店核销、可作废。
    SalesOrderStatus:
      type: string
      enum:
        - CREATED
        - PAID
        - PARTIALLY_REFUNDED
        - REFUNDING
        - REFUNDED
        - CLOSED
      description: '`CREATED` 待付款 / `PAID` 已付 / `PARTIALLY_REFUNDED` 部分已退（还可按剩余额继续退）/ `REFUNDING` 退款处理中 / `REFUNDED` 全额已退 / `CLOSED` 未付关闭。与订单与退款契约里同一笔支付订单的状态一致。'
    RedemptionStatus:
      type: string
      enum:
        - NOT_REDEEMED
        - REDEEMED
        - VOID
      description: 核销状态：`NOT_REDEEMED` 未核销 / `REDEEMED` 已核销 / `VOID` 已作废（只有礼卡兑换券会作废）。
    SalesOrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 销售订单号。
    PaymentMethodFamily:
      type: string
      description: 支付方式族（品牌）。
      enum:
        - wechat
        - alipay
        - unionpay
        - credit_card
    RiskDisposition:
      type: string
      enum:
        - escalate
        - blacklist
        - approve
        - remove_blacklist
      description: '`escalate` 升为高风险 / `blacklist` 加入礼卡购买黑名单（两者同效）/ `approve` 放行（移出黑名单，未发放的恢复发放）/ `remove_blacklist` 移出黑名单。'
    VoucherNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 券号；实体礼卡为卡号。
    SalesVoucherKind:
      type: string
      enum:
        - MAIN
        - BONUS
      description: 销售单凭证的种类：`MAIN` 主卡 / `BONUS` 赠卡。
    SalesVoucherStatus:
      type: string
      enum:
        - ISSUED
        - REDEEMED
        - VOID
        - CANCELLED
      description: 销售单凭证的状态：`ISSUED` 未核销 / `REDEEMED` 已核销 / `VOID` 已作废 / `CANCELLED` 退款成功后失效。
    VoucherInvalidationRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: 作废原因，进订单的动作日志。
    RiskDispositionRequest:
      type: object
      additionalProperties: false
      required:
        - action
      properties:
        action:
          $ref: '#/components/schemas/RiskDisposition'
        note:
          type: string
          minLength: 1
          maxLength: 512
          description: 处置备注，进订单的动作日志。
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
