                - alipay
                - card
              buyerInputKeys:
                - sys:name
                - sys:email
                - 公司抬头
              recipientInputKeys:
                - sys:name
                - sys:email
              bannerFileId: 5a2c84f1d09b4e73ac16f8b3e047d92c
              giftcard:
                brandName: lululemon
                campaignName: 2026 Christmas Promotion
                promotionType: discount
                fulfillmentMode: inventory
                campaignEndDate: '2026-12-31'
                purchaseLimitQuantity: 2
                purchaseLimitAmount:
                  amount: '10000'
                  currency: CAD
                purchaseLimitCycle: biweekly
                orderRiskReviewEnabled: true
                denominations:
                  - cardValue:
                      amount: '2500'
                      currency: CAD
                    price:
                      amount: '2500'
                      currency: CAD
                    discountAmount:
                      amount: '250'
                      currency: CAD
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - linkId
                properties:
                  linkId:
