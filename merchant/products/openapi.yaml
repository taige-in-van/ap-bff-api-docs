          items:
            $ref: '#/components/schemas/InfoFieldKey'
        remark:
          type: string
          maxLength: 512
          description: 商户备注，不面向付款人。
        bannerFileId:
          $ref: '#/components/schemas/FileId'
          description: '`uploadProductLinkFile`（purpose=link_banner）返回的 `fileId`。'
        giftcard:
          allOf:
            - $ref: '#/components/schemas/GiftcardContentComplete'
          description: 礼卡内容，`type=giftcard` 时必带。
        product:
          allOf:
            - $ref: '#/components/schemas/ProductContentComplete'
          description: 商品内容，`type=product` 时必带。
        ticket:
          allOf:
            - $ref: '#/components/schemas/TicketContentComplete'
          description: 票务内容，`type=ticket` 时必带。
    ProductLinkUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
