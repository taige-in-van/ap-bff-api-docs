                  type: string
                  format: email
                  description: 收件邮箱；不传 = 当前投递邮箱。
            example:
              email: david.li@example.com
      responses:
        '204':
          description: 已重发
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208019
  /products/links/{linkId}/orders/{salesOrderId}/voucher-invalidation:
    post:
      tags:
        - links
      operationId: voidProductLinkOrderVoucher
      x-required-privilege: products:order:manage
      summary: 作废兑换券（Void）
      description: |
        仅礼卡兑换券模式、已付、未核销、且没有处理中退款的单可作废；作废后该券不可核销、也不可退款，`redemptionStatus` 变为 `VOID`。已核销、已作废、退款处理中 → `409`·`208018`。

        幂等：同键同请求体重发不重复作废；换新键再作废已作废的券落 `208018`，不当作重放；同键的上一次提交还在处理 → `409`·`908002`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: linkId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LinkId'
        - name: salesOrderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoucherInvalidationRequest'
            example:
              reason: 客户到店改换其他商品
      responses:
        '204':
          description: 已作废
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208018
  /products/links/{linkId}/orders/{salesOrderId}/risk-disposition:
    post:
      tags:
        - links
      operationId: disposeProductLinkOrderRisk
      x-required-privilege: products:order:manage
      summary: 礼卡订单风控处置
      description: |
        对礼卡订单做人工处置，当前可执行的动作看详情的 `giftcard.actions.riskDispositions`：
        - `escalate`（升为高风险）与 `blacklist`（加入黑名单）：订单为中风险时可用，效果相同——付款人进入礼卡购买黑名单、此后不能再买礼卡；这笔订单还没发放的不再发放，已发放的不撤回。
        - `approve`（放行）：订单为高风险时可用——付款人移出黑名单；订单还没发放的恢复发放。
        - `remove_blacklist`（移出黑名单）：付款人在黑名单里时，在他的任一礼卡订单上可用——付款人移出黑名单。

        可用与否只看上面的条件，不看活动当前是否开着订单风险评估。

        幂等：同键同请求体重发不重复处置；改动作要换新键，沿用旧键改动作 → `409`·`908003`。换新键提交时风险等级已被别人改过、该动作不再可执行 → `409`·`208020`；同键的上一次提交还在处理 → `409`·`908002`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: linkId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LinkId'
        - name: salesOrderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskDispositionRequest'
            example:
              action: approve
              note: 已电话核实买家身份
      responses:
        '204':
          description: 已处置
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208020
  /products/checkout:
    get:
      tags:
        - checkout
      operationId: getCheckoutSettings
      x-required-privilege: products:checkout:view
      summary: 读收款设置（订单有效期、客户服务费开关）
      description: 当前商户的收款设置，对各收款入口新建的订单生效。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSettings'
              example:
                orderExpiryMinutes: 15
                customerServiceFeeEnabled: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - checkout
      operationId: updateCheckoutSettings
      x-required-privilege: products:checkout:edit
      summary: 改收款设置
      description: |
        只提交要改的，只对之后新建的订单生效。

        `orderExpiryMinutes` 超出允许范围 → `400`·`204019`，允许的下限与上限在 `context.minimumMinutes`、`context.maximumMinutes`，整次提交不生效。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                orderExpiryMinutes:
                  $ref: '#/components/schemas/OrderExpiryMinutes'
                customerServiceFeeEnabled:
                  type: boolean
            examples:
              orderExpiry:
                summary: 改订单有效期
                value:
                  orderExpiryMinutes: 30
              customerServiceFee:
                summary: 打开客户服务费
                value:
                  customerServiceFeeEnabled: true
      responses:
        '200':
          description: 已保存，返回保存后的整组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSettings'
              example:
                orderExpiryMinutes: 30
                customerServiceFeeEnabled: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204019
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在当前商户不可访问时返回 `409`·`208022`（见公共约定「当前商户」）。
  schemas:
    StoreQrVariantList:
      type: object
      additionalProperties: false
      description: 店铺码的各个码。
      required:
        - items
      properties:
        items:
          type: array
          description: 第 1 项是主码，其余按返回顺序排列；空数组 = 一个码都没有。
          items:
            $ref: '#/components/schemas/StoreQrVariant'
    StoreQrVariant:
      type: object
      additionalProperties: false
      description: 店铺码的一个码。
      required:
        - currency
        - qrType
        - qrContent
        - checkoutOptions
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        qrType:
          allOf:
            - $ref: '#/components/schemas/StoreQrType'
          description: '`standard` 标准码 / `pre_auth` 预授权码 / `unionpay_qrc` 银联码（云闪付扫，不经收银台）。'
        qrContent:
          type: string
          minLength: 1
          description: 该码二维码承载的原文，照原样编码成二维码。
        checkoutOptions:
          type: array
          description: 扫这个码能用的支付方式（收款页设置里已选、且商户已开通的）；银联码为空数组。
          items:
            $ref: '#/components/schemas/CheckoutOption'
    CheckoutOptionItem:
      type: object
      additionalProperties: false
      description: 收银台上的一个支付方式选项。
      required:
        - checkoutOption
        - displayName
        - opened
        - pricingCurrencies
      properties:
        checkoutOption:
          $ref: '#/components/schemas/CheckoutOption'
        displayName:
          type: string
          minLength: 1
          description: 不随语言变的展示名（品牌名）。前端有该选项的多语言资源时按 `checkoutOption` 取用，没有就显示本值。
        logoUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 图标的长效公开地址；没有图标时不返回本键。
        opened:
          type: boolean
          description: 当前商户是否已开通（该项下至少一个支付方式已开通）。
        pricingCurrencies:
          type: array
          description: 该商户用这一项收款时能标价的币种：结算币种，加上通道支持时的 CNY。未开通的项按平台上该项能支持的给出。
          items:
            $ref: '#/components/schemas/Currency'
    TipConfiguration:
      type: object
      additionalProperties: false
      description: 商户级小费配置，店铺码收款页与终端收款共用。
      properties:
        enabled:
          type: boolean
        presets:
          type: array
          minItems: 3
          maxItems: 3
          description: 预设小费档（百分比整数），恒 3 档、每档 0–30%。商户没配置过时读面返回平台默认档位。
          items:
            type: integer
            minimum: 0
            maximum: 30
    TipConfigurationComplete:
      description: 读面的小费配置：`enabled` 与 `presets` 必返。
      required:
        - enabled
        - presets
      allOf:
        - $ref: '#/components/schemas/TipConfiguration'
    OrderExpiryMinutes:
      type: integer
      minimum: 1
      description: 订单多久没支付就自动作废，单位分钟。允许的取值范围由平台设定、会调整，超出时由 `updateCheckoutSettings` 拒绝并带回当前范围。
      examples:
        - 30
    InfoFieldKey:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        采集项的**数据键**，写侧用它表示「这一项要留下」（收款页、Product Link 的买家 / 收件人采集项共用同一形状）。

        两类项的键来路不同：

        - **商户自撰项**——键就是商户打的那串标题：配置时打什么，收款页就原样展示什么，付款人填的值也以这串标题为键收集。改了标题即换了一项，**历史订单保留其当时的键**（那是当时问的问题，不是数据漂移）。
        - **系统项**——键是稳定值、与展示文案无关（见 `InfoFieldEntry`）。
        同一个列表内键**去除首尾空格后不得重复**（重复会在收款页出现两个同名输入框、收集结果还会互相覆盖），保存时校验（违反 → `208030`）；
        **商户自撰的标题不得以 `sys:` 开头**（系统项的键一律带该前缀，两类键因此不会相撞），违反时保存被拒。

        自撰标题的长度上限：店铺码收款页 ≤ 10 字符，Product Link ≤ 40 字符，超出 `400`（`details` 指到字段）。本 schema 的 `maxLength: 64` 是为系统项的键留的。
    InfoFieldEntry:
      type: object
      description: '采集项的**完整形态**，用于**读侧**：既含商户自己加的项，也含系统给出的项。 两个属性各管一件事，别互相推导—— **`system`** 管「文案能不能改」：`true` 的项文案由系统给出、商户改不了； **`mandatory`** 管「能不能删」：必填的项不能从配置里去掉，**非必填的一律可删、`system` 的也不例外** （例如收款页的姓名 / 手机号就是 `system: true` + `mandatory: false`，商户可以删掉不收）。 商户自撰的项恒为 `system: false` + `mandatory: false`。'
      required:
        - key
        - label
        - system
        - mandatory
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/InfoFieldKey'
          description: 该项的数据键。商户自撰项的 `key` 就是其标题；系统项的 `key` 是稳定值、与文案无关。
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: '展示标题。`system: true` 时由系统按界面语言给出、商户改不了；商户自撰项即商户所填标题（上限见 `InfoFieldKey`）。'
        system:
          type: boolean
          description: '`true` = 系统给出的项（文案不可改，后台据其 `key` 取值）；`false` = 商户自撰项。'
        mandatory:
          type: boolean
          description: 是否必填。**必填即不可删、非必填即可删**，与 `system` 无关。恒返本键。
        type:
          type: string
          minLength: 1
          maxLength: 32
          description: 收款页的控件与输入限制提示。本面仅透传呈现。
        needConfirm:
          type: boolean
          description: 收款页是否要在这一项下面再渲染一个确认输入框。本面仅透传呈现。
    InputLimit:
      type: integer
      minimum: 1
      description: 每组采集项（店铺码的付款人采集项、Product Link 的买家与收件人采集项各算一组）最多几项，系统项与自撰项合计。部署参数，默认 10；超出时保存返回 `400`。
    PaymentPageSettings:
      type: object
      additionalProperties: false
      description: 店铺码收款页设置 + 商户小费配置。
      required:
        - logoCustomized
        - payerInputs
        - inputLimit
        - checkoutOptions
        - tips
      properties:
        logoUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 付款人看到的 Logo 的长效公开地址：设了收款页 Logo 就是它，没设就是商户 Logo；两者都没有时不返回本键。
        logoCustomized:
          type: boolean
          description: 是否设了收款页自己的 Logo。
        payerInputs:
          type: array
          description: 收款页向付款人收的全部采集项，系统项与商户自撰项在同一个列表里，按 `system` / `mandatory` 区分。合计不超过 `inputLimit` 项，每条自撰标题 ≤ 10 字符。空数组 = 不采集。
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
        inputLimit:
          $ref: '#/components/schemas/InputLimit'
        description:
          type: string
          maxLength: 300
          description: 收款页附加说明；没有时不返回本键。
        checkoutOptions:
          type: array
          description: 已选的支付方式，可能含后来停用的项（付款人看不到，重新开通后恢复）。
          items:
            $ref: '#/components/schemas/CheckoutOption'
        tips:
          $ref: '#/components/schemas/TipConfigurationComplete'
    PaymentPageSettingsWrite:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 保存店铺码收款页设置与商户小费配置。
      properties:
        logoFileId:
          oneOf:
            - $ref: '#/components/schemas/FileId'
            - type: 'null'
          description: '`uploadPaymentPageLogoFile` 返回的 `fileId` = 换 Logo；`null` = 移除（回到商户 Logo）。'
        payerInputKeys:
          type: array
          description: |
            保留下来的采集项，按 `key` 给全：读回来的 `payerInputs` 里要留的项放它的 `key`，删掉的不放，新加的自撰项放它的标题。空数组 = 不采集。

            必填项一个都不能少，自撰标题不能以 `sys:` 开头，违反 → `409`·`208030`。系统项的文案与必填性以服务端已存的为准，这里只表达留不留。合计不超过 `inputLimit` 项，超出 `400`。顺序即付款人页面的展示顺序。
          items:
            $ref: '#/components/schemas/InfoFieldKey'
        description:
          type:
            - string
            - 'null'
          maxLength: 300
          description: 收款页附加说明；`null` = 不设。
        checkoutOptions:
          type: array
          minItems: 1
          description: 选用的支付方式（整组置换）。新加的项须取自 `listCheckoutOptions` 里 `opened` 为 true 的；已选着、后来停用的项可以原样带回。
          items:
            $ref: '#/components/schemas/CheckoutOption'
        tips:
          $ref: '#/components/schemas/TipConfiguration'
    InvoiceStatus:
      type: string
      description: '`UNPAID` 未付 / `PAID` 已付 / `OVERDUE` 逾期（未付且已过到期日）。'
      enum:
        - UNPAID
        - PAID
        - OVERDUE
    InvoiceCreateRequest:
      type: object
      additionalProperties: false
      required:
        - amount
      properties:
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        dueDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 到期日，不早于当天，所选日整日有效；不传 = 没有到期日。
        description:
          type: string
          minLength: 1
          maxLength: 300
          description: 账单说明；不传 = 没有。
    InvoiceListItem:
      type: object
      additionalProperties: false
      required:
        - invoiceNo
        - amount
        - status
        - createdAt
        - paymentUrl
      properties:
        invoiceNo:
          $ref: '#/components/schemas/InvoiceNo'
          description: 账单号：商户内递增，从 10001 起，允许有缝。
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        dueDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 到期日，所选日整日有效；没有到期日时不返回本键。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        description:
          type: string
          description: 账单说明；没有时不返回本键。
        paymentUrl:
          $ref: '#/components/schemas/WebUrl'
        orderId:
          $ref: '#/components/schemas/OrderId'
          description: 付款成功的支付订单号（订单与退款契约 `getPayment` 的 `orderId`）；已付时才返回。
    InvoiceSummary:
      type: object
      additionalProperties: false
      description: 账单页顶汇总：按状态各给张数与按标价币种分开的金额合计。应收 = 未付 + 逾期。
      required:
        - paid
        - unpaid
        - overdue
      properties:
        paid:
          $ref: '#/components/schemas/InvoiceSummaryCell'
        unpaid:
          $ref: '#/components/schemas/InvoiceSummaryCell'
        overdue:
          $ref: '#/components/schemas/InvoiceSummaryCell'
    InvoiceSummaryCell:
      type: object
      additionalProperties: false
      description: 某一状态的账单张数与金额。
      required:
        - count
        - amounts
      properties:
        count:
          type: integer
          minimum: 0
        amounts:
          type: array
          description: 按标价币种分开的金额合计，每个出现过的币种一项；该状态没有账单时为空数组。
          items:
            $ref: '#/components/schemas/Money'
    InvoiceListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceListItem'
    RiskLevel:
      type: string
      description: 礼卡订单风险等级。未评估风险的订单（还没付款，或活动没开风控审核）按 `normal` 返回、筛选与计数。
      enum:
        - normal
        - medium
        - high
    SaleWindow:
      type: object
      description: 销售窗口（窗口外不可售）。
      properties:
        start:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        end:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    SaleWindowRead:
      description: '`SaleWindow` 的读侧形态：属性定义仍单一来源于 `SaleWindow`，此处只把可清空字段收窄为非空——**响应里未设置的边界不返回本键、不返** `null`。'
      allOf:
        - $ref: '#/components/schemas/SaleWindow'
        - properties:
            start:
              $ref: '#/components/schemas/Timestamp'
            end:
              $ref: '#/components/schemas/Timestamp'
    SalesItemCommittedQuantity:
      type: integer
      minimum: 0
      readOnly: true
      description: 这一项已卖出加在途占用的份数，也就是 `quantityLimit` 能改到的最小值。只读。
    GiftcardDenomination:
      type: object
      additionalProperties: false
      description: |
        面值档。`cardValue` 是主卡面值，`price` 是标价（空 = 按面值标价）；折扣模式实付 = `price` − `discountAmount`，赠卡模式实付 = `price` 并另得赠卡。数量字段按履约模式二选一：实体卡模式只读 `stock`，兑换券模式可配 `quantityLimit`。
      required:
        - cardValue
      properties:
        itemId:
          $ref: '#/components/schemas/SalesItemId'
          description: 修改时它决定改还是新增：把详情里读到的 `itemId` 原样带回 = 改这一项，不带 = 新增一项；这次没带回的既有项视为下架，之后不再出现在详情与收款页里。下架不是删除：已卖出的份数、在途订单仍算在它头上，退款也照常回补到它。创建时不带；带了不属于本链接的值 → `409`·`208032`。
        cardValue:
          $ref: '#/components/schemas/PositiveMoney'
        price:
          description: 标价；`null` = 按面值标价。
          oneOf:
            - $ref: '#/components/schemas/PositiveMoney'
            - type: 'null'
        discountAmount:
          description: 折扣额，仅 `promotionType=discount`；写侧 `null` 清空，读侧不适用时不返回本键。
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        bonusAmount:
          description: 赠卡额，仅 `promotionType=bonus_card`；写侧 `null` 清空，读侧不适用时不返回本键。
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        bonusTerms:
          description: 赠卡条款，`promotionType=bonus_card` 时必填：`same_as_main` 范围与有效期同主卡，`custom` 独立规则、须填 `bonusNotes`。
          oneOf:
            - $ref: '#/components/schemas/GiftcardBonusTerms'
            - type: 'null'
        bonusNotes:
          type:
            - string
            - 'null'
          maxLength: 512
          description: 赠卡说明（使用范围、有效期、限制），`bonusTerms=custom` 时必填。
        quantityLimit:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 销售数量上限，仅兑换券模式；`null` = 不限。不能低于 `committedQuantity`（`409`·`208031`），改成不限永远可以。
        stock:
          type: integer
          minimum: 0
          readOnly: true
          description: 可售卡量：该面值档还能卖出的主卡张数（已分配、已停用的卡与赠卡都不计），仅实体卡模式；尚未导入时不返回本键。卡密由运营整理后按面值导入，商户后台没有上传入口。
        committedQuantity:
          $ref: '#/components/schemas/SalesItemCommittedQuantity'
    GiftcardDenominationRead:
      description: '`GiftcardDenomination` 的读侧形态：不适用或未设置的字段不返回本键，不返 `null`；`itemId` 与 `committedQuantity` 必返。'
      required:
        - itemId
        - committedQuantity
      allOf:
        - $ref: '#/components/schemas/GiftcardDenomination'
        - properties:
            price:
              $ref: '#/components/schemas/PositiveMoney'
            discountAmount:
              $ref: '#/components/schemas/Money'
            bonusAmount:
              $ref: '#/components/schemas/Money'
            bonusTerms:
              $ref: '#/components/schemas/GiftcardBonusTerms'
            bonusNotes:
              type: string
            quantityLimit:
              type: integer
              minimum: 0
    GiftcardContent:
      type: object
      description: |
        礼卡内容（修改时的部分更新形态；`fulfillmentMode` 只在创建时给，见 `GiftcardContentComplete`）。`*FileId` 只用于提交，读回只有 `*Url`。
      properties:
        brandName:
          type: string
          minLength: 1
          maxLength: 128
          description: 品牌名，面向付款人。
        brandLogoFileId:
          oneOf:
            - $ref: '#/components/schemas/FileId'
            - type: 'null'
          description: '`uploadProductLinkFile`（purpose=giftcard_brand_logo）返回的 `fileId`；`null` = 移除。'
        brandLogoUrl:
          $ref: '#/components/schemas/WebUrl'
          readOnly: true
          description: 礼卡品牌图的长效公开地址；没有时不返回本键。
        campaignName:
          type: string
          minLength: 1
          maxLength: 128
          description: 后台活动名，不面向付款人。
        promotionType:
          allOf:
            - $ref: '#/components/schemas/GiftcardPromotionType'
          description: '`discount` 折扣 / `bonus_card` 赠卡。'
        redemptionRule:
          type: string
          enum:
            - one_time
          readOnly: true
          description: 核销规则，目前只有一次性核销；仅兑换券模式返回，不可提交。
        campaignEndDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 活动截止日，不早于今天；所选日整日可售。
        slogan:
          type:
            - string
            - 'null'
          maxLength: 80
          description: 活动标语；`null` 清空。
        purchaseLimitQuantity:
          type:
            - integer
            - 'null'
          minimum: 1
          description: 每个付款人可购张数；`null` = 不限。
        purchaseLimitAmount:
          description: 每个付款人累计面值上限，币种须等于链接币种；`null` = 不限。与张数上限同时生效。
          oneOf:
            - $ref: '#/components/schemas/PositiveMoney'
            - type: 'null'
        purchaseLimitCycle:
          description: 限购滚动周期，张数与面值两轴共用；`null` = 自活动开始累计。
          oneOf:
            - $ref: '#/components/schemas/GiftcardPurchaseLimitCycle'
            - type: 'null'
        purchaseCounterResetAt:
          readOnly: true
          description: 最近一次启停导致的限购计数重置时点；从未切换过不返回本键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        orderRiskReviewEnabled:
          type: boolean
          description: 收款后、发放前是否做风控审核。人工处置在销售单详情里做，不在这里配。
        denominations:
          type: array
          minItems: 1
          maxItems: 10
          description: 面值档，1–10 条；读回按创建顺序。
          items:
            $ref: '#/components/schemas/GiftcardDenomination'
    GiftcardContentComplete:
      description: 创建时的礼卡内容：多一个创建后不可改的 `fulfillmentMode`，并收紧必填。
      required:
        - brandName
        - campaignName
        - promotionType
        - fulfillmentMode
        - campaignEndDate
        - denominations
      allOf:
        - $ref: '#/components/schemas/GiftcardContent'
        - type: object
          properties:
            fulfillmentMode:
              allOf:
                - $ref: '#/components/schemas/GiftcardFulfillmentMode'
              description: 履约模式，创建后不可改。
    GiftcardContentCompleteRead:
      description: 详情里的礼卡内容：必填集同 `GiftcardContentComplete`；可清空字段收窄为非空，面值档换读侧变体；未设置的不返回本键。
      allOf:
        - $ref: '#/components/schemas/GiftcardContentComplete'
        - properties:
            slogan:
              type: string
            purchaseLimitQuantity:
              type: integer
              minimum: 1
            purchaseLimitAmount:
              $ref: '#/components/schemas/PositiveMoney'
            purchaseLimitCycle:
              $ref: '#/components/schemas/GiftcardPurchaseLimitCycle'
            denominations:
              type: array
              items:
                $ref: '#/components/schemas/GiftcardDenominationRead'
    ProductItem:
      type: object
      additionalProperties: false
      required:
        - name
        - price
      properties:
        itemId:
          $ref: '#/components/schemas/SalesItemId'
          description: 修改时它决定改还是新增：把详情里读到的 `itemId` 原样带回 = 改这一项，不带 = 新增一项；这次没带回的既有项视为下架，之后不再出现在详情与收款页里。下架不是删除：已卖出的份数、在途订单仍算在它头上，退款也照常回补到它。创建时不带；带了不属于本链接的值 → `409`·`208032`。
        name:
          type: string
          minLength: 1
          maxLength: 256
        description:
          type:
            - string
            - 'null'
          maxLength: 512
          description: 商品描述，收款页展示；`null` 清空。
        imageFileId:
          oneOf:
            - $ref: '#/components/schemas/FileId'
            - type: 'null'
          description: '`uploadProductLinkFile`（purpose=product_image）返回的 `fileId`；`null` = 移除。'
        imageUrl:
          $ref: '#/components/schemas/WebUrl'
          readOnly: true
          description: 商品图的长效公开地址；没有时不返回本键。
        price:
          $ref: '#/components/schemas/PositiveMoney'
        originalPrice:
          description: 划线价，收款页划线显示在售价旁；`null` 清空。
          oneOf:
            - $ref: '#/components/schemas/PositiveMoney'
            - type: 'null'
        quantityLimit:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 库存；`null` = 不限。不能低于 `committedQuantity`（`409`·`208031`），改成不限永远可以。
        committedQuantity:
          $ref: '#/components/schemas/SalesItemCommittedQuantity'
    ProductItemRead:
      description: '`ProductItem` 的读侧形态：不限量时不返回 `quantityLimit`；`itemId` 与 `committedQuantity` 必返。'
      required:
        - itemId
        - committedQuantity
      allOf:
        - $ref: '#/components/schemas/ProductItem'
        - properties:
            description:
              type: string
            originalPrice:
              $ref: '#/components/schemas/PositiveMoney'
            quantityLimit:
              type: integer
              minimum: 0
    ProductContent:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 10
          description: 商品项，1–10 条；读回按创建顺序。
          items:
            $ref: '#/components/schemas/ProductItem'
    ProductContentComplete:
      description: 创建时的商品内容：`items` 必填。
      required:
        - items
      allOf:
        - $ref: '#/components/schemas/ProductContent'
    ProductContentCompleteRead:
      description: 详情里的商品内容：商品项换读侧变体。
      allOf:
        - $ref: '#/components/schemas/ProductContentComplete'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProductItemRead'
    TicketTier:
      type: object
      additionalProperties: false
      required:
        - name
        - price
      properties:
        itemId:
          $ref: '#/components/schemas/SalesItemId'
          description: 修改时它决定改还是新增：把详情里读到的 `itemId` 原样带回 = 改这一项，不带 = 新增一项；这次没带回的既有项视为下架，之后不再出现在详情与收款页里。下架不是删除：已卖出的份数、在途订单仍算在它头上，退款也照常回补到它。创建时不带；带了不属于本链接的值 → `409`·`208032`。
        name:
          type: string
          minLength: 1
          maxLength: 256
        price:
          $ref: '#/components/schemas/PositiveMoney'
        quantityLimit:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 该票档的容量；`null` = 不限。不能低于 `committedQuantity`（`409`·`208031`），改成不限永远可以。
        committedQuantity:
          $ref: '#/components/schemas/SalesItemCommittedQuantity'
        saleWindow:
          $ref: '#/components/schemas/SaleWindow'
    TicketTierRead:
      description: '`TicketTier` 的读侧形态：不限量时不返回 `quantityLimit`，销售窗口换读侧变体；`itemId` 与 `committedQuantity` 必返。'
      required:
        - itemId
        - committedQuantity
      allOf:
        - $ref: '#/components/schemas/TicketTier'
        - properties:
            quantityLimit:
              type: integer
              minimum: 0
            saleWindow:
              $ref: '#/components/schemas/SaleWindowRead'
    TicketContent:
      type: object
      additionalProperties: false
      properties:
        eventDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 活动日，纯展示、不作销售闸。
        eventTime:
          type:
            - string
            - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: 开演时刻 `HH:mm`，商户所填的当地时间，字面存取；`null` = 整日活动。
        venue:
          type: string
          minLength: 1
          maxLength: 256
        tiers:
          type: array
          minItems: 1
          maxItems: 10
          description: 票档，1–10 档；读回按创建顺序。
          items:
            $ref: '#/components/schemas/TicketTier'
    TicketContentComplete:
      description: 创建时的票务内容。
      required:
        - eventDate
        - venue
        - tiers
      allOf:
        - $ref: '#/components/schemas/TicketContent'
    TicketContentCompleteRead:
      description: 详情里的票务内容：票档换读侧变体；整日活动不返回 `eventTime`。
      allOf:
        - $ref: '#/components/schemas/TicketContentComplete'
        - properties:
            eventTime:
              type: string
            tiers:
              type: array
              items:
                $ref: '#/components/schemas/TicketTierRead'
    PoliciesAndSupport:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 收款页政策条款，五项 × 三语；三类链接共用一份商户默认。
      properties:
        faq:
          $ref: '#/components/schemas/LocalizedText'
        customerService:
          $ref: '#/components/schemas/LocalizedText'
        privacyPolicy:
          $ref: '#/components/schemas/LocalizedText'
        termsOfUse:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: 使用说明：活动页展示的重要使用说明 / 使用范围 / 适用限制与关键条款提示（区别于下方的正式条款全文）
        terms:
          $ref: '#/components/schemas/LocalizedText'
    PoliciesAndSupportRead:
      description: '`PoliciesAndSupport` 的读侧形态：本身无可清空字段，仅把五项三语文本换成读侧变体；三语都没有内容的项不返回。'
      allOf:
        - $ref: '#/components/schemas/PoliciesAndSupport'
        - properties:
            faq:
              $ref: '#/components/schemas/LocalizedTextRead'
            customerService:
              $ref: '#/components/schemas/LocalizedTextRead'
            privacyPolicy:
              $ref: '#/components/schemas/LocalizedTextRead'
            termsOfUse:
              $ref: '#/components/schemas/LocalizedTextRead'
            terms:
              $ref: '#/components/schemas/LocalizedTextRead'
    LocalizedText:
      type: object
      description: 三语文本（EN / 中 / FR）。Policies & Support 五项的值为**受限 HTML**：允许段落 / 换行 / 粗体 / 斜体 / 标题 / 链接 / 列表 / 表格 / 高亮标签，白名单外标签与脚本保存时被服务端剥除（不报错）；每语种长度上限由后端配置，超限 → `400` 字段级错误；收款页按同一白名单渲染。
      properties:
        en:
          type:
            - string
            - 'null'
        zh:
          type:
            - string
            - 'null'
        fr:
          type:
            - string
            - 'null'
    LocalizedTextRead:
      description: '`LocalizedText` 的读侧形态：只收窄可清空字段——**响应里未填的语种不返回本键、不返** `null`。'
      allOf:
        - $ref: '#/components/schemas/LocalizedText'
        - properties:
            en:
              type: string
            zh:
              type: string
            fr:
              type: string
    ProductLinkCreateRequest:
      type: object
      additionalProperties: false
      description: |
        创建请求。`type` 决定带哪个内容段（`giftcard` / `product` / `ticket`），必须带且只带对应的那个。各项金额币种须等于 `currency`。
      required:
        - type
        - name
        - currency
        - checkoutOptions
      properties:
        type:
          $ref: '#/components/schemas/ProductLinkType'
        name:
          type: string
          minLength: 1
          maxLength: 256
          description: 链接名；票务即活动名、礼卡即礼卡名。
        currency:
          $ref: '#/components/schemas/Currency'
        checkoutOptions:
          type: array
          minItems: 1
          description: 付款人可用的支付方式。新加的项须取自 `listCheckoutOptions`（礼卡传 `linkType=giftcard`）里 `opened` 为真、且 `pricingCurrencies` 含 `currency` 的。
          items:
            $ref: '#/components/schemas/CheckoutOption'
        buyerInputKeys:
          type: array
          description: |
            保留下来的买家采集项，按 `key` 给全：以 `getProductLinkDefaults` 的 `buyerInputs`（修改时以详情的 `buyerInputs`）为起点，删掉的不放，新加的自撰项放它的标题。不传 = 用默认集。

            必填项一个都不能少，自撰标题不能以 `sys:` 开头，违反 → `409`·`208030`。系统项的文案与必填性以服务端已存的为准，这里只表达留不留。系统项与自撰项合计不超过 `inputLimit` 项，超出 `400`。顺序即付款人页面的展示顺序。
          items:
            $ref: '#/components/schemas/InfoFieldKey'
        recipientInputKeys:
          type: array
