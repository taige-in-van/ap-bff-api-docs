openapi: 3.1.0
info:
  title: 商户后台 收款产品 — 前端契约面
  version: 2.2.2
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的收款产品契约：店铺码与其收款页设置、账单、Product Links（商品 / 票务 / 礼卡）及其销售单、收款设置（订单有效期、客户服务费开关）与收银台支付方式候选。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 创建类与命令类（建账单、建与改 Product Link、销售单的重发 / 作废 / 风控处置）挂 `Idempotency-Key`，同一次提交的网络重试用同键返回首次结果；天然幂等的纯 PUT / DELETE 不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 当前商户以会话为准、不看请求体；当前商户不可访问时返回 `409`·`208022`。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: qrcodes
    x-displayName: 店铺码
    description: 店铺码：各个码（二维码由前端按承载原文生成）、店铺码收款页设置（Logo、小费、付款人采集项、支付方式、附加说明）。
  - name: invoices
    x-displayName: 账单
    description: 账单：汇总、列表与状态计数、创建、删除。海报由前端生成；标价币种候选取 `listCheckoutOptions`。
  - name: links
    x-displayName: 销售链接
    description: Product Links：商品、票务、礼卡三类销售链接的列表、创建、详情与修改、政策条款、素材上传，以及每条链接下的销售单（含礼卡的重发凭证、作废券、风控处置）。
  - name: checkout
    x-displayName: 收款设置
    description: 收款设置：订单有效期、客户服务费开关，对各收款入口的订单都生效；以及收银台支付方式候选（店铺码、账单与 Product Links 共用）。
paths:
  /products/qrcodes:
    get:
      tags:
        - qrcodes
      operationId: listStoreQrcodes
      x-required-privilege: products:checkout:view
      summary: 读店铺码的各个码（第 1 项是主码）
      description: |
        当前商户的店铺码：结算币种的标准码与预授权码恒有；商户有能以 CNY 标价的已开通支付方式时另有 CNY 的标准码与预授权码；开通银联时另有银联码。第 1 项是主码（优先结算币种的标准码，该码不可用时由服务端在可用的码里定），其余按返回顺序排列；一个码都没有时返回空数组。
      responses:
        '200':
          description: 店铺码的各个码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreQrVariantList'
              example:
                items:
                  - currency: CAD
                    qrType: standard
                    qrContent: https://checkout.example.com/q/7Kq2mX9pLa
                    checkoutOptions:
                      - wechat
                      - alipay
                      - card
                  - currency: CAD
                    qrType: pre_auth
                    qrContent: https://checkout.example.com/q/Rt4vN8cYwe
                    checkoutOptions:
                      - wechat
                      - alipay
                  - currency: CAD
                    qrType: unionpay_qrc
                    qrContent: 00020101021226840010CN.UNIONPAY
                    checkoutOptions: []
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /products/qrcodes/page:
    get:
      tags:
        - qrcodes
      operationId: getPaymentPageSettings
      x-required-privilege: products:checkout:view
      summary: 读店铺码收款页设置
      description: |
        当前商户店铺码收款页的设置，各个码共用一份；小费是商户级的，终端收款也用同一份。

        商户还没保存过时：采集项按当时的系统目录给出，小费按平台默认档位给出且未开启。
      responses:
        '200':
          description: 收款页设置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPageSettings'
              example:
                logoUrl: https://cdn.example.com/core/payment-page-logo/2026/08/4e7a2c18b93d40f5a06c8b1e57d29f43.png
                logoCustomized: true
                payerInputs:
                  - key: sys:name
                    label: 姓名
                    system: true
                    mandatory: false
                    type: text
                  - key: sys:phone
                    label: 手机号
                    system: true
                    mandatory: false
                    type: phone
                  - key: sys:notes
                    label: 备注
                    system: true
                    mandatory: false
                    type: textarea
                  - key: 桌号
                    label: 桌号
                    system: false
                    mandatory: false
                    type: text
                inputLimit: 10
                description: 欢迎光临
                checkoutOptions:
                  - wechat
                  - alipay
                tips:
                  enabled: true
                  presets:
                    - 10
                    - 15
                    - 20
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - qrcodes
      operationId: updatePaymentPageSettings
      x-required-privilege: products:checkout:edit
      summary: 保存店铺码收款页设置
      description: |
        保存店铺码收款页设置与商户小费配置，只提交要改的。

        - 带了 `checkoutOptions` 时至少 1 项（空 → `400`·`204005`）。相对已保存的集合新加的项须已开通（`listCheckoutOptions` 里 `opened` 为 true），否则 → `409`·`208007`；已选着、后来停用的项可以原样保留，付款人看不到它，重新开通后即恢复。
        - 带了 `payerInputKeys` 时提交保留下来的完整键列表；缺了必填项、或自撰标题以 `sys:` 开头 → `409`·`208030`。第一次保存时系统项按当时的系统目录固化，此后系统目录变化不追溯。
        - `logoFileId` 引用的文件不存在、不是本商户上传的或用途不符 → `400`·`208040`（`details` 指到 `logoFileId`）。
        - 保存涉及收款页设置与商户小费两处，全部校验通过才写入；返回失败时原样重发同一请求体即可。

        同样的请求体重发结果不变，不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPageSettingsWrite'
            example:
              logoFileId: 9c1d5f7a3e2b48c6b0f4a8d29e631b57
              payerInputKeys:
                - sys:name
                - sys:phone
                - sys:notes
                - 桌号
              description: 欢迎光临
              checkoutOptions:
                - wechat
                - alipay
                - card
              tips:
                enabled: true
                presets:
                  - 10
                  - 15
                  - 20
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204005
        - 208007
        - 208030
        - 208040
  /products/checkout/options:
    get:
      tags:
        - checkout
      operationId: listCheckoutOptions
      x-required-privilege: session
      summary: 收银台支付方式候选（展示名、图标、是否已开通、可标价币种）
      description: |
        付款人在收银台上能选的支付方式，每项带展示名、图标、当前商户是否已开通（该项下至少一个支付方式已开通），以及该商户用这一项时能标价的币种。店铺码收款页设置、账单、Product Links 共用。顺序即展示顺序。

        礼卡链接只能用 `linkType=giftcard` 返回的项。
      parameters:
        - name: linkType
          in: query
          required: false
          description: 按 Product Link 类型取候选。不传、`product`、`ticket`：与店铺码相同的候选集。`giftcard`：支付宝合并为一项 `alipay`（线下或线上任一已开通即算已开通；`pricingCurrencies` 两个都开通时取线下的），不出现 `alipay_online`。
          schema:
            $ref: '#/components/schemas/ProductLinkType'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckoutOptionItem'
              example:
                items:
                  - checkoutOption: wechat
                    displayName: WeChat Pay
                    logoUrl: https://cdn.example.com/core/payment-method-logo/wechat.png
                    opened: true
                    pricingCurrencies:
                      - CAD
                      - CNY
                  - checkoutOption: alipay
                    displayName: Alipay
                    logoUrl: https://cdn.example.com/core/payment-method-logo/alipay.png
                    opened: true
                    pricingCurrencies:
                      - CAD
                      - CNY
                  - checkoutOption: alipay_online
                    displayName: Alipay Online
                    logoUrl: https://cdn.example.com/core/payment-method-logo/alipay.png
                    opened: false
                    pricingCurrencies:
                      - CAD
                      - CNY
                  - checkoutOption: unionpay_online
                    displayName: UnionPay
                    logoUrl: https://cdn.example.com/core/payment-method-logo/unionpay.png
                    opened: false
                    pricingCurrencies:
                      - CAD
                  - checkoutOption: card
                    displayName: Credit Card
                    logoUrl: https://cdn.example.com/core/payment-method-logo/card.png
                    opened: true
                    pricingCurrencies:
                      - CAD
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /products/qrcodes/files:
    post:
      tags:
        - qrcodes
      operationId: uploadPaymentPageLogoFile
      x-required-privilege: products:checkout:edit
      summary: 上传收款页 Logo（保存设置时生效）
      description: |
        返回的 `fileId` 作为 `updatePaymentPageSettings` 的 `logoFileId`，保存时文件才归属收款页设置。

        允许的格式与大小上限见 `MerchantFilePurpose` 用途表；不合规 → `400`·`204015`。非幂等：每次上传产生新 `fileId`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadForm'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - payment_page_logo
      responses:
        '201':
          description: 已上传（保存设置时生效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
              example:
                fileId: 9c1d5f7a3e2b48c6b0f4a8d29e631b57
                fileName: brand.png
                fileSize: 153600
                contentType: image/png
                previewUrl: https://cdn.example.com/core/payment-page-logo/2026/08/9c1d5f7a3e2b48c6b0f4a8d29e631b57.png
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
  /products/invoices:
    get:
      tags:
        - invoices
      operationId: listInvoices
      x-required-privilege: products:invoice:view
      summary: 账单列表（分页）
      description: |
        当前商户的账单，已删除的不在内。金额区间按各账单的标价金额数值比较，不跨币种换算。
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          description: 账单号前缀匹配，或账单说明模糊匹配。
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: from
          in: query
          required: false
          description: 创建日期范围起（含当日）
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: false
          description: 创建日期范围止（含当日）
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: amountMin
          in: query
          required: false
          description: 金额范围下限（最小币种单位整数字符串）
          schema:
            type: string
        - name: amountMax
          in: query
          required: false
          description: 金额范围上限
          schema:
            type: string
        - name: sortField
          in: query
          required: false
          description: 排序字段；`amount` 按数值比较、不分币种。
          schema:
            type: string
            enum:
              - createdAt
              - amount
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: 账单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListPage'
              example:
                total: 2
                data:
                  - invoiceNo: 10024
                    amount:
                      amount: '10500'
                      currency: CAD
                    status: PAID
                    dueDate: '2026-08-01'
                    createdAt: '2026-07-10T10:00:00Z'
                    description: 8 月服务费
                    paymentUrl: https://checkout.example.com/q/Hq7Zp2Kd9x
                    orderId: P100240011
                  - invoiceNo: 10023
                    amount:
                      amount: '20000'
                      currency: CNY
                    status: OVERDUE
                    dueDate: '2026-07-01'
                    createdAt: '2026-06-10T10:00:00Z'
                    paymentUrl: https://checkout.example.com/q/Mw3Xb8Tn4r
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - invoices
      operationId: createInvoice
      x-required-privilege: products:invoice:manage
      summary: 创建账单
      description: |
        新建一张未付账单，生成付款链接，账单号由服务端分配。

        - 标价币种须是 `listCheckoutOptions` 里已开通项的 `pricingCurrencies` 之一，否则 → `400`。
        - 到期日早于当天 → `400`·`204004`。

        必带 `Idempotency-Key`：同键 + 同请求体重发返回首次结果、不重复建单；改了请求体须换新键，沿用旧键 → `409`·`908003`；同键的上一次提交还在处理 → `409`·`908002`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'
            example:
              amount:
                amount: '10500'
                currency: CAD
              dueDate: '2026-08-01'
              description: 8 月服务费
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListItem'
              example:
                invoiceNo: 10025
                amount:
                  amount: '10500'
                  currency: CAD
                status: UNPAID
                dueDate: '2026-08-01'
                createdAt: '2026-07-04T10:00:00Z'
                description: 8 月服务费
                paymentUrl: https://checkout.example.com/q/Jc5Vn1Qe7s
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204004
  /products/invoices/counts:
    get:
      tags:
        - invoices
      operationId: getInvoiceCounts
      x-required-privilege: products:invoice:view
      summary: 账单列表状态快捷筛选的各项与计数
      description: |
        形状与用法见 `QuickFilterCounts`。`value` 原样回传给 `listInvoices` 的 `status`；本端点不接受 `status`，其余筛选与列表一致。
      parameters:
        - name: keyword
          in: query
          required: false
          description: 账单号前缀匹配，或账单说明模糊匹配。
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: 创建日期范围起（含当日）
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: false
          description: 创建日期范围止（含当日）
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: amountMin
          in: query
          required: false
          description: 金额范围下限（最小币种单位整数字符串）
          schema:
            type: string
        - name: amountMax
          in: query
          required: false
          description: 金额范围上限
          schema:
            type: string
      responses:
        '200':
          description: 各项与计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickFilterCounts'
              example:
                items:
                  - value: PAID
                    label: Paid
                    count: 2
                  - value: UNPAID
                    label: Unpaid
                    count: 2
                  - value: OVERDUE
                    label: Overdue
                    count: 1
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /products/invoices/summary:
    get:
      tags:
        - invoices
      operationId: getInvoiceSummary
      x-required-privilege: products:invoice:view
      summary: 账单页顶汇总（已付 / 未付 / 逾期 / 应收）
      description: |
        当前商户全部账单（已删除的不在内）的汇总，不随列表的搜索与筛选变。

        每格的金额按标价币种分开合计、不换算：账单出现过几种标价币种，`amounts` 就有几项。已付金额是每张已付账单成交订单的付款人应付总额（含客户服务费）扣去已退金额，退款中的不扣。应收 = 未付 + 逾期，不另给。
      responses:
        '200':
          description: 页顶汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSummary'
              example:
                paid:
                  count: 3
                  amounts:
                    - amount: '45000'
                      currency: CAD
                unpaid:
                  count: 1
                  amounts:
                    - amount: '10500'
                      currency: CAD
                overdue:
                  count: 1
                  amounts:
                    - amount: '20000'
                      currency: CNY
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /products/invoices/{invoiceNo}:
    delete:
      tags:
        - invoices
      operationId: deleteInvoice
      x-required-privilege: products:invoice:manage
      summary: 删除账单（码与付款链接立即失效）
      description: |
        任何状态都可以删除：付款链接立即失效，账单不再出现在列表、计数与汇总里；已付账单的收款不受影响。删除时正在进行的支付若之后成功，按非生效支付自动退款。

        不存在或已删除 → `404`。

        幂等：天然幂等，不挂 `Idempotency-Key`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - name: invoiceNo
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/InvoiceNo'
      responses:
        '204':
          description: 已删除
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /products/links:
    get:
      tags:
        - links
      operationId: listProductLinks
      x-required-privilege: products:link:view
      summary: Product Links 列表
      description: |
        当前商户的商品、票务、礼卡三类链接，一张列表。已删除的不返回。
      parameters:
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          description: 按名称或 `linkId` 搜索。
          schema:
            type: string
            maxLength: 128
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ProductLinkType'
        - name: enabled
          in: query
          required: false
          description: '`true` 只看启用的，`false` 只看停用的。'
          schema:
            type: boolean
        - name: from
          in: query
          required: false
          description: 创建日期范围起（含当日）；与 `to` 可只传一端。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: false
          description: 创建日期范围止（含当日）。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: sortField
          in: query
          required: false
          description: 排序字段。不传 = 不排序。
          schema:
            type: string
            enum:
              - createdAt
              - name
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: 链接列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductLinkListPage'
              example:
                total: 3
                data:
                  - linkId: pl_1000024_3001
                    type: giftcard
                    name: 节日礼卡
                    currency: CAD
                    itemPrices:
                      - amount: '2500'
                        currency: CAD
                      - amount: '5000'
                        currency: CAD
                    cardValues:
                      - amount: '2500'
                        currency: CAD
                      - amount: '5000'
                        currency: CAD
                    enabled: true
                    createdAt: '2026-07-10T10:00:00Z'
                  - linkId: pl_1000024_3002
                    type: product
                    name: 门店周边商品
                    currency: CAD
                    itemPrices:
                      - amount: '1800'
