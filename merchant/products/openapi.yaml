        - 条目（商品 / 票档 / 面值档）：带回 `itemId` = 改这一项，不带 = 新增一项，没带回的既有项下架（已售与在途仍算在它头上）。`quantityLimit` 不能低于该项的 `committedQuantity`，否则 `409`·`208031`（`context.committedQuantity` 是那个数）；带了不属于本链接的 `itemId` → `409`·`208032`。
