  /products/links/{linkId}/orders/{salesOrderId}/credential-redelivery:
    post:
      tags:
        - links
      operationId: resendProductLinkOrderCredential
      x-required-privilege: products:order:manage
      summary: 重发礼卡凭证邮件（可改收件邮箱）
      description: |
        仅礼卡销售单可重发。按所填邮箱重发凭证邮件并写入动作日志，不改变订单状态与凭证内容。不传 `email` 就发到当前投递邮箱。不是礼卡销售单、凭证已失效、已核销、订单有处理中的退款或处于风控冻结时不可重发 → `409`·`208019`。

        幂等：同键同请求体重发不会再投递一封；换收件邮箱要换新键，沿用旧键改邮箱 → `409`·`908003`；同键的上一次提交还在处理 → `409`·`908002`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: linkId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/LinkId'
        - name: salesOrderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/SalesOrderId'
      requestBody:
        required: true
        content:
          application/json:
