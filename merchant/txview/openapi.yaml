        本地化（**locale 来源 = `Accept-Language`（BCP-47）→ 回退会话 locale → 商户默认；响应回** `Content-Language`）+ 金额带币种；
        结果集上限为业务参数（部署可配置），**超限 → `400`·204009 拒绝 + 提示缩小筛选（不截断、不异步、非上传体过大 413）**。
      parameters:
