        - refunds
      operationId: getRefundReceipt
      summary: 退款收据（PDF，仅成功退款）
      description: |
        为**成功退款**（`SUCCESS`）生成可打印退款收据 PDF。含退款号 / 退款金额 / 原订单引用 / 退回支付方式 / 原订单金额 / 退款完成时间 / 备注 / 状态；**涉换汇时展示付款人扣款币种 / 商户结算币种 / 汇率换算说明**；本地化（**locale 来源 = `Accept-Language`（BCP-47）→ 回退会话 locale → 商户默认；响应回** `Content-Language`）。 非成功退款（处理中 / 审核中 / 失败 / 已拒绝 / 已撤销）→ 404（无收据）。
      parameters:
