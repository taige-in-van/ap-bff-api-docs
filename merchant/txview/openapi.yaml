openapi: 3.1.0
info:
  title: 商户后台 交易管理 — 前端契约面
  version: 0.23.2
  contact:
    name: 商户后台 BFF
  description: |
    商户后台交易域的**读 + 命令**窗口：统一支付交易查询表（多维过滤 + 汇总卡）· 交易详情（含回调技术细节 + 换汇呈现）·
    统一退款查询表 · 退款详情 · 支付 / 退款收据（PDF）· 数据导出（Excel）· 发起退款（凭 Refund PIN）· 撤销待处理退款 · 预授权完成（Release）。

    交易 / 退款 / 预授权的状态机、清结算、Fee、通道交互归支付核心系统，本域只提供「可见 + 可操作」窗口。

    金额一律最小币种单位整数 + currency；列表行不同标价币种不混算，汇总卡单一结算币种（把每笔**实际结算到商户结算币种的金额**相加，不按标价币种分组）；
    换汇信息在**支付渠道给出了汇率或换算说明时**有条件展示——标价 ≠ 结算币种为典型场景、非判定条件。

    字段类型以本 spec 为准。

    **幂等**：所有命令类端点必带 `Idempotency-Key`（缺失 → `400`）。
    同键 + 同请求体重发返首次结果、不重复执行——网络重试请复用同一个键；改了请求体就必须换新键，沿用旧键改内容 → `409`·208005。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（兼前端 BFF）面；浏览器 cookieAuth，非外部面。
security:
  - cookieAuth: []
tags:
  - name: payments
    description: 支付交易：查询表 / 汇总卡 / 详情 / 收据 / 导出（读）+ 发起退款 / 预授权完成（命令）。
  - name: refunds
    description: 退款：查询表 / 详情 / 收据 / 导出（读）+ 撤销待处理退款（命令）。
paths:
  /payments:
    get:
      tags:
        - payments
      operationId: listPayments
      summary: 统一支付交易查询表（过滤 + 排序 + 分页）
      description: |
        返回当前商户支付交易列表（**服务端不设默认时间窗**——页面默认今日由客户端决定并作为普通日期范围发出）。多维过滤（时间 / 支付方式〔品牌 Family〕/ 来源 / 状态）+ 关键词（订单号 / 备注模糊，金额数值精确、跨标价币种按数值命中）+ 排序 + 分页。 每行金额按其标价币种展示、**不同币种不合并**；行操作可见性（可退 / 收据）由后端返回。 汇总卡只统计计入营收的那几个状态（白名单见 `PaymentStatus`），**但列表本身不筛**——两者口径不同、别用卡片笔数去对列表行数。 查询超时 → 降级（展示「暂不可用」，不返回半截数据）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/PaymentMethodFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/PaymentKeyword'
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentSort'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 支付交易分页列表（空 = 空状态、不报错）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentList'
              examples:
                page:
                  summary: 首页 3 条（CAD + CNY 标价、不混算；含一条 REJECTED）
                  value:
                    total: 3
                    data:
                      - orderId: P100240001
                        paymentMethod: wechat
                        source: store_qr
                        amount:
                          amount: '10500'
                          currency: CAD
                        status: PAID
                        transactionTime: '2026-07-19T03:12:00Z'
                        refundable: true
                        receiptAvailable: true
                      - orderId: P100240002
                        paymentMethod: alipay
                        source: payment_link
                        amount:
                          amount: '20000'
                          currency: CNY
                        status: PARTIALLY_REFUNDED
                        transactionTime: '2026-07-19T02:40:00Z'
                        note: 门店订单
                        refundable: true
                        receiptAvailable: true
                      - orderId: P100240003
                        source: payment_link
                        amount:
                          amount: '9900'
                          currency: CAD
                        status: REJECTED
                        transactionTime: '2026-07-19T01:05:00Z'
                        refundable: false
                        receiptAvailable: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /payments/summary:
    get:
      tags:
        - payments
      operationId: getPaymentSummary
      summary: 交易页头汇总卡（随筛选、单一结算币种）
      description: |
        返回与 `listPayments` 同筛选上下文的汇总卡：交易笔数（币种无关计数）+ **单一结算币种**（把每笔**实际结算到商户结算币种的金额**相加得出，**不按标价币种分组**）的 Gross Sales / Refund Amount / Net Sales + To Settle。

        **与列表同轴**：Gross Sales / `transactions` 与 `listPayments` 用同一组筛选参数、**同一批交易进这两个数**，
        但**汇总卡只统计白名单四态**——计入的状态是 `PAID` / `PARTIALLY_REFUNDED` / `REFUNDED` / `PREAUTH_HOLDING`（穷举），
        `FAILED` / `REJECTED` 不计入（钱从未收到）；而列表把这两态也一并列出，故**汇总卡笔数通常小于列表行数**。

        **金额不要靠加总列表行来核对**——行金额是该笔的**标价币种**（同一商户可同时有不同标价币种的收款码），
        Gross Sales 是**结算币种**合计；可核对的是「哪些行计入了汇总」与**笔数**。

        **`refundAmount` / `netSales` 是本页专有量**——分别为**筛选退款额**（按退款当前状态投影）与**筛选净收款额**（= Gross − 筛选退款额），
        **与 Dashboard 的 Refund Amount / Net Sales 口径不同、两者不可互推**（别跨页对数）；
        其中筛选净收款额的两个分量口径不同，**不参与逐行核对承诺**。

        To Settle 为账户账务的资金派生值、**不由交易筛选条件重算**（结算币种口径）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/PaymentMethodFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/PaymentKeyword'
      responses:
        '200':
          description: 汇总卡
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentSummary'
              examples:
                summary:
                  summary: 单一结算币种（CAD）Gross / Refund / Net + To Settle
                  value:
                    transactions: 42
                    grossSales:
                      amount: '700000'
                      currency: CAD
                    refundAmount:
                      amount: '12000'
                      currency: CAD
                    netSales:
                      amount: '688000'
                      currency: CAD
                    toSettle:
                      amount: '495000'
                      currency: CAD
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /payments/counts:
    get:
      tags:
        - payments
      operationId: getPaymentCounts
      summary: 交易列表状态快捷筛选的各项与计数
      description: |
        交易列表顶部状态快捷筛选的各项与计数（形状与用法见 `QuickFilterCounts`）。 `value` 原样回传给 `listPayments` 的 `status`；本端点**不接受** `status`，其余筛选（时间窗 / 支付方式 / 来源 / 关键词）与列表一致。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/PaymentMethodFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - $ref: '#/components/parameters/PaymentKeyword'
      responses:
        '200':
          description: 各项与计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickFilterCounts'
              example:
                items:
                  - value: PAID
                    label: Paid
                    count: 1
                  - value: PARTIALLY_REFUNDED
                    label: Partially refunded
                    count: 1
                  - value: REFUNDED
                    label: Refunded
                    count: 0
                  - value: FAILED
                    label: Failed
                    count: 0
                  - value: REJECTED
                    label: Rejected
                    count: 1
                  - value: PREAUTH_HOLDING
                    label: Pre-auth holding
                    count: 0
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /payments/export:
    get:
      tags:
        - payments
      operationId: exportPayments
      summary: 导出支付交易（按当前筛选全集 Excel）
      description: |
        按当前筛选 / 搜索 / 排序条件命中的**全集**（非当前分页）导出当前商户支付交易 Excel。列头 / 枚举 / 金额 / 日期按 locale 本地化（**locale 来源 = `Accept-Language`（BCP-47）→ 回退会话 locale → 商户默认；响应回** `Content-Language`）、金额带币种。 导出结果集上限为业务参数（部署可配置）；**超过上限 → `400`·204009 拒绝 + 提示缩小筛选范围（不截断、不异步、非上传体过大 413）**，商户收窄条件后重导。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/PaymentMethodFilter'
        - $ref: '#/components/parameters/PaymentSourceFilter'
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentStatus'
        - $ref: '#/components/parameters/PaymentKeyword'
        - name: sort
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentSort'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Excel 文件（xlsx）
          headers:
            Content-Disposition:
              required: true
              description: '`attachment; filename=...xlsx`（下载；filename 编码 RFC 5987）——必返'
              schema:
                type: string
            Content-Language:
              required: true
              description: 实际渲染语言（BCP-47；来自 `Accept-Language` → 会话 locale → 商户默认）——**必返**，可直接据此渲染，不必回退到请求头
              schema:
                type: string
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204009
        - 208001
  /payments/{orderId}:
    get:
      tags:
        - payments
      operationId: getPaymentDetail
      summary: 支付交易详情（含技术细节 + 换汇 + 可退摘要）
      description: |
        单笔交易完整详情：概要（金额 / 状态 / 时间 / 已退金额）+ 订单信息（支付方式 / 来源 / Product 归因 / 客户 / 脱敏付款账户 / 商户订单号 / 平台交易号 / Trade Name / 备注 / 确认时间）+ 关联退款列表 + 技术细节（IP / 回调状态 / 延迟 / URL）+ 换汇呈现（涉换汇时）+ 可退摘要（成交 / 已落账退款额 / 未落账在途占用额 / 剩余可发起额，供发起退款）。 跨 scope（非本商户 / 不存在）统一 404 反枚举。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 交易详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDetail'
              examples:
                cnyWithFx:
                  summary: CNY 标价、涉换汇、部分退款可再退
                  value:
                    orderId: P100240002
                    amount:
                      amount: '20000'
                      currency: CNY
                    status: PARTIALLY_REFUNDED
                    transactionTime: '2026-07-19T02:40:00Z'
                    confirmedAt: '2026-07-19T02:40:05Z'
                    refundedAmount:
                      amount: '5000'
                      currency: CNY
                    paymentMethod: alipay
                    paymentMethodDisplayName: Alipay
                    source: payment_link
                    sourceDisplayName: Payment Link
                    customerName: Jane Doe
                    customerEmail: jane@example.com
                    payerAccountMasked: •••• 6789
                    merchantOrderNo: SHOP-INV-8842
                    platformTxnNo: T880240002
                    tradeName: Acme Store
                    note: 门店订单
                    relatedRefunds:
                      - refundNo: R100240002-1
                        status: SUCCESS
                        amount:
                          amount: '5000'
                          currency: CNY
                        requestTime: '2026-07-19T02:50:00Z'
                    technicalDetails:
                      ip: 203.0.113.7
                      callbackHttpStatus: 200
                      callbackSentAt: '2026-07-19T02:40:06Z'
                      callbackLatencyMs: 120
                      callbackUrl: https://merchant.example/cb
                    fx:
                      payerCurrency: CNY
                      settlementCurrency: CAD
                      exchangeRate: '5.2137'
                      note: FX rate provided by acquiring channel at settlement
                    refundability:
                      refundable: true
                      transactedAmount:
                        amount: '20000'
                        currency: CNY
                      postedRefunded:
                        amount: '5000'
                        currency: CNY
                      pendingReserved:
                        amount: '0'
                        currency: CNY
                      remainingRefundable:
                        amount: '15000'
                        currency: CNY
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /payments/{orderId}/receipt:
    get:
      tags:
        - payments
      operationId: getPaymentReceipt
      summary: 支付收据（PDF，可打印）
      description: |
        为**已收款交易**（`PAID` / `PARTIALLY_REFUNDED` / `REFUNDED`）生成可打印支付收据 PDF。 含商户抬头 / 订单号 / 时间 / 金额明细（含退款行 + 净额）/ 状态 / 换汇说明（涉换汇时）；文案按 locale 本地化（**locale 来源 = `Accept-Language`（BCP-47）→ 回退会话 locale → 商户默认；响应回** `Content-Language`）。 非已收款交易 / `PREAUTH_HOLDING` 挂起单 → 404（无收据）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: PDF 收据
          headers:
            Content-Disposition:
              required: true
              description: '`inline; filename=...pdf`（浏览器打印 / 另存；filename 编码 RFC 5987）——必返'
              schema:
                type: string
            Content-Language:
              required: true
              description: 实际渲染语言（BCP-47；来自 `Accept-Language` → 会话 locale → 商户默认）——**必返**，可直接据此渲染，不必回退到请求头
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /payments/{orderId}/refunds:
    post:
      tags:
        - payments
      operationId: createRefund
      summary: 发起退款（全 / 部分 + Refund PIN）
      description: |
        对**可退订单**发起全额 / 部分退款——可退资格 = **后端权威结果**（`PAID` / `PARTIALLY_REFUNDED` ∧ 剩余可发起额 > 0，**或平台挂起 `PREAUTH_HOLDING` 经预授权放行**）；
        **不要按 status 自行判定能否退款**——一律以 `refundable` / 可退摘要为准，且发起时仍可能被拒（见下方错误分支）。
        金额以成交结果金额币种为准、须 ∈ (0, 剩余可发起额]（= 成交 − 已落账 − 未落账在途占用）。

        凭商户级 Refund PIN 授权，PIN 校验结果映射为响应：

        - 通过 → 继续；
        - 不匹配 / 不可校验 → `403`·206003（反枚举同响应、不披露是否匹配）；
        - 连续失败锁定 → `423`·206004（防爆破）；
        - 数据完整性故障 → `5xx`（**不创建退款单**；资金路径不做即时重试恢复，提示稍后再试 / 联系支持）。

        原始 PIN 仅入参、绝不回显。建单后由平台审核规则判定 `REVIEWING` / `CHANNEL_PROCESSING`（`SUBMITTED` 仅建单阶段瞬态、不回显）。

        允许与未终态退款并发（各占用其额）。退款原因系统默认 `customer_request`、无商户 picker。

        **幂等**：同 `Idempotency-Key` + 同 payload → 返冻结的首次结果、不重复创建退款单；同键异 payload → `409`（208005）；**处理中 → `409`·208011（FE 以同键同 payload 重发 `createRefund` 轮询、无独立查询端点）**。
        退款单已创建即回 `refundNo` + `status`（**首次受理为非终态**；**一经成功即冻结**、后续同键重发返冻结结果），终态经后续刷新收敛（FE 勿误读为最终成功）。

        **可退额校验权威在后端**：BFF 侧剩余可发起额仅 UX 预检（可能陈旧）；后端在受理时原子重验资格 / 币种 / 剩余额并占用——并发两请求之和超限时仅可容纳部分成功、其余以 **`400`·`204008`** 拒绝（可退不足 / 能力关闭 / 产品已核销 / 挂起受理面未开启 均 `400`、**非** `409`；`204007` 仅 BFF 的 `amount` 格式预检），杜绝并发超退资损。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRefundRequest'
            examples:
              partial:
                summary: 部分退款 + Refund PIN（CNY 成交币种）
                value:
                  amount:
                    amount: '5000'
                    currency: CNY
                  note: 客户退货
                  refundPin: '482913'
      responses:
        '201':
          description: 退款单已受理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateRefundResult'
              examples:
                accepted:
                  summary: 受理（进审核）
                  value:
                    refundNo: R100240002-2
                    status: REVIEWING
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204007
        - 204008
        - 206003
        - 206004
        - 208001
        - 208005
        - 208011
  /payments/{orderId}/preauth-completion:
    post:
      tags:
        - payments
      operationId: releasePreAuth
      summary: 预授权完成（Release：PREAUTH_HOLDING → PAID）
      description: |
        对平台挂起型预授权挂起单（订单状态 `PREAUTH_HOLDING`）执行完成（Release）：订单转 `PAID` 并进入下批清结算。

        完成是商户后台**唯一**的预授权操作（作废 / 超时归支付核心）。非 `PREAUTH_HOLDING` → 409。

        **幂等**：必带 `Idempotency-Key`；**本端点无请求体，幂等键作用域 = 该键 + 路径资源** `{orderId}`——同键重发同一订单 → 返首次结果、不重复完成；**同键用于不同 `{orderId}` → `409`（208005）**（网络重试请复用同一个键，换订单必须换新键）。

        失败停留 `PREAUTH_HOLDING` 可重试。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 完成成功（订单商户状态由后端派生：PAID / PARTIALLY_REFUNDED / REFUNDED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreAuthCompletionResult'
              examples:
                released:
                  summary: 预授权完成 → PAID
                  value:
                    orderId: P100240003
                    status: PAID
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208005
        - 208010
  /payments/{orderId}/gift-card/credential-redelivery:
    post:
      tags:
        - payments
      operationId: resendGiftCardCredential
      summary: 重发礼卡凭证邮件（可改收件邮箱）
      description: |
        按所填邮箱重发凭证邮件并写入订单日志；**不改变订单状态与凭证内容**。

        **幂等**：必带 `Idempotency-Key`。同键 + 同请求体重发**不会再投递一封邮件**，直接返首次结果——网络重试请复用同一个键。
        换收件邮箱要重发时**必须换新键**；沿用旧键改邮箱 → `409`·208005。

        仅当详情返回 `giftCard.actions.canResendEmail=true` 时可用——凭证已转 `CANCELED`（退款成功 / Void / **订单**关闭且未交付）或处于**退款冻结**（存在未终态退款）时后端拒绝。

        ⚠️ PaymentLink 停用 / 删除**不**使已售凭证失效，不影响本操作。
        非礼卡订单 404。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: 收件邮箱；默认取原始收卡人邮箱，运营可改
      responses:
        '204':
          description: 已重发
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208005
        - 208019
  /payments/{orderId}/gift-card/voucher-invalidation:
    post:
      tags:
        - payments
      operationId: voidGiftCardVoucher
      summary: 作废礼卡兑换券（Void）
      description: |
        **仅 Voucher Mode、已付款、未核销且无未终态退款**时可用；作废后该券不可继续核销、**不可退款**。
        作废结果不在支付状态上体现（`status` 保持原值）——看 `credentialState=CANCELED` / `invalidation.cause=voucher_voided` / `refundable=false`。

        - 已核销的券不得作废；
        - 退款冻结期（存在未终态退款）不得作废（处置交退款流程收敛）；
        - Inventory Mode 不提供本操作（`actions.canVoid` 恒 false）。

        前端须走站内确认弹窗（展示礼卡订单号 / 券号 / 券 PIN + 风险提示 + 原因备注），不使用浏览器原生确认框。

        **幂等**：必带 `Idempotency-Key`。同键 + 同请求体重发返首次结果、不重复作废——网络重试请复用同一个键。
        同键但请求体不同 → `409`·208005。**换新键再作废已作废的券 → `409`·208018**（当前状态不可执行），不会当成重放。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: 作废原因 / 备注，进订单日志
      responses:
        '204':
          description: 已作废
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208005
        - 208018
  /payments/{orderId}/gift-card/risk-disposition:
    post:
      tags:
        - payments
      operationId: disposeGiftCardOrderRisk
      summary: 礼卡订单风控人工处置
      description: |
        对中 / 高风险礼卡订单执行人工处置：

        - medium 可 `escalate`（升为高风险）/ `blacklist`（加入礼卡客户风险名单）；
        - high 可 `approve`（放行发放）/ `remove_blacklist`（移出）。

        可执行集合读详情的 `giftCard.actions.riskDispositions`。

        ⚠️ 此处「黑名单」是**礼卡客户风险资料**（按「客户标识 + 支付渠道」维度、仅影响该客户后续礼卡交易），
        **不是**平台级风控准入名单，不影响商品码 / 票务、不阻断其他支付。
        中风险订单凭证多已交付，升为高风险**不撤回已交付凭证**。

        **幂等**：必带 `Idempotency-Key`。同键 + 同请求体重发返首次结果、不重复处置——网络重试请复用同一个键。
        改处置动作要重提**必须换新键**；沿用旧键改动作 → `409`·208005。换新键提交时若风险等级已被他人改变、该处置不再可执行 → `409`·208020。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - action
              properties:
                action:
                  type: string
                  enum:
                    - escalate
                    - blacklist
                    - approve
                    - remove_blacklist
                note:
                  type:
                    - string
                    - 'null'
                  description: 处置备注，进订单日志
      responses:
        '204':
          description: 已处置
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208005
        - 208020
  /refunds:
