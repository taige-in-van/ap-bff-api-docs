  /refunds/{refundNo}/cancellation:
    post:
      tags:
        - refunds
      operationId: voidRefund
      summary: 撤销待处理退款（仅 REVIEWING）
      description: |
        撤销当前商户仍在审核中（未进通道：`REVIEWING`）的退款：退款单转 `CANCELLED`、不退款、**仅释放该笔可退额度占用**（其他未终态退款占用不受影响）、剩余可发起额回升。（`SUBMITTED` 不会出现在响应里，也不作可撤入口。）

        `CHANNEL_PROCESSING` / `SUCCESS` / `FAILED` / `REJECTED` 不可撤 → `409`（208009）；**已 `CANCELLED` 再撤 → 幂等** `200`（天然幂等、无副作用——已达目标终态）。

        **幂等**：必带 `Idempotency-Key`；**本端点无请求体，幂等键作用域 = 该键 + 路径资源** `{refundNo}`——同键重发同一退款 → 返首次结果、不重复撤销；**同键用于不同 `{refundNo}` → `409`（208005）**（网络重试请复用同一个键，换退款单必须换新键）；对已撤单的新撤销请求天然幂等（无副作用）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: refundNo
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 撤销成功（退款单转 CANCELLED）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundCancellationResult'
              examples:
                cancelled:
                  summary: 撤销待处理退款
                  value:
                    refundNo: R100240002-3
                    status: CANCELLED
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208005
        - 208009
components:
  parameters:
    FromDate:
      name: from
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LocalDate'
      description: 起始日期（含当日）。**与 `to` 同为必填**——交易 / 退款列表恒在一个时间窗内查询，业务上没有「看全部」这个诉求， 故不允许省略成无界查询。 **服务端不设默认时间窗**——页面初始展示哪一段（支付列表今日 / 退款列表近 30 天）由客户端自己算出并作为具体日期发出， 服务端不代为求「今日」。 列表 / 汇总 / 导出**共享同一组查询参数**；各自筛的是哪个日期由服务端按列表语义固定、**前端不选** （由此汇总卡内部分字段口径不同，见 `getPaymentSummary`）。
    ToDate:
      name: to
      in: query
      required: true
      schema:
        $ref: '#/components/schemas/LocalDate'
      description: 截止日期（含当日；与 `from` 成对必填）。
    PaymentMethodFilter:
      name: paymentMethod
      in: query
      required: false
      schema:
        type: string
      description: 支付方式筛选（**稳定 Family code**，如 `wechat` / `alipay`——非本地化展示名；候选集 = `filterOptions.paymentMethods[].code`）。
    PaymentSourceFilter:
      name: source
      in: query
      required: false
      schema:
        type: string
      description: 来源筛选（**稳定来源 code**，如 `store_qr`——非展示文案；后端动态配置枚举、候选集 = `filterOptions.sources[].code`）。退款侧 = **原支付来源**（≠ 退款来源 refundSource——后者服务端用于排除 system_auto、不作 FE 筛选值）。
    PaymentKeyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
      description: 关键词：订单号 / 备注模糊；纯数值按金额精确匹配（跨标价币种按数值命中、不区分币种）。
    RefundKeyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
      description: 关键词：退款号 / 原订单号 / 备注模糊；纯数值按金额精确匹配。
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 本地化 locale（BCP-47，如 `zh-Hans` / `fr-CA`）——**FE 传当前界面 / 用户语言**；服务端渲染二进制（PDF / xlsx）时执行 **BCP-47 best-match**（如 `fr-CA` → `fr`）、再无匹配才回退**会话 locale → 商户默认**。实际结果经 `Content-Language` 回报。
    MerchantContextGuard:
      name: X-Merchant-Context
      in: header
      required: true
      description: |
        stale-tab 一致性守卫（读写统一）：页面预期的当前商户 ID。与会话当前商户比对，一致才执行；不一致时**读不返回错商户数据、写不执行**，并按下面两种情形二分：

        - **① 会话有当前商户、只是与 expected 不同 → `409` · `208001`（`MERCHANT_CONTEXT_CHANGED`）**，响应 `context.currentMerchantId` 回显服务端当前商户供前端直接 re-sync；
        - **② 会话没有当前商户（无可回显者）→ `409` · `208022`（`MERCHANT_NOT_ACCESSIBLE`）**，前端重跑启动链路按 `routeTo` 分流（见 API 基础约定「merchant scope + stale-tab 守卫」）。

        挂在所有依赖当前商户的读 + 写接口；前端统一 interceptor 发送 + 处理 409（提示并刷新当前商户）。

        **豁免**：不依赖「当前商户」的接口——当前商户的 re-sync / 切换入口本身，以及目标由 path 直接指定、与当前商户无关的接口。

        某个接口挂没挂本 header，**看该接口的 `parameters` 即可**（挂了就是必带）。
      schema:
        type: string
        minLength: 1
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: \S
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: \S
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 商户级读写另挂 MerchantContextGuard 守卫（见下方 parameters）。
  schemas:
    PaymentStatus:
      type: string
      description: |
        支付订单**商户可见状态**：`PAID` 已收款 · `PARTIALLY_REFUNDED` 部分退款 · `REFUNDED` 全额退款 · `FAILED` 失败 · `REJECTED` 平台未受理 · `PREAUTH_HOLDING` 预授权挂起。

        `PAID` / `PARTIALLY_REFUNDED` / `REFUNDED` 三者同属**已收款**、按已落账退款量区分（「已落账」= 通道受理成功；受理后失败会回退，故订单可能从 `PARTIALLY_REFUNDED` 退回 `PAID`）；`REJECTED` 未受理、`FAILED` 收款失败、`PREAUTH_HOLDING` 预授权挂起待放行。收款过程中的中间态不进列表。

        **`REJECTED` 与 `FAILED` 不可混用**：`REJECTED` = 平台未受理该笔交易、**支付从未发生**（无支付尝试、不可退款、无收据，`refundable` / `receiptAvailable` 恒 false）；`FAILED` = 已尝试支付但失败。

        **计入营收类聚合（收款额 / 净额 / 笔数）的状态白名单（穷举）**：`PAID` · `PARTIALLY_REFUNDED` · `REFUNDED` · `PREAUTH_HOLDING`——哪些页面有这类聚合、聚合字段叫什么，见该页契约。

        **不计入聚合 ≠ 不在列表**：本 enum 的每个取值都可能作为列表行出现（`FAILED` / `REJECTED` 亦然）、并可按状态单独筛出——别以为列表只给成功单。

        **封闭 enum**（取值集固定、可穷举分支）；仍须 unknown-safe 处理未识别值（保守对待、不静默丢弃）。
      enum:
        - PAID
        - PARTIALLY_REFUNDED
        - REFUNDED
        - FAILED
        - REJECTED
        - PREAUTH_HOLDING
    RefundStatus:
      type: string
      description: |
        退款状态（**商户可观察态**）：`REVIEWING` 审核中 · `CHANNEL_PROCESSING` 通道处理中 · `SUCCESS` 成功 · `FAILED` 失败 · `REJECTED` 已拒绝 · `CANCELLED` 已撤销。 **`SUBMITTED` 不在商户可观察态**（受理过程中的中间态，不会出现在响应里、也不作可撤入口）；正常可撤 = `REVIEWING`（未进通道），`CHANNEL_PROCESSING`+ 不可撤。**封闭 enum**（取值集固定、可穷举分支）；仍须 unknown-safe。
      enum:
        - REVIEWING
        - CHANNEL_PROCESSING
        - SUCCESS
        - FAILED
        - REJECTED
        - CANCELLED
    PaymentSort:
      type: string
      description: 支付列表排序（默认时间倒序）。**封闭 enum**（取值集固定、可穷举分支）；仍须 unknown-safe。
      enum:
        - time_desc
        - time_asc
        - amount_desc
        - amount_asc
    RefundSort:
      type: string
      description: 退款列表排序（默认申请时间倒序）。**封闭 enum**（取值集固定、可穷举分支）；仍须 unknown-safe。
      enum:
        - time_desc
        - time_asc
        - amount_desc
        - amount_asc
    FxInfo:
      type: object
      description: |
        换汇呈现（**present 条件 = 支付渠道给出了汇率或换算说明**——标价 ≠ 结算币种为典型场景、非判定条件）：付款人扣款币种 / 商户结算币种 / 汇率 / 换算说明。

        汇率与换算说明的**数值均来自支付渠道回报**，平台不自行推算（不拿平台牌价充当成交汇率）；汇率仅做方向 / 标度的**等价归一**（见 `exchangeRate`）。

        有的渠道只给结算金额、不给汇率，此时**整体不返回 `fx` 本键**（**不存在「空 fx」**，N/A 呈现归 FE）。**present 时 `exchangeRate` 与 `note` 至少一个非空**。

        **仅供展示**：本块只用于告诉商户「这笔发生过换汇、渠道给的汇率/说明是什么」，**请勿用 `exchangeRate` 反算任何金额**，也不作退款校验币种。
      required:
        - payerCurrency
        - settlementCurrency
      properties:
        payerCurrency:
          $ref: '#/components/schemas/Currency'
        settlementCurrency:
          $ref: '#/components/schemas/Currency'
        exchangeRate:
          type: string
          description: 汇率（十进制字符串；**方向：1 单位 `settlementCurrency` = `exchangeRate` 单位** `payerCurrency`——如结算 CAD、付款 CNY 时形如 `5.2`。**方向由平台统一归一**（数值取自渠道回报，平台只做方向与标度的等价换算、不自行定价也不重算金额）；**渠道未给汇率则不返回本键**）
        note:
          type: string
          description: 换算说明（**通道原文——原样展示、不保证本地化**；事实数据、非平台生成文案）；**渠道未给说明则不返回本键**
      anyOf:
        - required:
            - exchangeRate
          properties:
            exchangeRate:
              type: string
              minLength: 1
        - required:
            - note
          properties:
            note:
              type: string
              minLength: 1
    PaymentRow:
      type: object
      description: 支付交易列表行（默认列）。付款人 / 客户明细归详情，不入列表。凡呈现交易列表的页面（交易管理列表、Payment Link 详情的交易 tab）**行形状逐字段相同**，行组件可直接复用。
      required:
        - orderId
        - source
        - amount
        - status
        - transactionTime
        - refundable
        - receiptAvailable
      properties:
        orderId:
          type: string
          minLength: 1
          description: 平台订单号（全局唯一；列表 / 详情 / 命令主键；≠ 商户自填订单号）
        paymentMethod:
          type: string
          description: 支付方式（**稳定 Family code**，如 `wechat`——不是展示名）。**展示名 / 图标 FE 按 code 本地化**；拿不到本地化资源时，用交易管理契约 `getTransactionFilterOptions` 的 `paymentMethods[].displayName` 作 canonical 兜底（该目录是**商户级**、不随页面或筛选条件变，凡呈现本行的页面都可取用）。`status = REJECTED` **时不返回本键**——平台未受理、从未发生支付尝试，故无支付方式可言；FE 在本键缺席时呈现「—」，不得回退为任意默认方式
        source:
          type: string
          description: 来源（**稳定 code**，如 `store_qr`，后端动态配置枚举；不是展示名）。展示名同上——按 code 本地化，`getTransactionFilterOptions` 的 `sources[].displayName` 作 canonical 兜底
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactionTime:
          $ref: '#/components/schemas/Timestamp'
        note:
          type: string
          description: 备注（无则不返回本键）。**成型后的展示文本**——前端直接显示、**不要反解析成结构**（内容可能较长；格式非契约、随时可能变化）
        refundable:
          type: boolean
          description: 可退——**后端可退资格结果**（`PAID` / `PARTIALLY_REFUNDED` ∧ 剩余可发起额 > 0，**或平台挂起 `PREAUTH_HOLDING` 经预授权放行**）；非按 status 硬编码。行内退款入口可见性。
        receiptAvailable:
          type: boolean
          description: 该笔已收款（`PAID` / `PARTIALLY_REFUNDED` / `REFUNDED`）、有收据可取。**取收据的端点在交易管理契约**；所在页没有收据入口时本键可忽略
    FilterOptions:
      type: object
      description: 动态筛选选项（支付方式 / 来源；从**原支付全集**派生；退款页与支付页**同源**、非仅当前结果，由后端输出）。
      required:
        - paymentMethods
        - sources
      properties:
        paymentMethods:
          type: array
          uniqueItems: true
          description: 可选支付方式（**稳定 code + canonical 默认展示名**——筛选 / 行值用 code、FE 按 code 本地化、`displayName` 只作 unknown-safe fallback；防 locale / 展示名变化导致筛选失效）
          items:
            type: object
            required:
              - code
              - displayName
            properties:
              code:
                type: string
                description: 品牌 Family code（稳定值，作查询参数 / 行值）
              displayName:
                type: string
                description: canonical 默认展示名（**非本地化**、不随 locale 变；FE 按 code 本地化、此值作 unknown-safe fallback）
        sources:
          type: array
          uniqueItems: true
          description: 可选来源（稳定 code + canonical 默认展示名，同上）
          items:
            type: object
            required:
              - code
              - displayName
            properties:
              code:
                type: string
                description: 来源 code（稳定值）
              displayName:
                type: string
                description: canonical 默认展示名（非本地化；FE 按 code 本地化、此值作 fallback）
    PaymentList:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
          description: 命中总数（分页）
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentRow'
    PaymentSummary:
      type: object
      description: |
        交易页头汇总卡（随筛选，**单一结算币种口径**；把每笔**实际结算到商户结算币种的金额**相加得出，**不按标价币种分组**——「不混算」管列表行、非汇总卡）。

        **只有 `grossSales` / `transactions` 与列表同轴**（同一组筛选参数、**同一批交易进这两个数**，可判定某行是否计入汇总、笔数可直接核对；但**行金额是该笔标价币种、`grossSales` 是结算币种合计，不要靠加总行金额来核对**）；

        `refundAmount` 是**筛选退款额**（按退款当前状态投影），`netSales` 是**筛选净收款额**（= Gross − 筛选退款额）的**混口径派生量**——**不参与逐行核对承诺、不得用 `transactions` 对其取平均**。

        各字段状态范围另见各字段说明。
      required:
        - transactions
        - grossSales
        - refundAmount
        - netSales
      properties:
        transactions:
          type: integer
          minimum: 0
          description: 计入汇总的交易笔数（随筛选）——**仅计 `PAID` / `PARTIALLY_REFUNDED` / `REFUNDED` / `PREAUTH_HOLDING` 四态**（白名单、穷举；`FAILED` / `REJECTED` 不计），故筛选范围含这两态时本值小于列表行数。**仅与 Gross Sales 同口径**（可据此算平均单笔收款金额）。**不得用于对 `netSales` 取平均**——后者混了口径不同的两个分量，分母对不上。
        grossSales:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 总收款（结算币种；Gross Sales）
        refundAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: '**筛选退款额**（结算币种）—— 本页专有量、**非 Dashboard 的 Refund Amount 指标**：按退款**当前状态**投影（仅计 `CHANNEL_PROCESSING` + `SUCCESS`，故受理后失败的退款会退出本汇总）；**排除** `refundSource=system_auto`，同退款列表 / 导出口径。Dashboard 的 Refund Amount 是另一套口径（有符号、可为负），两者**不可互推**'
        netSales:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: '**筛选净收款额** = Gross Sales − 筛选退款额（结算币种）—— 本页专有量、**非 Dashboard 的 Net Sales 指标**；两个分量口径不同（Gross 与列表同轴、筛选退款额不与列表同轴），故**不参与逐行核对承诺**'
        toSettle:
          description: To Settle（结算币种，账务资金派生值；无则不返回本键）
          allOf:
            - $ref: '#/components/schemas/Money'
    RefundRef:
      type: object
      description: 交易详情内的关联退款条目。
      required:
        - refundNo
        - status
        - amount
        - requestTime
      properties:
        refundNo:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/RefundStatus'
        amount:
          $ref: '#/components/schemas/Money'
        requestTime:
          $ref: '#/components/schemas/Timestamp'
    TechnicalDetails:
      type: object
      description: 回调技术细节（审计可观测；默认折叠）。**五个字段均为可选——无值时不返回对应键**，FE 逐键判断有无、缺席即呈现「—」。
      properties:
        ip:
          type: string
          description: 付款人 / 回调来源 IP（无则不返回本键）
        callbackHttpStatus:
          type: integer
          description: 回调 HTTP 状态码（未取得响应则不返回本键）
        callbackSentAt:
          description: 回调发送时间（未发送则不返回本键）
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        callbackLatencyMs:
          type: integer
          description: 回调延迟（毫秒；无则不返回本键）
        callbackUrl:
          type: string
          description: 回调 URL（未配置则不返回本键）
    Refundability:
      type: object
      description: 可退摘要（供发起退款前展示 + 入口可见性）。**来自后端权威结果**（成交 / **已落账** / **未落账在途占用** / 剩余额 + 可退资格）：仅供展示与入口可见性判断，**发起时仍会被重新校验**（可能被拒，见 `createRefund` 的错误分支）；无占用行 = 零占用；本面只展示这些取值、不自行重算。同标价币种口径。
      required:
        - refundable
        - transactedAmount
        - postedRefunded
        - pendingReserved
        - remainingRefundable
      properties:
        refundable:
          type: boolean
          description: 后端可退资格结果（权威、非按余额 / null 推断）——`true` 才可发起、金额再满足 `remainingRefundable` > 0
        transactedAmount:
          $ref: '#/components/schemas/Money'
        postedRefunded:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: '**已落账退款额**——已达通道受理成功里程碑（商户已被扣款），**含尚未最终成功的在途**；受理后失败经冲正 / 回冲回退'
        pendingReserved:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: '**未落账在途占用额**——受理事务已占用、但尚未获通道受理成功的部分。**注意与「在途 / in-flight」不等同**：已落账但尚未最终成功的退款同样在途，它计入 `postedRefunded` 而非本字段；两字段的分界是**落账里程碑**（通道受理成功），非退款是否终态'
        remainingRefundable:
          $ref: '#/components/schemas/Money'
          description: 剩余可发起额 = 成交 − 已落账 − 未落账在途占用；> 0 才可发起退款
    PaymentDetail:
      type: object
      description: |
        支付交易详情。
        可选字段（不适用时不返回本键）：merchantOrderNo / confirmedAt / refundedAmount / fx / giftCard / paymentMethod / paymentMethodDisplayName / platformTxnNo——FE 逐键判断有无，缺席 = 不适用。

        **后三者在 `status = REJECTED` 时不返回本键**：平台未受理、从未产生支付尝试，无支付方式与平台交易号可言。
        FE 在这些键缺席时呈现「—」，**不得编造交易号或回退为任意默认支付方式**。（`refundability` 该态**仍恒 present**、四个金额位为 0，见其自身说明。）
      required:
        - orderId
        - amount
        - status
        - transactionTime
        - source
        - sourceDisplayName
        - relatedRefunds
        - technicalDetails
        - refundability
      properties:
        orderId:
          type: string
          minLength: 1
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactionTime:
          $ref: '#/components/schemas/Timestamp'
        confirmedAt:
          description: 确认时间（未确认则不返回本键）
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        refundedAmount:
          description: 已落账退款累计（通道受理成功即计入、含尚未最终成功的在途；受理后失败经冲正 / 回冲回退；无退款则不返回本键）
          allOf:
            - $ref: '#/components/schemas/Money'
        paymentMethod:
          type: string
          description: 支付方式（**稳定 Family code**）。`status = REJECTED` 时不返回本键
        paymentMethodDisplayName:
          type: string
          description: 支付方式 **canonical 默认展示名**（非本地化；FE 按 code 本地化、此值作 unknown-safe fallback——详情自足、邮件 CTA 深链直开不依赖列表 filterOptions；**PDF / xlsx 的服务端本地化与此无关**、按请求 locale 另行渲染）。`status = REJECTED` 时不返回本键
        source:
          type: string
          description: 来源（**稳定 code**）
        sourceDisplayName:
          type: string
          description: 来源 **canonical 默认展示名**（非本地化；FE 按 code 本地化、此值作 fallback；详情自足）
        productAttribution:
          type: string
          description: Product 归因（无则不返回本键）
        customerName:
          type: string
          description: 客户姓名（无则不返回本键）
        customerEmail:
          type: string
          description: 客户邮箱（无则不返回本键）
        payerAccountMasked:
          type: string
          description: 付款账户（脱敏；通道未给则不返回本键）
        merchantOrderNo:
          type: string
          description: 商户自填订单号（可复制；允许缺省 → 缺省时不返回本键；orderId 才是平台主键）
        platformTxnNo:
          type: string
          description: 平台交易号（可复制）。`status = REJECTED` 时不返回本键——从未建立支付交易
        tradeName:
          type: string
          description: Trade Name（无则不返回本键）
        note:
          type: string
          description: 备注（无则不返回本键）。**成型后的展示文本**——前端直接显示、**不要反解析成结构**（内容可能较长；格式非契约、随时可能变化）
        relatedRefunds:
          type: array
          description: 关联退款（无则空数组）
          items:
            $ref: '#/components/schemas/RefundRef'
        technicalDetails:
          $ref: '#/components/schemas/TechnicalDetails'
        fx:
          description: 换汇呈现（仅涉换汇时 present、否则不返回本键）
          allOf:
            - $ref: '#/components/schemas/FxInfo'
        refundability:
          description: '可退摘要（**恒返非空**）：`refundable: true/false` = 后端 gate 结果、FE 据此判入口、**不按 null 推断**；不可退时 `refundable=false` + `remainingRefundable=0`。`status = REJECTED` **时四个金额位一律为 0**（该单从未成交，故成交额 / 已落账退款 / 在途占用 / 剩余可退**均确为零**——不是缺失、更不是占位），`refundable=false`；币种取该单标价币种。如此保持本块恒非空，FE 无需为该态分叉。'
          allOf:
            - $ref: '#/components/schemas/Refundability'
        giftCard:
          description: 礼卡订单扩展段（**仅礼卡订单 present，其余不返回本键**）。语义与前置条件由后端判定，本面只呈现与转发命令。
          allOf:
            - $ref: '#/components/schemas/GiftCardOrderDetail'
    GiftCardOrderDetail:
      type: object
      description: 礼卡订单详情扩展（订单详情页的礼卡扩展区）。**内容按 `fulfillmentMode` 分叉**： Inventory Mode 无核销态、不展示 Void 入口；Voucher Mode 有核销态与 Void。 **可执行动作一律读 `actions.*`、不要按状态自行推断**——闸的权威在后端返回的 `actions.*`。
      required:
        - fulfillmentMode
        - giftCardOrderId
        - campaignName
        - giftCardName
        - purchaseType
        - buyer
        - recipient
        - credentialState
        - refundFrozen
        - credential
        - risk
        - actions
        - orderLog
      properties:
        fulfillmentMode:
          type: string
          enum:
            - inventory
            - voucher
          description: 履约模式（创建后不可变更）
        giftCardOrderId:
          type: string
          minLength: 1
        channelOrderId:
          type: string
          description: 通道订单号（无则不返回本键）
        paymentId:
          type: string
          description: 支付单号（无则不返回本键）
        customerId:
          type: string
          description: 付款人客户标识（无则不返回本键）
        campaignName:
          type: string
          description: 后台活动名（订单列表主标题；**不面向持卡人**）
        giftCardName:
          type: string
          description: 用户可见礼卡商品名（订单列表副标题）
        faceValue:
          $ref: '#/components/schemas/Money'
        price:
          $ref: '#/components/schemas/Money'
        discountAmount:
          description: 折扣额（Promotion Type=discount 时 present，否则不返回本键）
          allOf:
            - $ref: '#/components/schemas/Money'
        purchaseType:
          type: string
          enum:
            - self
            - gift
          description: 自购 / 送礼。**两种模式下 buyer 与 recipient 均展示**
        buyer:
          $ref: '#/components/schemas/GiftCardParty'
        recipient:
          allOf:
            - $ref: '#/components/schemas/GiftCardParty'
          description: 收卡人；送礼时另带留言
        credentialState:
          type: string
          enum:
            - PENDING
            - ISSUABLE
            - ISSUED
            - SUSPENDED
            - CANCELED
          description: 凭证发放态（由后端维护）。`CANCELED` = 已失效、不得重发或核销，成因见 `invalidation`。 ⚠️ **PaymentLink 停用 / 删除不会使已售凭证失效**——它只阻止后续购买。
        refundFrozen:
          type: boolean
          description: 退款冻结标记（由后端维护）——该订单存在未终态退款时为 true，**与 `credentialState` 正交** （冻结不改发放态）。冻结期不得核销 / 重发 / Void，`actions.*` 相应为 false；退款全部终态且无一成功后解冻， 任一退款成功则凭证转 `CANCELED`（届时本字段回 false、以 `invalidation` 为准）。FE 据此展示「退款处理中」提示。
        invalidation:
          description: 凭证失效详情（`credentialState=CANCELED` 时 present，否则不返回本键）——FE 据此决定呈现哪一支
          allOf:
            - $ref: '#/components/schemas/GiftCardInvalidation'
        credential:
          $ref: '#/components/schemas/GiftCardCredential'
        risk:
          $ref: '#/components/schemas/GiftCardRisk'
        actions:
          $ref: '#/components/schemas/GiftCardActions'
        orderLog:
          type: array
          description: 订单日志（四类留痕，时间序）
          items:
            $ref: '#/components/schemas/GiftCardLogEntry'
    GiftCardInvalidation:
      type: object
      description: 凭证失效详情。`stockOutcome` **是 FE 分流呈现的判别位**： `returned_to_pool` → 显示「整组卡条目已回库」；`offline_voidance_required` → 显示「请在线下作废全部已交付品牌卡」 （该线下动作**不作为退款前置、不做系统联动**）；`not_applicable` → Voucher Mode，券由平台直接置为不可核销。
      required:
        - cause
        - stockOutcome
      properties:
        cause:
          type: string
          enum:
            - refund_succeeded
            - voucher_voided
            - order_closed
          description: 失效成因：`refund_succeeded` 任一全额 / 部分退款经通道执行成功（退款在途仅冻结、不失效，见 `refundFrozen`）； `voucher_voided` Voucher Mode 执行 Void； `order_closed` 订单关闭且**凭证未交付**。**不含 PaymentLink 停用 / 删除**——那不使已售凭证失效。
        stockOutcome:
          type: string
          enum:
            - returned_to_pool
            - offline_voidance_required
            - not_applicable
          description: Inventory Mode 库存后果；Voucher Mode 恒 `not_applicable`
    GiftCardParty:
      type: object
      properties:
        name:
          type: string
          description: 姓名（无则不返回本键）
        email:
          type: string
          description: 邮箱（无则不返回本键）
        greetingMessage:
          type: string
          description: 送礼留言（仅 recipient；自购时不返回本键）
    GiftCardCredential:
      description: 凭证信息，**按 `fulfillmentMode` 判别两种形状**——两支各自只带自己那套字段，不再互相占位。 **PIN 单独看** `pinVisibility`：凭证正文经邮件交付、后台不作为分发渠道，所以「有权看且凭证有效」时才给 PIN 值； 其余情形只说明原因、不给值（这与「本模式没有这个字段」是两回事，勿混）。
      oneOf:
        - $ref: '#/components/schemas/GiftCardInventoryCredential'
        - $ref: '#/components/schemas/GiftCardVoucherCredential'
      discriminator:
        propertyName: fulfillmentMode
        mapping:
          inventory: '#/components/schemas/GiftCardInventoryCredential'
          voucher: '#/components/schemas/GiftCardVoucherCredential'
    GiftCardCredentialCommon:
      type: object
      description: 两种凭证形态共有的展示字段。
      properties:
        mainAmount:
          description: 主卡金额（展示三项金额、供门店按额兑换时给；不适用则不返回本键）
          allOf:
            - $ref: '#/components/schemas/Money'
        bonusAmount:
          description: 赠卡金额（同上）
          allOf:
            - $ref: '#/components/schemas/Money'
        totalAmount:
          description: 合计金额（同上）
          allOf:
            - $ref: '#/components/schemas/Money'
        bonusNotes:
          type: string
          description: 赠卡备注（仅 Bonus Terms=custom 时；否则不返回本键）
        pinVisibility:
          $ref: '#/components/schemas/GiftCardPinVisibility'
    GiftCardPinVisibility:
      type: string
      description: PIN 的可见性。`visible` = 本响应给出 PIN 值；`hidden_no_permission` = 调用方无权查看； `hidden_credential_inactive` = 凭证已失效 / 已作废。**非 `visible` 时不返回 PIN 键**。
      enum:
        - visible
        - hidden_no_permission
        - hidden_credential_inactive
    GiftCardInventoryCredential:
      description: Inventory Mode 凭证：发预先导入的真品牌卡。Bonus Card 订单可能另带赠卡，与主卡同属一个**凭证组**、整组同生共死。**无平台核销**，故不带核销态。
      allOf:
        - $ref: '#/components/schemas/GiftCardCredentialCommon'
        - type: object
          required:
            - fulfillmentMode
            - cardNoMasked
            - pinVisibility
          properties:
            fulfillmentMode:
              type: string
              const: inventory
            pinVisibility:
              $ref: '#/components/schemas/GiftCardPinVisibility'
            cardNoMasked:
              type: string
              description: 礼卡卡号（脱敏）
            cardPin:
              type: string
              description: 礼卡 PIN——**仅 `pinVisibility=visible` 时返回**
            bonusCardNoMasked:
              type: string
              description: 赠卡卡号（脱敏）——**仅 Bonus Card 分两张卡时返回**
            bonusCardPin:
              type: string
              description: 赠卡 PIN——同上，且须 `pinVisibility=visible`
    GiftCardVoucherCredential:
      description: Voucher Mode 凭证：发系统生成的兑换券，门店核销 + 可 Void，故带核销态与核销规则。
      allOf:
        - $ref: '#/components/schemas/GiftCardCredentialCommon'
        - type: object
          required:
            - fulfillmentMode
            - voucherNo
            - redemptionStatus
            - redemptionRule
            - pinVisibility
          properties:
            fulfillmentMode:
              type: string
              const: voucher
            pinVisibility:
              $ref: '#/components/schemas/GiftCardPinVisibility'
            voucherNo:
              type: string
              description: 兑换券号
            voucherPin:
              type: string
              description: 兑换券 PIN——**仅 `pinVisibility=visible` 时返回**
            redemptionStatus:
              type: string
              enum:
                - not_redeemed
                - redeemed
                - voided
              description: 核销态
            redemptionRule:
              type: string
              enum:
                - one_time
              description: 核销规则；本期取值集合仅一次性核销
    GiftCardRisk:
      type: object
      description: 订单风险（仅活动开启 Order Risk Review 时有意义）。等级由后端判定，本面只呈现。
      required:
        - level
        - reasons
      properties:
        level:
          type: string
          enum:
            - normal
            - medium
            - high
          description: normal 不展示风险标签与处置区
        reasons:
          type: array
          description: 风控命中原因（人类可读；normal 时空数组）
          items:
            type: string
    GiftCardActions:
      type: object
      description: '**后端 gate 结果**，FE 据此决定入口显隐、不自行按状态推断（同 `refundability.refundable` 的路子）。 `riskDispositions` 为空数组即不展示处置区。'
      required:
        - canResendEmail
        - canVoid
        - riskDispositions
      properties:
        canResendEmail:
          type: boolean
          description: 凭证仍有效且无退款冻结时为 true；`credentialState=CANCELED` 或 `refundFrozen=true` 时为 false
        canVoid:
          type: boolean
          description: 仅 voucher 且已付款、未核销、无未终态退款时为 true；inventory 或退款冻结期恒 false
        riskDispositions:
          type: array
          description: 当前可执行的风控处置。medium → escalate / blacklist；high → approve / remove_blacklist；normal → 空
          items:
            type: string
            enum:
              - escalate
              - blacklist
              - approve
              - remove_blacklist
    GiftCardLogEntry:
      type: object
      required:
        - time
        - type
        - event
      properties:
        time:
          $ref: '#/components/schemas/Timestamp'
        type:
          type: string
          enum:
            - order
            - payment
            - risk
            - operation
          description: 创建订单 / 发起支付 / 风控命中原因 / 人工操作
        event:
          type: string
          description: 留痕文案
    RefundRow:
      type: object
      description: 退款列表行（默认列）。
      required:
        - refundNo
        - originalOrderId
        - paymentMethod
        - source
        - amount
        - isPartial
        - status
        - requestTime
        - voidable
        - receiptAvailable
      properties:
        refundNo:
          type: string
          minLength: 1
        originalOrderId:
          type: string
          minLength: 1
          description: 原交易（可回链原支付详情）
        paymentMethod:
          type: string
          description: 原支付方式（**稳定 Family code**，取自原交易）
        source:
          type: string
          description: '**原支付来源**（paymentSource，取自原交易；≠ 退款来源 refundSource）'
        amount:
          $ref: '#/components/schemas/Money'
          description: 退款金额（负向由 FE 呈现）
        isPartial:
          type: boolean
          description: 部分退款（true）/ 全额退款（false）
        originalAmount:
          description: 原订单金额（部分退款辅助信息；否则不返回本键）
          allOf:
            - $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/RefundStatus'
        requestTime:
          $ref: '#/components/schemas/Timestamp'
        note:
          type: string
          description: 退款备注（无则不返回本键）
        voidable:
          type: boolean
          description: 可撤（`REVIEWING`，未进通道；`SUBMITTED` 是内部瞬态、不作商户可撤态）——撤销入口可见性
        receiptAvailable:
          type: boolean
          description: 成功退款（`SUCCESS`）——收据入口可见性
    RefundList:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/RefundRow'
    RefundDetail:
      type: object
      description: 退款详情。`completedAt` **仅 `SUCCESS` 返回**，其余状态不返回本键。**不含换汇字段**——退款详情不展示换汇信息；换汇仅在退款收据呈现。
      required:
        - refundNo
        - amount
        - status
        - requestTime
        - isPartial
        - paymentMethod
        - paymentMethodDisplayName
        - source
        - sourceDisplayName
        - initiatorType
        - initiatedBy
        - originalOrderId
        - originalAmount
        - voidable
        - receiptAvailable
      properties:
        refundNo:
          type: string
          minLength: 1
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/RefundStatus'
        requestTime:
          $ref: '#/components/schemas/Timestamp'
        isPartial:
          type: boolean
        paymentMethod:
          type: string
          description: 原支付方式（**稳定 Family code**，取自原交易）
        paymentMethodDisplayName:
          type: string
          description: 原支付方式 **canonical 默认展示名**（非本地化；FE 按 code 本地化、此值作 fallback；详情自足、深链直开可用）
        source:
          type: string
          description: '**原支付来源**（paymentSource code，取自原交易；≠ 退款来源）'
        sourceDisplayName:
          type: string
          description: 原支付来源 **canonical 默认展示名**（非本地化；FE 按 code 本地化、此值作 fallback；详情自足）
        customerName:
          type: string
          description: 客户姓名（无则不返回本键）
        customerEmail:
          type: string
          description: 客户邮箱（无则不返回本键）
        initiatorType:
          type: string
          enum:
            - merchant_user
            - api_client
            - pos_device
            - system
            - unknown
          description: 发起人类型 **discriminant**（后端返回、缺失归 `unknown`）——FE 据此决定 `initiatedBy` 的用法：`merchant_user` → 直接展示；其余 → 按 type 本地化展示、`initiatedBy` 仅作 fallback。**不由退款来源 `refundSource` 推导**（来源是业务维度、非发起人）。
        initiatedBy:
          type: string
          minLength: 1
          description: 发起人**安全展示值（非空、必显）**：`initiatorType=merchant_user` → 商户用户展示名（后端解析）；其余 type → **canonical 默认标签**（unknown-safe fallback、非本地化——FE 按 `initiatorType` 本地化、此值兜底）。发起人原始标识仍排除〔敏感〕
        completedAt:
          description: 退款完成时间（**仅 `SUCCESS` 返回**；其余状态不返回本键）
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        originalOrderId:
          type: string
          minLength: 1
          description: 原订单引用（可复制 + 回链）
        originalAmount:
          $ref: '#/components/schemas/Money'
        voidable:
          type: boolean
          description: 可撤（`REVIEWING`，未进通道）——详情撤销入口可见性（**深链直开自足**、与列表行同口径、勿按 status 硬编码）
        receiptAvailable:
          type: boolean
          description: 收据可用（`SUCCESS`）——详情收据入口可见性（深链直开自足）
        note:
          type: string
          description: 退款备注（无则不返回本键）
    CreateRefundRequest:
      type: object
      description: '发起退款请求。金额 ∈ (0, 剩余可发起额]，币种 = 成交结果金额币种。**封闭对象**（`additionalProperties: false`——拒绝拼错字段 / 意外凭据字段 / 客户端自填 scope 信息）。'
      additionalProperties: false
      required:
        - amount
        - refundPin
      properties:
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        note:
          type:
            - string
            - 'null'
          maxLength: 300
          description: 退款备注（选填）。超长由后端拒绝，前端建议同步限制输入。
        refundPin:
          allOf:
            - $ref: '#/components/schemas/RefundPin'
          description: 发起退款时校验的商户级 Refund PIN。**不参与幂等比对**——同键重试即使重输 PIN 也返首次结果。
    CreateRefundResult:
      type: object
      required:
        - refundNo
        - status
      properties:
        refundNo:
          type: string
          minLength: 1
        status:
          allOf:
            - $ref: '#/components/schemas/RefundStatus'
          description: 退款单可观察态（复用 `RefundStatus` 封闭 enum；`SUBMITTED` 不会出现在响应里）：**首次受理** → `REVIEWING`（审核中）/ `CHANNEL_PROCESSING`（处理中）；同键重发在恢复期可能返终态（`SUCCESS` / `FAILED` / …）；**一经成功即冻结**——后续同键重发返此冻结记录、非当前实时态
    RefundCancellationResult:
      type: object
      required:
        - refundNo
        - status
      properties:
        refundNo:
          type: string
          minLength: 1
        status:
          type: string
          const: CANCELLED
          description: 撤销后状态（恒 `CANCELLED`）
    PreAuthCompletionResult:
      type: object
      required:
        - orderId
        - status
      properties:
        orderId:
          type: string
          minLength: 1
        status:
          type: string
          enum:
            - PAID
            - PARTIALLY_REFUNDED
            - REFUNDED
          description: 完成后订单**商户状态**（后端派生、**非固定** `PAID`；**成功响应值域收窄** `PAID` / `PARTIALLY_REFUNDED` / `REFUNDED`，不含 `FAILED` / `PREAUTH_HOLDING`——非成功走非 200）：无挂起期退 = `PAID`；挂起期已直退过 = `PARTIALLY_REFUNDED` / `REFUNDED`（退款度派生）。FE 可据此更新或重读交易。
    LocalDate:
      type: string
      format: date
      description: 日期 `YYYY-MM-DD`，**不带时区**。本面所有日期字段与日期入参都是它。 **按字面收发**——展示直接用这个字符串，别塞进 `Date` 按浏览器时区格式化（负偏移时区会显示成前一天）。
      examples:
        - '2026-05-19'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            currentMerchantId:
              type: string
              description: 服务端会话当前商户（≠ 请求携带的 expected `X-Merchant-Context`），供前端 re-sync；**无当前商户则不返回本键**（前端须重选）。
            maskedEmail:
              type: string
              description: 已遮蔽的邮箱（形如 `j***@example.com`），**只作展示、不可回填表单**。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示可按商户 IANA 时区换算(单独字段,offset ≠ timezone)。

        **只表示「什么时候发生」,不表示「算哪一天」** —— 需要「哪一天」的地方各有自己的**日期字段**(`YYYY-MM-DD`),
        **别拿本类型自己推**：两者在跨日边界附近会分属两天。
    QuickFilterItem:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
          description: 该项对应的筛选值 —— **对客户端不透明**:选中本项就把它**原样**回传给对应列表端点的那个筛选参数, 不要解析、拼接或据其分支。
          examples:
            - PAID
        label:
          type: string
          description: 后端给的默认展示名。**客户端有自己的多语言资源时按 `value` 取用、本字段作兜底**; 没有资源(取值由配置或数据决定,如角色名、年份)时直接展示本字段。
          examples:
            - Paid
        count:
          type: integer
          minimum: 0
          description: 该项当前的命中数(口径见 `QuickFilterCounts` 说明)。
    QuickFilterCounts:
      type: object
      additionalProperties: false
      description: |
        **列表页顶部快捷筛选的各项与计数**。快捷筛选就是该列表的一个筛选维度,没有特殊机制:选中某项 = 给列表带上该维度的筛选参数(值 = 该项 `value`),**选 All = 不带这个参数**。

        **照着 `items` 渲染即可** —— 项集、顺序、展示名、数字全部由服务端给出,客户端不枚举取值、不 hardcode 项集;某项当期为 `0` 时**仍会返回**(那一格不该因为没数据就消失)。

        **`All` 不在 `items` 里,由客户端自己补一项**,数字 = 其余各项之和 —— 服务端保证 `items` 覆盖该列表在不带本维度筛选时的全部命中(每行恰好落进一项),故这个和恒等于此时列表的 `total`。

        **本端点不接受被计维度自身的参数**;其余筛选条件与对应列表端点一致、传什么算什么。因此:点某项后列表 `total` = 该项 `count`;点 All 后列表 `total` = 各项 `count` 之和。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuickFilterItem'
    PositiveMoney:
      description: 正额金额（amount = 最小币种单位正非零整数字符串、currency 同 Money）；schema 化收口「> 0」。用于「划多少」类输入（资金划转额 / 阈值 / 退款额等），金额方向由具体业务操作表达、不用正负号表示；区别于 Money（可正可负，用于余额 / 分录 / 结算净额 / 回冲等账面值）。
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amount:
              type: string
              pattern: ^[1-9][0-9]*$
    RefundPin:
      type: string
      writeOnly: true
      pattern: ^[0-9]{6}$
      description: 商户级 Refund PIN——**6 位纯数字**。 **write-only**：仅作入参采集，**绝不出现在任何响应**（含错误响应）；读面走掩码 / 已填标志。
  responses:
    MerchantBffDefaultError:
      description: |
        非 2xx 统一错误响应——覆盖所有未在本 op 显式列出的状态码。

        HTTP status 只表达大类，**具体子因看响应体的整数** `code`：

        - 该 op 承诺的业务码见其 `x-error-codes`，
        - 码的**固有属性**（`name` / `httpStatus` / `retryable` / 必带 context 字段）见**随包错误码表**；
        - **该码在本接口下意味着什么、你该怎么处理，见本接口自己的说明**（怎么读见 API 基础约定「错误响应体」）。

        部分码另带 `context` 结构化上下文（如 stale-tab 守卫 `208001` 必携 `context.currentMerchantId` 供前端 re-sync 当前商户）——哪些码必携哪些字段，以码表的 `requiredContextFields` 为准，**不要按状态码猜**。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
