openapi: 3.1.0
info:
  title: 商户后台 数据洞察 — 前端契约面
  version: 1.0.0
  contact:
    name: 商户后台 BFF
  description: |
    Dashboard 数据洞察前端契约：概览（KPI 卡 Gross / Refund / Net / To Settle + Payment Distribution 支付方式分布，
    右上角全局时间窗驱动、起止必填）+ 趋势（Transaction Volume + Orders 双序列，自带本月 / 上月切换、**独立于全局时间窗**）。

    数据洞察为**只读呈现**：服务端按所选时间窗返回聚合结果（`Net = Gross − Refund` 由服务端算出、可为负），
    **FE 只从各分片金额派生展示百分比、不自行汇总**；To Settle 与账户账务与清结算页同源、口径一致。

    - 金额一律**商户唯一结算币种**（最小币种单位整数字符串）；日期一律 `LocalDate`。
    - merchant scope 从会话取、不信请求体；全部 op merchant-current-scoped，均挂 MerchantContextGuard（stale-tab 守卫，无豁免）。
    - **区块降级不整页失败**：某区块取数超时 / 失败 → 该区块 `status=unavailable`（HTTP 仍 200 返回），其余区块照常渲染（区块隔离）。
    - **保证只在单个响应内成立**：同一响应里「各分片金额合计 = 该响应的 Gross Sales」必然相等；但**概览与趋势是两次独立取数**，
      两者的数字可能来自不同时刻，**不保证同刻一致**——不要拿趋势各日合计去核对概览的 Gross、也不要据此提示用户数据异常。

    字段类型以本 spec 为准。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话）
security:
  - cookieAuth: []
tags:
  - name: insight
    description: Dashboard 数据洞察：概览（KPI + 分布，全局时间窗驱动）+ 趋势（双序列，本月 / 上月独立切换）。
paths:
  /insights/overview:
    get:
      tags:
        - insight
      operationId: getDashboardInsightOverview
      summary: 读 Dashboard 概览（KPI 卡 + Payment Distribution；全局时间窗驱动）
      description: |
        返回当前商户 Dashboard 概览区块，受右上角**全局时间窗**（`from` / `to` 闭区间、**两者必填**；服务端**不解析「今日」这类相对语义**——初始展示哪一段由客户端自己算出并作为具体日期发出）驱动：

        - **KPI 卡** —— Gross Sales / Refund Amount / Net Sales（= Gross − Refund）按窗聚合（结算币种）+ **To Settle 即时态**（当前待结算派生值、**不随时间窗变化**）；
        - **Payment Distribution** —— 窗内成功收款按支付方式分布（金额 + 归并「其他」；占比由 FE 从金额派生）。

        三项 KPI 金额均为**服务端返回的结算币种金额**；`Refund Amount` / `Net Sales` **可能为负**——**不表示口径错误**，
        FE 按有符号金额**原样渲染、不得截为 0**；`Net Sales` 直接用服务端返回值、**FE 不自行相减**。

        需逐笔核对的场景走交易 / 退款明细列表，但交易管理页的同名字段是**按那一页的筛选条件算出的另一个量**、与本页口径不同，两页数字**不可互相核对或推导**。

        **区块降级（按组）**：**Gross / Refund / Net 为一组、三项整体降级**（同时 `available` 或同时 `unavailable`）；
        **To Settle** 与 **Payment Distribution** 各自独立降级——某项取数超时 / 失败 → 对应组 / 块 `status=unavailable`（**非 0**）、其余照常渲染。

        「窗内无交易」= **空态**（Gross / Refund / Net = `available` 且金额为 "0"、分布 `available` 且 slices 为空），与 `unavailable` 语义分离。

        `400`：参数校验（`from` / `to` 未成对 / 格式错 / `to < from`）；**时间窗跨度超上限**（含首尾 > 366 自然日，默认值、可配置）
        → `204012` `WINDOW_RANGE_TOO_LARGE`（缩小日期范围后重试，不截断、不降级取部分窗）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: from
          in: query
          required: true
          description: 时间窗起始（闭区间左端）。**必填**——页面右上角恒有时间窗控件、初始展示哪一段（今日）由客户端决定并发出，服务端不代为求「今日」。**起止跨度〔含首尾〕> 366 自然日〔可配置〕→ 400** `WINDOW_RANGE_TOO_LARGE`（本模块特有上限）。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: true
          description: 时间窗结束（闭区间右端；与 `from` 成对必填）。
          schema:
            $ref: '#/components/schemas/LocalDate'
      responses:
        '200':
          description: Dashboard 概览（KPI + 分布；区块可各自降级）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverview'
              examples:
                allAvailable:
                  summary: 全区块可用（含归并「其他」分片）
                  value:
                    currency: CAD
                    timeZone: America/Toronto
                    kpi:
                      grossSales:
                        status: available
                        amount:
                          amount: '1250000'
                          currency: CAD
                      refundAmount:
                        status: available
                        amount:
                          amount: '80000'
                          currency: CAD
                      netSales:
                        status: available
                        amount:
                          amount: '1170000'
                          currency: CAD
                      toSettle:
                        status: available
                        amount:
                          amount: '940000'
                          currency: CAD
                    distribution:
                      status: available
                      slices:
                        - paymentMethod:
                            code: wechat
                            displayName: WeChat Pay
                          amount:
                            amount: '700000'
                            currency: CAD
                        - paymentMethod:
                            code: alipay
                            displayName: Alipay
                          amount:
                            amount: '400000'
                            currency: CAD
                        - paymentMethod:
                            code: _other
                            displayName: Other
                          amount:
                            amount: '150000'
                            currency: CAD
                refundHeavyWindow:
                  summary: 退款大于当窗收款 → Net 为负（有符号原样渲染，不得截为 0）
                  value:
                    currency: CAD
                    timeZone: America/Toronto
                    kpi:
                      grossSales:
                        status: available
                        amount:
                          amount: '120000'
                          currency: CAD
                      refundAmount:
                        status: available
                        amount:
                          amount: '300000'
                          currency: CAD
                      netSales:
                        status: available
                        amount:
                          amount: '-180000'
                          currency: CAD
                      toSettle:
                        status: available
                        amount:
                          amount: '0'
                          currency: CAD
                    distribution:
                      status: available
                      slices:
                        - paymentMethod:
                            code: wechat
                            displayName: WeChat Pay
                          amount:
                            amount: '120000'
                            currency: CAD
                groupDegraded:
                  summary: Gross / Refund / Net 一组 + 分布 unavailable；To Settle 独立降级、仍可用
                  value:
                    currency: CAD
                    timeZone: America/Toronto
                    kpi:
                      grossSales:
                        status: unavailable
                      refundAmount:
                        status: unavailable
                      netSales:
                        status: unavailable
                      toSettle:
                        status: available
                        amount:
                          amount: '940000'
                          currency: CAD
                    distribution:
                      status: unavailable
                emptyWindow:
                  summary: 窗内无交易 → 空态（金额 "0" / 空 slices、非 unavailable）；To Settle 仍为即时值
                  value:
                    currency: CAD
                    timeZone: America/Toronto
                    kpi:
                      grossSales:
                        status: available
                        amount:
                          amount: '0'
                          currency: CAD
                      refundAmount:
                        status: available
                        amount:
                          amount: '0'
                          currency: CAD
                      netSales:
                        status: available
                        amount:
                          amount: '0'
                          currency: CAD
                      toSettle:
                        status: available
                        amount:
                          amount: '940000'
                          currency: CAD
                    distribution:
                      status: available
                      slices: []
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204012
        - 208001
  /insights/trend:
    get:
      tags:
        - insight
      operationId: getDashboardInsightTrend
      summary: 读 Transaction Volume 趋势（Volume + Orders 双序列；本月 / 上月独立切换）
      description: |
        返回当前商户交易趋势双序列，按**所选月份**（`month=current|previous`，**必填、无默认档**；只提供这两档、不接受任意区间，实际日期范围由服务端求出并经 `window` 回显）逐**日**聚合：
        **Transaction Volume** = 成功收款交易额（结算币种）、**Orders** = 成功订单 / 交易笔数。

        两序列同轴（均为收款类指标），**不含退款**——退款有自己的入窗轴、只出现在概览的 Refund Amount。

        **趋势图时间控件独立**——仅受本端点 `month` 管辖，**不受** `/insights/overview` 全局时间窗影响（两控件不合并）；范围固定本月 / 上月两档。

        「所选月份内无交易」= **空态**（`available` 且 `points` 为空，FE 按零基线渲染），与取数失败 `unavailable` 语义分离。
        `points` 仅含有数据的日；缺数据日由 FE 补零基线。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: month
          in: query
          required: true
          description: 趋势月份档（本月 / 上月二选一）。**必填**——初始展示哪一档由客户端决定。封闭枚举；范围固定、不接受任意区间、不随全局时间窗变化。⚠️ **哪个月是 `current` 由服务端认定**（客户端不要自己按本地时间推算），实际日期范围见响应的 `window`。
          schema:
            type: string
            enum:
              - current
              - previous
      responses:
        '200':
          description: 趋势双序列（可整体降级 unavailable）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTrend'
              examples:
                available:
                  summary: 有数据（Volume + Orders 双序列）
                  value:
                    status: available
                    month: current
                    window:
                      from: '2026-07-01'
                      to: '2026-07-31'
                    currency: CAD
                    timeZone: America/Toronto
                    points:
                      - date: '2026-07-01'
                        volume:
                          amount: '320000'
                          currency: CAD
                        orders: 41
                      - date: '2026-07-02'
                        volume:
                          amount: '285000'
                          currency: CAD
                        orders: 37
                emptyMonth:
                  summary: 所选月份无交易 → 空态（空 points；FE 按 window 全月补零基线）
                  value:
                    status: available
                    month: previous
                    window:
                      from: '2026-06-01'
                      to: '2026-06-30'
                    currency: CAD
                    timeZone: America/Toronto
                    points: []
                unavailable:
                  summary: 取数失败 → 趋势块「暂不可用」
                  value:
                    status: unavailable
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 商户级读写另挂 MerchantContextGuard 守卫（见下方 parameters）。
  schemas:
    DashboardOverview:
      type: object
      additionalProperties: false
      required:
        - currency
        - timeZone
        - kpi
        - distribution
      properties:
        currency:
          description: 商户唯一结算币种（KPI / 分布金额均以此计；供整块标注 + 空态 / unavailable 时的币种提示）
          allOf:
            - $ref: '#/components/schemas/Currency'
        timeZone:
          type: string
          minLength: 1
          description: 商户 IANA 时区（回显商户上下文；**不要拿它换算本响应里的日期**——日期一律字面呈现）
        kpi:
          $ref: '#/components/schemas/DashboardKpi'
        distribution:
          $ref: '#/components/schemas/DistributionBlock'
    DateWindow:
      type: object
      additionalProperties: false
      required:
        - from
        - to
      properties:
        from:
          description: 起始日（闭区间左端）
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        to:
          description: 结束日（闭区间右端）
          allOf:
            - $ref: '#/components/schemas/LocalDate'
    DashboardKpi:
      type: object
      additionalProperties: false
      description: |
        四项 Dashboard KPI。**Gross / Refund / Net 为一组**—— **要么三项同时 available、要么三项同时 unavailable**（`Net = Gross − Refund` 由服务端算出）； **To Settle 独立降级**、可单独 unavailable。组内混合态（如 Gross available 而 Refund unavailable）**不会出现**——由服务端保证，前端不必防御。
      required:
        - grossSales
        - refundAmount
        - netSales
        - toSettle
      properties:
        grossSales:
          description: Gross Sales（窗内成功收款合计、结算币种）；取数失败 → `unavailable`（与 Refund / Net 同组同进退）
          allOf:
            - $ref: '#/components/schemas/MetricMoney'
        refundAmount:
          description: Refund Amount（窗内退款合计；**排除系统自动退款**）。**与 Gross Sales 各按自己的日期入窗、不做按原订单的同期配对**—— 所以两者不可逐笔对上，别拿它们做勾稽 UI。 服务端返回**有符号**金额、**可能为负**（退款回冲计负向），且**历史窗口的数字不会回溯变化**。取数失败 → `unavailable`（与 Gross / Net 同组同进退）。
          allOf:
            - $ref: '#/components/schemas/MetricMoney'
        netSales:
          description: Net Sales（= Gross Sales − Refund Amount，**服务端算出**、FE 不自行相减）——服务端返回的有符号金额、**可能为负**。Gross / Refund 不可用 → 无法算出、同为 `unavailable`。
          allOf:
            - $ref: '#/components/schemas/MetricMoney'
        toSettle:
          description: To Settle（当前待结算即时态派生值、**不随时间窗变化**；与账户账务与清结算页同源、口径一致；**独立降级**——上面三项 unavailable 时本项仍可 available）
          allOf:
            - $ref: '#/components/schemas/MetricMoney'
    MetricMoney:
      type: object
      additionalProperties: false
      description: |
        单项 KPI 金额（结算币种）。`available` 时携 `amount`、`unavailable` 时不返回 `amount`。 **空态（窗内无数据）= available 且 amount 为 "0"、非 unavailable**； `unavailable` 仅表该项取数失败（对应 KPI 卡「暂不可用」而非 0）。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - available
            - unavailable
          description: 取数结果（`unavailable` = 取数失败 / 超时，KPI 卡「暂不可用」、不以 0 冒充）。封闭枚举（取值集固定、可穷举分支）。
        amount:
          description: 金额（最小币种单位整数字符串 + 结算币种；空态为 "0"）。**仅 `status=available` 时返回本键**（此时必返）
          allOf:
            - $ref: '#/components/schemas/Money'
    DistributionBlock:
      type: object
      additionalProperties: false
      description: |
        Payment Distribution 分布块。`available` 时携 `slices`（可空 = 空态）、`unavailable` 时不返回 `slices`。 「窗内无交易」= available + 空 slices（非 unavailable）；`unavailable` 仅表该块取数失败。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - available
            - unavailable
          description: 取数结果（`unavailable` = 取数失败 / 超时，分布块「暂不可用」）。封闭枚举（取值集固定、可穷举分支）。
        slices:
          type: array
          description: |
            各支付方式收款金额分片（占比由 FE 从金额派生、和为 100%）；空数组 = 空态（窗内无交易）。归并「其他」为单独一片（`paymentMethod.code = _other`）。**仅 `status=available` 时返回本键**（此时必返）。

            - **响应恒等式（契约保证，FE 无需运行时校验或纠偏）**：`Σ slices[].amount.amount = kpi.grossSales.amount.amount`（两者均 `available` 时；**同一结算币种**）——
              分布与 Gross 同源同窗，故窗口内合计必然相等；**至多一个** `_other` 聚合片（服务端保证）。
            - **契约约束**：`paymentMethod.code` 在同一响应内**唯一**（可直接作渲染 key）；**非聚合分片按金额降序**返回，**聚合片不参与排序、恒置末位**（归并按占比阈值，聚合片金额可能大于某个上榜方式，故位置由本规则定、不由金额定）——前端照序渲染即可，不必自己排序、图例配色也因此稳定。
          items:
            $ref: '#/components/schemas/DistributionSlice'
    DistributionSlice:
      type: object
      additionalProperties: false
      description: |
        单个支付方式分片。`paymentMethod.code = _other` 即归并「其他」聚合片（占比低于归并阈值〔默认值、可配置〕的支付方式合并；一次响应至多一片、恒置末位）， 其余为具体支付方式分片。
      required:
        - paymentMethod
        - amount
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodRef'
        amount:
          description: 该支付方式窗内成功收款金额（结算币种）；聚合片 = 归并入「其他」的收款金额合计
          allOf:
            - $ref: '#/components/schemas/Money'
    PaymentMethodRef:
      type: object
      additionalProperties: false
      required:
        - code
        - displayName
      properties:
        code:
          type: string
          minLength: 1
          description: 支付方式稳定标识（服务端动态配置，**FE 不得 hardcode 枚举**；归并「其他」= 聚合哨兵 `_other`）。
        displayName:
          type: string
          minLength: 1
          description: canonical 默认展示名（**非本地化**、不随 locale 变；FE 按 `code` 本地化、此值作 unknown-safe fallback；归并聚合片的默认展示名 = "Other"）。
    DashboardTrend:
      type: object
      additionalProperties: false
      description: |
        趋势响应。`available` 时携双序列及其上下文（`month` / `window` / `currency` / `timeZone` / `points` 五键同进退）、`unavailable` 时只有 `status`。 「所选月份无交易」= available + 空 `points`（空态、零基线），与取数失败 `unavailable` 分离。趋势独立于全局时间窗（仅 `month` 管辖）。
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - available
            - unavailable
          description: 取数结果（`unavailable` = 取数失败 / 超时，趋势块「暂不可用」）。封闭枚举（取值集固定、可穷举分支）。
        month:
          type: string
          enum:
            - current
            - previous
          description: 生效月份档（回显请求值）。**仅 `status=available` 时返回本键**
        window:
          description: |
            服务端认定的该档**实际日期范围**（闭区间）。 **FE 据此在范围内补零基线**——`points` 稀疏、空月时更是零信息，**不要自行按浏览器时区推算年月**。**仅 `status=available` 时返回本键**。
          allOf:
            - $ref: '#/components/schemas/DateWindow'
        currency:
          description: 结算币种（Volume 金额计价）。**仅 `status=available` 时返回本键**
          allOf:
            - $ref: '#/components/schemas/Currency'
        timeZone:
          type: string
          minLength: 1
          description: 商户 IANA 时区（回显商户上下文；**不要拿它换算** `points[].date`——日期字面呈现）。**仅 `status=available` 时返回本键**
        points:
          type: array
          description: |
            按日双序列点（**仅有数据的日**、稀疏；空数组 = 空态）。**契约约束**：`date` 唯一、按日期**升序**、 且全部落在 `window` 闭区间内；缺数据日由 FE 在 `window` 范围内补零基线。**仅 `status=available` 时返回本键**（此时必返，可为空数组）。
          items:
            $ref: '#/components/schemas/TrendPoint'
    TrendPoint:
      type: object
      additionalProperties: false
      required:
        - date
        - volume
        - orders
      properties:
        date:
          description: 日期（`YYYY-MM-DD`，字面呈现）
          allOf:
            - $ref: '#/components/schemas/LocalDate'
        volume:
          description: 当日成功收款交易额（Transaction Volume、结算币种）
          allOf:
            - $ref: '#/components/schemas/Money'
        orders:
          type: integer
          minimum: 0
          description: 当日成功订单 / 交易笔数（Orders）
    LocalDate:
      type: string
      format: date
      description: |
        **日历日期**(无偏移,`YYYY-MM-DD`)。**不带时区、不隐含日切时刻** —— 就是这一天本身。

        - **按字面值收发**:展示直接用这个字符串、**不做任何时区换算**
          (禁塞进 `Date` 后按浏览器时区渲染 —— 负偏移时区会显示成前一天);
        - **日期区间入参与固化的日期列作字面比较**,不把日期换算成瞬时区间去扫时间戳列;
        - **不改写已固化的日期字面值**,无论它当初是按谁的时区算出来的。

        商户选定的日期(Invoice Due Date / 礼卡 Campaign End Date / 票务 Event Date)与服务端固化后出参的日期
        (如各类记录的创建日)同用本类型。某个 `LocalDate` 在服务端对应哪条日轴、要不要解释成瞬时区间,
        是服务端的事 —— 契约面只承诺这一天的字面值。
      examples:
        - '2026-08-01'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            currentMerchantId:
              type: string
              description: 服务端会话当前商户（≠ 请求携带的 expected `X-Merchant-Context`），供前端 re-sync；**无当前商户则不返回本键**（前端须重选）。
            paymentId:
              type: string
              description: 失败发生时**订单已建立**的场景下带出的平台侧支付单标识（如被扫同步扣款在通道应答阶段失败）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            merchantMandateNo:
              type: string
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            maskedEmail:
              type: string
              description: 已遮蔽的邮箱（形如 `j***@example.com`），**只作展示、不可回填表单**。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
  parameters:
    MerchantContextGuard:
      name: X-Merchant-Context
      in: header
      required: true
      description: |
        stale-tab 一致性守卫（读写统一）：页面预期的当前商户 ID。与会话当前商户比对，一致才执行；不一致时**读不返回错商户数据、写不执行**，并按下面两种情形二分：

        - **① 会话有当前商户、只是与 expected 不同 → `409` · `208001`（`MERCHANT_CONTEXT_CHANGED`）**，响应 `context.currentMerchantId` 回显服务端当前商户供前端直接 re-sync；
        - **② 会话没有当前商户（无可回显者）→ `409` · `208022`（`MERCHANT_NOT_ACCESSIBLE`）**，前端重跑启动链路按 `routeTo` 分流（见 API 基础约定「merchant scope + stale-tab 守卫」）。

        挂在所有依赖当前商户的读 + 写接口；前端统一 interceptor 发送 + 处理 409（提示并刷新当前商户）。

        **豁免**：不依赖「当前商户」的接口——当前商户的 re-sync / 切换入口本身，以及目标由 path 直接指定、与当前商户无关的接口。

        某个接口挂没挂本 header，**看该接口的 `parameters` 即可**（挂了就是必带）。
      schema:
        type: string
        minLength: 1
  responses:
    MerchantBffDefaultError:
      description: |
        非 2xx 统一错误响应——覆盖所有未在本 op 显式列出的状态码。

        HTTP status 只表达大类，**具体子因看响应体的整数** `code`：

        - 该 op 承诺的业务码见其 `x-error-codes`，
        - 码的**固有属性**（`name` / `httpStatus` / `retryable` / 必带 context 字段）见**随包错误码表**；
        - **该码在本接口下意味着什么、你该怎么处理，见本接口自己的说明**（怎么读见 API 基础约定「错误响应体」）。

        部分码另带 `context` 结构化上下文（如 stale-tab 守卫 `208001` 必携 `context.currentMerchantId` 供前端 re-sync 当前商户）——哪些码必携哪些字段，以码表的 `requiredContextFields` 为准，**不要按状态码猜**。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
