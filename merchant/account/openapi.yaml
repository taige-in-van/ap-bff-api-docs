openapi: 3.1.0
info:
  title: 商户后台 商户资料 — 前端契约面
  version: 2.0.0
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的商户资料契约：当前商户的 Business Profile（资料、Logo、联系人、结算信息变更）、Service（受理模式与支付方式、终端与电商对接）、Refund PIN。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 提交结算变更、改 Refund PIN 挂 `Idempotency-Key`，同一次提交的网络重试用同键返回首次结果；天然幂等的纯 PUT / DELETE（资料、联系人、Logo、Service 的保存）不挂；忘记 PIN 的发码与确认按流程语义不挂，码用过后再提交 → `410`。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 当前商户以会话为准、不看请求体；当前商户不可访问时返回 `409`·`208022`。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: profile
    x-displayName: 商户资料
    description: Business Profile：读资料（Business Information / Settlement / Contact / Documents）、编辑 Business Information 与联系人（直接生效）、换 / 移除 Logo；结算信息变更走事前审批：上传 Void Cheque、发码到 Owner 邮箱、带码提交变更请求（进入审核、旧值继续生效，同一商户至多一个审核中）。
  - name: service
    x-displayName: 受理与接入
    description: 受理模式（线下 / 线上）的开通与支付方式开关、Moneris / Clover 连接与停用、Shopify / Allvalue 接入与管理。
  - name: refund-pin
    x-displayName: 退款 PIN
    description: Refund PIN：改 PIN（当前 PIN + 新 PIN）、忘记 PIN 自助重置（发码到 Owner 邮箱 → 码 + 新 PIN 一次提交）。
paths:
  /account/profile:
    get:
      tags:
        - profile
      operationId: getAccountProfile
      x-required-privilege: account:profile:view
      summary: 读 Business Profile（Business Information / Settlement / Contact / Documents）
      description: |
        当前商户的资料，Business Profile 页一次取全。字段名与取值和入驻申请的对应步骤一致：

        - `businessInformation` 对应入驻 Business 步，行业、MCC、省州给码，展示名取 `/config/industries`、`/config/countries`；企业类型是枚举码，展示名由前端 i18n。
        - `settlement` 对应入驻 Settlement 步，账号只给末 4 位掩码；不含 Legal Business Name（同 `businessInformation.legalBusinessName`）。
        - `contactInformation` 对应入驻 Contact 步，编辑走 `updateOwnerContact`。
        - `documents` 与入驻 documents 步同形状，`previewUrl` 短时效、不要持久化。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountProfile'
              example:
                merchantCode: C3BM68
                logoUrl: https://cdn.example.com/merchant/logo/2026/06/2b6e0a94c73f41d5891ae4f0c62d7b18.png
                businessInformation:
                  legalBusinessName: Maple Veterinary Inc.
                  tradeName: Maple Vet Clinic
                  typeOfOwnership: CORPORATION
                  registrationNumber: BC1234567
                  referredBy: Moneris
                  industryCategory: A0
                  mcc: '0742'
                  businessAddress: 123 Main St
                  city: Vancouver
                  province: BC
                  postalCode: V6B1A1
                  country: CA
                  timeZone: America/Vancouver
                  language: en
                  businessPhone: '+16045550123'
                settlement:
                  bankName: RBC
                  bankAccount:
                    type: ca_local
                    transitNumber: '12345'
                    institutionNumber: '003'
                    accountNumberMasked: •••• 5678
                    accountNumberSet: true
                  settlementCycle: t2
                  storeId: STORE-01
                  pendingReview: false
                contactInformation:
                  firstName: Jane
                  lastName: Merchant
                  businessTitle: Manager
                  phone: '+16045550123'
                  email: jane@example.com
                documents:
                  docVoidCheque:
                    fileId: 8f1c2a6e0b3d4f5a9c7e1d2b3a4f5e6d
                    fileName: void-cheque.pdf
                    fileSize: 184320
                    uploadedAt: '2026-06-18T09:12:00Z'
                    previewUrl: https://files.example.com/o/8f1c2a6e?exp=1755331200&sig=REDACTED&disp=inline
                  docOwnerId:
                    fileId: 3b7d90a4c5e64f1a8b2d9e0f1a2b3c4d
                    fileName: owner-id.jpg
                    fileSize: 402113
                    uploadedAt: '2026-06-18T09:13:00Z'
                    previewUrl: https://files.example.com/o/3b7d90a4?exp=1755331200&sig=REDACTED&disp=inline
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /account/profile/business:
    put:
      tags:
        - profile
      operationId: updateBusinessInformation
      x-required-privilege: account:profile:edit
      summary: 编辑 Business Information（可编辑字段，直接生效）
      description: |
        改 Business Information 的可编辑字段（地址、城市、省州、邮编、国家、时区、语言、营业电话），只提交要改的，保存直接生效、无审核。
        锁定的字段不在请求体里，带了按未知字段返回 400。

        幂等：纯 PUT、天然幂等（同字段集重复提交结果一致），不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessInformationUpdate'
            example:
              businessAddress: 456 Market St
              city: Vancouver
              province: BC
              postalCode: V6B1A1
              country: CA
              timeZone: America/Toronto
              businessPhone: '+16045550199'
      responses:
        '204':
          description: 已保存（新值直接生效）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /account/profile/contact:
    put:
      tags:
        - profile
      operationId: updateOwnerContact
      x-required-privilege: owner
      summary: 编辑联系人（名、姓、职务、电话，直接生效）
      description: |
        改商户联系人，也就是该商户 Owner 的名、姓、职务、电话，只提交要改的，保存直接生效，Owner 名下所有商户同步显示新值。
        只有 Owner 能调，其他人 → 403。
        邮箱是 Owner 登录邮箱，只读，由 Owner 本人走个人账号契约的改登录邮箱流程修改，本请求不接受。

        幂等：纯 PUT、天然幂等，不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactInformationUpdate'
            example:
              firstName: Jane
              lastName: Merchant
              businessTitle: Manager
              phone: '+16045550123'
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /account/profile/files:
    post:
      tags:
        - profile
      operationId: uploadLogoFile
      x-required-privilege: account:profile:edit
      summary: 上传 Logo 文件（上传后调 updateLogo 生效）
      description: |
        允许的格式与大小上限见 `MerchantFilePurpose` 用途表，前端照表先拦；不合规 → `400`·`204015`（以服务端判定为准）。非幂等：每次上传产生新 `fileId`。
        `merchant_logo` 的 `previewUrl` 就是生效后的长效公开地址。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadForm'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - merchant_logo
      responses:
        '201':
          description: 已上传（尚未生效）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
              example:
                fileId: 2b6e0a94c73f41d5891ae4f0c62d7b18
                fileName: storefront-logo.png
                fileSize: 204800
                contentType: image/png
                previewUrl: https://cdn.example.com/merchant/logo/2026/06/2b6e0a94c73f41d5891ae4f0c62d7b18.png
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
  /account/profile/logo:
    put:
      tags:
        - profile
      operationId: updateLogo
      x-required-privilege: account:profile:edit
      summary: 把已上传的文件设为商户 Logo（即时生效）
      description: |
        用 `uploadLogoFile` 返回的 `fileId` 替换当前 Logo，即时生效、无审核。

        幂等：同一 `fileId` 重复设置结果一致，不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - fileId
              properties:
                fileId:
                  type: string
                  description: '`uploadLogoFile` 返回的文件引用'
            example:
              fileId: 2b6e0a94c73f41d5891ae4f0c62d7b18
      responses:
        '204':
          description: 已生效
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    delete:
      tags:
        - profile
      operationId: deleteLogo
      x-required-privilege: account:profile:edit
      summary: 移除 Logo（即时生效）
      description: 移除商户 Logo，即时生效。幂等：DELETE 天然幂等（已无 Logo 时仍 204）。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已移除
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /account/profile/settlement/files:
    post:
      tags:
        - profile
      operationId: uploadSettlementVoidChequeFile
      x-required-privilege: account:settlement:edit
      summary: 上传 Void Cheque 文件（改银行账户的前置）
      description: |
        返回的 `fileId` 即提交变更请求时的 `voidChequeFileId`，在那一步文件才归属该请求。

        允许的格式与大小上限见 `MerchantFilePurpose` 用途表，前端照表先拦；不合规 → `400`·`204015`（以服务端判定为准）。非幂等：每次上传产生新 `fileId`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadForm'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - settlement_void_cheque
      responses:
        '201':
          description: 已上传（尚未归属变更请求）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
              example:
                fileId: 7d41b9c05e2a48f3ab6c1d802f5e9a37
                fileName: void-cheque.pdf
                fileSize: 1048576
                contentType: application/pdf
                previewUrl: https://files.example.com/o/7d41b9c0?exp=1755331200&sig=REDACTED&disp=inline
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
  /account/profile/settlement/otp-challenges:
    post:
      tags:
        - profile
      operationId: requestSettlementOtp
      x-required-privilege: account:settlement:edit
      summary: 结算变更第 1 步：发验证码到 Owner 邮箱
      description: |
        发 6 位码到 Owner 的登录邮箱（不论谁发起），返回 `challengeId`。
        本步只发码、不带变更内容；码和变更内容在第 2 步一起提交。非 Owner 的操作员发起时，要拿到 Owner 收到的码才能提交，等于每次结算变更都经 Owner 过目。

        重新发码会让旧码作废，冷却中 → `429`·208013。按挑战流程语义不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已发码（`deliveredTo` 为脱敏 Owner 邮箱）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                challengeId: stl_4e1a8c9b2d
                deliveredTo: o***@e***.com
                cooldownSeconds: 60
                expiresAt: '2026-06-22T15:05:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208013
  /account/profile/settlement/change-requests:
    post:
      tags:
        - profile
      operationId: createSettlementChangeRequest
      x-required-privilege: account:settlement:edit
      summary: 结算变更第 2 步：带码提交变更（进入审核，旧值继续生效）
      description: |
        一次完成验码和提交：码对了就创建变更请求并进入审核，结算信息仍按旧值生效，审核通过才换成新值；同时给 Owner 发「变更审核中」通知。审核中时读面 `settlement.pendingReview` 为 true。

        - `changes` 含银行组（`bankName` + `bankAccount`）时，`voidChequeFileId` 必填（缺 → 400）；只改 `storeId` / `settlementCycle` 时不带。
        - 码错可重试 → `400`·204010（剩余次数见 `context.attemptsRemaining`）；错到上限 → `423`·206007；码过期或已用 → `410`·206006，须重新发码。
        - 已有审核中的变更 → `409`·208002；结算周期不在候选内 → `400`·204017。

        审核结果异步更新（不在本 BFF）。

        幂等：必带 `Idempotency-Key`。同键 + 同请求体重发返回首次结果（不重复建、也不因码已用掉而失败）；请求体有任何变化都要换新键，包括输错码后重输（码在请求体里），沿用旧键改请求体 → `409`·208005。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementChangeRequestInput'
            examples:
              bankRelated:
                summary: 改了银行字段（带 Void Cheque）
                value:
                  otp:
                    challengeId: stl_4e1a8c9b2d
                    code: '493028'
                  voidChequeFileId: 7d41b9c05e2a48f3ab6c1d802f5e9a37
                  changes:
                    bankName: TD
                    bankAccount:
                      type: ca_local
                      transitNumber: '54321'
                      institutionNumber: '004'
                      accountNumber: '12345678'
              nonBank:
                summary: 只改 Store ID / 结算周期
                value:
                  otp:
                    challengeId: stl_4e1a8c9b2d
                    code: '493028'
                  changes:
                    storeId: STORE-02
                    settlementCycle: t3
      responses:
        '204':
          description: 已进入审核（旧值继续生效）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 204017
        - 206006
        - 206007
        - 208002
        - 208005
  /account/service:
    get:
      tags:
        - service
      operationId: getAccountService
      x-required-privilege: account:service:view
      summary: 读 Service 页（受理模式、Moneris / Clover、Shopify / Allvalue）
      description: |
        当前商户的受理模式与其支付方式、卡终端集成、电商集成的状态。

        支付方式只给目录码，展示名与未开通的候选按当前商户币种取 `listPaymentMethodOptions`。凭据只给掩码摘要，明文不返回。

        当前商户未激活 → `409`·`208003`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicePage'
              example:
                modes:
                  - mode: in_store
                    status: ACTIVE
                    paymentMethods:
                      - paymentMethod: wechat_instore
                        status: ACTIVE
                        enabled: true
                        rate:
                          percentageRate: '0.015'
                          fixedFee: '10'
                      - paymentMethod: alipay_instore
                        status: ACTIVE
                        enabled: false
                        rate:
                          percentageRate: '0.015'
                          fixedFee: '10'
                      - paymentMethod: unionpay_qrc
                        status: UNDER_REVIEW
                  - mode: online
                    status: ACTIVE
                    typeOfOnlineService: WEBSITE
                    websiteUrl: https://shop.example.com
                    websiteUrlUnderReview: true
                    paymentMethods:
                      - paymentMethod: wechat_online
                        status: ACTIVE
                        enabled: true
                        rate:
                          percentageRate: '0.015'
                          fixedFee: '10'
                terminals:
                  - provider: moneris
                    status: ACTIVE
                    threedsEnabled: true
                    credentialSummary: Store ID ••• 4321
                  - provider: clover
                    status: NOT_CONNECTED
                ecommerce:
                  - provider: shopify
                    status: ACTIVE
                    websiteUrl: https://shop.example.com
                    paymentMethods:
                      - paymentMethod: wechat_online
                        enabled: true
                        rate:
                          percentageRate: '0.02'
                          fixedFee: '10'
                  - provider: allvalue
                    status: NOT_CONNECTED
                    paymentMethods:
                      - paymentMethod: wechat_online
                        enabled: true
                        rate:
                          percentageRate: '0.015'
                          fixedFee: '10'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208003
  /account/service/modes/{mode}:
    put:
      tags:
        - service
      operationId: updateAcceptanceMode
      x-required-privilege: account:service:edit
      summary: 保存一个受理模式（支付方式开关、开通申请、线上服务类型与网址）
      description: |
        提交该模式下希望开着的支付方式，服务端按每个方式的现状分别处理：

        | 方式现状 | 在 `paymentMethods` 里 | 不在 |
        |---|---|---|
        | 已开通（`ACTIVE`） | 开，即时生效 | 关，即时生效 |
        | 未开通（读面里没有） | 进开通申请，待审核 | 不动 |
        | 审核中（`UNDER_REVIEW`） | 不受本次提交影响 | 不受本次提交影响 |

        - **模式未开通**：整个请求建成一张开通申请，`paymentMethods` 至少一个，并带材料——`in_store` 带 `storeInsideFileId` + `storeOutsideFileId`（替换商户资料里的门店内照、外照）；`online` 带 `typeOfOnlineService`，为 `WEBSITE` 时带 `websiteUrl`。
        - **模式已开通**：`paymentMethods` 可以为空，即全部关掉，模式仍是 `ACTIVE`。不带门店照（带了 → 400）。线上模式的 `typeOfOnlineService` / `websiteUrl` 不带就是不改；带了即时生效，同时进复审，复审期间照常收款；复审中再改，沿用同一次复审。
        - 所选方式须属于该模式、在当前商户币种的候选内（`listPaymentMethodOptions`），否则 400。
        - 模式正在开通审核中，或该模式已有申请在审又勾了新的未开通方式 → `409`·`208003`。

        同样的请求体重发结果不变，不挂 Idempotency-Key。
      parameters:
        - name: mode
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/AcceptanceModeType'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptanceModeUpdate'
            examples:
              toggle:
                summary: 已开通的线下模式：关掉支付宝、申请银联
                value:
                  paymentMethods:
                    - wechat_instore
                    - unionpay_qrc
              connectInStore:
                summary: 开通线下模式
                value:
                  paymentMethods:
                    - wechat_instore
                    - alipay_instore
                  storeInsideFileId: e903c15b7a2d4e6fb81c30947da5f2e6
                  storeOutsideFileId: 4a7d2c9e1b3f4e8a9c0d5f6b7e8a9d1c
              connectOnline:
                summary: 开通线上模式
                value:
                  paymentMethods:
                    - wechat_online
                  typeOfOnlineService: WEBSITE
                  websiteUrl: https://shop.example.com
      responses:
        '204':
          description: 已保存（开关即时生效，申请进入审核）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208003
  /account/service/files:
    post:
      tags:
        - service
      operationId: uploadStorePhotoFile
      x-required-privilege: account:service:edit
      summary: 上传门店照（开通线下模式用）
      description: |
        门店内照、外照各传一次，返回的 `fileId` 分别作为 `updateAcceptanceMode`（线下）的 `storeInsideFileId` / `storeOutsideFileId`，提交时文件才归属该商户。

        格式或大小不合规 → `400`·`204015`。非幂等：每次上传产生新 `fileId`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadForm'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - store_photo
      responses:
        '201':
          description: 已上传（提交开通前尚未归属）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
              example:
                fileId: e903c15b7a2d4e6fb81c30947da5f2e6
                fileName: store-front.jpg
                fileSize: 1572864
                contentType: image/jpeg
                previewUrl: https://files.example.com/o/e903c15b?exp=1755331200&sig=REDACTED&disp=inline
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
  /account/service/terminal:
    put:
      tags:
        - service
      operationId: updateTerminalIntegration
      x-required-privilege: account:service:edit
      summary: 连接、切换或更新 Moneris / Clover（即时生效）
      description: |
        即时生效、无审核。两家互斥：连上一家，另一家转为保留（凭据与 3DS 保留，读面仍列出、`status` 为 `NOT_CONNECTED`）。

        - 目标就是当前在用的那家时，可以不带凭据子对象，沿用已存凭据、只改 3DS；首次连接、切换、停用后重连须带目标那家的凭据子对象，缺了 → 400。带了与 `provider` 不对应的子对象 → 400。
        - `threedsEnabled` 每次必传。
        - 这家不在读面的 `terminals` 里（当前商户币种下不可用）→ 400。凭据校验失败 → 400。
        - 凭据只回掩码摘要，明文不回显。

        `provider` 与 `threedsEnabled` 每次必传；凭据子对象不带就沿用已存的。同样的请求体重发结果不变，不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalIntegrationInput'
            examples:
              moneris:
                summary: Moneris（Store ID + API Token）
                value:
                  provider: moneris
                  moneris:
                    storeId: monstore01
                    apiToken: mtok_secret_xxxxxxxx
                  threedsEnabled: false
              clover:
                summary: Clover（Public + Private Token）
                value:
                  provider: clover
                  clover:
                    publicToken: clpub_xxxxxxxx
                    privateToken: clpriv_secret_xxxxxxxx
                  threedsEnabled: true
      responses:
        '204':
          description: 已生效
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    delete:
      tags:
        - service
      operationId: disableTerminalIntegration
      x-required-privilege: account:service:edit
      summary: 停用当前在用的 Moneris / Clover（凭据保留）
      description: |
        即时生效、无审核。停用后两家都是 `NOT_CONNECTED`，这家的凭据与 3DS 保留（读面仍给掩码与 3DS），再连时须重新带凭据。彻底清除已存凭据走客服。

        没有在用的也返回 `204`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已停用
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /account/service/ecommerce/{provider}:
    put:
      tags:
        - service
      operationId: updateEcommerceIntegration
      x-required-privilege: account:service:edit
      summary: 接入或管理 Shopify / Allvalue
      description: |
        提交网址与该集成要开的支付方式。全量覆盖：两项每次都要带，`paymentMethods` 是要开着的完整集合，没列的会被关掉。服务端按集成现状处理：

        - `NOT_CONNECTED`：建接入申请，进入审核（`UNDER_REVIEW`）。
        - `ACTIVE`：支付方式开关即时生效；网址变了即时生效，同时进复审，复审期间照常收款；复审中再改，沿用同一次复审。
        - `UNDER_REVIEW` → `409`·`208003`。

        其他规则：

        - `paymentMethods` 须取自读面该集成的 `paymentMethods`，否则 400。
        - 商户还没有已开通的线上支付方式时不能接入 → `409`·`208003`。
        - 不提供断开，走客服。

        同样的请求体重发结果不变，不挂 Idempotency-Key。
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/EcommerceProvider'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EcommerceIntegrationUpdate'
            example:
              websiteUrl: https://shop.example.com
              paymentMethods:
                - wechat_online
                - alipay_online
      responses:
        '204':
          description: 已保存（接入申请进入审核，或管理即时生效）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208003
  /account/refund-pin:
    put:
      tags:
        - refund-pin
      operationId: changeRefundPin
      x-required-privilege: account:refund-pin:manage
      summary: 改退款 PIN（用当前 PIN 校验）
      description: |
        校验当前 PIN 后改为新 PIN（不可与当前相同）。旧 PIN 立即失效，进行中的忘记 PIN 作废，给 Owner 登录邮箱发 PIN 已修改通知。

        幂等基准：`Idempotency-Key`。同键同请求体重发返回 `204`；同键改请求体返回 `409`·`208005`。

        错误码：

        - `400` 当前 PIN 错、新 PIN 与当前相同或格式非法。
        - `206004` 当前 PIN 连续错到上限，临时锁定；剩余秒数见 `context.cooldownSeconds`，锁定期内不校验。
        - `208005` 同一幂等键被用于不同的请求体。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - currentPin
                - newPin
              properties:
                currentPin:
                  allOf:
                    - $ref: '#/components/schemas/RefundPin'
                newPin:
                  allOf:
                    - $ref: '#/components/schemas/RefundPin'
                  description: 新 PIN，不可与 `currentPin` 相同；两次输入一致由前端校验
            example:
              currentPin: '123456'
              newPin: '654321'
      responses:
        '204':
          description: 已改（旧 PIN 失效）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206004
        - 208005
  /account/refund-pin/resets:
    post:
      tags:
        - refund-pin
      operationId: requestRefundPinReset
      x-required-privilege: account:refund-pin:manage
      summary: 忘记退款 PIN 第 1 步（发码到 Owner 邮箱）
      description: |
        生成 6 位码发到 Owner 的登录邮箱（不论谁发起），返回 `challengeId`、脱敏邮箱与冷却秒数，不需要当前 PIN。重新调用得到新 `challengeId`，旧码作废。

        不挂幂等键（挑战类，每次发新码）。冷却内重复调用返回 `429`·`208013`。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 码已发到 Owner 邮箱
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                challengeId: rpr_8c4e1d
                deliveredTo: o***@e***.com
                cooldownSeconds: 60
                expiresAt: '2026-06-24T09:30:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208013
  /account/refund-pin/resets/{challengeId}/confirmation:
    post:
      tags:
        - refund-pin
      operationId: confirmRefundPinReset
      x-required-privilege: account:refund-pin:manage
      summary: 忘记退款 PIN 第 2 步（码 + 新 PIN 一次提交）
      description: |
        校验 Owner 邮箱收到的码，码对才消费并写入新 PIN。旧 PIN 立即失效、锁定解除，给 Owner 登录邮箱发 PIN 已修改通知。码错不消费。

        不挂幂等键（挑战类）。这次重置已完成后再提交返回 `206006`。

        错误码：

        - `204010` 码错、还有次数；剩余次数见 `context.attemptsRemaining`。
        - `206007` 码错到上限，这次重置作废，须重新发起。
        - `206006` 这次重置已过期、已完成或已被新发的码顶掉。
      parameters:
        - name: challengeId
          in: path
          required: true
          schema:
            type: string
          description: 忘记 PIN 的 challengeId（第 1 步返回）
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - code
                - newPin
              properties:
                code:
                  allOf:
                    - $ref: '#/components/schemas/OtpCode'
                  description: Owner 邮箱收到的 6 位码
                newPin:
                  allOf:
                    - $ref: '#/components/schemas/RefundPin'
                  description: 新 PIN；两次输入一致由前端校验
            example:
              code: '112233'
              newPin: '654321'
      responses:
        '204':
          description: 已重置（旧 PIN 失效）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 206006
        - 206007
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在会话没有当前商户时返回 `409`·`208022`（见公共约定「当前商户」）。
  schemas:
    AcceptanceModeType:
      type: string
      enum:
        - in_store
        - online
      description: 受理模式：`in_store` 线下 / `online` 线上。
    ServiceStatus:
      type: string
      enum:
        - NOT_CONNECTED
        - UNDER_REVIEW
        - ACTIVE
      description: Service 页的开通状态（受理模式、支付方式、集成共用）：`NOT_CONNECTED` 未开通（申请被拒后也回到这里，可以重新申请）/ `UNDER_REVIEW` 审核中 / `ACTIVE` 已开通。
    TerminalProvider:
      type: string
      enum:
        - moneris
        - clover
      description: 卡终端（两家互斥）。
    EcommerceProvider:
      type: string
      enum:
        - shopify
        - allvalue
      description: 电商平台（可同时接入）。
    TimeZone:
      type: string
      minLength: 1
      description: |
        商户时区，取 **IANA tz database 标识**（如 `America/Toronto`）；**不用 PT/ET 等缩写**（缩写无法表达夏令时 DST）。

        候选按所选省 / 州取前端参考数据（IANA 标识），服务端按同一映射校验。

        本字段**从设计起即为可扩展取值**，消费方须 **unknown-safe**
        （遇未知 tz 原样透传 / 展示，不得因不在本地枚举而报错或丢值）。

        前端不要拿它换算日期。
      examples:
        - America/Toronto
    AccountProfile:
      type: object
      additionalProperties: false
      description: Business Profile 页的全部资料。各块的字段名与取值和入驻申请对应步骤一致。
      required:
        - merchantCode
        - businessInformation
        - settlement
        - contactInformation
        - documents
      properties:
        merchantCode:
          type: string
          readOnly: true
          description: Merchant ID（对外展示）。
        logoUrl:
          type: string
          format: uri
          readOnly: true
          description: Logo 的长效公开地址；没有 Logo 时不返回本键。
        businessInformation:
          $ref: '#/components/schemas/BusinessInformationView'
        settlement:
          $ref: '#/components/schemas/SettlementView'
        contactInformation:
          $ref: '#/components/schemas/ContactInformationView'
        documents:
          allOf:
            - $ref: '#/components/schemas/DocumentsStepRead'
          description: 入驻时上传的文档，与入驻申请 documents 步同形状、同键名；没上传的键不返回。只读，没有上传或替换入口。`previewUrl` 短时效、不要持久化。
    BusinessInformationView:
      type: object
      additionalProperties: false
      description: |
        Business Information 卡，字段名与取值同入驻 Business 步。

        锁定字段（激活后商户不能改）：`legalBusinessName`、`tradeName`、`typeOfOwnership`、`registrationNumber`、`referredBy`、`industryCategory`、`mcc`。其余可编辑，改走 `updateBusinessInformation`。

        展示名：行业、MCC 取 `/config/industries` 同码项的 `label`，省州取 `/config/countries` 的 `label`，企业类型由前端按枚举码 i18n，国家由前端按 ISO 码解析。
      required:
        - legalBusinessName
        - tradeName
        - typeOfOwnership
        - industryCategory
        - mcc
        - businessAddress
        - city
        - province
        - postalCode
        - country
        - timeZone
        - language
        - businessPhone
      properties:
        legalBusinessName:
          type: string
        tradeName:
          type: string
        typeOfOwnership:
          $ref: '#/components/schemas/OwnershipType'
        registrationNumber:
          type: string
          description: 没有时不返回本键。
        referredBy:
          type: string
          description: 没有时不返回本键。
        industryCategory:
          type: string
          description: 行业大类码，如 `A0`。
          examples:
            - A0
        mcc:
          type: string
          description: 四位 MCC。
          examples:
            - '0742'
        businessAddress:
          type: string
        city:
          type: string
        province:
          type: string
          description: ISO 3166-2 的地区部分（如 `BC`）。
        postalCode:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2。
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        language:
          $ref: '#/components/schemas/MerchantLanguage'
        businessPhone:
          $ref: '#/components/schemas/Phone'
    ContactInformationView:
      type: object
      additionalProperties: false
      description: Contact Information 卡，即该商户 Owner 的联系人资料，字段名同入驻 Contact 步。
      required:
        - firstName
        - lastName
        - email
      properties:
        firstName:
          type: string
        lastName:
          type: string
        businessTitle:
          type: string
          description: 职务文本原样回显（预设项或自定义文本，不会是字面 "Other"）；不在预设集内即自定义。
        phone:
          $ref: '#/components/schemas/Phone'
        email:
          type: string
          format: email
          readOnly: true
          description: Owner 登录邮箱，只读；改动走个人账号契约的改登录邮箱流程。
    BusinessInformationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        改 Business Information 的可编辑字段，只提交要改的；锁定字段不在这里，带了按未知字段 400。空提交 400。

        校验：`province` 须属 `/config/countries` 里所选国家的省州；`postalCode` 按所选国家的格式、`timeZone` 须在所选省州的时区候选内（前端取参考数据先校，服务端按同一规则重校）；`businessPhone` 的区号须在白名单内。
      properties:
        businessAddress:
          type: string
          minLength: 1
        city:
          type: string
          minLength: 1
        province:
          type: string
          minLength: 1
          description: 取自 `/config/countries` 里所选国家的 `provinces[].code`；改 `country` 后须重选
        postalCode:
          type: string
          minLength: 1
        country:
          type: string
          minLength: 1
          description: 取自 `/config/countries` 的 `items[].code`（ISO 3166-1 alpha-2）
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        language:
          allOf:
            - $ref: '#/components/schemas/MerchantLanguage'
          description: 改了立即生效，只影响之后发给商户的通知与之后出具的月对账单；已发出、已出具的不变。
        businessPhone:
          $ref: '#/components/schemas/Phone'
    ContactInformationUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      description: 改联系人，只提交要改的。名、姓提交时不能为空、不能清空；职务、电话可清空。邮箱不在这里（只读）。
      properties:
        firstName:
          type: string
          minLength: 1
        lastName:
          type: string
          minLength: 1
        businessTitle:
          type:
            - string
            - 'null'
          description: 职务文本；选 Other 时提交自定义文本、不提交字面 "Other"。`null` = 清空。
        phone:
          oneOf:
            - $ref: '#/components/schemas/Phone'
            - type: 'null'
          description: 区号候选取前端参考数据，服务端校验区号在白名单内。`null` = 清空。
    SettlementView:
      type: object
      additionalProperties: false
      description: Settlement 卡当前生效的结算信息，字段名同入驻 Settlement 步。不含 Legal Business Name（同 `businessInformation.legalBusinessName`）。
      required:
        - bankName
        - bankAccount
        - settlementCycle
        - pendingReview
      properties:
        bankName:
          type: string
        bankAccount:
          allOf:
            - $ref: '#/components/schemas/BankAccountIdentification'
            - type: object
              required:
                - accountNumberMasked
                - accountNumberSet
          description: 当前生效的结算银行账户；账号只给末 4 位掩码，任何面都不回明文。允许的制式取 `/config/settlement` 的 `bankAccountTypes`。
        settlementCycle:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 当前结算周期档位 code；展示名取 `/config/settlement` 同 code 项。
        storeId:
          type: string
          description: 没有时不返回本键。
        pendingReview:
          type: boolean
          readOnly: true
          description: 有审核中的结算变更时为 true（同一商户至多一个）。
    OtpChallenge:
      description: Owner email OTP 挑战句柄（结算变更 / Forgot PIN 两处发码入口共用）。形状是本 BFF 的共享件；投递目标恒为 Owner email。
      allOf:
        - $ref: '#/components/schemas/OtpChallenge-2'
    SettlementChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      description: |
        本次结算变更内容，只放要改的，至少一项。

        - **银行组（`bankName` + `bankAccount`）整组同进同出**——组内任一字段要改就两键都给、账号重新输入（服务端不回明文、不能只改一个字段），只给其中一键 → 400；银行账户不变的变更不带这两键；
        - 含银行组时须先上传 Void Cheque，提交时带 `voidChequeFileId`；
        - 只改 `storeId` / `settlementCycle` 时不带 `voidChequeFileId`。
      properties:
        storeId:
          type: string
        settlementCycle:
          $ref: '#/components/schemas/SettlementCycleCode'
        bankName:
          type: string
          description: 与 `bankAccount` 同进同出
        bankAccount:
          allOf:
            - $ref: '#/components/schemas/BankAccountIdentification'
            - type: object
              required:
                - accountNumber
          description: 新的结算银行账户（整组提交、**账号必填**；`type` 须 ∈ 商户结算币种允许的制式集；账号明文 write-only）。与 `bankName` 同进同出。
    SettlementChangeRequestInput:
      type: object
      additionalProperties: false
      description: 带码提交结算变更：验码与提交一次完成。`changes` 含银行组时 `voidChequeFileId` 必填（缺 → 400），否则不带。
      required:
        - otp
        - changes
      properties:
        otp:
          $ref: '#/components/schemas/OtpProof'
        changes:
          $ref: '#/components/schemas/SettlementChanges'
        voidChequeFileId:
          type: string
          description: '`uploadSettlementVoidChequeFile` 返回的 `fileId`；提交成功时该文件才归属本请求。'
    ServicePaymentMethod:
      type: object
      additionalProperties: false
      description: 某个支付方式在该受理模式下的状态。只列已开通与审核中的方式，其余候选取 `listPaymentMethodOptions`、可以申请。`ACTIVE` 时带 `enabled` 与 `rate`，`UNDER_REVIEW` 时两者都不带。
      required:
        - paymentMethod
        - status
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodCode'
        status:
          allOf:
            - $ref: '#/components/schemas/ServiceStatus'
          description: '`ACTIVE` 或 `UNDER_REVIEW`。'
        enabled:
          type: boolean
          description: 商户自己的开关，`ACTIVE` 时返回；关着的方式仍是 `ACTIVE`，随时可以再打开。
        rate:
          allOf:
            - $ref: '#/components/schemas/FeeRate'
          description: 当前适用的费率，`ACTIVE` 时返回。
    AcceptanceModeView:
      type: object
      additionalProperties: false
      description: |
        一个受理模式的状态与支付方式。模式有已开通的方式即 `ACTIVE`；没有、但有开通申请在审即 `UNDER_REVIEW`；否则 `NOT_CONNECTED`。

        - 商户把方式全关了（`enabled` 全为 `false`）仍是 `ACTIVE`，可以再打开。
        - 平台把该模式整个关闭（如复审不通过）回到 `NOT_CONNECTED`，可以重新申请。
      required:
        - mode
        - status
        - paymentMethods
      properties:
        mode:
          $ref: '#/components/schemas/AcceptanceModeType'
        status:
          $ref: '#/components/schemas/ServiceStatus'
        paymentMethods:
          type: array
          description: '`NOT_CONNECTED` 时为空；开通审核中时是申请里的方式（都是 `UNDER_REVIEW`）。不含信用卡，卡在 `terminals` 里。'
          items:
            $ref: '#/components/schemas/ServicePaymentMethod'
        typeOfOnlineService:
          allOf:
            - $ref: '#/components/schemas/OnlineServiceType'
          description: 线上模式开通审核中或已开通时返回；线下与未开通不返回本键。
        websiteUrl:
          type: string
          format: uri
          description: '`typeOfOnlineService` 为 `WEBSITE` 时返回，是当前生效的网址；其余不返回本键。'
        websiteUrlUnderReview:
          type: boolean
          description: 改过的服务类型或网址还在复审中时返回 `true`（复审期间照常收款）；不在复审中不返回本键。
    TerminalView:
      type: object
      additionalProperties: false
      description: 一家卡终端的状态。只列当前商户币种下可用的那几家。
      required:
        - provider
        - status
      properties:
        provider:
          $ref: '#/components/schemas/TerminalProvider'
        status:
          allOf:
            - $ref: '#/components/schemas/ServiceStatus'
          description: '`ACTIVE` 在用 / `NOT_CONNECTED` 未在用（没有审核，不会是 `UNDER_REVIEW`）。同一时刻至多一家 `ACTIVE`。'
        threedsEnabled:
          type: boolean
          description: 这家保存的 3DS 开关，配置过（在用或保留）才返回。
        credentialSummary:
          type: string
          readOnly: true
          description: 这家凭据的掩码摘要，配置过才返回；明文不返回。
    IntegrationPaymentMethod:
      type: object
      additionalProperties: false
      required:
        - paymentMethod
        - enabled
        - rate
      properties:
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodCode'
        enabled:
          type: boolean
          description: 这个集成是否用该方式；未接入时默认 `true`。
        rate:
          allOf:
            - $ref: '#/components/schemas/FeeRate'
          description: 该方式在这个集成下适用的费率（有集成专用费率时取专用的）。
    EcommerceIntegrationView:
      type: object
      additionalProperties: false
      description: 一个电商平台的接入状态。两个平台都返回。平台把已接入的集成关闭（如网址复审不通过）回到 `NOT_CONNECTED`，可以重新接入。
      required:
        - provider
        - status
        - paymentMethods
      properties:
        provider:
          $ref: '#/components/schemas/EcommerceProvider'
        status:
          $ref: '#/components/schemas/ServiceStatus'
        websiteUrl:
          type: string
          format: uri
          description: 接入审核中或已接入时返回，是当前生效的网址；未接入不返回本键。
        websiteUrlUnderReview:
          type: boolean
          description: 改过的网址还在复审中时返回 `true`（复审期间照常收款）；不在复审中不返回本键。
        paymentMethods:
          type: array
          description: 候选是商户已开通的线上支付方式（不含卡）。商户还没有已开通的线上方式时为空，不能接入。
          items:
            $ref: '#/components/schemas/IntegrationPaymentMethod'
    ServicePage:
      type: object
      additionalProperties: false
      required:
        - modes
        - terminals
        - ecommerce
      properties:
        modes:
          type: array
          description: 线下、线上各一项。
          items:
            $ref: '#/components/schemas/AcceptanceModeView'
        terminals:
          type: array
          description: 当前商户币种下可用的卡终端，每家一项。
          items:
            $ref: '#/components/schemas/TerminalView'
        ecommerce:
          type: array
          description: 每个电商平台一项。
          items:
            $ref: '#/components/schemas/EcommerceIntegrationView'
    AcceptanceModeUpdate:
      type: object
      additionalProperties: false
      description: 保存一个受理模式：希望开着的支付方式，加上开通材料（未开通时）或线上服务类型与网址。各字段何时必带见 `updateAcceptanceMode`。
      required:
        - paymentMethods
      properties:
        paymentMethods:
          type: array
          uniqueItems: true
          description: 希望开着的支付方式：已开通的即时开关，未开通的进申请。须属于该模式、在当前商户币种的候选内。
          items:
            $ref: '#/components/schemas/PaymentMethodCode'
        storeInsideFileId:
          type: string
          minLength: 1
          description: 开通线下模式时必带：门店内照（`uploadStorePhotoFile` 返回的 `fileId`）。其他情况不带。
        storeOutsideFileId:
          type: string
          minLength: 1
          description: 开通线下模式时必带：门店外照（`uploadStorePhotoFile` 返回的 `fileId`）。其他情况不带。
        typeOfOnlineService:
          allOf:
            - $ref: '#/components/schemas/OnlineServiceType'
          description: 线上模式：开通时必带；已开通时带了即修改（进复审）。线下不带。
        websiteUrl:
          type: string
          format: uri
          description: '`typeOfOnlineService` 为 `WEBSITE` 时必带（http / https）；其他类型与线下不带。'
    TerminalIntegrationInput:
      type: object
      additionalProperties: false
      description: 连接、切换或更新一家卡终端。`provider` 决定带哪个凭据子对象，何时可以不带见 `updateTerminalIntegration`。
      required:
        - provider
        - threedsEnabled
      properties:
        provider:
          $ref: '#/components/schemas/TerminalProvider'
        threedsEnabled:
          type: boolean
          description: 3DS 开关（线上交易 3DS 验证）。每次必传，缺省不代表保持原样。
        moneris:
          type: object
          additionalProperties: false
          description: '`provider = moneris` 的凭据（Store ID + API Token，两项同进同出）。何时可以不带见 `updateTerminalIntegration`。'
          required:
            - storeId
            - apiToken
          properties:
            storeId:
              type: string
              minLength: 1
            apiToken:
              type: string
              minLength: 1
              description: 明文输入（保存后掩码回显）。
        clover:
          type: object
          additionalProperties: false
          description: '`provider = clover` 的凭据（Public + Private Token，两项同进同出）。何时可以不带见 `updateTerminalIntegration`。'
          required:
            - publicToken
            - privateToken
          properties:
            publicToken:
              type: string
              minLength: 1
            privateToken:
              type: string
              minLength: 1
              description: 明文输入（保存后掩码回显）。
    EcommerceIntegrationUpdate:
      type: object
      additionalProperties: false
      description: 接入或管理一个电商平台：网址 + 要开的支付方式（覆盖式，漏传即关）。
      required:
        - websiteUrl
        - paymentMethods
      properties:
        websiteUrl:
          type: string
          format: uri
          description: 店铺网址（http / https）。
        paymentMethods:
          type: array
          minItems: 1
          uniqueItems: true
          description: 这个集成要开的支付方式，须取自读面该集成的 `paymentMethods`。
          items:
            $ref: '#/components/schemas/PaymentMethodCode'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              type: string
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              type: string
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
    OwnershipType:
      type: string
      enum:
        - SOLE_PROPRIETORSHIP
        - PARTNERSHIP
        - CORPORATION
        - NON_PROFIT
      description: 企业类型（入驻 Business 步与 Business Profile 共用），展示名由前端按码 i18n。
    MerchantLanguage:
      type: string
      description: 商户语言：发给商户的通知（邮件、微信、站内信）与月对账单 PDF 按它出。界面语言、收据与导出文件、发给某个人本人的邮件不看它，按用户自己的语言。
      enum:
        - en
        - fr
        - zh
    Phone:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      maxLength: 16
      description: 电话号码，**国际格式整串**（`+` + 国家码 + 正文号，如 `+16045550123`）——**一个字段装完，没有独立的区号字段**。 上界 16 = `+` 加最多 15 位数字（国际号码总长上限）；**服务端只校验这一条通用规则 + 区号在白名单内**， **不按区号分别限长**。前端按所选区号收窄输入位数属输入体验、不是契约约束。 渲染「区号下拉 + 号码框」两个控件时，用前端参考数据里的区号表做**最长前缀匹配**拆分本串。
    BankAccountIdentification:
      type: object
      additionalProperties: false
      description: |
        结算银行账户（按收款银行所在国的本地制式）。`type` 定制式、随制式带对应字段，不属该制式的字段不传（传了 → 400）：

        - `ca_local`（加拿大 EFT）—— 须带 `transitNumber` + `institutionNumber`；
        - `us_local`（美国 ACH）—— 须带 `routingNumber` + `accountType`。

        各制式的字段名保留本国叫法、位数为固定契约值、由服务端按 `type` 校验。允许哪些 `type` 见 `/config/settlement` 的 `bankAccountTypes`（按结算币种）。

        账号明文 write-only、读侧走掩码 + 已填标志。本 schema 是**草稿宽松形**（账号可缺）；写面与读面各自用 allOf 收紧必填（写面须带 `accountNumber`，读面须带 `accountNumberMasked` + `accountNumberSet`）。
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - ca_local
            - us_local
          description: 结算银行账户制式（`ca_local` 加拿大 EFT / `us_local` 美国 ACH）。**封闭 enum**——新增国家 = 契约加取值与对应字段 + 前端加表单组件 + 出款适配器，不是纯配置。
        transitNumber:
          type: string
          pattern: ^[0-9]{5}$
          description: Transit Number，5 位数字（分行）。只属 `type=ca_local`（**此时必填**）。
        institutionNumber:
          type: string
          pattern: ^[0-9]{3}$
          description: Institution Number，3 位数字（银行）。只属 `type=ca_local`（**此时必填**）。
        routingNumber:
          type: string
          pattern: ^[0-9]{9}$
          description: ABA Routing Number，9 位数字。只属 `type=us_local`（**此时必填**）。
        accountType:
          type: string
          enum:
            - checking
            - savings
          description: 账户类型（ACH 必需）。只属 `type=us_local`（**此时必填**）。
        accountNumber:
          type: string
          writeOnly: true
          pattern: ^[0-9]{4,17}$
          description: 银行账号（write-only 输入；read 走 accountNumberMasked，明文不回显）。位数随制式：`ca_local` 6-12 位、`us_local` 4-17 位——schema 只守两制式的并集，精确位数由服务端按 `type` 校验。
        accountNumberMasked:
          type: string
          readOnly: true
          description: 账号末 4 位掩码回显（如 `•••• 5678`）。
        accountNumberSet:
          type: boolean
          readOnly: true
          description: 是否已填 accountNumber（跨设备恢复 / 草稿完整性判定用）。
    SettlementCycleCode:
      type: string
      minLength: 1
      description: 结算周期档位的**稳定取值**（`SettlementCycleOption.code`）。**对客户端不透明**——从候选集里取来原样回传， 不要解析、拼接或据其分支；**不要传展示名**（那是展示文案、不是取值）。 服务端按**提交时点**的候选集校验：不在集内 → 拒绝（`400`·`204017` + `details` 字段级明细），**不静默回落到候选集第一项**；前端应重取候选集让用户重选。 ⚠️ **你当前选中的取值不会凭空失效**——「打开编辑框却选不中自己现在的档位」「草稿存不回去」这类情形不会发生，无需为此写兜底。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    DocumentRef:
      type: object
      description: Documents step 保存时绑定的文档引用（按 fileId 关联已上传的文件）。
      additionalProperties: false
      required:
        - fileId
      properties:
        fileId:
          type: string
          description: 上传接口返回的 fileId，提交本 step 时用它完成绑定。
        fileName:
          type: string
          readOnly: true
          description: 原始文件名（文档卡片据此显示名称）；提交时不必传。
        fileSize:
          type: integer
          format: int64
          readOnly: true
          description: 字节数；提交时不必传。
        uploadedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 上传时刻；提交时不必传。
        previewUrl:
          type: string
          format: uri
          readOnly: true
          description: 该文档的**内联展示地址**（**只出不入**），供卡片缩略图 / 预览。**短时效**，过期后重新加载本申请取新值； **不要持久化、不要分享**——入驻文档含身份与银行资料。哪些面必返本键，见各面自己的读形态。
    DocumentsStep:
      type: object
      description: Step 5 Documents。docIncorporation / docOwnerId / docVoidCheque 必传；docStoreInside / docStoreOutside 在 Services 步选了线下支付方式时必传；docOther1 / docOther2 可选。绑定按 fileId。
      additionalProperties: false
      properties:
        docStoreInside:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docStoreOutside:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docIncorporation:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docOwnerId:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docVoidCheque:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docOther1:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docOther2:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
    DocumentRefFeRead:
      description: '`DocumentRef` 的**商户前端**读侧形态：元数据 + `previewUrl` 全部必返（写侧只需 `fileId`，故收紧只在读面做）。服务面的审核读不返访问地址、不用本形态。'
      required:
        - fileId
        - fileName
        - fileSize
        - uploadedAt
        - previewUrl
      allOf:
        - $ref: '#/components/schemas/DocumentRef'
    DocumentsStepFeReadOverlay:
      description: 商户前端读面的文档位：元数据 + `previewUrl` 必返（见 `DocumentRefFeRead`）。
      properties:
        docStoreInside:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docStoreOutside:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docIncorporation:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docOwnerId:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docVoidCheque:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docOther1:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docOther2:
          $ref: '#/components/schemas/DocumentRefFeRead'
    DocumentsStepRead:
      description: '`DocumentsStep` 的商户前端读侧形态：未上传的文档位**不返回本键**、不返 `null`；已上传的必带元数据与 `previewUrl`。'
      allOf:
        - $ref: '#/components/schemas/DocumentsStep'
        - $ref: '#/components/schemas/DocumentsStepFeReadOverlay'
    FileUploadForm:
      type: object
      additionalProperties: false
      description: |
        上传入参(`multipart/form-data`)。文件经本平台中转存入对象存储;按 `purpose` 校验实际文件的格式与大小,不合规 → 400。

        不要手设 `Content-Type`:直接提交 `FormData`,由客户端带上 `boundary`。
      required:
        - file
        - purpose
      properties:
        file:
          type: string
          format: binary
          description: 文件本体。
        purpose:
          type: string
          description: 文件用途,决定允许的格式、大小上限与取用方式;每个上传入口只接受它所属业务范围内的用途。
    MerchantFilePurpose:
      type: string
      description: |
        商户后台可上传的**文件用途**总表 —— 用途决定允许的格式、大小上限与取用方式。
        每个上传入口只接受它所属业务范围内的用途（各入口在自己的请求体里列出），传入范围外的用途 → 400。

        | 用途 | 允许格式 | 大小上限 | 传上去之后怎么取用 |
        |---|---|---|---|
        | `onboarding_document` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（含身份与银行资料，仅授权主体可取） |
        | `settlement_void_cheque` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `store_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `merchant_logo` | PNG / JPEG | **512KB（固定上限）** | 长效稳定的公开地址（要展示给外部访客） |
        | `payment_page_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `product_link_banner` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `product_link_brand_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `product_link_item_image` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |

        **短时效地址不要持久化、不要分享**（过期即失效，重新读取所在资源可拿到新的）；长效公开地址可直接放进页面。
      enum:
        - onboarding_document
        - settlement_void_cheque
        - store_photo
        - merchant_logo
        - payment_page_logo
        - product_link_banner
        - product_link_brand_logo
        - product_link_item_image
    UploadedFile:
      type: object
      additionalProperties: false
      description: |
        已上传的文件。上传成功不等于生效:`fileId` 要随对应的业务写操作提交,文件才归属该业务对象;从未被引用的文件到期清理。
      required:
        - fileId
        - fileName
        - fileSize
        - contentType
        - previewUrl
      properties:
        fileId:
          type: string
          description: 该文件的稳定引用,业务写操作提交它;不要保存任何物理地址。
          examples:
            - 0f8c2a6e4b1d47f0a9c3e5d7b2148a6f
        fileName:
          type: string
          description: 原始文件名。
        fileSize:
          type: integer
          format: int64
          description: 字节数。
        contentType:
          type: string
          description: 服务端判定的内容类型。
        previewUrl:
          type: string
          format: uri
          description: 可渲染地址(只出不入),供上传后立即回显。按用途分长效公开地址或短时效地址,短时效的不要持久化。
    OtpChallenge-2:
      type: object
      additionalProperties: false
      description: 一次性验证码挑战句柄 = `OtpDelivery` 的三件事 + 本挑战自己的 id（供后续校验步骤引用）。 用于**挑战自带 id** 的入口；若 id 已由所在流程的资源提供（如 change-request），那里直接用 `OtpDelivery`、不重复给 id。 **各入口的绑定语义与失效细则不同**（是否绑操作摘要 / 发起会话、幂等重投是否受时限约束等），见各自端点说明。
      required:
        - challengeId
        - deliveredTo
        - cooldownSeconds
        - expiresAt
      properties:
        challengeId:
          type: string
          readOnly: true
          description: 挑战实例 id，串起后续校验步骤。
        deliveredTo:
          type: string
          readOnly: true
          description: 脱敏投递目标（如 `o***@e***.com`）——供 FE 提示「码发到哪里」。
        cooldownSeconds:
          type: integer
          readOnly: true
          minimum: 0
          description: 重发冷却秒数（部署可配）。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 该码的失效时间（部署可配）。
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
    OtpProof:
      type: object
      required:
        - challengeId
        - code
      additionalProperties: false
      description: 验证码凭证：发码那一步拿到的 `challengeId` 加收到的 6 位码。发码与提交分成两个接口、码随业务内容一起提交的入口都用它，键名都是 `otp`。
      properties:
        challengeId:
          type: string
          minLength: 1
        code:
          $ref: '#/components/schemas/OtpCode'
    PaymentMethodCode:
      type: string
      minLength: 1
      description: 支付方式目录码（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，前端从候选集取来原样回传。
      examples:
        - wechat_instore
    FeeRate:
      type: object
      additionalProperties: false
      description: 比例费率与固定单笔费两项合起来是一个费率，比较两个费率是否相同要两项都比。
      required:
        - percentageRate
        - fixedFee
      properties:
        percentageRate:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
          description: 比例费率，小数（`0.015` = 1.5%）。
          examples:
            - '0.015'
        fixedFee:
          type: string
          pattern: ^[0-9]+$
          description: 固定单笔费，结算币种的最小单位整数串（`10` = 0.10）；没有固定费或在免收期内为 `0`。不带币种，按该商户的结算币种解释（收费币种与结算币种一致、不跨币种换算）。
          examples:
            - '10'
    OnlineServiceType:
      type: string
      enum:
        - WEBSITE
        - APP
        - MINI_PROGRAM
        - OTHER
      description: 线上服务类型（入驻 Business 步与 Service 页共用），展示名由前端按码 i18n。只有 `WEBSITE` 有网址。
    RefundPin:
      type: string
      writeOnly: true
      pattern: ^[0-9]{6}$
      description: 商户级 Refund PIN——**6 位纯数字**。 **write-only**：仅作入参采集，**绝不出现在任何响应**（含错误响应）；读面走掩码 / 已填标志。
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: \S
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: \S
