openapi: 3.1.0
info:
  title: 商户后台 资金 — 前端契约面
  version: 2.0.0
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的资金契约：账户余额与退款准备金的充值、取回，结算单与逐笔结算明细，月对账单。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **金额**：最小币种单位整数加币种，都是商户的结算币种。

    **幂等 / CSRF 口径**：

    - 两个资金动作（准备金充值、取回）必带 `Idempotency-Key`，缺了 → `400`。同键同内容重发返回首次结果，不会划两次；改了内容要换新键，沿用旧键 → `409`·`208005`。发验证码不挂幂等键。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 当前商户以会话为准、不看请求体；当前商户不可访问时返回 `409`·`208022`。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: balance
    x-displayName: 账户余额
    description: 账户余额：可结算余额、退款准备金余额、自动补足的最低金额；以及退款准备金的充值（要 Owner 邮箱验证码，可同时改自动补足的最低金额）与取回。
  - name: settlements
    x-displayName: 结算单
    description: 结算单：列表与导出，每张结算单的逐笔明细与导出。
  - name: statements
    x-displayName: 月对账单
    description: 月对账单：一个月一张，列表、详情与 PDF。只读。
paths:
  /funds/balance:
    get:
      tags:
        - balance
      operationId: getBalance
      x-required-privilege: session
      summary: 账户余额
      description: |
        当前商户的账户余额、待结算金额、退款准备金与自动补足设置，结算币种。

        `toSettle` 是可结算余额减去商户欠平台的钱，不含预授权挂起中的款项，可能为负。它是下一次结算大约会打出来的金额；手续费在结算时扣的商户，实际到账还要再减手续费。

        `accountBalance` 是余额卡片上的账户余额，等于 `toSettle` 加上预授权挂起中的款项；挂起款项并在里面、不单列，可能为负。
      responses:
        '200':
          description: 账户余额
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
              example:
                accountBalance:
                  amount: '1250050'
                  currency: CAD
                toSettle:
                  amount: '1200050'
                  currency: CAD
                refundReserve:
                  amount: '500000'
                  currency: CAD
                reserveMinimumAmount:
                  amount: '50000'
                  currency: CAD
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /funds/balance/reserve/otp-challenges:
    post:
      tags:
        - balance
      operationId: requestRefundReserveOtp
      x-required-privilege: account:reserve:create
      summary: 准备金充值第 1 步：发验证码到 Owner 邮箱
      description: |
        发 6 位码到 Owner 的登录邮箱，返回 `challengeId`。
        本步只发码、不带充值内容；码和内容在第 2 步一起提交。

        重新发码会让旧码作废，冷却中 → `429`·208013。按挑战流程语义不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已发码（`deliveredTo` 为脱敏 Owner 邮箱）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                challengeId: chl_9f2a7c
                deliveredTo: o***@e***.com
                cooldownSeconds: 60
                expiresAt: '2026-05-19T14:35:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208013
  /funds/balance/reserve/funding:
    post:
      tags:
        - balance
      operationId: fundRefundReserve
      x-required-privilege: account:reserve:create
      summary: 准备金充值第 2 步：充值与 / 或改自动补足的最低金额
      description: |
        从 Account Balance 向退款准备金充值，和 / 或修改自动补足的最低金额；两项至少给一项，带第 1 步的 `challengeId` 与验证码。

        验证码：

        - 不对 → `400`·204010，剩余次数在 `context.attemptsRemaining`；
        - 已过期 → `410`·206006；
        - 错太多次被锁 → `423`·206007。

        以上任一情形，充值与设置都不生效。

        `200` 表示已处理：

        - 给了 `topUpAmount` 时看 `topUp.status`：`POSTED` 已划转；`REJECTED` 是 Account Balance 不够，没有划转。
        - 给了 `minimumAmount` 时最低金额已保存，与充值是否成功无关。

        最低金额低于平台规定的下限 → `400`·204018，当前下限在 `context.floorAmount`；整次提交不生效。

        最低金额只是保存设置。准备金低于最低金额时，平台每天从待结算金额（`toSettle`）补一次，不够就补到有多少算多少。

        幂等：带 `Idempotency-Key`。比对只看 `topUpAmount` 与 `minimumAmount`，不看 `otp`——验证码输错后重输、网络重试都用原键；同键同内容重发返回首次结果，不会划两次。改了金额或设置 → 换新键，沿用旧键 → `409`·208005；同键的上一次提交还在处理 → `409`·208011。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundReserveFundingRequest'
            examples:
              both:
                summary: 充值并把最低金额设为 500
                value:
                  topUpAmount:
                    amount: '100000'
                    currency: CAD
                  minimumAmount:
                    amount: '50000'
                    currency: CAD
                  otp:
                    challengeId: chl_9f2a7c
                    code: '482915'
              turnOff:
                summary: 只关掉自动补足
                value:
                  minimumAmount: null
                  otp:
                    challengeId: chl_9f2a7c
                    code: '482915'
      responses:
        '200':
          description: 已处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundReserveFundingResult'
              examples:
                posted:
                  summary: 充值成功，最低金额已保存
                  value:
                    topUp:
                      status: POSTED
                    balance:
                      accountBalance:
                        amount: '1150050'
                        currency: CAD
                      toSettle:
                        amount: '1100050'
                        currency: CAD
                      refundReserve:
                        amount: '600000'
                        currency: CAD
                      reserveMinimumAmount:
                        amount: '50000'
                        currency: CAD
                rejected:
                  summary: 余额不够，没有划转；最低金额照样保存
                  value:
                    topUp:
                      status: REJECTED
                      rejectionReason: INSUFFICIENT_BALANCE
                    balance:
                      accountBalance:
                        amount: '50050'
                        currency: CAD
                      toSettle:
                        amount: '50'
                        currency: CAD
                      refundReserve:
                        amount: '500000'
                        currency: CAD
                      reserveMinimumAmount:
                        amount: '50000'
                        currency: CAD
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 204018
        - 206006
        - 206007
        - 208005
        - 208011
  /funds/balance/reserve/withdrawals:
    post:
      tags:
        - balance
      operationId: withdrawRefundReserve
      x-required-privilege: account:reserve:create
      summary: 把准备金取回 Account Balance
      description: |
        把退款准备金里的钱取回 Account Balance，之后随正常结算打到结算账户，不单独出款。不需要验证码。

        `200` 表示已处理，看 `status`：`POSTED` 已划转；`REJECTED` 是准备金余额不够，没有划转。

        幂等：带 `Idempotency-Key`。同键同金额重发返回首次结果，不会取两次；改了金额 → 换新键，沿用旧键 → `409`·208005；同键的上一次提交还在处理 → `409`·208011。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundReserveWithdrawalRequest'
            example:
              amount:
                amount: '30000'
                currency: CAD
      responses:
        '200':
          description: 已处理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundReserveWithdrawalResult'
              example:
                status: POSTED
                balance:
                  accountBalance:
                    amount: '1280050'
                    currency: CAD
                  toSettle:
                    amount: '1230050'
                    currency: CAD
                  refundReserve:
                    amount: '470000'
                    currency: CAD
                  reserveMinimumAmount:
                    amount: '50000'
                    currency: CAD
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208005
        - 208011
  /funds/settlements:
    get:
      tags:
        - settlements
      operationId: listSettlements
      x-required-privilege: orders:settlement:view
      summary: 结算单列表
      description: |
        当前商户的结算单，分页。一张结算单是某个清算日对本商户的一次出款。日期按结算日筛，两个都不传就不按日期筛。
      parameters:
        - $ref: '#/components/parameters/SettlementFrom'
        - $ref: '#/components/parameters/SettlementTo'
        - $ref: '#/components/parameters/SettlementStatusFilter'
        - $ref: '#/components/parameters/SettlementKeyword'
        - $ref: '#/components/parameters/SettlementSortField'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 结算单分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementList'
              example:
                total: 24
                data:
                  - settlementId: S20260519000123
                    settlementDate: '2026-05-19'
                    periodFrom: '2026-05-15'
                    periodTo: '2026-05-17'
                    netSales:
                      amount: '40000'
                      currency: CAD
                    fee:
                      amount: '1740'
                      currency: CAD
                    payoutAmount:
                      amount: '46260'
                      currency: CAD
                    status: SETTLED
                    payoutAccount:
                      bankName: RBC
                      accountNumberMasked: •••• 5678
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /funds/settlements/export:
    get:
      tags:
        - settlements
      operationId: exportSettlements
      x-required-privilege: orders:settlement:view
      summary: 导出结算单列表（xlsx）
      description: |
        按当前筛选、搜索与排序命中的全部结算单导出 Excel，不只是当前页；同步返回文件流。每张结算单一行，列与列表行的字段相同，另加一列商户名；末尾一行合计。表头与枚举文案按 `Accept-Language`，实际用的语言经 `Content-Language` 回。
      parameters:
        - $ref: '#/components/parameters/SettlementFrom'
        - $ref: '#/components/parameters/SettlementTo'
        - $ref: '#/components/parameters/SettlementStatusFilter'
        - $ref: '#/components/parameters/SettlementKeyword'
        - $ref: '#/components/parameters/SettlementSortField'
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /funds/settlements/{settlementId}/details:
    get:
      tags:
        - settlements
      operationId: listSettlementDetails
      x-required-privilege: orders:settlement:view
      summary: 一张结算单的逐笔明细
      description: |
        归进这张结算单的每一笔资金移动，分页，按发生时间先后排。除收款与退款外，还包括准备金的充值与取回、平台调账、营销账户取现、被退回的出款。

        金额都不带符号，算加还是算减由 `type` 决定。各行按正负把 `netAmount` 加总，等于结算单的 `payoutAmount`。

        结算单不存在或不属于当前商户 `404`。
      parameters:
        - name: settlementId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 明细分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementDetailList'
              example:
                total: 4
                data:
                  - type: PAYMENT
                    orderId: P100240001
                    paymentMethodFamily: wechat
                    amount:
                      amount: '10000'
                      currency: CAD
                    fee:
                      amount: '290'
                      currency: CAD
                    netAmount:
                      amount: '9710'
                      currency: CAD
                    occurredAt: '2026-05-15T11:02:00Z'
                  - type: PAYMENT
                    orderId: P100240002
                    paymentMethodFamily: alipay
                    amount:
                      amount: '50000'
                      currency: CAD
                    fee:
                      amount: '1450'
                      currency: CAD
                    netAmount:
                      amount: '48550'
                      currency: CAD
                    occurredAt: '2026-05-15T13:26:00Z'
                    note: 门店订单
                  - type: REFUND
                    orderId: P100239990
                    refundId: R100239990-1
                    paymentMethodFamily: wechat
                    amount:
                      amount: '20000'
                      currency: CAD
                    fee:
                      amount: '0'
                      currency: CAD
                    netAmount:
                      amount: '20000'
                      currency: CAD
                    occurredAt: '2026-05-16T15:12:00Z'
                  - type: RESERVE_DRAWDOWN
                    orderId: P100239990
                    refundId: R100239990-1
                    amount:
                      amount: '8000'
                      currency: CAD
                    netAmount:
                      amount: '8000'
                      currency: CAD
                    occurredAt: '2026-05-16T15:12:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /funds/settlements/{settlementId}/export:
    get:
      tags:
        - settlements
      operationId: exportSettlementDetails
      x-required-privilege: orders:settlement:view
      summary: 导出一张结算单（xlsx）
      description: |
        一张结算单的 Excel：一个工作表是概要（商户名、币种、结算单号、结算日、交易期间、收款、退款、净销售额、手续费、出款额），另一个是全部逐笔明细；同步返回文件流。明细行数超过单个工作表容量时分成多个工作表。表头与枚举文案按 `Accept-Language`，实际用的语言经 `Content-Language` 回。

        结算单不存在或不属于当前商户 `404`。
      parameters:
        - name: settlementId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          $ref: '#/components/responses/XlsxFile'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /funds/statements:
    get:
      tags:
        - statements
      operationId: listStatements
      x-required-privilege: account:statement:view
      summary: 月对账单列表
      description: |
        当前商户已出具的全部月对账单，一个月一张，最近的月在前。不分页、不带筛选参数；一张都没有时 `items` 为空数组。

        一个月结束后才出具，当月没有对账单；那个月没有交易也没有额外收费的不出。
      responses:
        '200':
          description: 全部月对账单
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Statement'
              example:
                items:
                  - statementId: stmt_01HZX3
                    statementNo: STMT-2026-04-0042
                    month: 2026-04
                    issuedAt: '2026-05-01T09:00:00Z'
                    transactionCount: 3421
                    netSales:
                      amount: '10103333'
                      currency: CAD
                    refundAmount:
                      amount: '84210'
                      currency: CAD
                    fee:
                      amount: '121240'
                      currency: CAD
                    netSettlement:
                      amount: '9982093'
                      currency: CAD
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /funds/statements/{statementId}:
    get:
      tags:
        - statements
      operationId: getStatement
      x-required-privilege: account:statement:view
      summary: 月对账单详情
      description: |
        一张月对账单：列表行上的各字段，加手续费明细行、额外收费、税与本单应收。

        不存在或不属于当前商户 → `404`。
      parameters:
        - name: statementId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 月对账单详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatementDetail'
              example:
                statementId: stmt_01HZX3
                statementNo: STMT-2026-04-0042
                month: 2026-04
                issuedAt: '2026-05-01T09:00:00Z'
                transactionCount: 3421
                netSales:
                  amount: '10103333'
                  currency: CAD
                refundAmount:
                  amount: '84210'
                  currency: CAD
                fee:
                  amount: '121240'
                  currency: CAD
                netSettlement:
                  amount: '9982093'
                  currency: CAD
                feeLines:
                  - service: in_store
                    rate:
                      percentageRate: '0.012'
                      fixedFee: '0'
                    transactionCount: 1820
                    netSales:
                      amount: '5200000'
                      currency: CAD
                    refundAmount:
                      amount: '84210'
                      currency: CAD
                    fee:
                      amount: '62400'
                      currency: CAD
                  - service: shopify
                    rate:
                      percentageRate: '0.012'
                      fixedFee: '0'
                    transactionCount: 1601
                    netSales:
                      amount: '4903333'
                      currency: CAD
                    refundAmount:
                      amount: '0'
                      currency: CAD
                    fee:
                      amount: '58840'
                      currency: CAD
                charges:
                  - type: APP_SUBSCRIPTION
                    quantity: 2
                    amount:
                      amount: '4000'
                      currency: CAD
                taxes:
                  - taxedComponent: APP_SUBSCRIPTION
                    taxType: GST
                    taxRate: '0.05'
                    taxableAmount:
                      amount: '4000'
                      currency: CAD
                    amount:
                      amount: '200'
                      currency: CAD
                receivableAmount:
                  amount: '4200'
                  currency: CAD
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /funds/statements/{statementId}/pdf:
    get:
      tags:
        - statements
      operationId: getStatementPdf
      x-required-privilege: account:statement:view
      summary: 月对账单 PDF
      description: |
        出具时生成并存档的那一份 PDF，每次取到的是同一个文件。语言是出具时商户资料里的语言，不随请求语言变；商户之后改了语言，已出具的也不变。

        不存在或不属于当前商户 → `404`。
      parameters:
        - name: statementId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 月对账单 PDF
          headers:
            Content-Disposition:
              required: true
              description: '`inline; filename=...pdf`（浏览器打印 / 另存；filename 编码 RFC 5987）——必返'
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在会话没有当前商户时返回 `409`·`208022`（见公共约定「当前商户」）。
  parameters:
    SettlementFrom:
      name: from
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LocalDate'
      description: 结算日的起始日期（含当日）。不传即不设下界。
    SettlementTo:
      name: to
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/LocalDate'
      description: 结算日的截止日期（含当日）。不传即不设上界。
    SettlementStatusFilter:
      name: status
      in: query
      required: false
      schema:
        $ref: '#/components/schemas/SettlementStatus'
    SettlementKeyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
        maxLength: 128
      description: 结算单号模糊匹配。
    SettlementSortField:
      name: sortField
      in: query
      required: false
      schema:
        type: string
        enum:
          - settlementDate
          - netSales
      description: 排序字段。不传 = 不排序。
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: \S
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: \S
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 页面当前的语言（BCP-47，如 `zh-Hans` / `fr-CA`）。服务端生成文件（xlsx / PDF）时按它取最接近的语言（如 `fr-CA` → `fr`），没有匹配的依次回退到账号的界面语言、商户语言。实际用的语言经 `Content-Language` 回。
  schemas:
    Balance:
      type: object
      additionalProperties: false
      description: 账户余额，结算币种。
      required:
        - accountBalance
        - toSettle
        - refundReserve
      properties:
        accountBalance:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 余额卡片上的账户余额：`toSettle` 加上预授权挂起中的款项（并在里面、不单列），可能为负。
        toSettle:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 待结算金额：可结算余额减去商户欠平台的钱，不含预授权挂起中的款项，可能为负。它是下一次结算大约会打出来的金额。准备金充值从这里出，为正时它就是可充上限。
        refundReserve:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 退款准备金余额，不小于 0。它也是可取回的上限。
        reserveMinimumAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 自动补足的最低金额。没开自动补足时不返回本键。
    SettlementStatus:
      type: string
      description: |
        结算单状态：`PENDING` 待出款 · `PROCESSING` 出款中 · `SETTLED` 已结算 · `FAILED` 出款失败 · `RETURNED` 出款后被银行退回。

        `FAILED` 的结算单会重新出款，状态回到 `PENDING`。`RETURNED` 是终态：退回的钱回到 Account Balance，随后面的结算单再出。
      enum:
        - PENDING
        - PROCESSING
        - SETTLED
        - FAILED
        - RETURNED
    Settlement:
      type: object
      description: 结算单列表的一行。
      required:
        - settlementId
        - settlementDate
        - netSales
        - fee
        - payoutAmount
        - status
      properties:
        settlementId:
          type: string
          minLength: 1
        settlementDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 结算日（清算日）。
        periodFrom:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 这张结算单的收款与退款明细（含退款失败的回冲）里最早一笔的日期。没有这类明细时不返回本键。
        periodTo:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 同一范围里最晚一笔的日期，与 `periodFrom` 同有同无。
        netSales:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 净销售额：这张结算单里收款合计减退款合计（退款失败的回冲抵减退款）。只算收款与退款明细，可能为负。
        fee:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 这些收款与退款的手续费净额：收款的手续费加上退款失败时重新扣回的，减去退款时退还的。
        payoutAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 出款额：这张结算单打到结算账户的金额。它还计入准备金充值与取回、平台调账、营销账户取现、被退回的出款，所以不一定等于 `netSales` 减 `fee`；手续费按月另收的商户，本项没有扣手续费。
        status:
          $ref: '#/components/schemas/SettlementStatus'
        payoutAccount:
          description: 这张结算单出款打到的结算账户，取最近一次出款用的那个，不随商户之后更换结算账户而变。还没出过款（`PENDING` 且没有失败过）时不返回本键。
          allOf:
            - $ref: '#/components/schemas/PayoutAccount'
    PayoutAccount:
      type: object
      description: 一次出款打入的银行账户。
      required:
        - bankName
        - accountNumberMasked
      properties:
        bankName:
          type: string
          minLength: 1
        accountNumberMasked:
          type: string
          minLength: 1
          description: 脱敏的银行账号，只露后四位，如 `•••• 5678`。
    SettlementList:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/Settlement'
    SettlementDetailType:
      type: string
      description: |
        结算明细的类型，决定这一行在出款额里算加（+）还是算减（−）。

        | 取值 | 含义 | 正负 |
        |---|---|---|
        | `PAYMENT` | 收款 | + |
        | `REFUND` | 退款（退款全额） | − |
        | `REFUND_REVERSAL` | 退款受理后失败，冲回原退款 | + |
        | `RESERVE_DRAWDOWN` | 某笔退款里由退款准备金出的那一段，与该退款的 `REFUND` 行 `refundId` 相同 | + |
        | `TOP_UP` | 准备金充值 | − |
        | `AUTO_REPLENISH` | 准备金自动补足 | − |
        | `WITHDRAW` | 准备金取回 | + |
        | `PENALTY` | 平台调账·扣款 | − |
        | `COMPENSATION` | 平台调账·补偿 | + |
        | `PROMOTION_WITHDRAWAL` | 营销账户取现 | + |
        | `PAYOUT_RETURN` | 之前的出款被银行退回 | + |
      enum:
        - PAYMENT
        - REFUND
        - REFUND_REVERSAL
        - RESERVE_DRAWDOWN
        - TOP_UP
        - AUTO_REPLENISH
        - WITHDRAW
        - PENALTY
        - COMPENSATION
        - PROMOTION_WITHDRAWAL
        - PAYOUT_RETURN
    SettlementDetail:
      type: object
      description: 结算单里的一笔明细。金额都不带符号，正负看 `type`。
      required:
        - type
        - amount
        - netAmount
        - occurredAt
      properties:
        type:
          $ref: '#/components/schemas/SettlementDetailType'
        orderId:
          type: string
          description: 平台订单号。`PAYMENT` / `REFUND` / `REFUND_REVERSAL` / `RESERVE_DRAWDOWN` 行必返，其余类型不返回本键。
        refundId:
          type: string
          description: 平台退款号。`REFUND` / `REFUND_REVERSAL` / `RESERVE_DRAWDOWN` 行必返，其余类型不返回本键。
        paymentMethodFamily:
          description: 支付方式（品牌）。`PAYMENT` / `REFUND` / `REFUND_REVERSAL` 行必返，其余类型不返回本键。
          allOf:
            - $ref: '#/components/schemas/PaymentMethodFamily'
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 这笔资金移动的金额：收款是成交金额，退款是退款全额。
        fee:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 手续费：`PAYMENT` 与 `REFUND_REVERSAL` 行是商户付的，`REFUND` 行是退还商户的。其余类型不返回本键。
        netAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 这一行计入出款额的数，正负同 `type`。手续费在结算时扣的商户，带手续费的行是 `amount` 减 `fee`；手续费按月另收的商户，等于 `amount`。
        occurredAt:
          $ref: '#/components/schemas/Timestamp'
        note:
          type: string
          description: 备注：收款与退款行是订单或退款的备注，调账行是调账原因。没有时不返回本键。
    SettlementDetailList:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/SettlementDetail'
    Statement:
      type: object
      required:
        - statementId
        - statementNo
        - month
        - issuedAt
        - transactionCount
        - netSales
        - refundAmount
        - fee
        - netSettlement
      description: |
        一张月对账单：这个月的交易累加出来的发生额。金额都是商户的结算币种。

        按交易发生的月份归集，不看这些交易是哪一天结算的，所以 `netSettlement` 不等于这个月各张结算单出款额之和。
      properties:
        statementId:
          type: string
          minLength: 1
        statementNo:
          type: string
          minLength: 1
          description: 对账单号，出具时生成，不变。
        month:
          type: string
          pattern: ^[0-9]{4}-(0[1-9]|1[0-2])$
          description: 交易月，`YYYY-MM`。一个月至多一张。
          examples:
            - 2026-04
        issuedAt:
          $ref: '#/components/schemas/Timestamp'
        transactionCount:
          type: integer
          minimum: 0
          description: 成交笔数，只数收款，不数退款。
        netSales:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 销售净额 = 收款额 − 退款额，扣手续费前。只有退款的月份为负。
        refundAmount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 退款额。收款额 = `netSales` + `refundAmount`。
        fee:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 手续费净额 = 收取的 − 退款退回的。退回多于收取的月份为负。
        netSettlement:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 应结净额 = `netSales` − 随结算扣的手续费。手续费按月另收的那部分不减，计入详情的 `receivableAmount`。
    StatementService:
      type: string
      description: |
        对账单明细行的服务，与 Service 页的分法一致：

        - `in_store` 线下收款：终端、商户 App、开放 API、店铺码等入口收的，支付方式是线下的。
        - `online` 线上收款：同上各入口收的，支付方式是线上的。
        - `shopify` Shopify 插件收的。
        - `allvalue` AllValue 插件收的。
        - `allvalue_xhs` AllValue 小红书单，费率与 AllValue 的不同。
      enum:
        - in_store
        - online
        - shopify
        - allvalue
        - allvalue_xhs
    StatementFeeLine:
      type: object
      required:
        - service
        - rate
        - transactionCount
        - netSales
        - refundAmount
        - fee
      description: |
        手续费明细行：一行是一个服务 × 费率在这个月的合计，各行之和等于对账单上的合计。

        - 一个服务下各支付方式费率相同：合成一行，不带 `paymentMethods`。
        - 一个服务下有多个费率：一个费率一行，每行带 `paymentMethods` 说明是哪几个支付方式。同一支付方式月中调过费率的，会出现在两行里。

        退款算在原订单所在的那一行，所以上月收款、本月退款的，会出现只有退款、`netSales` 为负的行。

        信用卡交易由收单机构直接结给商户、平台不收手续费，不在对账单里。
      properties:
        service:
          $ref: '#/components/schemas/StatementService'
        paymentMethods:
          type: array
          minItems: 1
          description: 这一行包含的支付方式（目录码，与 Service 页同一个字段）。该服务在这张对账单里只有一行时不返回本键。
          items:
            $ref: '#/components/schemas/PaymentMethodCode'
        rate:
          allOf:
            - $ref: '#/components/schemas/FeeRate'
          description: 这一行适用的费率，与 Service 页该服务下支付方式的费率同一个形状。`fee` 不一定等于按费率算出来的数：还有退款退回的手续费。
        transactionCount:
          type: integer
          minimum: 0
        netSales:
          $ref: '#/components/schemas/Money'
        refundAmount:
          $ref: '#/components/schemas/Money'
        fee:
          $ref: '#/components/schemas/Money'
    StatementChargeType:
      type: string
      description: 额外收费的类型：`APP_SUBSCRIPTION` 终端 APP 订阅费。
      enum:
        - APP_SUBSCRIPTION
    StatementCharge:
      type: object
      required:
        - type
        - quantity
        - amount
      description: 本次出具收取的一类额外费用的合计。
      properties:
        type:
          $ref: '#/components/schemas/StatementChargeType'
        quantity:
          type: integer
          minimum: 1
          description: 计费数量；`APP_SUBSCRIPTION` 是设备月数。
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 收费额，不含税。
    StatementTax:
      type: object
      required:
        - taxedComponent
        - taxType
        - taxRate
        - taxableAmount
        - amount
      description: 一个税种的税额。
      properties:
        taxedComponent:
          type: string
          description: 对什么计的税：`APP_SUBSCRIPTION` 终端 APP 订阅费；`FEE` 手续费。
          enum:
            - APP_SUBSCRIPTION
            - FEE
        taxType:
          type: string
          enum:
            - GST
            - HST
            - PST
            - QST
            - RST
        taxRate:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
          description: 出具时的税率，小数（`0.05` = 5%）。
          examples:
            - '0.05'
        taxableAmount:
          $ref: '#/components/schemas/Money'
        amount:
          $ref: '#/components/schemas/Money'
    StatementDetail:
      allOf:
        - $ref: '#/components/schemas/Statement'
        - type: object
          required:
            - feeLines
          properties:
            feeLines:
              type: array
              description: 手续费明细行。这个月没有交易、只有额外收费时为空数组。
              items:
                $ref: '#/components/schemas/StatementFeeLine'
            charges:
              type: array
              description: 额外收费，一类一行。没有时不返回本键。
              minItems: 1
              items:
                $ref: '#/components/schemas/StatementCharge'
            taxes:
              type: array
              description: 税，一个税种一行。没有时不返回本键。
              minItems: 1
              items:
                $ref: '#/components/schemas/StatementTax'
            receivableAmount:
              allOf:
                - $ref: '#/components/schemas/Money'
              description: 本单应收 = 按月另收的手续费 + 额外收费 + 税，是商户要另外付给平台的钱。为负表示退回的手续费多于新收的，记给商户。为 0 时不返回本键。
    ReserveOperationStatus:
      type: string
      description: 准备金划转的结果：`POSTED` 已划转；`REJECTED` 余额不够，没有划转。
      enum:
        - POSTED
        - REJECTED
    ReserveRejectionReason:
      type: string
      description: 划转被拒的原因：`INSUFFICIENT_BALANCE` 充值时待结算金额（`toSettle`）不够，或取回时准备金不够。
      enum:
        - INSUFFICIENT_BALANCE
    RefundReserveFundingRequest:
      type: object
      additionalProperties: false
      description: 准备金充值请求。`topUpAmount` 与 `minimumAmount` 至少给一项，都不给 → `400`。金额的币种须是商户的结算币种。
      required:
        - otp
      properties:
        topUpAmount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 充值金额，从待结算金额（`toSettle`）划到准备金。不传就是这次不充值。
        minimumAmount:
          description: 自动补足的最低金额。传金额 = 开启或改成该金额，不得低于平台规定的下限；传 `null` = 关闭自动补足；不传 = 不改。
          oneOf:
            - $ref: '#/components/schemas/PositiveMoney'
            - type: 'null'
        otp:
          $ref: '#/components/schemas/OtpProof'
    ReserveTopUpResult:
      type: object
      description: 这次充值的结果。
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/ReserveOperationStatus'
        rejectionReason:
          description: '`status = REJECTED` 时必返，其余不返回本键。'
          allOf:
            - $ref: '#/components/schemas/ReserveRejectionReason'
    RefundReserveFundingResult:
      type: object
      required:
        - balance
      properties:
        topUp:
          description: 请求里给了 `topUpAmount` 才返回本键。
          allOf:
            - $ref: '#/components/schemas/ReserveTopUpResult'
        balance:
          description: 处理之后的余额与自动补足设置。
          allOf:
            - $ref: '#/components/schemas/Balance'
    RefundReserveWithdrawalRequest:
      type: object
      additionalProperties: false
      description: 准备金取回请求。
      required:
        - amount
      properties:
        amount:
          allOf:
            - $ref: '#/components/schemas/PositiveMoney'
          description: 取回金额，币种须是商户的结算币种，不超过准备金余额。
    RefundReserveWithdrawalResult:
      type: object
      required:
        - status
        - balance
      properties:
        status:
          $ref: '#/components/schemas/ReserveOperationStatus'
        rejectionReason:
          description: '`status = REJECTED` 时必返，其余不返回本键。'
          allOf:
            - $ref: '#/components/schemas/ReserveRejectionReason'
        balance:
          description: 处理之后的余额与自动补足设置。
          allOf:
            - $ref: '#/components/schemas/Balance'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              type: string
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              type: string
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
    PositiveMoney:
      description: 正额金额（amount = 最小币种单位正非零整数字符串、currency 同 Money）；schema 化收口「> 0」。用于「划多少」类输入（资金划转额 / 阈值 / 退款额等），金额方向由具体业务操作表达、不用正负号表示；区别于 Money（可正可负，用于余额 / 分录 / 结算净额 / 回冲等账面值）。
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amount:
              type: string
              pattern: ^[1-9][0-9]*$
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    OtpChallenge:
      type: object
      additionalProperties: false
      description: 一次性验证码挑战句柄 = `OtpDelivery` 的三件事 + 本挑战自己的 id（供后续校验步骤引用）。 用于**挑战自带 id** 的入口；若 id 已由所在流程的资源提供（如 change-request），那里直接用 `OtpDelivery`、不重复给 id。 **各入口的绑定语义与失效细则不同**（是否绑操作摘要 / 发起会话、幂等重投是否受时限约束等），见各自端点说明。
      required:
        - challengeId
        - deliveredTo
        - cooldownSeconds
        - expiresAt
      properties:
        challengeId:
          type: string
          readOnly: true
          description: 挑战实例 id，串起后续校验步骤。
        deliveredTo:
          type: string
          readOnly: true
          description: 脱敏投递目标（如 `o***@e***.com`）——供 FE 提示「码发到哪里」。
        cooldownSeconds:
          type: integer
          readOnly: true
          minimum: 0
          description: 重发冷却秒数（部署可配）。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 该码的失效时间（部署可配）。
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
    OtpProof:
      type: object
      required:
        - challengeId
        - code
      additionalProperties: false
      description: 验证码凭证：发码那一步拿到的 `challengeId` 加收到的 6 位码。发码与提交分成两个接口、码随业务内容一起提交的入口都用它，键名都是 `otp`。
      properties:
        challengeId:
          type: string
          minLength: 1
        code:
          $ref: '#/components/schemas/OtpCode'
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
    PaymentMethodFamily:
      type: string
      description: 支付方式族（品牌）。
      enum:
        - wechat
        - alipay
        - unionpay
        - credit_card
    PaymentMethodCode:
      type: string
      minLength: 1
      description: 支付方式目录码（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，前端从候选集取来原样回传。
      examples:
        - wechat_instore
    FeeRate:
      type: object
      additionalProperties: false
      description: 比例费率与固定单笔费两项合起来是一个费率，比较两个费率是否相同要两项都比。
      required:
        - percentageRate
        - fixedFee
      properties:
        percentageRate:
          type: string
          pattern: ^[0-9]+(\.[0-9]{1,6})?$
          description: 比例费率，小数（`0.015` = 1.5%）。
          examples:
            - '0.015'
        fixedFee:
          type: string
          pattern: ^[0-9]+$
          description: 固定单笔费，结算币种的最小单位整数串（`10` = 0.10）；没有固定费或在免收期内为 `0`。不带币种，按该商户的结算币种解释（收费币种与结算币种一致、不跨币种换算）。
          examples:
            - '10'
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    XlsxFile:
      description: Excel 文件（xlsx）
      headers:
        Content-Disposition:
          required: true
          description: '`attachment; filename=...xlsx`（下载；filename 编码 RFC 5987）。'
          schema:
            type: string
        Content-Language:
          required: true
          description: 文件实际用的语言（BCP-47）。
          schema:
            type: string
      content:
        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
          schema:
            type: string
            format: binary
