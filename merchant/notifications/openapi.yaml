openapi: 3.1.0
info:
  title: 商户后台 通知设置 — 前端契约面
  version: 2.0.3
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的通知设置契约：发给商户的通知走哪些通道（邮件、微信两个开关）、发到哪些邮箱与微信。站内信在系统契约。

    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 当前商户以会话为准、不看请求体；当前商户不可访问时返回 `409`·`208022`。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: notifications
    x-displayName: 通知设置
    description: 通知设置：两个通道的开关、附加邮箱（验证码确认后加入）、微信接收方（扫码绑定）。
paths:
  /notifications:
    get:
      tags:
        - notifications
      operationId: getNotificationSettings
      x-required-privilege: settings:notification:view
      summary: 读通知设置（两个通道开关、主邮箱、附加邮箱、微信接收方）
      description: 当前商户的通知设置。站内信没有开关，不在这里。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationSettings'
              example:
                emailEnabled: true
                wechatEnabled: true
                primaryEmail: owner@example.com
                emails:
                  - recipientId: nr_9f2a1c
                    email: finance@example.com
                wechats:
                  - recipientId: nr_3d8e2f
                    nickname: 老板娘
                    boundAt: '2026-07-02T08:30:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    put:
      tags:
        - notifications
      operationId: updateNotificationSettings
      x-required-privilege: settings:notification:edit
      summary: 改通道开关
      description: 改邮件、微信两个通道的开关，只提交要改的。关掉一个通道只是不再往它发，接收方保留。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                emailEnabled:
                  type: boolean
                wechatEnabled:
                  type: boolean
            example:
              wechatEnabled: false
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /notifications/recipients/{recipientId}:
    delete:
      tags:
        - notifications
      operationId: deleteNotificationRecipient
      x-required-privilege: settings:notification:edit
      summary: 移除一个附加邮箱或微信接收方
      description: 移除后不再往它发通知。主邮箱不是接收方行，移除不了。已被移除或不存在 → `404`。
      parameters:
        - name: recipientId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/RecipientId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已移除
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /notifications/emails/otp-challenges:
    post:
      tags:
        - notifications
      operationId: requestNotificationEmailOtp
      x-required-privilege: settings:notification:edit
      summary: 加邮箱第 1 步：发验证码到要加的邮箱
      description: |
        发 6 位码到要加的邮箱，返回 `challengeId`；码在第 2 步提交。

        - 邮箱就是主邮箱，或已在附加邮箱里（不分大小写）→ `409`·208012，不发码。
        - 重新发码会让同一邮箱的旧码作废，冷却中 → `429`·208013。按挑战流程语义不挂幂等键。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSubmission'
            example:
              email: finance@example.com
      responses:
        '202':
          description: 已受理，验证码邮件随后发出（`deliveredTo` 为脱敏后的那个邮箱）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OtpChallenge'
              example:
                challengeId: chl_5b1c9e
                deliveredTo: f***@e***.com
                cooldownSeconds: 60
                expiresAt: '2026-07-22T10:05:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208012
        - 208013
  /notifications/emails:
    post:
      tags:
        - notifications
      operationId: addNotificationEmail
      x-required-privilege: settings:notification:edit
      summary: 加邮箱第 2 步：带验证码提交
      description: |
        带第 1 步的 `challengeId` 与验证码，通过后把那个邮箱加进附加邮箱。加的是第 1 步填的邮箱，这里不再传。

        验证码：

        - 不对 → `400`·204010，剩余次数在 `context.attemptsRemaining`；
        - 已过期 → `410`·206006；
        - 错太多次被锁 → `423`·206007。

        通过时这个邮箱已是主邮箱或已在附加邮箱里 → `409`·208012。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - otp
              properties:
                otp:
                  $ref: '#/components/schemas/OtpProof'
            example:
              otp:
                challengeId: chl_5b1c9e
                code: '493028'
      responses:
        '201':
          description: 已加入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationEmail'
              example:
                recipientId: nr_9f2a1c
                email: finance@example.com
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204010
        - 206006
        - 206007
        - 208012
  /notifications/wechat:
    post:
      tags:
        - notifications
      operationId: initiateNotificationWechatBinding
      x-required-privilege: settings:notification:edit
      summary: 绑微信：发起（返回二维码）
      description: 发起绑定一个接收通知的微信，返回二维码；用那个微信扫码并在微信里确认，页面用 `pollNotificationWechatBinding` 轮询结果。同一个微信重复绑定不会多出一行。
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 绑定二维码（用 `qrTicket` 轮询）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatQrChallenge'
              example:
                qrTicket: wxn_7c4e1a9d20b3
                qrContent: https://wechat.example.com/identity/wechat/v1/wechat/challenges/Nx4Rb9Tq2wHs6Ue1Ka7Pjv
                expiresAt: '2026-07-22T10:10:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /notifications/wechat/{qrTicket}:
    get:
      tags:
        - notifications
      operationId: pollNotificationWechatBinding
      x-required-privilege: settings:notification:edit
      summary: 绑微信：轮询结果
      description: 轮询用户是否已在微信里确认，恒返回 `200` + 状态。`BOUND` = 用户已确认，确认即绑定成立；接收方随后由后台加入列表，页面关了也会加入，刷新列表即可看到。未扫、未确认、在微信里取消，都是 `WAITING` 直到二维码过期（`EXPIRED`）。
      parameters:
        - name: qrTicket
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 轮询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatBindingPollResult'
              example:
                status: WAITING
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在当前商户不可访问时返回 `409`·`208022`（见公共约定「当前商户」）。
  schemas:
    RecipientId:
      type: string
      minLength: 1
      maxLength: 32
      description: 通知接收人标识。
    NotificationSettings:
      type: object
      additionalProperties: false
      required:
        - emailEnabled
        - wechatEnabled
        - primaryEmail
        - emails
        - wechats
      properties:
        emailEnabled:
          type: boolean
          description: 邮件通道开关。没设过时是开。
        wechatEnabled:
          type: boolean
          description: 微信通道开关。没设过时是开。
        primaryEmail:
          type: string
          format: email
          readOnly: true
          description: 主邮箱 = Owner 的登录邮箱，恒收邮件通知，这里不能改；Owner 改了登录邮箱它跟着变。
        emails:
          type: array
          description: 附加邮箱，都是验证过的。
          items:
            $ref: '#/components/schemas/NotificationEmail'
        wechats:
          type: array
          description: 接收通知的微信：在本页扫码绑定的，以及在商户 App 上给成员绑定的登录微信（App 上解绑时同步移除）；在商户后台给成员绑定登录微信不会加进来。
          items:
            $ref: '#/components/schemas/NotificationWechat'
    NotificationEmail:
      type: object
      additionalProperties: false
      required:
        - recipientId
        - email
      properties:
        recipientId:
          $ref: '#/components/schemas/RecipientId'
        email:
          type: string
          format: email
    NotificationWechat:
      type: object
      additionalProperties: false
      required:
        - recipientId
        - nickname
        - boundAt
      properties:
        recipientId:
          $ref: '#/components/schemas/RecipientId'
        nickname:
          type: string
          minLength: 1
          description: 微信昵称；用户授权微信资料后会更新。
        boundAt:
          $ref: '#/components/schemas/Timestamp'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    EmailSubmission:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ChallengeId:
      type: string
      minLength: 1
      maxLength: 32
      description: 一次性验证挑战的标识。
    OtpChallenge:
      type: object
      additionalProperties: false
      description: 一次性验证码挑战句柄 = `OtpDelivery` 的三件事 + 本挑战自己的 id（供后续校验步骤引用）。 用于**挑战自带 id** 的入口；若 id 已由所在流程的资源提供（如 change-request），那里直接用 `OtpDelivery`、不重复给 id。 **各入口的绑定语义与失效细则不同**（是否绑操作摘要 / 发起会话、幂等重投是否受时限约束等），见各自端点说明。
      required:
        - challengeId
        - deliveredTo
        - cooldownSeconds
        - expiresAt
      properties:
        challengeId:
          $ref: '#/components/schemas/ChallengeId'
          readOnly: true
          description: 挑战实例 id，串起后续校验步骤。
        deliveredTo:
          type: string
          readOnly: true
          description: 脱敏投递目标（如 `o***@e***.com`）——供客户端提示「码发到哪里」。
        cooldownSeconds:
          type: integer
          readOnly: true
          minimum: 0
          description: 重发冷却秒数（部署可配）。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 该码的失效时间（部署可配）。
    OtpCode:
      type: string
      pattern: ^[0-9]{6}$
      description: |
        **一次性验证码**:恒为 **6 位纯数字**,长度固定、不随部署变化 —— 客户端可据此做输入框长度限制与"填满即可提交"的交互。

        **邮箱验证码与 authenticator 动态码同形状**,故接受二者之一的字段共用本类型;具体某个端点收哪一种,看该端点自己的说明。

        本形状只约束**码本身**;有效期、重发冷却、错误尝试上限是各端点自己的业务参数(取值随部署),由对应端点的响应与错误上下文告知,不在这里表达。
    OtpProof:
      type: object
      required:
        - challengeId
        - code
      additionalProperties: false
      description: 验证码凭证：发码那一步拿到的 `challengeId` 加收到的 6 位码。发码与提交分成两个接口、码随业务内容一起提交的入口都用它，键名都是 `otp`。
      properties:
        challengeId:
          $ref: '#/components/schemas/ChallengeId'
        code:
          $ref: '#/components/schemas/OtpCode'
    WechatQrContent:
      type: string
      description: |
        微信二维码的**待编码内容**（短时、不透明串）——前端据此**自行渲染二维码图片**。 **不是图片 URL**，不要当 `<img src>` 用；内容对前端不透明，不要解析、拼接或复用。 各扫码入口（扫码登录与各类扫码绑定）共用同一形状与渲染方式。
    WechatQrChallenge:
      type: object
      additionalProperties: false
      description: |
        微信扫码类入口「发起」的统一响应：客户端用 `qrContent` 渲染二维码，再拿 `qrTicket` 轮询该入口的结果端点。

        各入口的轮询状态用同一套词，见 `WechatPollStatus`。
      required:
        - qrTicket
        - qrContent
        - expiresAt
      properties:
        qrTicket:
          type: string
          description: 本次扫码的短时票据，只用于轮询结果，可重复轮询；过期后重新发起得到新票据。与 `qrContent` 不可互推
        qrContent:
          $ref: '#/components/schemas/WechatQrContent'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            二维码有效期截止。**到期只表示这张二维码不能再扫**，**不必然**表示本次交互已有定论—— 到期后结果是否还可能变化，**各入口不同、由各入口的轮询状态说明，不由本字段推断**。
    WechatPollStatus:
      type: string
      description: |
        微信扫码轮询（扫码登录与各类扫码绑定）共用的状态词：`WAITING` 继续轮询、`EXPIRED` 终态需重新发起、各入口一个成功态（登录 `ESTABLISHED` / 绑定 `BOUND`）。各入口实际取值见各自 `enum`。

        未列出的取值按仍在进行中处理，继续轮询。

        状态查询恒返回 `200` + 状态：票据不存在 / 非法 / 已过期一律归为 `EXPIRED`，不用 `4xx` 表达；
        `4xx` 只表示调用方自身问题（未登录 / 无权限 / 请求过频 / 会话上下文已变 / 本浏览器已登录（登录轮询））。
    WechatBindingPollResult:
      type: object
      description: 微信扫码绑定类入口轮询的统一响应。
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/WechatPollStatus'
          enum:
            - WAITING
            - BOUND
            - EXPIRED
          readOnly: true
          description: '`WAITING` = 继续轮询；`BOUND` = 用户已在微信内确认、绑定已生效（绑定生效后在哪里呈现见各入口）；`EXPIRED` 是终态，需重新发起（含二维码过期、票据非法）。未知值按 `WAITING` 继续轮询。'
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
