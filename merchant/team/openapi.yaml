openapi: 3.1.0
info:
  title: 商户后台 团队成员 — 前端契约面
  version: 2.1.4
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的团队成员契约：当前商户的成员（列表与角色计数、新增 / 编辑 / 删除、邮箱邀请与重发、微信绑定）与可分配的角色。员工从邮件链接进来的设密、确认新邮箱两个落地页在认证契约。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 建成员、改成员挂 `Idempotency-Key`，同一次提交的网络重试用同键返回首次结果；天然幂等的纯 DELETE 不挂；重发邀请与微信绑定按流程语义不挂。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。
    - 当前商户以会话为准；当前商户不可访问时返回 `409`·`208022`。
    - 路径里的 `operatorId` 不存在或不属于当前商户，一律返回 `403`，不区分 `404`。
    - **多角色**：一个员工可以持多个角色，有效权限点取所持各角色权限点的并集；可见分区的可选项随之取各角色模块的并集。
    - **角色的权限边界**：逐个角色判，每个角色的权限点集合都必须是操作者在当前商户有效权限点集合的子集（可以相同），Owner 角色恒不可分配。例如只持 Developer 角色的操作者分配不了 Employee：Employee 含商品链接、设备等收款产品分区的权限点，Developer 没有。这条边界用在三处，都由服务端校验：新建成员给的每个角色、编辑成员改成的每个角色、以及被编辑或删除成员**现有**的每个角色（不能对权限比自己宽的成员重设密码、改登录名、改角色、删除、绑定或解绑微信、重发邀请）。`listAssignableRoles` 按同一规则返回候选，不满足时 `403`·`206013`。Owner 对所有可分配角色都满足。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: members
    x-displayName: 成员
    description: 成员：列表与角色计数、新增 / 编辑 / 删除、重发邀请、微信绑定。
  - name: roles
    x-displayName: 角色
    description: 可分配给成员的角色。
paths:
  /team/members/counts:
    get:
      tags:
        - members
      operationId: getTeamMemberCounts
      x-required-privilege: account:team:view
      summary: 成员列表角色快捷筛选的各项与计数
      description: |
        成员列表顶部角色快捷筛选的各项与计数（各项用法同 `QuickFilterCounts`，但本端点另给 `total`、各项可重叠）。`value` 原样回传给 `listTeamMembers` 的 `roleId`；本端点**不接受** `roleId`，其余筛选（按显示名 / 邮箱搜索）与列表一致。

        项集不按操作者的权限边界收窄（与 `listAssignableRoles` 不同）：在册成员持有的每个角色各一项（含已停用的角色），另加当期无成员的可分配角色（`count` 为 `0`）以及 Owner（Owner 不在 `listAssignableRoles` 里，但成员列表有这一行）。`label` 是角色名，随管理后台维护的角色配置走。

        成员可持多个角色，各项计数可重叠，All 取 `total`。
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: 按显示名 / 邮箱
      responses:
        '200':
          description: 各项与计数，另带成员总数
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                  - total
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/QuickFilterItem'
                  total:
                    type: integer
                    format: int64
                    minimum: 0
                    description: 成员总数，即 All 的数字；随 `keyword` 变，与选中哪个角色无关
              example:
                items:
                  - value: role_owner
                    label: Owner
                    count: 1
                  - value: role_admin
                    label: Admin
                    count: 2
                  - value: role_finance
                    label: Finance
                    count: 1
                  - value: role_staff
                    label: Operator
                    count: 5
                total: 8
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /team/members:
    get:
      tags:
        - members
      operationId: listTeamMembers
      x-required-privilege: account:team:view
      summary: 团队成员列表（搜索/筛选/排序/分页）
      description: |
        本商户团队成员列表，支持搜索 / 筛选 / 排序 / 分页；Owner 行置顶。
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
          description: 按显示名 / 邮箱
        - name: roleId
          in: query
          schema:
            $ref: '#/components/schemas/RoleId'
          description: 按角色筛选：只列持有该角色的成员（可同时持有别的角色）；取值 = `listAssignableRoles` 的 `roleId`（Owner 行的角色标识不在该候选集内，可从成员列表自身取）
        - name: sortField
          in: query
          description: 排序字段。不传 = 不排序；页面默认顺序（最新创建在前）由前端显式传 `createdAt` + `descend`。按 `lastLoginAt` 排序时从未登录的成员恒在末尾、升降序都一样。Owner 行始终置顶、不参与排序。
          schema:
            type: string
            enum:
              - createdAt
              - displayName
              - lastLoginAt
        - $ref: '#/components/parameters/SortOrder'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - total
                  - data
                properties:
                  total:
                    type: integer
                    format: int64
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMember'
              example:
                total: 3
                data:
                  - operatorId: op_7a1c9
                    displayName: Jane Merchant
                    loginId: jane@example.com
                    roleIds:
                      - role_owner
                    roleNames:
                      - Owner
                    status: ACTIVE
                    isOwner: true
                    wechat:
                      nickname: Jane
                    lastLoginAt: '2026-06-22T14:05:00Z'
                    createdAt: '2026-01-10T09:00:00Z'
                  - operatorId: op_3b8f2
                    displayName: Sam Clerk
                    loginId: sam@example.com
                    roleIds:
                      - role_staff
                      - role_finance
                    roleNames:
                      - Operator
                      - Finance
                    status: ACTIVE
                    isOwner: false
                    lastLoginAt: '2026-06-20T11:30:00Z'
                    createdAt: '2026-03-02T16:20:00Z'
                  - operatorId: op_5d4e1
                    displayName: Pat Pending
                    loginId: pat@example.com
                    roleIds:
                      - role_staff
                    roleNames:
                      - Operator
                    status: INVITED
                    isOwner: false
                    createdAt: '2026-06-21T08:15:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - members
      operationId: createTeamMember
      x-required-privilege: account:team:manage
      summary: 新建员工（邮箱 → 邀请中、发邀请链接 / 用户名 → 设初始密码、直接可用）
      description: |
        按登录名形态分两支：是合法邮箱格式的为邮箱，不带密码，建邀请中（`INVITED`）的成员并发邀请设密链接；其余为用户名，由建号的人设初始密码，直接建可用（`ACTIVE`）的成员。员工归属当前商户（在主商户建的能切换到名下的关联商户，在关联商户建的只在本商户）。角色可以给一个或多个，不可选 Owner 角色。

        登录名属于已删除的账号时（不论原属哪个商户），按新建处理并沿用原账号（历史记录接续）：旧密码、MFA、微信绑定都作废，角色以本次提交的为准；邮箱登录名回到邀请中、重发邀请，用户名登录名用本次给的初始密码。原账号若被运营停用，仍保持停用（返回 `DISABLED`），只能由运营解除。

        幂等基准：`Idempotency-Key`。同键同请求体重发返回首次结果；同键改请求体返回 `409`·`908003`。

        错误码：

        - `968001` 登录名已被其他账号使用（含其他商户的账号）。
        - `206013` 要给的角色里有超出操作者权限边界的（含沿用已删除账号时本次提交的角色）。
        - `904001` `roleIds` 里有本商户角色目录里没有的 `roleId`，或用户名形态的 `loginId` 不满足形状（去首尾空白后 1–64 个字符、不含空白与 `@`）；`details` 指对应字段。
        - `908003` 同一幂等键被用于不同的请求体。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTeamMemberRequest'
            example:
              loginId: sam@example.com
              displayName: Sam Clerk
              roleIds:
                - role_staff
      responses:
        '201':
          description: 已创建（邮箱格式 = INVITED 待设密;用户名格式 = ACTIVE;恢复的是被运营停用的账号时 = DISABLED）
          content:
            application/json:
              schema:
                type: object
                required:
                  - operatorId
                  - status
                properties:
                  operatorId:
                    $ref: '#/components/schemas/UserId'
                  status:
                    type: string
                    enum:
                      - INVITED
                      - ACTIVE
                      - DISABLED
              example:
                operatorId: op_3b8f2
                status: INVITED
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206013
        - 968001
  /team/members/{operatorId}:
    put:
      tags:
        - members
      operationId: updateTeamMember
      x-required-privilege: account:team:manage
      summary: 编辑员工（昵称 / 角色 / 可见分区 / 登录名 / 重设密码，一次提交同步生效）
      description: |
        只提交要改的字段，全部同步生效，要么全成功、要么全失败。各字段的副作用：

        - `newPassword`：重设该员工密码，其全部会话失效，并给该员工登录邮箱发密码已修改通知（用户名账号不发）；尚未设密的员工（邀请中，含停用前未设密的）不能在这里设密。
        - `loginId` 为用户名：直接生效。
        - `loginId` 为邮箱：已激活员工不直接生效，向新邮箱发确认链接，员工在落地页确认（`confirmMemberLoginEmail`）后才切换，确认前旧邮箱仍有效、新邮箱不占用；同一员工的登录邮箱同时只有一笔改动在途（含员工自己在 My Profile 发起的），再改会顶掉上一笔。邀请中的员工改邮箱 = 向新邮箱重发邀请。
        - `roleIds`：该员工在本商户的角色整组换成所给的这组，权限按新角色的并集判定，最多晚一个会话复核间隔生效。

        Owner 行只能改昵称；Owner 的密码与登录邮箱由 Owner 本人在 My Profile 改。改自己这一行时不能改自己的角色。

        幂等基准：`Idempotency-Key`。同键同请求体重发返回首次结果；同键改请求体返回 `409`·`908003`。

        错误码：

        - `968001` 新登录名已被其他账号使用。
        - `206013` 改成的角色、或该成员现有的角色里有超出操作者权限边界的。
        - `904001` `roleIds` 里有本商户角色目录里没有的 `roleId`，或用户名形态的 `loginId` 不满足形状（去首尾空白后 1–64 个字符、不含空白与 `@`）；`details` 指对应字段。
        - `208003` 给尚未设密的员工（邀请中，含停用前未设密的）填了新密码。
        - `908003` 同一幂等键被用于不同的请求体。
        - `906003` 对 Owner 行改昵称以外的字段，或改自己这一行的角色。
      parameters:
        - name: operatorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTeamMemberRequest'
            example:
              displayName: Sam Clerk
              roleIds:
                - role_staff
                - role_finance
      responses:
        '204':
          description: 已更新（改已激活员工的登录邮箱时为已受理：确认链接随后发到新邮箱）
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206013
        - 208003
        - 968001
    delete:
      tags:
        - members
      operationId: deleteTeamMember
      x-required-privilege: account:team:manage
      summary: 删除员工（删后不在列表显示、全部会话失效；Owner 不可删）
      description: 软删除：员工从本商户移除、不能再登录，历史记录保留。之后可用同一登录名再新建（见 `createTeamMember`）。Owner 行不可删，返回 `403`；该成员的角色里有超出操作者权限边界的 → `403`·`206013`。已删除的员工再删同样回 `204`（并重做该员工终端登录的撤销）。
      parameters:
        - name: operatorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已软删
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206013
  /team/members/{operatorId}/invitation:
    post:
      tags:
        - members
      operationId: resendInvitation
      x-required-privilege: account:team:manage
      summary: 给邀请中的员工重发邀请链接（旧链接作废）
      description: |
        给邀请中的员工重发邀请链接，旧链接立即作废（员工点旧邮件会拿到 `206009`）。

        错误码：

        - `208003` 该员工已不在邀请中（如已激活），重拉列表。
        - `208013` 重发冷却未到；剩余秒数见 `context.cooldownSeconds`。
      parameters:
        - name: operatorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '202':
          description: 已受理，新邀请邮件随后发出（新链接生效、旧链接失效）;员工保持 INVITED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResendCooldown'
              example:
                cooldownSeconds: 60
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206013
        - 208003
        - 208013
  /team/members/{operatorId}/wechat:
    post:
      tags:
        - members
      operationId: initiateMemberWechatBinding
      x-required-privilege: account:team:manage
      summary: 给成员（含自己）绑微信 — 发起（返回二维码，被绑定本人扫码）
      description: |
        为该成员发起商户后台微信登录绑定，返回二维码；被绑定本人用微信扫码并确认，发起方用 `pollMemberWechatBinding` 轮询结果。

        错误码：

        - `968003` 该成员已绑定微信，须先解绑。
      parameters:
        - name: operatorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: 绑定二维码（用 `qrTicket` 轮询 `pollMemberWechatBinding`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatQrChallenge'
              example:
                qrTicket: wxb_2a7f9c1e04d63b8a52
                qrContent: https://checkout.example.com/identity/wechat/v1/wechat/challenges/Qm7Yt4sV9eN3hJ0aZx5Wgu
                expiresAt: '2026-06-22T14:10:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206013
        - 968003
    delete:
      tags:
        - members
      operationId: deleteMemberWechatBinding
      x-required-privilege: account:team:manage
      summary: 给成员解绑微信（不影响其当前会话）
      description: 只停用该成员的商户后台 WeChat 登录绑定；不影响其平台级 WeChat 账号、不影响其他登录方式。
      parameters:
        - name: operatorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已解绑
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 206013
  /team/members/{operatorId}/wechat/{qrTicket}:
    get:
      tags:
        - members
      operationId: pollMemberWechatBinding
      x-required-privilege: account:team:manage
      summary: 绑微信 — 结果轮询（对称 pollWechatLogin）
      description: |
        轮询这次绑定的结果，恒返回 `200` + 状态。未扫、未确认、扫码后被拒（如该微信已绑别的账号）、在微信里取消、确认后没能写入（成员已被删除或停用、同一微信被抢先绑定），都显示 `WAITING` 直到二维码过期；拒绝原因只在扫码本人的微信里提示。页面处理见 flows。
      parameters:
        - name: operatorId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/UserId'
        - name: qrTicket
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 轮询结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WechatBindingPollResult'
              example:
                status: WAITING
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /team/roles:
    get:
      tags:
        - roles
      operationId: listAssignableRoles
      x-required-privilege: account:team:view
      summary: 读可分配角色候选集（管理后台预定义）
      description: |
        操作者在当前商户可分配的角色（管理后台预定义、随部署而异，前端不要写死），用于新建 / 编辑员工的角色与可见分区选项。只返回权限点集合是操作者有效权限点集合子集（可相同）的角色，与写接口的校验同一规则；Owner 看到全部可分配角色。

        `roleId` 是稳定标识，写成员、按角色筛选都传它；`name` 只供展示，管理后台改名不影响已保存的数据。不含 Owner 的角色（Owner 不可分配）。管理后台已停用的角色照常在候选里（它不计任何权限点，总满足子集规则）：可以分配、成员可以继续持有，但不带来任何权限，管理后台重新启用后才生效；Owner 行的角色名见 `TeamMember.roleNames`。按角色筛选成员列表时，列表里可能有操作者分配不了的角色，候选不足就从成员列表自身取。
      responses:
        '200':
          description: 可分配角色候选集
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        - roleId
                        - name
                        - modules
                      properties:
                        roleId:
                          $ref: '#/components/schemas/RoleId'
                          description: 稳定标识（提交与筛选用）
                        name:
                          type: string
                          description: 展示名（可被管理后台改写）
                        modules:
                          type: array
                          description: 该角色覆盖的侧边栏分区（权限点串的第一段；终端收款的 `terminal` 不是侧边栏分区、不列），即选中该角色后可见分区的可选项；恒返回，无授权时为空数组。
                          items:
                            type: string
                            minLength: 1
                            examples:
                              - orders
              example:
                items:
                  - roleId: role_manager
                    name: Manager
                    modules:
                      - dashboard
                      - orders
                      - products
                  - roleId: role_staff
                    name: Operator
                    modules:
                      - dashboard
                      - orders
                  - roleId: role_finance
                    name: Finance
                    modules:
                      - dashboard
                      - account
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在当前商户不可访问时返回 `409`·`208022`（见公共约定「当前商户」）。
  schemas:
    TeamMember:
      type: object
      description: 团队成员列表行
      required:
        - operatorId
        - displayName
        - loginId
        - roleIds
        - roleNames
        - status
        - isOwner
      properties:
        operatorId:
          $ref: '#/components/schemas/UserId'
          readOnly: true
        displayName:
          type: string
        loginId:
          $ref: '#/components/schemas/LoginId'
        roleIds:
          type: array
          minItems: 1
          description: 该成员所持角色的稳定标识，一个或多个（编辑该成员时回传这组；按角色筛选用其中一个）
          items:
            $ref: '#/components/schemas/RoleId'
        roleNames:
          type: array
          minItems: 1
          readOnly: true
          description: 角色展示名，与 `roleIds` 一一对应、顺序相同（服务端已解析；Owner 行同样给出）
          items:
            type: string
            minLength: 1
        visibleModules:
          allOf:
            - $ref: '#/components/schemas/VisibleModules'
          readOnly: true
          description: 该成员当前的模块可见性偏好。**未收窄时不返回本键**（等价于空数组）；Owner 行不返回（不适用）。
        status:
          type: string
          enum:
            - INVITED
            - ACTIVE
            - DISABLED
          readOnly: true
          description: 账号态：INVITED（邮箱邀请待设密）/ ACTIVE / DISABLED（被运营在管理后台停用，商户侧无启停操作）；已删除的不出现在列表
        pendingLoginEmail:
          type: string
          format: email
          description: ACTIVE 邮箱员工被改了登录邮箱、待新邮箱确认时的 pending 新邮箱（确认前旧邮箱仍有效）;**无待确认邮箱则不返回本键**
        isOwner:
          type: boolean
        wechat:
          allOf:
            - $ref: '#/components/schemas/WechatBindingSummary'
          description: 该成员的商户后台微信登录绑定；未绑定不返回本键。不代表其平台级微信账号是否存在。昵称只用于 Owner 辨认该成员绑的是哪个微信。
        lastLoginAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 最近登录；**从未登录则不返回本键**
        createdAt:
          $ref: '#/components/schemas/Timestamp'
          readOnly: true
    CreateTeamMemberRequest:
      type: object
      additionalProperties: false
      description: |
        新建成员。**同一个请求体**，按 `loginId` 的格式决定建号方式：

        - **邮箱形式**（合法邮箱格式）= 邀请制：**不带** `password`，建 `INVITED` 成员 + 发邀请链接邮件，员工自设密码后激活；
        - **用户名形式**（其余）= 用户名制：`password` **必填**（建号的人设初始密码），直接建 `ACTIVE` 成员。

        用户名形式缺 `password`、邮箱形式带了 `password` → `400`（服务端校验）。
      required:
        - loginId
        - displayName
        - roleIds
      properties:
        loginId:
          $ref: '#/components/schemas/LoginId'
          description: 登录 ID。合法邮箱格式 = 邮箱形式（邀请制）；其余 = 用户名形式（用户名制）
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        roleIds:
          type: array
          minItems: 1
          description: 要给的角色，一个或多个；每个取自 listAssignableRoles 的 `roleId`（不可选 Owner）
          items:
            $ref: '#/components/schemas/RoleId'
        visibleModules:
          $ref: '#/components/schemas/VisibleModules'
        password:
          type: string
          format: password
          minLength: 8
          description: '**用户名形式必填、邮箱形式不带**。建号的人设置的初始密码（新版 5 规则）。下限 8 = 5 规则里的长度那条（≥ 8 字符 / 大写 / 小写 / 数字 / 特殊字符）;其余四条由前端校验并提示具体未满足项，服务端兜底拒绝'
    UpdateTeamMemberRequest:
      type: object
      description: 编辑员工（各字段效果见 updateTeamMember）。**只提交本次要改的字段**——某字段不出现即保持原值(部分更新);本请求体的字段**都不接受空串**,界面上「留空」对应的是**不传该字段**、不是传 `""`
      additionalProperties: false
      minProperties: 1
      properties:
        loginId:
          $ref: '#/components/schemas/LoginId'
          description: 改登录 ID;用户名直接生效,已激活员工改邮箱走确认链接
        displayName:
          type: string
          minLength: 1
          maxLength: 128
        roleIds:
          type: array
          minItems: 1
          description: 改角色：整组替换成所给的这组，一个或多个；每个取自 listAssignableRoles 的 `roleId`（不可选 Owner）
          items:
            $ref: '#/components/schemas/RoleId'
        visibleModules:
          allOf:
            - $ref: '#/components/schemas/VisibleModules'
          description: 改该员工的模块可见性偏好（**全量覆盖本项**：传什么就是什么，传空数组 = 取消收窄）。**不传本键即保持原值**（部分更新）。改 `roleIds` 时本项不会被服务端自动重置——界面若要按新角色重置勾选，自行在提交里带上新值。
        newPassword:
          type: string
          format: password
          minLength: 8
          description: 传值即重置该员工密码 + 失效其全部会话;**不传本字段即保持原密码**（界面上密码框留空 = 不传，**不要提交空串**）。下限 8 = 新版 5 规则的长度那条（≥ 8 字符 / 大写 / 小写 / 数字 / 特殊字符）;其余四条由前端校验并提示具体未满足项，服务端兜底拒绝。INVITED 员工不可在这里直接设密
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    QuickFilterItem:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
          description: 该项对应的筛选值 —— **对客户端不透明**:选中本项就把它**原样**回传给对应列表端点的那个筛选参数, 不要解析、拼接或据其分支。
          examples:
            - PAID
        label:
          type: string
          description: 后端给的默认展示名。**客户端有自己的多语言资源时按 `value` 取用、本字段作兜底**; 没有资源(取值由配置或数据决定,如角色名、年份)时直接展示本字段。
          examples:
            - Paid
        count:
          type: integer
          minimum: 0
          description: 该项当前的命中数(口径见 `QuickFilterCounts` 说明)。
    RoleId:
      type: string
      minLength: 1
      maxLength: 32
      description: 角色标识。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    LoginId:
      type: string
      minLength: 1
      maxLength: 254
      description: 登录名：用户名或邮箱。新建或修改登录名时：含 `@` 的按邮箱格式校验；其余是用户名，须为去首尾空白后 1–64 个字符、不含空白，比较不区分大小写、按输入的大小写保存。登录时按已保存的登录名匹配，不套这条形状规则（早期账号的用户名可能不满足它）。
    VisibleModules:
      type: array
      description: |
        **模块可见性偏好**——该用户登录后界面呈现哪些模块。元素是**模块标识**，即权限点串 `模块:资源:动作` 的**第一段**，取值 = 侧边栏的五个分区 `dashboard` / `orders` / `products` / `account` / `settings`（登记在 `privileges.yaml`；`terminal` 不是侧边栏分区、不在内）。

        **在所选角色已覆盖的模块里挑**：可选项 = `listAssignableRoles` 里所选各角色 `modules` 的并集（换角色即换一组）。**只能减不能增**——本集合应是那组的子集；**不传或空数组 = 不收窄**（该角色覆盖的模块全部呈现）。

        ⚠️ **这不是权限、不是安全边界**。它只影响界面呈现哪些模块，**不改变任何权限判定、不拦截接口**——被收窄掉的模块，其接口照常受理。真正的边界是 `privileges`；本项在它之上做纯界面收窄，Owner 不适用（恒全部可见）。
      items:
        type: string
        minLength: 1
        examples:
          - orders
    WechatBindingSummary:
      type: object
      additionalProperties: false
      description: 微信登录绑定的摘要。
      required:
        - nickname
      properties:
        nickname:
          type: string
          minLength: 1
          description: 绑定微信的昵称展示快照（绑定时写入；拿不到昵称时为通用展示名，故恒非空）。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    ResendCooldown:
      type: object
      description: 只回重发冷却秒数。
      required:
        - cooldownSeconds
      properties:
        cooldownSeconds:
          type: integer
          minimum: 0
          readOnly: true
          description: 重发冷却秒数（部署可配）；前端从收到响应起本地倒计时。
    WechatQrContent:
      type: string
      description: |
        微信二维码的**待编码内容**（短时、不透明串）——前端据此**自行渲染二维码图片**。 **不是图片 URL**，不要当 `<img src>` 用；内容对前端不透明，不要解析、拼接或复用。 各扫码入口（扫码登录与各类扫码绑定）共用同一形状与渲染方式。
    WechatQrChallenge:
      type: object
      additionalProperties: false
      description: |
        微信扫码类入口「发起」的统一响应：客户端用 `qrContent` 渲染二维码，再拿 `qrTicket` 轮询该入口的结果端点。

        各入口的轮询状态用同一套词，见 `WechatPollStatus`。
      required:
        - qrTicket
        - qrContent
        - expiresAt
      properties:
        qrTicket:
          type: string
          description: 本次扫码的短时票据，只用于轮询结果，可重复轮询；过期后重新发起得到新票据。与 `qrContent` 不可互推
        qrContent:
          $ref: '#/components/schemas/WechatQrContent'
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
          description: |
            二维码有效期截止。**到期只表示这张二维码不能再扫**，**不必然**表示本次交互已有定论—— 到期后结果是否还可能变化，**各入口不同、由各入口的轮询状态说明，不由本字段推断**。
    WechatPollStatus:
      type: string
      description: |
        微信扫码轮询（扫码登录与各类扫码绑定）共用的状态词：`WAITING` 继续轮询、`EXPIRED` 终态需重新发起、各入口一个成功态（登录 `ESTABLISHED` / 绑定 `BOUND`）。各入口实际取值见各自 `enum`。

        未列出的取值按仍在进行中处理，继续轮询。

        状态查询恒返回 `200` + 状态：票据不存在 / 非法 / 已过期一律归为 `EXPIRED`，不用 `4xx` 表达；
        `4xx` 只表示调用方自身问题（未登录 / 无权限 / 请求过频 / 会话上下文已变 / 本浏览器已登录（登录轮询））。
    WechatBindingPollResult:
      type: object
      description: 微信扫码绑定类入口轮询的统一响应。
      required:
        - status
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/WechatPollStatus'
          enum:
            - WAITING
            - BOUND
            - EXPIRED
          readOnly: true
          description: '`WAITING` = 继续轮询；`BOUND` = 用户已在微信内确认、绑定已生效（绑定生效后在哪里呈现见各入口）；`EXPIRED` 是终态，需重新发起（含二维码过期、票据非法）。未知值按 `WAITING` 继续轮询。'
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  parameters:
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
