                mixedTypes:
                  summary: 三类链接统一列表（giftcard / product / ticket），含一条已停用
                  value:
                    total: 3
                    data:
                      - linkId: pl_1000024_3001
                        type: giftcard
                        name: 节日礼卡（升级）
                        currency: CAD
                        amountSummary: CA$25.00 – CA$50.00
                        status: ACTIVE
                        createdAt: '2026-07-10T10:00:00Z'
                      - linkId: pl_1000024_3002
                        type: product
                        name: 门店周边商品
                        currency: CAD
                        amountSummary: CA$18.00+
