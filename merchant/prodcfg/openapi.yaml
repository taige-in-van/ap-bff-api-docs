openapi: 3.1.0
info:
  title: 商户后台 收单配置 — 前端契约面
  version: 1.0.0
  contact:
    name: 商户后台 BFF
  description: |
    收单配置前端契约：

    - Store QR 展示变体（二维码图形前端渲染）、
    - 收款页设置（PaymentPageSettings + TipConfiguration）、
    - 账单码（Invoice，列表 / 详情 / 创建 / 作废 / 已支付隐藏）、
    - 支付链接（PaymentLink 全部 per-link 配置〔销售内容/生命周期/Policies/Buyer Info〕、创建 / 编辑 / 启停 / 删除 / giftcard 库存只读 / Redemptions 只读 / Transactions 只读）、
    - 设备（列表 / 详情 + 绑定/解绑/启停）、
    - 设备日志、
    - 商户级订单配置（Order Expiry / Customer Service Fee）、
    - POS 小票内容。

    字段类型以本 spec 为准。

    merchant scope 从会话取、不信请求体；merchant-current-scoped 读写挂 MerchantContextGuard（stale-tab 守卫）。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: store-qr
    description: 店铺码展示变体（含各变体二维码承载原文；**二维码图形由前端渲染，无图片端点**）。
  - name: payment-page
    description: 收款页设置（PaymentPageSettings + TipConfiguration，仅静态码）。
  - name: invoices
    description: 账单码：列表 / 详情 / 创建 / 作废 / 已支付隐藏。
  - name: payment-links
    description: 支付链接（giftcard/product/ticket 全部 per-link 配置〔销售内容/生命周期/Policies/Buyer Info〕；giftcard 库存只读；Redemptions 只读；Transactions 只读）。
  - name: devices
    description: 设备：列表 / 详情 + 绑定/解绑/启停。
  - name: device-logs
    description: 设备日志（首期 3 类；支持导出）。
  - name: settings
    description: 商户级订单配置：Order Expiry / Customer Service Fee 总开关 / Checkout 入口。
  - name: receipt
    description: POS 小票内容（供收款终端打印）。
paths:
  /store-qr:
    get:
      tags:
        - store-qr
      operationId: listStoreQrVariants
      summary: 读店铺码展示变体（主 QR + 可用变体）
      description: |
        返回当前商户店铺码可展示的变体集（按已开通币种 / QR type / 通道条件显隐；UnionPay QRC 变体需 UPI 通道启用）。 **第 1 项就是服务端已选定的主变体**——通常是主结算币种的 Standard 码，该组合不可用时服务端会另选一个； 照第 1 项渲染主位即可、不要自己挑，其余按序进「More」。 展示变体随商户可受理方式集变化。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 店铺码展示变体集
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreQrVariantList'
              examples:
                withVariants:
                  summary: 有可用变体 —— 第 1 项即主变体，其余进「More」
                  value:
                    variants:
                      - variantId: cad-standard
                        currency: CAD
                        qrType: standard
                        hostedPage: true
                        qrContent: https://cashier.example.com/s/C3BM68
                        methods:
                          - methodId: instore-wechat
                            family: wechat
                            acceptanceMode: in_store
                            displayName: WeChat Pay
                          - methodId: instore-credit-card
                            family: credit_card
                            acceptanceMode: in_store
                            displayName: Credit Card
                      - variantId: cad-pre-auth
                        currency: CAD
                        qrType: pre_auth
                        hostedPage: true
                        qrContent: https://cashier.example.com/s/C3BM68?mode=pre-auth
                      - variantId: cny-unionpay-qrc
                        currency: CNY
                        qrType: unionpay_qrc
                        hostedPage: false
                        qrContent: '6236680000000000000'
                noVariants:
                  summary: 一个变体都没有 —— 空数组，不展示主位
                  value:
                    variants: []
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /payment-page:
    get:
      tags:
        - payment-page
      operationId: getPaymentPageSettings
      summary: 读收款页设置（PaymentPageSettings + TipConfiguration）
      description: 回显当前商户收款页设置（仅静态码作用域）+ merchant 级小费配置；可用支付方式候选为该商户当前可用集（后端返回、前端不写死）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 收款页设置 + 小费配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPageSettings'
              examples:
                basic:
                  summary: 候选 3 方式、启用 2
                  value:
                    logoRef: 4e7a2c18b93d40f5a06c8b1e57d29f43
                    logoUrl: https://cdn.example.com/paymentpage/4e7a2c18b93d40f5a06c8b1e57d29f43.png
                    notesEnabled: true
                    payerInputs:
                      - key: sys:name
                        label: 姓名
                        system: true
                        mandatory: false
                        type: text
                      - key: sys:phone
                        label: 手机号
                        system: true
                        mandatory: false
                        type: tel
                      - key: 门店说明
                        label: 门店说明
                        system: false
                        mandatory: false
                        type: textarea
                    description: 欢迎光临
                    availableMethods:
                      - methodId: instore-wechat
                        family: wechat
                        acceptanceMode: in_store
                        displayName: WeChat Pay
                      - methodId: instore-alipay
                        family: alipay
                        acceptanceMode: in_store
                        displayName: Alipay
                      - methodId: instore-credit_card
                        family: credit_card
                        acceptanceMode: in_store
                        displayName: Credit Card
                    selectedMethodIds:
                      - instore-wechat
                      - instore-alipay
                    tips:
                      enabled: true
                      presets:
                        - 10
                        - 15
                        - 20
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
    put:
      tags:
        - payment-page
      operationId: savePaymentPageSettings
      summary: 保存收款页设置 + 小费配置（两组共同成功 / 失败）
      description: |
        保存 PaymentPageSettings + TipConfiguration（两组同一次提交、共同成功 / 失败，不部分生效）。

        支付方式集**保存前经受理校验**（须为该商户当前可受理方式）——
        不通过 → `409 PAYMENT_METHOD_NOT_ACCEPTABLE`；空集 → `400 PAYMENT_METHOD_SELECTION_EMPTY`。

        Logo 先经 createPaymentPageLogoUploadTarget 取直传目标、由浏览器直传对象存储，再以其 `fileId` 作 `logoRef` 提交；**保存时该文件才正式归属本设置**。

        - 所引文件**确定未就位**（直传未完成 / 被存储端拒收）→ `400 FILE_NOT_IN_PLACE (204014)`，**整次保存被拒、两组都不生效**。
          该码是终态、不可原样重试——须**重新取直传目标**（得到**新** `fileId`）、重新直传，再用新引用保存；**不要向原目标补传**（直传目标是一次性的，提交失败即作废）。
        - **暂时判不出**（上游不可达 / 超时）→ `502` / `504`：**不必重传**，原样重试本请求。

        `logoUrl` 只出不入、不要提交。天然幂等 PUT（同 payload 重放一致）。

        **采集项提交的是保留下来的完整键列表**（`payerInputKeys`）——见该字段说明。
        缺必填项或自撰标题撞上系统项的键 → `409 PRODCFG_PAYMENT_PAGE_INPUTS_INVALID (208030)`，整次保存被拒。
        **本商户第一次保存本设置时**，服务端会把该收的系统项（姓名 / 手机号一类）填进配置里；
        此后系统侧新增的项**不会追加进已有配置**，这份列表就是这个商户收款页的真相。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentPageSettingsWrite'
      responses:
        '200':
          description: 已保存（返回生效后设置）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentPageSettings'
              examples:
                saved:
                  summary: 保存后回显 —— 换了 Logo（logoUrl 由服务端换出）、启用 3 种方式
                  value:
                    logoRef: 9c1d5f7a3e2b48c6b0f4a8d29e631b57
                    logoUrl: https://files.example.com/o/9c1d5f7a?exp=1755331200&sig=REDACTED&disp=inline
                    notesEnabled: true
                    payerInputs:
                      - key: sys:name
                        label: 姓名
                        system: true
                        mandatory: false
                        type: text
                      - key: sys:phone
                        label: 手机号
                        system: true
                        mandatory: false
                        type: tel
                      - key: 门店说明
                        label: 门店说明
                        system: false
                        mandatory: false
                        type: textarea
                      - key: 取餐号
                        label: 取餐号
                        system: false
                        mandatory: false
                        type: text
                    description: 欢迎光临
                    availableMethods:
                      - methodId: instore-wechat
                        family: wechat
                        acceptanceMode: in_store
                        displayName: WeChat Pay
                      - methodId: instore-alipay
                        family: alipay
                        acceptanceMode: in_store
                        displayName: Alipay
                      - methodId: instore-credit_card
                        family: credit_card
                        acceptanceMode: in_store
                        displayName: Credit Card
                    selectedMethodIds:
                      - instore-wechat
                      - instore-alipay
                      - instore-credit_card
                    tips:
                      enabled: true
                      presets:
                        - 10
                        - 15
                        - 20
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204005
        - 204014
        - 208001
        - 208007
        - 208030
  /payment-page/files/upload-targets:
    post:
      tags:
        - payment-page
      operationId: createPaymentPageLogoUploadTarget
      summary: 取得收款页 Logo 直传目标（浏览器据此直传，文件不经本接口）
      description: |
        上传分两步。

        - **第一步**调本接口，用**声明值**（用途 / 文件名 / 内容类型 / 大小）换一个直传目标；
        - **第二步**由浏览器把文件连同目标中的 `fields` 一起提交到 `action`，**文件字节不经过本接口**。

        允许的格式与大小上限见 `purpose` 的用途表；声明值不合规 → `400 FILE_DECLARATION_REJECTED (204015)` 且**不签发目标**——换一个合规的文件再申请，同一文件重试无用。

        返回的 `fileId` 即 savePaymentPageSettings 所用的 `logoRef`——该文件在保存收款页设置时才正式归属它。

        **非幂等**：每次调用产生新 fileId、重试不复用；不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadTargetRequest'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      description: 本端点固定传 `payment_page_logo`（收款页 Logo）；传其他用途 → 400。
                    contentType:
                      enum:
                        - image/png
                        - image/jpeg
            example:
              purpose: payment_page_logo
              fileName: brand.png
              contentType: image/png
              fileSize: 153600
      responses:
        '201':
          description: 已签发直传目标；其 fileId 即保存设置时引用的 logo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTarget'
              examples:
                issued:
                  summary: 已签发 —— fields 原样全部提交，文件本体以 file 为名放最后
                  value:
                    fileId: 9c1d5f7a3e2b48c6b0f4a8d29e631b57
                    action: https://files.example.com/direct-upload
                    fields:
                      key: merchant/1000024/payment-page-logo/9c1d5f7a3e2b48c6b0f4a8d29e631b57
                      Content-Type: image/png
                      policy: REDACTED-BASE64-POLICY
                      signature: REDACTED-SIGNATURE
                    expiresAt: '2026-08-17T10:30:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
        - 208001
  /products/invoices:
    get:
      tags:
        - invoices
      operationId: listInvoices
      summary: 账单列表
      description: 账单列表（分页 / 搜索 / status·日期·金额筛选 / 排序）。**金额筛选 amountMin/amountMax 按各 Invoice 标价金额数值独立比较、不跨币种换算**。页顶汇总卡另取 `getInvoiceSummary`（口径与本列表不同——汇总恒按商户全量算、不随筛选变）。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          required: false
          description: 按 Invoice ID 子串搜索
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - name: from
          in: query
          required: false
          description: 创建日期范围起（含当日）。筛的是记录上的 `createdDate`、按字面匹配。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: false
          description: 创建日期范围止（含当日）。口径同 `from`。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: amountMin
          in: query
          required: false
          description: 金额范围下限（最小币种单位整数字符串）
          schema:
            type: string
        - name: amountMax
          in: query
          required: false
          description: 金额范围上限
          schema:
            type: string
        - name: sortField
          in: query
          required: false
          description: 排序字段。不传 = 不排序；页面默认顺序（最新创建在前）由前端显式传 `createdAt` + `descend`。`amount` 按数值比较、不分币种。
          schema:
            type: string
            enum:
              - createdAt
              - amount
        - $ref: '#/components/parameters/SortOrder'
      responses:
        '200':
          description: 账单列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListPage'
              examples:
                mixedCurrency:
                  summary: 结算币种(CAD) + CNY 标价并存
                  value:
                    total: 2
                    data:
                      - invoiceId: inv_1
                        amount:
                          amount: '10500'
                          currency: CAD
                        status: UNPAID
                        dueDate: '2026-08-01'
                        createdAt: '2026-07-10T10:00:00Z'
                        createdDate: '2026-07-10'
                      - invoiceId: inv_2
                        amount:
                          amount: '20000'
                          currency: CNY
                        status: OVERDUE
                        dueDate: '2026-07-01'
                        createdAt: '2026-06-10T10:00:00Z'
                        createdDate: '2026-06-10'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
    post:
      tags:
        - invoices
      operationId: createInvoice
      summary: 创建账单
      description: |
        创建账单（Order Amount + Due Date + Currency）→ 新建账单（status=UNPAID）、返回付款链接 URL（整串，前端纯呈现）。 金额缺失 / ≤ 0 → `400 INVOICE_AMOUNT_INVALID`；Custom Due Date 缺失 / 早于次日 → `400 INVOICE_DUE_DATE_INVALID`。 幂等：带 `Idempotency-Key`，重放同键返首次结果、payload 冲突 → `409 IDEMPOTENCY_PAYLOAD_CONFLICT (208005)`。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceCreateRequest'
            examples:
              basic:
                summary: 指定金额 + 自定义到期日
                value:
                  amount:
                    amount: '10500'
                    currency: CAD
                  dueDate:
                    kind: custom
                    date: '2026-08-01'
                  description: 8 月服务费
      responses:
        '201':
          description: 已创建（返回账单详情 + 付款链接 URL）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
              examples:
                created:
                  summary: 新建 UNPAID 账单（含付款链接整串）
                  value:
                    invoiceId: inv_1000024_2001
                    amount:
                      amount: '10500'
                      currency: CAD
                    status: UNPAID
                    dueDate: '2026-08-01'
                    createdAt: '2026-07-04T10:00:00Z'
                    createdDate: '2026-07-04'
                    description: 8 月服务费
                    paymentUrl: https://cashier.example.com/inv/inv_1000024_2001
                    hidden: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204003
        - 204004
        - 208001
        - 208005
  /products/invoices/counts:
    get:
      tags:
        - invoices
      operationId: getInvoiceCounts
      summary: 账单列表状态快捷筛选的各项与计数
      description: |
        账单列表顶部状态快捷筛选的各项与计数（形状与用法见 `QuickFilterCounts`）。 `value` 原样回传给 `listInvoices` 的 `status`；本端点**不接受** `status`，其余筛选（搜索 / 创建日期 / 金额区间）与列表一致。 ⚠️ **与页顶汇总卡 `getInvoiceSummary` 是两个量、不要互相核对**：汇总卡恒按商户全量算、不随筛选变； 本端点随筛选走、且与列表同轴。默认不展示的**已隐藏 `PAID`** 两边都不计入。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: keyword
          in: query
          required: false
          description: 按 Invoice ID 子串搜索
          schema:
            type: string
        - name: from
          in: query
          required: false
          description: 创建日期范围起（含当日）。筛的是记录上的 `createdDate`、按字面匹配。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: to
          in: query
          required: false
          description: 创建日期范围止（含当日）。口径同 `from`。
          schema:
            $ref: '#/components/schemas/LocalDate'
        - name: amountMin
          in: query
          required: false
          description: 金额范围下限（最小币种单位整数字符串）
          schema:
            type: string
        - name: amountMax
          in: query
          required: false
          description: 金额范围上限
          schema:
            type: string
      responses:
        '200':
          description: 各项与计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickFilterCounts'
              example:
                items:
                  - value: PAID
                    label: Paid
                    count: 2
                  - value: UNPAID
                    label: Unpaid
                    count: 2
                  - value: OVERDUE
                    label: Overdue
                    count: 1
                  - value: VOIDED
                    label: Voided
                    count: 1
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /products/invoices/summary:
    get:
      tags:
        - invoices
      operationId: getInvoiceSummary
      summary: 账单页顶汇总卡
      description: |
        账单页顶的 Paid / Unpaid / Overdue 三格 + Total Receivables 汇总卡。

        **恒按该商户全量 Invoice 统计（排除已隐藏的 PAID），不随账单列表的搜索 / 状态 / 日期 / 金额筛选变化**——
        筛选只作用于列表数据，汇总卡呈现的是商户应收全貌；随 Invoice 创建 / 作废 / 隐藏实时联动，故**与 `listInvoices` 的 `total` 不同轴、不可互相核对**。

        **币种口径**：

        - 计数含全部 Invoice（跨标价币种）；
        - Paid 金额按实际结算金额（结算币种）合计；
        - CNY 标价的 Unpaid / Overdue 结算额尚未确定 → CNY 独立小计、不与结算币种金额混加。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 页顶汇总
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSummary'
              examples:
                mixedCurrency:
                  summary: 结算币种(CAD) + CNY 标价并存，未收分币种小计
                  value:
                    paid:
                      count: 0
                      settlementAmount:
                        amount: '0'
                        currency: CAD
                    unpaid:
                      count: 1
                      settlementAmount:
                        amount: '10500'
                        currency: CAD
                    overdue:
                      count: 1
                      settlementAmount:
                        amount: '0'
                        currency: CAD
                      cnyAmount:
                        amount: '20000'
                        currency: CNY
                    totalCount: 2
                    totalReceivables:
                      settlement:
                        total:
                          amount: '10500'
                          currency: CAD
                        current:
                          amount: '10500'
                          currency: CAD
                        overdue:
