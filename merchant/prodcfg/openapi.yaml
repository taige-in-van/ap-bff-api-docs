  /products/payment-links/files/upload-targets:
    post:
      tags:
        - payment-links
      operationId: createPaymentLinkAssetUploadTarget
      summary: 取得链接素材直传目标（Banner / 品牌 Logo；浏览器据此直传）
      description: |
        上传分两步。

        - **第一步**调本接口，用**声明值**（用途 / 文件名 / 内容类型 / 大小）换一个直传目标；
        - **第二步**由浏览器把文件连同目标中的 `fields` 一起提交到 `action`，**文件字节不经过本接口**。

        允许的格式与大小上限见 `purpose` 的用途表；声明值不合规 → `400 FILE_DECLARATION_REJECTED (204015)` 且**不签发目标**——换一个合规的文件再申请，同一文件重试无用。

        返回的 `fileId` 按 `purpose` 作 `bannerRef` 或 `brandLogoRef` 引用——**该文件在携带该引用的那次写生效时才正式归属对应链接**，`createPaymentLink`（创建即带图）与 `updatePaymentLink`（建好后再加 / 换图）两条都可以。

        **本端点不需要链接已存在**，故创建向导里也能先传图。

        **非幂等**：每次调用产生新 fileId、重试不复用；不挂 Idempotency-Key。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadTargetRequest'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - payment_link_banner
                        - payment_link_brand_logo
                    contentType:
                      enum:
                        - image/png
                        - image/jpeg
            example:
              purpose: payment_link_banner
              fileName: campaign-banner.jpg
              contentType: image/jpeg
              fileSize: 512000
      responses:
        '201':
          description: 已签发直传目标；其 fileId 按 purpose 供 createPaymentLink / updatePaymentLink 引用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTarget'
              examples:
                issued:
                  summary: Banner 直传目标 —— fields 原样全部提交，文件本体以 file 为名放最后
                  value:
                    fileId: 5a2c84f1d09b4e73ac16f8b3e047d92c
                    action: https://files.example.com/direct-upload
                    fields:
                      key: merchant/1000024/payment-link-banner/5a2c84f1d09b4e73ac16f8b3e047d92c
                      Content-Type: image/jpeg
                      policy: REDACTED-BASE64-POLICY
                      signature: REDACTED-SIGNATURE
                    expiresAt: '2026-07-10T09:45:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
        - 208001
