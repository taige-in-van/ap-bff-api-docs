    TicketContent:
      type: object
      properties:
        eventDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 活动日期，**纯描述性**——**不作销售 gate**，活动日过了票照卖。
        venue:
          type: string
          minLength: 1
        bannerRef:
          type:
            - string
            - 'null'
          description: Banner 引用；取自 createPaymentLinkAssetUploadTarget（purpose=payment_link_banner）返回的 fileId。**提交时用它**
        bannerUrl:
          type: string
          format: uri
          readOnly: true
          description: Banner 的**可渲染地址**（读时由服务端换出，**只出不入**）。未设置 Banner（无 `bannerRef`）时不返回本键
        tiers:
          type: array
          minItems: 1
          maxItems: 10
          description: 票档，**1–10 档（上限固定）**
          items:
            $ref: '#/components/schemas/TicketTier'
    TicketContentRead:
      description: '`TicketContent` 的读侧形态：收窄可清空字段 + 票档换读侧变体。'
      allOf:
        - $ref: '#/components/schemas/TicketContent'
        - properties:
            bannerRef:
              type: string
            tiers:
              type: array
              items:
                $ref: '#/components/schemas/TicketTierRead'
    TicketContentComplete:
      description: 票务内容的**完整形态**：创建提交时缺其一即 `400`；详情响应中这些字段必返。 属性集单一来源为 `TicketContent`，此处只收紧 `required`。
      required:
        - eventDate
        - venue
        - tiers
      allOf:
        - $ref: '#/components/schemas/TicketContent'
    TicketContentCompleteRead:
      description: 详情响应用的票务内容：必填集同 `TicketContentComplete`（创建面），可空字段按读侧收窄（`TicketContentRead`）。
      allOf:
        - $ref: '#/components/schemas/TicketContentComplete'
        - $ref: '#/components/schemas/TicketContentRead'
    PoliciesAndSupport:
      type: object
      description: 收款页 Policies & Support（**五项** × 三语；商户级默认继承、跨类 II 三产品共享一份）。
      properties:
        faq:
          $ref: '#/components/schemas/LocalizedText'
        customerService:
          $ref: '#/components/schemas/LocalizedText'
        privacyPolicy:
          $ref: '#/components/schemas/LocalizedText'
        termsOfUse:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: 使用说明：活动页展示的重要使用说明 / 使用范围 / 适用限制与关键条款提示（区别于下方的正式条款全文）
        terms:
          allOf:
            - $ref: '#/components/schemas/LocalizedText'
          description: Terms & Conditions 正式条款全文
    PoliciesAndSupportRead:
      description: '`PoliciesAndSupport` 的读侧形态：本身无可清空字段，仅把五项三语文本换成读侧变体。'
      allOf:
        - $ref: '#/components/schemas/PoliciesAndSupport'
        - properties:
            faq:
              $ref: '#/components/schemas/LocalizedTextRead'
            customerService:
              $ref: '#/components/schemas/LocalizedTextRead'
            privacyPolicy:
              $ref: '#/components/schemas/LocalizedTextRead'
            termsOfUse:
              $ref: '#/components/schemas/LocalizedTextRead'
            terms:
              $ref: '#/components/schemas/LocalizedTextRead'
    LocalizedText:
      type: object
      description: 三语文本（EN / 中 / FR）。Policies & Support 五项的值为**受限 HTML**：允许段落 / 换行 / 粗体 / 斜体 / 标题 / 链接 / 列表 / 表格 / 高亮标签，白名单外标签与脚本保存时被服务端剥除（不报错）；每语种长度上限由后端配置，超限 → `400` 字段级错误；收款页按同一白名单渲染。
      properties:
        en:
          type:
            - string
            - 'null'
        zh:
          type:
            - string
            - 'null'
        fr:
          type:
            - string
            - 'null'
    LocalizedTextRead:
      description: '`LocalizedText` 的读侧形态：只收窄可清空字段——**响应里未填的语种不返回本键、不返** `null`。'
      allOf:
        - $ref: '#/components/schemas/LocalizedText'
        - properties:
            en:
              type: string
            zh:
              type: string
            fr:
              type: string
    PaymentLinkCreateRequest:
      type: object
      additionalProperties: false
      description: |
        创建请求（扁平对象）。`type` 选定链接类型，**对应的内容子对象必填、其余不得携带**：`giftcard` → `giftcard`、`product` → `product`、`ticket` → `ticket`（不匹配 → 400，服务端校验）。

        **所有内容价格 / bonus 币种须 = 顶层** `currency`（服务端校验、schema 不强约）。
      required:
        - type
        - name
        - currency
        - methodIds
      properties:
        type:
          $ref: '#/components/schemas/PaymentLinkType'
        name:
          type: string
          minLength: 1
        currency:
          $ref: '#/components/schemas/Currency'
        methodIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        buyerInformation:
          type: array
          uniqueItems: true
          maxItems: 5
          description: |
            **保留下来的付款人信息采集项，按 `key` 给全**——不是「商户新加的那几个」。

            新建时以 `getPaymentLinkCreateConfig` 的 `defaultBuyerInfo` 为起点、编辑时以 `getPaymentLink` 回显的 `buyerInformation` 为起点；用户删掉哪些就不放哪些，新加的自撰项直接放它的标题。

            **为什么要给全**：系统给出的项现在也能删（非必填的那些），只提交自撰项的话服务端就分不清「用户删了它」和「用户没动它」。

            **必填项一个都不能少**——少了、或自撰标题以 `sys:` 开头 → `409 PRODCFG_INFO_FIELDS_INVALID (208030)`，整次保存被拒。系统项的文案与必填性以服务端已存的为准，这里只表达「留不留」。

            **最多 5 项**（固定上限，系统项与自撰项合计）。
          items:
            $ref: '#/components/schemas/InfoFieldKey'
        giftcard:
          allOf:
            - $ref: '#/components/schemas/GiftcardContentComplete'
          description: 礼卡内容——`type=giftcard` 时必填，其余类型不得携带
        product:
          allOf:
            - $ref: '#/components/schemas/ProductContentComplete'
          description: 商品内容——`type=product` 时必填，其余类型不得携带
        ticket:
          allOf:
            - $ref: '#/components/schemas/TicketContentComplete'
          description: 票务内容——`type=ticket` 时必填，其余类型不得携带
    PaymentLinkUpdateRequest:
      type: object
      additionalProperties: false
      description: |
        编辑请求（扁平对象，部分更新）。`type` 须与该链接现有类型一致，只用于选定内容子对象：**仅本类型的内容子对象可携带**（`giftcard` / `product` / `ticket` 之一，与 `type` 不匹配 → 400，服务端校验）。

        **不因已有订单而锁字段**——已成交订单自持其购买内容，改链接不影响它们；礼卡履约模式创建后即不可改，与是否已售无关。
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/PaymentLinkType'
        name:
          type: string
          minLength: 1
        currency:
          $ref: '#/components/schemas/Currency'
        methodIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
        buyerInformation:
          type: array
          uniqueItems: true
          maxItems: 5
          description: |
            **保留下来的付款人信息采集项，按 `key` 给全**——不是「商户新加的那几个」。

            新建时以 `getPaymentLinkCreateConfig` 的 `defaultBuyerInfo` 为起点、编辑时以 `getPaymentLink` 回显的 `buyerInformation` 为起点；用户删掉哪些就不放哪些，新加的自撰项直接放它的标题。

            **为什么要给全**：系统给出的项现在也能删（非必填的那些），只提交自撰项的话服务端就分不清「用户删了它」和「用户没动它」。

            **必填项一个都不能少**——少了、或自撰标题以 `sys:` 开头 → `409 PRODCFG_INFO_FIELDS_INVALID (208030)`，整次保存被拒。系统项的文案与必填性以服务端已存的为准，这里只表达「留不留」。

            **最多 5 项**（固定上限，系统项与自撰项合计）。
          items:
            $ref: '#/components/schemas/InfoFieldKey'
        giftcard:
          allOf:
            - $ref: '#/components/schemas/GiftcardContent'
          description: 礼卡内容——仅 `type=giftcard` 可携带
        product:
          allOf:
            - $ref: '#/components/schemas/ProductContent'
          description: 商品内容——仅 `type=product` 可携带
        ticket:
          allOf:
            - $ref: '#/components/schemas/TicketContent'
          description: 票务内容——仅 `type=ticket` 可携带
    PaymentLinkListItem:
      type: object
      required:
        - linkId
        - type
        - name
        - currency
        - status
        - createdAt
      properties:
        linkId:
          type: string
          readOnly: true
        type:
          $ref: '#/components/schemas/PaymentLinkType'
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        amountSummary:
          type: string
          readOnly: true
          description: 价格摘要（giftcard 面值区间 / product 起价 / ticket 票档区间；含币种、展示用）；无可摘要的价格时不返回本键
        eventDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          readOnly: true
          description: 活动日期（**仅 ticket 返回**，名称下次级行展示）
        venue:
          type: string
          readOnly: true
          description: 活动场地（**仅 ticket 返回**，名称下次级行展示）；未填不返回本键
        itemCount:
          type: integer
          minimum: 0
          readOnly: true
          description: 条目数（product = 商品条目数、giftcard = 面值档数；名称下次级行展示）；ticket 不返回本键
        status:
          $ref: '#/components/schemas/PaymentLinkStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    PaymentLinkDetail:
      type: object
      description: 支付链接详情（扁平对象）：共有字段在顶层，**仅 `type` 对应的内容子对象返回**（`giftcard` / `product` / `ticket` 之一，其余不返回本键）；`recipientInformation` 仅礼卡链接返回。
      required:
        - linkId
        - type
        - name
        - currency
        - status
        - createdAt
        - methods
        - buyerInformation
        - policies
        - paymentUrl
      properties:
        linkId:
          type: string
          readOnly: true
        type:
          $ref: '#/components/schemas/PaymentLinkType'
        name:
          type: string
        currency:
          $ref: '#/components/schemas/Currency'
        status:
          $ref: '#/components/schemas/PaymentLinkStatus'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethodRef'
        buyerInformation:
          type: array
          maxItems: 5
          description: 这条链接**当前保留着的全部**付款人信息采集项，系统给出的与商户自撰的同在一个列表里、各项按 `system` / `mandatory` 区分。 这就是编辑页要回显的那份内容——**别再去 `getPaymentLinkCreateConfig` 的 `defaultBuyerInfo` 取**，那份只在新建时用。 **最多 5 项（固定上限），系统项与自撰项合计。**
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
        recipientInformation:
          type: array
          maxItems: 5
          description: |
            这条链接**当前保留着的全部**收件人信息采集项，形状同 `buyerInformation`。**只有礼卡链接返回本键**（其他类型不返回），礼卡链接恒返（至少含必填的收件人邮箱）。

            ⚠️ **读侧在顶层、与 `buyerInformation` 同层**——虽然写侧提交时它落在 `giftcard.recipientInformation`（内容段内），读回来时**不在** `giftcard` 段里，别照搬写侧层级。
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
        policies:
          $ref: '#/components/schemas/PoliciesAndSupportRead'
        paymentUrl:
          type: string
          description: 链接整串（前端纯呈现）
        giftcard:
          allOf:
            - $ref: '#/components/schemas/GiftcardContentCompleteRead'
          description: 礼卡内容；仅 `type=giftcard` 返回（该类型恒返）
        product:
          allOf:
            - $ref: '#/components/schemas/ProductContentCompleteRead'
          description: 商品内容；仅 `type=product` 返回（该类型恒返）
        ticket:
          allOf:
            - $ref: '#/components/schemas/TicketContentCompleteRead'
          description: 票务内容；仅 `type=ticket` 返回（该类型恒返）
    PaymentLinkListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLinkListItem'
    PaymentLinkTransactionListPage:
      type: object
      required:
        - total
        - data
      description: 该 link 的交易分页列表。行 = 交易管理的交易列表行 + giftcard 链接专属的 `giftCard` 段。
      properties:
        total:
          type: integer
          minimum: 0
          description: 命中总数（分页）
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentLinkTransactionRow'
    PaymentLinkTransactionRow:
      description: 交易行 = 通用交易列表行（逐字段同交易管理）+ **giftcard 链接必带** `giftCard` 段（其他类型不返回本键）。
      allOf:
        - $ref: '#/components/schemas/PaymentRow'
        - type: object
          properties:
            giftCard:
              $ref: '#/components/schemas/GiftCardOrderRowSegment'
    GiftCardOrderRowSegment:
      type: object
      additionalProperties: false
      description: 礼卡订单在链接交易列表里的专属列（语义归 32-礼卡；订单详情的完整礼卡段在交易管理契约）。
      required:
        - giftCardOrderId
        - campaignName
        - giftCardName
        - faceValue
        - price
        - credentialState
        - recipient
        - riskLevel
      properties:
        giftCardOrderId:
          type: string
          minLength: 1
          description: 礼卡订单号
        campaignName:
          type: string
          description: 后台活动名（行主标题；不面向持卡人）
        giftCardName:
          type: string
          description: 用户可见礼卡商品名（行副标题）
        faceValue:
          $ref: '#/components/schemas/Money'
        price:
          $ref: '#/components/schemas/Money'
        credentialState:
          type: string
          enum:
            - PENDING
            - ISSUABLE
            - ISSUED
            - SUSPENDED
            - CANCELED
          description: 凭证发放态（同订单详情）。可选集按该链接的 Fulfillment Mode 收窄，详见交易管理契约的礼卡段说明。
        redemptionStatus:
          type: string
          enum:
            - not_redeemed
            - redeemed
            - voided
          description: 核销态；**仅 Voucher Mode 返回本键**（Inventory Mode 无平台核销）
        credentialMasked:
          type: string
          description: 凭证展示串：Inventory Mode = 掩码卡号、Voucher Mode = 券号；尚未发放则不返回本键
        recipient:
          type: object
          additionalProperties: false
          properties:
            name:
              type: string
              description: 收卡人姓名（无则不返回本键）
            email:
              type: string
              description: 收卡人邮箱（无则不返回本键）
        riskLevel:
          type: string
          enum:
            - normal
            - medium
            - high
          description: 风险等级（`normal` 不展示风险标签）；语义归 32-礼卡
    RedemptionListPage:
      type: object
      description: '核销记录分页。**giftcard Inventory Mode 恒返 `total: 0` + 空** `data`（无平台核销、tab 置灰）， 其发卡 / 投递情况在订单详情呈现、不在本资源。'
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/VoucherRedemptionRecord'
    VoucherRedemptionRecord:
      type: object
      description: 核销记录（只读）。适用于 product / ticket，以及 **giftcard 的 Voucher Mode** （Inventory Mode 无平台核销，本 tab 置灰、记录数恒 0）。 核销为**整单一次性**——**不含已用金额 / 剩余余额字段**（非储值）。
      required:
        - recordId
        - code
        - status
      properties:
        recordId:
          type: string
          minLength: 1
          readOnly: true
          description: '**核销记录号**——本条记录自身的标识（与被核销的 `code` 是两回事），可直接作列表行 key'
        code:
          type: string
          readOnly: true
          description: 核销码 / 兑换券号（被核销的对象，非记录自身标识）
        redeemedAt:
          readOnly: true
          description: 核销时间；**尚未核销则不返回本键**
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        store:
          type: string
          readOnly: true
          description: 核销门店（giftcard Voucher Mode）；无门店信息时不返回本键
        terminal:
          type: string
          readOnly: true
          description: 核销终端（giftcard Voucher Mode）；无终端信息时不返回本键
        operator:
          type: string
          readOnly: true
          description: 核销操作人；无操作人信息时不返回本键
        guest:
          type: string
          readOnly: true
          description: 购票人姓名（ticket 入场核销记录；来自购票时填写的姓名）；无则不返回本键
        status:
          type: string
          readOnly: true
          enum:
            - ISSUED
            - REDEEMED
            - VOID
            - CANCELED
          description: 核销记录态（凭证的核销态，语义归产品能力侧、本域只读呈现）：`ISSUED` 未核销（可核销）/ `REDEEMED` 已核销（商品自提 / 票务入场 / 礼卡券核销）/ `VOID` 已作废（商户主动作废）/ `CANCELED` 已失效（退款成功后凭证失效）。 状态筛选项按本 enum 渲染；Inventory Mode 礼卡无本资源。
    DeviceLifecycleStatus:
      type: string
      description: 设备生命周期态。
      enum:
        - PENDING_ACTIVATION
        - ACTIVE
        - DISABLED
        - RELEASED
    DeviceSourceOption:
      type: object
      additionalProperties: false
      description: 一个设备来源候选（这台 POS 归谁所有：平台自有 / 某合作方 / 未知）。**本项带展示名**——来源是专有名（合作方名与平台自称），没有标准名表可解析。
      required:
        - code
        - displayName
      properties:
        code:
          type: string
          minLength: 1
          description: '**这才是提交给 `source` 的值**（不要提交 `displayName`）'
          examples:
            - moneris
        displayName:
          type: string
          minLength: 1
          description: canonical 展示名（**非本地化**、不随 locale 变）；客户端有自己的多语言资源时按 `code` 取用，本字段作 unknown-safe 兜底。
          examples:
            - Moneris
    DeviceBindSourceOption:
      type: object
      additionalProperties: false
      description: 预登记面的来源候选：`DeviceSourceOption` 的两项 + 该来源名下的型号清单（两者的 `code` / `displayName` 口径一致）。
      required:
        - code
        - displayName
        - models
      properties:
        code:
          type: string
          minLength: 1
          description: '**这才是提交给 `source` 的值**（不要提交 `displayName`）'
          examples:
            - moneris
        displayName:
          type: string
          minLength: 1
          description: canonical 展示名（**非本地化**、不随 locale 变）；客户端有自己的多语言资源时按 `code` 取用，本字段作 unknown-safe 兜底。
          examples:
            - Moneris
        models:
          type: array
          description: 该来源名下的已知型号（顺序即展示顺序）。**是便利清单、不是白名单**——商户可提交清单外的自定义型号；本来源暂无收录型号时为空数组。
          items:
            type: string
            minLength: 1
    DeviceConnection:
      type: string
      enum:
        - online
        - offline
    DeviceListItem:
      type: object
      required:
        - deviceId
        - model
        - source
        - serialNumber
        - lifecycleStatus
        - createdAt
        - createdDate
      properties:
        deviceId:
          type: string
          readOnly: true
        model:
          type: string
          readOnly: true
        source:
          type: string
          readOnly: true
          description: Platform（平台自有设备）/ Moneris / Clover / Unknown
        serialNumber:
          type: string
          readOnly: true
          description: 该设备终端身份的**展示值**：POS 硬件设备为厂商序列号；收银 App（softPOS）没有序列号 （手机不向 App 提供硬件序列号），本键改给它的**终端身份**——由平台从端上报的安装标识归一化而来， **不是** `deviceId`（那个是另一件事、已单独返回）。 两类设备本键都有值，直接按一列渲染即可，不必按设备类型分支。
        boundStore:
          type: string
          readOnly: true
          description: 绑定店铺；未绑定店铺时不返回本键
        operatorEmail:
          type: string
          readOnly: true
          description: 最近登录 operator；无登录记录时不返回本键
        firmwareOsVersion:
          type: string
          readOnly: true
          description: 设备固件 / OS 版本（设备激活或首次连接时上报，之后随连接刷新）；未上报则不返回本键，列表按「如有」呈现
        appVersion:
          type: string
          readOnly: true
          description: 设备端 App 版本（上报口径同 `firmwareOsVersion`）；未上报则不返回本键
        lifecycleStatus:
          $ref: '#/components/schemas/DeviceLifecycleStatus'
        connection:
          readOnly: true
          description: 连接态。尚未激活 / 已停用等无连接态可言时**不返回本键**。 状态徽章由 `lifecycleStatus` + 本字段**两维共同决定**；本键缺失即表示无连接态可言，按 `lifecycleStatus` 单独呈现即可。
          allOf:
            - $ref: '#/components/schemas/DeviceConnection'
        lastActiveAt:
          readOnly: true
          description: 最近活跃时间；**从未活跃则不返回本键**
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        activatedAt:
          readOnly: true
          description: 激活时间（首次绑定生效、进入 ACTIVE 的时刻）；**尚未激活则不返回本键**。列表不展示本列、只作排序键。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          readOnly: true
          description: 创建日（服务端固化）。按创建日期筛选筛的就是它。
    DeviceDetail:
      description: 设备详情。版本字段（`firmwareOsVersion` / `appVersion`）与列表同源同名、口径见 `DeviceListItem`，详情不另给一套。
      allOf:
        - $ref: '#/components/schemas/DeviceListItem'
    DeviceListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceListItem'
    DeviceStatusFilter:
      type: string
      description: '**商户所见的设备状态**——设备列表按这一维筛选与分组，顶部快捷筛选与 Filters 面板用的是同一个维度、同一个参数。 它是生命周期与连接态的**投影**：`ONLINE` / `OFFLINE` 是已激活设备的两种连接情形， `PENDING_ACTIVATION` / `DISABLED` 为对应生命周期态。行上要分别拿这两维渲染徽章时， 看 `DeviceListItem` 的 `lifecycleStatus` + `connection`（响应侧仍分开给）。 每台在册设备**恰好落进其中一项**（`RELEASED` 不进列表）。'
      enum:
        - PENDING_ACTIVATION
        - ONLINE
        - OFFLINE
        - DISABLED
    DeviceBindRequest:
      type: object
      required:
        - model
        - serialNumber
        - source
        - storeName
      properties:
        model:
          type: string
          minLength: 1
          description: 设备型号。**已知型号取自 `getDeviceBindOptions` 里所选来源那一组的 `models`，也可填清单外的自定义型号**（提交不做命中校验）。 纯记录与列表展示、不参与判定——设备的身份由服务端确定，本字段不是其构件。
        serialNumber:
          type: string
          minLength: 1
          description: 商户从设备上抄录的厂商序列号。这台设备日后首次登录时，服务端据它把这条绑定记录认到那台机器上。 **判重只在您名下做**——您已绑过同一串 → `409`·208021，渲染成本字段的字段级错误（见本端点说明）； 这串序列号**不是全平台唯一键**，别家商户用过同一串不会在这里被拦下（同一串出现在不同厂商下本就是两台机器）。
        source:
          type: string
          minLength: 1
          description: 设备来源（这台 POS 归谁所有）。**取自** `getDeviceBindOptions.sources[].code` —— 取值集由后端配置决定、会随新增合作方增长，前端不要 hardcode。
        storeName:
          type: string
          minLength: 1
          description: 绑定店铺名，**商户自填的自由文本**（不是实体引用、不做命中校验）。它同时构成设备列表「绑定店铺」筛选的候选来源——已用过的全集见 `getDeviceFilterOptions`
    DeviceLogType:
      type: string
      description: 设备日志类型（首期 3 类；firmware/error 不在首期）。
      enum:
        - transaction
        - connection
        - auth
    DeviceLogItem:
      type: object
      required:
        - type
        - severity
        - event
        - timestamp
      properties:
        type:
          $ref: '#/components/schemas/DeviceLogType'
        severity:
          type: string
          enum:
            - info
            - warning
            - error
          description: 严重程度（由上游设备日志投影给出，与 `type` 正交）；类型徽标按此着色，商户据此在长日志里挑出异常项
        event:
          type: string
          readOnly: true
        notes:
          type: string
          readOnly: true
          description: 日志备注；无备注时不返回本键
        actor:
          type: string
          readOnly: true
          description: 商户用户 email 或 system；无归属操作方时不返回本键
        timestamp:
          $ref: '#/components/schemas/Timestamp'
    DeviceLogListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceLogItem'
    GeneralSettings:
      type: object
      required:
        - orderExpiryMinutes
        - customerServiceFeeEnabled
      properties:
        orderExpiryMinutes:
          allOf:
            - $ref: '#/components/schemas/OrderExpiryMinutes'
          description: 当前生效的 Order Expiry——商户已单独配置则为其配置值，未配置则为平台兜底值。**恒有值**，前端直接按分钟数格式化展示、不需要自己补默认；**必落在 `listOrderExpiryOptions` 的候选值集内**（兜底值同样受此约束，故进编辑态一定选得中当前值）
        customerServiceFeeEnabled:
          type: boolean
    ReceiptContent:
      type: object
      description: POS 小票内容（供收款终端打印）。
      properties:
        logoPrint:
          type: string
          readOnly: true
          description: 打印 logo 引用（文件标识）；未配置打印 logo 时不返回本键。⚠️ **本期只读**——本契约**不提供签发小票 logo 上传目标的端点**，前端无从取得合法文件标识，故不要在保存请求里带它（小票内容整组暂缓实现，见本 schema 上方说明）
        logoPrintUrl:
          type: string
          format: uri
          readOnly: true
          description: 打印 logo 的**可渲染地址**（读时由服务端换出，**只出不入**；供配置页回显预览）。未配置打印 logo（无 `logoPrint`）时不返回本键
        additionalContent:
          type:
            - string
            - 'null'
          description: 附加内容（门店地址 / 营销语）
        receiptQrType:
          type:
            - string
            - 'null'
          description: 小票收款码类型
    ReceiptContentRead:
      description: '`ReceiptContent` 的读侧形态：收窄可清空字段——**未配置的项不返回本键、不返** `null`。'
      allOf:
        - $ref: '#/components/schemas/ReceiptContent'
        - properties:
            additionalContent:
              type: string
            receiptQrType:
              type: string
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战错误但可重试时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            currentMerchantId:
              type: string
              description: 服务端会话当前商户（≠ 请求携带的 expected `X-Merchant-Context`），供前端 re-sync；**无当前商户则不返回本键**（前端须重选）。
            paymentId:
              type: string
              description: 失败发生时**订单已建立**的场景下带出的平台侧支付单标识（如被扫同步扣款在通道应答阶段失败）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            merchantMandateNo:
              type: string
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            maskedEmail:
              type: string
              description: 已遮蔽的邮箱（形如 `j***@example.com`），**只作展示、不可回填表单**。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
    FileUploadTargetRequest:
      type: object
      additionalProperties: false
      description: '**申请直传目标的入参**。所有上传入口形状一致 —— 用**声明值**换一个直传目标,文件字节不经本平台 API。 校验按声明值做:`purpose` 决定允许的格式与大小上限,不合规 → 400 且**不签发目标**; 两项同时写入目标的提交条件,实际超限的文件在提交时即被存储端拒收。 **内容类型按声明判定,不做内容识别。**'
      required:
        - purpose
        - fileName
        - contentType
        - fileSize
      properties:
        purpose:
          type: string
          description: 文件用途 —— 决定允许的格式、大小上限与取用方式。取值集合由各消费面自行定义; **每个上传入口只接受它所属业务范围内的用途**,传入范围外的用途 → 400。
        fileName:
          type: string
          description: 原始文件名(保留作展示;直传后服务端无从取得,须在此声明)。
        contentType:
          type: string
          description: 声明的内容类型;不在该 `purpose` 的白名单内 → 400。
        fileSize:
          type: integer
          format: int64
          description: 声明的字节数;超该 `purpose` 的上限 → 400。上限同时写入提交条件。
    MerchantFilePurpose:
      type: string
      description: |
        商户后台可上传的**文件用途**总表 —— 用途决定允许的格式、大小上限与取用方式。
        每个上传入口只接受它所属业务范围内的用途（各入口在自己的请求体里列出），传入范围外的用途 → 400。

        | 用途 | 允许格式 | 大小上限 | 传上去之后怎么取用 |
        |---|---|---|---|
        | `onboarding_document` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（含身份与银行资料，仅授权主体可取） |
        | `settlement_void_cheque` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `store_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `merchant_logo` | PNG / JPEG | **512KB（固定上限）** | 长效稳定的公开地址（要展示给外部访客） |
        | `payment_page_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `payment_link_banner` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `payment_link_brand_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |

        **短时效地址不要持久化、不要分享**（过期即失效，重新读取所在资源可拿到新的）；长效公开地址可直接放进页面。
      enum:
        - onboarding_document
        - settlement_void_cheque
        - store_photo
        - merchant_logo
        - payment_page_logo
        - payment_link_banner
        - payment_link_brand_logo
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按**本地时区**换算(浏览器端即浏览器时区);商户配置的 IANA 时区是**服务端固化日期字段**时用的,不用于展示换算。

        **只表示「什么时候发生」,不表示「算哪一天」** —— 需要「哪一天」的地方各有自己的**日期字段**(`YYYY-MM-DD`),
        **别拿本类型自己推**：两者在跨日边界附近会分属两天。
    FileUploadTarget:
      type: object
      description: |
        **文件直传目标**。上传分两步:先向业务接口取得本对象,再由客户端把文件连同 `fields` 一起提交到 `action`;
        提交成功后回到业务接口完成绑定 —— **未完成绑定的文件不可用**(取不到、无法预览或下载)。

        提交方式**固定**:`POST` + `multipart/form-data`,先把 `fields` 逐项追加,**最后**追加名为 `file` 的文件本体
        (存储端要求文件是最后一个字段,其后的字段会被忽略)。

        - **不要手设 `Content-Type`** —— 直接提交 `FormData`
          让客户端自己带上 `boundary`,手设会丢 `boundary`、导致存储端解析不出表单。
        - `fields` **必须原样全部提交、不得增删或改写**:签名与签发时的条件(允许的内容类型、大小上限、有效期)绑定,改动会被存储端拒绝。
        - **成功判据 = HTTP 2xx**(具体码由存储端决定,不要判具体值);失败时返回的是**存储端自己的格式、不是本平台错误体**。

        本对象**限时有效、一次性**,且**只能用于其中的那个** `fileId`——不能拿它上传别的文件。
        **提交失败后不要向原目标重试**:重新申请一个目标,会得到**新的 `fileId`**,后续业务提交须改用新引用;过期同理。
      required:
        - fileId
        - action
        - fields
        - expiresAt
      properties:
        fileId:
          type: string
          description: 该文件的稳定引用。业务侧后续一律用它指代此文件(绑定 / 取用 / 展示均凭此); **不要保存 `action` 或任何物理地址** —— 存储位置会变更,而 `fileId` 不变。
          examples:
            - 0f8c2a6e4b1d47f0a9c3e5d7b2148a6f
        action:
          type: string
          format: uri
          description: 表单提交目标(对象存储端点,非本平台 API)。
        fields:
          type: object
          additionalProperties:
            type: string
          description: 必须随文件一起提交的表单字段(含签名)。原样提交、键值不改; **文件本体在这些字段全部追加完之后、以 `file` 为字段名追加**(必须是最后一个字段)。
        expiresAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 本目标的失效时刻。**过了这个点提交会被存储端拒绝**,须重新申请一个目标。 用户选好文件后放置较久、或准备提交大文件时,可据此提前判断要不要先换一个新目标, 不必等提交失败再回退。
    LocalDate:
      type: string
      format: date
      description: |
        **日历日期**(无偏移,`YYYY-MM-DD`)。**不带时区、不隐含日切时刻** —— 就是这一天本身。

        - **按字面值收发**:展示直接用这个字符串、**不做任何时区换算**
          (禁塞进 `Date` 后按浏览器时区渲染 —— 负偏移时区会显示成前一天);
        - **日期区间入参与固化的日期列作字面比较**,不把日期换算成瞬时区间去扫时间戳列;
        - **不改写已固化的日期字面值**,无论它当初是按谁的时区算出来的。

        商户选定的日期(Invoice Due Date / 礼卡 Campaign End Date / 票务 Event Date)与服务端固化后出参的日期
        (如各类记录的创建日)同用本类型。某个 `LocalDate` 在服务端对应哪条日轴、要不要解释成瞬时区间,
        是服务端的事 —— 契约面只承诺这一天的字面值。
      examples:
        - '2026-08-01'
    PositiveMoney:
      description: 正额金额（amount = 最小币种单位正非零整数字符串、currency 同 Money）；schema 化收口「> 0」。用于「划多少」类输入（资金划转额 / 阈值 / 退款额等），金额方向由具体业务操作表达、不用正负号表示；区别于 Money（可正可负，用于余额 / 分录 / 结算净额 / 回冲等账面值）。
      allOf:
        - $ref: '#/components/schemas/Money'
        - type: object
          properties:
            amount:
              type: string
              pattern: ^[1-9][0-9]*$
    QuickFilterItem:
      type: object
      additionalProperties: false
      required:
        - value
        - label
        - count
      properties:
        value:
          type: string
          description: 该项对应的筛选值 —— **对客户端不透明**:选中本项就把它**原样**回传给对应列表端点的那个筛选参数, 不要解析、拼接或据其分支。
          examples:
            - PAID
        label:
          type: string
          description: 后端给的默认展示名。**客户端有自己的多语言资源时按 `value` 取用、本字段作兜底**; 没有资源(取值由配置或数据决定,如角色名、年份)时直接展示本字段。
          examples:
            - Paid
        count:
          type: integer
          minimum: 0
          description: 该项当前的命中数(口径见 `QuickFilterCounts` 说明)。
    QuickFilterCounts:
      type: object
      additionalProperties: false
      description: |
        **列表页顶部快捷筛选的各项与计数**。快捷筛选就是该列表的一个筛选维度,没有特殊机制:选中某项 = 给列表带上该维度的筛选参数(值 = 该项 `value`),**选 All = 不带这个参数**。

        **照着 `items` 渲染即可** —— 项集、顺序、展示名、数字全部由服务端给出,客户端不枚举取值、不 hardcode 项集;某项当期为 `0` 时**仍会返回**(那一格不该因为没数据就消失)。

        **`All` 不在 `items` 里,由客户端自己补一项**,数字 = 其余各项之和 —— 服务端保证 `items` 覆盖该列表在不带本维度筛选时的全部命中(每行恰好落进一项),故这个和恒等于此时列表的 `total`。

        **本端点不接受被计维度自身的参数**;其余筛选条件与对应列表端点一致、传什么算什么。因此:点某项后列表 `total` = 该项 `count`;点 All 后列表 `total` = 各项 `count` 之和。
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QuickFilterItem'
    PaymentStatus:
      type: string
      description: |
        支付订单**商户可见状态**：`PAID` 已收款 · `PARTIALLY_REFUNDED` 部分退款 · `REFUNDED` 全额退款 · `FAILED` 失败 · `REJECTED` 平台未受理 · `PREAUTH_HOLDING` 预授权挂起。

        `PAID` / `PARTIALLY_REFUNDED` / `REFUNDED` 三者同属**已收款**、按已落账退款量区分（「已落账」= 通道受理成功；受理后失败会回退，故订单可能从 `PARTIALLY_REFUNDED` 退回 `PAID`）；`REJECTED` 未受理、`FAILED` 收款失败、`PREAUTH_HOLDING` 预授权挂起待放行。收款过程中的中间态不进列表。

        **`REJECTED` 与 `FAILED` 不可混用**：`REJECTED` = 平台未受理该笔交易、**支付从未发生**（无支付尝试、不可退款、无收据，`refundable` / `receiptAvailable` 恒 false）；`FAILED` = 已尝试支付但失败。

        **计入营收类聚合（收款额 / 净额 / 笔数）的状态白名单（穷举）**：`PAID` · `PARTIALLY_REFUNDED` · `REFUNDED` · `PREAUTH_HOLDING`——哪些页面有这类聚合、聚合字段叫什么，见该页契约。

        **不计入聚合 ≠ 不在列表**：本 enum 的每个取值都可能作为列表行出现（`FAILED` / `REJECTED` 亦然）、并可按状态单独筛出——别以为列表只给成功单。

        **封闭 enum**（取值集固定、可穷举分支）；仍须 unknown-safe 处理未识别值（保守对待、不静默丢弃）。
      enum:
        - PAID
        - PARTIALLY_REFUNDED
        - REFUNDED
        - FAILED
        - REJECTED
        - PREAUTH_HOLDING
    PaymentRow:
      type: object
      description: 支付交易列表行（默认列）。付款人 / 客户明细归详情，不入列表。凡呈现交易列表的页面（交易管理列表、Payment Link 详情的交易 tab）**行形状逐字段相同**，行组件可直接复用。
      required:
        - orderId
        - source
        - amount
        - status
        - transactionTime
        - refundable
        - receiptAvailable
      properties:
        orderId:
          type: string
          minLength: 1
          description: 平台订单号（全局唯一；列表 / 详情 / 命令主键；≠ 商户自填订单号）
        paymentMethod:
          type: string
          description: 支付方式（**稳定 Family code**，如 `wechat`——不是展示名）。**展示名 / 图标 FE 按 code 本地化**；拿不到本地化资源时，用交易管理契约 `getTransactionFilterOptions` 的 `paymentMethods[].displayName` 作 canonical 兜底（该目录是**商户级**、不随页面或筛选条件变，凡呈现本行的页面都可取用）。`status = REJECTED` **时不返回本键**——平台未受理、从未发生支付尝试，故无支付方式可言；FE 在本键缺席时呈现「—」，不得回退为任意默认方式
        source:
          type: string
          description: 来源（**稳定 code**，如 `store_qr`，后端动态配置枚举；不是展示名）。展示名同上——按 code 本地化，`getTransactionFilterOptions` 的 `sources[].displayName` 作 canonical 兜底
        amount:
          $ref: '#/components/schemas/Money'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactionTime:
          $ref: '#/components/schemas/Timestamp'
        note:
          type: string
          description: 备注（无则不返回本键）。**成型后的展示文本**——前端直接显示、**不要反解析成结构**（内容可能较长；格式非契约、随时可能变化）
        refundable:
          type: boolean
          description: 可退——**后端可退资格结果**（`PAID` / `PARTIALLY_REFUNDED` ∧ 剩余可发起额 > 0，**或平台挂起 `PREAUTH_HOLDING` 经预授权放行**）；非按 status 硬编码。行内退款入口可见性。
        remainingRefundable:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 剩余可发起退款额（口径同详情 `refundability.remainingRefundable`：成交 − 已落账 − 在途占用）。refundable 为 **true 时必返**，其余不返回本键。行内退款按钮据此提示「还可退 X」。
        receiptAvailable:
          type: boolean
          description: 该笔已收款（`PAID` / `PARTIALLY_REFUNDED` / `REFUNDED`）、有收据可取。**取收据的端点在交易管理契约**；所在页没有收据入口时本键可忽略
  responses:
    MerchantBffDefaultError:
      description: |
        非 2xx 统一错误响应——覆盖所有未在本 op 显式列出的状态码。

        HTTP status 只表达大类，**具体子因看响应体的整数** `code`：

        - 该 op 承诺的业务码见其 `x-error-codes`，
        - 码的**固有属性**（`name` / `httpStatus` / `retryable` / 必带 context 字段）见**随包错误码表**；
        - **该码在本接口下意味着什么、你该怎么处理，见本接口自己的说明**（怎么读见 API 基础约定「错误响应体」）。

        部分码另带 `context` 结构化上下文（如 stale-tab 守卫 `208001` 必携 `context.currentMerchantId` 供前端 re-sync 当前商户）——哪些码必携哪些字段，以码表的 `requiredContextFields` 为准，**不要按状态码猜**。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
