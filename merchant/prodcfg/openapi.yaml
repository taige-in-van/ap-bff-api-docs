    post:
      tags:
        - devices
      operationId: bindDevice
      summary: 绑定新设备
      description: |
        **预登记**设备（Source / Device Model / Serial Number / Store Name 四项，与绑定表单逐字段对齐）→ 建 `PENDING_ACTIVATION` 设备、定商户 / 店铺归属。

        **不生成 QR、不签发凭据**——设备须**自己首次登录并匹配到本条预登记**才会激活，**本接口不会返回已激活的设备**；转 `ACTIVE` 由前端刷新列表读到。

        **您名下已有同一 Serial Number 的设备** → `409`·208021：**渲染成 Serial Number 的字段级错误、不创建记录**（刷新重试无用），引导商户去设备列表看既有那条。

        判重只在**本商户名下**做——同一串序列号在不同厂商下本就是两台不同设备，绑定时拿不到厂商信息、无从分辨，
        所以**别家商户用过同一串不会在这里被拦下**；那种冲突要等该设备真正首次登录、报出自己的完整身份时才裁决，届时这条记录会激活失败。

        幂等：带 `Idempotency-Key`，重放同键返首次结果、payload 冲突 → `409 IDEMPOTENCY_PAYLOAD_CONFLICT (208005)`。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBindRequest'
            examples:
              basic:
                summary: 绑定一台平台自有设备
                value:
                  model: Sunmi V2 Pro
                  serialNumber: SN-2026-0001
                  source: platform
                  storeName: downtown-store
      responses:
        '201':
          description: 已预登记（返回设备详情，状态 `PENDING_ACTIVATION`）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
              examples:
                preRegistered:
                  summary: 已预登记 —— 尚未激活，故不返回连接态 / 最近活跃时间 / 版本
                  value:
                    deviceId: dev_1000024_0001
                    model: Sunmi V2 Pro
                    source: Platform
                    serialNumber: SN-2026-0001
                    boundStore: downtown-store
                    lifecycleStatus: PENDING_ACTIVATION
                    createdAt: '2026-08-10T09:00:00Z'
                    createdDate: '2026-08-10'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
        - 208005
        - 208021
  /devices/filter-options:
    get:
      tags:
        - devices
      operationId: getDeviceFilterOptions
      summary: 设备列表 Filters 的候选集（来源 / 绑定店铺 / 状态）
      description: |
        设备列表 Filters 下拉三项的候选。**商户级、不随分页也不随其他筛选条件变化**——候选若跟着当前页收窄，翻页后选项就会变、用户也改不回其他取值；整页取一次即可。

        - `sources` —— 该商户设备出现过的来源，取值同 `getDeviceBindOptions.sources`；
        - `stores` —— 该商户已用过的绑定店铺名。店铺名是商户预登记时自填的自由文本，只有服务端算得全；
        - `statuses` —— 商户所见状态的可筛项。

        **型号不是筛选维度**（列表按型号只能排序、不能筛）。各项的命中计数走 `getDeviceCounts`，不在本端点。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: OK（设备列表筛选候选）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - sources
                  - stores
                  - statuses
                properties:
                  sources:
                    type: array
                    readOnly: true
                    description: 来源候选（顺序即展示顺序）。**恒 present**。
                    items:
                      $ref: '#/components/schemas/DeviceSourceOption'
                  stores:
                    type: array
                    readOnly: true
                    description: 该商户已用过的绑定店铺名（去重，顺序即建议展示顺序）。**恒 present**，一台设备都没绑过时为空数组。
                    items:
                      type: string
                      minLength: 1
                  statuses:
                    type: array
                    readOnly: true
                    description: 可筛的状态项（顺序即展示顺序）。展示文案归 UI 设计层。
                    items:
                      $ref: '#/components/schemas/DeviceStatusFilter'
              example:
                sources:
                  - code: platform
                    displayName: Platform
                  - code: moneris
                    displayName: Moneris
                  - code: clover
                    displayName: Clover
                  - code: unknown
                    displayName: Unknown
                stores:
                  - downtown-store
                  - uptown-store
                statuses:
                  - PENDING_ACTIVATION
                  - ONLINE
                  - OFFLINE
                  - DISABLED
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /devices/bind-options:
    get:
      tags:
        - devices
      operationId: getDeviceBindOptions
      summary: 预登记表单的来源与型号目录
      description: |
        Bind Device 表单的两级候选：**先选来源（这台 POS 归谁所有），再从该来源名下的型号里选**。

        - `sources[].code` 是提交给 `source` 的值，**取值集封闭**、随新增合作方增长，故由本端点下发、前端不要 hardcode；
        - `sources[].models` 是**便利清单、不是白名单** —— 商户可以填清单外的自定义型号（`model` 提交不做命中校验），目录没收录新到的机器也不会挡住登记。

        设备身份在该设备首次登录、自己报出完整信息时才由服务端确定，本表单不采集任何分类字段。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: OK（来源 → 型号目录）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - sources
                properties:
                  sources:
                    type: array
                    readOnly: true
                    minItems: 1
                    description: 来源候选（顺序即展示顺序）；每项带该来源名下的型号清单。
                    items:
                      $ref: '#/components/schemas/DeviceBindSourceOption'
              example:
                sources:
                  - code: platform
                    displayName: Platform
                    models:
                      - Sunmi V1
                      - Sunmi V1s
                      - Sunmi V2
                      - Sunmi V2 Pro
                  - code: moneris
                    displayName: Moneris
                    models:
                      - Ingenico Move 5000
                      - Ingenico Desk 5000
                      - Verifone X900
                  - code: clover
                    displayName: Clover
                    models:
                      - Clover Flex
                      - Clover Mini 2
                      - Clover Station Duo
                  - code: unknown
                    displayName: Unknown
                    models: []
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
