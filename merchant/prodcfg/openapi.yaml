                        status: DISABLED
                        createdAt: '2026-07-15T14:20:00Z'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
    post:
      tags:
        - payment-links
      operationId: createPaymentLink
      summary: 创建支付链接（giftcard/product/ticket）
      description: |
        创建支付链接（按 `type` 选定 giftcard / product / ticket 之一，并携带对应的内容子对象）→ 建销售实例（status=ACTIVE）+ 返回链接 URL（`paymentUrl`）；收款 QR 图片不在本响应内，走 `downloadPaymentLinkQr` 取 PNG。

        含 Policies（**继承商户级共享默认**的快照）与 Buyer / Recipient Information（以 `getPaymentLinkCreateConfig` 的 **`default*`〔系统级默认〕** 为起点、固化进本链接自己的快照，**此后改本链接不回写任何共享默认**）。

        - **currency × methods 组合校验**：校验所选方式均支持该标价币种；方式不在该产品候选集内或不支持该币种 → `409 PAYMENT_METHOD_NOT_ACCEPTABLE (208007)`；空方式 → `400 PAYMENT_METHOD_SELECTION_EMPTY`。
        - **内容币种一致**：所有内容价格（denomination / product price / ticket tier price）及 bonus 币种须 = 顶层 `currency`，不一致 → `400 CONTENT_CURRENCY_MISMATCH (204006)`（schema 不强约、服务端校验）。
        - **礼卡内容规则**（type=giftcard）：核销规则仅兑换券模式适用 / 赠卡条款为自定义时赠卡备注必填 / 活动截止日不得早于今天 —— 任一不满足拒绝保存 → `400 GIFTCARD_CONTENT_INVALID (204013)`（逐字段明细走响应体字段错误）。

        **素材（Banner / 品牌 Logo）可在本步一并带上**：先调 createPaymentLinkAssetUploadTarget 取目标（**不需要链接已存在**）、浏览器直传，再把得到的 `fileId` 作 `bannerRef` / `brandLogoRef` 随本请求提交；也可以留空、建好后经 updatePaymentLink 再加。

        - 所引文件**确定未就位**（直传未完成 / 被存储端拒收）→ `400 FILE_NOT_IN_PLACE (204014)`，**链接不创建**。
          该码是终态、不可原样重试——须**重新取直传目标**（得到**新** `fileId`）、重新直传，再用新引用提交；**不要向原目标补传**（直传目标是一次性的，提交失败即作废）。
          ⚠️ **换了 `fileId` 就是换了请求体，必须同时换新** `Idempotency-Key`；沿用旧键提交新内容 → `409`·208005。
        - **暂时判不出**（上游不可达 / 超时）→ `502` / `504`：**不必重传**，用**原键原样重试**。

        幂等：带 `Idempotency-Key`，重放同键返首次结果、payload 冲突 → `409 IDEMPOTENCY_PAYLOAD_CONFLICT (208005)`。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLinkCreateRequest'
            examples:
              giftcard:
                summary: 创建 giftcard 支付链接（type↔content 绑定）
                value:
                  type: giftcard
                  name: 节日礼卡
                  currency: CAD
                  methodIds:
                    - online-wechat
                    - online-credit_card
                  buyerInformation:
                    - sys:name
                    - sys:email
                    - 公司抬头
                  giftcard:
                    giftCardName: lululemon $25 CAD Gift Card
                    brandName: lululemon
                    campaignName: 2026 Christmas Promotion
                    promotionType: discount
                    fulfillmentMode: inventory
                    emailLanguage: en
                    campaignEndDate: '2026-12-31'
                    maxPurchaseQuantity: 2
                    maximumPurchaseAmount:
                      amount: '10000'
                      currency: CAD
                    purchaseLimitCycle: biweekly
                    orderRiskReview: true
                    denominations:
                      - amount:
                          amount: '2500'
                          currency: CAD
                        price:
                          amount: '2500'
                          currency: CAD
                        discountAmount:
                          amount: '250'
                          currency: CAD
      responses:
        '201':
          description: 已创建（返回详情）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentLinkDetail'
              examples:
                giftcard:
                  summary: 新建 giftcard 链接（ACTIVE）
                  value:
                    linkId: pl_1000024_3001
                    type: giftcard
                    name: 节日礼卡
                    currency: CAD
                    status: ACTIVE
                    createdAt: '2026-07-10T10:00:00Z'
                    methods:
                      - methodId: online-wechat
                        family: wechat
