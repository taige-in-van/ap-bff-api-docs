      summary: Transactions tab（该链接的交易只读列表）
      description: |
        Payment Link 详情 Transactions tab：按**本 link 实例归因**过滤的支付交易只读分页列表。

        - **字段 / 状态 / 可退性 / 操作可见性与交易管理的交易列表逐字段相同**，行组件可直接复用。
        - **scope 双重收窄**：当前商户 + 该 `linkId`；非本商户或不属该 link 的交易不返回。
        - 排序同交易列表（`sortField` + `sortOrder`；页面默认最新交易在前由前端显式传），分页稳定。

        **本端点只读、不承载退款**——行内退款是**两跳、都在交易管理契约里**：先按 `orderId` 调 `getPaymentDetail` 做可退额预检（行里的 `refundable` / `remainingRefundable` 只供入口可见与提示,**提交前仍以详情的可退摘要为准**——可能已陈旧），再调 `createRefund` 提交;退款规则 / PIN / 幂等口径全在那边,本域不重复定义。

        空结果返回空态（`total: 0` + 空 `data`）、不报错。跨 scope `linkId` 统一 `404` 防枚举。
