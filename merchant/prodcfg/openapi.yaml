      description: 设备日志（transaction/connection/auth；按 type 过滤 + 搜索 + 时间倒序 + 分页）。`format=xlsx` 导出当前结果集——**同步返回文件流、不建异步任务**，**不设结果集条数上限**（单设备日志量级有界）。跨 scope 统一 404。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/AcceptLanguage'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: type
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DeviceLogType'
        - name: keyword
          in: query
          required: false
          description: 按 event / notes / actor 模糊搜索
          schema:
            type: string
        - name: format
          in: query
          required: false
          description: 响应格式：json = 日志列表（默认）；xlsx = 导出当前过滤结果
          schema:
            type: string
            enum:
              - json
              - xlsx
            default: json
      responses:
        '200':
          description: 日志列表（JSON）或导出文件（xlsx）
          headers:
            Content-Disposition:
              description: '**仅 `format=xlsx` 时返回**：`attachment; filename="...xlsx"`（filename 编码 RFC 5987）;JSON 响应不带本头'
              schema:
                type: string
            Content-Language:
              description: '**仅 `format=xlsx` 时返回**：导出文件的实际渲染语言（BCP-47，来自 `Accept-Language` → 会话 locale → 商户默认）'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceLogListPage'
              examples:
                mixed:
                  summary: 首期 3 类日志混排，按时间倒序；无备注 / 无归属操作方的键不返回
                  value:
                    total: 3
                    data:
                      - type: transaction
                        severity: info
                        event: Payment captured
                        notes: Order P100240021 · CA$48.50 · WeChat Pay
                        actor: cashier01@merchant.com
                        timestamp: '2026-08-17T09:52:00Z'
                      - type: connection
                        severity: warning
                        event: Device offline
                        actor: system
                        timestamp: '2026-08-17T08:30:00Z'
                      - type: auth
                        severity: info
                        event: Operator signed in
                        actor: cashier01@merchant.com
                        timestamp: '2026-08-17T08:29:00Z'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /devices/{deviceId}/logs/counts:
    get:
      tags:
        - device-logs
      operationId: getDeviceLogCounts
      summary: 设备日志类型快捷筛选的各项与计数
      description: |
        某设备日志列表顶部类型快捷筛选的各项与计数（形状与用法见 `QuickFilterCounts`）。 `value` 原样回传给 `listDeviceLogs` 的 `type`；本端点**不接受** `type`，其余筛选（关键词）与列表一致。跨 scope 统一 404。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: keyword
          in: query
          required: false
          description: 按 event / notes / actor 模糊搜索
          schema:
            type: string
      responses:
        '200':
          description: 各项与计数
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuickFilterCounts'
              example:
                items:
                  - value: transaction
                    label: Transaction
                    count: 12
                  - value: connection
                    label: Connection
                    count: 4
                  - value: auth
                    label: Auth
                    count: 2
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /settings/general:
    get:
      tags:
        - settings
      operationId: getGeneralSettings
      summary: 读商户级配置（Order Expiry / Service Fee / Checkout 入口）
      description: |
        回显 Order Expiry 当前值 + Customer Service Fee 启用状态。Checkout 快捷入口**恒可用**，无需按条件置灰。

        **这两行是否可编辑，按 `getCurrentSession` 的 `privileges` 判**：没有对应的编辑权限点就渲染成只读（值照常展示，不是隐藏整行）。
        本端点是读面、不回权限标记——权限是会话级的、不随被读的资源变，没必要在每个读响应里重复一遍。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 商户级配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
              examples:
                current:
                  summary: 当前生效值 —— orderExpiryMinutes 恒有值，前端按分钟数自行格式化展示
                  value:
                    orderExpiryMinutes: 15
                    customerServiceFeeEnabled: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /settings/order-expiry-options:
    get:
      tags:
        - settings
      operationId: listOrderExpiryOptions
      summary: 读 Order Expiry 候选值集（后端配置）
      description: Order Expiry 的**候选值集**（后端下发，前端不 hardcode 选项）。**顺序即展示顺序**；**本数组即允许取值域**——提交不在其中的值会被拒。 取值是**分钟数**、不是展示文案——展示文案由前端按分钟数自行格式化（如 `60` → `1 hour`），**不要把文案回传**。 当前生效值随 `getGeneralSettings` 的 `orderExpiryMinutes` 返回（**必落在本数组内**，含商户未配置时回显的平台兜底值），本端点不另发默认值。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 预设档
          content:
            application/json:
              schema:
                type: object
                required:
                  - options
                properties:
                  options:
                    type: array
                    minItems: 1
                    uniqueItems: true
                    description: 预设的过期时长档（分钟）
                    items:
                      $ref: '#/components/schemas/OrderExpiryMinutes'
              example:
                options:
                  - 5
                  - 15
                  - 30
                  - 60
                  - 120
                  - 1440
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /settings/order-expiry:
    put:
      tags:
        - settings
      operationId: setOrderExpiry
      summary: 设置 Order Expiry
      description: 设置商户 Order Expiry（分钟数；对新建订单生效）。取值须 ∈ `listOrderExpiryOptions` 的候选值集，不在其中 → `400`·`204019`（重取候选集、回显原值让用户重选）。天然幂等 PUT。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderExpiryMinutes
              properties:
                orderExpiryMinutes:
                  $ref: '#/components/schemas/OrderExpiryMinutes'
            example:
              orderExpiryMinutes: 30
      responses:
        '200':
          description: 已保存（返回生效值）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
              examples:
                saved:
                  summary: 改为 30 分钟后的整组配置（Service Fee 开关不受本次影响）
                  value:
                    orderExpiryMinutes: 30
                    customerServiceFeeEnabled: false
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204019
        - 208001
  /settings/customer-service-fee:
    put:
      tags:
        - settings
      operationId: setCustomerServiceFee
      summary: 切换 Customer Service Fee 总开关（无费率）
      description: 切换客户服务费启用状态（总开关；无费率输入，gross-up 转嫁）。天然幂等 PUT。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
      responses:
        '200':
          description: 已保存（返回启用状态）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneralSettings'
              examples:
                enabled:
                  summary: 已开启客户服务费（总开关，无费率字段）
                  value:
                    orderExpiryMinutes: 30
                    customerServiceFeeEnabled: true
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
  /settings/receipt:
    get:
      tags:
        - receipt
      operationId: getReceiptContent
      summary: 读 POS 小票内容配置
      description: 回显商户级小票内容（打印 logo / 附加内容 / 收款码类型）。供收款终端打印。⚠️ **暂缓实现**：现网这组内容由平台运营代为配置、商户端不提供自助编辑；本组接口是否保留为商户自助形态尚未定案，**实现前请先确认**，勿按可编辑页交付。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
      responses:
        '200':
          description: 小票内容配置
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptContentRead'
              examples:
                configured:
                  summary: 已配置打印 logo 与附加内容（logoPrintUrl 由服务端换出，供预览）
                  value:
                    logoPrint: 7d41b0e9c8524a1fb63e05d7a92c8f16
                    logoPrintUrl: https://files.example.com/o/7d41b0e9?exp=1755331200&sig=REDACTED&disp=inline
                    additionalContent: Maple Bistro · 88 King St W, Toronto · Thanks for your visit!
                    receiptQrType: standard
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
    put:
      tags:
        - receipt
      operationId: saveReceiptContent
      summary: 保存 POS 小票内容配置
      description: 保存小票内容（终端下次打印按新内容呈现；未配置按系统默认、不阻断打印）。天然幂等 PUT。⚠️ **暂缓实现**：现网这组内容由平台运营代为配置、商户端不提供自助编辑；本组接口是否保留为商户自助形态尚未定案，**实现前请先确认**，勿按可编辑页交付。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptContent'
      responses:
        '200':
          description: 已保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptContentRead'
              examples:
                saved:
                  summary: 保存后回显 —— 本次只改附加内容，打印 logo 保持原样
                  value:
                    logoPrint: 7d41b0e9c8524a1fb63e05d7a92c8f16
                    logoPrintUrl: https://files.example.com/o/7d41b0e9?exp=1755331200&sig=REDACTED&disp=inline
                    additionalContent: Maple Bistro · Follow us @maplebistro for weekly specials
                    receiptQrType: standard
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
components:
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
      description: 本地化 locale（BCP-47，如 `zh-Hans` / `fr-CA`）——**FE 传当前界面 / 用户语言**；服务端渲染二进制（xlsx）时执行 BCP-47 best-match、再无匹配才回退会话 locale → 商户默认。实际结果经 `Content-Language` 回。
    MerchantContextGuard:
      name: X-Merchant-Context
      in: header
      required: true
      description: |
        stale-tab 一致性守卫（读写统一）：页面预期的当前商户 ID。与会话当前商户比对，一致才执行；不一致时**读不返回错商户数据、写不执行**，并按下面两种情形二分：

        - **① 会话有当前商户、只是与 expected 不同 → `409` · `208001`（`MERCHANT_CONTEXT_CHANGED`）**，响应 `context.currentMerchantId` 回显服务端当前商户供前端直接 re-sync；
        - **② 会话没有当前商户（无可回显者）→ `409` · `208022`（`MERCHANT_NOT_ACCESSIBLE`）**，前端重跑启动链路按 `routeTo` 分流（见 API 基础约定「merchant scope + stale-tab 守卫」）。

        挂在所有依赖当前商户的读 + 写接口；前端统一 interceptor 发送 + 处理 409（提示并刷新当前商户）。

        **豁免**：不依赖「当前商户」的接口——当前商户的 re-sync / 切换入口本身，以及目标由 path 直接指定、与当前商户无关的接口。

        某个接口挂没挂本 header，**看该接口的 `parameters` 即可**（挂了就是必带）。
      schema:
        type: string
        minLength: 1
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: \S
    PageNum:
      name: pageNum
      in: query
      description: 页码(从 1 计;分页)
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数(默认 20;契约上限 200,部署可把实际上限配得更低——超出即 400)
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    SortOrder:
      name: sortOrder
      in: query
      description: 排序方向;与端点自己的 sortField 配对,或作用于端点 description 声明的固定排序键。有排序键、未传本参数 = ascend;端点无排序键且未传 sortField 时本参数无效(不排序)
      schema:
        type: string
        enum:
          - ascend
          - descend
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒。缺键 → 400)
      schema:
        type: string
        minLength: 1
        pattern: \S
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 商户级读写另挂 MerchantContextGuard 守卫（见下方 parameters）。
  schemas:
    AcceptanceMode:
      type: string
      description: 受理模式（取值以后端返回为准）。**封闭 enum**（取值集固定、可穷举分支）；仍须 unknown-safe——遇未识别值保守处理、不静默丢弃。
      enum:
        - in_store
        - online
    PaymentMethodFamily:
      type: string
      description: 支付方式品牌（取值以后端返回为准）。**封闭 enum**（取值集固定、可穷举分支）；仍须 unknown-safe——遇未识别值保守处理、不静默丢弃。
      enum:
        - wechat
        - alipay
        - unionpay
        - credit_card
    PaymentMethodRef:
      type: object
      description: 支付方式展示引用（响应侧；品牌 × 受理模式）。展示字段 family / acceptanceMode / displayName **恒 present**（FE 渲染 + 按 family i18n）；`iconUrl` 没有图标时不返回本键。请求侧提交 methodId 集（`methodIds`）、不复用本对象。
      required:
        - methodId
        - family
        - acceptanceMode
        - displayName
      properties:
        methodId:
          type: string
          minLength: 1
          examples:
            - instore-wechat
            - online-alipay
        family:
          $ref: '#/components/schemas/PaymentMethodFamily'
        acceptanceMode:
          $ref: '#/components/schemas/AcceptanceMode'
        displayName:
          type: string
          description: canonical 默认展示名（品牌名，如 WeChat Pay）；FE 按 family 用自身 i18n 资源本地化、本字段作兜底
        iconUrl:
          type: string
          description: 展示图标 URL；**没有图标时不返回本键**——消费方遇本键缺失即按 family 兜底本地资产
    PaymentMethodCandidate:
      description: 创建向导候选方式（= PaymentMethodRef + **可标价币种能力**，供 currency × method 联动筛选）。展示字段 family / acceptanceMode / displayName 由后端填充、对 FE 必填保证；`iconUrl` 没有图标时不返回本键，此时按 family 兜底。
      required:
        - family
        - acceptanceMode
        - displayName
        - pricingCurrencies
      allOf:
        - $ref: '#/components/schemas/PaymentMethodRef'
        - type: object
          properties:
            pricingCurrencies:
              type: array
              minItems: 1
              uniqueItems: true
              description: 该方式可标价的币种能力（FE 据此按选定 currency 过滤可选方式、反之亦然）
              items:
                $ref: '#/components/schemas/Currency'
    InvoiceCreateConfig:
      type: object
      description: 创建账单的候选配置（供 FE 创建向导；不 hardcode）。
      required:
        - availableCurrencies
      properties:
        availableCurrencies:
          type: array
          uniqueItems: true
          description: 可选标价币种（结算币种 ∪ CNY-if-通道支持；取值以后端返回为准；最终受理在下单时完成；无可标价则空集，非 error）
          items:
            $ref: '#/components/schemas/Currency'
    PaymentLinkCreateConfig:
      type: object
      description: 创建 / 编辑支付链接的候选配置；方式候选为该商户当前可用集、后端返回。 **`default*` 两组只用于「新建且无既存值」**——编辑已有链接时，Buyer / Recipient Information 的初始内容取**该链接自己保存的** `buyerInformation` / `recipientInformation`（见 `getPaymentLink`）， **不得用本响应的默认集覆盖**（否则商户只想改个 banner，保存后采集项就被静默改回默认集）。
      required:
        - availableCurrencies
        - availableMethods
        - defaultBuyerInfo
        - defaultRecipientInfo
      properties:
        availableCurrencies:
          type: array
          uniqueItems: true
          description: 可选标价币种（结算币种 ∪ CNY-if-通道支持；取值以后端返回为准；最终受理在下单时完成；无可标价则空集，非 error）
          items:
            $ref: '#/components/schemas/Currency'
        availableMethods:
          type: array
          description: 候选支付方式（该商户对该链接类型的当前可受理集，**含线上与线下方式**；**每方式带 `pricingCurrencies` 供 currency × method 联动筛选**）
          items:
            $ref: '#/components/schemas/PaymentMethodCandidate'
        defaultBuyerInfo:
          type: array
          uniqueItems: true
          maxItems: 5
          description: '**新建**链接时 Buyer Information 的初始内容（系统级默认，部署可配）。 **`system` 为 `true` 的项文案由系统给出、商户改不了**；**能不能删只看** `mandatory` —— 必填的不给删除按钮，非必填的一律可删（`system: true` 的也一样）。商户还可自撰新项加入（**不存在固定候选目录**）， 自撰项恒为非必填、其标题即数据键、标题不得以 `sys:` 开头。 **只作新建的起点**：编辑已有链接时不要用它（见本 schema 抬头）， 那时取该链接自己保存的那一份（建链接时已冻结，此后系统默认变了也不追溯）。'
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
        defaultRecipientInfo:
          type: array
          uniqueItems: true
          maxItems: 5
          description: |
            **新建**链接时 Recipient Information 的初始内容（**与 `defaultBuyerInfo` 是各自独立的一套**）。属性语义同 `defaultBuyerInfo`。

            **恒返本键**（不是缺键——客户端不必判断键是否存在）：`type=giftcard` 返回其系统项默认集，**其中必含必填的收件人邮箱**（由系统采集项目录保证，不是本响应形状保证）；其余类型恒为**空数组**。

            **本字段在本响应是顶层，但提交时落在** `giftcard.recipientInformation`（内容段内）——与顶层提交的 `buyerInformation` 不同层，别照搬层级。

            ⚠️ **礼卡的收件人邮箱是** `system: true` + `mandatory: true` ——送礼时含密码的凭证要发到它，故渲染为锁定行、不可删也不可改文案。
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
    StoreQrVariantList:
      type: object
      description: 店铺码展示变体集。
      required:
        - variants
      properties:
        variants:
          type: array
          description: |-
            展示变体，**有序**——**第 1 项就是服务端已选定的主变体**（通常是主结算币种的 Standard 码；
            该组合不可用时服务端会在可用变体中选一个）。客户端**照第 1 项渲染主位即可、不要自己挑**；
            **也不要假设它一定是 hosted 码**——若它是 UnionPay QRC，则没有收款页可预览（仅云闪付 App 扫）。

            其余项按返回顺序进「More」入口。**空数组 = 一个变体都没有**，此时不展示主位。
          items:
            $ref: '#/components/schemas/StoreQrVariant'
    StoreQrVariant:
      type: object
      description: 店铺码展示变体（只读）。
      required:
        - variantId
        - currency
        - qrType
        - hostedPage
        - qrContent
      properties:
        variantId:
          type: string
          minLength: 1
          readOnly: true
        currency:
          $ref: '#/components/schemas/Currency'
        qrType:
          type: string
          enum:
            - standard
            - pre_auth
            - unionpay_qrc
          description: Standard / Pre-Auth / UnionPay QRC 变体；封闭 enum（取值集固定、可穷举分支）；仍须 unknown-safe（遇未识别值保守处理）
        hostedPage:
          type: boolean
          description: true = `qrContent` 是 Platform-hosted 收款页地址（可展示 / 复制 / 「在新窗口打开」）；UnionPay QRC = false（银联侧载荷，扫码后交互在云闪付 App 内完成，**不要当链接处理**）
        qrContent:
          type: string
          minLength: 1
          readOnly: true
          description: |-
            **该变体二维码承载的原文**——前端据此自行渲染二维码图形（页内预览大图、下载 PNG 都由前端出图；
            服务端不提供图片端点）。

            下载文件名由前端按 `{merchantCode}-{currency}-{qrType}.png` 拼，
            三段分别取当前商户上下文的商户码（见商户实体契约）、本变体的 `currency`、本变体的 `qrType` **字段原值**（如 `pre_auth`，不做大小写或连字符改写）；分辨率自定，不低于 512×512。

            本键原样使用、**不要解析或改写**：`hostedPage=true` 时它是一个收款页 URL；`false` 时是银联侧载荷（不是 URL）。
        methods:
          type: array
          description: 该变体收款页展示的支付方式（hosted 主 QR 含信用卡；UnionPay QRC 无）
          items:
            $ref: '#/components/schemas/PaymentMethodRef'
    TipConfiguration:
      type: object
      description: merchant 级小费配置（Store QR + 终端收款共用）。
      properties:
        enabled:
          type: boolean
        presets:
          type: array
          minItems: 3
          maxItems: 3
          description: 预设小费档（百分比整数）。**恒 3 档、每档 0–30%（固定约定）**——数量由收款页设置的呈现定，区间是产品约定而非部署旋钮；前端按同一约定预校，服务端兜底拒绝。读面未配置过时返部署默认档位。
          items:
            type: integer
            minimum: 0
            maximum: 30
    TipConfigurationComplete:
      description: 读侧完整形态：`enabled` 与 `presets` **均必返**——商户未配置过时 `presets` 返部署默认三档（前端不要 hardcode 默认值）。属性集单一来源为 `TipConfiguration`，此处只收紧 `required`。
      required:
        - enabled
        - presets
      allOf:
        - $ref: '#/components/schemas/TipConfiguration'
    OrderExpiryMinutes:
      type: integer
      minimum: 1
      description: 订单未支付的自动过期时长，**单位分钟**。这是业务取值本身、不是展示文案—— 展示文案由前端按分钟数格式化（`60` → `1 hour`、`1440` → `24 hours`），**不要把文案回传**。 **允许取值域 = `listOrderExpiryOptions` 下发的候选值集**（后端配置、部署可调），不在其中的值会被拒；本 schema 的 `integer` 只约束形状、不代表任意正整数都可用。
      examples:
        - 30
    InfoFieldKey:
      type: string
      minLength: 1
      maxLength: 64
      description: |
        采集项的**数据键**，写侧用它表示「这一项要留下」（收款页、支付链接的 Buyer / Recipient Information 共用同一形状）。

        两类项的键来路不同：

        - **商户自撰项**——键就是商户打的那串标题：配置时打什么，收款页就原样展示什么，付款人填的值也以这串标题为键收集。改了标题即换了一项，**历史订单保留其当时的键**（那是当时问的问题，不是数据漂移）。
        - **系统项**——键是稳定值、与展示文案无关（见 `InfoFieldEntry`）。
        同一个列表内键**去除首尾空格后不得重复**（重复会在收款页出现两个同名输入框、收集结果还会互相覆盖），保存时校验；
        **商户自撰的标题不得以 `sys:` 开头**（系统项的键一律带该前缀，两类键因此不会相撞），违反时保存被拒。
    InfoFieldEntry:
      type: object
      description: '采集项的**完整形态**，用于**读侧**：既含商户自己加的项，也含系统给出的项。 两个属性各管一件事，别互相推导—— **`system`** 管「文案能不能改」：`true` 的项文案由系统给出、界面上不提供改文案的入口； **`mandatory`** 管「能不能删」：必填的项界面上不给删除按钮，**非必填的一律可删、`system` 的也不例外** （例如收款页的姓名 / 手机号就是 `system: true` + `mandatory: false`，商户可以删掉不收）。 商户自撰的项恒为 `system: false` + `mandatory: false`。'
      required:
        - key
        - label
        - system
        - mandatory
      properties:
        key:
          allOf:
            - $ref: '#/components/schemas/InfoFieldKey'
          description: 该项的数据键。商户自撰项的 `key` 就是其标题；系统项的 `key` 是稳定值、与文案无关。
        label:
          type: string
          minLength: 1
          maxLength: 40
          description: '展示标题。`system: true` 时由系统给出、商户改不了。'
        system:
          type: boolean
          description: '`true` = 系统给出的项（文案不可改，后台据其 `key` 取值）；`false` = 商户自撰项。'
        mandatory:
          type: boolean
          description: 是否必填。**必填即不可删、非必填即可删**，与 `system` 无关。**恒返本键**——它决定界面给不给删除按钮，缺省成非必填会让不可删的项显得可删。
        type:
          type: string
          minLength: 1
          maxLength: 32
          description: 收款页的控件与输入限制提示。本面仅透传呈现。
        needConfirm:
          type: boolean
          description: 收款页是否要在这一项下面再渲染一个确认输入框。本面仅透传呈现。
    PaymentPageSettings:
      type: object
      description: 收款页设置（仅静态码作用域）+ 小费配置。方式区分**候选全集**与**已启用子集**，FE 据此可展示未启用但可选择的方式。
      required:
        - notesEnabled
        - payerInputs
        - availableMethods
        - selectedMethodIds
        - tips
      properties:
        logoRef:
          type: string
          description: 收款页 Logo 引用（文件标识）；未设置 Logo 时不返回本键。换 Logo 时把新 `fileId` 放进保存请求的同名字段
        logoUrl:
          type: string
          format: uri
          readOnly: true
          description: 收款页 Logo 的**可渲染地址**（读时由服务端换出，**只出不入**；供设置页回显与预览）。未设置 Logo（无 `logoRef`）时不返回本键
        notesEnabled:
          type: boolean
          description: 客户备注区总开关（对应设置页 Notes 段的 toggle）。`false` 时收款页不展示商户自撰的那几项，已配置的内容保留、不清空。**系统项不受本开关影响**
        payerInputs:
          type: array
          description: 收款页要向付款人收的**全部采集项**，系统给出的与商户自撰的同在一个列表里，各项按 `system` / `mandatory` 区分。 首次保存本设置时服务端会把这个商户该收的系统项填进来（如姓名 / 手机号）；此后这份列表就是这个商户收款页的真相， **系统侧后来新增的项不会追加进已有配置**。 **合计最多 5 项**（固定上限，系统给的和商户自己加的一起数）、**每条自撰标题 ≤ 10 字符**。
          maxItems: 5
          items:
            $ref: '#/components/schemas/InfoFieldEntry'
        description:
          type: string
          maxLength: 300
          description: 收款页描述；未填写时不返回本键。**≤ 300 字符（固定上限）**——由收款页描述区的呈现定
        availableMethods:
          type: array
          description: 全部候选支付方式（该商户当前可用集；含未启用但可选择的方式）
          items:
            $ref: '#/components/schemas/PaymentMethodRef'
        unavailableMethods:
          type: array
          description: 该商户**尚未开通**、故不可启用的支付方式（与 `availableMethods` 不相交）。页面据此渲染禁用卡片并提示先去服务开通页开通（文案归 UI）；提交的 `methodIds` 里出现它们 → 400。无此类方式时返回空数组。
          items:
            $ref: '#/components/schemas/PaymentMethodRef'
        selectedMethodIds:
          type: array
          uniqueItems: true
          description: 已启用方式 methodId 子集（⊆ availableMethods 的 methodId）
          items:
            type: string
            minLength: 1
        tips:
          $ref: '#/components/schemas/TipConfigurationComplete'
    PaymentPageSettingsWrite:
      type: object
      description: 收款页设置保存请求（PaymentPageSettings + TipConfiguration）。
      additionalProperties: false
      minProperties: 1
      properties:
        logoRef:
          type:
            - string
            - 'null'
          description: 收款页 Logo 引用（文件标识）；取自 createPaymentPageLogoUploadTarget 返回的 fileId。置 `null` 即移除 Logo
        notesEnabled:
          type: boolean
          description: 客户备注区总开关
        payerInputKeys:
          type: array
          uniqueItems: true
          description: |
            **保留下来的采集项，按 `key` 给全**——不是「商户新加的那几个」。

            读回来的 `payerInputs` 里哪些项要留下，就把哪些项的 `key` 放进来，删掉的不放；新加的自撰项直接放它的标题。

            **为什么要给全**：系统项现在也能删（非必填的那些），只提交自撰项的话服务端分不清「商户删了姓名」和「商户没动系统项」，编辑一次就会把删除意图丢掉。

            **必填项一个都不能少**——少了整次保存被拒（`409 PRODCFG_INFO_FIELDS_INVALID (208030)`）；自撰的标题不能以 `sys:` 开头。系统项的文案与必填性以服务端已存的为准，这里只表达「留不留」。

            **合计最多 5 项**（系统给的和商户自己加的一起数）。
          maxItems: 5
          items:
            $ref: '#/components/schemas/InfoFieldKey'
        description:
          type:
            - string
            - 'null'
          maxLength: 300
          description: 收款页描述；传 `null` 清空。超出 300 字符 → 400 字段级错误
        methodIds:
          type: array
          minItems: 1
          uniqueItems: true
          description: 启用的方式 methodId 集（保存前经受理校验；至少 1）
          items:
            type: string
            minLength: 1
        tips:
          $ref: '#/components/schemas/TipConfiguration'
    InvoiceStatus:
      type: string
      description: 账单核心态。
      enum:
        - UNPAID
        - PAID
        - OVERDUE
        - VOIDED
    DueDate:
      type: object
      description: 到期日：无到期 / 指定日期二选一。
      required:
        - kind
      properties:
        kind:
          type: string
          enum:
            - no_due_date
            - custom
        date:
          oneOf:
            - $ref: '#/components/schemas/LocalDate'
            - type: 'null'
          description: '`kind=custom` 必填。到期日期，**须 ≥ 次日**（「次日」按服务端认定,前端不要自己按浏览器时区判）。**所选日整日有效**。'
    InvoiceCreateRequest:
      type: object
      required:
        - amount
        - dueDate
      properties:
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        dueDate:
          $ref: '#/components/schemas/DueDate'
        description:
          type:
            - string
            - 'null'
          maxLength: 300
          description: 账单说明；传 `null` 清空。**≤ 300 字符（固定上限）**——与收款页 Description 同为商户自填的展示文本，取同一上限
    InvoiceListItem:
      type: object
      required:
        - invoiceId
        - amount
        - status
        - createdAt
        - createdDate
      properties:
        invoiceId:
          type: string
          readOnly: true
        amount:
          $ref: '#/components/schemas/Money'
        description:
          type: string
          readOnly: true
          description: 账单描述（列表 Description 列直接渲染）；创建时未填则不返回本键
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        dueDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 到期日；**无期限时不返回本键**。**所选日整日有效**（当天仍可付）。
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        createdDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          readOnly: true
          description: 创建日（服务端固化）。按创建日期筛选筛的就是它。
    InvoiceDetail:
      allOf:
        - $ref: '#/components/schemas/InvoiceListItem'
        - type: object
          properties:
            description:
              type: string
              description: 账单描述；**创建时未填则不返回本键**（同 `InvoiceListItem.description`）
            paymentUrl:
              type: string
              description: 付款链接整串（前端纯呈现）
            paidOrderId:
              type: string
              description: PAID 时的 Payment Order ID（跳转交易管理）；**未支付则不返回本键**
            hidden:
              type: boolean
              description: PAID 展示隐藏标记
    InvoiceSummary:
      type: object
      description: 页顶汇总（已隐藏 PAID 不计入）。**币种口径**：单商户结算币种固定、Invoice 标价 ∈ {结算币种, CNY}； 计数含全部 Invoice（跨标价币种）；Paid 金额按实际结算金额（结算币种）统一合计；CNY 标价的 Unpaid / Overdue 结算额未定 → **CNY 独立小计、不与结算币种混加**。
      required:
        - paid
        - unpaid
        - overdue
        - totalCount
        - totalReceivables
      properties:
        paid:
          $ref: '#/components/schemas/InvoiceSummaryCell'
        unpaid:
          $ref: '#/components/schemas/InvoiceSummaryCell'
        overdue:
          $ref: '#/components/schemas/InvoiceSummaryCell'
        totalCount:
          type: integer
          minimum: 0
          description: '**三格数量占比的分母** = 该商户全部 Invoice 计数（**含** `VOIDED`、跨标价币种；与三格同样不计已隐藏的 `PAID`）。 **不要用 `paid + unpaid + overdue` 当分母**（那样漏掉 `VOIDED`、占比会偏大），也不要用列表页的 `total`（那个随筛选变，而本汇总不随筛选）。'
        totalReceivables:
          $ref: '#/components/schemas/TotalReceivables'
    InvoiceSummaryCell:
      type: object
      description: 单状态汇总：count = 全部 Invoice 计数（跨标价币种）；settlementAmount = 结算币种小计；cnyAmount = CNY 标价小计（Unpaid / Overdue 独立呈现；Paid 已结算并入 settlementAmount，故 Paid 格不返回 cnyAmount，无 CNY 标价时同样不返回）。
      required:
        - count
        - settlementAmount
      properties:
        count:
          type: integer
          minimum: 0
        settlementAmount:
          $ref: '#/components/schemas/Money'
        cnyAmount:
          description: CNY 标价小计（Unpaid / Overdue 未结算金额，独立不混加）；**Paid 格与无 CNY 标价时不返回本键**
          allOf:
            - $ref: '#/components/schemas/Money'
    ReceivableBreakdown:
      type: object
      description: 单一币种应收拆分（total = current 未逾期 + overdue 逾期）。Current / Overdue 为固定展示项，**必返**；空值用同币种 `0`（非 null）。
      required:
        - total
        - current
        - overdue
      properties:
        total:
          $ref: '#/components/schemas/Money'
        current:
          $ref: '#/components/schemas/Money'
        overdue:
          $ref: '#/components/schemas/Money'
    TotalReceivables:
      type: object
      description: 应收总额 = Unpaid + Overdue，含 Current vs Overdue 拆分；按结算币种 + CNY 标价分别呈现（不混加）。
      required:
        - settlement
      properties:
        settlement:
          $ref: '#/components/schemas/ReceivableBreakdown'
        cny:
          description: CNY 标价应收（同结构，独立不与 settlement 混加）；**无 CNY 标价未收时不返回本键**
          allOf:
            - $ref: '#/components/schemas/ReceivableBreakdown'
    InvoiceListPage:
      type: object
      required:
        - total
        - data
      properties:
        total:
          type: integer
          minimum: 0
        data:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceListItem'
    PaymentLinkType:
      type: string
      enum:
        - giftcard
        - product
        - ticket
    PaymentLinkStatus:
      type: string
      enum:
        - ACTIVE
        - DISABLED
        - DELETED
    SaleWindow:
      type: object
      description: 销售窗口（窗口外不可售）。
      properties:
        start:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        end:
          anyOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    SaleWindowRead:
      description: '`SaleWindow` 的读侧形态：属性定义仍单一来源于 `SaleWindow`，此处只把可清空字段收窄为非空——**响应里未设置的边界不返回本键、不返** `null`。'
      allOf:
        - $ref: '#/components/schemas/SaleWindow'
        - properties:
            start:
              $ref: '#/components/schemas/Timestamp'
            end:
              $ref: '#/components/schemas/Timestamp'
    SalesItemId:
      type: string
      minLength: 1
      maxLength: 64
      description: |-
        这一项（商品 / 票档 / 面值档）的标识，**服务端签发、内容不透明——不要解析它、不要自己拼**。
        **编辑时它决定改还是新增**：把详情里读到的 `itemId` 原样带回 = 改这一项； 不带 = 新增一项。**这次没带回的既有项视为下架**，之后不再出现在详情与收款页里。 下架不是删除——已经卖出去的份数、正在支付中的订单仍然算在它头上，退款也照常回补到它。
        创建链接时**不要带**；带了一个不属于本链接的值 → `409 PRODCFG_ITEM_UNKNOWN (208032)`， 整次保存被拒（多半是页面拿的是过期列表，重新加载再改）。
    SalesItemCommittedQuantity:
      type: integer
      minimum: 0
      readOnly: true
      description: 这一项**已经卖掉 + 正被在途订单占着**的份数，也就是可售上限能改到的最小值 （商品的 `stock` / 票档的 `capacity` / 面值档的 `salesLimit`）。**只出不入**。 改上限前用它做本地校验与提示（「不能低于 N」）；服务端也会再查一遍。
    GiftcardDenomination:
      type: object
      description: 面值档。`amount` = 主卡面值（Card Value）；`price` = 对外标价，**不等同支付金额**—— `promotionType=discount` 时支付额 = price − discountAmount，`=bonus_card` 时支付额 = price 且另获赠卡。 库存字段按履约模式二选一：Inventory Mode 用只读 `stock`，Voucher Mode 用可配 `salesLimit`。
      required:
        - amount
      properties:
        itemId:
          $ref: '#/components/schemas/SalesItemId'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        price:
          description: 对外标价（留空 = 按面值标价）
          anyOf:
            - $ref: '#/components/schemas/PositiveMoney'
            - type: 'null'
        discountAmount:
          description: 折扣额（仅 `promotionType=discount` 适用；写侧传 `null` 清空，读侧不适用时不返回本键）
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        bonusCardAmount:
          description: 赠卡金额（仅 `promotionType=bonus_card` 适用；写侧传 `null` 清空，读侧不适用时不返回本键）
          anyOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        bonusTerms:
          description: 赠卡条款（`promotionType=bonus_card` 时必填）：same_as_main = 范围/有效期同主卡；custom = 独立规则，须填 bonusNotes
          oneOf:
            - type: string
              enum:
                - same_as_main
                - custom
            - type: 'null'
        bonusNotes:
          type:
            - string
            - 'null'
          description: 赠卡备注（`bonusTerms=custom` 时**必填**，说明使用范围 / 有效期 / 限制；缺失拒绝保存）
        stock:
          type: integer
          minimum: 0
          readOnly: true
          description: 该面值档已导入卡量（**仅 Inventory Mode、只读**）。本期卡密由运营整理后交技术按面值导入， **商户后台不提供上传 / 补货入口**（自助库存管理归二期）；尚未导入时不返回本键。
        salesLimit:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 该面值档销售数量上限（**仅 Voucher Mode**；达上限即该档售罄）。**改小有下界**：不能低于 `committedQuantity`（见该字段），否则整次保存被拒（`409 PRODCFG_ITEM_LIMIT_BELOW_COMMITTED (208031)`）；清空（不限量）永远可以
        committedQuantity:
          $ref: '#/components/schemas/SalesItemCommittedQuantity'
    GiftcardDenominationRead:
      description: '`GiftcardDenomination` 的读侧形态：只收窄可清空字段——**响应里不适用 / 未设置的一律不返回本键、不返** `null`（如 `discountAmount` 只在 `promotionType=discount` 时出现）。`itemId` 与 `committedQuantity` 详情必返。'
      required:
        - itemId
        - committedQuantity
      allOf:
        - $ref: '#/components/schemas/GiftcardDenomination'
        - properties:
            price:
              $ref: '#/components/schemas/PositiveMoney'
            discountAmount:
              $ref: '#/components/schemas/Money'
            bonusCardAmount:
              $ref: '#/components/schemas/Money'
            bonusTerms:
              type: string
              enum:
                - same_as_main
                - custom
            bonusNotes:
              type: string
            salesLimit:
              type: integer
              minimum: 0
    GiftcardContent:
      type: object
      description: 礼卡销售内容。`fulfillmentMode` **是唯一表达库存与核销业务模式的字段**： Inventory Mode 发预先导入的真品牌卡、无平台核销；Voucher Mode 发系统生成兑换券、门店核销 + 可 Void。 创建后**不可变更**；`redemptionRule` 仅 Voucher Mode 可提交。
      properties:
        giftCardName:
          type: string
          minLength: 1
          description: 用户可见礼卡商品名（邮件标题 / 礼卡展示 / 订单详情）
        brandName:
          type: string
          minLength: 1
          description: 礼卡所属品牌名
        brandLogoRef:
          type:
            - string
            - 'null'
          description: 品牌 Logo 引用（方形预览）；取自 createPaymentLinkAssetUploadTarget（purpose=payment_link_brand_logo）返回的 fileId。**提交时用它**
        brandLogoUrl:
          type: string
          format: uri
          readOnly: true
          description: 品牌 Logo 的**可渲染地址**（读时由服务端换出，**只出不入**）。未设置品牌 Logo（无 `brandLogoRef`）时不返回本键
        campaignName:
          type: string
          minLength: 1
          description: 后台活动名，供运营 / 财务 / 排查用，**不面向持卡人**。与 brandName / giftCardName 分开维护、互不替代
        promotionType:
          type: string
          enum:
            - discount
            - bonus_card
          description: 促销类型
        fulfillmentMode:
          type: string
          enum:
            - inventory
            - voucher
          description: 履约模式；**创建后不可变更**，改则拒绝
        redemptionRule:
          description: 核销规则——**仅 Voucher Mode 可提交**，Inventory Mode 提交则拒绝保存。 本期取值集合仅 `one_time`（现网只支持一次核销），提交其他值拒绝；字段在契约中保留以便将来放开。
          oneOf:
            - type: string
              enum:
                - one_time
            - type: 'null'
        emailLanguage:
          type: string
          enum:
            - en
            - zh
            - fr
          description: 凭证邮件模板语言；**只影响邮件**，与活动页 Policies 多语言相互独立
        maxPurchaseQuantity:
          type:
            - integer
            - 'null'
          minimum: 1
          description: '**数量轴限购**：单个可识别用户在限制范围内可购**张数**（**无独立每单上限**——张数只有这一条口径）。可选、**无平台默认值**；留空 = 不设张数上限'
        maximumPurchaseAmount:
          description: '**面值轴限购**：单个可识别用户在限制范围内可购的**累计礼卡面值**上限。 **币种跟随本链接的标价币种、不单独选**（提交时按该币种给；与 `denominations[].amount` 同币种）。 与 `maxPurchaseQuantity` **并行、同时生效**，任一命中即拒绝下单。 留空 = 不设面值上限（**不影响张数上限**）。'
          oneOf:
            - $ref: '#/components/schemas/PositiveMoney'
            - type: 'null'
        purchaseLimitCycle:
          description: 限购周期，**数量与面值两轴共用**；开启时按滚动周期计数，关闭（null）时按活动存续期整体累计
          oneOf:
            - type: string
              enum:
                - daily
                - weekly
                - biweekly
                - monthly
            - type: 'null'
        purchaseCounterResetAt:
          readOnly: true
          description: 最近一次状态切换（ACTIVE ⇄ DISABLED）导致的限购计数重置时点。**只是重置事实的时点**，不等于当前计数窗口的起点（开了滚动周期时窗口起点另受周期回溯约束，由后端判定、本面不算）。**从未切换过则不返回本键**；只读展示，不可提交。
          allOf:
            - $ref: '#/components/schemas/Timestamp'
        orderRiskReview:
          type:
            - boolean
            - 'null'
          description: 订单风控审核开关。**仅管收款后的发放闸**——建单前的准入风控不由本字段控制。这是唯一的活动级风控配置项：人工复核 / 升为高风险 / 加入礼卡客户风险名单**不是**活动级配置
        campaignEndDate:
          allOf:
            - $ref: '#/components/schemas/LocalDate'
          description: 活动截止日，**须 ≥ 今天**（「今天」按服务端认定,前端不要自己按浏览器时区判）。**所选日整日可售**。
        slogan:
          type:
            - string
            - 'null'
          maxLength: 80
          description: 活动标语；传 `null` 清空。**≤ 80 字符（固定上限）**
        bannerRef:
          type:
            - string
            - 'null'
          description: Banner 引用；取自 createPaymentLinkAssetUploadTarget（purpose=payment_link_banner）返回的 fileId。**提交时用它**
        bannerUrl:
          type: string
          format: uri
          readOnly: true
          description: Banner 的**可渲染地址**（读时由服务端换出，**只出不入**）。未设置 Banner（无 `bannerRef`）时不返回本键
        denominations:
          type: array
          minItems: 1
          maxItems: 10
          description: 面值档，**1–10 条（上限固定）**
          items:
            $ref: '#/components/schemas/GiftcardDenomination'
        recipientInformation:
          type: array
          uniqueItems: true
          maxItems: 5
          writeOnly: true
          description: |
            **保留下来的收件人信息采集项，按 `key` 给全**（形状与规则同顶层 `buyerInformation`，**最多 5 项、系统项与自撰项合计**）。

            ⚠️ **本字段只用于写侧**——读回来时收件人采集项在**详情顶层**的 `recipientInformation`（`InfoFieldEntry` 完整对象），不在本段内。

            新建时以 `PaymentLinkCreateConfig.defaultRecipientInfo` 为起点，编辑时以 `getPaymentLink` 回显的顶层 `recipientInformation` 为起点。

            ⚠️ **收件人邮箱是必填的系统项、删不掉**——送礼那封含密码的邮件就寄到它，没有它这单交付不出去。
          items:
            $ref: '#/components/schemas/InfoFieldKey'
    GiftcardContentRead:
      description: '`GiftcardContent` 的读侧形态：属性定义仍单一来源于 `GiftcardContent`，此处只把可清空字段收窄为非空、并把面值档换成读侧变体——**响应里未设置 / 不适用的一律不返回本键、不返** `null`。'
      allOf:
        - $ref: '#/components/schemas/GiftcardContent'
        - properties:
            brandLogoRef:
              type: string
            redemptionRule:
              type: string
              enum:
                - one_time
            maxPurchaseQuantity:
              type: integer
              minimum: 1
            maximumPurchaseAmount:
              $ref: '#/components/schemas/PositiveMoney'
            purchaseLimitCycle:
              type: string
              enum:
                - daily
                - weekly
                - biweekly
                - monthly
            orderRiskReview:
              type: boolean
            slogan:
              type: string
            bannerRef:
              type: string
            denominations:
              type: array
              items:
                $ref: '#/components/schemas/GiftcardDenominationRead'
    GiftcardContentComplete:
      description: 礼卡内容的**完整形态**：创建提交时**缺其一即** `400`；详情响应中这些字段**必返**。 属性集单一来源为 `GiftcardContent`，此处只收紧 `required`（更新提交用裸 `GiftcardContent`，部分更新不设必填）。
      required:
        - giftCardName
        - brandName
        - campaignName
        - promotionType
        - fulfillmentMode
        - emailLanguage
        - campaignEndDate
        - denominations
      allOf:
        - $ref: '#/components/schemas/GiftcardContent'
    GiftcardContentCompleteRead:
      description: 详情响应用的礼卡内容：必填集同 `GiftcardContentComplete`（创建面），可空字段按读侧收窄（`GiftcardContentRead`）。两支的差别仅在方向，属性集仍单一来源。
      allOf:
        - $ref: '#/components/schemas/GiftcardContentComplete'
        - $ref: '#/components/schemas/GiftcardContentRead'
    ProductItem:
      type: object
      required:
        - name
        - price
      properties:
        itemId:
          $ref: '#/components/schemas/SalesItemId'
        name:
          type: string
          minLength: 1
        price:
          $ref: '#/components/schemas/PositiveMoney'
        stock:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 留空 = 不限量。**改小有下界**：不能低于 `committedQuantity`（见该字段），否则整次保存被拒（`409 PRODCFG_ITEM_LIMIT_BELOW_COMMITTED (208031)`）；改成不限量永远可以
        committedQuantity:
