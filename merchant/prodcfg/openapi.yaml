                      - key: sys:email
                        label: Email
                        system: true
                        mandatory: true
                        type: email
                        needConfirm: true
                      - key: 公司抬头
                        label: 公司抬头
                        system: false
                        mandatory: false
                    recipientInformation:
                      - key: sys:name
                        label: Recipient Name
                        system: true
                        mandatory: true
                        type: text
                      - key: sys:email
                        label: Recipient Email
                        system: true
                        mandatory: true
                        type: email
                    policies: {}
                    paymentUrl: https://cashier.example.com/pl/pl_1000024_3001
