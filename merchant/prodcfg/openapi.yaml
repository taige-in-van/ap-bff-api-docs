      description: |
        按 link scope 展示只读**核销**记录（分页 / 搜索 / 过滤）：

        - product / ticket = 到店自提 / 入场核销；
        - **giftcard 仅 Voucher Mode** = 门店核销记录（券号 / 门店 / 终端 / 操作人 / 核销时间 / 状态）。

        ⚠️ **giftcard Inventory Mode 无平台核销**——本 tab 置灰不可点击、`total` 恒 0；
        其发卡 / 投递情况在**订单详情**呈现（交易管理的 `getPaymentDetail` 的 `giftCard` 段），不走本端点。

        核销为整单一次性，**不含已用金额 / 剩余余额**（非储值）。只读呈现、不在此创建 / 发起核销。

        排序键固定为核销时间（本端点不设排序字段参数）：`sortOrder=descend` = 最近核销在前（页面默认顺序，由前端显式传）、`ascend` = 反向、不传 = 不排序；尚未核销的记录恒在末尾、升降序都一样。
      parameters:
        - $ref: '#/components/parameters/MerchantContextGuard'
        - $ref: '#/components/parameters/PageNum'
        - $ref: '#/components/parameters/PageSize'
        - name: linkId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
        - name: keyword
          in: query
          required: false
          description: 按核销码 / 券号 / 门店 / 操作人搜索
          schema:
            type: string
        - $ref: '#/components/parameters/SortOrder'
        - name: status
          in: query
          required: false
          description: 按核销态过滤（取值同 `VoucherRedemptionRecord.status`）
          schema:
            type: string
            enum:
              - ISSUED
              - REDEEMED
              - VOID
              - CANCELED
      responses:
        '200':
          description: Redemptions 记录（核销记录）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RedemptionListPage'
              examples:
                voucherMode:
                  summary: 礼卡 Voucher Mode 门店核销记录
                  value:
                    total: 2
                    data:
                      - recordId: rd_1000024_5001
                        code: VC-8842-1907
                        redeemedAt: '2026-08-02T15:24:00Z'
                        store: downtown-store
                        terminal: SN-2026-0001
                        operator: cashier01@merchant.com
                        status: REDEEMED
                      - recordId: rd_1000024_5002
                        code: VC-8842-1908
                        status: ISSUED
                inventoryMode:
                  summary: 礼卡 Inventory Mode —— 无平台核销，恒 0 条（本 tab 置灰）
                  value:
                    total: 0
                    data: []
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208001
