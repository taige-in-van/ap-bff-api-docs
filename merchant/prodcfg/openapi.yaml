          description: 商品项，**1–10 条（上限固定）**
          items:
            $ref: '#/components/schemas/ProductItem'
    ProductContentRead:
      description: '`ProductContent` 的读侧形态：本身无可清空字段，仅把商品项换成读侧变体。'
      allOf:
        - $ref: '#/components/schemas/ProductContent'
        - properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ProductItemRead'
    ProductContentComplete:
      description: 商品内容的**完整形态**：创建提交时缺 `items` 即 `400`；详情响应中 `items` 必返。 属性集单一来源为 `ProductContent`，此处只收紧 `required`。
      required:
        - items
      allOf:
        - $ref: '#/components/schemas/ProductContent'
    ProductContentCompleteRead:
      description: 详情响应用的商品内容：必填集同 `ProductContentComplete`（创建面），可空字段按读侧收窄（`ProductContentRead`）。
      allOf:
        - $ref: '#/components/schemas/ProductContentComplete'
        - $ref: '#/components/schemas/ProductContentRead'
    TicketTier:
      type: object
      required:
        - name
        - price
      properties:
        itemId:
          $ref: '#/components/schemas/SalesItemId'
        name:
          type: string
          minLength: 1
        price:
          $ref: '#/components/schemas/PositiveMoney'
        capacity:
          type:
            - integer
            - 'null'
          minimum: 0
          description: 该票档放多少张。**留空 = 不限量**（同商品项的 `stock`）。**改小有下界**：不能低于 `committedQuantity`（见该字段），否则整次保存被拒（`409 PRODCFG_ITEM_LIMIT_BELOW_COMMITTED (208031)`）；改成不限量永远可以
        committedQuantity:
          $ref: '#/components/schemas/SalesItemCommittedQuantity'
        saleWindow:
          $ref: '#/components/schemas/SaleWindow'
    TicketTierRead:
      description: '`TicketTier` 的读侧形态：收窄可清空字段 + 销售窗口换读侧变体——**不限量时不返回 `capacity` 键、不返** `null`（同商品项的 `stock`）。`itemId` 与 `committedQuantity` 详情必返。'
      required:
        - itemId
        - committedQuantity
      allOf:
        - $ref: '#/components/schemas/TicketTier'
        - properties:
