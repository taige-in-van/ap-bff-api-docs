      operationId: updatePaymentLink
      summary: 编辑支付链接配置
      description: |
        编辑配置段（Name / Currency / 类型内容 / Payment methods / Buyer Information / Banner / giftcard meta）。

        `type` 须与该链接现有类型一致（链接类型创建后不可变更），它只用于选定内容子对象、不构成改动。

        **卖出去之后照样能改**——名称、售价、销售窗口、活动信息、币种都可以改，**不会因为这条链接已经有订单就锁住**。
        已成交的订单不受影响：它在下单那一刻就把自己买的东西（名称 / 单价 / 数量 / 金额 / 币种 / 活动与品牌信息）
        抄了一份存着，之后链接怎么改都不动它。所以卖出一单后发现标题有错别字，直接改就行。
        **唯一改不了的是礼卡的履约模式**，那是创建时就定死的、跟卖没卖过无关（见下）。

        ⚠️ **改商品 / 票档 / 面值档时，每一项要把详情里读到的 `itemId` 原样带回**——带回 = 改这一项，
        不带 = 新增一项，**没带回的既有项按下架处理**。漏带 `itemId` 不会报错，但会被当成
        「下架旧的、另加一个新的」：新项从零开始卖，旧项的销量与在途订单留在下架的那一项上。
        改可售上限还有个下界——不能低于该项的 `committedQuantity`
        （`409 PRODCFG_ITEM_LIMIT_BELOW_COMMITTED 208031`，响应里带上那个数）；
        带了不属于本链接的 `itemId` → `409 PRODCFG_ITEM_UNKNOWN 208032`，整次保存被拒。

        方式收窄 + **currency × methods 组合校验同 createPaymentLink**——**单改 Currency 校验已有 Methods、单改 Methods 校验现 Currency**（任一不兼容 → `409 PAYMENT_METHOD_NOT_ACCEPTABLE 208007`）；内容币种须 = 顶层 currency（不一致 → `400 CONTENT_CURRENCY_MISMATCH 204006`）。
        **礼卡内容规则同 createPaymentLink**（→ `400 GIFTCARD_CONTENT_INVALID 204013`）；**履约模式创建后不可变更**——请求携带与已存实例不同的 `fulfillmentMode` → `409 GIFTCARD_FULFILLMENT_MODE_IMMUTABLE (208017)`（该字段本就不应可编辑，前端不提供入口）。

        **素材引用在本步生效**（`bannerRef` / `brandLogoRef`，取自 createPaymentLinkAssetUploadTarget）：所引文件**确定未就位**（直传未完成 / 被存储端拒收）→ `400 FILE_NOT_IN_PLACE (204014)`，**整次编辑不生效**。
        该码是终态、不可原样重试——须**重新取直传目标**（得到**新** `fileId`）、重新直传，再用新引用提交；**不要向原目标补传**（直传目标是一次性的，提交失败即作废）。

        **暂时判不出**（上游不可达 / 超时）→ `502` / `504`：**不必重传**，原样重试本请求。

        天然幂等 PUT（同 payload 重放一致），不挂 Idempotency-Key。
