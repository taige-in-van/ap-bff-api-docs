          $ref: '#/components/schemas/SaleWindow'
    ProductItemRead:
      description: '`ProductItem` 的读侧形态：收窄可清空字段 + 销售窗口换读侧变体——**不限量时不返回 `stock` 键、不返** `null`。`itemId` 与 `committedQuantity` 详情必返。'
      required:
        - itemId
        - committedQuantity
      allOf:
        - $ref: '#/components/schemas/ProductItem'
        - properties:
            stock:
              type: integer
              minimum: 0
            saleWindow:
              $ref: '#/components/schemas/SaleWindowRead'
    ProductContent:
      type: object
      properties:
        items:
          type: array
          minItems: 1
