# 收单配置（Store QR / 收款页 / Invoice / Payment Link / 设备 / 配置）—— 调用时序

> 本文是 `openapi.yaml` 的**调用顺序伴档**：OpenAPI 讲清每个接口的入参 / 出参 / 错误码（WHAT），本文讲清**多步流程里先调谁、后调谁、分支怎么走**（HOW）。
>
> **视角**：浏览器(SPA) ↔ BFF。前端只与 BFF 交互；BFF 内部委派**不画**（后端面，与前端无关）；核心态变化（账单被支付 / 设备首次登录激活）由系统驱动、前端靠刷新读到。外部参与方（收款设备等）仅在用户可见 / 真参与异步交互时出现；点击 / 填写 / 确认等用户操作属 SPA 内部交互，不单列 actor。
>
> **接口 ID = `operationId`**：下方每个发往 BFF 的调用都标 `[operationId]`（OpenAPI 原生、全局唯一、生成客户端方法名）。**图例表与正文里的 operationId 可点深链**直达 ReDoc；时序图**内**的 `[operationId]` 受 Mermaid 限制不可点，点同名链接即可。
>
> **通用约定**（每条流程都成立，不在图里重复）：浏览器**不持 token**——靠 httpOnly 会话 cookie(`__Host-msession`)；非安全方法一律带 `X-CSRF-Token`；**所有当前商户相关读写携带 `X-Merchant-Context`**——守卫语义与 409 分流见 API 基础约定「merchant scope + stale-tab 守卫」；目标资源不在可访问范围 → 404；错误体统一 `ErrorEnvelope`（整数 `code` → 前端策略；本域在其上附加 `context`）。
>
> ⚠️ **design / review 阶段**契约 —— 实现前可能调整，勿当冻结契约。

## 读类与单调用写：无编排

下列端点是**单次调用**（页面直接调用、无多步时序），不画图：

- **列表 / 详情读**：`listStoreQrVariants` / `listInvoices` / `getInvoice` / `listPaymentLinks` / `getPaymentLink` / `getPaymentLinkRedemptions` / `listDevices` / `getDevice` / `listDeviceLogs`（`format=xlsx` 同一端点导出）—— BFF 内部取数、前端只见聚合结果。
- **顶部 chip**：账单 / 支付链接 / 设备 / 设备日志四个列表各有一排 chip，分别另取 `getInvoiceCounts` / `getPaymentLinkCounts` / `getDeviceCounts` / `getDeviceLogCounts`，取法见公共约定「列表页顶部的快捷筛选」。⚠️ 账单页的 `getInvoiceSummary` **不是** chip 计数——它是页顶三格汇总卡，恒按商户全量算、不随筛选变，两者不可互相核对。
- **二进制下载**：`downloadInvoicePoster`（账单海报 = 收款 QR + 品牌 + 金额 + 当前可用支付方式标识）/ `downloadPaymentLinkQr`（收款 QR）—— `image/png` + `Content-Disposition: attachment`；**Copy Link 是前端本地复制 paymentUrl、不调端点**。⚠️ **店铺码不在此列**——它没有图片端点，前端拿 `listStoreQrVariants` 回的 `qrContent` 自行出图（预览与下载都在前端完成）。
- **创建向导前置读**：`getInvoiceCreateConfig` / `getPaymentLinkCreateConfig` —— 取可选标价币种 / 方式候选（含各方式 `pricingCurrencies`），驱动创建表单与 currency × method 联动；`getPaymentLinkCreateConfig` **须先选链接类型**（候选按类型给）。候选为空时按空列表渲染（见流程一 / 三）。
- **配置单调用写**：`savePaymentPageSettings`（两组共同成功 / 失败；保存前经受理判定收窄校验，方式空 → 400、不通过 → 409；**换 Logo 时是三步流程，见流程四**）/ `savePaymentLinkPolicies`（同步商户级默认）/ `setPaymentLinkStatus` / `setOrderExpiry` / `setCustomerServiceFee` / `saveReceiptContent` —— 天然幂等 PUT。
- **Payment Link Transactions tab**：调本域的 [`getPaymentLinkTransactions`](index.html#tag/payment-links/operation/getPaymentLinkTransactions) 取该链接的交易列表（按交易时间倒序）——**行形状与交易管理的交易列表逐字段相同**，行组件可直接复用。**行内退款不在本端点、且是两跳**：先调 [`getPaymentDetail`](../txview/index.html#tag/payments/operation/getPaymentDetail) 做可退额预检（行里的 `refundable` 只表示入口可见、不含金额上限），再调 [`createRefund`](../txview/index.html#tag/payments/operation/createRefund) 提交——两跳都在交易管理契约里，退款规则 / PIN / 幂等口径全在那边。展示名兜底同理走那边的 [`getTransactionFilterOptions`](../txview/index.html#tag/payments/operation/getTransactionFilterOptions)（商户级候选目录，不随页面变）。

## 流程一：账单创建 → 分享 → 作废 / 隐藏

> 创建前先取可选币种候选；BFF 内部命令不画。作废分「有无未终态支付尝试」分支。

```mermaid
sequenceDiagram
    autonumber
    participant B as 浏览器(SPA)
    participant A as 商户后台 BFF

    Note over B,A: 打开创建向导先取候选
    B->>A: [getInvoiceCreateConfig]
    A-->>B: 200 可选标价币种集
    B->>B: 渲染 Currency 下拉（限候选）+ Amount + Due Date
    B->>A: [createInvoice]（Idempotency-Key）
    Note over A: 系统创建账单 UNPAID + 生成付款链接
    A-->>B: 201 InvoiceDetail（含 paymentUrl 整串）
    B->>B: 展示账单详情 + Copy Link（本地复制 paymentUrl）
    opt 下载收款海报
        B->>A: [downloadInvoicePoster]
        A-->>B: 200 image/png（QR + 品牌 + 金额 + 可用方式标识；attachment）
    end

    opt 针对已存在账单（列表行 Delete；新建成功后或从列表打开）——作废或隐藏
        B->>A: [deleteInvoice]
        alt UNPAID / OVERDUE 且无未终态支付尝试
            Note over A: 系统作废账单（VOIDED、链接失效）
            A-->>B: 200 InvoiceDetail（status=VOIDED）
        else 存在未终态支付尝试
            A-->>B: 409 INVOICE_HAS_PENDING_PAYMENT
            B->>B: 提示待支付结果收敛后再操作
        else PAID
            Note over A: 隐藏已支付记录（不改已付事实）
            A-->>B: 200 InvoiceDetail（hidden=true）
        end
    end
```

## 流程二：设备预登记 → 该设备首次登录激活（跨域）

> 设备生命周期由系统驱动、BFF 内部命令不画。**激活由该设备首次登录时匹配预登记触发**（跨域、无扫码交互），前端靠刷新列表读到 ACTIVE。

```mermaid
sequenceDiagram
    autonumber
    participant B as 浏览器(SPA)
    participant A as 商户后台 BFF
    actor DEV as 收款设备

    B->>A: [bindDevice]（Idempotency-Key；Model / 家族 / SN / Source / Store）
    alt 该设备（家族 + SN 决定的身份）已被在册设备占用
        A-->>B: 409 DEVICE_SERIAL_TAKEN（208021）
        B->>B: 渲染成 Serial Number 的字段级错误、不创建
    else 可绑定
        Note over A: 系统建 PENDING_ACTIVATION（定商户 / 店铺归属；不签发凭据）
        A-->>B: 201 DeviceDetail（PENDING_ACTIVATION）
        B->>B: 提示「待该设备首次登录后自动激活」

        DEV->>DEV: 操作员在该设备上登录（设备自带标识与本条预登记匹配）
        Note over DEV: 匹配成功 → 设备取得凭据并转 ACTIVE（不经浏览器）
        B->>A: [listDevices]（刷新）
        A-->>B: 200 设备列表（该设备 ACTIVE + 连接健康）
    end
```

## 流程三：支付链接类型化创建向导

> 选类型 → 取该类型候选（驱动 currency × method 联动）→ **可选：先传 Banner / 品牌 Logo**（素材直传目标**不需要链接已存在**）→ 创建链接（可一并带素材引用，成功返回 linkId + 链接详情）→ **详情阶段**按需改图 / 编辑 Policies。

```mermaid
sequenceDiagram
    autonumber
    participant B as 浏览器(SPA)
    participant A as 商户后台 BFF
    participant S as 对象存储

    Note over B,A: 先选类型再取候选（候选按类型给，驱动 currency × method 联动）
    B->>B: 选 type（giftcard / product / ticket）
    B->>A: [getPaymentLinkCreateConfig]（type 必填）
    A-->>B: 200 可选币种 + 候选方式（**含线上与线下**，每方式带可标价币种 pricingCurrencies）
    B->>B: 按 type 渲染字段 → 选 Currency + 方式（联动过滤：方式须支持所选标价币种；内容价格币种须 = 顶层 Currency）
    opt giftcard / ticket 在向导内就传素材（链接尚不存在也可以）
        B->>A: [createPaymentLinkAssetUploadTarget] POST /products/payment-links/files/upload-targets { purpose, fileName, contentType, fileSize }
        A-->>B: 201 FileUploadTarget{ fileId, action, fields, expiresAt }
        B->>S: 按 fields 提交文件到 action（直传对象存储、不经后端；POST multipart，文件字段名 file、放最后）
        S-->>B: 2xx 收下 / 4xx 拒收（存储端自有格式、非本平台错误体）
        Note over B: 收下后把 fileId 作 bannerRef / brandLogoRef 带进下一步；被拒则不带引用、或重新申请目标
    end
    B->>A: [createPaymentLink]（Idempotency-Key；type 判别内容；可含 bannerRef / brandLogoRef）
    alt 币种 × 方式不兼容 / 方式不适用
        A-->>B: 409 PAYMENT_METHOD_NOT_ACCEPTABLE
        B->>B: 提示改币种 / 方式
    else 内容币种 ≠ 顶层 Currency / 方式空
        A-->>B: 400（CONTENT_CURRENCY_MISMATCH / PAYMENT_METHOD_SELECTION_EMPTY）
        B->>B: 字段级错误
    else 素材文件确定未就位
        A-->>B: 400·FILE_NOT_IN_PLACE(204014)（链接不创建）
        B->>B: 重取目标（得**新 fileId**）→ 重新直传 → **换新 Idempotency-Key** 重提
    else 素材是否就位暂时判不出
        A-->>B: 502 / 504（不必重传，用**原键原样重试**）
    else 通过
        Note over A: 创建 ACTIVE 实例 + 生成链接 URL / QR（整串），返回链接详情
        A-->>B: 201 PaymentLinkDetail
        B->>B: 跳详情页继续配置
    end

    Note over B,A: 详情阶段——新建成功后进入、或从列表打开已有链接：按需改图 / 保存
    opt giftcard / ticket 换链接素材（下图以 purpose=payment_link_banner 为例；品牌 Logo 同流，仅 purpose 与引用字段不同）
        B->>A: [createPaymentLinkAssetUploadTarget] POST /products/payment-links/files/upload-targets { purpose, fileName, contentType, fileSize }
        A-->>B: 201 FileUploadTarget{ fileId, action, fields, expiresAt }
        B->>S: 按 fields 提交文件到 action（直传对象存储、不经后端；POST multipart，文件字段名 file、放最后）
        S-->>B: 2xx 收下 / 4xx 拒收（存储端自有格式、非本平台错误体）
        Note over B: 确认到 2xx 才用 fileId 作 bannerRef；没确认（含跨源被挡 / 网络中断）则重新申请目标——**没确认不等于字节没落**，不做补偿
        B->>A: [updatePaymentLink]（type + 对应内容对象中的 bannerRef：giftcard.bannerRef / ticket.bannerRef）
        alt 文件确定未就位
            A-->>B: 400·FILE_NOT_IN_PLACE(204014)（本次编辑不生效）
            B->>B: 重取目标（得**新 fileId**）→ 重新直传 → 以新引用重提
        else 暂时判不出
            A-->>B: 502 / 504（不必重传，原样重试本请求）
        else 就位
            A-->>B: 200 PaymentLinkDetail
        end
    end

    %% giftcard 卡密装载本期无 BFF 入口：运营整理后交技术按面值导入，面值档 stock 只读呈现
    %% （商户自助上传 / 补货 / 导入校验 / 低库存告警整块归二期）

    opt 编辑 Policies（三语）
        B->>A: [savePaymentLinkPolicies]
        A-->>B: 200（当前链接 + 商户级默认同步）
    end

    opt 下载收款 QR
        B->>A: [downloadPaymentLinkQr]
        A-->>B: 200 image/png（编码 paymentUrl；attachment）
    end
```

## 流程四：收款页 Logo 直传 → 随设置保存

换 Logo 是三步：[`createPaymentPageLogoUploadTarget`](index.html#tag/payment-page/operation/createPaymentPageLogoUploadTarget) 取目标 → 浏览器直传对象存储 → [`savePaymentPageSettings`](index.html#tag/payment-page/operation/savePaymentPageSettings) 把 `logoRef` 随设置写入。**不换 Logo 时本流程不发生**，保存设置为单次调用、不传 `logoRef` 即可（要移除 Logo 则传 `null`）。

```mermaid
sequenceDiagram
    participant B as 浏览器(SPA)
    participant A as 商户后台 BFF
    participant S as 对象存储

    B->>A: [createPaymentPageLogoUploadTarget] POST /payment-page/files/upload-targets { purpose= payment_page_logo, fileName, contentType, fileSize }
    alt 声明的类型 / 大小不合规
        A-->>B: 400·FILE_DECLARATION_REJECTED(204015)（不签发目标；换个合规文件再申请）
    else 通过
        A-->>B: 201 FileUploadTarget{ fileId, action, fields, expiresAt }（非幂等：每次新 fileId）
        B->>S: 按 fields 提交文件到 action（直传对象存储、不经 BFF；POST multipart，文件字段名 file、放最后）
        S-->>B: 2xx 收下 / 4xx 拒收（存储端自有格式、非本平台错误体）；跨源被挡或网络中断则前端**读不到响应 = 没确认**
        B->>A: [savePaymentPageSettings] PUT /payment-page { logoRef= 上一步的 fileId, ...其余设置 }
        alt 文件确定未就位
            A-->>B: 400·FILE_NOT_IN_PLACE(204014)（整次保存被拒）
        else 暂时判不出
            A-->>B: 502 / 504（不必重传，原样重试保存）
        else 就位
            A-->>B: 200 PaymentPageSettings{ logoRef, logoUrl }
        end
    end
    Note over B,A: 204014 是终态——须重新取目标（得**新 fileId**）、重新直传、以新引用再保存；**不要向原目标补传**（目标一次性，提交失败即作废）<br/>回显用响应里的 logoUrl（只出不入）——收款页 Logo 面向匿名付款人，是**长效稳定的公开地址**、不会过期；本流程的保存要带上新取得的 logoRef
