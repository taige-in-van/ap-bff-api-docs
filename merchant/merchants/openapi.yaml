openapi: 3.1.0
info:
  title: 商户后台 商户与入驻 — 前端契约面
  version: 2.3.3
  contact:
    name: 商户后台 BFF
  description: |
    商户后台 React SPA 消费的商户与入驻契约：登录者能进的商户（列表、新建关联商户、删除未激活的关联商户）与每个商户的入驻申请（加载、分步保存、上传文档、提交审核）。各步的候选集取系统契约的 `/config/*`；切换当前商户见认证契约的 `switchCurrentMerchant`。
    浏览器持 httpOnly 会话 cookie，字段类型与校验规则以本 spec 各字段为准。

    **幂等 / CSRF 口径**：

    - 新建关联商户挂 `Idempotency-Key`，同一次提交的网络重试用同键返回首次结果；删除关联商户天然幂等、不挂。
    - 入驻申请的分步保存（PUT）与提交（重放命中已提交态返回相同结果）天然幂等，不挂；文档上传非幂等，每次产生新 `fileId`。
    - cookieAuth 的非安全方法一律带 `X-CSRF-Token`。

    **按路径定位商户**：入驻申请按路径里的 `merchantId` 定位（一个商户一张入驻申请），不看会话的当前商户：首次入驻取 `getCurrentSession` 的 `merchantId`，关联商户取 `createMerchant` 返回或商户列表里的 `merchantId`。商户须是登录者名下的商户（登录者所属的商户，及其所属主商户名下的关联商户），已删除 → `404`；入驻被拒、已冻结的商户不在商户列表里，但申请仍可读。
servers:
  - url: /api/merchant/v1
    description: 商户后台 BFF（浏览器经边缘网关 merchant.* 可达；cookieAuth 会话 + CSRF）
security:
  - cookieAuth: []
tags:
  - name: merchants
    x-displayName: 商户
    description: 商户：登录者能进的商户列表、新建关联商户（BRANCH / NEW_LEGAL_ENTITY，一律挂在主商户下）、删除未激活的关联商户。
  - name: application
    x-displayName: 入驻申请
    description: 入驻申请：一个商户一张，加载、分步保存、上传文档、提交审核（按使用顺序排列）。
paths:
  /merchants:
    get:
      tags:
        - merchants
      operationId: listMerchants
      x-required-privilege: session
      summary: 商户列表（顶栏切换器、启动链路）
      description: |
        登录者能进的商户：Owner 是名下全部商户；主商户的员工是主商户加它名下的全部关联商户（切过去用同一个角色）；关联商户的员工只有本商户。再排除已删除、已冻结和入驻被拒的。主商户排第一，关联商户按创建时间排在后面。
        被拒的商户不在本列表，但它的入驻申请仍可按 `merchantId` 读。

        - 已激活的商户 `status` 为 `ACTIVE`；未激活的返回入驻申请的状态（`DRAFT` / `UNDER_REVIEW` / `MORE_INFO_REQUIRED`）。
        - 当前商户以 `getCurrentSession` 的 `merchantId` 为准，本接口不返回。
        - 代登会话只列被代的那个商户。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MerchantListItem'
              example:
                items:
                  - merchantId: '1000023'
                    tradeName: Maple Vet Clinic
                    currency: CAD
                    status: ACTIVE
                  - merchantId: '1000024'
                    tradeName: Maple Vet Clinic Downtown
                    currency: CAD
                    status: DRAFT
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
    post:
      tags:
        - merchants
      operationId: createMerchant
      x-required-privilege: owner
      summary: 新建关联商户
      description: |
        建一个关联商户和它的入驻申请草稿（`DRAFT`），返回 `merchantId`。不改变会话的当前商户。

        - 只有 Owner 能调，其他人 → 403。
        - 以会话当前商户为发起商户：当前商户未激活或不可访问 → `409`·208022。
        - 新商户一律挂在主商户下面、Owner 同主商户，不论当前商户是主商户还是关联商户。
        - 所属主商户已冻结 → `409`·208054，不建商户也不建申请。
        - `BRANCH` 按主商户的资料预填，`NEW_LEGAL_ENTITY` 只预填 Contact 步（含推荐来源）与本请求里的字段；预填结果在入驻向导读申请时返回。
        - `country` 与 `currency` 须是 `/config/currencies` 里的一条组合，否则 400。

        幂等：必带 `Idempotency-Key`。同键 + 同请求体重发返首次结果、不会重复建商户；改了请求体就必须换新键，沿用旧键改内容 → `409`·908003。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddMerchantRequest'
            example:
              tradeName: Maple Vet Clinic Downtown
              country: CA
              currency: CAD
              relationType: BRANCH
      responses:
        '201':
          description: 已创建（商户与入驻申请草稿）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantRef'
              example:
                merchantId: '1000042'
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208054
  /merchants/{merchantId}:
    delete:
      tags:
        - merchants
      operationId: deleteMerchant
      x-required-privilege: owner
      summary: 删除未激活的关联商户
      description: |
        删除一个还没激活的关联商户：商户标记删除，在途的入驻申请撤回。删除后不再出现在商户列表里，填过的资料不能恢复。

        - 只有 Owner 能调，其他人 → 403。
        - 已激活（含已冻结）的商户 → `409`·208003；
        - 入驻被拒的商户 → `409`·208003；
        - 主商户 → `409`·208024；
        - 工作人员代为建档的待激活商户 → `409`·208046（撤回由工作人员办理）；
        - 商户不存在、或不是登录者名下的商户 → 404（已删除的按下面的幂等规则返回 204）。

        幂等：已删除的商户再删返回 204，不挂 Idempotency-Key。
      parameters:
        - name: merchantId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MerchantId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已删除
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 208003
        - 208024
        - 208046
  /merchants/{merchantId}/application:
    get:
      tags:
        - application
      operationId: getOnboardingApplication
      x-required-privilege: owner
      summary: 加载商户的入驻申请（状态、各步字段、待补项、已绑定文档）
      description: |
        返回该商户的入驻申请。`completedSteps` 按已存字段是否齐全推导；`readonlyFields` 列出本申请只读的字段。
        每份已绑定文档必带 `previewUrl`（短时效）；本次会话刚上传、尚未随 documents 步保存的文件不在本结果里。
      parameters:
        - $ref: '#/components/parameters/MerchantId'
      responses:
        '200':
          description: 该商户的入驻申请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
              example:
                merchantCode: C3BM68
                status: MORE_INFO_REQUIRED
                entryMode: FIRST_ONBOARDING
                assistedOnboarding: false
                completedSteps:
                  - contact
                  - business
                  - services
                  - settlement
                readonlyFields:
                  - contact.email
                  - contact.referredBy
                steps:
                  contact:
                    email: jane@example.com
                    firstName: Jane
                    lastName: Merchant
                    businessTitle: Manager
                    phone: '+16045550123'
                    referredBy: Moneris
                    monerisMid: MON-44821
                    monerisManagerName: Alex Lee
                  services:
                    selectedPaymentMethods:
                      - wechat_instore
                      - wechat_online
                  business:
                    currency: CAD
                    country: CA
                    legalBusinessName: Maple Veterinary Inc.
                    tradeName: Maple Vet Clinic
                    typeOfOwnership: CORPORATION
                    registrationNumber: '1234567'
                    businessAddress: 88 King St W
                    city: Toronto
                    province: 'ON'
                    postalCode: M5H 1A1
                    timeZone: America/Toronto
                    language: en
                    businessPhone: '+14165550199'
                    industryCategory: A0
                    mcc: '0742'
                    typeOfOnlineService: WEBSITE
                    websiteUrl: https://maplevet.example.com
                  settlement:
                    bankName: Royal Bank of Canada
                    bankAccount:
                      type: ca_local
                      transitNumber: '00123'
                      institutionNumber: '003'
                      accountNumberMasked: •••• 4567
                      accountNumberSet: true
                    refundPinSet: true
                    settlementCycle: t2
                    storeId: STORE-001
                  documents:
                    docStoreInside:
                      fileId: c58f2d901b4e47a6bd39e0f7a812c46d
                      fileName: store-inside.jpg
                      fileSize: 1572864
                      uploadedAt: '2026-06-22T14:05:00Z'
                      previewUrl: https://files.example.com/o/c58f2d90?exp=1755331200&sig=REDACTED&disp=inline
                    docStoreOutside:
                      fileId: 6b3e1af75c894d02ae7f5c3b90d146e8
                      fileName: store-outside.jpg
                      fileSize: 1310720
                      uploadedAt: '2026-06-22T14:06:00Z'
                      previewUrl: https://files.example.com/o/6b3e1af7?exp=1755331200&sig=REDACTED&disp=inline
                    docIncorporation:
                      fileId: a04d78e2915c4b36bf8e2107d63a95f1
                      fileName: incorporation.pdf
                      fileSize: 524288
                      uploadedAt: '2026-06-22T14:07:00Z'
                      previewUrl: https://files.example.com/o/a04d78e2?exp=1755331200&sig=REDACTED&disp=inline
                    docVoidCheque:
                      fileId: f712c9b6480a4de5931b8ac04e26df70
                      fileName: void-cheque.pdf
                      fileSize: 262144
                      uploadedAt: '2026-06-22T14:09:00Z'
                      previewUrl: https://files.example.com/o/f712c9b6?exp=1755331200&sig=REDACTED&disp=inline
                missingFields:
                  - documents.docOwnerId
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes: []
  /merchants/{merchantId}/application/steps/{step}:
    put:
      tags:
        - application
      operationId: updateOnboardingStep
      x-required-privilege: owner
      summary: 分步保存一个步骤
      description: |
        `mode=next` 校验本步完整后保存；`mode=draft` 只校验已填字段的格式、放宽必填。`settlement` 的银行账户组（银行名、制式与制式全部字段含账号）不齐时不保存该组，`storeId` 随组；账号为只写字段，已保存（`accountNumberSet = true`）且本次未传时沿用已存值、其余字段以本次提交为准。
        请求体恰含一个步骤键，且须与 path 的 `{step}` 一致。完整性按已存值叠加本次提交判定，只写字段（银行账号、Refund PIN）按 `accountNumberSet` / `refundPinSet` 判。Business 步所填 Country 在 `/config/settlement` 的 `bankAccountTypes` 里无条目（平台不对该国商户出款）时，`settlement` 步只收 `refundPin` / `confirmRefundPin`，`bankName` / `bankAccount` / `settlementCycle` / `storeId` 不传（传了 → 400 `204001`），完整性只看 `refundPinSet`。

        - `business`：Currency × Country 须是 `/config/currencies` 里的有效组合；改了币种后 Services 已选方式不在新币种候选内的，在下次保存 Services 时报错。`business` 步改了 `country`，且已存结算银行账户的制式与新国家的制式不同（含新国家无条目）时，该账户整组视为未填：读申请不再返回 `bankAccount` / `bankName` / `storeId`，`settlement` 步要重填。
        - `services`：所选方式须在 Business 步所选结算币种的候选内；选了线上方式时，Business 的 `typeOfOnlineService` 必填、为 `WEBSITE` 时 `websiteUrl` 必填，缺了在 `details` 里指向 `business.*`。
        - `settlement`：两次 Refund PIN 须一致。
        - `documents`：按 docKey 绑定上传得到的 `fileId`，未传的 docKey 保持原绑定，传 `null` 移除。门店内照、外照在 Services 选了线下方式时才必传；Business 步所填 Country 在 `bankAccountTypes` 无条目时 `docVoidCheque` 不必传。

        `readonlyFields` 里的字段服务端忽略写入。

        错误码：

        - `204001` 字段缺失或格式错，`details` 逐项指到 `<step>.<field>`。
        - `204017` 结算周期不在候选内。
        - `208003` 申请不在 `DRAFT` / `MORE_INFO_REQUIRED`，不能保存。
        - `208046` 工作人员代为建档的申请（`assistedOnboarding` 为 true），向导里只读。
        - `208040` `documents` 步引用的文件不存在、不是本商户上传的或用途不符，`details` 逐项指到 `documents.<docKey>`。
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - name: step
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/StepName'
        - name: mode
          in: query
          required: false
          description: 保存语义：next = 校验本步完整（默认）；draft = 离开前保存未完成的草稿
          schema:
            type: string
            enum:
              - next
              - draft
            default: next
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        description: 单个步骤的字段体
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StepSaveRequest'
            examples:
              contact:
                summary: Contact（补填职务与电话，Moneris 来源）
                value:
                  contact:
                    businessTitle: Manager
                    phone: '+16045550123'
                    referredBy: Moneris
                    monerisMid: MON-44821
                    monerisManagerName: Alex Lee
              services:
                summary: Services（至少选 1 个支付方式）
                value:
                  services:
                    selectedPaymentMethods:
                      - wechat_instore
                      - alipay_online
              business:
                summary: Business（含线上服务类型）
                value:
                  business:
                    currency: CAD
                    country: CA
                    legalBusinessName: Maple Veterinary Inc.
                    tradeName: Maple Vet Clinic
                    typeOfOwnership: CORPORATION
                    registrationNumber: '1234567'
                    businessAddress: 88 King St W
                    city: Toronto
                    province: 'ON'
                    postalCode: M5H 1A1
                    timeZone: America/Toronto
                    language: en
                    businessPhone: '+14165550199'
                    industryCategory: A0
                    mcc: '0742'
                    typeOfOnlineService: WEBSITE
                    websiteUrl: https://maplevet.example.com
                    note: Seasonal hours
              settlement:
                summary: Settlement（账号与 Refund PIN 只写）
                value:
                  settlement:
                    bankName: Royal Bank of Canada
                    bankAccount:
                      type: ca_local
                      transitNumber: '00123'
                      institutionNumber: '003'
                      accountNumber: '1234567'
                    settlementCycle: t2
                    storeId: STORE-001
                    refundPin: '123456'
                    confirmRefundPin: '123456'
              documents:
                summary: Documents（绑定已上传的 fileId）
                value:
                  documents:
                    docStoreInside:
                      fileId: c58f2d901b4e47a6bd39e0f7a812c46d
                    docStoreOutside:
                      fileId: 6b3e1af75c894d02ae7f5c3b90d146e8
                    docIncorporation:
                      fileId: a04d78e2915c4b36bf8e2107d63a95f1
                    docOwnerId:
                      fileId: 9a17be40d5c34f28b6e1027c9df3a85b
                    docVoidCheque:
                      fileId: f712c9b6480a4de5931b8ac04e26df70
      responses:
        '204':
          description: 已保存
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204001
        - 204017
        - 208003
        - 208040
        - 208046
  /merchants/{merchantId}/application/files:
    post:
      tags:
        - application
      operationId: uploadOnboardingDocumentFile
      x-required-privilege: owner
      summary: 上传入驻文档（随 documents 步保存时绑定）
      description: |
        返回的 `fileId` 在保存这个商户的 documents 步时绑定到具体文档位。

        允许的格式与大小上限见 `MerchantFilePurpose` 用途表，前端照表先拦；不合规 → `400`·`204015`（以服务端判定为准）。非幂等：每次上传产生新 `fileId`。
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              allOf:
                - $ref: '#/components/schemas/FileUploadForm'
                - type: object
                  properties:
                    purpose:
                      allOf:
                        - $ref: '#/components/schemas/MerchantFilePurpose'
                      enum:
                        - onboarding_document
      responses:
        '201':
          description: 已上传（尚未绑定）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedFile'
              example:
                fileId: 9a17be40d5c34f28b6e1027c9df3a85b
                fileName: owner-id.jpg
                fileSize: 880640
                contentType: image/jpeg
                previewUrl: https://files.example.com/o/9a17be40?exp=1755331200&sig=REDACTED&disp=inline
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204015
  /merchants/{merchantId}/application/submission:
    post:
      tags:
        - application
      operationId: submitOnboardingApplication
      x-required-privilege: owner
      summary: 提交审核
      description: |
        校验全部步骤与必传文档（营业执照、Owner 证件、Void Cheque；选了线下方式时加门店内照、外照；Country 在 `/config/settlement` 的 `bankAccountTypes` 无条目时不要 Void Cheque、`204002` 不因它触发）后，申请从 `DRAFT` / `MORE_INFO_REQUIRED` 进入 `UNDER_REVIEW`，同时清空待补项。
        首次提交发「申请已收到」邮件，补料重提不发。提交时先做开通准备（按所选支付方式建签约与费率），成功后申请才进入 `UNDER_REVIEW`；开通准备暂时没做成（可稍后重试的失败）回 `503`，申请未提交、状态不变，重发本请求即可。申请已是 `UNDER_REVIEW` 时再次提交返回 `204`、不做任何事、不重发邮件。

        错误码：

        - `204001` 字段缺失或格式错，`details` 逐项指到 `<step>.<field>`。
        - `204002` 必传文档不全，`details` 指到 `documents.<docKey>`。
        - `204017` 结算周期不在候选内。
        - `208003` 申请状态不可提交。
        - `208046` 工作人员代为建档的申请（`assistedOnboarding` 为 true）不在这里提交，由 Owner 在确认邮件里的确认页签署。
      parameters:
        - $ref: '#/components/parameters/MerchantId'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: 已提交
        default:
          $ref: '#/components/responses/MerchantBffDefaultError'
      x-error-codes:
        - 204001
        - 204002
        - 204017
        - 208003
        - 208046
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-msession
      description: |
        商户后台 BFF 服务端会话 cookie（`httpOnly` + `Secure` + `SameSite=Lax`；`__Host-` 前缀强制 Secure + Path=/ + 无 Domain，杜绝子域注入）。

        浏览器只持此会话 cookie、不持后端 token。会话裁决商户 scope（当前商户从会话取、不信请求体）。

        - 写接口（非安全方法，含 `PATCH`）另需 CSRF 防护：读**可读伴生 cookie** `__Host-mcsrf`、原样放进 `X-CSRF-Token`（详见公共约定「鉴权与 CSRF」）；
        - 依赖当前商户的接口在当前商户不可访问时返回 `409`·`208022`（见公共约定「当前商户」）。
  parameters:
    MerchantId:
      name: merchantId
      in: path
      required: true
      description: 申请所属的商户（一个商户一张入驻申请）。须是登录者名下的商户、且商户未删除，否则 404；入驻被拒的商户同样可读（拒绝结果页要用），这一点和商户列表不同
      schema:
        $ref: '#/components/schemas/MerchantId'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 幂等键(写接口;两段命中语义——同键同 payload → 返首次结果 / 同键异 payload → 拒 409·908003;同键首次请求还在处理 → 409·908002。缺键 → 400·904002)
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: CSRF 令牌(double-submit;cookie 会话鉴权的非安全方法[POST/PUT/PATCH/DELETE]必带;缺失/不匹配 → 403 fail-closed)。**取值 = 本 BFF 可读伴生 CSRF cookie 的当前值**(cookie 名 per-BFF、见该面 cookieAuth 说明;建会话时随会话 cookie 一起下发、同生命周期),每次请求现读、不要缓存。
      schema:
        type: string
        minLength: 1
        pattern: .*\S.*
  schemas:
    RelationType:
      type: string
      enum:
        - BRANCH
        - NEW_LEGAL_ENTITY
      description: 新建关联商户的方式，创建即定、不再变动：`BRANCH` 按主商户的资料预填，`NEW_LEGAL_ENTITY` 只预填 Contact 步（含推荐来源）与弹窗三字段、其余全新填写。与入驻申请 `entryMode` 的同名取值一致。
    MerchantListItem:
      type: object
      additionalProperties: false
      description: 商户列表的一行
      required:
        - merchantId
        - status
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
          readOnly: true
        tradeName:
          type: string
          description: 对外经营名。首次入驻的主商户在 Business 步保存前没有，不返回本键
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: 结算币种。首次入驻的主商户在 Business 步保存前没有，不返回本键。
        status:
          type: string
          enum:
            - ACTIVE
            - DRAFT
            - UNDER_REVIEW
            - MORE_INFO_REQUIRED
          description: 已激活为 `ACTIVE`；未激活时是入驻申请的状态，与 `getOnboardingApplication` 的 `status` 同义。
    AddMerchantRequest:
      type: object
      additionalProperties: false
      description: 新建关联商户
      required:
        - tradeName
        - country
        - currency
        - relationType
      properties:
        tradeName:
          type: string
          minLength: 1
          maxLength: 128
          description: 允许与现有商户同名
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO 3166-1 alpha-2。与 `currency` 须是 `/config/currencies` 里的一条组合，否则 400
        currency:
          allOf:
            - $ref: '#/components/schemas/Currency'
          description: 本部署可用的币种以 `/config/currencies` 为准，窄于本枚举
        relationType:
          $ref: '#/components/schemas/RelationType'
    StepName:
      type: string
      enum:
        - contact
        - business
        - services
        - settlement
        - documents
      description: 向导步骤标识，按向导顺序排列。
    Application:
      type: object
      description: 一个商户的入驻申请。Refund PIN 与银行账号明文只写、不在此出现。
      additionalProperties: false
      required:
        - merchantCode
        - status
        - entryMode
        - assistedOnboarding
        - completedSteps
        - readonlyFields
        - steps
        - missingFields
      properties:
        merchantCode:
          $ref: '#/components/schemas/MerchantCode'
          readOnly: true
          description: 对外商户号（如 C3BM68），只读。
        status:
          $ref: '#/components/schemas/ApplicationStatus'
          description: 入驻申请状态；服务端裁决，前端只读。商户删除时申请随之撤回，已删除的商户读申请返回 404，不会读到 `WITHDRAWN`。
        assistedOnboarding:
          type: boolean
          readOnly: true
          description: true = 工作人员代为建档的申请：向导整份只读，不能分步保存或提交（`208046`），签署在确认邮件里的确认页完成。
        entryMode:
          type: string
          enum:
            - FIRST_ONBOARDING
            - BRANCH
            - NEW_LEGAL_ENTITY
          readOnly: true
          description: 入驻模式：首次入驻 / 新增的分店 / 新增的新法人主体。
        completedSteps:
          type: array
          readOnly: true
          description: 必填项已齐全的步骤（按已存字段推导）。
          items:
            $ref: '#/components/schemas/StepName'
        readonlyFields:
          type: array
          readOnly: true
          description: 本申请只读的字段，写作 `<step>.<field>`（如 `contact.referredBy`）。首次入驻 = 登录邮箱与已有值的推荐来源；新增的关联商户（`entryMode` 为 `BRANCH` / `NEW_LEGAL_ENTITY`）= Contact 步全部字段。
          items:
            type: string
        steps:
          $ref: '#/components/schemas/ApplicationSteps'
        missingFields:
          type: array
          readOnly: true
          description: 审核标记的待补项，写作 `<step>.<field>`（文档为 `documents.<docKey>`）。仅 `MORE_INFO_REQUIRED` 时非空，提交时清空；不含审核原因。
          items:
            type: string
    StepSaveRequest:
      type: object
      description: 分步保存请求体；**恰含一个 step key、且须 == path** `{step}`（服务端校验，不一致 → 400）。
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        contact:
          $ref: '#/components/schemas/ContactStep'
        services:
          $ref: '#/components/schemas/ServicesStep'
        business:
          $ref: '#/components/schemas/BusinessStep'
        settlement:
          $ref: '#/components/schemas/SettlementStep'
        documents:
          $ref: '#/components/schemas/DocumentsStep'
    DiagnosticDetail:
      type: string
      description: '**诊断描述的单一口径**——凡叫「detail / resultDetail」这类的字段都用本类型，语义只此一份、各处不再复述。 面向排查（日志 / 客服 / 配合 `traceId` 定位），**不是给终端用户看的文案、也不做本地化**。 **不要直接展示本字段，也不要拿它做分支依据**；用户可见文案与分支依据另有结构化来源 （失败响应看 `code`，`200` 响应体内的失败态看该端点自己的原因枚举）。'
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    MerchantMandateNo:
      type: string
      minLength: 1
      maxLength: 64
      description: 商户协议号，同一商户内不可重复。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    BlocklistCategory:
      type: string
      enum:
        - legal_name
        - registration_number
        - contact_name
        - phone
        - email
        - email_domain
        - merchant_code
      description: 禁入名单的类别：`legal_name` 法定名 / `registration_number` 注册号 / `contact_name` 联系人姓名 / `phone` 电话 / `email` 邮箱 / `email_domain` 邮箱域名 / `merchant_code` 商户码。
    BlocklistHit:
      type: object
      additionalProperties: false
      description: 禁入名单的一个命中项。
      required:
        - category
        - value
      properties:
        category:
          $ref: '#/components/schemas/BlocklistCategory'
        value:
          type: string
          minLength: 1
          description: 命中的那一项的值。
    ErrorEnvelope:
      type: object
      description: 统一错误返回(错误响应体:结构化整数 code + detail + 可选 links;扩展 traceId/details/context)。
      required:
        - code
        - detail
      properties:
        code:
          type: integer
          description: 结构化整数错误码(能力域段 + 责任方类别 + 域内末段;可解析责任方+来源域,与 HTTP 状态正交)。
        detail:
          allOf:
            - $ref: '#/components/schemas/DiagnosticDetail'
          description: 本次失败的诊断描述。用户可见文案由调用方按 `code` 查码表取 `name` 作 i18n key、从自己的多语言资源渲染。
        links:
          type: object
          description: 可选:错误说明 / 后续恢复操作链接。
          additionalProperties:
            type: string
        traceId:
          type: string
          description: 可选:关联 id,串联日志 / 分布式 trace(可观测)。
        details:
          type: array
          description: 可选:字段级校验错误。
          items:
            type: object
            required:
              - field
              - issue
            properties:
              field:
                type: string
              issue:
                type: string
        context:
          type: object
          description: 可选:该错误**专属的结构化上下文**(区别于 `details` —— 那只承载请求字段级校验错误)。 **必带与否取决于 `code`、不取决于 HTTP 状态**:某个码必带哪些 context 字段, 见该码在所属能力域错误码表里的 `requiredContextFields`(唯一出处,勿按状态码猜)。 下列属性是**跨面并集**(不同码用不同键),**在一处声明、各面不再另行覆盖** —— 用 `allOf` 二次声明同名嵌套对象会被拍平型 codegen 后者覆盖前者、静默丢字段。
          properties:
            attemptsRemaining:
              type: integer
              minimum: 0
              description: OTP / 挑战验证码输错但还能重输时的剩余尝试次数（**整数类型、走本结构化上下文**，非塞进 `details.issue` 字符串——`details` 只做请求字段级校验红框）。
            cooldownSeconds:
              type: integer
              minimum: 0
              description: OTP / 挑战 Resend 冷却剩余秒数（**整数类型、走本结构化上下文**——权威值、覆盖刷新 / 跨标签页，前端据此本地倒计时）。
            orderId:
              $ref: '#/components/schemas/OrderId'
              description: 失败发生时**订单已建立**的场景下带出的平台订单号（如被扫同步扣款在通道应答阶段失败、建单时受理准入不予受理）——调用方据此查结果与对账。订单尚未建立就失败的码不返回本键。
            channelErrorCode:
              type: string
              description: 渠道拒绝时渠道给出的原始结果码（如建单这一步向渠道下单被拒、被扫在渠道应答阶段被拒）；渠道给了就带、没给不带。对外面把它映射成冻结契约里的渠道结果码。
            channelErrorMessage:
              type: string
              description: 与 `channelErrorCode` 配套的渠道原始说明；渠道给了就带。
            reasonCode:
              type: string
              description: 受理拒绝的机读原因，取值见该码在所属域码表的说明。
            merchantMandateNo:
              $ref: '#/components/schemas/MerchantMandateNo'
              description: 被拒的委托代扣请求所引用的商户侧协议号——**回显调用方自己传入的值**，供其定位是哪份协议被拒。不透出平台侧标识、也不透出协议内部状态（具体状态由合约查询给出）。
            purchaseLimit:
              $ref: '#/components/schemas/Money'
              description: 命中限购时该限额的**取值与币种**（**结构化、走本上下文**——提示文案要把数额说出来，付款人才知道还能买多少；把它拼进 `detail` 字符串前端取不出来）。
            committedQuantity:
              type: integer
              minimum: 0
              description: 改可售上限被拒时，该项**已经卖掉 + 正被在途订单占着**的份数，即新上限的下界（**结构化、走本上下文**——提示要说出「不能低于 N」商户才知道该填什么，拼进 `detail` 前端取不出来）。
            floorAmount:
              $ref: '#/components/schemas/Money'
              description: 提交的金额低于平台规定的下限时，该下限的**取值与币种**（下限可由运营调整，前端不写死，按本键提示「不能低于 N」）。
            minimumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的下限，分钟（范围由平台设定，前端不写死）。
            maximumMinutes:
              type: integer
              minimum: 1
              description: 提交的时长超出允许范围时，当前允许的上限，分钟。
            capPercentage:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,6})?$
              description: 提交的比例费率超过平台上限时，当前的上限，小数（`0.05` = 5%；上限由运营调整，前端不写死，按本键提示「不能超过 N」）。
            payable:
              $ref: '#/components/schemas/Money'
              description: 发起支付时提交的总应付与服务端此刻算出的不一致时，服务端此刻算出的总应付（页面按本键换成新数，付款人确认后重新发起）。
            currentIp:
              type: string
              minLength: 1
              maxLength: 45
              description: 本人保存登录 IP 白名单被拒时，本次请求的来源 IP（非空白名单须包含它）。
            blocklistHits:
              type: array
              minItems: 1
              description: 禁入名单比对被拒时的命中项（页面据此列出命中了哪些项）。
              items:
                $ref: '#/components/schemas/BlocklistHit'
            maxRows:
              type: integer
              minimum: 1
              description: 导出命中行数超过上限时，当时的上限行数（上限由平台设定，前端不写死，按本键提示超过 N 行）。
    MerchantId:
      type: string
      minLength: 1
      maxLength: 32
      description: 商户标识（平台内部 id，不是对外商户码）。
    MerchantRef:
      type: object
      additionalProperties: false
      required:
        - merchantId
      properties:
        merchantId:
          $ref: '#/components/schemas/MerchantId'
    MerchantCode:
      type: string
      minLength: 1
      maxLength: 20
      description: 对外商户码。
    ApplicationStatus:
      type: string
      enum:
        - DRAFT
        - UNDER_REVIEW
        - MORE_INFO_REQUIRED
        - APPROVED
        - REJECTED
        - WITHDRAWN
      description: 申请状态：`DRAFT` 草稿 / `UNDER_REVIEW` 审核中 / `MORE_INFO_REQUIRED` 待补料 / `APPROVED` 已通过 / `REJECTED` 已拒绝 / `WITHDRAWN` 已撤回。
    Phone:
      type: string
      pattern: ^\+[1-9]\d{1,14}$
      maxLength: 16
      description: 电话号码，**国际格式整串**（`+` + 国家码 + 正文号，如 `+16045550123`）——**一个字段装完，没有独立的区号字段**。 上界 16 = `+` 加最多 15 位数字（国际号码总长上限）；**服务端只校验这一条通用规则 + 区号在白名单内**， **不按区号分别限长**。前端按所选区号收窄输入位数属输入体验、不是契约约束。 渲染「区号下拉 + 号码框」两个控件时，用前端参考数据里的区号表做**最长前缀匹配**拆分本串。
    ContactStep:
      type: object
      description: Step 1 Contact。姓名、职务、电话是 Owner 的账号资料：本步回显当前值、可修改，保存即写回账号资料；哪些字段只读看申请的 `readonlyFields`。referredBy = Moneris（大小写不敏感）时 monerisMid + monerisManagerName 必填。
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          readOnly: true
          description: Owner 登录邮箱，只读、不提交。
        firstName:
          type: string
          maxLength: 128
        lastName:
          type: string
          maxLength: 128
        businessTitle:
          type: string
          maxLength: 64
          description: 职务文本。预设 Business Owner / Manager / Employee 可直选；选 Other 时提交用户填写的自定义文本，不提交字面 "Other"。
        phone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 联系人电话。区号候选取自前端参考数据，服务端校验区号在白名单内。
        referredBy:
          type: string
          maxLength: 128
          description: 来源；注册链接带来则只读，否则可填；填 Moneris 触发条件字段。
        monerisMid:
          type: string
          maxLength: 64
          description: 条件必填：referredBy = Moneris 时。
        monerisManagerName:
          type: string
          maxLength: 128
          description: 条件必填：referredBy = Moneris 时。
    PaymentMethod:
      type: string
      minLength: 1
      maxLength: 64
      description: 支付方式目录标识（商户开通与定价的粒度，受理模式是它的属性，如 `wechat_instore` / `wechat_online`）。取值由后端目录决定，调用方从候选集取来原样回传，按未知值安全处理。
      examples:
        - wechat_instore
    ServicesStep:
      type: object
      description: Services 步（向导第 3 步）；至少选 1 个支付方式——该 ≥1 是提交完整性、不是本形状的约束：由服务端在 `mode=next` 校验，草稿态可为空。
      additionalProperties: false
      properties:
        selectedPaymentMethods:
          type: array
          description: 选中的支付方式目录码，须在 Business 步所选结算币种的候选内。数组整组置换，草稿态允许 `[]`。
          items:
            $ref: '#/components/schemas/PaymentMethod'
    OwnershipType:
      type: string
      enum:
        - SOLE_PROPRIETORSHIP
        - PARTNERSHIP
        - CORPORATION
        - NON_PROFIT
      description: 企业类型（入驻 Business 步与 Business Profile 共用），展示名由前端按码 i18n。
    Language:
      type: string
      enum:
        - en
        - fr
        - zh
      description: 平台支持的语言。
    OnlineServiceType:
      type: string
      enum:
        - WEBSITE
        - APP
        - MINI_PROGRAM
        - OTHER
      description: 线上服务类型（入驻 Business 步与 Service 页共用），展示名由前端按码 i18n。只有 `WEBSITE` 有网址。
    WebsiteUrl:
      type: string
      maxLength: 256
      pattern: ^https?://\S+$
      description: 商户经营网址（http / https）。
    BusinessStepRead:
      type: object
      description: '`BusinessStep` 的读侧形态：条件字段与备注**不适用 / 未填时不返回本键、不返** `null`。'
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        country:
          type: string
          description: ISO-3166 国家码（有效 Currency × Country 组合以后端配置为准）。
        legalBusinessName:
          type: string
          description: 身份字段（激活后不可改）。
        tradeName:
          type: string
        typeOfOwnership:
          allOf:
            - $ref: '#/components/schemas/OwnershipType'
          description: 身份字段（激活后不可改）。
        registrationNumber:
          type: string
        businessAddress:
          type: string
        city:
          type: string
        province:
          type: string
          description: 取自 `/config/countries` 里所选 country 那一组的 `provinces[].code`（ISO 3166-2 地区部分），展示名取同项的 `label`；改 country 后须重选。所选国家有省 / 州候选时必填，否则不传。
        postalCode:
          type: string
          description: 邮编，按所选国家的格式校验（前端参考数据预校，服务端重校）；所选国家有邮编制度时必填。
        timeZone:
          type: string
          description: 商户 IANA 时区（如 `America/Toronto`，不用 PT / ET 缩写）。候选随所选省 / 州、无省 / 州的国家按国家，取 `/config/countries` 下发的 `timeZones`，服务端按同一候选校验。
        language:
          allOf:
            - $ref: '#/components/schemas/Language'
          description: 商户语言：发给商户的通知（邮件、微信、站内信）与月对账单 PDF 按它出；界面语言、收据与导出文件、发给某个人本人的邮件不看它，按用户自己的语言。
        businessPhone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 商户营业电话。区号候选取自前端参考数据，服务端校验区号在白名单内。
        industryCategory:
          type: string
          description: 行业大类码（`/config/industries` 的 `items[].code`，如 `A0`），不是展示名，展示名取同项的 `label`。身份字段（激活后不可改）。
        mcc:
          type: string
          description: 四位 MCC，级联 Industry（取自所选大类的 `mccOptions[].code`，展示名取同项的 `label`）；身份字段（激活后不可改）。
        typeOfOnlineService:
          $ref: '#/components/schemas/OnlineServiceType'
          description: 线上服务类型。本步选填、无默认值；Services 步选了任一线上支付方式时必填。
        websiteUrl:
          $ref: '#/components/schemas/WebsiteUrl'
          description: 经营网址（http / https）。typeOfOnlineService = WEBSITE 且选了线上支付方式时必填。
        note:
          type: string
    BankAccountScheme:
      type: string
      enum:
        - ca_local
        - us_local
      description: |
        结算银行账户制式：`ca_local` 加拿大 EFT / `us_local` 美国 ACH。

        封闭枚举：新增国家要在契约里加取值与对应字段、前端加表单组件、加出款适配器，不是纯配置。
    BankAccountIdentification:
      type: object
      additionalProperties: false
      description: |
        结算银行账户（按商户 Country 对应的制式）。`type` 定制式、随制式带对应字段，不属该制式的字段不传（传了 → 400）：

        - `ca_local`（加拿大 EFT）—— 须带 `transitNumber` + `institutionNumber`；
        - `us_local`（美国 ACH）—— 须带 `routingNumber` + `accountType`。

        各制式的字段名保留本国叫法、位数为固定契约值、由服务端按 `type` 校验。`type` 由商户 Country 决定，国家 → 制式由所在面的配置接口给出（形状见 `CountryBankAccountType`）。

        账号明文 write-only、读侧走掩码 + 已填标志。本 schema 是基础形；写面与读面各自用 allOf 收紧（写面的齐全 / 必填规则见各写面，读面须带 `accountNumberMasked` + `accountNumberSet`）。
      required:
        - type
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/BankAccountScheme'
          description: 结算银行账户制式（`ca_local` 加拿大 EFT / `us_local` 美国 ACH）。**封闭 enum**——新增国家 = 契约加取值与对应字段 + 前端加表单组件 + 出款适配器，不是纯配置。
        transitNumber:
          type: string
          pattern: ^[0-9]{5}$
          description: Transit Number，5 位数字（分行）。只属 `type=ca_local`（**此时必填**）。
        institutionNumber:
          type: string
          pattern: ^[0-9]{3}$
          description: Institution Number，3 位数字（银行）。只属 `type=ca_local`（**此时必填**）。
        routingNumber:
          type: string
          pattern: ^[0-9]{9}$
          description: ABA Routing Number，9 位数字。只属 `type=us_local`（**此时必填**）。
        accountType:
          type: string
          enum:
            - checking
            - savings
          description: 账户类型（ACH 必需）。只属 `type=us_local`（**此时必填**）。
        accountNumber:
          type: string
          writeOnly: true
          pattern: ^[0-9]{4,17}$
          description: 银行账号（write-only 输入；read 走 accountNumberMasked，明文不回显）。位数随制式：`ca_local` 6-12 位、`us_local` 4-17 位——schema 只守两制式的并集，精确位数由服务端按 `type` 校验。
        accountNumberMasked:
          type: string
          readOnly: true
          description: 账号末 4 位掩码回显（如 `•••• 5678`）。
        accountNumberSet:
          type: boolean
          readOnly: true
          description: 是否已填 accountNumber（跨设备恢复 / 草稿完整性判定用）。
    SettlementCycleCode:
      type: string
      minLength: 1
      description: 结算周期档位的**稳定取值**（`SettlementCycleOption.code`）。**对客户端不透明**——从候选集里取来原样回传， 不要解析、拼接或据其分支；**不要传展示名**（那是展示文案、不是取值）。 服务端按**提交时点**的候选集校验：不在集内 → 拒绝（错误码见所在面，带 `details` 字段级明细），**不静默回落到候选集第一项**；前端应重取候选集让用户重选。 ⚠️ **你当前选中的取值不会凭空失效**——「打开编辑框却选不中自己现在的档位」「草稿存不回去」这类情形不会发生，无需为此写兜底。
    StoreId:
      type: string
      minLength: 1
      maxLength: 64
      description: 店铺编号，商户自设。
    RefundPin:
      type: string
      writeOnly: true
      pattern: ^[0-9]{6}$
      description: 商户级 Refund PIN——**6 位纯数字**。 **write-only**：仅作入参采集，**绝不出现在任何响应**（含错误响应）；读面走掩码 / 已填标志。
    SettlementStepRead:
      type: object
      description: '`SettlementStep` 的读侧形态：未指定门店时不返回 `storeId` 键。'
      additionalProperties: false
      properties:
        bankName:
          type: string
        bankAccount:
          allOf:
            - $ref: '#/components/schemas/BankAccountIdentification'
          description: |
            结算银行账户（制式 = `/config/settlement` 的 `bankAccountTypes` 里 Business 步所填 Country 对应的 `type`）。

            银行账户组（`bankName` + 制式与该制式全部字段含账号）齐全才保存，缺任一项整组不保存、`accountNumberSet` 为 false；账号为只写字段，已保存（`accountNumberSet = true`）且本次未传时沿用已存值、其余字段以本次提交为准；`storeId` 随该组保存。`mode=next` 的完整性按 `accountNumberSet` 判。
        settlementCycle:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 结算周期——传**候选项的** `code`（取自 `/config/settlement` 的 `settlementCycleOptions`）。初始选中口径见该数组的说明，本字段不重述。
        settlementCycleDisplayName:
          type: string
          minLength: 1
          readOnly: true
          description: '`settlementCycle` 的展示名（如 `T+2 Business Days`）。**与 `settlementCycle` 同进退**： 有 `settlementCycle` 就一定有本键，没有就**两者都没有**。 **能读到候选集的消费方可忽略本键**、按 `code` 取自己的展示文案；拿不到候选集时直接展示本键即可。 ⚠️ 极少数情况下本键可能就等于 `code` 本身（服务端解析不出时的兜底），FE 直接展示、不必特判。'
        storeId:
          $ref: '#/components/schemas/StoreId'
          description: 可选；后续可改。
        refundPin:
          allOf:
            - $ref: '#/components/schemas/RefundPin'
          description: 入驻时初设的 Refund PIN。
        confirmRefundPin:
          allOf:
            - $ref: '#/components/schemas/RefundPin'
          description: 再次输入 Refund PIN；须与 `refundPin` 一致，不一致 → 400。
        refundPinSet:
          type: boolean
          readOnly: true
          description: 是否已设 Refund PIN（write-only PIN 不回显，前端据此判断 Step 4 PIN 是否完成；跨设备恢复）。
    FileId:
      type: string
      minLength: 1
      maxLength: 32
      description: 文件引用：上传后返回的稳定标识。
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    WebUrl:
      type: string
      pattern: ^https?://\S+$
      description: http 或 https 绝对地址。平台产出的文件 / 图片 / 付款链接地址与渠道给出的跳转地址共用。
    DocumentRef:
      type: object
      description: Documents step 保存时绑定的文档引用（按 fileId 关联已上传的文件）。
      additionalProperties: false
      required:
        - fileId
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
          description: 上传接口返回的 fileId，提交本 step 时用它完成绑定。
        fileName:
          type: string
          readOnly: true
          description: 原始文件名（文档卡片据此显示名称）；提交时不必传。
        fileSize:
          type: integer
          format: int64
          readOnly: true
          description: 字节数；提交时不必传。
        uploadedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          readOnly: true
          description: 上传时刻；提交时不必传。
        previewUrl:
          $ref: '#/components/schemas/WebUrl'
          readOnly: true
          description: 该文档的**内联展示地址**（**只出不入**），供卡片缩略图 / 预览。**短时效**，过期后重新加载本申请取新值； **不要持久化、不要分享**——入驻文档含身份与银行资料。哪些面必返本键，见各面自己的读形态。
    DocumentRefFeRead:
      description: '`DocumentRef` 的**前端**读侧形态：元数据 + `previewUrl` 全部必返（写侧只需 `fileId`，故收紧只在读面做）。服务面的审核读不返访问地址、不用本形态。'
      required:
        - fileId
        - fileName
        - fileSize
        - uploadedAt
        - previewUrl
      allOf:
        - $ref: '#/components/schemas/DocumentRef'
    DocumentsStepRead:
      type: object
      description: '`DocumentsStep` 的前端读侧形态：未上传的文档位**不返回本键**、不返 `null`；已上传的必带元数据与 `previewUrl`。'
      additionalProperties: false
      properties:
        docStoreInside:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docStoreOutside:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docIncorporation:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docOwnerId:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docVoidCheque:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docOther1:
          $ref: '#/components/schemas/DocumentRefFeRead'
        docOther2:
          $ref: '#/components/schemas/DocumentRefFeRead'
    ApplicationSteps:
      type: object
      description: 各 step 的已保存草稿字段聚合（GET 加载时返回）。**读侧聚合**——各 step 用读侧变体，未填字段不返回本键。
      additionalProperties: false
      properties:
        contact:
          $ref: '#/components/schemas/ContactStep'
        services:
          $ref: '#/components/schemas/ServicesStep'
        business:
          $ref: '#/components/schemas/BusinessStepRead'
        settlement:
          $ref: '#/components/schemas/SettlementStepRead'
        documents:
          $ref: '#/components/schemas/DocumentsStepRead'
    BusinessStep:
      type: object
      description: Business 步（向导第 2 步）。Currency × Country 有效组合以后端配置为准；Services 步选了任一线上支付方式时 typeOfOnlineService 必填、为 WEBSITE 时 websiteUrl 必填（在 Services 步保存与提交时校验）。
      additionalProperties: false
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        country:
          type: string
          maxLength: 2
          description: ISO-3166 国家码（有效 Currency × Country 组合以后端配置为准）。
        legalBusinessName:
          type: string
          maxLength: 128
          description: 身份字段（激活后不可改）。
        tradeName:
          type: string
          maxLength: 128
        typeOfOwnership:
          allOf:
            - $ref: '#/components/schemas/OwnershipType'
          description: 身份字段（激活后不可改）。
        registrationNumber:
          type: string
          maxLength: 64
        businessAddress:
          type: string
          maxLength: 256
        city:
          type: string
          maxLength: 64
        province:
          type:
            - string
            - 'null'
          maxLength: 64
          description: 取自 `/config/countries` 里所选 country 那一组的 `provinces[].code`（ISO 3166-2 地区部分），展示名取同项的 `label`；改 country 后须重选。所选国家有省 / 州候选时必填；没有的国家不设值：新填不传，已存的旧值传 `null` 清掉。
        postalCode:
          type:
            - string
            - 'null'
          maxLength: 16
          description: 邮编，按所选国家的格式校验（前端参考数据预校，服务端重校）。所选国家有邮编制度时必填；没有的国家不设值：新填不传，改 country 后已存的旧值传 `null` 清掉。
        timeZone:
          type:
            - string
            - 'null'
          maxLength: 64
          description: 商户 IANA 时区（如 `America/Toronto`，不用 PT / ET 缩写）。候选随所选省 / 州、无省 / 州的国家按国家，取 `/config/countries` 下发的 `timeZones`，服务端按同一候选校验。改 country 后须重选，还没选定时传 `null` 清掉旧值。
        language:
          allOf:
            - $ref: '#/components/schemas/Language'
          description: 商户语言：发给商户的通知（邮件、微信、站内信）与月对账单 PDF 按它出；界面语言、收据与导出文件、发给某个人本人的邮件不看它，按用户自己的语言。
        businessPhone:
          allOf:
            - $ref: '#/components/schemas/Phone'
          description: 商户营业电话。区号候选取自前端参考数据，服务端校验区号在白名单内。
        industryCategory:
          type: string
          maxLength: 64
          description: 行业大类码（`/config/industries` 的 `items[].code`，如 `A0`），不是展示名，展示名取同项的 `label`。身份字段（激活后不可改）。
        mcc:
          type: string
          maxLength: 4
          description: 四位 MCC，级联 Industry（取自所选大类的 `mccOptions[].code`，展示名取同项的 `label`）；身份字段（激活后不可改）。
        typeOfOnlineService:
          oneOf:
            - $ref: '#/components/schemas/OnlineServiceType'
            - type: 'null'
          description: 线上服务类型。本步选填、无默认值；Services 步选了任一线上支付方式时必填。`null` = 清空。
        websiteUrl:
          oneOf:
            - $ref: '#/components/schemas/WebsiteUrl'
            - type: 'null'
          description: 经营网址（http / https）。typeOfOnlineService = WEBSITE 且选了线上支付方式时必填。`null` = 清空。
        note:
          type:
            - string
            - 'null'
          maxLength: 300
    SettlementStep:
      type: object
      description: |
        Step 4 Settlement。

        - `refundPin` + `confirmRefundPin` / `bankAccount.accountNumber` 均 write-only 输入、绝不在响应回明文；read 走掩码 + 已填标志（`bankAccount.accountNumberMasked` / `accountNumberSet` / `refundPinSet`）供跨设备恢复。
        - `refundPin` 两者须一致否则 400（格式见 `RefundPin`）。
        - Legal Business Name 的核对回显由前端直接读 `steps.business.legalBusinessName`（不重复为独立字段）。
        - Business 步所填 Country 在 `/config/settlement` 的 `bankAccountTypes` 里无条目（平台不对该国商户出款）时，本步不采集 `bankName` / `bankAccount` / `settlementCycle` / `storeId`，只收 Refund PIN。
      additionalProperties: false
      properties:
        bankName:
          type: string
          maxLength: 128
        bankAccount:
          allOf:
            - $ref: '#/components/schemas/BankAccountIdentification'
          description: |
            结算银行账户（制式 = `/config/settlement` 的 `bankAccountTypes` 里 Business 步所填 Country 对应的 `type`）。

            银行账户组（`bankName` + 制式与该制式全部字段含账号）齐全才保存，缺任一项整组不保存、`accountNumberSet` 为 false；账号为只写字段，已保存（`accountNumberSet = true`）且本次未传时沿用已存值、其余字段以本次提交为准；`storeId` 随该组保存。`mode=next` 的完整性按 `accountNumberSet` 判。
        settlementCycle:
          allOf:
            - $ref: '#/components/schemas/SettlementCycleCode'
          description: 结算周期——传**候选项的** `code`（取自 `/config/settlement` 的 `settlementCycleOptions`）。初始选中口径见该数组的说明，本字段不重述。
        settlementCycleDisplayName:
          type: string
          minLength: 1
          readOnly: true
          description: '`settlementCycle` 的展示名（如 `T+2 Business Days`）。**与 `settlementCycle` 同进退**： 有 `settlementCycle` 就一定有本键，没有就**两者都没有**。 **能读到候选集的消费方可忽略本键**、按 `code` 取自己的展示文案；拿不到候选集时直接展示本键即可。 ⚠️ 极少数情况下本键可能就等于 `code` 本身（服务端解析不出时的兜底），FE 直接展示、不必特判。'
        storeId:
          oneOf:
            - $ref: '#/components/schemas/StoreId'
            - type: 'null'
          description: 可选；后续可改。
        refundPin:
          allOf:
            - $ref: '#/components/schemas/RefundPin'
          description: 入驻时初设的 Refund PIN。
        confirmRefundPin:
          allOf:
            - $ref: '#/components/schemas/RefundPin'
          description: 再次输入 Refund PIN；须与 `refundPin` 一致，不一致 → 400。
        refundPinSet:
          type: boolean
          readOnly: true
          description: 是否已设 Refund PIN（write-only PIN 不回显，前端据此判断 Step 4 PIN 是否完成；跨设备恢复）。
    DocumentsStep:
      type: object
      description: Step 5 Documents。docIncorporation / docOwnerId / docVoidCheque 必传；docStoreInside / docStoreOutside 在 Services 步选了线下支付方式时必传；docOther1 / docOther2 可选。绑定按 fileId。
      additionalProperties: false
      properties:
        docStoreInside:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docStoreOutside:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docIncorporation:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docOwnerId:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docVoidCheque:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docOther1:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
        docOther2:
          oneOf:
            - $ref: '#/components/schemas/DocumentRef'
            - type: 'null'
    FileUploadForm:
      type: object
      additionalProperties: false
      description: |
        上传入参(`multipart/form-data`)。文件经本平台中转存入对象存储;按 `purpose` 校验实际文件的格式与大小,不合规 → 400。

        不要手设 `Content-Type`:直接提交 `FormData`,由客户端带上 `boundary`。
      required:
        - file
        - purpose
      properties:
        file:
          type: string
          format: binary
          description: 文件本体。
        purpose:
          type: string
          description: 文件用途,决定允许的格式、大小上限与取用方式;每个上传入口只接受它所属业务范围内的用途。
    MerchantFilePurpose:
      type: string
      description: |
        文件用途目录——用途决定允许的格式、大小上限与取用方式；每个上传入口只接受它列出的子集，传入其他用途 → 400。

        | 用途 | 允许格式 | 大小上限 | 传上去之后怎么取用 |
        |---|---|---|---|
        | `onboarding_document` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（含身份与银行资料，仅授权主体可取） |
        | `void_cheque` | PNG / JPEG / PDF | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `store_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（仅授权主体可取） |
        | `office_photo` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址 |
        | `merchant_logo` | PNG / JPEG | **512KB（固定上限）** | 长效稳定的公开地址（要展示给外部访客） |
        | `payment_page_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `link_banner` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `giftcard_brand_logo` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `product_image` | PNG / JPEG | 默认 2MB（可配置） | 长效稳定的公开地址（渲染给付款人） |
        | `channel_application_material` | PNG / JPEG | 默认 2MB（可配置） | 每次取用现签一个短时效地址（渠道报备用的营业执照与网站截图，仅授权主体可取） |

        **短时效地址不要持久化、不要分享**（过期即失效，重新读取所在资源可拿到新的）；长效公开地址可直接放进页面。
      enum:
        - onboarding_document
        - void_cheque
        - store_photo
        - office_photo
        - merchant_logo
        - payment_page_logo
        - link_banner
        - giftcard_brand_logo
        - product_image
        - channel_application_material
    UploadedFile:
      type: object
      additionalProperties: false
      description: |
        已上传的文件。上传成功不等于生效:`fileId` 要随对应的业务写操作提交,文件才归属该业务对象;从未被引用的文件不生效,前端无需处理。
      required:
        - fileId
        - fileName
        - fileSize
        - contentType
        - previewUrl
      properties:
        fileId:
          $ref: '#/components/schemas/FileId'
          description: 该文件的稳定引用,业务写操作提交它;不要保存任何物理地址。
          examples:
            - 0f8c2a6e4b1d47f0a9c3e5d7b2148a6f
        fileName:
          type: string
          description: 原始文件名。
        fileSize:
          type: integer
          format: int64
          description: 字节数。
        contentType:
          type: string
          description: 服务端判定的内容类型。
        previewUrl:
          $ref: '#/components/schemas/WebUrl'
          description: 可渲染地址(只出不入),供上传后立即回显。按用途分长效公开地址或短时效地址,短时效的不要持久化。
  responses:
    MerchantBffDefaultError:
      description: 失败。原因看响应体的 `code`，本接口会返回的业务码见接口说明；怎么读见 API 基础约定「错误响应体」。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
