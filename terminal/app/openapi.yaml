  /device/transaction/record:
    get:
      tags:
        - orders
      operationId: listTransactions
      x-required-privilege: orders:payment:view
      summary: 交易流水，按日分组
      description: |
        返回当前商户及其全部子商户的交易流水，按时间倒序分页，每页的行按营业日分组。

        流水的行：

        - 成交的收款，一单一行，时间是成交时刻。
        - 受理的退款（处理中或成功），一笔一行，时间是受理时刻。
        - 未成交、失败、被拒的订单不列；进入审核还没有受理的退款不列。

        日期都按商户营业日：`begin`、`end` 是营业日，原样匹配，不按设备时区换算；`item_key` 是行所属的营业日。时间按商户时区。

        `item_statistics` 是这一个营业日里、与列表同范围同条件的收款合计与退款合计，不只是本页的行。同一个营业日的行跨页时，每一页都有这一天的组，`item_statistics` 相同。

        登录者是 `role` 为 3 的成员（`role` 的取法见 `TerminalRole`）时，最早只能查到当前营业日往前 N 天，N 由运营按商户设置，没有设置时不限；不带 `begin` 或 `begin` 早于它时，早于的部分不返回，不报错。

        下列情形返回 `400`：

        - `begin` 或 `end` 不是合法的 `yyyyMMdd` 日期。
        - `channel`、`order_status` 的取值不认识。
        - 带了 `order_id` 又带了 `begin`、`end`，区间超过上限（默认 31 天，可配置）。
        - 权限不足：需要商户后台查看支付订单的权限。
      parameters:
        - name: begin
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]{8}$
          description: 起始营业日，`yyyyMMdd`，含当天；不带时不限下界
        - name: end
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]{8}$
          description: 截止营业日，`yyyyMMdd`，含当天；不带时不限上界
        - name: channel
          in: query
          required: false
          schema:
            type: string
            enum:
              - ''
              - ALL
              - WECHAT
              - ALIPAY
              - ALIPAYONLINE
              - ALIPAYPLUS
              - ALIPAYAPS
              - APSINSTORE
              - ALIPAYPLUS_ALL
              - APSCASHIER
              - CBBANKPAY
              - UNIONPAY
              - UNIONPAYONLINE
              - CREDITCARD
            default: ALL
          description: 按支付方式品牌筛；`ALL`、空串或不带时不筛
        - name: order_id
          in: query
          required: false
          schema:
            type: string
          description: |
            搜索框里的内容。订单号、商户订单号、渠道流水号、商品描述、退款原因里包含它的，或订单总额与它相等的，这一行即算匹配；空串按不带处理
        - name: order_status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ALL
              - PAID
              - ALL_REFUNDED
              - REFUNDED
              - PARTIAL_REFUNDED
              - FULL_REFUNDED
              - SUCCESS
              - FAILED
              - CLOSED
            default: PAID
          description: |
            按行所属订单的状态筛，不带时为 `PAID`：

            - `ALL` 不筛。
            - `PAID` 状态为 `5`、`6`、`7`。
            - `ALL_REFUNDED`、`REFUNDED` 状态为 `6`、`7`。
            - `PARTIAL_REFUNDED` 状态为 `6`。
            - `FULL_REFUNDED` 状态为 `7`。
            - `SUCCESS` 状态为 `5`。
            - `FAILED` 状态为 `1`、`4`；`CLOSED` 状态为 `3`。流水不列未成交的订单，这两个取值查不到行。
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: mch_ids
          in: query
          required: false
          schema:
            type: string
          description: 逗号分隔的商户号。收下不用，范围恒为当前商户及其全部子商户
        - name: order_clear_status
          in: query
          required: false
          schema:
            type: string
          description: 收下不用。现网取 `readyToClear` 或 `cleared`
      responses:
        '200':
          description: 一页流水，按营业日分组；没有行时 `data.data` 为空数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    $ref: '#/components/schemas/TransactionRecordPage'
              example:
                status: 200
                message: Success
                data:
                  data:
                    - item_key: '2026-10-06'
                      item_statistics:
                        tran_total_pay_fee: 14
                        tran_total_ref_fee: 5.25
                      item_data:
                        - order_id: '202610061902001001'
                          refund_id: R100240001
                          currency: CAD
                          channel: Wechat
                          clear_fee: 5.25
                          status: 6
                          preAuth: false
                          tran_date: '2026-10-06'
                          tran_time: '12:15:21'
                        - order_id: '202610061902001001'
                          currency: CAD
                          channel: Wechat
                          clear_fee: 14
                          status: 6
                          preAuth: false
                          tran_date: '2026-10-06'
                          tran_time: '12:02:05'
                  pagination:
                    page: 1
                    limit: 20
                    totalCount: 2
                    totalPages: 1
                    lastPage: true
                timestamp: '2026-10-06T20:12:40.517+00:00'
                traceId: 9e4a1c07d3b25f68
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
