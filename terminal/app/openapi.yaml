  /device/employee/management/update:
    post:
      tags:
        - team
      operationId: updateEmployee
      x-required-privilege: session
      summary: 修改员工：角色、显示名、登录密码，或解绑微信
      description: |
        `account_id` 指定成员。`delBinding` 为 `true` 时只解绑微信，其余键不看；否则带了的 `role`、`nick_name`、`pwd` 都改。成功时 `data` 为 `null`。

        | 带的键 | 做什么 |
        |---|---|
        | `role` | 把成员的角色整组换成店长（`2`）或收银员（`3`） |
        | `nick_name` | 改显示名 |
        | `pwd` | 重置登录密码，须满足密码规则（至少 8 位，含大写字母、小写字母、数字与特殊字符）；该成员所有设备与会话上的登录随之失效 |
        | `delBinding` 为 `true` | 解绑该成员的微信：这个微信不能再登录商户后台，当前商户也不再给它发收款通知 |

        Owner 那一行只能改显示名与解绑微信；登录者不能改自己的角色、不能重置自己的登录密码。

        本接口标的 `session` 覆盖登录者改自己的显示名、解绑自己的微信。登录者不能在这里重置自己的登录密码；改别的成员须有商户后台「成员管理」的权限（`account:team:manage`）。

        下列情形返回 `400`，`message` 写明原因：

        - 成员不存在，或不属于当前商户，两者不区分。
        - `role` 不是 `2` 或 `3`；对 Owner 改显示名与解绑微信以外的项；登录者改自己的角色。
        - 登录者重置自己的登录密码，`message` 提示改用修改密码（`changePassword`）。
        - `pwd` 不满足密码规则。
        - 除 `account_id` 外一项都没带。
        - `206013` 要给的角色、或该成员现有的角色超出登录者的权限边界。
        - `208035` 商户处于仅查看状态，不能改员工。
        - 权限不足：改别的成员需要商户后台「成员管理」的权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeUpdateRequest'
            examples:
              role:
                summary: 改角色
                value:
                  account_id: opr_7b20d4e9
                  role: 2
              unbind:
                summary: 解绑微信
                value:
                  account_id: opr_7b20d4e9
                  delBinding: true
      responses:
        '200':
          description: 已修改，`data` 为 `null`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status: 200
                message: Success
                data: null
                timestamp: '2026-10-07T19:33:51.682+00:00'
                traceId: 9f0d3b26e7a41c58
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 206013
        - 208035
