      x-required-privilege: session
      summary: 修改登录邮箱 — 向当前邮箱发验证码
      description: |
        修改登录者本人的登录邮箱分三步：本接口向当前登录邮箱发验证码；`updateMerchantEmail` 带上这个验证码与新邮箱，新邮箱随即收到另一封验证码；`confirmMerchantEmail` 带上新邮箱收到的验证码，完成修改。登录者是商户 Owner 时，商户的联系邮箱随之改变。

        返回本次的 `ticket`。账号开了验证器时不发邮件，下一步填验证器上的码。同一账号同时只有一笔修改在进行，重新发起会作废上一笔。

        下列情形返回 `400`，`message` 写明原因：

        - 发得太频繁，还在冷却中。
        - `968006` 登录名不是邮箱的账号不能修改登录邮箱。
        - `208035` 商户处于仅查看状态，不能修改登录邮箱。
      parameters:
        - name: email
          in: query
          required: false
          schema:
            type: string
          description: 当前登录邮箱。收下不用
      responses:
        '200':
          description: 已发起
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailCodeTicketEnvelope'
              example:
                status: 200
                message: Success
                data:
                  ticket: chl_0c5e8b23a7d14f96
                timestamp: '2026-10-07T19:10:05.317+00:00'
                traceId: 7f4a2c90b1e35d68
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 208035
        - 968006
  /device/merchant/email:
    post:
      tags:
        - account
      operationId: updateMerchantEmail
      x-required-privilege: session
      summary: 修改登录邮箱 — 校验当前邮箱的验证码并提交新邮箱
      description: |
        `ticket` 与 `ticketValue` 是 `sendMerchantEmailCode` 返回的票据与当前邮箱收到的验证码（开了验证器的填验证器上的码），`email` 是新邮箱。

        按请求头 `version`（App 版本号）分两种：

        - 不低于支持确认步的版本（可配置）：校验通过后向新邮箱发一封带验证码的邮件，返回 `200`、`data` 为 `null`。此时登录邮箱还没有换，新邮箱已收到验证码，接着调 `confirmMerchantEmail` 完成。
        - 低于这个版本，或没带 `version`：不校验验证码、不向新邮箱发码，直接返回 `400`，`message` 提示升级 App 后再修改，登录邮箱不变。

        下列情形返回 `400`，`message` 写明原因：

        - `204010` 验证码不对，还可以重输。
        - `206006` `ticket` 无效，或验证码已过期、已用过，须重新发码。
        - `206007` 验证码输错次数超过上限，须重新发码。
        - `email` 不是合法的邮箱地址、与当前登录邮箱相同，或已被别人使用。
        - `208035` 商户处于仅查看状态，不能修改登录邮箱。
      parameters:
        - name: version
          in: header
          required: false
          schema:
            type: string
          description: App 版本号；低于支持确认步的版本或不带时返回 `400` 提示升级
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTicketRequest'
            example:
              email: owner@pinestreet.example.com
              ticket: chl_0c5e8b23a7d14f96
              ticketValue: '391504'
      responses:
        '200':
          description: 新邮箱已收到验证码，`data` 为 `null`；接着调 `confirmMerchantEmail`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status: 200
                message: Success
                data: null
                timestamp: '2026-10-07T19:11:20.461+00:00'
                traceId: 4c2a8e17f0d93b65
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 204010
        - 206006
        - 206007
        - 208035
  /device/merchant/email/confirm:
    post:
      tags:
        - account
      operationId: confirmMerchantEmail
      x-required-privilege: session
      summary: 修改登录邮箱 — 凭新邮箱收到的验证码完成（现网没有，旧包不调）
      description: |
        `updateMerchantEmail` 返回 `200` 之后调。`email` 是新邮箱，须与 `updateMerchantEmail` 提交的相同；`ticketValue` 是新邮箱收到的验证码。通过后登录邮箱换成新邮箱，旧邮箱收到通知，登录不受影响；登录者是商户 Owner 时，商户的联系邮箱随之改变。成功时 `data` 为 `null`。

        下列情形返回 `400`，`message` 写明原因：

        - `204010` 验证码不对，还可以重输。
        - `206006` 没有进行中的修改，或这笔修改已过期、已作废，或验证码已过期、已用过，须重新发码。
