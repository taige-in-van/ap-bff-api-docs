components:
  securitySchemes:
    sessionToken:
      type: apiKey
      in: header
      name: Authorization
      description: |
        `signIn` 返回的 `token`，原样放进本请求头，不加 `Bearer` 前缀。`registerPushToken` 现网带着 `Bearer ` 前缀，两种写法都接受。

        令牌是不透明的字符串。
    devCid:
      type: apiKey
      in: header
      name: devCid
      description: App 内置的固定值，所有安装都相同，同登录请求体里的 `devcid`。只要求带上，不据它识别身份。
  parameters:
    DevType:
      name: devType
      in: path
      required: true
      schema:
        type: string
        enum:
          - iphone
          - android
      description: 手机系统：iOS 发 `iphone`，Android 发 `android`
    BillId:
      name: bill_id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[0-9]+$
      description: 账单号，即 `createBill` 返回的 `bill_id`
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: 页码，从 1 开始
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 20
      description: 每页的行数（按行计，不按组计）
    AccountId:
      name: account_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/UserId'
      description: 成员的账号编号，即员工列表行上的 `account_id`
  responses:
    Rejected:
      description: 被拒绝。原因见响应体的 `code` 与 `message`；本接口会返回哪些 `code` 见接口说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TerminalFailure'
          example:
            status: 400
            message: Wrong Password
            data: null
            timestamp: '2026-10-06T18:20:31.482+00:00'
            traceId: 5f1c0a7be2d94c33
            code: 206012
    ReloginRequired:
      description: 需要重新登录。`code` 的取值见总说明「状态码」一节。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TerminalFailure'
          example:
            status: 403
            message: Device registration failed, please log in again
            data: null
            timestamp: '2026-10-06T18:20:31.482+00:00'
            traceId: 5f1c0a7be2d94c33
            code: 206014
  schemas:
    Envelope:
      type: object
      description: 成功响应的外壳，内容在 `data`。
      required:
        - status
        - message
        - timestamp
        - traceId
      properties:
        status:
          type: integer
          description: 成功时为 `200`
        message:
          type: string
          description: 成功时为 `Success`
        data:
          description: 接口返回的内容；没有内容时为 `null`
        timestamp:
          type: string
          description: 响应生成的时间
        traceId:
          type: string
          description: 本次请求的追踪号
    SignInRequest:
      type: object
      required:
        - username
        - password
        - ticket
        - randstr
        - uuid
      properties:
        username:
          type: string
          description: 登录名，用户名或邮箱。先按用户名精确匹配，匹配不到再按邮箱，不分大小写
        password:
          type: string
          format: password
        ticket:
          type: string
          description: 滑块验证通过后得到的票据
        randstr:
          type: string
          description: 滑块验证通过后与票据一起得到的随机串
        uuid:
          type: string
          description: 本机的设备标识
        devcid:
          type: string
          description: App 内置的固定值，同 `devCid` 头
    SignInResult:
      type: object
      required:
        - token
        - haveChild
        - clientId
        - devId
        - devType
        - uuid
      properties:
        token:
          type: string
          description: 令牌，之后原样放进 `Authorization` 头
        haveChild:
          type: boolean
          description: 登录者还有可以切换过去的其他商户时为 `true`
        clientId:
          type: integer
          description: 登录所在商户的商户号
        devId:
          $ref: '#/components/schemas/DeviceId'
          description: 这部手机在该商户下的设备编号
        devType:
          type: string
          description: 同路径上的 `devType`
        uuid:
          type: string
          description: 同请求里的 `uuid`
    SwitchMerchantRequest:
      type: object
      required:
        - username
        - uuid
      properties:
        username:
          type: string
          description: 目标商户的商户代码（商户列表里的 `client_moniker`）
        adminUser:
          type: string
          description: 登录时输入的用户名。现网的端会带，服务端不使用它
        uuid:
          type: string
          description: 本机的设备标识，同登录
        devcid:
          type: string
          description: App 内置的固定值，同登录
        devType:
          type: string
          description: 同路径上的 `devType`
    SwitchMerchantResult:
      type: object
      required:
        - token
        - haveChile
      properties:
        token:
          type: string
          description: 令牌，与请求带来的是同一个
        haveChile:
          type: boolean
          description: 登录者还有可以切换过去的其他商户时为 `true`，与登录响应的 `haveChild` 同义。字段名的拼写照现网
    SwitchableMerchant:
      type: object
      required:
        - client_id
        - client_moniker
        - short_name
        - click
      properties:
        client_id:
          type: integer
          description: 商户号
        client_moniker:
          type: string
          description: 商户代码，切换时作为 `username` 带回
        short_name:
          type: string
          description: 商户简称
        logo_thumbnail:
          type: string
          description: 商户 logo 缩略图的地址；没有 logo 时不返回
        click:
          type: boolean
          description: 是不是路径上 `clientMoniker` 指的那个商户
    PasswordType:
      type: string
      enum:
        - login
        - refund
      description: 密码种类：`login` 登录密码 / `refund` 退款密码。
    ChangePasswordRequest:
      type: object
      required:
        - oldpwd
        - pwd
        - type
      properties:
        oldpwd:
          type: string
          format: password
          description: 旧密码
        pwd:
          type: string
          format: password
          description: 新密码
        type:
          allOf:
            - $ref: '#/components/schemas/PasswordType'
          description: 改哪一个密码：`login` 登录密码，`refund` 退款密码
    CustomerSurchargeRequest:
      type: object
      required:
        - enable
      properties:
        enable:
          type: boolean
          description: '`true` 打开「顾客承担手续费」，`false` 关闭'
    MicropayRequest:
      type: object
      required:
        - currency
        - auth_code
        - amount
      properties:
        currency:
          type: string
          description: 标价币种，商户的结算币种或 `CNY`
        auth_code:
          type: string
          description: 顾客出示的付款码
        amount:
          type: integer
          minimum: 1
          description: 标价，单位是分
        remark:
          type: string
          description: 订单备注，可以为空串
        preauth:
          type: boolean
          default: false
          description: 为 `true` 时是预授权，付款成功后款项挂起、之后可以释放
        expire_time:
          type: string
          description: 收下不用。付款码的有效窗口由服务端定
        rate_flag:
          type: boolean
          description: 收下不用。是否加收顾客承担的手续费看商户级开关
    TransactionDetail:
      type: object
      description: 订单详情。金额是元：`refundFee` 是数值，其余金额是十进制字符串。时间按商户时区。
      required:
        - payOrderId
        - mchName
        - currency
        - payFee
        - inputFee
        - tipFee
        - refundFee
        - exchangeRate
        - transactionTime
        - createTime
        - tranDate
        - tranTime
        - orderStatus
        - preAuth
        - orderScene
        - channel
        - gateway
        - mchOrderId
        - remarks
        - orderDesc
        - orderRules
      properties:
        payOrderId:
          type: string
          description: 订单号
        mchName:
          type: string
          description: 订单所属商户的简称
        currency:
          type: string
          description: 标价币种
        payFee:
          type: string
          description: 订单总额，即金额加小费
        inputFee:
          type: string
          description: 金额（标价），不含小费
        tipFee:
          type: string
          description: 小费
        refundFee:
          type: number
          description: 已退金额，数值（与现网相同，不是字符串）
        exchangeRate:
          type:
            - string
            - 'null'
          description: 汇率；没有时为 `null`
        transactionTime:
          type:
            - string
            - 'null'
          description: 成交时间，`yyyy-MM-dd HH:mm:ss`；还没有成交时为 `null`
        createTime:
          type: string
          description: 建单时间，`yyyy-MM-dd HH:mm:ss`
        tranDate:
          type:
            - string
            - 'null'
          description: 成交日期，`yyyy/MM/dd`；还没有成交时为 `null`
        tranTime:
          type:
            - string
            - 'null'
          description: 成交时刻，`HH:mm:ss`；还没有成交时为 `null`
        orderStatus:
          $ref: '#/components/schemas/TerminalOrderStatus'
          description: 订单状态；预授权款项是否挂起看 `preAuth`
        preAuth:
          type: boolean
          description: 款项是否处于预授权挂起中
        orderScene:
          type: integer
          description: 订单来源的代码，取值与现网相同，例如 `1` POS 终端、`2` 商户 App、`3` 门店码
        channel:
          type:
            - string
            - 'null'
          description: 支付方式品牌，如 `Wechat`、`Alipay`、`UnionPay`；顾客还没选定支付方式时为 `null`
        gateway:
          type: string
          description: 受理方式的代码，取值与现网相同
        mchOrderId:
          type:
            - string
            - 'null'
          description: 商户订单号；没有时为 `null`
        remarks:
          type:
            - string
            - 'null'
          description: 订单备注，即下单时的 `remark`
        orderDesc:
          type:
            - string
            - 'null'
          description: 产品描述
        orderRules:
          type:
            - string
            - 'null'
          description: 同 `remarks`
        refundTrans:
          type: array
          description: 退款记录，只在 `orderStatus` 为 `6` 或 `7` 时返回；只列已受理的退款（处理中与成功），按创建时间倒序；各项形状与 `payType` 为 `Debit` 的退款详情相同
          items:
            $ref: '#/components/schemas/RefundDetail'
        orderReference:
          type: object
          description: 付款人付款时填写的附加信息，键是信息项的名称；没有时不返回
        orderReferenceKeys:
          type: array
          description: '`orderReference` 里各项的先后顺序；没有时不返回'
          items:
            type: string
    RefundRequest:
      type: object
      required:
        - fee
        - refund_password
      properties:
        fee:
          type: number
          description: 退款金额，单位是元，服务端四舍五入到分；须为正数且不超过可退金额
        refund_password:
          type: string
          format: password
          description: 商户的退款密码，6 位
        remark:
          type: string
          maxLength: 300
          description: 退款备注，可以为空串；查退款详情时在 `refundRemark` 里返回
    RefundResult:
      type: object
      description: |
        退款的结果，按情形给不同的字段：

        - 退款已受理：`refund_id`、`partner_refund_id`、`amount`、`currency`、`result_code`。
        - 进入审核：`success` 与 `message`，没有 `refund_id`。
      properties:
        refund_id:
          $ref: '#/components/schemas/RefundId'
          description: 平台退款号，即 `getTransaction`（`payType` 为 `Debit`）的 `orderId`。仅退款已受理时返回
        partner_refund_id:
          $ref: '#/components/schemas/RefundId'
          description: 与 `refund_id` 相同。仅退款已受理时返回
        amount:
          type: integer
          description: 退款金额，单位是分。仅退款已受理时返回
        currency:
          type: string
          description: 退款币种，即订单的币种。仅退款已受理时返回
        result_code:
          allOf:
            - $ref: '#/components/schemas/TerminalRefundResultCode'
          description: |
            返回时退款的进展，仅退款已受理时返回：

            - `SUCCESS` 已提交渠道，处理中。
            - `FINISHED` 渠道已确认退款成功。
        success:
          type: boolean
          description: 恒为 `true`。仅进入审核时返回
        message:
          type: string
          description: 说明退款已提交审核的文案。仅进入审核时返回
    RefundDetail:
      type: object
      description: 一笔退款。`payType` 为 `Debit` 时 `getTransaction` 的 `data`，也是订单详情里 `refundTrans` 的元素。
      required:
        - refundId
        - refundFee
        - currency
        - refundTime
        - operator
        - refundRemark
      properties:
        refundId:
          $ref: '#/components/schemas/RefundId'
          description: 平台退款号
        refundFee:
          type: number
          description: 退款金额，单位是元，数值
        currency:
          type: string
          description: 退款币种，即订单的币种
        refundTime:
          type: string
          description: 渠道确认退款的时间，还没有确认时是退款单的创建时间；商户时区，`yyyy-MM-dd HH:mm:ss`
        operator:
          type:
            - string
            - 'null'
          description: 发起退款的员工的显示名；没有时为 `null`
        refundRemark:
          type:
            - string
            - 'null'
          description: 退款备注，即退款时的 `remark`；没有时为 `null`
    StaticQrcode:
      type: object
      required:
        - mch_name
        - code_url
        - code_img_url
      properties:
        mch_name:
          type: string
          description: 商户简称
        code_url:
          type: string
          description: 码内容。门店码与预授权码是这个商户店铺码的付款地址；银联码是银联的静态码串，不含金额
        code_img_url:
          type: string
          description: 把码内容渲染成的二维码图片，PNG 的 data URI（`data:image/png;base64,…`）
    HomeSummary:
      type: object
      description: 首页汇总。金额按结算币种，单位是元，数值。
      required:
        - mch_id
        - mch_code
        - mch_name
        - mch_currency
        - mch_balance
        - today_collection
        - today_count
        - today_Refund
      properties:
        mch_id:
          type: integer
          description: 当前商户的商户号
        mch_code:
          type: string
          description: 当前商户的商户代码
        mch_name:
          type: string
          description: 当前商户的简称
        mch_currency:
          type: string
          description: 当前商户的结算币种
        mch_balance:
          type: number
          description: 账户余额：可结算余额减去商户欠平台的钱，含预授权挂起中的款项，可能为负，按结算币种，单位是元。与商户后台余额卡片上的账户余额（`accountBalance`）是同一个量
        today_collection:
          type: number
          description: 今天（当前营业日）成交的收款金额合计
        today_count:
          type: integer
          description: 今天成交的收款笔数，一单一笔
        today_Refund:
          type: number
          description: 今天受理的退款金额合计（处理中或成功），正数。字段名的大小写照现网
        alipay_rate:
          type: string
          description: 支付宝对结算币种的最新汇率，保留 4 位小数（多余的舍去）；取不到时不返回
        alipay_trend:
          type: number
          description: 支付宝最新汇率减去前一次的汇率；没有变化或没有前一次时为 `0`；取不到汇率时不返回
        wechat_rate:
          type: string
          description: 微信支付的最新汇率，写法同 `alipay_rate`；取不到时不返回
        wechat_trend:
          type: number
          description: 微信支付汇率的涨跌，算法同 `alipay_trend`；取不到汇率时不返回
        unionpayonline_rate:
          type: string
          description: 银联在线的最新汇率，写法同 `alipay_rate`；取不到时不返回
        unionpayonline_trend:
          type: number
          description: 银联在线汇率的涨跌，算法同 `alipay_trend`；取不到汇率时不返回
    TransactionRecordPage:
      type: object
      description: 一页流水。
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: 本页的行按营业日分组，组按日期倒序；没有行时为空数组
          items:
            $ref: '#/components/schemas/TransactionDayGroup'
        pagination:
          $ref: '#/components/schemas/Pagination'
    TransactionDayGroup:
      type: object
      description: 一个营业日的行。
      required:
        - item_key
        - item_data
        - item_statistics
      properties:
        item_key:
          type: string
          description: 营业日，`yyyy-MM-dd`
        item_data:
          type: array
          description: 本页里属于这个营业日的行，按时间倒序
          items:
            $ref: '#/components/schemas/TransactionRecord'
        item_statistics:
          type: object
          description: 这个营业日的合计，与列表同范围同条件，不只是本页的行。按结算币种，单位是元，数值
          required:
            - tran_total_pay_fee
            - tran_total_ref_fee
          properties:
            tran_total_pay_fee:
              type: number
              description: 收款合计
            tran_total_ref_fee:
              type: number
              description: 退款合计，正数
    TransactionRecord:
      type: object
      description: 流水的一行：一笔成交的收款，或一笔受理的退款。时间按商户时区。
      required:
        - order_id
        - currency
        - channel
        - clear_fee
        - status
        - preAuth
        - tran_date
        - tran_time
      properties:
        order_id:
          $ref: '#/components/schemas/OrderId'
          description: 订单号；退款行是原订单的订单号
        refund_id:
          $ref: '#/components/schemas/RefundId'
          description: 平台退款号，只在退款行返回
        currency:
          type: string
          description: 订单的标价币种
        channel:
          type: string
          description: 支付方式品牌，取值同订单详情的 `channel`
        clear_fee:
          type: number
          description: |
            这一行的金额，单位是元，数值：

            - 收款行是成交金额，按结算币种；人民币标价的订单取订单总额（人民币）。结算额尚未从通道到达的收款，该行为标价金额。
            - 退款行是这笔退款的金额（正数），按订单的标价币种。
        status:
          $ref: '#/components/schemas/TerminalOrderStatus'
          description: 所属订单当前的状态，取值见 `TerminalOrderStatus`；预授权款项是否挂起看 `preAuth`
        preAuth:
          type: boolean
          description: 所属订单的款项是否处于预授权挂起中
        tran_date:
          type: string
          description: 这一行所属的营业日，`yyyy-MM-dd`，与所在组的 `item_key` 相同
        tran_time:
          type: string
          description: 收款行是成交时刻，退款行是受理时刻；`HH:mm:ss`
    AnalyticsCharts:
      type: object
      description: 数据分析图表的数据。
      required:
        - list
        - info
      properties:
        list:
          type: array
          description: 按时段的点，按时间先后排列；粒度见接口说明
          items:
            $ref: '#/components/schemas/AnalyticsPoint'
        info:
          type: object
          description: 新老客户的统计。不提供，三个数恒为 `0`
          required:
            - sumCount
            - oldCount
            - newCount
          properties:
            sumCount:
              type: integer
              description: 恒为 `0`
            oldCount:
              type: integer
              description: 恒为 `0`
            newCount:
              type: integer
              description: 恒为 `0`
    AnalyticsPoint:
      type: object
      description: 一个时段的点。金额按结算币种，单位是元，数值。
      required:
        - date
        - payAmount
        - payCount
        - newCust
        - oldCust
      properties:
        date:
          type: string
          description: 时段的标签：按小时为 `HH:00`，按日为 `yyyy-MM-dd`，按月为 `yyyy/MM`
        payAmount:
          type: number
          description: 这个时段成交的收款金额减去受理的退款金额
        payCount:
          type: integer
          description: 这个时段成交的收款笔数，一单一笔
        newCust:
          type: integer
          description: 恒为 `0`
        oldCust:
          type: integer
          description: 恒为 `0`
    BillCreateRequest:
      type: object
      required:
        - bill_amount
        - currency
        - expiration_time
      properties:
        bill_amount:
          type: integer
          minimum: 1
          description: 账单金额，单位是分
        currency:
          type: string
          description: 账单币种，商户的结算币种或 `CNY`
        bill_remark:
          type: string
          maxLength: 300
          description: 账单说明，可以为空串；详情里以 `remark` 返回
        expiration_time:
          type: string
          enum:
            - today
            - 24h
            - 48h
            - 72h
          description: |
            有效期，换算成到期日：

            - `today` 到期日为当天。
            - `24h` 到期日为次日。
            - `48h` 到期日为后天。
            - `72h` 没有到期日。
        pre_auth_flag:
          type: boolean
          default: false
          description: 为 `true` 时顾客付这张账单走预授权，付款成功后款项挂起、之后可以释放
    BillCreateResult:
      type: object
      required:
        - bill_id
      properties:
        bill_id:
          type: string
          pattern: ^[0-9]+$
          description: 账单号，纯数字的字符串，商户内递增、从 10001 起，与商户后台账单列表里的账单号相同
    BillListPage:
      type: object
      description: 一页账单。
      required:
        - pagination
        - data
      properties:
        pagination:
          $ref: '#/components/schemas/Pagination'
        data:
          type: array
          description: 本页的行按创建日期分组，组按日期倒序；没有行时为空数组
          items:
            $ref: '#/components/schemas/BillDayGroup'
    BillDayGroup:
      type: object
      description: 一个创建日期的账单。
      required:
        - item_key
        - item_data
      properties:
        item_key:
          type: string
          description: 创建日期，`yyyy-MM-dd`，按商户时区
        item_data:
          type: array
          description: 本页里这一天创建的账单，按创建时刻倒序
          items:
            $ref: '#/components/schemas/BillListRow'
    BillStatus:
      type: integer
      enum:
        - 1
        - 2
      description: 账单状态：`1` 未付；`2` 已付，或过了到期日仍未付。
    BillListRow:
      type: object
      description: 列表的一行，一张账单。各情形下 `bill_status`、`order_status`、`cancle_time` 的取值见 `listBills` 的说明。
      required:
        - bill_id
        - bill_status
        - currency
        - cancle_time
        - bill_amount
      properties:
        bill_id:
          type: string
          pattern: ^[0-9]+$
          description: 账单号，纯数字的字符串
        bill_status:
          allOf:
            - $ref: '#/components/schemas/BillStatus'
          description: '`1` 未付；`2` 已付，或过了到期日仍未付'
        order_status:
          type: string
          enum:
            - '1'
          description: 恒为 `"1"`，表示账单已付；账单未付时不返回
        currency:
          type: string
          description: 账单币种
        cancle_time:
          type: integer
          description: 到付款截止时刻（到期日结束的那一刻，商户时区）的剩余毫秒，过了为 `0`；没有到期日为 `-1`。字段名的拼写照现网
        bill_amount:
          type: number
          description: 账单金额，单位是元，两位小数的数值
    BillDetail:
      type: object
      description: 账单详情。
      required:
        - bill_info
        - data
      properties:
        bill_info:
          $ref: '#/components/schemas/BillInfo'
        data:
          type: array
          description: 付清这张账单的订单，按付款日期分组；账单已付时一组一行，未付或付款后被自动退回时为空数组
          items:
            $ref: '#/components/schemas/BillOrderDayGroup'
    PayWay:
      type: string
      enum:
        - wechat
        - alipay
        - alipayonline
        - unionpay
        - unionpayonline
        - creditcard
      description: 现网的支付方式码：`wechat` 微信支付 / `alipay` 支付宝（店内）/ `alipayonline` 支付宝（线上）/ `unionpay` 银联（店内）/ `unionpayonline` 银联（线上）/ `creditcard` 信用卡。
    BillInfo:
      type: object
      description: 账单的二维码与账单信息。
      required:
        - code_img_url
        - mch_company_name
        - bill_amount
        - currency
        - payways
        - bill_status
      properties:
        code_img_url:
          type: string
          description: 账单的二维码图片，PNG 的 data URI（`data:image/png;base64,…`）；码内容是这张账单的付款地址，与商户后台账单的付款链接相同
        mch_company_name:
          type: string
          description: 商户的公司名
        bill_amount:
          type: number
          description: 账单金额，单位是元，两位小数的数值
        currency:
          type: string
          description: 账单币种
        remark:
          type: string
          description: 账单说明，即新建时的 `bill_remark`；没有时不返回
        payways:
          type: array
          description: 商户当前能受理的支付方式，按请求时的开通情况算；码值的命名与现网相同；不会含 `unionpay`
          items:
            $ref: '#/components/schemas/PayWay'
        bill_status:
          allOf:
            - $ref: '#/components/schemas/BillStatus'
          description: '`1` 未付；`2` 已付，或过了到期日仍未付'
    BillOrderDayGroup:
      type: object
      description: 一个付款日期的订单。
      required:
        - item_key
        - item_data
      properties:
        item_key:
          type: string
          description: 付款成功那天的日期，`yyyy-MM-dd`，按商户时区
        item_data:
          type: array
          items:
            $ref: '#/components/schemas/BillOrderRow'
    BillOrderRow:
      type: object
      description: 付清这张账单的订单。
      required:
        - order_id
        - pay_amount
        - currency
        - tran_time
      properties:
        order_id:
          $ref: '#/components/schemas/OrderId'
          description: 订单号，即 `getTransaction`（`payType` 为 `Credit`）的 `orderId`
        pay_amount:
          type: number
          description: 付款金额，单位是元，数值
        currency:
          type: string
          description: 订单币种
        tran_time:
          type: string
          description: 付款成功的时间，按商户时区，`yyyy-MM-dd HH:mm:ss`
    Pagination:
      type: object
      description: 分页信息，按行计。
      required:
        - page
        - limit
        - totalCount
        - totalPages
        - lastPage
      properties:
        page:
          type: integer
          description: 本页的页码
        limit:
          type: integer
          description: 每页的行数
        totalCount:
          type: integer
          description: 符合条件的总行数
        totalPages:
          type: integer
          description: 总页数
        lastPage:
          type: boolean
          description: 本页是不是最后一页
    UnreadCounts:
      type: object
      required:
        - order_message_count
        - notice_message_count
      properties:
        order_message_count:
          type: integer
          minimum: 0
          description: 订单消息的未读数，按登录者本人算
        notice_message_count:
          type: integer
          minimum: 0
          description: 站内信的未读数，按商户算
    AccountBalance:
      type: object
      description: 当前商户的待结算余额与退款账户。按结算币种，单位是元，数值。
      required:
        - tranBalance
        - rechargeBalance
        - refundQuota
      properties:
        tranBalance:
          type: number
          description: 待结算余额（不含预授权挂起）：还没结算的收款减去退款等扣减后的净额，可能为负。与商户后台的待结算金额（`toSettle`）是同一个量
        rechargeBalance:
          type: number
          description: 退款账户的余额
        refundQuota:
          type: number
          description: 退款账户的最低金额；没有开自动补足时为 `0`
    SubMerchantBalances:
      type: object
      required:
        - sub_balances
      properties:
        sub_balances:
          type: array
          description: 第一项是当前商户，其后是当前商户名下、登录者可以访问的关联商户
          items:
            $ref: '#/components/schemas/SubMerchantBalance'
    SubMerchantBalance:
      type: object
      required:
        - mch_id
        - mch_balance
      properties:
        mch_id:
          type: string
          description: 商户号，数字串
        mch_name:
          type: string
          description: 商户简称；没有值不返回本键
        mch_balance:
          type: number
          description: 账户余额，与首页汇总的 `mch_balance` 是同一个量：可结算余额减去商户欠平台的钱，含预授权挂起中的款项，可能为负；按该商户的结算币种，单位是元
    MerchantInfo:
      type: object
      description: 商户资料。
      required:
        - mch_code
        - company_name
        - mch_abbreviation
        - contact_name
        - contact_email
        - order_expiry_time
        - mch_timezone
        - client_pay_surcharge
        - payInfo
      properties:
        mch_code:
          type: string
          description: 商户代码
        company_name:
          type: string
          description: 公司名
        mch_abbreviation:
          type: string
          description: 商户简称
        service_phone:
          type: string
          description: 营业电话；没有值不返回本键
        address:
          type: string
          description: 地址；没有值不返回本键
        city:
          type: string
          description: 城市；没有值不返回本键
        province:
          type: string
          description: 省或州的代码，如 `BC`；没有值不返回本键
        postal_code:
          type: string
          description: 邮编；没有值不返回本键
        country:
          type: string
          description: 国家，写法与现网相同，如 `CANADA`；没有值不返回本键
        contact_name:
          type: string
          description: 商户 Owner 的姓名，名与姓以一个空格连接
        contact_phone:
          type: string
          description: 商户 Owner 的电话；没有值不返回本键
        contact_email:
          type: string
          description: 商户 Owner 的登录邮箱
        logo_url:
          type: string
          description: 商户 Logo 的地址；没有 Logo 时不返回本键
        order_expiry_time:
          type: string
          description: 订单有效期，整小时写成 `Nh`（如 `2h`），否则写成分钟数 `Nm`（如 `15m`）
        mch_timezone:
          type: string
          description: 商户时区，IANA 时区名
        client_pay_surcharge:
          type: boolean
          description: 是否开启了顾客承担手续费
        payInfo:
          $ref: '#/components/schemas/PaySettingInfo'
        bankInfo:
          $ref: '#/components/schemas/MerchantBankInfo'
    PaySettingInfo:
      type: object
      description: 店铺码收款页设置。`getMerchantInfo` 返回时除 `note`（没有值不返回本键）外都返回；`updatePaymentPageSettings` 收的也是这一份，其中 `full_pay_switch`、`child_refund_switch`、`mch_refund_switch`、`remarks_are_required` 收下不用。
      required:
        - user_info_switch
        - remark_switch
        - remarks_are_required
        - tip_switch
      properties:
        user_info_switch:
          type: boolean
          description: 收款页是否向付款人收姓名与手机号
        remark_switch:
          type: boolean
          description: 收款页是否有备注栏
        remarks_are_required:
          type: boolean
          description: 恒为 `false`。保存时收下不用
        user_input_title:
          type: string
          description: 商户自定义的填写项，JSON 数组文本，如 `[{"title":"Table No."}]`；没有时为 `[]`
        tip_switch:
          type: boolean
          description: 是否开启小费
        tip_preset_value:
          type: string
          description: 三档预设小费百分比，0 到 30 的整数，半角逗号分隔，如 `10,15,20`
        note:
          type: string
          description: 收款页上的提示语；没有值不返回本键
        full_pay_switch:
          type: boolean
          description: 恒为 `true`。保存时收下不用
        child_refund_switch:
          type: boolean
          description: 恒为 `false`。保存时收下不用
        mch_refund_switch:
          type: boolean
          description: 恒为 `false`。保存时收下不用
    MerchantBankInfo:
      type: object
      description: 结算银行账户。商户还没有结算账户时 `getMerchantInfo` 不返回本键。
      required:
        - account_number
        - account_name
        - bank_name
        - bank_code
        - bank_id
        - bank_verify
        - pendingBankInfo
      properties:
        account_number:
          type: string
          description: 账号，只给末 4 位，前面以 `****` 代替
        account_name:
          type: string
          description: 账户名
        bank_name:
          type: string
          description: 银行名称
        bank_code:
          type: string
          description: transit 号
        bank_id:
          type: string
          description: institution 号
        prove_url:
          type: string
          description: 当前生效结算账户所引用的作废支票（void cheque）文件的预览地址，会过期；没有时不返回本键
        bank_verify:
          type: boolean
          description: 是否有一笔审核中的修改
        pendingBankInfo:
          type: object
          maxProperties: 0
          description: 恒为空对象 `{}`
    SettlementListPage:
      type: object
      description: 一页结算单。
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: 本页的行按结算日分组，组按日期倒序；没有行时为空数组
          items:
            $ref: '#/components/schemas/SettlementGroup'
        pagination:
          $ref: '#/components/schemas/Pagination'
    SettlementGroup:
      type: object
      description: 一个结算日的结算单。
      required:
        - item_key
        - item_data
      properties:
        item_key:
          type: string
          description: 结算日，`yyyy-MM-dd`
        item_data:
          type: array
          items:
            $ref: '#/components/schemas/SettlementRow'
    SettlementRow:
      type: object
      description: 一张结算单。金额按结算币种，单位是元，数值。
      required:
        - clear_detail_id
        - clear_interval
        - gross_amount
        - clear_total_fee
        - total_charge
      properties:
        clear_detail_id:
          $ref: '#/components/schemas/SettlementId'
          description: 结算单号，查清算明细时原样带回
        clear_interval:
          type: string
          description: 结算周期，`yyyy-MM-dd ~ yyyy-MM-dd`
        gross_amount:
          type: number
          description: 净交易额
        clear_total_fee:
          type: number
          description: 结算额，即打给商户的金额
        total_charge:
          type: number
          description: 服务费
    SettlementDetail:
      type: object
      description: 一张结算单的汇总与明细。
      required:
        - clear_summary
        - settle_transactions
      properties:
        clear_summary:
          $ref: '#/components/schemas/SettlementSummary'
        settle_transactions:
          type: object
          description: 明细，收款归 `Credit`，退款与其他扣减归 `Debit`
          required:
            - Credit
            - Debit
          properties:
            Credit:
              $ref: '#/components/schemas/SettlementTransactionsByDate'
            Debit:
              $ref: '#/components/schemas/SettlementTransactionsByDate'
    SettlementSummary:
      type: object
      description: 结算单的汇总。金额按结算币种，单位是元，两位小数的十进制字符串。
      required:
        - clear_interval
        - report_date
        - gross_amount
        - clear_total_fee
        - total_surcharge
        - total_charge
        - total_refund
      properties:
        clear_interval:
          type: string
          description: 结算周期，`yyyy-MM-dd ~ yyyy-MM-dd`
        report_date:
          type: string
          description: 结算日，`yyyy-MM-dd`
        gross_amount:
          type: string
          description: 净交易额
        clear_total_fee:
          type: string
          description: 结算额，即打给商户的金额
        total_surcharge:
          type: string
          description: 服务费
        total_charge:
          type: string
          description: '`Credit` 各行交易额的合计'
        total_refund:
          type: string
          description: '`Debit` 各行交易额的合计'
    SettlementTransactionsByDate:
      type: object
      description: 日期（商户时区，`yyyy-MM-dd`）到这一天明细行的映射；没有行时为空对象。
      additionalProperties:
        type: array
        items:
          $ref: '#/components/schemas/SettlementTransaction'
    SettlementTransaction:
      type: object
      description: 结算单里的一行明细。金额单位是元，两位小数的十进制字符串。
      required:
        - create_time
        - clearing_amount
        - settle_amount
        - currency
      properties:
        order_id:
          $ref: '#/components/schemas/OrderId'
          description: 订单号；退款行是原订单的订单号。退款账户划转、罚款、补偿等不是交易的行不返回本键
        create_time:
          type: string
          description: 发生时间，商户时区，`yyyy-MM-dd HH:mm:ss`
        clearing_amount:
          type: string
          description: 交易额
        settle_amount:
          type: string
          description: 结算额，即交易额扣除手续费后的金额
        currency:
          type: string
          description: 币种
    MonthlyStatementPage:
      type: object
      description: 一页月对账单。
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: 本页的月对账单，按月份倒序；没有行时为空数组
          items:
            $ref: '#/components/schemas/MonthlyStatement'
        pagination:
          $ref: '#/components/schemas/Pagination'
    MonthlyStatement:
      type: object
      required:
        - months
        - serviceChargeTotal
      properties:
        months:
          type: string
          description: 月份，`yyyy-MM`
        serviceChargeTotal:
          type: number
          description: 当月的服务费合计，按结算币种，单位是元
    EmailCodeTicket:
      type: object
      required:
        - ticket
      properties:
        ticket:
          type: string
          description: 本次验证码的票据，下一步与验证码一起带回
    EmailCodeTicketEnvelope:
      description: 发验证码接口的成功响应，`data` 是本次验证码的票据。
      allOf:
        - $ref: '#/components/schemas/Envelope'
      properties:
        data:
          $ref: '#/components/schemas/EmailCodeTicket'
    RechargeRequest:
      type: object
      required:
        - depositType
        - amount
        - ticket
        - ticketValue
      properties:
        depositType:
          type: string
          enum:
            - balance
            - auto_deposit
          description: '`balance` 从余额划到退款账户；`auto_deposit` 设置自动补足的最低金额'
        amount:
          type:
            - number
            - string
          description: 金额，单位是元，数值或数字串，须为正数
        ticket:
          type: string
          description: '`sendRechargeEmailCode` 返回的 `ticket`'
        ticketValue:
          type: string
          description: 邮件里的 6 位验证码
        remark:
          type: string
          description: 收下不用
    MessageCenterSummary:
      type: object
      allOf:
        - $ref: '#/components/schemas/UnreadCounts'
      properties:
        order_message:
          type: object
          description: 最新一条未读订单消息；没有时不返回本键
          required:
            - create_time
          properties:
            create_time:
              type: string
              description: 发生时刻，商户时区，`yyyy-MM-dd HH:mm:ss`
        notice_message:
          type: object
          description: 最新一条未读站内信；没有时不返回本键
          required:
            - title
            - send_time
          properties:
            title:
              type: string
              description: 标题
            send_time:
              type: string
              description: 发送时间，商户时区，`yyyy-MM-dd HH:mm:ss`
    OrderMessagePage:
      type: object
      description: 一页订单消息。
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: 本页的订单消息，按发生时刻倒序；没有行时为空数组
          items:
            $ref: '#/components/schemas/OrderMessage'
        pagination:
          $ref: '#/components/schemas/Pagination'
    OrderMessage:
      type: object
      description: 一条订单消息：一笔成交的收款，或一笔受理的退款。
      required:
        - order_id
        - transaction_type
        - amount
        - currency
        - create_time
        - mch_name
      properties:
        order_id:
          $ref: '#/components/schemas/OrderId'
          description: 订单号；退款行是原订单的订单号
        transaction_type:
          allOf:
            - $ref: '#/components/schemas/TerminalTransactionType'
          description: '`Credit` 收款，`Debit` 退款'
        amount:
          type: number
          description: 收款行是订单总额，退款行是这笔退款的金额（正数）；单位是元
        currency:
          type: string
          description: 订单的标价币种
        channel:
          type: string
          description: 支付方式品牌，取值同订单详情的 `channel`；只在收款行返回
        create_time:
          type: string
          description: 收款行是成交时刻，退款行是受理时刻；商户时区，`yyyy-MM-dd HH:mm:ss`
        mch_name:
          type: string
          description: 当前商户的简称
        remark:
          type: string
          description: 收款行是订单备注，退款行是退款备注；没有值不返回本键
    NoticePage:
      type: object
      description: 一页站内信。
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: 本页的站内信，按发送时间从新到旧；没有行时为空数组
          items:
            $ref: '#/components/schemas/Notice'
        pagination:
          $ref: '#/components/schemas/Pagination'
    Notice:
      type: object
      description: 一条站内信。
      required:
        - notice_id
        - title
        - content
        - send_time
      properties:
        notice_id:
          $ref: '#/components/schemas/NoticeId'
          description: 站内信编号，查详情时原样带回
        title:
          type: string
          description: 标题
        content:
          type: string
          description: 正文，HTML
        send_time:
          type: string
          description: 发送时间，商户时区，`yyyy-MM-dd HH:mm:ss`
    NoticeDetail:
      type: object
      required:
        - notice_title
        - content
      properties:
        notice_title:
          type: string
          description: 标题
        content:
          type: string
          description: 正文，完整的 HTML 文档
    PaymentNoticeSettings:
      type: object
      required:
        - paymentNotice
        - account_id
        - emails
      properties:
        paymentNotice:
          type: boolean
          description: 登录者本人是否接收收款推送
        wechat_openid:
          type: string
          description: 登录者本人已绑定微信时为一个非空串，未绑定时不返回本键；值不是微信的标识
        account_id:
          $ref: '#/components/schemas/UserId'
          description: 登录者本人的账号编号
        emails:
          type: array
          description: 当前商户的收款通知邮箱，按邮箱字母序
          items:
            $ref: '#/components/schemas/NoticeEmail'
    NoticeEmail:
      type: object
      required:
        - email
        - main
        - notice
      properties:
        email:
          type: string
          description: 邮箱
        main:
          type: boolean
          description: 是不是主邮箱（Owner 的登录邮箱）；主邮箱不能删除
        notice:
          type: boolean
          description: 恒为 `true`
    EmailTicketRequest:
      type: object
      required:
        - email
        - ticket
        - ticketValue
      properties:
        email:
          type: string
          description: 邮箱；是哪个邮箱见各接口
        ticket:
          type: string
          description: 发码接口返回的 `ticket`
        ticketValue:
          type: string
          description: 收到的验证码；发到哪个邮箱、能否用验证器上的码见各接口
    PasswordResetRequest:
      type: object
      required:
        - type
        - ticket
        - ticketValue
        - newPassword
      properties:
        type:
          allOf:
            - $ref: '#/components/schemas/PasswordType'
          description: '`refund` 退款密码，须与发验证码时的相同；`login` 不受理'
        ticket:
          type: string
          description: '`sendPasswordEmailCode` 返回的 `ticket`'
        ticketValue:
          type: string
          description: 邮件里的 6 位验证码
        newPassword:
          type: string
          format: password
          description: 新的退款密码，6 位数字
        confirmPassword:
          type: string
          format: password
          description: 收下不用
    UploadedImage:
      type: object
      required:
        - imgUrl
      properties:
        imgUrl:
          type: string
          description: 图片的长效公开地址；交给 `updateMerchantLogo` 时原样带回即可
    MerchantContactRequest:
      type: object
      description: 只改带了、且不是空串的字段。
      properties:
        service_phone:
          type: string
          description: 营业电话
        address:
          type: string
          description: 地址
        city:
          type: string
          description: 城市
        province:
          type: string
          description: 省或州的代码，如 `BC`
        post_code:
          type: string
          description: 邮编
        country:
          type: string
          description: 收下不用
        contact_name:
          type: string
          description: 商户 Owner 的姓名，按最后一个空格拆成名与姓
        contact_phone:
          type: string
          description: 商户 Owner 的电话
    MerchantEmailConfirmRequest:
      type: object
      required:
        - email
        - ticketValue
      properties:
        email:
          type: string
          description: 新邮箱，须与 `updateMerchantEmail` 提交的相同
        ticketValue:
          type: string
          description: 新邮箱收到的验证码
    PaymentMethods:
      type: object
      required:
        - wxSwitch
        - aliSwitch
        - aliOnlineSwitch
        - unionSwitch
        - unionOnlineSwitch
        - cardSwitch
        - storePayWay
        - examinePayWays
      properties:
        wxSwitch:
          type: boolean
          description: 微信支付是否已开通
        aliSwitch:
          type: boolean
          description: 支付宝（店内）是否已开通
        aliOnlineSwitch:
          type: boolean
          description: 支付宝（线上）是否已开通
        unionSwitch:
          type: boolean
          description: 银联（店内）是否已开通
        unionOnlineSwitch:
          type: boolean
          description: 银联（线上）是否已开通
        cardSwitch:
          type: boolean
          description: 信用卡是否已开通
        storePayWay:
          type: array
          description: 店铺码收款页上给付款人显示的支付方式；不会含 `unionpay`
          items:
            $ref: '#/components/schemas/PayWay'
        examinePayWays:
          type: array
          description: 正在开通审核中的支付方式；没有时为空数组
          items:
            $ref: '#/components/schemas/PayWay'
    EmployeeListRow:
      type: object
      required:
        - account_id
        - user_name
        - role
        - one_self
      properties:
        account_id:
          $ref: '#/components/schemas/UserId'
          description: 成员的账号编号，查详情、修改、删除、绑定微信时原样带回
        user_name:
          type: string
          description: 登录名（用户名或邮箱）
        role:
          $ref: '#/components/schemas/TerminalRole'
        one_self:
          type: boolean
          description: 是不是登录者本人
    EmployeeDetail:
      type: object
      required:
        - account_id
        - user_name
        - nick_name
        - mch_role
        - create_time
      properties:
        account_id:
          $ref: '#/components/schemas/UserId'
          description: 成员的账号编号
        user_name:
          type: string
          description: 登录名（用户名或邮箱）
        nick_name:
          type: string
          description: 显示名
        mch_role:
          $ref: '#/components/schemas/TerminalRole'
        wechat_open_id:
          type: string
          description: 已绑定微信时为一个非空串，未绑定时不返回本键；值不是微信的标识
        wechat_name:
          type: string
          description: 已绑定微信的昵称；没有值不返回本键
        create_time:
          type: string
          description: 加入商户的时间，商户时区，`yyyy-MM-dd HH:mm:ss`
    EmployeeRole:
      type: integer
      enum:
        - 2
        - 3
      description: 可给员工设的角色，取值与 `TerminalRole` 同名同义，不收 `1`：`2` 店长，`3` 其余成员（收银员）。
    EmployeeCreateRequest:
      type: object
      required:
        - user_name
        - pwd
        - nick_name
        - role
      properties:
        user_name:
          type: string
          description: 登录名，不能是邮箱地址
        pwd:
          type: string
          format: password
          description: 初始登录密码，至少 8 位，含大写字母、小写字母、数字与特殊字符
        nick_name:
          type: string
          description: 显示名
        role:
          allOf:
            - $ref: '#/components/schemas/EmployeeRole'
          description: '`2` 店长，`3` 收银员'
        contact_phone:
          type: string
          description: 收下不用
    EmployeeUpdateRequest:
      type: object
      required:
        - account_id
      properties:
        account_id:
          $ref: '#/components/schemas/UserId'
          description: 要改的成员
        role:
          allOf:
            - $ref: '#/components/schemas/EmployeeRole'
          description: '`2` 店长，`3` 收银员；整组替换成员的角色'
        nick_name:
          type: string
          description: 新的显示名
        pwd:
          type: string
          format: password
          description: 新的登录密码，至少 8 位，含大写字母、小写字母、数字与特殊字符
        delBinding:
          type: boolean
          description: 为 `true` 时解绑微信，其余键不看
    WechatBindQrcode:
      type: object
      required:
        - url
        - key
      properties:
        url:
          type: string
          description: 二维码图片，PNG 的 data URI（`data:image/png;base64,…`）
        key:
          type: string
          description: 本次绑定的票据，查结果时带回
    WechatBindStatus:
      type: object
      description: 绑定结果。已绑定时有 `wechat_openid`；还没扫码或还没确认时是空对象。
      properties:
        wechat_openid:
          type: string
          description: 已绑定时为一个非空串；值不是微信的标识
    DeviceId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台设备号。
    TerminalFailure:
      type: object
      description: 失败响应体。现网的外壳加整数 `code`。
      required:
        - status
        - message
        - code
      properties:
        status:
          type: integer
          description: 与 HTTP 状态相同
        message:
          type: string
          description: 可以直接展示的失败原因
        data:
          type:
            - object
            - 'null'
          description: 恒为 `null`（现网外壳的占位键，失败响应不带数据）
        timestamp:
          type: string
          description: 响应生成的时间
        traceId:
          type: string
          description: 本次请求的追踪号
        code:
          type: integer
          description: 整数错误码，取值见各接口说明与总说明「状态码」一节
        context:
          type: object
          description: 附加信息，字段与登记该码的码表所写相同，例如 `204010` 带 `attemptsRemaining`（还可以重输的次数）。没有时不返回
    OrderId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台订单号。
    TerminalOrderStatus:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
      description: |
        订单状态，取值与现网相同：

        | 值 | 含义 |
        |---|---|
        | `0` | 已建单，尚未付款 |
        | `1` | 不予受理 |
        | `2` | 支付中 |
        | `3` | 已关闭（过期、关闭或取消） |
        | `4` | 支付失败 |
        | `5` | 支付成功 |
        | `6` | 部分退款 |
        | `7` | 全额退款 |

        预授权款项挂起不改变状态位：按已退情况为 `5` / `6` / `7`，挂起与否看所在响应里的预授权字段。
    MicropayResult:
      type: object
      required:
        - order_id
        - status
      properties:
        order_id:
          type: string
          description: 订单号，拿它轮询订单查询接口
        status:
          $ref: '#/components/schemas/TerminalOrderStatus'
          description: 返回时订单的状态
    TerminalTransactionType:
      type: string
      enum:
        - Credit
        - Debit
      description: 现网的收付方向码：`Credit` 收款 / `Debit` 退款。
    RefundId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台退款号。
    TerminalRefundResultCode:
      type: string
      enum:
        - SUCCESS
        - FINISHED
      description: 退款进展：`SUCCESS` 已提交渠道，处理中 / `FINISHED` 渠道已确认退款成功。
    SettlementId:
      type: string
      minLength: 1
      maxLength: 32
      description: 结算单号。
    NoticeId:
      type: string
      minLength: 1
      maxLength: 32
      description: 站内信标识。
    UserId:
      type: string
      minLength: 1
      maxLength: 32
      description: 平台用户标识；商户操作员的标识就是它。
    TerminalFlag:
      type: integer
      enum:
        - 0
        - 1
      description: 现网的整数标志位：`1` 是 / 开，`0` 否 / 关，含义见所在字段。
    TerminalRole:
      type: integer
      enum:
        - 1
        - 2
        - 3
      description: |
        账号在终端上的角色，按下面的先后取第一个符合的（成员可以同时持有多个角色）：

        - `1` 商户 Owner，或持有 Admin 角色。
        - `2` 持有店长角色。
        - `3` 其余成员。
