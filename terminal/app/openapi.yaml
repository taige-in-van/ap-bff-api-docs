        - name: channel
          in: query
          required: false
          schema:
            type: string
          description: 收下不用。现网的端发空串
      responses:
        '200':
          description: 结算单的汇总与明细
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    $ref: '#/components/schemas/SettlementDetail'
              example:
                status: 200
                message: Success
                data:
                  clear_summary:
                    clear_interval: 2026-10-05 ~ 2026-10-05
                    report_date: '2026-10-06'
                    gross_amount: '1250.50'
                    clear_total_fee: '1218.25'
                    total_surcharge: '32.25'
                    total_charge: '1300.50'
                    total_refund: '50.00'
                  settle_transactions:
                    Credit:
                      '2026-10-05':
                        - order_id: '202610051402001017'
                          create_time: '2026-10-05 14:02:18'
                          clearing_amount: '1300.50'
                          settle_amount: '1267.00'
                          currency: CAD
                    Debit:
                      '2026-10-05':
                        - order_id: '202610041130002203'
                          create_time: '2026-10-05 16:40:02'
                          clearing_amount: '50.00'
                          settle_amount: '48.75'
                          currency: CAD
                timestamp: '2026-10-07T18:11:40.093+00:00'
                traceId: 8d0e4a62b17c3f59
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
