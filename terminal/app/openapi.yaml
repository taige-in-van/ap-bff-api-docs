openapi: 3.1.0
info:
  title: 商户 App — 终端面契约
  version: 1.0.0
  contact:
    name: 商户后台 BFF
  description: |
    现网已安装的商户手机 App（iOS 与 Android 版）调用的接口。地址、请求头、请求体与响应的形状都与现网一致，端不需要升级。

    ## 域名

    - 多数接口发往 pay 域名（`https://pay.example.ca/api/v1.0/app`）。
    - 扫码收款等少数接口发往 cashier 域名（`https://cashier.example.ca/api/v1.0/app`），这些接口在各自的 `servers` 里标明。
    - 美元区商户用 .com 域名（`pay.example.com`、`cashier.example.com`），接口相同。

    ## 凭据

    - 登录（`signIn`）不带凭据；旧版找回密码入口在认证前就地回 `400`，也不要求凭据。
    - `signIn` 返回令牌 `token`，是一个不透明的字符串。此后每个请求把它原样放进 `Authorization` 头，不加 `Bearer` 前缀；`registerPushToken` 这一条现网带着 `Bearer ` 前缀，两种写法服务端都接受。
    - 每个请求另带 `devCid` 头，值是 App 内置的固定值。
    - 另接受 `version`（App 版本号）与 `Accept-Language`（App 当前语言），都不是必需的。
    - 令牌从登录时刻起默认 69 天有效（可配置），请求不会延长它，到期须重新登录。切换商户不换令牌。

    令牌在下列情况失效，失效后须重新登录：

    - 退出登录（`signOut`）。
    - 同一部手机再次登录（按这部手机算，不论账号与商户），上一次登录得到的令牌失效。
    - 该账号修改了登录密码（任何入口）：发起修改的那一处保持登录，该账号其他设备与会话上的登录失效；用 `changePassword` 改的，这部手机的令牌照常可用。
    - 该账号经找回密码重置了登录密码：该账号所有设备上的登录都失效。
    - 该账号被停用，或被移出商户。
    - 这部手机在该商户下的设备被停用或解绑。
    - 商户被冻结。

    同一账号可以同时在多部手机上登录，互不影响。

    ## 响应外壳

    - 成功响应都包一层 `{ status, message, data, timestamp, traceId }`，`status` 为 `200`，内容在 `data`；没有内容时 `data` 为 `null`。例外：`releasePreauth` 成功时响应体为空，`downloadPaymentReceipt`、`downloadRefundReceipt`、`downloadMonthlyStatement` 成功时响应体是 PDF 文件本身，都不套这一层；它们失败时照常。
    - 失败响应的 HTTP 状态不是 2xx，响应体是 `{ status, message, data, timestamp, traceId, code }`：`status` 与 HTTP 状态相同，`message` 是失败原因的文案，`data` 为 `null`，`code` 是整数错误码。
    - 订单详情与退款详情照现网，没有值的键给 `null`；其余接口没有值时不返回该键。

    ## 状态码

    失败只用下面三档，其余 4xx 不使用。

    | HTTP 状态 | 情形 |
    |---|---|
    | `403` | 需要重新登录：令牌无效或已失效、缺凭据头、设备被停用、当前商户被冻结。切换商户时也是这样 |
    | `400` | 登录被拒（含上一行的设备、商户原因在登录时仍然存在）；切换商户的目标不可访问，或这部手机在目标商户下的设备被停用；权限不足、参数不对、状态不允许、操作太频繁等业务性拒绝 |
    | `5xx` | 服务端故障 |

    `403` 的 `code`，每个受保护的接口都可能返回，各接口说明里不再重复：

    - `206014` 令牌无效或已失效，或没带凭据头。
    - `208033` 这部手机在当前商户下的设备已被停用。
    - `208028` 当前商户已被冻结。

    `400` 的 `code` 见各接口说明；说明里没点名的（参数不合法、操作太频繁等）按 `message` 处理即可。失败响应可能另带 `context`，内容与登记该码的码表所写相同。

    ## 权限

    商户 Owner 拥有全部权限。权限按商户后台的权限点判，各接口标在 `x-required-privilege`；员工可以同时持有多个角色，权限取并集。标 `session` 的接口只要求已登录，包括：目标是登录者本人的操作（修改自己的登录密码，即 `changePassword` 的 `type` 为 `login`；改自己的登录邮箱、改自己的显示名、开关自己的收款推送、给自己绑定或解绑微信、查自己的微信绑定结果、看自己的成员信息），读收款通知设置，消息的未读数、公告的列表与详情、把消息标为已读（订单消息列表另须查看支付订单的权限），上传文件，商户列表与切换商户，登记推送令牌与退出登录。权限不足属于业务性拒绝，返回 `400`，`message` 写明需要商户后台的哪项权限。

    ## 找回密码

    商户 App 上不承接找回密码，也不承接登录状态下凭邮箱验证码重置本人的登录密码。现网版本的找回密码入口（`/api/v1.0/app/device/forgotPassword/code` 与找回流程其余各步），以及 `sendPasswordEmailCode`、`resetPasswordWithEmailCode` 的 `type` 为 `login` 的请求，不再受理，回 HTTP `400`、`code` 为 `208037`、顶层 `message` 为固定的双语提示「暂不支持在 POS / App 上重置密码，请联系 Owner 在商户后台重置 / Password reset is not available on POS / App, please ask your Owner to reset it in the Merchant Portal」。

    ## 修改银行账户

    商户 App 上不承接修改结算银行账户，改银行账户在商户后台办理。现网版本的修改银行账户提交（`POST /api/v1.0/app/device/merchant/bank`）不再受理，不看请求内容、权限与仅查看状态，一律回 HTTP `400`、`code` 为 `208039`、顶层 `message` 为固定的双语提示「暂不支持在 App 上修改银行账户，请在商户后台修改 / Bank account changes are not available in the App, please update it in the Merchant Portal」。现网 App 的银行信息页对此不显示提示，停留在编辑页。

    ## 仅查看状态

    商户被设为仅查看时，下列请求返回 `400`、`code` 为 `208035`，查询照常：

    - 收款、退款、释放预授权，账单码的新建与关闭、删除。
    - 改商户的设置与资料：顾客承担手续费、订单有效期、支付方式、收款页设置，商户 Logo、时区、联系方式与地址，登录邮箱（发验证码、提交与确认）。
    - 退款账户充值（含发验证码），通知邮箱的发验证码、添加与删除。
    - 员工的新增、修改、删除，取绑定微信的二维码。
    - 退款密码的修改（`changePassword`）与重置（`sendPasswordEmailCode`、`resetPasswordWithEmailCode`），即 `type` 为 `refund` 的那一支。

    下列请求照常可用，其余改状态的请求都拦：登录、登记推送令牌、切换商户、修改本人的登录密码（`changePassword` 的 `type` 为 `login`）、开关本人的收款推送、把消息标为已读（含读公告详情）、退出登录，以及上传 Logo 图片（`uploadImage`，只产生待引用的文件）。

    ## 调用时序

    各接口的调用先后与失败时端的表现，见调用时序《商户 App》。
servers:
  - url: /api/v1.0/app
    description: 现网商户 App 接口前缀（pay 域名）
security:
  - sessionToken: []
    devCid: []
tags:
  - name: auth
    x-displayName: 登录与密码
    description: 登录、找回与修改密码
  - name: account
    x-displayName: 商户资料
    description: 商户资料
  - name: products
    x-displayName: 收款设置与码
    description: 收款设置、门店码与账单码
  - name: orders
    x-displayName: 收款、退款与统计
    description: 收款、退款与统计
  - name: funds
    x-displayName: 资金
    description: 余额、清算与对账单、充值
  - name: notifications
    x-displayName: 通知
    description: 通知设置、消息与公告
  - name: team
    x-displayName: 员工
    description: 员工与微信绑定
paths:
  /{devType}/login:
    post:
      tags:
        - auth
      operationId: signIn
      summary: 账号密码登录（带滑块验证），同时登记本机
      description: |
        校验滑块票据与账号密码，通过后返回令牌。登录不要求二次验证，账号在商户后台开了验证器的也一样。

        `username` 先按用户名精确匹配，匹配不到再按邮箱，不分大小写。登录所在的商户按登录账号定：Owner 与主商户的员工为主商户，关联商户的员工为其所属的关联商户；这个商户被冻结或删除时登录被拒，不改落其他商户。

        这部手机在该商户下还没有登记过时（按 `uuid` 与 `devType` 认），登录时顺带登记，返回的 `devId` 就是它的设备编号；登记过的沿用原来的 `devId`。这部手机上一次登录得到的令牌随之失效，不论那次登录的是哪个账号、在哪个商户。

        下列情形返回 `400`：

        - `204021` 滑块票据没通过校验。
        - `206012` 账号不存在或密码不对，两者不区分。
        - `966001` 连续登录失败次数过多，账号被锁定。默认连续错 5 次锁 15 分钟（可配置），与商户后台网页登录、POS 登录共用计数。
        - `906004` 同一登录名（解析不到账号）短时间内失败过多，稍后再试。默认 15 分钟内 5 次（可配置），与商户后台网页登录、POS 登录共用计数。
        - `208027` 账号已被停用。
        - `208029` 账号的邮箱还没有验证。
        - `208028` 登录所在的商户已被冻结或删除。
        - `108015` 这部手机在该商户下的设备已被停用。
        - `108018` 本机上报的 `uuid` 不能用作设备标识（为空，或是运行环境返回的固定占位值）。
        - 缺 `uuid`、`username`、`password` 等必填项。
      security: []
      parameters:
        - $ref: '#/components/parameters/DevType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              username: amy.manager
              password: Str0ng!Pass
              ticket: t03Kx9mQ2vLzA7nB1cYw8f3Kd0pQzR2vLxA7nB1cYwE4hTg6
              randstr: '@a7X'
              uuid: 6F1C2D3E-88A4-4B7C-9E10-2A5D7C3B1F09
              devcid: 3b0f7c52a1e94d68
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    $ref: '#/components/schemas/SignInResult'
              example:
                status: 200
                message: Success
                data:
                  token: 3f0c9b7e-5a1d-4c62-9e8b-7d2a41f6c0e3
                  haveChild: true
                  clientId: 23
                  devId: '000231006182031482731'
                  devType: iphone
                  uuid: 6F1C2D3E-88A4-4B7C-9E10-2A5D7C3B1F09
                timestamp: '2026-10-06T18:20:31.482+00:00'
                traceId: 5f1c0a7be2d94c33
        '400':
          $ref: '#/components/responses/Rejected'
      x-error-codes:
        - 108015
        - 108018
        - 204021
        - 206012
        - 208027
        - 208028
        - 208029
        - 966001
  /token:
    put:
      tags:
        - auth
      operationId: registerPushToken
      x-required-privilege: session
      summary: 登记本机的推送令牌
      description: |
        把本机的推送令牌登记到这部手机在当前商户下的设备与当前登录的账号上，之后的收款、退款提醒推到这个令牌。同一个令牌再次登记时（如这部手机换了账号登录，或切换了商户），改记到这一次的账号与设备上；退出登录后停推的令牌，再次登记即恢复推送。推送的语言取本次请求的 `Accept-Language`，没带时为英文。

        设备按请求头定位：`Device-Id` 不为空时按它找；为空时按 `Merchant-Id`、`Client-Device-Id`、`Device-Type` 三项找。

        下列情形返回 `400`：

        - 找不到设备，或设备不在令牌当前所在的商户名下。
        - `devToken` 为空。
      parameters:
        - name: Device-Id
          in: header
          required: false
          schema:
            type: string
          description: '`signIn` 返回的 `devId`；切换商户之后这一次为空串'
        - name: Merchant-Id
          in: header
          required: false
          schema:
            type: string
          description: 令牌当前所在商户的商户号（登录后是 `clientId`，切换商户后是目标商户的 `client_id`）
        - name: Device-Type
          in: header
          required: false
          schema:
            type: string
          description: '`iphone` 或 `android`'
        - name: Client-Device-Id
          in: header
          required: false
          schema:
            type: string
          description: 本机的设备标识，同登录时的 `uuid`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - devToken
              properties:
                devToken:
                  type: string
                  description: 本机的推送令牌
            example:
              devToken: ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]
      responses:
        '200':
          description: 已登记，`data` 为 `null`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status: 200
                message: Success
                data: null
                timestamp: '2026-10-06T18:20:32.015+00:00'
                traceId: 71b4c2e09d3a4f85
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
  /device/merchant/child/{clientMoniker}:
    get:
      tags:
        - auth
      operationId: listSubMerchants
      x-required-privilege: session
      summary: 可切换的商户列表
      description: |
        返回登录者可以访问的商户：第一项是登录者所属的商户，其后是他可以切换过去的其他商户。只属于一个商户的账号只返回那一项。

        路径上的 `clientMoniker` 是端当前所在商户的商户代码，列表里与它相同的那一项 `click` 为 `true`。
      parameters:
        - name: clientMoniker
          in: path
          required: true
          schema:
            type: string
          description: 端当前所在商户的商户代码
      responses:
        '200':
          description: 可访问的商户
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SwitchableMerchant'
              example:
                status: 200
                message: Success
                data:
                  - client_id: 23
                    client_moniker: PINE
                    short_name: Pine Street Cafe
                    logo_thumbnail: https://cdn.example.com/merchant/logo/2026/10/1bfae8638ae9bfdeac5992645c5383db.png
                    click: true
                  - client_id: 57
                    client_moniker: PINE2
                    short_name: Pine Street Cafe Downtown
                    click: false
                timestamp: '2026-10-06T18:20:33.208+00:00'
                traceId: 0c9e7a51b3d2486f
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
  /{devType}/login/switch:
    post:
      tags:
        - auth
      operationId: switchMerchant
      x-required-privilege: session
      summary: 切换到另一个商户
      description: |
        把令牌的当前商户切到 `username` 指定的商户。切过去仍是登录的那个人，角色不变。响应里的 `token` 就是请求带来的那个令牌，不换新。

        这部手机在目标商户下还没有登记过时（按 `uuid` 与 `devType` 认），切换时顺带登记。

        令牌无效或已失效、当前商户被冻结时与其他受保护接口一样返回 `403`，须重新登录。下列情形返回 `400`，仍留在原来的商户：

        - `208034` 目标商户不在登录者可以访问的范围内。主商户的成员可以切到它的关联商户，关联商户的成员只能在本商户。
        - `108015` 这部手机在目标商户下的设备已被停用。
        - `108018` 本机上报的 `uuid` 不能用作设备标识（为空，或是运行环境返回的固定占位值）。
        - 缺 `username` 或 `uuid`。
      parameters:
        - $ref: '#/components/parameters/DevType'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchMerchantRequest'
            example:
              username: PINE2
              adminUser: amy.manager
              uuid: 6F1C2D3E-88A4-4B7C-9E10-2A5D7C3B1F09
              devcid: 3b0f7c52a1e94d68
              devType: iphone
      responses:
        '200':
          description: 已切换
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    $ref: '#/components/schemas/SwitchMerchantResult'
              example:
                status: 200
                message: Success
                data:
                  token: 3f0c9b7e-5a1d-4c62-9e8b-7d2a41f6c0e3
                  haveChile: true
                timestamp: '2026-10-06T18:25:12.640+00:00'
                traceId: 2d8e5b90a1c74f36
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 108015
        - 108018
        - 208034
  /device/updatePassword:
    put:
      tags:
        - auth
      operationId: changePassword
      x-required-privilege: session
      summary: 凭旧密码修改登录密码或退款密码
      description: |
        `type` 决定改哪一个：

        - `login`：核对登录者自己的旧登录密码，改为新密码。成功后这部手机保持登录、令牌照常可用；该账号在其他设备与会话上的登录失效，须用新密码重新登录。
        - `refund`：核对商户的旧退款密码，改为新退款密码。本接口标的 `session` 只覆盖 `login`；`refund` 另须商户后台管理退款密码的权限（`account:refund-pin:manage`）。

        下列情形返回 `400`：

        - `206011` `type` 为 `login` 时旧密码不对。`message` 里含 `Invalid Original Password`。
        - `type` 为 `refund` 时旧退款密码不对。`message` 里同样含 `Invalid Original Password`。
        - `206004` `type` 为 `refund` 时旧退款密码连续输错到上限，暂时锁定。
        - `type` 为 `refund` 而登录者没有管理退款密码的权限。
        - `208035` `type` 为 `refund` 时商户处于仅查看状态，不能改退款密码。`login` 不受仅查看影响。
        - 新密码与旧密码相同，或不满足对应的密码规则。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              oldpwd: Str0ng!Pass
              pwd: N3w!Str0ngPass
              type: login
      responses:
        '200':
          description: 已修改，`data` 为 `null`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status: 200
                message: Success
                data: null
