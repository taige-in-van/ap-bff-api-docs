        - url: https://cashier.example.com/api/v1.0/app
          description: cashier 域名（美元区商户）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicropayRequest'
            example:
              currency: CAD
              auth_code: '134567890123456789'
              amount: 1250
              remark: Table 6
              preauth: false
              expire_time: 1h
              rate_flag: true
      responses:
        '200':
          description: 已下单。结果以 `getTransaction` 查到的为准
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    $ref: '#/components/schemas/MicropayResult'
                    description: '`order_id` 即 `getTransaction` 的 `orderId`，拿它调 `getTransaction` 轮询'
              example:
                status: 200
                message: Success
                data:
                  order_id: '202610061902001001'
                  status: 5
                timestamp: '2026-10-06T19:02:03.517+00:00'
                traceId: 3e8b0d27c1f54a96
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 104500
        - 107500
        - 108104
        - 108105
        - 108500
        - 108501
        - 108502
        - 208035
  /device/transaction/{orderId}:
    get:
      tags:
        - orders
      operationId: getTransaction
      x-required-privilege: orders:payment:view
      summary: 查订单
      description: |
        按订单号查订单。

        `payType` 为 `Credit` 时返回订单本身，`data` 是一个 `TransactionDetail`；为 `Debit` 时返回退款详情，路径段是退款号，`data` 是一个 `RefundDetail`。两种形状互斥，由 `payType` 决定。

        `payType` 为 `Debit` 时，本接口标的 `orders:payment:view` 之外，另须商户后台查看退款单的权限（`orders:refund:view`）。

        只能查当前商户及其子商户的订单与退款。订单详情的金额是元，十进制字符串（`refundFee` 除外，见字段说明）；退款详情的 `refundFee` 是元，数值。时间按商户时区。

        下列情形返回 `400`：

        - 订单不存在，或不属于当前商户及其子商户，两者不区分。
        - `payType` 为 `Debit` 时退款不存在，或不属于当前商户及其子商户，两者不区分。
        - 缺 `payType`。
        - 权限不足：需要商户后台查看支付订单的权限。
        - 权限不足：`payType` 为 `Debit` 时另需商户后台查看退款单的权限。
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 32
          description: '`payType` 为 `Credit` 时是订单号，即下单返回的 `order_id`；为 `Debit` 时是退款号，即退款返回的 `refund_id`'
        - name: payType
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/TerminalTransactionType'
          description: |
            查什么：

            - `Credit`：订单详情，形状见 200 响应。
            - `Debit`：退款详情，路径段是退款号。
      responses:
        '200':
          description: '`payType` 为 `Credit` 时 `data` 是订单详情 `TransactionDetail`；为 `Debit` 时是退款详情 `RefundDetail`'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    description: '`payType` 为 `Credit` 时是 `TransactionDetail`，为 `Debit` 时是 `RefundDetail`，二选一'
                    oneOf:
                      - $ref: '#/components/schemas/TransactionDetail'
                      - $ref: '#/components/schemas/RefundDetail'
              examples:
                credit:
                  summary: payType=Credit，订单详情
                  value:
                    status: 200
                    message: Success
                    data:
                      payOrderId: '202610061902001001'
                      mchName: Pine Street Cafe
                      currency: CAD
                      payFee: '14.00'
                      inputFee: '12.50'
                      tipFee: '1.50'
                      refundFee: 0
                      exchangeRate: null
                      transactionTime: '2026-10-06 12:02:05'
                      createTime: '2026-10-06 12:02:03'
                      tranDate: 2026/10/06
                      tranTime: '12:02:05'
                      orderStatus: 5
                      preAuth: false
                      orderScene: 2
                      channel: Wechat
                      gateway: '0'
                      mchOrderId: null
                      remarks: Table 6
                      orderDesc: Pine Street Cafe
                      orderRules: Table 6
                    timestamp: '2026-10-06T19:02:06.044+00:00'
                    traceId: 7a2f5c19e0d34b81
                debit:
                  summary: payType=Debit，退款详情
                  value:
                    status: 200
                    message: Success
                    data:
                      refundId: R100240001
                      refundFee: 5
                      currency: CAD
                      refundTime: '2026-10-06 12:30:11'
                      operator: Alice
                      refundRemark: null
                    timestamp: '2026-10-06T19:30:12.108+00:00'
                    traceId: 7a2f5c19e0d34b82
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
  /device/orders/{orderId}:
    post:
      tags:
        - orders
      operationId: refundOrder
      x-required-privilege: orders:refund:create
      summary: 退款（请求里带退款密码）
      description: |
        对一笔订单退款，同一个请求里带商户的退款密码。服务端先校验退款密码，再落退款单、提交渠道，拿到渠道的首次应答后返回；返回时退款处理中或已成功。

        - `fee` 是退款金额，单位是元，服务端四舍五入到分。币种是订单的币种，不传。
        - 可退金额 = 顾客实付总额（金额、小费与顾客承担的手续费之和）− 已退金额。允许部分退、多次退。
        - 商户可用于退款的资金不够时返回 `400`，见下面的列表。
        - `refund_password` 是商户的退款密码，全体员工共用。连续输错达到上限（可配置）后锁定一段时间，锁定期内退款密码校验不通过（商户后台、商户 App、POS 都一样）。
        - `remark` 记为退款备注，查退款详情时在 `refundRemark` 里返回。
        - 可以退当前商户及其子商户的订单；子商户的订单须运营开了「父商户可退子商户订单」，没开时按订单不存在处理。挂起中的预授权订单（`preAuth` 为真）不用先释放，可以直接退，部分退也可以；退后订单仍挂起，剩余金额在释放后结算。

        `data` 有两种情形：

        - 退款已受理：返回 `refund_id`、`partner_refund_id`、`amount`、`currency`、`result_code`。
        - 命中审核规则（金额达到审核阈值、成交超过退款周期，或当日退款笔数超限）：退款进入审核，不立即退；返回 `success`（`true`）与 `message`，没有 `refund_id`。审核通过后由服务端完成退款。审核中的退款不计入已退金额，也不出现在退款记录里。

        同一部手机对同一订单、同样金额的重复请求在 60 秒内（可配置）视为同一笔，返回第一次的结果；首次请求还在处理时到达的重复请求，等首次结果出来后返回同一结果。

        下列情形返回 `400`，`message` 写明原因：

        - 缺 `refund_password`，`message` 为 `Refund password is required.`。
        - `206003` 退款密码不对，`message` 为 `Invalid refund password.`。
        - `206004` 退款密码连续输错达到上限，暂时锁定，`message` 里含 `password`。
        - `208035` 商户处于仅查看状态，不能退款。
        - `108025` 这笔退款不予受理，不细分原因：订单没有支付成功、已全额退、金额不是正数或超过可退金额、成交超过最大退款期限（可配置）、商户的退款能力被关闭等。
        - `108017` 同一登录账号对同一订单在极短时间内重复提交（不论金额）。
        - `908003` 同一部手机对同一订单、同样金额在 60 秒内（可配置）再次发起退款，但备注与前一次不同。
        - 权限不足：需要商户后台「发起退款」的权限。
        - 订单不存在，或不在可退的范围内，两者不区分。
        - 商户可用于退款的资金不够这笔退款，`message` 里含 `balance`（中文环境含「余额」）。
        - 渠道拒绝退款，`message` 带渠道给的原因。
        - 缺 `fee`。
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrderId'
          description: 要退款的订单号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            example:
              fee: 5.25
              refund_password: '135790'
              remark: Returned one item
      responses:
        '200':
          description: 退款已受理，或已进入审核。两种情形的 `data` 见接口说明与 `RefundResult`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    $ref: '#/components/schemas/RefundResult'
              examples:
                accepted:
                  summary: 退款已受理
                  value:
                    status: 200
                    message: Success
                    data:
                      refund_id: R100240001
                      partner_refund_id: R100240001
                      amount: 525
                      currency: CAD
                      result_code: SUCCESS
                    timestamp: '2026-10-06T19:15:21.306+00:00'
                    traceId: 8b2e4f07c1d93a65
                reviewing:
                  summary: 进入审核
                  value:
                    status: 200
                    message: Success
                    data:
                      success: true
                      message: The refund has been submitted, please wait for the system approval.
                    timestamp: '2026-10-06T19:15:21.306+00:00'
                    traceId: 1f6c9a30e7b24d58
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 108017
        - 108025
        - 206003
        - 206004
        - 208035
  /device/release/pre_auth/{orderId}:
    get:
      tags:
        - orders
      operationId: releasePreauth
      x-required-privilege: orders:preauth:create
      summary: 释放预授权
      description: |
        释放一笔挂起中的预授权订单：解除这笔订单的结算锁，不动渠道、不动资金。没有请求体。成功后订单状态仍是 `5`，`preAuth` 变为假，之后可以正常退款。挂起中的订单不会到期自动释放。

