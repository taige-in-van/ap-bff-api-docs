      summary: 退款账户充值 — 发邮箱验证码
      description: |
        向商户 Owner 的登录邮箱发一封带 6 位验证码的邮件，返回本次的 `ticket`。没有参数。充值（`rechargeRefundAccount`）时把 `ticket` 与邮件里的验证码一起带上。重新发码后旧的验证码作废。

        下列情形返回 `400`，`message` 写明原因：

        - 发得太频繁，还在冷却中。
