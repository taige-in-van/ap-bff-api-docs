        返回一张结算单的汇总（`clear_summary`）与逐笔明细（`settle_transactions`），不分页。

        - 路径上的 `id` 是清算记录列表行上的 `clear_detail_id`。结算单须在清算记录列表的范围内：当前商户及其名下、登录者可以访问的关联商户。
        - `settle_transactions` 分 `Credit`、`Debit` 两组，每组是「日期 → 这一天的明细行」：收款归 `Credit`，退款与其他扣减归 `Debit`。退款账户划转、罚款、补偿等不是交易的行按资金方向归组，没有 `order_id`。日期按商户时区，`yyyy-MM-dd`，日期键之间不保证顺序。
        - 金额都是元，两位小数的十进制字符串。
        - `channel` 收下不用。

        下列情形返回 `400`：

        - 结算单不存在，或不在上述范围内，两者不区分。
        - 权限不足：需要商户后台「结算单」的查看权限。
      parameters:
