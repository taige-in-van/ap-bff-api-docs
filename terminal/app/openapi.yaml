  /device/bill/add:
    put:
      tags:
        - products
      operationId: createBill
      x-required-privilege: products:invoice:manage
      summary: 新建账单码
      description: |
        为当前商户新建一张账单，返回账单号 `bill_id`。账单号在商户内递增，与商户后台账单列表里的账单号相同。详情与二维码用 `getBillDetail` 取。

        - `bill_amount` 是账单金额，单位是分。
        - `currency` 只收商户的结算币种或 `CNY`。
        - `bill_remark` 记为账单说明；空串表示没有说明。
        - `pre_auth_flag` 为 `true` 时，顾客付这张账单走预授权：付款成功后款项挂起，之后可以释放。
        - 账单的操作员记为当前登录的账号。
        - `expiration_time` 定账单的到期日，按下表换算。到期日当天（按商户时区）整日可付，过了到期日不能再付。

        | `expiration_time` | 到期日 |
        |---|---|
        | `today` | 当天 |
        | `24h` | 次日 |
        | `48h` | 后天 |
        | `72h` | 没有到期日，一直可付 |

        同一账号在同一商户下用同样的金额、币种、说明、`expiration_time` 与预授权标记重复提交，60 秒内（可配置）返回第一次的结果，不重复建单；首次请求还在处理时到达的重复请求，等首次结果出来后返回同一结果。

        下列情形返回 `400`，`message` 写明原因：

        - `208035` 商户处于仅查看状态，不能新建账单。
        - `currency` 不是商户的结算币种，也不是 `CNY`。
        - `bill_amount` 不是正数，或缺 `bill_amount`、`currency`、`expiration_time`。
        - `expiration_time` 不是上表里的取值。
        - `bill_remark` 超过 300 字。
        - 权限不足：需要商户后台「账单」的管理权限。
      servers:
        - url: https://cashier.example.ca/api/v1.0/app
          description: cashier 域名（加元区）
        - url: https://cashier.example.com/api/v1.0/app
          description: cashier 域名（美元区商户）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillCreateRequest'
            example:
              bill_amount: 8800
              currency: CAD
              bill_remark: Catering deposit for Oct 12
              expiration_time: today
              pre_auth_flag: false
      responses:
        '200':
          description: 已建账单，`data` 里是账单号
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    $ref: '#/components/schemas/BillCreateResult'
              example:
                status: 200
                message: Success
                data:
                  bill_id: '10031'
                timestamp: '2026-10-07T17:20:11.204+00:00'
                traceId: 6d2f0b8e41c75a93
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 208035
  /device/bill/list:
    get:
      tags:
        - products
      operationId: listBills
      x-required-privilege: products:invoice:view
      summary: 账单码列表，按创建日分组
      description: |
        返回当前商户的账单，按创建时刻倒序分页，每页的行按创建日分组。

        - 范围：当前商户的账单，不含子商户；删除（含关闭）了的不列。一张账单一行。
        - `begin`、`end` 是创建日期，按商户时区的日期原样匹配，不按设备时区换算；`item_key` 是行的创建日期。
        - 分页按行计：`page` 从 `1` 起，`limit` 默认 `20`。没有行时 `data.data` 为空数组。

        行上的 `bill_status`、`order_status`、`cancle_time` 按账单所处的情形给：

        | 情形 | `bill_status` | `order_status` | `cancle_time` |
        |---|---|---|---|
        | 未付，有到期日 | `1` | 不返回 | 到付款截止时刻的剩余毫秒 |
        | 未付，没有到期日 | `1` | 不返回 | `-1` |
        | 已付 | `2` | `"1"` | 同上两行：有到期日为剩余毫秒，没有为 `-1` |
        | 过了到期日仍未付 | `2` | 不返回 | `0` |

        付款截止时刻是到期日结束的那一刻（商户时区）；剩余毫秒不为负，过了截止时刻为 `0`。

        下列情形返回 `400`：

        - `begin` 或 `end` 不是合法的 `yyyyMMdd` 日期。
        - `status` 的取值不认识。
        - 权限不足：需要商户后台「账单」的查看权限。
      servers:
        - url: https://cashier.example.ca/api/v1.0/app
          description: cashier 域名（加元区）
        - url: https://cashier.example.com/api/v1.0/app
          description: cashier 域名（美元区商户）
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - ''
              - '1'
              - '2'
          description: |
            按账单状态筛：

            - `1` 只看未付。
            - `2` 只看已付或已过期。
            - 空串或不带时都列。
        - name: begin
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]{8}$
          description: 起始创建日期，`yyyyMMdd`，含当天；不带时不限下界
        - name: end
          in: query
          required: false
          schema:
            type: string
            pattern: ^[0-9]{8}$
          description: 截止创建日期，`yyyyMMdd`，含当天；不带时不限上界
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 一页账单，按创建日分组；没有行时 `data.data` 为空数组
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                properties:
                  data:
                    $ref: '#/components/schemas/BillListPage'
              example:
                status: 200
                message: Success
                data:
                  pagination:
                    page: 1
                    limit: 20
                    totalCount: 3
                    totalPages: 1
                    lastPage: true
                  data:
                    - item_key: '2026-10-07'
                      item_data:
                        - bill_id: '10031'
                          bill_status: 1
                          currency: CAD
                          cancle_time: 23869000
                          bill_amount: 88
                        - bill_id: '10030'
                          bill_status: 2
                          order_status: '1'
                          currency: CAD
                          cancle_time: -1
                          bill_amount: 120.5
                    - item_key: '2026-10-05'
                      item_data:
                        - bill_id: '10027'
                          bill_status: 2
                          currency: CNY
                          cancle_time: 0
                          bill_amount: 300
                timestamp: '2026-10-07T17:22:31.019+00:00'
                traceId: 0c7e5a2d93b14f68
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
