  /device/account/recharge:
    post:
      tags:
        - funds
      operationId: rechargeRefundAccount
      x-required-privilege: account:reserve:create
      summary: 退款账户充值，或设置自动补足的最低金额
      description: |
        `depositType` 决定做哪一件：

        - `balance`：从余额划 `amount` 到退款账户，立即生效。余额够不够以服务端提交时的判断为准，`getAccountBalance` 的 `tranBalance` 只作参考，两者可能不同。
        - `auto_deposit`：把退款账户的最低金额设为 `amount`，不动钱；之后退款账户余额低于它时，由系统自动补足。

        `amount` 单位是元，数值或数字串都收。`ticket` 与 `ticketValue` 是 `sendRechargeEmailCode` 返回的票据与邮件里的验证码，验对即作废。`remark` 收下不用。成功时 `data` 为 `null`。

        同一商户的 `ticket`、`ticketValue`、`depositType` 与金额都相同的重复请求，在 60 秒内（可配置）视为同一笔，返回第一次的结果；首次请求还在处理时到达的重复请求，等首次结果出来后返回同一结果。其中任何一项不同（含验证码）都按新的请求处理。

        下列情形返回 `400`，`message` 写明原因：

        - `204010` 验证码不对，还可以重输。
        - `206006` `ticket` 无效，或验证码已过期、已用过，须重新发码。
        - `206007` 验证码输错次数超过上限，须重新发码。
        - `amount` 不是正数，或 `depositType` 不是上面两个取值。
        - `auto_deposit` 的金额低于平台规定的下限。
        - `balance` 时余额不足，没有划转。
        - `208035` 商户处于仅查看状态，不能充值。
        - 权限不足：需要商户后台「退款准备金充值」的权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RechargeRequest'
            example:
              depositType: balance
              amount: '200.00'
              ticket: chl_4b8e1f0a7c2d4e93
              ticketValue: '482913'
      responses:
        '200':
          description: 已完成，`data` 为 `null`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                status: 200
                message: Success
                data: null
                timestamp: '2026-10-07T18:21:02.917+00:00'
                traceId: 7c0a4e18f3b25d96
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 204010
        - 206006
        - 206007
        - 208035
