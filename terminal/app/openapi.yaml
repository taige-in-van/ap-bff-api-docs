        下列情形返回 `400`，`message` 写明原因：

        - `108005` 不是挂起中的预授权订单：已释放、已清算，或不是预授权订单。
        - `208035` 商户处于仅查看状态，不能释放。
        - 权限不足：需要商户后台「完成或释放预授权」的权限。
        - 订单不存在，或不是当前商户的订单，两者不区分。
      servers:
        - url: https://cashier.example.ca/api/v1.0/app
          description: cashier 域名（加元区）
        - url: https://cashier.example.com/api/v1.0/app
          description: cashier 域名（美元区商户）
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/OrderId'
          description: 要释放的预授权订单号
      responses:
        '200':
          description: 已释放。响应体为空，不套成功响应的外壳
        '400':
          $ref: '#/components/responses/Rejected'
        '403':
