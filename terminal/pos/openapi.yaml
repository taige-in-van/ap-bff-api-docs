      description: |
        返回打印收款票、退款票用的抬头、页脚、单号码类型与商户名址。

        - `head`、`footer`：运营为商户配置的小票抬头行与页脚行，整段包在 `<root>` 里，每行一个 `<p>`，行内文字做 XML 转义。没配抬头时 `head` 为空串；`footer` 只在抬头与页脚都配了时返回。
        - `qr_type`：小票上单号码的类型，`QR_CODE`（二维码）或 `BAR_CODE`（一维码）；没配时为 `QR_CODE`。
        - `company_name`、`short_name`、`address1`、`address2`：商户资料里的公司名、简称与地址。
        - `timezone` 收下不用。

