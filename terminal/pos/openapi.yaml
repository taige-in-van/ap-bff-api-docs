  /retail/unionpay/qrcode:
    post:
      tags:
        - orders
      operationId: createUnionpayQrcodeOrder
      x-required-privilege: terminal:payment:create
      summary: 生成银联动态收款码，顾客扫码付款
      description: |
        按金额建一笔银联订单，返回订单号、码内容与码图片。顾客用支持银联二维码的应用扫码付款；结果用 `getOrder` 轮询。

        - `code_url` 是银联二维码串，码里的金额 = `amount` + `tip`，商户开启了顾客承担手续费时另含手续费。
        - `qrcode_img` 是服务端把 `code_url` 画成的 PNG 图片，以 data URI 返回。

        请求字段与 `createQrcodeOrder` 相同。`preauth` 为 `true` 时按预授权收款：付款成功后资金挂起，在 POS 上释放；与支付方式品牌无关。

        订单按商户设的订单有效期到期（商户没设时默认 5 分钟，可配置），到期还没付款的关闭（`status` 为 `3`）。

        重复请求不合并：每次调用都建一笔新订单。

        下列情形返回 `400`：

        - `108200` 商户当前不能用动态收款码收款。
