  /retail/app/sub_partners:
    get:
      tags:
        - orders
      operationId: listSubMerchants
      x-required-privilege: session
      summary: 子商户列表，流水按商户筛选时用
      description: |
        返回当前商户的子商户，每个只给商户号与简称。没有参数。

        - 不含当前商户自己；已删除、已冻结、入驻被拒的子商户不列。没有子商户时返回 `[]`。
      responses:
        '200':
          description: 子商户（裸 JSON 数组）
