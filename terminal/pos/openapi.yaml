  /retail/orders/{orderId}/refund:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
        description: 订单号，即下单接口返回的 `order_id`
    put:
      tags:
        - orders
      operationId: refundOrder
      x-required-privilege: orders:refund:create
      summary: 退款（原生端的调法）
      description: |
        对一笔订单发起退款。服务端落退款单、提交渠道，拿到渠道的首次应答后返回；返回时退款是处理中或已成功，端不用轮询。键盘机用 `POST` 调同一路径（`refundOrderByPost`），服务端行为相同。

        - **退款密码**：要求本设备本次登录已通过 `verifyRefundPassword`（有效到该设备下次登录为止）。退款可能由终端自带的收银应用拉起、不经过本应用密码页的终端类别不查这一条，按 `Device-Type` 识别；目前属于这一类的是 `poynt` 与 `ingenico`。
        - **金额**：`amount` 以分计，整数或数字字符串都收。币种是订单的币种，不用传。
        - **可退金额**：顾客实付总额（金额、小费与顾客承担的手续费之和）减去已退金额。允许部分退、多次退。
        - **能退哪些订单**：当前商户及其子商户的订单。子商户的订单还要运营开了「父商户可退子商户订单」，没开按不存在处理。
        - **挂起中的预授权订单**（`getOrder` 的 `pre_auth` 为 `1`）不能直接退款，须先 `releasePreauth`，释放后再退。
        - **资金**：商户可用于退款的资金不够时返回 `400`，`message` 说明余额不足（含 `balance`）。
        - **审核**：命中审核规则（金额达到审核阈值、成交超过退款周期、当日退款笔数超限）的退款进入审核、不立即退，返回 `400`，`message` 说明已提交审核；审核通过后由服务端完成退款。审核中的退款不计入 `getOrder` 的 `refund_fee`，也不出现在 `refund_logs`。
        - **重复提交**：同一台设备对同一订单、同样金额的重复退款请求在 60 秒内（可配置）视为同一笔，返回第一次的结果；首次请求还在处理时到达的重复请求，等首次结果出来后返回同一结果。60 秒后同样金额再退是新的一笔。

        下列情形返回 `400`：

        - `108025` 这笔退款不予受理，不细分原因：订单没有支付成功、已全额退、金额不是正数或超过可退金额、成交超过最大退款期限（可配置）、商户的退款能力被关闭、订单是挂起中的预授权订单等。
        - `108017` 同一登录账号对同一订单在极短时间内重复提交（不论金额）。
        - `208035` 商户处于仅查看状态，不能退款。
        - 本设备本次登录还没有通过退款密码校验（退款可由终端自带收银应用拉起的终端类别除外，目前是 `poynt` 与 `ingenico`）。
        - 当前账号没有发起退款的权限。
        - 订单不存在，或不在能退的范围内。
        - 资金不足，`message` 说明余额不足。
        - 进入审核，`message` 说明已提交审核。
        - 渠道拒绝这笔退款，`message` 带渠道给的原因。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetailRefundRequest'
            example:
              amount: 500
      responses:
        '200':
          description: 退款已受理，返回退款结果（裸 JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailRefundResult'
              example:
                refund_id: R100240001
                partner_refund_id: R100240001
                amount: 500
                currency: CAD
                result_code: SUCCESS
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 108017
        - 108025
        - 208035
    post:
      tags:
        - orders
      operationId: refundOrderByPost
      x-required-privilege: orders:refund:create
      summary: 退款（键盘机的调法）
      description: |
        键盘机的退款调法，与 `refundOrder`（`PUT` 同一路径）等价：请求体、响应、要求先通过 `verifyRefundPassword`、可退金额、审核、重复提交与拒绝情形都相同，见 `refundOrder` 的说明。

        下列情形返回 `400`（完整列表见 `refundOrder`）：

        - `108025` 这笔退款不予受理，不细分原因：订单没有支付成功、已全额退、金额不是正数或超过可退金额、成交超过最大退款期限（可配置）、商户的退款能力被关闭、订单是挂起中的预授权订单等。
        - `108017` 同一登录账号对同一订单在极短时间内重复提交（不论金额）。
        - `208035` 商户处于仅查看状态，不能退款。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetailRefundRequest'
            example:
              amount: '500'
      responses:
        '200':
          description: 退款已受理，返回退款结果（裸 JSON），与 `refundOrder` 相同
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailRefundResult'
              example:
                refund_id: R100240002
                partner_refund_id: R100240002
                amount: 500
                currency: CAD
                result_code: FINISHED
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 108017
        - 108025
        - 208035
  /retail/orders/{orderId}/release_preauth:
    put:
      tags:
        - orders
      operationId: releasePreauth
      x-required-privilege: orders:preauth:create
      summary: 释放预授权
      description: |
        释放一笔挂起中的预授权订单（`getOrder` 的 `pre_auth` 为 `1`）：解除这笔订单的结算锁，订单进入正常结算。不调渠道、不动资金；订单状态仍是 `5`，`pre_auth` 变为 `0`，之后可以正常退款。没有请求体，成功返回 `{}`。

        只能释放当前商户自己的订单，子商户的订单按不存在处理。挂起的订单不会到期自动释放。

        同一订单在 60 秒内（可配置）的重复释放请求（不论哪台设备）返回第一次的结果；首次请求还在处理时到达的重复请求，等首次结果出来后返回同一结果。之后再释放按「不是挂起中的预授权订单」拒绝。

        下列情形返回 `400`：

        - `108005` 这笔订单不是挂起中的预授权订单（已释放、已清算，或不是预授权）。
        - `208035` 商户处于仅查看状态，不能释放。
        - 当前账号没有完成或释放预授权的权限。
        - 订单不存在，或不是当前商户自己的订单。
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
          description: 订单号，即下单接口返回的 `order_id`
      responses:
        '200':
          description: 已释放，响应体为空对象 `{}`（裸 JSON）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
              example: {}
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 108005
        - 208035
  /retail/app/orders_new:
    get:
      tags:
        - orders
      operationId: listOrders
      x-required-privilege: orders:payment:view
      summary: 交易流水列表；键盘机也用它选可退的订单、按单号后几位找单
      description: |
        按页返回交易流水。一行一笔：成交的收款一单一行，已受理的退款（处理中或成功）一笔一行；未成交、失败、被拒的订单不列。按时间倒序：收款行按付款成功的时刻，退款行按退款受理的时刻。

        - 日期：`begin`、`end` 是商户营业日（按商户的时区与日切时刻划分），按字面匹配，不按设备时区换算。收款行按付款成功的时刻归日，退款行按退款受理的时刻归日（不回到原订单那天）。行上的 `trade_date` 是这一行所属的商户营业日，与 `begin`、`end` 同一个日期；`trade_time` 是这一行的时刻（收款行为付款成功，退款行为退款受理）按商户时区的时分秒。
        - 范围：不带 `app_client_ids` 时含当前商户及其全部子商户。
        - 收银员查询天数：登录账号的 `role` 为 `3`（不是 Owner、也不持 Admin 或店长角色）、且运营给商户设了查询天数 N 时，只返回营业日不早于「当前营业日往前 N 天」的流水；不带 `begin` 或 `begin` 更早时都按这一天起算，不报错。没设时不限。流水汇总与日结不受这条限制。
        - 分页：`page` 从 `1` 起，`limit` 默认 `20`。没有数据时 `data` 为 `[]`。
        - 金额是数值，单位是元；时间按商户所在时区。
        - 键盘机（`Device-Type` 为 `ingenico`）上的行另有改写：退款行的 `order_id` 是流水号与订单号拼成的串、`total_amount` 为 `0`、`refund_fee` 为这笔退款的金额；收款行的 `refund_fee` 为 `0`；标价币种为 `CNY` 的订单的收款行，`total_amount` 为 `clearing_amount` 的值。细节见行的字段说明。

        下列情形返回 `400`：

        - 带了 `order_id` 又带了 `begin`、`end`，区间超过上限（默认 31 天，可配置）。
        - `app_client_ids` 不是当前商户，也不是它的子商户。
        - `begin`、`end` 不是合法的 `yyyyMMdd`，或 `status`、`channel`、`gateway_app` 的取值不认识。
        - 当前账号没有看支付订单的权限。
