      x-required-privilege: orders:refund:create
      summary: 退款前校验退款密码
      description: |
        校验商户的退款密码。退款密码是商户级的一份，全体操作员共用，不分账号。

        通过后返回 `200`，响应体为空；服务端记下「本设备本次登录已验过退款密码」，有效到该设备下次登录为止。`refundOrder`、`refundOrderByPost` 要求有这个标记。

        连续输错达到上限（可配置）后锁定一段时间；锁定期内退款密码校验不通过（商户后台、商户 App、POS 都一样），输对也被拒绝。

        下列情形返回 `400`：

        - `206003` 退款密码不对，`message` 为 `Incorrect refund password`。
        - `206004` 连续输错达到上限，退款密码已锁定，须等锁定期过后再试；`message` 说明退款密码已锁定（文案含 `password`）。
        - `208035` 商户处于仅查看状态，不能退款。
        - 当前账号没有发起退款的权限。
      requestBody:
