  /retail/app/daily_transactions/date/{yyyyMMdd}:
    get:
      tags:
        - orders
      operationId: getDailyReport
      x-required-privilege: orders:payment:view
      summary: 某一天的日结报表，用于预览与打印
      description: |
        返回某一营业日的日结报表，三块：当天的每笔流水（`transactions`）、整体汇总（`analysis`）、按支付方式的汇总（`channel_analysis`）。

        - 日期：路径上的 `yyyyMMdd` 是商户营业日，按字面匹配，不按设备时区换算。`transDate` 为 `HH:mm:ss-HH:mm:ss` 时，按商户时区在这一营业日内只取该时段；时段的选项取自登录响应里的 `client.business_hours`。
        - 行集：同 `listOrders`，成交的收款一单一行，已受理的退款一笔一行，按时间先后排列。`thisdevice` 为 `true` 时只取本机建的订单，退款跟随原订单的发起设备。
        - 范围：`app_client_ids` 的含义同 `listOrders`，不带时含当前商户及其全部子商户。
        - `analysis` 的汇总键与口径同 `getTradeSummary`，另加 `date`；`total_surcharge`、`total_settle_amount` 只计已计费的流水，刚成交的几笔手续费可能尚未计入。
        - `channel_analysis` 按支付方式一行，最后一行的 `channel` 为 `All`，是前面各行的合计。
        - `additional_content`、`logo_print` 有配置才返回。
        - 收银员查询天数不限制本接口。

        下列情形返回 `400`：

        - 这一天（或所选时段）没有流水，`message` 为 `No Transactions in date {yyyyMMdd} at {商户时区}`，例如 `No Transactions in date 20261006 at America/Vancouver`。
        - 路径上的日期不是合法的 `yyyyMMdd`（`message` 为 `Invalid Date String`），或 `transDate` 既不是 `all` 也不是 `HH:mm:ss-HH:mm:ss`。
        - `app_client_ids` 不是当前商户，也不是它的子商户。
        - 当前账号没有看支付订单的权限。
      parameters:
        - name: yyyyMMdd
          in: path
          required: true
          schema:
            type: string
            pattern: ^[0-9]{8}$
          description: 商户营业日，格式 `yyyyMMdd`
        - name: transDate
          in: query
          required: false
          schema:
            type: string
            default: all
          description: |
            取哪一段：`all`（默认）取全天；`HH:mm:ss-HH:mm:ss` 取该营业日内的这一时段，按商户时区，例如 `09:00:00-21:00:00`
        - $ref: '#/components/parameters/ReportMerchant'
        - $ref: '#/components/parameters/ReportThisDevice'
        - $ref: '#/components/parameters/IgnoredTimezone'
      responses:
        '200':
          description: 日结报表（裸 JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailDailyReport'
              example:
                transactions:
                  - transaction_time: '11:20:31'
                    clearing_amount: 14
                    transaction_type: Credit
                    order_id: P100240001
                    channel: Wechat
                    transaction_amount: 14
                    transaction_currency: CAD
                    display_amount: 12.5
                    total_amount: 14
                    tip_amount: 1.5
                    currency: CAD
                    system_generate: 0
                    customer_payment_amount: 14
                    gateway: 2
                    settle_amount: 13.65
                    surcharge_rate: 0.025
                    clearing_status: 0
                    system_transaction_id: '4200002618202610061120310001'
                    remark: ''
                  - transaction_time: '15:02:47'
                    clearing_amount: 5
                    transaction_type: Debit
                    order_id: P100240001
                    channel: Wechat
                    transaction_amount: 5
                    transaction_currency: CAD
                    refund_id: R100240001
                    out_refund_id: R100240001
                    display_amount: 12.5
                    total_amount: 14
                    tip_amount: 1.5
                    currency: CAD
                    system_generate: 0
                    customer_payment_amount: 14
                    gateway: 2
                    settle_amount: 4.88
                    surcharge_rate: 0.025
                    clearing_status: 0
                    remark: ''
                analysis:
                  display_amount: 12.5
                  pre_display_amount: 0
                  cny_display_amount: 0
                  cny_settle_amount: 0
                  pre_cny_display_amount: 0
                  tip_amount: 1.5
                  tip_count: 1
                  cny_tip_amount: 0
                  total_credit: 14
                  payment_count: 1
                  total_debit: -5
                  gross_amount: 9
                  total_settle_amount: 8.77
                  total_surcharge: -0.23
                  tax_amount: 0
                  refund_count: 1
                  order_count: 2
                  date: 06/Oct/2026
                channel_analysis:
                  - channel: Wechat
                    count: 2
                    input_amount: 7.5
                    tip_amount: 1.5
                    clearing_amount: 9
                  - channel: All
                    count: 2
                    input_amount: 7.5
                    tip_amount: 1.5
                    clearing_amount: 9
                additional_content: Thank you for visiting!
                logo_print: https://static.example.com/files/3e7a0c5d9b2f41e8a6c4d1f0b8e27a93.png
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
  /retail/app/daily_transactions/date:
    get:
      tags:
        - orders
      operationId: getTransactionPrintData
      x-required-privilege: orders:payment:view
      summary: 所选区间或单笔交易的打印数据
      description: |
        返回所选时刻区间（或某一笔订单）的流水打印数据，结构同 `getDailyReport`，每行多一个 `transaction_date`。

        - 区间：`transDate` 为 `yyyyMMdd HH:mm:ss-yyyyMMdd HH:mm:ss`，按请求里的 `timezone` 解释，`timezone` 不带或为空时按商户时区。取付款成功（收款行）或退款受理（退款行）的时刻晚于起点、早于终点的流水。这里按时刻取，与 `getDailyReport` 按营业日取不同。
        - 单笔：带 `order_id` 时只取这笔订单的流水（收款与退款），按订单号精确匹配；可与 `transDate` 同时带，不带 `transDate` 时不限时间。订单不在当前商户及其子商户（或所选 `app_client_ids`）范围内时，按没有流水处理。
        - 行集、`thisdevice`、`app_client_ids` 同 `getDailyReport`，行按时间先后排列。
        - `transactions[].transaction_date`（`yyyy-MM-dd`）与 `transaction_time`（`HH:mm:ss`）按商户时区。
        - `analysis` 同 `getDailyReport`；`analysis.date` 带了 `transDate` 时为区间，只带 `order_id` 时为第一笔流水的 `HH:mm:ss`。
        - 收银员查询天数不限制本接口。

        下列情形返回 `400`：

        - 区间内（或这笔订单）没有流水，`message` 为 `No Transactions`。
        - `transDate` 与 `order_id` 都没带。
        - `transDate` 不是 `yyyyMMdd HH:mm:ss-yyyyMMdd HH:mm:ss`，或 `timezone` 不是合法的时区名。
        - `app_client_ids` 不是当前商户，也不是它的子商户。
        - 当前账号没有看支付订单的权限。
      parameters:
        - name: transDate
          in: query
          required: false
          schema:
            type: string
          description: |
            起止时刻，`yyyyMMdd HH:mm:ss-yyyyMMdd HH:mm:ss`，例如 `20261006 00:00:00-20261006 23:59:59`
        - name: timezone
          in: query
          required: false
          schema:
            type: string
          description: |
            解释 `transDate` 用的时区名，例如 `America/Vancouver`。不带或为空时按商户时区
        - name: order_id
          in: query
          required: false
          schema:
            type: string
          description: 只取这笔订单的流水，按订单号精确匹配
        - $ref: '#/components/parameters/ReportMerchant'
        - $ref: '#/components/parameters/ReportThisDevice'
      responses:
        '200':
          description: 打印数据（裸 JSON），结构同 `getDailyReport`，每行多 `transaction_date`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetailPrintData'
              example:
                transactions:
                  - transaction_date: '2026-10-06'
                    transaction_time: '11:20:31'
                    clearing_amount: 14
                    transaction_type: Credit
                    order_id: P100240001
                    channel: Wechat
                    transaction_amount: 14
                    transaction_currency: CAD
                    display_amount: 12.5
                    total_amount: 14
                    tip_amount: 1.5
                    currency: CAD
                    system_generate: 0
                    customer_payment_amount: 14
                    gateway: 2
                    settle_amount: 13.65
                    surcharge_rate: 0.025
                    clearing_status: 0
                    system_transaction_id: '4200002618202610061120310001'
                    remark: ''
                analysis:
                  display_amount: 12.5
                  pre_display_amount: 0
                  cny_display_amount: 0
                  cny_settle_amount: 0
                  pre_cny_display_amount: 0
                  tip_amount: 1.5
                  tip_count: 1
                  cny_tip_amount: 0
                  total_credit: 14
                  payment_count: 1
                  total_debit: 0
                  gross_amount: 14
                  total_settle_amount: 13.65
                  total_surcharge: -0.35
                  tax_amount: 0
                  refund_count: 0
                  order_count: 1
                  date: 06/Oct/2026 11:00:00~06/Oct/2026 12:00:00
                channel_analysis:
                  - channel: Wechat
                    count: 1
                    input_amount: 12.5
                    tip_amount: 1.5
                    clearing_amount: 14
                  - channel: All
                    count: 1
                    input_amount: 12.5
                    tip_amount: 1.5
                    clearing_amount: 14
                additional_content: Thank you for visiting!
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
components:
  securitySchemes:
    merchantId:
      type: apiKey
      in: header
      name: Merchant-Id
      description: 商户号，填登录或 `registerDevice` 响应里的 `client_id`。服务端按 `Device-Id` 与 `Device-Type` 定位设备，不以这个头为准；它与设备所属商户不一致时只记录、不拒绝。
    deviceId:
      type: apiKey
      in: header
      name: Device-Id
      description: 终端序列号，即登记本机时的 `client_device_id`。
    deviceType:
      type: apiKey
      in: header
      name: Device-Type
      description: 终端类别，取值同 `registerDevice` 路径上的 `devType`。
    globalSign:
      type: apiKey
      in: header
      name: Global-Sign
      description: |
        请求签名：`dev_id`、`auth_code`、请求路径三段用 `&` 连接后的 SHA-256 十六进制串，`dev_id` 与 `auth_code` 取自最近一次 `registerDevice` 的返回。

        请求路径是端发出时的完整路径，从 `/api` 起，不含查询参数，例如 `/api/v1.0/retail/app/current_user`。比对不分大小写。
  parameters:
    ReportBegin:
      name: begin
      in: query
      required: false
      schema:
        type: string
        pattern: ^[0-9]{8}$
      description: 起始的商户营业日，格式 `yyyyMMdd`，含当天。按字面匹配，不按设备时区换算。不带时不限起点
    ReportEnd:
      name: end
      in: query
      required: false
      schema:
        type: string
        pattern: ^[0-9]{8}$
      description: 截止的商户营业日，格式 `yyyyMMdd`，含当天。按字面匹配，不按设备时区换算。不带时不限终点
    ReportStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - ALL
          - PAID
          - SUCCESS
          - ALL_REFUNDED
          - REFUNDED
          - PARTIAL_REFUNDED
          - FULL_REFUNDED
          - FAILED
          - CLOSED
        default: ALL
      description: |
        按行所属订单的当前状态过滤，取值照现网：

        | 取值 | 订单状态 |
        |---|---|
        | `ALL` | 不过滤 |
        | `PAID` | `5`、`6`、`7` |
        | `SUCCESS` | `5` |
        | `ALL_REFUNDED`、`REFUNDED` | `6`、`7` |
        | `PARTIAL_REFUNDED` | `6` |
        | `FULL_REFUNDED` | `7` |
        | `FAILED` | `1`、`4` |
        | `CLOSED` | `3` |

        流水只有成交的收款与已受理的退款，所以 `FAILED`、`CLOSED` 查不到行。
    ReportChannel:
      name: channel
      in: query
      required: false
      schema:
        type: string
        enum:
          - ALL
          - WECHAT
          - ALIPAY
          - ALIPAYONLINE
          - ALIPAYPLUS
          - ALIPAYAPS
          - APSINSTORE
          - ALIPAYPLUS_ALL
          - APSCASHIER
          - CBBANKPAY
          - UNIONPAY
          - UNIONPAYONLINE
          - CREDITCARD
        default: ALL
      description: |
        按支付方式过滤，取值照现网：`ALL` 不过滤，其余每个取值对应一种支付方式，只返回该支付方式的流水。
    ReportGatewayApp:
      name: gateway_app
      in: query
      required: false
      schema:
        type: string
        pattern: ^[0-9]+(,[0-9]+)*$
      description: |
        按订单的下单方式过滤：下单方式码，多个用半角逗号分隔。不带时不过滤。码的取值照现网：

        | 码 | 现网名称 |
        |---|---|
        | `0` | `OFFLINE` |
        | `1` | `OFFLINE_QRCODE` |
        | `2` | `CLIENT_CODE` |
        | `3` | `GATEWAY_QRCODE` |
        | `4` | `GATEWAY_JSAPI` |
        | `5` | `GATEWAY_OFFLINE` |
        | `6` | `GATEWAY_OFFLINE_QRCODE` |
        | `7` | `CLIENT_CODE_QRCODE` |
    ReportMerchant:
      name: app_client_ids
      in: query
      required: false
      schema:
        type: string
      description: |
        只看哪个商户的流水，填一个商户号（`client_id`）：

        - 不带或为空：当前商户及其全部子商户。
        - 当前商户自己的商户号：只看当前商户。
        - 某个子商户的商户号：只看该子商户。

        填的商户号不是当前商户、也不在 `listSubMerchants` 返回的子商户里时返回 `400`。
    ReportOrderId:
      name: order_id
      in: query
      required: false
      schema:
        type: string
      description: |
        按单号找：订单号或商户订单号包含它的即算匹配。带它又带了 `begin`、`end` 时，区间长度有上限（默认 31 天，可配置），超过返回 `400`；只带它、不带区间时不限日期。
    ReportThisDevice:
      name: thisdevice
      in: query
      required: false
      schema:
        type: boolean
        default: false
      description: 为 `true` 时只看本机建的订单；退款行跟随原订单的发起设备
    ReportClearingStatus:
      name: clearing_status
      in: query
      required: false
      schema:
        type: integer
      description: 清算状态。收下不用，不按它过滤
    IgnoredTimezone:
      name: timezone
      in: query
      required: false
      schema:
        type: string
      description: 设备时区。收下不用，日期与时间一律按商户
    VoucherNo:
      name: voucherNo
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: 券号：扫码时取码内容里的 `voucherNo`，手输时是顾客券面上的券号
  responses:
    Rejected:
      description: 被拒绝。原因见响应体的 `code` 与 `message`；本接口会返回哪些 `code` 见接口说明。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failure'
          example:
            status: 400
            message: Verification code is not correct
            data: null
            timestamp: '2026-10-06T18:20:31.482+00:00'
            traceId: 5f1c0a7be2d94c33
            code: 204020
    ReloginRequired:
      description: 需要重新登录并登记本机。`code` 的取值见总说明「状态码」一节。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Failure'
          example:
            status: 401
            message: Device registration failed, please log in again
            data: null
            timestamp: '2026-10-06T18:20:31.482+00:00'
            traceId: 5f1c0a7be2d94c33
            code: 206014
  schemas:
    Failure:
      type: object
      description: 失败响应体。现网的外壳加整数 `code`。
      required:
        - status
        - message
        - code
      properties:
        status:
          type: integer
          description: 与 HTTP 状态相同
        message:
          type: string
          description: 可以直接展示的失败原因
        data:
          type: 'null'
          description: 恒为 `null`
        timestamp:
          type: string
          description: 响应生成的时间
        traceId:
          type: string
          description: 本次请求的追踪号
        code:
          type: integer
          description: 整数错误码，取值见各接口说明与总说明「状态码」一节
        context:
          type: object
          description: 附加信息，字段与登记该码的码表所写相同。没有时不返回
    LoginCaptcha:
      type: object
      required:
        - key
        - img
      properties:
        key:
          type: string
          description: 这张验证码的标识（20 位大写字母与数字），登录时作为 `captchaKey` 带回
        img:
          type: string
          description: JPEG 图片。不带 `imgurl` 时是不带前缀的 URL 安全 Base64；`imgurl=true` 时是以 `data:image/jpeg;base64,` 开头的 data URL
    SignInRequest:
      type: object
      required:
        - loginId
        - password
        - verifyCode
        - captchaKey
      properties:
        loginId:
          type: string
          description: 登录名，用户名或邮箱。先按用户名精确匹配，匹配不到再按已验证的邮箱，不分大小写
        password:
          type: string
          format: password
        verifyCode:
          type: string
          description: 图形验证码上的 4 位数字
        captchaKey:
          type: string
          description: '`getLoginCaptcha` 返回的 `key`'
        devId:
          type: string
          description: 本机上次登记得到的 `dev_id`。本地没有时不带（键盘机不带）
    Merchant:
      type: object
      description: 登录所在商户的资料与配置。
      required:
        - short_name
        - retail_surcharge
        - enable_refund_auth
        - enable_refund_password
      properties:
        short_name:
          type: string
          description: 商户简称
        business_hours:
          type: string
          description: 营业时段，可有多段，半角逗号分隔，每段 `HH:mm:ss-HH:mm:ss`；商户没设时不返回
        retail_surcharge:
          type: boolean
          description: 是否开启了顾客承担手续费
        enable_refund_auth:
          type: boolean
          description: 恒为 `false`
        enable_refund_password:
          type: boolean
          description: 恒为 `true`
        address:
          type: string
          description: 街道地址；商户资料没填时不返回
        suburb:
          type: string
          description: 城市；商户资料没填时不返回
        state:
          type: string
          description: 省或州；商户资料没填时不返回
        postcode:
          type: string
          description: 邮编；商户资料没填时不返回
        company_phone:
          type: string
          description: 商户电话；商户资料没填时不返回
    AccountContext:
      type: object
      description: 登录账号与所在商户，`signIn` 与 `getCurrentUser` 共用的部分。
      properties:
        client_id:
          type: integer
          description: 登录所在商户的商户号
        client_moniker:
          type: string
          description: 商户代码
        role:
          type: integer
          enum:
            - 1
            - 2
            - 3
          description: |
            账号在终端上的角色，按下面的先后取第一个符合的（成员可以同时持有多个角色）：

            - `1` 商户 Owner，或持有 Admin 角色。
            - `2` 持有店长角色。
            - `3` 其余成员。
        display_name:
          type: string
          description: 账号的显示名
        terminal_id:
          type: string
          description: 本机的终端序列号
        dev_type:
          type: string
          description: 本机登记的终端类别
        client:
          $ref: '#/components/schemas/Merchant'
    SignInResult:
      description: 登录结果。`terminal_id` 与 `dev_type` 只在请求带了 `devId` 且这台设备已登记时返回。
      required:
        - sign_key
        - client_id
        - client_moniker
        - role
        - client
      allOf:
        - $ref: '#/components/schemas/AccountContext'
      properties:
        sign_key:
          type: string
          description: 临时登录凭据（20 位大写字母与数字），有效 30 分钟，登记本机时放进加密前的请求内容
    CurrentUser:
      description: 当前登录账号、所在商户的配置与本机信息。
      required:
        - client_id
        - client_moniker
        - role
        - terminal_id
        - dev_type
        - client
      allOf:
        - $ref: '#/components/schemas/AccountContext'
      properties:
        dev_name:
          type: string
          description: 设备名；没起名时不返回
        tip_config:
          type: string
          description: 小费预设档位。商户开了小费且设了预设档位时返回，否则不返回
    DeviceRegistration:
      type: object
      required:
        - dev_id
        - auth_code
        - client_id
        - client_dev_id
        - client_type
      properties:
        dev_id:
          type: string
          description: 服务端分配的设备编号。参与 `Global-Sign` 计算，也是下次登录时的 `devId`
        auth_code:
          type: string
          description: 设备密钥（32 位字母与数字），参与 `Global-Sign` 计算。每次登记换新
        client_id:
          type: integer
          description: 设备所属商户的商户号
        client_dev_id:
          type: string
          description: 终端序列号，即请求里的 `client_device_id`
        client_type:
          type: string
          description: 终端类别，即路径上的 `devType`
    TipConfig:
      type: object
      description: 商户的小费设置。对整个商户生效，与商户后台、商户 App 里设置的是同一份。
      required:
        - enable_tip
        - tip_preset_value
      properties:
        enable_tip:
          type: boolean
          description: 是否开启小费
        tip_preset_value:
          type: string
          description: 三个预设档位（百分比），用半角逗号分隔，例如 `10,15,20`。商户没有设置过时为平台默认档位
    UpdateTipConfigRequest:
      type: object
      required:
        - enable_tip
      properties:
        enable_tip:
          type: boolean
          description: 是否开启小费
        tip_preset_value:
          type: string
          description: 三个预设档位（百分比），每个是 0 到 30 之间的整数，用半角逗号分隔，例如 `10,15,20`
    CustomerSurchargeRequest:
      type: object
      properties:
        retail_surcharge:
          type: boolean
          description: 端本地记录的顾客承担手续费开关。收下不用
    SurchargeEstimates:
      type: object
      description: 按支付方式品牌给出的试算结果，键只有 `Wechat`、`Alipay`；商户没开通、取不到汇率或算不出的品牌不出现。
      properties:
        Wechat:
          $ref: '#/components/schemas/SurchargeEstimate'
        Alipay:
          $ref: '#/components/schemas/SurchargeEstimate'
    SurchargeEstimate:
      type: object
      description: 一个支付方式的人民币估算。金额单位是人民币元，写成十进制字符串：标价币种为 `CNY` 时即原值，否则按该支付方式通道的参考汇率折算、四舍五入到分。
      required:
        - cny_total
        - cny_surcharge
        - cny_tax
      properties:
        cny_total:
          type: string
          description: 顾客应付总额（含顾客承担的手续费）的人民币估算
        cny_surcharge:
          type: string
          description: 顾客承担的手续费的人民币估算
        cny_tax:
          type: string
          description: 恒为 `0.00`
    RetailOrderBase:
      type: object
      description: 扫付款码收款与生成动态收款码共有的请求字段。
      required:
        - amount
        - currency
      properties:
        amount:
          type: integer
          minimum: 1
          description: 收款金额，不含小费，以分计（币种的最小单位）
        currency:
          type: string
          description: 收款币种，只收商户的结算币种或 `CNY`
        tip:
          type: number
          minimum: 0
          description: 小费，单位分；可带小数，服务端四舍五入到整数分。与 `amount` 同币种，单独记录、不并入 `amount`。不按商户的小费设置校验。没有小费时不带或为 `0`
        preauth:
          type: boolean
          default: false
          description: 为 `true` 时按预授权收款：付款成功后资金挂起，在 POS 上释放；与支付方式品牌无关
        remark:
          type: string
          description: 订单备注，`getOrder` 以 `order_detail` 返回
        title:
          type: string
          description: 订单标题。收下不用
        timezone:
          type: string
          description: 设备时区。收下不用
        customerrate:
          type: boolean
          description: 端本地记录的顾客承担手续费开关。收下不用，是否加收手续费按商户的设置
    MicropayOrderRequest:
      description: 扫付款码收款的请求体。
      required:
        - amount
        - currency
        - authCode
      allOf:
        - $ref: '#/components/schemas/RetailOrderBase'
      properties:
        authCode:
          type: string
          description: 扫到的顾客付款码
        clientOrderId:
          type: string
          description: 商户订单号（Poynt 终端带），`getOrder` 以 `client_order_id` 返回
    QrcodeOrderRequest:
      description: 生成动态收款码（通用码与银联码）的请求体。
      allOf:
        - $ref: '#/components/schemas/RetailOrderBase'
      properties:
        directpay:
          type: boolean
          description: 键盘机带的直付标记。收下不用
    OrderStatus:
      type: integer
      enum:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
      description: |
        订单状态，取值与现网相同：

        | 值 | 含义 |
        |---|---|
        | `0` | 已建单，尚未付款 |
        | `1` | 不予受理 |
        | `2` | 支付中 |
        | `3` | 已关闭（过期、关闭或取消） |
        | `4` | 支付失败 |
        | `5` | 支付成功 |
        | `6` | 部分退款 |
        | `7` | 全额退款 |

        预授权收款资金挂起不改变状态位：按已退情况为 `5` / `6` / `7`，挂起看 `pre_auth`。
    MicropayOrderResult:
      type: object
      required:
        - order_id
        - status
      properties:
        order_id:
          type: string
          description: 订单号，用于 `getOrder` 轮询
        status:
          $ref: '#/components/schemas/OrderStatus'
    QrcodeOrderResult:
      type: object
      required:
        - order_id
        - code_url
        - qrcode_img
      properties:
        order_id:
          type: string
          description: 订单号，用于 `getOrder` 轮询
        code_url:
          type: string
          description: 码内容：这笔订单的付款链接
        qrcode_img:
          type: string
          description: 把 `code_url` 画成的 PNG 图片，以 `data:image/png;base64,` 开头的 data URI
    UnionpayQrcodeOrderResult:
      type: object
      required:
        - order_id
        - code_url
        - qrcode_img
        - currency
        - channel
      properties:
        order_id:
          type: string
          description: 订单号，用于 `getOrder` 轮询
        code_url:
          type: string
          description: 码内容：银联二维码串，码里的金额含小费，商户开启了顾客承担手续费时另含手续费
        qrcode_img:
          type: string
          description: 把 `code_url` 画成的 PNG 图片，以 `data:image/png;base64,` 开头的 data URI
        currency:
          type: string
          description: 订单币种
        channel:
          type: string
          enum:
            - UnionPay
          description: 恒为 `UnionPay`
    RetailOrder:
      type: object
      description: |
        一笔订单。金额是数值，单位是元；时间按商户所在时区，格式 `yyyy-MM-dd HH:mm:ss`。
        没有值的字段不返回键、不返回 `null`（与现网一致，端按「键是否存在」判断）；`required` 里的是任何状态下都返回的字段。
      required:
        - status
        - order_id
        - order_description
        - order_detail
        - currency
        - total_amount
        - display_amount
        - tip_amount
        - serviceFee
        - customer_payment_amount
        - tax_amount
        - coupon_payment_amount
        - create_time
        - pre_auth
        - refund_fee
      properties:
        status:
          $ref: '#/components/schemas/OrderStatus'
        error_code:
          type: string
          description: 失败原因代码；没有失败时不返回
        error_message:
          type: string
          description: 失败原因，可以直接展示；没有失败时不返回
        order_id:
          type: string
          description: 订单号
        client_order_id:
          type: string
          description: 商户订单号（下单时的 `clientOrderId`）；没有时不返回
        order_description:
          type: string
          description: 产品描述
        order_detail:
          type: string
          description: 备注（下单时的 `remark`）；没填备注时与 `order_description` 相同
        currency:
          type: string
          description: 订单币种
        total_amount:
          type: number
          description: 金额加小费
        display_amount:
          type: number
          description: 金额，不含小费
        tip_amount:
          type: number
          description: 小费
        serviceFee:
          type: number
          description: 顾客承担的手续费
        customer_payment_amount:
          type: number
          description: 顾客实付总额，即 `total_amount` 加 `serviceFee`；可退金额是它减去 `refund_fee`
        tax_amount:
          type: number
          description: 恒为 `0`
        coupon_payment_amount:
          type: number
          description: 恒为 `0`
        exchange_rate:
          type: number
          description: 成交时的汇率；未成交或没有汇率时不返回
        channel:
          type: string
          description: 支付方式品牌，例如 `Wechat`、`Alipay`、`UnionPay`；顾客还没选定支付方式时不返回
        create_time:
          type: string
          description: 建单时间，按商户所在时区，格式 `yyyy-MM-dd HH:mm:ss`
        transaction_time:
          type: string
          description: 付款成功的时间；未成功时不返回
        pre_auth:
          type: integer
          enum:
            - 0
            - 1
          description: '`1` 表示这笔是平台挂起中的预授权收款，其余为 `0`'
        refund_fee:
          type: number
          description: 已退金额
        refund_logs:
          type: array
          items:
            $ref: '#/components/schemas/RetailRefundLog'
          description: 退款记录，只在 `status` 为 `6` 或 `7` 时返回；只列已受理的退款（处理中与成功），按 `create_time` 倒序
        logo_print:
          type: string
          description: 小票 logo 图片地址；没有配置时不返回
        additional_content:
          type: string
          description: 小票附加文字；没有设置时不返回
        orderReference:
          type: object
          description: 付款人付款时填写的附加信息，键是信息项的名称；没有时不返回
        orderReferenceKeys:
          type: array
          description: '`orderReference` 里各项的显示顺序；没有时不返回'
          items:
            type: string
    RetailRefundLog:
      type: object
      description: 一笔已受理的退款（处理中或成功）。没有值的字段不返回键、不返回 `null`。
      required:
        - refund_id
        - out_refund_id
        - amount
        - currency
        - create_time
      properties:
        refund_id:
          type: string
          description: 平台退款号
        out_refund_id:
          type: string
          description: 与 `refund_id` 相同
        client_refund_id:
          type: string
          description: 商户退款号；终端发起的退款没有，不返回
        amount:
          type: number
          description: 退款金额，单位是元
        currency:
          type: string
          description: 退款币种，即订单币种
        create_time:
          type: string
          description: 退款发起的时间，按商户所在时区，格式 `yyyy-MM-dd HH:mm:ss`
        confirm_time:
          type: string
          description: 渠道确认退款的时间，格式同 `create_time`；渠道确认前不返回
    RefundPasswordRequest:
      type: object
      required:
        - refund_password
      properties:
        refund_password:
          type: string
          description: 商户的退款密码，6 位数字
    RetailRefundRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type:
            - integer
            - string
          minimum: 1
          pattern: ^[0-9]+$
          description: 退款金额，以分计（订单币种的最小单位），须是正数。整数（如 `500`）或数字字符串（如 `"500"`）都收。币种是订单的币种，不用传
    RetailRefundResult:
      type: object
      description: 已受理的退款。
      required:
        - refund_id
        - partner_refund_id
        - amount
        - currency
        - result_code
      properties:
        refund_id:
          type: string
          description: 平台退款号
        partner_refund_id:
          type: string
          description: 与 `refund_id` 相同
        amount:
          type: integer
          description: 退款金额，以分计（订单币种的最小单位）
        currency:
          type: string
          description: 退款币种，即订单币种
        result_code:
          type: string
          enum:
            - SUCCESS
            - FINISHED
          description: |
            返回时的退款状态：

            | 值 | 含义 |
            |---|---|
            | `SUCCESS` | 已提交渠道，处理中 |
            | `FINISHED` | 渠道已确认退款 |
    RetailTransaction:
      type: object
      description: |
        流水的一行：一笔成交的收款，或一笔已受理的退款（处理中或成功）。金额是数值，单位是元；时间按商户所在时区。`status` 是所属订单的当前状态，退款行也一样。

        没有值的字段不返回键、不返回 `null`；`required` 里的是每行都返回的字段。键盘机（`Device-Type` 为 `ingenico`）上 `order_id`、`total_amount`、`refund_fee` 另有改写，见各字段说明。
      required:
        - order_id
        - transaction_type
        - clearing_amount
        - currency
        - channel
        - status
        - pre_authorization
        - trade_date
        - trade_time
        - create_time
        - total_amount
        - refund_fee
      properties:
        order_id:
          type: string
          description: 订单号，退款行为原订单的订单号。键盘机上退款行为流水号与订单号拼成的串（流水号在前），拿它查不到订单
        client_order_id:
          type: string
          description: 商户订单号；没有时不返回
        transaction_type:
          type: string
          enum:
            - Credit
            - Debit
          description: '`Credit` 为收款行，`Debit` 为退款行'
        clearing_amount:
          type: number
          description: |
            这一行的清算金额，按结算币种，是正数：收款行为收款额，退款行为这笔退款额。原生端上，标价币种为 `CNY` 的订单这里为 `total_amount` 的值（以人民币计）
        currency:
          type: string
          description: 订单币种
        channel:
          type: string
          description: 支付方式品牌，例如 `Wechat`、`Alipay`、`UnionPay`
        status:
          $ref: '#/components/schemas/OrderStatus'
        pre_authorization:
          type: integer
          enum:
            - 0
            - 1
          description: |
            所属订单是不是预授权收款：`1` 是，`0` 不是。不论之后是否已释放或已清算，预授权收款的订单都是 `1`。与 `getOrder` 的 `pre_auth` 不是同一个意思：`pre_auth` 为 `1` 只表示这笔预授权还挂起中
        trade_date:
          type: string
          description: 这一行所属的商户营业日，`yyyy-MM-dd`，与请求的 `begin`、`end` 同一个日期；拿它调 `getDailyReport` 取的就是这一天
        trade_time:
          type: string
          description: 这一行的时分秒，`HH:mm:ss`，按商户时区。收款行取付款成功的时刻，退款行取退款受理的时刻
        create_time:
          type: string
          description: 所属订单的建单时间，格式 `yyyy-MM-dd HH:mm:ss`
        total_amount:
          type: number
          description: |
            所属订单的金额加小费，按订单币种；标价币种为 `CNY` 的订单的退款行，为这笔退款的人民币金额。键盘机上：退款行为 `0`；标价币种为 `CNY` 的订单的收款行，为 `clearing_amount` 的值
        refund_fee:
          type: number
          description: 所属订单的已退金额。键盘机上：退款行为这笔退款的金额（即 `clearing_amount`），收款行为 `0`
        refund_id:
          type: string
          description: 平台退款号；只在退款行返回
        date_total:
          type: object
          additionalProperties: false
          description: 每页里每个 `trade_date` 的第一行返回空对象 `{}`，其余行不返回。端只看它在不在，用来起日期分组
    RetailPagination:
      type: object
      description: 分页信息。
      required:
        - page
        - limit
        - totalCount
        - totalPages
        - hasNextPage
      properties:
        page:
          type: integer
          description: 当前页码，从 1 起
        limit:
          type: integer
          description: 每页行数
        totalCount:
          type: integer
          description: 符合条件的总行数
        totalPages:
          type: integer
          description: 总页数
        hasNextPage:
          type: boolean
          description: 是否还有下一页
    RetailTransactionPage:
      type: object
      description: 一页流水。
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: 本页的流水；没有数据时为 `[]`
          items:
            $ref: '#/components/schemas/RetailTransaction'
        pagination:
          $ref: '#/components/schemas/RetailPagination'
    RetailTradeSummary:
      type: object
      description: |
        流水合计，键都返回，没有流水时为 `0`。金额是数值，单位是元；计数是整数。「人民币标价」指标价币种为 `CNY` 的订单，「非人民币标价」指其余订单；「预授权」指预授权收款的订单。

        `total_surcharge`、`total_settle_amount` 只计已计费的流水，刚成交的几笔手续费可能尚未计入。
      required:
        - display_amount
        - pre_display_amount
        - cny_display_amount
        - cny_settle_amount
        - pre_cny_display_amount
        - tip_amount
        - tip_count
        - cny_tip_amount
        - total_credit
        - payment_count
        - total_debit
        - gross_amount
        - total_settle_amount
        - total_surcharge
        - tax_amount
        - refund_count
        - order_count
      properties:
        display_amount:
          type: number
          description: 非人民币标价的收款行，所属订单的金额合计（不含小费与手续费）
        pre_display_amount:
          type: number
          description: 同 `display_amount`，只计预授权
        cny_display_amount:
          type: number
          description: 人民币标价的收款行，所属订单的金额合计
        cny_settle_amount:
          type: number
          description: 人民币标价的收款行，清算金额合计
        pre_cny_display_amount:
          type: number
          description: 同 `cny_display_amount`，只计预授权
        tip_amount:
          type: number
          description: 非人民币标价的收款行，逐笔取「小费」与「顾客实付总额减已退金额」中较小的一个再求和，保留 2 位小数
        tip_count:
          type: integer
          description: 上一项逐笔取值大于 0 的收款行笔数
        cny_tip_amount:
          type: number
          description: 同 `tip_amount`，只计人民币标价
        total_credit:
          type: number
          description: 收款行的清算金额合计（毛收款）
        payment_count:
          type: integer
          description: 收款行笔数
        total_debit:
          type: number
          description: 退款行的清算金额合计，取负数
        gross_amount:
          type: number
          description: 净额，`total_credit` 加 `total_debit`
        total_settle_amount:
          type: number
          description: 扣手续费后的结算金额合计，收款行加、退款行减；只计已计费的流水
        total_surcharge:
          type: number
          description: 结算金额减清算金额的合计（收款行加、退款行减），即手续费取负；只计已计费的流水
        tax_amount:
          type: number
          description: 恒为 `0`
        refund_count:
          type: integer
          description: 退款行笔数
        order_count:
          type: integer
          description: 流水行笔数，即收款行加退款行，不是订单数
    RetailPrintExtras:
      type: object
      description: 打印用的商户配置，有配置才返回。
      properties:
        additional_content:
          type: string
          description: 小票页脚文字；没有配置时不返回
        logo_print:
          type: string
          description: 小票 logo 图片地址；没有配置时不返回
    RetailTradeSummaryResult:
      description: |
        `getTradeSummary` 的响应：流水合计，加上打印用的页脚文字与 logo。键盘机（`Device-Type` 为 `ingenico`）上 `tip_amount` 为 `0`，`cny_display_amount` 为 `cny_settle_amount` 的值。
      allOf:
        - $ref: '#/components/schemas/RetailTradeSummary'
        - $ref: '#/components/schemas/RetailPrintExtras'
    RetailSubMerchant:
      type: object
      description: 一个子商户。
      required:
        - client_id
        - short_name
      properties:
        client_id:
          type: integer
          description: 子商户的商户号，按商户筛选时作为 `app_client_ids` 带上
        short_name:
          type: string
          description: 子商户的简称
    RetailReceiptContent:
      type: object
      description: 打印小票用的抬头、页脚、单号码类型与商户名址。没有值的字段不返回键。
      required:
        - head
        - qr_type
        - company_name
        - short_name
      properties:
        head:
          type: string
          description: |
            小票抬头：运营配置的抬头行，整段包在 `<root>` 里，每行一个 `<p>`，行内文字做 XML 转义，例如 `<root><p>Pine Street Cafe</p></root>`。没配抬头时为空串
        footer:
          type: string
          description: 小票页脚：运营配置的页脚行，格式同 `head`。只在抬头与页脚都配了时返回
        qr_type:
          type: string
          enum:
            - QR_CODE
            - BAR_CODE
          description: 小票上单号码的类型：`QR_CODE` 二维码，`BAR_CODE` 一维码。没配时为 `QR_CODE`
        company_name:
          type: string
          description: 商户的公司名
        short_name:
          type: string
          description: 商户简称
        address1:
          type: string
          description: 地址第一行（街道地址）；商户资料没填时不返回
        address2:
          type: string
          description: 地址第二行：城市、省份名称与邮编，拼成「城市,省份 邮编」；商户资料没填地址时不返回
    RetailReportTransaction:
      type: object
      description: |
        日结里的一行流水：一笔成交的收款，或一笔已受理的退款。金额是数值，单位是元，都是正数。

        没有值的字段不返回键、不返回 `null`；`required` 里的是每行都返回的字段。
      required:
        - transaction_time
        - clearing_amount
        - transaction_type
        - order_id
        - channel
        - transaction_amount
        - transaction_currency
        - display_amount
        - total_amount
        - tip_amount
        - currency
        - system_generate
        - customer_payment_amount
        - gateway
        - clearing_status
        - remark
      properties:
        transaction_time:
          type: string
          description: 这一行的时刻，`HH:mm:ss`，按商户时区。收款行取付款成功的时刻，退款行取退款受理的时刻
        clearing_amount:
          type: number
          description: 这一行的清算金额，按结算币种：收款行为收款额，退款行为这笔退款额
        transaction_type:
          type: string
          enum:
            - Credit
            - Debit
          description: '`Credit` 为收款行，`Debit` 为退款行'
        order_id:
          type: string
          description: 订单号，退款行为原订单的订单号
        channel:
          type: string
          description: 支付方式品牌，例如 `Wechat`、`Alipay`、`UnionPay`
        transaction_amount:
          type: number
          description: 这一行按标价币种计的金额：收款行为付款金额，退款行为退款金额
        transaction_currency:
          type: string
          description: 标价币种
        refund_id:
          type: string
          description: 平台退款号；只在退款行返回
        display_amount:
          type: number
          description: 所属订单的金额，不含小费
        total_amount:
          type: number
          description: 所属订单的金额加小费
        tip_amount:
          type: number
          description: 所属订单的小费
        currency:
          type: string
          description: 订单币种
        system_generate:
          type: integer
          enum:
            - 0
          description: 恒为 `0`
        client_order_id:
          type: string
          description: 商户订单号；没有时不返回
        customer_payment_amount:
          type: number
          description: 所属订单的顾客实付总额
        gateway:
          type: integer
          description: 所属订单的下单方式码，取值同 `listOrders` 的 `gateway_app`
        settle_amount:
          type: number
          description: 这一行扣手续费后的结算金额；尚未计费时不返回
        surcharge_rate:
          type: number
          description: 这一行的手续费率，例如 `0.025` 表示 2.5%；尚未计费时不返回
        clearing_status:
          type: integer
          enum:
            - 0
            - 1
            - 2
          description: 清算状态：`0` 待清算，`1` 已清算，`2` 预授权挂起中
        system_transaction_id:
          type: string
          description: 渠道流水号；没有时不返回
        client_refund_id:
          type: string
          description: 商户退款号；只在退款行、且有商户退款号时返回
        out_refund_id:
          type: string
          description: 与 `refund_id` 相同；只在退款行返回
        remark:
          type: string
          description: 恒为空串
    RetailPrintTransaction:
      description: '`getTransactionPrintData` 里的一行流水：字段同日结的一行，另加 `transaction_date`。'
      required:
        - transaction_date
      allOf:
        - $ref: '#/components/schemas/RetailReportTransaction'
      properties:
        transaction_date:
          type: string
          description: 这一行时刻的日历日期，`yyyy-MM-dd`，按商户时区，取法同 `transaction_time`；不是营业日
    RetailReportAnalysis:
      description: 日结的整体汇总：键与口径同 `getTradeSummary` 的流水合计，另加 `date`。
      required:
        - date
      allOf:
        - $ref: '#/components/schemas/RetailTradeSummary'
      properties:
        date:
          type: string
          description: |
            报表覆盖的范围，按商户时区：

            - `getDailyReport` 取全天时为营业日 `dd/MMM/yyyy`，例如 `06/Oct/2026`；取时段时为 `dd/MMM/yyyy HH:mm:ss~dd/MMM/yyyy HH:mm:ss`。
            - `getTransactionPrintData` 带了 `transDate` 时为区间，格式同上；只带 `order_id` 时为第一笔流水的 `HH:mm:ss`。
    RetailChannelSummary:
      type: object
      description: |
        按支付方式汇总的一行。收款行加、退款行减；金额是数值，单位是元，四舍五入到 2 位小数。最后一行的 `channel` 为 `All`，是前面各行的合计。
      required:
        - channel
        - count
        - input_amount
        - tip_amount
        - clearing_amount
      properties:
        channel:
          type: string
          description: 支付方式品牌，例如 `Wechat`、`Alipay`；合计行为 `All`
        count:
          type: integer
          description: 流水行笔数（收款行加退款行）
        input_amount:
          type: number
          description: |
            订单金额（不含小费）合计，收款行加、退款行减：

            - 非人民币标价的订单：收款行计订单金额。退款行按这笔退款额计，依次抵扣这单的订单金额、顾客承担的手续费、小费：抵在订单金额上的计入这里（取负），抵在手续费上的不计入这两项，抵在小费上的计入 `tip_amount`。全额退完后这单在 `input_amount` 与 `tip_amount` 上都归零。
            - 标价币种为 `CNY` 的订单：按这一行的清算金额折算，清算金额乘以订单金额、除以顾客实付总额，收款行与退款行都这样算。
        tip_amount:
          type: number
          description: |
            小费合计，收款行加、退款行减。非人民币标价的订单：收款行计小费，退款行计这笔退款额扣在小费上的部分（扣法见 `input_amount`）。标价币种为 `CNY` 的订单：这一行的清算金额减去 `input_amount` 折算出的金额
        clearing_amount:
          type: number
          description: 清算金额合计，收款行加、退款行减。含顾客承担的手续费，所以不等于 `input_amount` 与 `tip_amount` 之和
    RetailReportBase:
      description: 日结与打印数据共有的部分：整体汇总、按支付方式汇总，以及打印用的页脚文字与 logo。
      required:
        - analysis
        - channel_analysis
      allOf:
        - $ref: '#/components/schemas/RetailPrintExtras'
      properties:
        analysis:
          $ref: '#/components/schemas/RetailReportAnalysis'
        channel_analysis:
          type: array
          description: 按支付方式一行，最后一行为合计
          items:
            $ref: '#/components/schemas/RetailChannelSummary'
    RetailDailyReport:
      description: 日结报表。
      required:
        - transactions
      allOf:
        - $ref: '#/components/schemas/RetailReportBase'
      properties:
        transactions:
          type: array
          description: 这一天（或所选时段）的每笔流水，按时间先后排列
          items:
            $ref: '#/components/schemas/RetailReportTransaction'
    RetailPrintData:
      description: 所选区间或单笔订单的打印数据，结构同日结报表，每行多 `transaction_date`。
      required:
        - transactions
      allOf:
        - $ref: '#/components/schemas/RetailReportBase'
      properties:
        transactions:
          type: array
          description: 区间内（或这笔订单）的每笔流水，按时间先后排列
          items:
            $ref: '#/components/schemas/RetailPrintTransaction'
    ProductLinkType:
      type: string
      enum:
        - product
        - ticket
        - giftcard
      description: 券所属销售单的产品：`product` 商品 / `ticket` 票务 / `giftcard` 礼卡。
    SalesOrderStatus:
      type: string
      enum:
        - PAID
        - PARTIALLY_REFUNDED
        - REFUNDING
        - REFUNDED
      description: 销售单状态：`PAID` 已付 / `PARTIALLY_REFUNDED` 部分已退 / `REFUNDING` 退款处理中 / `REFUNDED` 全额已退。有券的销售单都已付款。
    RedemptionStatus:
      type: string
      enum:
        - NOT_REDEEMED
        - REDEEMED
        - VOID
      description: 核销状态：`NOT_REDEEMED` 未核销 / `REDEEMED` 已核销 / `VOID` 已作废（只有礼卡兑换券会作废）。
    NotRedeemableReason:
      type: string
      enum:
        - ALREADY_REDEEMED
        - VOIDED
        - REFUND_FROZEN
        - REFUNDED
      description: |
        券现在不能核销的原因：

        | 值 | 含义 |
        |---|---|
        | `ALREADY_REDEEMED` | 已经核销过 |
        | `VOIDED` | 已作废（礼卡兑换券被商户作废） |
        | `REFUND_FROZEN` | 所属订单有退款正在处理，暂时不能核销；退款没有成功的，之后恢复可核销 |
        | `REFUNDED` | 所属订单已有退款成功（全额或部分），券随之失效 |
    VoucherLine:
      type: object
      additionalProperties: false
      description: 销售单的一行所买内容，下单时的快照。
      required:
        - itemName
        - unitPrice
        - quantity
        - lineAmount
      properties:
        itemName:
          type: string
          description: 所买内容的名称（下单时的快照）
        unitPrice:
          $ref: '#/components/schemas/Money'
        quantity:
          type: integer
          minimum: 1
        lineAmount:
          $ref: '#/components/schemas/Money'
    VoucherView:
      type: object
      additionalProperties: false
      description: |
        券视图：一张券与它所属的销售单，查券、核销、改备注都返回它。

        - 金额是 `{ amount, currency }`：`amount` 是最小币种单位的整数字符串（加元的分），`currency` 是币种。
        - 时刻是 UTC 的 RFC 3339 时间（如 `2026-10-06T19:02:47Z`）；`ticket.eventDate` 是日期（`YYYY-MM-DD`）。
        - 没有值的字段不返回键、不返回 `null`；`required` 里的是任何情形都返回的字段。
      required:
        - voucherNo
        - salesOrderId
        - orderId
        - productKind
        - linkName
        - status
        - redemptionStatus
        - redeemable
        - paidAt
        - amount
        - lines
      properties:
        voucherNo:
          type: string
          description: 券号，即请求路径上的券号
        salesOrderId:
          type: string
          description: 销售单号，与商户后台销售单详情里的销售单号相同
        orderId:
          type: string
          description: 支付订单号
        productKind:
          $ref: '#/components/schemas/ProductLinkType'
        linkName:
          type: string
          description: 售出这张券的商品、票务或礼卡链接的名称
        status:
          $ref: '#/components/schemas/SalesOrderStatus'
        redemptionStatus:
          $ref: '#/components/schemas/RedemptionStatus'
        redeemable:
          type: boolean
          description: 现在能不能核销
        notRedeemableReason:
          allOf:
            - $ref: '#/components/schemas/NotRedeemableReason'
          description: 不能核销的原因；`redeemable` 为 `false` 时才返回
        paidAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 付款成功的时刻
        redeemedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 核销完成的时刻；已核销才返回
        operator:
          type: string
          description: 核销操作员的显示名；已核销才返回
        remark:
          type: string
          description: 核销备注；已核销且有备注才返回
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 顾客实付
        lines:
          type: array
          minItems: 1
          description: 所买内容，按下单时的顺序；礼卡恒为一行
          items:
            $ref: '#/components/schemas/VoucherLine'
        ticket:
          type: object
          additionalProperties: false
          description: 活动信息，下单时的快照；只有票务返回
          required:
            - eventName
            - eventDate
            - venue
          properties:
            eventName:
              type: string
              description: 活动名
            eventDate:
              allOf:
                - $ref: '#/components/schemas/LocalDate'
              description: 活动日期
            eventTime:
              type: string
              description: 活动时间；没有设时不返回
            venue:
              type: string
              description: 场地
        giftcard:
          type: object
          additionalProperties: false
          description: 礼卡面额；只有礼卡返回
          required:
            - faceAmount
          properties:
            faceAmount:
              allOf:
                - $ref: '#/components/schemas/Money'
              description: 主卡面额
            bonusAmount:
              allOf:
                - $ref: '#/components/schemas/Money'
              description: 赠卡面额；没有赠卡时不返回
            bonusNotes:
              type: string
              description: 赠卡说明（使用范围、有效期等）；没有时不返回
    RedeemVoucherRequest:
      type: object
      additionalProperties: false
      required:
        - pin
      properties:
        pin:
          type: string
          minLength: 1
          description: 券的 PIN：扫码时取码内容里的 `pin`，手输时是顾客券面上的 PIN
        remark:
          type: string
          maxLength: 200
          description: 核销备注，最长 200 字；可以不带
    RedemptionRemarkRequest:
      type: object
      additionalProperties: false
      required:
        - remark
      properties:
        remark:
          type: string
          maxLength: 200
          description: 新的核销备注，整段覆盖原来的；空串表示清掉备注
    RedemptionRow:
      type: object
      additionalProperties: false
      description: 核销记录的一行。字段与券视图里的同名字段含义相同。
      required:
        - voucherNo
        - salesOrderId
        - productKind
        - linkName
        - amount
        - redeemedAt
        - operator
      properties:
        voucherNo:
          type: string
          description: 券号。看详情时拿它调 `getVoucher`
        salesOrderId:
          type: string
          description: 销售单号
        productKind:
          $ref: '#/components/schemas/ProductLinkType'
        linkName:
          type: string
          description: 售出这张券的链接的名称
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: 顾客实付
        redeemedAt:
          allOf:
            - $ref: '#/components/schemas/Timestamp'
          description: 核销完成的时刻
        operator:
          type: string
          description: 核销操作员的显示名
    RedemptionPage:
      type: object
      additionalProperties: false
      description: 一页核销记录。
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          description: 本页的核销记录，按核销时刻倒序；没有数据时为 `[]`
          items:
            $ref: '#/components/schemas/RedemptionRow'
        pagination:
          $ref: '#/components/schemas/RetailPagination'
    Timestamp:
      type: string
      format: date-time
      description: |
        **瞬时时刻**(RFC 3339 date-time)。in/out 非对称:

        - **响应 MUST UTC `Z`**(如 2026-05-19T14:30:00Z);
        - **请求/query 入参 MAY 任意合法 offset**,服务端归一 UTC(format: date-time 同时接受 Z 与 offset,
          「出参 Z」是约定、非 schema 可强制)。

        展示由消费方按本地时区换算(浏览器端即浏览器时区)。

        需要「哪一天」的地方有单独的日期字段(`YYYY-MM-DD`),别拿本类型截出日期来用。
    Currency:
      type: string
      description: ISO-4217 币种码。本期最小覆盖 CAD/USD/HKD/CNY(部署时可配置扩展)。
      examples:
        - CAD
        - USD
        - HKD
        - CNY
    Money:
      type: object
      description: 金额 = 最小币种单位整数(字符串) + 币种(禁裸数字流转;金额口径:字符串防 JSON number 精度丢失)。
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+$
          description: 最小币种单位整数的字符串(如 CAD 分 "1050";展示层按币种 minorUnit 换算)。
        currency:
          $ref: '#/components/schemas/Currency'
    LocalDate:
      type: string
      format: date
      description: |
        日期,`YYYY-MM-DD`。按字面值收发:展示直接用这个字符串,不要塞进 `Date` 再按浏览器时区渲染(负偏移时区会显示成前一天)。
      examples:
        - '2026-08-01'
