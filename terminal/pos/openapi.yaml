openapi: 3.1.0
info:
  title: POS 终端 — 终端面契约
  version: 1.0.0
  contact:
    name: 商户后台 BFF
  description: |
    现网已安装的 POS 应用调用的接口：Clover、Sunmi 系原生应用（下称原生端），以及 Ingenico 键盘机上的网页应用（下称键盘机）。除核销四个接口（`getVoucher`、`redeemVoucher`、`listRedemptions`、`updateRedemptionRemark`）外，地址、请求头、请求体与响应的形状都与现网一致，端不需要升级；核销几页要随新接口改版。

    ## 凭据

    - 登录前的接口（图形验证码、登录、登记本机）不带凭据。
    - `signIn` 返回临时登录凭据 `sign_key`，有效 30 分钟，只用于登记本机，有效期内可重复使用。
    - `registerDevice` 返回 `dev_id` 与设备密钥 `auth_code`。同一台设备每登记一次，设备密钥换新，旧的作废。一台终端只属于一个商户。
    - 此后每个请求都带四个头：`Merchant-Id`、`Device-Id`、`Device-Type`、`Global-Sign`，缺一不可。请求不带令牌，服务端按设备认出它当前由哪个账号登录；这份登录没有有效期。
    - `Global-Sign` 是把 `dev_id`、`auth_code`、请求路径用 `&` 连起来后算出的 SHA-256 十六进制串。请求路径是端发出时的完整路径，从 `/api` 起，不含查询参数。比对不分大小写，不一致即拒绝。
    - 另接受 `Device-Version`（应用版本号）与 `Device-Token`，以及一组旧头名 `client_id`、`device_id`、`client_type`、`device_version`、`device_token`，都不是必需的。其他头（如 Clover 版另发的 `royalpay_sign`）不读。

    设备上的登录在下列情况失效，失效后须重新登录并登记本机：

    - 同一台设备再次登录或登记本机。
    - 该账号修改了密码（任何入口，含找回密码重置）、被停用，或被移出商户。
    - 设备被停用或解绑。
    - 商户被冻结。

    同一账号可以同时在多台设备上登录，互不影响。

    ## 响应外壳

    - `/retail_valid/`、`/retail/`、`/vouchers/` 与 `/redemptions` 下的接口，成功响应是裸 JSON，没有外壳。
    - 失败响应的 HTTP 状态不是 2xx，响应体是 `{ status, message, data, timestamp, traceId, code }`：`status` 与 HTTP 状态相同，`message` 是可以直接展示的文案，`data` 为 `null`，`code` 是整数错误码。

    ## 状态码

    失败只用下面三档，其余 4xx 不使用。

    | HTTP 状态 | 情形 |
    |---|---|
    | `401` | 需要重新登录：设备上的登录失效、缺凭据头、设备未登记、签名不一致、设备被停用、商户被冻结、设备类型不认识 |
    | `400` | 登录、登记本机被拒（含上一行的原因在这两步仍然存在）；权限不足、参数不对、状态不允许、操作太频繁等业务性拒绝 |
    | `5xx` | 服务端故障 |

    `401` 的 `code`，每个受保护的接口都可能返回，各接口说明里不再重复：

    - `206014` 设备未登记、需要重新登记，或设备上的登录已失效；缺 `Merchant-Id`、`Device-Id` 头同此。
    - `206015` `Global-Sign` 与服务端算出的不一致，或没带。服务端可配置为对「不一致」只记录、不拒绝；没带 `Global-Sign` 时始终拒绝。
    - `206016` `Device-Type` 不是受支持的终端类别。
    - `208033` 设备已被停用。
    - `208028` 商户已被冻结。

    `400` 的 `code` 见各接口说明；说明里没点名的（参数不合法、操作太频繁等）按 `message` 处理即可。失败响应可能另带 `context`，内容与登记该码的码表所写相同。

    权限按商户后台的权限点判，不看角色，各接口标在 `x-required-privilege`；员工可以同时持有多个角色，权限取并集，Owner 拥有全部权限。标 `session` 的接口只要求已登录。预设角色里的店长、收银员都有收款、查单与核销所需的权限。权限不足属于业务性拒绝，返回 `400`，`message` 写明需要商户后台的哪项权限。

    ## 找回密码

    POS 上不承接找回密码。现网版本的找回密码入口（`/api/v1.0/app/device/forget/verify` 与找回流程其余各步）不再受理，回 HTTP `400`、`code` 为 `208037`、顶层 `message` 为固定的双语提示「暂不支持在 POS / App 上重置密码，请联系 Owner 在商户后台重置 / Password reset is not available on POS / App, please ask your Owner to reset it in the Merchant Portal」。

    ## 仅查看状态

    商户被设为仅查看时，除登录与登记本机外，改状态的请求返回 `400`、`code` 为 `208035`；查询照常。

    ## 调用时序

    各接口的调用先后与失败时端的表现，见调用时序《POS 终端》。
servers:
  - url: /api/v1.0
    description: 现网 POS 接口前缀（原生端发往 pay 域名，键盘机发往 retailapi 域名，路径相同）
security:
  - merchantId: []
    deviceId: []
    deviceType: []
    globalSign: []
tags:
  - name: auth
    x-displayName: 登录与接入
    description: 登录与接入
  - name: products
    x-displayName: 收款设置与核销
    description: 收款设置与核销
  - name: orders
    x-displayName: 收款、退款与报表
    description: 收款、退款与报表
paths:
  /retail_valid/captcha:
    get:
      tags:
        - auth
      operationId: getLoginCaptcha
      summary: 登录页的图形验证码
      description: |
        生成一张 4 位数字的图形验证码，返回图片与对应的 `key`。验证码有效 3 分钟，登录时把 `key` 作为 `captchaKey` 带回。

        `imgurl` 决定 `img` 的格式：不带或为 `false` 时是不带前缀的 URL 安全 Base64；为 `true` 时是可以直接显示的 data URL。
      security: []
      parameters:
        - name: imgurl
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: 为 `true` 时 `img` 返回 data URL；不带时返回不带前缀的 Base64
      responses:
        '200':
          description: 图形验证码
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginCaptcha'
              examples:
                native:
                  summary: 原生端（不带 imgurl）
                  value:
                    key: 7QK2M9XW4RTB6ZPL0HSD
                    img: _9j_4AAQSkZJRgABAgAAAQABAAD_2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0a
                keyboard:
                  summary: 键盘机（imgurl=true）
                  value:
                    key: 7QK2M9XW4RTB6ZPL0HSD
                    img: data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBQNDAsLDBkSEw8UHRofHh0a
      x-error-codes: []
  /retail_valid/sign_in_check:
    post:
      tags:
        - auth
      operationId: signIn
      summary: 账号、密码加图形验证码登录
      description: |
        校验图形验证码与账号密码，通过后返回账号与商户信息，以及用于登记本机的临时登录凭据 `sign_key`（有效 30 分钟）。登录不要求二次验证，账号在商户后台开了验证器的也一样。

        `loginId` 先按用户名精确匹配，匹配不到再按已验证的邮箱，不分大小写。

        登录所在的商户默认是账号的主商户，响应里的 `client_id`、`client` 就是这个商户；主商户被冻结时登录被拒，不改进其他商户。请求带了 `devId`、且该设备已登记在登录者可以访问的某个关联商户名下时，登录就在该商户，`client_id`、`client` 返回它；没带 `devId` 的，在 `registerDevice` 那一步转到该商户。

        下列情形返回 `400`：

        - `204020` 图形验证码不对，或已过期、已用过。
        - `206012` 账号不存在或密码不对，两者不区分。
        - `966001` 连续登录失败次数过多，账号被锁定。默认连续错 5 次锁 15 分钟（可配置），与商户后台网页登录、商户 App 登录共用计数。
        - `208027` 账号已被停用。
        - `208029` 账号的邮箱还没有验证。
        - `208028` 账号的主商户已被冻结。
        - `208033` 带了 `devId`，而这台设备已被停用。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              loginId: cashier01
              password: Str0ng!Pass
              verifyCode: '4821'
              captchaKey: 7QK2M9XW4RTB6ZPL0HSD
              devId: '000231006182031482731'
      responses:
        '200':
          description: 登录成功，返回账号与商户信息（裸 JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
              example:
                sign_key: R8T2K5M1X9QW3ZP7BH4D
                client_id: 23
                client_moniker: PINE
                role: 3
                display_name: Amy
                terminal_id: P210183A00231
                dev_type: sunmi
                client:
                  short_name: Pine Street Cafe
                  business_hours: 09:00:00-14:00:00,17:00:00-21:00:00
                  retail_surcharge: false
                  enable_refund_auth: false
                  enable_refund_password: true
                  address: 1288 Pine Street
                  suburb: Vancouver
                  state: BC
                  postcode: V6H 3R1
                  company_phone: '6045550123'
        '400':
          $ref: '#/components/responses/Rejected'
      x-error-codes:
        - 204020
        - 206012
        - 208027
        - 208028
        - 208029
        - 208033
        - 966001
  /retail_valid/devices/{devType}/register:
    post:
      tags:
        - auth
      operationId: registerDevice
      summary: 登录后按终端序列号登记本机，取得设备凭据
      description: |
        凭 `signIn` 返回的 `sign_key` 登记这台终端，返回 `dev_id` 与设备密钥 `auth_code`。同一商户下同一序列号、同一终端类别再次登记时，`dev_id` 不变，设备密钥换新、旧的作废，设备上原来的登录随之失效。`sign_key` 在有效期内可以重复用于登记。

        登记到哪个商户：这台终端（按序列号）已登记在登录者可以访问的某个关联商户名下时，以该商户为当前商户；否则登记到登录所在的商户名下。响应里的 `client_id` 就是设备所属的商户。一台终端只属于一个商户，已登记在其他商户名下的，要原商户在商户后台解绑后才能登记到新商户。

        请求体是一段 Base64 文本，由下面这份 JSON 加密而来：

        - `client_device_id`：终端序列号。
        - `sign_key`：`signIn` 返回的临时登录凭据。

        加密方案按端分两种，密钥由服务端按 `devType` 选取：

        | 方案 | 用它的端 | 算法 |
        |---|---|---|
        | A | 原生端（`clover`、`sunmi`、`poynt`、`pax`、`ingenico_android`、`cashier_pos`） | AES-128，ECB 模式，PKCS5 填充，密文为标准 Base64 |
        | B | 键盘机（`ingenico`） | AES-128，CBC 模式，固定 IV，明文用零字节补齐到块长，密文为标准 Base64 |

        下列情形返回 `400`：

        - `206016` `devType` 不是受支持的终端类别。
        - `206014` `sign_key` 无效或已过期，须重新登录。
        - `108014` 设备已登记在其他商户名下（不是登录者可以访问的商户）。
        - `108015` 这台设备已被停用。
        - `108018` 上报的终端序列号不能用作设备标识（为空，或是运行环境返回的固定占位值）。
        - `208028` 商户已被冻结。
        - 请求体解不开，或解开后缺 `client_device_id`、`sign_key`。
      security: []
      parameters:
        - name: devType
          in: path
          required: true
          schema:
            type: string
            enum:
              - clover
              - sunmi
              - poynt
              - pax
              - ingenico
              - ingenico_android
              - cashier_pos
          description: 终端类别。原生端按硬件发 `clover`、`sunmi`、`poynt`、`pax`、`ingenico_android`、`cashier_pos`，键盘机发 `ingenico`
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: 加密后的 Base64 文本，明文与加密方案见接口说明
            example: 0pV3kQ8mX1cZr7Yt5uJb2w9sHn4eLd6fGa0iKo3MqTxWvBzCyEAjRlNhUgDSFPI1o7u2k5s8e9w4x0y6z3ABCQ==
      responses:
        '200':
          description: 登记成功，返回设备凭据（裸 JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegistration'
              example:
                dev_id: '000231006182031482731'
                auth_code: q7Wm2Zx9Kc4Lp8Rt1Vb6Nh3Jd5Fg0SyA
                client_id: 23
                client_dev_id: P210183A00231
                client_type: sunmi
        '400':
          $ref: '#/components/responses/Rejected'
      x-error-codes:
        - 108014
        - 108015
        - 108018
        - 206014
        - 206016
        - 208028
  /retail/app/current_user:
    get:
      tags:
        - auth
      operationId: getCurrentUser
      x-required-privilege: session
      summary: 取当前登录账号与商户配置
      description: 返回这台设备当前登录的账号、所在商户的配置，以及本机的终端号、终端类别与设备名。没有参数。
      responses:
        '200':
          description: 当前账号与商户配置（裸 JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              example:
                client_id: 23
                client_moniker: PINE
                role: 3
                display_name: Amy
                terminal_id: P210183A00231
                dev_type: sunmi
                dev_name: Front Counter
                tip_config: 10,15,20
                client:
                  short_name: Pine Street Cafe
                  business_hours: 09:00:00-14:00:00,17:00:00-21:00:00
                  retail_surcharge: false
                  enable_refund_auth: false
                  enable_refund_password: true
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
  /retail/app/retail_view:
    get:
      tags:
        - auth
      operationId: getViewOnlyStatus
      x-required-privilege: session
      summary: 查商户是否处于仅查看状态（只能读、不能改）
      description: 返回一个布尔值，响应体就是 `true` 或 `false` 本身。`true` 表示商户被设为仅查看：终端只能查，除登录与登记本机外，改状态的请求（收款、退款、释放预授权、核销、改设置等）都会被拒绝。没有参数。
      responses:
        '200':
          description: 是否仅查看（裸 JSON 布尔值）
          content:
            application/json:
              schema:
                type: boolean
              example: false
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
  /retail/app/trade/tip_config:
    get:
      tags:
        - products
      operationId: getTipConfig
      x-required-privilege: session
      summary: 读小费开关与预设档位
      description: |
        返回商户的小费设置：是否开启小费，以及三个预设档位。这份设置对整个商户生效，与商户后台、商户 App 里设置的是同一份。没有参数。

        商户没有设置过时，`enable_tip` 为 `false`，`tip_preset_value` 为平台默认档位。
      responses:
        '200':
          description: 小费设置（裸 JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipConfig'
              example:
                enable_tip: true
                tip_preset_value: 10,15,20
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
  /retail/app/modify/tip_config:
    put:
      tags:
        - products
      operationId: updateTipConfig
      x-required-privilege: products:checkout:edit
      summary: 改小费开关与预设档位（对整个商户生效）
      description: |
        改商户的小费设置，返回改后的设置。这份设置对整个商户生效，与商户后台、商户 App 里设置的是同一份。收款时带的小费金额不按这份设置校验。不带 `tip_preset_value` 时只改开关、档位不变。

        下列情形返回 `400`：

        - `208035` 商户处于仅查看状态，不能改设置。
        - `tip_preset_value` 不是三个 0 到 30 之间的整数（用半角逗号分隔）。
        - 当前账号没有改收款设置的权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTipConfigRequest'
            example:
              enable_tip: true
              tip_preset_value: 10,15,18
      responses:
        '200':
          description: 改后的小费设置（裸 JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipConfig'
              example:
                enable_tip: true
                tip_preset_value: 10,15,18
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 208035
  /retail/app/modify/retail_surcharge:
    put:
      tags:
        - products
      operationId: setCustomerSurcharge
      x-required-privilege: products:checkout:edit
      summary: 上报「顾客承担手续费」开关（收下不改配置）
      description: |
        收下请求后按成功返回，不改任何配置；商户的顾客承担手续费开关在商户后台与商户 App 里设置。响应与 `getCurrentUser` 相同，其中 `client.retail_surcharge` 是商户当前的顾客承担手续费开关。

        下列情形返回 `400`：

        - `208035` 商户处于仅查看状态，不能改设置。
        - 当前账号没有改收款设置的权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerSurchargeRequest'
            example:
              retail_surcharge: true
      responses:
        '200':
          description: 当前账号与商户配置（裸 JSON），与 `getCurrentUser` 相同
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUser'
              example:
                client_id: 23
                client_moniker: PINE
                role: 1
                display_name: Amy
                terminal_id: P210183A00231
                dev_type: sunmi
                dev_name: Front Counter
                tip_config: 10,15,20
                client:
                  short_name: Pine Street Cafe
                  business_hours: 09:00:00-14:00:00,17:00:00-21:00:00
                  retail_surcharge: false
                  enable_refund_auth: false
                  enable_refund_password: true
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 208035
  /vouchers/{voucherNo}:
    get:
      tags:
        - products
      operationId: getVoucher
      x-required-privilege: products:link:view
      summary: 按券号查券，核销前看单，也用于核销记录的详情
      description: |
        按券号查这张券所属的销售单，返回券视图：卖的是什么、顾客付了多少、现在能不能核销。不带 PIN，PIN 只在核销时校验。

        - 券码的内容是 `{"voucherNo":"…","pin":"…"}`。
        - 只认卖出这张券的商户，即当前商户；子商户卖出的券在这里查不到。
        - 礼卡只有兑换券能核销，一张兑换券承载主卡与赠卡两个金额。
