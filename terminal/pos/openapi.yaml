  /retail/surcharge_precalculate:
    get:
      tags:
        - orders
      operationId: precalculateSurcharge
      x-required-privilege: session
      summary: 按金额试算各支付方式的手续费
      description: |
        按收款金额与币种，试算顾客用微信、支付宝付款时的应付总额与顾客承担的手续费。

        响应的键是支付方式品牌，只有 `Wechat`、`Alipay` 两个，只对商户已开通的店内支付方式给结果。每个品牌给出人民币估算，供收银员向顾客报人民币价：`currency` 为 `CNY` 时就是应付总额与手续费的原值；不是 `CNY` 时按该支付方式通道的参考汇率折成人民币，各项各自折算、四舍五入到分。`cny_tax` 恒为 `"0.00"`。金额单位是元。

        顾客承担的手续费按商户的「顾客承担手续费」开关与运营设定的适用范围算：商户没开这个开关，或该支付方式不在适用范围内时，`cny_surcharge` 为 `"0.00"`。

        某个品牌取不到汇率或算不出时不出现该键，都算不出时返回空对象。

        下列情形返回 `400`：

        - `price` 不是正数。
        - `currency` 不是商户的结算币种或 `CNY`。
      parameters:
        - name: price
          in: query
          required: true
          schema:
            type: string
          description: 收款金额，单位是元，十进制数，例如 `12.50`
        - name: currency
          in: query
          required: true
          schema:
            type: string
          description: 收款币种，只收商户的结算币种或 `CNY`
      responses:
        '200':
          description: 各支付方式的试算结果（裸 JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SurchargeEstimates'
              example:
                Wechat:
                  cny_total: '12.81'
                  cny_surcharge: '0.31'
                  cny_tax: '0.00'
                Alipay:
                  cny_total: '12.78'
                  cny_surcharge: '0.28'
                  cny_tax: '0.00'
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes: []
  /retail/micropay:
    post:
      tags:
        - orders
      operationId: createMicropayOrder
      x-required-privilege: terminal:payment:create
      summary: 扫顾客的付款码收款
      description: |
        收银员扫到顾客的付款码后调用。服务端认出付款码属于哪个支付方式品牌，建订单，再向渠道下单，等到渠道的首次应答后返回订单号与当时的订单状态；渠道迟迟不应答时同样返回订单号。最终结果以 `getOrder` 查到的为准。下单后默认 60 秒内（可配置）没有结果的，订单关闭（`status` 为 `3`）。

        商户开启了顾客承担手续费、且这个支付方式在运营设定的适用范围内时，另向顾客加收手续费，金额见 `getOrder` 的 `serviceFee`。

        渠道拒绝这笔付款（付款码已失效、付款被拒、渠道暂时不可用）时，订单已经建立并记为失败：本接口仍返回 `200` 与 `order_id`，`getOrder` 查到的 `status` 为 `4`，失败原因在其 `error_message`。

        同一台设备用同一个付款码、同样的金额、币种、小费与预授权标记的重复请求视为同一笔，返回第一次的结果；首次请求还在处理时到达的重复请求，等首次结果出来后返回同一结果；小费按四舍五入后的值比对。

        `preauth` 为 `true` 时按预授权收款：付款成功后资金挂起，在 POS 上释放；与支付方式品牌无关。

        下列情形返回 `400`：

        - `104500` 认不出付款码属于哪个支付方式。
        - `108502` 认出了支付方式，但商户没有开通。
        - `108104` 这笔收款不予受理；金额不予受理时落一笔不予受理（`1`）的订单，响应仍是 `400`。
        - `108105` 算不出这笔收款的手续费。
        - `208035` 商户处于仅查看状态，不能收款。
        - `currency` 不是商户的结算币种或 `CNY`。
        - `amount` 不是正数。
        - 当前账号没有在终端收款的权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MicropayOrderRequest'
            example:
              amount: 1250
              currency: CAD
              authCode: '134567890123456789'
              tip: 150
              preauth: false
              remark: Table 5
              title: Platform Retail Order
              timezone: America/Vancouver
              customerrate: false
      responses:
        '200':
          description: 已下单，返回订单号与下单返回时的订单状态（裸 JSON）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MicropayOrderResult'
              example:
                order_id: P100240001
                status: 5
        '400':
          $ref: '#/components/responses/Rejected'
        '401':
          $ref: '#/components/responses/ReloginRequired'
      x-error-codes:
        - 104500
        - 108104
        - 108105
        - 108502
        - 208035
  /retail/qrcode:
